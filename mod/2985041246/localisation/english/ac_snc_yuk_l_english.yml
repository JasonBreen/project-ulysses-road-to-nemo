 YUK_snc_scientific_custody_protocol_desc:0 "Request a fresh technical-cooperation period through the existing selected-lane service. Start with domestic methods that the receiving office can actually examine. The work may use an established cooperative record where relevant, but does not depend on a new foreign acceptance. The corresponding funded period must genuinely finish after this request. Its return will identify the method, the authority that received it and the question it was allowed to answer. An earlier successful examination cannot certify the present chain merely because its completed stamp is easier to find than the people currently expected to sign."
