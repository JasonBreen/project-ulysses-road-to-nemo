 YUK_snp_industrial_orders_policy_context_1:0 "The standing policy is civil workshop continuity. Its continuing opportunity cost remains in the national schedule."
 YUK_snp_industrial_orders_policy_context_2:0 "The standing policy is defence order reserve. Its continuing opportunity cost remains in the national schedule."
 ac_snp.19.t:0 "The Repair Window on the Order Sheet"
 ac_snp.19.d:0 "A workshop planner has crossed out a productive shift and written maintenance in the margin. The order representative asks why a trained crew should stand aside while an important return is waiting. The planner replies that the crew is not idle; it is trying to keep the next reservation credible. A civil commission member proposes protecting the workshop's ordinary receiving and training windows. The command representative proposes a narrower defence-order reserve, with one office responsible for recording every displaced job. Neither option gives the workshop another machine or a second skilled crew. The disagreement concerns who may promise the hours already available, and who must answer when those hours are used elsewhere.\n\n[YUK_snp_industrial_orders_policy_context]"
 ac_snp.19.a:0 "Protect ordinary workshop continuity and its receiving windows."
 ac_snp.19.a_effect_tt:0 "Move up to five existing allocation points toward civil receiving offices, protecting active reservations. The two shares still total one hundred."
 ac_snp.19.b:0 "Reserve the defence-order share and keep the displaced work visible."
 ac_snp.19.b_effect_tt:0 "Move up to five existing allocation points toward command support, protecting active reservations. The two shares still total one hundred."
