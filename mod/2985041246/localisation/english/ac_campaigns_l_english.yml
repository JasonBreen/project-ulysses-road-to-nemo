 ac_camp.30.t:0 "The harbor in the photograph"
 ac_camp.30.desc:0 "The photograph had been enlarged until the paper showed a grain of its own. The targeting officer held it against the lamp while the naval liaison pointed out the shapes that mattered to his service. A ship was a hull in one report, a threat in another, and a crew in the letters that would arrive much later.\n\nThe operation had given the command a completed maritime targeting return. It had not supplied a license to describe every enemy vessel in the harbor as sunk. The naval war would provide that accounting through losses that could actually be observed. For now the staff could say which preparations had been made and what support was available for the next engagement.\n\nOne of the younger officers asked whether the photograph would be released. The liaison looked at the edges. There were streets outside the naval facilities, buildings whose roofs had no significance to the briefing, and a road that continued beyond the frame. He asked for a second copy with the targeting marks removed.\n\nAt the evening conference, the completed operation was entered in the campaign return. Its temporary advantage would have to be used while the crews and information remained current. Across the table, the representative from a partner government asked what had been spent from the receiving reserve to support it.\n\nThe answer took longer than the announcement. It included shifts, aircraft and commitments made by offices that would receive little mention in the history of the harbor. The liaison left the clean photograph on the table until the meeting ended."
 ac_camp.30.a:0 "Keep this account."
 ac_camp.30.z:0 "Close this old message."
