 NPT_camp_0_register:0 "The last receiving field"
 NPT_camp_0_register_desc:0 "The last receiving field. Open the campaign lane and its preparation record.\n\nThe arriving aircraft are only the visible part of the commitment. Someone has to receive their crews, clear a hangar, keep the communications staff awake, and tell the neighborhood that another building has been requisitioned. A dispersed receiving plan protects capacity by making the headquarters less convenient. A fortified headquarters offers command a firmer center while concentrating its demands. The branch asks for an actual allied acceptance before it records a hosting commitment. The island's government retains its own responsibility for the people already living beneath the flight path."
