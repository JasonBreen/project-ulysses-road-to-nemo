 ac_fsb_receiving_training:0 "A Received Replacement Batch"
 ac_fsb_receiving_training_desc:0 "Actual equipment has arrived. A short receiving and familiarisation interval follows; no faction, war outcome or further stock is granted."
 ac_fsb_receiving_inspection:0 "A Joint Receiving Inspection"
 ac_fsb_receiving_inspection_desc:0 "Both authorities consented to a limited inspection, and an actual stock-backed delivery followed. The temporary staff burden remains visible."
 ac_fsb_warrant_geb_valid_tt:0 "FATO and Gebet are both present, independent and not capitulated, retain their established identities, and are not at war with one another."
 FAT_fsb_request_geb_infantry:0 "Request consent: Infantry replacements to Gebet"
 FAT_fsb_request_geb_infantry_desc:0 "Offer 300 infantry equipment from real stock, not an immediate donation. Cost: 15 political power, 1 institutional capacity and the public programme fee. The receiver must consent by decision within 30 days (90 with the consent clause). One open slot is occupied; 180-day request cooldown. Both authorities must remain eligible and independent. No faction or military access is created."
