 ### IDEAS ###
 
 UST_militia_army: "Militia Army"
 UST_militia_army_desc: "With Ustio's independence extremely recent, our army is rather disorganized and mostly consists of reorganized paramilitaries and militias. While this does mean the troops we have are extremely used to our local terrain and are well-trained, it makes organizing them difficult, as well as they have little to no experience with heavier, conventional equipment."
