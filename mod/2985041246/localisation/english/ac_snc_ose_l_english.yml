 ac_snc_ose_message_10.t:0 "Read the Unkept Promise: The Hearing"
 ac_snc_ose_message_10.d:0 "The clerk has brought the telephone log. Three calls concern the same assurance, and each caller believes a different condition applies. The defence liaison starts to explain that the wording was clear at the time. The clerk turns the log around. 'Clear to which receiving office?' Nobody laughs. A civil representative offers to read the limit aloud before the next promise is sent; the liaison asks that technical reservations remain attached to the version his staff must deliver. The chair leaves both suggestions open. Somebody will have to choose which account the government is prepared to defend."
 ac_snc_ose_message_10_public_spirit:0 "Place the account before the public."
 ac_snc_ose_message_10_public_spirit_desc:0 "The received account changes how the office answers for this work over the next ninety days. The selected benefit carries the continuing cost shown here."
