 ac_release_TER_develop_civilian:0 "Develop a civilian workshop"
 ac_release_TER_develop_civilian_desc:0 "Fund one additional civilian factory in the current controlled core capital. Costs 100 political power and 0.02b in full economy mode or 20 FU in legacy mode; fiscal-disabled campaigns pay the political cost. Takes 90 days. One successful project of each type per country. Loss of control, annexation, capitulation or lost slots can interrupt it; spent funds are not refunded. No cores, population, deposits or financial balances are granted."
 ac_release_TER_cancel_civilian:0 "Cancel develop a civilian workshop"
 ac_release_TER_cancel_civilian_desc:0 "Stop this funded project. Costs already spent are not refunded. A 30-day cooldown applies before another development project."
 ac_release_TER_develop_military:0 "Develop a maintenance arsenal"
 ac_release_TER_develop_military_desc:0 "Fund one additional military factory in the current controlled core capital. Costs 100 political power and 0.02b in full economy mode or 20 FU in legacy mode; fiscal-disabled campaigns pay the political cost. Takes 90 days. One successful project of each type per country. Loss of control, annexation, capitulation or lost slots can interrupt it; spent funds are not refunded. No cores, population, deposits or financial balances are granted."
 ac_release_TER_cancel_military:0 "Cancel develop a maintenance arsenal"
 ac_release_TER_cancel_military_desc:0 "Stop this funded project. Costs already spent are not refunded. A 30-day cooldown applies before another development project."
 ac_release_TER_maintenance:0 "Release administration and maintenance"
 ac_release_TER_maintenance_desc:0 "Current capacity determines what this government can support. Baseline transport stock is a once-only future-release grant:2 trains,12 trucks and6 convoys; existing saves receive none. Paid projects do not change territorial settlements or cores. Fuel imports, reinforcement deficits and manual production rotation remain visible responsibilities. AWW and non-core treaty governments retain their inherited recruitment and capacity limits."
 ac_release_TER_research_name:0 "Domestic maintenance priorities"
 ac_release_TER_research_desc:0 "Prioritize affordable industry, infantry, technical support and communications. Maintain existing formations; future recruitment still needs real manpower and equipment. Small governments should rotate limited air and naval production manually."
 ac_release_maintenance_requirements_tt:0 "Requires an active administration, owned capital and 25 political power."
 ac_release_maintenance_effect_tt:0 "Spend 25 political power to prepare current maintenance templates and technical support. No historical stock or army grant is replayed."
 ac_release_certify_requirements_tt:0 "Requires an active maintenance administration and 5 political power. This recipe must not already be certified for the current technical configuration."
 ac_release_certify_effect_tt:0 "Spend 5 political power to certify this recipe for manual production rotation; no line, equipment or personnel is granted."
 ac_release_queue_requirements_tt:0 "Use recipe certification and the Production screen to assign or rotate factories and dockyards."
 ac_release_queue_effect_tt:0 "This retired action charges nothing and changes no production line, equipment, resources or historical receipt."
 ac_release_develop_requirements_tt:0 "Requires 100 political power, a controlled core capital with a free slot, no active project/cooldown and the current fiscal fee where enabled."
 ac_release_develop_effect_tt:0 "Pay 100 political power and 0.02b in full mode or 20 FU in legacy mode. Fund the selected 90-day development project once; fiscal-disabled campaigns retain the political/time/territory costs."
 ac_release_network_requirements_tt:0 "Requires 50 political power, a documented controlled footprint with a missing connection, no active project/cooldown and the fiscal fee where enabled."
 ac_release_network_effect_tt:0 "Pay 50 political power and 0.02b in full mode or 20 FU in legacy mode. Fund 90-day owned domestic connections; existing rail levels and receiving ports are retained."
 ac_release_cancel_requirements_tt:0 "Requires the selected project to be active."
 ac_release_cancel_effect_tt:0 "Cancel without refunding spent costs. A 30-day development cooldown applies."
 ac_release_manual_production_tt:0 "Certify a recipe, then assign or rotate factories and dockyards in the Production screen. Check materials, imports and fuel before manufacturing. This action charges nothing and changes no existing line or historical receipt."
