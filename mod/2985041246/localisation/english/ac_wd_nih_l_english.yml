 ac_wd_nih.1.t:0 "Questions from the Throne Hall"
 ac_wd_nih.1.d:0 "The crown office publishes its inquiry on the first working morning of the year, and by noon every newspaper in the capital has printed the questions in full. They are short: who should hold the ministries, who should choose them, and what the throne should keep for itself. They are also the first questions the court has put to the country in living memory. Nihon has a throne, eight districts and a large merchant fleet, but the party that once spoke for the crown has no following left to count.\n\nThe answers are already known in outline. The national movement claims half the country and holds the squares of the two plant towns. The shipping houses, refinery companies and harbour boards hold most of the rest, together with the district commissioners and the clerks who keep the islands running. A handful of democratic and socialist circles meet in rented rooms and ask for a vote that nobody expects to be granted.\n\nThe court must now decide how the inquiry will be heard. An open session lets every camp speak in the throne hall with the press watching, and risks turning the hall into a stage. Keeping the inquiry inside the court protects the throne's dignity and its freedom to choose. Sending the questions out to the districts first would slow everything down, yet it would show that the outer islands count.\n\nProvisional gameplay: history/countries/NIH - Nihon.txt set_politics and set_popularities; every response is gameplay."
 ac_wd_nih.1.a:0 "Hear every camp in open session."
 ac_wd_nih.1.b:0 "Keep the inquiry behind the court doors."
 ac_wd_nih.1.c:0 "Send the questions to the districts first."
 ac_wd_nih.2.t:0 "The Movement Answers in the Squares"
 ac_wd_nih.2.d:0 "Two weeks after the open session begins, the national movement gives its answer outside the throne hall instead of inside it. Columns march from the works gates of District E and District H to their logistics centres, carrying banners that ask for the ministries in the throne's name. The marches are disciplined and loud, and they disperse at dusk without a single broken window, which worries the commissioners more than a riot would have.\n\nThe shipping houses reply with a statement printed in every capital newspaper and signed by owners, refinery directors and harbour board chairs, warning that disorder on the quays will drive charterers to foreign flags. The democratic circles hold a meeting in a rented hall that the police count at four hundred people. Every camp claims that the marches prove its own point, and the throne hall fills with petitions by the end of the week.\n\nThe court must respond before the next sitting. It can invite the movement's speakers to address the throne hall directly and so bring the argument indoors. It can ask the commissioners to license marches and keep them away from the quays, which the movement will call censorship. Or it can say nothing, let the session continue as planned and hope the squares tire before the hall does.\n\nProvisional gameplay: follow-up to the throne inquiry; every response is gameplay."
 ac_wd_nih.2.a:0 "Invite the movement into the hall."
 ac_wd_nih.2.b:0 "License the marches away from the quays."
 ac_wd_nih.2.c:0 "Let the session run its course."
 ac_wd_nih.3.t:0 "What the Survey Ship Found"
 ac_wd_nih.3.d:0 "The survey ship returns to the capital after a season among the outer districts, its hold full of soil samples, harbour soundings and petitions. The engineers' report is blunt. The main island has two rail lines, three logistics centres and every plant in the country. The outer districts have anchorages and very little else, and District B, which shares the main island with the capital, has no road at all.\n\nDistrict D turns out to be ten separate islets, each with its own landing, its own well and its own quarrel with the next. District A has a single anchorage that silts up every wet season. District G is two plain provinces that trade more with the Sotoan coast than with the capital, and Sotoa still maintains its claim to them. The northern outlier sees a ship from the capital so rarely that its commissioner keeps the sailing dates from memory.\n\nThe report ends with a choice of emphasis. The engineers would begin with roads and jetties where people already live. The commissioners would begin with a regular ferry, arguing that a road nobody can reach is worth nothing. The treasury would begin with whatever is cheapest, and asks that the report stay unpublished until the money is found.\n\nProvisional gameplay: state histories 84, 130, 239, 431 and 524; the Sotoan claim is add_claim_by = SOA in 524; no border effect."
 ac_wd_nih.3.a:0 "Publish the report in every district."
 ac_wd_nih.3.b:0 "Give it to the engineers and the treasury."
 ac_wd_nih_3_b:0 "Give it to the engineers and the treasury."
 ac_wd_nih.4.t:0 "Hulls Nobody Had Counted"
 ac_wd_nih.4.d:0 "The harbour boards deliver the merchant register after five months, bound in three volumes. Two hundred and forty-eight hulls fly the island flag. Some are modern tankers on long charters abroad; many are coasters that have carried the same cargoes between the same districts for thirty years. A few exist only on paper, kept on the register for the subsidies their owners still collect every quarter.\n\nThe register shows how completely the islands depend on their fleet. Every barrel of crude exported, every sack of grain sent to the outer districts and every crate of parts shipped to the plant towns travels on one of these hulls. If the fleet stopped for a month the country would stop with it. The Maritime Service, with five escorts and two submarines, could protect only a handful of them at any one time.\n\nThe shipowners want the register kept confidential, since it shows who has been collecting subsidies for hulls that no longer sail. The Maritime Service wants a copy for its war plans. The treasury wants every paper hull struck off at once and the money recovered. The ministry must decide what the register is for before deciding who may read it.\n\nProvisional gameplay: world-start calibration of 248 convoys and the NIH Maritime Service; every response is gameplay."
 ac_wd_nih.4.a:0 "Strike off the paper hulls and recover the money."
 ac_wd_nih.4.b:0 "Give the Maritime Service a private copy."
 ac_wd_nih.4.c:0 "Publish the register in full."
 ac_wd_nih.5.t:0 "Two Valleys on One Map"
 ac_wd_nih.5.d:0 "The industrial survey arrives as a single large map, and the map tells the story at a glance. Every well, mill and plant in Nihon stands in three districts of the main island. The Capital District holds the largest share beside its yards and fuel silo, while District E and District H each hold three civilian works and two arms works in narrow valleys served by one rail line apiece.\n\nThe plant towns have no ground left to build on. Their valleys are packed with works, housing and spoil heaps, and every expansion means demolishing something else. District B, next door on the same island, is empty jungle and hill without a road. The outer districts have room but no power, no rail and no workforce. Meanwhile the country's oil, steel and light metal leave as raw cargo because the works that could process them have nowhere to stand.\n\nMinisters divide along familiar lines. The shipping houses would rather new works stayed near the ports they serve. The national movement wants new works wherever new workers can be organised. The engineers want the existing plants modernised before anything new is built. They agree only that the map should not be shown to foreign buyers.\n\nProvisional gameplay: state histories 165, 251 and 582 (buildings and resources); every response is gameplay."
 ac_wd_nih.5.a:0 "Pin the map on the cabinet room wall."
 ac_wd_nih_5_a:0 "Pin the map on the cabinet room wall."
 ac_wd_nih.5.b:0 "Show the map to the plant town councils."
 ac_wd_nih.6.t:0 "Seven Ships and Eight Districts"
 ac_wd_nih.6.d:0 "The Maritime Service parades every hull it owns in the capital's naval harbour on a clear morning: five coastal escorts and two coastal submarines, painted, crewed and dressed overall. The crowd on the quay is large and proud. The officers on the reviewing stand are quieter, because they know that seven ships must cover the coasts of eight districts and a merchant fleet of nearly two hundred and fifty hulls.\n\nAfter the parade the service chiefs hand the government a paper. The escorts are sound but old, and their crews are kept at strength only by cancelled leave. The submarines are newer and their officers want more of them. The capital's four slipways are shared with the ferry builders and the shipping houses, so a warship refit waits in the same queue as a coaster with a cracked shaft.\n\nThe paper asks a single question: is the service meant to guard the merchant lanes, or to make the island straits impassable to an intruder? It cannot do both with seven hulls. Until the government answers, the chiefs write, every refit and every recruit is an expense without a purpose, and the best young officers will keep leaving for the merchant bridges that pay twice as much.\n\nProvisional gameplay: mod/2985041246/history/units/NIH_ws_navy.txt; every response is gameplay."
 ac_wd_nih.6.a:0 "Promise an answer within the year."
 ac_wd_nih.6.b:0 "Order a refit schedule first."
 ac_wd_nih_6_b:0 "Order a refit schedule first."
 ac_wd_nih.7.t:0 "A Name in the Wire Copy"
 ac_wd_nih.7.d:0 "The wire copy arrives in the capital on an ordinary evening and is nearly filed with the shipping notices. The International Astronomical Union announces that an asteroid named Ulysses will pass close to the Earth in the coming years, with a chance of impact and great devastation. The night editor of the largest capital newspaper reads it twice, telephones a teacher of astronomy and decides to run it on the front page.\n\nBy morning the story is everywhere. In the plant towns workers ask whether their families should move into the hills. In the outer districts fishermen ask whether the sea will rise. The national movement accuses the government of hiding the truth, while the shipping houses ask whether the insurers already know more. The ministries have no astronomer of their own and no plan for any kind of danger from the sky.\n\nThe government must decide how to speak about something it does not yet understand. It can publish every foreign bulletin in a plain translation and let people judge. It can wait for island experts and say nothing until they report. Or it can announce a commission at once, which reassures many people and promises answers it cannot yet give.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1994 / 12.10 in tools/lore/chronicle.json; the Nihonian response is gameplay."
 ac_wd_nih.7.a:0 "Publish every bulletin in plain words."
 ac_wd_nih.7.b:0 "Wait for island experts."
 ac_wd_nih.7.c:0 "Announce a commission today."
 ac_wd_nih.8.t:0 "The Impact Will Come"
 ac_wd_nih.8.d:0 "The FCU announces to the world that Ulysses will strike the Earth and that it has plans to counter the impact. The statement is calm and technical, and in Nihon it lands like a storm warning without a forecast. Nobody in the capital can say where the fragments will fall, how many there will be, or whether the islands will see anything at all.\n\nWithin days, prices for tinned food, bottled water and fuel cans double in the capital markets. The commissioners of the outer districts send telegrams asking whether ferries will be held in reserve for them. The plant town councils ask whether the works should stop. The shipping houses report that foreign charterers are already suspending long contracts until the danger has passed.\n\nThe government cannot prevent the impact, only decide how the country will prepare for it. Ministers can dig into the hills behind the capital and bring people to shelter, or spread stores and small shelters across every district and accept weaker protection everywhere. Either plan will take years and most of the money the islands can spare. The first decision is how to stop the panic buying in the markets.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1996 / 04.20 in tools/lore/chronicle.json; where fragments fall is never stated."
 ac_wd_nih.8.a:0 "Ration staples until the markets calm."
 ac_wd_nih.8.b:0 "Let prices find their own level."
 ac_wd_nih.9.t:0 "A Night Without Sleep"
 ac_wd_nih.9.d:0 "Ulysses passes through the Roche limit of the Earth and begins to break apart. Over the main island the night is clear, and over the outer districts it is cloudy. Radio stations broadcast foreign reports every quarter hour. Shelter wardens stand at every entrance, store ship crews raise steam in their anchorages, and tide gauge keepers sit beside their instruments with a lamp and a telephone.\n\nThe capital's telephone exchange has never carried so many calls. Families ring relatives in the outer districts, commissioners ring the ministries and the ministries ring the observatory, which can only repeat what the foreign wires say. By dawn the wires carry long lists of places abroad that will need help, and nobody in the capital can yet say what the coming days will bring to the islands themselves.\n\nThe morning brings a choice about what the shelters and stores are for now. Some ministers want them kept full for months in case more fragments arrive. Others want part of the reserve loaded onto hulls for countries that were struck. The commissioners want their wardens thanked by name of district before anything else is decided.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1999 / 07.08 in tools/lore/chronicle.json; no damage in Nihon is claimed."
 ac_wd_nih.9.a:0 "Keep the reserve full at home."
 ac_wd_nih.9.b:0 "Load relief hulls for stricken ports."
 ac_wd_nih.9.c:0 "Thank the wardens in every district."
 ac_wd_nih.10.t:0 "Premiums from the North"
 ac_wd_nih.10.d:0 "The Belkan War breaks out on the far side of the ocean, and Nihon learns of it first from its insurers. Within a week every underwriter that covers island hulls sends a letter adding a war clause to any voyage touching northern waters. Tanker owners on long charters to the north ask whether to turn back. Fuel prices in the capital markets rise before the first newspaper map of the fighting is printed.\n\nNo Nihonian interest is at stake in the war itself. The country has no forces abroad, no alliance with either side and no claim on anything being fought over. But a fleet that earns its living carrying other people's cargo cannot stay out of a war's economy, only choose how to take part in it. Charterers are already offering rates that would have been unthinkable a month ago.\n\nThe ministry must set rules before the owners set their own. It could forbid any cargo for armies at war and accept the loss of the richest charters. It could permit any charter outside declared war zones and tax the profits. Until it decides, the masters at sea are signalling their owners for instructions every night, and the owners are telephoning the ministry every morning.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25 in tools/lore/chronicle.json; Nihon takes no part."
 ac_wd_nih.10.a:0 "Hold every hull in port for a week."
 ac_wd_nih.10.b:0 "Let the owners decide for now."
 ac_wd_nih.11.t:0 "Usean Harbours Go Silent"
 ac_wd_nih.11.d:0 "A coup breaks out across Usea, and for several days the shore radio watch in the capital hears nothing from a string of Usean harbours that normally report every hour. Island hulls in those ports signal that the quays are closed, crews are confined aboard and the local officials have vanished from their offices. Unified Command defeats the rebels in the end, but the islands learn that only from foreign broadcasts.\n\nAt home, the families of crews queue outside the shipping offices of the capital and District E. The shipping houses ask the government to send the Maritime Service to bring their hulls out; the service replies that its escorts would need weeks to arrive and could not enter a harbour without permission from someone in charge. The national movement demands action and does not say what kind.\n\nThe government can do little in Usea itself. It can pay the crews' wages to their families until the hulls return and make the shipowners repay the treasury later. It can send a single escort to wait outside the Usean lanes as a signal of concern. Or it can tell the families the truth: that the crews are safest staying aboard, and that patience is all the islands can offer.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1997 / 05.30 in tools/lore/chronicle.json; no Nihonian role is claimed."
 ac_wd_nih.11.a:0 "Pay the crews from the treasury."
 ac_wd_nih.11.b:0 "Send one escort toward the Usean lanes."
 ac_wd_nih.11.c:0 "Tell the families to wait."
 ac_wd_nih.12.t:0 "The Railgun Quarrel"
 ac_wd_nih.12.d:0 "By the summer of 2003 the quarrel over Stonehenge, the railgun complex in neutral San Salvacion, dominates every foreign broadcast heard in the capital. The crisis desk reads the wires day and night. Shipping agents report that Usean ports are filling with soldiers and emptying of charterers, and that insurers have begun to quote Usean cover by the week instead of by the year.\n\nNihon has no stake in the railguns and no forces anywhere near Usea. It does have a fleet that carries fuel, grain and parts to Usean ports, a refinery that sells to Usean buyers and an air staff that has studied the battery's reach since it was built. If the quarrel becomes a war, all three will be drawn into it whatever the government wishes.\n\nBefore anything is decided in Usea, the government can prepare its own people. It can recall the island hulls from Usean waters now, at the cost of their charters. It can warn the owners and leave the decision to them. Or it can quietly fill the fuel silo and the shelters, which costs money and says nothing to anyone abroad or at home.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2003 / SUMMER in tools/lore/chronicle.json; whether war follows is read from the mod flags."
 ac_wd_nih.12.a:0 "Recall the hulls from Usean waters."
 ac_wd_nih.12.b:0 "Warn the owners and leave it to them."
 ac_wd_nih.12.c:0 "Fill the silo and say nothing."
 NIH_wd_crown_cabinet_office:0 "Crown Cabinet of the Island Chamber"
 NIH_wd_crown_cabinet_office_desc:0 "A cabinet formed from the majority of an elected island chamber, governing collectively in the name of the throne, which signs on ministerial advice. Provisional gameplay office with no named holder."
 NIH_wd_harbour_directory_office:0 "Directory of the Shipping Houses"
 NIH_wd_harbour_directory_office_desc:0 "A directory of shipowners, refinery directors and harbour board chairs, governing collectively under a charter signed by the throne while elections stay suspended. Provisional gameplay office with no named holder."
 NIH_wd_movement_committee_office:0 "Standing Committee of the National Movement"
 NIH_wd_movement_committee_office_desc:0 "The standing committee of the national movement, holding the seals of government and ruling collectively by decree with other parties suspended. Provisional gameplay office with no named holder."
 ac_wd_nih_decisions:0 "Nihon: National Measures"
 ac_wd_nih_decisions_desc:0 "Measures from the national programme of Nihon. Provisional gameplay unless a source ledger row says otherwise."
 NIH_wd_wet_round_decision:0 "Sail the Wet-Season Round"
 NIH_wd_wet_round_decision_desc:0 "Each outer-district call is kept even in the worst weather, with an escort sailing in company. It can be ordered again after a year, and every round burns fuel the treasury would rather sell."
 NIH_wd_b_hill_road_decision:0 "Pave the District B Hill Road"
 NIH_wd_b_hill_road_decision_desc:0 "Engineers pave the graded hill road into District B and bridge its worst river crossing. Done once; the road gangs then return to the ministry."
 NIH_wd_north_works_decision:0 "A Works Shed for the North"
 NIH_wd_north_works_decision_desc:0 "The treasury pays for a repair and assembly works beside the northern anchorage. It is paid for once, and every machine must travel days by sea."
 NIH_wd_shelter_bells_decision:0 "Ring the Shelter Bells"
 NIH_wd_shelter_bells_decision_desc:0 "Wardens ring the bells at dawn and every town walks to its shelter with a stopwatch running. It may be repeated after twelve months; the plants lose a shift each time."
 NIH_wd_register_audit_decision:0 "Audit the Hull Register"
 NIH_wd_register_audit_decision_desc:0 "The harbour boards check every entry on the merchant register and strike off hulls that no longer sail. It can be ordered again a year later, and shipowners resent every visit."
 NIH_wd_sotoan_harbour_talks_decision:0 "Invite Sotoan Harbour Officials"
 NIH_wd_sotoan_harbour_talks_decision_desc:0 "Harbour officials from Sotoa are invited to District G so that mooring and fishing disputes can be settled by telephone. It can be done only once, and no claim or border changes."
