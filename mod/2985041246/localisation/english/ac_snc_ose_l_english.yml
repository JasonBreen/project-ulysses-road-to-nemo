 ac_snc_ose_message_1.t:0 "The Promise Outside the Room"
 ac_snc_ose_message_1.d:0 "The hearing has ended, but a transport clerk is still waiting outside with a cancelled receiving slot. Inside, the committee has agreed that every commitment must have an accountable office. Outside, somebody has to telephone a workshop and explain why its people will be waiting another week. The clerk is invited back. She places her schedule beside the polished final return and asks which one the government intends to keep. A defence liaison draws up a chair rather than answering for her. The new review will begin with the promise that did not fit inside the old account."
 ac_snc_ose_message_1_public_spirit:0 "Place the account before the public."
 ac_snc_ose_message_1_public_spirit_desc:0 "The received account changes how the office answers for this work over the next ninety days. The selected benefit carries the continuing cost shown here."
 ac_snc_ose_message_1_reply_0:0 "Place the account before the public."
 ac_snc_ose_message_1_reply_0_tt:0 "Retain the public account as a persistent choice. For ninety days, apply the shown benefit and its distinct continuing cost."
 ac_snc_ose_message_1_staff_spirit:0 "Keep a signed professional account."
 ac_snc_ose_message_1_staff_spirit_desc:0 "The received account changes how the office answers for this work over the next ninety days. The selected benefit carries the continuing cost shown here."
 ac_snc_ose_message_1_reply_1:0 "Keep a signed professional account."
 ac_snc_ose_message_1_reply_1_tt:0 "Retain the staff account as a persistent choice. For ninety days, apply the shown benefit and its distinct continuing cost."
 ac_snc_ose_message_1_expired:0 "Keep the unanswered account in the file."
 OSE_snc_guarantor_limits_civil_spirit:0 "Published receiving limit"
 OSE_snc_guarantor_limits_civil_spirit_desc:0 "The civil representative wants the limit printed beside the promise, where a mayor or workshop steward can find it without knowing somebody in the ministry. Publication will invite arguments that a quiet qualification might have avoided. It will also make it harder for an urgent military request to become a permanent exception by moving between offices. Accept that political burden and give the receiving services a public reference. Their protected time will be defended in the open, including when the government would prefer to discuss only the reassurance it has offered abroad."
 OSE_snc_guarantor_limits_civil_spirit_settled:0 "Published receiving limit: Standing Review"
 OSE_snc_guarantor_limits_civil_spirit_settled_desc:0 "The revised guarantee has an edge that can be found without opening a second folder. It identifies the authority, the receiving responsibility, and the procedure for saying that the undertaking has reached its limit. The committee keeps its selected public or protected account rather than pretending both were adopted. The completed review improves the standing practice, while the accepted political or civilian burden remains. A foreign refusal can still leave this a useful national settlement: the government has learned how to make a smaller promise credible before it asks anybody else to trust a larger one."
 OSE_snc_guarantor_limits_protected_spirit:0 "Protected undertaking"
 OSE_snc_guarantor_limits_protected_spirit_desc:0 "The defence liaison asks for a different kind of honesty: an undertaking small enough to meet, with staff who cannot be reassigned when another department discovers a pressing need. Civil services will carry the resulting delay. The liaison agrees that their names belong in the same account, rather than a separate explanation nobody abroad will read. Protect the professional schedule while recording what it displaces. A dependable commitment can strengthen national readiness, but it must not draw its credibility from the convenient disappearance of the people waiting outside its boundary."
 OSE_snc_guarantor_limits_protected_spirit_settled:0 "Protected undertaking: Standing Review"
 OSE_snc_guarantor_limits_protected_spirit_settled_desc:0 "The revised guarantee has an edge that can be found without opening a second folder. It identifies the authority, the receiving responsibility, and the procedure for saying that the undertaking has reached its limit. The committee keeps its selected public or protected account rather than pretending both were adopted. The completed review improves the standing practice, while the accepted political or civilian burden remains. A foreign refusal can still leave this a useful national settlement: the government has learned how to make a smaller promise credible before it asks anybody else to trust a larger one."
 OSE_snc_guarantor_limits_public_return_spirit:0 "Open receiving record"
 OSE_snc_guarantor_limits_public_return_spirit_desc:0 "A civil representative refuses to withdraw her objection merely because the receiving work is complete. She agrees that the government met the revised undertaking; she does not agree that it chose the right undertaking. Leave both statements together. The public account will take more political attention to defend, but future officers will be able to distinguish an accepted cost from unanimous approval. This is not a veto over every protected commitment. It is a refusal to make an accurate delivery report perform the additional task of erasing a legitimate disagreement."
 OSE_snc_guarantor_limits_staff_return_spirit:0 "Protected professional return"
 OSE_snc_guarantor_limits_staff_return_spirit_desc:0 "The professional return contains a dissenting signature from an officer who believed the protected schedule left too little margin. His colleagues ask to keep the discussion within the receiving chain, where its technical detail will not be mistaken for a withdrawn guarantee. Retain a signed staff account and the obligation to answer it. The route protects professional continuity while reserving civilian capacity for that work. It cannot claim public agreement, and it must not punish the person whose objection made the final undertaking more precise than the first."
 OSE_snc_guarantor_limits_brief:0 "Read the Unkept Promise"
 OSE_snc_guarantor_limits_brief_desc:0 "A guarantor's letter has reached three departments and acquired three different meanings. The foreign desk describes reassurance, the military office describes a contingency, and the transport clerk has reserved an actual receiving window. None has knowingly lied. The original limitation disappeared as each office explained the letter to the next. Bring the versions together before issuing another assurance. The government must decide which promises it can sustain, who may change their meaning, and how the people affected will learn that a commitment has reached its limit."
 OSE_snc_guarantor_limits_brief_requirements_tt:0 "From 2006.1.1, an active national administration and the required earlier work are available. The selected policy remains exclusive; conclusions remain available when their real prerequisites finish after the expected calendar."
 OSE_snc_guarantor_limits_brief_effect_tt:0 "Open the named national continuation from its earned prior settlement."
