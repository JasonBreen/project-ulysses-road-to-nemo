l_english:

 ### PARTIES ###

 ### IDEAS ###
 yuk_top_heavy_command_structure: "Top-Heavy Command Structure"
 yuk_top_heavy_command_structure_desc: "The Yuktobanian Army places a great emphasis on strictly following the chain of command, with a culture discouraging individual unit officers from taking initiative in battles without express orders from the more experienced and higher-ranking generals and field marshals."
 
 ### FOCUSES ###

 
 ### EVENTS ###
 yuktobania_fp.1.t: "The Belkan War"
 yuktobania_fp.1_desc: "War has broken out on the Osean continent between the Belkan Federation and the Osean Federation. Though the Oseans are out primary geopolitical rival, the Belkans are no angels either. They are, objectively, more diametrically opposed to us politically after all.\n\nIf we do not intervene, it would, at best for us, result in both Dinsmark and Oured bloodying their noses while we grow our strength. At worst for us, the Belkans win a decisive victory and we have a new geostrategic rival to deal with. One far more militarist and nationalistic than even the most hawkish Osean.\n\nIf we intervene, it will result in Yuktobania boots on the ground and pilots in the air in Osea. It will cost us a lot of resources but could result in a strong showing of Yuktobanian military prowess along with lowering the chance of a Belkan victory. However, if the Oseans lose anyway, it would be a great embarassment for us and we will have to deal with a strong Belka."
 yuktobania_fp.1.a: "Intervention is worth the risk"
 yuktobania_fp.1.b: "Let them bleed each other dry"

 ### FOCUSES, IDEAS AND TOOLTIPS (Continental War round) ###
 YUK_review_the_command_structure:0 "Review the Command Structure"
 YUK_review_the_command_structure_desc:0 "Our army waits for orders from the top before it moves. The General Staff orders a review of whether that culture still serves us.\n\n§gMod provenance and provisional gameplay.§!"
 YUK_lessons_of_the_intervention:0 "Lessons of the Intervention"
 YUK_lessons_of_the_intervention_desc:0 "Our volunteers fought in the Belkan War. Their reports show what our command structure did well and where it failed.\n\n§gProvisional gameplay.§!"
 YUK_army_reform_commission:0 "Army Reform Commission"
 YUK_army_reform_commission_desc:0 "We kept out of the Belkan War and used the time to study it. The promised commission on army reform can now begin its work.\n\n§gProvisional gameplay.§!"
 YUK_arkbird_debris_talks:0 "Arkbird Debris Talks"
 YUK_arkbird_debris_talks_desc:0 "Fragments of Ulysses threaten every nation's orbit. Osea proposes converting the Arkbird into a debris-clearing platform, and invites us to take part.\n\n§YOfficial:§! Osea and Yuktobania co-operated to convert the Arkbird for debris clearing on 8 October 1999 (ACES Chronicle, 1999 / 10.08). The effects are provisional gameplay."
 YUK_expeditionary_staff_college:0 "Expeditionary Staff College"
 YUK_expeditionary_staff_college_desc:0 "Officers who served abroad will teach the next generation how to fight far from home.\n\n§gProvisional gameplay.§!"
 YUK_volunteer_veterans:0 "Volunteer Veterans"
 YUK_volunteer_veterans_desc:0 "The volunteers who returned from the war become the core of our training cadres.\n\n§gProvisional gameplay.§!"
 YUK_delegate_field_initiative:0 "Delegate Field Initiative"
 YUK_delegate_field_initiative_desc:0 "Field officers will be trusted to act on their own judgement within the intent of their orders.\n\n§gProvisional gameplay.§!"
 YUK_combined_arms_exercises:0 "Combined Arms Exercises"
 YUK_combined_arms_exercises_desc:0 "Large exercises teach army and air force units to act together without waiting on the General Staff.\n\n§gProvisional gameplay.§!"
 YUK_arkbird_debris_programme:0 "Arkbird Debris Programme"
 YUK_arkbird_debris_programme_desc:0 "Yuktobanian engineers join the Osean programme to turn the Arkbird into a debris-clearing platform. The project is strictly civil.\n\n§YOfficial:§! ACES Chronicle, 1999 / 10.08. The effects are provisional gameplay."
 YUK_expeditionary_command:0 "Expeditionary Command"
 YUK_expeditionary_command_desc:0 "The lessons of the intervention replace the old top-heavy command structure.\n\n§gProvisional gameplay.§!"
 YUK_reformed_field_command:0 "Reformed Field Command"
 YUK_reformed_field_command_desc:0 "The commission's reforms replace the old top-heavy command structure.\n\n§gProvisional gameplay.§!"
 YUK_orbital_debris_tracking:0 "Orbital Debris Tracking"
 YUK_orbital_debris_tracking_desc:0 "Ground radars track the fragments the Arkbird must clear.\n\n§gProvisional gameplay.§!"
 YUK_army_reform_complete:0 "Army Reform Complete"
 YUK_army_reform_complete_desc:0 "The reform programme is complete and the army's new structure is in place.\n\n§gProvisional gameplay.§!"
 YUK_civil_space_cooperation:0 "Civil Space Co-operation"
 YUK_civil_space_cooperation_desc:0 "Working together in orbit has eased relations with Osea.\n\n§gProvisional gameplay.§!"
 yuk_expeditionary_command:0 "Expeditionary Command"
 yuk_expeditionary_command_desc:0 "Officers who served in the Belkan War intervention now shape how the army plans and fights. Provisional gameplay."
 yuk_reformed_field_command:0 "Reformed Field Command"
 yuk_reformed_field_command_desc:0 "Field officers may now take the initiative within the intent of their orders. Provisional gameplay."
 yuk_arkbird_partnership:0 "Arkbird Partnership"
 yuk_arkbird_partnership_desc:0 "Yuktobania takes part in the Osean programme to use the Arkbird for orbital debris clearing (ACES Chronicle, 1999 / 10.08). The modifiers are provisional gameplay."
 YUK_intervened_tt:0 "We intervened in the Belkan War"
 YUK_belkan_war_over_tt:0 "The Belkan War is over"
 YUK_stood_aside_tt:0 "We stayed out of the Belkan War, and either chose not to intervene or the war has ended"
 yuk_reform_focus:0 "Yuktobanian Army Reform"
 yuk_reform_focus_desc:0 "Yuktobania's army reform and Arkbird co-operation through 2005."
