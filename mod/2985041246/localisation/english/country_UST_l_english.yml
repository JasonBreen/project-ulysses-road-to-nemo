 UST_undeveloped: "Undeveloped Economy"
 UST_undeveloped_desc: "Having been reliant on Belka for so long, our economy has not been developed to stand on it's own, and our nation will require heavy reorganization to stand on our own two feet."
 UST_undeveloped_2: "Undeveloped Economy"
 UST_undeveloped_2_desc: "Having been reliant on Belka for so long, our economy has not been developed to stand on it's own, and our nation will require heavy reorganization to stand on our own two feet."
 UST_undeveloped_3: "Undeveloped Economy"
 UST_undeveloped_3_desc: "Having been reliant on Belka for so long, our economy has not been developed to stand on it's own, and our nation will require heavy reorganization to stand on our own two feet."
 UST_undeveloped_4: "Undeveloped Economy"
 UST_undeveloped_4_desc: "Having been reliant on Belka for so long, our economy has not been developed to stand on it's own, and our nation will require heavy reorganization to stand on our own two feet."
 UST_freedom: "Ustian Freedom"
 UST_freedom_desc: "Even through years of occupation, the Ustians are a proud people and will never let anything get in the way of their freedom. It has been proven, time and time again, that Ustio will always be free."
 UST_ratio_nationalists: "Ratian Nationalists"
 UST_ratio_nationalists_desc: "Our eastern territories, conquered by Belka, were given to us when our secession occured, however we do not have a strong grip on these territories, as their population is mostly Ratian. With the loss of Belkan security, recently resistance groups and nationalists have become emboldened, and the territories become more unstable by the day."
 UST_ratio_nationalists_2: "Ratian Nationalists"
 UST_ratio_nationalists_2_desc: "Our eastern territories, conquered by Belka, were given to us when our secession occured, however we do not have a strong grip on these territories, as their population is mostly Ratian. With the loss of Belkan security, recently resistance groups and nationalists have become emboldened, and the territories become more unstable by the day."

 UST_enduring_spirit: "Enduring Spirit"
 UST_enduring_spirit_desc: "Ustio's spirit is like a phoenix that will rise from the ashes no matter how many times its flame is quenched. No matter the odds stacked against us, Ustio shall prevail."
 
 UST_first_strike: "First Strike"
 UST_first_strike_desc: "We are taking advantage of Ratio's unpreparedness to break through their defences and force them into an unfavorable position. However, this needs to be done quickly or else we will falter and we may come under scrutiny for our invasion."
 UST_freedom_fascism_1: "Ustian Stubbornness"
 UST_freedom_fascism_1_desc: "Ustian patriotism goes beyond a simple love for the state or the government. Ustians are loyal to the idea of an Ustian nation, even when one may not exist. This gives every Ustian the power to fight as a whole army, no matter the state of their government or formal military."
 UST_freedom_fascism_2: "Ustian Nationalism"
 UST_freedom_fascism_2_desc: "To be Ustian is among the highest honor someone could have. There is no other people on Earth that have the resiliance, the strength, and the courage as an Ustian."
 
 UST_social_country_idea: "Social Country"
 UST_social_country_idea_desc: ""
 UST_social_country_abe_act_idea: "The Repopulation Act"
 UST_social_country_abe_act_idea_desc: "To combat past Belkanization, we have rolled out extra support networks for new and large families, helping them to renew the Ustian population in our country."
 
 UST_sorton_act_idea: "Sorton Act"
 UST_sorton_act_idea_desc: "Allowing the people in our nation to arm themselves will make it harder for any enemy to invade, as our people become a guerilla force that cannot be contained."

