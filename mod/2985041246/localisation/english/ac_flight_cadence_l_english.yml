l_english:
 ac_flight_cadence_cat:0 "Flight Cadence"
 ac_flight_cadence_cat_desc:0 "Static fires, a ruined prototype, then a pad that flies on schedule. The clock runs to 8 July 1999."
 ac_flight_static_fire:0 "Static Fire"
 ac_flight_static_fire_desc:0 "Roll a vehicle to the stand and light it. About seven in ten flights count. The rest come apart on the pad and cost a little stability. Successful fires: [?ac_flight_success|.0]. Three successes unlock cadence. §YProvisional gameplay§!."
 ac_flight_claim_cadence:0 "Lock In the Cadence"
 ac_flight_claim_cadence_desc:0 "Three flights have worked. Stop treating each one as a miracle. Rocket-site construction speeds up, and rocketry research gets a bonus."
 ac_flight_raise_a_pad:0 "Raise a Launch Pad"
 ac_flight_raise_a_pad_desc:0 "Takes seventy days. Grants experimental rocketry if the ministry does not already have it, and builds a rocket site in the capital."
 ac_flight_ulysses_clock:0 "Ulysses, 8 July 1999"
 ac_flight_ulysses_clock_desc:0 "The fragments fall on this date. A working cadence is worth more if Stonehenge is already complete. This mission does not fire the guns and does not move a border."
 ac_flight_cadence:0 "Flight Cadence"
 ac_flight_cadence_desc:0 "The range flies often enough that the next vehicle is cheaper than the last. Provisional gameplay."
 ac_flight_sky_held:0 "The Sky Held"
 ac_flight_sky_held_desc:0 "Stonehenge broke fragments and the launch crews were already flying. The range stays busy for a year. Provisional gameplay."
 ac_flight_we_flew:0 "We Flew Anyway"
 ac_flight_we_flew_desc:0 "The guns were not ready. The vehicles still left the pad. Provisional gameplay."
 ac_flight_cadence.1.t:0 "The Vehicle Flew"
 ac_flight_cadence.1.d:0 "It left the stand, it came back in one piece, and the count goes up by one."
 ac_flight_cadence.1.a:0 "Stack another one"
 ac_flight_cadence.2.t:0 "Rapid Unscheduled Disassembly"
 ac_flight_cadence.2.d:0 "The vehicle came apart on the pad. The crews already know which part to change. One success comes off the board, if there was one to lose."
 ac_flight_cadence.2.a:0 "Fly again"
 ac_flight_cadence.3.t:0 "8 July 1999"
 ac_flight_cadence.3.d_held:0 "Ulysses breaks up over the hemisphere. Stonehenge is firing, and this country's launch crews are already on a cadence. The sky is busy, and it is still there."
 ac_flight_cadence.3.d_flew:0 "Ulysses falls. The railguns are not finished. The launch crews fly through the gap anyway."
 ac_flight_cadence.3.d_quiet:0 "Ulysses falls. The range never learned to fly on a schedule. The day is spent watching."
 ac_flight_cadence.3.a:0 "Keep the range hot"
 ac_flight_cadence.3.b:0 "Fly through it"
 ac_flight_cadence.3.c:0 "We watched"
 ac_flight_arkbird_head_start:0 "Arkbird Head Start"