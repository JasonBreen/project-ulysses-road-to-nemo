 OSE_snc_emergency_review_review:0 "Record What Still Requires It"
 OSE_snc_emergency_review_review_desc:0 "The completed return identifies an exception that remains necessary and another that survived only because its recipients did not know who could revoke it. The committee refuses to describe either finding as a verdict on the entire government. Review the actual receiving work and retain the selected civil or protected explanation. Peace may change the reason for an authority without answering every domestic obligation it created. A prolonged conflict may justify continued priority without making its cost disappear. The useful record names the remaining purpose closely enough that a successor will be able to recognize when it ends."
 OSE_snc_emergency_review_review_requirements_tt:0 "From 2010.1.1, an active national administration and the required earlier work are available. A corresponding selected-lane funded service must have genuinely completed after this branch requested its review."
