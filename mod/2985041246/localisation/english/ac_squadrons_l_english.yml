 ac_sq.209.a:0 "Let the missing part remain a visible shortage."
 ac_sq.209.a.reply:0 "Niko leaves the aircraft unavailable and helps Elias explain the difference between an idea and a cleared repair."
 ac_sq.209.b:0 "Authorize a strictly limited local repair."
 ac_sq.209.b.reply:0 "Elias works beside Niko instead of rushing ahead, and Mara accepts a restriction that will now carry her name."
 ac_sq.210.t:0 "The Return Address"
 ac_sq.210.d_base_callback:0 "Mara's mother sent a new address card although the house had not moved. The road instructions had. A familiar shortcut was no longer dependable, and a neighbor who used to pass on messages had gone elsewhere. Elias began copying the changes onto Irena's chart before realizing that this was not the map's proper purpose. Irena told him to continue. Niko offered Mara a day away and then had to admit he did not know who would cover the work. The envelope made the idea of home unusually practical. Mara could keep the visit private, depending on friends to make room, or insist that returning to ordinary responsibilities belong on the roster too.\n\nThe private card inside Mara's jacket has done its job. This time she updates the other names before leaving."
 ac_sq.210.d_base:0 "Mara's mother sent a new address card although the house had not moved. The road instructions had. A familiar shortcut was no longer dependable, and a neighbor who used to pass on messages had gone elsewhere. Elias began copying the changes onto Irena's chart before realizing that this was not the map's proper purpose. Irena told him to continue. Niko offered Mara a day away and then had to admit he did not know who would cover the work. The envelope made the idea of home unusually practical. Mara could keep the visit private, depending on friends to make room, or insist that returning to ordinary responsibilities belong on the roster too."
 ac_sq.210.a:0 "Put the time at home on the roster."
 ac_sq.210.a.reply:0 "Irena records the relief openly, and Elias discovers he can ask for the same consideration without inventing an emergency."
 ac_sq.210.b:0 "Let the flight cover it quietly."
 ac_sq.210.b.reply:0 "Niko finds the necessary hours among familiar people, and Mara leaves carrying a favor she intends to return."
 ac_sq.211.t:0 "A Map Someone Else Can Fold"
 ac_sq.211.d_base:0 "Irena was asked to teach the route work to a relief controller. She prepared a careful explanation and kept interrupting it to add another exception. The newcomer was competent, which made each correction feel less like help. Mara recognized the same impatience in herself when Elias described a warning differently from the words she would have chosen. Niko moved the old chart to the other side of the table and asked the newcomer to work from the copy. They could keep an experienced person close enough to prevent every foreseeable mistake, or let a second person discover which parts of the method were still instructions that existed only inside its author's head."
 ac_sq.211.a:0 "Let the relief controller make the first plan."
 ac_sq.211.a.reply:0 "Irena waits through an unfamiliar but workable explanation and finally asks a question instead of supplying the answer."
 ac_sq.211.b:0 "Keep Irena close through the first watches."
 ac_sq.211.b.reply:0 "The handover remains smooth, and the newcomer learns which decisions still need the familiar controller beside them."
 ac_sq.212.t:0 "The Work Beneath the Applause"
 ac_sq.212.d_base_callback:0 "A visitor congratulated the squadron on its resourcefulness and asked Niko to tell a suitable story. He looked at Mara before answering. Elias had already chosen a successful repair, one that sounded impressive without needing to mention the work postponed to make it possible. Irena knew several people who had covered those postponed jobs. Niko did not want to spoil a rare public recognition of the crew. He wanted the praise to leave somebody understanding what it had cost. Mara could let the room enjoy a clean story or make the account include the hours and other obligations that a useful improvisation had consumed.\n\nThe cleared and uncleared repairs are still recorded separately. Praise cannot quietly turn one into evidence that the other was unnecessary."
 ac_sq.212.d_base:0 "A visitor congratulated the squadron on its resourcefulness and asked Niko to tell a suitable story. He looked at Mara before answering. Elias had already chosen a successful repair, one that sounded impressive without needing to mention the work postponed to make it possible. Irena knew several people who had covered those postponed jobs. Niko did not want to spoil a rare public recognition of the crew. He wanted the praise to leave somebody understanding what it had cost. Mara could let the room enjoy a clean story or make the account include the hours and other obligations that a useful improvisation had consumed."
 ac_sq.212.a:0 "Tell the whole cost of the repair."
 ac_sq.212.a.reply:0 "Niko gives credit to the absent watch, and the visitor has to write down more names than the photograph will show."
 ac_sq.212.b:0 "Give the crew its uncomplicated afternoon."
 ac_sq.212.b.reply:0 "Elias tells the story well, and for once the people doing difficult work hear only gratitude in return."
 ac_sq.213.t:0 "The Question After Training"
 ac_sq.213.d_base:0 "A young technician asked Elias whether staying had been worth it. The question arrived without an argument or a request for advice, and he looked toward Mara as though she might know which answer was expected. The station had become more capable without becoming less demanding. Niko still had work he could not explain to a family over supper; Irena still carried routes home in her head. Mara could answer with the country's need for people willing to serve. She could also explain what they had learned about building a life that did not have to disappear each time a duty called. The technician was waiting for a person, not a recruiting sentence."
 ac_sq.213.a:0 "Explain how service can leave room for a life."
 ac_sq.213.a.reply:0 "Elias admits which boundary he is still learning to keep, and the technician asks a more practical second question."
 ac_sq.213.b:0 "Explain why the flight still needs people."
 ac_sq.213.b.reply:0 "Niko describes a job the newcomer could learn, offering belonging before the conversation becomes a list of reasons to leave."
 ac_sq.214.t:0 "The Number That Answers"
 ac_sq.214.d_base_callback:0 "The contact exercise succeeded until it reached the final number. A recorded message invited the caller to try again during office hours. Irena wrote down the time and asked the flight to start over from the person who would actually need help. Elias offered his own number as a temporary answer. Mara understood why that was generous and why Niko was already reaching for the roster. They could make one reliable person the bridge until the arrangement improved. They could also leave the test unfinished and require the responsible offices to provide an answer that survived an ordinary evening. The empty final box was more informative than another satisfactory tick would have been.\n\nThe earlier named handover supplies an example of what the missing final box should contain. Irena no longer has to explain it as a personal preference."
 ac_sq.214.d_base:0 "The contact exercise succeeded until it reached the final number. A recorded message invited the caller to try again during office hours. Irena wrote down the time and asked the flight to start over from the person who would actually need help. Elias offered his own number as a temporary answer. Mara understood why that was generous and why Niko was already reaching for the roster. They could make one reliable person the bridge until the arrangement improved. They could also leave the test unfinished and require the responsible offices to provide an answer that survived an ordinary evening. The empty final box was more informative than another satisfactory tick would have been."
 ac_sq.214.a:0 "Leave the test incomplete until the route works."
 ac_sq.214.a.reply:0 "Irena sends the unanswered call with the report, preserving a failure another office can finally recognize."
 ac_sq.214.b:0 "Let Elias answer the temporary line."
 ac_sq.214.b.reply:0 "Elias gives the caller a voice instead of a recording, and Niko quietly starts looking for somebody who can relieve him."
 ac_sq.215.t:0 "A Promise With a Date"
 ac_sq.215.d_base:0 "Mara had begun writing dates beside the flight's promises. She expected the habit to make the list shorter. Instead it revealed how many temporary arrangements had survived because nobody wanted to be the person who stopped helping. Elias recognized his own handwriting on several lines. Niko was relieved to see them collected and annoyed that relief had taken so long. Irena asked whether the dates were deadlines for ending help or appointments for deciding what came next. The distinction mattered to people waiting outside the hut as much as to those working inside. Mara could use the review to protect the crew's remaining time or accept a slower conversation with everybody relying on it."
 ac_sq.215.a:0 "Review each promise with its receiver."
 ac_sq.215.a.reply:0 "Irena brings the replies back to the table, including a request the flight cannot satisfy without changing its own plan."
 ac_sq.215.b:0 "End the temporary duties the crew cannot sustain."
 ac_sq.215.b.reply:0 "Elias finally crosses out an obligation before volunteering for its replacement, and Niko insists the saved time remain real."
 ac_sq.216.t:0 "The Drawer of Small Things"
 ac_sq.216.d_base:0 "The crew found the drawer while moving a desk: spare straps, three keys, a broken pencil and an envelope that had outlasted the jacket it once belonged to. Elias wanted to keep it exactly as it was. Niko argued that preserving a useful thing required knowing whether anyone could still use it. Irena placed a blank card beside the old address, leaving room for the current one. Mara could make the drawer a quiet collection belonging to the people who remembered it, or ask the newcomers which parts of that history would help them do the work now. Neither answer would restore the first morning. It might decide whether memory became another thing everyone else had to work around."
 ac_sq.216.a:0 "Let the newcomers ask what each thing is for."
 ac_sq.216.a.reply:0 "The first question concerns a key nobody has used for years, and Niko laughs before admitting he does not know."
 ac_sq.216.b:0 "Keep a small place for the flight's private history."
 ac_sq.216.b.reply:0 "Elias repairs the drawer runner, pleased that not every useful bond needs a public explanation."
 ac_sq.217.t:0 "The Person Waiting Outside"
 ac_sq.217.d_shared_service_callback:0 "An exhausted driver waited outside the station because the instruction had told him to hand over to the flight. The flight had expected a vehicle. Mara found the difference when she asked him when he had last slept. Irena could locate the office responsible for the journey; Niko could make a place for the driver to rest. Elias wanted to do both immediately, then discovered that both would consume people already assigned elsewhere. The driver's apology made the room uncomfortable. He had followed the route correctly. They were deciding whether to solve the immediate need with another private favor or force the plan to recognize the person whose arrival it had failed to describe.\n\nThe actual alliance with Belka had brought a new contact number, and an awkward silence around who should use it. Niko placed the old maintenance ledger beside the new form. Cooperation could begin with a practical question, he said; it did not require anybody to surrender a memory. Mara asked Irena to find a counterpart willing to answer in the same terms.\n\nA reply from the earlier review identifies a service that can receive the next journey. For once the flight is not the only available answer."
