 LEA_sw_restraint_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep liaison officers meeting Aurelia's on a fixed schedule. Public attention or reserved staff time remains committed to that work."
 LEA_sw_restraint_reply_protected_spirit:0 "Keep the Army at Home: Protected Working Return"
 LEA_sw_restraint_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Exercise the army well inside the country's borders. Public attention or reserved staff time remains committed to that work."
 ac_alc.69.t:0 "A General Who Wants the South"
 ac_alc.69.d:0 "A general who fought in the civil war has told cadets that Aurelia's wealth was built on Leasath's mines and that the army should take it back. He has a following.\n\nThe government can answer him in public, or retire him quietly.\n\n[LEA_restraint_ac_alc_policy_callback]"
 ac_alc.69.a:0 "Answer him in public."
 ac_alc.69.b:0 "Retire him quietly."
 LEA_restraint_ac_alc_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 LEA_restraint_ac_alc_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 LEA_restraint_ac_alc_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_alc.99.t:0 "A Country That Did Not March"
 ac_alc.99.d:0 "The final review lists the army's exercises, the liaison meetings and the general's speech, with the government's answer.\n\nLeasath has its grievance and its army. It has kept them apart.\n\n[LEA_restraint_ac_alc_report_callback]\n\n[LEA_restraint_ac_alc_policy_callback]"
 ac_alc.99.a:0 "File the completed service record."
