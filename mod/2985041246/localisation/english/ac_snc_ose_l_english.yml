 OSE_snc_federal_account_protocol:0 "Request the Successor Period"
 OSE_snc_federal_account_protocol_desc:0 "Request a fresh appropriation period to test the responsibility the next administration would inherit. The selected existing service must perform the work after this request, using its ordinary national reservations and actual costs. The committee wants a receiving account that can be repeated without its current members sitting beside every desk. Old completed work explains how the procedure developed; it does not supply the successor's return. If the period is interrupted, acknowledge the interruption and reopen a current request rather than filling the missing pages with the confidence of the earlier settlement."
