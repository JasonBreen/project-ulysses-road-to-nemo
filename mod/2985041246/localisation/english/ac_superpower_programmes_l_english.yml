 ac_snp.41.t:0 "The Qualification and the Waiting Work"
 ac_snp.41.d:0 "The apprentice brings a corrected training return to the review. It records the instruction actually received rather than the hours initially reserved. Beside it lies the maintenance queue, including work deliberately left waiting. The superintendent no longer describes both as an unused reserve. The board's chosen policy has become a practical obligation with a cost that somebody can identify. Its improved settlement will support the next period, but it will not erase the delay or create a second shift of trained workers. The apprentice asks that the receiving clerk keep both documents together so her qualification cannot later be used to conceal the work that paid for it.\n\n[OSE_snp_productive_capacity_response_context]\n[OSE_snp_productive_capacity_period_context]\n[OSE_snp_productive_capacity_policy_context]"
 ac_snp.41.a:0 "File the assessment with its unresolved questions."
 ac_snp.41.a_effect_tt:0 "Retain the completed national service record and its prior choices. This acknowledgement authorizes no additional funded period."
 OSE_snp_continental_transport_policy_context_1:0 "The standing policy is civil receiving windows. Its continuing opportunity cost remains in the national schedule."
 OSE_snp_continental_transport_policy_context_2:0 "The standing policy is military movement reserve. Its continuing opportunity cost remains in the national schedule."
 ac_snp.12.t:0 "A Timetable Written in Two Inks"
 ac_snp.12.d:0 "The dispatch exercise uses two inks for movements whose receiving windows overlap. A civil coordinator has marked the ordinary repair traffic; the military liaison has marked a support reservation. Both lines end at the same receiving desk. When a trainee tries to solve the exercise by moving one line into an unmarked hour, the dispatcher asks who will staff it. The room falls quiet. The civil coordinator proposes published notice periods, so affected services can challenge an exception before preparing their work around it. The liaison proposes a protected urgent channel with an identified officer answerable for every displaced reservation. The exercise needs a rule that somebody can actually follow.\n\n[OSE_snp_continental_transport_policy_context]"
 ac_snp.12.a:0 "Publish the notice period and the receiving office’s right to object."
 ac_snp.12.a_effect_tt:0 "Civil support +4, readiness support -2. Both observations remain within zero to one hundred."
 ac_snp.12.b:0 "Keep an urgent channel with a named receiving responsibility."
 ac_snp.12.b_effect_tt:0 "Readiness support +4, civil support -2. Both observations remain within zero to one hundred."
