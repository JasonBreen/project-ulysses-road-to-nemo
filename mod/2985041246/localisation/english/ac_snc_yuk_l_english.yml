 YUK_snc_readiness_truth_review:0 "Compare the Available Hands"
 YUK_snc_readiness_truth_review_desc:0 "The completed receiving period records a delay that neither opening account predicted. Technical staff spent time teaching a replacement examiner how to repeat an acceptance check. The workshop regards that as useful work; the first readiness summary did not count it. Review the actual return before deciding which explanation becomes standing practice. The selected policy must answer for its own burden as well as its advantage. A neat total is inadequate if the same qualified people have again been promised to two receiving offices without either being told where they are expected to appear first."
