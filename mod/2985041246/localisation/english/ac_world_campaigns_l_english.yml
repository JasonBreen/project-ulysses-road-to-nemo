 ac_wc_soa.23.d:0 "Vey sees an export opportunity in Central Usea. Sellen warns against treating a foreign government as a purchase order. Halvek asks how technical cooperation can preserve independent decisions on both sides.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
