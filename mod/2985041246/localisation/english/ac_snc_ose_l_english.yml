 ac_snc_ose_message_24.t:0 "A Mandate That Can Be Ended: The Return"
 ac_snc_ose_message_24.d:0 "The return is read in the same room, during an ordinary working day. The duty officer points to one instruction that still needs protection and another that his own staff have already replaced. The clerk records both. Their agreement is more limited than the headline either side could have requested. It concerns who will answer the next renewal, and what evidence that person must receive. The committee may keep a public or professional account, but the completed period has made one thing difficult to conceal: continuing an exception is an active national choice with people still waiting at its edge.\n\n[OSE_snc_emergency_review_hearing_context]"
