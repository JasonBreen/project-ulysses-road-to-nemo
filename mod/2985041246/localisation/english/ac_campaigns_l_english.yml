 ac_camp.82.t:0 "A channel without a letterhead"
 ac_camp.82.desc:0 "The first useful reply arrived without a formal heading. The handler read it twice, then checked the receiving details against the promise that had been made in another office. The words were ordinary enough to file under routine correspondence. Their usefulness lay in who had agreed to make them arrive.\n\nBuilding the channel had spent real capacity. People had been taken from visible work to maintain relationships that would not appear in the official account. The government supporting that effort could still describe itself as separate from the network, but the distinction was becoming a decision it had to enforce rather than a fact it could assume.\n\nThe handler's contact asked what would be expected next. He answered only the portion needed for the current arrangement. Compartmentalization protected the plan from discovery and protected its participants from having to judge the whole of it. Neither protection would survive an honest reconstruction of the correspondence.\n\nOn the desk beside the message was a veterans' invitation. The handler had not decided whether to attend. At such gatherings, the language of a country's grievance could make a private ambition sound like a duty shared by everyone in the room.\n\nHe put the invitation in a drawer and prepared the next request. The receiving office would see a limited administrative favor. Somewhere else, a clerk might keep the original, a witness might remember the change, or an investigator might ask why the same hand kept appearing between unrelated orders.\n\nThe channel was working. That was also the moment it began leaving something worth finding."
 ac_camp.82.a:0 "Keep this account."
