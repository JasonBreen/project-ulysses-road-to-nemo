 YUK_camp_3_register:0 "The authority to answer"
 YUK_camp_3_register_desc:0 "The authority to answer. Open the campaign lane and its preparation record.\n\nThe political voice returning to public life must answer people who obeyed the army and people who suffered because it was obeyed. An authenticated request to stop fighting is necessary, but soldiers also need to know who stands behind the answer from Osea. The branch restores the capacity to make that decision and records the terms actually accepted. A refusal is a refusal, not a concealed route to reconciliation. A peace that survives begins with both governments accepting responsibility for an agreement they can presently enforce."
