 DEL_up_published_obligations:0 "Publish the Obligation Schedule"
 DEL_up_published_obligations_desc:0 "A public schedule makes costs and refusals visible. It improves the use of ordinary resources while requiring continuing political work to defend the record."
 DEL_up_published_obligations_done:0 "Publish the Obligation Schedule completed"
 DEL_up_published_obligations_tt:0 "Civil oversight: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Adopt the enduring policy shown below, including its continuing cost."
 DEL_up_military_reservations:0 "Protect Military Reservations"
 DEL_up_military_reservations_desc:0 "The command chain receives a protected share of available attention. The policy supports war readiness while leaving less capacity for research and civil review."
 DEL_up_military_reservations_done:0 "Protect Military Reservations completed"
 DEL_up_military_reservations_tt:0 "Command coordination: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Adopt the enduring policy shown below, including its continuing cost."
 DEL_up_scientific_returns:0 "Receive Scientific Returns Responsibly"
 DEL_up_scientific_returns_desc:0 "Scientific advice needs a receiving office able to revise instructions. Delarus will record the forecast without turning uncertainty into an excuse for contradictory demands."
 DEL_up_scientific_returns_done:0 "Receive Scientific Returns Responsibly completed"
 DEL_up_scientific_returns_tt:0 "Verified records: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Earn the named capability required for 'Allocate an Inspected Scientific Docket'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_inspection_exercises:0 "Exercise the Inspection Chain"
 DEL_up_inspection_exercises_desc:0 "Inspectors will follow a simulated urgent requisition from signature to receiving office. The exercise protects useful oversight rather than creating a second command system."
 DEL_up_inspection_exercises_done:0 "Exercise the Inspection Chain completed"
 DEL_up_inspection_exercises_tt:0 "Civil oversight: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Programme authorisations now consume one institutional capacity instead of two. Earn the named capability required for 'Allocate an Inspected Scientific Docket'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_reserve_commitments:0 "Account for Reserve Commitments"
 DEL_up_reserve_commitments_desc:0 "A reserve already promised to one service is not available to every other office. The obligation desk will record that constraint before the crisis."
 DEL_up_reserve_commitments_done:0 "Account for Reserve Commitments completed"
 DEL_up_reserve_commitments_tt:0 "Command coordination: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Earn the named capability required for 'Allocate a Bounded Competing-Demand Review'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_records_duplicates:0 "Keep Accountable Record Duplicates"
 DEL_up_records_duplicates_desc:0 "Duplicate files require custody and a retrieval procedure. The service will test those details instead of claiming that another copy guarantees continuity."
 DEL_up_records_duplicates_done:0 "Keep Accountable Record Duplicates completed"
 DEL_up_records_duplicates_tt:0 "Verified records: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Earn the named capability required for 'Allocate a Bounded Competing-Demand Review'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_verified_preparation:0 "Verify Preparations before the Boundary"
 DEL_up_verified_preparation_desc:0 "Inspection will record what was actually prepared before the crisis. Later emergency work will be judged on its current value rather than backdated into this account."
 DEL_up_verified_preparation_done:0 "Verify Preparations before the Boundary completed"
 DEL_up_verified_preparation_tt:0 "Civil oversight: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Advance this service's completed milestone to 2/4."
 DEL_up_obligation_review:0 "Review the Protected Obligations"
 DEL_up_obligation_review_desc:0 "Protected commitments need a review date as well as an original signature. The desk will keep the programme sustainable by confronting commitments that cannot all be honoured."
 DEL_up_obligation_review_done:0 "Review the Protected Obligations completed"
 DEL_up_obligation_review_tt:0 "Command coordination: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Advance this service's completed milestone to 2/4."
 DEL_up_preparedness_accounts:0 "Close the Preparedness Accounts"
 DEL_up_preparedness_accounts_desc:0 "The account distinguishes completed preparation from an unfulfilled instruction. That distinction remains useful even when the later outcome is different from the cabinet's expectations."
 DEL_up_preparedness_accounts_done:0 "Close the Preparedness Accounts completed"
 DEL_up_preparedness_accounts_tt:0 "Verified records: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Advance this service's completed milestone to 2/4."
 DEL_up_emergency_casework:0 "An Emergency Casework Rota"
 DEL_up_emergency_casework_desc:0 "Demand rises precisely when familiar officials are unavailable. A rota preserves oversight without pretending every ordinary procedure can continue at full speed."
 DEL_up_emergency_casework_done:0 "An Emergency Casework Rota completed"
 DEL_up_emergency_casework_tt:0 "Civil oversight: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Allocate a Bounded Competing-Demand Review'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_command_requests:0 "Review the Command Requests"
 DEL_up_command_requests_desc:0 "Commanders need a usable answer, including a refusal where capacity is already committed. Reviewing requests protects the obligations the country can still deliver."
 DEL_up_command_requests_done:0 "Review the Command Requests completed"
 DEL_up_command_requests_tt:0 "Command coordination: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Allocate a Bounded Competing-Demand Review'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_crisis_accounts:0 "Accounts after the Crisis"
 DEL_up_crisis_accounts_desc:0 "The administration will compare what was requested with what actually arrived. The crisis does not erase the need for a receiving record."
 DEL_up_crisis_accounts_done:0 "Accounts after the Crisis completed"
 DEL_up_crisis_accounts_tt:0 "Verified records: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Allocate a Mobile Receiving Audit'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_inspect_requisitions:0 "Inspect Emergency Requisitions"
 DEL_up_inspect_requisitions_desc:0 "Inspection supports organisation by finding incompatible demands. The gain in dependable administration comes at a cost to immediate planning speed."
 DEL_up_inspect_requisitions_done:0 "Inspect Emergency Requisitions completed"
 DEL_up_inspect_requisitions_tt:0 "Civil oversight: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Adopt the enduring policy shown below, including its continuing cost."
 DEL_up_emergency_warrants:0 "Authorise Emergency Warrants"
 DEL_up_emergency_warrants_desc:0 "A warrant gives the command chain room to act before every docket is complete. The country accepts a continuing public-service burden to support that speed."
 DEL_up_emergency_warrants_done:0 "Authorise Emergency Warrants completed"
 DEL_up_emergency_warrants_tt:0 "Command coordination: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Adopt the enduring policy shown below, including its continuing cost."
 DEL_up_records_in_motion:0 "Keep the Records Moving"
 DEL_up_records_in_motion_desc:0 "The service will plan for the movement of files and responsible staff. Losing an office must not automatically erase the obligations it accepted."
 DEL_up_records_in_motion_done:0 "Keep the Records Moving completed"
 DEL_up_records_in_motion_tt:0 "Verified records: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Allocate a Mobile Receiving Audit'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_requisition_audits:0 "Audit Requisitions under Pressure"
 DEL_up_requisition_audits_desc:0 "A sampled audit can identify the demand that consumed capacity promised elsewhere. It improves oversight without claiming that inspection itself delivers the missing supplies."
 DEL_up_requisition_audits_done:0 "Audit Requisitions under Pressure completed"
 DEL_up_requisition_audits_tt:0 "Civil oversight: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Programme authorisations now consume one institutional capacity instead of two. Earn the named capability required for 'Allocate a Mobile Receiving Audit'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_coalition_commitment:0 "Offer a Defined Coalition Commitment"
 DEL_up_coalition_commitment_desc:0 "Delarus may offer an eligible FCU partner a bounded administrative service. The offer is not a blank cheque, and a refusal leaves domestic work available."
 DEL_up_coalition_commitment_done:0 "Offer a Defined Coalition Commitment completed"
 DEL_up_coalition_commitment_tt:0 "Command coordination: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Unlock the once-only bounded FCU service offer; acceptance remains conditional and is never a focus prerequisite."
 DEL_up_receiving_backlog:0 "Separate the Receiving Backlog"
 DEL_up_receiving_backlog_desc:0 "The records service will distinguish unfinished delivery from paperwork that can be closed. That distinction makes a finite obligation review possible."
 DEL_up_receiving_backlog_done:0 "Separate the Receiving Backlog completed"
 DEL_up_receiving_backlog_tt:0 "Verified records: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Allocate a Mobile Receiving Audit'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_displaced_dockets:0 "Preserve the Displaced Dockets"
 DEL_up_displaced_dockets_desc:0 "Disrupted offices will retain a route for reconstructing their files. The records programme can support later recovery without declaring what happened on the battlefield."
 DEL_up_displaced_dockets_done:0 "Preserve the Displaced Dockets completed"
 DEL_up_displaced_dockets_tt:0 "Civil oversight: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Advance this service's completed milestone to 3/4."
 DEL_up_domestic_review:0 "A Domestic Review after Refusal"
 DEL_up_domestic_review_desc:0 "A foreign refusal does not remove the need for accountable domestic work. The inspection office will continue under its own limited mandate."
 DEL_up_domestic_review_done:0 "A Domestic Review after Refusal completed"
 DEL_up_domestic_review_tt:0 "Command coordination: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Advance this service's completed milestone to 3/4."
 DEL_up_response_docket:0 "Close the Emergency Response Docket"
 DEL_up_response_docket_desc:0 "The docket records accepted commitments, interrupted work and the chosen oversight policy. It prepares the country for a recovery assessment under the actual settlement."
 DEL_up_response_docket_done:0 "Close the Emergency Response Docket completed"
 DEL_up_response_docket_tt:0 "Verified records: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Advance this service's completed milestone to 3/4."
 DEL_up_reopen_inspection:0 "Reopen the Inspection Office"
 DEL_up_reopen_inspection_desc:0 "Recovery begins by finding responsible officials and usable evidence. Reopening the office does not imply that every emergency decision can be reconstructed."
 DEL_up_reopen_inspection_done:0 "Reopen the Inspection Office completed"
 DEL_up_reopen_inspection_tt:0 "Civil oversight: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together."
 DEL_up_obligation_settlement:0 "Settle the Outstanding Obligations"
 DEL_up_obligation_settlement_desc:0 "Each outstanding demand requires an answer under the conditions that now exist. The desk will distinguish a valid continuing commitment from an expired emergency claim."
 DEL_up_obligation_settlement_done:0 "Settle the Outstanding Obligations completed"
 DEL_up_obligation_settlement_tt:0 "Command coordination: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Allocate a Verified Settlement Appeal'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_actual_terms:0 "Record the Actual Settlement Terms"
 DEL_up_actual_terms_desc:0 "The records service must describe the country and obligations that survived. It will not assume victory, independence or an unaltered command chain merely because a date has passed."
 DEL_up_actual_terms_done:0 "Record the Actual Settlement Terms completed"
 DEL_up_actual_terms_tt:0 "Verified records: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Allocate a Verified Settlement Appeal'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_civilian_oversight:0 "Retain Civilian Oversight"
 DEL_up_civilian_oversight_desc:0 "A protected civilian review supports confidence after the emergency. It places a continuing political burden on institutions expected to explain difficult decisions."
 DEL_up_civilian_oversight_done:0 "Retain Civilian Oversight completed"
 DEL_up_civilian_oversight_tt:0 "Civil oversight: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Adopt the enduring policy shown below, including its continuing cost."
 DEL_up_joint_inspection:0 "Adopt Joint Inspection Terms"
 DEL_up_joint_inspection_desc:0 "Civil and command inspectors will work from a common receiving record. Better organisation retains an ordinary service cost instead of becoming a free postwar bonus."
 DEL_up_joint_inspection_done:0 "Adopt Joint Inspection Terms completed"
 DEL_up_joint_inspection_tt:0 "Command coordination: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Adopt the enduring policy shown below, including its continuing cost."
 DEL_up_casework_recovery:0 "Recover the Missing Casework"
 DEL_up_casework_recovery_desc:0 "Staff will reconstruct the chain of responsibility where evidence permits. An honest gap remains preferable to a fabricated record of completed delivery."
 DEL_up_casework_recovery_done:0 "Recover the Missing Casework completed"
 DEL_up_casework_recovery_tt:0 "Verified records: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Allocate a Verified Settlement Appeal'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_standing_inspection:0 "Standing Inspection Intervals"
 DEL_up_standing_inspection_desc:0 "The office will inspect continuing commitments on a schedule. Regular review keeps oversight useful after the emergency warrant is retired."
 DEL_up_standing_inspection_done:0 "Standing Inspection Intervals completed"
 DEL_up_standing_inspection_tt:0 "Civil oversight: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Programme authorisations now consume one institutional capacity instead of two. Earn the named capability required for 'Allocate a Joint Standing-Service Inspection'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_command_service_terms:0 "Publish Command Service Terms"
 DEL_up_command_service_terms_desc:0 "Command offices will state the service they require and the capacity they accept is unavailable. Clear terms preserve a useful command relationship under either policy."
 DEL_up_command_service_terms_done:0 "Publish Command Service Terms completed"
 DEL_up_command_service_terms_tt:0 "Command coordination: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Allocate a Joint Standing-Service Inspection'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_coalition_dockets:0 "Reconcile the Coalition Dockets"
 DEL_up_coalition_dockets_desc:0 "Offers, refusals and interrupted assistance will have separate entries. A past diplomatic promise cannot be converted into an unearned current reward."
 DEL_up_coalition_dockets_done:0 "Reconcile the Coalition Dockets completed"
 DEL_up_coalition_dockets_tt:0 "Verified records: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Allocate a Joint Standing-Service Inspection'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 DEL_up_local_control_recovery:0 "Settle the Record under Local Control"
 DEL_up_local_control_recovery_desc:0 "Where national institutions retain authority, they will carry the inspected record into ordinary government. Earlier costs remain part of that record."
 DEL_up_local_control_recovery_done:0 "Settle the Record under Local Control completed"
 DEL_up_local_control_recovery_tt:0 "Civil oversight: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Advance this service's completed milestone to 4/4."
 DEL_up_external_conditions_recovery:0 "Settle the Record under Constraints"
 DEL_up_external_conditions_recovery_desc:0 "Defeat, displacement or external conditions may limit what the administration can promise. A useful inspection programme must work within those limits."
 DEL_up_external_conditions_recovery_done:0 "Settle the Record under Constraints completed"
 DEL_up_external_conditions_recovery_tt:0 "Command coordination: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Advance this service's completed milestone to 4/4."
 DEL_up_oversight_assessment:0 "Assess Oversight and Command Obligations"
 DEL_up_oversight_assessment_desc:0 "The assessment records the actual settlement and the balance chosen between inspection and command discretion. It remains available after the calendar window when the required work finishes late."
 DEL_up_oversight_assessment_done:0 "Assess Oversight and Command Obligations completed"
 DEL_up_oversight_assessment_tt:0 "Verified records: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Advance this service's completed milestone to 4/4."
 ac_up_sns_programmes:0 "San Salvacion: Continuity and Civil Protection"
 ac_up_sns_programmes_desc:0 "Continuity networks: [?ac_up_sns_continuity|0]/100\nCivil protection: [?ac_up_sns_protection|0]/100\nDispatch discipline: [?ac_up_sns_dispatch|0]/100\n\nContinuity and protection services renew for 180 days. Stonehenge work observes the existing project's state. Verified continuity records: [?ac_up_sns_contact_records|0]/6. Verified protection records: [?ac_up_sns_protection_records|0]/6. Completed services earn these records; operational scopes consume them.\n\nA funded programme costs 25 political power and 2 institutional capacity, reduced to 1 after authorisation reforms, plus the fiscal programme charge when that system is ready. Operational scopes last 90 days and require specific earned capabilities plus the country's finite service resource. These indices do not create physical equipment."
 SNS_up_local_switchboards_spirit:0 "Keep Local Switchboard Authority"
 SNS_up_local_switchboards_spirit_desc:0 "Local operators know which line fails in bad weather and which official will answer after midnight. Keeping that discretion protects public confidence but requires a larger standing service."
 SNS_up_central_dispatch_spirit:0 "Build a Central Dispatch Office"
 SNS_up_central_dispatch_spirit_desc:0 "A single dispatch office can move scarce crews quickly. Its authority improves coordination, while the districts give up some discretion and the office consumes political attention."
 SNS_up_distributed_shelters_spirit:0 "A Distributed Shelter Charter"
 SNS_up_distributed_shelters_spirit_desc:0 "Local protection sites reduce dependence on a few central locations. Maintaining them places a continuing burden on construction and inspection services."
 SNS_up_priority_corridors_spirit:0 "Reserve Priority Corridors"
 SNS_up_priority_corridors_spirit_desc:0 "Priority corridors concentrate the available dispatch capacity on movements the administration can sustain. Ordinary traffic bears some of the cost of keeping those routes ready."
 SNS_up_civilian_continuity_spirit:0 "Protect Civilian Continuity"
 SNS_up_civilian_continuity_spirit_desc:0 "Civil records, family enquiries and essential services receive a protected allocation. The policy supports confidence while reducing the attention available for military mobilisation."
 SNS_up_command_circuits_spirit:0 "Reserve Command Circuits"
 SNS_up_command_circuits_spirit_desc:0 "The command chain receives dependable communications at a continuing civil cost. This helps organise existing forces and does not decide whether the continental war begins."
 SNS_up_public_recovery_record_spirit:0 "Publish the Recovery Record"
 SNS_up_public_recovery_record_spirit_desc:0 "A public record protects confidence and invites disputes over omissions. The administration accepts the political work of answering them."
 SNS_up_operational_record_spirit:0 "Keep an Operational Record"
 SNS_up_operational_record_spirit_desc:0 "A narrower operational record gives service managers room to move quickly. Its continuing administrative burden is the price of keeping that discretion accountable."
 SNS_up_network_programme:0 "Rehearse the Continuity Network"
 SNS_up_network_programme_desc:0 "Requires completed national work: Connect the District Switchboards. Fund a bounded 180-day service. Its benefits carry the displayed continuing burden. Completion records useful work once; interruption forfeits the cost. A renewed service requires a new allocation."
 SNS_up_network_programme_spirit:0 "Rehearse the Continuity Network"
 SNS_up_network_programme_spirit_desc:0 "A funded, temporary national service with a continuing opportunity cost. The underlying physical forces and supplies remain separate."
 SNS_up_protection_programme:0 "Renew a Protection Service"
 SNS_up_protection_programme_desc:0 "Requires completed national work: Inventory Civil Protection. Fund a bounded 180-day service. Its benefits carry the displayed continuing burden. Completion records useful work once; interruption forfeits the cost. A renewed service requires a new allocation."
 SNS_up_protection_programme_spirit:0 "Renew a Protection Service"
 SNS_up_protection_programme_spirit_desc:0 "A funded, temporary national service with a continuing opportunity cost. The underlying physical forces and supplies remain separate."
 SNS_up_adopt_programme:0 "Adopt the National Programme"
 SNS_up_adopt_programme_desc:0 "After the current generic, regional or continuous focus finishes, adopt the persistent national tree while retaining completed content. This grants no starting forces, industry or expired historical preparation."
 ac_up_amb_programmes:0 "Amber: Development and Coalition Services"
 ac_up_amb_programmes_desc:0 "Development bargains: [?ac_up_amb_development|0]/100\nService capacity: [?ac_up_amb_service|0]/100\nTransport coordination: [?ac_up_amb_transport|0]/100\n\nFunded spare slots: [?ac_up_amber_slots|0]/[?ac_up_amber_limit|0]. Completed service milestones raise the funded ceiling from two to six. A domestic transport service or coalition offer spends one slot.\n\nA funded programme costs 25 political power and 2 institutional capacity, reduced to 1 after authorisation reforms, plus the fiscal programme charge when that system is ready. Operational scopes last 90 days and require specific earned capabilities plus the country's finite service resource. These indices do not create physical equipment."
 AMB_up_tendered_development_spirit:0 "Tender the Development Programme"
 AMB_up_tendered_development_spirit_desc:0 "Competitive tenders make the price of ordinary development visible. Predictable civilian work improves construction while creating continuing political obligations to unsuccessful bidders."
 AMB_up_service_guarantees_spirit:0 "Guarantee Strategic Services"
 AMB_up_service_guarantees_spirit_desc:0 "Standing guarantees give selected suppliers confidence to retain capacity. They support output at a continuing public-service burden rather than supplying free industrial expansion."
 AMB_up_commercial_capacity_spirit:0 "Protect Commercial Capacity"
 AMB_up_commercial_capacity_spirit_desc:0 "Civil trade keeps operators and workshops functioning between public calls. Protecting it supports construction while limiting the speed of a later military mobilisation."
 AMB_up_government_slots_spirit:0 "Reserve Government Service Slots"
 AMB_up_government_slots_spirit_desc:0 "Reserved service slots improve the delivery of public and defence consignments. Holding them ready imposes a continuing burden on ordinary economic activity."
 AMB_up_civil_freight_spirit:0 "Give Civil Freight a Protected Share"
 AMB_up_civil_freight_spirit_desc:0 "A protected civil share sustains public confidence and ordinary supply. Military planners must work around the space it occupies."
 AMB_up_military_timetables_spirit:0 "Adopt Military Timetables"
 AMB_up_military_timetables_spirit_desc:0 "Defence consignments receive a larger protected share of the schedule. The gain in military movement comes at a continuing cost to civilian construction."
 AMB_up_public_concession_review_spirit:0 "Publish the Concession Review"
 AMB_up_public_concession_review_spirit_desc:0 "Public scrutiny improves the quality of later development work. The government accepts the political effort required to defend and amend the record."
 AMB_up_long_service_bonds_spirit:0 "Negotiate Long Service Bonds"
 AMB_up_long_service_bonds_spirit_desc:0 "Longer service bargains support productive continuity. Their predictable claim on public resources remains a continuing cost."
 AMB_up_reserve_programme:0 "Fund a Spare Service Slot"
 AMB_up_reserve_programme_desc:0 "Requires completed national work: Inventory Service Capacity. Fund a bounded 180-day service. Its benefits carry the displayed continuing burden. Completion records useful work once; interruption forfeits the cost. A renewed service requires a new allocation."
 AMB_up_reserve_programme_spirit:0 "Fund a Spare Service Slot"
 AMB_up_reserve_programme_spirit_desc:0 "A funded, temporary national service with a continuing opportunity cost. The underlying physical forces and supplies remain separate."
 AMB_up_transport_programme:0 "Authorise a Domestic Transport Service"
 AMB_up_transport_programme_desc:0 "Requires completed national work: Require Transport Returns. Fund a bounded 180-day service. Its benefits carry the displayed continuing burden. Completion records useful work once; interruption forfeits the cost. A renewed service requires a new allocation."
 AMB_up_transport_programme_spirit:0 "Authorise a Domestic Transport Service"
 AMB_up_transport_programme_spirit_desc:0 "A funded, temporary national service with a continuing opportunity cost. The underlying physical forces and supplies remain separate."
 AMB_up_adopt_programme:0 "Adopt the National Programme"
 AMB_up_adopt_programme_desc:0 "After the current generic, regional or continuous focus finishes, adopt the persistent national tree while retaining completed content. This grants no starting forces, industry or expired historical preparation."
 ac_up_uge_programmes:0 "Ugellas: Dispersal and Emergency Mobility"
 ac_up_uge_programmes_desc:0 "Dispersal planning: [?ac_up_uge_dispersal|0]/100\nEmergency mobility: [?ac_up_uge_mobility|0]/100\nReserved capacity: [?ac_up_uge_reserve|0]/100\n\nOccupied slots: [?ac_up_uge_used|0]/[?ac_up_uge_limit|0]. Each lease occupies capacity until it expires or is released.\n\nA funded programme costs 25 political power and 2 institutional capacity, reduced to 1 after authorisation reforms, plus the fiscal programme charge when that system is ready. Operational scopes last 90 days and require specific earned capabilities plus the country's finite service resource. These indices do not create physical equipment."
 UGE_up_distributed_stores_spirit:0 "Keep Stores Dispersed"
 UGE_up_distributed_stores_spirit_desc:0 "Dispersal makes the national service less dependent on a single depot. Maintaining several sites consumes construction and inspection capacity."
 UGE_up_central_mobile_pool_spirit:0 "Create a Central Mobile Pool"
 UGE_up_central_mobile_pool_spirit_desc:0 "A central pool improves the movement of existing forces and services. It requires continuing administrative attention and leaves fewer locally controlled assets."
 UGE_up_local_reserve_space_spirit:0 "Protect Local Reserve Space"
 UGE_up_local_reserve_space_spirit_desc:0 "Local protection retains a claim on the finite reserve. That resilience occupies resources which cannot also serve a military timetable."
 UGE_up_route_contingencies_spirit:0 "Fund Route Contingencies"
 UGE_up_route_contingencies_spirit_desc:0 "A larger share of capacity goes to movement planning and alternative dispatch. The service accepts less planning attention for other military tasks."
 UGE_up_civilian_convoys_spirit:0 "Protect Civilian Convoy Allocations"
 UGE_up_civilian_convoys_spirit_desc:0 "Civilian services retain a protected share of limited movement capacity. The policy supports public confidence while leaving less attention for military organisation."
 UGE_up_defence_allocations_spirit:0 "Reserve Defence Allocations"
 UGE_up_defence_allocations_spirit_desc:0 "The existing forces receive a more reliable movement allocation. Holding that capacity ready imposes a continuing public-service burden."
 UGE_up_distributed_repair_spirit:0 "Distribute the Repair Programme"
