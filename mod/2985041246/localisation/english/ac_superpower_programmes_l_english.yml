 OSE_snp_air_watch_civil_policy_spirit:0 "Civil air-watch liaison"
 OSE_snp_air_watch_civil_policy_spirit_desc:0 "The watch return records a successful handover in a single sentence. Beneath it, the civil controller has written the duration of the channel reservation and the traffic that waited. The air officer calls the delay prudent; the controller agrees that it was necessary and asks who will review it. A national air watch needs trained crews and clear authority, but it also needs a way to end exceptional restrictions. Quiet days provide the safest time to learn that distinction.\n\nPreserve civil contact through watch restrictions. The liaison improves confidence while reserving political and administrative attention for each exceptional order."
