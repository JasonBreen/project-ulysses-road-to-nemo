 ac_sq_blk_cast_leonie_falk:0 "Leonie Falk"
 ac_sq_blk_cast_leonie_falk_desc:0 "Reserve interceptor pilot\n\nLeonie is good at separating a clear instruction from an incomplete one. She has never been comfortable with how often a service record confuses the two. Her reserve posting gives her time to know the people who keep her aircraft flying, and little protection from the demands arriving from above."
 ac_sq_blk_cast_markus_voss:0 "Markus Voss"
 ac_sq_blk_cast_markus_voss_desc:0 "Wingman\n\nMarkus measures an order first by whether the flight can carry it out together. His loyalty is personal and practical: nobody should be left to improvise alone. That conviction can make him a generous wingman and a difficult witness when the truth threatens the unit."
 ac_sq_blk_cast_eva_heller:0 "Eva Heller"
 ac_sq_blk_cast_eva_heller_desc:0 "Crew chief\n\nEva knows the reserve aircraft by their recurring faults and their pilots by the faults they refuse to report. She dislikes speeches about sacrifice delivered beside equipment somebody else must repair. Her authority comes from being willing to sign her own name beneath an uncomfortable finding."
 ac_sq_blk_cast_tomas_wendt:0 "Tomas Wendt"
 ac_sq_blk_cast_tomas_wendt_desc:0 "Ground controller\n\nTomas turns uncertain signals into instructions other people must trust. He keeps notes longer than regulations require, partly from caution and partly because he has seen what a clean official account can leave out. He wants the flight to hear the uncertainty in his voice without mistaking it for fear."
 ac_sq.101.t:0 "The Empty Chair"
 ac_sq.101.d_base:0 "Leonie arrived at the reserve hut with a transfer order and no one to report to. A kettle clicked beneath the noticeboard. Markus moved a flying glove from the chair beside him, while Eva kept reading an inspection sheet as though the newcomer had already been there for weeks. Tomas finally looked up from a clock that was three minutes slow. 'We leave it,' he said. 'Everyone remembers which clock is wrong.' Leonie laughed, then noticed that nobody else had. The squadron's small accommodations had acquired the weight of rules. Her first task was deciding which of them she would learn before trying to change."
 ac_sq.101.a:0 "Learn the crew's habits first."
 ac_sq.101.a.reply:0 "Markus leaves the chair beside him clear on the next morning, without making a ceremony of it."
 ac_sq.101.b:0 "Ask which accommodations are recorded."
 ac_sq.101.b.reply:0 "Eva finds a blank inspection sheet and places it beside Leonie's transfer order."
 ac_sq.102.t:0 "A Line in Pencil"
 ac_sq.102.d_base:0 "Eva tapped a hairline mark on a removed bracket. It had been inspected, initialed and returned to service twice. Neither inspection had been dishonest; neither had explained why it was still there. Markus wanted to know whether the replacement would arrive before their next exercise. Eva wanted the question written differently. 'Not whether it will arrive. Whether we are flying without it.' Leonie found the distinction irritating because she understood it immediately. An aircraft could wait on a stand while a conversation quietly decided what its crew would regard as normal. The pencil hovered above the serviceability column, waiting for somebody else to accept the wording."
 ac_sq.102.a:0 "Ground it until the qualification is written."
 ac_sq.102.a.reply:0 "Eva draws a firm line through the penciled clearance; Markus takes the spare aircraft without speaking."
 ac_sq.102.b:0 "Keep the restriction inside the flight."
 ac_sq.102.b.reply:0 "Markus promises a conservative sortie; Eva folds a copy of the inspection sheet into her pocket."
 ac_sq.103.t:0 "The Spare Pair"
 ac_sq.103.d_base:0 "A new pair of gloves appeared in Leonie's locker. Markus claimed they were surplus, although the stores label had been carefully removed. Across the room Tomas was repairing the cord on his headset with thread borrowed from Eva. Nobody called these things favors. Calling them favors would require keeping an account. Leonie had begun to depend on that quiet economy and to wonder who could afford to join it. When a younger technician asked where the spare equipment was kept, every answer pointed toward a different person. The generosity was real. So was the possibility of being the newcomer who never learned whom to ask."
 ac_sq.103.a:0 "Put the shared spares in one cupboard."
 ac_sq.103.a.reply:0 "Tomas brings his repaired headset to the cupboard and writes a plain return instruction beside it."
 ac_sq.103.b:0 "Let the crew keep looking after its own."
 ac_sq.103.b.reply:0 "Markus finds the technician a spare pair before the next watch, and accepts the new obligation silently."
 ac_sq.104.t:0 "Say Again"
 ac_sq.104.d_base:0 "Tomas stopped the recording after the second exchange. His instruction was clear; his warning about the uncertain contact was not. On the tape, Leonie's acknowledgement sounded more confident than either of them remembered feeling. Markus argued that a debrief should explain the useful outcome, not magnify a hesitation that had harmed nobody. Eva listened from the doorway. 'Useful to whom next time?' she asked. Tomas reached for the stop button again, embarrassed by the small tremor in his own voice. Leonie could spare him the room's attention. She could also leave the next crew with an example in which doubt had conveniently disappeared between the speaker and the record."
 ac_sq.104.a:0 "Keep the hesitation in the teaching tape."
 ac_sq.104.a.reply:0 "Tomas listens through the exchange again, then marks the warning clearly for the next controller."
 ac_sq.104.b:0 "Keep the correction between pilot and controller."
 ac_sq.104.b.reply:0 "Tomas thanks Leonie quietly; Markus calls the private explanation a sensible end to the matter."
 ac_sq.105.t:0 "The Visitor's Badge"
 ac_sq.105.d_base:0 "The apprentices had expected a clean aircraft and a pilot who knew what to say. Instead they found an open panel, an unanswered stores request and Leonie searching for a missing pen. Eva invited them closer anyway. Markus suggested saving the shortages for another visit; the children had come to see what their work might become. One apprentice asked whether a pilot could refuse an unsafe aircraft. The room became attentive in a way no display flight could have achieved. Leonie could offer the answer printed in the rules. She could also explain the much less tidy work required to make that answer possible when other people were already waiting."
 ac_sq.105.a:0 "Explain how a refusal is made to hold."
 ac_sq.105.a.reply:0 "Eva asks an apprentice to find the second signature, turning a difficult answer into something they can practice."
 ac_sq.105.b:0 "Give them a day to remember with pride."
 ac_sq.105.b.reply:0 "Markus helps an apprentice into a cockpit and the questions become easier for everyone to answer."
 ac_sq.106.t:0 "The Missing Verb"
 ac_sq.106.d_war_callback:0 "The controller gave Leonie a heading, then stopped long enough for her to hear somebody arguing on another circuit. The flight had an instruction to protect a moving column and no agreed answer for the aircraft approaching it. Markus held formation without asking the question a second time. From the hut, Tomas read the uncertain identification exactly as it appeared on his screen. Leonie could request a stopping condition while the situation changed, or accept responsibility for a conservative limit the flight would keep together. Neither choice could supply the information they lacked. The danger was allowing the speed of an order to become evidence of its completeness.\n\nThe blank sheet Eva offered years earlier is still in the hut. Leonie uses its clean margin to write the unanswered question."
 ac_sq.106.d_war:0 "The controller gave Leonie a heading, then stopped long enough for her to hear somebody arguing on another circuit. The flight had an instruction to protect a moving column and no agreed answer for the aircraft approaching it. Markus held formation without asking the question a second time. From the hut, Tomas read the uncertain identification exactly as it appeared on his screen. Leonie could request a stopping condition while the situation changed, or accept responsibility for a conservative limit the flight would keep together. Neither choice could supply the information they lacked. The danger was allowing the speed of an order to become evidence of its completeness."
 ac_sq.106.d_base_callback:0 "The new instruction described what the flight was expected to achieve and omitted the point at which it should stop. Leonie read it twice before showing Tomas. He found three possible meanings and disliked the most convenient one. Markus reminded them that somebody above the hut had surely considered the same questions. Eva was less interested in somebody than in a name. Outside, a tug moved an aircraft into position, its driver waiting for a signal the room had not yet agreed to give. Leonie understood how quickly a request for clarification could begin to look like reluctance. She also understood how easily a blank space could become a pilot's responsibility afterward.\n\nThe blank sheet Eva offered years earlier is still in the hut. Leonie uses its clean margin to write the unanswered question."
 ac_sq.106.d_base:0 "The new instruction described what the flight was expected to achieve and omitted the point at which it should stop. Leonie read it twice before showing Tomas. He found three possible meanings and disliked the most convenient one. Markus reminded them that somebody above the hut had surely considered the same questions. Eva was less interested in somebody than in a name. Outside, a tug moved an aircraft into position, its driver waiting for a signal the room had not yet agreed to give. Leonie understood how quickly a request for clarification could begin to look like reluctance. She also understood how easily a blank space could become a pilot's responsibility afterward."
 ac_sq.106.a:0 "Request a written stopping condition."
 ac_sq.106.a.reply:0 "Tomas keeps the line open while Leonie waits; Eva records the restriction beside the unresolved instruction."
 ac_sq.106.b:0 "Agree a conservative limit within the flight."
 ac_sq.106.b.reply:0 "Markus repeats their limit back to Leonie, making the private promise sound steadier than the instruction."
 ac_sq.107.t:0 "The Other Queue"
 ac_sq.107.d_war:0 "The buses at the perimeter carried people whose plans had ceased to include a return time. Their receiving point had a telephone, a clerk and no record of the instruction bringing them there. Markus watched the road while Leonie tried to explain the queue to somebody who wanted its length rather than its destination. Eva could keep the drivers supplied; Tomas could find a different line. What nobody could do was make sending the buses away the same as getting them somewhere safe. Leonie had to choose whether to wait for a named handover or trust the station's informal network before the queue made another problem for the people already waiting."
 ac_sq.107.d_base:0 "The buses at the perimeter were part of a civil-protection exercise, but the drivers' questions were not theoretical. Their instructions led to a gate whose receiving staff had never been told to expect them. The drivers had expected an official to turn the mistake into a quick apology. Leonie had only Markus, a growing queue and the knowledge that her own people were waiting too. Tomas could call the receiving point and risk exposing the confusion beyond the station. Eva could keep the buses supplied while the hut arranged a quieter solution. The exercise had finally tested something its timetable had left out: whether a person sent away had actually been received."
 ac_sq.107.a:0 "Ask for an acknowledged handover."
 ac_sq.107.a.reply:0 "Tomas waits for the receiving clerk's name before clearing the buses, and the delay becomes part of the record."
 ac_sq.107.b:0 "Use the crew's contacts to clear the queue."
 ac_sq.107.b.reply:0 "Eva finds water and Markus finds a helpful voice on another line; the buses move before the questions reach headquarters."
 ac_sq.108.t:0 "The Landing Nobody Applauded"
 ac_sq.108.d_training_return_callback:0 "Markus brought an aircraft back after abandoning the exercise. There was no spectacle to explain the decision: only a warning light, an unfamiliar vibration and a pilot who had elected not to wait for a second warning. The first joke in the hut died when Eva put the removed component on the table. Leonie knew that the debrief would become an example whether she intended it or not. A private assurance could protect Markus from being remembered as the man who turned back. An open account might protect the next pilot who needed to do the same, but only if the room could resist making the story about one person's nerve.\n\nEva sets the earlier bracket beside the new component. What was once an awkward restriction has become a comparison the whole room can understand."
 ac_sq.108.d_training_return:0 "Markus brought an aircraft back after abandoning the exercise. There was no spectacle to explain the decision: only a warning light, an unfamiliar vibration and a pilot who had elected not to wait for a second warning. The first joke in the hut died when Eva put the removed component on the table. Leonie knew that the debrief would become an example whether she intended it or not. A private assurance could protect Markus from being remembered as the man who turned back. An open account might protect the next pilot who needed to do the same, but only if the room could resist making the story about one person's nerve."
 ac_sq.108.d_war_callback:0 "The first burst tore a pale seam through the cloud ahead of Markus. Leonie saw his aircraft roll away before Tomas finished the warning. For several seconds she could hear only an open carrier and the hard sound of her own breathing. Then Markus answered, too calmly: vibration, a warning light, returning with his weapons still aboard. Leonie stayed above his damaged side while Tomas brought them toward a runway half hidden by rain. Markus missed the first approach. On the second, nobody spoke unless they had something he needed. His wheels finally touched beyond the threshold, one bright skip before the spray swallowed him. In the hut afterward, Eva put the removed component on the table. The first silence was worse than any joke Leonie had expected. They could make the decision to return part of an open debrief, or protect their wingman inside the flight's own account. Markus had come home. The example left by this landing would outlast the repair.\n\nEva sets the earlier bracket beside the new component. What was once an awkward restriction has become a comparison the whole room can understand."
 ac_sq.108.d_war:0 "The first burst tore a pale seam through the cloud ahead of Markus. Leonie saw his aircraft roll away before Tomas finished the warning. For several seconds she could hear only an open carrier and the hard sound of her own breathing. Then Markus answered, too calmly: vibration, a warning light, returning with his weapons still aboard. Leonie stayed above his damaged side while Tomas brought them toward a runway half hidden by rain. Markus missed the first approach. On the second, nobody spoke unless they had something he needed. His wheels finally touched beyond the threshold, one bright skip before the spray swallowed him. In the hut afterward, Eva put the removed component on the table. The first silence was worse than any joke Leonie had expected. They could make the decision to return part of an open debrief, or protect their wingman inside the flight's own account. Markus had come home. The example left by this landing would outlast the repair."
 ac_sq.108.d_base_callback:0 "Markus brought the simulator's aircraft back to its practice runway and ended the session before the next exercise began. The room had not moved, but a warning light and an unfamiliar vibration in the trainer's controls had been enough to make him stop. The first joke died when Eva put the removed feedback unit on the table. Leonie knew the debrief would become an example whether she intended it or not. A private assurance could protect Markus from being remembered as the man who turned back. An open account might protect the next pilot who needed to do the same, provided the room could resist making even a simulated landing a judgment of one person's nerve.\n\nEva sets the earlier bracket beside the new component. What was once an awkward restriction has become a comparison the whole room can understand."
 ac_sq.108.d_base:0 "Markus brought the simulator's aircraft back to its practice runway and ended the session before the next exercise began. The room had not moved, but a warning light and an unfamiliar vibration in the trainer's controls had been enough to make him stop. The first joke died when Eva put the removed feedback unit on the table. Leonie knew the debrief would become an example whether she intended it or not. A private assurance could protect Markus from being remembered as the man who turned back. An open account might protect the next pilot who needed to do the same, provided the room could resist making even a simulated landing a judgment of one person's nerve."
 ac_sq.108.a:0 "Make the decision the example."
 ac_sq.108.a.reply:0 "Markus stays while Eva explains the fault; the room learns to describe a safe return without an apology."
 ac_sq.108.b:0 "Protect him from the public debrief."
 ac_sq.108.b.reply:0 "Markus accepts Leonie's assurance with relief, while Eva keeps the removed part for another explanation."
 ac_sq.109.t:0 "The Slow Clock"
 ac_sq.109.d_capital_displaced:0 "Tomas finally repaired the hut's clock. For three days people arrived early, then began asking him whether it was right. He enjoyed the joke until he noticed how much effort everyone spent compensating for a familiar error, and how little they trusted its correction. Leonie found a similar pattern in the watch roster: the reliable people kept covering the same gaps because everyone knew they would. Markus called it experience. Eva called it a list of names that never got shorter. A working clock had made the station strangely uncomfortable. Leonie could restore the old accommodations or use the discomfort to ask what else their familiarity had concealed.\n\nThe capital district was no longer under their government's control. Tomas had stopped treating a working telephone as proof that an instruction came from the office named on its cover. Leonie asked him to retain both the original message and the route by which it arrived. Markus quietly found room for the extra folder beside his gloves."
 ac_sq.109.d_base:0 "Tomas finally repaired the hut's clock. For three days people arrived early, then began asking him whether it was right. He enjoyed the joke until he noticed how much effort everyone spent compensating for a familiar error, and how little they trusted its correction. Leonie found a similar pattern in the watch roster: the reliable people kept covering the same gaps because everyone knew they would. Markus called it experience. Eva called it a list of names that never got shorter. A working clock had made the station strangely uncomfortable. Leonie could restore the old accommodations or use the discomfort to ask what else their familiarity had concealed."
 ac_sq.109.a:0 "Rebuild the watch roster openly."
 ac_sq.109.a.reply:0 "Tomas puts the corrected times beside every name, including Leonie's, and waits for the objections without hiding them."
 ac_sq.109.b:0 "Keep the trusted watch together."
 ac_sq.109.b.reply:0 "Markus arranges another familiar exchange, and the next shift begins without the argument the new roster would have caused."
 ac_sq.110.t:0 "A Signature Below Hers"
 ac_sq.110.d_base_callback:0 "Eva had been asked to explain why several aircraft had remained unavailable longer than the summary suggested they should. Her answer listed the work, the missing parts and the signatures accepting each restriction. Leonie recognized how carefully Eva had avoided accusing anyone. The restraint made the answer more dangerous, not less. Markus offered to take her next watch while she prepared. Tomas offered copies of the relevant calls. Eva asked neither of them for a defense; she asked whether Leonie would sign below the account as somebody who had used the aircraft. A signature would make the record harder to dismiss and much harder to treat as somebody else's dispute.\n\nTomas includes the teaching tape they once chose not to edit. Its hesitation is now evidence that the restriction was understood at the time."
 ac_sq.110.d_base:0 "Eva had been asked to explain why several aircraft had remained unavailable longer than the summary suggested they should. Her answer listed the work, the missing parts and the signatures accepting each restriction. Leonie recognized how carefully Eva had avoided accusing anyone. The restraint made the answer more dangerous, not less. Markus offered to take her next watch while she prepared. Tomas offered copies of the relevant calls. Eva asked neither of them for a defense; she asked whether Leonie would sign below the account as somebody who had used the aircraft. A signature would make the record harder to dismiss and much harder to treat as somebody else's dispute."
 ac_sq.110.a:0 "Sign the account beside Eva."
 ac_sq.110.a.reply:0 "Eva reads the two names once, then returns to checking the dates instead of thanking Leonie for a favor."
 ac_sq.110.b:0 "Support her through the flight's private channels."
 ac_sq.110.b.reply:0 "Markus carries the explanation to someone who will listen, while Leonie's name stays outside the formal disagreement."
 ac_sq.111.t:0 "What the Tape Keeps"
 ac_sq.111.d_base:0 "The records room wanted the old recordings sorted into material worth retaining and material whose operational use had ended. Tomas brought a box to the hut because he could not explain the difference alone. Some tapes held nothing but routine exchanges; others contained voices whose owners had moved on. Markus found an exercise he remembered as a joke and sat down when he heard how tired he had sounded. Eva wanted the technical lessons kept. Leonie wondered whether a lesson could survive after every embarrassed voice had been removed from it. The box was too large for the shelf and too small to contain the years everyone had begun finding inside."
 ac_sq.111.a:0 "Keep complete examples with careful access."
 ac_sq.111.a.reply:0 "Tomas makes an index that explains who may listen and why, leaving the uncomfortable exchanges intact."
 ac_sq.111.b:0 "Keep the lessons and let the voices go."
 ac_sq.111.b.reply:0 "Eva helps prepare clean extracts; Markus leaves the room grateful that one exhausted watch will not follow him forever."
 ac_sq.112.t:0 "The Instructor's Seat"
 ac_sq.112.d_base_callback:0 "The apprentice who had once asked about refusing an aircraft returned wearing a service badge of her own. She remembered the visit differently from every adult in the hut. For Markus it had been a good day rescued from awkward questions; for Eva it had been the first time someone young had asked the right one aloud. The new technician wanted Leonie to sit in on her first briefing. Leonie could make the room reassuring by supplying the answer whenever the younger woman hesitated. She could also let the hesitation remain long enough for somebody else to learn how to ask for help without surrendering authority.\n\nThe technician still remembers where the second signature belonged. This time she asks Leonie to wait for it."
 ac_sq.112.d_base:0 "The apprentice who had once asked about refusing an aircraft returned wearing a service badge of her own. She remembered the visit differently from every adult in the hut. For Markus it had been a good day rescued from awkward questions; for Eva it had been the first time someone young had asked the right one aloud. The new technician wanted Leonie to sit in on her first briefing. Leonie could make the room reassuring by supplying the answer whenever the younger woman hesitated. She could also let the hesitation remain long enough for somebody else to learn how to ask for help without surrendering authority."
 ac_sq.112.a:0 "Let her finish the difficult explanation."
 ac_sq.112.a.reply:0 "The new technician finds the words herself; Eva waits beside the door instead of stepping in to save her."
 ac_sq.112.b:0 "Help her give the room confidence."
 ac_sq.112.b.reply:0 "Leonie fills the gap smoothly, and Markus tells the technician that nobody noticed the moment she feared."
 ac_sq.113.t:0 "A Second Way Through"
 ac_sq.113.d_base:0 "A communications test cut the hut off from the main circuit for twenty minutes. The backup worked only after Tomas called somebody who happened to be on another watch. Nobody had broken a rule; the exercise had simply found the person-shaped bridge between two incomplete instructions. Eva proposed training a second operator on each side. Markus warned that the people covering the extra sessions were already stretched. Leonie could accept a reliable informal contact or spend scarce attention making the route usable by somebody who did not know the right voice. The test report offered a square for successful and a square for failed. Neither described what had actually happened."
 ac_sq.113.a:0 "Train the route, not only the contact."
 ac_sq.113.a.reply:0 "Tomas asks the least familiar operator to make the next test call, and keeps the first failed attempt in the exercise notes."
 ac_sq.113.b:0 "Protect the dependable informal link."
 ac_sq.113.b.reply:0 "Markus finds cover for the familiar operators, preserving a connection everybody knows will work when they are present."
 ac_sq.114.t:0 "The Letter on the Shelf"
 ac_sq.114.d_base:0 "Markus left a letter beside his mug and forgot to take it home. Leonie saw only the first line before turning it over, but it was enough to explain why he had been volunteering for the less convenient watches. He did not want time off; he wanted a problem with a clear task and an ending. Eva offered neither advice nor a new shift. Tomas quietly pointed out that the roster could accommodate a change if somebody asked for one. Leonie could insist that Markus make the request himself, respecting the privacy he guarded, or offer the cover before he had to put his need into the language of an official absence."
 ac_sq.114.a:0 "Offer him time without demanding the story."
 ac_sq.114.a.reply:0 "Markus takes the letter and, after a long pause, accepts a watch he will not have to spend at the station."
 ac_sq.114.b:0 "Make the need visible in the roster."
 ac_sq.114.b.reply:0 "Tomas records a proper relief arrangement, and Markus learns that asking need not turn his private life into gossip."
 ac_sq.115.t:0 "The Unfinished Account"
 ac_sq.115.d_base_callback:0 "The airwaves carried more questions than the station could answer. Tomas started a list of verified information and left conspicuous spaces between the entries. A visiting official suggested closing those spaces with a reassuring summary. Markus understood the impulse: uncertainty was exhausting people who could do nothing with another warning. Eva asked what would happen when a promise made for comfort reached somebody who could act on it. Leonie had spent years learning how to stop an incomplete instruction from becoming a private burden. Now the same choice had acquired a public audience. The pen beside the summary was dry; Tomas had already offered his own and was waiting to see what would be written.\n\nLeonie remembers the landing they learned not to apologize for. Turning back from an unsupported promise can also be a professional decision."
 ac_sq.115.d_base:0 "The airwaves carried more questions than the station could answer. Tomas started a list of verified information and left conspicuous spaces between the entries. A visiting official suggested closing those spaces with a reassuring summary. Markus understood the impulse: uncertainty was exhausting people who could do nothing with another warning. Eva asked what would happen when a promise made for comfort reached somebody who could act on it. Leonie had spent years learning how to stop an incomplete instruction from becoming a private burden. Now the same choice had acquired a public audience. The pen beside the summary was dry; Tomas had already offered his own and was waiting to see what would be written."
 ac_sq.115.a:0 "Say clearly what remains unknown."
 ac_sq.115.a.reply:0 "Tomas reads the gaps aloud without filling them, and the people listening have room to ask their own questions."
 ac_sq.115.b:0 "Keep the public account steady and brief."
 ac_sq.115.b.reply:0 "Markus helps deliver a calm summary, while Eva keeps a separate list of the qualifications it cannot carry."
 ac_sq.116.t:0 "The Page They Will Use"
 ac_sq.116.d_base:0 "Eva gave Leonie a draft training page with the names removed. The procedure was sound, and almost impossible to recognize as something their own station had learned. Tomas's uncertain call had become a standard warning; Markus's abandoned exercise had become a successful precaution. Leonie felt proud, then uneasy. Cleaning the lesson had made the people behind it look as though they had always known what to do. Eva asked whether an apprentice reading the page would be able to admit being frightened. They could keep the elegant procedure intact or add a small account of the doubt that had made learning necessary in the first place."
 ac_sq.116.a:0 "Keep the doubt beside the procedure."
 ac_sq.116.a.reply:0 "Eva adds a short account in a different voice, leaving the checklist clear without pretending that its authors were infallible."
 ac_sq.116.b:0 "Let the procedure stand on its own."
 ac_sq.116.b.reply:0 "Markus recognizes the usefulness of a page nobody needs personal courage to quote."
 ac_sq.117.t:0 "People Beyond the Fence"
 ac_sq.117.d_shared_service_callback:0 "The station lent a room to a local emergency group for a joint exercise. Leonie expected questions about aircraft. Instead the visitors wanted to know who would answer after the usual office closed and whether a promised vehicle came with a driver. Tomas recognized the gaps immediately and looked almost pleased to have people name them before an alarm did. Markus worried that every clear answer would become another obligation for a small crew. Eva put out extra chairs without joining the argument. Helping could mean promising the station's own people again, or teaching the visitors how to reach a service that did not depend on this particular hut staying open.\n\nTheir alliance with Ustio made a joint training contact possible. Markus wanted to make the first call himself; Leonie asked him to send the questions in advance. They had learned enough about official friendship to know that a counterpart needed permission to refuse a request without becoming its enemy. Tomas left the reply channel open.\n\nThe honest roster makes it possible to name the next receiver without quietly promising the same tired person twice."
 ac_sq.117.d_shared_service:0 "The station lent a room to a local emergency group for a joint exercise. Leonie expected questions about aircraft. Instead the visitors wanted to know who would answer after the usual office closed and whether a promised vehicle came with a driver. Tomas recognized the gaps immediately and looked almost pleased to have people name them before an alarm did. Markus worried that every clear answer would become another obligation for a small crew. Eva put out extra chairs without joining the argument. Helping could mean promising the station's own people again, or teaching the visitors how to reach a service that did not depend on this particular hut staying open.\n\nTheir alliance with Ustio made a joint training contact possible. Markus wanted to make the first call himself; Leonie asked him to send the questions in advance. They had learned enough about official friendship to know that a counterpart needed permission to refuse a request without becoming its enemy. Tomas left the reply channel open."
