 NEC_nc_northern_routes_service_2_spirit:0 "Run an Approach Patrol Period"
 NEC_nc_northern_routes_service_2_spirit_desc:0 "The maritime reserve staff maintains this funded service for ninety days. Patrol harbour approaches on a published schedule that includes rescue duties. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
