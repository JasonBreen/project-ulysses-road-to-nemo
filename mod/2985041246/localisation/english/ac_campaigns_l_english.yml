 ac_camp.74.t:0 "The joke before the engine"
 ac_camp.74.desc:0 "Chopper was still talking when the mechanic pointed at the ladder. He put one hand against his chest with theatrical injury, as though a man being asked to climb into an aircraft had suffered an offense against the arts.\n\nGrimm laughed before he looked toward Nagase. She was watching the crew at the receiving end of the runway, where a vehicle had stopped in a place it was not supposed to stop. The driver moved it after a signal. Nagase kept watching until the path was clear.\n\n\"You could try saying something reassuring,\" Chopper told her.\n\n\"The runway is clear.\"\n\nThat made Grimm laugh again. Chopper accepted the answer with a small bow that the flight suit made awkward. By then the mechanic had begun smiling too, although he tried to conceal it by checking something he had already checked.\n\nBlaze was listening. The controller called for confirmation, and the small exchange dissolved into the ordinary sequence of people making certain that the next person had heard them. The island's preparations had given them somewhere to return. They still had to bring the aircraft back to it.\n\nNagase waited beside the ladder until the crew chief finished. Then she glanced across at the other aircraft. The joke had not made the task smaller. It had reminded the people preparing for it that the voices inside those machines belonged to people they knew.\n\nWhen the first engine caught, Grimm looked toward the cleared runway once more. Chopper was finally quiet, busy with the work he had spent the previous minute pretending was an interruption."
 ac_camp.74.a:0 "Keep this account."
 ac_camp.74.z:0 "Close this old message."
