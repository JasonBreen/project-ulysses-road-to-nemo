 ac_snp.49.t:0 "The Work Left on the Schedule"
 ac_snp.49.d:0 "The planner returns with a completed inspection period and the jobs that remained on the schedule. The final record does not describe those jobs as free capacity. It explains which reservation took priority and what the workshop received in return. The standing compact improves the selected receiving or order policy while retaining its continuing burden. The command representative asks that a later allocation not erase the maintenance line simply because the period has closed. The civil member agrees. Neither side will inherit a factory, a productive shift or a skilled worker that the national programme did not physically possess.\n\n[YUK_snp_industrial_orders_response_context]\n[YUK_snp_industrial_orders_period_context]\n[YUK_snp_industrial_orders_policy_context]"
 ac_snp.49.a:0 "File the assessment with its unresolved questions."
