 ac_wc_soa.11.t:0 "The Aircraft Waiting for Parts"
 ac_wc_soa.12.d:0 "Concentrating crews makes training cheaper and the flightline more vulnerable. The government can protect warning coverage, distribute maintenance capacity, or train the force to operate from temporary sites.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
 ac_wc_soa.12.defer:0 "Return the proposal to the staff"
