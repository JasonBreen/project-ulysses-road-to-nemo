l_english:
 ac_rp_replacements:0 "Replacement Production"
 ac_rp_replacements_desc:0 "Read the starting replacement allocations before changing a line. Use Production to make the manual switches described here. Losses, damaged industry and disrupted trade can change the balance."
 EMM_rp_production_notes:0 "Emmerian Replacement Plan"
 EMM_rp_production_notes_desc:0 "Twelve military factories support ground equipment. One aviation factory replaces fighters and one replaces close air support aircraft. The six dockyards are assigned to one convoy line, three escort yards, one submarine yard and one patrol-cruiser yard. All four naval roles have starting production; they still depend on materials, repairs and available crews."
 EVA_rp_production_notes:0 "Estovakian Replacement Plan"
 EVA_rp_production_notes_desc:0 "Fourteen military factories support ground equipment. One aviation factory replaces fighters and one replaces close air support aircraft. Each of the four dockyards supports a different role: convoys, escorts, coastal submarines and patrol cruisers. Expanding one role requires capacity from another unless more industry becomes available."
 SNS_rp_production_notes:0 "San Salvacion Replacement Plan"
 SNS_rp_production_notes_desc:0 "The five military factories support one line each for infantry equipment, support equipment, artillery, fighters and close air support aircraft. Keep one dockyard on convoys. The other begins on escorts; switch that combat line to coastal submarines when necessary, then restore escort production. The fielded submarine is not a stored replacement hull. Escort and submarine replacements do not run simultaneously on this budget."
 AMB_rp_production_notes:0 "Amber Replacement Plan"
 AMB_rp_production_notes_desc:0 "The four military factories support infantry equipment, support equipment, artillery and one aviation line. Aviation begins on close air support. The fielded 36 fighters have 12 reserve fighters, while the fielded 12 close air support aircraft have 6 reserve aircraft. Switch the aviation line between fighters and close air support as losses require. Keep one dockyard on convoys and manually switch the other between escorts and coastal submarines. The fielded submarine is not a stored replacement hull. These competing roles cannot all receive production at once."
 UGE_rp_production_notes:0 "Ugellas Replacement Plan"
 UGE_rp_production_notes_desc:0 "The single dockyard begins on convoys. The two escorts are the fielded fleet, with no stored replacement hulls. To replace an escort, switch the dockyard to the available coastal-escort design in Production and resume convoys after the replacement. Escort construction pauses convoy output. Plan construction around transport losses and the fleet's condition."
 DEL_rp_production_notes:0 "Delarus Replacement Plan"
 DEL_rp_production_notes_desc:0 "The single dockyard begins on convoys. The two escorts are the fielded fleet, with no stored replacement hulls. Switch the yard to the available coastal-escort design when a replacement is needed, then restore convoy output. Both roles draw on the same yard; neither can receive concurrent production during the other's construction."
 ac_rp_reference_only:0 "Production reference. Change the line in the Production screen; this note does not switch factories or dockyards."
