 BLK_camp_1_register:0 "A government and a network"
 BLK_camp_1_register_desc:0 "A government and a network. Open the campaign lane and its preparation record.\n\nThe government possesses buildings, ranks and a legal chain of responsibility. A network possesses favors that can outlive the office in which they were granted. They sometimes employ the same people. Protecting an independent investigation weakens the claim that national loyalty requires silence. Supporting the channel spends public capacity on an authority that will not be accountable through ordinary institutions. The player chooses which work receives protection. The resulting operations preserve the difference between the state, its population, and the people acting in secret."
