 ac_snp.48.t:0 "A Hundred Points with Responsible Offices"
 ac_snp.48.d:0 "The messenger brings back the first docket together with the completed receiving period. Its original reservation can now be traced to an office, a release decision and the work that actually followed. The allocation still totals one hundred. The improvement is that neither side can claim the same unreserved share without showing what it would displace. The standing settlement preserves the selected civil or command priority and its continuing cost. The secretariat retains the returned docket because it records a limit that the clean final table cannot show by itself: allocating responsibility is useful only when an office remains available to receive the complaint.\n\n[YUK_snp_allocation_response_context]\n[YUK_snp_allocation_period_context]\n[YUK_snp_allocation_policy_context]\n[ac_snp_yuk_intervention_context]\n[ac_snp_yuk_command_context]"
