 NEC_nc_northern_routes_service_1_spirit_desc:0 "The maritime authority maintains this funded service for ninety days. Keep rescue coordination, weather reporting and standby crews ready for a season. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
