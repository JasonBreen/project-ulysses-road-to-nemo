 ac_camp.93.t:0 "The originals kept elsewhere"
 ac_camp.93.desc:0 "The witness asked whether the case was finished. The investigator said that the immediate operation had ended and watched him discover how much distance could remain between those two answers.\n\nThe network had not preserved the strategic success its supporters sought. In some offices the investigation had stopped a plan before it could acquire the appearance of authority. In others it had assembled enough of the surviving record for a private assurance to become a question somebody was required to answer in public.\n\nThere would be arguments about which description was correct. The investigator had already received several suggestions that a complete national reconciliation would be easier if certain details remained sealed. He asked whether the people proposing the seal intended to protect witnesses or to protect the institutions that had made the witnesses necessary.\n\nThe originals were being kept elsewhere. That arrangement had seemed inconvenient at the beginning of the inquiry and had become one of the reasons the inquiry survived. A second receiving point could not guarantee honesty. It could make dishonesty require another person to agree.\n\nOutside the building, staff were returning the borrowed rooms to their ordinary purposes. The witness stood beside the door until the investigator asked whether he needed help with the journey home.\n\nHe said that he did. It was a smaller request than the one with which the case had begun, and the investigator was relieved to discover that he could give it a concrete answer without promising anything on behalf of the whole country."
