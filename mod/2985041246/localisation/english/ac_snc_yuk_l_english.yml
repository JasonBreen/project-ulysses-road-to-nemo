 YUK_snc_scientific_custody_renew:0 "Renew: Where the Method Was Received"
 YUK_snc_scientific_custody_renew_desc:0 "Reopen this interrupted review at the present date for ten political power and two institutional-capacity points. It requires a new corresponding funded period; no old work is retroactively credited and the service pays its own usual costs."
 YUK_snc_scientific_custody_renew_effect_tt:0 "Commit ten political power and two institutional-capacity points to reopen this interrupted review at the present date. A new corresponding funded service must still complete its usual paid work after this request."
 YUK_snc_scientific_custody_renew_requirements_tt:0 "This national review was interrupted before completion. Its protocol is complete, no replacement request is open, and ten political power plus two institutional-capacity points are available."
 YUK_snc_civil_receiving_civil_spirit:0 "Civil receiving floor"
 YUK_snc_civil_receiving_civil_spirit_desc:0 "Protect a civil receiving floor inside the existing allocation, rather than ask ordinary services to survive on whatever the protected schedule leaves unspecified. The policy improves repair continuity while reducing the readiness margin available elsewhere. Its representatives must identify the work that belongs within the floor and answer when another claimant challenges that description. The government is not creating a second pool of capacity. It is making a priority visible enough that a later emergency request cannot silently consume it while leaving the receiving office responsible for a promise it no longer has the means to keep."
 YUK_snc_civil_receiving_civil_spirit_settled:0 "Civil receiving floor: Standing Review"
 YUK_snc_civil_receiving_civil_spirit_settled_desc:0 "Retain the selected civil or command priority as standing receiving practice, improved by the completed review and accompanied by its continuing burden. The office can use that method even when a foreign partner refuses, a hoped-for arrangement becomes impossible or the security situation remains unresolved. Its conclusion is about how the government answers its current obligations. It does not require a national victory, a historical deadline or another country's acceptance to become useful. A successor will inherit the reason for the priority, the name of its recipient and the waiting request that the completed account deliberately kept in view."
 YUK_snc_civil_receiving_protected_spirit:0 "Bounded command receiving claim"
 YUK_snc_civil_receiving_protected_spirit_desc:0 "The command liaison proposes retaining a bounded priority whose receiving office must explain each renewal. Protect that claim while keeping the civilian opportunity cost beside it. The choice can improve professional readiness, but cannot turn every difficult condition into an instruction to postpone the same ordinary services indefinitely. A claimant who receives no window still deserves an answer that identifies the authority and the reason. The government's inherited intervention and command structure remain in force. This new policy concerns how their present obligations are received, not how their earlier choices should be remembered differently."
 YUK_snc_civil_receiving_protected_spirit_settled:0 "Bounded command receiving claim: Standing Review"
 YUK_snc_civil_receiving_protected_spirit_settled_desc:0 "Retain the selected civil or command priority as standing receiving practice, improved by the completed review and accompanied by its continuing burden. The office can use that method even when a foreign partner refuses, a hoped-for arrangement becomes impossible or the security situation remains unresolved. Its conclusion is about how the government answers its current obligations. It does not require a national victory, a historical deadline or another country's acceptance to become useful. A successor will inherit the reason for the priority, the name of its recipient and the waiting request that the completed account deliberately kept in view."
 YUK_snc_civil_receiving_brief:0 "The Request behind the Priority"
 YUK_snc_civil_receiving_brief_desc:0 "A protected priority has been renewed three times while the civil receiving office keeps the same unanswered request at the bottom of its schedule. The command liaison says the situation remains difficult. The secretary agrees, then asks whether that difficulty explains the priority or has become a substitute for answering the request. Review the present distribution responsibility from the existing national settlement. The work remains useful in peace, external danger or prolonged warfare. It asks which offices receive current needs, who can amend an allocation, and how the people waiting will learn that their claim has actually been heard."
 YUK_snc_civil_receiving_brief_requirements_tt:0 "From 2010.1.1, an active national administration and the required earlier work are available. The selected policy remains exclusive; conclusions remain available when their real prerequisites finish after the expected calendar."
 YUK_snc_civil_receiving_brief_effect_tt:0 "Open the named national continuation from its earned prior settlement."
