 ac_camp.79.t:0 "The engine nobody started"
 ac_camp.79.desc:0 "Four stopped beside the aircraft and waited for the maintenance chief to look up. The chief kept working for several seconds because she wanted to finish the inspection entry before beginning the argument.\n\nThe reserve aircraft would remain in the hangar. The command had funded the maintenance period and accepted its immediate cost. The operations room had subsequently found several persuasive reasons why the original decision ought to be reconsidered.\n\n\"Are you going to tell me it is nearly ready?\" Four asked.\n\n\"When it is ready.\"\n\nThe answer made Four smile despite herself. Beyond them, a crew was preparing another aircraft for work that would otherwise have been hers. She watched them longer than the chief expected.\n\nThere was no comfortable way to be the person whose safety required somebody else to undertake a useful task. There was also no honest way for a mechanic to repair that discomfort by releasing a machine she would not sign for. The chief explained what had been done and what still required inspection. Four asked questions that showed she had been listening through the argument.\n\nWhen the pilot left, the chief went back to the same entry. The work had not advanced while they talked, but the conversation had made its purpose easier to recognize.\n\nOutside, an engine started and settled into a familiar sound. The aircraft inside the hangar remained quiet. Keeping it that way had required an instruction, a paid period of work and two people willing to carry the awkwardness of a decision made before its consequences could be known."
