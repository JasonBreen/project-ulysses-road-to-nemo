l_english:
 ac_factions_rule:0 "Councils and charters"
 ac_factions_rule_group:0 "Project Ulysses"
 ac_factions_enabled:0 "Enabled"
 ac_factions_enabled_desc:0 "From 1995, negotiate military blocs, organize national and corporate councils, and establish councils within your alliance."
 ac_factions_disabled:0 "Disabled"
 ac_factions_disabled_desc:0 "Continue with the campaign's existing diplomacy and political systems."
 ac_fac_bloc_name:0 "Mutual Defence Compact"
 ac_fac_diplomacy:0 "Alliance Diplomacy"
 ac_fac_diplomacy_desc:0 "Negotiate a common charter and invite independent partners. Existing alliances can continue to use the diplomacy screen. Membership does not move borders or settle ongoing wars."
 ac_fac_councils:0 "National and Corporate Councils"
 ac_fac_councils_desc:0 "Civil administration: [?ac_fac_civic|0] / Security services: [?ac_fac_security|0] / Industry: [?ac_fac_industry|0].\nCorporate engineering: [?ac_corp_engineering|0] / Operations: [?ac_corp_operations|0] / Board: [?ac_corp_board|0].\nEach council holds 100 influence. Supporting one group transfers up to five influence from each other group. A group above 70 influence imposes a 5% political power penalty."
 ac_sub_council:0 "Alliance Councils"
 ac_sub_council_desc:0 "Create a council inside your military alliance. Full members share the parent alliance and invest in joint programs. Independent associates receive half the program benefits without joining the military bloc.\nFull-member investments: mobility [?ac_sub_support_mobility|0], procurement [?ac_sub_support_procurement|0], research [?ac_sub_support_research|0]. Each program needs the chair's investment, another full member's investment and the chair's approval."
 ac_fac_council_modifier:0 "Council Influence"
 ac_fac_council_modifier_desc:0 "The balance of civilian, security and industrial interests shapes national policy. Engineering, operations and board priorities shape the participating companies' work."
 ac_sub_program_modifier:0 "Alliance Council Programs"
 ac_sub_program_modifier_desc:0 "Shared logistics, procurement and research programs. Associates receive half the full-member benefit. Benefits require continuing eligibility."
 ac_fac_found_bloc_decision:0 "Propose a mutual defence charter"
 ac_fac_found_bloc_decision_desc:0 "Establish an alliance under our leadership. Invitations require each partner's consent. The compact is a negotiated arrangement and claims no historic membership."
 ac_fac_invite_decision:0 "Invite [FROM.GetNameDef] to the compact"
 ac_fac_invite_decision_desc:0 "Offer independent membership. The invitation expires within a month. Membership is checked again when the government responds."
 ac_fac_leave_decision:0 "Withdraw from the military alliance"
 ac_fac_leave_decision_desc:0 "Leave the parent bloc while at peace. Any full council membership that requires this alliance will end."
 ac_fac_dissolve_bloc_decision:0 "Dissolve the compact"
 ac_fac_dissolve_bloc_decision_desc:0 "End our compact while all its members are at peace. Council benefits that depend on the alliance will end."
 ac_fac_coordination_decision:0 "Hold an alliance coordination session"
 ac_fac_coordination_decision_desc:0 "Contribute 10 initiative to the alliance and gain 5 faction influence. Three sessions fulfill the compact's coordination goal."
 ac_fac_joint_research_decision:0 "Open the alliance research directorate"
 ac_fac_joint_research_decision_desc:0 "Authorize alliance research after an alliance council establishes its research program. Further programs use the alliance interface and its normal costs."
 ac_fac_joint_command_decision:0 "Authorize joint military operations"
 ac_fac_joint_command_decision_desc:0 "Authorize alliance military operations after a council establishes its mobility program. Further upgrades use the alliance interface and its normal costs."
 ac_fac_spymaster_decision:0 "Nominate [FROM.GetNameDef] as intelligence coordinator"
 ac_fac_spymaster_decision_desc:0 "Appoint an allied government with an intelligence agency as the alliance's spymaster."
 ac_corp_mio_workshop_decision:0 "Convene the industrial research workshop"
 ac_corp_mio_workshop_decision_desc:0 "Provide 25 funds to each visible domestic military industrial organization. Engineering must hold at least 40 corporate influence."
 ac_sub_found_decision:0 "Establish an alliance council"
 ac_sub_found_decision_desc:0 "Form a council within our existing alliance. The chair is its first full member. Other members must accept invitations before they participate."
 ac_sub_invite_full_decision:0 "Offer [FROM.GetNameDef] a full council seat"
 ac_sub_invite_full_decision_desc:0 "Invite an independent member of our military alliance to invest in and benefit from council programs."
 ac_sub_invite_associate_decision:0 "Offer [FROM.GetNameDef] an associate seat"
 ac_sub_invite_associate_decision_desc:0 "Invite an independent neutral or allied government. Associates receive half the program benefits and cannot invest, chair the council or authorize its programs."
 ac_sub_leave_decision:0 "Leave the alliance council"
 ac_sub_leave_decision_desc:0 "End council membership and its program benefits. Investments already spent are not refunded. Parent alliance membership is unaffected."
 ac_sub_dissolve_decision:0 "Dissolve the alliance council"
 ac_sub_dissolve_decision_desc:0 "End every seat and program in our council. Outstanding invitations become invalid. Parent alliance membership is unaffected."
 ac_sub_transfer_decision:0 "Transfer the chair to [FROM.GetNameDef]"
 ac_sub_transfer_decision_desc:0 "Transfer the programs and all current seats to a valid full member. Outstanding invitations from the former chair become invalid."
 ac_factions.1.t:0 "A mutual defence proposal"
 ac_factions.1.d:0 "[FROM.GetNameDefCap] proposes that we join its military compact. The government must decide whether the common charter serves our interests."
 ac_factions.2.t:0 "An alliance council invitation"
 ac_factions.2.d:0 "[FROM.GetNameDefCap] offers us a full seat in a council within our military alliance. Full members may invest in its programs and share their benefits."
 ac_factions.3.t:0 "An associate council invitation"
 ac_factions.3.d:0 "[FROM.GetNameDefCap] offers us an associate seat in its alliance council. We would share part of its program benefits without taking on a full member's obligations."
 ac_factions.accept:0 "Accept the invitation."
 ac_factions.decline:0 "Decline the invitation."
 ac_fac_power_balance:0 "Civil and Security Mandates"
 ac_fac_civic_side:0 "Civil Administration"
 ac_fac_security_side:0 "Security Establishment"
 ac_fac_balanced_range:0 "Shared mandate"
 ac_fac_civic_range:0 "Civil mandate"
 ac_fac_security_range:0 "Security mandate"
 ac_fac_joining_rule:0 "Independent partners"
 ac_fac_joining_rule_desc:0 "Independent countries that are not at war with the alliance leader may seek membership."
 ac_fac_call_rule:0 "Coordinated war calls"
 ac_fac_call_rule_desc:0 "The alliance leader coordinates calls to war."
 ac_fac_manifest_name:0 "Common Defence Charter"
 ac_fac_manifest_desc:0 "Build a compact of four sovereign partners. This charter records a negotiated alliance rather than a claim to any country's territory."
 ac_fac_coordination_goal_name:0 "Regular Coordination"
 ac_fac_coordination_goal_desc:0 "Hold three alliance coordination sessions."
 ac_fac_program_goal_name:0 "Shared Capabilities"
 ac_fac_program_goal_desc:0 "Establish mobility, procurement and research programs in an alliance council."
 ac_fac_support_civic_decision:0 "Support civil administration"
 ac_fac_support_civic_decision_desc:0 "Transfer up to five influence from each other group in this council. The council must wait 30 days before arranging another redistribution."
 ac_fac_support_security_decision:0 "Support security services"
 ac_fac_support_security_decision_desc:0 "Transfer up to five influence from each other group in this council. The council must wait 30 days before arranging another redistribution."
 ac_fac_support_industry_decision:0 "Support industrial interests"
 ac_fac_support_industry_decision_desc:0 "Transfer up to five influence from each other group in this council. The council must wait 30 days before arranging another redistribution."
 ac_corp_support_engineering_decision:0 "Support the engineering directorates"
 ac_corp_support_engineering_decision_desc:0 "Transfer up to five influence from each other group in this council. The council must wait 30 days before arranging another redistribution."
 ac_corp_support_operations_decision:0 "Support the operations divisions"
 ac_corp_support_operations_decision_desc:0 "Transfer up to five influence from each other group in this council. The council must wait 30 days before arranging another redistribution."
 ac_corp_support_board_decision:0 "Support the corporate boards"
 ac_corp_support_board_decision_desc:0 "Transfer up to five influence from each other group in this council. The council must wait 30 days before arranging another redistribution."
 ac_sub_invest_mobility_decision:0 "Invest in joint mobility"
 ac_sub_invest_mobility_decision_desc:0 "Commit this government's support once during its membership. Costs 35 political power and, when the fiscal ledger is active, 2 treasury units. Unpaid bills block fiscal investment. Security influence must be at least 30."
 ac_sub_enact_mobility_decision:0 "Authorize the joint mobility program"
 ac_sub_enact_mobility_decision_desc:0 "Requires the chair's investment and an investment from another current full member. Full members gain 3% lower supply consumption. Associates receive half the benefit. The program has one level and remains active while the council exists."
 ac_sub_invest_procurement_decision:0 "Invest in joint procurement"
 ac_sub_invest_procurement_decision_desc:0 "Commit this government's support once during its membership. Costs 35 political power and, when the fiscal ledger is active, 2 treasury units. Unpaid bills block fiscal investment. Industry influence must be at least 30."
 ac_sub_enact_procurement_decision:0 "Authorize the joint procurement program"
 ac_sub_enact_procurement_decision_desc:0 "Requires the chair's investment and an investment from another current full member. Full members gain 5% production efficiency growth. Associates receive half the benefit. The program has one level and remains active while the council exists."
 ac_sub_invest_research_decision:0 "Invest in joint research"
 ac_sub_invest_research_decision_desc:0 "Commit this government's support once during its membership. Costs 35 political power and, when the fiscal ledger is active, 2 treasury units. Unpaid bills block fiscal investment. Corporate engineering influence must be at least 30."
 ac_sub_enact_research_decision:0 "Authorize the joint research program"
 ac_sub_enact_research_decision_desc:0 "Requires the chair's investment and an investment from another current full member. Full members gain 2% research speed. Associates receive half the benefit. The program has one level and remains active while the council exists."
