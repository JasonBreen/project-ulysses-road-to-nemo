 SNS_up_response_review_done:0 "Review the Response Record completed"
 SNS_up_response_review_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Advance this service's completed milestone to 3/4."
