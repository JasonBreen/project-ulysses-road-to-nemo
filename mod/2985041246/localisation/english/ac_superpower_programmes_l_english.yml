 YUK_snp_logistics_policy_context_2:0 "The standing policy is command dispatch capacity. Its continuing opportunity cost remains in the national schedule."
 ac_snp.20.t:0 "Two Receiving Windows in the Depot Exercise"
 ac_snp.20.d:0 "The depot exercise gives a trainee two dispatch requests and one receiving window. He places both requests on the board and waits for the instructor to identify the more important seal. The instructor asks instead which office has reserved the staff. A civil dispatcher proposes protecting district delivery windows until an exception is accepted by their receiving desk. The command liaison proposes a protected support allocation with a recorded duty to explain displaced civilian work. Both rules can produce a refusal. The trainee asks whether that would count as failing the exercise. The committee must decide whether its receiving record is allowed to show a responsible limit before it records another promise.\n\n[YUK_snp_logistics_policy_context]"
 ac_snp.20.a:0 "Protect district windows until their receiving office accepts an exception."
 ac_snp.20.a_effect_tt:0 "Move up to five existing allocation points toward civil receiving offices, protecting active reservations. The two shares still total one hundred."
 ac_snp.20.b:0 "Reserve command dispatch and record every displaced civil reservation."
 ac_snp.20.b_effect_tt:0 "Move up to five existing allocation points toward command support, protecting active reservations. The two shares still total one hundred."
