 ac_camp.100.t:0 "The map beside the kitchen"
 ac_camp.100.desc:0 "The officer who signs an occupation order will rarely see the kitchen in which it is read. On his map the district has a boundary and a reporting time. In the kitchen it has a mother who must cross that boundary, an injured neighbor, and a shopkeeper deciding whether tomorrow's bread is worth another argument at the checkpoint. Civil guarantees require the command to discipline its own men. Military discretion is easier to issue and harder to recall. Either decision leaves a record that survives the campaign. The preparation branch authorizes specific work; it cannot conjure the cooperation that the garrison has spent months consuming."
 ac_camp.100.a:0 "Circulate a public receiving account."
 ac_camp.100.b:0 "Keep a signed professional return."
 ac_camp.100.z:0 "Close this old message."
