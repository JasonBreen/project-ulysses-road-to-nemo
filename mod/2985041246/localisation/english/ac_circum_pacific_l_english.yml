l_english:
 ac_cpw_ose_war_footing:0 "Osea at War"
 ac_cpw_ose_war_footing_desc:0 "The ACES Chronicle records Yuktobania's declaration of war on Osea for 27 September 2010 (2010 / 09.27). The federation is on a war footing until the fighting actually ends; this campaign fixes no end date."
 ac_cpw_yuk_war_footing:0 "Yuktobania at War"
 ac_cpw_yuk_war_footing_desc:0 "The ACES Chronicle records Yuktobania's declaration of war on Osea for 27 September 2010 (2010 / 09.27). The union is on a war footing until the fighting actually ends; this campaign fixes no end date."
 ac_cpw_yuk_submarine_carriers:0 "Scinfaxi and Hrimfaxi"
 ac_cpw_yuk_submarine_carriers_desc:0 "Two nuclear-powered submarine carriers are available (Super Weapons, Scinfaxi & Hrimfaxi). Their effect on naval coordination is provisional gameplay."
 ac_cpw_yuk_submarine_carrier:0 "Hrimfaxi Alone"
 ac_cpw_yuk_submarine_carrier_desc:0 "The Chronicle records the sinking of Scinfaxi at Sand Island (2010 / 10.04). One submarine carrier remains; the value is provisional gameplay."
 ac_cpw_ose_carrier_losses:0 "The Eaglin Straits Losses"
 ac_cpw_ose_carrier_losses_desc:0 "The Chronicle records the sinking of the Osean Maritime Defense Force carriers Vulture and Buzzard at Eaglin Straits (2010 / 09.30). Naval coordination suffers for ninety days; the value is provisional gameplay."
 ac_cpw_ose_arkbird_at_the_front:0 "The Arkbird at the Front"
 ac_cpw_ose_arkbird_at_the_front_desc:0 "Osea has sent the Arkbird to the front, as the Chronicle records (2010 / 09.30). The debris-clearing spacecraft now flies military missions; the modifier is provisional gameplay."
 ac_cpw_ose_arkbird_grounded:0 "The Arkbird Sabotaged"
 ac_cpw_ose_arkbird_grounded_desc:0 "The Chronicle records that explosives smuggled aboard the Arkbird destroyed its engines (2010 / 10.25). Repairs take eight weeks in this campaign; the duration is provisional gameplay."
 ac_cpw_ose_expeditionary_strain:0 "The Bastok Expedition"
 ac_cpw_ose_expeditionary_strain_desc:0 "Osean forces hold Yuktobanian ground; the Chronicle records the landing on the Bastok Peninsula (2010 / 11.01). Supply across the ocean strains the federation for ninety days; the value is provisional gameplay."
 ac_cpw_ose_dresdene_inquiry:0 "The Dresdene Inquiry"
 ac_cpw_ose_dresdene_inquiry_desc:0 "The Chronicle records that Osean aircraft fired on an engineering college in the Yuktobanian city of Dresdene (2010 / 11.02). In this campaign the federation opens an inquiry; the inquiry and its sixty-day cost are provisional gameplay."
 ac_cpw_ose_home_front_alert:0 "Home Front Alert"
 ac_cpw_ose_home_front_alert_desc:0 "The Chronicle records Yuktobanian attacks in the Osean Federation (2010 / 11.04 and 11.29). The federation's home defences stay on alert for sixty days; the value is provisional gameplay."
 ac_cpw_yuk_stronghold_lost:0 "Cruik Fortress Lost"
 ac_cpw_yuk_stronghold_lost_desc:0 "The Chronicle records the fall of Cruik Fortress, Yuktobania's final defensive stronghold (2010 / 12.06). Army organisation suffers for ninety days; the value is provisional gameplay."
 ac_cpw_ose_president_returns:0 "The President Returns"
 ac_cpw_ose_president_returns_desc:0 "The Chronicle records President Harling's rescue from imprisonment at Stier Castle in the Principality of Belka (2010 / 12.09). His return steadies the federation for ninety days; the value is provisional gameplay."
 ac_cpw_yuk_leadership_question:0 "The Leadership Question"
 ac_cpw_yuk_leadership_question_desc:0 "The Chronicle records that former Prime Minister Nikanor, imprisoned by the Yuktobanian military, was rescued (2010 / 12.23). The union's leadership is in question for sixty days; the value is provisional gameplay."
 ac_cpw_disarmament_appeal:0 "The Joint Appeal to Disarm"
 ac_cpw_disarmament_appeal_desc:0 "The Chronicle records Harling's and Nikanor's televised address asking their militaries to disarm (2010 / 12.30). The appeal weighs on both countries' will to fight until the fighting actually ends; the value is provisional gameplay."
 ac_cpw_ose_exchange_standing:0 "The Reciprocal Exchange Holds"
 ac_cpw_ose_exchange_standing_desc:0 "Both governments earned verified contact and open channels before the declaration the ACES Chronicle records for 27 September 2010 (2010 / 09.27), and that declaration did not come. This earned alternative is provisional gameplay."
 ac_cpw_yuk_exchange_standing:0 "The Reciprocal Exchange Holds"
 ac_cpw_yuk_exchange_standing_desc:0 "Both governments earned verified contact and open channels before the declaration the ACES Chronicle records for 27 September 2010 (2010 / 09.27), and that declaration did not come. This earned alternative is provisional gameplay."
 ac_cpw_yuk_mandate_kept:0 "A Declaration Withheld"
 ac_cpw_yuk_mandate_kept_desc:0 "Yuktobania's government withheld the declaration the ACES Chronicle records for 27 September 2010 (2010 / 09.27) under its own mandate. The restraint is honoured at home and questioned by the military for a year; this earned alternative is provisional gameplay."
 ac_cpw_ose_home_front:0 "Osea: Home Front Mobilised"
 ac_cpw_ose_home_front_desc:0 "The federation has mobilised its home front for 120 days. Industry and defences gain; consumer supply pays. Provisional gameplay."
 ac_cpw_yuk_home_front:0 "Yuktobania: Home Front Mobilised"
 ac_cpw_yuk_home_front_desc:0 "The union has mobilised its home front for 120 days. Industry and defences gain; consumer supply pays. Provisional gameplay."
 ac_cpw_ose_war_record:0 "Osea: The War Record"
 ac_cpw_ose_war_record_desc:0 "A public record of the Circum-Pacific War is being compiled for 180 days. It costs political attention and steadies a country that wants to know what happened. Provisional gameplay."
 ac_cpw_yuk_war_record:0 "Yuktobania: The War Record"
 ac_cpw_yuk_war_record_desc:0 "A public record of the Circum-Pacific War is being compiled for 180 days. It costs political attention and steadies a country that wants to know what happened. Provisional gameplay."
 ac_cpw.1.t:0 "Unidentified Aircraft at Cape Landers"
 ac_cpw.1.d:0 "Unidentified aircraft have appeared at Cape Landers, in Osea. The Osean Air Defense Force's Wardog Squadron engaged them, and only two aircraft survived.\n\nThe ACES Chronicle records the incident for 23 September 2010 (2010 / 09.23) and does not identify the aircraft or say whose the survivors were. This campaign asserts nothing beyond the record."
 ac_cpw.1.a:0 "Keep the coast under watch."
 ac_cpw.2.t:0 "An SR-71 Over Osea"
 ac_cpw.2.d:0 "An unidentified SR-71 reconnaissance plane has appeared over Osea, and a Coastal Defense Force surface-to-air missile hit it (2010 / 09.24).\n\nThe Chronicle records the overflight and the hit; it names no owner. This campaign names none."
 ac_cpw.2.a:0 "Note the overflight."
 ac_cpw.3.t:0 "Yuktobania Declares War on Osea"
 ac_cpw.3.d:0 "Wardog Squadron engaged unidentified aircraft once more. Then Yuktobania declared war on Osea and attacked Port Saint Hewlett. The war the ACES Chronicle calls the Circum-Pacific War has begun (2010 / 09.27).\n\nThe Chronicle gives no reason for the declaration, and this campaign asserts none. The war ends when the fighting actually ends, not on a calendar date."
 ac_cpw.3.a:0 "The Pacific is at war."
 ac_cpw.4.t:0 "The Declaration That Did Not Come"
 ac_cpw.4.d:0 "27 September 2010 has passed without a Yuktobanian declaration of war. Both governments earned verified contact and open channels before the date the ACES Chronicle records for the declaration (2010 / 09.27), and the reciprocal exchange closed the route to it.\n\nThis is an earned alternative to the official record and is provisional gameplay. The two countries are not allied, and nothing prevents a later war by other means."
 ac_cpw.4.a:0 "Keep the channels open."
 ac_cpw.7.t:0 "Yuktobania Withholds the Declaration"
 ac_cpw.7.d:0 "Yuktobania's government has withheld the declaration of war that the ACES Chronicle records for 27 September 2010 (2010 / 09.27), under the mandate its own field answers and civil policy established.\n\nThis is an earned alternative to the official record and is provisional gameplay. Osea has made no corresponding undertaking; the restraint is Yuktobania's alone."
 ac_cpw.7.a:0 "Record the restraint."
 ac_cpw.8.t:0 "Osea and Yuktobania Already at War"
 ac_cpw.8.d:0 "On the date the ACES Chronicle gives for Yuktobania's declaration of war on Osea (2010 / 09.27), the two countries were already fighting one another by other means.\n\nThe Circum-Pacific War owner records that war and observes it from outside: it asserts none of the official course and issues no further dated news. The war's end will be recorded when the fighting actually stops."
 ac_cpw.8.a:0 "Observe the war as it is."
 ac_cpw.9.t:0 "Other Fighting Enters the Pacific War"
 ac_cpw.9.d:0 "A third country is now at war with Osea or Yuktobania. The war between the two is no longer the complete explanation of the fighting, and the Circum-Pacific War owner moves to external observation.\n\nThe dated news of the official course stops here. The war's end will still be recorded when the fighting between Osea and Yuktobania actually stops."
 ac_cpw.9.a:0 "Observe the wider war."
 ac_cpw.10.t:0 "The Circum-Pacific War Ends"
 ac_cpw.10.d:0 "The fighting between Osea and Yuktobania has stopped. Neither country capitulated.\n\nThe ACES Chronicle records the war's end on 31 December 2010, after the SOLG fell and Razgriz Squadron destroyed it and the Grabacr and Ofnir squadrons of the former Belkan Air Force (2010 / 12.31). This campaign records the end on the day the fighting actually ceased, which is today."
 ac_cpw.10.a:0 "Begin the accounting."
 ac_cpw.11.t:0 "Yuktobania Capitulates"
 ac_cpw.11.d:0 "Yuktobania has capitulated. The war between Osea and Yuktobania ends in an Osean victory.\n\nThe ACES Chronicle records a different end: a televised appeal to disarm (2010 / 12.30) and the war's end on 31 December 2010 (2010 / 12.31). This outcome is the actual result of the campaign, not the official one."
 ac_cpw.11.a:0 "Record the outcome."
 ac_cpw.12.t:0 "Osea Capitulates"
 ac_cpw.12.d:0 "Osea has capitulated. The war between Osea and Yuktobania ends in a Yuktobanian victory.\n\nThe ACES Chronicle records a different end: a televised appeal to disarm (2010 / 12.30) and the war's end on 31 December 2010 (2010 / 12.31). This outcome is the actual result of the campaign, not the official one."
 ac_cpw.12.a:0 "Record the outcome."
 ac_cpw.13.t:0 "The Fighting Between Osea and Yuktobania Stops"
 ac_cpw.13.d:0 "The fighting between Osea and Yuktobania has stopped. The Circum-Pacific War owner observed this war from outside and asserts nothing about how it was fought.\n\nThe ACES Chronicle's course for the war (2010 / 09.27 to 12.31) is not asserted here; the end is recorded on the day the fighting actually ceased."
 ac_cpw.13.a:0 "Record the cessation."
 ac_cpw.14.t:0 "The Arkbird Summit"
 ac_cpw.14.d:0 "The Arkbird Summit is held (ACES Chronicle, 2008 / 08.21). The Chronicle records the summit and nothing of its agenda or its result; this campaign adds nothing to the record.\n\nThe Arkbird itself remains the debris-clearing spacecraft completed under the joint Osean–Yuktobanian programme (Super Weapons, Arkbird)."
 ac_cpw.14.a:0 "Note the summit."
 ac_cpw.15.t:0 "The Arkbird Goes to the Front"
 ac_cpw.15.d:0 "Osea has sent the Arkbird to the front, as the ACES Chronicle records for 30 September 2010 (2010 / 09.30). The spacecraft built to clear Ulysses fragments now flies in a war.\n\nIts later fate follows the Chronicle only while the war keeps its official course."
 ac_cpw.15.a:0 "The Arkbird flies."
 ac_cpw.17.t:0 "Osea and Yuktobania Make Peace"
 ac_cpw.17.d:0 "Osea and Yuktobania have ended the war on the terms of the joint appeal to disarm. Neither country capitulated, and the peace moved no territory.\n\nThe ACES Chronicle records the appeal (2010 / 12.30) and the war's end on 31 December 2010 (2010 / 12.31); it does not record a negotiated peace. This earned peace is provisional gameplay, recorded on the day it was actually made."
 ac_cpw.17.a:0 "Record the peace."
 ac_cpw.20.t:0 "The Eaglin Straits"
 ac_cpw.20.d:0 "Scinfaxi, the first of Yuktobania's Scinfaxi-class submarines, has seen its first use in war. At Eaglin Straits the Osean Maritime Defense Force aircraft carriers Vulture and Buzzard were sunk (2010 / 09.30).\n\nThe ACES Chronicle also records that Osea sent the Arkbird to the front on this day; in this campaign that depends on whether the Arkbird was ever completed and on the federation's decision."
 ac_cpw.20.a:0 "Count the losses."
 ac_cpw.21.t:0 "Scinfaxi Sunk at Sand Island"
 ac_cpw.21.d:0 "The submarine carrier Scinfaxi has been sunk at Sand Island (2010 / 10.04).\n\nThe Chronicle records the sinking and names no unit; this campaign names none."
 ac_cpw.21.a:0 "One carrier remains."
 ac_cpw.22.t:0 "The Akerson Hill Incident"
 ac_cpw.22.d:0 "The ACES Chronicle records the Akerson Hill Incident for 22 October 2010 (2010 / 10.22). It gives the name only.\n\nThis campaign records the name and nothing else."
 ac_cpw.22.a:0 "Note the record."
 ac_cpw.23.t:0 "The Arkbird's Engines Destroyed"
 ac_cpw.23.d:0 "Smuggled explosives have destroyed the Arkbird's engines (2010 / 10.25).\n\nThe Chronicle does not say who smuggled them. The spacecraft is grounded for repair; in this campaign the repair takes eight weeks, which is provisional gameplay."
 ac_cpw.23.a:0 "Begin the repair."
 ac_cpw.24.t:0 "Osea Lands on the Bastok Peninsula"
 ac_cpw.24.d:0 "Osean forces control Yuktobanian territory. The ACES Chronicle records Osea's invasion of the southeastern Yuktobanian mainland on the Bastok Peninsula for 1 November 2010 (2010 / 11.01).\n\nThis campaign reports the landing only because Osean forces actually hold Yuktobanian ground; no territory was moved by script."
 ac_cpw.24.a:0 "Hold the beachhead."
 ac_cpw.25.t:0 "Dresdene"
 ac_cpw.25.d:0 "Osean aircraft have fired on an engineering college in the Yuktobanian city of Dresdene, with multiple fatalities (2010 / 11.02).\n\nThe Chronicle records the attack and the deaths. In this campaign the federation opens an inquiry; the inquiry and its cost are provisional gameplay."
 ac_cpw.25.a:0 "Open the inquiry."
 ac_cpw.26.t:0 "Nerve Gas in Bana"
 ac_cpw.26.d:0 "Yuktobanian special forces have used nerve gas in a terrorist attack in the Osean Federation's college city of Bana, and Yuktobanian forces have made a surprise attack on Apito International Airport in the Osean Federation (2010 / 11.04).\n\nThe Chronicle records both attacks. Home defences are on alert; their effect is provisional gameplay."
 ac_cpw.26.a:0 "Defend the home front."
 ac_cpw.27.t:0 "Hrimfaxi Sunk in the Razgriz Straits"
 ac_cpw.27.d:0 "The submarine carrier Hrimfaxi has been sunk in the Razgriz Straits (2010 / 11.14).\n\nBoth of Yuktobania's submarine carriers (Super Weapons, Scinfaxi & Hrimfaxi) are now lost."
 ac_cpw.27.a:0 "No carriers remain."
 ac_cpw.28.t:0 "Attack on the Peace Ceremony"
 ac_cpw.28.d:0 "Yuktobanian aircraft have attacked during a peace ceremony in the Osean Federation's November City (2010 / 11.29).\n\nThe Chronicle records the attack and nothing about who ordered it; this campaign asserts nothing more."
 ac_cpw.28.a:0 "Mourn, and keep the alert."
 ac_cpw.29.t:0 "Cruik Fortress Falls"
 ac_cpw.29.d:0 "Osean forces have brought down Cruik Fortress, Yuktobania's final defensive stronghold (2010 / 12.06).\n\nThis campaign reports the fall only because Osean forces actually hold Yuktobanian ground; the fortress is not mapped to a state."
 ac_cpw.29.a:0 "The road is open."
 ac_cpw.30.t:0 "President Harling Rescued"
 ac_cpw.30.d:0 "President Harling has been rescued from imprisonment at Stier Castle in the Principality of Belka, and Razgriz Squadron has formed, serving directly under the president (2010 / 12.09).\n\nThe Chronicle records the rescue, the place and the squadron. It does not say who held the president there, and this campaign does not."
 ac_cpw.30.a:0 "The president returns."
 ac_cpw.31.t:0 "The Arkbird Shot Down"
 ac_cpw.31.d:0 "The Arkbird, carrying a nuclear weapon, used atmospheric friction to manoeuvre towards an attack on the Yuktobanian city of Okchabursk and was shot down by Razgriz Squadron (2010 / 12.19).\n\nThe debris-clearing spacecraft is lost. The Chronicle does not say who armed it or sent it; this campaign records the loss and nothing else."
 ac_cpw.31.a:0 "The Arkbird is gone."
 ac_cpw.32.t:0 "Nikanor Rescued"
 ac_cpw.32.d:0 "Former Prime Minister Seryozha Viktrovich Nikanor, who was imprisoned by the Yuktobanian military, has been rescued (2010 / 12.23).\n\nThe Chronicle does not say who rescued him. The union's leadership is in question; the effect is provisional gameplay."
 ac_cpw.32.a:0 "Who governs Yuktobania?"
 ac_cpw.33.t:0 "The Battle of Ceres Ocean"
 ac_cpw.33.d:0 "The ACES Chronicle records the Battle of Ceres Ocean for 29 December 2010 (2010 / 12.29). It gives the name only.\n\nThis campaign records the name and nothing else."
 ac_cpw.33.a:0 "Note the record."
 ac_cpw.34.t:0 "The Joint Appeal to Disarm"
 ac_cpw.34.d:0 "The Osean aircraft carrier Kestrel has been sunk. President Harling and Prime Minister Nikanor have made a televised address asking their militaries to disarm, and a joint force is inspecting Gründer Industries facilities in the Osean trust territory of Sudentor, North Osea (2010 / 12.30).\n\nThe appeal weighs on both countries' will to fight. It does not end the war by itself: the fighting ends when it actually stops."
 ac_cpw.34.a:0 "Hear the appeal."
 ac_cpw.35.t:0 "The SOLG Falls"
 ac_cpw.35.d:0 "Astronomers have seen the SOLG falling. Razgriz Squadron has shot down the Grabacr and Ofnir squadrons of the former Belkan Air Force and destroyed the SOLG itself (2010 / 12.31). The Super Weapons record describes the SOLG as an Osean Cold War orbital railgun, abandoned after the Belkan War and revived by the Gray Men with a V2 warhead.\n\nThe ACES Chronicle ends the war here. This campaign records the end on the day the fighting between Osea and Yuktobania actually stops."
 ac_cpw.35.a:0 "Watch the sky."
 ac_cpw.5.t:0 "The Declaration of 27 September 2010"
 ac_cpw.5.d:0 "Osea's Wardog Squadron has engaged unidentified aircraft once more. The ACES Chronicle records that on this day Yuktobania declared war on Osea and attacked Port Saint Hewlett (2010 / 09.27). It records no reason for the declaration, and this campaign asserts none.\n\nThe government can declare the war the record describes, or withhold the declaration under its own mandate, if that mandate was earned: the field answers settled, a civil floor kept and the command reform or expeditionary assessment completed. Withholding is a provisional alternative to the official record."
 ac_cpw.5.a:0 "Declare war on Osea."
 ac_cpw.5.b:0 "Withhold the declaration under the mandate."
 ac_cpw.6.t:0 "The Arkbird and the Front"
 ac_cpw.6.d:0 "The carriers Vulture and Buzzard are lost in the Eaglin Straits. The ACES Chronicle records that Osea sent the Arkbird to the front on this day (2010 / 09.30).\n\nThe federation can send the debris-clearing spacecraft to the front, as the record says, or hold it back on its civil task. Holding it back is a provisional alternative; the Chronicle's later entries about the Arkbird then do not apply."
 ac_cpw.6.a:0 "Send the Arkbird to the front."
 ac_cpw.6.b:0 "Keep the Arkbird on debris duty."
 ac_cpw.16.t:0 "An Offer of Peace on the Appeal"
 ac_cpw.16.d:0 "[FROM.GetName] has offered to end the war on the terms of the joint appeal to disarm (2010 / 12.30): both governments stop fighting where they stand, with no capitulation and no transfer of territory.\n\nThe ACES Chronicle records the appeal and the war's end on 31 December 2010 (2010 / 12.31); it does not record a negotiated peace. The offer needed the offering government's own verification record. This earned route is provisional gameplay."
 ac_cpw.16.a:0 "Accept the peace."
 ac_cpw.16.b:0 "Fight on."
 ac_cpw_ose_crisis:0 "Osea: The Circum-Pacific War"
 ac_cpw_ose_crisis_desc:0 "[ac_cpw_status_text]\n\nThe war owner follows the ACES Chronicle's 2010 entries as reference anchors. It changes no territory, creates no unit and ends the war only when the fighting actually stops."
 OSE_cpw_home_front:0 "Mobilise the Home Front"
 OSE_cpw_home_front_desc:0 "Mobilise industry and home defences for 120 days while the war runs. Consumer supply pays for it. Once per war; provisional gameplay."
 OSE_cpw_war_record:0 "Compile the War Record"
 OSE_cpw_war_record_desc:0 "Compile a public record of the Circum-Pacific War over 180 days. It costs political attention and steadies the country. Once; provisional gameplay."
 OSE_cpw_accept_appeal:0 "Answer the Appeal: Offer Peace"
 OSE_cpw_accept_appeal_desc:0 "Offer Yuktobania an end to the war on the terms of the joint appeal to disarm: no capitulation and no transfer of territory. Yuktobania decides; a refused offer can be renewed after thirty days. Needs this government's own verification record. Earned route; provisional gameplay."
 ac_cpw_yuk_crisis:0 "Yuktobania: The Circum-Pacific War"
 ac_cpw_yuk_crisis_desc:0 "[ac_cpw_status_text]\n\nThe war owner follows the ACES Chronicle's 2010 entries as reference anchors. It changes no territory, creates no unit and ends the war only when the fighting actually stops."
 YUK_cpw_home_front:0 "Mobilise the Home Front"
 YUK_cpw_home_front_desc:0 "Mobilise industry and home defences for 120 days while the war runs. Consumer supply pays for it. Once per war; provisional gameplay."
 YUK_cpw_war_record:0 "Compile the War Record"
 YUK_cpw_war_record_desc:0 "Compile a public record of the Circum-Pacific War over 180 days. It costs political attention and steadies the country. Once; provisional gameplay."
 YUK_cpw_accept_appeal:0 "Answer the Appeal: Offer Peace"
 YUK_cpw_accept_appeal_desc:0 "Offer Osea an end to the war on the terms of the joint appeal to disarm: no capitulation and no transfer of territory. Osea decides; a refused offer can be renewed after thirty days. Needs this government's own verification record. Earned route; provisional gameplay."
 ac_cpw_status_0:0 "Ended: Yuktobania capitulated. The end the Chronicle records for 31 December 2010 did not occur."
 ac_cpw_status_1:0 "Ended: Osea capitulated. The end the Chronicle records for 31 December 2010 did not occur."
 ac_cpw_status_2:0 "Ended: peace on the terms of the joint appeal to disarm, offered on the offering government's own verification record (earned route, provisional gameplay). The Chronicle's 31 December 2010 end is a reference anchor."
 ac_cpw_status_3:0 "Ended: the fighting stopped without capitulation after the official course had run to the SOLG. The Chronicle's 31 December 2010 end is a reference anchor, not the day it stopped."
 ac_cpw_status_4:0 "Ended: the fighting stopped while the owner observed the war from outside."
 ac_cpw_status_5:0 "Ended: the fighting stopped without capitulation before the official course had run its length. The Chronicle's 31 December 2010 end is a reference anchor."
 ac_cpw_status_6:0 "Running: a peace on the appeal's terms was accepted, but the engine kept the war; the end will be recorded when the fighting stops."
 ac_cpw_status_7:0 "Running under external observation: other fighting entered the war, and the official course is no longer asserted."
 ac_cpw_status_8:0 "Running under external observation: Osea and Yuktobania were already at war when the Chronicle's declaration date came."
 ac_cpw_status_9:0 "Running on the official course since the declaration the Chronicle records for 27 September 2010 (2010 / 09.27)."
 ac_cpw_status_10:0 "Prevented: the reciprocal exchange closed the declaration route (earned alternative, provisional gameplay)."
 ac_cpw_status_11:0 "Withheld: Yuktobania kept its mandate and did not declare (earned alternative, provisional gameplay)."
 ac_cpw_status_12:0 "Closed: the principal pair could not fight the recorded war, or the record's dates had passed."
 ac_cpw_status_13:0 "Pending: the ACES Chronicle records Yuktobania's declaration of war on Osea for 27 September 2010."
