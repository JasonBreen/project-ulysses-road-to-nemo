 ac_camp.114.t:0 "The second estimate"
 ac_camp.114.desc:0 "The finance office has prepared two estimates. One assumes that the next request will be the last. The other has been circulated less widely. Domestic recovery first preserves a clearer limit on what can be promised abroad. A bounded contribution accepts a smaller reserve at home in exchange for a defined role in the regional effort. Neither policy entitles the government to resources it has not funded. The branch sends an offer whose receiver can refuse, preserves its political cost, and leaves the domestic consequences visible after the diplomatic photograph has been filed."
