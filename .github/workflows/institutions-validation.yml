name: Institutional framework
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  institutional-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic artwork dependency
        run: python -m pip install Pillow==11.3.0
      - name: Execute institution and regional-tree contracts
        run: python -B tools/institutions/run_checks.py
      - name: Retain source and offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-source-results
          path: docs/evidence/institutions/static-*
