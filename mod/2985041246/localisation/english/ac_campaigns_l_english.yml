 ac_camp.77.t:0 "The breath between calls"
 ac_camp.77.desc:0 "The controller recognized the breathing before he recognized the silence. The channel was open, the aircraft was where the plot said it should be, and nobody was reporting a problem. That did not make the interval between calls feel empty.\n\nMobius 1 acknowledged the next instruction. The voice carried little of the mythology already beginning to gather around the callsign. There was a task ahead, a receiving plan behind, and other crews working in adjoining pieces of the same sky.\n\nAt the next desk, an operator was struggling to identify a report through interference. The controller waited for its position to be confirmed before changing the tasking. A confident guess would have been quicker. He had written enough corrections to know how long the consequences of a quick guess could last.\n\nOutside the operations building, the wind was moving a loose sheet of metal against a wall. Someone went to secure it. The sudden absence of the tapping made the controller realize how much of the watch he had spent hearing it beneath the radio.\n\nThe reconnaissance commitment had been completed by aircraft actually put into the air. Its result would help the next operation, and the next crews would have to discover how much of it remained useful when the conditions changed.\n\nHe passed the verified report onward. Mobius 1 answered, and the interval opened again. The controller watched the plot and kept his next instruction ready, resisting the temptation to fill a difficult silence with words that the pilot did not need."
