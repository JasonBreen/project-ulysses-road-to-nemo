 UGE_up_readiness_transport_spirit:0 "Retain a Readiness Transport Reserve"
 UGE_up_readiness_transport_spirit_desc:0 "A protected transport reserve supports movement of the existing forces. Its ordinary public cost remains part of the national bargain."
 UGE_up_dispersal_programme:0 "Lease Dispersed Service Capacity"
 UGE_up_dispersal_programme_desc:0 "Requires completed national work: Register the Dispersed Depots. Fund a bounded 180-day service. Its benefits carry the displayed continuing burden. Completion records useful work once; interruption forfeits the cost. A renewed service requires a new allocation."
