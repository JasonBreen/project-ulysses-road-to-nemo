 ac_fe_pressure_severe:0 "Free Erusea: Severe Insurrection Pressure"
 ac_fe_pressure_severe_desc:0 "Provisional prolonged route: the insurrection is stopping ordinary administration in several districts. Pressure: [?ac_fe_pressure|0]/100. Values and thresholds are provisional gameplay."
 ac_fe_pressure_active:0 "Free Erusea: Active Insurrection"
 ac_fe_pressure_active_desc:0 "Free Erusea's armed insurrection disrupts services and threatens officials, but the government still functions. Pressure: [?ac_fe_pressure|0]/100. Values and thresholds are provisional gameplay."
 ac_fe_pressure_low:0 "Free Erusea: Residual Insurrection"
 ac_fe_pressure_low_desc:0 "Provisional prolonged route: incidents continue, but the government's offices are open and its services reach most districts. Pressure: [?ac_fe_pressure|0]/100. Values and thresholds are provisional gameplay."
 ac_fe_emergency_administration:0 "Administrative Emergency"
 ac_fe_emergency_administration_desc:0 "Emergency powers concentrate decisions in the cabinet for six months. Responses are faster; ordinary politics and consumer supply pay for it."
 ac_fe_partner_assistance:0 "Partner Assistance Under Erusean Command"
 ac_fe_partner_assistance_desc:0 "Central Usean investigators and liaison staff support Erusean offices for six months at the provisional government's request."
 ac_fe_fcu_support_commitment:0 "Support Commitment to Erusea"
 ac_fe_fcu_support_commitment_desc:0 "The federation has seconded staff to the provisional government for six months. Their salaries and the political cost of the commitment remain."
 ac_fe.1.t:0 "The Free Erusea Insurrection"
 ac_fe.1.d:0 "Free Erusea has begun an armed insurrection in Erusea, a year after the provisional government was established under ISAF oversight.\n\nThe ACES Chronicle records both the outbreak and the insurrection's defeat by Mobius 1 on 26 September 2006 (2006 / 09.26). In this campaign that defeat follows Central Usea's response. A prolonged insurrection, if the response is not sent, is provisional gameplay. Neither route creates a new state, border or country."
 ac_fe.1.a:0 "The provisional government and its partners must answer it."
 ac_fe.5.t:0 "Free Erusea Takes Up Arms"
 ac_fe.5.d:0 "Free Erusea has begun an armed insurrection in Erusea. The ISAF can answer at once: the ACES Chronicle records that Mobius 1 defeated the insurrection on 26 September 2006 (2006 / 09.26).\n\nThe federation may instead leave the response to Erusea's provisional government. This campaign treats that as a provisional alternative in which the insurrection lasts longer and the provisional government carries the burden."
 ac_fe.5.a:0 "Send Mobius 1."
 ac_fe.5.b:0 "Leave the response to the provisional government."
 ac_fe.6.t:0 "Free Erusea Is Defeated"
 ac_fe.6.d:0 "Free Erusea's armed insurrection has been defeated by Mobius 1, as the ACES Chronicle records for 26 September 2006 (2006 / 09.26).\n\nThe provisional government and its partners now face the aftermath: the grievances the insurrection used, the offices it closed and the records it left behind."
 ac_fe.6.a:0 "Turn to the aftermath."
 ac_fe.2.t:0 "The Insurrection Outpaces the Response"
 ac_fe.2.d:0 "District reports describe offices closed for weeks, officials who no longer travel and services that have stopped reaching whole communities. The cabinet's current measures are not keeping pace. Ministers can ask the oversight partners for help under Erusean command, or take emergency powers for six months and answer alone."
 ac_fe.2.a:0 "Ask the partners for assistance under Erusean command."
 ac_fe.2.b:0 "Declare a six-month administrative emergency."
 ac_fe.3.t:0 "The Insurrection Recedes"
 ac_fe.3.d:0 "Erusea's provisional authorities report that the insurrection no longer prevents ordinary administration. Incidents may continue, but offices are open and services reach the districts again.\n\nThis ends the provisional prolonged route on the government's own assessment. The official record (2006 / 09.26) places the insurrection's defeat at its outbreak, which is the historical route."
 ac_fe.3.a:0 "Keep the offices open."
 ac_fe.4.t:0 "A Request from the Provisional Government"
 ac_fe.4.d:0 "Erusea's provisional government asks for investigators and liaison staff to support its offices against the insurrection, under Erusean command, for six months. Accepting will cost the federation political capital and staff. Declining leaves the provisional government to manage alone and the partners to draw their own conclusions."
 ac_fe.4.a:0 "Second investigators and liaison staff."
 ac_fe.4.b:0 "Decline, and offer advice only."
 ac_fe_assistance_requested:0 "Free Erusea: partner assistance requested"
 ac_fe_assistance_declined:0 "Free Erusea: partner assistance declined"
 ac_fe_assistance_given:0 "Free Erusea: partner assistance given"
