 OSE_camp_3_register:0 "An order to stop"
 OSE_camp_3_register_desc:0 "An order to stop. Open the campaign lane and its preparation record.\n\nThe president's return is a beginning rather than an order that every unit will obey. The crews need an authenticated command, the investigators need to keep their evidence intact, and the other government needs a reason to believe that a reciprocal promise can survive the next broadcast. The final interception remains an operation with its own conditions. Peace requires both governments to accept current terms in a war that this campaign can actually settle. Its conclusion records the people and forces that survived to hear it."
