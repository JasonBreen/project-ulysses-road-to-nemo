 OSE_snp_civil_space_civil_policy_spirit:0 "Published civil research protocols"
 OSE_snp_civil_space_civil_policy_spirit_desc:0 "A technical adviser lays two reports on the desk: one describes useful observations, the other describes what a protected programme cannot disclose. The inherited Arkbird cooperation may still be valid, interrupted or unavailable. None of those states relieves the government of deciding how civilian research should be governed. The committee can protect sensitive trials without promising an operational weapon, or prefer open technical returns while accepting the slower work of disclosure.\n\nSupport civilian research with published protocols. Faster exchange requires staff and political attention; it does not place a weapon in service."
