 LEA_le_labour_service_1_spirit:0 "Run the Clinics"
 LEA_le_labour_service_1_spirit_desc:0 "The health ministry maintains this funded service for ninety days. Staff and supply the mining towns' clinics for one period. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
