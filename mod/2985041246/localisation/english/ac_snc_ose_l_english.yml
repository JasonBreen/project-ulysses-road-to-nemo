 ac_snc_ose_message_23.t:0 "A Channel That Can Say No: The Return"
 ac_snc_ose_message_23.d:0 "The return contains three separate headings. Beneath the first is work completed by domestic staff. Beneath the second is material received through an established cooperative record. Beneath the third is an unanswered inquiry. The diplomat reads them without combining the totals. 'It sounds smaller,' he says. The researcher smiles. 'It is the size we can defend.' The committee can publish that limited account or retain a signed technical exchange. The decision changes who can examine the record, but cannot change another country's answer or restore a partnership that the receiving offices no longer have.\n\n[OSE_snc_pacific_channel_hearing_context]"
