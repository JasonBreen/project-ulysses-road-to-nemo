 BLK_camp_2_register:0 "The price of a secret"
 BLK_camp_2_register_desc:0 "The price of a secret. Open the campaign lane and its preparation record.\n\nA procurement file can look innocent because every page has the correct signature. Its danger lies in the relationships between the pages. Influence can move a request through several offices without any one clerk possessing the whole plan. Extending that chain creates access and leaves evidence. Protecting a witness can give foreign investigators an independent point of comparison, at the cost of exposing what the government preferred to keep domestic. Both operations have consequences outside Belka without declaring a conventional national war."
