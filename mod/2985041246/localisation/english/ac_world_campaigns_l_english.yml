 ac_wc_cso.7.t:0 "More Than a Shipment"
 ac_wc_cso.8.d:0 "A common name is not permission to speak for another government. Verrin proposes a reciprocal mission. Arden wants technical exchange without dependence. Sen wants a channel that can carry a refusal without carrying a threat.\n\nNadia Verrin, district mediator / Salim Arden, technical instructor / Rafiq Sen, reserve coordinator. This is an original campaign discussion, not an official historical event."
