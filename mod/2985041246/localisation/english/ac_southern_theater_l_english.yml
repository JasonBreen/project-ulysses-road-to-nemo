 LEA_sw_grievance_service_2_spirit_desc:0 "The ministry of mines maintains this funded service for ninety days. Publish one period's recovered mining ledgers. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 LEA_sw_grievance_service_2:0 "Publish the Ledgers"
 LEA_sw_grievance_service_2_desc:0 "Publish one period's recovered mining ledgers.\n\nThe ministry of mines must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 LEA_sw_restraint_service_1_spirit:0 "Hold a Border Liaison Period"
 LEA_sw_restraint_service_1_spirit_desc:0 "The foreign ministry maintains this funded service for ninety days. Keep liaison officers meeting Aurelia's on a fixed schedule. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 LEA_sw_restraint_service_1:0 "Hold a Border Liaison Period"
 LEA_sw_restraint_service_1_desc:0 "Keep liaison officers meeting Aurelia's on a fixed schedule.\n\nThe foreign ministry must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 LEA_sw_restraint_service_2_spirit:0 "Exercise at Home"
 LEA_sw_restraint_service_2_spirit_desc:0 "The general staff maintains this funded service for ninety days. Exercise the army well inside the country's borders. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 LEA_sw_restraint_service_2:0 "Exercise at Home"
 LEA_sw_restraint_service_2_desc:0 "Exercise the army well inside the country's borders.\n\nThe general staff must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 AUR_sw_exile_policy_a_spirit:0 "Government abroad"
 AUR_sw_exile_policy_a_spirit_desc:0 "The cabinet will govern from a friendly capital abroad, safe from the fighting and close to the federation's creditors. It keeps the state's accounts and treaties; it governs a country it cannot see."
 AUR_sw_exile_policy_a_spirit_settled:0 "Government abroad: Standing Settlement"
 AUR_sw_exile_policy_a_spirit_settled_desc:0 "The settlement records how the federation governed while it was occupied. It names no date of return. It leaves a government its citizens could find. The continuing opportunity cost remains."
 AUR_sw_exile_policy_b_spirit:0 "Government at the last base"
 AUR_sw_exile_policy_b_spirit_desc:0 "The cabinet will govern from the last base still in Aurelian hands, beside the forces still fighting. It keeps the government visible to its soldiers; it puts the government within the enemy's reach."
 AUR_sw_exile_policy_b_spirit_settled:0 "Government at the last base: Standing Settlement"
 AUR_sw_exile_policy_b_spirit_settled_desc:0 "The settlement records how the federation governed while it was occupied. It names no date of return. It leaves a government its citizens could find. The continuing opportunity cost remains."
 AUR_sw_exile_register:0 "Govern From Aubrey"
 AUR_sw_exile_register_desc:0 "The ACES Chronicle records that Leasath's invasion caught Aurelia off guard and that almost the whole country fell under Leasath's control (2020 / 10.XX). The federal government must decide where it governs from while its capital is occupied."
 AUR_sw_exile_policy_a:0 "A Government Abroad"
 AUR_sw_exile_policy_a_desc:0 "The cabinet will govern from a friendly capital abroad, safe from the fighting and close to the federation's creditors. It keeps the state's accounts and treaties; it governs a country it cannot see."
 AUR_sw_exile_policy_b:0 "A Government at the Last Base"
 AUR_sw_exile_policy_b_desc:0 "The cabinet will govern from the last base still in Aurelian hands, beside the forces still fighting. It keeps the government visible to its soldiers; it puts the government within the enemy's reach."
 AUR_sw_exile_operations:0 "Keep the Federation's Accounts"
 AUR_sw_exile_operations_desc:0 "The federation's accounts, pensions and salaries will be kept and paid from wherever the government sits. A federation that still pays its people is still a federation."
 AUR_sw_exile_review:0 "Review an Exile Period"
 AUR_sw_exile_review_desc:0 "A completed, funded service period of government in exile must be reviewed before the arrangement becomes the federation's wartime constitution. The review counts what the ministries delivered and to whom."
 AUR_sw_exile_settlement:0 "The Federation Still Governs"
 AUR_sw_exile_settlement_desc:0 "The settlement records how the federation governed while it was occupied. It names no date of return. It leaves a government its citizens could find."
 AUR_sw_resistance_policy_a_spirit:0 "Sabotage and raids"
 AUR_sw_resistance_policy_a_spirit_desc:0 "The resistance will sabotage the occupation's supply lines and raid its depots. Sabotage slows the occupier; it brings reprisals on the towns where it happens."
 AUR_sw_resistance_policy_a_spirit_settled:0 "Sabotage and raids: Standing Settlement"
 AUR_sw_resistance_policy_a_spirit_settled_desc:0 "The settlement records the resistance the federation asked of its people and what they gave. It names no resister. It leaves an account the federation owes them. The continuing opportunity cost remains."
 AUR_sw_resistance_policy_b_spirit:0 "Records and witnesses"
 AUR_sw_resistance_policy_b_spirit_desc:0 "The resistance will record what the occupation does: arrests, requisitions, abuses, with names and dates. Records do not stop the occupier today; they make sure it answers tomorrow."
 AUR_sw_resistance_policy_b_spirit_settled:0 "Records and witnesses: Standing Settlement"
 AUR_sw_resistance_policy_b_spirit_settled_desc:0 "The settlement records the resistance the federation asked of its people and what they gave. It names no resister. It leaves an account the federation owes them. The continuing opportunity cost remains."
 AUR_sw_resistance_register:0 "Organise the Resistance"
 AUR_sw_resistance_register_desc:0 "Aurelians in the occupied regions want to fight back, and the federation must decide what it asks of them. The interior ministry will organise a resistance that answers to the government."
 AUR_sw_resistance_policy_a:0 "Sabotage and Raids"
 AUR_sw_resistance_policy_a_desc:0 "The resistance will sabotage the occupation's supply lines and raid its depots. Sabotage slows the occupier; it brings reprisals on the towns where it happens."
 AUR_sw_resistance_policy_b:0 "Records and Witnesses"
 AUR_sw_resistance_policy_b_desc:0 "The resistance will record what the occupation does: arrests, requisitions, abuses, with names and dates. Records do not stop the occupier today; they make sure it answers tomorrow."
 AUR_sw_resistance_operations:0 "Protect the Resisters' Families"
 AUR_sw_resistance_operations_desc:0 "The families of resisters will be protected with money, false papers and routes out. A resistance that cannot protect its families will not last."
 AUR_sw_resistance_review:0 "Review a Resistance Period"
 AUR_sw_resistance_review_desc:0 "A completed, funded service period under the chosen resistance must be reviewed before it becomes the federation's practice. The review counts what the resistance did and what it cost the towns."
 AUR_sw_resistance_settlement:0 "A Resistance on Record"
 AUR_sw_resistance_settlement_desc:0 "The settlement records the resistance the federation asked of its people and what they gave. It names no resister. It leaves an account the federation owes them."
 AUR_sw_liberation_policy_a_spirit:0 "Return with terms"
 AUR_sw_liberation_policy_a_spirit_desc:0 "The federation will offer Leasath terms once the capital is free: a ceasefire, prisoner exchanges and an accounting of the occupation. Terms end the fighting sooner; they leave questions open."
 AUR_sw_liberation_policy_a_spirit_settled:0 "Return with terms: Standing Settlement"
 AUR_sw_liberation_policy_a_spirit_settled_desc:0 "The settlement records the federation's return and the terms it offered or withheld. It leaves a government back in its capital with a ledger of what the occupation cost. The continuing opportunity cost remains."
 AUR_sw_liberation_policy_b_spirit:0 "Return without terms"
 AUR_sw_liberation_policy_b_spirit_desc:0 "The federation will return without offering terms and fight until Leasath stops. The government keeps every claim intact; the war lasts as long as Leasath can fight."
 AUR_sw_liberation_policy_b_spirit_settled:0 "Return without terms: Standing Settlement"
 AUR_sw_liberation_policy_b_spirit_settled_desc:0 "The settlement records the federation's return and the terms it offered or withheld. It leaves a government back in its capital with a ledger of what the occupation cost. The continuing opportunity cost remains."
 AUR_sw_liberation_register:0 "Plan the Liberation"
 AUR_sw_liberation_register_desc:0 "The official abstract records that the Aurelians recovered their territory region by region and retook the capital (Abstracts, ACE COMBAT X). Whatever the war brings, the government must plan for its return."
 AUR_sw_liberation_policy_a:0 "Return With Terms"
 AUR_sw_liberation_policy_a_desc:0 "The federation will offer Leasath terms once the capital is free: a ceasefire, prisoner exchanges and an accounting of the occupation. Terms end the fighting sooner; they leave questions open."
 AUR_sw_liberation_policy_b:0 "Return Without Terms"
 AUR_sw_liberation_policy_b_desc:0 "The federation will return without offering terms and fight until Leasath stops. The government keeps every claim intact; the war lasts as long as Leasath can fight."
 AUR_sw_liberation_operations:0 "Restore the Liberated Regions"
 AUR_sw_liberation_operations_desc:0 "Water, power and schools in the liberated regions will be restored in a published order. A region is liberated when its people can live in it again."
 AUR_sw_liberation_review:0 "Review a Liberation Period"
 AUR_sw_liberation_review_desc:0 "A completed, funded service period of restoration must be reviewed before the liberation is declared complete. The review lists the services restored and the regions still waiting."
 AUR_sw_liberation_settlement:0 "A Federation Restored"
 AUR_sw_liberation_settlement_desc:0 "The settlement records the federation's return and the terms it offered or withheld. It leaves a government back in its capital with a ledger of what the occupation cost."
 AUR_sw_recovery_policy_a_spirit:0 "Rebuild first"
 AUR_sw_recovery_policy_a_spirit_desc:0 "Reconstruction comes first: roads, power, ports and housing, region by region. Rebuilding gets the economy moving; the people who lost family wait for their compensation."
 AUR_sw_recovery_policy_a_spirit_settled:0 "Rebuild first: Standing Settlement"
 AUR_sw_recovery_policy_a_spirit_settled_desc:0 "The settlement records what the war cost Aurelia and what the federation paid back. It leaves a country that knows its losses, and a constitution that has had to answer the war. The continuing opportunity cost remains."
 AUR_sw_recovery_policy_b_spirit:0 "Compensate first"
 AUR_sw_recovery_policy_b_spirit_desc:0 "Compensation comes first: the families of the dead, the injured and the dispossessed, paid before the roads. Compensation keeps faith with the victims; the economy waits."
 AUR_sw_recovery_policy_b_spirit_settled:0 "Compensate first: Standing Settlement"
 AUR_sw_recovery_policy_b_spirit_settled_desc:0 "The settlement records what the war cost Aurelia and what the federation paid back. It leaves a country that knows its losses, and a constitution that has had to answer the war. The continuing opportunity cost remains."
 AUR_sw_recovery_register:0 "Count the War's Cost"
 AUR_sw_recovery_register_desc:0 "The war is over. The federation that a pacifist constitution kept out of every war for a generation must now count what one war cost it, and decide what to pay first."
 AUR_sw_recovery_policy_a:0 "Rebuild First"
 AUR_sw_recovery_policy_a_desc:0 "Reconstruction comes first: roads, power, ports and housing, region by region. Rebuilding gets the economy moving; the people who lost family wait for their compensation."
 AUR_sw_recovery_policy_b:0 "Compensate First"
 AUR_sw_recovery_policy_b_desc:0 "Compensation comes first: the families of the dead, the injured and the dispossessed, paid before the roads. Compensation keeps faith with the victims; the economy waits."
 AUR_sw_recovery_operations:0 "Rebuild the Defences"
 AUR_sw_recovery_operations_desc:0 "The federation will rebuild its defences so that it is never caught with no means to fight back again. Defence costs the pacifist federation its oldest argument; the war settled it."
 AUR_sw_recovery_review:0 "Review a Recovery Period"
 AUR_sw_recovery_review_desc:0 "A completed, funded service period of recovery must be reviewed before the federation declares the war's account settled. The review lists what was rebuilt and who was paid."
 AUR_sw_recovery_settlement:0 "After the Occupation"
 AUR_sw_recovery_settlement_desc:0 "The settlement records what the war cost Aurelia and what the federation paid back. It leaves a country that knows its losses, and a constitution that has had to answer the war."
 AUR_sw_neighbour_policy_a_spirit:0 "Joint commission"
 AUR_sw_neighbour_policy_a_spirit_desc:0 "A joint commission with Leasath will meet each quarter on trade, the mines and the border. The commission gives both governments a place to argue before they act."
 AUR_sw_neighbour_policy_a_spirit_settled:0 "Joint commission: Standing Settlement"
 AUR_sw_neighbour_policy_a_spirit_settled_desc:0 "The settlement records a peace this history kept and the official record did not. It leaves two neighbours that know how to argue without invading. The continuing opportunity cost remains."
 AUR_sw_neighbour_policy_b_spirit:0 "Watchful border"
 AUR_sw_neighbour_policy_b_spirit_desc:0 "The federation will keep its southern border watched and its forces ready, without provoking its neighbour. Readiness reassures the federation; it also tells Leasath what Aurelia expects."
 AUR_sw_neighbour_policy_b_spirit_settled:0 "Watchful border: Standing Settlement"
 AUR_sw_neighbour_policy_b_spirit_settled_desc:0 "The settlement records a peace this history kept and the official record did not. It leaves two neighbours that know how to argue without invading. The continuing opportunity cost remains."
 AUR_sw_neighbour_register:0 "Keep the Southern Peace"
 AUR_sw_neighbour_register_desc:0 "The war the ACES Chronicle records for October 2020 did not come in this history: Leasath withheld its declaration, or its civil war never ended in a way that allowed one. The federation will decide how to keep a peace it did not have to win."
 AUR_sw_neighbour_policy_a:0 "A Joint Commission With Leasath"
 AUR_sw_neighbour_policy_a_desc:0 "A joint commission with Leasath will meet each quarter on trade, the mines and the border. The commission gives both governments a place to argue before they act."
 AUR_sw_neighbour_policy_b:0 "A Watchful Border"
 AUR_sw_neighbour_policy_b_desc:0 "The federation will keep its southern border watched and its forces ready, without provoking its neighbour. Readiness reassures the federation; it also tells Leasath what Aurelia expects."
 AUR_sw_neighbour_operations:0 "Open the Southern Crossings"
 AUR_sw_neighbour_operations_desc:0 "The crossings closed during Leasath's civil war will reopen on a published schedule. Open crossings make the peace visible to the people who live beside the border."
 AUR_sw_neighbour_review:0 "Review a Peace Period"
 AUR_sw_neighbour_review_desc:0 "A completed, funded service period under the chosen policy must be reviewed before it becomes settled practice. The review counts incidents, crossings and the commission's answers."
 AUR_sw_neighbour_settlement:0 "A Neighbour at Peace"
 AUR_sw_neighbour_settlement_desc:0 "The settlement records a peace this history kept and the official record did not. It leaves two neighbours that know how to argue without invading."
 LEA_sw_war_government_policy_a_spirit:0 "The commander governs"
 LEA_sw_war_government_policy_a_spirit_desc:0 "The commander of the armed forces will govern for the duration: decrees instead of laws, officers instead of ministers. Decisions are quick; nobody outside the command knows why they were taken."
 LEA_sw_war_government_policy_a_spirit_settled:0 "The commander governs: Standing Settlement"
 LEA_sw_war_government_policy_a_spirit_settled_desc:0 "The settlement records who governed Leasath's war. The official record names Diego Navarro as its chief orchestrator; this record names no officeholder and changes none. It leaves a record someone will read later. The continuing opportunity cost remains."
 LEA_sw_war_government_policy_b_spirit:0 "The assembly governs"
 LEA_sw_war_government_policy_b_spirit_desc:0 "The assembly will keep governing, with the commander answering to it. Civil government is slower; it keeps a record of who decided what."
 LEA_sw_war_government_policy_b_spirit_settled:0 "The assembly governs: Standing Settlement"
 LEA_sw_war_government_policy_b_spirit_settled_desc:0 "The settlement records who governed Leasath's war. The official record names Diego Navarro as its chief orchestrator; this record names no officeholder and changes none. It leaves a record someone will read later. The continuing opportunity cost remains."
 LEA_sw_war_government_register:0 "Govern the War"
 LEA_sw_war_government_register_desc:0 "The ACES Chronicle records that Leasath declared war on Aurelia, citing years of exploitation as its just cause (2020 / 10.XX). The country had just ended a civil war. Its leaders must decide who governs a country at war."
 LEA_sw_war_government_policy_a:0 "The Commander Governs"
 LEA_sw_war_government_policy_a_desc:0 "The commander of the armed forces will govern for the duration: decrees instead of laws, officers instead of ministers. Decisions are quick; nobody outside the command knows why they were taken."
 LEA_sw_war_government_policy_b:0 "The Assembly Governs"
 LEA_sw_war_government_policy_b_desc:0 "The assembly will keep governing, with the commander answering to it. Civil government is slower; it keeps a record of who decided what."
 LEA_sw_war_government_operations:0 "Report to the Country"
 LEA_sw_war_government_operations_desc:0 "The war's conduct will be reported to the country each month: the casualties, costs and occupied regions. Reporting costs the government secrecy; it gives the country a reason to believe it."
 LEA_sw_war_government_review:0 "Review a War Government Period"
 LEA_sw_war_government_review_desc:0 "A completed, funded service period under the chosen arrangement must be reviewed before it becomes the country's wartime constitution. The review asks who decided, and on whose authority."
 LEA_sw_war_government_settlement:0 "Who Decided the War"
 LEA_sw_war_government_settlement_desc:0 "The settlement records who governed Leasath's war. The official record names Diego Navarro as its chief orchestrator; this record names no officeholder and changes none. It leaves a record someone will read later."
 LEA_sw_occupation_policy_a_spirit:0 "Civil administration"
 LEA_sw_occupation_policy_a_spirit_desc:0 "The occupied regions will be governed by civil administrators: food first, schools open, local officials kept where they will serve. The administration costs money and patience; it makes fewer enemies."
 LEA_sw_occupation_policy_a_spirit_settled:0 "Civil administration: Standing Settlement"
 LEA_sw_occupation_policy_a_spirit_settled_desc:0 "The settlement puts the occupation on record. It does not decide whether the regions are kept. Whoever reads it afterwards will know how they were governed. The continuing opportunity cost remains."
 LEA_sw_occupation_policy_b_spirit:0 "Military administration"
 LEA_sw_occupation_policy_b_spirit_desc:0 "The occupied regions will be governed by the army: curfews, requisitions and arrests at the commanders' discretion. Military rule secures the lines; it makes enemies of everyone it governs."
 LEA_sw_occupation_policy_b_spirit_settled:0 "Military administration: Standing Settlement"
 LEA_sw_occupation_policy_b_spirit_settled_desc:0 "The settlement puts the occupation on record. It does not decide whether the regions are kept. Whoever reads it afterwards will know how they were governed. The continuing opportunity cost remains."
 LEA_sw_occupation_register:0 "Administer the Occupied Regions"
 LEA_sw_occupation_register_desc:0 "Leasathian forces hold Aurelian regions in this history, as the Chronicle records they held almost the whole country (2020 / 10.XX). Leasath must decide how it governs people who did not choose it."
 LEA_sw_occupation_policy_a:0 "A Civil Administration"
 LEA_sw_occupation_policy_a_desc:0 "The occupied regions will be governed by civil administrators: food first, schools open, local officials kept where they will serve. The administration costs money and patience; it makes fewer enemies."
 LEA_sw_occupation_policy_b:0 "A Military Administration"
 LEA_sw_occupation_policy_b_desc:0 "The occupied regions will be governed by the army: curfews, requisitions and arrests at the commanders' discretion. Military rule secures the lines; it makes enemies of everyone it governs."
 LEA_sw_occupation_operations:0 "Account for the Requisitions"
 LEA_sw_occupation_operations_desc:0 "Every requisition will be recorded with a receipt. A receipt is a promise that someone will be paid back."
 LEA_sw_occupation_review:0 "Review an Occupation Period"
 LEA_sw_occupation_review_desc:0 "A completed, funded service period under the chosen administration must be reviewed before it becomes policy. The review counts what was taken, paid and owed."
 LEA_sw_occupation_settlement:0 "An Occupation on Record"
 LEA_sw_occupation_settlement_desc:0 "The settlement puts the occupation on record. It does not decide whether the regions are kept. Whoever reads it afterwards will know how they were governed."
 LEA_sw_aftermath_policy_a_spirit:0 "Transitional government"
 LEA_sw_aftermath_policy_a_spirit_desc:0 "A transitional government of civilians and officers will govern until elections, with a published timetable. The transition reassures Leasath's neighbours; it gives the officers a reason to wait."
 LEA_sw_aftermath_policy_a_spirit_settled:0 "Transitional government: Standing Settlement"
 LEA_sw_aftermath_policy_a_spirit_settled_desc:0 "The settlement records Leasath's government after the war. It names no new leader. It leaves a country that must explain a war it started. The continuing opportunity cost remains."
 LEA_sw_aftermath_policy_b_spirit:0 "Government of the officers"
 LEA_sw_aftermath_policy_b_spirit_desc:0 "The officers will govern until order is restored, with no timetable. The officers keep the army together; the neighbours wonder what they will do with it."
 LEA_sw_aftermath_policy_b_spirit_settled:0 "Government of the officers: Standing Settlement"
 LEA_sw_aftermath_policy_b_spirit_settled_desc:0 "The settlement records Leasath's government after the war. It names no new leader. It leaves a country that must explain a war it started. The continuing opportunity cost remains."
 LEA_sw_aftermath_register:0 "After the Commander"
 LEA_sw_aftermath_register_desc:0 "The Chronicle records that Leasath's commanding officer and the conflict's chief orchestrator, Diego Navarro, was removed from office and that the war ended (2020 / 12.XX). Whoever governs Leasath now must decide what kind of government it will be."
 LEA_sw_aftermath_policy_a:0 "A Transitional Government"
 LEA_sw_aftermath_policy_a_desc:0 "A transitional government of civilians and officers will govern until elections, with a published timetable. The transition reassures Leasath's neighbours; it gives the officers a reason to wait."
 LEA_sw_aftermath_policy_b:0 "A Government of the Officers"
 LEA_sw_aftermath_policy_b_desc:0 "The officers will govern until order is restored, with no timetable. The officers keep the army together; the neighbours wonder what they will do with it."
 LEA_sw_aftermath_operations:0 "Bring the Soldiers Home"
 LEA_sw_aftermath_operations_desc:0 "Soldiers will be brought home from the occupied regions on a published schedule. An army that comes home in order does not come home angry."
 LEA_sw_aftermath_review:0 "Review a Transition Period"
 LEA_sw_aftermath_review_desc:0 "A completed, funded service period of transition must be reviewed before the arrangement becomes the constitution. The review asks whether the timetable held."
 LEA_sw_aftermath_settlement:0 "Leasath After the War"
 LEA_sw_aftermath_settlement_desc:0 "The settlement records Leasath's government after the war. It names no new leader. It leaves a country that must explain a war it started."
 LEA_sw_grievance_policy_a_spirit:0 "Arbitration of the old terms"
 LEA_sw_grievance_policy_a_spirit_desc:0 "Leasath will take the old mining terms to arbitration and accept the arbitrators' ruling. Arbitration may win back some of what Leasath believes it lost; it may also find that the terms were fair."
 LEA_sw_grievance_policy_a_spirit_settled:0 "Arbitration of the old terms: Standing Settlement"
 LEA_sw_grievance_policy_a_spirit_settled_desc:0 "The settlement records Leasath's grievance and what its government did with it. It does not judge the claim. It leaves the evidence where both countries can read it. The continuing opportunity cost remains."
 LEA_sw_grievance_policy_b_spirit:0 "The grievance as policy"
 LEA_sw_grievance_policy_b_spirit_desc:0 "Leasath will make the grievance national policy: speeches, schoolbooks and demands. A grievance as policy unites a country after a civil war; it also points it somewhere."
 LEA_sw_grievance_policy_b_spirit_settled:0 "The grievance as policy: Standing Settlement"
 LEA_sw_grievance_policy_b_spirit_settled_desc:0 "The settlement records Leasath's grievance and what its government did with it. It does not judge the claim. It leaves the evidence where both countries can read it. The continuing opportunity cost remains."
 LEA_sw_grievance_register:0 "State the Grievance"
 LEA_sw_grievance_register_desc:0 "The official record says Leasath justified its 2020 war by citing years of exploitation by Aurelia. This campaign records that claim as Leasath's own and does not decide whether it is fair. After the civil war, the government must decide what to do with the grievance."
 LEA_sw_grievance_policy_a:0 "Arbitration of the Old Terms"
 LEA_sw_grievance_policy_a_desc:0 "Leasath will take the old mining terms to arbitration and accept the arbitrators' ruling. Arbitration may win back some of what Leasath believes it lost; it may also find that the terms were fair."
 LEA_sw_grievance_policy_b:0 "The Grievance as Policy"
 LEA_sw_grievance_policy_b_desc:0 "Leasath will make the grievance national policy: speeches, schoolbooks and demands. A grievance as policy unites a country after a civil war; it also points it somewhere."
 LEA_sw_grievance_operations:0 "Publish the Mining Ledgers"
 LEA_sw_grievance_operations_desc:0 "The ledgers of every mine Aurelian firms ever worked in Leasath will be published, with what each paid. The ledgers are the evidence for the grievance, or against it."
 LEA_sw_grievance_review:0 "Review a Grievance Period"
 LEA_sw_grievance_review_desc:0 "A completed, funded service period under the chosen policy must be reviewed before it becomes settled doctrine. The review asks what the evidence showed."
 LEA_sw_grievance_settlement:0 "A Grievance on the Record"
 LEA_sw_grievance_settlement_desc:0 "The settlement records Leasath's grievance and what its government did with it. It does not judge the claim. It leaves the evidence where both countries can read it."
 LEA_sw_restraint_policy_a_spirit:0 "Restraint toward Aurelia"
 LEA_sw_restraint_policy_a_spirit_desc:0 "Leasath will keep its army at home and answer Aurelia through talks, whatever the grievance. Restraint is the record the official history did not keep; it costs the government the army's patience."
 LEA_sw_restraint_policy_a_spirit_settled:0 "Restraint toward Aurelia: Standing Settlement"
 LEA_sw_restraint_policy_a_spirit_settled_desc:0 "The settlement records a choice the official record says Leasath did not make in October 2020. Policy A is the record Leasath needs to withhold its declaration; it claims nothing else. The continuing opportunity cost remains."
 LEA_sw_restraint_policy_b_spirit:0 "Readiness on the border"
 LEA_sw_restraint_policy_b_spirit_desc:0 "Leasath will keep its army ready on the Aurelian border, without crossing it. Readiness reassures the army; it tells Aurelia exactly what Leasath could do."
 LEA_sw_restraint_policy_b_spirit_settled:0 "Readiness on the border: Standing Settlement"
 LEA_sw_restraint_policy_b_spirit_settled_desc:0 "The settlement records a choice the official record says Leasath did not make in October 2020. Policy A is the record Leasath needs to withhold its declaration; it claims nothing else. The continuing opportunity cost remains."
 LEA_sw_restraint_register:0 "Keep the Army at Home"
 LEA_sw_restraint_register_desc:0 "Leasath is out of a civil war and its army is the strongest institution it has. The government must decide whether that army will be used abroad."
 LEA_sw_restraint_policy_a:0 "Restraint Toward Aurelia"
 LEA_sw_restraint_policy_a_desc:0 "Leasath will keep its army at home and answer Aurelia through talks, whatever the grievance. Restraint is the record the official history did not keep; it costs the government the army's patience."
 LEA_sw_restraint_policy_b:0 "Readiness on the Border"
 LEA_sw_restraint_policy_b_desc:0 "Leasath will keep its army ready on the Aurelian border, without crossing it. Readiness reassures the army; it tells Aurelia exactly what Leasath could do."
 LEA_sw_restraint_operations:0 "Keep the Channels Open"
 LEA_sw_restraint_operations_desc:0 "Channels to Aurelia's government will be kept open at every level. A channel that is open in peacetime is the one that is used in a crisis."
 LEA_sw_restraint_review:0 "Review a Restraint Period"
 LEA_sw_restraint_review_desc:0 "A completed, funded service period under the chosen policy must be reviewed before it becomes the country's settled practice. The review asks whether the army stayed home and the channels stayed open."
 LEA_sw_restraint_settlement:0 "A Country That Did Not March"
 LEA_sw_restraint_settlement_desc:0 "The settlement records a choice the official record says Leasath did not make in October 2020. Policy A is the record Leasath needs to withhold its declaration; it claims nothing else."
 ac_alc_funded_cost:0 "£pol_power 35 / 4 cap"
 ac_alc_funded_cost_tooltip:0 "Authorization commits 35 political power and four institutional-capacity points, plus the programme fee shown in the category. Spent resources are not refunded when a period is interrupted."
 ac_alc_funded_cost_blocked:0 "£pol_power §R35§! / §R4§! cap"
 ac_alc_fee_macro:0 "Programme fee: 0.002 billion abstract fiscal units."
 ac_alc_fee_legacy:0 "Programme fee: 2 provisional fiscal units."
 ac_alc_fee_none:0 "No fiscal fee currently applies. Political and institutional costs remain."
 ac_alc_aur_services:0 "Aurelia: The Aurelia-Leasath War"
 ac_alc_aur_services_desc:0 "[ac_alc_status_text]\n\n[ac_alc_current_service_text]\n[ac_alc_cooldown_text]\nService [?ac_alc_elapsed|0]/90 days, [?ac_alc_completed_services|0] completed, last period [?ac_alc_last_delivered_days|0] days.\n\n[AUR_exile_ac_alc_policy_line][AUR_resistance_ac_alc_policy_line][AUR_liberation_ac_alc_policy_line][AUR_recovery_ac_alc_policy_line][AUR_neighbour_ac_alc_policy_line][ac_alc_fee_text]"
 AUR_sw_cancel_service:0 "End the Current Service Period"
 AUR_sw_cancel_service_desc:0 "Release the current rota immediately. Funding and institutional effort already spent are not refunded. Delivered time is retained in the record, but the interrupted period cannot unlock a completed-service review."
 ac_alc_lea_services:0 "Leasath: The Aurelia-Leasath War"
 ac_alc_lea_services_desc:0 "[ac_alc_status_text]\n\n[ac_alc_current_service_text]\n[ac_alc_cooldown_text]\nService [?ac_alc_elapsed|0]/90 days, [?ac_alc_completed_services|0] completed, last period [?ac_alc_last_delivered_days|0] days.\n\n[LEA_war_government_ac_alc_policy_line][LEA_occupation_ac_alc_policy_line][LEA_aftermath_ac_alc_policy_line][LEA_grievance_ac_alc_policy_line][LEA_restraint_ac_alc_policy_line][ac_alc_fee_text]"
 LEA_sw_cancel_service:0 "End the Current Service Period"
 LEA_sw_cancel_service_desc:0 "Release the current rota immediately. Funding and institutional effort already spent are not refunded. Delivered time is retained in the record, but the interrupted period cannot unlock a completed-service review."
 AUR_sw_opening_public_spirit:0 "Aurelia: An Open Hearing"
 AUR_sw_opening_public_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 AUR_sw_opening_ministerial_spirit:0 "Aurelia: A Ministerial Docket"
 AUR_sw_opening_ministerial_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ac_alc.50.t:0 "A Pacifist Federation in 2020"
 ac_alc.50.d:0 "The cabinet meets with the federation's records of the years before 2020: its relations with Leasath, its readiness review and its account of what it owes. Across the southern border, Leasath's civil war has ended.\n\nThe question before the cabinet is what a federation that has kept out of every war owes its people if one comes to it, and how much of that answer to give in public."
 ac_alc.50.a:0 "Open the question to the public."
 ac_alc.50.b:0 "Begin with a protected cabinet docket."
 LEA_sw_opening_public_spirit:0 "Leasath: An Open Hearing"
 LEA_sw_opening_public_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 LEA_sw_opening_ministerial_spirit:0 "Leasath: A Ministerial Docket"
 LEA_sw_opening_ministerial_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ac_alc.51.t:0 "After Ten Years of War"
 ac_alc.51.d:0 "The cabinet meets with the records the civil war left: the provinces, the army, the mines and a grievance against Aurelia that every faction shared.\n\nThe question before the cabinet is what Leasath will do with its army and its grievance now that it is no longer fighting itself, and how much of that decision to make where its neighbour can see it."
 ac_alc.51.a:0 "Open the question to the public."
 ac_alc.51.b:0 "Begin with a protected cabinet docket."
 AUR_exile_ac_alc_policy_callback_0:0 "The standing policy is government abroad. Its continuing cost remains part of the allocation."
 AUR_exile_ac_alc_policy_callback_1:0 "The standing policy is government at the last base. Its continuing cost remains part of the allocation."
 AUR_sw_exile_reply_public_spirit:0 "Govern From Aubrey: Public Return"
 AUR_sw_exile_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Staff and fund the ministries operating in exile for one period. Public attention or reserved staff time remains committed to that work."
 AUR_sw_exile_reply_protected_spirit:0 "Govern From Aubrey: Protected Working Return"
 AUR_sw_exile_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Pay the salaries and pensions of displaced civil servants. Public attention or reserved staff time remains committed to that work."
 ac_alc.60.t:0 "A Minister Who Stayed in Griswall"
 ac_alc.60.d:0 "A deputy minister stayed in the occupied capital and keeps the water and power running under the occupation's orders. The occupiers tolerate him; the cabinet cannot decide whether he serves the federation or the invader.\n\nThe cabinet can recognise his work publicly, or say nothing and keep him on the payroll.\n\n[AUR_exile_ac_alc_policy_callback]"
 ac_alc.60.a:0 "Recognise his work publicly."
 ac_alc.60.b:0 "Say nothing and keep paying him."
 AUR_exile_ac_alc_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 AUR_exile_ac_alc_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 AUR_exile_ac_alc_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_alc.90.t:0 "The Federation Still Governs"
 ac_alc.90.d:0 "The final review is a ledger of the exile government's work: salaries paid, permits issued, appeals answered. Some entries carry an occupied city's name.\n\nThe deputy minister who stayed is in the ledger, with the decision the cabinet took.\n\n[AUR_exile_ac_alc_report_callback]\n\n[AUR_exile_ac_alc_policy_callback]"
 ac_alc.90.a:0 "File the completed service record."
 AUR_resistance_ac_alc_policy_callback_0:0 "The standing policy is sabotage and raids. Its continuing cost remains part of the allocation."
 AUR_resistance_ac_alc_policy_callback_1:0 "The standing policy is records and witnesses. Its continuing cost remains part of the allocation."
 AUR_sw_resistance_reply_public_spirit:0 "Organise the Resistance: Public Return"
 AUR_sw_resistance_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Smuggle money and equipment to the resistance for one period. Public attention or reserved staff time remains committed to that work."
 AUR_sw_resistance_reply_protected_spirit:0 "Organise the Resistance: Protected Working Return"
 AUR_sw_resistance_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Move resisters' families out of reach for one period. Public attention or reserved staff time remains committed to that work."
 ac_alc.61.t:0 "A Reprisal in a Mining Town"
 ac_alc.61.d:0 "After a raid on a depot, the occupation has arrested the mayor and twenty townspeople of a mining town. The resistance wants to raid again; the town's priest begs the government to stop.\n\nThe government can order the raids paused and say why, or leave the decision to the resistance commanders.\n\n[AUR_resistance_ac_alc_policy_callback]"
 ac_alc.61.a:0 "Pause the raids and say why."
 ac_alc.61.b:0 "Leave it to the commanders."
 AUR_resistance_ac_alc_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 AUR_resistance_ac_alc_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 AUR_resistance_ac_alc_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_alc.91.t:0 "A Resistance on Record"
 ac_alc.91.d:0 "The final review lists what the resistance did and what the occupation did in return, town by town. The mining town is there, with what happened to its mayor.\n\nThe account is the federation's debt to the people who carried it.\n\n[AUR_resistance_ac_alc_report_callback]\n\n[AUR_resistance_ac_alc_policy_callback]"
 ac_alc.91.a:0 "File the completed service record."
 AUR_liberation_ac_alc_policy_callback_0:0 "The standing policy is return with terms. Its continuing cost remains part of the allocation."
 AUR_liberation_ac_alc_policy_callback_1:0 "The standing policy is return without terms. Its continuing cost remains part of the allocation."
 AUR_sw_liberation_reply_public_spirit:0 "Plan the Liberation: Public Return"
 AUR_sw_liberation_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Repair water, power and transport in one liberated region. Public attention or reserved staff time remains committed to that work."
 AUR_sw_liberation_reply_protected_spirit:0 "Plan the Liberation: Protected Working Return"
 AUR_sw_liberation_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Restaff and resupply the liberated regions' schools. Public attention or reserved staff time remains committed to that work."
 ac_alc.62.t:0 "The Occupation's Files"
 ac_alc.62.d:0 "The occupation administration left its files behind: requisitions, arrests and the names of those who worked with it. Every family in the liberated regions wants to know what is in them.\n\nThe justice ministry wants the files opened to the people named in them. The interior ministry wants them sealed for the courts.\n\n[AUR_liberation_ac_alc_policy_callback]"
 ac_alc.62.a:0 "Open the files to the people named."
 ac_alc.62.b:0 "Seal the files for the courts."
 AUR_liberation_ac_alc_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 AUR_liberation_ac_alc_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 AUR_liberation_ac_alc_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_alc.92.t:0 "A Federation Restored"
 ac_alc.92.d:0 "The final review lists the liberated regions with the date each regained water, power and a school. The occupation's files are where the cabinet decided to put them.\n\nThe federation is back in its capital. The review says what it cost to get there.\n\n[AUR_liberation_ac_alc_report_callback]\n\n[AUR_liberation_ac_alc_policy_callback]"
 ac_alc.92.a:0 "File the completed service record."
 AUR_recovery_ac_alc_policy_callback_0:0 "The standing policy is rebuild first. Its continuing cost remains part of the allocation."
 AUR_recovery_ac_alc_policy_callback_1:0 "The standing policy is compensate first. Its continuing cost remains part of the allocation."
 AUR_sw_recovery_reply_public_spirit:0 "Count the War's Cost: Public Return"
 AUR_sw_recovery_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Fund one period of reconstruction in a war-damaged region. Public attention or reserved staff time remains committed to that work."
 AUR_sw_recovery_reply_protected_spirit:0 "Count the War's Cost: Protected Working Return"
 AUR_sw_recovery_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Pay one period of compensation claims. Public attention or reserved staff time remains committed to that work."
 ac_alc.63.t:0 "A Claim From a Leasathian"
 ac_alc.63.d:0 "A Leasathian family has filed a claim with the federation's tribunal: their son, a conscript, was killed by Aurelian fire in a town he did not want to occupy. The tribunal's rules do not exclude foreigners.\n\nThe cabinet can let the tribunal hear the claim in public, or change the rules to exclude it.\n\n[AUR_recovery_ac_alc_policy_callback]"
 ac_alc.63.a:0 "Let the tribunal hear it."
 ac_alc.63.b:0 "Change the rules."
 AUR_recovery_ac_alc_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 AUR_recovery_ac_alc_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 AUR_recovery_ac_alc_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_alc.93.t:0 "After the Occupation"
 ac_alc.93.d:0 "The final review lists what was rebuilt, who was paid and what the defences cost. The Leasathian family's claim is there, with the tribunal's ruling.\n\nThe federation is not the country it was before October. It knows what it lost.\n\n[AUR_recovery_ac_alc_report_callback]\n\n[AUR_recovery_ac_alc_policy_callback]"
 ac_alc.93.a:0 "File the completed service record."
 AUR_neighbour_ac_alc_policy_callback_0:0 "The standing policy is joint commission. Its continuing cost remains part of the allocation."
 AUR_neighbour_ac_alc_policy_callback_1:0 "The standing policy is watchful border. Its continuing cost remains part of the allocation."
 AUR_sw_neighbour_reply_public_spirit:0 "Keep the Southern Peace: Public Return"
 AUR_sw_neighbour_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Convene the joint commission on the quarter's disputes. Public attention or reserved staff time remains committed to that work."
 AUR_sw_neighbour_reply_protected_spirit:0 "Keep the Southern Peace: Protected Working Return"
 AUR_sw_neighbour_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Staff the reopened crossings with customs and health officers. Public attention or reserved staff time remains committed to that work."
 ac_alc.64.t:0 "A Complaint About the Old Terms"
 ac_alc.64.d:0 "Leasath's delegation has tabled the old mining terms at the commission and called them exploitation. The federation's delegation can answer in public with its own figures, or ask for the item to be taken in closed session.\n\n[AUR_neighbour_ac_alc_policy_callback]"
 ac_alc.64.a:0 "Answer in public with the figures."
 ac_alc.64.b:0 "Ask for a closed session."
 AUR_neighbour_ac_alc_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
