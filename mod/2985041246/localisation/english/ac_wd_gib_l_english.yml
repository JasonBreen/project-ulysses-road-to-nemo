l_english:
 GIB_wd_zn_charter_read:0 "The Charter Read at Gibraltar City"
 GIB_wd_zn_charter_read_desc:0 "In 1991 the Gibraltar Mining Zone is run by the National Administration, an executive office that answers to no voter and whose holder appears in no public record. Its founding charter has not been read aloud in a generation. Reading it in the port city, clause by clause, tells every pit town what the office claims to do and invites argument about all of it."
 GIB_wd_zn_powers_list:0 "Clauses the Office Never Used"
 GIB_wd_zn_powers_list_desc:0 "Clerks compare the charter with what the Administration actually does. Some powers, such as setting royalties or licensing new shafts, drifted to the concession firms years ago. Others, like calling a district vote, were never used at all. Publishing the comparison costs the office some dignity and forces a choice about who should hold the powers nobody exercises."
 GIB_wd_zn_powers_list_tt_1:0 "Opens four answers to who governs the zone; only one can be taken."
 GIB_wd_zn_board_path:0 "Seats for the Concession Holders"
 GIB_wd_zn_board_path_desc:0 "The operating firms, the ore hauliers and the port agents already decide most of what happens in the zone. One faction proposes to give them the formal seats as well, so that those who pay the royalties and employ the miners would govern in their own name. Decisions would follow the order books. Miners and townspeople would have no seat of their own."
 GIB_wd_zn_assembly_path:0 "Both Districts Elect a Chamber"
 GIB_wd_zn_assembly_path_desc:0 "Townspeople in Gibraltar City and the eastern railhead towns ask for an elected chamber, with seats divided between West and East Gibraltar and a budget it must approve. Elections have no place on the zone calendar today. The firms fear royalty politics, the Administration fears losing its staff, and the chamber would inherit every grievance at once."
 GIB_wd_zn_council_path:0 "The Pit Councils Ask for the Keys"
 GIB_wd_zn_council_path_desc:0 "Each shaft and quarry has an informal council of shift leaders that bargains over pay, timbering and dust. Their delegates now ask for more than bargaining: the right to run the zone through a federation of those councils. Production decisions would be made by the people below ground. Investors would read it as the end of predictable royalties."
 GIB_wd_zn_directorate_path:0 "Engineers Instead of Clerks"
 GIB_wd_zn_directorate_path_desc:0 "A smaller camp inside the Administration wants to keep the unelected office but rebuild it around engineers, surveyors and accountants who publish their standards. Nobody would vote, but everyone could read the rules. It promises competence without a political fight. It also leaves the miners, the firms and the towns exactly as voiceless as they were before."
 GIB_wd_zn_board_seat:0 "Install the Concession Board"
 GIB_wd_zn_board_seat_desc:0 "The board takes the seals of the Administration and governs collectively through nominees of the operating firms, hauliers and port agents. No vote is scheduled. Royalty disputes become internal business, settled quickly and quietly. Power passes to a collective office rather than to any individual, and every bad season will now be blamed on the board's ledgers."
 GIB_wd_zn_assembly_seat:0 "Seat the District Chamber"
 GIB_wd_zn_assembly_seat_desc:0 "Voters in both districts elect a chamber, which appoints a cabinet sharing responsibility for every line of spending. Polling days are set years ahead. The clerks of the old Administration become civil servants of an elected government. The firms gain an opponent that can be voted out and replaced, which they regard as both a risk and an opening."
 GIB_wd_zn_council_seat:0 "Federate the Pit Councils"
 GIB_wd_zn_council_seat_desc:0 "Delegates from every shaft, quarry, railyard and quay form a federation that takes over the Administration's offices. Its executive is a rotating committee with no named leader, and its first rule is that safety outranks output. The firms keep their concessions on paper, while their managers now negotiate with the people who used to take their orders."
 GIB_wd_zn_directorate_seat:0 "Commission the Directorate of Mines"
 GIB_wd_zn_directorate_seat_desc:0 "The National Administration is reconstituted as a directorate of mines and works, staffed by engineers and auditors appointed on published criteria. It governs by technical order and keeps elections off the calendar. Collective and unnamed, it promises that every rule will be written down. Critics answer that a written rule is still a rule nobody voted for."
 GIB_wd_zn_board_payroll:0 "The Board Trims the Payroll"
 GIB_wd_zn_board_payroll_desc:0 "Its opening move is an audit of the Administration's payroll, line by line, merging offices and selling vehicles nobody can account for. Costs drop by the next budget, and the board publishes the savings with some pride. The clerks who lost posts have long memories, and the pit towns notice that no board member took a cut."
 GIB_wd_zn_chamber_budget:0 "Six Weeks Over the Zone Budget"
 GIB_wd_zn_chamber_budget_desc:0 "The chamber debates the zone budget in public for six weeks, and the final vote is close. Every royalty line, every rail subsidy and every clinic grant has a name attached to it. Business slows while deputies argue. When the budget passes it carries a legitimacy no decree ever had, and the firms find their lobbyists far busier."
 GIB_wd_zn_council_stewards:0 "Safety Stewards Below Ground"
 GIB_wd_zn_council_stewards_desc:0 "The federation places an elected safety steward on every shift, with authority to stop work when gas, water or bad timber threatens. Output drops in the first months as old hazards are finally fixed. Injuries drop too. The firms complain about lost tonnage; the miners stop complaining about funerals, and the federation's support hardens."
 GIB_wd_zn_directorate_standards:0 "Standards Printed and Posted"
 GIB_wd_zn_directorate_standards_desc:0 "The directorate prints its technical standards for shafts, rail, harbour work and accounts, and posts them in every office and at every pithead. Inspectors carry the same booklet as the managers they inspect. Disputes shrink to questions of measurement. The rules are sound and dull, and people who never voted for them at least know what they say."
 GIB_wd_zn_zone_statute:0 "A Statute for the Mining Zone"
 GIB_wd_zn_zone_statute_desc:0 "Whichever office now governs, the zone needs one written statute that outlasts it: who may license a shaft, who sets the royalty floor, who declares an emergency and how the next government is chosen. Drafting it takes a year of quarrelsome sessions. The result is shorter than the old charter and much harder to ignore."
 GIB_wd_cn_weighbridge:0 "Tonnage Books at the Weighbridge"
 GIB_wd_cn_weighbridge_desc:0 "Every wagon of ore leaving the zone crosses a weighbridge, yet nobody in the Administration keeps a complete record of what crossed. The firms do, and they report the totals that suit them. Clerks posted at each weighbridge, with sealed books and a copy sent to the port city every day, give the zone its first independent count of its own wealth."
 GIB_wd_cn_west_terms:0 "Reading the Western Concession"
 GIB_wd_cn_west_terms_desc:0 "The ore rights in West Gibraltar are held for Aurelia, and the operating terms were written long before the present staff arrived. Lawyers read every clause: royalty rates, haulage charges, what happens to tailings and who repairs the roads. Nothing in the rights changes. What changes is that the Administration finally knows what it signed."
 GIB_wd_cn_west_terms_tt_1:0 "Resource rights in West Gibraltar are unchanged."
 GIB_wd_cn_east_terms:0 "Reading the Eastern Concession"
 GIB_wd_cn_east_terms_desc:0 "East Gibraltar's ore rights are held for Arklith, and its mines feed a line that runs north toward the Llano as easily as west to the port. The eastern terms are shorter and vaguer than the western ones. A careful reading finds royalty floors that were never indexed and road duties nobody has enforced since the rails went in."
 GIB_wd_cn_east_terms_tt_1:0 "Resource rights in East Gibraltar are unchanged."
 GIB_wd_cn_royalty_compact:0 "A Royalty Compact with the Holders"
 GIB_wd_cn_royalty_compact_desc:0 "One answer accepts the concession model and negotiates a better price for it: indexed royalties, a share of every new seam and fixed obligations for roads, water and tailings. The holders keep operating, and the zone collects more and argues less. It ties the budget to foreign order books for another generation in exchange for predictable money."
 GIB_wd_cn_ore_company:0 "A Zone Ore Company"
 GIB_wd_cn_ore_company_desc:0 "The other answer builds a public ore company that takes over haulage, sorting and sales of the zone share, and bids for minority stakes in the operating firms wherever owners will sell. The rights stay with their holders. The company keeps more of the value inside the zone, at the price of capital it must borrow and managers it must train."
 GIB_wd_cn_royalty_bench:0 "An Arbitration Bench for Royalties"
 GIB_wd_cn_royalty_bench_desc:0 "Under the compact, disputes over grades, weights and payment dates go to a standing bench of three arbitrators: one named by the holders, one by the zone and a third drawn at random from a published panel. Hearings are short and rulings are final. Lawyers lose a profitable trade, and the treasury gains a calendar it can plan around."
 GIB_wd_cn_company_haulage:0 "The Company Takes the Haulage"
 GIB_wd_cn_company_haulage_desc:0 "The ore company buys out the private haulage contracts on the main line and runs the wagons itself. Turnaround at the port improves once one dispatcher sees the whole line. The company also inherits every broken wagon and every grudge of the old contractors, and its first annual accounts show a loss its critics quote for years."
 GIB_wd_cn_tungsten_grades:0 "Grade the Tungsten Before Sale"
 GIB_wd_cn_tungsten_grades_desc:0 "Tungsten is the richest of the zone's ores and the one most often sold as mixed rubble at the lowest grade. Sorting sheds at the railheads separate concentrate from waste before loading. Buyers pay more for a known grade. The sheds need power, water and trained sorters, and the first season's output falls while the crews learn."
 GIB_wd_cn_chromium_shed:0 "A Covered Shed for Chromium"
 GIB_wd_cn_chromium_shed_desc:0 "Chromium ore sits in open heaps at the eastern railhead, washing into ditches with every storm and losing weight to theft. A covered shed with a weighed gate keeps the stock dry and counted. It also lets the zone hold ore back when prices are poor, which the operating firms call interference and the treasury calls prudence."
 GIB_wd_cn_tailings:0 "Inspect the Tailings Dams"
 GIB_wd_cn_tailings_desc:0 "Decades of washing ore have left tailings dams above several pit towns, each built by whichever firm needed one at the time. Engineers walk every embankment and drill test holes. Most are sound; two need buttressing before the next wet season. The repairs cost money nobody budgeted, and the report gives the towns reason to ask who is liable."
 GIB_wd_cn_royalties_banked:0 "Royalties Paid on the Day"
 GIB_wd_cn_royalties_banked_desc:0 "Whichever model the zone chose, its income now arrives on a published schedule rather than whenever a firm's accountants felt generous. The treasury can borrow against it, pay contractors on time and stop begging the port for advances. Prompt money is not more money, but it changes how every office plans, and late payment becomes news."
 GIB_wd_tw_town_rolls:0 "Rolls of the Pit Towns"
 GIB_wd_tw_town_rolls_desc:0 "Most people in the zone live in West Gibraltar, around the port city and the hill shafts behind it; East Gibraltar is thinner, a string of plains settlements along the line. No office holds an accurate list of households, wells or classrooms. A house-to-house roll costs a season of clerks' time and gives every later plan its numbers."
 GIB_wd_tw_dust_clinics:0 "Dust Clinics at the Pitheads"
 GIB_wd_tw_dust_clinics_desc:0 "Older miners cough, and younger ones are learning to. Small clinics at the largest pitheads screen lungs, treat injuries and keep records the firms never kept. Doctors must be recruited from abroad on high salaries for the first years. The records will eventually show which shafts are killing people, and that knowledge will not stay quiet."
 GIB_wd_tw_night_classes:0 "Night Classes After the Shift"
 GIB_wd_tw_night_classes_desc:0 "Classrooms in the pit towns stand empty after dark, while shift workers who want to become electricians, surveyors or engine drivers have nowhere to learn. Teachers paid by the hour open evening courses in reading plans, basic chemistry and machine repair. Attendance is uneven and tired. The best students become the foremen the zone has always imported."
 GIB_wd_tw_company_housing:0 "Company Leases for Miners"
 GIB_wd_tw_company_housing_desc:0 "One housing answer lets the operating firms build and lease homes near their shafts, with rent taken from wages. Houses go up quickly and the firms keep their workers close. Tenants who lose their jobs lose their homes as well, and every strike becomes an eviction dispute. The Administration avoids the cost and gives up its say."
 GIB_wd_tw_housing_trusts:0 "Housing Trusts in Every Town"
 GIB_wd_tw_housing_trusts_desc:0 "The alternative creates a public housing trust in each town, financed from royalties and governed by tenants and the town office. Building is slower, and the trusts borrow against future income. A miner who loses a job keeps a home, which makes miners harder to discipline and easier to keep. The firms see that difference clearly."
 GIB_wd_tw_east_water:0 "Water Mains for the Eastern Towns"
 GIB_wd_tw_east_water_desc:0 "Settlements on the eastern plains still draw water from shallow wells that mine drainage has started to spoil. A main laid along the rail corridor from cleaner springs in the hills serves the railhead towns first. Digging beside a working line needs careful scheduling with the dispatchers, and the trench doubles as a better service road."
 GIB_wd_tw_station_market:0 "A Covered Market by the Station"
 GIB_wd_tw_station_market_desc:0 "Market traders in Gibraltar City sell from carts in the station square, beside the ore trains, in every kind of weather. A covered hall with water, drains and stalls for rent gives farmers from both districts a reason to come in by train. It is a small building. It changes how the port city spends its Saturdays and its wages."
 GIB_wd_tw_pension_chest:0 "A Pension Chest for Miners"
 GIB_wd_tw_pension_chest_desc:0 "Miners rarely work past fifty, and those who leave the pits with damaged lungs depend on their children. A pension chest funded by a levy on every tonne gives retired and injured miners a small, certain income. The firms object to the levy. The towns notice that old men no longer haunt the station square selling their tools."
 GIB_wd_tw_ambulance_strip:0 "An Air Ambulance Strip"
 GIB_wd_tw_ambulance_strip_desc:0 "Serious injuries in the hill shafts still travel to the port city by truck along slow switchback roads. A graded strip outside Gibraltar City, with a hangar and a fuel store, lets a light aircraft carry the worst cases and fly specialists in. The zone has no air arm and wants none. It wants a faster road to a surgeon."
 GIB_wd_hb_soundings:0 "Soundings off Gibraltar City"
 GIB_wd_hb_soundings_desc:0 "Gibraltar City is the zone's only port: a deep harbour on the western coast with a large naval base built for a fleet the zone does not have. Ore ships anchor offshore for days waiting for a berth. A survey of depths, berths and cranes shows how much of the harbour is used, how much stands idle and how much has silted up."
 GIB_wd_hb_ore_belt:0 "A Covered Belt to the Ore Berth"
 GIB_wd_hb_ore_belt_desc:0 "Ore still reaches the ships by grab cranes and open wagons, spilling dust over the waterfront and losing tonnage to every gust. A covered conveyor from the railway sidings straight to the main ore berth halves loading time and clears the air over the old town. The steel for the gantry must be bought abroad, which stings."
 GIB_wd_hb_pilot_service:0 "A Pilot Service for the Approaches"
 GIB_wd_hb_pilot_service_desc:0 "Foreign masters bring ore carriers into a harbour they visit twice a year, guided by charts nobody has updated. A licensed pilot service with its own launches, trained on the approaches and the tides, cuts groundings and waiting times. Pilot fees add to the cost of calling at the zone, and shipowners mention them in every negotiation."
 GIB_wd_hb_hull_register:0 "Sixty Hulls on the Register"
 GIB_wd_hb_hull_register_desc:0 "Around sixty merchant hulls trade under the zone's arrangements, carrying ore out and fuel, food and machinery in. Their papers are scattered among agents in several ports. A single register in Gibraltar City records each hull, its crew, its insurance and its usual route. In a quiet year this is paperwork. In a crisis it becomes a map."
 GIB_wd_hb_free_port:0 "Free Port Status for the Harbour"
 GIB_wd_hb_free_port_desc:0 "Declaring the harbour a free port waives duties on goods that land, are stored or are repacked there before moving on. Traders from neighbouring countries could use Gibraltar City as their own warehouse by the sea. Duty revenue falls at once, while storage, handling and jobs may grow. Smugglers will certainly notice the change as well."
 GIB_wd_hb_bonded_terminal:0 "A Bonded Ore Terminal"
 GIB_wd_hb_bonded_terminal_desc:0 "The narrower answer keeps duties in place but creates a bonded terminal for ore, concentrates and imported mining equipment, sealed and supervised by customs. Holders and buyers can store and blend cargoes without paying until they sail. It serves the zone's own trade well and offers neighbours little. Customs officers like it; merchants find it timid."
 GIB_wd_hb_harbour_launches:0 "Harbour Police Launches"
 GIB_wd_hb_harbour_launches_desc:0 "The zone keeps no combat navy and has no plan to build one. It does need boats that can fight a fire, chase a thief or escort a damaged ship to a berth. A handful of fast launches crewed by harbour police and customs officers cover the waterfront day and night, and their crews slowly learn the sea."
 GIB_wd_hb_approach_radar:0 "Radar over the Harbour Approaches"
 GIB_wd_hb_approach_radar_desc:0 "Fog rolls off the western sea for weeks each year, and ore ships wait outside rather than risk the approaches blind. A shore radar on high ground above the harbour, linked to the pilot station, lets masters come in on bearings and ranges. Traffic keeps moving in poor weather, and the harbour finally sees what lies offshore."
 GIB_wd_hb_return_cargo:0 "Return Cargoes for Ore Ships"
 GIB_wd_hb_return_cargo_desc:0 "Ore carriers arrive at Gibraltar City nearly empty and leave full. Agents in the port now hunt for return cargoes: fuel, cement, timber, machinery and food the zone imports anyway. Filling empty holds lowers freight rates in both directions. It also makes the port city a trading place instead of a loading chute, with all the bargaining that brings."
 GIB_wd_rl_walk_line:0 "Walk the Ore Line End to End"
 GIB_wd_rl_walk_line_desc:0 "One main line carries almost everything the zone produces, climbing from Gibraltar City through the western hills and mountains and dropping onto the eastern plains at the railhead. Inspectors walk every kilometre with hammers and notebooks, counting rotten sleepers, cracked rails and washed-out culverts. Their report is the first full picture of the line in years."
 GIB_wd_rl_mountain_grade:0 "Reballast the Mountain Grade"
 GIB_wd_rl_mountain_grade_desc:0 "The steepest section of the line crosses the mountain ground between the two districts, where ballast washes away each wet season and trains crawl at walking pace. Fresh ballast, new drainage and heavier rail on the grade let longer trains climb without a second engine. Work trains will block the line on many nights while it is done."
 GIB_wd_rl_east_railhead:0 "A Railhead Yard in the East"
 GIB_wd_rl_east_railhead_desc:0 "Trains from the eastern mines are made up in a cramped yard where shunting blocks the main line for hours. A larger railhead yard with loops for full trains and sidings for empties lets the east load without stopping traffic. The yard also gives the territorial service a place to stage stores if it ever needs one."
 GIB_wd_rl_port_sidings:0 "Sidings Behind the Port"
 GIB_wd_rl_port_sidings_desc:0 "At the western end, ore trains queue on the main line waiting for berths, and passenger trains queue behind them. New sidings behind the harbour hold full trains until a ship is ready. The land is cramped and some warehouses must be moved. The city's commuters will be the first to notice and the last to thank anyone."
 GIB_wd_rl_open_access:0 "Open Access on the Ore Line"
 GIB_wd_rl_open_access_desc:0 "Under open access, any licensed operator may run trains on the zone's track by paying a published fee per tonne and kilometre. Firms that want faster service can buy their own wagons and engines. The Administration becomes a track owner and timetable keeper. Service improves, and scheduling arguments become a weekly ritual at dispatch."
 GIB_wd_rl_zone_trains:0 "One Dispatcher for Every Train"
 GIB_wd_rl_zone_trains_desc:0 "The opposite rule keeps the track and the trains under one public operator, with a single dispatcher who sees the whole line. Nobody else runs a train. Wagon supply becomes a planning question rather than a market. The firms lose the ability to buy faster service, and the dispatcher becomes the most powerful clerk in the zone."
 GIB_wd_rl_arklith_timetable:0 "A Shared Timetable with Arklith"
 GIB_wd_rl_arklith_timetable_desc:0 "Two branch lines leave the zone northward into Arklith, one from the port city toward Marcil and one from the eastern railhead toward the Llano. Their timetables were set separately and rarely meet. A joint timetable agreed with Arklith railway officials lets wagons cross without waiting a day at the frontier. Customs must keep the same hours."
 GIB_wd_rl_aurelia_timetable:0 "A Shared Timetable with Aurelia"
 GIB_wd_rl_aurelia_timetable_desc:0 "Southward, short lines link the port city and the eastern plains with Aurelian districts across the frontier. Traffic is lighter than to the north but steadier, mostly food and fuel coming in. Matching timetables with Aurelian operators and opening a joint freight office at the crossing cuts the number of half-empty wagons standing idle on both sides."
 GIB_wd_rl_block_signals:0 "Block Signals on the Single Track"
 GIB_wd_rl_block_signals_desc:0 "Most of the main line is single track, worked by paper train orders that depend on careful clerks and working telephones. Electric block signals with track circuits stop two trains entering the same section. Capacity rises and the worst kind of accident becomes far harder. Signal engineers must be trained, and copper thieves kept away."
 GIB_wd_sv_muster:0 "Muster the Four Battalions"
 GIB_wd_sv_muster_desc:0 "The zone's armed force is a territorial service of four infantry battalions in two formations, with trucks, rifles and trains but no aircraft, artillery or engineers. Its job is to guard two districts and help when the mines or the weather turn deadly. A full muster shows who turns up, what works and what has quietly rusted."
 GIB_wd_sv_rescue_companies:0 "Mine Rescue Companies"
 GIB_wd_sv_rescue_companies_desc:0 "When a shaft floods or a gallery collapses, the nearest help is usually the next shift, with whatever tools it carries. Training two companies of the service as mine rescue teams, with breathing sets and a dedicated train, gives the zone a disciplined response. Soldiers grumble about crawling through mud; families remember who came."
 GIB_wd_sv_ridge_marches:0 "Marches on the Western Ridges"
 GIB_wd_sv_ridge_marches_desc:0 "The western hills and mountains are the zone's natural defence and its least known ground. Battalions march the ridges in every season, mapping tracks, springs and caves and timing how long it takes to move a company from the railway to a pass. The marches cost boots and fuel. They make the service at home in its own hills."
 GIB_wd_sv_pass_guard:0 "Guard the Mountain Passes"
 GIB_wd_sv_pass_guard_desc:0 "One doctrine for a very small force is to hold ground it knows: prepared posts on the passes, stores in caves and a reserve that walks rather than drives. It suits the hills and the service's lack of heavy weapons. It leaves the plains of East Gibraltar lightly held and depends on soldiers who can live rough for weeks."
 GIB_wd_sv_motor_column:0 "A Motor Column Along the Line"
 GIB_wd_sv_motor_column_desc:0 "The other doctrine uses the trucks and the railway to move a small force fast: a motorised column that can reach any town on the line within hours, backed by trains for heavy loads. It suits the eastern plains and the service's large truck park. It also ties the force to roads and rails that any storm can cut."
 GIB_wd_sv_railhead_stores:0 "Service Stores at the Railhead"
 GIB_wd_sv_railhead_stores_desc:0 "With a proper railhead yard in the east, the service can keep a reserve of rifles, rations, fuel and tents where trains can reach it from either end of the line. A guarded depot replaces scattered sheds in town halls and police stations. Quartermasters gain a single inventory; thieves lose a dozen easy targets."
 GIB_wd_sv_shift_reserve:0 "A Reserve Drawn from the Shifts"
 GIB_wd_sv_shift_reserve_desc:0 "Most young adults in the zone work shifts in the mines, the railyards or the port. A reserve roll lets them train with the service for two weeks a year, scheduled around their shift patterns with the firms' agreement. The service gains numbers it could never pay full time. Employers lose a fortnight of labour every year."
 GIB_wd_sv_liaison_strip:0 "A Liaison Strip in the East"
 GIB_wd_sv_liaison_strip_desc:0 "East Gibraltar is a long day by road from the port city. A short gravel strip beside the eastern depot lets a borrowed light aircraft carry officers, medicine or spare parts across in an hour. The zone still has no combat air arm, and the strip is not a step toward one; it is a shortcut over the mountains."
 GIB_wd_sv_leasath_posts:0 "Observation Posts Toward Leasath"
 GIB_wd_sv_leasath_posts_desc:0 "East Gibraltar's frontier with Leasath crosses open hill and plain with few landmarks. The service builds observation posts with radios and a small radar on the higher ground, staffed in rotation. They report traffic, weather and grass fires rather than threats. Leasath is told what they are for, and no claim or line moves."
 GIB_wd_sv_leasath_posts_tt_1:0 "No claim, core or frontier change."
 GIB_wd_nb_one_table:0 "Three Frontiers and a Coast"
 GIB_wd_nb_one_table_desc:0 "Arklith lies to the north, Aurelia to the south and Leasath to the east, and the western sea carries everything else. The ore rights in both districts are held for the two largest neighbours. The zone has never set a foreign policy of its own, only answered letters. A small frontier office now gathers every agreement into one file."
 GIB_wd_nb_arklith_desk:0 "A Standing Desk for Arklith"
 GIB_wd_nb_arklith_desk_desc:0 "Arklith holds the eastern ore rights and runs two of the rail links north. Questions about wagons, royalties, customs and workers crossing for shifts arrive at a dozen offices. A standing desk staffed by officials who know the Arklith ministries handles all of them. It costs salaries and gives the north a single number to call."
 GIB_wd_nb_aurelia_desk:0 "A Standing Desk for Aurelia"
 GIB_wd_nb_aurelia_desk_desc:0 "Aurelia holds the western ore rights, the larger share of the zone's output, and supplies much of the food that comes in by road. Aurelian business has always gone through the port agents. A standing desk in the Administration takes it over, with staff who read the Aurelian press and know which ministry decides what."
 GIB_wd_nb_leasath_crossing:0 "Crossing Hours with Leasath"
 GIB_wd_nb_leasath_crossing_desc:0 "Leasath shares only the eastern frontier and holds no rights in the zone, but herders, traders and seasonal workers cross it daily. Agreed crossing hours, a shared list of permitted goods and a monthly meeting of post commanders keep small frictions small. The arrangement changes no line on any map and asks nothing of either capital."
 GIB_wd_nb_leasath_crossing_tt_1:0 "No claim, core or frontier change."
 GIB_wd_nb_every_buyer:0 "Ore for Any Lawful Buyer"
 GIB_wd_nb_every_buyer_desc:0 "One stance treats the zone as a neutral market: the share of ore it controls goes to any lawful buyer at the best price, and no neighbour receives special terms. Prices rise when markets are hot. Relations with the rights holders cool a little, since they expected to stand first in line for every tonne the pits produce."
 GIB_wd_nb_near_contracts:0 "Long Contracts Next Door"
 GIB_wd_nb_near_contracts_desc:0 "The other stance signs long supply contracts with Arklith and Aurelia for the zone's own share, at fixed prices with modest indexation. Income becomes steady and the neighbours become partners with a stake in calm. In a boom the zone sells too cheaply. In a slump it is the only seller in the region still being paid."
 GIB_wd_nb_war_news:0 "War News at the Weighbridges"
 GIB_wd_nb_war_news_desc:0 "News of war around Belka reaches the zone in late March 1995, from far beyond its frontiers. Gibraltar takes no part and has no reason to. Yet tungsten and chromium are war metals, and within weeks brokers are telephoning the port with offers nobody has seen before. The Administration now has to work out how a neutral mining zone behaves when its ore suddenly matters."
 GIB_wd_nb_war_premium:0 "A Premium Nobody Planned For"
 GIB_wd_nb_war_premium_desc:0 "Wartime prices reach the weighbridges for a few months, and the zone's share of the ore earns more than anyone budgeted. The treasury wants to bank the windfall. The towns want it spent before it disappears. Insurers raise rates on every ship sailing from Gibraltar City, which eats part of the premium before it ever lands."
 GIB_wd_nb_after_lumen:0 "Prices Fall After Lumen"
 GIB_wd_nb_after_lumen_desc:0 "Peace is signed at Lumen on 20 June 1995 and the Belkan War is over; the brokers stop calling almost overnight. Contracts written in the spring at wartime prices are renegotiated or quietly abandoned. The zone counts what the war earned it and what the fall costs. The Administration resolves never again to budget a war price as income."
 GIB_wd_nb_neutral_statute:0 "Neutrality Written Down"
 GIB_wd_nb_neutral_statute_desc:0 "Whatever stance it took on its ore, the zone now writes its neutrality into law: no foreign troops on its soil, no arms sold to parties at war and equal access for lawful trade. It costs nothing to print and something to keep. Neighbours can now hold the zone to its word, and that is exactly why it is written."
 GIB_wd_sk_impact_notice:0 "The Impact Notice in the Zone"
 GIB_wd_sk_impact_notice_desc:0 "Ulysses has been a newspaper word since the IAU warning of late 1994. In April 1996 the FCU announcement turns it into a planning problem for every government, this one included, and the landing places of the fragments are unknown. The Administration gathers engineers, doctors and railway officials and asks a question it has never faced: how do two small districts shelter everyone?"
 GIB_wd_sk_gallery_survey:0 "Survey the Worked-Out Galleries"
 GIB_wd_sk_gallery_survey_desc:0 "Generations of mining have left kilometres of worked-out galleries under the western hills, some dry and stable, others flooded or collapsing. Survey teams with lamps and gas meters map which could hold people for days, how air would reach them and where water would come from. The survey costs a season and several close calls."
 GIB_wd_sk_ridge_watch:0 "Sky Watch on the Western Ridge"
 GIB_wd_sk_ridge_watch_desc:0 "Fragments may come with little warning, and the zone has no air defence and no observatory. A watch post on the western ridge with a radar, telescopes lent by schools and a telephone wired straight to the port city gives minutes of notice that sirens can use. Volunteers staff it through the nights, at first with real enthusiasm."
 GIB_wd_sk_gallery_shelters:0 "Shelters in the Old Galleries"
 GIB_wd_sk_gallery_shelters_desc:0 "The first plan turns the best galleries into shelters: doors, ventilation fans, latrines, bunks and water tanks, with marked routes from every western town. Mining crews do the work they know best. It shelters the west well and the eastern plains poorly, since the galleries lie in the hills, and someone must maintain them afterwards."
 GIB_wd_sk_evacuation_trains:0 "Evacuation Trains on the Ore Line"
 GIB_wd_sk_evacuation_trains_desc:0 "The second plan relies on the railway: every engine and wagon in the zone held ready to move people away from whichever district is threatened, along a line the dispatchers know by heart. It costs less than shelters and serves both districts. It depends on warning, on the line staying intact and on crews who will drive toward danger."
 GIB_wd_sk_stock_galleries:0 "Stock the Deep Levels"
 GIB_wd_sk_stock_galleries_desc:0 "An empty gallery protects nobody for long. Tinned food, medicine, blankets, batteries and water purifiers go down into the galleries in sealed crates, with a rotation schedule so stores do not spoil unseen. Warehouses in the port city empty for a season, and prices for some staples rise. Each town learns which gallery is its own."
 GIB_wd_sk_last_week:0 "A Timetable for the Last Week"
 GIB_wd_sk_last_week_desc:0 "The dispatchers draft a special timetable for the days before any impact: which trains go where, in what order, carrying whom. Every station posts its own page. Practice runs move schools and hospitals at night with few complaints. The timetable assumes the line will be intact, and the engineers quietly write a second one that assumes otherwise."
 GIB_wd_sk_breakup_night:0 "Sirens on the Breakup Night"
 GIB_wd_sk_breakup_night_desc:0 "When Ulysses goes inside the Roche limit on 8 July 1999 and breaks up, years of waiting end within days. The zone's plans meet the real thing. Sirens sound, trains stand ready or gallery doors close, and the ridge watch logs whatever it sees. Wherever the fragments come down, the zone must now live with what its preparations cost and what they proved."
 GIB_wd_sk_relief_line:0 "Relief Trains for Stricken Neighbours"
 GIB_wd_sk_relief_line_desc:0 "With the zone's own preparations stood down, the railway and the harbour have spare capacity and an organisation used to moving people quickly. Relief trains and ships carry blankets, medicine and engineers to neighbours who ask for help. It costs fuel and stock the zone paid for. It earns a kind of goodwill royalties cannot buy."
 GIB_wd_lt_last_lot:0 "One Free Lot in West Gibraltar"
 GIB_wd_lt_last_lot_desc:0 "West Gibraltar has a single serviced industrial lot left near the harbour, big enough for one large plant; East Gibraltar has none at all. Three proposals compete for that last lot: a smelter, a repair yard and an arms line. Whatever is built will shape the zone's economy for decades, and the losing bids will not get another chance."
 GIB_wd_lt_smelter:0 "A Ferroalloy Smelter on the Lot"
 GIB_wd_lt_smelter_desc:0 "A smelter would turn the zone's chromium and tungsten into ferroalloys before export, keeping the most valuable step at home. It needs large amounts of power and skilled furnace crews the zone does not yet have. The operating firms would rather ship raw ore. The smelter would make the zone a processor rather than only a quarry."
 GIB_wd_lt_repair_yard:0 "A Ship Repair Yard on the Lot"
 GIB_wd_lt_repair_yard_desc:0 "A repair yard by the harbour would service the ore carriers and the zone's merchant hulls without sending them abroad for every hull survey. It suits the port's deep water and its large naval base. Yards are hungry for steel and skilled welders, and their order books depend on shipping markets the zone cannot control."
 GIB_wd_lt_arms_line:0 "An Arms Line on the Lot"
 GIB_wd_lt_arms_line_desc:0 "The third bid is an arms plant making rifles, truck parts and ammunition for the territorial service, with spare capacity for export. It would make the service self-supplied and employ hundreds. Neighbours would notice a neutral zone adding arms production, and export licences would test every promise the zone has made about neutrality."
 GIB_wd_lt_smelter_power:0 "Power for the Furnaces"
 GIB_wd_lt_smelter_power_desc:0 "The smelter's furnaces draw more power than the port city uses at night. A long-term power contract, a new substation and a high-voltage line link the plant to supply it can count on. Households complain when the first winter's prices rise. The furnace crews, trained abroad, come home to the best-paid jobs in the zone."
 GIB_wd_lt_yard_orders:0 "Repair Orders from the Ore Fleet"
 GIB_wd_lt_yard_orders_desc:0 "The yard's first order book comes from the ore carriers that already call at Gibraltar City: hull cleaning, propeller work and classification surveys. Shipowners save days of steaming to foreign yards. The welders learn on routine jobs before attempting anything larger. Success depends on how many ships the harbour attracts."
 GIB_wd_lt_arms_licences:0 "Export Licences Under Review"
 GIB_wd_lt_arms_licences_desc:0 "Every export from the new arms line now needs a licence reviewed by a panel that publishes its decisions. Sales to parties at war are refused. The plant loses some orders and gains a reputation neighbours can trust. The territorial service receives its rifles first, and the panel's reports become required reading next door."
 GIB_wd_lt_assay_office:0 "An Assay Office of Our Own"
 GIB_wd_lt_assay_office_desc:0 "Every grade dispute in the zone ends with a sample sent to a laboratory abroad, chosen and paid for by the buyer. A public assay office in the port city tests samples from every shipment and issues certificates both sides must accept. Chemists must be hired and equipment imported. Grade disputes shrink from months to days."
 GIB_wd_lt_mines_school:0 "A School of Mines for the Zone"
 GIB_wd_lt_mines_school_desc:0 "Night classes have shown that the pit towns hold more talent than anyone assumed. A full school of mines, with courses in geology, surveying, ventilation and metallurgy, turns that talent into engineers. Lecturers come from abroad at first. Graduates who stay replace the foreign managers the firms have always brought in, and the firms change too."
 GIB_wd_lt_carbide_tools:0 "Carbide Bits from Local Tungsten"
 GIB_wd_lt_carbide_tools_desc:0 "Drill bits and cutting tools tipped with tungsten carbide wear far longer than steel ones, and the zone mines the tungsten yet imports every bit. A small carbide workshop at the school makes tips for local drills, first as a teaching exercise and later for sale. It is a modest start in turning ore into finished products."
 GIB_wd_lt_gas_detection:0 "Gas Detection in Every Gallery"
 GIB_wd_lt_gas_detection_desc:0 "Methane and carbon monoxide still kill miners whose lamps give little warning. The assay laboratory tests electronic gas detectors and fixes them in the deepest galleries, wired to alarms at the surface. Firms pay for installation on the main shafts. Accidents fall, and the electronics bench becomes a small trade of its own."
 GIB_wd_cy_ledger_decade:0 "Ten Years of Weighbridge Books"
 GIB_wd_cy_ledger_decade_desc:0 "A decade of weighbridge books, census rolls, clinic records and train logs now exists, and nobody has read them side by side. The statistics office binds them into the zone's first yearbook: who governs, who keeps the value of the ore, how the towns live and how the line runs. Every faction prepares to quote it."
 GIB_wd_cy_board_seats:0 "The Board Reallocates Its Seats"
 GIB_wd_cy_board_seats_desc:0 "The concession board's seats were assigned by output when it took office, and the shares have shifted since. New firms want seats; old ones refuse to give theirs up. The board adopts a formula weighted by tonnage, employment and royalties paid. It is more defensible than the old allocation and makes every meeting a quarrel about arithmetic."
 GIB_wd_cy_chamber_second:0 "A Second Chamber Election"
 GIB_wd_cy_chamber_second_desc:0 "The district chamber faces its voters again, and the campaign is about royalties, rents and the ore line rather than whether the chamber should exist. Turnout falls from the first election, which pessimists call apathy and optimists call normal life. The new cabinet inherits a budget process that works and promises few believed."
 GIB_wd_cy_delegate_congress:0 "A Congress of Pit Delegates"
 GIB_wd_cy_delegate_congress_desc:0 "The federation of pit councils calls its first full congress in a decade, with delegates from every shaft, yard and quay. Motions range from shorter shifts to the future of the concessions. The congress keeps the federation honest and slow. Investors watch the motions closely, and some quietly return when the boldest ones are defeated."
 GIB_wd_cy_directorate_audit:0 "An Outside Audit of the Directorate"
 GIB_wd_cy_directorate_audit_desc:0 "The directorate invites auditors from outside the zone to examine its standards, accounts and decisions over ten years. Their report praises the rulebook and criticises how rarely anyone outside the directorate was consulted. Publishing it costs face; refusing would cost more, so the directorate prints the report with its replies beside it."
 GIB_wd_cy_compact_renewal:0 "Renewing the Royalty Compact"
 GIB_wd_cy_compact_renewal_desc:0 "The royalty compact's first term ends, and both the holders and the zone come to the table with ten years of data. The zone asks for higher indexation on tungsten and firmer tailings duties. The holders ask for longer terms. The renewed compact gives each side something and makes the next renewal look easier than this one."
 GIB_wd_cy_company_wagons:0 "New Wagons for the Ore Company"
 GIB_wd_cy_company_wagons_desc:0 "The ore company has run the haulage for years with wagons that were old when it bought them. A fleet renewal programme, financed by bonds secured on haulage fees, replaces the worst of them. Turnaround improves and breakdowns fall. The bonds tie the company to its creditors, who now ask about its accounts every quarter."
 GIB_wd_cy_usean_freight:0 "Freight Rates and a Usean War"
 GIB_wd_cy_usean_freight_desc:0 "In August 2003 the founding of the ISAF signals open war on the Usean continent, far from the zone. Shipping insurers react before anyone else, raising rates on every route that might touch the war. The hull register shows which zone-linked ships sail near the danger. Ore prices stir again, and the Administration remembers 1995."
 GIB_wd_cy_ore_fund:0 "An Ore Fund for Lean Years"
 GIB_wd_cy_ore_fund_desc:0 "Ore runs out eventually, and prices rise and fall on wars and markets far away. A fund that saves part of every year's royalties, invested abroad and drawn only by a published rule, protects the zone against both. Every year's spending is smaller than it could be. The fund's critics ask exactly whom the zone is saving for."
 GIB_wd_cy_spend_home:0 "Royalties Spent at Home"
 GIB_wd_cy_spend_home_desc:0 "The opposite view says the zone's people dug the ore and should see the royalties now: new schools, better clinics, paved roads and housing. A fund abroad helps nobody living in a pit town today. Spending everything brings visible results and leaves nothing for the day a seam closes or a price collapses."
 GIB_wd_cy_next_charter:0 "A Charter for the Next Decade"
 GIB_wd_cy_next_charter_desc:0 "The yearbook and the arguments it started become the basis for a revised charter, debated in whatever form the zone's government now allows. It keeps what worked, repairs what the tables showed was broken and sets the questions for the following ten years: depletion, the concessions, the line and the port."
 ac_wd_gib_tree:0 "Gibraltar: National Programme"
 ac_wd_gib_tree_desc:0 "The national focus programme of Gibraltar, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 GIB_wd_charter_review:0 "The Charter Under Review"
 GIB_wd_charter_review_desc:0 "The zone charter has been read aloud, and every faction is drafting amendments."
 GIB_wd_holders_compact:0 "The Holders at the Table"
 GIB_wd_holders_compact_desc:0 "Concession firms, hauliers and port agents sit with the Administration on every decision."
 GIB_wd_district_chamber:0 "A Chamber in Prospect"
 GIB_wd_district_chamber_desc:0 "Both districts are preparing to elect a chamber of their own."
 GIB_wd_pit_delegates:0 "Delegates from the Pits"
 GIB_wd_pit_delegates_desc:0 "Shift councils send delegates to every meeting of the Administration."
 GIB_wd_engineers_code:0 "The Engineers Code"
 GIB_wd_engineers_code_desc:0 "Technical staff are rebuilding the Administration around published standards."
 GIB_wd_payroll_trim:0 "A Trimmed Payroll"
 GIB_wd_payroll_trim_desc:0 "The board has merged offices and sold the vehicles nobody could account for."
 GIB_wd_voted_budget:0 "The Voted Budget"
 GIB_wd_voted_budget_desc:0 "Every line of the zone budget has passed the elected chamber."
 GIB_wd_safety_stewards:0 "Stewards Below Ground"
 GIB_wd_safety_stewards_desc:0 "An elected safety steward on every shift may stop work."
 GIB_wd_posted_standards:0 "Standards on the Wall"
 GIB_wd_posted_standards_desc:0 "Every office and pithead displays the same technical rules."
 GIB_wd_zone_statute:0 "The Zone Statute"
 GIB_wd_zone_statute_desc:0 "One written statute says who licenses, who taxes and who governs."
 GIB_wd_tonnage_books:0 "Weighbridge Books"
 GIB_wd_tonnage_books_desc:0 "Independent clerks record every wagon of ore that leaves the zone."
 GIB_wd_royalty_compact:0 "The Royalty Compact"
 GIB_wd_royalty_compact_desc:0 "Indexed royalties and fixed obligations agreed with the rights holders."
 GIB_wd_zone_ore_company:0 "The Zone Ore Company"
 GIB_wd_zone_ore_company_desc:0 "A public company hauls, sorts and sells the zone share of the ore."
 GIB_wd_royalty_bench:0 "The Royalty Bench"
 GIB_wd_royalty_bench_desc:0 "Grade and payment disputes go to a standing arbitration bench."
 GIB_wd_company_haulage:0 "Company Haulage"
 GIB_wd_company_haulage_desc:0 "The ore company runs the wagons on the main line."
 GIB_wd_graded_tungsten:0 "Graded Tungsten"
 GIB_wd_graded_tungsten_desc:0 "Sorting sheds sell tungsten by grade rather than as rubble."
 GIB_wd_chromium_stock:0 "The Chromium Shed"
 GIB_wd_chromium_stock_desc:0 "Chromium is stored dry, counted and held back when prices are poor."
 GIB_wd_dam_inspectorate:0 "The Dam Inspectorate"
 GIB_wd_dam_inspectorate_desc:0 "Engineers inspect every tailings embankment each year."
 GIB_wd_punctual_royalties:0 "Royalties on Schedule"
 GIB_wd_punctual_royalties_desc:0 "Concession income arrives on published dates."
 GIB_wd_town_rolls:0 "The Town Rolls"
 GIB_wd_town_rolls_desc:0 "A complete roll of households, wells and classrooms in both districts."
 GIB_wd_dust_clinics:0 "Dust Clinics"
 GIB_wd_dust_clinics_desc:0 "Pithead clinics screen lungs and treat injuries."
 GIB_wd_company_housing:0 "Company Housing"
 GIB_wd_company_housing_desc:0 "Firms build and lease homes beside their shafts."
 GIB_wd_housing_trusts:0 "Town Housing Trusts"
 GIB_wd_housing_trusts_desc:0 "Public trusts own and let homes in every town."
 GIB_wd_market_hall:0 "The Station Market"
 GIB_wd_market_hall_desc:0 "Farmers from both districts sell under one roof by the station."
 GIB_wd_pension_chest:0 "The Pension Chest"
 GIB_wd_pension_chest_desc:0 "A levy on every tonne pays retired and injured miners."
 GIB_wd_harbour_office:0 "The Harbour Office"
 GIB_wd_harbour_office_desc:0 "One office surveys and allocates every berth in Gibraltar City."
 GIB_wd_free_port:0 "A Free Harbour"
 GIB_wd_free_port_desc:0 "Goods landed, stored or repacked in the harbour pay no duty until they move on."
 GIB_wd_bonded_terminal:0 "The Bonded Terminal"
 GIB_wd_bonded_terminal_desc:0 "Ore and mining equipment wait under customs seal until they sail."
 GIB_wd_pilot_service:0 "Pilots of the Western Approaches"
 GIB_wd_pilot_service_desc:0 "Licensed pilots bring every ore carrier through the approaches."
 GIB_wd_harbour_patrol:0 "Harbour Patrol Launches"
 GIB_wd_harbour_patrol_desc:0 "Police and customs launches cover the waterfront day and night."
 GIB_wd_return_cargoes:0 "Return Cargoes"
 GIB_wd_return_cargoes_desc:0 "Ore carriers arrive with fuel, cement and machinery instead of ballast."
 GIB_wd_line_inspectors:0 "The Line Inspectorate"
 GIB_wd_line_inspectors_desc:0 "Inspectors walk the ore line and report every defect."
 GIB_wd_open_access_line:0 "Open Access Track"
 GIB_wd_open_access_line_desc:0 "Any licensed operator may run trains for a published fee."
 GIB_wd_zone_line_operator:0 "One Operator, One Dispatcher"
 GIB_wd_zone_line_operator_desc:0 "A single public operator runs every train on the line."
 GIB_wd_northern_timetable:0 "The Northern Timetable"
 GIB_wd_northern_timetable_desc:0 "Wagons cross into Arklith on a shared timetable."
 GIB_wd_southern_timetable:0 "The Southern Timetable"
 GIB_wd_southern_timetable_desc:0 "Wagons cross into Aurelia on a shared timetable."
 GIB_wd_signalled_line:0 "A Signalled Line"
 GIB_wd_signalled_line_desc:0 "Electric block signals protect every section of single track."
 GIB_wd_territorial_service:0 "The Four-Battalion Service"
 GIB_wd_territorial_service_desc:0 "Four infantry battalions guard two districts and answer emergencies."
 GIB_wd_pass_guard:0 "Guardians of the Passes"
 GIB_wd_pass_guard_desc:0 "Prepared posts and cave stores hold the hill passes on foot."
 GIB_wd_motor_column:0 "The Motor Column"
 GIB_wd_motor_column_desc:0 "Trucks and trains move a small force to any town on the line in hours."
 GIB_wd_rescue_companies:0 "Rescue Companies"
 GIB_wd_rescue_companies_desc:0 "Two service companies trained for flooded and collapsed galleries."
 GIB_wd_ridge_marches:0 "Ridge Marches"
 GIB_wd_ridge_marches_desc:0 "Battalions march the western ridges in every season."
 GIB_wd_railhead_depot:0 "The Railhead Depot"
 GIB_wd_railhead_depot_desc:0 "A guarded service depot at the eastern railhead."
 GIB_wd_shift_reserve:0 "The Shift Reserve"
 GIB_wd_shift_reserve_desc:0 "Shift workers train with the service for two weeks a year."
 GIB_wd_frontier_office:0 "The Frontier Office"
 GIB_wd_frontier_office_desc:0 "One office holds every agreement with the three neighbours."
 GIB_wd_open_ore_market:0 "Ore for Lawful Buyers"
 GIB_wd_open_ore_market_desc:0 "The zone share of the ore goes to the best lawful bid."
 GIB_wd_neighbour_contracts:0 "Contracts Next Door"
 GIB_wd_neighbour_contracts_desc:0 "Long supply contracts with Arklith and Aurelia at fixed prices."
 GIB_wd_crossing_hours:0 "Agreed Crossing Hours"
 GIB_wd_crossing_hours_desc:0 "Posts on the Leasath frontier keep the same hours and lists."
 GIB_wd_war_premium:0 "Wartime Ore Prices"
 GIB_wd_war_premium_desc:0 "Wartime prices for tungsten and chromium, and wartime insurance with them."
 GIB_wd_price_discipline:0 "Price Discipline"
 GIB_wd_price_discipline_desc:0 "No war price is ever again budgeted as income."
 GIB_wd_neutral_statute:0 "Statutory Neutrality"
 GIB_wd_neutral_statute_desc:0 "Neutrality is written into the law of the zone."
 GIB_wd_impact_board:0 "The Impact Board"
 GIB_wd_impact_board_desc:0 "Engineers, doctors and railway officials plan for Ulysses together."
 GIB_wd_gallery_shelters:0 "Gallery Shelters"
 GIB_wd_gallery_shelters_desc:0 "The best worked-out galleries are fitted as shelters."
 GIB_wd_evacuation_trains:0 "Evacuation Trains"
 GIB_wd_evacuation_trains_desc:0 "Every engine and wagon held ready to move a threatened town."
 GIB_wd_stocked_galleries:0 "Stocked Galleries"
 GIB_wd_stocked_galleries_desc:0 "Sealed crates of food, water and medicine wait in the deep levels."
 GIB_wd_evacuation_timetable:0 "The Last-Week Timetable"
 GIB_wd_evacuation_timetable_desc:0 "Every station knows which train leaves first and for whom."
 GIB_wd_relief_desk:0 "The Relief Desk"
 GIB_wd_relief_desk_desc:0 "Trains and ships of the zone carry help to neighbours who ask."
 GIB_wd_alloy_works:0 "The Alloy Works"
 GIB_wd_alloy_works_desc:0 "Ferroalloy furnaces run on a long-term power contract."
 GIB_wd_yard_order_book:0 "The Yard Order Book"
 GIB_wd_yard_order_book_desc:0 "Ore carriers bring their repairs to the harbour yard."
 GIB_wd_licence_panel:0 "The Licence Panel"
 GIB_wd_licence_panel_desc:0 "A published panel reviews every arms export."
 GIB_wd_assay_office:0 "The Assay Office"
 GIB_wd_assay_office_desc:0 "A public laboratory certifies the grade of every shipment."
 GIB_wd_mines_school:0 "The School of Mines"
 GIB_wd_mines_school_desc:0 "Geology, surveying and metallurgy taught in the zone."
 GIB_wd_carbide_workshop:0 "The Carbide Workshop"
 GIB_wd_carbide_workshop_desc:0 "Local tungsten tipped onto local drill bits."
 GIB_wd_seat_formula:0 "The Seat Formula"
 GIB_wd_seat_formula_desc:0 "Board seats follow tonnage, employment and royalties paid."
 GIB_wd_settled_chamber:0 "A Settled Chamber"
 GIB_wd_settled_chamber_desc:0 "The district chamber has survived its second election."
 GIB_wd_delegate_congress:0 "The Delegate Congress"
 GIB_wd_delegate_congress_desc:0 "Delegates from every shaft, yard and quay meet in full congress."
 GIB_wd_audited_directorate:0 "An Audited Directorate"
 GIB_wd_audited_directorate_desc:0 "Outside auditors have read the directorate and published their findings."
 GIB_wd_renewed_compact:0 "The Renewed Compact"
 GIB_wd_renewed_compact_desc:0 "A second term of the royalty compact with better indexation."
 GIB_wd_renewed_wagons:0 "Renewed Wagons"
 GIB_wd_renewed_wagons_desc:0 "A bond-financed wagon fleet for the ore company."
 GIB_wd_ore_fund:0 "The Ore Fund"
 GIB_wd_ore_fund_desc:0 "Part of every year of royalties is saved abroad for lean years."
 GIB_wd_home_works:0 "Royalties at Home"
 GIB_wd_home_works_desc:0 "Royalties are spent each year on schools, clinics and roads."
 GIB_wd_second_charter:0 "The Second Charter"
 GIB_wd_second_charter_desc:0 "A revised charter sets the questions for the next ten years."
 GIB_wd_ore_rush:0 "Extra Ore Trains"
 GIB_wd_ore_rush_desc:0 "Every spare engine and wagon is running ore this season."
 GIB_wd_charter_season:0 "Charter Season"
 GIB_wd_charter_season_desc:0 "Ore charters for the season have been auctioned on the register."
 ac_wd_gib.1.t:0 "The Charter on the Station Steps"
 ac_wd_gib.1.d:0 "The reading takes most of a morning. From the main station staircase in Gibraltar City, a clerk of the National Administration reads the zone's founding charter aloud, clause by clause, while ore trains shunt behind the crowd. Much of the charter concerns rights of way, weighbridges and the duties of shaft owners. Very little of it concerns who governs, because when it was written nobody thought the question mattered.\n\nIt matters now. The operating firms that work the concessions in both districts already make most of the decisions that shape daily life, from shift patterns to the rent on company houses. The shift councils in the pits have grown from bargaining committees into something close to local governments. In the port city, shopkeepers and railwaymen ask why a place with its own harbour, railway and treasury has no vote on any of them.\n\nThe Administration has chosen to put the question in the open rather than wait for it to be forced. What it cannot settle alone is the method: who gets to speak, and for how long. A public inquiry would let every faction speak and would take a year. A closed commission of senior officials would report within weeks, and nobody outside the room would trust a word of it.\n\nProvisional gameplay."
 ac_wd_gib.1.a:0 "Hold a public inquiry."
 ac_wd_gib.1.b:0 "Appoint a closed commission."
 ac_wd_gib.2.t:0 "Two Rights, One Weighbridge"
 ac_wd_gib.2.d:0 "The first month of independent weighbridge records lands on the Administration's table, and the figures do not match what the firms reported. The gap is not dramatic: a few percent here, a misclassified grade there, a week when the eastern scales were mysteriously out of order. Added up over a year, it comes to roughly what the zone would need to run clinics in every pit town.\n\nThe ore rights in West Gibraltar are held for Aurelia and those in East Gibraltar for Arklith, and both arrangements are older than anyone now in office. The operating firms insist the differences are honest errors of measurement and offer to recalibrate every scale at their own expense. The towns, which heard about the gap from the railwaymen who load the wagons, want the missing money paid back.\n\nNothing in the rights themselves is in question, and the Administration has no wish to make it so. The question is how hard to press. A formal audit of past shipments would recover part of the shortfall and sour relations with both holders for a season. Accepting the recalibration and starting afresh would keep the peace and write the past off.\n\nProvisional gameplay."
 ac_wd_gib.2.a:0 "Order a formal audit of past shipments."
 ac_wd_gib.2.b:0 "Accept recalibration and start afresh."
 ac_wd_gib.3.t:0 "The Weighbridge Audit Returns"
 ac_wd_gib.3.d:0 "The auditors spend a month in the firms' offices and the railway's ledgers, matching every wagon number against every shipping manifest they can find. Their report is careful and unexciting. Most of the shortfall is real but small, spread over years of sloppy weighing rather than any single scheme. One haulage contractor, however, billed the same trains twice through three seasons.\n\nThe operating firms accept the findings with visible relief, since the report clears them of the worst rumours. They offer to settle the measured shortfall in instalments over three years. The contractor's case is different: the evidence is plain, the sum is large enough to matter and the contractor has friends in both districts who would much prefer that it went away quietly.\n\nWhat the audit was for is now the Administration's problem. Pursued in public, the double billing would show the towns that the weighbridge books have teeth, though the dispute would drag on for months. Settled behind closed doors, it would recover most of the money at once and leave the impression that the zone still prefers a quiet life to honest accounts.\n\nProvisional gameplay."
 ac_wd_gib.3.a:0 "Pursue the double billing in public."
 ac_wd_gib.3.b:0 "Settle quietly and bank the money."
 ac_wd_gib.4.t:0 "The Roll of the Pit Towns"
 ac_wd_gib.4.d:0 "Clerks who went door to door in both districts bring back the first complete roll of the zone's households in living memory. Most people live in West Gibraltar, crowded into the port city or into hill towns beside the shafts. East Gibraltar's settlements are smaller and farther apart, strung along the railway across the plains, and few of them have changed shape in decades.\n\nThe roll puts figures on things the towns had only grumbled about. Several hill towns share one doctor between them. Many homes belong to the firms that employ the families living in them. Schools close after the morning shift because no teacher can be found for the afternoon. In the east, wells near the mine drainage are turning bitter, and families haul water from the station tanks.\n\nThe Administration now holds evidence that every faction will quote. The firms will say the towns are better than they were. The shift councils will say they are worse than anyone admits. Publishing the full roll would open a quarrel over blame that could run for years. Keeping the details for planning would avoid that argument and leave the towns guessing what the clerks found.\n\nProvisional gameplay."
 ac_wd_gib.4.a:0 "Publish the full roll."
 ac_wd_gib.4.b:0 "Keep the details for planning."
 ac_wd_gib.5.t:0 "Eleven Ships at Anchor"
 ac_wd_gib.5.d:0 "On the morning the harbour survey begins, eleven ore carriers lie at anchor off Gibraltar City waiting for a berth, some of them for the fifth day. Their owners are paying for every idle hour, and the cost finds its way back into the price the zone receives for its ore. The harbour master has a long list of reasons, and all of them are true.\n\nThe port was built on a scale the zone has never filled. A large naval base sits mostly idle, kept up for a fleet that does not exist, while the commercial berths are crowded and short of cranes. Pilots are informal, the approach charts are old and fog closes the harbour for days every year. Ore arrives by rail faster than the ships can be loaded.\n\nThe survey team must decide where to look first. The naval base has deep water and long quays that could be turned to commercial use, but converting them means admitting the zone will never need them for anything else. The commercial berths could be improved where they stand, more cheaply and more slowly. The shipowners want an answer before next season's charters are signed.\n\nProvisional gameplay."
 ac_wd_gib.5.a:0 "Open the naval quays to ore ships."
 ac_wd_gib.5.b:0 "Improve the commercial berths first."
 ac_wd_gib_5_b:0 "Improve the commercial berths first."
 ac_wd_gib.6.t:0 "Inspectors on the Mountain Grade"
 ac_wd_gib.6.d:0 "The line inspectors come back from three weeks on foot with notebooks full of bad news. The ore line climbs out of Gibraltar City through the western hills, crosses the mountain ground between the districts on a steep and badly drained grade, and runs out across the eastern plains to the railhead. Almost all of the zone's wealth travels along it, and much of the line is tired.\n\nOn the grade, rotten sleepers sit in ballast that washes out with every storm. Culverts are choked with spoil from old workings. Trains run on paper orders handed between stations, and the telephone between two of those stations has been dead for a month. The dispatchers have kept traffic moving through skill and luck, and both are wearing thin.\n\nThe report asks for money the zone has not budgeted, and it asks for a decision first: whether the line is a public road anyone may use or a single machine run by one operator. Before that argument begins, the Administration has to choose who reads the report first, knowing that commuters ride the same rails as the ore and will want to know why their trains run late.\n\nProvisional gameplay."
 ac_wd_gib.6.a:0 "Publish the inspectors report."
 ac_wd_gib_6_a:0 "Publish the inspectors report."
 ac_wd_gib.6.b:0 "Brief the firms and the dispatchers only."
 ac_wd_gib.7.t:0 "Four Battalions on One Ground"
 ac_wd_gib.7.d:0 "All four battalions of the territorial service assemble together on a parade ground beside the port railway, something no officer now serving has seen before. Officers count rifles, trucks and boots, and then count them again. The service exists to guard two small districts and to help when the mines or the weather turn deadly. It has no aircraft, no artillery and no engineers of its own.\n\nThe muster finds the service in better shape than its critics claimed and worse than its officers hoped. Rifles are clean and most trucks run, but spare parts are scarce and the trains assigned to the service are shared with the ore traffic. Many soldiers are miners on short contracts, strong and willing and half trained. Morale is good whenever there is something useful to do.\n\nThe officers want a doctrine, and two are on offer: hold the hills on foot, or move along the railway and roads by truck. Before choosing, the service has to settle what the zone hears about the muster. A frank public report might win sympathy and perhaps money. A confidential one would spare the service embarrassment and tell the neighbours nothing at all.\n\nProvisional gameplay."
 ac_wd_gib.7.a:0 "Publish a frank report."
 ac_wd_gib.7.b:0 "Keep the findings among the officers."
 ac_wd_gib.8.t:0 "Letters from Three Capitals"
 ac_wd_gib.8.d:0 "The new frontier office opens its files and finds that the zone's foreign relations consist mostly of letters. Letters from Arklith about wagons and customs hours. Letters from Aurelia about royalties, food shipments and the port. Letters from Leasath about herders, grass fires and the occasional lost truck. Each was answered by whichever office happened to receive it, and few of the answers agree.\n\nThe zone's position is unusual. Its ore rights are held for the two larger neighbours, one in each district, so both have a direct interest in calm. Leasath holds no rights and shares only the eastern frontier. The western sea brings everyone else. Nobody threatens the zone and nobody consults it either; it is treated as an address that ore comes from.\n\nThe office proposes to change that, modestly. It can begin by writing to all three capitals to explain what the office is and what it will handle, or it can quietly gather the files and learn before announcing anything. Openness would reassure the neighbours. Discretion would let the zone decide what it wants before others decide for it.\n\nProvisional gameplay."
 ac_wd_gib.8.a:0 "Write to all three capitals."
 ac_wd_gib.8.b:0 "Learn first and announce later."
 ac_wd_gib.9.t:0 "War Metals"
 ac_wd_gib.9.d:0 "Late in March 1995 the radio bulletins in the station cafes begin to lead with Belka. A war has started there, far beyond any frontier the zone shares, and Gibraltar has no part in it. Within a week the bulletins matter less than the telephone, which rings with brokers from cities the port agents have never traded with.\n\nTungsten and chromium harden armour, gun barrels and machine tools, and the brokers want as much as the zone can ship. Prices quoted down the line are double the last contract. Some callers are vague about where the ore will end up. The operating firms are delighted, the shift councils want the windfall shared at the pithead, and marine underwriters add a war surcharge to every voyage out of Gibraltar City.\n\nThe Administration controls only the zone's own share of the ore, but that share is enough to matter. It can sell at the new prices to any buyer who shows lawful papers, or it can refuse every broker who will not name the final customer and accept a smaller premium. Whichever it chooses, the brokers will remember, and so will the neighbours.\n\nProvisional gameplay: date anchor only, Chronicle row 1995 / 03.25 (tools/lore/chronicle.json); the zone response is gameplay."
 ac_wd_gib.9.a:0 "Sell to any buyer with lawful papers."
 ac_wd_gib.9.b:0 "Refuse brokers who will not name the customer."
 ac_wd_gib.10.t:0 "Ulysses Comes to the Pit Towns"
 ac_wd_gib.10.d:0 "Ulysses entered the zone's vocabulary with the IAU warning at the end of 1994, as a remote possibility discussed in the newspapers. The FCU announcement of 20 April 1996 removes the comfort of doubt: impact is certain and governments are urged to act. Where the pieces will land is still unknown. The zone must ready itself for a blow whose target is a blank on every map.\n\nIn the pit towns the reaction is practical before it is fearful. Miners know more about living underground than anyone, and within days the cafes are arguing over which old galleries would hold. Railwaymen point out that the ore line could move a whole town in an afternoon if it had to. Shopkeepers sell out of candles and tinned meat.\n\nThe engineers will need months to weigh shelters against evacuation, and either costs more than any project the zone has attempted. The first decision is about who leads. Engineers appointed from the port city would work to one plan for both districts. Committees in each town would be slower and closer to the people they mean to shelter, and harder to overrule later.\n\nProvisional gameplay: date anchors only, Chronicle rows 1994 / 12.10 and 1996 / 04.20 (tools/lore/chronicle.json); the zone preparations are gameplay."
 ac_wd_gib.10.a:0 "Put the engineers in charge."
 ac_wd_gib_10_a:0 "Put the engineers in charge."
 ac_wd_gib.10.b:0 "Let each town form a committee."
 ac_wd_gib.11.t:0 "Streaks Over the Western Ridge"
 ac_wd_gib.11.d:0 "On 8 July 1999 tidal strain tears Ulysses to pieces as it passes within the Roche limit. Years of preparation compress into a few days of radio bulletins, siren tests and nights when whole towns stand outside looking up. The sky watch on the western ridge reports streaks and flashes it cannot place. The dispatchers keep every engine in steam and every crew on call.\n\nBulletins from abroad arrive in pieces, like the asteroid itself, and many of them are frightening. In the zone the plans meet their test: doors close on the galleries or trains stand ready at every station, and people learn how long they can bear to wait. The miners, used to danger below ground, are calmer than the clerks who planned for them.\n\nWhen the immediate danger passes, standing the zone down becomes the Administration's next problem. It can release everyone at once and get the pits and the port working again, or keep the preparations in place for weeks in case later fragments follow. Each choice has a cost, and the neighbours are already asking whether the zone can spare help.\n\nProvisional gameplay: date anchor only, Chronicle row 1999 / 07.08 (tools/lore/chronicle.json); no impact in the zone is claimed."
 ac_wd_gib.11.a:0 "Stand down and reopen the pits."
 ac_wd_gib.11.b:0 "Keep the preparations in place."
 ac_wd_gib.12.t:0 "Three Bids for One Lot"
 ac_wd_gib.12.d:0 "The planning office confirms what surveyors have said for years: West Gibraltar has room for one more large plant on serviced land near the harbour, and East Gibraltar has none. Everything else is hillside, shaft land or town. Three proposals have arrived for the last lot, and each has backers who believe the zone's future depends on them.\n\nA smelter would turn the zone's chromium and tungsten into alloys before export, keeping more of the value at home and burning a great deal of power. A ship repair yard would serve the ore carriers and use the port's idle deep water. An arms line would supply the territorial service and sell abroad, which the frontier office warns would test the zone's neutral reputation.\n\nEach bid promises jobs, and each has enemies. The operating firms oppose the smelter, the shipowners favour the yard and the service quietly lobbies for the arms line. The Administration must first decide how the choice will be made: at a public hearing where every backer argues in the open, or by its own planners behind closed doors.\n\nProvisional gameplay."
 ac_wd_gib.12.a:0 "Hold a public hearing on the bids."
 ac_wd_gib.12.b:0 "Let the planners decide."
 ac_wd_gib.13.t:0 "The First Yearbook of the Zone"
 ac_wd_gib.13.d:0 "Ten years of weighbridge books, census rolls, clinic records and train logs are bound together into the zone's first statistical yearbook. Clerks who spent the decade counting wagons and households finally see their numbers side by side. The result is a thick, plain volume with almost no adjectives in it, and it becomes the most argued-over book ever printed in Gibraltar City.\n\nThe tables tell several stories at once. Tonnage is up and injuries are down. The line carries more with fewer breakdowns, and the port turns ships around faster. But the richest seams are measurably poorer than in 1991, the pit towns are older on average, and the zone's income still jumps and falls with prices set in places it has never seen.\n\nEvery faction has found its favourite table. The firms quote output, the shift councils quote injuries and the towns quote rents. The open question is whether the yearbook becomes an annual publication, open to anyone who wants to check its claims, or a single volume that served its purpose and need never be repeated. The clerks, for their part, have already started counting the next year.\n\nProvisional gameplay."
 ac_wd_gib.13.a:0 "Publish it every year."
 ac_wd_gib.13.b:0 "Let it stand as a single volume."
 ac_wd_gib.14.t:0 "Insurers and the Usean War"
 ac_wd_gib.14.d:0 "The FCU founds the ISAF on 22 August 2003, and the Usean continent is at war, a world away from the zone. Gibraltar has no stake in the fighting and no forces anywhere near it. Its first contact with the war arrives by telex: notices from insurers raising premiums on any cargo that might pass near Usean waters.\n\nThe hull register, kept for years as a dull clerical chore, suddenly matters. It shows which ships carrying the zone's ore and imports sail routes that might cross the danger, and which could be sent another way. Brokers call again with offers for tungsten and chromium, but this time the traders remember how quickly the last wartime prices vanished.\n\nThe Administration can ask the shipowners on the register to avoid every route near the war, accepting longer voyages and higher costs. Or it can leave routing to the shipowners and their underwriters while it concentrates on keeping its own ore contracts steady. Neither choice touches the war itself. Both decide what reaches the port city and what leaves it, and both will be debated in the station cafes until the guns there fall silent.\n\nProvisional gameplay: date anchor only, Chronicle row 2003 / 08.22 (tools/lore/chronicle.json); the zone response is gameplay."
 ac_wd_gib.14.a:0 "Ask registered hulls to keep clear."
 ac_wd_gib.14.b:0 "Leave routing to the owners."
 GIB_wd_concession_board_office:0 "Board of the Concession Holders"
 GIB_wd_concession_board_office_desc:0 "A governing board of nominees from the operating firms, the ore hauliers and the port agents, ruling the zone collectively as a managed estate with elections kept off the calendar. Provisional gameplay office with no named holder."
 GIB_wd_district_assembly_office:0 "Elected Council of West and East Gibraltar"
 GIB_wd_district_assembly_office_desc:0 "A cabinet named by a chamber elected in both districts, governing collectively and answering for its budget on a fixed electoral calendar. Provisional gameplay office with no named holder."
 GIB_wd_pit_councils_office:0 "Federation of Pit Councils"
 GIB_wd_pit_councils_office_desc:0 "A rotating executive committee chosen by delegates from every shaft, quarry, railyard and quay, governing with safety placed above output. Provisional gameplay office with no named holder."
 GIB_wd_zone_directorate_office:0 "Directorate of Mines and Works"
 GIB_wd_zone_directorate_office_desc:0 "The National Administration reconstituted as a directorate of engineers and auditors appointed on published criteria, governing by technical order without elections. Provisional gameplay office with no named holder."
 ac_wd_gib_decisions:0 "Gibraltar: National Measures"
 ac_wd_gib_decisions_desc:0 "Measures from the national programme of Gibraltar. Provisional gameplay unless a source ledger row says otherwise."
 GIB_wd_extra_ore_trains_decision:0 "Run Extra Ore Trains"
 GIB_wd_extra_ore_trains_decision_desc:0 "Every spare engine and wagon runs ore for a season, at the cost of passenger services and track wear. Repeatable once a year."
 GIB_wd_rescue_drill_decision:0 "Hold a Mine Rescue Drill"
 GIB_wd_rescue_drill_decision_desc:0 "The rescue companies rehearse a flooded-gallery rescue with the firms own crews. Repeatable every six months; it costs a shift of output."
 GIB_wd_charter_auction_decision:0 "Auction the Season Charters"
 GIB_wd_charter_auction_decision_desc:0 "Port agents auction the coming season of ore charters among the hulls on the register. Repeatable once a year."
 GIB_wd_gallery_crates_decision:0 "Fresh Crates for the Galleries"
 GIB_wd_gallery_crates_decision_desc:0 "Old shelter stores are sold cheaply in the pit towns and replaced with fresh crates. Repeatable every two years."
 GIB_wd_ambulance_hangar_decision:0 "A Second Hangar at the Strip"
 GIB_wd_ambulance_hangar_decision_desc:0 "Adds a second hangar and a longer runway to the air ambulance strip outside Gibraltar City. A one-time charge on the budget."
 GIB_wd_royalty_advance_decision:0 "Draw a Royalty Advance"
 GIB_wd_royalty_advance_decision_desc:0 "The treasury borrows against next year of royalties to cover a shortfall. Once only, and the towns notice."
