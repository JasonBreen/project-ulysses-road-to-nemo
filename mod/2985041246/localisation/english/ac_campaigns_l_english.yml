 SAP_camp_0_register:0 "Access is a commitment"
 SAP_camp_0_register_desc:0 "Access is a commitment. Open the campaign lane and its preparation record.\n\nThe minister's map shows an access corridor. The local authority's copy shows schools, a hospital and the bridge on which the morning buses queue. A parliamentary mandate makes those competing obligations public before the offer is sent. A limited executive mandate offers a faster answer with a narrower circle responsible for its enforcement. The commitment requires a receiving government's present acceptance and can be refused. Its conclusion records the mandate that was used rather than granting an alliance, a guarantee or an automatic entry into war."
