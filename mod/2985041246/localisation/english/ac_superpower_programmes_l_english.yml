 OSE_snp_guarantor_review_policy_context_2:0 "The standing policy is limited guarantor mandate. Its continuing opportunity cost remains in the national schedule."
 ac_snp.14.t:0 "The Letter without a Receiving Date"
 ac_snp.14.d:0 "The external-commitments folder contains a letter thanking the government for assistance. The review staff cannot find a corresponding receiving date. One official wants the letter included as evidence of confidence; another asks whether anybody can now explain what was promised. The committee has no authority to manufacture a foreign answer. It can publish a limited renewal schedule around the domestic staff actually available, or first protect a narrower receiving mandate while those staff inspect the old undertaking. The civil-service officer asks that a refusal remain an acceptable return. The military representative agrees, provided the next government can distinguish a refused promise from an obligation quietly abandoned.\n\n[OSE_snp_guarantor_review_policy_context]"
 ac_snp.14.a:0 "Publish a limited renewal schedule and retain useful refusals."
 ac_snp.14.a_effect_tt:0 "Civil support +4, readiness support -2. Both observations remain within zero to one hundred."
 ac_snp.14.b:0 "Protect a narrower inspection mandate before renewing the promise."
 ac_snp.14.b_effect_tt:0 "Readiness support +4, civil support -2. Both observations remain within zero to one hundred."
