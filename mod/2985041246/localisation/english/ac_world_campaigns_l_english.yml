 CSO_wc_e1_air_open:0 "One Air Service, Many Tasks"
 CSO_wc_e1_air_open_desc:0 "The inherited air service has to choose which tasks it can perform reliably. Arden asks for a repairable fleet, Sen for trained crews, and Verrin for a civil emergency role that does not disappear from the schedule.\n\nThe opening dialogue chooses one of three programmes. No operation is completed or paid merely by opening the discussion.\n\nOriginal national campaign fiction and provisional gameplay."
