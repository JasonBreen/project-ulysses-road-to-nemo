 UST_army_debate: "Debate Over Army"
 UST_army_debate_desc: "Following our newfound independence, a debate has sparked over our armed forces. Prior to our independence, many highly effective resistance militias brought havoc of the Belkan occupiers, whom were then turned into military militias by the new government. However, there is question on if these militias will stand against an organized invasion, or if a standing army is necessary."
 UST_expand_militia_program: "Expand Militia Program"
 UST_expand_militia_program_desc: "War is coming quickly, and we Ustians have been using the same tactics to a degree of success for many years now, why stop or change it? Rather than change our militias into an army, we will seek to further develop the militia model, and instead use specialized and heavy equipment to support these militias, rather than simply intwining them into the army itself."
 UST_advanced_small_arms_fire_training: "Advanced Small Arms Training"
 UST_advanced_small_arms_fire_training_desc: "A man is nothing to the military without a rifle. Ensuring our soldiers know the ins and outs of not only their weapons, but also the enemy's will allow them to use their weapons to a greater degree and keep their head on when fighting, both figuratively and literally. Extensive drill will be done to ensure this is firmly ingrained into each soldier's mind."
 UST_to_support_the_push: "To Support The Men"
 UST_to_support_the_push_desc: "Before our independence, it was rare that we could use artillery within our militias, as such a large and heavy piece of equipment was nearly impossible to move and sustain without a supply base. Now having the means to build and support artillery, we will integrate them into our militias, providing local defence, covering fire, and target softening for our militias to exploit."
 UST_ustian_children_of_the_hills: ""Children Of The Hills""
 UST_ustian_children_of_the_hills_desc: "Having lived and fought here so long, Ustians have a natural comfort in the terrain of our homeland. While many of the old veterans are not fit for combat anymore, their experience is vital, and using them and their knowledge will allow us to improve our special forces with even more terrain knowledge and advantages."
 UST_resist_and_bite: "Resist And Bite"
 UST_resist_and_bite_desc: "Unlike a standard army, militias are small and can disband and reorganize quickly. Engaging in guerilla warfare against an invader will tire them out and drain their ability to fight at minimal cost to use. This is by far the greatest strength of our militias, and teaching this doctrine of patience will allow our nation to take on an invader twice our size or more."
 UST_national_army: "True National Army"
 UST_national_army_desc: "Our army needs immediate reform and restructuring to match other forces around us. Militia may have worked in the past against an occupying force, however we need organized divisions if we wish to prevent occupation in the first place. We will begin consolidating and organizing divisions according to modern doctrine and training our soldiers based on these models."
 UST_to_catch_up: "To Catch Up"
 UST_to_catch_up_desc: "There is one key part that our army lacks critically in comparison to our neighbours - tanks. Those armoured monsters pack firepower equal to an infantry squad if not more. We need to find a way to acquire and then develop our own dedicated units to be able to match others in open-field combat."
 UST_nation_wide_war_games: "Directus War Games"
 UST_nation_wide_war_games_desc: "We will conduct monthly war games south of Directus to not only take notes on how our modernization is going but to also find out and research places in which our army still lacking. Doctrine and planning are as important as army structure itself and we cannot allow ourselves to fall behind in that department either."
 UST_to_expand_the_width: "Expand The Width"
 UST_to_expand_the_width_desc: "A common soldier is the backbone of any army. If we want to have a proper force, capable of holding the line, we first need more of them. We lack the mobilization capabilities to train such an amount of people to our old standards, but in this case, the numbers are needed far more than the capability of single individuals."
 UST_to_expand_the_depth: "Expand The Depth"
 UST_to_expand_the_depth_desc: "Militia divisions are unsuitable for sustained combat, mostly only hit-and-run attacks. To hold a line against a foe we need strong, reinforced divisions who can hold a single position for long periods of time while extra forces reroute."
 UST_guns_for_hire: "Guns For Hire"
 UST_guns_for_hire_desc: "Among the debate between a militia versus an army, there exist a group who proposed a compromise. It is true that we need a standing army to repel an invasion, but it is also true we do not have the time to fully reform it. Instead, we will temporarily bolster our ranks using mercenaries. This will prevent manpower issues and allow us to quickly build up, with the only downside being paying them will be rather costly."
