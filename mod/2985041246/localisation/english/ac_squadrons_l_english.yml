 ac_sq.117.d_base:0 "The station lent a room to a local emergency group for a joint exercise. Leonie expected questions about aircraft. Instead the visitors wanted to know who would answer after the usual office closed and whether a promised vehicle came with a driver. Tomas recognized the gaps immediately and looked almost pleased to have people name them before an alarm did. Markus worried that every clear answer would become another obligation for a small crew. Eva put out extra chairs without joining the argument. Helping could mean promising the station's own people again, or teaching the visitors how to reach a service that did not depend on this particular hut staying open."
 ac_sq.117.a:0 "Build a handover another crew can use."
 ac_sq.117.a.reply:0 "Tomas practices the call with a visitor who has never met the next watch, and waits for an acknowledged answer."
 ac_sq.117.b:0 "Make the flight the dependable contact."
 ac_sq.117.b.reply:0 "Markus gives the visitors a number someone in the hut will answer, accepting another place on the informal roster."
 ac_sq.118.t:0 "The Last Regular Watch"
 ac_sq.118.d_base:0 "Markus announced that he would leave regular reserve flying at the end of the year. He had practiced the sentence enough to make it sound like a routine alteration. Eva asked which jobs he intended to stop doing; the distinction defeated his prepared answer. Tomas produced a page of duties that belonged to Markus only because he had never refused them. Leonie could ask him to remain the person everyone called when a plan failed. She could also help him leave properly, even if the flight became less comfortable while people learned the work he had been making invisible. Markus watched her answer before he looked back at the page."
 ac_sq.118.a:0 "Let him leave a usable succession."
 ac_sq.118.a.reply:0 "Eva divides the page into tasks that can be taught, and Markus finally crosses his name off one of them."
 ac_sq.118.b:0 "Keep his experience within easy reach."
 ac_sq.118.b.reply:0 "Markus agrees to remain the first person they call, reassured that leaving the roster need not mean leaving the flight."
 ac_sq.119.t:0 "Names in the Margin"
 ac_sq.119.d_base_callback:0 "A young controller borrowed a recording and returned it with a question in the margin: who had first insisted on keeping the warning? Tomas could answer, but wanted Leonie to decide whether the names mattered. Eva said that an institution should not need a particular person to tell the truth. Markus, visiting after an appointment elsewhere, replied that particular people had still paid for doing it. The hut was tidier than it had been when Leonie arrived. That made the argument easier to miss. They were choosing whether a useful inheritance included the names of the people who had been inconvenient while creating it, or only the finished work that now looked natural.\n\nEva's two-signature account is still complete. Remembering who stood beside her no longer requires inventing a story afterward."
 ac_sq.119.d_base:0 "A young controller borrowed a recording and returned it with a question in the margin: who had first insisted on keeping the warning? Tomas could answer, but wanted Leonie to decide whether the names mattered. Eva said that an institution should not need a particular person to tell the truth. Markus, visiting after an appointment elsewhere, replied that particular people had still paid for doing it. The hut was tidier than it had been when Leonie arrived. That made the argument easier to miss. They were choosing whether a useful inheritance included the names of the people who had been inconvenient while creating it, or only the finished work that now looked natural."
 ac_sq.119.a:0 "Keep the names and the price they paid."
 ac_sq.119.a.reply:0 "The young controller adds a careful attribution, learning that a good procedure can begin as someone else's difficult choice."
 ac_sq.119.b:0 "Make the lesson belong to the service."
 ac_sq.119.b.reply:0 "Tomas removes the marginal names and adds the procedure to the ordinary training set, where any watch can use it."
 ac_sq.120.t:0 "A Chair Left Clear"
 ac_sq.120.d_base_callback:0 "The new pilot arrived while Leonie was looking for a pen. Eva was teaching an apprentice at the open panel, Tomas was explaining the correct clock, and Markus had sent a note declining a watch he was no longer obliged to cover. For a moment the station looked exactly as it had years before. Then the newcomer asked who could help with a restriction nobody seemed sure how to interpret. Leonie moved a glove from the chair beside her. She could give the answer that would make the first morning easier, or leave room for the question to become part of the station's work. The difference would not appear in an aircraft inventory. Someone would still inherit it.\n\nThe training page beside the kettle still contains the account of a pilot who had not known the answer. Leonie lets the newcomer read it first."
 ac_sq.120.d_base:0 "The new pilot arrived while Leonie was looking for a pen. Eva was teaching an apprentice at the open panel, Tomas was explaining the correct clock, and Markus had sent a note declining a watch he was no longer obliged to cover. For a moment the station looked exactly as it had years before. Then the newcomer asked who could help with a restriction nobody seemed sure how to interpret. Leonie moved a glove from the chair beside her. She could give the answer that would make the first morning easier, or leave room for the question to become part of the station's work. The difference would not appear in an aircraft inventory. Someone would still inherit it."
 ac_sq.120.a:0 "Make room for the question."
 ac_sq.120.a.reply:0 "The newcomer sits down with the unsigned page. Eva brings another chair instead of taking the problem away."
 ac_sq.120.b:0 "Give the new pilot a dependable answer."
 ac_sq.120.b.reply:0 "Leonie explains the flight's understanding clearly, and the newcomer leaves knowing whom to trust on the next watch."
 ac_sq.150.t:0 "Leonie Falk | Reserve interceptor pilot"
 ac_sq.150.d:0 "Leonie is good at separating a clear instruction from an incomplete one. She has never been comfortable with how often a service record confuses the two. Her reserve posting gives her time to know the people who keep her aircraft flying, and little protection from the demands arriving from above."
 ac_sq.151.t:0 "Markus Voss | Wingman"
 ac_sq.151.d:0 "Markus measures an order first by whether the flight can carry it out together. His loyalty is personal and practical: nobody should be left to improvise alone. That conviction can make him a generous wingman and a difficult witness when the truth threatens the unit."
 ac_sq.152.t:0 "Eva Heller | Crew chief"
 ac_sq.152.d:0 "Eva knows the reserve aircraft by their recurring faults and their pilots by the faults they refuse to report. She dislikes speeches about sacrifice delivered beside equipment somebody else must repair. Her authority comes from being willing to sign her own name beneath an uncomfortable finding."
 ac_sq.153.t:0 "Tomas Wendt | Ground controller"
 ac_sq.153.d:0 "Tomas turns uncertain signals into instructions other people must trust. He keeps notes longer than regulations require, partly from caution and partly because he has seen what a clean official account can leave out. He wants the flight to hear the uncertainty in his voice without mistaking it for fear."
 ac_sq.190.t:0 "The Work That Remains"
 ac_sq.190.d:0 "Leonie finds the old clock in a drawer, wrapped in a page of obsolete instructions. The station has kept it without needing to keep its error. That feels like a useful distinction. Markus visits when he chooses; Eva's apprentices sign their own work; Tomas can leave the console without leaving a private list of people who know how to make it function. None of this settles the country's arguments or makes the squadron innocent of every accommodation it once accepted. It has made the difficult account harder to lose. A new crew reads the complete training pages before improving them. Leonie does not know which parts they will keep. For once, she does not need to control the answer to believe they have been given a fair chance. The chair beside the kettle stays clear because somebody may still arrive with a question nobody has thought to ask."
 ac_sq.191.t:0 "The Familiar Answer"
 ac_sq.191.d:0 "The flight still knows how to look after its own. Leonie can find a helpful voice, Markus still answers more calls than he intended, and Eva knows which careful explanation will get a restriction heard without making the room defensive. That competence has protected people. It has also made some questions dependent on being asked by the right person. Tomas keeps a private index beside the official one and wonders who will recognize the difference after he leaves. The record is neither a simple accusation nor the reassuring account someone might prefer. It is a serviceable inheritance with qualifications still attached. Leonie leaves a note explaining where the unofficial answers are kept. Whether that note is a first admission or one more accommodation will depend on the people who read it next. The flight's closeness has endured; its habits will need another generation willing to examine them."
 ac_sq.192.t:0 "An Address for Each Name"
 ac_sq.192.d:0 "When Leonie returns to the hut, the chairs are stacked for work on the floor. A temporary arrangement, the clerk assures her. She has heard that phrase carry larger things. The people who once made the station feel inevitable now work different watches or answer from different rooms. Eva still keeps her records; Tomas still remembers the voices; Markus has finally learned to let a call ring when he cannot help. They have not become strangers, but friendship no longer supplies the missing parts of the institution. Leonie writes each current address beside the names in the old book. The gesture cannot restore what was lost, and she refuses to describe it as doing so. It may let the next person find an honest witness. That is less than the flight once promised and more useful than a perfect account in which nobody had been allowed to fail."
