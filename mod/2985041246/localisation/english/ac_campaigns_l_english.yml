 REC_camp_0_register:0 "Promises the treasury can bear"
 REC_camp_0_register_desc:0 "Promises the treasury can bear. Open the campaign lane and its preparation record.\n\nThe finance office has prepared two estimates. One assumes that the next request will be the last. The other has been circulated less widely. Domestic recovery first preserves a clearer limit on what can be promised abroad. A bounded contribution accepts a smaller reserve at home in exchange for a defined role in the regional effort. Neither policy entitles the government to resources it has not funded. The branch sends an offer whose receiver can refuse, preserves its political cost, and leaves the domestic consequences visible after the diplomatic photograph has been filed."
