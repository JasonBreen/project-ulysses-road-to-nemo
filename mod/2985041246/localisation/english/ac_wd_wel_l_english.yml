 ac_wd_wel.1.t:0 "An Administration Without a Calendar"
 ac_wd_wel.1.d:0 "The National Administration begins 1991 the way it ended the previous year: governing by ordinance from offices on the capital plain, with no date set for the next election. Its own party, the one that still calls the country a republic, polls almost nobody. The ferries run, the ports collect their dues and the fleet keeps its moorings, but nobody can say on whose mandate any of it happens.\n\nTwo great movements fill the space the administration leaves empty. The imperial movement, which wants a Wellowan Empire with one flag and one fleet, claims about half the electorate and fills the port-town halls with petitioners. The union camp, which wants the scattered districts bound together as a United Kingdom under a crown held by their own council, claims nearly all the rest. Both say the administration is a caretaker that has forgotten it was meant to leave.\n\nSenior officials have prepared a statement for the new year. It can promise that the question of government will be settled in public, with hearings in every district and a published record, or it can promise only continuity and ask the country to wait. Neither promise costs anything today. Both will be quoted against the administration for years.\n\nProvisional gameplay."
 ac_wd_wel.1.a:0 "Promise a public settlement."
 ac_wd_wel.1.b:0 "Promise continuity and patience."
 ac_wd_wel.2.t:0 "The Ferry Season Report"
 ac_wd_wel.2.d:0 "The district survey comes back as a stack of ledgers from sixteen districts, and the western islands' ledgers arrive last because the ferry carrying them broke down twice. The main island has its capital plain, its industrial districts and a dockyard in the south. Beyond it lie four island districts stretching west and a small islet to the southeast, and most of them have no paved road at all.\n\nThe surveyors list the same complaints in different handwriting. Piers built for fishing boats now carry freight. Schools close when the ferry misses a week. Tax offices have files but no clerks, and some districts have clerks but no files. On the northern lowland, the largest district of the main island, villages are separated by marshes that swallow every road the capital has ever paid for.\n\nThe surveyors also note that islanders are more patient than the capital deserves. They do not ask for the capital's wealth, only for a timetable that is kept and a road that lasts. The government must decide how to release the survey: as a public promise that will be measured every season, or as an internal plan that can be adjusted without embarrassment.\n\nProvisional gameplay."
 ac_wd_wel.2.a:0 "Publish it as a promise."
 ac_wd_wel.2.b:0 "Keep it as a working plan."
 ac_wd_wel.3.t:0 "Nine Hundred Hulls"
 ac_wd_wel.3.d:0 "The harbour clerks finish their count of the merchant register and arrive at a number the government had only guessed at: more than nine hundred hulls fly the Wellowan flag. They range from ocean tramps and coastal colliers to ferries, tankers and old trawlers converted to carry freight. Together they earn more foreign currency than every plant on the main island combined.\n\nThe count also finds problems. Some owners registered ships that have since been sold abroad without telling anyone. Others pay dues on hulls that were scrapped years ago, to keep their place in the queue for fuel rebates. A handful of entries name owners whose only address is a post office box in a foreign port. Nobody in the harbour offices is sure how many of the nine hundred actually sail.\n\nThe shipowners would like the count kept confidential while they put their own books in order. The newspapers have heard about the missing hulls and want names. Whatever the government decides will tell the owners whether the register is a tool of the state or a club they run for themselves, and the owners will remember the answer.\n\nProvisional gameplay."
 ac_wd_wel.3.a:0 "Publish every name on the register."
 ac_wd_wel.3.b:0 "Let the owners correct it quietly."
 ac_wd_wel.4.t:0 "The Ghost Hulls"
 ac_wd_wel.4.d:0 "Three weeks after the register is published, a harbour newspaper prints a list of forty ships that exist only on paper. Some were lost at sea and never struck off; some were sold and renamed abroad; a few appear to have been invented outright to collect fuel rebates. The owners named on the list range from small family firms to two of the largest shipping houses in the capital.\n\nThe publication does what the government hoped and what it feared. Honest owners rush to correct their entries, and the harbour offices are flooded with paperwork for the first time in years. The large houses hire lawyers, and their friends in the ministries ask whether the register really needed to be printed in full. Foreign insurers, who read Wellowan newspapers more carefully than anyone expected, quietly raise their premiums.\n\nThe prosecutors can pursue the rebate fraud, which would take years and put powerful owners in court, or accept repayment and a fine, which would close the matter within a season. Either way, the register will be cleaner than it has been in a generation, and the owners will know the state is reading it.\n\nProvisional gameplay."
 ac_wd_wel.4.a:0 "Take the fraud to court."
 ac_wd_wel.4.b:0 "Settle for repayment and fines."
 ac_wd_wel.5.t:0 "The Western Fields"
 ac_wd_wel.5.d:0 "The field ledger is complete. It shows three oil-bearing districts on the main island: the western district with its steel works, the capital plain itself and the northeastern marsh. Between them they hold nearly all the nation's oil and steel, worked by wells and furnaces built by different owners at different times for different customers. Nothing about the arrangement was ever planned.\n\nThe engineers' summary is blunt. Too much crude leaves the country unrefined, too little steel reaches the dockyard, and the marsh wells lose a season of output to mud every spring. The capital's single fuel depot holds a few weeks of supply for the fleet and the ferries, and nobody has written down who decides when to open it. Three schools of thought have already formed around the ledger, each sure it holds the answer.\n\nBefore any model is chosen, the ministry has to decide who will see the ledger. Shared with the owners and the districts, it will start a long argument about royalties and fairness. Kept inside the ministry, it will guide policy quietly while every district suspects the others of being favoured.\n\nProvisional gameplay."
 ac_wd_wel.5.a:0 "Share the ledger with the districts."
 ac_wd_wel_5_a:0 "Share the ledger with the districts."
 ac_wd_wel.5.b:0 "Keep it inside the ministry."
 ac_wd_wel.6.t:0 "Six Slips, Three Masters"
 ac_wd_wel.6.d:0 "The dockyard district in the south of the main island has six building slips, and on the morning the inspectors arrive every one of them is claimed by somebody. The navy wants its escort programme restarted. The shipowners want new coasters and ferries for the island routes. The repair crews want the slips cleared so they can stop turning damaged ships away to foreign yards.\n\nThe yard managers have a fourth complaint, which is that nobody has asked them. Half their riveters are close to retirement, their cranes were installed when the current escorts were laid down, and their order book is a pile of promises from ministries that change their minds every year. They would like a plan that lasts longer than a budget, and a customer who pays on time.\n\nThe government cannot satisfy everyone with six slips. It can let the inspectors fight it out in committee, which will be slow and will leave every party half satisfied, or it can let the yard managers set the priorities for the next season while the larger question is settled. Either choice will be read as a signal by the owners and the admirals alike.\n\nProvisional gameplay."
 ac_wd_wel.6.a:0 "Let the committee decide."
 ac_wd_wel.6.b:0 "Trust the yard managers for now."
 ac_wd_wel_6_b:0 "Trust the yard managers for now."
 ac_wd_wel.7.t:0 "Belka Sells Its North"
 ac_wd_wel.7.d:0 "At the end of August 1991 the news from across the narrow sea arrives in a rush: Belka has sold its northern territory to FATO, sold eastern lands to its eastern neighbours and ceded northern islands and the Great Lakes region to the Osean Federation. Shipping agents in the Wellowan ports read the reports twice. Their neighbour to the south is shrinking, and it is selling land rather than losing it in war.\n\nNobody in the capital knows what the sales mean for Wellow. Some officials expect new customs posts and new flags on the far shore, and new rules for every ship that trades there. Others see a neighbour in financial trouble that will need fuel, ships and credit, and may pay for them badly. A few of the older naval officers simply note that a neighbour reduced this way may one day want to undo it.\n\nThe government must decide how loudly to say anything at all. A formal statement would show that Wellow is watching and might be read on the far shore as an opinion. Silence keeps every option open and leaves the ports to guess. The shipowners have already asked which of the new frontiers their masters should prepare for.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1991 / 08.29 in tools/lore/chronicle.json; the Wellowan response is gameplay."
 ac_wd_wel.7.a:0 "Issue a careful statement."
 ac_wd_wel.7.b:0 "Say nothing and keep watching."
 ac_wd_wel.8.t:0 "War Across the Narrow Sea"
 ac_wd_wel.8.d:0 "On 25 March 1995 war breaks out on the continent south of Wellow. The first reports reaching the capital are fragments: Belkan forces moving, air battles over frontier cities, shipping warnings issued and withdrawn within hours. Wellow is not a party to any of it, but the narrow sea between the south coast and Belka is suddenly the busiest and most dangerous water in the region.\n\nThe ports react before the ministries do. Shipowners pull their coasters off the southern routes and insurers cancel war cover overnight. Harbour masters on the south coast report unknown aircraft and warships at the edge of the coast watch's sight. In the capital, crowds gather outside newspaper offices, and the imperial and union movements both hold rallies demanding that the government say where it stands.\n\nThe cabinet's first decision is smaller than any statement of policy. It must decide whether to put the coast watch, the reserve crews and the radar posts on a war footing now, before anyone can say which way the fighting will go, or to keep the ports calm and the ferries running and wait for clearer news.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25 in tools/lore/chronicle.json; the Wellowan response is gameplay."
 ac_wd_wel.8.a:0 "Put the coast watch on a war footing."
 ac_wd_wel.8.b:0 "Keep the ports calm and wait."
 ac_wd_wel.9.t:0 "The First Month of the Watch"
 ac_wd_wel.9.d:0 "A month after the coast watch went onto a war footing, its commanders send their first report to the capital. Radar posts and lookouts on the south coast have logged hundreds of aircraft and dozens of warships at the edge of their range, most of them heading somewhere else. Twice, damaged aircraft crossed the coastline and came down in the hills before anyone could identify them.\n\nThe report is frank about the watch's limits. Its radars cover the southern approaches but not the western islands. Its reserve crews are tired, and the fuel ration for patrol boats runs out before the end of each week. The watch also stopped a fishing boat carrying three civilians who had crossed from the far shore, and nobody had a procedure for what to do with them.\n\nThe commanders ask for two things: more patrol fuel, and a rule for people and aircraft that arrive from the war. The ministries can grant the fuel at the expense of the ferries, or write the rules first and leave the patrol boats on their ration a little longer.\n\nProvisional gameplay."
 ac_wd_wel.9.a:0 "Give the watch the fuel."
 ac_wd_wel.9.b:0 "Write the rules first."
 ac_wd_wel.10.t:0 "Light over the Southern Mountains"
 ac_wd_wel.10.d:0 "In the last weeks of the Belkan War instruments on the south coast record something no Wellowan scientist expected to measure outside a textbook. Within hours the news confirms it: nuclear devices have been used in the Waldreich Mountains, far to the south in Belka. Nothing was seen from Wellow, but the sensitive instruments recorded the disturbance, and the meteorologists begin tracking the winds that blow north across the narrow sea toward the south coast and the fishing grounds.\n\nThe capital fills with questions faster than the scientists can answer them. Will anything reach the islands? Are the fishing grounds safe? Should children stay indoors? The newspapers print wind maps drawn by amateurs, and pharmacies run out of anything that sounds like protection. The imperial movement demands a national defence against weapons nobody in Wellow possesses, and the union camp demands a public accounting of every reading.\n\nThe meteorologists believe the risk to Wellow is small, but they cannot yet prove it. The government can publish every reading as it arrives, including the frightening ones, or release only checked summaries once a day. Trust and calm are both at stake, and the ministers suspect they cannot have both.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 06.06 in tools/lore/chronicle.json, and only if the mod global flag belka_dropped_nukes is set; the Wellowan measurements and response are gameplay."
 ac_wd_wel.10.a:0 "Publish every reading."
 ac_wd_wel_10_a:0 "Publish every reading."
 ac_wd_wel.10.b:0 "Release checked daily summaries."
 ac_wd_wel.11.t:0 "One Army, Sixteen Districts"
 ac_wd_wel.11.d:0 "The garrison review lands on the defence minister's desk with a map that every officer in the capital already knew but nobody had drawn. Most of Wellow's infantry formations sit on the main island, within a day's march of the capital plain. The four western island districts and the southeastern islet are defended by a few companies, a coast watch and the hope that nobody tests them.\n\nMoving troops to the islands means ships, and ships belong to the navy or the merchant owners, neither of whom has planned for it. The northwestern highlands of the main island are mountain country where wheeled transport struggles, and the northern lowland is half marsh. The army's equipment was bought for a plain, and most of the nation is not one.\n\nTwo schools have formed in the general staff. One wants a battalion raised and kept in every district, so that no island is ever empty. The other wants fewer, better brigades that travel by sea on the ferries and colliers. The minister must decide which school writes the next year's training plan while the larger question is argued.\n\nProvisional gameplay."
 ac_wd_wel.11.a:0 "Let the district school write the plan."
 ac_wd_wel.11.b:0 "Let the sea-lift school write it."
 ac_wd_wel_11_b:0 "Let the sea-lift school write it."
 ac_wd_wel.12.t:0 "A Rock with a Name"
 ac_wd_wel.12.d:0 "In December 1994 the International Astronomical Union announces that an asteroid called Ulysses will pass close to the Earth, with a chance of striking it and causing great devastation. In Wellow the announcement is a radio bulletin between the shipping forecast and the evening news. By the next morning it is the only subject in the port taverns.\n\nNobody can yet say where, or whether, anything will fall. The few astronomers in the capital are suddenly the most quoted people in the country, and they spend most of their interviews explaining what they do not know. Shipowners ask whether ocean routes will close. Island districts ask whether the ferries will still run. The imperial movement asks why Wellow has no rockets of its own.\n\nThe government must decide how to speak about a danger that may not arrive for years, and may not arrive at all. It can set up a standing committee to prepare openly, which will keep the subject in the newspapers, or ask the observatories to report privately until there is something certain to announce. Either way, the shipowners will want to know before the public does.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1994 / 12.10 in tools/lore/chronicle.json; Wellowan preparations are gameplay."
 ac_wd_wel.12.a:0 "Prepare in the open."
 ac_wd_wel_12_a:0 "Prepare in the open."
 ac_wd_wel.12.b:0 "Let the observatories report privately."
 ac_wd_wel.13.t:0 "Instructors for Hire"
 ac_wd_wel.13.d:0 "By the summer of 1998 former top pilots of the Belkan Air Force are being hired by various countries to fly as aggressor squadrons, playing the enemy so that other air arms can learn to fight one. A contracting agent arrives in the capital with an offer: a squadron of such instructors, with their own aircraft and maintainers, available to the Wellowan air arm on a three-year contract.\n\nThe air staff is tempted. Its pilots have never trained against anyone better than themselves, and the instructors would expose every weakness in a season. The foreign ministry is not. Hiring former Belkan pilots, whatever their individual records, will be read on both sides of the narrow sea as a statement, and nobody can say who else these instructors have worked for.\n\nThere is a cheaper middle course: send a handful of Wellowan instructors abroad to train against such squadrons elsewhere, and bring the lessons home. It is slower and teaches fewer pilots, but it keeps the contract and its politics out of the capital. The air staff wants an answer before the agent leaves.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1998 / 06.19 in tools/lore/chronicle.json; the offer to Wellow is gameplay."
 ac_wd_wel.13.a:0 "Sign the three-year contract."
 ac_wd_wel.13.b:0 "Send our instructors abroad instead."
 ac_wd_wel_13_b:0 "Send our instructors abroad instead."
 ac_wd_wel.14.t:0 "A Relief Convoy Sails"
 ac_wd_wel.14.d:0 "The chartered relief convoy assembles in the dockyard district: colliers and coasters loaded with grain, fuel, tents and medicine, escorted by a single navy escort flying a relief pennant. Crews were found by volunteer lists posted in every port, and the lists filled faster than the harbour offices could type them up. The owners lent their ships at cost, and some lent them for nothing.\n\nThe voyage is long and the destination uncertain. Ports in the stricken regions have their own priorities, and some have no working cranes at all. The convoy's masters carry instructions to unload wherever they are allowed, to take nothing in return and to leave before they become a burden. Insurers have refused to cover the voyage, so the state carries the risk.\n\nWhen the convoy returns, the government must decide how to tell the story. It can make the voyage a national occasion, with ceremonies in every port and a medal for the crews, or let the crews come home quietly and let the ports tell it themselves. The owners would like the publicity. The crews mostly want sleep.\n\nProvisional gameplay."
 ac_wd_wel.14.a:0 "Make it a national occasion."
 ac_wd_wel.14.b:0 "Let the crews come home quietly."
 ac_wd_wel.15.t:0 "Insurers Price a Distant War"
 ac_wd_wel.15.d:0 "In August 2003 the FCU demands that Erusea withdraw from the railgun complex and San Salvacion, and a new allied force is established. The war that follows is fought on another continent, far from Wellow's waters. Within a week, though, the insurers who cover Wellowan hulls have rewritten their premiums for every route that touches Usea.\n\nOwners face a choice between turning down cargo and paying war-risk premiums that eat most of the profit. Some charterers offer double rates for fuel and supplies bound for the war zone, and do not say whose forces will receive them. The navy points out that Wellow has no escorts to spare for a voyage that long. The ferries, at least, are untouched, and the island districts barely notice.\n\nThe government cannot stop a distant war, but it can decide what Wellowan ships may carry into it. It can issue a clear list of forbidden cargo now, or let the register and the insurers sort it out and intervene only when something goes wrong. The shipowners are lobbying for the second, and the newspapers for the first.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2003 / 08.22 in tools/lore/chronicle.json; the Wellowan response is gameplay."
 ac_wd_wel.15.a:0 "Issue the cargo list now."
 ac_wd_wel.15.b:0 "Let the market sort it out."
 ac_wd_wel.16.t:0 "Fifteen Years of the Register"
 ac_wd_wel.16.d:0 "In the autumn of 2005, with the war over Usea ended and the ports counting their losses and gains, an independent panel publishes a review of how Wellow has been governed since 1991. Its members were drawn by lot from the districts, the shipowners, the dockyard unions and the polytechnic. Its report runs to three volumes and a short summary that every newspaper prints.\n\nThe panel finds a country that kept its ships at sea and its ferries running through a Belkan war, an asteroid and a distant continent's war, but one that still governs its outer districts from too far away. The register is cleaner, the yards busier and the fields better managed than they were in 1991. The question of government that opened the period still divides the port towns, whatever answer the capital has given it.\n\nThe government must decide how to receive the report. It can adopt the summary as a programme for the next decade and accept being measured against it, or thank the panel and leave the volumes on the shelf. Either way, the report will be quoted in every argument that follows.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2005 / 09.19 in tools/lore/chronicle.json; the review is gameplay."
 ac_wd_wel.16.a:0 "Adopt the summary as a programme."
 ac_wd_wel.16.b:0 "Thank the panel and move on."
 WEL_wd_chamber_cabinet_office:0 "Cabinet of the Restored Chamber"
 WEL_wd_chamber_cabinet_office_desc:0 "A cabinet drawn from the majority of an elected chamber, governing the Republic of Wellow collectively and facing the chamber on a fixed calendar. Provisional gameplay office with no named holder."
 WEL_wd_union_council_office:0 "Union Council of the Districts"
 WEL_wd_union_council_office_desc:0 "A council of delegates from every district that holds the crown of the United Kingdom of Wellow in commission and governs collectively; no single crown holder is named. Provisional gameplay office with no named holder."
 WEL_wd_imperial_directorate_office:0 "Imperial Directorate"
 WEL_wd_imperial_directorate_office_desc:0 "A directorate of imperial movement committees, retired naval officers and loyal clerks governing a Wellowan Empire by decree. Provisional gameplay office with no named holder."
 WEL_wd_standing_administration_office:0 "Standing Administration of the Republic"
 WEL_wd_standing_administration_office_desc:0 "The National Administration reconstituted under a written administrative charter, still without elections, governing collectively and bound by its own court. Provisional gameplay office with no named holder."
 ac_wd_wel_decisions:0 "Wellow: National Measures"
 ac_wd_wel_decisions_desc:0 "Measures from the national programme of Wellow. Provisional gameplay unless a source ledger row says otherwise."
 WEL_wd_winter_ferries_decision:0 "Subsidise the Winter Ferries"
 WEL_wd_winter_ferries_decision_desc:0 "Pay for extra winter sailings to every island district for half a year. Costs political power each season it is used."
 WEL_wd_draw_fuel_reserve_decision:0 "Draw on the Fuel Reserve"
 WEL_wd_draw_fuel_reserve_decision_desc:0 "Open the capital fuel reserve to the ferries, the fleet and the heating plants for four months."
 WEL_wd_charter_relief_decision:0 "Charter a Relief Convoy"
 WEL_wd_charter_relief_decision_desc:0 "Charter merchant hulls at cost and send a relief convoy under a single navy escort. Once only."
 WEL_wd_coast_reserve_decision:0 "Call Out the Coast Reserve"
 WEL_wd_coast_reserve_decision_desc:0 "Bring the reserve crews of the coast watch and the fleet out for a season of drills."
 WEL_wd_island_airstrip_decision:0 "Pave the Far West Airstrip"
 WEL_wd_island_airstrip_decision_desc:0 "Lay a hard runway in the westernmost island district so that aircraft can reach the far end of the chain. Once only."
 WEL_wd_dues_amnesty_decision:0 "Amnesty for Unpaid Port Dues"
 WEL_wd_dues_amnesty_decision_desc:0 "Forgive old unpaid harbour dues for owners who register honestly this year. Once only."
