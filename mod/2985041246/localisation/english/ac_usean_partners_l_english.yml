 SNS_up_restoration_order_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Reconcile Domestic and Partner Dispatches'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_missing_files:0 "An Office for Missing Files"
 SNS_up_missing_files_desc:0 "Unresolved cases deserve a responsible desk rather than a promise that all records survived. The office will reconstruct what it can and preserve the limits of the evidence."
