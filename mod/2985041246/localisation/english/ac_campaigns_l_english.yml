 ac_camp.3012.t:0 "The promise that remained — archive"
 ac_camp.3012.desc:0 "The liaison found the first message while clearing the file for review. Its wording had acquired an innocence through repetition. A clinic, a road, an expected vehicle. Someone had underlined the receiving time and penciled a question beside the proposed contact. Later messages answered some questions and made others impossible to ask in the same way.\n\nHe laid them out in order. There were permissions, restrictions, a stock return, an account of a delay, and a carefully phrased request about a person who had not come home. The military summaries had described the route as a secondary matter. Its papers now covered most of his desk.\n\nOutside, a replacement crew was receiving a briefing. Their controller spoke with the calm insistence of a man who had explained the same dangers to too many new faces. The liaison listened until the door closed. Then he began writing the account for the people who would inherit this file.\n\nHe recorded the offers as offers and the answers as answers. An unanswered question remained unanswered. The clinic had not become an allied installation because its staff had sought help. A garrison permission had not established that every search honored it. A vehicle's arrival could be recorded without claiming that the people waiting had ceased to be afraid.\n\nAt the bottom he left space for the operation's result. He would not fill it from the intended schedule.\n\nThe next page was reserved for the city after the front. It was still blank. For once, a blank page seemed an honest promise."
