 YUK_snp_technical_cooperation_civil_policy_desc:0 "A civilian researcher asks to retain observations from a programme whose present status no longer matches its founding announcement. The security officer asks which material can be released without exposing a protected trial. The inherited Arkbird partnership may be active, interrupted or absent. Those states change what cooperation can offer, but a national technical record can still be useful at home. The committee must govern that record without pretending it owns the aircraft, the partnership or a future summit's outcome.\n\nSupport open civil scientific returns. Exchange improves research while political attention remains committed to the disclosure procedure."
 YUK_snp_technical_cooperation_civil_policy_effect_tt:0 "Adopt Published civil scientific returns, with the benefit and continuing opportunity cost shown below. Move up to five existing allocation points toward civil receiving offices, protecting active reservations and the allocation bounds."
