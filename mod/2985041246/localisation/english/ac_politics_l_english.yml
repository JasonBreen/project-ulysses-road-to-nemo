 ac_pol_strained:0 "Administrative Suspension"
 ac_pol_strained_desc:0 "The previous mandate exhausted institutional capacity. Its positive effects have ended. Paid audits and a limited recovery programme remain available; adoption never resumes automatically."
 ac_pol_suspend_decision:0 "Suspend the Current Mandate"
 ac_pol_suspend_decision_desc:0 "End the current framework mandate and its positive effects. Its exact fiscal commitment is removed through the fiscal owner when available. Paid costs remain. Audits and limited recovery work stay useful."
 ac_pol_suspension_tt:0 "The mandate positive effects end. Domestic audits and limited recovery remain available. Paid costs are not refunded."
 ac_pol_technical_contacts:0 "Civilian Technical Contacts"
 ac_pol_technical_contacts_desc:0 "Technical exchange improves research at a political operating cost."
 ac_pol_training_unlocked:0 "Replacement staff exercises available"
 ac_pol_uniformed_reserve:0 "Uniformed Emergency Reserve"
 ac_pol_uniformed_reserve_desc:0 "Reserve training improves at a civilian construction opportunity cost."
 ac_pol_work_audit_decision:0 "Audit Administrative Duties"
 ac_pol_work_audit_decision_desc:0 "Pay 25 political power and reserve civilian construction attention for 90 days. Gain 12 capacity. All normal domestic programmes share the 90-day cooldown; this is continuing work, not a repeated historical milestone."
 ac_pol_work_cooldown:0 "A normal domestic programme funded within the last 90 days"
 ac_pol_work_external_decision:0 "Review Technical Contact Duties"
 ac_pol_work_external_decision_desc:0 "Pay 25 political power and reserve civilian construction attention for 90 days. Gain 6 capacity. Also gain 2 air experience. All normal domestic programmes share the 90-day cooldown; this is continuing work, not a repeated historical milestone."
 ac_pol_work_maintenance_decision:0 "Coordinate Maintenance Staff"
 ac_pol_work_maintenance_decision_desc:0 "Pay 25 political power and reserve civilian construction attention for 90 days. Gain 6 capacity. Also gain 2 army experience. All normal domestic programmes share the 90-day cooldown; this is continuing work, not a repeated historical milestone."
 ac_pol_work_records_decision:0 "Reconcile Public Records"
 ac_pol_work_records_decision_desc:0 "Pay 25 political power and reserve civilian construction attention for 90 days. Gain 8 capacity. Also gain 1% stability. All normal domestic programmes share the 90-day cooldown; this is continuing work, not a repeated historical milestone."
 ac_pol_work_relief_decision:0 "Exercise Domestic Relief"
 ac_pol_work_relief_decision_desc:0 "Pay 25 political power and reserve civilian construction attention for 90 days. Gain 8 capacity. Also gain 1% stability. All normal domestic programmes share the 90-day cooldown; this is continuing work, not a repeated historical milestone."
 ac_pol_work_training_decision:0 "Run a Replacement Staff Exercise"
 ac_pol_work_training_decision_desc:0 "Pay 25 political power and reserve civilian construction attention for 90 days. Gain 4 capacity. Also gain 4 army experience. All normal domestic programmes share the 90-day cooldown; this is continuing work, not a repeated historical milestone."
 ac_reg_audit:0 "Independent Accounts"
 ac_reg_audit_desc:0 "Give administrative auditors access to public contracts. Transparent accounts improve civilian administration, but procurement requires more paperwork. This enduring mandate reserves institutional capacity every week and must be renewed through domestic administrative work."
 ac_reg_bounded_commitments:0 "Bound the National Commitment"
 ac_reg_bounded_commitments_desc:0 "Record the cost of every ongoing mandate. The capacity gain is finite; recurring policy costs continue. Existing factions, special projects, aid accords and war outcomes retain their own eligibility and interruption rules."
 ac_reg_central_register:0 "Retain a Central Register"
 ac_reg_central_register_desc:0 "Keep essential appointments and accounts under a common national register. This opens record-keeping work without requiring a legislature or a new constitutional order. It is an alternative delivery model rather than an automatic political victory."
 ac_reg_civil_protection:0 "Protect Civilian Services"
 ac_reg_civil_protection_desc:0 "Give shelters, emergency medical services and evacuation coordination a standing allocation. The civilian protection spirit improves stability while consuming civilian capacity. It does not buy equivalent military readiness or claim immunity from a scripted crisis."
 ac_reg_civilian_contracts:0 "Civilian Maintenance First"
 ac_reg_civilian_contracts_desc:0 "Reserve procurement attention for civilian maintenance and functioning services. The resulting capability improves construction efficiency while requiring a continuing allocation of consumer capacity. It excludes the competing protected military allocation in this tree."
 ac_reg_defense_register:0 "Inventory the Armed Services"
 ac_reg_defense_register_desc:0 "Review existing training and supply duties without inventing named formations. The register opens a recurring staff exercise with a real domestic opportunity cost. It supplies neither a starting army nor retroactive equipment to existing campaigns."
 ac_reg_defense_review:0 "An Affordable Defense Mandate"
 ac_reg_defense_review_desc:0 "Complete a national defense review that can coexist with civilian recovery. Training and field maintenance keep their distinct costs. The assessment grants institutional capacity once and remains reachable when a diplomatic partner is unavailable."
 ac_reg_delegation:0 "Delegate Everyday Services"
 ac_reg_delegation_desc:0 "Reserve the national executive for duties that local offices cannot perform. The enduring district mandate improves stability at a political and weekly capacity cost. The country retains its existing leaders and ideology."
 ac_reg_districts:0 "District Service Offices"
 ac_reg_districts_desc:0 "Let district offices resolve ordinary service failures while the centre keeps the national register. Either preceding administrative approach can support this route. The offices create a durable local-service capability without granting factories or altering provincial ownership."
 ac_reg_domestic_contingency:0 "A Domestic Contingency Route"
 ac_reg_domestic_contingency_desc:0 "Prepare useful local work before asking external partners for more. The focus ensures the administration can recover capacity through audits even when it declines a mandate. It grants no reward merely for sending an offer or waiting for another country."
 ac_reg_emergency_register:0 "List Essential Services"
 ac_reg_emergency_register_desc:0 "Map emergency responsibilities using the administration that exists. The exercise concerns continuing civil emergencies rather than a predicted disaster date. It opens useful domestic relief work without granting historical preparation rewards to a late save."
 ac_reg_executive:0 "Direct Executive Orders"
 ac_reg_executive_desc:0 "Concentrate the current administration on delivery rather than extended review. The mandate accelerates military procurement at a civilian opportunity cost. It does not change the ruling ideology, leader or constitution, and its weekly capacity demand can force suspension."
 ac_reg_external_register:0 "List External Commitments"
 ac_reg_external_register_desc:0 "Inventory the promises already made abroad. This branch does not found an alliance or assume independent treaty powers for a subject. Its domestic planning capability remains available regardless of the answer to later political proposals."
 ac_reg_external_review:0 "A Sustainable External Policy"
 ac_reg_external_review_desc:0 "Assess national commitments against the government actual capacity. Neither neutrality nor civilian contact becomes a stranded branch. The conclusion does not assert a canonical settlement or change any border, faction or diplomatic outcome flag."
 ac_reg_field_priority:0 "Field Maintenance Priority"
 ac_reg_field_priority_desc:0 "Direct technical staff toward keeping existing units supplied. The spirit reduces supply consumption while slowing civilian construction. It is an alternative to expanding staff schools, and it cannot manufacture the missing forces of an undeveloped country."
 ac_reg_freight:0 "Coordinate Freight Priorities"
 ac_reg_freight_desc:0 "Publish the order in which public contracts receive transport capacity. The coordination spirit reduces supply consumption at a continuing political cost. It neither draws a railway across unverified terrain nor creates a foreign transit right."
 ac_reg_guarded_contacts:0 "Guarded External Contacts"
 ac_reg_guarded_contacts_desc:0 "Keep external commitments limited and invest administrative attention at home. The spirit strengthens stability while slowing research exchange. It leaves the domestic conclusion useful after a refused political mandate."
 ac_reg_inspectors:0 "Inspect the Chosen System"
 ac_reg_inspectors_desc:0 "Evaluate the institutions actually adopted. A government whose earlier mandate exhausted capacity can suspend that policy and rebuild through paid audits. The focus does not silently restore a failed mandate or repeat a previous grant."
 ac_reg_institution_review:0 "Review Institutional Reach"
 ac_reg_institution_review_desc:0 "Compare duties assigned on paper with the offices able to carry them out. This opens the continuing institutional programme independently of any foreign actor. Its national conditions are explicitly provisional gameplay, derived from inherited government context."
 ac_reg_institutional_settlement:0 "An Administration Able to Endure"
 ac_reg_institutional_settlement_desc:0 "Conclude the regional foundation programme when its actual prerequisite work is complete. The assessment has no calendar expiry and remains available after later campaign dates. It is a playable institutional layer, not a claim of a bespoke national history or complete economic and military foundation."
 ac_reg_productive_review:0 "A Sustainable Production Plan"
 ac_reg_productive_review_desc:0 "Review the balance between public services and military orders. The conclusion consolidates institutional capacity rather than adding interchangeable factories. Maintenance decisions remain available when war, subject status or an unavailable partner prevents a diplomatic route."
 ac_reg_protected_orders:0 "Protected Military Orders"
 ac_reg_protected_orders_desc:0 "Keep a protected flow of military orders even when civilian workshops request the same staff and tooling. Factory output improves while civilian construction slows. The policy is a gameplay allocation, not evidence of a historical mobilisation or military government."
 ac_reg_readiness_reports:0 "Publish Readiness Limits"
 ac_reg_readiness_reports_desc:0 "Put the armed services actual limits before the current executive offices. This capacity improvement does not set another campaign readiness flag. A country with a constrained industrial base must still pay for equipment and logistics through their owning systems."
 ac_reg_records:0 "A Common Records Standard"
 ac_reg_records_desc:0 "Compatible records make the limits of administrative reach visible. Standardisation unlocks a continuing records programme; it cannot erase the costs of an active mandate. A government that refuses centralisation can still maintain its local services."
 ac_reg_register:0 "Map Public Responsibilities"
 ac_reg_register_desc:0 "Inventory the offices that already govern the country. The register records responsibilities without replacing the government or assuming a universal parliament. It opens a repeatable administrative audit that exchanges political authority and construction attention for institutional capacity."
 ac_reg_rehearsals:0 "Exercise the Local Response"
 ac_reg_rehearsals_desc:0 "Run a small recurring response programme rather than assuming every district can mobilise simultaneously. This unlocks repeatable relief exercises paid in political authority and construction attention. It does not set the owning Ulysses or Anean preparation measures."
 ac_reg_replacement_office:0 "A Replacement Liaison Office"
 ac_reg_replacement_office_desc:0 "Join military replacement planning to the public contract register. The liaison opens continuing training work and modest experience, with no new leader, automatic deployment or unsupported aircraft variant."
 ac_reg_resilience_review:0 "A Domestic Resilience Plan"
 ac_reg_resilience_review_desc:0 "Consolidate the duties actually exercised by the government. Civil services retain a useful conclusion even if the country never receives foreign support. No automatic disaster payout, territory transfer or previously expired historical event accompanies this review."
 ac_reg_service_review:0 "Review the Service Mandate"
 ac_reg_service_review_desc:0 "Assess the actual administrative policy in force. The review improves institutional capacity once and leaves the ongoing audit and recovery routes available. It makes no claim that every office is equally effective or that reform has changed the national leadership."
 ac_reg_spares:0 "A Replacement Parts Reserve"
 ac_reg_spares_desc:0 "Standardise replacement parts instead of expanding every production line at once. The programme opens repeatable maintenance work. Either industrial allocation can sustain it, including a government whose international negotiations have failed."
 ac_reg_staff_schools:0 "Accountable Staff Schools"
 ac_reg_staff_schools_desc:0 "Give existing instructors a common training and review programme. The spirit improves experience gain at a political operating cost. It preserves existing commanders, command-reform branches and the authority of the established war systems."
 ac_reg_stock_records:0 "Account for Emergency Stores"
 ac_reg_stock_records_desc:0 "Record the destination of public stores so that a shortage can be distinguished from a missing report. The capability opens additional domestic relief work. It remains useful after refusal, isolation or interruption of international cooperation."
 ac_reg_succession_rules:0 "Keep the Offices Functioning"
 ac_reg_succession_rules_desc:0 "Document responsibilities across routine transfers of office without inventing an individual or a term of government. The records capability and capacity improvement remain useful under the inherited political identity."
 ac_reg_survey:0 "Survey Productive Capacity"
 ac_reg_survey_desc:0 "Compare workshops, transport and staffing before choosing an investment priority. This survey creates no new canonical resource deposits. It unlocks a maintenance programme whose construction opportunity cost remains visible in the national spirits."
 ac_reg_technical_contacts:0 "Civilian Technical Contacts"
 ac_reg_technical_contacts_desc:0 "Maintain civilian channels and compatible technical records. The spirit modestly improves research at a political operating cost. Contacts do not force acceptance, create military access or place a subject outside its actual authority."
 ac_reg_uniformed_reserve:0 "A Uniformed Emergency Reserve"
 ac_reg_uniformed_reserve_desc:0 "Keep the armed services available for emergency transport and reserve training. This protects training capability at a civilian construction cost. It is a domestic allocation and neither starts a war nor joins an existing faction."
 ac_regional_foundation:0 "Regional Foundation Programme"
 ac_regional_foundation_desc:0 "A persistent 36-focus administrative, productive and readiness framework for countries without a dedicated national campaign. National profiles and selected mandates provide context; this shared programme does not pretend to be a bespoke history."
