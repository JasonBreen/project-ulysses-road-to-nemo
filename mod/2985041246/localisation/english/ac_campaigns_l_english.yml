 ac_camp.112.t:0 "The word temporary"
 ac_camp.112.desc:0 "The veterans listening to the briefing have heard the word temporary before. Some remember who used it and some remember the road they were standing on when they heard it. Strictly limited support offers a smaller commitment whose boundaries are easier to defend. A conditional mission permits more useful work while requiring the government to maintain a credible power to withdraw. The receiving country must answer. Ustio's earlier settlement, sovereignty and original cast are retained; the new branch does not rewrite them to make a convenient mission available."
 ac_camp.112.a:0 "Circulate a public receiving account."
 ac_camp.112.b:0 "Keep a signed professional return."
