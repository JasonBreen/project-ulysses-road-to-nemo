 ac_snp_yuk_shift_civil:0 "Reassign Ten Points to Civil Receiving Offices"
 ac_snp_yuk_shift_civil_desc:0 "Reassign ten of the existing hundred allocation points. The receiving office cannot take points already reserved by active work. This costs fifteen political power, or ten after the inherited army-reform assessment, plus two institutional-capacity points. Reassignments share a thirty-day cooldown. The inherited intervention, command reform and Arkbird policies remain in force."
