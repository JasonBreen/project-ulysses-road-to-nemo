 ac_camp.113.t:0 "The first vehicle"
 ac_camp.113.desc:0 "A transit agreement is tested by the first vehicle whose papers do not match its cargo. Published rules give the border staff an answer they can show to a foreign officer. Escorted transit places more responsibility on the personnel accompanying the movement. Both arrangements occupy people who might otherwise be maintaining the domestic network. The offer goes to a present receiving authority, and the recorded outcome distinguishes preparation, consent and completion. A road does not become an alliance merely because an official has drawn an arrow along it."
