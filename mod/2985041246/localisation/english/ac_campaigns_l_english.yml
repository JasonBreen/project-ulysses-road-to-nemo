 ac_camp_blk:0 "Belka — campaign operations"
 ac_camp_blk_desc:0 "Commit resources to preparation, conduct operations, and read the delivered scenes. Historical dates open opportunities; results depend on present conditions. All alternate routes and dialogue are authored gameplay."
 BLK_camp_0_register:0 "What the settlement left"
 BLK_camp_0_register_desc:0 "What the settlement left. Open the campaign lane and its preparation record.\n\nThe settlement files contain the country that actually emerged from the earlier war. A conventional defeat, a narrow peace and an alternate victory cannot all produce the same veterans' meeting. The clerk lays out the surviving orders and waits while the visitors decide which parts they would prefer not to remember. Opening the archive commits the government to hearing a record that can contradict its most useful story. Closing it leaves that story available to people whose authority depends on nobody asking what the documents say."
