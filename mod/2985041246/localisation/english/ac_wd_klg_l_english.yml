l_english:
 KLG_wd_pol_count:0 "Count the Silent Majority"
 KLG_wd_pol_count_desc:0 "Kaluga enters 1991 governed by a National Administration that wears the democratic party's colours while the election calendar stays locked. Unlike its neighbours, that party is genuinely popular: six citizens in ten back it. Commissioning an honest public survey of its support is cheap, but it turns a quiet embarrassment into a published fact the Administration must then answer."
 KLG_wd_pol_roll:0 "An Electoral Roll from Nothing"
 KLG_wd_pol_roll_desc:0 "No national electoral roll has been kept since the calendar was locked. Clerks must register voters in the capital, the two mill districts and the two empty districts, where some hamlets can be reached only by rail and footpath. The roll takes a year and a great deal of overtime. Without it, every later promise about a ballot remains talk."
 KLG_wd_pol_minority:0 "Hearings for the Other Four in Ten"
 KLG_wd_pol_minority_desc:0 "Four citizens in ten do not back the majority party: a fifth want non-party administrators, about one in nine leans to the labour socialists, and a small nationalist circle complains loudest. Public hearings in every district give them a formal voice before any constitution is drafted. They cost time and patience, and take the sting out of later charges of a rigged settlement."
 KLG_wd_pol_gazette:0 "Print Every Decree Since 1991"
 KLG_wd_pol_gazette_desc:0 "Since the vote was locked away, the Administration has governed by decree, and many decrees were never printed. A gazette gathers every one of them into public volumes, from tariff changes to officer appointments. Some read badly in daylight. Printing them ends the rumour trade and gives the courts a text to work from, at the price of a bruising month in the press."
 KLG_wd_pol_writ:0 "Fix a Date for the Chamber"
 KLG_wd_pol_writ_desc:0 "The majority party's own members want the simplest answer: a fixed date for elections to a single chamber, which would then choose a cabinet. Their party would probably win, and its rivals know it. Setting the date reassures lenders and neighbours that the republic means its name, and binds the Administration to surrender the seals on a day it cannot move."
 KLG_wd_pol_presidency:0 "A President Chosen by Every Voter"
 KLG_wd_pol_presidency_desc:0 "A second camp inside the majority party fears a chamber of quarrelling factions in a country this small. It proposes a president elected directly by the whole country for a fixed term, with a weaker chamber to pass the budget. The office would be strong and visible. It would also let one election decide almost everything for years at a stretch."
 KLG_wd_pol_caretaker:0 "The Administration Stays at Its Desk"
 KLG_wd_pol_caretaker_desc:0 "The non-party camp argues that the Administration already runs the line, the yards and the mills competently, and that an election now would only reward slogans. It proposes a standing council of senior administrators that governs on published targets while the calendar stays locked. The majority party would be furious, and six citizens in ten would remember who silenced them."
 KLG_wd_pol_chamber_regime:0 "Seat the First Elected Chamber"
 KLG_wd_pol_chamber_regime_desc:0 "Polling day passes without serious incident, and the new chamber chooses a cabinet from its largest bloc. The cabinet governs collectively and must defend every budget on the floor of the house. Officials who answered only to the Administration for years now take instructions from ministers who campaigned against them, and the first months are tense on both sides of every desk."
 KLG_wd_pol_president_regime:0 "Swear In the First President"
 KLG_wd_pol_president_regime_desc:0 "The first direct presidential vote goes to a second round, and the winner takes office with a national mandate and a small chamber that can only amend the budget. The presidency gathers the ministries under one office in the capital. Supporters call it decisive government for a small republic; opponents note that the losing half of the country has no seat at the table."
 KLG_wd_pol_council_regime:0 "Charter the Standing Council"
 KLG_wd_pol_council_regime_desc:0 "A short charter turns the Administration into a standing council of administrators with fixed terms, published targets and an annual report read aloud in public. Party activity continues, but it no longer leads to office. The council can plan a decade of rail and harbour work without an electoral cycle. It also owns every failure, and the majority it set aside does not forget."
 KLG_wd_pol_committees:0 "Committees That Read Contracts"
 KLG_wd_pol_committees_desc:0 "The chamber creates standing committees for the railway, the yards and the treasury, each able to summon officials and read any contract above a set value. Ministers lose afternoons to hearings, and some projects slow while committees argue. The public sees where its money goes, and contractors learn that a quiet word with one minister no longer settles a tender."
 KLG_wd_pol_direct_mandate:0 "Government by Presidential Order"
 KLG_wd_pol_direct_mandate_desc:0 "The president governs through orders countersigned by a small cabinet office, and the ministries learn to move quickly. Rail timetables, harbour budgets and frontier postings change within weeks rather than seasons. The chamber can delay an order but rarely stop it. Critics in the press warn that a later president could use the same powers for worse ends, and they are not wrong."
 KLG_wd_pol_council_targets:0 "Targets Published Every Quarter"
 KLG_wd_pol_council_targets_desc:0 "The council publishes a quarterly sheet of targets and results for every ministry: kilometres of track relaid, tonnes rolled, ships kept at sea, clinics opened. Missed targets cost administrators their posts. The sheets are dull to read and impossible to ignore. They are the council's answer to the question of legitimacy: if it cannot be voted out, it can at least be measured."
 KLG_wd_pol_labour:0 "A Compact with the Mill Unions"
 KLG_wd_pol_labour_desc:0 "The labour socialists are a small party but a strong presence in the mill districts and the capital yards. A compact with the unions fixes wage rounds, safety inspections and a grievance board in exchange for no unannounced strikes for three years. Employers grumble about the inspectors. A republic with three steel districts and two yards cannot afford a summer of stoppages."
 KLG_wd_rail_walk:0 "Walk the Line End to End"
 KLG_wd_rail_walk_desc:0 "One level-two railway carries almost everything Kaluga moves: from the forest mills through the empty woods to the capital, and from the capital across the empty plains to the junction works. No line crosses any frontier. A survey team walks every kilometre, logging bridges, culverts and sidings. Acting on its report will be costly, and nothing can be planned without it."
 KLG_wd_rail_capital_yard:0 "Rebuild the Capital Freight Yard"
 KLG_wd_rail_capital_yard_desc:0 "Every wagon between the two halves of the country passes through the capital's freight yard, where shunting crews still couple by hand and the harbour spur jams twice a day. New points, a second hump and lighting for night work cost a season of disruption. Once finished, the yard can turn trains round in hours rather than a full day."
 KLG_wd_rail_sidings:0 "Passing Loops on the Plains"
 KLG_wd_rail_sidings_desc:0 "The section across the empty plains district is single track with long gaps between passing loops, so one late train delays everything behind it. Engineers lay new loops and a gravel road beside the line for maintenance gangs. The district has no factories to serve yet, which makes the money hard to defend in the budget. It also makes the district reachable for the first time."
 KLG_wd_rail_forest_halts:0 "Halts in the Empty Woods"
 KLG_wd_rail_forest_halts_desc:0 "Trains to the forest mills pass straight through the woods and marsh of the district beside the capital without stopping, because there is nowhere to stop. Halts, access tracks and a timber loading bay give the district its first link to anything. Foresters and surveyors can now reach the interior, and smugglers working the Luremian frontier notice the new tracks as well."
 KLG_wd_rail_settle:0 "Settle the Two Empty Districts"
 KLG_wd_rail_settle_desc:0 "The settlement school wants towns in both empty districts: housing, a works estate on each new siding and cheap credit for families who move out from the crowded capital. Settled districts would carry their share of the economy and of the frontier. It is the costlier answer, and a decade will pass before the new towns repay a fraction of what they cost."
 KLG_wd_rail_reserve:0 "Keep the Empty Districts in Reserve"
 KLG_wd_rail_reserve_desc:0 "The reserve school argues that two districts without roads are also two districts without debts. It proposes leasing timber, peat and grazing rights instead of building towns, with the state keeping title and the railway serving the leases. Revenue arrives quickly and cheaply. The districts stay empty, which suits the treasury and worries officers who must defend frontiers nobody lives near."
 KLG_wd_rail_works_town:0 "A Works Town on the New Loops"
 KLG_wd_rail_works_town_desc:0 "The first settlement rises beside the new passing loops on the plains: a works estate, a school and a plant making rail fittings and farm machinery. Families arrive on subsidised fares from the capital. The plant runs at a loss in its first years, and the town council complains about water. Within a decade it is the district's reason to exist."
 KLG_wd_rail_sawmill_town:0 "A Sawmill Town at the Halt"
 KLG_wd_rail_sawmill_town_desc:0 "The woods district gets its town at the busiest of the new halts, built around a sawmill, a joinery works and a timber drying shed. Timber that once rode the whole line to the forest mills is now cut where it grows. The marsh makes foundations expensive and the first winters are hard. Settlers who stay become the district's first voters."
 KLG_wd_rail_leases:0 "Timber and Peat Leases at Auction"
 KLG_wd_rail_leases_desc:0 "Leases for timber, peat and summer grazing go to public auction in blocks along the new tracks, with replanting and drainage conditions written into every contract. Bidders build their own access roads to reach their blocks. The treasury collects quickly, though inspectors must ride out each season to see whether the conditions are kept or quietly ignored."
 KLG_wd_rail_frontier_road:0 "A Road to the Silvonian Crossing"
 KLG_wd_rail_frontier_road_desc:0 "The plains district meets Silvonia, but the only road to the crossing is a farm track that floods every spring. A paved road from the nearest loop to the customs post lets trucks, ambulances and patrols reach the frontier in any season. Silvonian hills rise on the far side, and what happens there is not for Kaluga to decide. This side, at least, will be passable."
 KLG_wd_rail_flat_tariff:0 "One Tariff from End to End"
 KLG_wd_rail_flat_tariff_desc:0 "Freight charges on the line still follow a patchwork of old district rates, so a wagon of ore pays three separate tariffs between the junction works and the capital yards. A single flat tariff per tonne and kilometre simplifies billing and helps the districts farthest from the capital. The railway loses some revenue, and capital merchants lose an advantage they had long stopped noticing."
 KLG_wd_rail_doubling:0 "Double Track Through the Capital"
 KLG_wd_rail_doubling_desc:0 "Whatever became of the empty districts, both halves of the line now carry more trains than the single track through the capital can pass. Doubling the capital section, with a new bridge over the harbour spur, removes the worst bottleneck in the country. It closes the line on weekends for a year. Every district feels the delay, and every district gains when it ends."
 KLG_wd_steel_census:0 "Count Every Furnace"
 KLG_wd_steel_census_desc:0 "Three districts dig and smelt steel: the capital, the forest mills and the junction works. Nobody has compared their furnaces, costs or order books since the Administration took office. A census of every furnace, rolling stand and ore pit tells the ministry what the country can actually make. Owners resent the inspectors; the figures will shape every decision that follows."
 KLG_wd_steel_ingots:0 "Ship the Ingots Abroad"
 KLG_wd_steel_ingots_desc:0 "The export school says Kaluga should do what it already does cheaply: smelt ingots and ship them from the capital harbour to whoever pays. Contracts would be long and foreign currency would arrive quickly. Finished goods would still be imported at someone else's margin, and the mills would stay at the bottom of every supply chain they join."
 KLG_wd_steel_rolling:0 "Roll and Finish at Home"
 KLG_wd_steel_rolling_desc:0 "The finishing school wants ingots rolled into sheet, rail and wire inside the country, so that Kalugan factories and the railway buy Kalugan steel. It needs new rolling stands and protected prices for a decade. Domestic industry would deepen and jobs would multiply. Export earnings fall meanwhile, and the treasury must carry the gap until the stands pay for themselves."
 KLG_wd_steel_plate:0 "Hull Plate for the Capital Slips"
 KLG_wd_steel_plate_desc:0 "The shipbuilding school points to the two yards on the capital harbour and asks why their plate comes from abroad. It proposes turning the mills toward marine plate and sections, guaranteed by yard contracts. The navy and the merchant owners would gain a domestic supplier. Everything would then ride on two small yards, a narrow footing for a whole steel trade."
 KLG_wd_steel_ore_road:0 "Ore Roads to the Junction Ramps"
 KLG_wd_steel_ore_road_desc:0 "Ingot exports need ore and coke moving fast, and the junction district's pits reach the railway by crumbling roads. Paving the haul roads and widening the loading ramps at the logistics centre lets ore trains leave full every day. The work is cheap beside a new mill. It also serves the junction's frontier traffic, which customs officers will be glad of."
 KLG_wd_steel_rolling_mill:0 "A Rolling Mill Among the Pines"
 KLG_wd_steel_rolling_mill_desc:0 "The forest mill district has ore, wood-fired boilers and one free plot beside the railway. A rolling mill there turns local ingots into rail and wire for the line itself. The plant sits on marsh ground and needs costly piling. Once running, it means the railway can relay its own track with steel that never left the country."
 KLG_wd_steel_plate_shop:0 "A Plate Shop by the Slipways"
 KLG_wd_steel_plate_shop_desc:0 "The last free plot on the capital waterfront becomes a plate shop and a third building berth, so that marine plate rolled at home goes straight from the mill train to the slipway. Space in the capital is precious, and the harbour board wanted the plot for warehouses. Instead it builds hulls, which the coastal defence plans have wanted since 1991."
 KLG_wd_steel_credit:0 "A Bank for Mill Credit"
 KLG_wd_steel_credit_desc:0 "Whichever course the mills took, all of them need credit that private banks will not give a small country's heavy industry. A state mill bank lends against order books, with rates set by the ministry and accounts open to inspection. Bad loans will happen, and the treasury will carry them. The aim is that no mill closes because one customer paid late."
 KLG_wd_steel_alloy:0 "Light Alloy for the Arms Works"
 KLG_wd_steel_alloy_desc:0 "Kaluga has aluminium as well as steel, most of it in the capital and forest districts, and almost all of it leaves the country raw. A light alloy works beside the junction arms plants would supply frames for vehicles, aircraft parts and small arms. It is a modest venture with a long learning curve, and the first castings will be scrapped by the dozen."
 KLG_wd_steel_fuel_book:0 "Six Small Wells and One Silo"
 KLG_wd_steel_fuel_book_desc:0 "The country pumps a little oil from six modest fields and stores it in a single silo at the capital. A fuel book allocates every barrel among the railway, the mills, the fleet and the airfield, with a reserve only the cabinet can release. Industry complains about rationing in peacetime. The fleet and fighters would complain far louder if the silo ran dry."
 KLG_wd_steel_arms_line:0 "An Arms Line on the Plains"
 KLG_wd_steel_arms_line_desc:0 "With a works town now standing on the plains, the ministry places a small arms line there to build mortars, machine guns and vehicle parts with alloy from the junction works. Moving some arms production away from the capital and the frontier junction is sound planning. It also gives the new town a second employer, and gives the army a reason to defend it."
 KLG_wd_port_board:0 "A Board for the Capital Harbour"
 KLG_wd_port_board_desc:0 "The capital harbour holds the country's only naval base, its two yards and nearly all its merchant traffic, and three ministries each believe they run it. A single harbour board takes over berths, pilots, dredging and the naval quay. The ministries lose their small empires. Ships stop waiting for permission from offices that do not speak to each other."
 KLG_wd_port_new_submarines:0 "A New Class of Submarine"
 KLG_wd_port_new_submarines_desc:0 "In September 1991 Yuktobania announced a new class of submarine to the world. Kaluga's navy is one escort and a handful of patrol craft, and its whole coast faces open water. Officers ask what one large submarine could do to the capital harbour. A watch on the approaches, using listening buoys and fishing-boat reports, is the cheapest answer anyone can offer."
 KLG_wd_port_mines:0 "Mines and Patrol Boats"
 KLG_wd_port_mines_desc:0 "The mine school argues that one escort cannot defend five districts of coast, but controlled minefields and a flotilla of fast patrol boats can make the harbour approaches dangerous for anyone. Mines are cheap and quiet. They also turn fishing grounds into closed water, and every fishing family on the coast will feel the new charts."
 KLG_wd_port_escorts:0 "A Squadron of Three Escorts"
 KLG_wd_port_escorts_desc:0 "The escort school wants the lone destroyer joined by two more, built or bought, so that one is always at sea, one in refit and one training. A squadron could escort convoys, chase contacts and show the flag along the long coast. It is far dearer than mines, and three small ships remain small against any serious navy."
 KLG_wd_port_patrol_yard:0 "A Patrol Craft Yard in the Woods"
 KLG_wd_port_patrol_yard_desc:0 "Patrol boats and minelayers need a yard away from the crowded capital. A sheltered inlet in the woods district, already reached by the new halts, can take a small slipway and a mine store under the trees. The marsh ground is soft and access is poor. Dispersal means one strike on the capital no longer ends the flotilla."
 KLG_wd_port_escort_slips:0 "Two Hulls on the Capital Slips"
 KLG_wd_port_escort_slips_desc:0 "The two new escorts are laid down on the capital slips to a modest design the yards can actually finish. The navy wants more guns; the yards want fewer changes. Engineers learn hull work and crews train on the first ship while the second is still on the ways. It is slow and expensive, and it is a fleet built at home."
 KLG_wd_port_fishery:0 "A Fishery Patrol on Every Coast"
 KLG_wd_port_fishery_desc:0 "All five districts touch the sea, and the fishing fleets of several countries work the same grounds. Cutters with boarding crews enforce catch limits, check papers and tow broken boats home. The patrol earns little and burns fuel. It gives the coast a visible state presence and keeps small quarrels between fishermen from reaching the foreign ministry."
 KLG_wd_port_convoy:0 "Pool the Sixty Freighters"
 KLG_wd_port_convoy_desc:0 "Sixty freighters and coasters sail under Kalugan registry, owned by dozens of firms that never share information. A convoy pool lists every hull, crew and cargo, and routes them together when the sea lanes turn dangerous. Owners dislike the paperwork. In a crisis the republic will know where every ship is and what each can carry."
 KLG_wd_port_lifeboats:0 "Lifeboat Crews Along the Coast"
 KLG_wd_port_lifeboats_desc:0 "Volunteer lifeboat crews already exist in a few villages, trained by fishermen and paid from collection boxes. The harbour board funds stations, boats and radios in every district so that a crew can reach any stretch of coast within an hour. The crews are cheap, proud and indispensable in a storm, or in any emergency that empties a coastal town."
 KLG_wd_port_exercise:0 "The First Joint Harbour Exercise"
 KLG_wd_port_exercise_desc:0 "Whatever the navy chose, the harbour board runs its first exercise combining warships, coast guns, fighters from the capital field and the lifeboat crews. Signals fail, a patrol boat runs aground and the fighters arrive late. Every error is written down. The second exercise goes better, and a standing coast command grows out of the wreckage of the first."
 KLG_wd_port_coast_radar:0 "Radar Over the Harbour Mouth"
 KLG_wd_port_coast_radar_desc:0 "The exercise showed that nobody could see past the harbour breakwater at night. A radar station on the headland covers the approaches and feeds the coast command. It is an old design bought second-hand, and its crews keep it alive with spare parts from three countries. It still sees farther than any lookout ever did."
 KLG_wd_army_staff:0 "One Staff for Four Formations"
 KLG_wd_army_staff_desc:0 "The army is four infantry formations with engineers attached, enough to hold the capital and little more. Each formation keeps its own stores, maps and habits. A single general staff, with one supply office and one training plan, turns four garrisons into an army. Senior officers lose their independence, and the staff's first readiness report makes uncomfortable reading."
 KLG_wd_army_territorial:0 "A Company in Every District"
 KLG_wd_army_territorial_desc:0 "The territorial school splits the formations into companies stationed in every district, recruited locally and trained on their own woods, marsh and plains. Every district would have defenders who know its ground. Nobody could attack anything, and the companies would be thin. For a country with four formations, the school argues, being everywhere is the only realistic aim."
 KLG_wd_army_brigade:0 "One Field Brigade on the Railway"
 KLG_wd_army_brigade_desc:0 "The field school wants the formations concentrated into one brigade with trucks and rail wagons, based at the capital and able to move to any district along the line within a day. Its punch would be real. Districts would be watched by police and customs until the brigade arrived, and every officer knows how much can happen in a day."
 KLG_wd_army_armouries:0 "Armouries for the District Companies"
 KLG_wd_army_armouries_desc:0 "Companies in five districts need rifles, ammunition and repair benches close at hand rather than in the capital. A small arms works in the woods district, near the new halts, supplies the companies along the forest frontiers and repairs what they break. Spreading production costs efficiency. It also lets the woods companies fight for weeks without a train from the capital."
 KLG_wd_army_brigade_trucks:0 "Trucks and Flatcars for the Brigade"
 KLG_wd_army_brigade_trucks_desc:0 "The brigade's speed depends on vehicles and wagons the army does not yet have. Buying trucks and reserving flatcars on the railway gives the brigade its promised mobility. Drivers and loaders must be trained, and the railway resents losing wagons. Exercises show the brigade reaching the junction in eighteen hours, which the staff calls a success and the junction calls slow."
 KLG_wd_army_engineers:0 "Engineers Before Infantry"
 KLG_wd_army_engineers_desc:0 "Kaluga's formations already lean on attached engineers, and the research staff's priority is sustainment rather than new weapons. An engineer school trains bridge, rail and demolition specialists who can keep the line open or close it to an enemy. Infantry officers complain that their best recruits are taken. Engineers also build in peacetime, which the treasury likes."
 KLG_wd_army_spares:0 "Spares Before New Rifles"
 KLG_wd_army_spares_desc:0 "The army's stock of rifles, trucks and support equipment is adequate, but its spare parts are not. Depots for barrels, tyres, radios and engine parts, kept beside the railway, mean equipment is repaired instead of written off. New weapons would look better on parade. Spares keep the four formations able to move, which is the sustainment priority the staff was given."
 KLG_wd_army_reserve_woods:0 "Fieldcraft in the Leased Woods"
 KLG_wd_army_reserve_woods_desc:0 "Where the empty districts stayed as reserve land, the army negotiates training areas inside the timber and peat leases. Infantry learn marsh crossings, forest navigation and winter living in country nobody else uses. Leaseholders complain about blank rounds near their stacks. The army gains ground it can train on all year, and soldiers who know the forest frontiers."
 KLG_wd_army_frontier_posts:0 "Posts Facing the Silvonian Hills"
 KLG_wd_army_frontier_posts_desc:0 "Four of the five districts touch Silvonia, whose side of the frontier rises into hill and mountain country. Small observation posts on the Kalugan side, linked by telephone and reached by a road from the junction district, let the army watch rather than guess. Silvonian patrols will see them. They are placed to be seen, and nothing about them is offensive."
 KLG_wd_army_staff_ride:0 "A Staff Ride Along the Railway"
 KLG_wd_army_staff_ride_desc:0 "Staff officers ride the railway from the forest mills to the junction works, stopping at every bridge and cutting to plan how they would defend it, repair it and if necessary destroy it. The ride produces a book of demolition and repair plans for the whole line. It is the closest thing Kaluga has to a war plan, and it costs only train fares."
 KLG_wd_air_one_field:0 "Every Fighter on One Runway"
 KLG_wd_air_one_field_desc:0 "All twenty-four fighters, with six more in reserve, fly from a single airfield at the capital. One closed runway, one fuel fire or one storm grounds the entire air arm. The air staff writes this down plainly for the first time and asks for money. The report is accurate, and the treasury reads it with the enthusiasm it keeps for every expensive truth."
 KLG_wd_air_capital_runway:0 "A Longer Runway at the Capital"
 KLG_wd_air_capital_runway_desc:0 "The capital runway is too short for loaded fighters on hot days, and its taxiways flood. Lengthening it and adding hardstands and a second taxiway costs little compared to a new field. It does nothing about having only one airfield. It does mean every sortie from that one field can leave with full fuel and weapons."
 KLG_wd_air_junction_field:0 "A Second Field at the Junction"
 KLG_wd_air_junction_field_desc:0 "The junction district has flat ground, the railway and the logistics centre, and it lies at the opposite end of the country from the forest mills. A second airfield there means a strike on the capital no longer grounds the air arm. It is the most expensive item in the air budget, and the junction district welcomes the jobs."
 KLG_wd_air_interceptors:0 "Interceptors for the Capital Sky"
 KLG_wd_air_interceptors_desc:0 "The interception school wants the fighters trained and equipped above all to meet intruders over the capital, its harbour and its yards. Pilots would fly scrambles, night intercepts and ground-controlled approaches. The rest of the country would see fighters only passing overhead. A republic with one city worth bombing, the school argues, should defend that city first."
 KLG_wd_air_sea_patrol:0 "Fighters over the Sea Lanes"
 KLG_wd_air_sea_patrol_desc:0 "The maritime school points out that every district is coastal and that the navy has one escort. It wants the fighters trained for sea patrol, ship identification and work with the coast command. Pilots would spend long hours over water. The capital would rely on its guns and on whichever fighters happened to be home when trouble came."
 KLG_wd_air_hill_radar:0 "Radar Above the Capital"
 KLG_wd_air_hill_radar_desc:0 "Interceptors need warning, and the capital's few hills offer the only high ground. A radar station on the highest of them feeds a control room at the airfield, where controllers guide pilots onto targets. Radar crews are hard to train and harder to keep. Without them, interceptors are guessing, and guessing pilots run out of fuel."
 KLG_wd_air_ship_spotting:0 "Spotting for the Coast Command"
 KLG_wd_air_ship_spotting_desc:0 "Fighter pilots train with the coast command to identify ships by silhouette, report positions in the navy's grid and guide escorts or patrol boats onto contacts. The training is tedious and the pilots would rather dogfight. After a season, the coast command can see fifty kilometres out to sea whenever a fighter is airborne, which changes every patrol plan."
 KLG_wd_air_forest_strip:0 "A Dispersal Strip in the Forest"
 KLG_wd_air_forest_strip_desc:0 "A grass strip cut in the forest mill district gives fighters somewhere to land if both main fields close. It has fuel bowsers, camouflage nets and a hut for ground crew, and little else. Pilots dislike the short run and the trees. In an emergency, though, the forest strip keeps a flight in the air while the larger fields are repaired."
 KLG_wd_air_observers:0 "Observers on the Frontier Hills"
 KLG_wd_air_observers_desc:0 "Radar cannot see everything, least of all low aircraft crossing from the hill country beyond the Silvonian frontier. An observer corps of volunteers with binoculars, telephones and recognition charts reports every engine it hears. The corps costs almost nothing. It also gives retired soldiers and farmers a real part in defending their district, which pays off in other ways."
 KLG_wd_air_pilot_ladder:0 "A Ladder for Young Pilots"
 KLG_wd_air_pilot_ladder_desc:0 "Kaluga trains few pilots and loses many of them to airlines abroad. A ladder from gliding clubs through basic flying to fighter conversion, with bonded service in return, keeps the cockpits filled. Gliding clubs need fields and instructors. The bond is resented by pilots who later want airline pay, but it keeps the six reserve fighters crewed."
 KLG_wd_nbr_map:0 "Five Frontiers on One Wall Map"
 KLG_wd_nbr_map_desc:0 "Kaluga touches five countries: Silvonia along four districts, Luremia beside the woods, Glaceland on a short stretch beyond the forest mills, and Romny and Yuktobania at the junction district. Each frontier has been handled by whichever ministry had a problem there. The foreign ministry gathers them onto one map and one staff, and finds files missing for half of them."
 KLG_wd_nbr_silvonia:0 "Customs Halls Facing Silvonia"
 KLG_wd_nbr_silvonia_desc:0 "The army's frontier posts showed how little the civil state had on its longest frontier. Customs halls on the main crossings, with a proper road to the woods district crossing, replace sheds and barriers. Silvonia's own arrangements are its business. On the Kalugan side, travellers and trucks now meet a single office, a weighbridge and fixed opening hours."
 KLG_wd_nbr_glaceland:0 "Someone to Answer Glaceland"
 KLG_wd_nbr_glaceland_desc:0 "The Glacelandic frontier beyond the forest mills is short and rarely mentioned in the capital. If a post on the far side ever calls, someone on the Kalugan side should pick up. The ministry staffs a small post with a telephone and a vehicle, and asks the forest district police to report anything unusual. It is the cheapest diplomacy the republic does."
 KLG_wd_nbr_glaceland_tt_1:0 "No border, claim or treaty change; staffs the Kalugan side of the frontier only."
 KLG_wd_nbr_luremia:0 "Timber Talks with Luremia"
 KLG_wd_nbr_luremia_desc:0 "Luremia faces both the woods district and the forest mills, and timber crosses that frontier in both directions with little paperwork. Talks on felling, replanting, fire watch and customs for logs give the forest districts a predictable trade. Some mill owners lose cheap Luremian timber. The forest police gain a counterpart to call when a fire jumps the line."
 KLG_wd_nbr_junction:0 "Where Three Frontiers Meet"
 KLG_wd_nbr_junction_desc:0 "At the junction district Kaluga meets Romny, Yuktobania and Silvonia within a short distance. Freight, smuggling and rumour all pass through it. A joint customs office at the logistics centre, with inspectors who speak the neighbours' languages, gives the government eyes on the busiest corner of the country. It also makes the junction a place neighbours expect to negotiate."
 KLG_wd_nbr_registers:0 "Two Districts in the Old Registers"
 KLG_wd_nbr_registers_desc:0 "Inherited registers still list two districts now held by Yuktobania as Kalugan. Nobody in government expects to change that, and nobody wants to be the minister who erases them. The foreign ministry drafts a paper on how the republic should speak about the registers in public. The paper is careful, and every faction reads it for the one sentence it fears."
 KLG_wd_nbr_registers_tt_1:0 "Opens a choice of public wording only; no claim, core or border changes."
 KLG_wd_nbr_shelve:0 "Let the Old Registers Rest"
 KLG_wd_nbr_shelve_desc:0 "The quiet school proposes that the republic say nothing further: the registers stay in the archive, ministers decline questions, and relations with Yuktobania proceed on present facts. Nationalists call it surrender. Trade officials call it common sense. Yuktobania, which notices everything said on its frontiers, notices that nothing is being said at all."
 KLG_wd_nbr_shelve_tt_1:0 "No claim, core or border changes."
 KLG_wd_nbr_keep:0 "Keep the Registers on the Record"
 KLG_wd_nbr_keep_desc:0 "The record school wants the registers noted in an annual government statement, without demands or deadlines, so that no later government can say the matter was dropped. It costs nothing in arms and something in goodwill. Yuktobanian diplomats will read every statement. At home, the small nationalist circle loses its favourite charge against the government."
 KLG_wd_nbr_keep_tt_1:0 "A statement only; no claim, core, border or war changes."
 KLG_wd_nbr_big_market:0 "Sell into the Big Market Next Door"
 KLG_wd_nbr_big_market_desc:0 "Yuktobania's market dwarfs Kaluga's, and the junction district sits right beside it. The trade school wants steel, timber and rail fittings sold across that frontier on long contracts. The mills would run full. The republic would also depend on a single giant buyer whose politics it cannot influence and whose orders could stop with one signature."
 KLG_wd_nbr_own_course:0 "Spread the Orders Among Five"
 KLG_wd_nbr_own_course_desc:0 "The balance school wants no neighbour to take more than a fixed share of Kalugan exports, with trade offices courting Silvonia, Luremia, Glaceland and Romny as well as Yuktobania. Growth would be slower and salesmen busier. No single capital could squeeze the republic by cancelling orders, and that independence is worth the margin to its advocates."
 KLG_wd_nbr_belkan_war:0 "Freight Rates and a Faraway War"
 KLG_wd_nbr_belkan_war_desc:0 "In March 1995 war breaks out around Belka, far from Kaluga's coast. Insurers raise rates on every freighter, fuel prices climb and the convoy pool asks whether any Kalugan ships are near the fighting. The government declares it has no part in the war and tightens its own coast watch. Nobody expects the war to arrive; everyone pays for it."
 KLG_wd_nbr_thaw:0 "A Thaw Between the Giants"
 KLG_wd_nbr_thaw_desc:0 "In October 1999 Osea and Yuktobania agree to convert the Arkbird into a platform for clearing orbital debris. For a small neighbour of Yuktobania, the two great powers working together changes insurance, credit and trade forecasts almost overnight. Kalugan officials study what the cooperation means for frontier trade, and plan to profit modestly from a calmer decade."
 KLG_wd_star_warning:0 "The Astronomers Raise the Alarm"
 KLG_wd_star_warning_desc:0 "In December 1994 word comes from the international astronomers that Ulysses, an asteroid found only weeks before, may strike the planet. Kaluga owns no telescope able to follow it and no scientist able to check the sums. A weekly sky bulletin, compiled from foreign releases and read on every station, lets citizens hear the state before they hear the rumour mill."
 KLG_wd_star_tracking:0 "A Desk for Borrowed Data"
 KLG_wd_star_tracking_desc:0 "Kaluga cannot track the asteroid, but its university physicists can read data from those who do. A small desk translates international orbital updates into plain briefings for ministers and district councils. Its staff are underpaid and overworked. Their briefings stop at least one minister from repeating a newspaper's wilder estimate in public."
 KLG_wd_star_impact:0 "Impact Is Confirmed"
 KLG_wd_star_impact_desc:0 "In April 1996 the President of the FCU announces worldwide that Ulysses will strike the Earth. Where its fragments will fall is not yet known to anyone. Kalugan families start hoarding flour and fuel, and the capital's banks see queues. The government has days to decide how to plan for a disaster whose size and place it cannot know."
 KLG_wd_star_cellars:0 "Cellars and Rail Cuttings"
 KLG_wd_star_cellars_desc:0 "The shelter school proposes reinforcing cellars in every town and fitting out railway cuttings and tunnels as shelters stocked with water, lamps and blankets. Everyone would have somewhere to go within minutes. It is a huge amount of concrete for a small country, and if the fragments fall far away the money will look wasted."
 KLG_wd_star_dispersal:0 "Move Families Away from the Capital"
 KLG_wd_star_dispersal_desc:0 "The dispersal school notes that the country's only harbour, airfield, yards and largest mills share one coastal city. It proposes plans to move families by rail to the plains and woods districts if a fall is predicted nearby, with reception places, kitchens and school desks waiting. It is cheaper than concrete, far harder to carry out, and wholly dependent on warning time."
 KLG_wd_star_cutting_works:0 "Roofing the Forest Cuttings"
 KLG_wd_star_cutting_works_desc:0 "The deepest cuttings on the line run through the forest mill district, where the railway passes between rock and earth banks. Engineers roof sections of them, add drainage and lay a service road so that supplies can reach the shelters if the line is blocked. Trains slow to walking pace during the work, and the mills lose a season of shipments."
 KLG_wd_star_reception:0 "Reception Centres on the Plains"
 KLG_wd_star_reception_desc:0 "Dispersal needs somewhere to go. Reception centres along the plains section of the line, with kitchens, field hospitals, wells and a road from every halt, can hold capital families in their tens of thousands for weeks. In normal years they serve as schools and markets. Few believe they will ever be full, and nobody wants to find out unprepared."
 KLG_wd_star_reception_tt_1:0 "In ordinary years the centres serve as schools and markets."
 KLG_wd_star_grain:0 "Grain for Two Winters"
 KLG_wd_star_grain_desc:0 "If an impact anywhere closed the sea lanes, food imports would be the first thing to stop. A state reserve of grain, salt and preserved fish for two winters, stored in rail-served warehouses in every district, guards against a closed sea. Farmers like the guaranteed purchases. Taxpayers pay for warehouses they hope never to empty."
 KLG_wd_star_lifeboat_standby:0 "Lifeboat Crews on Standby"
 KLG_wd_star_lifeboat_standby_desc:0 "The lifeboat stations funded by the harbour board go onto a standby rota for the impact years, with fuel, radios and evacuation plans for every coastal village. Crews rehearse taking people off beaches and out of flooded harbours. Volunteers give up their weekends. If the sea rises anywhere on the coast, boats will already be there."
 KLG_wd_star_roche:0 "A Night in Cellars and Cuttings"
 KLG_wd_star_roche_desc:0 "In July 1999 Ulysses passes through the Roche limit. Kalugans spend the night in cellars, cuttings and reception centres, or on rooftops watching the sky. Government broadcasts repeat the same plain instructions every hour. Reports from the Usean continent soon describe catastrophic damage there. At home the task is to keep people calm, fed and told the truth."
 KLG_wd_star_debris:0 "A Debris Watch for the Century"
 KLG_wd_star_debris_desc:0 "Fragments of Ulysses remain in orbit after 1999, and the great powers are building ways to clear them. The sky bulletin becomes a standing debris watch, linking the observer corps, the radar crews and international data so that any fall near the coast is reported within minutes. It is a small office with a long brief, and the radar crews finally have something to watch."
 KLG_wd_cent_ledger:0 "A Ledger of the Whole Republic"
 KLG_wd_cent_ledger_desc:0 "Ten years after 1991, the ministries keep their figures in a dozen incompatible formats, from rail tonnage to fishery catches. A national ledger brings them into one statistical office with one set of definitions. It is dull, essential work. Every later plan, from the next rail budget to the next naval programme, will rest on numbers that finally agree."
 KLG_wd_cent_exchange:0 "Wire the Ministries Together"
 KLG_wd_cent_exchange_desc:0 "The ministries now use computers, but each in its own building with its own system. A data exchange connects them over leased lines, so the harbour board, the railway and the treasury see the same figures on the same day. Installation runs over budget and older officials resist it. The exchange saves weeks on every decision that involves more than one ministry."
 KLG_wd_cent_engineers:0 "Engineers for the Next Decade"
 KLG_wd_cent_engineers_desc:0 "The universities turn out lawyers and teachers in plenty, but too few engineers for the rail, steel and harbour work the republic has started. Scholarships, a technical college in the capital and bonded places for graduates who stay at home raise the numbers. Results take years. The college is the one institution every faction agrees the next decade needs."
 KLG_wd_cent_transit:0 "A Transit Office at the Junction"
 KLG_wd_cent_transit_desc:0 "The junction customs office handles more freight every year, and lorries queue for a day at peak times. A transit office with bonded sidings, a truck park and wider roads lets goods cross between neighbours through Kalugan territory under seal. It earns fees and keeps traffic moving. It also makes the junction a crossroads its neighbours rely on."
 KLG_wd_cent_thaw_trade:0 "Trade in a Calmer Decade"
 KLG_wd_cent_thaw_trade_desc:0 "With the great powers cooperating, credit is cheaper and insurers relax. Kalugan exporters use the calmer years to sign multi-year contracts and refinance mill debts at lower rates. The ministry warns that calm years end. For now, order books are fuller than at any time since 1991, and the treasury can repay some of what the mill bank lent."
 KLG_wd_cent_usean_war:0 "War Across the Sea in Usea"
 KLG_wd_cent_usean_war_desc:0 "In August 2003 the FCU establishes the ISAF to confront Erusea over the Usean crisis. Kaluga is far from it, but freight rates jump and some Kalugan ships trade with Usean ports. The convoy pool needs new terms, insurers demand state cover and the government repeats that it takes no side. Distance limits the damage without removing it."
 KLG_wd_cent_convoy_routes:0 "Reroute the Usean Traders"
 KLG_wd_cent_convoy_routes_desc:0 "The coast command, formed after the harbour exercises, takes charge of every Kalugan ship trading toward Usea. Ships are routed away from contested waters, given radio schedules and recalled if the fighting moves near their ports. Owners lose cargoes and fees. The command's aim is narrow: no Kalugan crew becomes a casualty of a war the republic is not part of."
 KLG_wd_cent_coast_first:0 "Coast First in the Next Programme"
 KLG_wd_cent_coast_first_desc:0 "Planning for the next programme begins, and the coast school wants its money spent on the harbour, the yards, the escorts and the coast command. Every district touches the sea, it argues, and the sea is where trade and danger both arrive. Inland roads and frontier works would wait. Officers on the Silvonian frontier read the draft with dismay."
 KLG_wd_cent_interior_first:0 "Interior First in the Next Programme"
 KLG_wd_cent_interior_first_desc:0 "The interior school wants the next programme spent on roads, towns and frontier works: the empty districts, the forest frontiers and the junction. Every frontier Kaluga has is a land frontier, it argues, and the districts beside them still lack proper roads. The harbour and yards would wait. The navy, already the smallest service, protests loudest."
 KLG_wd_cent_account:0 "The Republic Takes Stock in 2005"
 KLG_wd_cent_account_desc:0 "In 2005 the government publishes a plain account of fifteen years: the constitution it chose, the line it rebuilt, the mills, the harbour, the five frontiers and the years under the asteroid. The account is a baseline for whoever governs next. It makes no promises about the decade ahead, which the republic will plan when it arrives."
 KLG_wd_cent_account_tt_2:0 "Closes the 1991 to 2005 programme; later eras are not yet written."
 ac_wd_klg_tree:0 "Kaluga: National Programme"
 ac_wd_klg_tree_desc:0 "The national focus programme of Kaluga, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 KLG_wd_suspended_calendar:0 "The Locked Calendar"
 KLG_wd_suspended_calendar_desc:0 "A popular majority party gives its name to an Administration that has not faced a vote."
 KLG_wd_decree_gazette:0 "The Decree Gazette"
 KLG_wd_decree_gazette_desc:0 "Every decree issued since the suspension is printed and indexed."
 KLG_wd_election_writ:0 "The Election Writ"
 KLG_wd_election_writ_desc:0 "A fixed date for elections to a single chamber."
 KLG_wd_presidential_charter:0 "The Presidential Charter"
 KLG_wd_presidential_charter_desc:0 "A draft charter for a directly elected president."
 KLG_wd_caretaker_mandate:0 "Administration on Probation"
 KLG_wd_caretaker_mandate_desc:0 "The Administration governs on published targets while the vote waits."
 KLG_wd_chamber_committees:0 "Committees of the Chamber"
 KLG_wd_chamber_committees_desc:0 "Standing committees read every large contract."
 KLG_wd_direct_mandate:0 "Government by Order"
 KLG_wd_direct_mandate_desc:0 "The president governs through countersigned orders."
 KLG_wd_standing_council:0 "The Quarterly Sheet"
 KLG_wd_standing_council_desc:0 "Targets and results for every ministry, published each quarter."
 KLG_wd_labour_compact:0 "The Mill Compact"
 KLG_wd_labour_compact_desc:0 "Wage rounds and inspections agreed with the unions; no sudden strikes."
 KLG_wd_spine_timetable:0 "One Timetable"
 KLG_wd_spine_timetable_desc:0 "Every train on the line runs to a single published timetable."
 KLG_wd_settler_credit:0 "Settler Credit"
 KLG_wd_settler_credit_desc:0 "Cheap loans and fares for families moving to the empty districts."
 KLG_wd_reserve_leases:0 "Reserve Land Leases"
 KLG_wd_reserve_leases_desc:0 "Timber, peat and grazing leases on state land along the line."
 KLG_wd_freight_tariff:0 "The Flat Freight Tariff"
 KLG_wd_freight_tariff_desc:0 "One price per tonne and kilometre from end to end."
 KLG_wd_mill_census:0 "The Furnace Census"
 KLG_wd_mill_census_desc:0 "Every furnace, stand and pit counted and costed."
 KLG_wd_ingot_exports:0 "Ingots for Export"
 KLG_wd_ingot_exports_desc:0 "Plain ingots shipped from the capital harbour on long contracts."
 KLG_wd_rolled_at_home:0 "Rolled at Home"
 KLG_wd_rolled_at_home_desc:0 "Sheet, rail and wire finished inside the country under protection."
 KLG_wd_hull_plate:0 "Hull Plate Contracts"
 KLG_wd_hull_plate_desc:0 "The mills roll marine plate for the capital yards."
 KLG_wd_mill_credit:0 "The Mill Bank"
 KLG_wd_mill_credit_desc:0 "State credit against mill order books, with open accounts."
 KLG_wd_light_alloy:0 "Light Alloy Works"
 KLG_wd_light_alloy_desc:0 "Home aluminium cast into frames and parts for the arms works."
 KLG_wd_fuel_book:0 "The Fuel Book"
 KLG_wd_fuel_book_desc:0 "Every barrel from six small fields allocated in one ledger."
 KLG_wd_price_floor:0 "A Floor Under Steel"
 KLG_wd_price_floor_desc:0 "A guaranteed minimum price for mill output this season."
 KLG_wd_harbour_board:0 "The Harbour Board"
 KLG_wd_harbour_board_desc:0 "One board for berths, pilots, dredging and the naval quay."
 KLG_wd_submarine_watch:0 "Watch on the Approaches"
 KLG_wd_submarine_watch_desc:0 "Listening buoys and fishing-boat reports on every approach."
 KLG_wd_mine_flotilla:0 "Mines and Fast Boats"
 KLG_wd_mine_flotilla_desc:0 "Controlled minefields and a patrol flotilla guard the harbour."
 KLG_wd_escort_pair:0 "The Escort Squadron"
 KLG_wd_escort_pair_desc:0 "Three escorts: one at sea, one in refit, one training."
 KLG_wd_fishery_patrol:0 "The Fishery Patrol"
 KLG_wd_fishery_patrol_desc:0 "Cutters and boarding crews on every coast."
 KLG_wd_convoy_pool:0 "The Convoy Pool"
 KLG_wd_convoy_pool_desc:0 "Every Kalugan hull, crew and cargo on one list."
 KLG_wd_four_formations:0 "One Staff, Four Formations"
 KLG_wd_four_formations_desc:0 "A single staff, supply office and training plan."
 KLG_wd_territorial_companies:0 "District Companies"
 KLG_wd_territorial_companies_desc:0 "Local companies in every district, trained on their own ground."
 KLG_wd_field_brigade:0 "The Railway Brigade"
 KLG_wd_field_brigade_desc:0 "One concentrated brigade able to reach any district in a day."
 KLG_wd_engineer_school:0 "The Engineer School"
 KLG_wd_engineer_school_desc:0 "Bridge, rail and demolition specialists for every formation."
 KLG_wd_spares_depots:0 "Spares Depots"
 KLG_wd_spares_depots_desc:0 "Barrels, tyres, radios and engine parts held beside the railway."
 KLG_wd_forest_fieldcraft:0 "Forest Fieldcraft"
 KLG_wd_forest_fieldcraft_desc:0 "Infantry trained in marsh, forest and winter living."
 KLG_wd_single_field:0 "Thirty Aircraft on One Apron"
 KLG_wd_single_field_desc:0 "Every fighter in the republic flies from a single field."
 KLG_wd_interceptor_watch:0 "Interceptor Watch"
 KLG_wd_interceptor_watch_desc:0 "Fighters trained first to defend the capital sky."
 KLG_wd_sea_patrol_wing:0 "Sea Patrol Wing"
 KLG_wd_sea_patrol_wing_desc:0 "Fighters trained to patrol the sea lanes with the coast command."
 KLG_wd_observer_corps:0 "Listeners on the Hills"
 KLG_wd_observer_corps_desc:0 "Volunteer observers report every engine they hear."
 KLG_wd_pilot_ladder:0 "The Pilot Ladder"
 KLG_wd_pilot_ladder_desc:0 "Gliding clubs to fighter conversion, with bonded service."
 KLG_wd_frontier_staff:0 "The Frontier Staff"
 KLG_wd_frontier_staff_desc:0 "One staff in the capital follows all five land frontiers."
 KLG_wd_timber_accord:0 "The Timber Accord"
 KLG_wd_timber_accord_desc:0 "Agreed rules for logs, replanting and fire watch on the forest frontier."
 KLG_wd_quiet_registers:0 "Quiet Registers"
 KLG_wd_quiet_registers_desc:0 "The old registers rest in the archive; ministers decline questions."
 KLG_wd_open_registers:0 "Registers on the Record"
 KLG_wd_open_registers_desc:0 "An annual statement notes the old registers without demands."
 KLG_wd_big_market:0 "The Big Market Next Door"
 KLG_wd_big_market_desc:0 "Long export contracts across the Yuktobanian frontier."
 KLG_wd_spread_orders:0 "Orders Among Five"
 KLG_wd_spread_orders_desc:0 "No neighbour may take more than a fixed share of exports."
 KLG_wd_distant_war_watch:0 "A Distant War"
 KLG_wd_distant_war_watch_desc:0 "Higher insurance, dearer fuel and a tighter coast watch."
 KLG_wd_market_days:0 "Market Days at the Halls"
 KLG_wd_market_days_desc:0 "Reduced duties at the customs halls for a season."
 KLG_wd_sky_bulletin:0 "The Weekly Sky Digest"
 KLG_wd_sky_bulletin_desc:0 "A weekly digest of international data on the asteroid."
 KLG_wd_cellar_shelters:0 "Cellars and Cuttings"
 KLG_wd_cellar_shelters_desc:0 "Reinforced cellars and fitted railway cuttings in every town."
 KLG_wd_dispersal_plan:0 "Trains Out of the Capital"
 KLG_wd_dispersal_plan_desc:0 "Trains, routes and reception places for leaving the capital."
 KLG_wd_grain_reserve:0 "The Two-Winter Store"
 KLG_wd_grain_reserve_desc:0 "Grain, salt and preserved fish stored in every district."
 KLG_wd_evac_rehearsal:0 "Boats on Standby"
 KLG_wd_evac_rehearsal_desc:0 "Lifeboat crews on a standby rota for the impact years."
 KLG_wd_calm_broadcasts:0 "Calm on the Airwaves"
 KLG_wd_calm_broadcasts_desc:0 "Plain instructions repeated every hour on every station."
 KLG_wd_debris_watch:0 "The Debris Watch"
 KLG_wd_debris_watch_desc:0 "Observers, radar crews and international data watch for falling debris."
 KLG_wd_national_ledger:0 "The National Ledger"
 KLG_wd_national_ledger_desc:0 "One statistical office and one set of definitions."
 KLG_wd_data_exchange:0 "The Data Exchange"
 KLG_wd_data_exchange_desc:0 "The ministries share figures over leased lines."
 KLG_wd_thaw_trade:0 "Trade in the Thaw"
 KLG_wd_thaw_trade_desc:0 "Cheaper credit and longer contracts in a calmer decade."
 KLG_wd_shipping_cover:0 "Wartime Shipping Cover"
 KLG_wd_shipping_cover_desc:0 "State reinsurance for freighters trading toward a war zone."
 KLG_wd_coast_plan:0 "The Coast Programme"
 KLG_wd_coast_plan_desc:0 "The next programme spends first on harbour, yards and escorts."
 KLG_wd_interior_plan:0 "The Interior Programme"
 KLG_wd_interior_plan_desc:0 "The next programme spends first on roads, towns and frontier works."
 ac_wd_klg.1.t:0 "Six in Ten, and No Vote"
 ac_wd_klg.1.d:0 "The survey commissioned by the National Administration lands on ministers' desks in a plain grey cover. Six citizens in ten back the democratic party whose colours the Administration wears. A fifth would rather be governed by non-party administrators. About one in nine supports the labour socialists, and fewer than one in ten the nationalist circle. On paper the republic has a clear majority. In law it has no date on which that majority may vote.\n\nThe figures cut in two directions at once. The majority party's own branches ask why a government that borrows their name keeps the calendar locked. The Administration's senior officials answer that they have kept the railway, the yards and the mills running through lean years, and that a campaign now would turn every budget line into a slogan. Both sides quote the same tables, often on the same page.\n\nBefore anyone can decide what the republic should become, the Administration must decide what to do with the survey itself. Publishing it in full would put the question to the whole country at once. Circulating it only inside the ministries would buy a season of quiet and confirm every suspicion about who really governs Kaluga.\n\nProvisional gameplay."
 ac_wd_klg.1.a:0 "Publish every table."
 ac_wd_klg.1.b:0 "Keep it inside the ministries."
 ac_wd_klg.2.t:0 "A Report on the Line"
 ac_wd_klg.2.d:0 "The survey team returns from the railway with photographs, soil samples and a list of every structure between the forest mills and the junction works. The line is level-two track nearly everywhere: sound enough for the traffic of 1991 and not a wagon more. Bridges over the marsh streams carry weight limits nobody enforces. The passing loops on the plains are too far apart, and the capital yard is the worst bottleneck of all.\n\nThe report also describes what the line passes through. Between the capital and the forest mills lie woods and marsh with no road, no halt and no factory. Between the capital and the junction lie open plains in the same condition. Two of the republic's five districts are, in practical terms, scenery seen from a carriage window, and the few people who live there reach the state by walking to the track.\n\nMinisters must choose where the first money goes. The railway's engineers want the capital yard rebuilt before anything else. District councils want halts and loops so that someone can finally board a train in the empty districts. The treasury wants one figure and one programme, and would prefer both to be small.\n\nProvisional gameplay."
 ac_wd_klg.2.a:0 "The capital yard comes first."
 ac_wd_klg_2_a:0 "The capital yard comes first."
 ac_wd_klg.2.b:0 "Start with the empty districts."
 ac_wd_klg.3.t:0 "Three Districts, One Steel Trade"
 ac_wd_klg.3.d:0 "The furnace census counts every blast furnace, converter, rolling stand and ore pit in the republic. The capital district smelts the most, from ore that arrives by rail and coke that arrives by sea. The forest mill district runs smaller furnaces on its own ore, with boilers older than the Administration. The junction works beside the logistics centre combine a modest steelworks with the busiest arms plants in the country.\n\nWhat the census finds is not one industry but three, each with its own buyers, debts and habits. Nearly all of their output leaves as plain ingots, and nearly every finished steel product the republic uses is bought abroad. Aluminium follows the same pattern on a smaller scale. The mill owners blame freight costs, the railway blames the owners, and the ministry blames both in the same memorandum.\n\nThree schools are already circulating proposals: sell more ingots abroad, build rolling stands to finish steel at home, or turn the mills toward plate for the capital's two yards. Before they argue, the ministry must decide how hard to press the owners who hid figures from its inspectors.\n\nProvisional gameplay."
 ac_wd_klg.3.a:0 "Fine the owners who hid figures."
 ac_wd_klg_3_a:0 "Fine the owners who hid figures."
 ac_wd_klg.3.b:0 "Let the census close the matter."
 ac_wd_klg.4.t:0 "Three Logbooks, One Harbour"
 ac_wd_klg.4.d:0 "The harbour board's first inspection finds the capital harbour run by three authorities at once. The transport ministry assigns berths, the navy controls the naval quay and the dredged channel, and the trade ministry licenses pilots and tugs. Each keeps its own logbook. A freighter waiting for a berth can be told to move by one office and to stay put by another on the same afternoon.\n\nThe harbour matters far more than its size suggests. It holds the republic's only naval base, both of its yards, the fuel silo and almost all of its merchant traffic. The lone escort and the patrol craft share quays with ore carriers and fishing boats. Every district touches the sea, but none of the other four has a naval base or a yard, so whatever happens to this harbour happens to the whole country's trade.\n\nThe board can take over everything at once and face three angry ministries, or take berths and pilots first and leave the naval quay to the navy for now. The navy has already sent a long letter explaining why its quay is a special case.\n\nProvisional gameplay."
 ac_wd_klg.4.a:0 "Take everything at once."
 ac_wd_klg.4.b:0 "Leave the naval quay to the navy for now."
 ac_wd_klg.5.t:0 "Four Formations, Five Frontiers"
 ac_wd_klg.5.d:0 "The general staff's first readiness report is short and blunt. The army consists of four infantry formations with attached engineers, stocked with enough rifles, trucks and support equipment for its present size. All of them are based near the capital or along the railway. None of them is anywhere near most of the republic's land frontiers, which run for long stretches through woods, marsh and open plain.\n\nSilvonia faces four of the five districts, its side of the line rising into hill country. Luremia faces the woods, Glaceland a short stretch beyond the forest mills, and Romny and Yuktobania meet the junction district. None of these neighbours is hostile today. The report notes only that if one of them ever were, the army could defend the capital or one district, but never both at once.\n\nTwo schools of officers draw opposite conclusions. One wants the formations broken into district companies so that every frontier has someone watching it. The other wants them gathered into one brigade on the railway, able to reach any district within a day. Before choosing, the staff must decide whether its report goes to the public or stays inside the army.\n\nProvisional gameplay."
 ac_wd_klg.5.a:0 "Publish the report."
 ac_wd_klg.5.b:0 "Keep it inside the staff."
 ac_wd_klg.6.t:0 "Thirty Aircraft, One Strip of Concrete"
 ac_wd_klg.6.d:0 "The air staff's report opens with a single photograph: the capital airfield at dawn, every fighter in the republic lined up on one apron. Twenty-four aircraft are in service and six more stand in reserve. They share one runway, one fuel farm, one control tower and one repair hangar. The photograph was taken to impress visitors. Read beside the report, it alarms them.\n\nThe report lists what could close the field: a fuel fire, a crashed aircraft on the runway, a storm that floods the taxiways, or an attack. Any of them would ground the whole air arm for days. Pilots fly too few hours because fuel is tight, and several of the best have already left for airline cockpits abroad, taking years of training with them.\n\nThe air staff asks for three things: a second airfield, more flying hours and a clear decision on what the fighters are for. The treasury can fund one of the three this year. The navy, which wants the fighters over the sea, and the capital, which wants them overhead, have both begun to lobby, each with a map of its own.\n\nProvisional gameplay."
 ac_wd_klg.6.a:0 "Fund flying hours first."
 ac_wd_klg.6.b:0 "Save for a second field."
 ac_wd_klg.7.t:0 "Five Neighbours on One Map"
 ac_wd_klg.7.d:0 "The foreign ministry's new frontier staff pins its first map to the wall. Silvonia runs along four of the five districts, the longest frontier by far. Luremia faces the woods and the forest mills. Glaceland touches a short stretch beyond the forest mills. At the junction district, Romny and Yuktobania meet Kaluga within a short distance of the logistics centre. No railway crosses any of these lines.\n\nThe files behind the map are thin. Customs posts report to the finance ministry, frontier police to the interior ministry, and the army keeps its own notes. Local officials have settled countless small matters, from stray cattle to lost travellers, without telling anyone in the capital. Two districts held by Yuktobania still appear in inherited registers as Kalugan, a fact every minister knows and none mentions aloud.\n\nThe staff's first recommendation concerns who should own the frontiers in future. Placed under the foreign ministry, they would be handled as diplomacy, by people trained to avoid incidents. Placed under the interior ministry, they would be handled as policing, by people trained to stop smuggling. Each ministry has already sent its case.\n\nProvisional gameplay."
 ac_wd_klg.7.a:0 "The foreign ministry owns the frontiers."
 ac_wd_klg.7.b:0 "The interior ministry owns the frontiers."
 ac_wd_klg.8.t:0 "A Warning from the Astronomers"
 ac_wd_klg.8.d:0 "The astronomers' warning of December 1994 reaches Kaluga on a foreign wire in the small hours: Ulysses, an asteroid found that autumn, will pass near the Earth and might hit it. By breakfast the capital's radio stations are reading out distances and percentages that nobody in the studio can explain. Shops near the harbour sell out of candles and tinned fish before noon, and the queues are quiet rather than angry.\n\nThe republic has no observatory able to follow the asteroid and no scientists who can confirm or dispute what the wire services say. University physicists can read the international data, but slowly. District councils telephone the capital for instructions that nobody has written. The railway asks whether it should plan for evacuations, and the harbour board asks the same question about ships. Teachers want to know what to tell their classes on Monday.\n\nThe government must decide how to speak. It can publish a weekly bulletin of whatever the international bodies release, plainly and without comment, or say little until the picture is clearer and avoid feeding fear. Silence is easier for a week and much harder for a year.\n\nProvisional gameplay."
 ac_wd_klg.8.a:0 "Publish everything plainly every week."
 ac_wd_klg.8.b:0 "Say little until the figures are clear."
 ac_wd_klg.9.t:0 "The Year the Impact Was Confirmed"
 ac_wd_klg.9.d:0 "The April 1996 statement from the President of the FCU leaves no room for hope that Ulysses will miss. It offers nothing a Kalugan minister can use about where the fragments will come down, or in which month. Within days the capital's banks see queues, filling stations ration petrol, and families in the plains and woods districts write to relatives in the capital offering spare rooms.\n\nMinisters meet every day. The railway reports that it could move tens of thousands of people out of the capital in a week if it stopped carrying freight. The army's engineers report that the deep cuttings on the forest line could shelter a few thousand. The treasury reports that it cannot pay for everything at once and that lenders are already nervous about a small country's bonds.\n\nTwo proposals reach the cabinet table within the month: concrete shelters in every town, or plans to disperse the capital by rail. Before choosing, ministers can order a full count of every cellar, cutting and public building that could serve as shelter, which would take a month, or decide on what they already know and start digging at once.\n\nProvisional gameplay."
 ac_wd_klg.9.a:0 "Order the shelter count."
 ac_wd_klg.9.b:0 "Decide on what we know."
 ac_wd_klg.10.t:0 "What the Shelter Count Found"
 ac_wd_klg.10.d:0 "The shelter count comes back after a month of inspectors climbing into cellars and walking the railway cuttings. The capital has hundreds of cellars, most of them damp and unreinforced, and a handful of public buildings with basements deep enough to matter. The cuttings on the forest line are better than anyone expected. The plains and woods districts have almost nothing, because they have almost no buildings at all.\n\nThe count also finds something the cabinet never asked about. Dozens of private firms and better-off households have already dug their own shelters, a few of them excellent and most of them unregistered. At the junction, a cooperative of rail workers has roofed a disused goods cutting at its own expense. Inspectors report more goodwill and more improvisation than any plan had assumed, and rather less paperwork than the law requires.\n\nMinisters can register the private shelters and open them to the public in an emergency, adding space quickly and angering their owners, or leave them alone and build public shelters from scratch. Either way, the shelter and dispersal schools now have real numbers to argue over, and neither will like all of them.\n\nProvisional gameplay."
 ac_wd_klg.10.a:0 "Register private shelters for public use."
 ac_wd_klg.10.b:0 "Leave them be and build our own."
 ac_wd_klg.11.t:0 "Ten Years of Figures"
 ac_wd_klg.11.d:0 "The new statistical office publishes its first national ledger, gathering a decade of figures that ministries had kept in their own drawers. Rail tonnage, steel output, fishery catches, harbour calls, school places and clinic visits appear side by side for the first time, measured the same way. Some figures flatter the republic. Others show that the empty districts are still largely empty, whatever the settlers and leaseholders were promised.\n\nThe ledger settles arguments that have run for years. It shows which mills earned their credit and which did not, how much freight the line really carries and how many ships the convoy pool actually controls. It also shows that every ministry has been counting slightly differently, and that some returns were optimistic in ways that can no longer be hidden.\n\nThe government must decide what to do with the uncomfortable pages. Publishing the whole ledger would expose ministries and contractors who padded their returns. Publishing only national totals would protect reputations and leave the arguments open. The next programme will be built on whichever version the republic chooses to believe, and the statisticians have already said which one they would sign.\n\nProvisional gameplay."
 ac_wd_klg.11.a:0 "Publish the whole ledger."
 ac_wd_klg_11_a:0 "Publish the whole ledger."
 ac_wd_klg.11.b:0 "Publish the totals only."
 KLG_wd_chamber_cabinet_office:0 "Cabinet of the Kalugan Chamber"
 KLG_wd_chamber_cabinet_office_desc:0 "A cabinet chosen by the largest bloc in a newly elected single chamber, governing collectively and defending every budget on the floor of the house. Provisional gameplay office with no named holder."
 KLG_wd_elected_presidency_office:0 "Office of the Elected President"
 KLG_wd_elected_presidency_office_desc:0 "A president chosen by direct national vote for a fixed term, heading a small cabinet office, with a chamber that passes and amends the budget. Provisional gameplay office with no named holder."
 KLG_wd_admin_council_office:0 "Standing Council of Administrators"
 KLG_wd_admin_council_office_desc:0 "A council of senior administrators with fixed terms and published quarterly targets, governing while the election calendar stays suspended. Provisional gameplay office with no named holder."
 ac_wd_klg_decisions:0 "Kaluga: National Measures"
 ac_wd_klg_decisions_desc:0 "Measures from the national programme of Kaluga. Provisional gameplay unless a source ledger row says otherwise."
 KLG_wd_winter_track_season_decision:0 "A Winter Track Season on the Plains"
 KLG_wd_winter_track_season_decision_desc:0 "Keep the track gangs on the plains section through one winter; adds a road level in the plains district once."
 KLG_wd_steel_price_floor_decision:0 "Set a Floor Under Steel Prices"
 KLG_wd_steel_price_floor_decision_desc:0 "Guarantee the mills a minimum price for six months when export prices fall; it can be renewed each year."
 KLG_wd_coast_command_drill_decision:0 "Call a Coast Command Night Drill"
 KLG_wd_coast_command_drill_decision_desc:0 "Run warships, fighters and lifeboats through a night drill on the harbour approaches; it can be repeated each year."
 KLG_wd_frontier_market_days_decision:0 "Open Frontier Market Days"
 KLG_wd_frontier_market_days_decision_desc:0 "Open the customs halls for a season of market days at reduced duties; it can be repeated each year."
 KLG_wd_town_shelter_drill_decision:0 "A Shelter Drill in Every Town"
 KLG_wd_town_shelter_drill_decision_desc:0 "Rehearse the asteroid warning and shelter routine in every district; it can be repeated within the year."
 KLG_wd_post_the_roll_decision:0 "Post the Roll in Every Town Hall"
 KLG_wd_post_the_roll_decision_desc:0 "Display the new electoral roll in every town hall for public correction; a one-time act of trust."
