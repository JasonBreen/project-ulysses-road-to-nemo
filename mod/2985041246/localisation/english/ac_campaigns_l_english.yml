 ac_camp.31.t:0 "The families on the technical brief"
 ac_camp.31.desc:0 "The engineer asked for another chair before he asked to see the diagram. The intelligence officer had prepared for questions about the battery's targeting system. He had not prepared for a child to fall asleep against the chair's back while the adults worked.\n\nThe family had brought very little. Everything that could identify a route or a person had become a decision on the way out. Now a receiving clerk was asking them to supply the information again, in a different order, because the allied forms had different boxes.\n\nThe liaison stopped the interview long enough to obtain food. The engineer kept explaining through the interruption. He pointed to a part of the diagram and described what the people maintaining it had actually done. For the first time, the targeting officer could attach an ordinary working routine to a system that had dominated the air campaign.\n\nOutside, an aircraft was being prepared for another duty. Its crew had been told that the operation would matter. The engineer heard the engine and lost his place. His wife put a hand beside the paper, waited, and moved the child's chair away from the open door.\n\nThe technical return would help make a strike possible. The families remained in the receiving account, where their protection could not be reduced to a footnote beneath the intelligence they had brought.\n\nWhen the interview ended, the engineer asked whether the diagram could stay behind. The officer said that it could. The man stood up and, for the first time since arriving, took his hands away from it."
 ac_camp.31.a:0 "Keep this account."
 ac_camp.31.z:0 "Close this old message."
