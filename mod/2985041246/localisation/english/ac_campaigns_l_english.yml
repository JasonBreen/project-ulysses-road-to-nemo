 FCU_camp_2_register:0 "The way back"
 FCU_camp_2_register_desc:0 "The way back. Open the campaign lane and its preparation record.\n\nThe engineers arrive carrying bags that look too small for the importance attached to them. Their families do not appear on the technical diagram. Protecting both is part of the operation, and so is deciding how much to risk for information that the command has not yet confirmed. A continental foothold needs land actually controlled. The battery strike needs the preparations that make it possible. The focus branch authorizes these operations in sequence, leaving failure visible and the next commander obliged to deal with it."
