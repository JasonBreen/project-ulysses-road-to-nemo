 ac_lcw_civil_war:0 "Civil War in Leasath"
 ac_lcw_civil_war_desc:0 "The ACES Chronicle records that the Leasath Civil War ended in 2019 after ten years of fighting (2019 / XX.XX); this campaign starts it in 2009, a date derived from that sentence. The values, the sides and the authority measure are provisional gameplay. No tag or border changes."
 ac_lcw_war_over:0 "After the Civil War"
 ac_lcw_war_over_desc:0 "The civil war is over. The country recovers for a year; the value is provisional gameplay."
 ac_lcw.1.t:0 "Civil War in Leasath"
 ac_lcw.1.d:0 "Leasath is at war with itself. The ACES Chronicle records that the Leasath Civil War ended in 2019 after ten years of fighting (2019 / XX.XX); this campaign begins it in 2009, a date derived from that sentence.\n\nThe record does not say who fought or why. The factions, the authority measure and the government's choices are this campaign's own provisional account; no tag, border or leader changes."
 ac_lcw.1.a:0 "A long war begins."
 ac_lcw.2.t:0 "The Leasath Civil War Ends"
 ac_lcw.2.d:0 "Leasath's civil war has ended after ten years of fighting, as the ACES Chronicle records for 2019 (2019 / XX.XX). The record gives neither the day nor the victor, and this campaign names none.\n\nThe government ended the war on its own authority, measured in this campaign's provisional terms."
 ac_lcw.2.a:0 "Begin the recovery."
 ac_lcw.3.t:0 "Leasath's War Goes On"
 ac_lcw.3.d:0 "2019 has ended, and Leasath's civil war has not. The ACES Chronicle records its end in 2019 (2019 / XX.XX); in this history the government's authority did not reach far enough.\n\nThe war will end when the government's authority is restored or a settlement is earned. This is a provisional alternative to the official record."
 ac_lcw.3.a:0 "The war goes on."
 ac_lcw.4.t:0 "The Leasath Civil War Ends at Last"
 ac_lcw.4.d:0 "Leasath's civil war has ended, later than the ACES Chronicle records (2019 / XX.XX). The government's authority has finally reached across the country.\n\nThis provisional alternative ends the war on its own terms; the record's date is a reference anchor."
 ac_lcw.4.a:0 "Begin the recovery."
 ac_lcw.5.t:0 "A Negotiated Peace in Leasath"
 ac_lcw.5.d:0 "Leasath's government and its opponents have agreed a settlement. The talks the government chose, and the rounds it funded, ended the war on terms every side signed.\n\nThe ACES Chronicle records the war's end in 2019 (2019 / XX.XX) without saying how. This earned settlement is provisional gameplay."
 ac_lcw.5.a:0 "Sign the settlement."
 ac_lcw.6.t:0 "Leasath's Civil War Interrupted"
 ac_lcw.6.d:0 "Leasath has fallen to a foreign power while its civil war was still being fought. The civil-war owner closes; the record's 2019 end will not be reported.\n\nNothing about the factions is decided by this record."
 ac_lcw.6.a:0 "Record the interruption."
