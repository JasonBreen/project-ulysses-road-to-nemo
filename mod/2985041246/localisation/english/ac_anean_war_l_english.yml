 EMM_ew_evacuation_policy_a_spirit:0 "Evacuation by district"
 EMM_ew_evacuation_policy_a_spirit_desc:0 "Each district will have a named route, a reception town and a date by which its registers are checked. The plan moves people early and in order; it costs the districts their workers whenever the plan is exercised."
 EMM_ew_evacuation_policy_a_spirit_settled:0 "Evacuation by district: Standing Settlement"
 EMM_ew_evacuation_policy_a_spirit_settled_desc:0 "The settlement fixes the republic's plan for moving or sheltering its people. It does not predict an invasion. It leaves a government that knows how many people it would have to move, and how. The continuing opportunity cost remains."
 EMM_ew_evacuation_policy_b_spirit:0 "Shelter in place"
 EMM_ew_evacuation_policy_b_spirit_desc:0 "Most citizens will stay where they are, in shelters refitted for long stays, while only the most exposed districts move. The plan keeps the economy running and the roads clear; it asks people to trust the shelters with their lives."
 EMM_ew_evacuation_policy_b_spirit_settled:0 "Shelter in place: Standing Settlement"
 EMM_ew_evacuation_policy_b_spirit_settled_desc:0 "The settlement fixes the republic's plan for moving or sheltering its people. It does not predict an invasion. It leaves a government that knows how many people it would have to move, and how. The continuing opportunity cost remains."
 EMM_ew_evacuation_register:0 "Open the Evacuation Registers"
 EMM_ew_evacuation_register_desc:0 "Sixteen years after Ulysses the republic has rebuilt its cities faster than its plans for leaving them. The interior ministry will reopen the evacuation registers drawn up in the recovery years and test whether they still describe the people who live in each district."
 EMM_ew_evacuation_policy_a:0 "Evacuate by District"
 EMM_ew_evacuation_policy_a_desc:0 "Each district will have a named route, a reception town and a date by which its registers are checked. The plan moves people early and in order; it costs the districts their workers whenever the plan is exercised."
 EMM_ew_evacuation_policy_b:0 "Shelter in Place"
 EMM_ew_evacuation_policy_b_desc:0 "Most citizens will stay where they are, in shelters refitted for long stays, while only the most exposed districts move. The plan keeps the economy running and the roads clear; it asks people to trust the shelters with their lives."
 EMM_ew_evacuation_operations:0 "Run the Western Rail Corridor"
 EMM_ew_evacuation_operations_desc:0 "A rail corridor to the western provinces will be kept ready: rolling stock held in reserve, timetables rehearsed and stations staffed. The corridor is the republic's way out if the capital ever has to be left in a hurry."
 EMM_ew_evacuation_review:0 "Review an Evacuation Service Period"
 EMM_ew_evacuation_review_desc:0 "A completed, funded service period under the chosen plan must be reviewed before the registers become doctrine. The review compares the people the registers list with the people the exercises actually reached."
 EMM_ew_evacuation_settlement:0 "A Population Accounted For"
 EMM_ew_evacuation_settlement_desc:0 "The settlement fixes the republic's plan for moving or sheltering its people. It does not predict an invasion. It leaves a government that knows how many people it would have to move, and how."
 EMM_ew_administration_policy_a_spirit:0 "Government in exile abroad"
 EMM_ew_administration_policy_a_spirit_desc:0 "The cabinet will govern from a friendly capital abroad, safe from attack and close to the republic's creditors. It keeps the state's accounts and treaties intact; it governs a country it cannot see."
 EMM_ew_administration_policy_a_spirit_settled:0 "Government in exile abroad: Standing Settlement"
 EMM_ew_administration_policy_a_spirit_settled_desc:0 "The settlement records how the republic governed while its capital was occupied. It names no date of return. It leaves a state whose citizens could find its offices, and whose offices paid them. The continuing opportunity cost remains."
 EMM_ew_administration_policy_b_spirit:0 "Government in the western provinces"
 EMM_ew_administration_policy_b_spirit_desc:0 "The cabinet will govern from the western provinces, within reach of the front and of the people still under its authority. It keeps the government visible; it also keeps it within range of the enemy."
 EMM_ew_administration_policy_b_spirit_settled:0 "Government in the western provinces: Standing Settlement"
 EMM_ew_administration_policy_b_spirit_settled_desc:0 "The settlement records how the republic governed while its capital was occupied. It names no date of return. It leaves a state whose citizens could find its offices, and whose offices paid them. The continuing opportunity cost remains."
 EMM_ew_administration_register:0 "Govern From the West"
 EMM_ew_administration_register_desc:0 "The ACES Chronicle records that Estovakian forces seized Gracemeria and that Emmerian forces retreated to western Anea (2015 / 08.30). The republic's government must decide where it governs from, and how it proves to its own people that it still does."
 EMM_ew_administration_policy_a:0 "A Government in Exile Abroad"
 EMM_ew_administration_policy_a_desc:0 "The cabinet will govern from a friendly capital abroad, safe from attack and close to the republic's creditors. It keeps the state's accounts and treaties intact; it governs a country it cannot see."
 EMM_ew_administration_policy_b:0 "A Government in the Western Provinces"
 EMM_ew_administration_policy_b_desc:0 "The cabinet will govern from the western provinces, within reach of the front and of the people still under its authority. It keeps the government visible; it also keeps it within range of the enemy."
 EMM_ew_administration_operations:0 "Keep the Ministries Paid"
 EMM_ew_administration_operations_desc:0 "Civil servants, pensions and the ministries' own staff will be paid on time, wherever they are. A government that pays its people is a government; one that does not is a memory."
 EMM_ew_administration_review:0 "Review a Western Administration Period"
 EMM_ew_administration_review_desc:0 "A completed, funded service period of western administration must be reviewed before the arrangement becomes the republic's constitution in wartime. The review counts what the ministries delivered and to whom."
 EMM_ew_administration_settlement:0 "The Republic Still Governs"
 EMM_ew_administration_settlement_desc:0 "The settlement records how the republic governed while its capital was occupied. It names no date of return. It leaves a state whose citizens could find its offices, and whose offices paid them."
 EMM_ew_reserve_policy_a_spirit:0 "Reserve of volunteers"
 EMM_ew_reserve_policy_a_spirit_desc:0 "The reserve will take volunteers only, trained in short courses and sent forward when ready. Volunteers fight willingly and learn quickly; there may not be enough of them."
 EMM_ew_reserve_policy_a_spirit_settled:0 "Reserve of volunteers: Standing Settlement"
 EMM_ew_reserve_policy_a_spirit_settled_desc:0 "The settlement fixes how the republic raised its reserve and what it cost the western provinces. It leaves an army that knows where its soldiers came from, and a province that knows what it gave. The continuing opportunity cost remains."
 EMM_ew_reserve_policy_b_spirit:0 "Reserve by call-up"
 EMM_ew_reserve_policy_b_spirit_desc:0 "The reserve will call up every eligible citizen in the western provinces by age group. The call-up fills the ranks; it empties the farms and workshops the provinces depend on."
 EMM_ew_reserve_policy_b_spirit_settled:0 "Reserve by call-up: Standing Settlement"
 EMM_ew_reserve_policy_b_spirit_settled_desc:0 "The settlement fixes how the republic raised its reserve and what it cost the western provinces. It leaves an army that knows where its soldiers came from, and a province that knows what it gave. The continuing opportunity cost remains."
 EMM_ew_reserve_register:0 "Form the Western Reserve"
 EMM_ew_reserve_register_desc:0 "The forces that withdrew to western Anea need men and women to replace those lost in the capital. The ministry of defence will form a reserve in the western provinces and decide how to fill it."
 EMM_ew_reserve_policy_a:0 "A Reserve of Volunteers"
 EMM_ew_reserve_policy_a_desc:0 "The reserve will take volunteers only, trained in short courses and sent forward when ready. Volunteers fight willingly and learn quickly; there may not be enough of them."
 EMM_ew_reserve_policy_b:0 "A Reserve by Call-Up"
 EMM_ew_reserve_policy_b_desc:0 "The reserve will call up every eligible citizen in the western provinces by age group. The call-up fills the ranks; it empties the farms and workshops the provinces depend on."
 EMM_ew_reserve_operations:0 "Train at the Western Bases"
 EMM_ew_reserve_operations_desc:0 "Recruits will train at the western bases under instructors withdrawn from the front for the purpose. Training costs the front experienced officers now so that it has trained soldiers later."
 EMM_ew_reserve_review:0 "Review a Reserve Service Period"
 EMM_ew_reserve_review_desc:0 "A completed, funded service period of reserve training must be reviewed before the reserve becomes the republic's standing practice. The review counts the soldiers trained, the instructors spent and the units sent forward."
 EMM_ew_reserve_settlement:0 "A Reserve That Answered"
 EMM_ew_reserve_settlement_desc:0 "The settlement fixes how the republic raised its reserve and what it cost the western provinces. It leaves an army that knows where its soldiers came from, and a province that knows what it gave."
 EMM_ew_airforce_policy_a_spirit:0 "Fighters first"
 EMM_ew_airforce_policy_a_spirit_desc:0 "Every available resource will go to keeping fighters in the air: airframes, pilots and ammunition first, everything else later. The air force fights now; it may have nowhere to land next month."
 EMM_ew_airforce_policy_a_spirit_settled:0 "Fighters first: Standing Settlement"
 EMM_ew_airforce_policy_a_spirit_settled_desc:0 "The settlement records the air force the republic rebuilt after the fall of its capital. It names no pilot and claims no victory. It leaves an air staff that knows what it has. The continuing opportunity cost remains."
 EMM_ew_airforce_policy_b_spirit:0 "Bases first"
 EMM_ew_airforce_policy_b_spirit_desc:0 "The air force will first repair and defend its western bases, then fill them with aircraft. The rebuilding is slower; the aircraft it produces will have somewhere to come home to."
 EMM_ew_airforce_policy_b_spirit_settled:0 "Bases first: Standing Settlement"
 EMM_ew_airforce_policy_b_spirit_settled_desc:0 "The settlement records the air force the republic rebuilt after the fall of its capital. It names no pilot and claims no victory. It leaves an air staff that knows what it has. The continuing opportunity cost remains."
 EMM_ew_airforce_register:0 "Reconstitute the Air Force"
 EMM_ew_airforce_register_desc:0 "The Chronicle records that base and carrier air squadrons could not counter the Aigaion over Gracemeria (2015 / 08.30). The air force that survived is scattered across western airfields, short of aircraft, crews and spares. The air staff will decide how to rebuild it."
 EMM_ew_airforce_policy_a:0 "Fighters First"
 EMM_ew_airforce_policy_a_desc:0 "Every available resource will go to keeping fighters in the air: airframes, pilots and ammunition first, everything else later. The air force fights now; it may have nowhere to land next month."
 EMM_ew_airforce_policy_b:0 "Bases First"
 EMM_ew_airforce_policy_b_desc:0 "The air force will first repair and defend its western bases, then fill them with aircraft. The rebuilding is slower; the aircraft it produces will have somewhere to come home to."
 EMM_ew_airforce_operations:0 "Recover the Scattered Squadrons"
 EMM_ew_airforce_operations_desc:0 "Squadrons scattered by the retreat will be found, counted and reorganised under one command. Some exist only as a handful of aircraft and a commander's notes."
 EMM_ew_airforce_review:0 "Review a Reconstitution Period"
 EMM_ew_airforce_review_desc:0 "A completed, funded service period of reconstitution must be reviewed before the new structure becomes the air force's order of battle. The review counts aircraft, crews and bases available on the last day."
 EMM_ew_airforce_settlement:0 "An Air Force Rebuilt"
 EMM_ew_airforce_settlement_desc:0 "The settlement records the air force the republic rebuilt after the fall of its capital. It names no pilot and claims no victory. It leaves an air staff that knows what it has."
 EMM_ew_liberation_policy_a_spirit:0 "Return with terms"
 EMM_ew_liberation_policy_a_spirit_desc:0 "The republic will offer Estovakia terms for the end of the war as soon as the capital is free: a ceasefire, prisoner exchanges and an accounting of the occupation. Terms end the fighting sooner; they also leave questions open."
 EMM_ew_liberation_policy_a_spirit_settled:0 "Return with terms: Standing Settlement"
 EMM_ew_liberation_policy_a_spirit_settled_desc:0 "The settlement records the republic's return to its capital and the terms it offered or withheld. It leaves a government back in Gracemeria, with a ledger of what the occupation cost. The continuing opportunity cost remains."
 EMM_ew_liberation_policy_b_spirit:0 "Return without terms"
 EMM_ew_liberation_policy_b_spirit_desc:0 "The republic will return to its capital without offering terms and fight until Estovakia stops. The government keeps every claim intact; the war lasts as long as Estovakia can fight."
 EMM_ew_liberation_policy_b_spirit_settled:0 "Return without terms: Standing Settlement"
 EMM_ew_liberation_policy_b_spirit_settled_desc:0 "The settlement records the republic's return to its capital and the terms it offered or withheld. It leaves a government back in Gracemeria, with a ledger of what the occupation cost. The continuing opportunity cost remains."
 EMM_ew_liberation_register:0 "Plan the Return to Gracemeria"
 EMM_ew_liberation_register_desc:0 "The Chronicle records that Emmerian forces liberated Gracemeria and that cruise missiles fired at the city that night were shot down by patrolling fighters (2016 / 03.31). Whatever the war brings, the government must plan for its return to the capital."
 EMM_ew_liberation_policy_a:0 "Return With Terms"
 EMM_ew_liberation_policy_a_desc:0 "The republic will offer Estovakia terms for the end of the war as soon as the capital is free: a ceasefire, prisoner exchanges and an accounting of the occupation. Terms end the fighting sooner; they also leave questions open."
 EMM_ew_liberation_policy_b:0 "Return Without Terms"
 EMM_ew_liberation_policy_b_desc:0 "The republic will return to its capital without offering terms and fight until Estovakia stops. The government keeps every claim intact; the war lasts as long as Estovakia can fight."
 EMM_ew_liberation_operations:0 "Restore the Capital's Services"
 EMM_ew_liberation_operations_desc:0 "Water, power, hospitals and schools in the capital will be restored in a published order, with the occupied districts first. A capital is liberated when its people can live in it again."
 EMM_ew_liberation_review:0 "Review a Recovery Service Period"
 EMM_ew_liberation_review_desc:0 "A completed, funded service period of recovery must be reviewed before the capital's restoration is declared complete. The review lists the services restored and the districts still waiting."
 EMM_ew_liberation_settlement:0 "A Capital Restored"
 EMM_ew_liberation_settlement_desc:0 "The settlement records the republic's return to its capital and the terms it offered or withheld. It leaves a government back in Gracemeria, with a ledger of what the occupation cost."
 EMM_ew_peace_policy_a_spirit:0 "Joint border commission"
 EMM_ew_peace_policy_a_spirit_desc:0 "A joint commission with Estovakia will meet every quarter on border incidents, refugees and trade. The commission gives both governments a place to complain before they act; it gives the republic's hawks a target."
 EMM_ew_peace_policy_a_spirit_settled:0 "Joint border commission: Standing Settlement"
 EMM_ew_peace_policy_a_spirit_settled_desc:0 "The settlement records a peace this history kept and the official record did not. It claims no reward for it. It leaves two neighbours that know how to talk before they fight. The continuing opportunity cost remains."
 EMM_ew_peace_policy_b_spirit:0 "Watchful border"
 EMM_ew_peace_policy_b_spirit_desc:0 "The republic will keep its border watched and its forces ready, without provoking its neighbour. Readiness reassures the public; it also tells Estovakia what Emmeria expects of it."
 EMM_ew_peace_policy_b_spirit_settled:0 "Watchful border: Standing Settlement"
 EMM_ew_peace_policy_b_spirit_settled_desc:0 "The settlement records a peace this history kept and the official record did not. It claims no reward for it. It leaves two neighbours that know how to talk before they fight. The continuing opportunity cost remains."
 EMM_ew_peace_register:0 "Record the Peace That Held"
 EMM_ew_peace_register_desc:0 "The war the ACES Chronicle records for 2015 did not come in this history: Estovakia withheld its declaration, or its government took another road after the civil war. The republic will decide how to keep a peace it did not have to win."
 EMM_ew_peace_policy_a:0 "A Joint Commission"
 EMM_ew_peace_policy_a_desc:0 "A joint commission with Estovakia will meet every quarter on border incidents, refugees and trade. The commission gives both governments a place to complain before they act; it gives the republic's hawks a target."
 EMM_ew_peace_policy_b:0 "A Watchful Border"
 EMM_ew_peace_policy_b_desc:0 "The republic will keep its border watched and its forces ready, without provoking its neighbour. Readiness reassures the public; it also tells Estovakia what Emmeria expects of it."
 EMM_ew_peace_operations:0 "Open the Border Crossings"
 EMM_ew_peace_operations_desc:0 "Crossings closed during the civil war will reopen on a published schedule, with customs and health checks staffed from both sides. Open crossings make the peace visible to the people who live near the border."
 EMM_ew_peace_review:0 "Review a Peace Service Period"
 EMM_ew_peace_review_desc:0 "A completed, funded service period under the chosen policy must be reviewed before it becomes the republic's settled practice. The review counts incidents, crossings and the commission's answers."
 EMM_ew_peace_settlement:0 "A Peace That Held"
 EMM_ew_peace_settlement_desc:0 "The settlement records a peace this history kept and the official record did not. It claims no reward for it. It leaves two neighbours that know how to talk before they fight."
 EVA_ew_government_policy_a_spirit:0 "Rule by the general staff"
 EVA_ew_government_policy_a_spirit_desc:0 "The general staff will govern for the duration: decrees instead of laws, commanders instead of ministers. Decisions are fast; nobody outside the staff knows why they were taken."
 EVA_ew_government_policy_a_spirit_settled:0 "Rule by the general staff: Standing Settlement"
 EVA_ew_government_policy_a_spirit_settled_desc:0 "The settlement records who governed Estovakia's war and how. It does not decide the war. It leaves a record that someone, later, will read. The continuing opportunity cost remains."
 EVA_ew_government_policy_b_spirit:0 "Rule by the cabinet"
 EVA_ew_government_policy_b_spirit_desc:0 "The cabinet will keep governing, with the general staff answering to it. Civil government is slower and argues more; it keeps a record of who decided what."
 EVA_ew_government_policy_b_spirit_settled:0 "Rule by the cabinet: Standing Settlement"
 EVA_ew_government_policy_b_spirit_settled_desc:0 "The settlement records who governed Estovakia's war and how. It does not decide the war. It leaves a record that someone, later, will read. The continuing opportunity cost remains."
 EVA_ew_government_register:0 "Form the War Government"
 EVA_ew_government_register_desc:0 "The war the Chronicle records began with Estovakia's invasion of Gracemeria (2015 / 08.30). The federation that fought it had just ended a civil war. Its leaders must decide who governs a country at war: the officers who won the last one, or the civilians who must pay for this one."
 EVA_ew_government_policy_a:0 "Rule by the General Staff"
 EVA_ew_government_policy_a_desc:0 "The general staff will govern for the duration: decrees instead of laws, commanders instead of ministers. Decisions are fast; nobody outside the staff knows why they were taken."
 EVA_ew_government_policy_b:0 "Rule by the Cabinet"
 EVA_ew_government_policy_b_desc:0 "The cabinet will keep governing, with the general staff answering to it. Civil government is slower and argues more; it keeps a record of who decided what."
 EVA_ew_government_operations:0 "Answer to the Assembly"
 EVA_ew_government_operations_desc:0 "The war's conduct will be reported to the assembly each month, with the casualties, costs and occupied territory listed. Reporting costs the government secrecy; it gives the country a reason to believe what it is told."
 EVA_ew_government_review:0 "Review a War Government Period"
 EVA_ew_government_review_desc:0 "A completed, funded service period under the chosen arrangement must be reviewed before it becomes the federation's wartime constitution. The review asks who decided, how quickly and on whose authority."
 EVA_ew_government_settlement:0 "Who Governed the War"
 EVA_ew_government_settlement_desc:0 "The settlement records who governed Estovakia's war and how. It does not decide the war. It leaves a record that someone, later, will read."
 EVA_ew_logistics_policy_a_spirit:0 "Central depots"
 EVA_ew_logistics_policy_a_spirit_desc:0 "Maintenance will be concentrated in a few large depots with the best tools and engineers. Central depots repair faster and cost less; one raid can close them."
 EVA_ew_logistics_policy_a_spirit_settled:0 "Central depots: Standing Settlement"
 EVA_ew_logistics_policy_a_spirit_settled_desc:0 "The settlement fixes the federation's maintenance base. The Super Weapons record describes an Aerial Fleet built around a heavy command cruiser; whatever the federation builds, this is how it keeps it in the air. The continuing opportunity cost remains."
 EVA_ew_logistics_policy_b_spirit:0 "Dispersed workshops"
 EVA_ew_logistics_policy_b_spirit_desc:0 "Maintenance will be dispersed among many small workshops near the airfields. Dispersal survives attack; it needs more engineers than the federation has trained."
 EVA_ew_logistics_policy_b_spirit_settled:0 "Dispersed workshops: Standing Settlement"
 EVA_ew_logistics_policy_b_spirit_settled_desc:0 "The settlement fixes the federation's maintenance base. The Super Weapons record describes an Aerial Fleet built around a heavy command cruiser; whatever the federation builds, this is how it keeps it in the air. The continuing opportunity cost remains."
 EVA_ew_logistics_register:0 "Rebuild the Maintenance Base"
 EVA_ew_logistics_register_desc:0 "The civil war left Estovakia's aircraft industry in the hands of the faction that won it, and the federation's new aircraft need ground crews, depots and spares it does not yet have. The ministry of defence will rebuild the maintenance base."
 EVA_ew_logistics_policy_a:0 "Central Depots"
 EVA_ew_logistics_policy_a_desc:0 "Maintenance will be concentrated in a few large depots with the best tools and engineers. Central depots repair faster and cost less; one raid can close them."
 EVA_ew_logistics_policy_b:0 "Dispersed Workshops"
 EVA_ew_logistics_policy_b_desc:0 "Maintenance will be dispersed among many small workshops near the airfields. Dispersal survives attack; it needs more engineers than the federation has trained."
 EVA_ew_logistics_operations:0 "Train the Ground Crews"
 EVA_ew_logistics_operations_desc:0 "Ground crews will be trained in a standard course, with the engineers who built the aircraft teaching the people who will keep them flying. The course is long and the instructors are few."
 EVA_ew_logistics_review:0 "Review a Maintenance Service Period"
 EVA_ew_logistics_review_desc:0 "A completed, funded service period under the chosen arrangement must be reviewed before it becomes the air force's standing practice. The review counts aircraft serviceable on the last day."
 EVA_ew_logistics_settlement:0 "A Fleet That Can Fly"
 EVA_ew_logistics_settlement_desc:0 "The settlement fixes the federation's maintenance base. The Super Weapons record describes an Aerial Fleet built around a heavy command cruiser; whatever the federation builds, this is how it keeps it in the air."
 EVA_ew_chandelier_policy_a_spirit:0 "Finished for its first purpose"
 EVA_ew_chandelier_policy_a_spirit_desc:0 "The railgun will be finished for the purpose it was designed for: tracking and destroying the fragments still in orbit. The programme keeps its civilian justification; it does not promise the generals a weapon."
 EVA_ew_chandelier_policy_a_spirit_settled:0 "Finished for its first purpose: Standing Settlement"
 EVA_ew_chandelier_policy_a_spirit_settled_desc:0 "The settlement fixes the Chandelier's purpose and its firing rules. It fires no shot. The Super Weapons record says the railgun was used against an Emmerian-controlled city and later destroyed; this campaign records nothing of the kind by script. The continuing opportunity cost remains."
 EVA_ew_chandelier_policy_b_spirit:0 "Finished as a weapon"
 EVA_ew_chandelier_policy_b_spirit_desc:0 "The railgun will be finished as a weapon, with targets on the ground. The programme gains the general staff's support and budget; it becomes a target itself."
 EVA_ew_chandelier_policy_b_spirit_settled:0 "Finished as a weapon: Standing Settlement"
 EVA_ew_chandelier_policy_b_spirit_settled_desc:0 "The settlement fixes the Chandelier's purpose and its firing rules. It fires no shot. The Super Weapons record says the railgun was used against an Emmerian-controlled city and later destroyed; this campaign records nothing of the kind by script. The continuing opportunity cost remains."
 EVA_ew_chandelier_register:0 "Reopen the Chandelier Files"
 EVA_ew_chandelier_register_desc:0 "The Super Weapons record says the Chandelier railgun was built to destroy fragments of Ulysses, was unfinished when the asteroid arrived, and was later weaponised. The research team the civil war years kept together is still waiting to know what the federation wants of it."
 EVA_ew_chandelier_policy_a:0 "Finish It for Its First Purpose"
 EVA_ew_chandelier_policy_a_desc:0 "The railgun will be finished for the purpose it was designed for: tracking and destroying the fragments still in orbit. The programme keeps its civilian justification; it does not promise the generals a weapon."
 EVA_ew_chandelier_policy_b:0 "Finish It as a Weapon"
 EVA_ew_chandelier_policy_b_desc:0 "The railgun will be finished as a weapon, with targets on the ground. The programme gains the general staff's support and budget; it becomes a target itself."
 EVA_ew_chandelier_operations:0 "Set the Firing Rules"
 EVA_ew_chandelier_operations_desc:0 "Rules for firing the Chandelier will be written before it can fire: who may order a shot, at what, and what record the order leaves. A weapon that can reach a city needs rules written while it is still incomplete."
 EVA_ew_chandelier_review:0 "Review a Chandelier Service Period"
 EVA_ew_chandelier_review_desc:0 "A completed, funded service period under the chosen purpose must be reviewed before the railgun is accepted. The review compares the firing rules with the targets the general staff has proposed."
 EVA_ew_chandelier_settlement:0 "Rules Before the First Shot"
 EVA_ew_chandelier_settlement_desc:0 "The settlement fixes the Chandelier's purpose and its firing rules. It fires no shot. The Super Weapons record says the railgun was used against an Emmerian-controlled city and later destroyed; this campaign records nothing of the kind by script."
 EVA_ew_occupation_policy_a_spirit:0 "Humanitarian administration"
 EVA_ew_occupation_policy_a_spirit_desc:0 "The occupied districts will be governed by civil administrators under the laws of war: food first, schools open, local officials kept where they will serve. The administration costs money and soldiers' patience; it gives the federation fewer enemies behind its lines."
 EVA_ew_occupation_policy_a_spirit_settled:0 "Humanitarian administration: Standing Settlement"
 EVA_ew_occupation_policy_a_spirit_settled_desc:0 "The settlement puts the occupation on record. It does not decide whether the districts are kept. The Chronicle records that the capital was liberated; whoever reads this record afterwards will know how it was governed. The continuing opportunity cost remains."
 EVA_ew_occupation_policy_b_spirit:0 "Martial administration"
 EVA_ew_occupation_policy_b_spirit_desc:0 "The occupied districts will be governed by the army: curfews, requisitions and arrests at the commanders' discretion. Martial rule secures the lines; it makes enemies of everyone it governs."
 EVA_ew_occupation_policy_b_spirit_settled:0 "Martial administration: Standing Settlement"
 EVA_ew_occupation_policy_b_spirit_settled_desc:0 "The settlement puts the occupation on record. It does not decide whether the districts are kept. The Chronicle records that the capital was liberated; whoever reads this record afterwards will know how it was governed. The continuing opportunity cost remains."
 EVA_ew_occupation_register:0 "Administer the Occupied Districts"
 EVA_ew_occupation_register_desc:0 "Estovakian forces hold Emmerian districts in this history, as the Chronicle records they held Gracemeria (2015 / 08.30). The federation must decide how it governs people who did not choose it, and what record it keeps of doing so."
 EVA_ew_occupation_policy_a:0 "A Humanitarian Administration"
 EVA_ew_occupation_policy_a_desc:0 "The occupied districts will be governed by civil administrators under the laws of war: food first, schools open, local officials kept where they will serve. The administration costs money and soldiers' patience; it gives the federation fewer enemies behind its lines."
 EVA_ew_occupation_policy_b:0 "A Martial Administration"
 EVA_ew_occupation_policy_b_desc:0 "The occupied districts will be governed by the army: curfews, requisitions and arrests at the commanders' discretion. Martial rule secures the lines; it makes enemies of everyone it governs."
 EVA_ew_occupation_operations:0 "Account for the Requisitions"
 EVA_ew_occupation_operations_desc:0 "Every requisition will be recorded with a receipt: what was taken, from whom and by which unit. A receipt is a promise that someone will be paid back."
 EVA_ew_occupation_review:0 "Review an Occupation Period"
 EVA_ew_occupation_review_desc:0 "A completed, funded service period under the chosen administration must be reviewed before it becomes the federation's policy. The review counts what was requisitioned, what was paid and what was not."
 EVA_ew_occupation_settlement:0 "An Occupation on Record"
 EVA_ew_occupation_settlement_desc:0 "The settlement puts the occupation on record. It does not decide whether the districts are kept. The Chronicle records that the capital was liberated; whoever reads this record afterwards will know how it was governed."
 EVA_ew_aftermath_policy_a_spirit:0 "Transitional government"
 EVA_ew_aftermath_policy_a_spirit_desc:0 "A transitional government of civilians and officers will govern until elections can be held, with a published timetable. The transition reassures the federation's neighbours; it gives the officers who won the civil war a reason to wait."
 EVA_ew_aftermath_policy_a_spirit_settled:0 "Transitional government: Standing Settlement"
 EVA_ew_aftermath_policy_a_spirit_settled_desc:0 "The settlement records the federation's government after the coup. It names no new leader and decides no election. It leaves a country that ended a war it started, and must now explain it. The continuing opportunity cost remains."
 EVA_ew_aftermath_policy_b_spirit:0 "Government of the officers"
 EVA_ew_aftermath_policy_b_spirit_desc:0 "The officers who led the coup will govern until order is restored, with no timetable. The officers keep the army together; the federation's neighbours wonder what they will do with it."
 EVA_ew_aftermath_policy_b_spirit_settled:0 "Government of the officers: Standing Settlement"
 EVA_ew_aftermath_policy_b_spirit_settled_desc:0 "The settlement records the federation's government after the coup. It names no new leader and decides no election. It leaves a country that ended a war it started, and must now explain it. The continuing opportunity cost remains."
 EVA_ew_aftermath_register:0 "Count the Cost of the Coup"
 EVA_ew_aftermath_register_desc:0 "The Chronicle records that Gustav Dvornik, one of the main architects of the invasion of Emmeria, died, and that an antigovernment coup in Estovakia left its forces unable to fight (2016 / 04.01). Whoever governs the federation now must decide what kind of government it will be."
 EVA_ew_aftermath_policy_a:0 "A Transitional Government"
 EVA_ew_aftermath_policy_a_desc:0 "A transitional government of civilians and officers will govern until elections can be held, with a published timetable. The transition reassures the federation's neighbours; it gives the officers who won the civil war a reason to wait."
 EVA_ew_aftermath_policy_b:0 "A Government of the Officers"
 EVA_ew_aftermath_policy_b_desc:0 "The officers who led the coup will govern until order is restored, with no timetable. The officers keep the army together; the federation's neighbours wonder what they will do with it."
 EVA_ew_aftermath_operations:0 "Bring the Soldiers Home"
 EVA_ew_aftermath_operations_desc:0 "Soldiers will be brought home from the front and the occupied districts on a published schedule, units with the longest service first. An army that comes home in order does not come home angry."
 EVA_ew_aftermath_review:0 "Review a Transition Period"
 EVA_ew_aftermath_review_desc:0 "A completed, funded service period of transition must be reviewed before the arrangement becomes the federation's constitution. The review asks whether the timetable held and whether the soldiers came home."
 EVA_ew_aftermath_settlement:0 "The Federation After the Coup"
 EVA_ew_aftermath_settlement_desc:0 "The settlement records the federation's government after the coup. It names no new leader and decides no election. It leaves a country that ended a war it started, and must now explain it."
 EVA_ew_republic_policy_a_spirit:0 "Federal reconciliation"
 EVA_ew_republic_policy_a_spirit_desc:0 "The provinces that fought each other in the civil war will share power under a federal settlement, with a council where each has a voice. Reconciliation is slow and argumentative; it gives every faction a reason to keep the peace."
 EVA_ew_republic_policy_a_spirit_settled:0 "Federal reconciliation: Standing Settlement"
 EVA_ew_republic_policy_a_spirit_settled_desc:0 "The settlement records a federation that, in this history, did not march on Gracemeria. It claims nothing the official record does not. It leaves a country rebuilding instead of fighting. The continuing opportunity cost remains."
 EVA_ew_republic_policy_b_spirit:0 "Centralised republic"
 EVA_ew_republic_policy_b_spirit_desc:0 "The capital will govern the provinces directly, with the civil war's victors in charge. Centralisation is efficient; it leaves the losers with nothing to lose."
 EVA_ew_republic_policy_b_spirit_settled:0 "Centralised republic: Standing Settlement"
 EVA_ew_republic_policy_b_spirit_settled_desc:0 "The settlement records a federation that, in this history, did not march on Gracemeria. It claims nothing the official record does not. It leaves a country rebuilding instead of fighting. The continuing opportunity cost remains."
 EVA_ew_republic_register:0 "Govern After the Civil War"
 EVA_ew_republic_register_desc:0 "In this history the federation did not invade Emmeria: its government withheld the declaration the Chronicle records for 2015 (2015 / 08.30), or the civil war ended in a settlement the official record does not describe. The country that remains must decide how to govern itself in peace."
 EVA_ew_republic_policy_a:0 "A Federal Reconciliation"
 EVA_ew_republic_policy_a_desc:0 "The provinces that fought each other in the civil war will share power under a federal settlement, with a council where each has a voice. Reconciliation is slow and argumentative; it gives every faction a reason to keep the peace."
 EVA_ew_republic_policy_b:0 "A Centralised Republic"
 EVA_ew_republic_policy_b_desc:0 "The capital will govern the provinces directly, with the civil war's victors in charge. Centralisation is efficient; it leaves the losers with nothing to lose."
 EVA_ew_republic_operations:0 "Rebuild the Provinces"
 EVA_ew_republic_operations_desc:0 "The provinces the civil war damaged most will be rebuilt first, on a published schedule. Rebuilding is the federation's first chance to show its people what peace pays."
 EVA_ew_republic_review:0 "Review a Reconstruction Period"
 EVA_ew_republic_review_desc:0 "A completed, funded service period under the chosen settlement must be reviewed before it becomes the federation's constitution. The review asks whether the provinces were rebuilt and whether the factions stayed at the table."
 EVA_ew_republic_settlement:0 "A Federation That Did Not March"
 EVA_ew_republic_settlement_desc:0 "The settlement records a federation that, in this history, did not march on Gracemeria. It claims nothing the official record does not. It leaves a country rebuilding instead of fighting."
 ac_eew_funded_cost:0 "£pol_power 35 / 4 cap"
 ac_eew_funded_cost_tooltip:0 "Authorization commits 35 political power and four institutional-capacity points, plus the programme fee shown in the category. Spent resources are not refunded when a period is interrupted."
 ac_eew_funded_cost_blocked:0 "£pol_power §R35§! / §R4§! cap"
 ac_eew_fee_macro:0 "Programme fee: 0.002 billion abstract fiscal units."
 ac_eew_fee_legacy:0 "Programme fee: 2 provisional fiscal units."
 ac_eew_fee_none:0 "No fiscal fee currently applies. Political and institutional costs remain."
