 ac_camp.3.t:0 "A message without a target"
 ac_camp.3.desc:0 "The intelligence officer had almost put the message in the wrong tray. It named a road, an expected movement, and an occupation checkpoint. Three useful things, if one ignored what the sender was actually asking.\n\nThe liaison read it a second time. A municipal clinic needed a transport arrangement. There was no request for weapons and no offer of a raid. Someone inside the occupied district wanted the allied command to know that a particular journey was supposed to remain a medical journey.\n\nAround the table, the morning briefing continued. A reconnaissance flight had returned with photographs of a depot. Another had not returned at all. The duty controller was arguing for a replacement aircraft that the operations staff had already promised elsewhere. The liaison waited until the argument paused long enough to become a question.\n\n\"If we acknowledge this, who hears the acknowledgment?\"\n\nNobody could answer completely. The local contact had protected the names he could protect. The enemy controlled the road. An allied assurance could help the driver at one checkpoint and make him a suspect at the next.\n\nThe officer moved the message away from the targeting folder. That was a decision of sorts, although nobody would write it up as one. A corridor existed first as a series of instructions that the people carrying weapons had agreed to remember. The command could protect the separation between relief and intelligence work. It could also keep the information available for military use and tell itself that no formal promise had been made.\n\nOutside the room, a clerk waited to collect the completed tasking sheets."
 ac_camp.3.a:0 "Protect and sponsor the receiving route."
 ac_camp.3.b:0 "Retain the message for operational use."
 ac_camp.3.z:0 "Close this old message."
