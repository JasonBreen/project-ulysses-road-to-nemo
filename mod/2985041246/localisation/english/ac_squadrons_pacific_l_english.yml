 ac_sqp_ose_cast_rhea_calder:0 "Rhea Calder"
 ac_sqp_ose_cast_rhea_calder_desc:0 "Pilot\n\n1991 personnel file. Rhea likes finishing an explanation before someone has finished asking for it. Her new posting brings her among people who notice the difference between understanding and anticipation. She wants to become the pilot they can trust with an uncertain instruction, and fears that admitting uncertainty will make them choose somebody else."
 ac_sqp_ose_cast_malik_renn:0 "Malik Renn"
 ac_sqp_ose_cast_malik_renn_desc:0 "Wingman\n\n1991 personnel file. Malik makes a difficult room easier to enter. His humor and willingness to cover another shift have earned him friends who sometimes forget he has a life beyond the station. He likes Rhea enough to compete with her honestly, although he is still learning how to tell her when generosity has begun to hurt."
 ac_sqp_ose_cast_june_carver:0 "June Carver"
 ac_sqp_ose_cast_june_carver_desc:0 "Crew chief\n\n1991 personnel file. June teaches a check by explaining what the next pair of hands needs to know. She is proud of being useful and uncomfortable when usefulness becomes a reason nobody else is allowed to learn. Her friendship with the younger crew will be tested by rest, privacy and the difficult business of letting someone help."
 ac_sqp_ose_cast_sana_ivers:0 "Sana Ivers"
 ac_sqp_ose_cast_sana_ivers_desc:0 "Controller\n\n1991 personnel file. Sana can hear when a confident voice has stopped listening. She keeps a weak second receiver beside the main set because a quiet request still comes from somebody. She wants the crew to share that attention without treating every unanswered sound as a promise they can fulfill."
 ac_sqp.701.t:0 "The Receiver Left On"
 ac_sqp.701.d_base:0 "Rain followed Rhea Calder through the hangar door. Someone had put her gloves on a chair to reserve it, although nobody admitted to knowing her size. Malik Renn offered her the kettle before introducing himself. June Carver was sorting tools by touch, looking up only when Sana Ivers turned a small receiver away from the wall. A thin voice escaped beneath the main set's confident conversation. 'That one never sounds important,' Malik said. Sana left her hand on the volume knob. Rhea had expected instructions, perhaps a test of what she knew. Instead four people waited to discover what she would let them hear together."
 ac_sqp.701.a:0 "Leave the second channel audible."
 ac_sqp.701.a.reply:0 "Sana moves the receiver between them; Malik warns that every quiet request will now interrupt their conversation."
 ac_sqp.701.b:0 "Let Sana listen and tell us privately."
 ac_sqp.701.b.reply:0 "Malik finds room for the kettle while Sana accepts another task whose uncertainty the others will not share."
 ac_sqp.702.t:0 "An Answer Too Early"
 ac_sqp.702.d_training_sortie:0 "The cloud closed beneath Rhea before Sana finished the instruction. She began the familiar turn, then heard Malik ask which word she had answered. The actual clearance was to hold. For a moment the other aircraft disappeared behind the rain; Rhea found it again farther out than she expected, a small steady shape that refused to make her decision for her. She levelled off and read the instruction back. Nobody had collided, and that made the shaking in her hands embarrassing when June helped her out afterward. Malik could rehearse the mistake with her privately. Sana needed to know whether the next crew would hear what had actually happened. Rhea had wanted to be the pilot who understood before being told twice. The unfinished sentence was still waiting for her."
 ac_sqp.702.d_base:0 "Rhea finished the instruction before Sana had finished reading it. At the rehearsal table that seemed an advantage, until Malik placed a finger on the word she had supplied herself. The actual message asked for a confirmation, not a turn. Nobody had left the room and nothing irreversible had happened. That made Rhea's hot embarrassment feel less defensible. June brought the marked page over without summoning an audience. 'Which part would you teach?' she asked. Malik offered to practice it again after supper. Rhea could already imagine the public account becoming an anecdote told at every later assessment, with her name arriving before the lesson."
 ac_sqp.702.a:0 "Name the words I supplied myself."
 ac_sqp.702.a.reply:0 "Sana uses the actual sentence in the next rehearsal; Malik stays beside Rhea through the uncomfortable explanation."
 ac_sqp.702.b:0 "Practice with Malik before we mention it."
 ac_sqp.702.b.reply:0 "They work late together, protecting Rhea from the immediate embarrassment while the shared rehearsal record stays reassuringly clean."
 ac_sqp.703.t:0 "A Voice below the Conversation"
 ac_sqp.703.d_weather_contact_callback:0 "The small receiver carried a broken call while the main channel argued about a revised patrol track. Below Rhea the coast had disappeared in rain. Malik caught the words 'engine stopped'; Sana could establish neither a position nor how many people were aboard. Rhea asked for the last words again instead of inventing a bearing. A pale wake appeared through a gap and vanished before Malik could confirm it. They had enough fuel to pass their observations onward, not to turn an uncertain sighting into a promise of rescue. In the hangar June asked whose next shift would inherit the search. Malik knew somebody who might recognize the voice and offered to find them privately. Sana kept both receivers open. The decision was whether the uncertainty would leave with Malik or remain where another crew could use it.\n\nThe small receiver is still between them. Rhea remembers choosing to hear it and dislikes how quickly hearing can begin to feel like permission to stop listening."
 ac_sqp.703.d_weather_contact:0 "The small receiver carried a broken call while the main channel argued about a revised patrol track. Below Rhea the coast had disappeared in rain. Malik caught the words 'engine stopped'; Sana could establish neither a position nor how many people were aboard. Rhea asked for the last words again instead of inventing a bearing. A pale wake appeared through a gap and vanished before Malik could confirm it. They had enough fuel to pass their observations onward, not to turn an uncertain sighting into a promise of rescue. In the hangar June asked whose next shift would inherit the search. Malik knew somebody who might recognize the voice and offered to find them privately. Sana kept both receivers open. The decision was whether the uncertainty would leave with Malik or remain where another crew could use it."
 ac_sqp.703.d_base_callback:0 "The caller did not know the mechanic's full name. He knew a coat, a bus stop and a promise that somebody would look at a damaged aerial when the shift ended. Sana asked him to repeat the details while the main line demanded a revised timetable. Malik recognized the coat and reached for his own notebook. He could probably find the man without involving the station at all. June reminded him that probably was doing useful work in that sentence. Rhea watched Sana hold both receivers, unable to put either person down without seeming to dismiss them. Helping privately would be faster. Leaving a trace might let somebody else help tomorrow.\n\nThe small receiver is still between them. Rhea remembers choosing to hear it and dislikes how quickly hearing can begin to feel like permission to stop listening."
 ac_sqp.703.d_base:0 "The caller did not know the mechanic's full name. He knew a coat, a bus stop and a promise that somebody would look at a damaged aerial when the shift ended. Sana asked him to repeat the details while the main line demanded a revised timetable. Malik recognized the coat and reached for his own notebook. He could probably find the man without involving the station at all. June reminded him that probably was doing useful work in that sentence. Rhea watched Sana hold both receivers, unable to put either person down without seeming to dismiss them. Helping privately would be faster. Leaving a trace might let somebody else help tomorrow."
 ac_sqp.703.a:0 "Leave the request where the next shift can find it."
 ac_sqp.703.a.reply:0 "Sana writes what they know and what they do not; Malik accepts that his personal favor has become shared work."
 ac_sqp.703.b:0 "Let Malik carry the favor himself."
 ac_sqp.703.b.reply:0 "He pockets the details with a grateful smile, sparing the room another interruption and taking the uncertainty home alone."
 ac_sqp.704.t:0 "The Returned Component"
 ac_sqp.704.d_base_callback:0 "June stopped the pressure test before the apprentice could put his hand back under the training assembly. The replacement carried a label from a different check, and its movement was small enough to look harmless until she showed Rhea where the next pair of fingers would have been. Nothing was fitted to an aircraft. That was the reason there was still time to learn. The apprentice stood beside the bench waiting to discover whether the error would cost him his place. June had supervised the work. Malik offered to replace the label quietly before the next group arrived. Rhea could sign the correction beside the apprentice, making June's responsibility visible too, or let June make the immediate repair and discuss it privately. The tools were safe on the bench. The next pair of hands would not be able to see everyone's good intentions.\n\nRhea recognizes the wish to begin the account after the embarrassing part. Sana does not mention the old rehearsal; she simply waits for the apprentice to finish."
 ac_sqp.704.d_base:0 "June stopped the pressure test before the apprentice could put his hand back under the training assembly. The replacement carried a label from a different check, and its movement was small enough to look harmless until she showed Rhea where the next pair of fingers would have been. Nothing was fitted to an aircraft. That was the reason there was still time to learn. The apprentice stood beside the bench waiting to discover whether the error would cost him his place. June had supervised the work. Malik offered to replace the label quietly before the next group arrived. Rhea could sign the correction beside the apprentice, making June's responsibility visible too, or let June make the immediate repair and discuss it privately. The tools were safe on the bench. The next pair of hands would not be able to see everyone's good intentions."
 ac_sqp.704.a:0 "Sign the correction beside the apprentice."
 ac_sqp.704.a.reply:0 "June leaves both names on the page; the apprentice must explain the mistake but does not have to stand there alone."
 ac_sqp.704.b:0 "Let June own the correction herself."
 ac_sqp.704.b.reply:0 "She protects the learner from a public first mistake, and another useful piece of knowledge remains attached to her authority."
 ac_sqp.705.t:0 "A Chair beside the Door"
 ac_sqp.705.d_base_callback:0 "June had moved the broken chair beside the door, where nobody could sit down without noticing it. Malik assumed she wanted it repaired. She said it was already doing its job. The week's rehearsal plan worked only if somebody stayed late, and the somebody had begun to acquire Malik's handwriting. He laughed at the chair, then offered another evening as if proving June's point would make it less serious. Rhea needed the extra practice. She also knew about the unopened letter in his coat pocket. Sana folded the timetable so the blank space showed. For once the choice was not between work and laziness, but between a visible gap and an invisible person filling it.\n\nThe old private favor is still a story people tell about Malik being dependable. Rhea wonders how many stories a person can keep paying for."
 ac_sqp.705.d_base:0 "June had moved the broken chair beside the door, where nobody could sit down without noticing it. Malik assumed she wanted it repaired. She said it was already doing its job. The week's rehearsal plan worked only if somebody stayed late, and the somebody had begun to acquire Malik's handwriting. He laughed at the chair, then offered another evening as if proving June's point would make it less serious. Rhea needed the extra practice. She also knew about the unopened letter in his coat pocket. Sana folded the timetable so the blank space showed. For once the choice was not between work and laziness, but between a visible gap and an invisible person filling it."
 ac_sqp.705.a:0 "Leave a gap in the rehearsal plan."
 ac_sqp.705.a.reply:0 "Malik is relieved before he can hide it; the group must explain a smaller promise instead of borrowing another evening."
 ac_sqp.705.b:0 "Accept Malik's extra shift."
 ac_sqp.705.b.reply:0 "He makes the rehearsal possible and appreciates being needed, while June leaves the broken chair exactly where it is."
 ac_sqp.706.t:0 "Who Gets the First Turn"
 ac_sqp.706.d_training_return_callback:0 "Malik's turn ended a little before Rhea's. At the debrief table he described the training approach with irritating modesty, leaving out the moment he had corrected a drift before Sana finished calling it. Rhea remembered her own correction arriving later and wanted another attempt. Outside, June waited for the crew to clear the working area before bringing the check page over. Nobody had flown into a battle and nobody needed a heroic account. They needed to decide who would take the first rehearsal next time, and whether friendship meant admitting that both wanted it. Malik put Rhea's name first without asking. Sana watched Rhea reach for the pencil, waiting to discover whether the argument would finally become honest.\n\nThey have practiced alone before. That made them good at repairing an awkward evening together, and less practiced at letting anyone else see the repair."
 ac_sqp.706.d_training_return:0 "Malik's turn ended a little before Rhea's. At the debrief table he described the training approach with irritating modesty, leaving out the moment he had corrected a drift before Sana finished calling it. Rhea remembered her own correction arriving later and wanted another attempt. Outside, June waited for the crew to clear the working area before bringing the check page over. Nobody had flown into a battle and nobody needed a heroic account. They needed to decide who would take the first rehearsal next time, and whether friendship meant admitting that both wanted it. Malik put Rhea's name first without asking. Sana watched Rhea reach for the pencil, waiting to discover whether the argument would finally become honest."
 ac_sqp.706.d_base_callback:0 "Malik had put Rhea's name first in the rehearsal order. Rhea moved it back, intending generosity, and discovered that he had wanted the first turn himself. Neither had said so. June watched their increasingly gracious argument with delight until Sana asked whether the timetable was being consulted or courted. They all laughed, which gave Rhea a moment to hear her own relief. Competition was easier when someone else admitted to it first. Malik wanted to be trusted without becoming the pleasant person who always made way. Rhea wanted the same opportunity and a friendship in which asking for it did not become evidence against her.\n\nThey have practiced alone before. That made them good at repairing an awkward evening together, and less practiced at letting anyone else see the repair."
 ac_sqp.706.d_base:0 "Malik had put Rhea's name first in the rehearsal order. Rhea moved it back, intending generosity, and discovered that he had wanted the first turn himself. Neither had said so. June watched their increasingly gracious argument with delight until Sana asked whether the timetable was being consulted or courted. They all laughed, which gave Rhea a moment to hear her own relief. Competition was easier when someone else admitted to it first. Malik wanted to be trusted without becoming the pleasant person who always made way. Rhea wanted the same opportunity and a friendship in which asking for it did not become evidence against her."
 ac_sqp.706.a:0 "Say I want the first turn too."
 ac_sqp.706.a.reply:0 "Malik stops pretending that he does not care; their next rehearsal begins with a candid disagreement instead of a favor."
 ac_sqp.706.b:0 "Set a private rotation with Malik."
 ac_sqp.706.b.reply:0 "They settle the immediate quarrel between friends, leaving Sana to wonder which parts of the timetable she is allowed to explain."
 ac_sqp.707.t:0 "The Page under the Manual"
 ac_sqp.707.d_base_callback:0 "A folded page fell out of June's manual. It held the small checks she performed before a training assembly was passed to another pair of hands, including two questions nobody had thought to print. The apprentice who found it assumed it was a private joke. June said the joke was that people called her indispensable when half her knowledge fitted on one page. Malik wanted a copy. Sana wanted to know whether a new learner would be allowed to ask why a check existed. Rhea saw June hesitate. Sharing the page would give other people something to challenge. Keeping it would let her keep being the person they called first.\n\nJune remembers protecting the apprentice from a first public mistake. Now she must decide whether protection has also become a reason to keep the next lesson private."
 ac_sqp.707.d_base:0 "A folded page fell out of June's manual. It held the small checks she performed before a training assembly was passed to another pair of hands, including two questions nobody had thought to print. The apprentice who found it assumed it was a private joke. June said the joke was that people called her indispensable when half her knowledge fitted on one page. Malik wanted a copy. Sana wanted to know whether a new learner would be allowed to ask why a check existed. Rhea saw June hesitate. Sharing the page would give other people something to challenge. Keeping it would let her keep being the person they called first."
 ac_sqp.707.a:0 "Teach the page with its questions."
 ac_sqp.707.a.reply:0 "June lets a learner argue with one of the checks; the lesson takes longer and leaves more than her handwriting behind."
 ac_sqp.707.b:0 "Keep a working copy within the crew."
 ac_sqp.707.b.reply:0 "The four gain a useful shortcut and June keeps control of its meaning, while newcomers still have to ask for access."
 ac_sqp.708.t:0 "The Hand That Would Not Close"
 ac_sqp.708.d_base_callback:0 "The training fixture caught June's hand when a spring slipped. It was a small accident in a room full of people who knew the procedure, which made everyone repeat that description too quickly. At the clinic her fingers would not close around the paper cup. She could still speak for herself. She asked Rhea not to turn an ordinary injury into a demonstration of how much the station cared. Malik offered to take her work quietly. Sana asked who would notice if quietly became indefinitely. June looked from the cup to the three of them. Rest would cost her work she valued; publicity would cost her control of her own story.\n\nThe empty space once left in the rehearsal plan is easier to defend now than a promise that somebody will somehow cover June. Rhea still has to ask her."
 ac_sqp.708.d_base:0 "The training fixture caught June's hand when a spring slipped. It was a small accident in a room full of people who knew the procedure, which made everyone repeat that description too quickly. At the clinic her fingers would not close around the paper cup. She could still speak for herself. She asked Rhea not to turn an ordinary injury into a demonstration of how much the station cared. Malik offered to take her work quietly. Sana asked who would notice if quietly became indefinitely. June looked from the cup to the three of them. Rest would cost her work she valued; publicity would cost her control of her own story."
 ac_sqp.708.a:0 "Register the injury and a proper rest period."
 ac_sqp.708.a.reply:0 "June accepts the documented break, irritated by the attention and relieved that nobody can ask her to make it invisible."
 ac_sqp.708.b:0 "Arrange private rest with the crew."
 ac_sqp.708.b.reply:0 "Malik carries the immediate work and June keeps her privacy, trusting four friends to remember a limit nobody else can see."
 ac_sqp.709.t:0 "A Promise outside the Station"
 ac_sqp.709.d_base_callback:0 "Malik had promised to be home for a family visit. He had also promised Rhea another rehearsal and June help with a lesson. He explained these as three separate arrangements, as though the week would not bring them together. Sana took his pen away before he could offer a fourth. Nobody doubted that he wanted to keep every promise. That was what made asking him to choose feel unkind. Rhea could request a formal release from their own timetable, making the missing hours visible to everyone. Or the crew could trade quietly until Malik could leave without admitting to anybody outside the room that they needed him less than they said.\n\nJune remembers being helped when privacy and relief did not arrive together. She asks Malik which part of the choice he wants to make himself."
 ac_sqp.709.d_base:0 "Malik had promised to be home for a family visit. He had also promised Rhea another rehearsal and June help with a lesson. He explained these as three separate arrangements, as though the week would not bring them together. Sana took his pen away before he could offer a fourth. Nobody doubted that he wanted to keep every promise. That was what made asking him to choose feel unkind. Rhea could request a formal release from their own timetable, making the missing hours visible to everyone. Or the crew could trade quietly until Malik could leave without admitting to anybody outside the room that they needed him less than they said."
 ac_sqp.709.a:0 "Release his time in the shared plan."
 ac_sqp.709.a.reply:0 "Malik can keep the family visit without owing a hidden return, although the shorter rehearsal now has Rhea's name beside it."
 ac_sqp.709.b:0 "Make a private exchange of hours."
 ac_sqp.709.b.reply:0 "The crew covers the visit between themselves; Malik thanks them and begins wondering how he will repay the favor."
 ac_sqp.710.t:0 "What the Packet Could Promise"
 ac_sqp.710.d_scientific_method_callback:0 "The scientific packet came through the completed Arkbird cooperation record, with the partnership's limitations still attached. Rhea could show the learner a method without claiming that a platform remained available or that cooperation had made every measurement certain. Malik searched the pages for the impressive picture he had expected. June opened the section explaining what the figures could not establish. Sana set the small receiver on the classroom table and asked Rhea which part she wanted the new operator to remember when the four were absent. Hope had brought the learner to the room. Rhea could give it an honest limit or offer a reassuring introduction and trust that a harder conversation would follow.\n\nJune opens the old check page beside the packet. A method that can survive questions, she says, is worth more than one that needs its author in the room."
 ac_sqp.710.d_scientific_method:0 "The scientific packet came through the completed Arkbird cooperation record, with the partnership's limitations still attached. Rhea could show the learner a method without claiming that a platform remained available or that cooperation had made every measurement certain. Malik searched the pages for the impressive picture he had expected. June opened the section explaining what the figures could not establish. Sana set the small receiver on the classroom table and asked Rhea which part she wanted the new operator to remember when the four were absent. Hope had brought the learner to the room. Rhea could give it an honest limit or offer a reassuring introduction and trust that a harder conversation would follow."
 ac_sqp.710.d_base_callback:0 "The packet looked too modest for the interest it had attracted: observation methods, uncertain measurements and a page explaining what the figures could not establish. Malik had expected a more impressive object. June said the impressive part was somebody leaving the limitations in. Sana set up a classroom demonstration with the small receiver and asked Rhea to explain it to a visiting learner. Rhea could feel the temptation to make the method sound complete. The learner wanted a reason to be hopeful, not another warning. Beyond the window someone was repainting a line on the ground. Even that simple job required two people to agree where the old line had ended.\n\nJune opens the old check page beside the packet. A method that can survive questions, she says, is worth more than one that needs its author in the room."
 ac_sqp.710.d_base:0 "The packet looked too modest for the interest it had attracted: observation methods, uncertain measurements and a page explaining what the figures could not establish. Malik had expected a more impressive object. June said the impressive part was somebody leaving the limitations in. Sana set up a classroom demonstration with the small receiver and asked Rhea to explain it to a visiting learner. Rhea could feel the temptation to make the method sound complete. The learner wanted a reason to be hopeful, not another warning. Beyond the window someone was repainting a line on the ground. Even that simple job required two people to agree where the old line had ended."
 ac_sqp.710.a:0 "Teach the useful method with its limits."
 ac_sqp.710.a.reply:0 "The learner asks a harder second question; Sana lets Rhea find an honest answer without rescuing her from the pause."
 ac_sqp.710.b:0 "Give a reassuring first account."
 ac_sqp.710.b.reply:0 "Malik helps make the demonstration welcoming, while June keeps the limitations ready for a later conversation that may never happen."
 ac_sqp.711.t:0 "The New Voice at the Table"
 ac_sqp.711.d_base_callback:0 "The visiting instructor asked whether the room was ready. Rhea began the answer and a new apprentice asked, very politely, ready for what. Malik looked down at his cup. June did not conceal her smile. It was an excellent question delivered at the least convenient point in a carefully arranged visit. Sana waited for the instructor to answer it himself. Rhea understood the apprentice's uncertainty and the visitor's irritation; she also understood how easily she could translate one into a harmless misunderstanding. The learner had no history with them yet. Whatever happened next would teach him whether questions belonged in the room before he learned anybody's favorite way of answering them.\n\nMalik once waited for Rhea to admit wanting something. She recognizes the same dangerous courtesy in the apprentice waiting to discover whether he is allowed to persist."
 ac_sqp.711.d_base:0 "The visiting instructor asked whether the room was ready. Rhea began the answer and a new apprentice asked, very politely, ready for what. Malik looked down at his cup. June did not conceal her smile. It was an excellent question delivered at the least convenient point in a carefully arranged visit. Sana waited for the instructor to answer it himself. Rhea understood the apprentice's uncertainty and the visitor's irritation; she also understood how easily she could translate one into a harmless misunderstanding. The learner had no history with them yet. Whatever happened next would teach him whether questions belonged in the room before he learned anybody's favorite way of answering them."
 ac_sqp.711.a:0 "Keep the apprentice's question in the conversation."
 ac_sqp.711.a.reply:0 "The visit loses its smooth beginning; June lets the learner hear an experienced person searching for the right qualification."
 ac_sqp.711.b:0 "Answer him privately after the visit."
 ac_sqp.711.b.reply:0 "Rhea protects the learner from an irritated visitor, while Malik helps the room resume the reassuring answer it had prepared."
 ac_sqp.712.t:0 "The Call Nobody Could Improve"
 ac_sqp.712.d_uncertain_return_callback:0 "A scrape swallowed the middle of the transmission as Rhea came back through cloud. Malik supplied the missing word, and she nearly followed him. Then Sana asked them to repeat only what they had heard. The silence lasted long enough for Rhea to notice how tightly she held the controls. Malik stayed with her while Sana obtained another instruction; neither pilot improved the first one into permission. June met them afterward with the recording. A new crew was waiting to learn from it, and their agreement about the missing syllable sounded dangerously convincing when played at a desk. Rhea could pass the gap onward as part of the lesson, or hold the example while they tried to identify the speaker. The aircraft were on the ground now. The habit they had almost trusted would be going up again.\n\nThe old call note is still legible because Sana wrote what they did not know. Malik concedes that the missing word deserves the same courtesy."
 ac_sqp.712.d_uncertain_return:0 "A scrape swallowed the middle of the transmission as Rhea came back through cloud. Malik supplied the missing word, and she nearly followed him. Then Sana asked them to repeat only what they had heard. The silence lasted long enough for Rhea to notice how tightly she held the controls. Malik stayed with her while Sana obtained another instruction; neither pilot improved the first one into permission. June met them afterward with the recording. A new crew was waiting to learn from it, and their agreement about the missing syllable sounded dangerously convincing when played at a desk. Rhea could pass the gap onward as part of the lesson, or hold the example while they tried to identify the speaker. The aircraft were on the ground now. The habit they had almost trusted would be going up again."
 ac_sqp.712.d_base_callback:0 "Sana played the training recording twice. A syllable disappeared beneath a scrape each time, exactly where Malik expected a familiar instruction. He supplied the word and smiled when Rhea supplied the same one. June asked whether agreement made the missing sound audible. The exercise had no aircraft waiting outside and no need to hurry, yet the pause became uncomfortable almost at once. A learner wanted a model answer. Sana could send the example onward marked uncertain, or hold it until somebody found the speaker and asked again. Rhea heard the small receiver behind them, full of real people who did not arrange their requests around the comfortable pace of a classroom.\n\nThe old call note is still legible because Sana wrote what they did not know. Malik concedes that the missing word deserves the same courtesy."
 ac_sqp.712.d_base:0 "Sana played the training recording twice. A syllable disappeared beneath a scrape each time, exactly where Malik expected a familiar instruction. He supplied the word and smiled when Rhea supplied the same one. June asked whether agreement made the missing sound audible. The exercise had no aircraft waiting outside and no need to hurry, yet the pause became uncomfortable almost at once. A learner wanted a model answer. Sana could send the example onward marked uncertain, or hold it until somebody found the speaker and asked again. Rhea heard the small receiver behind them, full of real people who did not arrange their requests around the comfortable pace of a classroom."
 ac_sqp.712.a:0 "Use the recording with its gap clearly marked."
 ac_sqp.712.a.reply:0 "They teach a useful limit without pretending to restore the word; the learner must practice passing uncertainty onward."
 ac_sqp.712.b:0 "Wait until the sender can answer."
 ac_sqp.712.b.reply:0 "Sana stops the demonstration rather than teach from a guess, and the other scheduled lessons must make room for the delay."
 ac_sqp.713.t:0 "A Signature in the Wrong Place"
 ac_sqp.713.d_base_callback:0 "The release sheet arrived at June's bench with Rhea's signature on a cover she had never seen. She had checked a training example, not the complete maintenance account now travelling with it. The clerk offered to replace the cover before the next briefing. June kept the assembly on the ground while Sana asked who already held a copy. Malik wanted to spare a tired clerk a public humiliation; Rhea could see how an innocent correction might sound to somebody expecting concealment. Correcting the shared record would expose the mistake and Rhea's own hurried signature. Explaining it privately would preserve a relationship while leaving the confident copy in other hands. She moved a chair beside the bench so the clerk would not have to answer standing alone. Then she asked for the first page again.\n\nJune remembers the apprentice whose name stayed beside hers. Rhea finds it harder to offer herself less visible accountability than she once offered a learner."
 ac_sqp.713.d_base:0 "The release sheet arrived at June's bench with Rhea's signature on a cover she had never seen. She had checked a training example, not the complete maintenance account now travelling with it. The clerk offered to replace the cover before the next briefing. June kept the assembly on the ground while Sana asked who already held a copy. Malik wanted to spare a tired clerk a public humiliation; Rhea could see how an innocent correction might sound to somebody expecting concealment. Correcting the shared record would expose the mistake and Rhea's own hurried signature. Explaining it privately would preserve a relationship while leaving the confident copy in other hands. She moved a chair beside the bench so the clerk would not have to answer standing alone. Then she asked for the first page again."
 ac_sqp.713.a:0 "Say exactly which part I checked."
 ac_sqp.713.a.reply:0 "The corrected cover is less impressive, and the clerk must send it twice; Sana keeps Rhea beside him while he does."
 ac_sqp.713.b:0 "Trust the recipients to understand the qualification."
 ac_sqp.713.b.reply:0 "Malik helps the clerk explain the immediate copies privately, protecting him from a public mistake while the cover stays unchanged."
 ac_sqp.714.t:0 "The Person Asked to Explain"
 ac_sqp.714.d_base_callback:0 "Malik offered to take the difficult debrief. He could make a room relax without making the question seem foolish, and Rhea had begun dreading the familiar expression people wore when they expected her to qualify an answer. His offer was generous. It was also a way for the pair to remain useful without showing their disagreement in public. June asked who would explain the part Malik had not witnessed. Sana turned two chairs toward the same side of the table. Rhea pictured the questions they could answer together and the questions they might accidentally answer for one another. Their friendship was strong enough to make either choice feel like loyalty.\n\nTheir private rotation once settled who went first. Sana asks whether this is another turn in that arrangement or a promise that only one of them will need to speak."
 ac_sqp.714.d_base:0 "Malik offered to take the difficult debrief. He could make a room relax without making the question seem foolish, and Rhea had begun dreading the familiar expression people wore when they expected her to qualify an answer. His offer was generous. It was also a way for the pair to remain useful without showing their disagreement in public. June asked who would explain the part Malik had not witnessed. Sana turned two chairs toward the same side of the table. Rhea pictured the questions they could answer together and the questions they might accidentally answer for one another. Their friendship was strong enough to make either choice feel like loyalty."
 ac_sqp.714.a:0 "Explain it together, including our disagreement."
 ac_sqp.714.a.reply:0 "Malik keeps the room listening while Rhea supplies the awkward part; neither can quietly become the other's substitute witness."
 ac_sqp.714.b:0 "Let Malik give the first reassuring account."
 ac_sqp.714.b.reply:0 "He takes the pressure willingly, leaving Rhea grateful and increasingly dependent on a friend's talent for making her uncertainty sound simple."
 ac_sqp.715.t:0 "Before the Last Bus"
 ac_sqp.715.d_base_callback:0 "The last ordinary bus waited outside the station with its door open. Malik was already bargaining with the driver for another minute. Sana had stayed behind to put a question to Rhea without the room listening: if somebody changed what Sana had heard, would Rhea call her before repeating the new version? It sounded like a small promise between friends. June, carrying two empty cups, stopped in the doorway. Rhea could promise that a qualification would travel with the account, or promise that Sana would hear privately before anyone else. The bus driver tapped his watch, reminding them that even a conversation about taking time borrowed somebody else's evening.\n\nThe packet lesson comes back to Rhea: a useful limit should not depend on its author being there to explain it after everyone else has gone."
 ac_sqp.715.d_base:0 "The last ordinary bus waited outside the station with its door open. Malik was already bargaining with the driver for another minute. Sana had stayed behind to put a question to Rhea without the room listening: if somebody changed what Sana had heard, would Rhea call her before repeating the new version? It sounded like a small promise between friends. June, carrying two empty cups, stopped in the doorway. Rhea could promise that a qualification would travel with the account, or promise that Sana would hear privately before anyone else. The bus driver tapped his watch, reminding them that even a conversation about taking time borrowed somebody else's evening."
 ac_sqp.715.a:0 "Promise to carry the qualification with the account."
 ac_sqp.715.a.reply:0 "Sana accepts a promise other people can check; Malik makes the driver laugh while Rhea finds words she is willing to repeat."
 ac_sqp.715.b:0 "Promise Sana the first private call."
 ac_sqp.715.b.reply:0 "She appreciates being trusted first, though June notices that everyone else may still hear a cleaner version of the same account."
 ac_sqp.716.t:0 "The Space after the Transmission"
 ac_sqp.716.d_cap_callback:0 "Rhea carried the folder into a borrowed room. The country's capitulation had changed what the station could promise; it had not supplied the missing words in the exchange Sana was trying to preserve. Malik found four chairs that did not match. June set the kettle on a table intended for something else and asked what the next operator would actually be able to use. Nobody proposed telling the old story as if their surroundings were unchanged. Rhea could leave a candid account for people working under a new constraint, or protect the vulnerable debrief within the four and pass onward only the part they could still defend. Sana waited for her answer without pretending a careful page could restore a country.\n\nSana does not ask Rhea to repeat the promise made beside the bus. She places the original words where Rhea can read them before choosing."
 ac_sqp.716.d_cap:0 "Rhea carried the folder into a borrowed room. The country's capitulation had changed what the station could promise; it had not supplied the missing words in the exchange Sana was trying to preserve. Malik found four chairs that did not match. June set the kettle on a table intended for something else and asked what the next operator would actually be able to use. Nobody proposed telling the old story as if their surroundings were unchanged. Rhea could leave a candid account for people working under a new constraint, or protect the vulnerable debrief within the four and pass onward only the part they could still defend. Sana waited for her answer without pretending a careful page could restore a country."
 ac_sqp.716.d_expanded_callback:0 "Sana drew a second line beneath the account: other fighting had entered the conflict. No one in the room could now treat two familiar countries as its complete explanation. Rhea had a difficult transmission to describe and no authority to explain what every other participant intended. Malik put the incoming shift's folder beside her hand. June asked them to keep an ordinary place where a tired person could sit before answering. They could preserve the uncertainty openly or protect their own debrief and send a narrower account. Neither choice would end a war or decide who had won it. The next operator needed people who could tell the difference between a useful observation and the whole story.\n\nSana does not ask Rhea to repeat the promise made beside the bus. She places the original words where Rhea can read them before choosing."
 ac_sqp.716.d_expanded:0 "Sana drew a second line beneath the account: other fighting had entered the conflict. No one in the room could now treat two familiar countries as its complete explanation. Rhea had a difficult transmission to describe and no authority to explain what every other participant intended. Malik put the incoming shift's folder beside her hand. June asked them to keep an ordinary place where a tired person could sit before answering. They could preserve the uncertainty openly or protect their own debrief and send a narrower account. Neither choice would end a war or decide who had won it. The next operator needed people who could tell the difference between a useful observation and the whole story."
 ac_sqp.716.d_withheld_callback:0 "The declaration had been withheld by Yuktobania's own mandate. Malik read the sentence twice, careful not to turn another country's restraint into an agreement the four had made. Rhea still had a difficult transmission to explain. An incoming operator wanted to know why the account contained a pause nobody had filled. June moved four chairs around the table, refusing the temptation to make relief abolish their ordinary work. Sana wanted the unanswered part to remain visible. Rhea wanted to protect people who had been trying to help. They could welcome the absence of this war without claiming that a quiet room had become proof of everybody's intentions, or a reward for their own good judgment.\n\nSana does not ask Rhea to repeat the promise made beside the bus. She places the original words where Rhea can read them before choosing."
 ac_sqp.716.d_withheld:0 "The declaration had been withheld by Yuktobania's own mandate. Malik read the sentence twice, careful not to turn another country's restraint into an agreement the four had made. Rhea still had a difficult transmission to explain. An incoming operator wanted to know why the account contained a pause nobody had filled. June moved four chairs around the table, refusing the temptation to make relief abolish their ordinary work. Sana wanted the unanswered part to remain visible. Rhea wanted to protect people who had been trying to help. They could welcome the absence of this war without claiming that a quiet room had become proof of everybody's intentions, or a reward for their own good judgment."
 ac_sqp.716.d_exchange_callback:0 "The reciprocal exchange had closed this declaration route, and Malik allowed himself a smile before asking what they actually knew. Rhea's difficult transmission still contained a pause. A useful national choice had not restored the missing words or made every voice beyond the receiver trustworthy. June moved the next shift's folder onto the table. Sana wanted the account to preserve the work that uncertainty still required. Rhea could put that account where new people would question it, or keep a protected debrief and pass on the portion the four could defend together. Relief made both choices easier to postpone. The incoming operator stood in the doorway long enough to remind them that another person would inherit whichever silence they left.\n\nSana does not ask Rhea to repeat the promise made beside the bus. She places the original words where Rhea can read them before choosing."
 ac_sqp.716.d_exchange:0 "The reciprocal exchange had closed this declaration route, and Malik allowed himself a smile before asking what they actually knew. Rhea's difficult transmission still contained a pause. A useful national choice had not restored the missing words or made every voice beyond the receiver trustworthy. June moved the next shift's folder onto the table. Sana wanted the account to preserve the work that uncertainty still required. Rhea could put that account where new people would question it, or keep a protected debrief and pass on the portion the four could defend together. Relief made both choices easier to postpone. The incoming operator stood in the doorway long enough to remind them that another person would inherit whichever silence they left."
 ac_sqp.716.d_owned_flight_callback:0 "The warning reached Rhea as a flash beyond the cloud, followed by Sana calling her away from the uncertain contact. Rhea turned hard enough to lose Malik from view. For several seconds his voice was the only proof she had that he was still beside her. He repeated the withdrawal instead of trying to turn the unknown light into a target. They returned with a fragment of the transmission and too many confident guesses. June listened while Rhea described the part she could identify: the turn, the warning and the gap before Malik answered. The war between Osea and Yuktobania was real. It did not make their guesses into a complete account of the encounter. Rhea could leave the uncertainty in the shared debrief or keep the vulnerable discussion within the four. Sana put the original recording on the table before anybody could improve it.\n\nSana does not ask Rhea to repeat the promise made beside the bus. She places the original words where Rhea can read them before choosing."
 ac_sqp.716.d_owned_flight:0 "The warning reached Rhea as a flash beyond the cloud, followed by Sana calling her away from the uncertain contact. Rhea turned hard enough to lose Malik from view. For several seconds his voice was the only proof she had that he was still beside her. He repeated the withdrawal instead of trying to turn the unknown light into a target. They returned with a fragment of the transmission and too many confident guesses. June listened while Rhea described the part she could identify: the turn, the warning and the gap before Malik answered. The war between Osea and Yuktobania was real. It did not make their guesses into a complete account of the encounter. Rhea could leave the uncertainty in the shared debrief or keep the vulnerable discussion within the four. Sana put the original recording on the table before anybody could improve it."
 ac_sqp.716.d_base_callback:0 "The room had fallen quiet after a difficult transmission. Rhea had not found a better answer during the pause. Malik put the next shift's folder beside her hand, and June moved a chair so all four could sit rather than deliver an account over one another's shoulders. Sana wanted the next operator to know which part of the exchange had remained uncertain. Rhea wanted to spare the people who had done their best from an account that might read like a list of failures. Outside the window a lorry reversed slowly past the door. An ordinary warning sounded until everyone was clear of its path; nobody called the delay a defeat.\n\nSana does not ask Rhea to repeat the promise made beside the bus. She places the original words where Rhea can read them before choosing."
 ac_sqp.716.d_base:0 "The room had fallen quiet after a difficult transmission. Rhea had not found a better answer during the pause. Malik put the next shift's folder beside her hand, and June moved a chair so all four could sit rather than deliver an account over one another's shoulders. Sana wanted the next operator to know which part of the exchange had remained uncertain. Rhea wanted to spare the people who had done their best from an account that might read like a list of failures. Outside the window a lorry reversed slowly past the door. An ordinary warning sounded until everyone was clear of its path; nobody called the delay a defeat."
 ac_sqp.716.a:0 "Leave the difficult exchange open to review."
 ac_sqp.716.a.reply:0 "Sana preserves the unanswered part with the rest; Malik stays for the uncomfortable questions instead of smoothing them away."
 ac_sqp.716.b:0 "Keep the vulnerable account within the crew."
 ac_sqp.716.b.reply:0 "June gives them time to speak privately, protecting tired people while the next shift receives only the bounded operational summary."
 ac_sqp.717.t:0 "Room for a Slower Pair of Hands"
 ac_sqp.717.d_base_callback:0 "The apprentice completed the classroom check before June did. He apologized so quickly that she laughed and made him begin again, this time explaining why each step existed. Rhea watched the lesson become an argument between two people who both wanted the work done well. Malik suggested that June could finally leave before the lights were switched off. She said being allowed to leave was not the same as knowing what she would be leaving behind. Sana pulled another chair into the circle. The apprentice needed authority he could use when June was absent, and June needed to remain more than a name invoked whenever somebody else made a mistake.\n\nJune flexes the hand she once rested away from public attention. The old private arrangement helped her then; it cannot be the whole plan for the people learning now."
 ac_sqp.717.d_base:0 "The apprentice completed the classroom check before June did. He apologized so quickly that she laughed and made him begin again, this time explaining why each step existed. Rhea watched the lesson become an argument between two people who both wanted the work done well. Malik suggested that June could finally leave before the lights were switched off. She said being allowed to leave was not the same as knowing what she would be leaving behind. Sana pulled another chair into the circle. The apprentice needed authority he could use when June was absent, and June needed to remain more than a name invoked whenever somebody else made a mistake."
 ac_sqp.717.a:0 "Let June teach where her method can be challenged."
 ac_sqp.717.a.reply:0 "The apprentice gains room to disagree; June loses the comfort of being the only person who can explain every exception."
 ac_sqp.717.b:0 "Keep June as the quiet final authority."
 ac_sqp.717.b.reply:0 "She remains the person the crew trusts at the difficult moment, although the apprentice must still wait for her approval."
 ac_sqp.718.t:0 "Two Coins on the Windowsill"
 ac_sqp.718.d_base_callback:0 "The letter came from the bus driver's family. After a long illness he had died quietly, and they had found two coins kept with an old timetable from the station route. Malik knew exactly why: one evening he had paid twice to buy the crew another minute. Rhea remembered the open door more clearly than the driver's face and disliked that discovery. June set the coins on the windowsill while Sana read the letter again. The family had offered a memory, not permission to make a public example of a man who had never asked for one. Still, the young people using the same stop might deserve to know who had waited for them.\n\nMalik remembers the family visit they once made room for. This time he does not offer to take another shift before sitting down to answer the family himself."
 ac_sqp.718.d_base:0 "The letter came from the bus driver's family. After a long illness he had died quietly, and they had found two coins kept with an old timetable from the station route. Malik knew exactly why: one evening he had paid twice to buy the crew another minute. Rhea remembered the open door more clearly than the driver's face and disliked that discovery. June set the coins on the windowsill while Sana read the letter again. The family had offered a memory, not permission to make a public example of a man who had never asked for one. Still, the young people using the same stop might deserve to know who had waited for them."
 ac_sqp.718.a:0 "Ask the family before sharing the small memory."
 ac_sqp.718.a.reply:0 "Sana writes a careful question; the crew accepts that a useful remembrance may have to wait for somebody else's answer."
 ac_sqp.718.b:0 "Keep their letter within the crew."
 ac_sqp.718.b.reply:0 "Malik returns a personal reply, grateful that the driver can remain someone they knew rather than become another station lesson."
 ac_sqp.719.t:0 "The Empty Line in the Lesson"
 ac_sqp.719.d_base_callback:0 "The new lesson made their old choices look inevitable. Rhea read it twice before understanding why the clean account troubled her: nobody in it had wanted two good things that could not fit together. Malik's favors became generosity without exhaustion. June's corrections became wisdom without embarrassment. Sana's patience became a gift that cost no time. All four appeared better than Rhea remembered, and less useful to somebody trying to make a choice now. The instructor asked for a short account learners could remember. June drew an empty line between two paragraphs. Rhea could fill it with the moment they changed their minds, or leave the complications among the people who had lived them.\n\nThe family's permission taught them that remembering someone is not the same as owning their story. Rhea asks whose permission the new lesson assumes."
 ac_sqp.719.d_base:0 "The new lesson made their old choices look inevitable. Rhea read it twice before understanding why the clean account troubled her: nobody in it had wanted two good things that could not fit together. Malik's favors became generosity without exhaustion. June's corrections became wisdom without embarrassment. Sana's patience became a gift that cost no time. All four appeared better than Rhea remembered, and less useful to somebody trying to make a choice now. The instructor asked for a short account learners could remember. June drew an empty line between two paragraphs. Rhea could fill it with the moment they changed their minds, or leave the complications among the people who had lived them."
 ac_sqp.719.a:0 "Teach where we changed our minds."
 ac_sqp.719.a.reply:0 "The lesson becomes harder to recite and easier to question; the instructor must let an uncertain learner interrupt the heroes."
 ac_sqp.719.b:0 "Keep the account concise and the history private."
 ac_sqp.719.b.reply:0 "The instructor gains a usable first lesson, while Malik keeps the awkward stories for people who have earned the crew's confidence."
 ac_sqp.720.t:0 "Someone Else Takes the Headset"
 ac_sqp.720.d_base_callback:0 "The new operator waited until Sana finished speaking. Such a small courtesy should not have moved Rhea, yet she watched all four of them notice it. Malik had brought the old kettle. June had brought a page whose corrections were now in several different hands. Sana left the second receiver where the learner could reach it without asking. Nobody needed a ceremony to decide who would take the next watch at the classroom table. They needed to decide what would go with it: an account carrying their qualifications, or a concise method with a private history the learner might never hear. Rhea rested her gloves on the empty chair and let the new voice finish its first question.\n\nThe learner points to the empty line in the lesson and asks what changed. For once Rhea does not reach for a sentence that will finish the question early."
 ac_sqp.720.d_base:0 "The new operator waited until Sana finished speaking. Such a small courtesy should not have moved Rhea, yet she watched all four of them notice it. Malik had brought the old kettle. June had brought a page whose corrections were now in several different hands. Sana left the second receiver where the learner could reach it without asking. Nobody needed a ceremony to decide who would take the next watch at the classroom table. They needed to decide what would go with it: an account carrying their qualifications, or a concise method with a private history the learner might never hear. Rhea rested her gloves on the empty chair and let the new voice finish its first question."
 ac_sqp.720.a:0 "Leave our questions with the method."
 ac_sqp.720.a.reply:0 "The learner receives a history she is allowed to challenge, and the four must accept that she may improve it without them."
 ac_sqp.720.b:0 "Sign a bounded professional account."
 ac_sqp.720.b.reply:0 "They give the learner a clear place to begin, while the difficult personal history remains a responsibility shared among the four."
 ac_sqp.750.t:0 "Rhea Calder | Pilot"
 ac_sqp.750.d:0 "1991 personnel file. Rhea likes finishing an explanation before someone has finished asking for it. Her new posting brings her among people who notice the difference between understanding and anticipation. She wants to become the pilot they can trust with an uncertain instruction, and fears that admitting uncertainty will make them choose somebody else."
 ac_sqp.751.t:0 "Malik Renn | Wingman"
 ac_sqp.751.d:0 "1991 personnel file. Malik makes a difficult room easier to enter. His humor and willingness to cover another shift have earned him friends who sometimes forget he has a life beyond the station. He likes Rhea enough to compete with her honestly, although he is still learning how to tell her when generosity has begun to hurt."
 ac_sqp.752.t:0 "June Carver | Crew chief"
 ac_sqp.752.d:0 "1991 personnel file. June teaches a check by explaining what the next pair of hands needs to know. She is proud of being useful and uncomfortable when usefulness becomes a reason nobody else is allowed to learn. Her friendship with the younger crew will be tested by rest, privacy and the difficult business of letting someone help."
 ac_sqp.753.t:0 "Sana Ivers | Controller"
 ac_sqp.753.d:0 "1991 personnel file. Sana can hear when a confident voice has stopped listening. She keeps a weak second receiver beside the main set because a quiet request still comes from somebody. She wants the crew to share that attention without treating every unanswered sound as a promise they can fulfill."
 ac_sqp.790.t:0 "The Second Voice Is Heard"
 ac_sqp.790.d:0 "The learner questions a familiar phrase before the lesson is over. Rhea feels the old urge to rescue the account, and waits instead. Malik smiles at her without making a joke; June asks the learner to show where the method stops being useful. Sana leaves the second receiver audible. They have not become people who never fail one another. Their useful achievement is smaller and harder to imitate: a question no longer has to survive alone until somebody important decides to hear it. Names remain beside corrections, and the history includes the cost of making them. When the four leave the room, nobody promises that every voice outside it will find an answer. They leave a way for the next person to say what has not been heard. The learner begins again in her own words, and Rhea lets those words belong to her."
 ac_sqp.791.t:0 "The Protected Version"
 ac_sqp.791.d:0 "The account they leave is careful and competent. A stranger can use it without needing to reconstruct every difficult evening, and Malik is proud of that. June has checked the method. Sana knows where the unspoken qualifications belong. Rhea signs a boundary around what the page can establish, then closes the separate folder containing the conversations that made it possible. They still trust one another with those conversations. They have been less successful at teaching anyone else how to enter them. In the classroom the learner asks whether a particular exception matters. Rhea answers honestly, and notices that the answer depends on her being there. Sana lowers the small receiver enough for the lesson to continue; she does not switch it off. They leave good work, protected friendships and a door the next crew will still have to learn how to open."
 ac_sqp.792.t:0 "Different Departures"
 ac_sqp.792.d:0 "There is no final argument large enough to explain the departures. The work has remained useful, and the four are still alive to take it elsewhere. Malik collects the kettle after making sure somebody else has one. June checks the classroom tools before handing over a key. Sana writes down the second receiver's awkward habits for a person who has never heard their jokes. Rhea signs the account they can still agree on. Each small courtesy makes leaving harder because none of them can call the others careless. They have learned to protect different things, and have stopped trusting that one room can protect them all. The new learner will find a method, several names and gaps she cannot yet interpret. Outside, the four pause long enough to exchange ordinary goodbyes. Then they take separate routes, carrying skills and affections that no longer quite fit together."
 ac_sqp_yuk:0 "The Names on the Board"
 ac_sqp_yuk_desc:0 "SQUADRON DISPATCHES\nChapter position (read or archived): [?ac_sqp_chapter]/20\nCrew cohesion: [?ac_sqp_cohesion|0]/100\nCredibility: [?ac_sqp_credibility|0]/100\n\nPeople remember the promises made here. These dispatches accompany the national campaign."
