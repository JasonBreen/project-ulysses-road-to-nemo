l_english:
 ESN_wd_pol_no_following:0 "An Office With No Following"
 ESN_wd_pol_no_following_desc:0 "In 1991 Silvonia is run by a National Administration that keeps a democratic label while the democratic camp has almost no voters left. Elections are suspended by standing order. Half the country follows a nationalist movement rooted in the seven districts without plants; the other half trusts the plant owners, ministries and air staff. Naming that split in public is the first cost of mending it."
 ESN_wd_pol_order_in_court:0 "The Standing Order in Court"
 ESN_wd_pol_order_in_court_desc:0 "The order that locked the ballot box has been renewed every year without debate. The ministers now send it to the high court for an opinion and promise to print the answer. Whatever the judges decide, every faction must then say what should replace the order. The Administration gives up the comfort of governing by renewal and gets a public argument instead."
 ESN_wd_pol_order_in_court_tt_1:0 "Opens four answers to the question of who governs Silvonia; only one can be taken."
 ESN_wd_pol_chamber_path:0 "Seats for All Ten Districts"
 ESN_wd_pol_chamber_path_desc:0 "Reformers in the ministries propose to reopen the old chamber with seats apportioned by population across all ten districts, so that the empty districts are finally counted. Nationalists would win many of those seats, and the plant towns would lose their quiet hold on the budget. The reformers accept both risks, because a mandate drawn from every district is far harder to wave away."
 ESN_wd_pol_plants_path:0 "The Plant Towns Want the Seals"
 ESN_wd_pol_plants_path_desc:0 "The Capital District, District B and District F hold every civilian plant and arms works in the country, most of its oil, steel and aluminium and nearly all of its tax roll. Their owners and managers propose a council of the three plant districts to run the state like a works board. The non-aligned half of the country finds this sensible. The other seven districts hear a closed shop."
 ESN_wd_pol_vigilance_path:0 "The Movement of the Empty Districts"
 ESN_wd_pol_vigilance_path_desc:0 "The nationalist movement draws its crowds from the seven districts that have no plants, few roads and long memories of being ignored. Its speakers promise Silvonian hands in every plant, Silvonian pilots in every cockpit and no foreign contractors anywhere. They offer to end the suspended politics by abolishing the contest itself. The plant owners start moving their savings abroad."
 ESN_wd_pol_shield_path:0 "The Air Staff Steps Forward"
 ESN_wd_pol_shield_path_desc:0 "The air staff and the warning service are the most trusted institutions in Silvonia, perhaps because they never stood for election. Senior officers offer to run the country through a council until the two camps stop shouting, keeping the ministries as staff sections under military direction. They promise order without a winner. People who spend their careers planning interceptions may come to treat every argument as a threat."
 ESN_wd_pol_chamber_cabinet:0 "Seat the Reopened Chamber"
 ESN_wd_pol_chamber_cabinet_desc:0 "The chamber meets in the Capital Centre for the first time since the standing order was signed, with deputies from every one of the ten districts. It chooses a cabinet that answers to it and fixes a calendar of elections. Nationalist deputies hold many seats and use every one of them. Budgets now take months to pass, but nobody can say the government was chosen by nobody."
 ESN_wd_pol_plant_council:0 "The Plant Council Takes the Seals"
 ESN_wd_pol_plant_council_desc:0 "Owners and managers from the three plant districts form a standing council and take the seals of government. Elections stay suspended and the ministries report to the council as departments of a single enterprise. Contracts are signed quickly and the books balance at last. The seven districts without plants were never asked, and the council makes little effort to pretend otherwise."
 ESN_wd_pol_vigilance_directorate:0 "The Vigilance Directorate Rules"
 ESN_wd_pol_vigilance_directorate_desc:0 "A directorate drawn from the movement takes executive power and governs by decree. Rival offices close, foreign managers are sent home from the plants and a movement commissioner sits beside every district governor. Public order improves at once and the recruiting offices fill. Foreign suppliers of spares and fuel grow wary of a government that may cancel any contract at a rally."
 ESN_wd_pol_shield_council:0 "Convene the Air Shield Council"
 ESN_wd_pol_shield_council_desc:0 "Officers of the air staff, the warning service and the garrisons assume power under an emergency of no stated length. Parties are not banned, only ignored. The radar posts report on schedule and the fighters fly their patrols. Nobody on the council has a plan for handing power back, and every faction knows that an emergency without an end date rarely ends by itself."
 ESN_wd_pol_chamber_charter:0 "A Charter Read in Ten Districts"
 ESN_wd_pol_chamber_charter_desc:0 "After two sessions of drafting, the chamber passes a written charter. Deputies are elected on a fixed calendar, ministers can be dismissed by a vote, each district gets a council with money of its own, and a charter court hears quarrels between them. Copies are read aloud in every district hall, including halls built only last year. The nationalist bloc wins a strong speakership as the price of its votes."
 ESN_wd_pol_plant_compact:0 "Wage Tables for the Plant Towns"
 ESN_wd_pol_plant_compact_desc:0 "To quiet the strikes that follow its first year, the council signs a compact with plant workers in the three industrial districts: published wage tables, housing funds and a training levy. The owners pay more than they wanted and gain a calm they could not buy by decree. The seven empty districts notice that the compact covers nobody who lives there."
 ESN_wd_pol_vigilance_wardens:0 "Wardens on Every Street"
 ESN_wd_pol_vigilance_wardens_desc:0 "The directorate organises its youngest members into wardens who patrol streets, guard depots and keep the shelter rolls in every district. In the empty districts they bring a presence the state never had. In the plant towns they watch the managers and report on them, and skilled engineers begin to look for work abroad rather than answer to a warden."
 ESN_wd_pol_shield_statute:0 "Publish the Shield Statute"
 ESN_wd_pol_shield_statute_desc:0 "Pressed by the plant owners and by foreign suppliers, the council publishes a statute listing its powers, the emergency it claims to face and the tests it must meet before civilians govern again. Nobody expects those tests to be passed soon, yet the newspapers measure the council against them every month. The officers win some patience and lose the right to rule without explaining themselves."
 ESN_wd_pol_settled:0 "An Order That Holds"
 ESN_wd_pol_settled_desc:0 "By whichever road Silvonia travelled, the quarrels of the early nineties harden into habit. Deputies, councils or commissioners now answer the same questions the same way each year, and the plant offices have learned which door to knock on. Nobody has to love the arrangement. Foreign lenders and the firms that sell engines and radar spares can price it, and cheaper credit follows."
 ESN_wd_dist_census:0 "Count the Ten Districts"
 ESN_wd_dist_census_desc:0 "Silvonia's ten districts are wildly unequal. The Capital District, District B and District F hold all the plants; District A holds the naval base and the yards; the other six are towns without a single plant, and none of them has a road worth the name. A census by district settles who lives where, who pays what and where the first road money ought to go."
 ESN_wd_dist_junction:0 "The Junction in District J"
 ESN_wd_dist_junction_desc:0 "Every railway in Silvonia except the line to District B passes through District J, where the track from the capital splits for the yards of District A and the plants of District F. Yet District J itself has no paved road and no sidings worth the name. Grading its roads and widening its yards relieves the one bottleneck that most trains in the country must cross."
 ESN_wd_dist_plain_c:0 "Roads Across the District C Plain"
 ESN_wd_dist_plain_c_desc:0 "District C is the largest farming district, seventeen provinces of open plain running to the Verusan frontier, and it has no road a truck can use in the wet season. Grain reaches the capital late or not at all. Gravel roads across the plain cost little per kilometre and a great deal in total, and Verusan traders will use them as well."
 ESN_wd_dist_hills_g:0 "A Hill Road for District G"
 ESN_wd_dist_hills_g_desc:0 "District G lies in the hills where Silvonia meets both Sfaenland and Luremia, and its towns are reached by tracks graded for carts. A proper road from the capital brings mail, doctors and tax collectors within a season. It also makes the frontier easier to reach for anyone travelling the other way, which the garrison officers point out at every single meeting."
 ESN_wd_dist_rails:0 "Extend the Rail Spine"
 ESN_wd_dist_rails_desc:0 "The railway already carries the plants' freight from the capital to District B, District F and the coast. The rail faction wants every new kilometre of transport money to extend that spine into the empty districts, starting with the desert of District H. Track is slow to lay and costly per kilometre, but a single train moves more than a hundred trucks and burns far less fuel."
 ESN_wd_dist_gravel:0 "Gravel Before Rails"
 ESN_wd_dist_gravel_desc:0 "The road faction argues that the empty districts need a little access everywhere rather than a lot of access in one place. Graded gravel roads can reach every town within a few years for the cost of one rail line. Trucks burn fuel that Silvonia must ration for its fighters, and the roads wash out in every heavy season, but nobody is left waiting at the end of a track."
 ESN_wd_dist_desert_spur:0 "A Rail Spur into District H"
 ESN_wd_dist_desert_spur_desc:0 "District H is twenty-six provinces of desert along the Verusan and Yuktobanian frontiers, larger than the three plant districts together and almost empty. A rail spur from the capital gives its oases a lifeline and lets a garrison reach the frontier in hours. Sand drifts over the track every dry season, and the crews that clear it will never be finished."
 ESN_wd_dist_desert_tracks:0 "Marked Tracks Across the Desert"
 ESN_wd_dist_desert_tracks_desc:0 "Under the road plan, District H gets marked and graded tracks with fuel caches, wells and telephone posts every fifty kilometres. It is cheap and quick and serves the few herding families and frontier posts well enough. Heavy freight still cannot cross the desert, and the army complains that a convoy needs three days to reach the far frontier."
 ESN_wd_dist_mountain_towns:0 "Winter Roads for D and I"
 ESN_wd_dist_mountain_towns_desc:0 "District D and District I are mountain country on the Kaluga frontier, and every winter their passes close for weeks. Townspeople stock up in autumn and hope. Cutting all-weather roads with snow shelters keeps the towns supplied and lets the frontier posts be relieved on time. The blasting crews must be paid through two winters, and the work is dangerous."
 ESN_wd_dist_marsh_causeway:0 "A Causeway Through the Marsh"
 ESN_wd_dist_marsh_causeway_desc:0 "District A's naval base and yards sit behind jungle and marsh, and the line from the junction reaches them over a single embankment that floods each wet season. Raising a causeway beside the track gives trucks a second route to the coast and the escorts a second supply line. The marshes swallow fill faster than the engineers predicted, and the budget swells to match."
 ESN_wd_ind_registry:0 "Register Every Pit and Well"
 ESN_wd_ind_registry_desc:0 "Oil, steel ore, bauxite and rubber come from only three districts: the Capital District, District B and District F. Each plant keeps its own figures and each ministry trusts different ones. A registry of every pit, well and plantation, inspected in person, costs a year of engineers' time and exposes every owner who has been underreporting output to the tax office."
 ESN_wd_ind_last_plot:0 "The Last Plot in the Capital"
 ESN_wd_ind_last_plot_desc:0 "The Capital District is a crowded city of four hill provinces with room for exactly one more large plant. Every ministry wants that plot: the air staff for a parts works, the plant owners for a consumer factory, the housing office for flats. The cabinet gives it to a general works that can switch between civil and defence orders as the years require."
 ESN_wd_ind_rubber_f:0 "Rubber from the District F Jungle"
 ESN_wd_ind_rubber_f_desc:0 "District F's jungle provinces hold much of the country's rubber, tapped by smallholders who sell to whichever buyer reaches them first. Agronomists and surveyors from the capital map the plantations, access tracks and yields. Better tapping and processing could double output within a few years, if the smallholders trust the ministry long enough to try the new methods."
 ESN_wd_ind_wings:0 "Aluminium for Our Own Wings"
 ESN_wd_ind_wings_desc:0 "Silvonia mines bauxite and smelts aluminium in all three plant districts, then sells most of it abroad and buys back aircraft parts at many times the price. The air staff wants the metal kept at home for airframes, spares and radar masts. The plants would earn less hard currency and gain a customer that never misses an order or argues about delivery."
 ESN_wd_ind_ingots:0 "Ingots for the Railhead"
 ESN_wd_ind_ingots_desc:0 "The plant owners prefer to keep selling ingots, steel billets and crude abroad, loading them at the railheads for the coast and the frontier crossings. Foreign currency pays for the fuel and engines the air arm cannot make at home. Prices abroad swing wildly, and in a bad year the treasury discovers how much of the budget depended on them."
 ESN_wd_ind_rolling_mill:0 "A Rolling Mill at the Junction"
 ESN_wd_ind_rolling_mill_desc:0 "Under the wings policy, a rolling mill and press shop rise in District J beside the rail junction, turning ingots from the plant districts into sheet and extrusions for airframe repair. The district gains its first plant and several hundred jobs. Skilled hands must be lured from the capital with housing grants that the treasury had not planned for."
 ESN_wd_ind_coast_sheds:0 "Export Sheds on the District A Quays"
 ESN_wd_ind_coast_sheds_desc:0 "Under the export policy, bonded sheds and a loading plant go up beside the yards of District A, so metal can leave by sea as well as by rail. The marsh coast gains steady work and the yards gain repair business from visiting ships. Every ton that sails is a ton the air arm will one day have to buy back at a higher price."
 ESN_wd_ind_silo_rule:0 "Keep the Fuel Silo Full"
 ESN_wd_ind_silo_rule_desc:0 "Silvonia has a single fuel silo, in the Capital District, and it feeds the fighters, the trucks and the trains alike. In a crisis it would run dry within weeks. A rule that the silo must never fall below a fixed reserve forces the refineries to hold back fuel that could have been sold. The plant owners grumble; the air staff sleeps better."
 ESN_wd_ind_plain_works:0 "Workshops on the District C Plain"
 ESN_wd_ind_plain_works_desc:0 "With a road across the District C plain at last, a workshop town can serve the farms with tractor repair, pumps and grain mills instead of sending every broken machine to the capital. It is the first plant in a district that never had one. The owners in the old plant districts oppose it as competition, then quietly bid for its contracts."
 ESN_wd_ind_council_dividend:0 "A Dividend for the Empty Districts"
 ESN_wd_ind_council_dividend_desc:0 "Under the plant council, the owners agree to pay a share of plant profits into a fund for the seven districts without industry. The sums are modest and the council decides who receives them, but the money builds schools and wells where the state never reached. Critics call it a bribe for good behaviour. The empty districts take the money anyway."
 ESN_wd_works_airworthy:0 "How Many Can Fly Today"
 ESN_wd_works_airworthy_desc:0 "The air arm lists forty-eight fighters and twelve ground-support aircraft, but nobody has asked how many could take off tomorrow morning. A full inspection of every airframe, engine and radio on the capital field answers the question and embarrasses several officers. Without that answer, every later decision about the air arm is guesswork dressed up as planning."
 ESN_wd_works_depot:0 "The Central Repair Depot"
 ESN_wd_works_depot_desc:0 "Repairs are done wherever a mechanic happens to be, with parts borrowed from whichever aircraft has been grounded longest. A central depot beside the capital field, with its own stores, test benches and records, ends the cannibalising. It takes the best mechanics away from the flight line for a year, and the squadrons resent losing them."
 ESN_wd_works_spares:0 "A Pool of Spares"
 ESN_wd_works_spares_desc:0 "The depot keeps one pool of spares for the whole air arm, bought in bulk, logged by serial number and issued against signed requests. Foreign suppliers give better prices for larger orders, and the treasury pays in advance for parts that may sit on shelves for years. Squadron commanders lose the private stores they used to keep under their desks."
 ESN_wd_works_licence:0 "A Trainer Built Under Licence"
 ESN_wd_works_licence_desc:0 "One camp in the ministries wants to buy a licence to assemble a proven foreign trainer and its spares at home. The design is safe and the tooling arrives in crates with instructions. Royalties flow abroad for every airframe and the licence forbids exports, but within three years Silvonian hands would be building aircraft that actually fly."
 ESN_wd_works_design:0 "Draw Our Own Trainer"
 ESN_wd_works_design_desc:0 "The other camp wants a small design office to draw a Silvonian trainer from the ground up, using home aluminium and engines bought abroad. It will take longer, fail more often and cost more in its first decade. If it works, the country owns the drawings, may sell the aircraft to anyone and keeps engineers who know why things break."
 ESN_wd_works_assembly_hall:0 "An Assembly Hall in District D"
 ESN_wd_works_assembly_hall_desc:0 "The licensed line needs a hall, and District D's mountain valleys offer cheap land, hydropower and distance from the frontier plains. Assembly jigs arrive by rail and mechanics are trained by the licensor's instructors. The mountain towns gain their first industry. Every engine still comes from abroad, and arrives when the supplier pleases."
 ESN_wd_works_test_shop:0 "A Test Shop in the Mountains"
 ESN_wd_works_test_shop_desc:0 "The design office takes over an engineering shop in District D, with a small wind tunnel, a structures laboratory and an engine stand. The engineers have room to test without the capital watching every failure. The first prototypes are late and overweight, and the early test flights make the ministers nervous for reasons the engineers struggle to explain."
 ESN_wd_works_overhaul:0 "An Engine Overhaul Line"
 ESN_wd_works_overhaul_desc:0 "Engines are the one part Silvonia cannot make and cannot do without. An overhaul line that strips, inspects and rebuilds them at home, instead of shipping them abroad for months, keeps more aircraft flying and teaches the engineers what wears out first. The line consumes spares at an alarming rate in its first year, and the depot learns to count again."
 ESN_wd_works_radar_benches:0 "Radar Repair Benches"
 ESN_wd_works_radar_benches_desc:0 "Radar and radio sets fail more often than airframes and are harder to fix, because only a handful of technicians understand them. Benches at the depot for radar and radio repair, with a training course attached, end the practice of sending sets abroad for every fault. The course draws the brightest mechanics away from the airframes, which the squadrons notice."
 ESN_wd_air_one_field:0 "Sixty Aircraft, One Runway"
 ESN_wd_air_one_field_desc:0 "Every combat aircraft Silvonia owns sits on one small field in the Capital District: forty-eight fighters, twelve ground-support aircraft and the reserve airframes, all beside the only fuel silo. One accident on the runway, one fire in the fuel store or one well-placed raid would ground the entire air arm at once. Admitting the problem is easy; paying to solve it is not."
 ESN_wd_air_longer_runway:0 "Lengthen the Capital Runway"
 ESN_wd_air_longer_runway_desc:0 "The capital field was built for propeller aircraft, and its short runway limits how much fuel and how many weapons a fighter can carry. Lengthening it, adding taxiways and building hardened shelters means blasting into the hillside and closing the field for months while the fighters fly from improvised strips. Afterwards the field can handle any aircraft the air arm is likely to own."
 ESN_wd_air_field_b:0 "A Dispersal Field in District B"
 ESN_wd_air_field_b_desc:0 "District B's mountain valleys have room for a second field near the logistics centre, close to the Yuktobanian and Kaluga frontiers. A field there splits the air arm in two so that no single blow can ground it, and puts fighters nearer the passes. The mountain weather will close it on more days than the planners are willing to admit."
 ESN_wd_air_strip_f:0 "A Jungle Strip in District F"
 ESN_wd_air_strip_f_desc:0 "District F's coastal jungle needs a strip for the southern approaches and for flights to its plant town. Clearing a runway through jungle is slow, and the humidity rots anything that is not sealed. The strip covers the coast and the Verusan frontier, and gives the ground-support aircraft a field close to the valleys where they would have to fight."
 ESN_wd_air_interceptors:0 "Interceptors Above All"
 ESN_wd_air_interceptors_desc:0 "The interceptor school argues that Silvonia's whole purpose in the air is to deny its sky to anyone else. Every fighter should be configured, trained and based for interception, with ground support left to the army's guns. It suits a territorial air defence. It also leaves the battalions in the mountains alone if anything ever crosses the frontier on the ground."
 ESN_wd_air_valleys:0 "Wings for the Valley Battalions"
 ESN_wd_air_valleys_desc:0 "The support school points out that Silvonia's frontiers run through mountains and desert, where a battalion with air support is worth three without. It wants the fighters trained to escort the ground-support aircraft and to strike as well as intercept. The air arm would become more useful to the army and less certain of holding its own sky."
 ESN_wd_air_alert_pairs:0 "Two Fighters on Alert"
 ESN_wd_air_alert_pairs_desc:0 "Under the interceptor doctrine, two fighters sit armed and fuelled at the end of the runway day and night, with pilots in the ready room and ground crews beside them. Reaction time falls from twenty minutes to five. The airframes wear faster and the pilots on alert duty fly less, but every intruder now meets Silvonian aircraft."
 ESN_wd_air_pass_strip:0 "A Forward Strip Near the Passes"
 ESN_wd_air_pass_strip_desc:0 "Under the support doctrine, a short gravel strip in District I's mountain valleys lets ground-support aircraft refuel and rearm within minutes of the passes they would defend. Pilots train with the battalions on the frontier and learn the valleys by sight. The strip cannot take fighters in bad weather, and all of its fuel arrives by truck."
 ESN_wd_air_school:0 "The Hill Pilot School"
 ESN_wd_air_school_desc:0 "Silvonia has been sending its pilot candidates abroad and losing some of them to foreign airlines. A school at home, flying from the capital field and later from the dispersal fields, trains pilots for the mountain weather and short runways they will actually use. Instructors are scarce, and the first classes are painfully small."
 ESN_wd_air_aggressors:0 "Contract Aggressor Pilots"
 ESN_wd_air_aggressors_desc:0 "From 1998 former Belkan Air Force pilots hire themselves out to foreign air arms as aggressor squadrons. The hill school could contract a few to fly against its students and squadron pilots, teaching the tactics a real enemy would use. The fees are high, the instructors are blunt, and deputies ask exactly whom these pilots flew for."
 ESN_wd_air_reserve_flight:0 "Fly the Reserve Airframes"
 ESN_wd_air_reserve_flight_desc:0 "Twelve fighters and four ground-support aircraft have sat in storage since they were delivered, kept as replacements. With the overhaul line running, the depot can rotate them into a reserve squadron flown by instructors and reservists. They will wear out sooner, but a reserve that never flies is a reserve nobody knows how to use."
 ESN_wd_net_observers:0 "Observers on the Hilltops"
 ESN_wd_net_observers_desc:0 "Silvonia has fighters but no radar, so the only warning of an intruder is a farmer's telephone call. A corps of volunteer observers on hilltops in every district, with binoculars, recognition charts and field telephones to the capital, costs little and can start at once. It works only by day and in clear weather, which is at least a beginning."
 ESN_wd_net_first_radar:0 "A Radar on the Capital Hills"
 ESN_wd_net_first_radar_desc:0 "A single search radar on the highest hill of the Capital District covers the capital, its plants and the only air base. It needs power, a road, a guard company and technicians who must be trained abroad. The first time it tracks an airliner across the whole country, the air staff understands what it has been missing for decades."
 ESN_wd_net_forward:0 "Radar Along the Frontiers"
 ESN_wd_net_forward_desc:0 "One school wants radar stations on the frontiers, where an intruder would first appear: the passes of District B, the desert of District H, the hills facing Sfaenland and Luremia. Early warning buys the fighters time to climb. Forward stations are expensive to guard and supply, and they would be the first thing lost in a real war."
 ESN_wd_net_ring:0 "A Ring Around the Capital"
 ESN_wd_net_ring_desc:0 "The other school wants every radar, gun and shelter concentrated around the Capital District, where the plants, the fuel silo and the air base sit within a few hills of each other. A dense ring defends what matters most and is easy to supply. Intruders would be seen late, and everything outside the ring would be left to the observers."
 ESN_wd_net_station_b:0 "A Radar Above the District B Passes"
 ESN_wd_net_station_b_desc:0 "Under the forward plan, a radar station on the ridges of District B watches the mountain approaches from Yuktobania and Kaluga. Its crews live on the ridge for months at a time, and the access road is closed by snow every winter. When it works, the capital field gets warning long before anything can reach the plants."
 ESN_wd_net_station_h:0 "A Desert Radar in District H"
 ESN_wd_net_station_h_desc:0 "Under the forward plan, a station in the open desert of District H covers the long Verusan and Yuktobanian frontier, where nothing larger than a herding camp moves for days. Dust ruins the electronics and water must be trucked in. The station sees farther than any other in the country, and its crews see almost nobody at all."
 ESN_wd_net_gun_belt:0 "Gun Belts Around the Plants"
 ESN_wd_net_gun_belt_desc:0 "Under the ring plan, anti-aircraft batteries circle the plants of the Capital District in overlapping belts, with spotters on the rooftops and shelters for the gun crews. Residents wake to practice firing and complain about the noise. The plants become the hardest targets in the country, and the rest of the country notices the difference."
 ESN_wd_net_second_radar:0 "More Radar for the Ring"
 ESN_wd_net_second_radar_desc:0 "Under the ring plan, further radar sets on the capital's hills cover each other's blind spots and keep watching when one set is down for repair. The ring now sees in every direction and fighters can be guided from the ground. All of it sits within a short drive of the city, which keeps it cheap to run and easy to guard."
 ESN_wd_net_bunker:0 "The Control Bunker Under the Hills"
 ESN_wd_net_bunker_desc:0 "Radar tracks, observer reports and fighter orders all pass through a single plotting room above ground in the capital. A control bunker cut into the hills protects that room, adds backup power and radios, and lets one duty officer see the whole sky. It costs as much as a squadron of fighters and will never appear in a parade."
 ESN_wd_net_landlines:0 "Landlines to Every Post"
 ESN_wd_net_landlines_desc:0 "The posts report by radio, which jams, fades and can be overheard by anyone with a receiver. Buried landlines along the railways and roads link every observer post and radar station to the bunker. The cable crews follow the rail spine and then dig the rest by hand. Once finished, the net speaks without being heard and keeps working through storms."
 ESN_wd_net_council_plot:0 "The Council Takes the Plot"
 ESN_wd_net_council_plot_desc:0 "Under the Air Shield Council, the control bunker becomes the seat of government in all but name: council members take turns as duty officers and see every track for themselves. Decisions about the sky are made in seconds. Decisions about schools, wages and roads wait outside the blast door until someone remembers to open it."
 ESN_wd_army_winter:0 "Winter Exercise in the Passes"
 ESN_wd_army_winter_desc:0 "Silvonia's seven infantry formations are spread between the Capital Centre, the logistics centres of District B and District F and the naval base in District A. None has trained above battalion level in years. A winter exercise in District B's mountains, with all seven moving at once, will show what works and who has been signing paper returns."
 ESN_wd_army_mountain:0 "Mountain Battalions"
 ESN_wd_army_mountain_desc:0 "The army already holds a mountaineering doctrine on paper. The mountain faction wants it in every formation: skis, pack animals, cold-weather training and battalions based permanently in the passes of District B, District D and District I. Such troops would hold the frontier hills against anyone, and they would be slow almost everywhere else."
 ESN_wd_army_rail:0 "A Reserve That Travels by Rail"
 ESN_wd_army_rail_desc:0 "The rail faction wants the seven formations held in the centre, near the junction in District J, with trains ready to move any of them to any frontier within a day. Fewer troops would sit in the passes. A central reserve covers every frontier at once, as long as the railway and its timetables survive whatever is coming."
 ESN_wd_army_pass_posts:0 "Posts on the Kaluga Passes"
 ESN_wd_army_pass_posts_desc:0 "Under the mountain plan, permanent posts with heated barracks and supply roads go up on the passes of District I that face Kaluga and Luremia. Patrols can now stay out through the winter. The posts are expensive and lonely, and the soldiers stationed there call them the edge of the world in their letters home."
 ESN_wd_army_sidings:0 "Troop Sidings at the Junction"
 ESN_wd_army_sidings_desc:0 "Under the rail plan, the junction in District J gets military sidings, loading ramps and a depot where each formation's heavy equipment waits on flatcars. A formation can entrain in hours rather than days. The plant owners complain that troop trains now have priority over freight on the busiest line in the country."
 ESN_wd_army_field_guards:0 "Guards for Every Airfield"
 ESN_wd_army_field_guards_desc:0 "Every airfield, radar station and fuel store needs guards, and so far the air staff has borrowed them from the infantry one company at a time. Dedicated guard companies with their own vehicles and anti-aircraft machine guns free the formations for the frontier and give the air arm guards who know what they are guarding."
 ESN_wd_army_runway_engineers:0 "Engineers Who Mend Runways"
 ESN_wd_army_runway_engineers_desc:0 "Each formation carries an engineer company, trained mostly for bridges and mines. Retraining them to repair cratered runways, clear wreckage and lay temporary strips makes the dispersal fields far harder to close. The engineers learn the work quickly, and the air staff soon learns to ask for particular companies by name."
 ESN_wd_army_desert_patrol:0 "Patrols in the Empty Desert"
 ESN_wd_army_desert_patrol_desc:0 "District H's desert frontier with Verusa and Yuktobania is watched by nobody. Motorised patrols with long-range radios, water trucks and local guides cover it in rotations of a month each. They find smugglers, lost herders and once a crashed weather balloon. Above all they tell the government what happens along its longest frontier."
 ESN_wd_army_vigilance_volunteers:0 "Volunteers of the Movement"
 ESN_wd_army_vigilance_volunteers_desc:0 "Under the directorate, the movement's volunteers form part-time companies in the seven districts without plants, drilling at weekends and guarding bridges, depots and hilltop posts. They give the empty districts a role in the defence of the country for the first time. Regular officers distrust units whose loyalty runs to the movement first."
 ESN_wd_fr_airspace:0 "Charting the Airspace Edges"
 ESN_wd_fr_airspace_desc:0 "Silvonia borders Yuktobania, Kaluga, Verusa, Sfaenland and Luremia, and none of those frontiers has an agreed line in the sky. Airliners, survey flights and the odd military aircraft cross without notice. Charting the airspace edges on the Silvonian side, with reporting points and radio frequencies, costs months of meetings and gives the fighters rules for every encounter."
 ESN_wd_fr_belkan_war:0 "Belka Goes to War, Far Away"
 ESN_wd_fr_belkan_war_desc:0 "On 25 March 1995 war breaks out around Belka. Silvonia is no party to it and lies far from the fighting, but airliners reroute across distant skies, insurers raise their rates and fuel prices jump. The air staff asks for higher readiness, the plant owners ask for orders, and the ministries ask what Silvonia intends to say."
 ESN_wd_fr_closed_sky:0 "Close the Sky to Belligerents"
 ESN_wd_fr_closed_sky_desc:0 "The strict camp wants Silvonian airspace closed to every aircraft of a belligerent state, military or civil, for as long as the war lasts. The fighters would intercept every unidentified contact. Neutrality would be visible and enforced. Some airlines would reroute and take their fees with them, and an interception could go wrong at any moment."
 ESN_wd_fr_corridors:0 "Civil Corridors Stay Open"
 ESN_wd_fr_corridors_desc:0 "The moderate camp wants civil corridors kept open to every airline that files a flight plan, with the military aircraft of any state refused. Overflight fees keep flowing and the fighters only meet aircraft that stray from the corridors. Neutrality becomes a matter of paperwork, which suits the ministries and alarms the air staff."
 ESN_wd_fr_intercept_rules:0 "Rules for Meeting Strangers"
 ESN_wd_fr_intercept_rules_desc:0 "Closing the sky means the fighters will meet strangers, and the pilots want rules: when to signal, when to shadow, when to escort a stranger out and who may order anything more. The rules are written by lawyers and pilots in the same room, which takes longer than either side expected. Every pilot now carries a copy in the cockpit."
 ESN_wd_fr_overflight_fees:0 "A Fee for Every Overflight"
 ESN_wd_fr_overflight_fees_desc:0 "With the corridors open, airlines rerouted by the war cross Silvonia daily. A published overflight fee, collected through the airlines' agents, brings in hard currency the ministries badly need. The capital radar must track every civil flight it charges, which keeps the crews busier and better trained than any exercise could."
 ESN_wd_fr_fallout:0 "Sampling the Wind for Fallout"
 ESN_wd_fr_fallout_desc:0 "In June 1995 the Belkan Army uses seven nuclear devices in the Waldreich Mountains. Nobody in Silvonia can say how far the fallout will drift. Weather stations and the hill observers start sampling wind and rain, and the ministry publishes the readings every week. The figures calm the public or frighten it, depending on the week."
 ESN_wd_fr_lumen:0 "Standing Down After Lumen"
 ESN_wd_fr_lumen_desc:0 "On 20 June 1995 a treaty is signed in Lumen and the Belkan War ends. Silvonia stands down its higher readiness and counts the cost: fuel burned, hours flown, contracts gained and lost. The air staff writes a report on what a distant war taught a country that only watched it, and asks that the report not be shelved."
 ESN_wd_fr_belka_stands:0 "Orders from a Belka That Won"
 ESN_wd_fr_belka_stands_desc:0 "In this outcome Belka has won its war, and its purchasing missions seek metal, rubber and fuel for rearmament and rebuilding. Silvonian plants could sell everything they make. Other customers watch who supplies Belka, and the air staff wonders aloud what a victorious Belka will want next."
 ESN_wd_fr_belka_falls:0 "How Belka Lost Its Sky"
 ESN_wd_fr_belka_falls_desc:0 "In this outcome Belka has lost its war, and with it a sky its air force once dominated. Silvonian staff officers study how an air defence that strong was overcome: which radars fell silent first, which fields were struck, which crews kept flying. The lessons are uncomfortable for a country with one field and very little radar."
 ESN_wd_sky_first_warning:0 "The Astronomers Raise a Warning"
 ESN_wd_sky_first_warning_desc:0 "In December 1994 the world's astronomers announce that a newly tracked asteroid, Ulysses, is coming near and might hit. Silvonia owns no observatory worth mentioning, but its air staff employs the only people in the country who watch the sky for a living. The ministries ask the radar crews and hilltop observers, only half joking, to keep an eye on it as well."
 ESN_wd_sky_impact_announced:0 "The FCU Confirms the Impact"
 ESN_wd_sky_impact_announced_desc:0 "On 20 April 1996 the President of the FCU announces that Ulysses will strike the Earth. Where its fragments will fall is unknown. Silvonia's plants, fuel silo and air base all sit in a few hill provinces of the capital, and a single fragment there could end the country's industry. The ministries must decide what to protect first."
 ESN_wd_sky_empty_capital:0 "Plan to Empty the Capital"
 ESN_wd_sky_empty_capital_desc:0 "One plan moves people away from the danger: timetables to empty the capital and the plant towns by rail into the open districts, with camps, water and food waiting there. The railway can carry the numbers if nothing else moves. The plan needs the help of districts that have never received anything from the capital, and they remember that."
 ESN_wd_sky_galleries:0 "Galleries Under the Hills"
 ESN_wd_sky_galleries_desc:0 "The other plan keeps people where they live and digs: galleries into the hills of the Capital District, sealed cellars under the plants, stocks of food and water for weeks. Mining crews from District B do the cutting. The galleries protect the people who matter most to the economy, and the empty districts note who that turns out to be."
 ESN_wd_sky_tracking_net:0 "Radar Crews Track the Fragments"
 ESN_wd_sky_tracking_net_desc:0 "With the warning net linked by landline, radar crews and observers can follow anything that enters Silvonian skies and pass the plot to the bunker in seconds. They practise on meteors and weather balloons. On the night the asteroid passes, the net will be the only part of the state that knows where things are falling."
 ESN_wd_sky_chamber_drills:0 "Drills Debated in the Chamber"
 ESN_wd_sky_chamber_drills_desc:0 "Under the reopened chamber, the emergency plans are debated in public, district by district, and every deputy insists that their towns be included. The drills are larger and slower than the ministries wanted. They are also understood and attended, because the people practising them chose them through their own deputies."
 ESN_wd_sky_roche_watch:0 "The Night the Asteroid Breaks"
 ESN_wd_sky_roche_watch_desc:0 "On 8 July 1999 Ulysses passes through the Roche limit of the Earth. Silvonia spends the night under its evacuation timetables or in its galleries, with the radar crews on duty and the fighters on alert. Every report is checked twice and contradicted once. Morning brings the work of finding out what actually happened."
 ESN_wd_sky_debris_sweep:0 "Watching the Debris Sweep"
 ESN_wd_sky_debris_sweep_desc:0 "In October 1999 Osea and Yuktobania cooperate to convert the Arkbird into a platform for clearing debris from satellite orbits. Silvonia, which borders Yuktobania, has a warning net built to follow things that are low and fast. Its radar crews learn to track objects they were never trained for, and the air staff files every plot it makes."
 ESN_wd_cen_fleet_ten:0 "The Fighters Grow Old"
 ESN_wd_cen_fleet_ten_desc:0 "By 2001 the fighters that guarded Silvonia through the nineties are worn, outdated or both. Replacing them would cost more than the treasury collects in a year. Extending their lives would keep a weaker air arm flying for another decade. The air staff presents both options with a recommendation it is careful never quite to state."
 ESN_wd_cen_fleet_ten_tt_1:0 "Opens the choice between rebuilding the old fighters and buying new ones."
 ESN_wd_cen_life_extension:0 "Ten More Years for Old Airframes"
 ESN_wd_cen_life_extension_desc:0 "The extension programme rebuilds every fighter at the depot: new wiring, new radios, overhauled engines and reinforced wings. The aircraft will not be modern, but they will be known, maintained and paid for. The money stays at home in the depot and the overhaul line, and the pilots fly what they already understand."
 ESN_wd_cen_new_fighters:0 "A New Interceptor from Abroad"
 ESN_wd_cen_new_fighters_desc:0 "The replacement programme buys a modern interceptor abroad, with training, spares and a support contract. Silvonian pilots would fly aircraft equal to most in the region. The purchase empties the procurement budget for a decade, binds the country to a single supplier and leaves the depot with far less to do."
 ESN_wd_cen_railguns:0 "Railguns Turned on the Sky"
 ESN_wd_cen_railguns_desc:0 "In mid-2003 news arrives from Usea: Erusean forces have overrun San Salvacion, taken the Stonehenge complex and turned its giant guns against aircraft. For a country whose entire defence rests on owning its own sky, that report is a professional shock. Officers in the plotting room ask what fighters, radars and alert pairs are worth against a weapon of such reach."
 ESN_wd_cen_isaf_spares:0 "Spares for the ISAF Squadrons"
 ESN_wd_cen_isaf_spares_desc:0 "In August 2003 the FCU establishes the ISAF. Its squadrons need spares, fuel and repair work, and Silvonia's depot and plants could supply some of them without sending a single pilot. The orders would fill the overhaul line. Erusea would count Silvonia among its enemies' suppliers, and would say so in public."
 ESN_wd_cen_no_wings:0 "Nothing With Wings Leaves"
 ESN_wd_cen_no_wings_desc:0 "The strict camp wants no aircraft part, fuel or aluminium sheet exported to either side while the Usean war lasts, with inspectors at the railheads and on the quays of District A. The depot loses its most profitable customer. Silvonia keeps a neutrality that neither side can question, and its own squadrons keep their spares."
 ESN_wd_cen_railguns_silent:0 "When the Railguns Fall Silent"
 ESN_wd_cen_railguns_silent_desc:0 "In this outcome the Stonehenge guns have been wrecked and Usean airspace belongs to aircraft again. The Silvonian study ends with a conclusion its authors did not expect: the weapon that seemed to make air power obsolete was itself brought down. The air staff rewrites its doctrine papers, and the treasury asks whether the radar budget may now shrink."
 ESN_wd_cen_usean_advisers:0 "Advisers for a Rebuilt Usean Sky"
 ESN_wd_cen_usean_advisers_desc:0 "In this outcome the ISAF has won the war, and Usean states must rebuild their air defences from wreckage. Silvonian radar and observer specialists could serve abroad on private contracts as advisers, earning fees and experience. The government permits individual contracts and commits nothing as a state, which keeps the risk small and the gain modest."
 ESN_wd_cen_erusea_holds:0 "A Victor Nobody Expected"
 ESN_wd_cen_erusea_holds_desc:0 "In this outcome Erusea has won its war, and every air staff in the world draws the same lesson: whoever holds the sky holds the ground beneath it. Silvonia lies far from Usea, but its officers ask for more radar watch, more alert hours and less dependence on foreign spares. The ministries grant the first two and wonder how the third could be done."
 ESN_wd_cen_shield_review:0 "Fifteen Years Under the Shield"
 ESN_wd_cen_shield_review_desc:0 "In 2005 the ministries and the air staff sit together to review the shield they have built since 1991: the fields, the radar posts, the depot, the pilots and the government that pays for all of it. The review is blunt about what failed and short on promises. Whoever governs Silvonia next inherits its figures instead of its slogans."
 ESN_wd_cen_shield_review_tt_2:0 "Closes the 1991 to 2005 programme; the later eras are written separately."
 ac_wd_esn_tree:0 "Silvonia: National Programme"
 ac_wd_esn_tree_desc:0 "The national focus programme of Silvonia, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 ESN_wd_admin_interim:0 "The Interim Administration"
 ESN_wd_admin_interim_desc:0 "A National Administration with a democratic name governs on a renewed standing order."
 ESN_wd_chamber_timetable:0 "A Date for the Chamber"
 ESN_wd_chamber_timetable_desc:0 "The chamber will reopen with seats for all ten districts."
 ESN_wd_plant_districts_voice:0 "Voice of the Plant Districts"
 ESN_wd_plant_districts_voice_desc:0 "The owners of the three plant districts expect a share of government."
 ESN_wd_vigilance_rallies:0 "The Vigilance Rallies"
 ESN_wd_vigilance_rallies_desc:0 "The movement of the empty districts fills the squares and claims the state."
 ESN_wd_shield_officers:0 "Officers of the Shield"
 ESN_wd_shield_officers_desc:0 "The air staff and the warning service offer to hold the state."
 ESN_wd_reopened_chamber_charter:0 "The Ten-District Charter"
 ESN_wd_reopened_chamber_charter_desc:0 "A written charter with an elected chamber, district councils and a court."
 ESN_wd_plant_compact:0 "The Plant Town Compact"
 ESN_wd_plant_compact_desc:0 "Published wage tables, housing funds and a training levy in the plant districts."
 ESN_wd_vigilance_wardens:0 "Wardens in Every District"
 ESN_wd_vigilance_wardens_desc:0 "Movement wardens patrol the streets, guard the depots and keep the rolls."
 ESN_wd_shield_statute:0 "The Shield Statute"
 ESN_wd_shield_statute_desc:0 "The council has published its powers and the conditions for handing them back."
 ESN_wd_district_survey:0 "The Ten-District Survey"
 ESN_wd_district_survey_desc:0 "A census-backed account of what each district has and lacks."
 ESN_wd_rail_first:0 "Rails Before Roads"
 ESN_wd_rail_first_desc:0 "New transport money extends the rail spine into the empty districts."
 ESN_wd_road_first:0 "Gravel to Every Town"
 ESN_wd_road_first_desc:0 "New transport money grades a little road everywhere before any new track."
 ESN_wd_ore_registry:0 "The Ore Registry"
 ESN_wd_ore_registry_desc:0 "Every pit, well and plantation inspected and recorded."
 ESN_wd_aluminium_for_wings:0 "Aluminium for Wings"
 ESN_wd_aluminium_for_wings_desc:0 "Home metal reserved for airframes, spares and radar masts."
 ESN_wd_metal_exports:0 "Ingots at the Railhead"
 ESN_wd_metal_exports_desc:0 "Raw metal sold abroad for the hard currency that buys fuel and engines."
 ESN_wd_silo_reserve:0 "The Silo Reserve Rule"
 ESN_wd_silo_reserve_desc:0 "The single fuel silo may never fall below a fixed reserve."
 ESN_wd_district_dividend:0 "The Empty-District Dividend"
 ESN_wd_district_dividend_desc:0 "A share of plant profits builds schools and wells where there are no plants."
 ESN_wd_repair_depot:0 "The Central Repair Depot"
 ESN_wd_repair_depot_desc:0 "One depot, one store and one set of records for the whole air arm."
 ESN_wd_spares_pool:0 "The Spares Pool"
 ESN_wd_spares_pool_desc:0 "Spares bought in bulk and issued by serial number against signed requests."
 ESN_wd_licence_line:0 "The Licensed Trainer Line"
 ESN_wd_licence_line_desc:0 "A proven foreign trainer assembled at home under licence."
 ESN_wd_home_design:0 "The Design Office"
 ESN_wd_home_design_desc:0 "A small office drawing a Silvonian trainer from the ground up."
 ESN_wd_one_field_wing:0 "Sixty Aircraft on One Field"
 ESN_wd_one_field_wing_desc:0 "The whole air arm on a single small field beside the fuel silo."
 ESN_wd_interceptor_doctrine:0 "Interceptors First"
 ESN_wd_interceptor_doctrine_desc:0 "Every fighter based, armed and trained to deny the sky."
 ESN_wd_support_doctrine:0 "Wings for the Valleys"
 ESN_wd_support_doctrine_desc:0 "Fighters and support aircraft trained to fight beside the battalions."
 ESN_wd_alert_pairs:0 "Two on Alert"
 ESN_wd_alert_pairs_desc:0 "Two armed fighters waiting at the runway end, day and night."
 ESN_wd_pilot_school:0 "The Hill Pilot School"
 ESN_wd_pilot_school_desc:0 "Pilots trained at home for mountain weather and short runways."
 ESN_wd_aggressor_course:0 "The Aggressor Course"
 ESN_wd_aggressor_course_desc:0 "Contract instructors fly against Silvonian pilots in training."
 ESN_wd_reserve_squadron:0 "The Reserve Squadron"
 ESN_wd_reserve_squadron_desc:0 "The stored airframes fly again with instructors and reservists."
 ESN_wd_observer_corps:0 "The Observer Corps"
 ESN_wd_observer_corps_desc:0 "Volunteer observers on hilltops in every district."
 ESN_wd_frontier_radar:0 "The Frontier Radar Line"
 ESN_wd_frontier_radar_desc:0 "Radar stations along the passes, the desert and the hills."
 ESN_wd_capital_ring:0 "The Capital Ring"
 ESN_wd_capital_ring_desc:0 "Radar, guns and shelters concentrated around the plants and the air base."
 ESN_wd_gun_belts:0 "Gun Belts Around the Plants"
 ESN_wd_gun_belts_desc:0 "Overlapping anti-aircraft belts around the capital plants."
 ESN_wd_control_bunker:0 "The Control Bunker"
 ESN_wd_control_bunker_desc:0 "One protected plotting room that sees the whole sky."
 ESN_wd_plot_room_rule:0 "Government from the Plot"
 ESN_wd_plot_room_rule_desc:0 "The council governs from the control bunker itself."
 ESN_wd_formation_rolls:0 "Seven Formations Counted"
 ESN_wd_formation_rolls_desc:0 "The infantry formations exercised together and counted honestly."
 ESN_wd_mountain_battalions:0 "Mountain Battalions"
 ESN_wd_mountain_battalions_desc:0 "Battalions based permanently in the frontier passes."
 ESN_wd_rail_reserve:0 "The Rail Reserve"
 ESN_wd_rail_reserve_desc:0 "Formations held near the junction, ready to entrain for any frontier."
 ESN_wd_airfield_guards:0 "Airfield Guard Companies"
 ESN_wd_airfield_guards_desc:0 "Dedicated guards for fields, radar posts and fuel stores."
 ESN_wd_desert_patrols:0 "Desert Patrols"
 ESN_wd_desert_patrols_desc:0 "Motorised patrols on the longest and emptiest frontier."
 ESN_wd_vigilance_companies:0 "Vigilance Companies"
 ESN_wd_vigilance_companies_desc:0 "Part-time movement volunteers guarding bridges and posts in the empty districts."
 ESN_wd_airspace_charts:0 "Charted Airspace"
 ESN_wd_airspace_charts_desc:0 "Agreed reporting points and frequencies on every edge of the sky."
 ESN_wd_war_watch:0 "Watch on a Distant War"
 ESN_wd_war_watch_desc:0 "Higher readiness while war burns far away."
 ESN_wd_closed_sky:0 "A Closed Sky"
 ESN_wd_closed_sky_desc:0 "No aircraft of a belligerent state may cross Silvonia."
 ESN_wd_open_corridors:0 "Open Civil Corridors"
 ESN_wd_open_corridors_desc:0 "Airlines cross on filed plans; military aircraft are refused."
 ESN_wd_overflight_fees:0 "Overflight Fees"
 ESN_wd_overflight_fees_desc:0 "Rerouted airlines pay to cross Silvonian skies."
 ESN_wd_fallout_watch:0 "The Fallout Watch"
 ESN_wd_fallout_watch_desc:0 "Weekly published samples of wind and rain."
 ESN_wd_belkan_orders:0 "Belkan Purchasing Missions"
 ESN_wd_belkan_orders_desc:0 "Orders for metal, rubber and fuel from a victorious Belka."
 ESN_wd_sky_tracking:0 "Watchers of the Sky"
 ESN_wd_sky_tracking_desc:0 "The air staff asked to watch the asteroid as well as the frontiers."
 ESN_wd_evacuation_timetable:0 "The Evacuation Timetable"
 ESN_wd_evacuation_timetable_desc:0 "Trains ready to empty the plant towns into the open districts."
 ESN_wd_hill_galleries:0 "Galleries Under the Hills"
 ESN_wd_hill_galleries_desc:0 "Shelters cut into the capital hills and sealed cellars under the plants."
 ESN_wd_public_drills:0 "Drills the Deputies Chose"
 ESN_wd_public_drills_desc:0 "Emergency drills debated and approved district by district."
 ESN_wd_orbit_watch:0 "Watch on the Orbits"
 ESN_wd_orbit_watch_desc:0 "Radar crews follow low, fast objects they never trained for."
 ESN_wd_life_extension:0 "Ten More Years"
 ESN_wd_life_extension_desc:0 "The old fighters rebuilt at the depot to fly another decade."
 ESN_wd_new_interceptors:0 "The New Interceptor"
 ESN_wd_new_interceptors_desc:0 "A modern interceptor bought abroad with a long support contract."
 ESN_wd_railgun_study:0 "The Railgun Study"
 ESN_wd_railgun_study_desc:0 "Staff officers study a ground weapon that strikes aircraft at long range."
 ESN_wd_railgun_lessons:0 "Lessons of the Railguns"
 ESN_wd_railgun_lessons_desc:0 "A finished study: even the greatest anti-air weapon can be undone."
 ESN_wd_isaf_spares:0 "Spares for the ISAF"
 ESN_wd_isaf_spares_desc:0 "Depot work and spares sold to ISAF squadrons; no pilots committed."
 ESN_wd_no_wings_export:0 "Nothing With Wings Leaves"
 ESN_wd_no_wings_export_desc:0 "No aircraft part, fuel or sheet metal sold to either side."
 ESN_wd_usean_contracts:0 "Advisers on Contract"
 ESN_wd_usean_contracts_desc:0 "Silvonian radar and observer specialists advise on private contracts."
 ESN_wd_erusean_caution:0 "A Watchful Shield"
 ESN_wd_erusean_caution_desc:0 "More radar watch and more alert hours while the victor of Usea is unknown in intent."
 ESN_wd_alert_drill:0 "A National Alert Drill"
 ESN_wd_alert_drill_desc:0 "Every post and crew tested against a surprise raid by the air arm itself."
 ESN_wd_ledger_inspection:0 "Plants Under Inspection"
 ESN_wd_ledger_inspection_desc:0 "Unannounced registry visits keep the owners honest and nervous."
 ESN_wd_hangar_day:0 "Open Hangar Season"
 ESN_wd_hangar_day_desc:0 "Flying displays and recruiting stands at the capital field."
 ac_wd_esn.1.t:0 "Who Holds the Seals"
 ac_wd_esn.1.d:0 "For three years the ministers of the National Administration have found reasons to leave one item off their agenda. Now it cannot wait. The standing order that keeps the ballot box locked lapses at the end of the month, and the ministry lawyers will not draft another renewal unless the ministers vote on it by name. The country is run by a body with a democratic label and almost no democrats to stand behind it.\n\nBeyond the meeting room the country has split into two nearly equal halves. In the seven districts without plants, a nationalist movement fills the market squares with people who have never seen a paved road and blame the plant towns for it. In the Capital District, District B and District F, plant owners, officials and air staff officers want predictable budgets more than any creed, and suspect the movement of wanting their plants.\n\nThe ministers cannot settle the question in one sitting. They can choose how it will be argued: over the state radio, with every district listening and the movement's speakers given equal hours, or behind ministry doors, where the plant owners already have chairs and the movement has none. Each half of the country will read the choice as a statement about which half the Administration fears more.\n\nProvisional gameplay."
 ac_wd_esn.1.a:0 "Put the debate on the state radio."
 ac_wd_esn.1.b:0 "Hold the talks behind ministry doors."
 ac_wd_esn.2.t:0 "The Census of Ten Districts"
 ac_wd_esn.2.d:0 "The census teams return from the ten districts with crates of ledgers, and the figures confirm what every traveller already knew. The Capital District, four crowded hill provinces, holds four civilian plants, two arms works, the only air base and the fuel silo. District B in the mountains and District F in the coastal jungle each hold three civilian plants and two arms works. Between them the three plant districts carry nearly the whole economy.\n\nDistrict A has the naval base, two yards and a marsh that floods the rail embankment every wet season. The remaining six districts have no plants at all. District C is seventeen provinces of farmland without a road a loaded truck can use. District H is twenty-six provinces of desert. Districts D and I are mountain towns whose passes close each winter, District G is hill country, and District J holds the rail junction and little else.\n\nPublication is now the question. A census printed line by line will start a quarrel about fairness that could fill the next decade of politics, and the movement will read from it at every rally. Kept within the ministries, the same ledgers will steer the road budget quietly while the empty districts assume the worst of the capital. Whatever the cabinet decides, the first road money will follow these numbers.\n\nProvisional gameplay."
 ac_wd_esn.2.a:0 "Print every district figure."
 ac_wd_esn.2.b:0 "Keep the figures inside the ministries."
 ac_wd_esn.3.t:0 "Metal Sold, Metal Bought"
 ac_wd_esn.3.d:0 "The registry inspectors finish their year in the pits, wells and plantations of the three plant districts. Their figures for oil, steel ore, bauxite and rubber are higher than the owners reported and lower than the ministries assumed, which surprises nobody. The surprise is in the trade ledgers compiled alongside: almost all the aluminium Silvonia smelts leaves the country as ingots on the railway to the coast and the frontier crossings.\n\nIn the same years the air arm has bought aluminium parts, sheet and fittings from abroad at prices many times what the ingots fetched. The depot mechanics have known this for years and joke about it at the bench. The plant owners point out that foreign buyers pay in hard currency, which buys the fuel and engines Silvonia cannot produce. Both arguments are true, and both are now printed in the same report.\n\nThe cabinet must decide what to do with the report before the newspapers do it for them. A levy on raw metal exports would push the smelters to sell at home and make the plant owners furious. Leaving the trade alone keeps the hard currency flowing and leaves the air arm buying back its own metal at foreign prices for another decade.\n\nProvisional gameplay."
 ac_wd_esn.3.a:0 "Levy raw metal exports."
 ac_wd_esn_3_a:0 "Levy raw metal exports."
 ac_wd_esn.3.b:0 "Leave the trade as it is."
 ac_wd_esn.4.t:0 "Grounded for Want of Parts"
 ac_wd_esn.4.d:0 "The inspection teams spend a month on the capital field, opening every panel on every airframe. Their report is short. Of the forty-eight fighters and twelve ground-support aircraft listed on the rolls, fewer than two thirds can fly on an ordinary morning. The rest wait for parts: a hydraulic pump here, a radio there, an engine that went abroad for overhaul a year ago and has not come back.\n\nThe mechanics have kept the fleet flying by moving parts from one grounded aircraft to the next, a practice the regulations forbid and every squadron depends on. Two airframes have been stripped so thoroughly that only their serial numbers remain. The pilots fly fewer hours each year than they did a decade ago, and the squadron commanders have stopped asking for more because they already know the answer.\n\nThe air staff gives the government two ways forward. It can formally strip the worst airframes for parts, losing aircraft from the rolls to keep the rest flying. Or it can order spares abroad at whatever price suppliers ask, emptying the budget for a year to bring the whole fleet back. Either way, the figures cannot go back into the drawer they came from.\n\nProvisional gameplay."
 ac_wd_esn.4.a:0 "Strip the worst airframes for parts."
 ac_wd_esn.4.b:0 "Order spares abroad at any price."
 ac_wd_esn.5.t:0 "Fire on the Flight Line"
 ac_wd_esn.5.d:0 "Late on a weekday afternoon a fuel bowser catches fire beside the main taxiway of the capital field. Nobody is killed. The crew escape, the fire brigade arrives in minutes and the flames are out within the hour. But the taxiway is blocked by the burned-out truck, the runway is covered in foam, and for the rest of that day and most of the next not one Silvonian combat aircraft can take off.\n\nEvery fighter, every ground-support aircraft and every reserve airframe sits on the same small field in the Capital District, beside the only fuel silo in the country. The air staff has warned about this for years in reports that nobody read. This time the newspapers print photographs of the fighters lined up wingtip to wingtip behind the smoke, and their readers draw their own conclusions.\n\nThe government must decide what the fire means. It can treat it as an accident and tighten the safety rules, which costs little and changes nothing about where the aircraft sit. Or it can treat it as the warning the air staff always said would come, and start planning dispersal fields in other districts at once, which costs a great deal and will take years to finish.\n\nProvisional gameplay."
 ac_wd_esn.5.a:0 "Start planning dispersal fields now."
 ac_wd_esn.5.b:0 "Tighten the safety rules and carry on."
 ac_wd_esn.6.t:0 "An Aircraft Nobody Expected"
 ac_wd_esn.6.d:0 "On a clear morning an observer post on a hilltop in District G telephones the district office to report an aircraft crossing from the direction of the frontier, high and fast and showing no markings anyone can read through binoculars. The district office calls the capital. The capital calls the air staff. By the time two fighters take off from the capital field, forty minutes have passed since the first report.\n\nThe fighters find nothing. Two more posts report the same aircraft further north, then the reports stop. It may have been an airliner off course, a survey flight with a careless navigator or something that had every reason not to file a flight plan. Nobody in Silvonia can say, because nobody in Silvonia saw it on anything but a pair of binoculars and a telephone line.\n\nThe observers did exactly what they were trained to do and are proud of it. The air staff is less proud: a reporting chain that takes forty minutes is no chain at all. The ministers can open a formal inquiry, which will embarrass several offices and produce recommendations that cost money, or thank the observers publicly and let the matter rest.\n\nProvisional gameplay."
 ac_wd_esn.6.a:0 "Open a formal inquiry."
 ac_wd_esn.6.b:0 "Thank the observers and let it rest."
 ac_wd_esn.7.t:0 "Forty Minutes"
 ac_wd_esn.7.d:0 "The inquiry sits for two weeks in a borrowed classroom in the Capital District and interviews everyone in the chain: the observers on the hill, the clerk at the district office, the duty officer at the ministry, the pilots who took off too late. Its findings are blunt. Every person acted correctly by their own rules. The rules themselves added twenty minutes, and the telephone exchange added the rest.\n\nThe observer post had no direct line to the air staff, so its report waited for a district clerk to finish another call. The ministry duty officer needed approval to wake the air staff, and the air staff needed a second approval to launch fighters over a frontier district. Nobody on the ground could tell the pilots where to look, because nobody on the ground knew where the aircraft was by then.\n\nThe report recommends direct lines from every post to the air staff, standing authority for the duty officer to launch the alert fighters, and radar as soon as the country can afford it. The recommendations are cheap except the last. The government can publish the report as written, or fund the telephone lines quietly and keep the forty minutes out of the newspapers.\n\nProvisional gameplay."
 ac_wd_esn.7.a:0 "Publish the report as written."
 ac_wd_esn.7.b:0 "Fund the lines and keep it quiet."
 ac_wd_esn_7_b:0 "Fund the lines and keep it quiet."
 ac_wd_esn.8.t:0 "Seven Formations in the Snow"
 ac_wd_esn.8.d:0 "In January the seven infantry formations leave their barracks at the Capital Centre, the logistics centres of District B and District F and the naval base in District A, and converge on the passes of District B for the first full exercise in years. Trains carry them to the railhead. From there they march, because the roads into the high valleys are closed by snow and the trucks cannot follow.\n\nThe results are mixed. The formations that started in District B arrive on time and in good order. The battalions from District F, trained in coastal jungle, arrive with frostbite and the wrong boots. The engineer companies prove better at clearing roads than anyone expected and worse at bridging, and the radios fail in the cold. Ground-support aircraft from the capital field fly twice in ten days because of the weather.\n\nThe army staff must decide what to buy. Cold-weather equipment for every formation would make the whole army fit for the mountains at a cost the treasury will feel. Rotating battalions through the passes in turn would spread the experience cheaply and slowly, and leave some formations unready if a crisis came in winter.\n\nProvisional gameplay."
 ac_wd_esn.8.a:0 "Equip every formation for the cold."
 ac_wd_esn.8.b:0 "Rotate battalions through the passes."
 ac_wd_esn.9.t:0 "Distant Guns, Crowded Skies"
 ac_wd_esn.9.d:0 "On 25 March 1995 war breaks out around Belka. Silvonia lies far from the fighting and has no stake in it, yet within days the war reaches its sky. Airlines reroute away from the war zone, and some of the new routes cross Silvonian airspace. Fuel prices rise on every market. Insurers add war-risk premiums to cargoes that never come near the front.\n\nThe air staff reports a doubling of unannounced flights over the frontier districts, most of them civil, some of them not obviously so. The plant owners report foreign buyers asking for aluminium, steel and fuel in quantities they have never seen. The movement's newspapers demand that Silvonia keep its distance; the ministries worry that distance will be expensive.\n\nThe government must say something before the air staff starts intercepting airliners on its own initiative. It can declare that Silvonian airspace is closed to the aircraft of any belligerent and enforce it, or say only that the ordinary rules of the air apply and leave the details to the ministries. Both statements will be read abroad, in capitals that rarely think about Silvonia at all.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25; the Silvonian response is gameplay."
 ac_wd_esn.9.a:0 "Close the sky to every belligerent."
 ac_wd_esn.9.b:0 "Say only that the rules of the air apply."
 ac_wd_esn.10.t:0 "The Asteroid Will Fall"
 ac_wd_esn.10.d:0 "The warning of late 1994 has become a certainty. On 20 April 1996 the President of the FCU tells the world that Ulysses will hit, and no astronomer will yet promise which regions the pieces will reach. Silvonia keeps its plants, its only fuel silo and its only air base within a few hill provinces of the Capital District, and its government has never prepared for a threat from above that carries no pilot.\n\nEvery ministry finds a plan that needs money. The mining engineers of District B propose galleries cut into the capital's hills. The railway office proposes timetables to empty the plant towns into the open districts. The air staff proposes to put its radar crews and observers on permanent watch, though they admit they have never tracked anything so fast or so high.\n\nThe public does not wait for the plans. Markets in the capital sell out of water containers and lamp oil, some families in the plant towns pack for relatives in the empty districts, and the movement holds rallies asking why the capital gets everything first. The government must decide whether to speak openly and at once, or calmly and slowly.\n\nProvisional gameplay: date anchors only, ACES Chronicle rows 1994 / 12.10 and 1996 / 04.20; Silvonian preparations are gameplay."
 ac_wd_esn.10.a:0 "Prepare openly and at once."
 ac_wd_esn.10.b:0 "Urge calm and keep working."
 ac_wd_esn.11.t:0 "The Night the Sky Was Watched"
 ac_wd_esn.11.d:0 "The date the astronomers fixed arrives on 8 July 1999, when Ulysses crosses the distance at which the Earth's pull begins to tear it apart. Every radar crew and every hilltop observer in Silvonia is at a post, the alert fighters wait at the runway end with their pilots strapped in, and the duty officer in the plotting room has orders to report anything at all. Most of the country spends the night where its plans told it to be.\n\nThe plotting room fills with reports: lights in the sky over District H, sounds like thunder in the mountains of District D, a radar return that comes and goes too fast to plot. Each report is checked against the others, and most cannot be confirmed. The duty officers learn more about the limits of their net in one night than in eight years of exercises.\n\nAt dawn the ministries begin the slow work of finding out what is true. The air staff wants the emergency measures kept in force until every district has reported. The plant owners want the workers back on shift. The government must decide which risk it prefers: a country that stays shut for a week, or one that reopens before it knows.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1999 / 07.08; no Silvonian damage is claimed."
 ac_wd_esn.11.a:0 "Keep the measures until every district reports."
 ac_wd_esn.11.b:0 "Reopen the plants at once."
 ac_wd_esn.12.t:0 "Railguns Against Aircraft"
 ac_wd_esn.12.d:0 "The reports from Usea in mid-2003 are brief and alarming. Erusean troops have occupied San Salvacion, a country that had declared itself neutral, and the enormous guns of Stonehenge are now firing at aircraft. Usea is a long way off and Silvonia has no part in the war. Yet under the capital's hills the plotting staff take the news harder than anyone in government, because every Silvonian plan assumes that aircraft decide who holds the sky.\n\nThe staff officers ask the obvious questions and find no comfortable answers. A ground weapon that can strike aircraft at such ranges makes fighters, radars and alert pairs look like a smaller part of the picture than they were last year. Others argue that one immense installation is also one immense target, and that a weapon which cannot move can be studied, avoided and eventually defeated.\n\nThe government can commission a full staff study of the new weapon and what it means for Silvonian doctrine, which will take the best officers away from their posts for a year. Or it can note the news, keep to the existing budget and wait to see how the war develops before drawing conclusions it may later have to withdraw.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2003 / SUMMER; the Silvonian response is gameplay."
 ac_wd_esn.12.a:0 "Commission a full staff study."
 ac_wd_esn_12_a:0 "Commission a full staff study."
 ac_wd_esn.12.b:0 "Note it and keep to the budget."
 ESN_wd_reopened_chamber_cabinet_office:0 "Cabinet of the Reopened Chamber"
 ESN_wd_reopened_chamber_cabinet_office_desc:0 "A cabinet chosen by and answerable to a chamber elected from all ten districts, governing collectively on a fixed election calendar. Provisional gameplay office with no named holder."
 ESN_wd_plant_council_office:0 "Council of the Plant Districts"
 ESN_wd_plant_council_office_desc:0 "A standing council of owners and managers from the plants of the Capital District, District B and District F, holding the seals of government with elections still suspended. Provisional gameplay office with no named holder."
 ESN_wd_vigilance_directorate_office:0 "Directorate of National Vigilance"
 ESN_wd_vigilance_directorate_office_desc:0 "A directorate drawn from the nationalist movement of the districts without plants, ruling by decree with a commissioner beside every district governor. Provisional gameplay office with no named holder."
 ESN_wd_shield_council_office:0 "Air Shield Council"
 ESN_wd_shield_council_office_desc:0 "A council of senior officers from the air staff, the warning service and the garrisons, holding power under a declared emergency with no fixed end. Provisional gameplay office with no named holder."
 ac_wd_esn_decisions:0 "Silvonia: National Measures"
 ac_wd_esn_decisions_desc:0 "Measures from the national programme of Silvonia. Provisional gameplay unless a source ledger row says otherwise."
 ESN_wd_alert_exercise_decision:0 "A National Alert Exercise"
 ESN_wd_alert_exercise_decision_desc:0 "Every observer post, radar crew and alert pair is tested against a surprise raid flown by the air arm itself. Repeatable once a year; the exercise burns fuel and flying hours."
 ESN_wd_reserve_callup_decision:0 "Call Up the Reserve Pilots"
 ESN_wd_reserve_callup_decision_desc:0 "Reservists trained at the hill school fly a fortnight with the squadrons. Repeatable every six months."
 ESN_wd_desert_airstrip_decision:0 "Grade a Desert Airstrip"
 ESN_wd_desert_airstrip_decision_desc:0 "Engineers grade a gravel strip beside the District H patrol route for patrol and supply flights. A one-time works programme."
 ESN_wd_jungle_hardstands_decision:0 "Hardstands for the Jungle Strip"
 ESN_wd_jungle_hardstands_decision_desc:0 "Concrete hardstands and sealed stores let the District F strip hold more aircraft through the wet season. Once only."
 ESN_wd_plant_inspection_decision:0 "Inspect a Plant Without Warning"
 ESN_wd_plant_inspection_decision_desc:0 "Registry inspectors arrive unannounced at one plant and publish what they find. Repeatable every six months; the owners resent it."
 ESN_wd_open_hangars_decision:0 "Open the Hangars to the Public"
 ESN_wd_open_hangars_decision_desc:0 "The capital field opens its hangars for a day of flying displays and recruiting stands. Repeatable once a year."
