 ac_snc_ose_message_11.t:0 "Keep the Uncertain Track: The Hearing"
 ac_snc_ose_message_11.d:0 "The observer draws a neat line from the report to the proposed instruction. The controller draws another line back to a question nobody answered. 'If you remove that one, the diagram is easier,' she says. 'The work is not.' A liaison officer admits that the recipient would otherwise assume the second account had been received. The room grows quieter. They can expose the unresolved question to wider scrutiny or keep a signed professional countercheck within the response chain. Either route must give the next duty officer something more useful than confidence borrowed from a clean sheet of paper."
