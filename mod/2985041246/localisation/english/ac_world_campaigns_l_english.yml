 ac_wc_soa.18.t:0 "How Far Can the Fleet Stay?"
 ac_wc_soa.19.d:0 "The report has passed through several offices without reaching the people who could act on it. Sellen wants a lawful reporting chain; Halvek wants a timely one. Neither problem is solved by inventing a new border.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
