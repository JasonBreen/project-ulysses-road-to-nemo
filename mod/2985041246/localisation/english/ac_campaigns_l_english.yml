 ac_camp.91.t:0 "The line in the final account"
 ac_camp.91.desc:0 "The final account requested a summary of losses. The duty officer had prepared one and then found that he could not send it without another page. He placed Chopper's name at the top of that page and waited while the rest of the room completed its own work.\n\nThere were people who wanted the end of the war to make every earlier argument unnecessary. The officer understood the wish. He had also seen how easily an unfinished account could become an excuse to require the same thing from another crew under a different name.\n\nThe recovery preparations that might have changed the outcome had not been completed in time. That fact belonged in the review without becoming a claim that the people left behind had known precisely what the missing preparations would cost. Responsibility was difficult enough without adding an invented certainty to it.\n\nA mechanic came to ask where the squadron's old records should be sent. The officer gave him the receiving address and asked that the personal notes remain with them. The mechanic nodded as though he had been waiting for somebody to say that part aloud.\n\nThe chair in the crew room had been moved by then. Nobody could remember which day it happened. Its absence no longer interrupted the room in the same way, but it still changed who spoke and what could be answered with an easy promise.\n\nThe officer attached the second page to the summary. Peace had made it possible to finish the account. It had not made the account smaller."
