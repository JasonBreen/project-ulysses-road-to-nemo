 perbla_intervention.2.t:0 "With All Sins"
 perbla_intervention.2.d:0 "Salvation. \n\nThere's no other word to describe the feeling. Like the world has been handed to us. Like all our dreams have magically been granted by an almighty deity, higher than any concievable god. \n\nPerbla have offered to assist us in our time of neeed and open a second front against the Osean Federation. Another front means relief from ours, meaning potential breakthrough, and breakthrough means victory. \n\nWell, we can't keep them waiting for an answer. "
 perbla_intervention.2.a:0 "Himmel Mitt Uns."
 
 perbla_intervention.3.t:0 "With All Sins"
 perbla_intervention.3.d:0 "Perbla have made an official statement on the behalf of our enemies, the Belkan Federation. They spoke of the old alliance, the brotherly bond the nations shared, and assisting a lesser nation in a greater time of need. Defending the weak, Protecting the Rightous, Humanity Impaired, and a whole section of jargon, all to justify one thing. \n\nPerbla have declared war on us."
 perbla_intervention.3.a:0 "You couldn't have picked a better time!?"