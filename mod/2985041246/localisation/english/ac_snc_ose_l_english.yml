 OSE_snc_federal_account_civil_spirit:0 "Civil continuity remainder"
 OSE_snc_federal_account_civil_spirit_desc:0 "The civil remainder is the work that continued after urgent commitments took their first share. Its officers ask the government to protect it openly rather than praise its ingenuity and reserve the same people again. Give that continuity a standing civil priority with a continuing political cost. The choice does not erase the protected undertakings accepted earlier. It identifies who will receive the next available period and who must explain a further postponement. A national account is more credible when its ordinary obligations remain visible after the exceptional ones have become familiar."
 OSE_snc_federal_account_civil_spirit_settled:0 "Civil continuity remainder: Standing Review"
 OSE_snc_federal_account_civil_spirit_settled_desc:0 "Keep the selected national priority as a standing account, improved by the work that actually reached its receiving offices. Its continuing political or civilian cost remains alongside the benefit. The next shift will inherit the signed decisions, the unanswered inquiries and the record of work deliberately postponed. It may begin after the expected calendar, under different external conditions, or with partners who no longer exist in the same relationship. None of that makes the account useless. Its value is that a successor can change a promise without first having to discover which part of it the government quietly stopped keeping."
 OSE_snc_federal_account_protected_spirit:0 "Bounded readiness remainder"
 OSE_snc_federal_account_protected_spirit_desc:0 "The readiness representatives accept that a final account cannot describe every protected undertaking as equally urgent. They propose retaining a bounded claim that can actually be received and assessed. Civil services will continue to bear the resulting opportunity cost. Choose that priority without turning it into another unlimited promise. The earlier public or professional records remain attached, including their disagreements. The government can sustain readiness through an honest description of the work it has reserved; it does not need to claim that a foreign dialogue succeeded, that a conflict ended, or that every displaced claimant accepted the outcome."
