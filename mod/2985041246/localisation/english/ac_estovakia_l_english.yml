 EMM_ecw_border_service_1_spirit:0 "Staff the Reception Centres"
 EMM_ecw_border_service_1_spirit_desc:0 "The interior ministry maintains this funded service for ninety days. Run shelter, food and medical care at the border centres. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 EMM_ecw_border_service_1:0 "Staff the Reception Centres"
 EMM_ecw_border_service_1_desc:0 "Run shelter, food and medical care at the border centres.\n\nThe interior ministry must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 EMM_ecw_border_service_2_spirit:0 "Run the Arrivals Register"
 EMM_ecw_border_service_2_spirit_desc:0 "The border registry office maintains this funded service for ninety days. Register arrivals and trace missing family members. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 EMM_ecw_border_service_2:0 "Run the Arrivals Register"
 EMM_ecw_border_service_2_desc:0 "Register arrivals and trace missing family members.\n\nThe border registry office must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 EMM_ecw_initiative_service_1_spirit:0 "Fund the Records Staff"
 EMM_ecw_initiative_service_1_spirit_desc:0 "The preparatory agency's remaining office maintains this funded service for ninety days. Keep a small staff preserving the initiative's files and studies. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 EMM_ecw_initiative_service_1:0 "Fund the Records Staff"
 EMM_ecw_initiative_service_1_desc:0 "Keep a small staff preserving the initiative's files and studies.\n\nThe preparatory agency's remaining office must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 EMM_ecw_initiative_service_2_spirit:0 "Run the Technical Liaison"
 EMM_ecw_initiative_service_2_spirit_desc:0 "The ministry of infrastructure maintains this funded service for ninety days. Keep cross-border engineering contacts working on shared services. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 EMM_ecw_initiative_service_2:0 "Run the Technical Liaison"
 EMM_ecw_initiative_service_2_desc:0 "Keep cross-border engineering contacts working on shared services.\n\nThe ministry of infrastructure must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 EVA_ecw_capital_policy_a_spirit:0 "Accommodation of the factions"
 EVA_ecw_capital_policy_a_spirit_desc:0 "Ministries will open channels to the factions outside the capital, keep records of every local agreement and refuse orders that target civilians. Accommodation lowers the temperature and keeps a settlement possible, at the cost of authority in the capital and the anger of those who demand obedience."
 EVA_ecw_capital_policy_a_spirit_settled:0 "Accommodation of the factions: Standing Settlement"
 EVA_ecw_capital_policy_a_spirit_settled_desc:0 "The settlement fixes how the capital's offices work during and after the fighting. It decides nothing about who wins. It gives whichever government follows a civil service that kept records and kept working. The continuing opportunity cost remains."
 EVA_ecw_capital_policy_b_spirit:0 "Order through suppression"
 EVA_ecw_capital_policy_b_spirit_desc:0 "Order will be imposed from the capital: curfews, purges of disloyal officials and force against cities that resist. Suppression holds the capital and the ministries together for now, and hardens every faction it does not defeat."
 EVA_ecw_capital_policy_b_spirit_settled:0 "Order through suppression: Standing Settlement"
 EVA_ecw_capital_policy_b_spirit_settled_desc:0 "The settlement fixes how the capital's offices work during and after the fighting. It decides nothing about who wins. It gives whichever government follows a civil service that kept records and kept working. The continuing opportunity cost remains."
 EVA_ecw_capital_register:0 "Authority in the Capital"
 EVA_ecw_capital_register_desc:0 "The Lyes Faction has seized the capital, and the ministries now take orders from a command much of the country does not accept. Officials must decide which instructions they will carry out, which they will delay, and how to keep ordinary services running while the question of authority is fought elsewhere."
 EVA_ecw_capital_policy_a:0 "Accommodate the Factions"
 EVA_ecw_capital_policy_a_desc:0 "Ministries will open channels to the factions outside the capital, keep records of every local agreement and refuse orders that target civilians. Accommodation lowers the temperature and keeps a settlement possible, at the cost of authority in the capital and the anger of those who demand obedience."
 EVA_ecw_capital_policy_b:0 "Order Through Suppression"
 EVA_ecw_capital_policy_b_desc:0 "Order will be imposed from the capital: curfews, purges of disloyal officials and force against cities that resist. Suppression holds the capital and the ministries together for now, and hardens every faction it does not defeat."
 EVA_ecw_capital_operations:0 "Keep the Ministries Working"
 EVA_ecw_capital_operations_desc:0 "Whatever the policy, water, power and pensions still need officials who come to work. The ministries will protect a core of ordinary services from the conflict and keep a record of every instruction they were given and what they did with it."
 EVA_ecw_capital_review:0 "Review a Contested Year"
 EVA_ecw_capital_review_desc:0 "The cabinet will review one funded period of contested government rather than claim control from a map. The review asks which services reached the people they were meant for and which orders were refused, and by whom."
 EVA_ecw_capital_settlement:0 "A Capital That Answers to the Country"
 EVA_ecw_capital_settlement_desc:0 "The settlement fixes how the capital's offices work during and after the fighting. It decides nothing about who wins. It gives whichever government follows a civil service that kept records and kept working."
 EVA_ecw_cities_policy_a_spirit:0 "Civilian protection"
 EVA_ecw_cities_policy_a_spirit_desc:0 "Relief will reach civilians in contested cities whichever faction holds them, through local councils, churches and relief workers. Protection saves lives and earns trust, and it lets supplies reach people the capital would rather see starved into submission."
 EVA_ecw_cities_policy_a_spirit_settled:0 "Civilian protection: Standing Settlement"
 EVA_ecw_cities_policy_a_spirit_settled_desc:0 "The settlement keeps the chosen relief policy and the convoy routes that worked. It leaves the cities with a record of who helped them, which will matter long after the fighting ends. The continuing opportunity cost remains."
 EVA_ecw_cities_policy_b_spirit:0 "Control before relief"
 EVA_ecw_cities_policy_b_spirit_desc:0 "Relief will follow control: cities that accept the capital's authority receive supplies, and those that resist receive them once they submit. The policy rewards loyalty and punishes resistance, and it is remembered in every city that went hungry."
 EVA_ecw_cities_policy_b_spirit_settled:0 "Control before relief: Standing Settlement"
 EVA_ecw_cities_policy_b_spirit_settled_desc:0 "The settlement keeps the chosen relief policy and the convoy routes that worked. It leaves the cities with a record of who helped them, which will matter long after the fighting ends. The continuing opportunity cost remains."
 EVA_ecw_cities_register:0 "The Cities That Resisted"
 EVA_ecw_cities_register_desc:0 "The LUF's suppression of the cities that resist has turned the dispute over the capital into a civil war. Whatever the cabinet's policy, people in those cities need food, water and medicine. The ministries will record which cities are cut off, who is supplying them and what is missing."
 EVA_ecw_cities_policy_a:0 "Protect the Civilians"
 EVA_ecw_cities_policy_a_desc:0 "Relief will reach civilians in contested cities whichever faction holds them, through local councils, churches and relief workers. Protection saves lives and earns trust, and it lets supplies reach people the capital would rather see starved into submission."
 EVA_ecw_cities_policy_b:0 "Restore Control First"
 EVA_ecw_cities_policy_b_desc:0 "Relief will follow control: cities that accept the capital's authority receive supplies, and those that resist receive them once they submit. The policy rewards loyalty and punishes resistance, and it is remembered in every city that went hungry."
 EVA_ecw_cities_operations:0 "Food, Water and Medicine"
 EVA_ecw_cities_operations_desc:0 "Supply convoys, water repairs and medical teams need routes, guarantees and people willing to drive them. The relief office will negotiate passage with whoever controls each road and keep a record of every convoy that arrived and every one that did not."
 EVA_ecw_cities_review:0 "Review a Winter in the Cities"
 EVA_ecw_cities_review_desc:0 "The review covers one funded winter of relief in the contested cities. It counts the convoys that arrived, the clinics that stayed open and the cities that were reached, not the statements made about them."
 EVA_ecw_cities_settlement:0 "Cities That Can Recover"
 EVA_ecw_cities_settlement_desc:0 "The settlement keeps the chosen relief policy and the convoy routes that worked. It leaves the cities with a record of who helped them, which will matter long after the fighting ends."
 EVA_ecw_oil_policy_a_spirit:0 "Published operating contract"
 EVA_ecw_oil_policy_a_spirit_desc:0 "The platforms will keep producing under a published contract with the public corporation, with revenue paid into an account that no faction can draw on alone. The arrangement protects the crews and the income, and it depends on every side accepting a contract it did not write."
 EVA_ecw_oil_policy_a_spirit_settled:0 "Published operating contract: Standing Settlement"
 EVA_ecw_oil_policy_a_spirit_settled_desc:0 "The settlement fixes how the platforms' revenue is held and spent, and it keeps the crews' register. Whoever governs after the war inherits an account rather than a prize. The continuing opportunity cost remains."
 EVA_ecw_oil_policy_b_spirit:0 "State custody of the platforms"
 EVA_ecw_oil_policy_b_spirit_desc:0 "The state will take direct control of the platforms and their revenue, with guards sent from the capital. Control denies the revenue to the factions in the northeast, and it makes the platforms a target that guards alone may not be able to hold."
 EVA_ecw_oil_policy_b_spirit_settled:0 "State custody of the platforms: Standing Settlement"
 EVA_ecw_oil_policy_b_spirit_settled_desc:0 "The settlement fixes how the platforms' revenue is held and spent, and it keeps the crews' register. Whoever governs after the war inherits an account rather than a prize. The continuing opportunity cost remains."
 EVA_ecw_oil_register:0 "The Northeastern Platforms"
 EVA_ecw_oil_register_desc:0 "The oil platforms in the northeast are held by a public corporation, and every faction can see what their revenue would buy. Before the fighting reaches them, the government will record what the platforms produce, who works on them and where the money goes."
 EVA_ecw_oil_policy_a:0 "Public Operation Under Contract"
 EVA_ecw_oil_policy_a_desc:0 "The platforms will keep producing under a published contract with the public corporation, with revenue paid into an account that no faction can draw on alone. The arrangement protects the crews and the income, and it depends on every side accepting a contract it did not write."
 EVA_ecw_oil_policy_b:0 "Keep the Platforms in State Hands"
 EVA_ecw_oil_policy_b_desc:0 "The state will take direct control of the platforms and their revenue, with guards sent from the capital. Control denies the revenue to the factions in the northeast, and it makes the platforms a target that guards alone may not be able to hold."
 EVA_ecw_oil_operations:0 "Protect the Crews"
 EVA_ecw_oil_operations_desc:0 "Whoever holds the platforms, the people on them need relief crews, safe transport and pay. The corporation will keep a register of every crew member and a plan to evacuate them if the fighting arrives."
 EVA_ecw_oil_review:0 "Review a Production Year"
 EVA_ecw_oil_review_desc:0 "The review covers one funded production year: barrels produced, revenue paid and crews kept safe. Promises about future output do not count."
 EVA_ecw_oil_settlement:0 "Revenue That Outlasts the War"
 EVA_ecw_oil_settlement_desc:0 "The settlement fixes how the platforms' revenue is held and spent, and it keeps the crews' register. Whoever governs after the war inherits an account rather than a prize."
 EVA_ecw_chandelier_policy_a_spirit:0 "Sealed project"
 EVA_ecw_chandelier_policy_a_spirit_desc:0 "The project will be sealed: records archived, components inventoried and the site placed under a neutral caretaker staff. Sealing reduces the risk that a faction seizes it, and it disperses the team that understands it."
 EVA_ecw_chandelier_policy_a_spirit_settled:0 "Sealed project: Standing Settlement"
 EVA_ecw_chandelier_policy_a_spirit_settled_desc:0 "The settlement fixes the Chandelier's custody arrangements and the protection of its people. It neither completes nor arms the project. Any later decision about it will be made by a government with the records in hand. The continuing opportunity cost remains."
 EVA_ecw_chandelier_policy_b_spirit:0 "Retained research team"
 EVA_ecw_chandelier_policy_b_spirit_desc:0 "The research team will be kept together and paid, with its records intact, under the ministry's protection. Continuity preserves expertise the country may need, at the price of keeping a valuable target in one place."
 EVA_ecw_chandelier_policy_b_spirit_settled:0 "Retained research team: Standing Settlement"
 EVA_ecw_chandelier_policy_b_spirit_settled_desc:0 "The settlement fixes the Chandelier's custody arrangements and the protection of its people. It neither completes nor arms the project. Any later decision about it will be made by a government with the records in hand. The continuing opportunity cost remains."
 EVA_ecw_chandelier_register:0 "The Unfinished Railgun"
 EVA_ecw_chandelier_register_desc:0 "The Chandelier, the railgun built to destroy fragments of Ulysses, was unfinished when the asteroid arrived. Its site, its records and the engineers who know how it works are now in a country at war with itself. The government will record what exists, who can reach it and who wants it."
 EVA_ecw_chandelier_policy_a:0 "Seal the Project"
 EVA_ecw_chandelier_policy_a_desc:0 "The project will be sealed: records archived, components inventoried and the site placed under a neutral caretaker staff. Sealing reduces the risk that a faction seizes it, and it disperses the team that understands it."
 EVA_ecw_chandelier_policy_b:0 "Keep the Research Team Together"
 EVA_ecw_chandelier_policy_b_desc:0 "The research team will be kept together and paid, with its records intact, under the ministry's protection. Continuity preserves expertise the country may need, at the price of keeping a valuable target in one place."
 EVA_ecw_chandelier_operations:0 "Protect the Records and the People"
 EVA_ecw_chandelier_operations_desc:0 "Engineers and their families need protection from every faction that might want their knowledge. The ministry will keep them on a register, with relocation plans and a guarantee that nobody works on the project under duress."
 EVA_ecw_chandelier_review:0 "Review the Custody Year"
 EVA_ecw_chandelier_review_desc:0 "The review examines one funded custody year: records kept, staff protected and the site untouched. It does not measure progress toward completion, because completion is not the purpose of custody."
 EVA_ecw_chandelier_settlement:0 "Custody, Not a Weapon"
 EVA_ecw_chandelier_settlement_desc:0 "The settlement fixes the Chandelier's custody arrangements and the protection of its people. It neither completes nor arms the project. Any later decision about it will be made by a government with the records in hand."
 EVA_ecw_talks_policy_a_spirit:0 "Negotiated settlement course"
 EVA_ecw_talks_policy_a_spirit_desc:0 "The government will pursue a negotiated settlement: local ceasefires first, then talks between the factions' representatives with outside observers. Negotiation can end the war sooner and leave fewer wounds, and it requires concessions that hardliners on every side will call betrayal."
 EVA_ecw_talks_policy_a_spirit_settled:0 "Negotiated settlement course: Standing Settlement"
 EVA_ecw_talks_policy_a_spirit_settled_desc:0 "The settlement keeps the chosen course and the records prepared for the peace. It cannot end the war by itself. It makes sure that when the war ends, by agreement or by force, the country is not starting from nothing. The continuing opportunity cost remains."
 EVA_ecw_talks_policy_b_spirit:0 "Waiting for the decisive battle"
 EVA_ecw_talks_policy_b_spirit_desc:0 "The government will wait for the war to be decided on the battlefield and prepare to govern afterwards. Waiting avoids concessions and keeps options open, and every month it lasts is paid for by the cities and the people in them."
 EVA_ecw_talks_policy_b_spirit_settled:0 "Waiting for the decisive battle: Standing Settlement"
 EVA_ecw_talks_policy_b_spirit_settled_desc:0 "The settlement keeps the chosen course and the records prepared for the peace. It cannot end the war by itself. It makes sure that when the war ends, by agreement or by force, the country is not starting from nothing. The continuing opportunity cost remains."
 EVA_ecw_talks_register:0 "Talk Across the Lines"
 EVA_ecw_talks_register_desc:0 "After years of fighting, every faction knows the cost of the war and none can say how it ends. Officials with contacts across the lines will record who is willing to talk, about what, and who would have to agree before any agreement could hold."
 EVA_ecw_talks_policy_a:0 "A Negotiated Settlement"
 EVA_ecw_talks_policy_a_desc:0 "The government will pursue a negotiated settlement: local ceasefires first, then talks between the factions' representatives with outside observers. Negotiation can end the war sooner and leave fewer wounds, and it requires concessions that hardliners on every side will call betrayal."
 EVA_ecw_talks_policy_b:0 "Wait for the Decisive Battle"
 EVA_ecw_talks_policy_b_desc:0 "The government will wait for the war to be decided on the battlefield and prepare to govern afterwards. Waiting avoids concessions and keeps options open, and every month it lasts is paid for by the cities and the people in them."
 EVA_ecw_talks_operations:0 "Prepare for Whoever Governs Next"
 EVA_ecw_talks_operations_desc:0 "Whoever governs after the war will need lists of prisoners, missing persons and damaged property, and officials more than one faction can trust. The ministries will prepare those lists now."
 EVA_ecw_talks_review:0 "Review the Contacts"
 EVA_ecw_talks_review_desc:0 "The review examines a funded period of contacts across the lines: which channels stayed open, which ceasefires held and which talks produced anything written down."
 EVA_ecw_talks_settlement:0 "A Peace the Factions Can Sign"
 EVA_ecw_talks_settlement_desc:0 "The settlement keeps the chosen course and the records prepared for the peace. It cannot end the war by itself. It makes sure that when the war ends, by agreement or by force, the country is not starting from nothing."
 EMM_ecw_aid_policy_a_spirit:0 "Conditional aid with monitors"
 EMM_ecw_aid_policy_a_spirit_desc:0 "Aid will continue under strict conditions: independent monitors, delivery to named civilian projects and suspension if any of it is used to suppress opposition. Conditional aid keeps a channel open, and it can be accused of funding the government it is meant to restrain."
 EMM_ecw_aid_policy_a_spirit_settled:0 "Conditional aid with monitors: Standing Settlement"
 EMM_ecw_aid_policy_a_spirit_settled_desc:0 "The settlement fixes the terms on which Emmeria gives aid to a neighbour at war with itself. It keeps the chosen policy and its costs, and it gives any future government in Estovakia a clear account of what Emmeria offered and why. The continuing opportunity cost remains."
 EMM_ecw_aid_policy_b_spirit:0 "Aid withheld until the fighting ends"
 EMM_ecw_aid_policy_b_spirit_desc:0 "Aid to the government in the capital will stop until the fighting ends, while emergency relief continues through international agencies. Withholding aid avoids funding repression, and it leaves Emmeria with little influence over what happens next."
 EMM_ecw_aid_policy_b_spirit_settled:0 "Aid withheld until the fighting ends: Standing Settlement"
 EMM_ecw_aid_policy_b_spirit_settled_desc:0 "The settlement fixes the terms on which Emmeria gives aid to a neighbour at war with itself. It keeps the chosen policy and its costs, and it gives any future government in Estovakia a clear account of what Emmeria offered and why. The continuing opportunity cost remains."
 EMM_ecw_aid_register:0 "Conditions for Reconstruction Aid"
 EMM_ecw_aid_register_desc:0 "Emmeria has given Estovakia reconstruction aid since the asteroid, through programmes that were frozen and reformed more than once. With the Lyes Faction in the capital, the cabinet must decide what aid it will still give, to whom, and on what terms."
 EMM_ecw_aid_policy_a:0 "Conditional Aid With Monitors"
 EMM_ecw_aid_policy_a_desc:0 "Aid will continue under strict conditions: independent monitors, delivery to named civilian projects and suspension if any of it is used to suppress opposition. Conditional aid keeps a channel open, and it can be accused of funding the government it is meant to restrain."
 EMM_ecw_aid_policy_b:0 "Withhold Aid Until the Fighting Ends"
 EMM_ecw_aid_policy_b_desc:0 "Aid to the government in the capital will stop until the fighting ends, while emergency relief continues through international agencies. Withholding aid avoids funding repression, and it leaves Emmeria with little influence over what happens next."
 EMM_ecw_aid_operations:0 "Reach Civilians, Not Commanders"
 EMM_ecw_aid_operations_desc:0 "Whatever the policy, the aid that does go must reach civilians: clinics, water systems and schools, not ministries that can redirect it. The aid office will keep a delivery register for every shipment."
 EMM_ecw_aid_review:0 "Review an Aid Year"
 EMM_ecw_aid_review_desc:0 "The review examines one funded aid year: shipments delivered, projects completed and any diversion found by the monitors. It records failures as carefully as successes."
 EMM_ecw_aid_settlement:0 "Aid With Terms That Hold"
 EMM_ecw_aid_settlement_desc:0 "The settlement fixes the terms on which Emmeria gives aid to a neighbour at war with itself. It keeps the chosen policy and its costs, and it gives any future government in Estovakia a clear account of what Emmeria offered and why."
 EMM_ecw_border_policy_a_spirit:0 "Open reception centres"
 EMM_ecw_border_policy_a_spirit_desc:0 "Reception centres will take in anyone fleeing the fighting, with shelter, food and medical care near the border. Open reception saves lives and honours Emmeria's commitments, and it places a heavy, visible burden on the border towns."
 EMM_ecw_border_policy_a_spirit_settled:0 "Open reception centres: Standing Settlement"
 EMM_ecw_border_policy_a_spirit_settled_desc:0 "The settlement keeps the chosen border policy and the register. It makes no claim on Estovakian territory and closes no road permanently. It gives Emmeria a way to receive people from a neighbour's war without improvising each time. The continuing opportunity cost remains."
 EMM_ecw_border_policy_b_spirit:0 "Controlled crossing points"
 EMM_ecw_border_policy_b_spirit_desc:0 "Arrivals will cross only at controlled points, with screening and limits set by the capacity of each centre. Control keeps the border orderly and reassures the towns, and it leaves people waiting on the other side of a war."
 EMM_ecw_border_policy_b_spirit_settled:0 "Controlled crossing points: Standing Settlement"
 EMM_ecw_border_policy_b_spirit_settled_desc:0 "The settlement keeps the chosen border policy and the register. It makes no claim on Estovakian territory and closes no road permanently. It gives Emmeria a way to receive people from a neighbour's war without improvising each time. The continuing opportunity cost remains."
 EMM_ecw_border_register:0 "The Eastern Border"
 EMM_ecw_border_register_desc:0 "The fighting in Estovakia has sent people toward Emmeria's eastern border: families fleeing the cities, deserters and people who cannot say which they are. The interior ministry will record who is arriving, where they are crossing and what the border towns can absorb."
 EMM_ecw_border_policy_a:0 "Open Reception Centres"
 EMM_ecw_border_policy_a_desc:0 "Reception centres will take in anyone fleeing the fighting, with shelter, food and medical care near the border. Open reception saves lives and honours Emmeria's commitments, and it places a heavy, visible burden on the border towns."
 EMM_ecw_border_policy_b:0 "Controlled Crossing Points"
 EMM_ecw_border_policy_b_desc:0 "Arrivals will cross only at controlled points, with screening and limits set by the capacity of each centre. Control keeps the border orderly and reassures the towns, and it leaves people waiting on the other side of a war."
 EMM_ecw_border_operations:0 "Register Every Arrival"
 EMM_ecw_border_operations_desc:0 "Every arrival will be registered with a name, a point of origin and any family members missing. The register protects people from disappearing and helps families find each other, whatever the reception policy."
 EMM_ecw_border_review:0 "Review a Season at the Border"
 EMM_ecw_border_review_desc:0 "The review examines one funded season at the border: arrivals received, families reunited and centres that coped or did not. It counts what happened at the border, not statements about it."
 EMM_ecw_border_settlement:0 "A Border That Can Stay Open"
 EMM_ecw_border_settlement_desc:0 "The settlement keeps the chosen border policy and the register. It makes no claim on Estovakian territory and closes no road permanently. It gives Emmeria a way to receive people from a neighbour's war without improvising each time."
 EMM_ecw_initiative_policy_a_spirit:0 "Preserved initiative records"
 EMM_ecw_initiative_policy_a_spirit_desc:0 "The initiative's records, agreements and technical studies will be preserved by a small staff, ready for the day it can resume. Preservation keeps years of work from being lost, and it costs money for an institution with nothing to do."
 EMM_ecw_initiative_policy_a_spirit_settled:0 "Preserved initiative records: Standing Settlement"
 EMM_ecw_initiative_policy_a_spirit_settled_desc:0 "The settlement fixes what remains of the initiative while it is suspended. It creates no common government and claims no territory. It makes sure that a decision to resume, if one comes, can be made with the initiative's work still in hand. The continuing opportunity cost remains."
 EMM_ecw_initiative_policy_b_spirit:0 "Closed preparatory offices"
 EMM_ecw_initiative_policy_b_spirit_desc:0 "The preparatory offices will close and their staff return to their ministries, with the files archived. Closing saves money and ends an awkward institution, and it means starting again from the archive if the initiative revives."
 EMM_ecw_initiative_policy_b_spirit_settled:0 "Closed preparatory offices: Standing Settlement"
 EMM_ecw_initiative_policy_b_spirit_settled_desc:0 "The settlement fixes what remains of the initiative while it is suspended. It creates no common government and claims no territory. It makes sure that a decision to resume, if one comes, can be made with the initiative's work still in hand. The continuing opportunity cost remains."
 EMM_ecw_initiative_register:0 "The Suspended Initiative"
 EMM_ecw_initiative_register_desc:0 "The Republic of Anea Initiative, prepared since 2004 to unify the continent, has been put on hold because of the strife in Estovakia. Its offices, files and staff remain. The cabinet will decide what to keep while the initiative waits."
 EMM_ecw_initiative_policy_a:0 "Preserve the Initiative's Records"
 EMM_ecw_initiative_policy_a_desc:0 "The initiative's records, agreements and technical studies will be preserved by a small staff, ready for the day it can resume. Preservation keeps years of work from being lost, and it costs money for an institution with nothing to do."
 EMM_ecw_initiative_policy_b:0 "Close the Preparatory Offices"
 EMM_ecw_initiative_policy_b_desc:0 "The preparatory offices will close and their staff return to their ministries, with the files archived. Closing saves money and ends an awkward institution, and it means starting again from the archive if the initiative revives."
 EMM_ecw_initiative_operations:0 "Keep the Technical Contacts"
 EMM_ecw_initiative_operations_desc:0 "Engineers and officials on both sides of the border built working relationships while preparing the initiative. Those contacts can keep water, power and transport links running between the two countries, whatever happens to the initiative itself."
 EMM_ecw_initiative_review:0 "Review the Suspension"
 EMM_ecw_initiative_review_desc:0 "The review examines one funded period under the chosen arrangement: what was preserved, what was lost and which contacts still answer."
 EMM_ecw_initiative_settlement:0 "An Initiative That Can Resume"
 EMM_ecw_initiative_settlement_desc:0 "The settlement fixes what remains of the initiative while it is suspended. It creates no common government and claims no territory. It makes sure that a decision to resume, if one comes, can be made with the initiative's work still in hand."
 ac_ecw_funded_cost:0 "£pol_power 35 / 4 cap"
 ac_ecw_funded_cost_tt:0 "Authorization commits 35 political power and four institutional-capacity points, plus the applicable programme fee below. Spent resources are not refunded when a period is interrupted."
 ac_ecw_fee_macro:0 "Programme fee: 0.002 billion abstract fiscal units."
 ac_ecw_fee_legacy:0 "Programme fee: 2 provisional fiscal units."
 ac_ecw_fee_none:0 "No fiscal fee currently applies. Political and institutional costs remain."
 ac_ecw_eva_services:0 "Estovakia: The Estovakian Civil War"
 ac_ecw_eva_services_desc:0 "Lyes United Front authority: [?ac_ecw_luf_authority|0]/100. Eastern Faction strength: [?ac_ecw_eastern_strength|0]/100. Dates follow the ACES Chronicle; values and alternatives are provisional gameplay.\n\n[ac_ecw_current_service_text]\n[ac_ecw_cooldown_text]\nLatest service return: [?ac_ecw_elapsed|0]/90 days. Completed periods: [?ac_ecw_completed_services|0]. Last interrupted or completed period delivered [?ac_ecw_last_delivered_days|0] days.\n\nAuthority in the Capital: [EVA_capital_ac_ecw_policy_text]\nThe Cities That Resisted: [EVA_cities_ac_ecw_policy_text]\nThe Northeastern Platforms: [EVA_oil_ac_ecw_policy_text]\nThe Unfinished Railgun: [EVA_chandelier_ac_ecw_policy_text]\nTalk Across the Lines: [EVA_talks_ac_ecw_policy_text]\n\nAuthorization commits 35 political power and four institutional-capacity points, plus the applicable programme fee below. Spent resources are not refunded when a period is interrupted.\n[ac_ecw_fee_text]"
 EVA_ecw_cancel_service:0 "End the Current Service Period"
 EVA_ecw_cancel_service_desc:0 "Release the current rota immediately. Funding and institutional effort already spent are not refunded. Delivered time is retained in the record, but the interrupted period cannot unlock a completed-service review."
 ac_ecw_emm_services:0 "Emmeria: The Estovakian Civil War"
 ac_ecw_emm_services_desc:0 "[ac_ecw_current_service_text]\n[ac_ecw_cooldown_text]\nLatest service return: [?ac_ecw_elapsed|0]/90 days. Completed periods: [?ac_ecw_completed_services|0]. Last interrupted or completed period delivered [?ac_ecw_last_delivered_days|0] days.\n\nConditions for Reconstruction Aid: [EMM_aid_ac_ecw_policy_text]\nThe Eastern Border: [EMM_border_ac_ecw_policy_text]\nThe Suspended Initiative: [EMM_initiative_ac_ecw_policy_text]\n\nAuthorization commits 35 political power and four institutional-capacity points, plus the applicable programme fee below. Spent resources are not refunded when a period is interrupted.\n[ac_ecw_fee_text]"
 EMM_ecw_cancel_service:0 "End the Current Service Period"
 EMM_ecw_cancel_service_desc:0 "Release the current rota immediately. Funding and institutional effort already spent are not refunded. Delivered time is retained in the record, but the interrupted period cannot unlock a completed-service review."
 EVA_ecw_opening_public_spirit:0 "Estovakia: An Open Hearing"
 EVA_ecw_opening_public_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 EVA_ecw_opening_ministerial_spirit:0 "Estovakia: A Ministerial Docket"
 EVA_ecw_opening_ministerial_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ac_ecw.100.t:0 "A Capital Under New Command"
 ac_ecw.100.d:0 "The Lyes Faction holds the capital. Its new command has issued instructions to every ministry; some are routine, some are not, and a few contradict each other. The ministers who remain at their desks must decide how to govern under a command much of the country rejects, and how much of that decision to make in public.\n\nOutside the capital, other factions are organising. Nobody in the cabinet room believes this will end quickly."
 ac_ecw.100.a:0 "Open the cabinet's decisions to public questions."
 ac_ecw.100.b:0 "Begin with a protected cabinet docket."
 EMM_ecw_opening_public_spirit:0 "Emmeria: An Open Hearing"
 EMM_ecw_opening_public_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 EMM_ecw_opening_ministerial_spirit:0 "Emmeria: A Ministerial Docket"
 EMM_ecw_opening_ministerial_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ac_ecw.101.t:0 "News from Across the Border"
 ac_ecw.101.d:0 "Reports from Estovakia describe a capital seized by the Lyes Faction and cities that refuse to accept it. Emmeria's aid programmes, its border towns and the Republic of Anea Initiative all depend on a neighbour that may be about to fight itself.\n\nThe cabinet must decide what Emmeria will do, and how openly."
 ac_ecw.101.a:0 "Open the cabinet's response to public questions."
 ac_ecw.101.b:0 "Begin with a protected cabinet docket."
 EVA_capital_ac_ecw_policy_callback_0:0 "The standing policy is accommodation of the factions. Its continuing cost remains part of the allocation."
 EVA_capital_ac_ecw_policy_callback_1:0 "The standing policy is order through suppression. Its continuing cost remains part of the allocation."
 EVA_ecw_capital_reply_public_spirit:0 "Authority in the Capital: Public Return"
 EVA_ecw_capital_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep water, power and pension offices staffed and outside the conflict. Public attention or reserved staff time remains committed to that work."
 EVA_ecw_capital_reply_protected_spirit:0 "Authority in the Capital: Protected Working Return"
 EVA_ecw_capital_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Log every order received and how each office answered it. Public attention or reserved staff time remains committed to that work."
 ac_ecw.110.t:0 "The Order That Was Not Signed"
 ac_ecw.110.d:0 "An order arrives from the capital's new command: close the registry offices in three cities that have refused to recognise it. The registry director reads it twice and does not sign the forwarding slip. Without registries, families in those cities cannot record births, deaths or the property they have lost.\n\nThe director's deputy wants the refusal published, with the reasons, so that other offices know they are not alone. The director fears that a public refusal will bring soldiers to the ministry, and wants the record kept inside, where it can be produced later when someone asks who obeyed and who did not.\n\n[EVA_capital_ac_ecw_policy_callback]"
 ac_ecw.110.a:0 "Publish the refused orders."
 ac_ecw.110.b:0 "Keep the refusals inside the ministry."
 EVA_capital_ac_ecw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EVA_capital_ac_ecw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EVA_capital_ac_ecw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_ecw.140.t:0 "What the Ministries Kept"
 ac_ecw.140.d:0 "The final review is a ledger of instructions and answers. Some orders were carried out; some were delayed until they no longer mattered; a few were refused outright, and the officials who refused are named in the record. The registry offices in the three cities stayed open.\n\nThe review does not say who governs Estovakia. It says what its offices did while the question was being fought, which is what any government that follows will need to know.\n\n[EVA_capital_ac_ecw_report_callback]\n\n[EVA_capital_ac_ecw_policy_callback]"
 ac_ecw.140.a:0 "File the completed service record."
 EVA_cities_ac_ecw_policy_callback_0:0 "The standing policy is civilian protection. Its continuing cost remains part of the allocation."
 EVA_cities_ac_ecw_policy_callback_1:0 "The standing policy is control before relief. Its continuing cost remains part of the allocation."
 EVA_ecw_cities_reply_public_spirit:0 "The Cities That Resisted: Public Return"
 EVA_ecw_cities_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Negotiate passage and run supply convoys to contested cities. Public attention or reserved staff time remains committed to that work."
 EVA_ecw_cities_reply_protected_spirit:0 "The Cities That Resisted: Protected Working Return"
 EVA_ecw_cities_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Staff and supply clinics in cities cut off by the fighting. Public attention or reserved staff time remains committed to that work."
 ac_ecw.111.t:0 "A Convoy at the Checkpoint"
 ac_ecw.111.d:0 "A relief convoy has waited two days at a checkpoint outside a city that refused the capital's authority. The officer in command has orders to let nothing through until the city's council submits. The convoy carries flour, insulin and water purification tablets; the driver's manifest lists them in order of how long the city can last without each.\n\nThe relief office can publish the manifest and the officer's orders, shaming the command into opening the road. Or it can negotiate quietly, trading something the officer's superiors want for a single night's passage that nobody announces.\n\n[EVA_cities_ac_ecw_policy_callback]"
 ac_ecw.111.a:0 "Publish the convoy manifest and the orders."
 ac_ecw.111.b:0 "Negotiate a quiet passage."
 EVA_cities_ac_ecw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EVA_cities_ac_ecw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EVA_cities_ac_ecw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_ecw.141.t:0 "The Convoys That Arrived"
 ac_ecw.141.d:0 "The final review lists the convoys by date, route and outcome. Most arrived, some late; a few were turned back, and the review names the checkpoints that turned them. The city outside which the convoy waited is in the list twice: once for the night it was refused, once for the night it was let through.\n\nThe cities will remember the war differently from the capital. The record gives both a common place to start.\n\n[EVA_cities_ac_ecw_report_callback]\n\n[EVA_cities_ac_ecw_policy_callback]"
 ac_ecw.141.a:0 "File the completed service record."
 EVA_oil_ac_ecw_policy_callback_0:0 "The standing policy is published operating contract. Its continuing cost remains part of the allocation."
 EVA_oil_ac_ecw_policy_callback_1:0 "The standing policy is state custody of the platforms. Its continuing cost remains part of the allocation."
 EVA_ecw_oil_reply_public_spirit:0 "The Northeastern Platforms: Public Return"
 EVA_ecw_oil_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Rotate and pay platform crews with evacuation plans in place. Public attention or reserved staff time remains committed to that work."
 EVA_ecw_oil_reply_protected_spirit:0 "The Northeastern Platforms: Protected Working Return"
 EVA_ecw_oil_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Reconcile production with the revenue paid into the platform account. Public attention or reserved staff time remains committed to that work."
 ac_ecw.112.t:0 "A Helicopter With No Flight Plan"
 ac_ecw.112.d:0 "A helicopter lands on the northernmost platform without a flight plan. The men aboard say they represent the Eastern Faction and ask the crew chief to show them the control room. They are polite, armed and in no hurry. The crew chief radios the corporation's office for instructions.\n\nThe office can tell the crew to cooperate and publish what happened, so that every faction knows the platforms are a civilian workplace. Or it can tell the crew to delay, while the ministry tries to settle the matter with the visitors' commanders out of public view.\n\n[EVA_oil_ac_ecw_policy_callback]"
 ac_ecw.112.a:0 "Tell the crew to cooperate and publish the visit."
 ac_ecw.112.b:0 "Delay and settle it out of public view."
 EVA_oil_ac_ecw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EVA_oil_ac_ecw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EVA_oil_ac_ecw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_ecw.142.t:0 "The Account and the Register"
 ac_ecw.142.d:0 "The final review sets two documents side by side: the revenue account, with every payment in and out, and the crew register, with every person who worked a shift on the platforms. Both are complete. Neither says who controls the northeast today.\n\nThe crew chief who radioed for instructions is in the register. The visit is in the account, as a week of lost production.\n\n[EVA_oil_ac_ecw_report_callback]\n\n[EVA_oil_ac_ecw_policy_callback]"
 ac_ecw.142.a:0 "File the completed service record."
 EVA_chandelier_ac_ecw_policy_callback_0:0 "The standing policy is sealed project. Its continuing cost remains part of the allocation."
 EVA_chandelier_ac_ecw_policy_callback_1:0 "The standing policy is retained research team. Its continuing cost remains part of the allocation."
 EVA_ecw_chandelier_reply_public_spirit:0 "The Unfinished Railgun: Public Return"
 EVA_ecw_chandelier_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep a caretaker staff at the site and the records archived. Public attention or reserved staff time remains committed to that work."
 EVA_ecw_chandelier_reply_protected_spirit:0 "The Unfinished Railgun: Protected Working Return"
 EVA_ecw_chandelier_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep engineers and their families on a protected register with relocation plans. Public attention or reserved staff time remains committed to that work."
 ac_ecw.113.t:0 "A Request for the Blueprints"
 ac_ecw.113.d:0 "A colonel with a letter from the capital's command asks the site's caretaker for a complete set of the Chandelier's blueprints. The letter is signed and stamped; it does not say why. The caretaker knows that two other factions have made similar requests, less politely.\n\nThe ministry can publish the request and its refusal, making clear that the records are in custody and will stay there. Or it can answer each request privately, buying time without announcing to every faction that the blueprints are worth asking for.\n\n[EVA_chandelier_ac_ecw_policy_callback]"
 ac_ecw.113.a:0 "Publish the request and the refusal."
 ac_ecw.113.b:0 "Answer each request privately."
 EVA_chandelier_ac_ecw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EVA_chandelier_ac_ecw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EVA_chandelier_ac_ecw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_ecw.143.t:0 "The Inventory Is Unchanged"
 ac_ecw.143.d:0 "The final custody review is short. The inventory taken at the start matches the inventory taken at the end. The engineers on the register are all accounted for; two have moved abroad with the ministry's help. The site has had visitors, and none of them left with anything.\n\nThe review is careful about what it does not claim. The railgun is unfinished, as it was when Ulysses arrived. What happens to it next is a decision for a government that does not yet exist.\n\n[EVA_chandelier_ac_ecw_report_callback]\n\n[EVA_chandelier_ac_ecw_policy_callback]"
 ac_ecw.143.a:0 "File the completed service record."
 EVA_talks_ac_ecw_policy_callback_0:0 "The standing policy is negotiated settlement course. Its continuing cost remains part of the allocation."
 EVA_talks_ac_ecw_policy_callback_1:0 "The standing policy is waiting for the decisive battle. Its continuing cost remains part of the allocation."
 EVA_ecw_talks_reply_public_spirit:0 "Talk Across the Lines: Public Return"
 EVA_ecw_talks_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Fund intermediaries and local ceasefire contacts across the lines. Public attention or reserved staff time remains committed to that work."
 EVA_ecw_talks_reply_protected_spirit:0 "Talk Across the Lines: Protected Working Return"
 EVA_ecw_talks_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Compile lists of prisoners, missing persons and damaged property. Public attention or reserved staff time remains committed to that work."
 ac_ecw.114.t:0 "A Ceasefire in One Valley"
 ac_ecw.114.d:0 "In a valley between two front lines, local commanders have agreed to stop shooting for the harvest. Nobody in the capital authorised it, and nobody in the Eastern Faction's command has denied it. The farmers are bringing in the crop. An official who knows both commanders asks the ministry what to do.\n\nThe ministry can publicise the ceasefire as proof that talks can work, risking orders from either side to end it. Or it can protect it quietly, telling no one beyond the officials who need to know, and hope it lasts long enough to become a habit.\n\n[EVA_talks_ac_ecw_policy_callback]"
 ac_ecw.114.a:0 "Publicise the valley ceasefire."
 ac_ecw.114.b:0 "Protect it quietly."
 EVA_talks_ac_ecw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EVA_talks_ac_ecw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EVA_talks_ac_ecw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_ecw.144.t:0 "Lists for the Peace"
 ac_ecw.144.d:0 "The final review contains the lists: prisoners by name and location, missing persons by last known whereabouts, property by district and condition. They are incomplete, and the review says where. They are also the only lists of their kind that every faction has agreed to read.\n\nThe valley ceasefire is in the record. It lasted through two harvests.\n\n[EVA_talks_ac_ecw_report_callback]\n\n[EVA_talks_ac_ecw_policy_callback]"
 ac_ecw.144.a:0 "File the completed service record."
 EMM_aid_ac_ecw_policy_callback_0:0 "The standing policy is conditional aid with monitors. Its continuing cost remains part of the allocation."
 EMM_aid_ac_ecw_policy_callback_1:0 "The standing policy is aid withheld until the fighting ends. Its continuing cost remains part of the allocation."
 EMM_ecw_aid_reply_public_spirit:0 "Conditions for Reconstruction Aid: Public Return"
 EMM_ecw_aid_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Pay independent monitors to inspect aid deliveries in Estovakia. Public attention or reserved staff time remains committed to that work."
 EMM_ecw_aid_reply_protected_spirit:0 "Conditions for Reconstruction Aid: Protected Working Return"
 EMM_ecw_aid_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Deliver clinic, water and school supplies to named projects. Public attention or reserved staff time remains committed to that work."
 ac_ecw.115.t:0 "The Monitor's Report"
 ac_ecw.115.d:0 "An aid monitor's report arrives with photographs of a warehouse in an Estovakian city. The flour in it was shipped for a school feeding programme. The soldiers guarding it belong to the capital's command, and the school has received nothing for a month.\n\nThe aid office can publish the report, which will force the cabinet to suspend the programme. Or it can raise the matter privately with the capital, hoping to get the flour to the school without ending the only channel Emmeria still has.\n\n[EMM_aid_ac_ecw_policy_callback]"
 ac_ecw.115.a:0 "Publish the monitor's report."
 ac_ecw.115.b:0 "Raise it privately with the capital."
 EMM_aid_ac_ecw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EMM_aid_ac_ecw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EMM_aid_ac_ecw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_ecw.145.t:0 "An Account of What Emmeria Gave"
 ac_ecw.145.d:0 "The final review lists every programme Emmeria funded in Estovakia during the war, what each delivered and how each ended. Some ended because the fighting reached them. Some ended because the monitors found the aid going to the wrong people. The review does not soften either.\n\nThe school in the photographs is in the list. Its feeding programme resumed, then stopped again, and the record says why both times.\n\n[EMM_aid_ac_ecw_report_callback]\n\n[EMM_aid_ac_ecw_policy_callback]"
 ac_ecw.145.a:0 "File the completed service record."
 EMM_border_ac_ecw_policy_callback_0:0 "The standing policy is open reception centres. Its continuing cost remains part of the allocation."
 EMM_border_ac_ecw_policy_callback_1:0 "The standing policy is controlled crossing points. Its continuing cost remains part of the allocation."
 EMM_ecw_border_reply_public_spirit:0 "The Eastern Border: Public Return"
 EMM_ecw_border_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Run shelter, food and medical care at the border centres. Public attention or reserved staff time remains committed to that work."
 EMM_ecw_border_reply_protected_spirit:0 "The Eastern Border: Protected Working Return"
 EMM_ecw_border_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Register arrivals and trace missing family members. Public attention or reserved staff time remains committed to that work."
 ac_ecw.116.t:0 "A Bus With No Papers"
 ac_ecw.116.d:0 "A bus reaches the border crossing at night with forty people aboard and no papers among them. The driver says they are from a city that has been shelled for weeks; two passengers say they are soldiers who left their unit. The border officer has room for twenty in the reception centre and instructions that do not cover this.\n\nThe interior ministry can admit everyone and publish the case, pressing the cabinet for more capacity. Or it can admit the families, hold the soldiers for screening, and deal with the case without a public argument about the border.\n\n[EMM_border_ac_ecw_policy_callback]"
 ac_ecw.116.a:0 "Admit everyone and publish the case."
 ac_ecw.116.b:0 "Admit the families and screen the soldiers quietly."
 EMM_border_ac_ecw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EMM_border_ac_ecw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EMM_border_ac_ecw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_ecw.146.t:0 "The Register at the Border"
 ac_ecw.146.d:0 "The final review is built from the register: names, dates, points of origin and the families who found each other through it. The bus that arrived at night is there, all forty people, with what became of each.\n\nThe border towns carried more than their share. The review says so, and names what the cabinet did and did not send them.\n\n[EMM_border_ac_ecw_report_callback]\n\n[EMM_border_ac_ecw_policy_callback]"
 ac_ecw.146.a:0 "File the completed service record."
 EMM_initiative_ac_ecw_policy_callback_0:0 "The standing policy is preserved initiative records. Its continuing cost remains part of the allocation."
 EMM_initiative_ac_ecw_policy_callback_1:0 "The standing policy is closed preparatory offices. Its continuing cost remains part of the allocation."
 EMM_ecw_initiative_reply_public_spirit:0 "The Suspended Initiative: Public Return"
 EMM_ecw_initiative_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep a small staff preserving the initiative's files and studies. Public attention or reserved staff time remains committed to that work."
 EMM_ecw_initiative_reply_protected_spirit:0 "The Suspended Initiative: Protected Working Return"
 EMM_ecw_initiative_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep cross-border engineering contacts working on shared services. Public attention or reserved staff time remains committed to that work."
 ac_ecw.117.t:0 "Boxes in the Corridor"
 ac_ecw.117.d:0 "The preparatory agency's corridor is lined with boxes: treaty drafts, survey maps, the minutes of hundreds of meetings. The building's lease ends next month. A junior official has made an index of everything, on her own time, and asks the ministry what happens to it.\n\nThe ministry can publish the index, so that anyone in either country can see what the initiative produced and argue for keeping it. Or it can transfer the boxes quietly to a government archive, where they will be safe and largely forgotten.\n\n[EMM_initiative_ac_ecw_policy_callback]"
 ac_ecw.117.a:0 "Publish the index."
 ac_ecw.117.b:0 "Transfer the boxes quietly."
 EMM_initiative_ac_ecw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EMM_initiative_ac_ecw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EMM_initiative_ac_ecw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_ecw.147.t:0 "The Index"
 ac_ecw.147.d:0 "The final review attaches the junior official's index, now complete. It lists what was preserved, what was archived and what was lost when the offices moved. The technical contacts are listed too: the engineers on both sides who still answer each other's calls.\n\nThe initiative remains suspended. Its work does not.\n\n[EMM_initiative_ac_ecw_report_callback]\n\n[EMM_initiative_ac_ecw_policy_callback]"
 ac_ecw.147.a:0 "File the completed service record."
