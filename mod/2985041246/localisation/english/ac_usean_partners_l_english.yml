 UGE_up_release_reserve:0 "Release: Lease a Readiness Reserve Slot"
 UGE_up_release_reserve_desc:0 "Release this service commitment to free its occupied slot. Its political, administrative and fiscal costs are not refunded, and no completion credit is awarded. Another lease still requires a new funded allocation."
 SNS_up_offer_service:0 "Offer a Bounded Service to Central Usea"
 SNS_up_offer_service_desc:0 "Pay for a once-only founding offer with sixty days for the recipient to respond. Both countries must remain independent, present, uncapitulated and not at war with each other. Amber commits one funded slot; refusal or expiry returns that slot but does not refund political or fiscal costs. No military alignment is granted."
 ac_up.101.t:0 "San Salvacion: A Bounded Service Offer"
 ac_up.101.d:0 "San Salvacion has offered a defined civil service, with its own administrative cost already paid. Acceptance records a practical relationship and limited recovery work; it is not a request to create another faction, decide the war or commit unlimited capacity. The offer lapses if either participant becomes ineligible. A refusal leaves the sender with a domestic programme to pursue."
 ac_up.101.a:0 "Accept the bounded service and its receiving obligations."
 ac_up.101.b:0 "Decline; our receiving capacity is committed elsewhere."
