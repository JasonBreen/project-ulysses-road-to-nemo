l_english:
 ac_fsb_participant_tt:0 "The current country is FATO or South Belka under its own established identity."
 ac_fsb_active_tt:0 "The national administration is registered, present, not capitulated and able to administer at least one fully controlled owned state."
 ac_fsb_can_fund_tt:0 "The public programme fee can be paid: 0.002 abstract billion in full mode or 2 fiscal units in experimental mode. Disabled fiscal rules require no cash."
 ac_fsb_cost_tt:0 "Where enabled, pay the public programme fee (0.002 abstract billion in full mode; 2 legacy fiscal units in experimental mode). Disabled fiscal rules require no cash. Political power, institutional capacity and any listed physical stock remain real costs. No balance conversion is implied."
 fat_national_campaign:0 "FATO: Authorisations and obligations"
 fat_national_campaign_desc:0 "National choices, practical obligations and a later review of the authority actually held. Standing policies have continuing burdens; foreign cooperation requires consent and useful domestic work remains available."
 FAT_nat_accounts_at_the_gate:0 "Accounts at the Gate"
 FAT_nat_accounts_at_the_gate_desc:0 "The freight works has three requisitions and enough wagons for two. The clerk asks which signature carries the authority to turn the third away. Before promising anything abroad, the government must decide how its own factories are heard.\n\nOpening allocation hearing chooses a public or executive accounting procedure. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_accounts_at_the_gate_done:0 "Accounts at the Gate completed"
 FAT_nat_accounts_at_the_gate_tt:0 "Opening allocation hearing chooses a public or executive accounting procedure."
 FAT_nat_civilian_priority:0 "Protect the Civilian Order Book"
 FAT_nat_civilian_priority_desc:0 "A replacement pump rarely looks urgent beside a military requisition. Yet missed civilian orders close workshops and send skilled people elsewhere. Reserve a share of production for those contracts, accepting the cost to the armament schedule.\n\nEnduring civilian priority: construction and stability, with a military-output cost. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_civilian_priority_done:0 "Protect the Civilian Order Book completed"
 FAT_nat_civilian_priority_tt:0 "Enduring civilian priority: construction and stability, with a military-output cost."
 ac_fsb_fat_civilian_priority:0 "Protect the Civilian Order Book"
 ac_fsb_fat_civilian_priority_desc:0 "A replacement pump rarely looks urgent beside a military requisition. Yet missed civilian orders close workshops and send skilled people elsewhere. Reserve a share of production for those contracts, accepting the cost to the armament schedule."
 FAT_nat_plant_priority:0 "The Plant Comes First"
 FAT_nat_plant_priority_desc:0 "Managers argue that full military order books keep the whole industrial district employed. They offer a tighter production schedule, provided civilian customers accept longer waits. The government can back that bargain without pretending the postponed work disappears.\n\nAlternative industrial priority: military output with consumer and stability burdens. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_plant_priority_done:0 "The Plant Comes First completed"
 FAT_nat_plant_priority_tt:0 "Alternative industrial priority: military output with consumer and stability burdens."
 ac_fsb_fat_plant_priority:0 "The Plant Comes First"
 ac_fsb_fat_plant_priority_desc:0 "Managers argue that full military order books keep the whole industrial district employed. They offer a tighter production schedule, provided civilian customers accept longer waits. The government can back that bargain without pretending the postponed work disappears."
 FAT_nat_invoice_rules:0 "An Invoice Must Name Its Author"
 FAT_nat_invoice_rules_desc:0 "A requisition stamped by three offices can still belong to none of them. Require an identifiable author and a reason for every exceptional order. An audit will cost staff time; its findings will also make a withdrawal defensible.\n\nUnlock a paid invoice audit that improves institutional capacity and records an inspected warrant. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_invoice_rules_done:0 "An Invoice Must Name Its Author completed"
 FAT_nat_invoice_rules_tt:0 "Unlock a paid invoice audit that improves institutional capacity and records an inspected warrant."
 FAT_nat_labour_bench:0 "A Place for the Workshop Delegate"
 FAT_nat_labour_bench_desc:0 "The wage clerk knows when a nominally spare shift is already exhausted. Give workshop delegates access to the allocation meeting. Their presence slows an order down but permits a genuine negotiated maintenance interval.\n\nUnlock a negotiated maintenance interval, exchanging current output for reliability. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_labour_bench_done:0 "A Place for the Workshop Delegate completed"
 FAT_nat_labour_bench_tt:0 "Unlock a negotiated maintenance interval, exchanging current output for reliability."
 FAT_nat_reserve_floor:0 "The Reserve Is Not a Promise"
 FAT_nat_reserve_floor_desc:0 "An unopened crate in a warehouse is not automatically available to an ally. The quartermaster wants a published domestic floor beneath every shipment. Keeping that floor makes smaller offers credible and prevents a signature from consuming the last replacement batch.\n\nRequire a larger domestic infantry reserve before delivery; unlock a smaller emergency consignment. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_reserve_floor_done:0 "The Reserve Is Not a Promise completed"
 FAT_nat_reserve_floor_tt:0 "Require a larger domestic infantry reserve before delivery; unlock a smaller emergency consignment."
 FAT_nat_border_book:0 "The Border Accounts"
 FAT_nat_border_book_desc:0 "The existing border leaves the customs desk with inherited ledgers, disputed invoices and ordinary traffic. The question before the ministry is administrative: accept locally checked receipts, or hold every exception for a central signature. Neither choice redraws a frontier.\n\nChoose local verification or central review of existing border accounts. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_border_book_done:0 "The Border Accounts completed"
 FAT_nat_border_book_tt:0 "Choose local verification or central review of existing border accounts."
 FAT_nat_route_contract:0 "Contract for the Journey"
 FAT_nat_route_contract_desc:0 "A promised truck is useful only if somebody has reserved its journey and its replacement. Put transport on its own warrant instead of hiding it inside a general promise. Vehicles must leave a real stockpile when the delivery is made.\n\nUnlock stock-backed motor-transport warrants. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_route_contract_done:0 "Contract for the Journey completed"
 FAT_nat_route_contract_tt:0 "Unlock stock-backed motor-transport warrants."
 FAT_nat_partner_register:0 "A Register of Willing Recipients"
 FAT_nat_partner_register_desc:0 "A neighbouring government is entitled to decline. Contact the existing authorities in Gebet, Recta and Osea through a written offer that specifies its stock and deadline. These contacts are practical arrangements and confer no faction membership.\n\nUnlock bounded requests to three eligible existing partners, with receiver consent. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_partner_register_done:0 "A Register of Willing Recipients completed"
 FAT_nat_partner_register_tt:0 "Unlock bounded requests to three eligible existing partners, with receiver consent."
 FAT_nat_consent_clause:0 "Consent Survives the Signature"
 FAT_nat_consent_clause_desc:0 "An acceptance made before a crisis may no longer fit the receiver's circumstances. Give each authority a visible right to revoke before dispatch. Extend the response period, but require a fresh check of both governments at delivery.\n\nAllow a longer consent window and recipient revocation; no automatic delivery. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_consent_clause_done:0 "Consent Survives the Signature completed"
 FAT_nat_consent_clause_tt:0 "Allow a longer consent window and recipient revocation; no automatic delivery."
 FAT_nat_shopfloor_ballot:0 "The Shift Meeting"
 FAT_nat_shopfloor_ballot_desc:0 "A voluntary extra shift needs more than a ministerial slogan. Let the plant committee negotiate its duration and rest period. A limited productivity campaign can then be authorised without making permanent emergency hours the default.\n\nUnlock a paid, temporary negotiated extra shift with an explicit rest cooldown. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_shopfloor_ballot_done:0 "The Shift Meeting completed"
 FAT_nat_shopfloor_ballot_tt:0 "Unlock a paid, temporary negotiated extra shift with an explicit rest cooldown."
 FAT_nat_rolling_gauges:0 "The Rolling Gauges"
 FAT_nat_rolling_gauges_desc:0 "Dispatchers report that the delay lies in maintenance and incompatible paperwork, not an absence of grand plans. A modest inspection of loading procedures can improve the use of the routes already owned. No new track is conjured by the report.\n\nUnlock a temporary loading-efficiency allocation that reserves a civilian factory. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_rolling_gauges_done:0 "The Rolling Gauges completed"
 FAT_nat_rolling_gauges_tt:0 "Unlock a temporary loading-efficiency allocation that reserves a civilian factory."
 FAT_nat_spare_batch:0 "A Batch That Can Be Spared"
 FAT_nat_spare_batch_desc:0 "An infantry consignment will be written as a quantity, not a percentage of whatever happens to be in store. The quartermaster may refuse dispatch if the domestic reserve has fallen. An accepted request is permission to deliver, never permission to invent equipment.\n\nUnlock fixed infantry-equipment warrants backed by actual stock. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_spare_batch_done:0 "A Batch That Can Be Spared completed"
 FAT_nat_spare_batch_tt:0 "Unlock fixed infantry-equipment warrants backed by actual stock."
 FAT_nat_testing_bench:0 "Before the Crate Is Sealed"
 FAT_nat_testing_bench_desc:0 "Support equipment ties several workshops to a single shipment. Separate its warrant from the infantry order and record the inspection before it leaves. The recipient can ask for this practical assistance without accepting a broader military commitment.\n\nUnlock a separate support-equipment warrant with its own stock test. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_testing_bench_done:0 "Before the Crate Is Sealed completed"
 FAT_nat_testing_bench_tt:0 "Unlock a separate support-equipment warrant with its own stock test."
 FAT_nat_delivery_ledger:0 "Two Open Commitments"
 FAT_nat_delivery_ledger_desc:0 "The clerk can reconcile a second open obligation if each has its own due date and recipient. Anything beyond that should wait. This is a staffing limit, not a claim that two pieces of paper provide two factories.\n\nRaise the maximum simultaneous pending or accepted warrants from one to two. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_delivery_ledger_done:0 "Two Open Commitments completed"
 FAT_nat_delivery_ledger_tt:0 "Raise the maximum simultaneous pending or accepted warrants from one to two."
 FAT_nat_no_blank_cheques:0 "No Blank Cheques"
 FAT_nat_no_blank_cheques_desc:0 "A ministry must be able to say that an order has become impossible. Publish a cancellation procedure before using it. Withdrawal still closes the warrant and its consent; a clerk cannot quietly reuse the same signature on another delivery.\n\nAllow costless administrative withdrawal of an unfulfilled warrant. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_no_blank_cheques_done:0 "No Blank Cheques completed"
 FAT_nat_no_blank_cheques_tt:0 "Allow costless administrative withdrawal of an unfulfilled warrant."
 FAT_nat_domestic_dispatch:0 "Dispatch to Our Own Depots"
 FAT_nat_domestic_dispatch_desc:0 "When no foreign request fits, the loading gang can still move a real consignment to domestic training depots. That decision consumes replacements now in exchange for a limited training programme. It is useful in neutrality and under external supervision alike.\n\nUnlock a domestic training allocation that consumes infantry stock instead of donating it. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_domestic_dispatch_done:0 "Dispatch to Our Own Depots completed"
 FAT_nat_domestic_dispatch_tt:0 "Unlock a domestic training allocation that consumes infantry stock instead of donating it."
 FAT_nat_signed_ceiling:0 "The Signed Ceiling"
 FAT_nat_signed_ceiling_desc:0 "The completed schedule reaches the minister with an uncomfortable blank at the bottom: what happens when every request is described as essential? Choose a published ceiling or an emergency exception that must be reviewed in public.\n\nChoose a restraint rule or a time-limited emergency authorisation. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_signed_ceiling_done:0 "The Signed Ceiling completed"
 FAT_nat_signed_ceiling_tt:0 "Choose a restraint rule or a time-limited emergency authorisation."
 FAT_nat_wartime_return:0 "The Return from the Works"
 FAT_nat_wartime_return_desc:0 "Whether the expected war came or was avoided, the works report the orders actually received. Ministers cannot balance the account with a victory they did not win. The next allocation must fit the present country, its obligations and the people doing the work.\n\nAssess an actual war, peaceful or subject context and choose a production burden. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_wartime_return_done:0 "The Return from the Works completed"
 FAT_nat_wartime_return_tt:0 "Assess an actual war, peaceful or subject context and choose a production burden."
 FAT_nat_essential_quota:0 "An Essential Civilian Quota"
 FAT_nat_essential_quota_desc:0 "Keep a protected list for pumps, tools and replacement parts even when other ministries press for output. The list binds the allocation office itself. It helps ordinary repairs but takes an enduring share of industrial effort.\n\nReplace the initial priority with protected repair capacity and lower military output. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_essential_quota_done:0 "An Essential Civilian Quota completed"
 FAT_nat_essential_quota_tt:0 "Replace the initial priority with protected repair capacity and lower military output."
 ac_fsb_fat_essential_quota:0 "An Essential Civilian Quota"
 ac_fsb_fat_essential_quota_desc:0 "Keep a protected list for pumps, tools and replacement parts even when other ministries press for output. The list binds the allocation office itself. It helps ordinary repairs but takes an enduring share of industrial effort."
 FAT_nat_surge_quota:0 "The Limited Surge Schedule"
 FAT_nat_surge_quota_desc:0 "The emergency schedule will have an end and a visible cost. Plants receive priority for military deliveries, while households bear the delayed civilian work. Choose that burden openly rather than describing it as free efficiency.\n\nAlternative industrial surge policy with consumer and political burdens. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_surge_quota_done:0 "The Limited Surge Schedule completed"
 FAT_nat_surge_quota_tt:0 "Alternative industrial surge policy with consumer and political burdens."
 ac_fsb_fat_surge_quota:0 "The Limited Surge Schedule"
 ac_fsb_fat_surge_quota_desc:0 "The emergency schedule will have an end and a visible cost. Plants receive priority for military deliveries, while households bear the delayed civilian work. Choose that burden openly rather than describing it as free efficiency."
 FAT_nat_neutrality_file:0 "Keep a Neutrality File"
 FAT_nat_neutrality_file_desc:0 "A refusal to enter a new commitment should leave a paper trail, not a silent desk. Publish which domestic contracts are protected when a foreign request is declined. The same procedure remains useful if another power controls external relations.\n\nUnlock domestic conversion of a refused or withdrawn offer, with real domestic stock expenditure. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_neutrality_file_done:0 "Keep a Neutrality File completed"
 FAT_nat_neutrality_file_tt:0 "Unlock domestic conversion of a refused or withdrawn offer, with real domestic stock expenditure."
 FAT_nat_refugee_freight:0 "A Freight Slot for Relief"
 FAT_nat_refugee_freight_desc:0 "Relief planners ask for trucks and loading time rather than an invented border settlement. Their allocation must compete with military haulage. A paid transport interval can reduce local supply losses without claiming that every displaced family has been resettled.\n\nUnlock a relief freight allocation consuming motor stock and civilian capacity. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_refugee_freight_done:0 "A Freight Slot for Relief completed"
 FAT_nat_refugee_freight_tt:0 "Unlock a relief freight allocation consuming motor stock and civilian capacity."
 FAT_nat_host_capacity:0 "Room Behind the Platform"
 FAT_nat_host_capacity_desc:0 "The arrivals hall needs clerks, medical space and a quiet waiting room. A temporary hosting allocation supports the people already present. It promises neither new population nor a permanent territorial reward.\n\nUnlock a temporary civil reception allocation with consumer-goods cost. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_host_capacity_done:0 "Room Behind the Platform completed"
 FAT_nat_host_capacity_tt:0 "Unlock a temporary civil reception allocation with consumer-goods cost."
 FAT_nat_requisition_window:0 "The First Refused Requisition"
 FAT_nat_requisition_window_desc:0 "The receiver has returned the papers unsigned. Some in the ministry call this an insult; the dispatch clerk calls it an answer. Decide whether to publish the refusal and reserve the batch domestically, or reopen a narrower discussion later.\n\nA refusal scene chooses domestic finality or a costed fresh request procedure. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_requisition_window_done:0 "The First Refused Requisition completed"
 FAT_nat_requisition_window_tt:0 "A refusal scene chooses domestic finality or a costed fresh request procedure."
 FAT_nat_arbitration_desk:0 "A Smaller Request"
 FAT_nat_arbitration_desk_desc:0 "The original quantity may have been wrong for both parties. Permit a smaller infantry consignment when the domestic reserve rule is in force. A new request still needs new consent and cannot revive the expired signature.\n\nUnlock the smaller stock-backed infantry warrant as an alternative quantity. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_arbitration_desk_done:0 "A Smaller Request completed"
 FAT_nat_arbitration_desk_tt:0 "Unlock the smaller stock-backed infantry warrant as an alternative quantity."
 FAT_nat_three_signatures:0 "The Third Signature"
 FAT_nat_three_signatures_desc:0 "Three simultaneous obligations are now possible, provided each names a responsible office. This is the outer limit of the staff available. A fourth request must wait even if it would be politically convenient to accept it.\n\nRaise the open-warrant ceiling to three; the ceiling never grows further. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_three_signatures_done:0 "The Third Signature completed"
 FAT_nat_three_signatures_tt:0 "Raise the open-warrant ceiling to three; the ceiling never grows further."
 FAT_nat_exhausted_shifts:0 "Listen to the Exhausted Shift"
 FAT_nat_exhausted_shifts_desc:0 "The plant can finish the current batch by borrowing against next month's health. Workers ask for a maintenance pause instead. Authorise the pause and accept a present output loss in return for safer training and equipment care.\n\nUnlock a rest-and-inspection alternative that cannot overlap an extra shift. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_exhausted_shifts_done:0 "Listen to the Exhausted Shift completed"
 FAT_nat_exhausted_shifts_tt:0 "Unlock a rest-and-inspection alternative that cannot overlap an extra shift."
 FAT_nat_family_accounts:0 "The Invoices at Home"
 FAT_nat_family_accounts_desc:0 "The settlement is signed elsewhere, but household invoices arrive here. A peaceful outcome still leaves deferred maintenance, and occupation adds another authority to the desk. Choose whose unpaid work the local review will hear first.\n\nSettlement or peaceful domestic assessment chooses repair priorities without altering war outcomes. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_family_accounts_done:0 "The Invoices at Home completed"
 FAT_nat_family_accounts_tt:0 "Settlement or peaceful domestic assessment chooses repair priorities without altering war outcomes."
 FAT_nat_relief_quota:0 "Relief without a New Treaty"
 FAT_nat_relief_quota_desc:0 "The existing reconstruction authorities own their settlement and relief accounts. The national office can fund its own reception work alongside them. Read the response already chosen; do not claim the same reconstruction award a second time.\n\nUnlock an enhanced local reception allocation only after the owning postwar response, or a peaceful substitute. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_relief_quota_done:0 "Relief without a New Treaty completed"
 FAT_nat_relief_quota_tt:0 "Unlock an enhanced local reception allocation only after the owning postwar response, or a peaceful substitute."
 FAT_nat_inventory_recovery:0 "Recover the Maintenance Margin"
 FAT_nat_inventory_recovery_desc:0 "Support stores can keep equipment in service instead of leaving another shipment on the quay. A domestic maintenance allocation consumes those stores explicitly. It is not a returning foreign gift and does not replenish the warehouse by decree.\n\nUnlock support-stock expenditure for a bounded maintenance benefit. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_inventory_recovery_done:0 "Recover the Maintenance Margin completed"
 FAT_nat_inventory_recovery_tt:0 "Unlock support-stock expenditure for a bounded maintenance benefit."
 FAT_nat_civilian_consignment:0 "The Civilian Consignment"
 FAT_nat_civilian_consignment_desc:0 "A consignment reserved at home should have a destination and an expiry just like a foreign warrant. Give training depots and repair teams a published choice. The allocation cannot use the same stock twice.\n\nAllow domestic support allocation as an alternative to infantry training. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_civilian_consignment_done:0 "The Civilian Consignment completed"
 FAT_nat_civilian_consignment_tt:0 "Allow domestic support allocation as an alternative to infantry training."
 FAT_nat_audited_settlement:0 "An Audited Settlement Account"
 FAT_nat_audited_settlement_desc:0 "The public hearing can inspect what the national office actually promised. It cannot rewrite a treaty or award reparations from an absent treasury. Decide whether to close disputed invoices or keep a costed inspection staff at work.\n\nChoose a closed local settlement file or continuing independent scrutiny. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_audited_settlement_done:0 "An Audited Settlement Account completed"
 FAT_nat_audited_settlement_tt:0 "Choose a closed local settlement file or continuing independent scrutiny."
 FAT_nat_occupation_liaison:0 "A Desk under Supervision"
 FAT_nat_occupation_liaison_desc:0 "External supervision limits what a national office can promise abroad. A liaison desk can still protect local repair schedules and record conflicting instructions. Its practical value does not depend on winning permission for an independent foreign policy.\n\nUnlock a subject-compatible civil liaison; independent countries use the same desk for domestic coordination. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_occupation_liaison_done:0 "A Desk under Supervision completed"
 FAT_nat_occupation_liaison_tt:0 "Unlock a subject-compatible civil liaison; independent countries use the same desk for domestic coordination."
 FAT_nat_unbroken_production:0 "Keep the Existing Lines Running"
 FAT_nat_unbroken_production_desc:0 "The works ask for a reliable maintenance cycle rather than another factory built on paper. A bounded continuity allocation improves current efficiency retention. It consumes administrative attention and leaves the physical production budget unchanged.\n\nUnlock a production-retention allocation with staff and fiscal opportunity costs. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_unbroken_production_done:0 "Keep the Existing Lines Running completed"
 FAT_nat_unbroken_production_tt:0 "Unlock a production-retention allocation with staff and fiscal opportunity costs."
 FAT_nat_local_obligation_register:0 "The Obligations that Remain"
 FAT_nat_local_obligation_register_desc:0 "The current register must make sense after victory, defeat, a refused request or an avoided war. Close the external account that no longer fits and keep the domestic permissions already earned. The next government should inherit a limit, not an impossible promise.\n\nUnlock a once-only reconciliation of current warrants and a domestic institutional review. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_local_obligation_register_done:0 "The Obligations that Remain completed"
 FAT_nat_local_obligation_register_tt:0 "Unlock a once-only reconciliation of current warrants and a domestic institutional review."
 FAT_nat_renewal_hearing:0 "Renew the Mandate in Public"
 FAT_nat_renewal_hearing_desc:0 "The later review is not a replay of the old emergency. Delegates ask which obligations still serve a purpose and which survive only because nobody owns the cancellation form. Open a new hearing with the actual register on the table.\n\n2006 renewal scene selects scrutiny or a bounded executive mandate. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_renewal_hearing_done:0 "Renew the Mandate in Public completed"
 FAT_nat_renewal_hearing_tt:0 "2006 renewal scene selects scrutiny or a bounded executive mandate."
 FAT_nat_open_tenders:0 "Publish the Tender"
 FAT_nat_open_tenders_desc:0 "Publishing a tender invites objections before the order is placed. It slows exceptional procurement but protects ordinary access to the works. Accept that delay as an enduring rule instead of treating openness as a free output bonus.\n\nStanding open-procurement policy with industrial and political tradeoffs. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_open_tenders_done:0 "Publish the Tender completed"
 FAT_nat_open_tenders_tt:0 "Standing open-procurement policy with industrial and political tradeoffs."
 ac_fsb_fat_open_tenders:0 "Publish the Tender"
 ac_fsb_fat_open_tenders_desc:0 "Publishing a tender invites objections before the order is placed. It slows exceptional procurement but protects ordinary access to the works. Accept that delay as an enduring rule instead of treating openness as a free output bonus."
 FAT_nat_directed_orders:0 "A Directed Order Book"
 FAT_nat_directed_orders_desc:0 "A single coordinating office can move priority orders quickly. Its instructions must also name the civilian work being displaced. The policy concentrates authority and output while carrying a continuing public burden.\n\nAlternative directed-procurement policy with a consumer and legitimacy cost. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_directed_orders_done:0 "A Directed Order Book completed"
 FAT_nat_directed_orders_tt:0 "Alternative directed-procurement policy with a consumer and legitimacy cost."
 ac_fsb_fat_directed_orders:0 "A Directed Order Book"
 ac_fsb_fat_directed_orders_desc:0 "A single coordinating office can move priority orders quickly. Its instructions must also name the civilian work being displaced. The policy concentrates authority and output while carrying a continuing public burden."
 FAT_nat_contract_appeal:0 "An Appeal before Dispatch"
 FAT_nat_contract_appeal_desc:0 "A recipient or workshop should not have to wait for a failed delivery before objecting. Permit an appeal while stock is still at home. The appeal cancels consent and demands a new request; it does not undo a completed shipment.\n\nAllow withdrawal after acceptance without a penalty; completed deliveries remain final. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_contract_appeal_done:0 "An Appeal before Dispatch completed"
 FAT_nat_contract_appeal_tt:0 "Allow withdrawal after acceptance without a penalty; completed deliveries remain final."
 FAT_nat_supplier_liability:0 "The Supplier Must Answer"
 FAT_nat_supplier_liability_desc:0 "The failed component reaches the hearing before the supplier's explanation does. An inspection can cost more than the replacement itself, but ignoring the failure shifts the burden to the next crew. Choose how liability will be recorded.\n\nProcurement failure scene chooses a paid independent inspection or a disclosed limited repair. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_supplier_liability_done:0 "The Supplier Must Answer completed"
 FAT_nat_supplier_liability_tt:0 "Procurement failure scene chooses a paid independent inspection or a disclosed limited repair."
 FAT_nat_skilled_shift:0 "Retain the Skilled Shift"
 FAT_nat_skilled_shift_desc:0 "Training a replacement crew does not recreate the workers who left. Offer a limited retention interval tied to maintenance and instruction. The payroll and civilian cost remain visible while the production lines continue using their existing equipment.\n\nUnlock a skill-retention allocation; it competes with the existing production interval. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_skilled_shift_done:0 "Retain the Skilled Shift completed"
 FAT_nat_skilled_shift_tt:0 "Unlock a skill-retention allocation; it competes with the existing production interval."
 FAT_nat_domestic_veto:0 "The Domestic Veto"
 FAT_nat_domestic_veto_desc:0 "The national office must be able to stop every undelivered external commitment when domestic conditions change. Publish a single suspension order. It clears permissions and staff limits; it does not claw equipment back from a receiver.\n\nUnlock immediate cancellation of all unfulfilled warrants and return to domestic work. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_domestic_veto_done:0 "The Domestic Veto completed"
 FAT_nat_domestic_veto_tt:0 "Unlock immediate cancellation of all unfulfilled warrants and return to domestic work."
 FAT_nat_joint_inspection:0 "Invite a Receiving Inspector"
 FAT_nat_joint_inspection_desc:0 "The receiver may prefer inspection to a larger shipment. Permit a narrow, optional inspection at the dispatch desk. Acceptance grants a longer practical training benefit only if both sides agree to that specific form of cooperation.\n\nUnlock recipient choice of inspected cooperation rather than automatic extra stock. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_joint_inspection_done:0 "Invite a Receiving Inspector completed"
 FAT_nat_joint_inspection_tt:0 "Unlock recipient choice of inspected cooperation rather than automatic extra stock."
 FAT_nat_independent_audit:0 "The Auditor Keeps a Separate Key"
 FAT_nat_independent_audit_desc:0 "A public auditor needs access to the national register without becoming another requisition office. Give the staff a separate, limited budget. Its continuing scrutiny lowers political discretion and carries a real administrative burden.\n\nUnlock a standing audit policy with a distinct institutional cost. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_independent_audit_done:0 "The Auditor Keeps a Separate Key completed"
 FAT_nat_independent_audit_tt:0 "Unlock a standing audit policy with a distinct institutional cost."
 FAT_nat_civilian_retainer:0 "Retain Civilian Repair Capacity"
 FAT_nat_civilian_retainer_desc:0 "Keep a small permanent repair retainer for ordinary clients after the exceptional programmes end. It supports construction and maintenance while reserving resources that cannot also be promised to a military surge.\n\nTerminal civilian retainer replaces earlier production priorities. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_civilian_retainer_done:0 "Retain Civilian Repair Capacity completed"
 FAT_nat_civilian_retainer_tt:0 "Terminal civilian retainer replaces earlier production priorities."
 ac_fsb_fat_civilian_retainer:0 "Retain Civilian Repair Capacity"
 ac_fsb_fat_civilian_retainer_desc:0 "Keep a small permanent repair retainer for ordinary clients after the exceptional programmes end. It supports construction and maintenance while reserving resources that cannot also be promised to a military surge."
 FAT_nat_industrial_retainer:0 "Retain the Industrial Reserve"
 FAT_nat_industrial_retainer_desc:0 "The final retainer will keep a military replacement margin available, not create a new factory. Civilian customers carry the standing reserve cost. Publish that burden so a later government can see what has been chosen.\n\nAlternative terminal industrial retainer replaces earlier production priorities. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_industrial_retainer_done:0 "Retain the Industrial Reserve completed"
 FAT_nat_industrial_retainer_tt:0 "Alternative terminal industrial retainer replaces earlier production priorities."
 ac_fsb_fat_industrial_retainer:0 "Retain the Industrial Reserve"
 ac_fsb_fat_industrial_retainer_desc:0 "The final retainer will keep a military replacement margin available, not create a new factory. Civilian customers carry the standing reserve cost. Publish that burden so a later government can see what has been chosen."
 FAT_nat_alternate_deliveries:0 "An Alternative after Interruption"
 FAT_nat_alternate_deliveries_desc:0 "An annexed receiver or a broken route ends the foreign obligation. The dispatch office may redirect remaining stock into a domestic programme after cancellation, with a fresh stock check. Nothing is paid merely because a partner disappeared.\n\nAllow a fresh domestic transport allocation after a cancelled external warrant. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_alternate_deliveries_done:0 "An Alternative after Interruption completed"
 FAT_nat_alternate_deliveries_tt:0 "Allow a fresh domestic transport allocation after a cancelled external warrant."
 FAT_nat_outstanding_accounts:0 "The Outstanding Accounts"
 FAT_nat_outstanding_accounts_desc:0 "The final assessment counts deliveries actually made, promises refused and commitments withdrawn. A peaceful and cautious record can be defensible; a busy register is not automatically a good one. Decide what the public account will preserve.\n\n2013 assessment selects accountable cooperation or a domestic-first conclusion. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_outstanding_accounts_done:0 "The Outstanding Accounts completed"
 FAT_nat_outstanding_accounts_tt:0 "2013 assessment selects accountable cooperation or a domestic-first conclusion."
 FAT_nat_winding_warrants:0 "Close the Expired Warrants"
 FAT_nat_winding_warrants_desc:0 "An expired signature should not remain an invisible claim on staff. Authorise a complete reconciliation of permissions with the present partner list. The process closes dead offers without awarding a delivery that never happened.\n\nUnlock a registry sweep of expired or ineligible partner warrants. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_winding_warrants_done:0 "Close the Expired Warrants completed"
 FAT_nat_winding_warrants_tt:0 "Unlock a registry sweep of expired or ineligible partner warrants."
 FAT_nat_standing_transport:0 "A Standing Dispatch Standard"
 FAT_nat_standing_transport_desc:0 "A common loading standard can outlast a particular foreign agreement. Retain the practical procedures as a domestic option, with the same stock and civilian costs when they are used. Cooperation remains a choice rather than a permanent permission slip.\n\nExtend the paid domestic transport option to peaceful routine use. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_standing_transport_done:0 "A Standing Dispatch Standard completed"
 FAT_nat_standing_transport_tt:0 "Extend the paid domestic transport option to peaceful routine use."
 FAT_nat_no_automatic_successor:0 "No Automatic Successor"
 FAT_nat_no_automatic_successor_desc:0 "A change of authority ends the old mandate unless the new authorities sign again. Record that principle in the national procedure. Annexation and reintegration remain owned elsewhere; this office only cancels its own unfulfilled permissions.\n\nUnlock a succession review that closes outstanding warrants before a new domestic mandate. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_no_automatic_successor_done:0 "No Automatic Successor completed"
 FAT_nat_no_automatic_successor_tt:0 "Unlock a succession review that closes outstanding warrants before a new domestic mandate."
 FAT_nat_public_commitment_limit:0 "A Public Commitment Limit"
 FAT_nat_public_commitment_limit_desc:0 "The final limit is not a fourth signature. It is a rule that the existing three must fit both the treasury and the staffing ledger. Fund a stricter review if the government wants its remaining external permissions to stay credible.\n\nUnlock a funded compliance interval that improves capacity while limiting current output. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_public_commitment_limit_done:0 "A Public Commitment Limit completed"
 FAT_nat_public_commitment_limit_tt:0 "Unlock a funded compliance interval that improves capacity while limiting current output."
 FAT_nat_bounded_cooperation:0 "Cooperation within the Means"
 FAT_nat_bounded_cooperation_desc:0 "The programme ends with a practical distinction: foreign consent permits a delivery, while domestic authority pays for it. Keep the permissions earned, the right to refuse and the cost of the standing policy. That is a workable conclusion even if no coalition formed.\n\nUnlock a final assessment action with distinct subject, domestic and delivered-cooperation outcomes. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 FAT_nat_bounded_cooperation_done:0 "Cooperation within the Means completed"
 FAT_nat_bounded_cooperation_tt:0 "Unlock a final assessment action with distinct subject, domestic and delivered-cooperation outcomes."
 FAT_fsb_adopt_campaign:0 "Adopt the National Campaign"
 FAT_fsb_adopt_campaign_desc:0 "After any selected generic, regional or continuous focus has finished, adopt the national campaign and retain completed content. Unknown bespoke trees are not overwritten. No starting forces, industry or expired historical rewards are granted."
 FAT_fsb_adopt_campaign_tt:0 "After any selected generic, regional or continuous focus has finished, adopt the national campaign and retain completed content. Unknown bespoke trees are not overwritten. No starting forces, industry or expired historical rewards are granted."
 sbk_civil_recovery_campaign:0 "South Belka: The civil docket"
 sbk_civil_recovery_campaign_desc:0 "National choices, practical obligations and a later review of the authority actually held. Standing policies have continuing burdens; foreign cooperation requires consent and useful domestic work remains available."
 SBK_nat_civil_register:0 "A Register under Present Authority"
 SBK_nat_civil_register_desc:0 "The first clerk asks which authority is entitled to sign today, not which future the newspapers predict. Open a civil register for the territory actually held. The record must remain useful under a supervising power and must not promise new sovereignty.\n\nContemporary first-entry scene chooses a registry priority without replaying historical transfers. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_civil_register_done:0 "A Register under Present Authority completed"
 SBK_nat_civil_register_tt:0 "Contemporary first-entry scene chooses a registry priority without replaying historical transfers."
 SBK_nat_urgent_repairs:0 "The First Work Order"
 SBK_nat_urgent_repairs_desc:0 "The workshop brings a list of stopped pumps and missing parts. Residents want to know who will choose the first repair. Begin with a practical priority and an honest account of the staff and stores available.\n\nChoose urgent utility maintenance or a broader case hearing. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_urgent_repairs_done:0 "The First Work Order completed"
 SBK_nat_urgent_repairs_tt:0 "Choose urgent utility maintenance or a broader case hearing."
 SBK_nat_resident_casework:0 "Hear the Resident First"
 SBK_nat_resident_casework_desc:0 "Give residents a predictable hearing before issuing exceptional work orders. Casework becomes slower but more credible. The administration accepts the staffing cost of listening rather than calling participation a free source of capacity.\n\nResident-first standing procedure: stability and slower discretionary production. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_resident_casework_done:0 "Hear the Resident First completed"
 SBK_nat_resident_casework_tt:0 "Resident-first standing procedure: stability and slower discretionary production."
 ac_fsb_sbk_resident_casework:0 "Hear the Resident First"
 ac_fsb_sbk_resident_casework_desc:0 "Give residents a predictable hearing before issuing exceptional work orders. Casework becomes slower but more credible. The administration accepts the staffing cost of listening rather than calling participation a free source of capacity."
 SBK_nat_emergency_orders:0 "An Emergency Order Desk"
 SBK_nat_emergency_orders_desc:0 "A single desk can issue urgent instructions before a full hearing. Its authority needs a published burden and a later route of appeal. Faster repairs under this procedure do not imply that residents have consented to every order.\n\nAlternative emergency procedure: repair speed with public and consumer burdens. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_emergency_orders_done:0 "An Emergency Order Desk completed"
 SBK_nat_emergency_orders_tt:0 "Alternative emergency procedure: repair speed with public and consumer burdens."
 ac_fsb_sbk_emergency_orders:0 "An Emergency Order Desk"
 ac_fsb_sbk_emergency_orders_desc:0 "A single desk can issue urgent instructions before a full hearing. Its authority needs a published burden and a later route of appeal. Faster repairs under this procedure do not imply that residents have consented to every order."
 SBK_nat_property_claims:0 "The Property File"
 SBK_nat_property_claims_desc:0 "Two families bring different copies of the same record. The clerk cannot settle title by changing a map or handing out a core. Open a bounded civil case that can choose protected possession or a documented temporary arrangement.\n\nUnlock the one-time property case with two materially different settlements. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_property_claims_done:0 "The Property File completed"
 SBK_nat_property_claims_tt:0 "Unlock the one-time property case with two materially different settlements."
 SBK_nat_service_docket:0 "The Utility Work Docket"
 SBK_nat_service_docket_desc:0 "The maintenance list should name a repair, its stores and the public authority responsible. A utility case can fund a careful repair or ration the present service while parts are conserved. Neither choice creates a factory or a population grant.\n\nUnlock the utility case, including real support-stock expenditure. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_service_docket_done:0 "The Utility Work Docket completed"
 SBK_nat_service_docket_tt:0 "Unlock the utility case, including real support-stock expenditure."
 SBK_nat_stores_reconciliation:0 "Reconcile the Stores"
 SBK_nat_stores_reconciliation_desc:0 "The transfer inventory and the warehouse inventory need not agree. Audit the stock actually held before it is assigned to a new programme. The inherited transfer remains final; the case decides how current stores are used.\n\nUnlock a stock-accountability case; no duplication of inherited transfers. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_stores_reconciliation_done:0 "Reconcile the Stores completed"
 SBK_nat_stores_reconciliation_tt:0 "Unlock a stock-accountability case; no duplication of inherited transfers."
 SBK_nat_civil_receipts:0 "Receipts for Civil Work"
 SBK_nat_civil_receipts_desc:0 "A work order without a receipt leaves the next office unable to distinguish a repair from a promise. Establish a small verification round. The staff time is a cost; a verified record permits later maintenance work on better terms.\n\nUnlock paid receipt verification that changes the docket resolution cost. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_civil_receipts_done:0 "Receipts for Civil Work completed"
 SBK_nat_civil_receipts_tt:0 "Unlock paid receipt verification that changes the docket resolution cost."
 SBK_nat_bounded_advisers:0 "An Adviser with a Written Remit"
 SBK_nat_bounded_advisers_desc:0 "A visiting specialist offers help and asks who may open the workshop. The administration can seek a narrow agreement from the actual eligible counterpart or proceed with domestic expertise. A signature here neither creates nor ends a subject relationship.\n\nChoose to seek limited technical advice or keep the work entirely domestic. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_bounded_advisers_done:0 "An Adviser with a Written Remit completed"
 SBK_nat_bounded_advisers_tt:0 "Choose to seek limited technical advice or keep the work entirely domestic."
 SBK_nat_records_recovery:0 "The Displaced Records"
 SBK_nat_records_recovery_desc:0 "The recovered boxes are incomplete. Clerks propose either reconstructing household records with witnesses or placing the uncertain files under temporary protection. Both are civil procedures for people already present, not a new population settlement.\n\nChoose witness-based record recovery or protected interim records. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_records_recovery_done:0 "The Displaced Records completed"
 SBK_nat_records_recovery_tt:0 "Choose witness-based record recovery or protected interim records."
 SBK_nat_hearing_calendar:0 "A Day for Security Questions"
 SBK_nat_hearing_calendar_desc:0 "Residents cannot be expected to bring a security complaint to an unmarked office. Publish a hearing day and the limits of its inquiry. The case can review local procedure; it has no power to undo a war settlement.\n\nUnlock the security-remit civil case. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_hearing_calendar_done:0 "A Day for Security Questions completed"
 SBK_nat_hearing_calendar_tt:0 "Unlock the security-remit civil case."
 SBK_nat_local_witnesses:0 "Local Witnesses"
 SBK_nat_local_witnesses_desc:0 "A witness who can explain a ledger may save weeks of formal correspondence. Admit that evidence under a published rule. It makes a particular property or record settlement possible; it is not a generic measure of national loyalty.\n\nUnlock witness-led property and archive resolutions with a different staffing cost. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_local_witnesses_done:0 "Local Witnesses completed"
 SBK_nat_local_witnesses_tt:0 "Unlock witness-led property and archive resolutions with a different staffing cost."
 SBK_nat_two_signatures:0 "Two Cases, Two Responsible Officers"
 SBK_nat_two_signatures_desc:0 "The civil office can carry a second case if each file names an officer. Beyond two, the hearing calendar becomes fiction. Keep the limit visible and require an existing case to close before opening a third.\n\nRaise simultaneous civil cases from one to two; no unlimited case slots. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_two_signatures_done:0 "Two Cases, Two Responsible Officers completed"
 SBK_nat_two_signatures_tt:0 "Raise simultaneous civil cases from one to two; no unlimited case slots."
 SBK_nat_provisional_charter:0 "A Provisional Civil Procedure"
 SBK_nat_provisional_charter_desc:0 "Write down what the office may do with the powers it presently has. The procedure covers work orders and civil hearings, not an unearned declaration of independence. Its continuing benefit rests on a continuing administrative burden.\n\nUnlock a costed standing civil charter tailored to subject or independent status. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_provisional_charter_done:0 "A Provisional Civil Procedure completed"
 SBK_nat_provisional_charter_tt:0 "Unlock a costed standing civil charter tailored to subject or independent status."
 SBK_nat_review_authority:0 "Review the Authority to Order"
 SBK_nat_review_authority_desc:0 "The hearing opens with a practical question: which instructions reached the local office, and which could it lawfully carry out? Review the present remit after the existing settlement or its peaceful alternative. No new settlement is awarded here.\n\nSecurity and administrative review chooses published limits or rapid instruction handling. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_review_authority_done:0 "Review the Authority to Order completed"
 SBK_nat_review_authority_tt:0 "Security and administrative review chooses published limits or rapid instruction handling."
 SBK_nat_published_orders:0 "Publish the Order"
 SBK_nat_published_orders_desc:0 "A published instruction can be questioned before it becomes a fait accompli. Keep that protection as the normal rule, accepting the delay to exceptional work. The office cannot promise that publicity alone removes external supervision.\n\nReplace the initial procedure with public-order scrutiny. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_published_orders_done:0 "Publish the Order completed"
 SBK_nat_published_orders_tt:0 "Replace the initial procedure with public-order scrutiny."
 ac_fsb_sbk_published_orders:0 "Publish the Order"
 ac_fsb_sbk_published_orders_desc:0 "A published instruction can be questioned before it becomes a fait accompli. Keep that protection as the normal rule, accepting the delay to exceptional work. The office cannot promise that publicity alone removes external supervision."
 SBK_nat_delegated_command:0 "A Defined Delegation"
 SBK_nat_delegated_command_desc:0 "The order desk receives a precise delegation for local work. Its advantage is speed, and its cost is concentrated discretion. The delegation stays within the present government and cannot alter who owns a state.\n\nAlternative delegated local-command policy with continuing legitimacy cost. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_delegated_command_done:0 "A Defined Delegation completed"
 SBK_nat_delegated_command_tt:0 "Alternative delegated local-command policy with continuing legitimacy cost."
 ac_fsb_sbk_delegated_command:0 "A Defined Delegation"
 ac_fsb_sbk_delegated_command_desc:0 "The order desk receives a precise delegation for local work. Its advantage is speed, and its cost is concentrated discretion. The delegation stays within the present government and cannot alter who owns a state."
 SBK_nat_core_and_resident:0 "Residents beyond the Register"
 SBK_nat_core_and_resident_desc:0 "Some residents fall outside the inherited constitutional record. Their utility bill still needs an answer. A case may extend civil access on a provisional basis without adding cores, manpower or a claim to any new territory.\n\nUnlock a resident-access case useful on non-core treaty footprints. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_core_and_resident_done:0 "Residents beyond the Register completed"
 SBK_nat_core_and_resident_tt:0 "Unlock a resident-access case useful on non-core treaty footprints."
 SBK_nat_appeal_routes:0 "The Route of Appeal"
 SBK_nat_appeal_routes_desc:0 "A closed file should be challengeable once if new evidence appears. Make the cost and limit explicit. The second hearing cannot pay the first award again, and it must replace the old arrangement before establishing another.\n\nAllow each closed case one costed reopening, replacing rather than stacking its prior benefit. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_appeal_routes_done:0 "The Route of Appeal completed"
 SBK_nat_appeal_routes_tt:0 "Allow each closed case one costed reopening, replacing rather than stacking its prior benefit."
 SBK_nat_limited_remit:0 "The Limit of a Guarantee"
 SBK_nat_limited_remit_desc:0 "An external authority may offer advice, supervision or nothing at all. Decide whether to request a narrow technical remit or rely on a domestic hearing. The answer cannot postpone the existing reintegration owner or manufacture a sovereignty guarantee.\n\nChoose external technical consent or an explicitly domestic continuation. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_limited_remit_done:0 "The Limit of a Guarantee completed"
 SBK_nat_limited_remit_tt:0 "Choose external technical consent or an explicitly domestic continuation."
 SBK_nat_service_inspector:0 "The Workshop Inspector"
 SBK_nat_service_inspector_desc:0 "A permitted technical visitor may inspect the work, not command the administration. Keep the distinction in the access papers. If consent is refused or expires, a paid domestic inspection remains available.\n\nUnlock the limited adviser request and a useful domestic inspection after refusal. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_service_inspector_done:0 "The Workshop Inspector completed"
 SBK_nat_service_inspector_tt:0 "Unlock the limited adviser request and a useful domestic inspection after refusal."
 SBK_nat_displaced_archives:0 "An Archive Case"
 SBK_nat_displaced_archives_desc:0 "The boxes recovered in the first months now need a lasting arrangement. A witness-led reconstruction and a protected interim archive have different costs and permissions. Settle the case with the records actually available.\n\nUnlock the archive case, including the earned witness alternative. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_displaced_archives_done:0 "An Archive Case completed"
 SBK_nat_displaced_archives_tt:0 "Unlock the archive case, including the earned witness alternative."
 SBK_nat_security_review:0 "Review the Local Security Remit"
 SBK_nat_security_review_desc:0 "A security hearing is useful only if its conclusion binds the local service. Publish a narrower procedure or fund a supervised inspection. It cannot disarm another country or remove an inherited national spirit that was never applied.\n\nUnlock the enhanced security-case resolution; no phantom demobilisation reward. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_security_review_done:0 "Review the Local Security Remit completed"
 SBK_nat_security_review_tt:0 "Unlock the enhanced security-case resolution; no phantom demobilisation reward."
 SBK_nat_measured_training:0 "Instruction within the Existing Service"
 SBK_nat_measured_training_desc:0 "The administration can improve instruction for personnel already assigned to it. Fund a bounded course and accept its political cost. This is organisation and maintenance, with no instant recruitable population or new formation grant.\n\nUnlock a paid service-instruction interval using existing support equipment. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_measured_training_done:0 "Instruction within the Existing Service completed"
 SBK_nat_measured_training_tt:0 "Unlock a paid service-instruction interval using existing support equipment."
 SBK_nat_maintenance_budget:0 "An Account for Maintenance"
 SBK_nat_maintenance_budget_desc:0 "A repair completed once still needs parts later. Reserve a small standing maintenance account, stated separately from the cost of a particular hearing. The commitment supports current service and remains removable through the public procedure.\n\nUnlock a standing maintenance policy with a real annual fiscal commitment when enabled. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_maintenance_budget_done:0 "An Account for Maintenance completed"
 SBK_nat_maintenance_budget_tt:0 "Unlock a standing maintenance policy with a real annual fiscal commitment when enabled."
 SBK_nat_public_receipts:0 "Read the Unresolved Claims"
 SBK_nat_public_receipts_desc:0 "The public file includes claims that could not be proved. Decide whether to protect an interim arrangement or pay for a further investigation. Neither option turns a disputed document into a canonical border.\n\nUnresolved-claims scene chooses protected interim access or paid inquiry. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_public_receipts_done:0 "Read the Unresolved Claims completed"
 SBK_nat_public_receipts_tt:0 "Unresolved-claims scene chooses protected interim access or paid inquiry."
 SBK_nat_standing_work_orders:0 "A Work Order after the Hearing"
 SBK_nat_standing_work_orders_desc:0 "Give completed utility and access cases a longer maintenance interval when the records justify it. The staff must still pay the initial resolution cost. An unresolved or interrupted case receives no completed-work benefit.\n\nExtend future utility and access case settlements only after actual resolution. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_standing_work_orders_done:0 "A Work Order after the Hearing completed"
 SBK_nat_standing_work_orders_tt:0 "Extend future utility and access case settlements only after actual resolution."
 SBK_nat_civil_continuity:0 "Continuity without a New Settlement"
 SBK_nat_civil_continuity_desc:0 "The civil record should survive a pause in work without pretending that the work was completed. Publish an interruption procedure and keep the costs already incurred in the ledger. Annexation and reintegration remain decisions of their owning authorities.\n\nUnlock an interruption review that closes open cases without a completion award. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_civil_continuity_done:0 "Continuity without a New Settlement completed"
 SBK_nat_civil_continuity_tt:0 "Unlock an interruption review that closes open cases without a completion award."
 SBK_nat_renewal_of_authority:0 "Renew the Civil Authority"
 SBK_nat_renewal_of_authority_desc:0 "The later administration inherits files rather than a blank page. Review who may sign the next budget and what the public may expect from it. A country released later receives this as a contemporary review, never as aid backdated to an earlier crisis.\n\n2006-or-later budget-authority scene chooses public review or a professional case bench. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_renewal_of_authority_done:0 "Renew the Civil Authority completed"
 SBK_nat_renewal_of_authority_tt:0 "2006-or-later budget-authority scene chooses public review or a professional case bench."
 SBK_nat_elected_hearing:0 "A Public Hearing Bench"
 SBK_nat_elected_hearing_desc:0 "Keep lay representatives at the hearing table. The slower calendar buys a more open civil process, with a continuing cost in exceptional production. The policy does not replace the country's existing leader or ruling party.\n\nTerminal participatory case procedure preserves existing political identities. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_elected_hearing_done:0 "A Public Hearing Bench completed"
 SBK_nat_elected_hearing_tt:0 "Terminal participatory case procedure preserves existing political identities."
 ac_fsb_sbk_elected_hearing:0 "A Public Hearing Bench"
 ac_fsb_sbk_elected_hearing_desc:0 "Keep lay representatives at the hearing table. The slower calendar buys a more open civil process, with a continuing cost in exceptional production. The policy does not replace the country's existing leader or ruling party."
 SBK_nat_professional_bench:0 "A Professional Case Bench"
 SBK_nat_professional_bench_desc:0 "A permanent professional bench can clear technical files more quickly. It is also more distant from the residents whose cases it decides. Keep that tradeoff visible in the standing policy and preserve a separate right of appeal.\n\nAlternative terminal technical procedure with political and consumer burdens. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_professional_bench_done:0 "A Professional Case Bench completed"
 SBK_nat_professional_bench_tt:0 "Alternative terminal technical procedure with political and consumer burdens."
 ac_fsb_sbk_professional_bench:0 "A Professional Case Bench"
 ac_fsb_sbk_professional_bench_desc:0 "A permanent professional bench can clear technical files more quickly. It is also more distant from the residents whose cases it decides. Keep that tradeoff visible in the standing policy and preserve a separate right of appeal."
 SBK_nat_obsolete_claims:0 "Close an Obsolete Claim"
 SBK_nat_obsolete_claims_desc:0 "Some requests no longer fit the territory or authority held. A documented closure is better than an impossible promise. Permit a file to close without a settlement bonus, while preserving its record and the possibility of one lawful appeal.\n\nUnlock costless closure of a currently open case without granting its outcome. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_obsolete_claims_done:0 "Close an Obsolete Claim completed"
 SBK_nat_obsolete_claims_tt:0 "Unlock costless closure of a currently open case without granting its outcome."
 SBK_nat_external_orders:0 "Two Conflicting Instructions"
 SBK_nat_external_orders_desc:0 "The office receives two incompatible requests. Under supervision it must identify the actual competent authority; independently it must still choose a lawful local remit. A new signature cannot cancel the existing annexation contract.\n\nChoose a narrow local remit or disclosed external coordination with useful subject and refusal outcomes. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_external_orders_done:0 "Two Conflicting Instructions completed"
 SBK_nat_external_orders_tt:0 "Choose a narrow local remit or disclosed external coordination with useful subject and refusal outcomes."
 SBK_nat_accountable_services:0 "Account for the Standing Service"
 SBK_nat_accountable_services_desc:0 "The annual service budget needs a public account separate from any single case. A standing policy can improve reliability only while its political and financial burdens remain accepted. It is a commitment, not a treasury grant.\n\nUnlock a removable civil reliability policy with an exact recorded fiscal commitment. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_accountable_services_done:0 "Account for the Standing Service completed"
 SBK_nat_accountable_services_tt:0 "Unlock a removable civil reliability policy with an exact recorded fiscal commitment."
 SBK_nat_relief_appeal:0 "An Appeal beside Reconstruction"
 SBK_nat_relief_appeal_desc:0 "The existing reconstruction response remains in its owning ledger. Use its recorded local choice as evidence for a civil appeal, or proceed on a peaceful domestic basis if no such contract exists. Do not pay the original relief award again.\n\nUnlock a local relief review contingent on the owning response or a peaceful substitute. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_relief_appeal_done:0 "An Appeal beside Reconstruction completed"
 SBK_nat_relief_appeal_tt:0 "Unlock a local relief review contingent on the owning response or a peaceful substitute."
 SBK_nat_resident_consent:0 "The Resident May Decline"
 SBK_nat_resident_consent_desc:0 "A civil file need not end in the arrangement preferred by the office. Give residents a protected interim option at a smaller immediate cost and with a smaller benefit. It is a useful conclusion, not a failed test of loyalty.\n\nUnlock the low-stock interim settlement for utility and access cases. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_resident_consent_done:0 "The Resident May Decline completed"
 SBK_nat_resident_consent_tt:0 "Unlock the low-stock interim settlement for utility and access cases."
 SBK_nat_narrow_security_remit:0 "A Narrow Security Remit"
 SBK_nat_narrow_security_remit_desc:0 "Limit the local security service to the procedure actually authorised. Inspection may improve organisation, while a narrower remit protects public confidence. Neither outcome creates forces or changes an external military guarantee.\n\nUnlock a narrowly bounded oversight policy independent of foreign adviser consent. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_narrow_security_remit_done:0 "A Narrow Security Remit completed"
 SBK_nat_narrow_security_remit_tt:0 "Unlock a narrowly bounded oversight policy independent of foreign adviser consent."
 SBK_nat_municipal_workshops:0 "The Municipal Maintenance Round"
 SBK_nat_municipal_workshops_desc:0 "The workshops need predictable parts and a chance to teach the next crew. Fund a temporary maintenance round using current support stock. It remains worthwhile whether the country is independent, supervised or waiting on an unanswered adviser request.\n\nUnlock a domestic stock-backed workshop interval available under every alignment. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_municipal_workshops_done:0 "The Municipal Maintenance Round completed"
 SBK_nat_municipal_workshops_tt:0 "Unlock a domestic stock-backed workshop interval available under every alignment."
 SBK_nat_common_archive:0 "Keep a Common Civil Archive"
 SBK_nat_common_archive_desc:0 "A common index lets the next clerk find the prior decision without reopening every dispute. The archive reduces the cost of future hearings only after it has been funded and checked. It cannot turn unproved claims into titles.\n\nUnlock a one-time archive verification that reduces future case fees. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_common_archive_done:0 "Keep a Common Civil Archive completed"
 SBK_nat_common_archive_tt:0 "Unlock a one-time archive verification that reduces future case fees."
 SBK_nat_public_interest_test:0 "State the Public Interest"
 SBK_nat_public_interest_test_desc:0 "Before maintaining an exceptional arrangement, publish the public interest it serves. This review can end the administration's standing policies and their exact recorded commitments. It never removes another owner's institutions or settlement burdens.\n\nUnlock voluntary removal of this campaign's standing policies and exact fiscal commitments. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_public_interest_test_done:0 "State the Public Interest completed"
 SBK_nat_public_interest_test_tt:0 "Unlock voluntary removal of this campaign's standing policies and exact fiscal commitments."
 SBK_nat_final_docket:0 "The Final Docket"
 SBK_nat_final_docket_desc:0 "The later assessment keeps resolved cases, refusals and unfinished claims in separate columns. A small administration can reach a useful conclusion without controlling every external decision. Decide what should remain a standing civil promise.\n\n2013-or-later assessment selects accountable continuity or a narrower interim administration. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_final_docket_done:0 "The Final Docket completed"
 SBK_nat_final_docket_tt:0 "2013-or-later assessment selects accountable continuity or a narrower interim administration."
 SBK_nat_standing_civil_arrangement:0 "A Standing Civil Arrangement"
 SBK_nat_standing_civil_arrangement_desc:0 "The programme concludes with the authority and territory actually held. Preserve earned civil access and the right to review it; disclose the cost of any standing service. Reintegration, if the existing owner orders it, closes this programme rather than being blocked by it.\n\nUnlock distinct independent, supervised and domestic-after-refusal conclusions. National policy details and dialogue are authored gameplay alternatives; they do not change the established war, faction or territorial settlement."
 SBK_nat_standing_civil_arrangement_done:0 "A Standing Civil Arrangement completed"
 SBK_nat_standing_civil_arrangement_tt:0 "Unlock distinct independent, supervised and domestic-after-refusal conclusions."
 SBK_fsb_adopt_campaign:0 "Adopt the National Campaign"
 SBK_fsb_adopt_campaign_desc:0 "After any selected generic, regional or continuous focus has finished, adopt the national campaign and retain completed content. Unknown bespoke trees are not overwritten. No starting forces, industry or expired historical rewards are granted."
 SBK_fsb_adopt_campaign_tt:0 "After any selected generic, regional or continuous focus has finished, adopt the national campaign and retain completed content. Unknown bespoke trees are not overwritten. No starting forces, industry or expired historical rewards are granted."
 FAT_fsb_invoice_audit:0 "An Invoice Must Name Its Author"
 FAT_fsb_invoice_audit_desc:0 "Unlock a paid invoice audit that improves institutional capacity and records an inspected warrant.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. New authorisations have a 180-day cooldown. "
 FAT_fsb_invoice_audit_tt:0 "Unlock a paid invoice audit that improves institutional capacity and records an inspected warrant.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. New authorisations have a 180-day cooldown. "
 ac_fsb_fat_maintenance_interval:0 "A Place for the Workshop Delegate"
 ac_fsb_fat_maintenance_interval_desc:0 "The wage clerk knows when a nominally spare shift is already exhausted. Give workshop delegates access to the allocation meeting. Their presence slows an order down but permits a genuine negotiated maintenance interval."
 FAT_fsb_maintenance_interval:0 "A Place for the Workshop Delegate"
 FAT_fsb_maintenance_interval_desc:0 "Unlock a negotiated maintenance interval, exchanging current output for reliability.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 120 days. Related allocations cannot overlap. New authorisations have a 180-day cooldown. "
 FAT_fsb_maintenance_interval_tt:0 "Unlock a negotiated maintenance interval, exchanging current output for reliability.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 120 days. Related allocations cannot overlap. New authorisations have a 180-day cooldown. "
 ac_fsb_fat_extra_shift:0 "The Shift Meeting"
 ac_fsb_fat_extra_shift_desc:0 "A voluntary extra shift needs more than a ministerial slogan. Let the plant committee negotiate its duration and rest period. A limited productivity campaign can then be authorised without making permanent emergency hours the default."
 FAT_fsb_extra_shift:0 "The Shift Meeting"
 FAT_fsb_extra_shift_desc:0 "Unlock a paid, temporary negotiated extra shift with an explicit rest cooldown.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 90 days. Related allocations cannot overlap. New authorisations have a 180-day cooldown. "
 FAT_fsb_extra_shift_tt:0 "Unlock a paid, temporary negotiated extra shift with an explicit rest cooldown.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 90 days. Related allocations cannot overlap. New authorisations have a 180-day cooldown. "
 ac_fsb_fat_loading_gauges:0 "The Rolling Gauges"
 ac_fsb_fat_loading_gauges_desc:0 "Dispatchers report that the delay lies in maintenance and incompatible paperwork, not an absence of grand plans. A modest inspection of loading procedures can improve the use of the routes already owned. No new track is conjured by the report."
 FAT_fsb_loading_gauges:0 "The Rolling Gauges"
 FAT_fsb_loading_gauges_desc:0 "Unlock a temporary loading-efficiency allocation that reserves a civilian factory.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 90 days. Related allocations cannot overlap. New authorisations have a 120-day cooldown. "
 FAT_fsb_loading_gauges_tt:0 "Unlock a temporary loading-efficiency allocation that reserves a civilian factory.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 90 days. Related allocations cannot overlap. New authorisations have a 120-day cooldown. "
 ac_fsb_fat_domestic_training:0 "Dispatch to Our Own Depots"
 ac_fsb_fat_domestic_training_desc:0 "When no foreign request fits, the loading gang can still move a real consignment to domestic training depots. That decision consumes replacements now in exchange for a limited training programme. It is useful in neutrality and under external supervision alike."
 FAT_fsb_domestic_training:0 "Dispatch to Our Own Depots"
 FAT_fsb_domestic_training_desc:0 "Unlock a domestic training allocation that consumes infantry stock instead of donating it.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Consume actual stock: 100 infantry equipment. Benefit lasts 120 days. New authorisations have a 180-day cooldown. "
 FAT_fsb_domestic_training_tt:0 "Unlock a domestic training allocation that consumes infantry stock instead of donating it.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Consume actual stock: 100 infantry equipment. Benefit lasts 120 days. New authorisations have a 180-day cooldown. "
 ac_fsb_fat_relief_freight:0 "A Freight Slot for Relief"
 ac_fsb_fat_relief_freight_desc:0 "Relief planners ask for trucks and loading time rather than an invented border settlement. Their allocation must compete with military haulage. A paid transport interval can reduce local supply losses without claiming that every displaced family has been resettled."
 FAT_fsb_relief_freight:0 "A Freight Slot for Relief"
 FAT_fsb_relief_freight_desc:0 "Unlock a relief freight allocation consuming motor stock and civilian capacity.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Consume actual stock: 10 motorized equipment. Benefit lasts 120 days. Related allocations cannot overlap. New authorisations have a 180-day cooldown. "
 FAT_fsb_relief_freight_tt:0 "Unlock a relief freight allocation consuming motor stock and civilian capacity.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Consume actual stock: 10 motorized equipment. Benefit lasts 120 days. Related allocations cannot overlap. New authorisations have a 180-day cooldown. "
 ac_fsb_fat_civil_reception:0 "Room Behind the Platform"
 ac_fsb_fat_civil_reception_desc:0 "The arrivals hall needs clerks, medical space and a quiet waiting room. A temporary hosting allocation supports the people already present. It promises neither new population nor a permanent territorial reward."
 FAT_fsb_civil_reception:0 "Room Behind the Platform"
 FAT_fsb_civil_reception_desc:0 "Unlock a temporary civil reception allocation with consumer-goods cost.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 180 days. New authorisations have a 240-day cooldown. "
 FAT_fsb_civil_reception_tt:0 "Unlock a temporary civil reception allocation with consumer-goods cost.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 180 days. New authorisations have a 240-day cooldown. "
 ac_fsb_fat_rest_interval:0 "Listen to the Exhausted Shift"
 ac_fsb_fat_rest_interval_desc:0 "The plant can finish the current batch by borrowing against next month's health. Workers ask for a maintenance pause instead. Authorise the pause and accept a present output loss in return for safer training and equipment care."
 FAT_fsb_rest_interval:0 "Listen to the Exhausted Shift"
 FAT_fsb_rest_interval_desc:0 "Unlock a rest-and-inspection alternative that cannot overlap an extra shift.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 120 days. Related allocations cannot overlap. New authorisations have a 180-day cooldown. "
 FAT_fsb_rest_interval_tt:0 "Unlock a rest-and-inspection alternative that cannot overlap an extra shift.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 120 days. Related allocations cannot overlap. New authorisations have a 180-day cooldown. "
 ac_fsb_fat_support_maintenance:0 "Recover the Maintenance Margin"
 ac_fsb_fat_support_maintenance_desc:0 "Support stores can keep equipment in service instead of leaving another shipment on the quay. A domestic maintenance allocation consumes those stores explicitly. It is not a returning foreign gift and does not replenish the warehouse by decree."
 FAT_fsb_support_maintenance:0 "Recover the Maintenance Margin"
 FAT_fsb_support_maintenance_desc:0 "Unlock support-stock expenditure for a bounded maintenance benefit.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Consume actual stock: 15 support equipment. Benefit lasts 120 days. New authorisations have a 180-day cooldown. "
 FAT_fsb_support_maintenance_tt:0 "Unlock support-stock expenditure for a bounded maintenance benefit.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Consume actual stock: 15 support equipment. Benefit lasts 120 days. New authorisations have a 180-day cooldown. "
 ac_fsb_fat_supervised_liaison:0 "A Desk under Supervision"
 ac_fsb_fat_supervised_liaison_desc:0 "External supervision limits what a national office can promise abroad. A liaison desk can still protect local repair schedules and record conflicting instructions. Its practical value does not depend on winning permission for an independent foreign policy."
 FAT_fsb_supervised_liaison:0 "A Desk under Supervision"
 FAT_fsb_supervised_liaison_desc:0 "Unlock a subject-compatible civil liaison; independent countries use the same desk for domestic coordination.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 180 days. New authorisations have a 240-day cooldown. "
 FAT_fsb_supervised_liaison_tt:0 "Unlock a subject-compatible civil liaison; independent countries use the same desk for domestic coordination.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 180 days. New authorisations have a 240-day cooldown. "
 ac_fsb_fat_line_continuity:0 "Keep the Existing Lines Running"
 ac_fsb_fat_line_continuity_desc:0 "The works ask for a reliable maintenance cycle rather than another factory built on paper. A bounded continuity allocation improves current efficiency retention. It consumes administrative attention and leaves the physical production budget unchanged."
 FAT_fsb_line_continuity:0 "Keep the Existing Lines Running"
 FAT_fsb_line_continuity_desc:0 "Unlock a production-retention allocation with staff and fiscal opportunity costs.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 120 days. Related allocations cannot overlap. New authorisations have a 180-day cooldown. "
 FAT_fsb_line_continuity_tt:0 "Unlock a production-retention allocation with staff and fiscal opportunity costs.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 120 days. Related allocations cannot overlap. New authorisations have a 180-day cooldown. "
 FAT_fsb_local_reconciliation:0 "The Obligations that Remain"
 FAT_fsb_local_reconciliation_desc:0 "Unlock a once-only reconciliation of current warrants and a domestic institutional review.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. This authorisation is once only; interruption does not refund its costs. "
 FAT_fsb_local_reconciliation_tt:0 "Unlock a once-only reconciliation of current warrants and a domestic institutional review.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. This authorisation is once only; interruption does not refund its costs. "
 ac_fsb_fat_skill_retention:0 "Retain the Skilled Shift"
 ac_fsb_fat_skill_retention_desc:0 "Training a replacement crew does not recreate the workers who left. Offer a limited retention interval tied to maintenance and instruction. The payroll and civilian cost remain visible while the production lines continue using their existing equipment."
 FAT_fsb_skill_retention:0 "Retain the Skilled Shift"
 FAT_fsb_skill_retention_desc:0 "Unlock a skill-retention allocation; it competes with the existing production interval.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 180 days. Related allocations cannot overlap. New authorisations have a 240-day cooldown. "
 FAT_fsb_skill_retention_tt:0 "Unlock a skill-retention allocation; it competes with the existing production interval.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 180 days. Related allocations cannot overlap. New authorisations have a 240-day cooldown. "
 FAT_fsb_suspend_warrants:0 "The Domestic Veto"
 FAT_fsb_suspend_warrants_desc:0 "Unlock immediate cancellation of all unfulfilled warrants and return to domestic work.\n\nAdministrative closure only: no cash or completion award. "
 FAT_fsb_suspend_warrants_tt:0 "Unlock immediate cancellation of all unfulfilled warrants and return to domestic work.\n\nAdministrative closure only: no cash or completion award. "
 ac_fsb_fat_independent_audit:0 "The Auditor Keeps a Separate Key"
 ac_fsb_fat_independent_audit_desc:0 "A public auditor needs access to the national register without becoming another requisition office. Give the staff a separate, limited budget. Its continuing scrutiny lowers political discretion and carries a real administrative burden."
 FAT_fsb_independent_audit:0 "The Auditor Keeps a Separate Key"
 FAT_fsb_independent_audit_desc:0 "Unlock a standing audit policy with a distinct institutional cost.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Standing full-mode annual commitment: nominal GDP / 2000, recorded exactly when the standing account is reconciled. Remove it through the campaign review. Legacy and disabled modes retain the political/physical burden without a new cash commitment."
