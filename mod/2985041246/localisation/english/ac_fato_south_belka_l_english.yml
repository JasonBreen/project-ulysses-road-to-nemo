 ac_fsb_sbk_civil_charter:0 "A Provisional Civil Procedure"
 ac_fsb_sbk_civil_charter_desc:0 "Write down what the office may do with the powers it presently has. The procedure covers work orders and civil hearings, not an unearned declaration of independence. Its continuing benefit rests on a continuing administrative burden."
