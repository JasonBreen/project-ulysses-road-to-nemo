 OSE_camp_1_register:0 "The fleet and the island"
 OSE_camp_1_register_desc:0 "The fleet and the island. Open the campaign lane and its preparation record.\n\nAt the receiving field, the fuel crew has been told to expect a quiet week. The operations officer cannot bring himself to repeat the instruction. A carrier and an island depend on different kinds of endurance: one can turn away, the other must find another runway and another place to put the wounded. Preparation authorizes real defensive and maritime work. Wardog's story follows the commitments that were made, the crews held in reserve, and the requests that could not be answered in time."
