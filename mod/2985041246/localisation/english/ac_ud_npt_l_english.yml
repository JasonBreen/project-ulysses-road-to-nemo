l_english:
 ac_ud_npt.1.t:0 "The Question Before the Council"
 ac_ud_npt.1.d:0 "The Council chamber has no windows. It was built that way on purpose, the older officers say, so that nobody inside could be distracted by the weather or the harbour. Tonight it is full: every member of the National Defense Council, observers sent by the subdivision governments, a stenographer from the evening broadcast and, for the first time anyone can remember, a delegation from the harbour unions standing along the back wall because there are no more chairs.\n\nThe 1991 returns lie on the table in sealed folders, and every party has read them as a victory. The Old Guard points to the steady majorities of the outer islands and calls them a vote of confidence. The Democratic Republicans point to the port towns and call them a demand for change. The Reformists point to the barracks and the naval academy and say nothing at all, which unsettles the room more than any speech.\n\nThe senior admiral who chairs the session reminds the chamber that the arrangement which has kept North Point out of the continent's wars was never written down. It lives in habit, in telephone calls between the Council and the subdivision halls, and in the patience of islanders who have never been asked whether they consent. That patience, the admiral says, is not a reserve the islands can draw on forever.\n\nNobody proposes an answer that night. The session ends after midnight with an agreement to keep talking, a promise to publish the minutes and a single question entered into the record in the stenographer's careful hand: what are the islands to become?\n\nMod provenance: the National Defense Council, the subdivision governments and the 1991 parties come from the April 2024 archive; the scene and its choices are provisional gameplay."
 ac_ud_npt.1.a:0 "The Council will answer it, as it always has."
 ac_ud_npt.1.b:0 "Let the subdivisions be heard before anything is decided."
 ac_ud_npt.1.c:0 "Ask the officers what the islands need to survive."
 ac_ud_npt.2.t:0 "The Council Answers"
 ac_ud_npt.2.d:0 "The Old Guard does not make speeches. It makes lists. The paper sent to every subdivision hall on the morning after the vote is three pages long and contains no adjectives: the harbours that stayed open, the wars the islands stayed out of, the ferries that ran on time.\n\nBeneath the list is a promise, and the promise is new. The National Defense Council will remain the government of the islands' defence and foreign affairs, but it will explain itself. It will open its promotion boards to every subdivision, publish its decisions, and write down for the first time the division of powers that the islands have lived under by habit for as long as anyone remembers.\n\nIn the port towns the reaction is a shrug. The Democratic Republicans call the promise a delaying tactic and announce that they will hold the Council to every word of it. In the outer islands the reaction is relief. The fishing towns did not want a revolution; they wanted to know that somebody in the capital was listening.\n\nInside the Council the younger officers are quietly pleased and the older officers quietly alarmed. Both suspect that a Council which starts explaining itself will find it hard to stop. Neither group says so in the chamber, and both are already drafting the rules they hope the other will have to follow.\n\nMod provenance: the National Defense Council, the subdivision governments and the 1991 parties come from the April 2024 archive; the scene and its choices are provisional gameplay."
 ac_ud_npt.2.a:0 "Begin with the merit boards."
 ac_ud_npt.2.b:0 "Begin with the subdivisions."
 ac_ud_npt.3.t:0 "The Question of Succession"
 ac_ud_npt.3.d:0 "A senior general of the National Defense Council has asked to retire. The request is reasonable: the general's health is poor and the general's service has been long. The difficulty is that nobody knows how the seat is to be filled, and everybody has an opinion.\n\nFor as long as anyone can remember, seats on the Council have passed by understanding. A retiring officer recommended a successor, the Council accepted the recommendation, and the islands read the name in the evening bulletin. With the merit boards open and the compact signed, that quiet custom has become conspicuous. The port newspapers have started asking who chooses the people who choose.\n\nTwo answers are argued in the wardrooms. The senior officers favour seniority: the longest-serving officer of the retiring member's service takes the seat, and experience is rewarded over ambition. The younger officers favour rotation: seats filled for fixed terms from officers who have passed the merit boards and served in a subdivision post, so that nobody governs the islands who has not first worked in them.\n\nThe retiring general has declined to recommend anyone, which everyone in the chamber understands is itself a recommendation. The Council will have to decide on its own, and in public. Whichever rule it adopts will govern who sits at the windowless table long after everyone now in the room has gone home to the outer islands to fish.\n\nMod provenance: the National Defense Council, the subdivision governments and the 1991 parties come from the April 2024 archive; the scene and its choices are provisional gameplay."
 ac_ud_npt.3.a:0 "Seniority keeps the services steady."
 ac_ud_npt.3.b:0 "Rotation keeps the Council honest."
 ac_ud_npt.4.t:0 "The Convention Sits"
 ac_ud_npt.4.d:0 "The delegates fill the old customs hall from the first morning. They sit by island rather than by party, because the convention's rules say so, and within an hour the arrangement has produced alliances nobody predicted: fishing towns with fishing towns, port cities with port cities, and the outer islands with whoever promises them a ferry.\n\nThe federalists speak first. The islands, they argue, have governed themselves for generations through their own councils, and a parliament should sit only for what they share: defence, foreign relations, the harbours and the currency. A unitary state run from the capital would be the Council's old centralism in a civilian coat.\n\nThe unitarists answer that a federation of fishing towns can never raise a loan, plan a grid or build a shipyard, and that a single roll of electors is the only way to make North Point one nation instead of a collection of harbours that happen to share a flag. They are loudest in the capital and quietest in the outer islands.\n\nThe Council's observers sit in the back row and take notes. When a journalist asks one of them what the officers think, the observer replies that the officers have been asked not to think aloud, and that they are finding it very difficult.\n\nProvisional gameplay: an alternate government path for players only; the AI keeps the 1991 government."
 ac_ud_npt.4.a:0 "Let the convention take its time."
 ac_ud_npt.4.b:0 "Press for a decision before the season turns."
 ac_ud_npt.5.t:0 "The First Sitting"
 ac_ud_npt.5.d:0 "At noon the members of the National Defense Council walk into the customs hall in dress uniform, carrying the seals of the foreign and defence portfolios in a plain wooden box. They hand the box to the provisional cabinet, salute the new Parliament of the Islands and take their seats in the public gallery. The ceremony lasts eleven minutes.\n\nThe cabinet has no famous faces. It is an office of the parliament, staffed by civil servants and delegates who have agreed to govern until the islands can elect a government of their own, and it signs its first decrees with the cabinet seal rather than any name. Its critics call it faceless. Its supporters reply that a face is the last thing the islands need while they learn to govern themselves.\n\nIn the barracks the change is received in silence. The officers obey, as the Council told them to; some of them are relieved, and a few are angry. In the port towns there is dancing on the quays. In the outer islands people listen to the broadcast, turn off the radio and go back to work, which is how the outer islands receive most news.\n\nThe new government's first sitting ends after dark. The last item on the agenda is the ferry timetable, and the debate on it is fierce.\n\nProvisional gameplay: an alternate government path for players only; the AI keeps the 1991 government."
 ac_ud_npt.5.a:0 "Govern carefully: the islands are watching."
 ac_ud_npt.5.b:0 "Govern quickly: there is a great deal to do."
 ac_ud_npt.6.t:0 "The Generals Go Home"
 ac_ud_npt.6.d:0 "The question of the National Defense Council's future reaches the parliament on a wet afternoon, and the gallery is full of officers in civilian clothes. The Council still exists: a committee of senior soldiers and sailors with no portfolio, an office in the capital and the loyalty of most of the Defense Forces.\n\nOne side of the chamber wants it abolished. A civilian state, they argue, cannot keep a second government of generals in reserve, however honourable its members. If the Council remains, the next crisis will tempt someone to call on it, and the islands will have built their parliament on sand.\n\nThe other side wants it kept as an advisory body, consulted on defence and honoured for its service. The Defense Forces accepted civilian rule because the Council asked them to, they argue, and humiliating the Council would teach every barracks that obedience is repaid with contempt. Better a council of honour that advises than a council of grievance that waits.\n\nThe Council's own members say nothing in public. In private, the senior admiral tells a reporter that the officers will accept whatever the parliament decides, and would prefer to be told soon. The reporter prints the remark on the front page, and the debate that follows is the longest the new parliament has held.\n\nProvisional gameplay: an alternate government path for players only; the AI keeps the 1991 government."
 ac_ud_npt.6.a:0 "Keep the Council as an advisory body of honour."
 ac_ud_npt.6.b:0 "Abolish it, with the islands' thanks."
 ac_ud_npt.7.t:0 "The Directorate"
 ac_ud_npt.7.d:0 "The vote in the Council chamber is closer than the Reformists expected and more bitter than anyone wanted. When it is done, the old division of powers is suspended by decree, and North Point is governed by a Readiness Directorate with authority over every harbour, fuel store, airfield and road in the archipelago.\n\nThe subdivision governments are not abolished. They keep their schools, their clinics and their courts, and they are told that the Directorate will consult them. They are also told that their harbour budgets, their emergency plans and their road funds now belong to a single national plan, and that the plan will be published when it is complete.\n\nThe Directorate has no leader the islands can name. Its decrees carry a seal and its spokesmen read them without giving their names. Supporters say that this is the point: the Directorate is an office of the nation, not a ladder for ambitious officers. Opponents say that a government without a face is a government without a conscience, and wonder aloud who signs the orders.\n\nThat evening the broadcast plays the national anthem twice. Nobody at the station can say who asked for the second time. In the port towns people turn their radios down; in the barracks towns they turn them up; and on the outer islands, as usual, they wait to see what happens to the ferry fares.\n\nProvisional gameplay: an alternate government path for players only; the AI keeps the 1991 government."
 ac_ud_npt.7.a:0 "Order before liberty, for now."
 ac_ud_npt.7.b:0 "Promise a review once the plan is complete."
 ac_ud_npt.8.t:0 "The Prefects Arrive"
 ac_ud_npt.8.d:0 "In most subdivisions the Directorate's prefects are received politely, shown to their offices and given the keys to the harbour stores. The handover takes a morning and a lunch, and the councils go back to arguing about school roofs.\n\nIn two subdivisions the councils refuse. Their members lock the harbour offices, sit on the steps and read the Subdivision Compact aloud, one clause at a time, to a crowd that grows larger with every clause. Nobody is armed. Nobody leaves. The prefects wait in the ferry terminal and telephone the capital every hour.\n\nThe Directorate's staff are divided. Some argue that a plan with exceptions is not a plan, and that the councils must be made to understand that the Directorate's authority is not a matter for negotiation. Others argue that the plan is meant to defend the islands, not to fight them, and that a compromise which leaves the councils their keys and the Directorate its plan would cost nothing that matters.\n\nWhatever the Directorate decides will be reported on every island by morning. The fishing fleet has radios, and the fishing fleet has already heard. So have the other subdivisions, which handed over their keys politely and are now waiting to learn whether politeness was the wiser choice.\n\nProvisional gameplay: an alternate government path for players only; the AI keeps the 1991 government."
 ac_ud_npt.8.a:0 "Negotiate: the councils keep their keys, the prefects keep the plan."
 ac_ud_npt.8.b:0 "Enforce: the plan has no exceptions."
 ac_ud_npt.9.t:0 "The Directorate Looks at Itself"
 ac_ud_npt.9.d:0 "The readiness audit is complete, the hedgehog doctrine is in place and the islands' neutrality has been declared to every government with an embassy in the capital. By the Directorate's own measures, the emergency for which it was created has been met.\n\nThat is the difficulty. The Directorate's founding decree promised a review once the plan was complete, and the subdivision councils have been counting the days. The Reformists are divided. Some believe the plan is finished and that the Directorate should return the harbours and the roads to the councils with honour. Others believe the plan will never be finished while the continent is unstable and the sky is uncertain, and that a Directorate which dissolves itself now will only have to be recreated in a worse crisis.\n\nThe review sits for a month behind closed doors. The islands wait with the patience of people who have learned not to expect much from closed doors.\n\nWhen the review reports, it does not dissolve the Directorate. It decides how the Directorate will govern from here on, which, the councils note, is not the same question. The Reformists who argued for dissolution accept the result in public and keep their notes, and the islands understand that the argument has been postponed rather than settled.\n\nProvisional gameplay: an alternate government path for players only; the AI keeps the 1991 government."
 ac_ud_npt.9.a:0 "The Directorate remains until the sky is clear."
 ac_ud_npt.9.b:0 "Return the subdivisions their harbours."
 ac_ud_npt.10.t:0 "What the Islands Make"
 ac_ud_npt.10.d:0 "The economic survey is delivered to the government in a single volume bound in grey card. It is the first complete account of what North Point makes, earns and imports, and its authors have resisted every temptation to make it more exciting than it is.\n\nThe islands live by the sea. Fishing, ferries, harbour dues and ship repair account for most of what they earn. The Defense Forces' airfields employ more skilled technicians than any civilian industry. Almost everything else, from fuel and steel to radios and tinned food, comes from the continent on ships that the islands do not own.\n\nThe survey concludes that the islands can afford one serious industrial programme. The shipyards want it, because the yards have kept the islands alive for generations and could build the patrol craft and coasters that North Point has always bought abroad. The airfields want it too, because their hangars already hold the most advanced skills on the islands and could grow into an aviation industry of their own.\n\nThe survey's authors decline to recommend either. Asked why, the senior author replies that economists who live on islands have learned not to take sides between the harbour and the airfield. The government will have to choose, and whichever programme it chooses, the other will spend the next decade explaining why it would have done better.\n\nProvisional gameplay: the economic survey and both programmes are authored for this package."
 ac_ud_npt.10.a:0 "The yards have kept us alive for generations."
 ac_ud_npt.10.b:0 "The airfields are our future."
 ac_ud_npt.11.t:0 "The Fleet at Anchor"
 ac_ud_npt.11.d:0 "The review fleet anchors in a single line off the capital on a bright, windy morning, and half the islands come out to watch. There are patrol boats, a pair of elderly escorts, minesweepers, a survey ship and a scattering of auxiliaries, all freshly painted and none of them young.\n\nAfterwards, in the wardroom of the flagship, the naval staff argue about what the fleet is for. One school wants a coastal fleet: torpedo boats, minelayers and submarines that would make the straits a gamble for any invader, built cheaply in the island yards and crewed from the fishing towns. North Point, they say, does not need to cross oceans; it needs to make sure that nobody crosses to it.\n\nThe other school wants an escort fleet: frigates and oilers that could bring a tanker convoy across open water if the continent ever went to war. Every litre of fuel the islands burn arrives by sea, they point out, and a fleet that can close the straits is of little use if the islands are starving behind them.\n\nThe budget will pay for one of these fleets, not both. The naval staff are asked to settle the argument by the end of the month. They settle it by the end of the year.\n\nProvisional gameplay: the review and both fleet doctrines are authored for this package."
 ac_ud_npt.11.a:0 "Close the straits."
 ac_ud_npt.11.b:0 "Keep the sea lanes open."
 ac_ud_npt.12.t:0 "A Date in the Sky"
 ac_ud_npt.12.d:0 "Central Usea has announced that the asteroid Ulysses will strike the Earth. The announcement reaches the islands at midday through the continental news agencies, and the radio station reads it in full, twice, before falling silent while the engineers decide what to play next. They choose nothing. For a quarter of an hour, every radio on North Point hisses.\n\nBy evening the government and the subdivision councils are meeting together, which they have rarely done before. The astronomers' reports are carefully worded and deeply frightening. Ulysses will break apart before it reaches the ground, and its fragments will fall over a wide area. Nobody can yet say where, or how many, or how large.\n\nNorth Point's islands are small, scattered and surrounded by sea. Some of them have hard rock that could be tunnelled; some have nothing but sand and fishing huts. The harbour towns are crowded and the outer islands are far apart. Whatever the government decides, it must decide for every island at once, and it must decide without a map.\n\nThe meeting ends with a single decision: the islands will prepare. The details are left for the morning, and for the years that follow. On the walk home, more than one delegate stops on the harbour wall to look up at a sky that is, for now, entirely ordinary.\n\nOfficial: ACES Chronicle, 1996 / 04.20. North Point's response and every choice are provisional gameplay."
 ac_ud_npt.12.a:0 "Tell the islands everything, as soon as we know it."
 ac_ud_npt.12.b:0 "Plan first; announce when the plan is ready."
 ac_ud_npt.13.t:0 "Smoke across the Strait"
 ac_ud_npt.13.d:0 "The first reports come from fishermen. Smoke over the mainland coast, aircraft where there should be none, a radio station that stopped broadcasting in the middle of a song. By mid-morning the continental news agencies confirm what the fishing fleet already suspected: a coup has broken out across Usea.\n\nThe reports through the day are confused and contradictory. Barracks have been seized, broadcasts interrupted, airfields closed. By evening it is clear that the Unified Command is fighting back, and that it may be days before anyone knows who holds the coast opposite the islands. North Point is no part of the rising and has no intention of becoming part of it.\n\nThe harbours, though, are filling. Freighters, ferries and private yachts that were at sea when the fighting began have turned north rather than sail home into it. Their captains ask for fuel, water and permission to wait. A few of the vessels are armed, and a few of their passengers wear uniforms with the insignia hastily removed.\n\nThe government must decide what the islands' neutrality means when the fighting is not between nations but inside them. Whatever it decides tonight, the captains in the harbour and the governments on the mainland will remember it long after the rising is over.\n\nOfficial: ACES Chronicle, 1997 / 05.30. North Point's response and every choice are provisional gameplay."
 ac_ud_npt.13.a:0 "Shelter the ships and their people until the fighting ends; disarm anyone who carries a weapon."
 ac_ud_npt.13.b:0 "Turn away every armed vessel; the islands take no part."
 ac_ud_npt.14.t:0 "Eight Guns in the Desert"
 ac_ud_npt.14.d:0 "The news is announced with ceremony: the Stonehenge project is complete. Eight railguns stand in a desert of San Salvacion, built by an international project led by Central Usea to bring down the fragments of Ulysses before they reach the ground.\n\nOn North Point the announcement is received with relief and a certain wariness. The guns can protect only what they can reach, and nobody on the islands knows whether the islands are within that reach. What the project does have, and will need to share, is its forecasts: the trajectories its astronomers are calculating, which will say where the fragments are expected to fall and when.\n\nThe government's request goes to the mainland through every channel it has: the embassy, the treaty organisation and the scientific societies. It asks for nothing more than the forecasts, and it offers the plots from the islands' own headland radars in return. In a year when every government in the world wants the same information, nobody expects the islands to receive special treatment.\n\nThe reply, when it comes, is polite, technical and slower than anyone hoped. It is also, the island astronomers report, extremely useful, and for the first time the shelter planners can draw something on their maps besides question marks.\n\nOfficial: ACES Chronicle, 1998 / 06.19, and Super Weapons, Stonehenge. North Point's response and every choice are provisional gameplay."
 ac_ud_npt.14.a:0 "Share our headland radar plots in exchange."
 ac_ud_npt.14.b:0 "Accept whatever they send, and ask again."
 ac_ud_npt.15.t:0 "The Last Drill"
 ac_ud_npt.15.d:0 "At ten in the morning the sirens sound on every island at once. For once nobody looks at the sky first; they look at their watches, because the drill was announced a week in advance and the wardens want to know how long it takes.\n\nIn the harbour towns the crowds move to the tunnels and cellars in orderly lines, carrying the bags they were told to pack. On the outer islands families open their shelter kits and tune their radios to the emergency frequency. The ferries sail their evacuation routes with passengers aboard. The hospitals move their patients below ground, and a surgeon completes a real operation in an underground theatre while the sirens wail above.\n\nWhen the all-clear sounds, the wardens count heads. The figures are not perfect. An old fisherman refused to leave his boat; a school took the wrong road; a ferry ran aground on a sandbar it had passed a thousand times. Every mistake is written down, and every mistake is corrected before the end of the week.\n\nThere are only months left on the calendar now. The government asks whether the islands should keep drilling until the last week, or seal the stores and let people rest.\n\nProvisional gameplay: the drill and its outcomes are authored for this package; no impact site is asserted."
 ac_ud_npt.15.a:0 "Seal the stores; let the islands rest."
 ac_ud_npt.15.b:0 "Keep drilling until the last week."
 ac_ud_npt.16.t:0 "After the Fragments"
 ac_ud_npt.16.d:0 "Ulysses passed the Roche limit and broke apart, and for a long night its fragments fell across the world. On the islands the sirens sounded, the tunnels and cellars filled, and the radio went silent as the station's staff went below with everyone else.\n\nNow the shelter doors are opening. People climb out into a grey morning and look first at the sky and then at each other. The reports from the continent are fragmentary and terrible: cities without power, roads cut, harbours closed, and numbers of dead that change every hour. What happened to the islands themselves will take weeks to count, and the government refuses to guess.\n\nThe years of preparation are about to be tested. Where the shelters were dug, the drills rehearsed and the stores sealed, the islands can begin to look outward almost at once. Where the preparations were thin, the government must first account for its own people before it can think about anyone else's.\n\nThe meeting room is cold and the coffee is bad. The decision in front of the government is simple to state: where do the islands begin? Outside, the civil wardens are already going door to door with their lists, and the first ferry captains are asking the harbour offices where they should sail.\n\nOfficial: ACES Chronicle, 1999 / 07.08; no impact site or damage on the islands is asserted. North Point's response and every choice are provisional gameplay."
 ac_ud_npt.16.a:0 "The shelters held. Send the ferries and aircraft to the continent."
 ac_ud_npt.16.b:0 "Finish the count first, then help where we can."
 ac_ud_npt.16.c:0 "Bring every island back before anything else."
 ac_ud_npt.17.t:0 "Boats from the South"
 ac_ud_npt.17.d:0 "The first boat arrives at dawn: an open fishing launch with twenty people aboard, no fuel left and a sail improvised from a tarpaulin. The harbour pilot who finds it tows it in, feeds its passengers and telephones the capital. By the end of the week there have been eleven more.\n\nAcross Usea the displaced are still moving, as they have been since the fragments fell. In April 2000 Erusea's government reached its decision about the refugees at its borders, and whatever that decision has meant on the continent, some of those who cannot find a place there have started to look north across the water. They carry families, fishermen, a few deserters and a great many people who simply have nowhere else to go.\n\nNorth Point has room, but not unlimited room. Rationing has only just ended, the harbours are still repairing their cranes, and the treasury is exhausted. The port towns are generous; the outer islands are anxious; the Defense Forces want to know who is coming ashore.\n\nThe government cannot turn the boats away without a decision, and it cannot postpone the decision much longer. Every night the harbour pilots go out with lamps, and every morning they bring in more boats than the night before.\n\nOfficial: ACES Chronicle, 2000 / 04.21; the arrivals and their numbers are provisional. North Point's response and every choice are provisional gameplay."
 ac_ud_npt.17.a:0 "Every boat is met, fed and registered while we decide."
 ac_ud_npt.17.b:0 "Count them first; decide afterwards."
 ac_ud_npt.18.t:0 "The Relief Ledger"
 ac_ud_npt.18.d:0 "The relief ledger is finished: four volumes bound in the same grey card as the old economic survey. It lists everything the islands spent after the fragments fell, every ferry and flight, every bed in every ward, every family sheltered and every sack of grain distributed from the stores.\n\nIt is not a triumphant document. It records the mistakes beside the successes: the ferry that sailed to the wrong island, the shipment of medicine that sat in a warehouse for a fortnight, the ration board that fed its own members first. Each mistake is followed by a note of what was changed to prevent it from happening again.\n\nThe officials who compiled it have read every page, and they know how the islands will read it: on the morning ferries and in the harbour cafes, and with arguments that will last for weeks. Some of those arguments will be bitter. Most will end with a grudging admission that the islands did better than they feared and worse than they hoped.\n\nThe government must decide whether to publish every page, or keep the most painful chapters in the archive until tempers cool.\n\nProvisional gameplay: the ledger and its contents are authored for this package."
 ac_ud_npt.18.a:0 "Publish everything, mistakes included."
 ac_ud_npt.18.b:0 "Publish the figures; keep the mistakes in the archive."
 ac_ud_npt.19.t:0 "The Continent at the Edge"
 ac_ud_npt.19.d:0 "The radio from the mainland has changed its tone. The bulletins that once led with relief convoys and reconstruction now lead with border incidents, troop movements and the speeches of ministers who used to speak only about rebuilding. On the islands people have started listening to the late bulletin again, which they have not done since the fragments fell.\n\nYears after the impact, Usea has not recovered and has not forgiven. The refugee camps are still full, the ruined towns are still ruined, and the governments of the continent are suspicious of one another in ways the shared disaster did nothing to soften. The island diplomats on the mainland report that every capital is preparing for something, and that none of them will say what.\n\nNorth Point is party to none of these quarrels. It is, however, an island chain within reach of all of them, with airfields, deep harbours and a fleet that knows its own waters. Sooner or later, whatever happens on the continent, someone will ask the islands which side they are on, and the islands must know their answer before the question arrives.\n\nThe government orders the Defense Forces to review their plans, and the diplomats to keep listening. At the harbours the ferry captains notice that the naval patrols have started sailing a little further out each week.\n\nProvisional gameplay: Usea's 2001-2002 tensions have no Chronicle entry; this briefing is authored."
 ac_ud_npt.19.a:0 "Prepare to help our friends on the mainland."
 ac_ud_npt.19.b:0 "Prepare to keep everyone at arm's length."
 ac_ud_npt.20.t:0 "Strangers in the Harbour Towns"
 ac_ud_npt.20.d:0 "On a Saturday night in one of the harbour towns, a fight starts in a bar between a group of allied aircrew and the crew of a fishing boat. Nobody is badly hurt. The bar's windows are broken, the town's only police car is overturned, and by Sunday morning every island has heard a different version of the story.\n\nThe incident is small, but it lands on a pile of grievances that has been growing for months. Rents in the harbour towns have doubled. The roads are full of military trucks driven by people who do not know them. The ferries are crowded with allied personnel who have not yet learned that the ferries leave on time and wait for no one. The island newspapers are full of letters, some reasonable and some not.\n\nThe allied command is embarrassed and anxious. The rear base depends on the islands' goodwill, and goodwill cannot be requisitioned. The island government is anxious too: it agreed to host the allies, and the islanders are beginning to ask whether anyone asked them.\n\nThe two sides meet on Monday morning. Both know that one more bad night could turn grumbling into something much worse.\n\nProvisional gameplay: the ISAF headquarters itself is official (ACES Chronicle, 2004 / 09.16); this incident is authored."
 ac_ud_npt.20.a:0 "Joint patrols and a liaison office in every harbour town."
 ac_ud_npt.20.b:0 "Allied personnel keep to their bases after dark."
 ac_ud_npt.21.t:0 "Neutral Ground"
 ac_ud_npt.21.d:0 "The request arrives in a diplomatic pouch from a third embassy, unsigned and typed on plain paper. It asks whether North Point would be willing to host a meeting between representatives of two governments whose names it does not give, to discuss matters it does not specify, in a place where neither side would feel threatened.\n\nThe government has offered its customs hall, its guarantees and its discretion to anyone who needs them, and this is the first answer. It could be anything: an exchange of prisoners, a humanitarian corridor, the first tentative step toward a settlement, or a trap designed to compromise the islands' neutrality in the eyes of one side or the other.\n\nThe foreign ministry is divided. Some officials want to accept immediately, on the grounds that a neutral who refuses to host talks is not much use to anyone. Others want to accept only talks about humanitarian matters, on the grounds that a neutral who becomes involved in politics will soon not be neutral at all.\n\nThe meeting room is prepared either way. The chairs are counted, the windows are checked, and the coffee is better than it has been in years.\n\nProvisional gameplay: the neutral lane and these talks are authored; they change no war state."
 ac_ud_npt.21.a:0 "Host the talks, whatever they are about."
 ac_ud_npt.21.b:0 "Host only humanitarian talks."
 ac_ud_npt.22.t:0 "The Islands Take Stock"
 ac_ud_npt.22.d:0 "The review is presented to the islands on the evening broadcast, in a series of programmes that runs for a week. It covers everything that has changed since the ballot boxes came ashore on the morning ferries in 1991: the government, the economy, the fleet, the shelters, the relief years and the continent's long crisis.\n\nIt is an honest document, which means it is not a comfortable one. It records the arguments the islands lost as well as the ones they won, the money spent badly as well as well, and the decisions that seemed wise at the time and look less so now. The islands listen, as they always do, and argue about it on the morning ferries, as they always do.\n\nFourteen years is a long time for islands that measure their history in fishing seasons. Children who were in primary school in 1991 are now old enough to serve in the coast watch. The question the Council asked on the night of the returns, about what the islands were to become, has been answered, at least for now, in a way that nobody in that windowless chamber could have predicted.\n\nThe last programme ends with the shipping forecast, as every programme on the islands always has.\n\nProvisional gameplay: the 2005 review is authored and describes only choices made in this tree."
 ac_ud_npt.22.a:0 "The Council kept its watch."
 ac_ud_npt.22.b:0 "The Parliament kept its word."
 ac_ud_npt.22.c:0 "The Directorate kept the islands whole."
 ac_ud_npt.22.e:0 "The islands kept themselves."
 ac_ud_npt.23.t:0 "Polling Day on the Ferries"
 ac_ud_npt.23.d:0 "As in 1991, the ballot boxes come ashore on the morning ferries under the eye of a single corporal per island. The difference is what they are for. This time the islands are electing a parliament with the power to govern, and everyone knows it.\n\nThe campaign has been loud. Posters cover the harbour walls, the radio carries debates into the small hours and the cafes have run out of chairs. The Democratic Republicans campaign on the convention and the charter. The Old Guard, reborn as a civilian party, campaigns on caution. The Reformists campaign on readiness and win more votes in the barracks towns than the cabinet expected.\n\nOn polling day the queues form before dawn. Volunteers lay out the rolls on long tables in the subdivision halls, schoolteachers check names against the registers, and the radio announcers remind listeners every quarter hour that polling closes at dusk. The Defense Forces escort the boxes and nothing else, as they promised.\n\nThe count takes two days. Whoever has won, the provisional cabinet's last act is to hand over to them, and the islands find, somewhat to their surprise, that it does. The old Council members watch the handover from the public gallery and leave without comment, which the newspapers agree is the most eloquent thing they have said in years.\n\nProvisional gameplay: an alternate government path for players only; the AI keeps the 1991 government."
 ac_ud_npt.23.a:0 "Count every ballot twice."
 ac_ud_npt.23.b:0 "Announce the result on the evening broadcast."
 NPT_ud_compact_stratocracy_spirit:0 "The Subdivision Compact"
 NPT_ud_compact_stratocracy_spirit_desc:0 "The division of powers between the National Defense Council and the subdivision governments is written down at last. Disputes go to a joint hearing instead of a telephone call.\n\n§gProvisional gameplay.§!"
 NPT_ud_chartered_council_spirit:0 "The Council Charter"
 NPT_ud_chartered_council_spirit_desc:0 "A military government that has written down the limits of its own authority, and publishes what it does within them.\n\n§gProvisional gameplay.§!"
 NPT_ud_merit_boards_spirit:0 "Merit Boards"
 NPT_ud_merit_boards_spirit_desc:0 "Promotion examinations are held in public halls on every island, and the results are posted the next morning.\n\n§gProvisional gameplay.§!"
 NPT_ud_council_seniority_spirit:0 "Seniority on the Council"
 NPT_ud_council_seniority_spirit_desc:0 "Council seats pass to the longest-serving officers of each service.\n\n§gProvisional gameplay.§!"
 NPT_ud_council_rotation_spirit:0 "Rotation by Merit"
 NPT_ud_council_rotation_spirit_desc:0 "Council seats rotate on fixed terms among officers who have passed the merit boards and served in a subdivision post.\n\n§gProvisional gameplay.§!"
 NPT_ud_island_parliament_spirit:0 "The Parliament of the Islands"
 NPT_ud_island_parliament_spirit_desc:0 "Foreign and defence affairs answer to a cabinet responsible to an elected parliament. Provisional alternate history.\n\n§gProvisional gameplay.§!"
 NPT_ud_civilian_defence_spirit:0 "A Civilian Ministry of Defence"
 NPT_ud_civilian_defence_spirit_desc:0 "The Defense Forces report to a civilian minister. The islands still defend every shore, but no longer pretend the continent does not exist.\n\n§gProvisional gameplay.§!"
 NPT_ud_rights_charter_spirit:0 "The Charter of Island Rights"
 NPT_ud_rights_charter_spirit_desc:0 "Every island keeps its council, every citizen may petition, and the harbours stay open to anyone in distress.\n\n§gProvisional gameplay.§!"
 NPT_ud_readiness_state_spirit:0 "The Readiness Directorate"
 NPT_ud_readiness_state_spirit_desc:0 "The subdivisions' budgets, ports and roads answer to a single defence plan. Provisional alternate history.\n\n§gProvisional gameplay.§!"
 NPT_ud_national_service_spirit:0 "Universal National Service"
 NPT_ud_national_service_spirit_desc:0 "Every citizen serves in the Defense Forces, the coast watch or the civil defence corps.\n\n§gProvisional gameplay.§!"
 NPT_ud_professional_cadre_spirit:0 "A Professional Cadre"
 NPT_ud_professional_cadre_spirit_desc:0 "A small, long-serving and well-paid defence force.\n\n§gProvisional gameplay.§!"
 NPT_ud_hedgehog_islands_spirit:0 "The Hedgehog Doctrine"
 NPT_ud_hedgehog_islands_spirit_desc:0 "Every island is a separate fortress that must be taken separately.\n\n§gProvisional gameplay.§!"
 NPT_ud_harbour_yards_spirit:0 "The Harbour Yards"
 NPT_ud_harbour_yards_spirit_desc:0 "The ship-repair yards have become shipyards able to build for the islands.\n\n§gProvisional gameplay.§!"
 NPT_ud_airframe_workshops_spirit:0 "The Airframe Workshops"
 NPT_ud_airframe_workshops_spirit_desc:0 "Overhaul hangars that rebuild engines, airframes and radar sets on the islands.\n\n§gProvisional gameplay.§!"
 NPT_ud_self_sufficient_islands_spirit:0 "Self-Sufficient Islands"
 NPT_ud_self_sufficient_islands_spirit_desc:0 "A civil works programme carries new industrial skills to the outer islands.\n\n§gProvisional gameplay.§!"
 NPT_ud_island_industry_spirit:0 "An Industry That Can Stand Alone"
 NPT_ud_island_industry_spirit_desc:0 "Yards, workshops, canneries and depots form one island economy.\n\n§gProvisional gameplay.§!"
 NPT_ud_coastal_fleet_spirit:0 "A Coastal Defence Fleet"
 NPT_ud_coastal_fleet_spirit_desc:0 "Torpedo boats, minelayers and submarines that make every approach to the islands a gamble.\n\n§gProvisional gameplay.§!"
 NPT_ud_escort_fleet_spirit:0 "An Ocean Escort Fleet"
 NPT_ud_escort_fleet_spirit_desc:0 "Frigates and oilers trained to bring a tanker convoy through hostile water.\n\n§gProvisional gameplay.§!"
 NPT_ud_shelter_programme_spirit:0 "The Shelter Programme"
 NPT_ud_shelter_programme_spirit_desc:0 "Every island is preparing for the fall of Ulysses. The work steadies nerves and strains budgets.\n\n§gProvisional gameplay.§!"
 NPT_ud_relief_harbour_spirit:0 "Open Harbours"
 NPT_ud_relief_harbour_spirit_desc:0 "Anyone who reaches North Point by sea is fed, sheltered and registered.\n\n§gProvisional gameplay.§!"
 NPT_ud_registered_quota_spirit:0 "A Registered Quota"
 NPT_ud_registered_quota_spirit_desc:0 "Refugees are admitted up to a monthly quota; boats beyond it are supplied and escorted onward.\n\n§gProvisional gameplay.§!"
 NPT_ud_allied_rear_services_spirit:0 "Allied Rear Services"
 NPT_ud_allied_rear_services_spirit_desc:0 "The islands' yards, hangars and hospitals work for the allied forces. Official framing: ACES Chronicle, 2004 / 09.16; the values are provisional gameplay.\n\n§gProvisional gameplay.§!"
 NPT_ud_neutral_waters_spirit:0 "Neutral Waters"
 NPT_ud_neutral_waters_spirit_desc:0 "Open to ships in distress, closed to fleets at war.\n\n§gProvisional gameplay.§!"
 NPT_ud_island_cabinet_office:0 "Provisional Cabinet of the Islands"
 NPT_ud_island_cabinet_office_desc:0 "The cabinet answerable to the Parliament of the Islands. It governs as an office until the islands elect a government of their own. Unnamed office leader; provisional alternate history."
 NPT_ud_readiness_directorate_office:0 "The Readiness Directorate"
 NPT_ud_readiness_directorate_office_desc:0 "The office through which the Reformist officers govern North Point. Its orders carry a seal, not a name. Unnamed office leader; provisional alternate history."
 NPT_ud_council_question:0 "The Question Before the Council"
 NPT_ud_council_question_desc:0 "The 1991 returns are counted, sealed and filed, and they have answered nothing. Every party now calls the vote a mandate, and every officer on the National Defense Council knows that the arrangement which kept the islands out of the continent's wars was never written down anywhere it could be amended.\n\nThe Council has called a closed session to decide what the islands are to become. The subdivision governments have sent observers. The harbour unions have sent a letter. Nobody has sent a plan.\n\n§gMod provenance:§! the National Defense Council, its subdivision governments and the 1991 parties come from the April 2024 archive. The effects are provisional gameplay."
 NPT_ud_council_endures:0 "The Council Endures"
 NPT_ud_council_endures_desc:0 "The Old Guard officers make their case in the language of ledgers: the harbours kept open to every flag, the wars the islands stayed out of, the ferries that ran on time. The Council will not dissolve itself, and it will not apologise for existing.\n\nWhat it offers instead is repair. The National Defense Council keeps the foreign ministry, the harbours and the guns, and it will learn to explain itself to the islands it protects. Nobody is promised a parliament. Everybody is promised an answer.\n\n§gMod provenance:§! the National Defense Council, its subdivision governments and the 1991 parties come from the April 2024 archive. The effects are provisional gameplay."
 NPT_ud_parliament_petition:0 "Petition for a Parliament"
 NPT_ud_parliament_petition_desc:0 "The Democratic Republicans carry the petition from island to island on the morning ferries, and by the time it reaches the capital it fills three crates bound with fishing twine. It asks for one thing: a parliament elected by every island, with the Council answerable to it.\n\nThe Council cannot ignore a petition signed across half the port towns. It can decide how long to spend reading it. The Democratic Republicans have decided not to let it take long.\n\n§gMod provenance:§! the National Defense Council, its subdivision governments and the 1991 parties come from the April 2024 archive. The effects are provisional gameplay."
 NPT_ud_reformist_programme:0 "The Reformist Programme"
 NPT_ud_reformist_programme_desc:0 "The Reformists never wanted the Council gone. They want it whole: one budget, one chain of command, one plan for every island, and no more harbour councils voting on whether the coastal guns may be test-fired.\n\nTheir programme is printed on the naval academy's own press and handed out by cadets on leave. It calls the present arrangement a peacetime luxury and promises that a North Point which plans as one nation will never need to choose a side.\n\n§gMod provenance:§! the National Defense Council, its subdivision governments and the 1991 parties come from the April 2024 archive. The effects are provisional gameplay."
 NPT_ud_merit_boards:0 "Open the Merit Boards"
 NPT_ud_merit_boards_desc:0 "The Council has always called itself meritocratic, and the islands have always noticed that merit tends to run in the same few service families. The new boards will examine candidates from every subdivision in public halls, with the marks posted on the harbour notice boards the next morning.\n\nThe first examination draws a queue around the block. Not every candidate passes. Every candidate goes home knowing why.\n\n§gProvisional gameplay.§!"
 NPT_ud_subdivision_compact:0 "The Subdivision Compact"
 NPT_ud_subdivision_compact_desc:0 "For decades the line between the Council's business and the subdivisions' business has been settled by habit, telephone calls and the occasional threat. The compact writes it down: what the islands govern, what the Council governs, and how a dispute between them is heard.\n\nIt is a dry document and the radio announcers struggle to make it sound exciting. The subdivision clerks, who have spent their careers guessing, read it twice.\n\n§gMod provenance:§! the National Defense Council, its subdivision governments and the 1991 parties come from the April 2024 archive. The effects are provisional gameplay."
 NPT_ud_council_bulletin:0 "The Council Bulletin"
 NPT_ud_council_bulletin_desc:0 "Every Friday the Council will publish what it decided, what it spent and what it declined to discuss. The first edition runs to four pages, two of which are a list of harbour dues.\n\nThe Bulletin is pinned up in post offices and read aloud on the evening broadcast. Within a month the subdivision newspapers are printing replies, and the Council has started reading them.\n\n§gProvisional gameplay.§!"
 NPT_ud_civil_liaison:0 "Civil Liaison Officers"
 NPT_ud_civil_liaison_desc:0 "Each subdivision hall receives an officer whose only duty is to listen. They carry no weapons and command no troops; they write reports, and the Council has promised to answer every one within a month.\n\nThe first reports are about ferries, school roofs and fishing quotas. The second batch is about the liaison officers themselves. The Council reads both.\n\n§gProvisional gameplay.§!"
 NPT_ud_succession_question:0 "The Question of Succession"
 NPT_ud_succession_question_desc:0 "Nobody has ever written down how a seat on the National Defense Council is filled when its holder retires. Seats have changed hands by understanding, by recommendation and, now and then, by funeral. The compact and the merit boards have made that silence conspicuous.\n\nThe Council must decide whether it renews itself by seniority, as it always has in practice, or by rotation through the merit boards. Either answer will outlast the officers who give it.\n\n§gProvisional gameplay.§!"
 NPT_ud_seniority_rule:0 "Seniority on the Council"
 NPT_ud_seniority_rule_desc:0 "The Council chooses continuity. Seats pass to the longest-serving officers of each service, and the islands are told, with some justice, that experience cannot be examined in a public hall.\n\nThe decision steadies the barracks and the wardrooms. In the port towns it is received as the Council protecting its own, which is not entirely unfair either.\n\n§gProvisional gameplay.§!"
 NPT_ud_rotation_by_merit:0 "Rotation by Merit"
 NPT_ud_rotation_by_merit_desc:0 "Seats on the Council will rotate on fixed terms, filled from officers who have passed the merit boards and served a term in a subdivision post. Nobody will sit at the table who has not first sat in a harbour office and been shouted at about ferry fares.\n\nThe older officers call it a revolution. The younger ones call it overdue. The fishing towns call it the first Council decision they have fully understood.\n\n§gProvisional gameplay.§!"
 NPT_ud_council_charter:0 "A Charter for the Council"
 NPT_ud_council_charter_desc:0 "Everything the Council has conceded since 1991 is gathered into a single charter: the compact, the merit boards, the Bulletin and the rules of succession. It is read in every subdivision hall on the same evening and signed by every member of the Council in front of the cameras.\n\nThe charter does not make North Point a democracy. It makes it something rarer: a military government that has written down the limits of its own authority.\n\n§gMod provenance:§! the National Defense Council, its subdivision governments and the 1991 parties come from the April 2024 archive. The effects are provisional gameplay."
 NPT_ud_council_emergency_powers:0 "Emergency Powers for the Sky"
 NPT_ud_council_emergency_powers_desc:0 "The asteroid warning has given the Council something it has wanted for years and dreaded for as long: a reason for emergency powers. The charter lets it requisition ferries, warehouses and labour for civil defence. It also obliges the Council to publish every requisition in the Bulletin.\n\nThe officers draft the orders carefully. If the islands are to give up their boats and their warehouses, they will want to know exactly who asked, and why.\n\n§YOfficial:§! ACES Chronicle, 1996 / 04.20. The effects are provisional gameplay."
 NPT_ud_council_open_sessions:0 "Open Sessions of the Council"
 NPT_ud_council_open_sessions_desc:0 "Twice a year the Council will sit with the public gallery open. Any citizen may submit a written question, and the Council must answer the ten most supported in person.\n\nThe first open session runs four hours over time. The admirals are asked about ferry timetables, and a schoolchild asks why the radar station on the headland hums at night. The Council answers both. It is not dignified, but every household with a radio is listening.\n\n§gProvisional gameplay.§!"
 NPT_ud_council_long_watch:0 "The Council's Long Watch"
 NPT_ud_council_long_watch_desc:0 "The Council that sat down in 1991 to answer the question of the islands has given its answer. It remains, it governs the harbours and the guns, and it has learned to account for both.\n\nNo one would call it a perfect arrangement. It has survived elections, petitions and the threat of a falling sky, and the islands have discovered that they can argue with their soldiers without fearing them.\n\n§gMod provenance:§! the National Defense Council, its subdivision governments and the 1991 parties come from the April 2024 archive. The effects are provisional gameplay."
 NPT_ud_subdivision_delegates:0 "Convene the Subdivision Delegates"
 NPT_ud_subdivision_delegates_desc:0 "Every subdivision government is invited to send three delegates to the capital: one from its council, one from its civil service and one chosen by lot from its electoral roll. The Council provides the hall, the stenographers and a guarantee that nobody will be arrested for anything said inside it.\n\nThe delegates arrive with competing drafts, regional grievances and, in one case, a crate of smoked fish as a gesture of goodwill. The first week is spent agreeing on the order of business.\n\n§gProvisional gameplay.§!"
 NPT_ud_constitutional_convention:0 "The Constitutional Convention"
 NPT_ud_constitutional_convention_desc:0 "The convention sits in the old customs hall, the only building in the capital large enough to seat every delegate and honest enough to have no portraits on the walls. The Council's observers take the back row and say nothing for three days.\n\nThe argument that matters is not whether North Point will have a parliament. It is what kind: a federal compact that leaves the islands their own governments, or a single roll of electors that makes the archipelago one nation.\n\n§gProvisional gameplay.§!"
 NPT_ud_federal_compact:0 "A Federal Compact of Islands"
 NPT_ud_federal_compact_desc:0 "The convention votes for the islands as they are. Each subdivision keeps its government, its budget and its courts; the parliament will sit for what they share: defence, foreign relations, the harbours and the currency.\n\nThe outer islands celebrate. The capital's economists warn that a federation of fishing towns will struggle to raise a loan. Both are right.\n\n§gProvisional gameplay.§!"
 NPT_ud_unitary_parliament:0 "One Roll for All the Islands"
 NPT_ud_unitary_parliament_desc:0 "The convention votes for one nation. Every adult on every island will be entered on a single electoral roll, and the parliament it elects will govern the whole archipelago. The subdivision governments become local councils, with their powers set by law.\n\nThe capital celebrates. Several outer-island delegates walk out and are persuaded back with guaranteed seats. The compromise is ugly, and it holds.\n\n§gProvisional gameplay.§!"
 NPT_ud_parliament_of_islands:0 "The Parliament of the Islands"
 NPT_ud_parliament_of_islands_desc:0 "The National Defense Council hands its foreign and defence portfolios to a cabinet answerable to the new Parliament of the Islands. The handover takes place in the customs hall at noon, with the Council in dress uniform and the cabinet in borrowed suits.\n\nUntil the first national election can be organised, the cabinet governs as a provisional office. It has no leader the islands know by name, only a mandate, a convention and a very short list of things it is allowed to get wrong.\n\n§gProvisional gameplay.§!"
 NPT_ud_civilian_defence_ministry:0 "A Civilian Ministry of Defence"
 NPT_ud_civilian_defence_ministry_desc:0 "The Defense Forces now report to a minister who has never worn a uniform. The officers are courteous about it in public and less so in the wardrooms, but the orders are obeyed.\n\nThe new ministry inherits the old doctrine of isolation along with the coastal guns, and it is quietly rewriting the first while keeping the second. North Point will still defend every island. It will no longer pretend that the rest of Usea does not exist.\n\n§gMod provenance:§! the National Defense Council, its subdivision governments and the 1991 parties come from the April 2024 archive. The effects are provisional gameplay."
 NPT_ud_open_budget:0 "The Open Budget"
 NPT_ud_open_budget_desc:0 "For the first time the national budget is debated line by line in public. The harbour dues, the fuel subsidies and the Defense Forces' spare-parts account are all read into the record, and the record is printed.\n\nThe debate lasts eleven days. Several long-standing payments to suppliers nobody can locate are quietly cancelled, and the treasury discovers it has rather more money than it believed.\n\n§gProvisional gameplay.§!"
 NPT_ud_council_retired:0 "Retire the Council with Honour"
 NPT_ud_council_retired_desc:0 "The National Defense Council still exists on paper: a committee of senior officers with no portfolio and a great deal of prestige. The cabinet must decide whether to abolish it outright or keep it as an advisory body the generals can be proud to sit on.\n\nThe question is not sentimental. The Defense Forces accepted civilian rule because the Council told them to. How the Council itself is treated will be remembered in every barracks.\n\n§gMod provenance:§! the National Defense Council, its subdivision governments and the 1991 parties come from the April 2024 archive. The effects are provisional gameplay."
 NPT_ud_first_national_election:0 "The First National Election"
 NPT_ud_first_national_election_desc:0 "The ballot boxes come ashore on the morning ferries again, as they did in 1991. This time they will elect a parliament with the power to govern, and the candidates know it. Posters cover the harbour walls and the radio carries debates into the small hours.\n\nThe provisional cabinet has promised to hand over to whoever wins. The Defense Forces have promised to escort the ballot boxes and nothing else.\n\n§gProvisional gameplay.§!"
 NPT_ud_island_rights_charter:0 "A Charter of Island Rights"
 NPT_ud_island_rights_charter_desc:0 "The parliament's first great act is a charter that no government, civilian or military, may repeal by an ordinary vote: the right of every island to its own council, the right of every citizen to petition, and the right of the harbours to stay open to anyone in distress.\n\nThe last clause is the convention's tribute to the fishing towns, and it will be quoted more often than any of the others.\n\n§gProvisional gameplay.§!"
 NPT_ud_voice_in_usea:0 "A Voice in Usean Councils"
 NPT_ud_voice_in_usea_desc:0 "The new government sends its foreign minister to the mainland with a message the old Council never cared to deliver: North Point is a parliamentary state and expects to be treated as one. The continental diplomats are polite and a little surprised.\n\nThe islands gain no alliance and want none. They gain a seat at the conferences where shipping, fisheries and the asteroid are discussed, and a reputation for doing what they say.\n\n§gProvisional gameplay.§!"
 NPT_ud_readiness_audit:0 "The National Readiness Audit"
 NPT_ud_readiness_audit_desc:0 "Reformist staff officers spend a season touring every island with clipboards. They count rifles, ferries, fuel drums, fishing boats that could carry troops and harbour cranes that could lift a gun. Nothing is too small to be listed.\n\nThe audit's conclusion is a single sentence: the islands could defend themselves, if anyone were in charge of all of them at once. The Reformists intend to be.\n\n§gProvisional gameplay.§!"
 NPT_ud_readiness_directorate:0 "The Readiness Directorate"
 NPT_ud_readiness_directorate_desc:0 "The National Defense Council votes, by a narrow and bitterly argued margin, to suspend the old division of powers and govern through a Readiness Directorate. The subdivision governments remain, but their budgets, their ports and their roads now answer to the Directorate's plan.\n\nThe Directorate is an office, not a person. Its orders are signed with a seal and its spokesmen never give their names. The Reformists call this modesty. Their opponents call it the point.\n\n§gProvisional gameplay.§!"
 NPT_ud_national_service:0 "Universal National Service"
 NPT_ud_national_service_desc:0 "Every citizen of North Point will serve: eighteen months for most, in the Defense Forces, the coast watch or the civil defence corps. Exemptions are few and published.\n\nThe ferries fill with conscripts heading for the training depots, and the fishing towns complain that their crews have been taken in the middle of the season. The Directorate adjusts the call-up dates and nothing else.\n\n§gProvisional gameplay.§!"
 NPT_ud_professional_cadre:0 "A Professional Cadre"
 NPT_ud_professional_cadre_desc:0 "The Directorate decides that a small, well-paid, long-serving force will defend the islands better than a large and resentful one. Recruiters tour the schools with brochures and the promise of a trade.\n\nThe Defense Forces become smaller, older and much harder to surprise. The fishing towns keep their crews, and the Directorate keeps their gratitude.\n\n§gProvisional gameplay.§!"
 NPT_ud_subdivision_prefects:0 "Prefects for the Subdivisions"
 NPT_ud_subdivision_prefects_desc:0 "Each subdivision receives a prefect from the Directorate, with authority over its harbours, its fuel stores and its emergency plans. The elected councils keep their schools, their clinics and their tempers.\n\nThe first prefects are met at the ferry ramps by silent crowds. In two subdivisions the councils refuse to hand over the keys to the harbour offices.\n\n§gProvisional gameplay.§!"
 NPT_ud_hedgehog_doctrine:0 "The Hedgehog Doctrine"
 NPT_ud_hedgehog_doctrine_desc:0 "Armed neutrality, the Directorate declares, means making every island a separate fortress that must be taken separately. Coastal batteries are dispersed, ammunition is buried, and every harbour is surveyed for blocking with sunken hulks.\n\nVisiting attaches are invited to watch the exercises. They are meant to report home that North Point would be expensive to invade. Most of them do.\n\n§gMod provenance:§! the National Defense Council, its subdivision governments and the 1991 parties come from the April 2024 archive. The effects are provisional gameplay."
 NPT_ud_directorate_radio:0 "Directorate Radio"
 NPT_ud_directorate_radio_desc:0 "The evening broadcast is reorganised under the Directorate's information office. The shipping forecast stays. The music becomes more martial, the news becomes shorter, and a nightly segment explains, patiently and at length, why the plan is working.\n\nThe islands keep listening, because there is little else to listen to and because the shipping forecast is still the best on the coast.\n\n§gProvisional gameplay.§!"
 NPT_ud_neutrality_declared:0 "Neutrality Declared to the World"
 NPT_ud_neutrality_declared_desc:0 "The Directorate sends identical notes to every government with an embassy on the islands. North Point will join no alliance, host no foreign base and admit no foreign warship to its harbours without inspection. Any power that violates its waters will be treated as an enemy.\n\nThe notes are acknowledged with diplomatic courtesy. In private, at least one embassy asks whether the islands are serious, and its attache is invited to watch a live-fire exercise from very close range.\n\n§gProvisional gameplay.§!"
 NPT_ud_directorate_review:0 "The Directorate Reviews Itself"
 NPT_ud_directorate_review_desc:0 "The Directorate was established for an emergency its founders defined generously. The audit is complete, the islands are fortified and the harbours answer to a single plan. The question now is whether it remains a temporary office or becomes the permanent government of North Point.\n\nThe Reformists are divided. The subdivision councils, which kept their schools and lost their harbours, are watching closely.\n\n§gProvisional gameplay.§!"
 NPT_ud_island_economy:0 "What the Islands Make"
 NPT_ud_island_economy_desc:0 "The islands have always lived by the sea: fish, ferries, harbour dues and the repair trade for ships passing through the straits. The government's economists have produced the first complete survey of what North Point actually makes, and it is a short document.\n\nThere is money for one serious industrial programme. The yards and the airfields are both asking, and the survey's authors have declined, very carefully, to recommend either.\n\n§gProvisional gameplay.§!"
 NPT_ud_grid_interconnect:0 "Interconnect the Island Grids"
 NPT_ud_grid_interconnect_desc:0 "Each island has its own generators, its own voltage and its own opinion about which is correct. Undersea cables will tie the larger islands into a single grid, so that a storm on one does not plunge the others into darkness.\n\nThe cable ships work through two winters. When the switch is thrown, half the capital's lights flicker and then steady, and the engineers break out a bottle they have been saving for a year.\n\n§gProvisional gameplay.§!"
 NPT_ud_fuel_reserve:0 "The Strategic Fuel Reserve"
 NPT_ud_fuel_reserve_desc:0 "North Point imports every litre of fuel it burns. The reserve will hold enough to keep the ferries, the fishing fleet and the Defense Forces running for a season if the tankers stop coming.\n\nThe tanks are dug into the hillsides behind the main harbour and painted the colour of the rock. The harbour children are told they are water tanks, and believe it for nearly a week.\n\n§gProvisional gameplay.§!"
 NPT_ud_ferry_timetable:0 "A National Ferry Timetable"
 NPT_ud_ferry_timetable_desc:0 "Every island runs its own ferries, and no two timetables agree. A national timetable will coordinate them so that a passenger, a crate of fish or a company of reservists can cross the archipelago in a day.\n\nIt takes a year of negotiation with a dozen ferry companies and a fishermen's cooperative. The result is printed on a single sheet and pinned up in every harbour office, and it is the most popular document the government has ever produced.\n\n§gProvisional gameplay.§!"
 NPT_ud_harbour_yards:0 "The Harbour Yards"
 NPT_ud_harbour_yards_desc:0 "The government chooses the sea. The ship-repair yards around the main harbours will grow into real shipyards, able to build the patrol craft and coasters the islands have always bought abroad.\n\nThe yard foremen are delighted and immediately ask for twice the money. The welders ask for a training school. The government gives them half of each and a deadline.\n\n§gProvisional gameplay.§!"
 NPT_ud_airframe_workshops:0 "The Airframe Workshops"
 NPT_ud_airframe_workshops_desc:0 "The government chooses the air. The overhaul hangars at the Defense Forces' airfields will become workshops able to rebuild engines, airframes and radar sets, and in time to build light aircraft of their own.\n\nThe ground crews are delighted and immediately ask for a wind tunnel. They do not get one. They do get licences, tools and a contract to service every airliner that lands on the islands.\n\n§gProvisional gameplay.§!"
 NPT_ud_longer_slipways:0 "Lengthen the Slipways"
 NPT_ud_longer_slipways_desc:0 "The old slipways were built for trawlers. Lengthened and reinforced, they will take hulls the size of a coastal escort, and the yards will no longer turn away ferries that need a new keel.\n\nThe work is done in the off-season, when the fishing fleet is laid up and the yards would otherwise be idle. It finishes a month late, which the foremen describe as early.\n\n§gProvisional gameplay.§!"
 NPT_ud_marine_engines:0 "Marine Engine Workshops"
 NPT_ud_marine_engines_desc:0 "Most ships that fail in North Point's waters fail in the engine room. The yards will build their own engine workshops, able to overhaul the diesels of the fishing fleet and, in time, of the Defense Forces' patrol craft.\n\nThe first apprentices are the children of fishermen who have been repairing engines on deck for years. They pass the practical examination with ease and struggle with the paperwork.\n\n§gProvisional gameplay.§!"
 NPT_ud_shipwright_schools:0 "Shipwright Schools"
 NPT_ud_shipwright_schools_desc:0 "A shipyard is only as good as the people in it, and North Point has been losing its best shipwrights to the mainland for years. The new schools pay apprentices a wage and promise them a berth in the island yards when they qualify.\n\nThe first class is twice the size the instructors expected. Half have relatives already in the yards. The other half have relatives who left, and want to know whether it is worth coming home.\n\n§gProvisional gameplay.§!"
 NPT_ud_overhaul_hangars:0 "Overhaul Hangars"
 NPT_ud_overhaul_hangars_desc:0 "New hangars at the main airfield will let the workshops strip an aircraft to its frame, inspect every rivet and rebuild it to a better standard than it left the factory.\n\nThe first aircraft through is the oldest trainer in the Defense Forces' inventory. It flies out six weeks later, and its instructor swears it climbs better than it did on the day the instructor first learned to fly it.\n\n§gProvisional gameplay.§!"
 NPT_ud_avionics_benches:0 "Avionics Benches"
 NPT_ud_avionics_benches_desc:0 "Radios, radar sets and navigation equipment fail in the salt air faster than anything else on an aircraft. The avionics benches will repair them on the islands instead of shipping them to the mainland and waiting months for their return.\n\nThe technicians are recruited from the radar stations on the headlands, where they have been keeping old equipment alive with spare parts and patience.\n\n§gProvisional gameplay.§!"
 NPT_ud_aero_engines:0 "Licensed Aero-Engine Production"
 NPT_ud_aero_engines_desc:0 "The workshops have learned to repair engines. The next step is to build them under licence, so that the Defense Forces' aircraft no longer depend on a single foreign supplier's goodwill.\n\nThe licence is expensive and the first engines come slowly. They are also, the test pilots report, entirely reliable, which on islands with few emergency runways is the only quality that matters.\n\n§gProvisional gameplay.§!"
 NPT_ud_self_sufficiency:0 "Self-Sufficiency within the Archipelago"
 NPT_ud_self_sufficiency_desc:0 "Whatever the government chose to build, the lesson of the programme is the same: the islands can make more of what they need than anyone believed. A civil works programme now spreads the new skills from the main harbour to the outer islands.\n\nWorkshops open in towns that have never had anything larger than a boatyard. Not all of them will last. Enough of them will.\n\n§gProvisional gameplay.§!"
 NPT_ud_cannery_contracts:0 "Cannery Contracts with the Mainland"
 NPT_ud_cannery_contracts_desc:0 "North Point's fish has always gone to the continent fresh, at whatever price the mainland buyers chose to pay. The new canneries will put it in tins, with the islands' name on the label, and sell it on contracts the government negotiates.\n\nThe first contract is signed with a Central Usean wholesaler and the second with an Erusean one. The government sees no contradiction in feeding both.\n\n§gProvisional gameplay.§!"
 NPT_ud_spare_parts:0 "The Spare-Parts Depots"
 NPT_ud_spare_parts_desc:0 "The surveys found that half of North Point's broken machinery was waiting for a part that existed somewhere on the islands, in a warehouse nobody had catalogued. The new depots catalogue everything and ship it on the national ferry timetable.\n\nThe wait for a spare part falls from months to days. The Defense Forces, which have been hoarding parts in their own stores for decades, are persuaded to join the catalogue, eventually.\n\n§gProvisional gameplay.§!"
 NPT_ud_industry_stands_alone:0 "An Industry That Can Stand Alone"
 NPT_ud_industry_stands_alone_desc:0 "The yards, the workshops, the canneries and the depots now form a single economy rather than a collection of harbours that happen to fly the same flag. North Point still imports its fuel and its steel, but it no longer imports its skills.\n\nIf the tankers ever stop coming, the islands will not run for long. They will run for longer than anyone on the continent expects.\n\n§gProvisional gameplay.§!"
 NPT_ud_fleet_review:0 "The Fleet at Anchor"
 NPT_ud_fleet_review_desc:0 "Once a year the Defense Forces' small navy anchors in a single line off the capital so the islands can see it. This year the naval staff use the review to ask a question nobody has asked in a generation: what is the fleet for?\n\nOne school of officers wants a fleet that can make the straits impassable. The other wants a fleet that can keep the sea lanes open when the tankers need an escort. The budget will pay for one of them.\n\n§gProvisional gameplay.§!"
 NPT_ud_coastal_fleet:0 "A Coastal Defence Fleet"
 NPT_ud_coastal_fleet_desc:0 "The naval staff choose the straits. North Point's fleet will be small, fast and close to home: torpedo boats, minelayers and submarines that make any approach to the islands a gamble.\n\nThe fleet will never cross an ocean. It is not meant to. It is meant to make sure that nobody crosses the narrow seas around North Point without the islands' permission.\n\n§gProvisional gameplay.§!"
 NPT_ud_ocean_escorts:0 "An Ocean Escort Fleet"
 NPT_ud_ocean_escorts_desc:0 "The naval staff choose the sea lanes. North Point's fleet will build frigates and fleet oilers able to escort a tanker convoy across open water, because islands that cannot import fuel have already surrendered.\n\nThe fleet will never be large. It will practise convoy work until it is second nature.\n\n§gProvisional gameplay.§!"
 NPT_ud_fast_attack_craft:0 "Fast Attack Craft for the Straits"
 NPT_ud_fast_attack_craft_desc:0 "The yards and the naval staff design a fast attack craft small enough to hide in a fishing harbour and armed heavily enough to threaten a destroyer. The first boats are laid down on the old trawler slipways.\n\nTheir crews come from the fishing towns, where people who have handled boats since childhood find the work familiar and the pay better than fishing.\n\n§gProvisional gameplay.§!"
 NPT_ud_straits_minefields:0 "Plans for the Straits Minefields"
 NPT_ud_straits_minefields_desc:0 "North Point will not lay mines in peacetime. It will survey every channel, stockpile the mines and train the minelayers, so that the straits can be closed within days if the islands are threatened.\n\nThe survey charts are classified. The fishermen, who know every channel better than the charts do, are quietly consulted anyway.\n\n§gProvisional gameplay.§!"
 NPT_ud_coastal_submarines:0 "A Submarine Flotilla"
 NPT_ud_coastal_submarines_desc:0 "A handful of coastal submarines will lie in wait in the deep channels between the islands. They are cramped, slow and miserable to serve in, and they are the one weapon every naval staff on the continent takes seriously.\n\nThe first crews train for months before the island yards can deliver their boats. The flotilla's motto, painted on its first conning tower, is a single word: patience.\n\n§gProvisional gameplay.§!"
 NPT_ud_straits_watch:0 "The Straits Watch"
 NPT_ud_straits_watch_desc:0 "A chain of radar stations and observation posts along the headlands will watch every channel into North Point's waters, day and night, and report to a single naval control room in the capital.\n\nThe watch logs every ship that passes: tankers, trawlers, freighters and the occasional warship that wanders closer than its captain intended. Within a year the logbooks are the best record of northern shipping anywhere.\n\n§gProvisional gameplay.§!"
 NPT_ud_escort_frigates:0 "Escort Frigates"
 NPT_ud_escort_frigates_desc:0 "The yards will build frigates designed for one task: shepherding merchant ships through hostile water. They will carry sonar, anti-aircraft guns and enough fuel to stay with a slow convoy for a week.\n\nThe design is unglamorous and the admirals who prefer big guns grumble about it. The tanker captains who may one day sail through a war zone do not grumble at all.\n\n§gProvisional gameplay.§!"
 NPT_ud_convoy_school:0 "The Convoy School"
 NPT_ud_convoy_school_desc:0 "Escorting a convoy cannot be learned from a manual. The convoy school will train naval officers and merchant captains together, in classrooms and at sea, until each understands what the other will do when the first torpedo is reported.\n\nThe merchant captains are sceptical until the first exercise, when a frigate lays a smoke screen exactly where it said it would. After that they ask to come back.\n\n§gProvisional gameplay.§!"
 NPT_ud_fleet_oilers:0 "Fleet Oilers"
 NPT_ud_fleet_oilers_desc:0 "Frigates are useless if they must turn back for fuel halfway across the sea. Coastal tankers converted in the island yards will let the escort fleet stay at sea as long as its convoy does.\n\nThe first replenishment exercise ends with a fuel hose in the water and a frigate captain in a towering rage. The second goes better.\n\n§gProvisional gameplay.§!"
 NPT_ud_sea_lane_patrols:0 "Sea-Lane Patrols"
 NPT_ud_sea_lane_patrols_desc:0 "The escort fleet begins regular patrols along the tanker routes, showing the islands' flag to every merchant ship that passes and logging anything unusual.\n\nThe patrols find nothing dramatic: a drifting lifeboat, an unlit freighter, a fishing fleet far outside its waters. They find enough to convince the naval staff that the sea lanes are less empty than they look.\n\n§gProvisional gameplay.§!"
 NPT_ud_naval_air_wing:0 "A Naval Air Wing"
 NPT_ud_naval_air_wing_desc:0 "Whatever kind of fleet North Point has chosen, it cannot see far enough from the sea. A naval air wing of patrol aircraft and helicopters will extend its eyes beyond the horizon and its reach beyond its guns.\n\nThe aviators and the sailors argue for a month about who will command it. The answer is both, which satisfies neither and works surprisingly well.\n\n§gProvisional gameplay.§!"
 NPT_ud_fishermen_reserve:0 "The Fishermen's Naval Reserve"
 NPT_ud_fishermen_reserve_desc:0 "The islands' fishermen know the waters better than any naval officer. The new reserve enlists them, their boats and their radios as auxiliary patrol craft and observers in time of crisis.\n\nThe reservists drill one weekend a month and are paid for their fuel. Their reports are informal, frequently profane and, the naval staff admit, almost always accurate.\n\n§gProvisional gameplay.§!"
 NPT_ud_harbour_booms:0 "Harbour Defence Booms"
 NPT_ud_harbour_booms_desc:0 "Anti-submarine nets and booms will close the main harbours at a moment's notice, so that no hostile submarine can slip in among the ferries and the fishing fleet.\n\nThe booms are tested at night to avoid disrupting the ferry timetable. The ferries are disrupted anyway, and the harbourmasters write a strongly worded letter.\n\n§gProvisional gameplay.§!"
 NPT_ud_command_of_waters:0 "Command of the Island Waters"
 NPT_ud_command_of_waters_desc:0 "North Point's fleet will never challenge a great power at sea. It does not need to. Within its own waters it knows every channel, every harbour and every ship that passes, and it can close those waters or keep them open as the government decides.\n\nThis year's review is held without speeches. The fleet anchors in line, the islands come out to watch, and the ships put to sea again the same afternoon.\n\n§gProvisional gameplay.§!"
 NPT_ud_sky_announcement:0 "A Date Written in the Sky"
 NPT_ud_sky_announcement_desc:0 "Central Usea has announced that the asteroid Ulysses will strike the Earth. The broadcast is repeated on the islands' radio in full, twice, and followed by a long silence while the station decides what to play next.\n\nThe government and the subdivision councils meet the same evening. The astronomers cannot yet say where the fragments will fall. North Point has to prepare for a disaster nobody can map.\n\n§YOfficial:§! ACES Chronicle, 1996 / 04.20. The effects are provisional gameplay."
 NPT_ud_headland_survey:0 "Survey the Headland Rock"
 NPT_ud_headland_survey_desc:0 "Geologists are flown in from the mainland to survey the hard rock of the headlands, where tunnels could shelter the islands' people if the fragments fall nearby.\n\nTheir report is cautiously encouraging. The rock is sound, the old coastal battery galleries can be extended, and the harbour towns are close enough to reach them within an hour. The outer islands are another matter.\n\n§gProvisional gameplay.§!"
 NPT_ud_civil_wardens:0 "Island Civil Wardens"
 NPT_ud_civil_wardens_desc:0 "Every street, village and fishing hamlet will have a civil warden: a volunteer trained to count heads, sound the alarm and lead the way to shelter. Each warden receives an armband, a whistle and a list of names.\n\nThe volunteers come from every corner of island life: retired sailors, schoolteachers, ferry clerks and harbour shopkeepers who already know everyone's business. The training is short. The lists are long.\n\n§gProvisional gameplay.§!"
 NPT_ud_deep_tunnels:0 "Tunnels under the Headlands"
 NPT_ud_deep_tunnels_desc:0 "The government chooses depth. Engineers will extend the battery galleries into tunnels beneath the headlands, deep enough to survive anything short of a direct strike and large enough to hold the people of the harbour towns.\n\nThe work is slow, expensive and loud, and the blasting can be heard across the straits. The outer islands ask, reasonably, what is being built for them. The answer is ferries.\n\n§gProvisional gameplay.§!"
 NPT_ud_dispersed_shelters:0 "A Shelter in Every Village"
 NPT_ud_dispersed_shelters_desc:0 "The government chooses breadth. Instead of a few great tunnels, every village and hamlet will build its own shelter: a reinforced cellar, a dugout in a hillside, a chapel crypt with a steel door.\n\nNo single shelter will survive a direct strike. Between them they put a refuge within a short walk of every household on every island, and the work gives every community something to do with its fear.\n\n§gProvisional gameplay.§!"
 NPT_ud_rock_wards:0 "Wards beneath the Rock"
 NPT_ud_rock_wards_desc:0 "Hospitals cannot be evacuated in an hour. Underground wards with operating theatres, generators and a month of supplies will let the islands' doctors keep working while the sky falls.\n\nThe surgeons inspect the first ward and ask for three changes, all of them involving light. The engineers provide them, and the doctors begin to stock the shelves.\n\n§gProvisional gameplay.§!"
 NPT_ud_seed_vaults:0 "Grain and Seed Vaults"
 NPT_ud_seed_vaults_desc:0 "If the fragments darken the sky or foul the sea, the islands must feed themselves for a season without fishing or imports. Vaults of grain, seed and preserved food are sealed in the tunnels and inventoried by the civil wardens.\n\nThe inventories are published, so that every island knows what is stored for it. Nothing does more for the islands' nerves than knowing, to the sack, what stands between them and hunger.\n\n§gProvisional gameplay.§!"
 NPT_ud_ferry_evacuation:0 "Evacuation by Ferry"
 NPT_ud_ferry_evacuation_desc:0 "The ferry fleet will rehearse moving the people of the most exposed islands to safer ground in a single day. Every ferry, trawler and harbour launch is given a route, a schedule and a list of passengers.\n\nThe first rehearsal takes three days instead of one. The second takes a day and a half. The harbourmasters are told that the third had better take a day, and it does.\n\n§gProvisional gameplay.§!"
 NPT_ud_shelter_kits:0 "Shelter Kits for the Outer Islands"
 NPT_ud_shelter_kits_desc:0 "The outer islands have no tunnels and few cellars. Each household there will receive a kit: water drums, a radio, a lamp, a first-aid case and instructions printed in large type.\n\nThe kits arrive by ferry, and by fishing boat where the ferries do not run. The outer islanders are unimpressed by the instructions and delighted by the radios.\n\n§gProvisional gameplay.§!"
 NPT_ud_fragment_forecasts:0 "Ask for the Fragment Forecasts"
 NPT_ud_fragment_forecasts_desc:0 "Central Usea's Stonehenge project is complete: eight railguns in a desert of San Salvacion, built to bring down the fragments of Ulysses before they reach the ground. North Point has no claim on the project and no guns that can reach the sky.\n\nIt can ask for the forecasts. The trajectories the project's astronomers calculate will decide where the fragments fall, and the islands' shelter plans are only as good as their warning.\n\n§YOfficial:§! ACES Chronicle, 1998 / 06.19, and Super Weapons, Stonehenge. The effects are provisional gameplay."
 NPT_ud_fragment_watch:0 "The Headland Fragment Watch"
 NPT_ud_fragment_watch_desc:0 "The radar stations on the headlands were built to watch for aircraft. Retuned and joined by optical trackers, they will watch the sky for fragments and give the islands minutes of warning instead of seconds.\n\nThe technicians are given new equipment, new orders and a direct telephone line to the civil wardens. They test the siren every evening at the same time, and the islands set their clocks by it.\n\n§gProvisional gameplay.§!"
 NPT_ud_last_drill:0 "The Last Drill"
 NPT_ud_last_drill_desc:0 "The final full-scale shelter drill is held with only months left on the calendar. The sirens sound across every island at once, the wardens open the tunnels and cellars, the ferries sail their evacuation routes and the hospitals move their patients below ground.\n\nWhen the all-clear sounds, the wardens count heads and file their reports, and the government reads every one. Whatever comes, North Point will meet it having rehearsed.\n\n§gProvisional gameplay.§!"
 NPT_ud_coup_across_the_water:0 "The Coup across the Water"
 NPT_ud_coup_across_the_water_desc:0 "Coup forces have risen across Usea. The radio reports are confused and contradictory: barracks seized, broadcasts cut, airfields closed. By evening it is clear that the Unified Command is fighting back, and that the islands will not know for days who holds the coast opposite.\n\nNorth Point is no part of the rising and intends to stay that way. Its harbours are filling with ships whose captains would rather not go home until the shooting stops.\n\n§YOfficial:§! ACES Chronicle, 1997 / 05.30. The effects are provisional gameplay."
 NPT_ud_harbour_garrisons:0 "Harbour Garrisons after the Coup"
 NPT_ud_harbour_garrisons_desc:0 "The coup has shown how quickly a quiet port can become a battlefield. Each main harbour will now have a standing garrison, a guarded fuel store and a plan for closing its gates within the hour.\n\nThe garrisons are small and mostly bored. They are also the reason the shipping agents and the ferry companies sleep better, and soon nobody in the harbour towns can remember the docks without a sentry.\n\n§gProvisional gameplay.§!"
 NPT_ud_after_the_fragments:0 "After the Fragments"
 NPT_ud_after_the_fragments_desc:0 "Ulysses has passed the Roche limit and broken apart, and its fragments have fallen across the world. On the islands the sirens sounded, the shelters filled and the radio went silent for hours that felt like days.\n\nNow the shelter doors are opening. The first reports from the continent are fragmentary and terrible. What happened to the islands themselves will take weeks to count, and the government must decide where to begin.\n\n§YOfficial:§! ACES Chronicle, 1999 / 07.08. The effects are provisional gameplay."
 NPT_ud_count_every_island:0 "Count Every Island"
 NPT_ud_count_every_island_desc:0 "The civil wardens go door to door with the lists they drew up for the drills. Every name is checked, every building inspected, every harbour sounded for wreckage.\n\nThe count is slow and painstaking, and the government refuses to publish a figure until it is finished. When it is published, it is believed, because every household on the islands helped to make it.\n\n§gProvisional gameplay.§!"
 NPT_ud_reopen_harbours:0 "Reopen the Harbours"
 NPT_ud_reopen_harbours_desc:0 "Nothing on the islands works without the harbours. Divers clear the channels, the cranes are inspected, and the ferry timetable restarts one route at a time, beginning with the routes that carry food.\n\nThe first ferry to complete its full timetable since the fragments fell is met at every stop by a crowd. It is carrying flour and mail, which is exactly what the crowds were waiting for.\n\n§gProvisional gameplay.§!"
 NPT_ud_ration_boards:0 "The Ration Boards"
 NPT_ud_ration_boards_desc:0 "Until the tankers and freighters return, fuel and food will be rationed by elected boards on each island, using the inventories the civil wardens kept before the impact.\n\nThe boards are argumentative, slow and scrupulously fair. Black markets appear and are reported to the boards by the very people they were meant to serve. Nobody on the islands goes hungry, though nobody eats well either.\n\n§gProvisional gameplay.§!"
 NPT_ud_outer_island_services:0 "Restore the Outer Island Services"
 NPT_ud_outer_island_services_desc:0 "The outer islands were the last to receive shelter kits and the last to receive news after the fragments fell. Engineers, doctors and radio technicians sail on the first available ferries to restore their power, their clinics and their link to the capital.\n\nThe teams find the outer islanders already at work, with their own generators running and their own lists of what they need. The engineers mostly take notes.\n\n§gProvisional gameplay.§!"
 NPT_ud_relief_flights:0 "Relief Flights to the Continent"
 NPT_ud_relief_flights_desc:0 "The islands have airfields, transport aircraft and, for the moment, more food than parts of the mainland coast. The government organises relief flights to the continent, flying supplies in and the injured out.\n\nThe flights land wherever a runway is still usable and nobody objects to a North Point roundel. The aircrews fly until they are ordered to rest, and then fly again.\n\n§gProvisional gameplay.§!"
 NPT_ud_mainland_hospital_beds:0 "Hospital Beds for the Mainland"
 NPT_ud_mainland_hospital_beds_desc:0 "The shelter wards are emptying, and the government offers their beds to patients from the continent. Hospital ships and transport aircraft bring the injured to the islands for treatment.\n\nThe island hospitals fill with patients who speak with mainland accents and ask, when they are well enough, how they can repay the islands. The doctors tell them to recover first.\n\n§gProvisional gameplay.§!"
 NPT_ud_boats_from_the_south:0 "Boats from the South"
 NPT_ud_boats_from_the_south_desc:0 "Across Usea the displaced are still moving. In April 2000 Erusea's government reached its decision about the refugees at its borders, and whatever that decision has meant on the continent, small boats have begun to appear off North Point's southern harbours.\n\nThey carry families, fishermen and a great many people who simply have nowhere else to go. The harbours cannot turn them away without a decision, and the government cannot postpone it much longer.\n\n§YOfficial:§! ACES Chronicle, 2000 / 04.21. The effects are provisional gameplay."
 NPT_ud_open_harbours:0 "Open Harbours"
 NPT_ud_open_harbours_desc:0 "The harbours will stay open. Anyone who reaches North Point by sea will be fed, sheltered and registered, and allowed to stay until it is safe to go home.\n\nThe decision is popular in the port towns, where the old seafaring rule that no boat in distress is turned away is quoted on every quay. It is less popular in the treasury, which has to pay for it.\n\n§gProvisional gameplay.§!"
 NPT_ud_registered_quota:0 "A Registered Quota"
 NPT_ud_registered_quota_desc:0 "The harbours will accept refugees up to a quota the government sets each month, registered on arrival and housed in camps on the larger islands. Boats beyond the quota are given fuel, food and water and escorted onward.\n\nThe policy satisfies nobody completely. It is, the government argues, the most the islands can promise and still keep.\n\n§gProvisional gameplay.§!"
 NPT_ud_relief_ledger:0 "The Relief Ledger"
 NPT_ud_relief_ledger_desc:0 "With the worst of the relief work behind them, the government publishes the relief ledger: everything the islands spent, everyone they sheltered, every flight and every ferry.\n\nThe ledger is not triumphant. It records the mistakes beside the successes, and the work of the wardens, doctors and aircrews who carried the islands through. The islands read it, argue about it and keep it.\n\n§gProvisional gameplay.§!"
 NPT_ud_continent_at_the_edge:0 "The Continent at the Edge"
 NPT_ud_continent_at_the_edge_desc:0 "Years after the fragments fell, Usea has not recovered and has not forgiven. The refugee camps, the ruined towns and old grievances have left the continent's governments suspicious of one another, and the radio from the mainland grows more anxious every month.\n\nNorth Point is party to none of those quarrels. It is, however, an island chain within reach of all of them, with airfields, harbours and a fleet. Whatever happens on the continent, someone will soon ask the islands which side they are on.\n\n§gProvisional gameplay.§!"
 NPT_ud_allied_rear:0 "Open the Islands to the Allies"
 NPT_ud_allied_rear_desc:0 "North Point has agreed to host the Independent State Allied Forces, and the agreement is now a fact on the ground: aircraft on the runways, staff officers in the schools and allied ships in the harbours. The government must decide how far the islands will go.\n\nThe answer is as far as the islands can bear. North Point will be the allies' rear base in earnest, with its yards, workshops and hospitals at their disposal, and in return it will ask to be consulted on everything done from its soil.\n\n§YOfficial:§! ACES Chronicle, 2004 / 09.16. The effects are provisional gameplay."
 NPT_ud_neutral_waters:0 "Keep the Waters Neutral"
 NPT_ud_neutral_waters_desc:0 "North Point will be nobody's base. Whatever coalitions form on the continent, the islands' airfields, harbours and yards will stay under the islands' own flag, open to ships in distress and closed to fleets at war.\n\nThe decision costs the islands friends on the mainland and earns them a different kind of respect. A neutral harbour in a crisis is a rare and valuable thing, and the government intends to keep it that way.\n\n§gProvisional gameplay.§!"
 NPT_ud_schools_returned:0 "Give the Schools Back"
 NPT_ud_schools_returned_desc:0 "The allied staff officers who took over the island schools have been grateful tenants, but the children want their classrooms back. The government builds a proper headquarters compound on the edge of the capital, with secure communications, barracks and an operations room.\n\nThe move takes a fortnight. The children return to schools whose walls are covered in faded situation maps, and several teachers decide to leave them up.\n\n§gProvisional gameplay.§!"
 NPT_ud_joint_air_control:0 "A Joint Air Control Centre"
 NPT_ud_joint_air_control_desc:0 "Allied squadrons, island squadrons and civilian traffic now share the same crowded airspace. A joint control centre on the headlands, built around the radar stations, will coordinate all of them.\n\nThe controllers speak with four accents and follow one procedure. Within a month the near-misses have stopped, and allied pilots who distrust anything that sounds like a headquarters begin to trust the voice from North Point.\n\n§gProvisional gameplay.§!"
 NPT_ud_squadron_repair_depots:0 "Repair Depots for Allied Squadrons"
 NPT_ud_squadron_repair_depots_desc:0 "Damaged allied aircraft land on the islands every day, many with damage their squadrons' own mechanics cannot repair. The island hangars open to them, working in shifts around the clock.\n\nThe island mechanics learn more about modern aircraft in a month than in the previous decade, and allied pilots learn to ask for North Point by name when their aircraft are hit.\n\n§gProvisional gameplay.§!"
 NPT_ud_sealift_berths:0 "Sealift Berths"
 NPT_ud_sealift_berths_desc:0 "The allies' supplies arrive by sea, and the island harbours were built for ferries and trawlers. New deep-water berths, cranes and warehouses will let the sealift ships unload in hours instead of days.\n\nThe work goes on around the ferry traffic, and the harbourmasters, who have lived through the impact and the relief years, take the crowding in their stride.\n\n§gProvisional gameplay.§!"
 NPT_ud_field_hospitals:0 "Field Hospitals for the Front"
 NPT_ud_field_hospitals_desc:0 "The hospitals that sheltered the islands through the impact now receive the wounded of the war. Island doctors and nurses work beside allied medical staff, and the hospital ships cross every week.\n\nThe work is grim and constant. It is also, the island doctors say, what they were trained for.\n\n§gProvisional gameplay.§!"
 NPT_ud_harbour_town_strangers:0 "Strangers in the Harbour Towns"
 NPT_ud_harbour_town_strangers_desc:0 "The allied presence has doubled the population of some harbour towns. Rents and tempers are rising together, and the island newspapers are full of letters about noise, traffic and allied personnel who do not know that the ferries leave on time.\n\nNothing has gone seriously wrong yet. Both the government and the allied command know that one bad night could turn grumbling into something worse.\n\n§gProvisional gameplay.§!"
 NPT_ud_islands_carried_the_load:0 "The Islands That Carried the Load"
 NPT_ud_islands_carried_the_load_desc:0 "Whatever the war's outcome on the continent, North Point's part in it is already clear. The islands fed, repaired, sheltered and supplied the allied forces from their own harbours and runways, without surrendering their own government or their own voice.\n\nWhen the war ends, the allied squadrons will fly home and the staff officers will pack their maps. The berths, the hangars and the habits of islands that learned to carry more than their size will stay.\n\n§gProvisional gameplay.§!"
 NPT_ud_internment_convention:0 "The Internment Convention"
 NPT_ud_internment_convention_desc:0 "Under the old rules of neutrality, any armed aircraft or warship that takes refuge in a neutral's territory during a war must be interned until the fighting ends. The government publishes the rules, prepares the camps and informs every embassy, so that nobody can claim surprise.\n\nThe camps stand empty and the rules gather dust. Both, the government says, are working exactly as intended.\n\n§gProvisional gameplay.§!"
 NPT_ud_neutral_hospital_berths:0 "Neutral Hospital Berths"
 NPT_ud_neutral_hospital_berths_desc:0 "North Point's harbours will receive hospital ships of any flag, under the islands' inspection. Whoever is hurt in the continent's quarrels will be treated in the same wards by the same doctors.\n\nThe arrangement depends entirely on everyone believing that the islands are truly neutral. The government is careful to give nobody a reason to doubt it.\n\n§gProvisional gameplay.§!"
 NPT_ud_neutral_ground:0 "Neutral Ground"
 NPT_ud_neutral_ground_desc:0 "Diplomats from quarrelling governments cannot meet on the continent without one side or the other feeling threatened. North Point offers its customs hall, its guarantees and its discretion for talks of any kind: prisoners, corridors, perhaps one day a settlement.\n\nNo government accepts at first. Then a request arrives, unsigned and through a third embassy, for a quiet meeting.\n\n§gProvisional gameplay.§!"
 NPT_ud_armed_watch:0 "Armed Watch on the Straits"
 NPT_ud_armed_watch_desc:0 "Neutrality that cannot defend itself is an invitation. The coast watch, the fleet and the air squadrons stand ready to intercept any aircraft or warship, of any side, that violates the islands' waters.\n\nThe first interception is an unidentified reconnaissance aircraft that turns away when island fighters appear on its wing. The government does not say whose aircraft it was.\n\n§gProvisional gameplay.§!"
 NPT_ud_neutral_to_the_end:0 "Neutral to the End"
 NPT_ud_neutral_to_the_end_desc:0 "Whatever has happened on the continent, it has happened without North Point. The islands' harbours sheltered the shipwrecked and the displaced, their camps stood ready, and their diplomats carried messages nobody else could carry.\n\nIt has not made the islands popular. It has made them trusted, which may prove the more valuable thing.\n\n§gProvisional gameplay.§!"
 NPT_ud_islands_take_stock:0 "The Islands Take Stock"
 NPT_ud_islands_take_stock_desc:0 "Fourteen years have passed since the ballot boxes came ashore on the morning ferries in 1991. In that time North Point has argued about its government, built and rebuilt its economy, prepared for the fall of Ulysses, lived through its aftermath and watched the continent's quarrels from closer than it ever wished.\n\nThe islands are not what they were. The government commissions a review of everything that has changed, and the islands, as always, hear it on the evening broadcast and argue about it on the morning ferries.\n\n§gProvisional gameplay.§!"
