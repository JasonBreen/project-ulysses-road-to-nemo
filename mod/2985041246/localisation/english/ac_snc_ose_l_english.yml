 ac_snc_ose_message_21.t:0 "An Identification Worth Keeping: The Return"
 ac_snc_ose_message_21.d:0 "The exercise report includes the controller's original hesitation. It also includes the answer that arrived in time to change one receiving instruction, and the question that remained open when the period ended. The duty officer reads all three. 'I would rather inherit this than a perfect result,' he says. A representative asks who else should be allowed to see why. The controller leaves the choice to the hearing, but insists that neither account should turn the unresolved contact into a confirmed one. The completed work has earned a procedure; it has not earned a convenient history.\n\n[OSE_snc_contact_verification_hearing_context]"
