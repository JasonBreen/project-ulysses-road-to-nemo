 ac_camp.33.t:0 "The callsign on the board"
 ac_camp.33.desc:0 "The controller wrote Mobius 1 on the board in the same chalk he used for every other callsign. By the end of the watch, several people had found reasons to look at that part of the board again.\n\nThe completed Comona work gave the command a result it could use. Around it, reports had begun acquiring a different kind of significance. An enemy transmission repeated by an operator. An allied crew asking whether the same pilot would be present tomorrow. A maintenance officer discovering that a routine request drew attention from desks which usually wanted only the total number of serviceable aircraft.\n\nThe controller disliked the attention when it made people careless with their questions. A reputation could steady a crew. It could also encourage a commander to make a request whose weakness was concealed by the name expected to carry it.\n\nHe asked for the next assignment to be checked against the receiving plan. Nobody objected, although one officer looked disappointed by how ordinary the answer remained. There were fuel requirements, an inspection interval, and other pilots who would have to complete adjoining work for the operation to succeed.\n\nOutside, the shift changed. The incoming operator read the board and paused at the same name. The controller handed over the actual tasking sheet before the pause could become an explanation.\n\nThe war was acquiring a legend. The next flight would still need a runway, a working aircraft and someone prepared to give an honest answer when it called home."
 ac_camp.33.a:0 "Keep this account."
 ac_camp.33.z:0 "Close this old message."
