 ac_up.1.t:0 "The Telephone That Everyone Calls"
 ac_up.1.d:0 "A district operator has pinned three unofficial numbers beside the official switchboard. They reach the people who can find a water crew, open a shelter or explain why a receiving office is shut. None appears in the national register. Publishing the contact list would make a fragile local arrangement into a public service; keeping it within the rota would leave operators freer to improvise. The choice is who can demand an answer when a familiar voice is no longer there."
 ac_up.1.a:0 "Publish an accountable contact list and fund its upkeep."
 SNS_up_event_1_0_apply_tt:0 "15 political power. Continuity networks +3; public record: +0.5% stability with a continuing +0.3% consumer-goods factor burden."
 ac_up.1.b:0 "Keep a restricted operational rota."
 SNS_up_event_1_1_apply_tt:0 "10 political power. Dispatch discipline +4; no public-record commitment."
 ac_up.2.t:0 "The Key in the Wrong Office"
 ac_up.2.d:0 "An inspection has found a sound shelter whose key is held by an office that closes before the evening protection rota begins. Everyone involved followed a written instruction. The protection service can fund a joint receiving desk and rebuild institutional capacity, or put dispatchers on an immediate priority footing so the next practical allocation need not wait. Neither course creates more staff; it changes how the existing service uses them."
 ac_up.2.a:0 "Fund the receiving desk and restore administrative capacity."
 SNS_up_event_2_0_apply_tt:0 "25 political power. Civil protection +2; restore 2 institutional capacity if that framework is active."
 ac_up.2.b:0 "Give the dispatch service room to authorise the next task."
 SNS_up_event_2_1_apply_tt:0 "15 political power. Dispatch discipline +4; reopen the next service allocation. An already occupied service remains occupied."
 ac_up.3.t:0 "A Forecast on Every Noticeboard"
 ac_up.3.d:0 "The warning has produced notices that disagree in small but important ways. A protection officer asks for practical instruction cards explaining where uncertainty remains. Dispatch staff ask instead for time to revise the movement chain. The first choice strengthens preparation completed before the crisis boundary; the second improves a military and service capability that remains useful afterward. Neither can promise safety simply by printing a confident sentence."
 ac_up.3.a:0 "Pay for practical protection instructions before the crisis."
 SNS_up_event_3_0_apply_tt:0 "20 political power. Civil protection +2; record 3 verified preparation credits before 8 July 1999. Preparation is applied once after the existing Usean owner initializes."
 ac_up.3.b:0 "Concentrate the work on the dispatch chain."
 SNS_up_event_3_1_apply_tt:0 "15 political power. Dispatch discipline +6; no additional preparation credit."
 ac_up.4.t:0 "The Receiving Office Is Full"
 ac_up.4.d:0 "A neighbouring service asks whether San Salvacion can accept another set of urgent requests. The local receiving desk is already carrying cases that were never assigned a destination. Officials can protect domestic continuity, or prepare a bounded offer to Central Usea with its receiving obligations written in advance. The recipient remains free to refuse. What cannot be offered is capacity that the country has only counted twice."
 ac_up.4.a:0 "Protect the domestic receiving programme."
 SNS_up_event_4_0_apply_tt:0 "15 political power. Continuity networks +5; concentrate on domestic service."
 ac_up.4.b:0 "Prepare the paperwork for one bounded external offer."
 SNS_up_event_4_1_apply_tt:0 "15 political power. Civil protection +2; the once-only FCU offer restores one institutional capacity after payment. The offer must still be earned and both partners remain eligible."
 ac_up.5.t:0 "A Desk Returns without Its Files"
 ac_up.5.d:0 "Recovery has brought an official back to a desk whose surviving files do not match the cases being presented. Some records may be reconstructed; some cannot. An inspected restoration will rebuild local capacity and leave an honest gap in the evidence. A rapid operational restart will give dispatch work precedence and reopen the next review allocation. The service must choose what it can responsibly promise, rather than declare every missing record found."
 ac_up.5.a:0 "Fund an inspected restoration of the local record."
 SNS_up_event_5_0_apply_tt:0 "20 political power. Continuity networks +4; restore 1 institutional capacity if that framework is active."
 ac_up.5.b:0 "Restart the dispatch work and reopen its next review."
 SNS_up_event_5_1_apply_tt:0 "20 political power. Dispatch discipline +4; reopen the national review allocation. Existing commitments and costs remain."
 ac_up.6.t:0 "The Network's Ordinary Year"
 ac_up.6.d:0 "The national programme now has a record of what survived, what was refused and what had to be done under external conditions. Its conclusion does not decide the war or erase the settlement. The government can renew an ordinary civil service whose future funded completions support recovery, or retain a bounded readiness record at a continuing public cost. Either choice is an ongoing obligation, not a final gift from the calendar."
 ac_up.6.a:0 "Renew the ordinary service and its recovery work."
 SNS_up_event_6_0_apply_tt:0 "20 political power. Civil protection +2; future eligible funded service completions add one further recovery point through the existing Usean owner."
 ac_up.6.b:0 "Retain the readiness record and fund its standing burden."
 SNS_up_event_6_1_apply_tt:0 "20 political power. Dispatch discipline +2; +1% army organisation with a continuing +0.5% consumer-goods factor burden."
 ac_up.11.t:0 "Two Owners of the Same Timetable"
 ac_up.11.d:0 "A workshop's delivery book and a public receiving office both reserve the same morning movement. The workshop insists its slot has been promised for months; the office holds a more recent priority notice. Amber can publish a common record, accepting the public cost of explaining which bargain had to wait, or maintain a restricted operational schedule and concentrate on dispatch capability. The timetable is a development policy before it becomes a relief plan."
 ac_up.11.a:0 "Publish the common timetable and account for its costs."
 AMB_up_event_1_0_apply_tt:0 "15 political power. Development bargains +3; public record: +0.5% stability with a continuing +0.3% consumer-goods factor burden."
 ac_up.11.b:0 "Keep an operational schedule for the dispatch offices."
 AMB_up_event_1_1_apply_tt:0 "10 political power. Transport coordination +4; no public-record commitment."
 ac_up.12.t:0 "A Guarantee Is Not an Empty Wagon"
 ac_up.12.d:0 "A contractor has accepted a service guarantee but has no uncommitted crew to attach to it. Cancelling the whole bargain would destroy useful maintenance work; accepting its paper capacity would mislead the board. A funded inspection can restore administrative capacity and identify what remains deliverable. Alternatively the board can open the next practical allocation immediately and accept a narrower operational settlement."
 ac_up.12.a:0 "Fund the inspection and repair the service bargain."
 AMB_up_event_2_0_apply_tt:0 "25 political power. Service capacity +2; restore 2 institutional capacity if that framework is active."
 ac_up.12.b:0 "Open the next allocation around the capacity that remains."
 AMB_up_event_2_1_apply_tt:0 "15 political power. Transport coordination +4; reopen the next service allocation. An already occupied service remains occupied."
 ac_up.13.t:0 "The Reserve in the Fine Print"
 ac_up.13.d:0 "The international warning has reached suppliers as a new clause in their standing contracts. Some can prepare a genuine civilian reserve if they receive clear instructions before the crisis. Others argue that the existing movement chain must be made more reliable first. The capacity board must choose between a preparation credit earned within the real window and transport coordination that remains useful in later years. It cannot backdate either decision."
 ac_up.13.a:0 "Pay for practical civilian reserve instructions."
 AMB_up_event_3_0_apply_tt:0 "20 political power. Service capacity +2; record 3 verified preparation credits before 8 July 1999. Preparation is applied once after the existing Usean owner initializes."
 ac_up.13.b:0 "Prioritise the existing transport chain."
 AMB_up_event_3_1_apply_tt:0 "15 political power. Transport coordination +6; no additional preparation credit."
 ac_up.14.t:0 "A Manifest with No Receiving Signature"
 ac_up.14.d:0 "The proposed coalition service has a sending manifest and an impressive priority stamp. It still lacks a receiving official willing to accept the work. Amber can direct its development effort toward domestic services, or prepare a defined offer to Central Usea that carries a smaller administrative burden when it is sent. A funded service slot is still required, and a refused offer must return that slot rather than strand it abroad."
 ac_up.14.a:0 "Give the domestic development programme priority."
 AMB_up_event_4_0_apply_tt:0 "15 political power. Development bargains +5; concentrate on domestic service."
 ac_up.14.b:0 "Prepare one offer with its receiving obligations attached."
 AMB_up_event_4_1_apply_tt:0 "15 political power. Service capacity +2; the once-only FCU offer restores one institutional capacity after payment. The offer must still be earned and both partners remain eligible."
 ac_up.15.t:0 "The Contract That Outlived the Emergency"
 ac_up.15.d:0 "A supplier asks whether its temporary protection from ordinary competition is still in force. The receiving office wants the contract continued until every disputed delivery is settled. An inspected review restores administrative capacity and clarifies the development record. A faster operational settlement reopens the next review allocation and puts transport work first. Keeping both promises would simply reserve the same capacity again."
 ac_up.15.a:0 "Inspect the unfinished bargain before renewing it."
 AMB_up_event_5_0_apply_tt:0 "20 political power. Development bargains +4; restore 1 institutional capacity if that framework is active."
 ac_up.15.b:0 "Settle the operational schedule and reopen the review."
 AMB_up_event_5_1_apply_tt:0 "20 political power. Transport coordination +4; reopen the national review allocation. Existing commitments and costs remain."
 ac_up.16.t:0 "The Price of Standing Capacity"
 ac_up.16.d:0 "Amber's service ledger now distinguishes spare capacity paid for, domestic movements authorised, offers refused and work actually received. The final review follows the settlement that exists, including any constraints on the country. Ministers can renew ordinary service work with continuing recovery value, or protect a readiness record at an ordinary public cost. Neither course creates another transport fleet or an unlimited claim on suppliers."
 ac_up.16.a:0 "Renew ordinary receiving services."
 AMB_up_event_6_0_apply_tt:0 "20 political power. Service capacity +2; future eligible funded service completions add one further recovery point through the existing Usean owner."
 ac_up.16.b:0 "Keep a funded readiness record."
 AMB_up_event_6_1_apply_tt:0 "20 political power. Transport coordination +2; +1% army organisation with a continuing +0.5% consumer-goods factor burden."
 ac_up.21.t:0 "Two Keys and One Depot"
 ac_up.21.d:0 "Two offices hold valid instructions to draw on the same small depot. One expects to support a local receiving service; the other has reserved the space for an emergency movement. Ugellas can publish the custody record and accept its continuing public burden, or keep the working list restricted and strengthen operational coordination. The finite slot limit remains in either case. A better form is not another warehouse."
 ac_up.21.a:0 "Publish the custody record and maintain it."
 UGE_up_event_1_0_apply_tt:0 "15 political power. Dispersal planning +3; public record: +0.5% stability with a continuing +0.3% consumer-goods factor burden."
 ac_up.21.b:0 "Keep a restricted operational list."
 UGE_up_event_1_1_apply_tt:0 "10 political power. Reserved capacity +4; no public-record commitment."
 ac_up.22.t:0 "The Unavailable Driver"
 ac_up.22.d:0 "An exercise has found a driver named on three reserve lists. The driver is available, but not to all three offices at once. An inspected roster can rebuild institutional capacity and improve the mobility account. An immediate operational allocation can instead resolve the next practical task without waiting for a further rota. The reserve authority must record which commitment was left unmet."
 ac_up.22.a:0 "Fund a verified roster and rebuild capacity."
 UGE_up_event_2_0_apply_tt:0 "25 political power. Emergency mobility +2; restore 2 institutional capacity if that framework is active."
 ac_up.22.b:0 "Open the next practical allocation."
 UGE_up_event_2_1_apply_tt:0 "15 political power. Reserved capacity +4; reopen the next service allocation. An already occupied service remains occupied."
 ac_up.23.t:0 "Space Reserved before the Warning"
 ac_up.23.d:0 "The warning has made every unused corner of a depot look like a national reserve. Protection staff want practical instructions that turn some of that space into preparation before the deadline. Dispatchers want to concentrate on the receiving chain and the transport already available. Ugellas can improve one without pretending it has found unlimited storage, drivers or fuel. Work completed afterward will be response rather than earlier preparation."
 ac_up.23.a:0 "Fund practical reserve instructions within the window."
 UGE_up_event_3_0_apply_tt:0 "20 political power. Emergency mobility +2; record 3 verified preparation credits before 8 July 1999. Preparation is applied once after the existing Usean owner initializes."
 ac_up.23.b:0 "Improve the receiving and movement chain."
 UGE_up_event_3_1_apply_tt:0 "15 political power. Reserved capacity +6; no additional preparation credit."
 ac_up.24.t:0 "One Slot Offered Twice"
 ac_up.24.d:0 "A useful mobility service can be offered abroad only if the reserve authority remains able to account for the work left at home. Officials can protect domestic dispersal, or prepare a bounded offer to Central Usea. Preparing the offer reduces its later institutional burden, but it does not create another service slot or oblige the recipient to accept. Refusal must leave the mobility programme useful."
 ac_up.24.a:0 "Protect the domestic dispersal programme."
 UGE_up_event_4_0_apply_tt:0 "15 political power. Dispersal planning +5; concentrate on domestic service."
 ac_up.24.b:0 "Prepare a bounded mobility offer."
 UGE_up_event_4_1_apply_tt:0 "15 political power. Emergency mobility +2; the once-only FCU offer restores one institutional capacity after payment. The offer must still be earned and both partners remain eligible."
 ac_up.25.t:0 "Receipts from Different Places"
 ac_up.25.d:0 "Recovery has brought together receipts from offices that no longer share the same route. Some describe delivered work; others describe a load that never found a receiving service. Inspection can rebuild local capacity around the surviving evidence. A faster operational restart can instead prioritise movement and reopen the next review allocation. The missing receipt cannot honestly be replaced by a declaration that everything arrived."
 ac_up.25.a:0 "Inspect the surviving record and rebuild local capacity."
 UGE_up_event_5_0_apply_tt:0 "20 political power. Dispersal planning +4; restore 1 institutional capacity if that framework is active."
 ac_up.25.b:0 "Restart the movement service and reopen review."
 UGE_up_event_5_1_apply_tt:0 "20 political power. Reserved capacity +4; reopen the national review allocation. Existing commitments and costs remain."
 ac_up.26.t:0 "A Reserve That Can Say No"
 ac_up.26.d:0 "The reserve authority can now describe its actual limits under the settlement that remains. A useful national programme is one that can refuse a fifth commitment when only four slots exist. The country can renew ordinary service work whose funded completions aid recovery, or retain a readiness record with its continuing public burden. The choice preserves a limited capability rather than an endless emergency."
 ac_up.26.a:0 "Renew ordinary mobility and receiving services."
 UGE_up_event_6_0_apply_tt:0 "20 political power. Emergency mobility +2; future eligible funded service completions add one further recovery point through the existing Usean owner."
 ac_up.26.b:0 "Retain the funded readiness record."
 UGE_up_event_6_1_apply_tt:0 "20 political power. Reserved capacity +2; +1% army organisation with a continuing +0.5% consumer-goods factor burden."
 ac_up.31.t:0 "A Requisition without a Receipt"
 ac_up.31.d:0 "A command office has a signed requisition that the receiving clerk says was never accepted. Both papers are genuine. Delarus can publish a common record and take responsibility for answering disputes, or retain a restricted operational account and improve the movement of instructions. The decision changes the administration's working practice. It neither replaces the existing leadership nor settles every later argument between inspectors and commanders."
 ac_up.31.a:0 "Publish an accountable common record."
 DEL_up_event_1_0_apply_tt:0 "15 political power. Civil oversight +3; public record: +0.5% stability with a continuing +0.3% consumer-goods factor burden."
 ac_up.31.b:0 "Retain a restricted operational account."
 DEL_up_event_1_1_apply_tt:0 "10 political power. Verified records +4; no public-record commitment."
 ac_up.32.t:0 "The Inspector and the Waiting Order"
 ac_up.32.d:0 "An inspector has found that two lawful orders depend on the same public service. The command office needs an answer today; the records service wants to establish which obligation was accepted first. Funding a verified review restores institutional capacity. An immediate operational allocation instead opens the next task and strengthens coordination. Whichever course is chosen, one office will have to record a refusal."
 ac_up.32.a:0 "Fund the verified review and restore capacity."
 DEL_up_event_2_0_apply_tt:0 "25 political power. Command coordination +2; restore 2 institutional capacity if that framework is active."
 ac_up.32.b:0 "Open the next operational allocation."
 DEL_up_event_2_1_apply_tt:0 "15 political power. Verified records +4; reopen the next service allocation. An already occupied service remains occupied."
 ac_up.33.t:0 "An Emergency Stamp on the Forecast"
 ac_up.33.d:0 "The international warning has acquired an emergency stamp before the receiving office has written a practical instruction. Civil inspectors propose guidance that can earn a real preparation credit before the crisis. Command staff ask for the same attention to be spent on the working record of instructions and obligations. The administration must distinguish preparing a service from merely acknowledging the forecast."
 ac_up.33.a:0 "Pay for verified practical preparation."
 DEL_up_event_3_0_apply_tt:0 "20 political power. Command coordination +2; record 3 verified preparation credits before 8 July 1999. Preparation is applied once after the existing Usean owner initializes."
 ac_up.33.b:0 "Concentrate on command and receiving records."
 DEL_up_event_3_1_apply_tt:0 "15 political power. Verified records +6; no additional preparation credit."
 ac_up.34.t:0 "Cooperation Is Not a Blank Cheque"
 ac_up.34.d:0 "A request for cooperation has reached the obligation desk without a clear end to the receiving country's responsibility. Delarus can give domestic oversight precedence, or prepare a defined offer to Central Usea. The latter reduces the administrative burden of sending one offer, but leaves acceptance conditional on both participants remaining eligible. Existing leadership retains responsibility for either decision."
 ac_up.34.a:0 "Protect the domestic oversight programme."
 DEL_up_event_4_0_apply_tt:0 "15 political power. Civil oversight +5; concentrate on domestic service."
 ac_up.34.b:0 "Prepare one offer with explicit obligations."
 DEL_up_event_4_1_apply_tt:0 "15 political power. Command coordination +2; the once-only FCU offer restores one institutional capacity after payment. The offer must still be earned and both partners remain eligible."
 ac_up.35.t:0 "The Files That Came Back"
 ac_up.35.d:0 "The records service has recovered a set of emergency dockets. Their signatures are legible, but some receiving offices cannot be reconstructed from the surviving evidence. A verified recovery builds institutional capacity and leaves the uncertainty recorded. A faster operational restart improves coordination and opens the next review allocation. Neither course can honestly turn every surviving instruction into a completed delivery."
 ac_up.35.a:0 "Inspect the recovered files and rebuild capacity."
 DEL_up_event_5_0_apply_tt:0 "20 political power. Civil oversight +4; restore 1 institutional capacity if that framework is active."
 ac_up.35.b:0 "Restart operational work and reopen review."
 DEL_up_event_5_1_apply_tt:0 "20 political power. Verified records +4; reopen the national review allocation. Existing commitments and costs remain."
 ac_up.36.t:0 "The Record after the Warrant"
 ac_up.36.d:0 "The final inspection distinguishes continuing obligations from emergency authority that has expired. It follows the actual settlement, including displacement or external constraints, rather than declaring a preferred result. Delarus can renew ordinary service work with continuing recovery value, or retain a funded readiness record. The country has acquired a practice of accountable government, not a new leader or an unlimited command mandate."
 ac_up.36.a:0 "Renew ordinary inspected services."
 DEL_up_event_6_0_apply_tt:0 "20 political power. Command coordination +2; future eligible funded service completions add one further recovery point through the existing Usean owner."
 ac_up.36.b:0 "Keep the funded readiness record."
 DEL_up_event_6_1_apply_tt:0 "20 political power. Verified records +2; +1% army organisation with a continuing +0.5% consumer-goods factor burden."
