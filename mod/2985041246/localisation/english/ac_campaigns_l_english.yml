 FAT_camp_0_register:0 "A council before a commitment"
 FAT_camp_0_register_desc:0 "A council before a commitment. Open the campaign lane and its preparation record.\n\nThe council secretary has placed the disputed clause on a separate sheet. It is easier to postpone a sentence when nobody has to look at the rest of the agreement around it. Unanimous consultation preserves every member's opportunity to object. A delegated mandate can deliver a faster answer while narrowing the work the council has expressly authorized. The branch receives the current offers and keeps their permissions separate. It does not create guarantees, foreign bases, faction membership or a shared willingness to fight out of the convenience of one meeting."
