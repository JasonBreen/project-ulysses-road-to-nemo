 ac_sq.616.d_base:0 "The readiness summary omitted a qualification Vera had written beside the flight's available aircraft. The author said the detailed sheets remained attached and everyone who needed them could read them. Pavel argued that the summary was not technically wrong. Nadia recognized the feeling behind his defense: after so much difficult work, it was painful to hand somebody a page that looked like another list of limitations. Milan had a copy already waiting to be carried onward. Vera asked him to put it down until Nadia answered. Nothing about the aircraft changed while they spoke. Only the distance between what a reader would expect and what the crew had actually offered was growing. Nadia remembered receiving the green marker on her first morning, long before she knew whose approval would become difficult to disappoint."
 ac_sq.616.a:0 "Put the qualification back in the summary."
 ac_sq.616.a.reply:0 "The amended copy leaves. Pavel asks whether Nadia still knows how much work stands behind every qualification she has learned to defend."
 ac_sq.616.b:0 "Trust the attachments to explain it."
 ac_sq.616.b.reply:0 "Pavel is glad the crew can finally present a confident morning. Vera keeps the detailed copy open where somebody willing to read can find it."
 ac_sq.617.t:0 "The Lesson on a Smaller Table"
 ac_sq.617.d_service_flight_callback:0 "The repaired aircraft answered Pavel's first control check as though the weeks beside the workshop had never happened. On the return, a rough vibration changed that illusion. Nadia heard him name it before he asked to continue the exercise. Vera's voice reached them through Milan: no further demonstration was required. Pavel turned toward the field. A low bank of cloud covered the near approach, and Nadia guided him to the clearer side while Milan kept the receiving circuit free. His wheels touched once, lifted, then settled along the wet runway. Nobody in the workshop applauded. They had listened to the engine stop and heard the ordinary noises beyond it return.\n\nThe training session resumed around a smaller table with mismatched stools. Vera had found a way to teach the same inspection using fewer familiar tools, although she hated how improvised the room looked. Pavel arrived early to help and discovered the young technicians arguing over a fault without waiting for her answer. Nadia found it more reassuring than the old tidy demonstrations. Milan asked whether the new arrangement was good enough to show a visitor. Vera said it depended on whether the visitor wanted to see work or a photograph of work. One student had written a correction directly across a copied example. Pavel reached to replace the messy sheet, then stopped. Nadia watched him realize that the visible correction might be the best thing the lesson had produced.\n\nThe civilian bench owner has lent a small clamp for the afternoon. Vera has written its return time where the trainees can see it."
