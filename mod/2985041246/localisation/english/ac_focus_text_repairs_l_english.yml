l_english:
 # Focus text repairs (mod provenance, 6 November 2026). These inherited focuses had no title or
 # description, so the focus screen showed raw keys. Each text states what the focus does in this
 # campaign, read from its own script; none adds history. tools/Test-FocusVisibility.py checks coverage.
 AWW_v2_fire:0 "The V2 Launch"
 AWW_v2_fire_desc:0 "The first step of the organisation's inherited route in this campaign. It grants nothing by itself; it opens Integrate the Deserters and Spoils of War."
 AWW_integrate_deserters:0 "Integrate the Deserters"
 AWW_integrate_deserters_desc:0 "A step on the inherited route toward After Belka. It has no direct reward in this campaign."
 AWW_spoils_of_war:0 "Spoils of War"
 AWW_spoils_of_war_desc:0 "A step on the inherited route toward After Belka. It has no direct reward in this campaign."
 AWW_belka_dead:0 "After Belka"
 AWW_belka_dead_desc:0 "Requires To Finish Off Belka, Integrate the Deserters and Spoils of War. It has no direct reward; it opens the organisation's army, industry and population branches."
 AWW_aww_army:0 "The Organisation's Army"
 AWW_aww_army_desc:0 "Adopts the Volunteer Army conscription law and opens An Army of Veterans and Recruitment Drive."
 AWW_aww_industry:0 "The Organisation's Industry"
 AWW_aww_industry_desc:0 "Adopts the closed economy trade law and opens Confiscation for the Military and The Engines of Change."
 AWW_aww_population:0 "The Organisation's Population"
 AWW_aww_population_desc:0 "Unlocks the occupation law described in its tooltip and opens A State of Permanent War and Subdue the Population."
 AWW_army_of_veterans:0 "An Army of Veterans"
 AWW_army_of_veterans_desc:0 "A step toward Establish the Revolutionary Command. It has no direct reward in this campaign."
 AWW_recruitment_drive:0 "Recruitment Drive"
 AWW_recruitment_drive_desc:0 "A step toward Establish the Revolutionary Command. It has no direct reward in this campaign."
 AWW_establish_revolutionry_command:0 "Establish the Revolutionary Command"
 AWW_establish_revolutionry_command_desc:0 "Requires An Army of Veterans and Recruitment Drive. It has no direct reward in this campaign."
 AWW_confiscation_for_military:0 "Confiscation for the Military"
 AWW_confiscation_for_military_desc:0 "An industry step on the inherited route. It has no direct reward in this campaign."
 AWW_the_engines_of_change:0 "The Engines of Change"
 AWW_the_engines_of_change_desc:0 "An industry step on the inherited route. It has no direct reward in this campaign."
 AWW_state_of_permamnet_war:0 "A State of Permanent War"
 AWW_state_of_permamnet_war_desc:0 "A population step on the inherited route. It has no direct reward in this campaign."
 AWW_to_subdue_the_population:0 "Subdue the Population"
 AWW_to_subdue_the_population_desc:0 "A population step on the inherited route. It has no direct reward in this campaign."
 AWW_army_xp:0 "Combat Experience"
 AWW_army_xp_desc:0 "Grants 100 army experience."
