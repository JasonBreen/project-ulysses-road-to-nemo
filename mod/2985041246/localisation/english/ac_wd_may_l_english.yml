l_english:
 MAY_wd_pol_administration_sits:0 "The National Administration Sits"
 MAY_wd_pol_administration_sits_desc:0 "Malynea enters 1991 governed by a National Administration that calls itself democratic, keeps an election calendar on paper and has let no election take place. Its offices run the capital port, the two mainland districts and the western islands well enough. Asking who gave it the right costs the administration its quiet, and every faction wants an answer."
 MAY_wd_pol_election_clause:0 "Reading the Election Clause"
 MAY_wd_pol_election_clause_desc:0 "Lawyers for the administration read the clause that sets an election every four years and the separate clause that lets the cabinet postpone it. Both are valid and they contradict each other. Publishing the reading forces the choice the administration has avoided for years: hold the ballot, hand power to the district boards, or let the movement in."
 MAY_wd_pol_election_clause_tt_1:0 "Opens three answers to the suspended ballot; only one can be taken."
 MAY_wd_pol_ballot_path:0 "Reopen the Polling Halls"
 MAY_wd_pol_ballot_path_desc:0 "The smallest camp in the country, the democrats, asks for the oldest remedy: name a date and hold the election the calendar already promises. Barely one voter in a hundred names them today, so the ballot would be won by someone else. They argue that a government chosen by a count still beats one chosen by nobody, whatever the count says."
 MAY_wd_pol_board_path:0 "The District Boards Step Forward"
 MAY_wd_pol_board_path_desc:0 "Almost half the country backs no party at all and trusts the administrators who keep the ferries, schools and depots running. Their spokesmen propose a standing board drawn from the three districts, governing by published rules instead of manifestos. It would be competent and predictable. Nobody would ever have voted for it, and its critics say so."
 MAY_wd_pol_movement_path:0 "The Movement Brings Its Petition"
 MAY_wd_pol_movement_path_desc:0 "Half the respondents in the opinion surveys side with the national movement, which says a small country on a cold frontier needs discipline more than debate. Its petition asks the administration to hand power to a committee of national readiness. The movement promises order quickly. It does not say when, or whether, the ballot would return."
 MAY_wd_pol_elected_council:0 "The Council of Ministers Sits"
 MAY_wd_pol_elected_council_desc:0 "The overdue election is held, and a council of ministers chosen by the new chamber takes the seals of government. It governs collectively and must win a vote for every budget. The administration's officials stay on as civil servants. The council inherits a country in which its own supporters are a small minority and every other camp is watching."
 MAY_wd_pol_standing_board:0 "Charter the Standing Board"
 MAY_wd_pol_standing_board_desc:0 "A written charter creates a standing board of administrators from the capital district, the frontier district and the islands. Members serve fixed terms, decide by majority and publish their reasons. No party sits on it and no election chooses it. The board is efficient, and it will be blamed for every bad winter as though it were one person."
 MAY_wd_pol_readiness_committee:0 "The Committee of National Readiness"
 MAY_wd_pol_readiness_committee_desc:0 "The administration steps aside for a committee named by the national movement. Parties are suspended, the press answers to a censor and the battalions report directly to the committee. The streets are quiet within a week. The committee calls this calm; its critics, those still free to speak, call it fear, and both agree it will be hard to undo."
 MAY_wd_pol_ballot_rolls:0 "Voter Rolls for the Three Districts"
 MAY_wd_pol_ballot_rolls_desc:0 "The council sends registrars to every forest village, hill farm and island harbour to put each adult on a voter roll. Island registrars travel by convoy and wait weeks for a return voyage. The rolls cost a year of clerical work and reveal how many citizens the state had simply lost track of during the years without a ballot."
 MAY_wd_pol_board_minutes:0 "Minutes at Every Post Office"
 MAY_wd_pol_board_minutes_desc:0 "The board posts its minutes, votes and reasons at every post office in the country within a week of each sitting, the island harbour offices included. Citizens cannot vote the board out, but they can read exactly what it did and why. The postings cost little and embarrass the board often, which is why its members accepted them so reluctantly."
 MAY_wd_pol_committee_decrees:0 "Readiness Instead of Statutes"
 MAY_wd_pol_committee_decrees_desc:0 "The committee governs by numbered decrees on rationing, travel, the press and service with the battalions. Each decree takes effect on the day it is printed. Officials who object are transferred to the islands. The decrees make the country quick to command and slow to correct, because nobody left in the room is paid to say no."
 MAY_wd_pol_charter_court:0 "A Court to Read the Charter"
 MAY_wd_pol_charter_court_desc:0 "Whatever government holds the seals, someone must decide what the charter means when ministers, boards or committees quarrel with the districts. A small constitutional court of judges with long terms is created to read it. Judges cost little to pay; their rulings will cost every future government something, and that is the point of having them."
 MAY_wd_pol_merit_service:0 "Examinations for the Civil Service"
 MAY_wd_pol_merit_service_desc:0 "Posts in the port authority, the districts and the ministries have long been filled by recommendation. Open written examinations replace that habit, with papers marked by examiners who never see a candidate's name. Families who relied on a word from a cousin lose their advantage. The offices gain clerks chosen because they can do the work."
 MAY_wd_port_hull_register:0 "Count the Hulls on the Register"
 MAY_wd_port_hull_register_desc:0 "Malynea has no war fleet, but its merchant register is long for so small a country, and the capital port lives on hulls that carry other nations' cargo. Nobody has checked the register against the ships for years. A full count of hulls, owners and crews costs the port a winter of inspections and tells the government what it actually owns."
 MAY_wd_port_quay_roads:0 "Roads Behind the Quays"
 MAY_wd_port_quay_roads_desc:0 "Cargo landed in the capital port leaves by one railway or by forest roads that turn to mud every spring and close under snow every winter. Paved roads from the quays to the depots and the rail yard let trucks move cargo in any season. The work costs a season of district budgets and several stretches of forest that the sawmills wanted."
 MAY_wd_port_open_charter:0 "Charters for Any Shipper"
 MAY_wd_port_open_charter_desc:0 "One school in the port authority wants Malynean hulls chartered to any shipper who pays, under light rules and low fees, so that foreign owners register here as well. Freight money would pour in. So would crews from abroad, ships of doubtful age and the risk that someone else's cargo drags the country's flag into someone else's quarrel."
 MAY_wd_port_home_cargo:0 "Malynean Cargoes Come First"
 MAY_wd_port_home_cargo_desc:0 "The other school wants every Malynean hull to carry Malynean steel, timber and fuel first, and foreign cargo only with spare tonnage. Fewer charters would come in and owners would earn less. The districts would get supplies on time in every season, and no foreign shipper could leave the islands waiting because a better rate turned up elsewhere."
 MAY_wd_port_pilots:0 "A Guild of Harbour Pilots"
 MAY_wd_port_pilots_desc:0 "The approaches to the capital port are shallow in places and dark for much of the winter. The pilots who know them have trained their own children for generations, with no standards and no pensions. A chartered guild with examinations, a pension fund and a duty roster costs the port authority money every year and buys it fewer groundings."
 MAY_wd_port_winter_roadstead:0 "An Open Roadstead in Winter"
 MAY_wd_port_winter_roadstead_desc:0 "Ice forms in the roadstead most winters and stays for weeks, closing the port just when the forest districts need fuel most. The authority buys a strengthened tug, marks a winter channel and writes rules for convoys that use it. The tug is costly to run and idle half the year, which the treasury will mention at every budget hearing."
 MAY_wd_port_island_slip:0 "A Repair Slip in the Islands"
 MAY_wd_port_island_slip_desc:0 "Hulls on the island lane break down far from the only yard, which sits in the capital port, and a disabled freighter can wait a month for a tow. A small repair slip at one of the island harbours keeps the lane working and gives island crews steady jobs. It costs the capital yard some orders and the port authority some of its control."
 MAY_wd_port_roadstead_radar:0 "A Radar Above the Roadstead"
 MAY_wd_port_roadstead_radar_desc:0 "Convoys enter the roadstead in fog, snow and the long winter dark, guided by lights and the pilots' memories. A single radar on the shore lets the harbour office see every hull approaching and warn those that stray. It is the first radar the country has owned, and the battalions have already asked whether they may borrow it."
 MAY_wd_port_submarine_word:0 "Masters Hear of New Submarines"
 MAY_wd_port_submarine_word_desc:0 "In September 1991 a political convention in Cinigrad is told of new Yuktobanian submarines, built by the great power that lies beyond the Baltican frontier. Malynean masters on the island lane begin asking what else shares the sea with them. The port authority issues hydrophone sets and a reporting code to merchant hulls. The sets are cheap; the unease is not."
 MAY_wd_port_masters_school:0 "A School for Convoy Masters"
 MAY_wd_port_masters_school_desc:0 "Convoy masters learn their trade at sea from older masters, which works until the older masters retire. A school in the capital port teaches station-keeping, winter navigation, radio procedure and what to do when help does not arrive. It takes teaching hulls out of service and turns out masters who all know the same rules."
 MAY_wd_isl_six_harbours:0 "Six Harbours Without Roads"
 MAY_wd_isl_six_harbours_desc:0 "Far to the west of the mainland, across open sea, Malynea holds six hill islands. Each has a harbour and a quay, and none has a road worth the name. Islanders depend on the convoy lane for fuel, mail, doctors and news. Counting what each island lacks costs nothing but honesty, and the list will embarrass every ministry in the capital."
 MAY_wd_isl_harbour_tracks:0 "Tracks Up From the Harbours"
 MAY_wd_isl_harbour_tracks_desc:0 "The island harbours sit at the foot of steep hills, and the farms and houses climb above them. Graded tracks from each quay to the upper settlements let a truck replace a mule. Island crews do the work in summer, paid from a capital budget that would much rather spend the money on the forest roads of the mainland."
 MAY_wd_isl_harbour_radios:0 "A Radio in Every Harbour Office"
 MAY_wd_isl_harbour_radios_desc:0 "Today an island learns of a storm, a strike or a sick child's evacuation when the next hull ties up. A radio in every harbour office links the six islands to each other and to the capital port day and night. The sets are cheap, but the operators must be trained, and that takes a year of courses on the mainland."
 MAY_wd_isl_own_purse:0 "Island Councils Keep a Purse"
 MAY_wd_isl_own_purse_desc:0 "One answer to the islands' complaints lets each island council raise its own harbour dues and spend them on its own tracks, clinics and schools. Islanders would set their own priorities. The capital would lose revenue and some of its control, and the poorest islands would discover exactly how small their purse really is."
 MAY_wd_isl_capital_rule:0 "Prefects From the Capital Port"
 MAY_wd_isl_capital_rule_desc:0 "The other answer sends a prefect from the capital to each island with a budget, a staff and the authority to settle disputes. Decisions would come quicker and spending would follow the national plan. Island councils would become advisory, and islanders would be governed well or badly by people who arrived on the same hull as the mail."
 MAY_wd_isl_cannery:0 "A Cannery for the Island Catch"
 MAY_wd_isl_cannery_desc:0 "Island boats land more fish in summer than the islands can eat or the lane can carry fresh. A cannery at one of the harbours preserves the surplus for the mainland and for export. It needs power, tin plate and a reliable hull every week. It would be the first factory most islanders have ever worked in, and by far the noisiest."
 MAY_wd_isl_landing_strip:0 "A Landing Strip in the Islands"
 MAY_wd_isl_landing_strip_desc:0 "A hull takes days to reach the islands; a light aircraft takes hours. A graded landing strip on a level shoulder of one island lets the capital fly in doctors and fly out patients, and gives the mail a second route. Malynea owns no aircraft fit for the work yet, so the strip is a promise as much as a field."
 MAY_wd_isl_hospital_rota:0 "The Hospital Ship Rota"
 MAY_wd_isl_hospital_rota_desc:0 "No island has a hospital, and an operation means a voyage to the capital port. A converted freighter fitted with a surgery, beds and a dentist's chair sails a fixed round of the six islands. It takes one hull out of the charter market for good and puts a doctor within a week's reach of every islander."
 MAY_wd_isl_island_deputies:0 "Island Deputies Take Their Seats"
 MAY_wd_isl_island_deputies_desc:0 "With the ballot restored, the islands elect deputies of their own to the new chamber for the first time. They arrive on the same convoy, sit together and vote as a bloc on anything touching the lane, the harbour dues or the hospital ship. Ministers find them hard to ignore and harder still to satisfy."
 MAY_wd_isl_ring_road:0 "A Road Around the Island Hills"
 MAY_wd_isl_ring_road_desc:0 "The tracks from the harbours become roads that circle each island's hills, joining farms, the cannery and the landing strip. Blasting through rock costs more than any mainland road and takes two summers. When it is done an islander can cross an island in an hour, and the island economies begin to resemble small mainland districts."
 MAY_wd_isl_watch_radar:0 "A Watch Radar for the Islands"
 MAY_wd_isl_watch_radar_desc:0 "The islands sit alone in open sea, with no mainland coast to watch their approaches. A radar on the high ground of one island covers the lane, the landing strip and the harbours, and reports to the capital over the harbour radios. It warns of squalls as well as strangers, which is the reason islanders accept the noise of its generator."
 MAY_wd_def_battalion_roll:0 "Count the Four Battalions"
 MAY_wd_def_battalion_roll_desc:0 "The army of Malynea is four infantry battalions in two formations, with rifles, trucks and trains but no artillery, engineers or aircraft. Its role is civil defence: hold roads, guard the port and help the districts in bad winters. Counting what the battalions really have costs the officers their excuses and tells the government what it can defend."
 MAY_wd_def_forest_roads:0 "Hold the Forest Roads"
 MAY_wd_def_forest_roads_desc:0 "The first doctrine fights where the country is strongest: in the forests that cover most of the mainland. Small units would hold the road junctions, block the tracks and wait for any intruder to tire. It suits infantry without heavy weapons. It also leaves the open coastal plains and the capital shore to whatever the battalions can spare."
 MAY_wd_def_southern_hill:0 "Garrison the Southern Hill"
 MAY_wd_def_southern_hill_desc:0 "The second doctrine looks south, to the one hill province where the mainland meets the mountains of Seterano and the hills of Valka. A permanent garrison there would watch both frontiers and train in the hardest country. It costs the forest districts their companies and asks a quarter of the army to winter far from any town."
 MAY_wd_def_capital_shore:0 "Defend the Capital Shore"
 MAY_wd_def_capital_shore_desc:0 "The third doctrine puts the army where the country's wealth is: the capital port, its quays and the rail yard behind them. Trenches, wire and anti-aircraft positions would ring the shore, with the battalions billeted close by. The capital would sleep easier. The frontier districts would see soldiers only on parade days."
 MAY_wd_def_reserve_cards:0 "A Reserve Card for Every Adult"
 MAY_wd_def_reserve_cards_desc:0 "Every adult who has served receives a card naming a depot, a company and a day to report. The cards are printed in the capital, posted by district and checked once a year. Most will never be used. The few days a year it takes to keep them current let four battalions become many more within a week."
 MAY_wd_def_winter_drill:0 "Training in the Long Winter"
 MAY_wd_def_winter_drill_desc:0 "Mainland winters bring snow, blizzards and weeks of darkness, and the battalions have trained mostly in summer. Winter drills on skis, in snow shelters and with frozen trucks teach them to move when the country is at its hardest. The first winters cost frostbite, broken engines and letters from parents. Later winters cost less."
 MAY_wd_def_rail_depots:0 "Depots Along the One Railway"
 MAY_wd_def_rail_depots_desc:0 "The country's only railway runs from the capital port along the coast toward the Baltican frontier. Depots of food, fuel and ammunition at each station mean a battalion can move by train and find supplies waiting. The depots cost money to stock and guard, and they tell anyone with a map where the army expects to fight."
 MAY_wd_def_frontier_wardens:0 "Wardens on the Frontiers"
 MAY_wd_def_frontier_wardens_desc:0 "The readiness committee raises frontier wardens from the movement's own volunteers and posts them to the forest edges and the southern hill. They patrol, check papers and report to the committee rather than to the army. Officers distrust them and frontier villages fear them. The committee trusts them completely, which is what worries everyone else."
 MAY_wd_def_civil_corps:0 "A Corps for Civil Defence"
 MAY_wd_def_civil_corps_desc:0 "Civil defence is the army's stated role, so the government gives it a corps of its own: firefighters, rescue teams, medics and shelter wardens trained alongside the battalions. Reservists who will never carry a rifle can serve here. The corps costs training time and equipment, and it gives every district people who know what to do first."
 MAY_wd_def_engineer_roads:0 "Field Engineers for the Frontier"
 MAY_wd_def_engineer_roads_desc:0 "The battalions have no engineers, so roads and bridges in the frontier district depend on civilian contractors who leave when the weather turns. A small engineer school trains soldiers to build and repair roads, culverts and bridges, and its first class works on the frontier district's roads. The army gains a skill; the contractors lose a client."
 MAY_wd_def_mountain_companies:0 "Mountain Companies for the Passes"
 MAY_wd_def_mountain_companies_desc:0 "The army already teaches a handful of soldiers to climb, a skill kept up from older governments. Mountain companies drawn from hill-country recruits would serve on the southern hill and the passes toward Seterano and Valka. They need ropes, skis and patient instructors, and give the army one unit that can go where no truck can follow."
 MAY_wd_ind_works_inventory:0 "What the Seven Plants Make"
 MAY_wd_ind_works_inventory_desc:0 "Malynea's industry is three civilian plants, three arms lines and one shipyard, split between the capital district and the frontier district. Steel and oil come from the ground nearby; almost everything else arrives by sea. An honest inventory of what each plant makes, wastes and needs costs the managers their comfortable reports."
 MAY_wd_ind_steel_beds:0 "Steel From the Capital District"
 MAY_wd_ind_steel_beds_desc:0 "The capital district holds the larger steel deposits, worked by small mines that sell to whoever arrives first. Long contracts with the domestic works and a survey of the deeper beds would steady both prices and output. Mine owners lose the freedom to sell abroad when prices rise, and the works lose the excuse that they cannot plan."
 MAY_wd_ind_coastal_oil:0 "Pumping the Coastal Oil"
 MAY_wd_ind_coastal_oil_desc:0 "Both mainland districts hold modest oil, pumped by old wells near the coast. The fuel would cover more of the country's needs if the wells were deepened and linked to a tank farm at the port. The work costs money the treasury would rather give the port, and the forest around the wells pays a price of its own."
 MAY_wd_ind_repair_first:0 "Spare Parts and Repair Yards"
 MAY_wd_ind_repair_first_desc:0 "One economic model builds on what Malynea already does well: keeping ships, trucks and machines running. A new civilian plant in the frontier district would make spare parts and run repair contracts for foreign hulls calling at the port. Growth would be steady and modest. The arms lines would stay as they are, small and short of orders."
 MAY_wd_ind_fourth_line:0 "A Fourth Arms Line"
 MAY_wd_ind_fourth_line_desc:0 "The other model adds a fourth arms line in the frontier district, beside the two already there, making rifles and trucks for the battalions and for export. Arms would become the largest employer outside the port. Orders would depend on other people's insecurity, and the new hall would stand within sight of the Baltican frontier."
 MAY_wd_ind_rolling_stock:0 "Rolling Stock for the Single Line"
 MAY_wd_ind_rolling_stock_desc:0 "The one railway is short and busy, and its locomotives and wagons are older than most of their drivers. Rebuilding the rolling stock in the port workshops keeps freight moving from the quays toward the frontier district. Each rebuilt engine is out of service for months, so the line runs short for a year before it runs better."
 MAY_wd_ind_timber:0 "Timber From the Forest Districts"
 MAY_wd_ind_timber_desc:0 "Forest covers most of the mainland, and the sawmills that cut it are small and scattered. A timber board grading logs, setting replanting rules and selling abroad through the port would earn steady foreign money. Mill owners resent the grading. The forest districts gain wages and the country gains an export that depends on no one's war."
 MAY_wd_ind_tyre_works:0 "Tyres From Malynean Rubber"
 MAY_wd_ind_tyre_works_desc:0 "Both mainland districts yield some rubber, which today leaves the country raw and comes back as imported tyres. A tyre and belting works would supply the battalions' trucks, the railway and the port cranes. The plant is small, the rubber is uneven and the first tyres wear quickly. Every set made at home is one fewer bought abroad."
 MAY_wd_ind_district_power:0 "Power Lines to the Frontier District"
 MAY_wd_ind_district_power_desc:0 "The frontier district's plants run on their own generators, which fail in every hard winter. A power line from the capital district, cut through the forest beside the railway, would let the plants work through the cold. It costs a summer of clearing and a winter of complaints about bills, and it makes two districts one grid."
 MAY_wd_ind_board_tenders:0 "Contracts Under Board Rules"
 MAY_wd_ind_board_tenders_desc:0 "Under the standing board, every public contract above a modest value is tendered by written rules, scored by examiners and published with the winning price. Contractors who used to win by knowing the right official must now win by bidding lower. The rules slow purchases by weeks and save money the board can show in its minutes."
 MAY_wd_ind_snow_trucks:0 "Trucks Built for Snow"
 MAY_wd_ind_snow_trucks_desc:0 "Imported trucks are built for roads that stay dry, and in a Malynean winter they spend more time in workshops than on the road. Fitting them with heaters, chains, higher clearance and engines that start in deep cold makes them useful in every season. The work is fiddly and the first designs fail, but the battalions and districts both need them."
 MAY_wd_nbr_frontier_walk:0 "Walking the Land Frontiers"
 MAY_wd_nbr_frontier_walk_desc:0 "Malynea has three land neighbours: Baltica to the east along the coastal plain and the forest, Seterano to the south and south-east beyond its mountains, and Valka to the west and south-west through forest and hills. Officials walk every stretch of the three frontiers and record each crossing, track and customs post. No line changes."
 MAY_wd_nbr_equal_distance:0 "Equal Distance From Every Neighbour"
 MAY_wd_nbr_equal_distance_desc:0 "The first posture offers every neighbour identical terms at every crossing, one tariff and one set of papers, and no private understanding with any of them. Nobody can accuse Malynea of favouring one frontier over another. Nobody owes Malynea a favour either, and a small country without friends must solve every crisis on its own."
 MAY_wd_nbr_small_neighbours:0 "Talks Among the Small Neighbours"
 MAY_wd_nbr_small_neighbours_desc:0 "The second posture proposes regular meetings with the governments of Baltica, Seterano and Valka on weather warnings, frontier crossings, forest fires and trade. Malynea makes the offer and cannot know who will come. Even partial attendance gives the small countries of the region a place to speak, at the price of larger powers' attention."
 MAY_wd_nbr_sea_first:0 "Face the Sea, Not the Frontiers"
 MAY_wd_nbr_sea_first_desc:0 "The third posture argues that Malynea's future lies on the convoy lanes rather than its land frontiers. Diplomacy would follow the cargo, with trade offices in the ports where Malynean hulls call and correct but minimal relations next door. The port would gain friends across the sea. The frontier districts would feel forgotten and say so."
 MAY_wd_nbr_eastern_railhead:0 "The Railhead on the Eastern Plain"
 MAY_wd_nbr_eastern_railhead_desc:0 "The railway from the capital port ends on the eastern coastal plain, a short distance from the Baltican frontier, while Baltica's own line reaches its harbour on the far side. Malynea improves the roads, yards and sidings at its end of the gap. Whether the two lines ever meet is for two governments to settle; this answers only Malynea's half."
 MAY_wd_nbr_fire_towers:0 "Fire Towers Along the Valka Forest"
 MAY_wd_nbr_fire_towers_desc:0 "Forest runs unbroken across the western frontier into Valka, and a summer fire does not stop at a customs post. A line of watchtowers on the Malynean side, staffed through every dry season, spots smoke early and calls the district fire crews. The towers cost wages for lonely work and protect timber, villages and the railway alike."
 MAY_wd_nbr_hill_weather:0 "Weather Reports for the Hill Passes"
 MAY_wd_nbr_hill_weather_desc:0 "Weather on the southern hill and in the mountains toward Seterano changes faster than anywhere else on the mainland. A small weather service with stations on the hill and a daily broadcast warns farmers, drivers and the battalions of storms. Its forecasts are free to anyone who listens, including travellers on the far side of the frontier."
 MAY_wd_nbr_frontier_radar:0 "A Radar Over the Frontier District"
 MAY_wd_nbr_frontier_radar_desc:0 "Whatever posture the government chooses, the frontier district sits where Baltica and Seterano meet Malynea, with the railhead and two arms lines inside it. A radar on its higher ground watches the air above all three. It sees aircraft that would never announce themselves, and it needs a staff the district must house and feed."
 MAY_wd_war_charter_spring:0 "Charter Rates in the Spring of 1995"
 MAY_wd_war_charter_spring_desc:0 "The Belkan War begins in late March 1995, half a world from the cold coast. Within days the charter market finds that neutral hulls are scarce and valuable, and offers for Malynean tonnage arrive at rates the port has never seen. Owners are delighted. The government must decide how a neutral merchant nation behaves when war makes its ships precious."
 MAY_wd_war_neutral_colours:0 "Neutral Colours on Every Hull"
 MAY_wd_war_neutral_colours_desc:0 "Every Malynean merchant hull has its name, its flag and the word neutral painted large on both sides and lit at night. Masters carry papers listing the cargo and its destination. None of this guarantees safety. It leaves a belligerent who sinks a Malynean ship no honest excuse, and gives the government a case to press afterwards."
 MAY_wd_war_neutral_ports:0 "Sail for Any Neutral Port"
 MAY_wd_war_neutral_ports_desc:0 "The first answer lets masters accept any charter to a port not at war, wherever its cargo may finally end up. Freight money flows in all spring. Some cargoes will reach the fighting by a second or third hull, and every belligerent's consul in the capital port will keep a list of the Malynean names that carried them."
 MAY_wd_war_home_waters:0 "Hold the Fleet in Home Waters"
 MAY_wd_war_home_waters_desc:0 "The second answer keeps Malynean hulls on the home lanes, the island run and voyages to ports far from the war until a peace is signed. Owners lose the best rates in a generation and some threaten to reflag abroad. The fleet stays whole, the islands stay supplied and no Malynean crew dies in a war that belongs to others."
 MAY_wd_war_crews_abroad:0 "Crews Signed On Abroad"
 MAY_wd_war_crews_abroad_desc:0 "With charters open to any shipper, Malynean hulls now outnumber Malynean sailors, and owners sign crews in foreign ports to fill the berths. The port authority sets rules for wages, papers and training so that every hull still sails to one standard. The crews bring skills and languages, and a few bring trouble the harbour police must handle."
 MAY_wd_war_home_holds:0 "Home Cargoes Fill the Holds"
 MAY_wd_war_home_holds_desc:0 "Under the rule that home cargo comes first, the war's high rates are a temptation owners may not accept. Instead the government guarantees them a fixed rate for carrying Malynean steel, timber and fuel while the war lasts, and the treasury pays the difference between that rate and the market. The districts never run short."
 MAY_wd_war_after_lumen:0 "Rates Fall After the Lumen Treaty"
 MAY_wd_war_after_lumen_desc:0 "The Belkan War ends in June 1995 with the treaty concluded at Lumen. Charter rates sink over the summer and the offers for Malynean tonnage dry up. Owners who borrowed against wartime earnings now face their banks. The government must manage the landing: some help for owners, and no pretence that the boom was ever going to last."
 MAY_wd_war_belkan_lanes:0 "Charter Lanes Toward Belka"
 MAY_wd_war_belkan_lanes_desc:0 "Where Belka emerges from the war holding the advantage, its ports start buying again within the year. Belkan shippers look for neutral tonnage that kept its distance during the fighting, and Malynean hulls qualify. Every contract will be read by the governments that lost, which keep their own lists of who carried what."
 MAY_wd_war_allied_cargo:0 "Reconstruction Cargoes for the Allies"
 MAY_wd_war_allied_cargo_desc:0 "Where Belka loses the war, the governments that fought it set about rebuilding what the fighting broke. Their reconstruction agencies charter neutral hulls in large numbers for steel, cement and machinery. Malynean owners can bid. The contracts carry inspection clauses and pay slowly, but they pay, and none of them carries shells."
 MAY_wd_war_civil_lessons:0 "Lessons for the Civil Defence Service"
 MAY_wd_war_civil_lessons_desc:0 "Officers in the capital collect what they can about the fighting around Belka from newspapers, attaches' letters and the stories crews bring home. They study how quickly a small country's roads and bridges became targets and how civilians fared where nobody had planned for them. The findings go into the civil defence manual."
 MAY_wd_sky_falling_sky:0 "The Forest Under a Falling Sky"
 MAY_wd_sky_falling_sky_desc:0 "The FCU announcement of April 1996 turns Ulysses from a possibility into a certainty, more than a year after the first astronomical warning. Nobody can say where the fragments will fall. Malynea has forests that could burn for weeks, islands reachable only by sea and a civil defence service of four battalions. It must plan for a danger it cannot locate."
 MAY_wd_sky_hill_galleries:0 "Galleries Under the Southern Hill"
 MAY_wd_sky_hill_galleries_desc:0 "The first plan cuts shelter galleries into the rock of the southern hill, the only high ground on the mainland, with stores, air and water for weeks. It protects whoever reaches it. The hill lies far from the capital port and the forest villages, so the plan depends on roads and trains still working when everything else has failed."
 MAY_wd_sky_sea_evacuation:0 "Evacuation by Convoy"
 MAY_wd_sky_sea_evacuation_desc:0 "The second plan uses what Malynea has most of: merchant hulls. If the fragments threaten the mainland coast or the islands, convoys would carry families to safer ports or out to open sea until the danger passes. The plan needs every hull in home waters on the right day, and some foreign port willing to take them in."
 MAY_wd_sky_firebreaks:0 "Firebreaks Through the Forests"
 MAY_wd_sky_firebreaks_desc:0 "Burning fragments in a dry summer could set the mainland forests alight faster than any crew could respond. Wide firebreaks cut along the roads and the railway, with water points and fire crews, would slow a blaze and keep escape routes open. The clearing costs timber the mills wanted to sell and leaves scars that take decades to soften."
 MAY_wd_sky_island_lifeboats:0 "An Evacuation Plan for the Islands"
 MAY_wd_sky_island_lifeboats_desc:0 "The six western islands have no deep shelter and no way off except by sea. A plan assigns every islander a boat, a muster point and a destination, and keeps fuel stocked at every quay. The drills are rehearsed each summer. Islanders do them with grim good humour and a sharp eye on whether the capital really means it."
 MAY_wd_sky_year_stores:0 "A Year of Stores in Every District"
 MAY_wd_sky_year_stores_desc:0 "If the impact closes the sea lanes, the country cannot feed itself for long. Grain, fuel, medicine and seed for a year are stored in every district and on every island, and rotated as they age. The stores tie up money and warehouse space the port wanted for cargo. They also let families believe the government has a plan."
 MAY_wd_sky_mail_plane:0 "A Mail Plane for the Islands"
 MAY_wd_sky_mail_plane_desc:0 "The planners notice that in any emergency the islands would be days away by hull. A small airfield near the capital and a light aircraft for mail, doctors and urgent passengers cut that to hours. Malynea has no aircraft of its own, so the first pilots must train abroad, and the field must be ploughed clear every winter morning."
 MAY_wd_sky_july_vigil:0 "Watching the July Sky"
 MAY_wd_sky_july_vigil_desc:0 "The night of 8 July 1999, when Ulysses crosses inside the Earth's Roche limit, finds the civil defence corps on duty, the convoys waiting at their quays and every radio in the country switched on. This focus records only that the country was as ready as it could make itself, and what the government chose to tell its people."
 MAY_wd_sky_district_check:0 "Inspecting Every District"
 MAY_wd_sky_district_check_desc:0 "After the long night the government sends inspectors to every district, island and depot to look for damage, fires and casualties, and to tell people what they found. Whatever they report, the waiting is over. The emergency rules end, the stores begin to flow back into the shops and the convoys return to charter work."
 MAY_wd_sky_relief_berths:0 "Spare Berths for Relief Cargo"
 MAY_wd_sky_relief_berths_desc:0 "The impact years leave many countries in need, and the convoy fleet has hulls to spare once the emergency rules end. The government sets aside berths on every outbound voyage for relief cargo such as medicine, tents and grain, carried at cost. Owners grumble about the lost revenue. The country earns a reputation it could never buy."
 MAY_wd_cent_ten_year_report:0 "The Ten-Year Report"
 MAY_wd_cent_ten_year_report_desc:0 "A decade after the question of the suspended ballot was first asked, an independent panel reports on what the years built and what they left undone: roads, quays, drills and schools on one side, departures and neglect on the other. The report becomes the basis of every political argument of the new decade, whoever holds the seals."
 MAY_wd_cent_graduate_tickets:0 "A Return Ticket for Graduates"
 MAY_wd_cent_graduate_tickets_desc:0 "Young Malyneans study abroad because the country has no university large enough to train engineers, doctors and ship officers, and too many stay away. A scheme pays for the voyage home, waives the first years of tax and guarantees a post in the port, the districts or the hospital service. It is expensive and works slowly."
 MAY_wd_cent_island_school:0 "A Secondary School in the Islands"
 MAY_wd_cent_island_school_desc:0 "Island children who want more than primary schooling must board in the capital from the age of twelve. A secondary school in the islands, with teachers rotated from the mainland and boarding for children from the other harbours, keeps families together. It costs teachers' bonuses and a hull's worth of supplies every year."
 MAY_wd_cent_listed_port:0 "Sell Shares in the Port Authority"
 MAY_wd_cent_listed_port_desc:0 "One proposal sells a minority stake in the port authority to investors and spends the money on dredging, warehouses and cranes. Private owners would push for efficiency and higher dues. The state would keep control on paper and lose some of it in practice, and the islands would worry that their lane is nobody's priority."
 MAY_wd_cent_public_port:0 "Keep the Port in Public Hands"
 MAY_wd_cent_public_port_desc:0 "The other proposal keeps the port authority wholly public and funds its works from dues and long bonds. Decisions stay with the government and the districts, and the island lane stays protected. Investment arrives more slowly, the cranes stay old a little longer and the port competes with rivals that have more money behind them."
 MAY_wd_cent_usean_lanes:0 "Charter Lanes Into a Usean War"
 MAY_wd_cent_usean_lanes_desc:0 "During the summer of 2003 the Erusean seizure of Stonehenge in San Salvacion turns into a continental war across Usea. Malynea is far from that continent, but its hulls carry cargo on lanes that reach it. The government must decide whether neutrality means staying away or carrying what civilians on every side still need."
 MAY_wd_cent_relief_marks:0 "Relief Charters Under Neutral Marks"
 MAY_wd_cent_relief_marks_desc:0 "Malynean hulls offer to carry food, medicine and shelter materials to civilian ports on any side of the Usean war, under neutral markings and open manifests that any party may inspect. Owners earn little. Crews take real risks on lanes where submarines and aircraft do not read manifests. The country gains a role no arms contract could buy."
 MAY_wd_cent_isaf_peace:0 "Charters After the Allied Peace"
 MAY_wd_cent_isaf_peace_desc:0 "In this outcome the war in Usea ends with the ISAF victorious, and the continent turns to rebuilding. Reconstruction agencies need neutral tonnage for steel, cement and machinery. Malynean hulls that carried relief during the war are known and trusted on those lanes. The contracts pay slowly, but steadily and for years."
 MAY_wd_cent_erusean_peace:0 "Cargoes Under Erusean Terms"
 MAY_wd_cent_erusean_peace_desc:0 "In this outcome Erusea comes out of the war in control of the continent, and Usean ports reopen under its rules. Erusean authorities license neutral shippers and set the terms of every call. Malynean hulls can take the licences or leave the Usean lanes to others. Either way the fleet must decide whose rules it will sail under."
 MAY_wd_cent_era_close:0 "What the Districts Ask For Next"
 MAY_wd_cent_era_close_desc:0 "The last focus of the era asks the districts, the islands and the port what they want from the coming years, and prints their answers side by side without editing. The replies disagree on almost everything except the convoy lane. The government gains no new power from the exercise, only a clear list of what it will be judged on."
 MAY_wd_cent_era_close_tt_2:0 "Closes the 1991 to 2005 programme; later eras are written separately."
 ac_wd_may_tree:0 "Malynea: National Programme"
 ac_wd_may_tree_desc:0 "The national focus programme of Malynea, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 MAY_wd_caretaker_rule:0 "Caretakers With the Seals"
 MAY_wd_caretaker_rule_desc:0 "A democratic administration governing with the ballot suspended."
 MAY_wd_ballot_promised:0 "The Ballot Has a Date"
 MAY_wd_ballot_promised_desc:0 "The overdue election has a date, and every camp is campaigning for it."
 MAY_wd_board_compact:0 "The District Boards Compact"
 MAY_wd_board_compact_desc:0 "Administrators from the three districts agree to govern by published rules."
 MAY_wd_movement_pressure:0 "The Movement in the Streets"
 MAY_wd_movement_pressure_desc:0 "The national movement marches for a government of readiness."
 MAY_wd_ballot_restored:0 "Rolls for Every District"
 MAY_wd_ballot_restored_desc:0 "Every adult on the mainland and the islands is on a voter roll."
 MAY_wd_board_minutes:0 "Minutes in Public"
 MAY_wd_board_minutes_desc:0 "The board posts its minutes and reasons at every post office."
 MAY_wd_readiness_decrees:0 "Readiness by Decree"
 MAY_wd_readiness_decrees_desc:0 "Numbered decrees on rationing, travel, the press and service."
 MAY_wd_charter_court:0 "The Charter Court"
 MAY_wd_charter_court_desc:0 "Judges on long terms read the charter when governments disagree with it."
 MAY_wd_merit_service:0 "Examined Civil Servants"
 MAY_wd_merit_service_desc:0 "Posts filled by written examinations marked without names."
 MAY_wd_hull_register:0 "The Merchant Hull Register"
 MAY_wd_hull_register_desc:0 "Every merchant hull checked against its line in the register."
 MAY_wd_open_charters:0 "Charters Open to Any Shipper"
 MAY_wd_open_charters_desc:0 "Light rules and low fees for any shipper who registers or charters here."
 MAY_wd_home_cargo_rule:0 "Home Cargoes First"
 MAY_wd_home_cargo_rule_desc:0 "Malynean hulls carry Malynean cargo first and foreign cargo with spare tonnage."
 MAY_wd_pilot_guild:0 "Examined Harbour Pilots"
 MAY_wd_pilot_guild_desc:0 "Examined pilots on a duty roster with a pension fund."
 MAY_wd_winter_roadstead:0 "The Winter Channel Tug"
 MAY_wd_winter_roadstead_desc:0 "A strengthened tug and a marked channel keep the port working through the ice."
 MAY_wd_lane_watch:0 "Listening on the Island Lane"
 MAY_wd_lane_watch_desc:0 "Merchant masters carry hydrophones and a reporting code."
 MAY_wd_masters_school:0 "The Convoy Masters School"
 MAY_wd_masters_school_desc:0 "Masters learn station-keeping, winter navigation and radio procedure ashore."
 MAY_wd_ice_channel:0 "A Channel Through the Ice"
 MAY_wd_ice_channel_desc:0 "The tug runs day and night to keep a winter channel open."
 MAY_wd_charter_drive:0 "Charter Agents Abroad"
 MAY_wd_charter_drive_desc:0 "Port authority agents in foreign ports are winning charters for Malynean hulls."
 MAY_wd_island_isolation:0 "Islands Beyond the Roads"
 MAY_wd_island_isolation_desc:0 "Six hill islands that depend on the convoy lane for nearly everything."
 MAY_wd_island_radio:0 "Harbour Office Radios"
 MAY_wd_island_radio_desc:0 "Every island harbour office can reach the others and the capital at any hour."
 MAY_wd_island_councils:0 "Island Purses"
 MAY_wd_island_councils_desc:0 "Island councils raise their own harbour dues and spend them at home."
 MAY_wd_island_prefects:0 "Island Prefects"
 MAY_wd_island_prefects_desc:0 "A prefect from the capital governs each island with a budget and staff."
 MAY_wd_hospital_rota:0 "A Surgery Afloat"
 MAY_wd_hospital_rota_desc:0 "A converted freighter with a surgery sails a fixed round of the islands."
 MAY_wd_island_deputies:0 "Island Seats in the Chamber"
 MAY_wd_island_deputies_desc:0 "Island deputies vote together on the lane, the dues and the hospital ship."
 MAY_wd_supply_run:0 "The Extra Supply Run"
 MAY_wd_supply_run_desc:0 "An extra convoy has carried fuel, flour and medicine to the islands."
 MAY_wd_thin_service:0 "Four Battalions on the Roll"
 MAY_wd_thin_service_desc:0 "An infantry-only civil defence army with no artillery, engineers or aircraft."
 MAY_wd_forest_screens:0 "Screens on the Forest Roads"
 MAY_wd_forest_screens_desc:0 "Small units hold the forest junctions and tracks."
 MAY_wd_hill_garrison:0 "The Southern Hill Garrison"
 MAY_wd_hill_garrison_desc:0 "A permanent garrison on the one hill province, facing two frontiers."
 MAY_wd_shore_lines:0 "Lines Along the Capital Shore"
 MAY_wd_shore_lines_desc:0 "Trenches, wire and anti-aircraft positions ring the capital port."
 MAY_wd_reserve_cards:0 "Reserve Cards"
 MAY_wd_reserve_cards_desc:0 "Every trained adult holds a card naming a depot, a company and a day."
 MAY_wd_winter_drill:0 "Drilled in the Long Winter"
 MAY_wd_winter_drill_desc:0 "The battalions train on skis, in snow shelters and with frozen trucks."
 MAY_wd_rail_depots:0 "Depots on the One Line"
 MAY_wd_rail_depots_desc:0 "Food, fuel and ammunition wait at every station on the railway."
 MAY_wd_frontier_wardens:0 "Frontier Wardens"
 MAY_wd_frontier_wardens_desc:0 "Movement volunteers patrol the frontiers and report to the committee."
 MAY_wd_civil_defence_corps:0 "Rescue and Shelter Wardens"
 MAY_wd_civil_defence_corps_desc:0 "Firefighters, rescue teams, medics and shelter wardens trained with the army."
 MAY_wd_reserve_callout:0 "A Year Group at the Depots"
 MAY_wd_reserve_callout_desc:0 "One year group of reservists is drilling at its depots."
 MAY_wd_works_audit:0 "The Works Inventory"
 MAY_wd_works_audit_desc:0 "An honest account of what each plant makes, wastes and needs."
 MAY_wd_steel_contracts:0 "Steel on Long Contracts"
 MAY_wd_steel_contracts_desc:0 "The capital district mines sell to the domestic works on long contracts."
 MAY_wd_coastal_wells:0 "Deepened Coastal Wells"
 MAY_wd_coastal_wells_desc:0 "Old wells near the coast deepened and linked to a tank farm at the port."
 MAY_wd_repair_economy:0 "The Repair Economy"
 MAY_wd_repair_economy_desc:0 "Spare parts and repair contracts for hulls, trucks and machines."
 MAY_wd_arms_lines:0 "The Fourth Arms Line"
 MAY_wd_arms_lines_desc:0 "Rifles and trucks for the battalions and for licensed export."
 MAY_wd_rail_overhaul:0 "Rolling Stock in the Workshops"
 MAY_wd_rail_overhaul_desc:0 "Engines and wagons are being rebuilt one by one."
 MAY_wd_timber_trade:0 "The Timber Board"
 MAY_wd_timber_trade_desc:0 "Graded logs, replanting rules and export sales through the port."
 MAY_wd_tyre_works:0 "The Tyre Works"
 MAY_wd_tyre_works_desc:0 "Tyres and belting made from home-grown rubber."
 MAY_wd_district_power:0 "One Grid for Two Districts"
 MAY_wd_district_power_desc:0 "A power line through the forest joins the frontier district to the capital."
 MAY_wd_board_tenders:0 "Tenders Under Board Rules"
 MAY_wd_board_tenders_desc:0 "Public contracts tendered by written rules and published with the price."
 MAY_wd_frontier_survey:0 "Three Frontiers Recorded"
 MAY_wd_frontier_survey_desc:0 "Every crossing, track and customs post on three frontiers is recorded."
 MAY_wd_equal_distance:0 "No Neighbour Favoured"
 MAY_wd_equal_distance_desc:0 "The same rules for every neighbour and favours for none."
 MAY_wd_neighbour_consults:0 "Talks With Small Neighbours"
 MAY_wd_neighbour_consults_desc:0 "Regular meetings offered on weather, fires, crossings and trade."
 MAY_wd_sea_orientation:0 "Facing the Sea"
 MAY_wd_sea_orientation_desc:0 "Diplomacy follows the cargo to the ports where Malynean hulls call."
 MAY_wd_fire_watch:0 "The Fire Watch"
 MAY_wd_fire_watch_desc:0 "Watchtowers along the western forest staffed every dry season."
 MAY_wd_weather_service:0 "Hill Weather Reports"
 MAY_wd_weather_service_desc:0 "Daily forecasts broadcast from stations on the southern hill."
 MAY_wd_fire_season:0 "Fire Season Patrols"
 MAY_wd_fire_season_desc:0 "The towers and fire crews are on full watch before the dry season."
 MAY_wd_war_charter_boom:0 "A Wartime Charter Market"
 MAY_wd_war_charter_boom_desc:0 "Neutral tonnage is scarce and Malynean hulls are in demand."
 MAY_wd_neutral_markings:0 "Neutral Colours"
 MAY_wd_neutral_markings_desc:0 "Name, flag and the word neutral painted large on every hull."
 MAY_wd_neutral_port_trade:0 "Any Neutral Port"
 MAY_wd_neutral_port_trade_desc:0 "Masters may take any charter to a port not at war."
 MAY_wd_home_waters:0 "Home Waters Only"
 MAY_wd_home_waters_desc:0 "The fleet keeps to the home lanes and distant ports until the peace."
 MAY_wd_foreign_crews:0 "Crews From Abroad"
 MAY_wd_foreign_crews_desc:0 "Foreign sailors fill Malynean berths under one standard of wages and papers."
 MAY_wd_home_holds:0 "Guaranteed Home Freight"
 MAY_wd_home_holds_desc:0 "The treasury pays owners a fixed wartime rate for home cargo."
 MAY_wd_belkan_routes:0 "Charter Lanes to Belka"
 MAY_wd_belkan_routes_desc:0 "Belkan shippers hire neutral tonnage that kept its distance."
 MAY_wd_allied_cargoes:0 "Reconstruction Cargoes"
 MAY_wd_allied_cargoes_desc:0 "Allied rebuilding agencies charter Malynean hulls for steel and cement."
 MAY_wd_impact_dread:0 "Waiting for Ulysses"
 MAY_wd_impact_dread_desc:0 "Nobody knows where the fragments will fall."
 MAY_wd_hill_galleries:0 "Galleries in the Hill"
 MAY_wd_hill_galleries_desc:0 "Shelter galleries cut into the southern hill, stocked for weeks."
 MAY_wd_convoy_evacuation:0 "Berth Lists for Evacuation"
 MAY_wd_convoy_evacuation_desc:0 "Every merchant hull has an evacuation berth list and a muster day."
 MAY_wd_firebreaks:0 "Firebreaks Through the Forest"
 MAY_wd_firebreaks_desc:0 "Wide cleared strips with water points along roads and railway."
 MAY_wd_island_lifeboats:0 "A Boat for Every Islander"
 MAY_wd_island_lifeboats_desc:0 "Every islander has a boat, a muster point and a destination."
 MAY_wd_district_stores:0 "A Year of Stores"
 MAY_wd_district_stores_desc:0 "Grain, fuel, medicine and seed for a year in every district."
 MAY_wd_relief_berths:0 "Spare Berths for Relief"
 MAY_wd_relief_berths_desc:0 "Relief cargo travels at cost on every outbound voyage."
 MAY_wd_graduate_return:0 "Graduates Brought Home"
 MAY_wd_graduate_return_desc:0 "Paid passage home and a guaranteed post for graduates abroad."
 MAY_wd_island_school:0 "The Island School"
 MAY_wd_island_school_desc:0 "A secondary school with boarding for island children."
 MAY_wd_port_shares:0 "A Listed Port Authority"
 MAY_wd_port_shares_desc:0 "Investors hold a minority of the port authority."
 MAY_wd_public_port:0 "A Public Port Authority"
 MAY_wd_public_port_desc:0 "The port authority stays public and borrows on long bonds."
 MAY_wd_relief_charters:0 "Relief Under Neutral Marks"
 MAY_wd_relief_charters_desc:0 "Food, medicine and shelter materials for civilian ports on any side."
 MAY_wd_usean_rebuilding:0 "Usean Rebuilding Cargoes"
 MAY_wd_usean_rebuilding_desc:0 "Reconstruction agencies in Usea charter trusted neutral hulls."
 MAY_wd_erusean_terms:0 "Cargoes on Erusean Terms"
 MAY_wd_erusean_terms_desc:0 "Usean ports licensed by Erusean authorities."
 ac_wd_may.1.t:0 "The Ballot Nobody Called"
 ac_wd_may.1.d:0 "The calendar in the cabinet office still shows an election every four years, and the last date it marks passed without a single polling hall opening. Malynea is governed by a National Administration that calls itself democratic and has kept the ballot suspended for longer than most young voters can remember. Its officials run the capital port, the forest districts and the six western islands competently enough that many citizens have stopped asking why.\n\nThe opinion surveys explain why the question is dangerous. Half the respondents back the national movement, which wants a disciplined government of readiness. Almost as many back no party at all and trust the administrators they already know. The democrats who want the ballot restored are barely one in a hundred, and they know perfectly well that any election they force would be won by somebody else.\n\nThe movement has announced a petition and claims it will gather signatures in every district and on every island. The administration can publish the election clause now and let the whole country argue about it, or wait to see how many names the movement really collects before it commits itself to anything. Both choices will be read as a statement of intent, and both will be quoted for years.\n\nProvisional gameplay."
 ac_wd_may.1.a:0 "Publish the election clause in every newspaper."
 ac_wd_may.1.b:0 "Wait for the movement to count its signatures."
 ac_wd_may.2.t:0 "The Signatures Are Counted"
 ac_wd_may.2.d:0 "The national movement delivers its petition to the administration in a column of trucks, box after box of signed sheets from the forest villages, the frontier district and the capital port. Even the island harbours have sent a few hundred names by the last hull of the month. The organisers announce their total on the steps of the building before the clerks have opened a single box.\n\nThe clerks need three weeks. They find names entered twice, signatures from addresses no register has ever listed and whole pages filled in by one hand. They also find tens of thousands of genuine signatures from citizens who want something to change and have been given no other way of saying so. Both findings are true, and each camp intends to quote only one of them.\n\nThe administration must now say what the count means. It can accept the petition as a fair expression of opinion and move the argument on to what should actually be done, or refer the count to the courts and let judges decide which names are real. Accepting concedes ground to the movement. Referring buys time and makes the movement angrier, in public and in the streets.\n\nProvisional gameplay."
 ac_wd_may.2.a:0 "Accept the petition as it stands."
 ac_wd_may.2.b:0 "Refer the count to the courts."
 ac_wd_may.3.t:0 "A Register of Hulls"
 ac_wd_may.3.d:0 "The inspectors start at the capital port in the first week of the year, when most of the merchant fleet is laid up against the ice. They walk every deck, open every engine room and compare each hull with its line in the register. By the time the roadstead thaws they have taken the mail hull out to the island harbours and filled four ledgers with notes.\n\nThe register proves generous. Several hulls listed as active are rusting at their moorings, a few were sold abroad without anyone in the port office noticing, and one exists only on paper. The rest are working ships, many of them old, crewed by masters who know the island lane and the foreign ports better than any official. For a country with no navy, they are the nearest thing it has to a fleet.\n\nThe port authority now holds an honest list and an awkward question. Owners want the findings kept confidential, because charterers and insurers pay less for ships they know more about. The districts want them published, because these hulls carry their fuel and grain. The cabinet must decide who reads the ledgers, and the owners have already asked for a meeting.\n\nProvisional gameplay."
 ac_wd_may.3.a:0 "Publish the register in full."
 ac_wd_may.3.b:0 "Show the ledgers to the owners alone."
 ac_wd_may.4.t:0 "Mail Day in the Islands"
 ac_wd_may.4.d:0 "Mail day comes to the western islands once a week in good weather and less often in bad. The whole harbour turns out when the hull ties up: letters, newspapers, medicines, spare parts and the passengers who have waited on the mainland for a berth. For a few hours each island is connected to the country it belongs to, and then the hull sails on for the next harbour.\n\nThe officials who ride the mail hull for the survey come back with a long list. No island has a hospital, a secondary school or a road a truck can climb in winter. Fuel is rationed whenever storms delay the lane. The island councils keep careful accounts of every promise the capital has made them over the years, and the accounts are not flattering to anyone.\n\nIslanders want to know what the survey will change. Some want their councils trusted with money of their own; others would settle for one official in the capital whose job is to answer their letters. The government must decide how to present the findings, knowing the islands will measure every later decision against whatever it says on this mail day.\n\nProvisional gameplay."
 ac_wd_may.4.a:0 "Read the findings aloud in every island harbour."
 ac_wd_may.4.b:0 "Send the findings to the ministries first."
 ac_wd_may.5.t:0 "Muster in the Forest"
 ac_wd_may.5.d:0 "For the first time in years all four battalions muster together, at a forest camp an hour's drive from the capital port. The trucks arrive in a long column, a train brings the companies from the frontier district and officers count heads with clipboards in the cold. Inspectors from the administration walk along the lines and write down everything they see.\n\nWhat they see is an army built for a narrow job. The rifles are serviceable and the drivers know their trucks. There is no artillery, no engineer company and no aircraft, and the battalions have trained for guarding roads, escorting fuel and helping districts through winter storms rather than for fighting anyone. Officers argue over dinner about whether that is a weakness to fix or a role to perfect.\n\nThe government must decide how to describe the muster to the country. It can say plainly that the army is a civil defence service that carries rifles, and ask the public to build on that, or present the battalions as a fighting force and accept that part of the promise is hollow. The frontier districts and the neighbours will hear the answer either way.\n\nProvisional gameplay."
 ac_wd_may.5.a:0 "Call it a civil defence service, plainly."
 ac_wd_may.5.b:0 "Present the battalions as a fighting force."
 ac_wd_may.6.t:0 "Seven Plants on One Page"
 ac_wd_may.6.d:0 "The inventory teams return from both mainland districts with a single page that sums up the nation's industry, seven plants listed by name, output and payroll, the shipyard among them. Steel and oil come from deposits nearby, while almost every machine tool, chemical and spare part arrives by sea through the capital port. The page fits on one desk, and the ministers find that more alarming than reassuring.\n\nThe details explain the alarm. The arms lines run below capacity for lack of orders, the civilian plants depend on imported parts that arrive late every winter, and the shipyard repairs other people's ships far more often than it builds anything of its own. The plants employ a large share of the mainland's workers, and every manager has a reason why his plant should be spared any change.\n\nThe government wants the inventory to lead to a model for the decade, whether repair and spare parts or more arms lines. Before choosing, it must decide who sees the page. The managers want it kept inside the ministries. The district councils, whose voters work in the plants, want it read out and argued over in public before anything is decided.\n\nProvisional gameplay."
 ac_wd_may.6.a:0 "Argue it out in public."
 ac_wd_may_6_a:0 "Argue it out in public."
 ac_wd_may.6.b:0 "Hold the page within the ministries."
 ac_wd_may.7.t:0 "Three Frontiers on Foot"
 ac_wd_may.7.d:0 "The survey teams set out in early summer, when the forest tracks have dried and the hill passes are open. One team follows the coastal plain and the forest edge toward Baltica. A second climbs the southern hill to the line where the Seterano mountains begin. A third walks the forest and hills along the frontier with Valka, the longest and least visited of the three.\n\nThey come back with blistered feet and a thick report. The customs posts are few, badly heated and staffed by officers who have not been relieved in years. Forest tracks cross the frontiers in places no official had seen before. Villages on both sides of each line marry, trade and quarrel with each other far more than with their own capitals. None of the frontiers is disputed, and none is well understood.\n\nThe cabinet has to decide what to do with what the teams learned. Opening more crossings would help the frontier villages and trouble the customs office; leaving the frontiers as they are would keep them quiet and poorly watched. Whatever posture the government adopts toward its neighbours afterwards will rest on the answer it gives here.\n\nProvisional gameplay."
 ac_wd_may.7.a:0 "Open more crossings for the frontier villages."
 ac_wd_may.7.b:0 "Leave the frontiers as they are."
 ac_wd_may.8.t:0 "The Brokers Work Through the Night"
 ac_wd_may.8.d:0 "Late in March 1995 the Belkan War begins, an ocean and a continent away from the cold coast. Malynea has no frontier anywhere near the fighting and no part in it. Within a week the charter brokers in the capital port are working through the night, because shippers everywhere have discovered that neutral hulls are suddenly scarce and that this small country owns a great many of them.\n\nOffers arrive faster than the owners can read them. Some are for grain and fuel bound for neutral ports. Some are for machine parts whose final destination is vague. A few are plainly for cargo that will end up at the front. Insurers raise their premiums on every voyage that goes anywhere near the war, and masters ask the port office what the government expects of them before they put their names to anything.\n\nThe cabinet has to answer before the owners answer for it. It can tell the fleet that any lawful charter is acceptable and let the market sort out the rest, or ask owners to wait until the government writes clear rules on destinations and cargo. The first answer pays at once. The second may still pay later, and will certainly anger the brokers.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25; the Malynean response is gameplay."
 ac_wd_may.8.a:0 "Any lawful charter is acceptable."
 ac_wd_may.8.b:0 "Hold back until the rules are written."
 ac_wd_may.9.t:0 "The Sky Above the Forests"
 ac_wd_may.9.d:0 "The warning of December 1994 said only that Ulysses might hit the Earth. The announcement of April 1996 says that it will. Where the fragments will fall cannot yet be predicted, and the scientists on the radio admit it plainly. Malynea, like every other country, must now prepare for a danger whose location may not be known until the last weeks.\n\nThe civil defence planners spread their maps across the table and see the country's weaknesses at once. The mainland is almost all forest, which could burn for weeks if hot fragments landed in a dry summer. The six western islands have no shelter worth the name and no exit except by sea. The only high ground is the southern hill, far from where most people live. The country's greatest asset is a merchant fleet that could carry thousands, if it were home and fuelled on the right day.\n\nThe public is calmer than the planners expected and more frightened than it admits. Families buy lamps and tinned food, island councils ask about boats and forest villages ask about fire crews. The government must decide how fast to move and how much to say, knowing that a plan announced too early may be wrong and a plan announced too late may be useless.\n\nProvisional gameplay: date anchors only, ACES Chronicle rows 1994 / 12.10 and 1996 / 04.20; Malynean preparations are gameplay."
 ac_wd_may.9.a:0 "Announce a plan within the month."
 ac_wd_may_9_a:0 "Announce a plan within the month."
 ac_wd_may.9.b:0 "Study every option before announcing."
 ac_wd_may.10.t:0 "A Vigil on the Cold Coast"
 ac_wd_may.10.d:0 "Ulysses is due to cross inside the Earth's Roche limit on 8 July 1999. The northern summer night is short and pale, and in Malynea almost nobody sleeps through it. Civil defence crews sit by their radios in every district, convoys wait at their quays with crews aboard, and on the six islands families gather beside the boats assigned to them.\n\nReports arrive from abroad all night, some careful and some wild, and the crisis room in the capital logs every one of them. A master far out on the island lane radios about lights on the horizon. The weather stations on the southern hill report nothing they can explain. By the early hours the duty officers have learned to write everything down and to believe nothing until it is confirmed twice.\n\nAt dawn the government must decide what to do with a country that has spent the night waiting. It can keep the emergency rules in force until the picture is clear, or release the crews and convoys and let people go back to work while inspectors check every district. Either choice will be second-guessed, whatever the inspectors eventually report.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1999 / 07.08; no damage in Malynea is claimed."
 ac_wd_may.10.a:0 "Keep the emergency rules for a week."
 ac_wd_may.10.b:0 "Send everyone back to work."
 ac_wd_may.11.t:0 "Ten Years of Answers"
 ac_wd_may.11.d:0 "The report runs to two volumes. It was written by a panel of judges, port officials, island councillors and district teachers, chosen by lot from lists every camp had agreed to. It covers the decade since the question of the suspended ballot was first asked, and it is blunt about every government that has held the seals in that time.\n\nThe panel lists what the decade built, in roads, quays, drills and schools, and what it left undone. It credits the port with working through the Belkan War charters and the impact years. It faults successive governments for young graduates who leave and do not return, for frontier districts that feel forgotten and for decisions that still depend on too few offices in the capital.\n\nThe government can print both volumes as written and spend a season answering for them, or issue its own summary first and release the full text later. The panel has already said that it will publish its own conclusions if anyone edits them, which narrows the choice more than the ministers would like. Whatever they decide, the panel's members are already giving interviews.\n\nProvisional gameplay."
 ac_wd_may.11.a:0 "Print both volumes as written."
 ac_wd_may.11.b:0 "Issue the government summary first."
 ac_wd_may.12.t:0 "Manifests Open to Any Inspector"
 ac_wd_may.12.d:0 "War on the Usean continent reaches the capital port the way distant wars always do, through the charter brokers. In the summer of 2003 Erusea seizes Stonehenge in neutral San Salvacion and fighting spreads across Usea. Within weeks relief agencies are asking for neutral hulls to carry food, medicine and tents to civilian ports, and the usual brokers are asking for hulls to carry anything at all.\n\nMalynean owners remember the Belkan War charters and draw different lessons from them. Some want the fleet kept well away from a war that is not Malynea's. Others point out that civilians on every side still need grain and medicine, and that a neutral fleet with open manifests is exactly what relief agencies cannot find elsewhere. Crews, as ever, ask who will pay if a hull is lost.\n\nThe cabinet must answer the relief agencies first. It can offer Malynean tonnage for relief cargo only, under neutral markings and open to inspection by any party, or keep every hull off the Usean lanes until the war ends. The first course carries real risk. The second carries none, and leaves the country nothing to point to afterwards.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2003 / SUMMER; the Malynean response is gameplay."
 ac_wd_may.12.a:0 "Offer tonnage for relief cargo only."
 ac_wd_may.12.b:0 "Keep every hull off the Usean lanes."
 MAY_wd_elected_council_office:0 "Council of Ministers of Malynea"
 MAY_wd_elected_council_office_desc:0 "A council of ministers chosen by the newly elected chamber, governing collectively, bound to win a vote for every budget and to hold the next election on the calendar. Provisional gameplay office with no named holder."
 MAY_wd_standing_board_office:0 "Standing Board of the Three Districts"
 MAY_wd_standing_board_office_desc:0 "A board of administrators from the capital district, the frontier district and the islands, serving fixed terms, deciding by majority and publishing its reasons, with no party seats and no election. Provisional gameplay office with no named holder."
 MAY_wd_readiness_committee_office:0 "Committee of National Readiness"
 MAY_wd_readiness_committee_office_desc:0 "A committee named by the national movement that governs by numbered decree, with parties suspended and the press under a censor. Provisional gameplay office with no named holder."
 ac_wd_may_decisions:0 "Malynea: National Measures"
 ac_wd_may_decisions_desc:0 "Measures from the national programme of Malynea. Provisional gameplay unless a source ledger row says otherwise."
 MAY_wd_break_roadstead_ice_decision:0 "Break a Channel Through the Ice"
 MAY_wd_break_roadstead_ice_decision_desc:0 "Runs the strengthened tug day and night to hold a channel open through the worst of the winter. Repeatable once a winter."
 MAY_wd_island_supply_run_decision:0 "An Extra Supply Run to the Islands"
 MAY_wd_island_supply_run_decision_desc:0 "Sends an extra convoy of fuel, flour and medicine to the six islands ahead of the storms. Repeatable twice a year."
 MAY_wd_reserve_year_group_decision:0 "Call a Year Group to the Depots"
 MAY_wd_reserve_year_group_decision_desc:0 "Brings one year group of reservists to their depots for a fortnight of drill. Employers object; repeatable once a year."
 MAY_wd_capital_runway_decision:0 "Lengthen the Capital Airfield"
 MAY_wd_capital_runway_decision_desc:0 "Extends the runway of the small field near the capital so heavier transports can land. A one-time works programme."
 MAY_wd_island_road_finish_decision:0 "Finish the Island Hill Roads"
 MAY_wd_island_road_finish_decision_desc:0 "Pays island crews for one more summer of blasting and grading on the hill roads. A one-time charge on the capital budget."
 MAY_wd_foreign_charter_agents_decision:0 "Send Charter Agents Abroad"
 MAY_wd_foreign_charter_agents_decision_desc:0 "Posts port authority agents in foreign ports for a season to win charters for Malynean hulls. Repeatable once a year."
 MAY_wd_dry_season_watch_decision:0 "Staff the Fire Towers Early"
 MAY_wd_dry_season_watch_decision_desc:0 "Puts the forest fire towers and crews on full watch before the dry season begins. Repeatable once a year."
