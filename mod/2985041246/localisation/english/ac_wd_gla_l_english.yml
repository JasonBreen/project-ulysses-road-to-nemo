l_english:
 GLA_wd_adm_open_books:0 "The Administration Opens Its Books"
 GLA_wd_adm_open_books_desc:0 "Glaceland enters 1991 under a National Administration that governs in the name of a democratic party while the vote itself stays suspended. Pollsters find barely one voter in a hundred behind that party; the rest split between non-party administrators and a nationalist movement. Opening the government's own files to the press is the first honest step, and an embarrassing one for every official named in them."
 GLA_wd_adm_three_drafts:0 "Three Drafts of a Constitution"
 GLA_wd_adm_three_drafts_desc:0 "Lawyers in the Capital District are asked to draft three answers to one question: who holds the seals once the provisional mandate lapses. One draft restores the ballot, one keeps a non-party board, and one hands power to the nationalist movement. Drafting costs months of attention, and every faction will claim the draft it prefers as the true voice of the country."
 GLA_wd_adm_three_drafts_tt_1:0 "Opens three constitutional paths; only one can be taken."
 GLA_wd_adm_ballot_path:0 "Restore the Ballot Box"
 GLA_wd_adm_ballot_path_desc:0 "The smallest party in the country holds the biggest title, and its remaining members argue that only a real vote can cure that. Restoring the ballot means a fixed election calendar, an independent count and a campaign the Administration may well lose. The pledge reassures foreign creditors and frightens every official who has never faced a voter."
 GLA_wd_adm_board_path:0 "Administration Without Parties"
 GLA_wd_adm_board_path_desc:0 "Nearly half the country tells pollsters it wants competent management rather than party contests. The non-party camp proposes that the Administration become a permanent board of senior officials, chosen by examination and answerable to published targets. Decisions would be fast and predictable. Nobody could vote the board out, and that is precisely the objection its critics raise."
 GLA_wd_adm_petition_path:0 "The Nationalist Petition"
 GLA_wd_adm_petition_path_desc:0 "The nationalist movement leads every survey and delivers a petition demanding power. It promises discipline in the empty districts, a stronger coast and an end to what it calls government by clerks. Accepting the petition puts a mass movement behind the state. It also hands that movement the state, with very few ways to take it back."
 GLA_wd_adm_council_regime:0 "Seat the Elected Council"
 GLA_wd_adm_council_regime_desc:0 "Elections are held on the published calendar, and a council of ministers drawn from the new chamber takes the seals from the Administration. The council governs collectively and answers to the chamber for every budget. Parties that barely existed in 1991 must now form a government, and the officials who ran the country must learn to take instructions from them."
 GLA_wd_adm_board_regime:0 "Charter the Administrative Board"
 GLA_wd_adm_board_regime_desc:0 "A short charter turns the National Administration into a standing board of examined officials with fixed terms and published targets. Elections remain suspended, and party activity continues as debate rather than as a route to office. The board can plan a decade ahead. It also owns every failure, because there is nobody else left to blame."
 GLA_wd_adm_directorate_regime:0 "The Directorate Takes the Seals"
 GLA_wd_adm_directorate_regime_desc:0 "The movement's leadership council receives the seals and forms a directorate that rules by decree until it chooses otherwise. Rival parties are suspended and district officials swear loyalty to the national programme. The directorate promises order quickly and delivers it in the towns. Foreign partners grow cautious, and dissent moves out of the newspapers into private rooms."
 GLA_wd_adm_council_court:0 "A Court Above the Council"
 GLA_wd_adm_council_court_desc:0 "The new chamber creates a constitutional court able to strike down any ministerial order that exceeds the law. Ministers complain that they have barely taken office before being checked, and some judgments land at awkward moments. In return the losing parties accept each election result, which is worth more to a young chamber than any single policy it could pass."
 GLA_wd_adm_board_exams:0 "Examinations for Every Post"
 GLA_wd_adm_board_exams_desc:0 "Every post in the board's service, from district clerk to deputy director, is filled by open written examination instead of patronage. Old appointees sit the same papers as school leavers. Many fail and leave bitter. The service that remains is smaller, younger and better at arithmetic, and the board can point to the results whenever anyone accuses it of favouritism."
 GLA_wd_adm_directorate_programme:0 "The Programme Read Aloud"
 GLA_wd_adm_directorate_programme_desc:0 "The directorate publishes its national programme and orders it read aloud in schools, barracks and district offices every week. Workplaces form programme committees that report on morale and output. Public life becomes uniform and loud. Output in the core plants rises for a season, while the quieter half of the country learns to keep its views to itself."
 GLA_wd_adm_returns_library:0 "Returns in Every Library"
 GLA_wd_adm_returns_library_desc:0 "The published district returns are bound into volumes and placed in every public library from District A to District J. Teachers use them in civics lessons and local papers mine them for stories. Officials dislike being quoted back to themselves. Citizens who can read what their own district said are slower to believe rumours about what the capital ignored."
 GLA_wd_dis_survey:0 "Survey the Roadless Districts"
 GLA_wd_dis_survey_desc:0 "Half of Glaceland's ten districts have no paved road network and not a single factory: C across the water, the small inland District D, the frontier districts F and J, and forested District H. Every plant in the country sits in the capital or in Districts B, G and I. A survey team drives, walks and sails through the empty half to price what joining it would take."
 GLA_wd_dis_road_f:0 "A Road Through District F"
 GLA_wd_dis_road_f_desc:0 "District F is the frontier district facing both Sfaenland and Luremia, yet its plains and dry hills are crossed only by farm tracks. A graded trunk road from the capital to the border posts would serve the market towns and any column that must reach the frontier in a hurry. Paving it swallows a full year of the interior's construction budget."
 GLA_wd_dis_road_d:0 "Hill Tracks of District D"
 GLA_wd_dis_road_d_desc:0 "District D is the smallest district, a few valleys of hills and dry ground wedged between the capital and Districts G, H and I. Its tracks already carry traffic between those four places, badly. Grading them into a real road network costs little and shortens half the country's inland journeys. Its villages ask why it took a survey to notice them."
 GLA_wd_dis_road_h:0 "Logging Roads into District H"
 GLA_wd_dis_road_h_desc:0 "District H is forest, hill and mountain along the coast, with an outlying naval post on a separate islet. Loggers and the navy both want a road, for different reasons. A road along the valley floors would open timber to the plants of District I and give the coast service a way in. Objections from the forest villages are heard and mostly overruled."
 GLA_wd_dis_road_j:0 "Mountain Passes in District J"
 GLA_wd_dis_road_j_desc:0 "District J borders both Luremia and Kaluga through forest and mountain country, and no road crosses it that a truck driver would trust in winter. Engineers propose bridges, cut passes and avalanche sheds along a single route. It is slow, costly work that the frontier guard has requested for years, and it will be finished long after the ministers who approve it."
 GLA_wd_dis_councils:0 "District Councils Stand for Election"
 GLA_wd_dis_councils_desc:0 "Under the elected council, each of the ten districts elects its own council with a budget for roads, schools and clinics. The empty districts finally have a voice that the capital must answer. Councils quarrel with ministries and with each other, and some spend their first budgets on town halls. Still, the people of District J now know exactly whom to blame."
 GLA_wd_dis_prefects:0 "Prefects for the Empty Districts"
 GLA_wd_dis_prefects_desc:0 "The board sends examined prefects to Districts C, D, F, H and J with authority over every ministry's local office. Each prefect reports monthly against published targets for roads, schooling and clinics. Local notables resent officials who were not born in the district. The prefects answer that they were chosen for competence, and the monthly figures mostly back them."
 GLA_wd_dis_brigades:0 "Labour Brigades on the Roads"
 GLA_wd_dis_brigades_desc:0 "The directorate sends brigades of young movement volunteers to build roads in the empty districts, housed in camps and paid in rations and pocket money. The roads appear quickly and some will need rebuilding within a decade. The brigades bring the movement's songs and banners into every valley, which is as much the purpose as the gravel. Local farmers watch them warily."
 GLA_wd_dis_spread:0 "A Plant in Every District"
 GLA_wd_dis_spread_desc:0 "One school of planners insists that every district deserves at least one modern plant, built with public credit and protected for a decade. Plants in the empty districts would employ people where they live and spread industry beyond the reach of a single strike. They would also be smaller, slower and dearer to supply than another hall in the core."
 GLA_wd_dis_core:0 "Grow the Core Corridor"
 GLA_wd_dis_core_desc:0 "The opposing school wants every spare credit to flow into the corridor between the capital and Districts B, G and I, where roads, power and workers already exist. Output per worker would rise fastest there. The empty districts would get roads and schools but not factories, and their young people would keep moving to the core in search of work."
 GLA_wd_dis_plant_f:0 "Grain Mills of District F"
 GLA_wd_dis_plant_f_desc:0 "The first protected plant opens on District F's plains, milling grain and building farm machinery for the frontier towns. It sits close enough to the Sfaenland border that ministers argue about the wisdom of it. Its workers argue only about wages. Within a year the district has a payroll it never had before and a reason to keep its young."
 GLA_wd_dis_plant_j:0 "Timber Works in District J"
 GLA_wd_dis_plant_j_desc:0 "District J's forests feed a new timber and joinery works in the valley nearest the coast, served by the new mountain road. It makes prefabricated housing panels for the whole country. The works run below capacity in their first winters because snow closes the road, which proves the engineers right about avalanche sheds and the accountants right about cost."
 GLA_wd_dis_plant_dh:0 "Workshops for Districts D and H"
 GLA_wd_dis_plant_dh_desc:0 "Two smaller workshops follow, one in District D's hill valleys and one in District H's coastal forest. Each repairs trucks, boats and machinery for its own district rather than producing for the national market. They are modest. They also mean that a broken pump in District H no longer waits three weeks for a part sent out from the capital."
 GLA_wd_dis_core_shifts:0 "Round-the-Clock Core Plants"
 GLA_wd_dis_core_shifts_desc:0 "With credit concentrated in the corridor, the core plants of the capital and Districts B, G and I add second and third shifts instead of new halls. Housing for incoming workers goes up quickly and badly. Output climbs, and so do rents. The empty districts send their young along the new roads, and their councils send angry letters along the same roads."
 GLA_wd_tre_gap:0 "Fifteen in Every Hundred"
 GLA_wd_tre_gap_desc:0 "Treasury auditors estimate that Glaceland collects about eighty-five of every hundred it is owed in tax, and that public debt already stands near a third of national output. Growth is steady and inflation low, so the gap is a slow leak rather than a flood. Closing it means auditing firms, districts and ministries at once, and all three will complain."
 GLA_wd_tre_oil_fields:0 "Three Oil Districts"
 GLA_wd_tre_oil_fields_desc:0 "Every barrel Glaceland pumps comes from three places: the Capital District and Districts B and I. The wells are shallow and old, and the country's one fuel depot sits in the capital. A field survey prices new pumps, gathering lines and storage, and asks the question the rest of the branch must answer: sell the oil abroad or burn it at home?"
 GLA_wd_tre_oil_fields_tt_1:0 "Opens the choice between export and home refining."
 GLA_wd_tre_export:0 "Crude for Foreign Buyers"
 GLA_wd_tre_export_desc:0 "The export school would sell most of the crude abroad under long contracts, using the foreign currency to buy machinery and pay down the debt. Revenue arrives quickly and the treasury's arithmetic improves. The plants at home keep importing refined fuel at world prices, and a fall in those prices would hit both sides of the national ledger at once."
 GLA_wd_tre_refine:0 "Keep the Crude at Home"
 GLA_wd_tre_refine_desc:0 "The refining school would keep the crude in Glaceland, enlarge the capital's fuel depot and build refining and chemical capacity beside the oil districts. The core plants would run on their own fuel. Foreign currency would come more slowly and the debt would wait. In return, an embargo or a price shock abroad would matter far less to the country."
 GLA_wd_tre_mills_b:0 "The Rolling Mills of District B"
 GLA_wd_tre_mills_b_desc:0 "District B is the largest town outside the capital, with steel and aluminium, three civilian plants and two arms works. Its rolling mills run on old machinery. New mill stands and an electric furnace would lift quality enough to supply the District A yards without imports. The work disrupts output for a season and the arms works lose their priority on steel."
 GLA_wd_tre_aluminium:0 "Aluminium for Airframes"
 GLA_wd_tre_aluminium_desc:0 "The capital and Districts B and I hold enough bauxite and power to smelt aluminium for light airframes and vehicle bodies. A smelter contract with the arms works would let the air arm repair its own fighters instead of waiting for foreign parts. The smelters drink electricity, and households in District I notice the evening brownouts long before any new aircraft."
 GLA_wd_tre_order_book:0 "One Book for Six Arms Works"
 GLA_wd_tre_order_book_desc:0 "Glaceland's six arms works, two each in the capital and District B and one each in Districts G and I, buy their materials separately and compete for the same skilled workers. A single order book would schedule them as one producer, with each works specialising. Managers lose autonomy and some lose their posts. The army finally learns what it can actually get."
 GLA_wd_tre_tanker_berth:0 "A Tanker Berth for District A"
 GLA_wd_tre_tanker_berth_desc:0 "Export crude needs a deep tanker berth, and the only yards and large harbour in the country are in District A beside the Sfaenland frontier. Dredging a berth and laying a pipeline from the oil districts is a large contract the yards would gladly take. Sfaenland watches a strategic pipeline being laid along its frontier and asks polite questions."
 GLA_wd_tre_debt:0 "Retire the Debt Early"
 GLA_wd_tre_debt_desc:0 "Export receipts go first to the national debt, which stood near a third of output when the decade began. Every bond retired early lowers the interest bill and lifts the country's credit. Ministers who wanted new hospitals and roads must wait. Bankers in every neighbouring capital notice that Glaceland, for once, pays its bills ahead of schedule."
 GLA_wd_tre_refinery_f:0 "Refinery Halls in District F"
 GLA_wd_tre_refinery_f_desc:0 "Refinery halls rise on the plains of District F, a short pipeline from the capital's wells, where there is flat land and room for tanks. The refinery employs the frontier district and fuels the core plants. Placing it near the Sfaenland border troubles the defence staff; the planners answer that the wells it serves sit in the capital next door."
 GLA_wd_tre_second_depot:0 "A Second Fuel Depot"
 GLA_wd_tre_second_depot_desc:0 "The capital holds Glaceland's only fuel depot, which means a single fire, strike or air raid could empty every tank in the country. A second depot dug into the hills would hold a reserve for the army, the air arm and the coastal escorts. It takes steel and concrete from the core plants and pays nothing until the day it is needed."
 GLA_wd_coa_register:0 "Count the Hulls"
 GLA_wd_coa_register_desc:0 "Glaceland's navy amounts to five escorts and two coastal submarines guarding a coastline far longer than its land frontiers, beside a merchant fleet of about a hundred and eight hulls. Its main base and all four dockyards are in District A, with small posts in District C and on District H's islet. A register of hulls, crews and berths is the first honest picture."
 GLA_wd_coa_slipways:0 "The Four Slipways of District A"
 GLA_wd_coa_slipways_desc:0 "District A's four slipways have built nothing larger than a coaster in years and spend most of their time on repairs. Modern cranes, a covered hall and apprentices trained in welding rather than riveting would let the yards build their own escorts. The yards sit beside the Sfaenland frontier, which makes them both valuable and exposed."
 GLA_wd_coa_escort:0 "Convoy Escort Command"
 GLA_wd_coa_escort_desc:0 "The escort school wants the five escorts organised around the merchant fleet: fixed lanes between the coastal districts and District C, escort groups on rotation and merchant captains trained to sail in company. It protects the trade the country lives on. It leaves long stretches of empty coast watched only by fishermen and whatever the air arm can spare."
 GLA_wd_coa_subs:0 "Two Submarines, Many Inlets"
 GLA_wd_coa_subs_desc:0 "The submarine school argues that two quiet boats along the mountain coasts of Districts H and J would deter a landing more cheaply than escorts could. Doctrine already prefers a fleet that stays in being to one that seeks battle. Submarines cannot escort merchant ships or show a flag in harbour, and the merchant captains say so loudly and often."
 GLA_wd_coa_guard:0 "A Fishery and Customs Guard"
 GLA_wd_coa_guard_desc:0 "A third school says Glaceland's real problems at sea are smuggling, illegal fishing and ships in distress, not foreign fleets. It would turn part of the navy into a guard service with cutters, boarding teams and rescue stations in every coastal district. The guard would be popular and useful every single day. In a real war it would be outclassed."
 GLA_wd_coa_escort_hulls:0 "Escorts from Our Own Slipways"
 GLA_wd_coa_escort_hulls_desc:0 "With a command built around convoys, the District A yards receive a standing order for new escorts on a modest, steady schedule. The yards would rather have one large order and then a gap; the navy wants a hull every year so that crews and builders stay employed. A new slipway on District H's coast spreads the work and the risk."
 GLA_wd_coa_sub_pen:0 "A Submarine Pen in District J"
 GLA_wd_coa_sub_pen_desc:0 "The submarine base goes into District J's coast, where the mountains come down to the sea and the shoreline offers cover. A small yard for submarine maintenance is cut beside it. The work is slow and the district's new road carries most of the material. Observers across the Luremian and Kalugan frontiers take careful note of the construction traffic."
 GLA_wd_coa_rescue:0 "Rescue Stations on Every Coast"
 GLA_wd_coa_rescue_desc:0 "The guard builds rescue and customs stations along every coastal district, each with a cutter, a radio mast and a crew trained for storms. Fishing communities that saw the navy as a distant institution now see sailors pulling their neighbours from the water. Smugglers move their landings elsewhere, which is exactly the point."
 GLA_wd_coa_islet:0 "The Islet Post of District H"
 GLA_wd_coa_islet_desc:0 "District H's naval post stands on a separate islet offshore, with one jetty and a handful of sailors who rotate every month. It is the country's most exposed outpost and its best listening point. A longer jetty, a radio station and a resident crew turn a lonely rotation into a proper post. The crews' families promptly ask for a school."
 GLA_wd_coa_merchant:0 "A Hundred and Eight Hulls"
 GLA_wd_coa_merchant_desc:0 "The merchant fleet carries most of the country's trade and all of its traffic to District C, and many of its ships are older than their captains. A replacement credit lets owners scrap the worst and order new coasters from the District A yards, keeping the fleet and the yards alive together. Owners must accept naval inspection in return."
 GLA_wd_isl_crossing:0 "The Crossing to District C"
 GLA_wd_isl_crossing_desc:0 "District C lies across the water from the rest of Glaceland: twenty-two provinces of plains and hills with a small naval post and not one paved road or factory. Everything its people need arrives by ship, and everything they produce leaves the same way. The crossing is the district's lifeline, and in bad weather its isolation is complete."
 GLA_wd_isl_farm_roads:0 "Farm Roads Across District C"
 GLA_wd_isl_farm_roads_desc:0 "District C's plains grow food the rest of the country imports, but crops spoil waiting for carts on dirt tracks. A network of farm roads from the fields to the harbour turns harvests into cargo. The work is easy by mainland standards, on flat ground over short distances, and the district takes it as the first sign that the capital remembers it."
 GLA_wd_isl_charter:0 "A Charter for District C"
 GLA_wd_isl_charter_desc:0 "Islanders have long run their own affairs out of necessity. A charter would recognise a District C assembly with powers over local roads, schools, fisheries and ferry fares, while defence, currency and foreign affairs stay with the national government. The district gains pride and patience; the capital gains a partner it cannot simply instruct."
 GLA_wd_isl_charter_tt_2:0 "No border, core or sovereignty change; District C remains part of Glaceland."
 GLA_wd_isl_direct:0 "Governed from the Capital"
 GLA_wd_isl_direct_desc:0 "The alternative sends a resident commissioner with full authority over every ministry office in District C, backed by a budget the capital controls. Projects move faster when one official can sign for all of them. Islanders who already feel distant will now feel ruled. Success depends on whether the money arrives faster than the resentment."
 GLA_wd_isl_harbour:0 "The District C Harbour Works"
 GLA_wd_isl_harbour_desc:0 "Whatever command the navy has chosen, it needs a working harbour across the water. The District C post gains a slipway for ferries and fishing boats, so the district can repair its own hulls instead of waiting weeks for a berth in District A. Mainland yard owners object to the competition, and the islanders build it anyway."
 GLA_wd_isl_cannery:0 "Canneries and Mills of District C"
 GLA_wd_isl_cannery_desc:0 "With roads to the harbour, District C can process its own grain and fish instead of shipping them raw. A cannery and a flour mill are built with public credit near the harbour. Prices for the district's farmers rise and mainland importers pay a little more. For the first time, District C sells finished goods rather than raw cargo."
 GLA_wd_isl_assembly:0 "The First District C Assembly"
 GLA_wd_isl_assembly_desc:0 "The chartered assembly meets for the first time in the harbour town, and its first act is to set ferry fares lower than the ministry wanted. Its second is to ask for a share of fishing licence revenue. Ministers grumble. Turnout in District C is the highest in the country, and its loyalty to the national government rises with it."
 GLA_wd_isl_building_season:0 "The Commissioner Builds"
 GLA_wd_isl_building_season_desc:0 "The commissioner uses full authority to run one building season: roads, a clinic, a radio mast and quarters for the naval post, all tendered at once to mainland contractors. The work finishes ahead of schedule. Islanders note that few of the jobs went to islanders, and the commissioner's office becomes the most guarded building in the district."
 GLA_wd_isl_airstrip:0 "An Airstrip for District C"
 GLA_wd_isl_airstrip_desc:0 "Ships take a day; aircraft take an hour. A paved airstrip on District C's plains lets mail, doctors and the air arm reach the district in seasons when the ferries cannot sail. The strip doubles as a dispersal field for fighters, which pleases the air staff more than the islanders. It is cheap to build on flat ground and costly to keep staffed."
 GLA_wd_arm_staff_map:0 "Eight Formations, Ten Districts"
 GLA_wd_arm_staff_map_desc:0 "The army has eight infantry formations to cover ten districts, three land neighbours and a district across the water. Most of the country is forest, hill or mountain, where a formation moves at a walking pace. Mapping which formation could reach which border, and how fast, shows the gaps nobody wanted written down. The map becomes the army's argument for everything that follows."
 GLA_wd_arm_mountaineers:0 "The Mountaineer School"
 GLA_wd_arm_mountaineers_desc:0 "Some infantry already trains as mountaineers, but each formation does it its own way. A national mountaineer school in the mountains of District J standardises climbing, cold-weather survival and movement through forest, and its graduates return to their formations as instructors. The school competes with the frontier guard for the same hardy recruits, and the guard usually loses."
 GLA_wd_arm_district:0 "A Battalion for Every District"
 GLA_wd_arm_district_desc:0 "The territorial school wants each district to raise and keep its own battalion of local reservists who know every valley and track. Defence would be everywhere at once and an invasion expensive in every province. Battalions would train only a few weeks a year, and a district battalion is better at holding its own hills than at going anywhere else."
 GLA_wd_arm_corps:0 "A Single Mountain Corps"
 GLA_wd_arm_corps_desc:0 "The professional school wants the eight formations rebuilt around one mobile mountain corps of long-service soldiers, able to move by rail and truck to whichever frontier is threatened. It would be a fine force for its size. It would also leave large parts of the country without troops until the corps arrived, and arrival depends on roads."
 GLA_wd_arm_depots:0 "Depots at the Logistics Centres"
 GLA_wd_arm_depots_desc:0 "The logistics centres in Districts B, G and I and the capital hold the army's supplies, laid out for peacetime convenience. Restocking them for war, with a forward store toward each land frontier, locks up equipment that could be issued. The army has nearly two thousand sets of infantry equipment and about a thousand vehicles to place."
 GLA_wd_arm_muster:0 "District Muster Weekends"
 GLA_wd_arm_muster_desc:0 "Every district battalion musters for one weekend a month and two weeks each summer, in its own valleys. Employers must release reservists and are paid compensation from the defence budget. The weekends become social occasions as much as drills. In time each district knows its own ground, officers and shelters, which is the whole point of the territorial school."
 GLA_wd_arm_troop_trains:0 "Troop Trains for the Corps"
 GLA_wd_arm_troop_trains_desc:0 "A mobile corps is only as fast as its trains. The army buys priority on the national rail network, builds loading ramps at the logistics centres and keeps trains ready to move at a day's notice. Freight customers lose some slots. The corps can now reach any land frontier within hours, provided the rails and bridges are intact."
 GLA_wd_arm_volunteers:0 "Volunteer Companies of the Movement"
 GLA_wd_arm_volunteers_desc:0 "The directorate forms volunteer companies from movement members and attaches them to the regular formations for border watch and internal security. They are eager, poorly trained and loyal to the movement first. Officers resent them and are told to train them anyway. They add numbers to the frontier and a second chain of command to every barracks."
 GLA_wd_arm_frontier_posts:0 "Watch Posts on the Land Borders"
 GLA_wd_arm_frontier_posts_desc:0 "Whichever school prevailed, the borders with Sfaenland, Luremia and Kaluga need permanent posts linked by telephone and radio to the nearest formation. The posts are small and visible, meant to watch rather than fight. Neighbours are told in advance to avoid misunderstanding. A frontier that can be seen being watched is rarely tested."
 GLA_wd_arm_firepower:0 "Guns Before Numbers"
 GLA_wd_arm_firepower_desc:0 "Army doctrine already favours firepower over numbers, because Glaceland will never have the numbers. Batteries trained to fire in forest and mountain country, with observers on the ridgelines, would let a small force hold a valley against a larger one. The guns are expensive and must be hauled up roads that in many districts do not yet exist."
 GLA_wd_air_count:0 "Seventy-Two Fighters, Two Fields"
 GLA_wd_air_count_desc:0 "Glaceland's air arm flies seventy-two fighters and a dozen ground-attack aircraft from exactly two airfields, one beside the capital and one in District B. Every aircraft in the country could be caught on the ground by a single bad morning. The air staff writes this down plainly for the first time and asks the government which risk it prefers."
 GLA_wd_air_disperse:0 "Scatter the Squadrons"
 GLA_wd_air_disperse_desc:0 "The dispersal school would build simple strips in the forests and hills of Districts H and J, each able to hold a squadron under camouflage. No single strike could destroy the air arm. Ground crews would be spread thin, maintenance would suffer, and pilots would spend more hours on the road between strips than in the air."
 GLA_wd_air_harden:0 "Harden the Two Fields"
 GLA_wd_air_harden_desc:0 "The hardening school would keep the air arm at its two fields but bury it: concrete shelters for every aircraft, buried fuel lines and runways that can be patched within hours. Maintenance stays efficient and crews stay together. Everything still depends on two places that any enemy can find on a map."
 GLA_wd_air_radar:0 "A Coastal Radar Chain"
 GLA_wd_air_radar_desc:0 "Radar coverage ends a short distance beyond the two airfields. Stations along the coast of District A and on the capital's approaches would give fighters warning in time to take off. Radar posts are cheap next to fighters and useless without them. Technicians must be trained from scratch, because the country has never needed many."
 GLA_wd_air_pilot_hours:0 "Pilot Hours Before Airframes"
 GLA_wd_air_pilot_hours_desc:0 "Seventy-two fighters mean little if pilots fly only a few hours a month. The air staff proposes buying fuel and flying hours before any new aircraft, with a pilot school at the District B field. Fuel comes from the country's own wells, which makes the plan cheaper here than in most places. Airframes wear out faster and the parts bill grows."
 GLA_wd_air_ground_attack:0 "A Dozen Ground-Attack Aircraft"
 GLA_wd_air_ground_attack_desc:0 "The twelve ground-attack aircraft are the army's only air support, and they have rarely trained with the army at all. Joint exercises in the forests and hills, with forward observers from the infantry, teach both services to work together. Each exercise costs fuel and now and then an aircraft. The army finally learns what the air arm can do for it."
 GLA_wd_air_watch_service:0 "Observers in Every District"
 GLA_wd_air_watch_service_desc:0 "Civilian volunteers in every district report aircraft by telephone to a plotting room in the capital, filling the gaps between radar stations. Farmers, foresters and fishermen learn silhouettes from printed cards. The service costs almost nothing and makes the whole country part of its own air defence, though it also produces a steady stream of false alarms about seagulls."
 GLA_wd_air_overhaul:0 "Repair Shops at the Arms Works"
 GLA_wd_air_overhaul_desc:0 "Glaceland's fighters go abroad for major overhauls, which takes months and foreign currency. Repair shops attached to the arms works of the capital and District B would keep most aircraft at home. The shops take floor space from the arms lines and need engineers the country does not yet have. Each aircraft repaired at home is one more available."
 GLA_wd_uly_bulletin:0 "The Astronomers Bulletin"
 GLA_wd_uly_bulletin_desc:0 "Since the international astronomers' announcement of December 1994, Glaceland's newspapers print the asteroid Ulysses beside the weather. Nobody can say whether fragments will fall, or where. The government forms a committee of astronomers, engineers and district officials to follow the reports and advise what a small coastal country could do. Its first advice is to stop the rumours."
 GLA_wd_uly_tracking:0 "A Share in the Tracking Data"
 GLA_wd_uly_tracking_desc:0 "Glaceland has no large telescope, but its universities can process the tracking data the major observatories publish. A small computing group in the capital trains students to calculate fragment paths themselves, so the government need not rely on foreign summaries. The group is cheap, the training lasts, and its first forecasts are no more certain than anyone else's."
 GLA_wd_uly_announced:0 "The Committee Goes Public"
 GLA_wd_uly_announced_desc:0 "In April 1996 the world is told that Ulysses will strike the Earth and that nations must prepare. The committee's quiet monitoring becomes a national programme overnight. Ministers face a choice between storing what the country will need and moving people away from what they fear. Either answer costs as much as the defence budget, and the treasury says so."
 GLA_wd_uly_stores:0 "A Year of Fuel and Grain"
 GLA_wd_uly_stores_desc:0 "The storage school would fill depots, granaries and cisterns with a year of fuel, grain and medicine, spread across the districts so that no single fall could destroy the reserve. The country's own oil makes the fuel cheap. Grain must be bought abroad at prices that rise every month the asteroid stays in the news."
 GLA_wd_uly_refuges:0 "Refuges in the Interior"
 GLA_wd_uly_refuges_desc:0 "The evacuation school notes that most districts and most plants lie on the coast, while Districts D and F and the capital lie inland. It would prepare refuges, water and camp roads in the interior and evacuation timetables for every coastal town. Moving people costs less than storing a year of food. It works only if the warning comes in time."
 GLA_wd_uly_district_depots:0 "Ten District Depots"
 GLA_wd_uly_district_depots_desc:0 "The reserve is divided among ten district depots, each holding its share under the eye of local officials. Inventories are published so that hoarding by officials can be spotted. Keeping grain fresh means rotating it through the shops every year, which turns the reserve into a modest subsidy on bread that nobody in the districts minds."
 GLA_wd_uly_timetables:0 "Timetables for the Coastal Towns"
 GLA_wd_uly_timetables_desc:0 "Every coastal town receives a timetable assigning its people to trains, buses and roads toward a named inland refuge. The first full drill in District G jams every road into the capital and planners rewrite the timetables. The second drill runs faster. People begin to believe the plan might work, and the interior districts begin to resent the traffic."
 GLA_wd_uly_roche:0 "The Night of the Roche Limit"
 GLA_wd_uly_roche_desc:0 "In July 1999 Ulysses passes through the Earth's Roche limit and begins to break apart. Whatever Glaceland prepared is now tested by the only judge that matters. The committee sits through the night in the capital, district officials stand by their telephones, and every radio in the country is tuned to the same bulletin."
 GLA_wd_uly_count:0 "Counting What Fell"
 GLA_wd_uly_count_desc:0 "Once the fragment showers end, the committee counts the cost: what fell near Glaceland, what fell elsewhere and what the preparations actually achieved. Reserves are released, refuges stood down and depots put to other uses. Some ministers want to keep the emergency apparatus permanently; others want its budget back for roads."
 GLA_wd_fro_desks:0 "A Desk for Each Neighbour"
 GLA_wd_fro_desks_desc:0 "Glaceland shares land borders with three countries: Sfaenland along District A and District F, Luremia along District F and District J, and Kaluga on a short stretch of District J's mountains. Each relationship has been handled by whichever ministry happened to have a problem. A foreign ministry desk for each neighbour, with its own staff and files, ends the improvisation."
 GLA_wd_fro_sfaenland_road:0 "The Sfaenland Trade Road"
 GLA_wd_fro_sfaenland_road_desc:0 "Sfaenland is the longest land frontier and the nearest market. A paved crossing from District A's yards and a second through District F would carry steel, fuel and machinery one way and food the other. Customs officers must be hired and trained on both sides. The road also makes the frontier easier to cross for everyone else."
 GLA_wd_fro_luremia:0 "Valley Agreements with Luremia"
 GLA_wd_fro_luremia_desc:0 "Herders and foresters in Districts F and J cross into Luremia every season along valley paths their families have used for generations. A short agreement on grazing, timber and water gives both sides a procedure for disputes instead of shouting matches at the posts. No line on any map changes. The agreement is dull, and dull agreements last."
 GLA_wd_fro_luremia_tt_1:0 "No border or claim changes; the agreement covers grazing, timber and water."
 GLA_wd_fro_kaluga:0 "A Telephone Line to Kaluga"
 GLA_wd_fro_kaluga_desc:0 "The Kaluga frontier is short, mountainous and nearly forgotten, which is exactly why an incident there could grow before either capital noticed. A direct line between the frontier posts, a maintained track to reach them and a yearly meeting of their commanders cost almost nothing. The line rings mostly about lost hikers, the best possible result."
 GLA_wd_fro_open:0 "Open Trade on Every Frontier"
 GLA_wd_fro_open_desc:0 "One faction in the foreign ministry wants the land frontiers fully open: low tariffs, fast customs and long-term contracts with all three neighbours. The empty frontier districts would become trade corridors. Producers in the core plants would face competition they have never known, and a neighbour's crisis would reach Glacelandic markets the next morning."
 GLA_wd_fro_guarded:0 "Trade on Guarded Terms"
 GLA_wd_fro_guarded_desc:0 "The other faction prefers trade under licence: quotas, inspections and contracts approved one at a time, with the frontier districts kept as buffers rather than corridors. Domestic plants stay protected and the government keeps a hand on every crossing. Neighbours find Glaceland a correct but difficult partner, and smugglers find the licences a business opportunity."
 GLA_wd_fro_market_towns:0 "Markets in the Frontier Towns"
 GLA_wd_fro_market_towns_desc:0 "With tariffs low, the market towns of Districts F and J fill with traders from all three neighbours on market days. Warehouses and inns open where there were only farms. The frontier towns grow faster than the capital for the first time. The core plants lose some sales to imports and win others in markets they had never reached."
 GLA_wd_fro_bonded:0 "Bonded Warehouses at the Crossings"
 GLA_wd_fro_bonded_desc:0 "Every licensed crossing gets a bonded warehouse where goods wait under customs seal until their papers clear. Revenue at the frontier rises sharply and traders complain about delays measured in days. The treasury, still chasing the fifteen in every hundred it fails to collect, is delighted, and the frontier guard knows exactly what is crossing."
 GLA_wd_cen_ledger:0 "The Ten-Year Ledger"
 GLA_wd_cen_ledger_desc:0 "A decade after the Administration opened its books, an independent commission compares the Glaceland of 2001 with the Glaceland of 1991: roads in the empty districts, plants outside the core, the navy and the air arm, the preparations made against Ulysses. Its members are drawn by lot from the district rolls, and its report spares nobody."
 GLA_wd_cen_answer:0 "Answer the Ledger in Public"
 GLA_wd_cen_answer_desc:0 "The commission's sharpest chapter concerns government itself. Whichever order took the seals in the nineties has now governed long enough to be judged on its record rather than its promises. The government answers the chapter in public, line by line. Every critic in the country writes a reply, and the government is stronger for having invited them."
 GLA_wd_cen_institutes:0 "Applied Institutes in the Capital"
 GLA_wd_cen_institutes_desc:0 "Glaceland's three research programmes have always been spread thin across ministries. Two applied institutes, one for engineering and one for electronics and radio, would concentrate them in the capital with university partners. They need staff who mostly left for posts abroad. Bringing them home costs salaries well above the civil service scale, which the unions resent."
 GLA_wd_cen_radio_relay:0 "Radio Relays to Every District"
 GLA_wd_cen_radio_relay_desc:0 "District offices still rely on telephone lines strung along roads that did not exist ten years ago. A national radio relay network, with masts on the mountains of District J and the ridges of District H, links every district office, depot and post without wires. Weather and terrain make the work slow. Once finished, a storm no longer cuts District C off from the news."
 GLA_wd_cen_export_fund:0 "What the Crude Bought"
 GLA_wd_cen_export_fund_desc:0 "A decade of crude sold abroad has paid down debt and bought machinery, but it has also tied the budget to world prices. The commission recommends a stabilisation fund that saves export revenue in good years and spends it in bad ones. Ministers lose the freedom to spend windfalls. The country gains a cushion against the next price collapse."
 GLA_wd_cen_chemicals:0 "What the Refineries Built"
 GLA_wd_cen_chemicals_desc:0 "A decade of refining at home has made Glaceland self-sufficient in fuel for its plants, army and navy, but the refineries need modernising and their chemicals business is small. The commission recommends plastics and fertiliser lines to use the by-products. The work is technical and unglamorous, and it keeps the oil districts employed for another generation."
 GLA_wd_cen_usean_war:0 "Freight Rates and the Usean War"
 GLA_wd_cen_usean_war_desc:0 "When the ISAF coalition is formed to oppose Erusea, the war is not Glaceland's, but freight rates, insurance premiums and fuel prices move within days. Merchant owners ask whether to keep sailing distant routes. The government sets up a freight watch to advise shippers and track prices, and the foreign ministry repeats at every briefing that Glaceland takes no side."
 ac_wd_gla_tree:0 "Glaceland: National Programme"
 ac_wd_gla_tree_desc:0 "The national focus programme of Glaceland, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 GLA_wd_provisional_mandate:0 "The Provisional Mandate"
 GLA_wd_provisional_mandate_desc:0 "The National Administration governs under a democratic name while the ballot stays suspended."
 GLA_wd_ballot_pledge:0 "The Ballot Pledge"
 GLA_wd_ballot_pledge_desc:0 "A dated, public promise that the vote will return."
 GLA_wd_board_mandate:0 "Government Without Parties"
 GLA_wd_board_mandate_desc:0 "Examined officials run the state against published targets."
 GLA_wd_petition_mandate:0 "The Petition Mandate"
 GLA_wd_petition_mandate_desc:0 "The nationalist movement has been promised the seals."
 GLA_wd_open_chamber:0 "An Answerable Chamber"
 GLA_wd_open_chamber_desc:0 "Ministers answer to the chamber and a court checks them both."
 GLA_wd_merit_service:0 "The Examined Service"
 GLA_wd_merit_service_desc:0 "Every post filled by open written examination."
 GLA_wd_directorate_order:0 "Order of the Directorate"
 GLA_wd_directorate_order_desc:0 "The national programme is read aloud in every workplace."
 GLA_wd_civic_returns:0 "Returns on the Shelf"
 GLA_wd_civic_returns_desc:0 "What every district said is in every public library."
 GLA_wd_district_survey:0 "The District Survey"
 GLA_wd_district_survey_desc:0 "Every road, track and jetty in the empty districts is costed."
 GLA_wd_district_quotas:0 "A Plant in Every District"
 GLA_wd_district_quotas_desc:0 "Protected credit for one modern plant per district."
 GLA_wd_core_corridor:0 "The Core Corridor"
 GLA_wd_core_corridor_desc:0 "Credit flows to the capital and Districts B, G and I."
 GLA_wd_night_shifts:0 "Second and Third Shifts"
 GLA_wd_night_shifts_desc:0 "The core plants run around the clock."
 GLA_wd_collection_drive:0 "The Collection Drive"
 GLA_wd_collection_drive_desc:0 "Auditors chase the fifteen in every hundred the treasury misses."
 GLA_wd_fuel_export:0 "Crude for Export"
 GLA_wd_fuel_export_desc:0 "Most crude is sold abroad under long contracts."
 GLA_wd_home_refining:0 "Refined at Home"
 GLA_wd_home_refining_desc:0 "Crude stays in the country and fuels the core plants."
 GLA_wd_mill_retooling:0 "Retooling the Mills"
 GLA_wd_mill_retooling_desc:0 "District B mills are down for new stands and furnaces."
 GLA_wd_light_metal:0 "Light Metal Contracts"
 GLA_wd_light_metal_desc:0 "Smelted aluminium goes first to airframe and vehicle work."
 GLA_wd_arms_order_book:0 "One Order Book"
 GLA_wd_arms_order_book_desc:0 "Six arms works scheduled as one producer."
 GLA_wd_strategic_stock:0 "The Strategic Stock"
 GLA_wd_strategic_stock_desc:0 "A second fuel reserve dug into the hills."
 GLA_wd_export_fund:0 "The Stabilisation Fund"
 GLA_wd_export_fund_desc:0 "Export revenue saved in good years and spent in bad ones."
 GLA_wd_chemical_lines:0 "Chemical Lines"
 GLA_wd_chemical_lines_desc:0 "Refinery by-products become plastics and fertiliser."
 GLA_wd_fuel_drawdown:0 "Drawing the Reserve"
 GLA_wd_fuel_drawdown_desc:0 "Fuel released from the strategic stock for a season."
 GLA_wd_coast_register:0 "The Coast Register"
 GLA_wd_coast_register_desc:0 "Every hull, crew and berth on one register."
 GLA_wd_escort_command:0 "Convoy Escort Command"
 GLA_wd_escort_command_desc:0 "Escort groups organised around the merchant lanes."
 GLA_wd_sub_patrol:0 "Coastal Submarine Patrol"
 GLA_wd_sub_patrol_desc:0 "Quiet boats on the mountain coasts."
 GLA_wd_coast_guard:0 "Fishery and Customs Guard"
 GLA_wd_coast_guard_desc:0 "Cutters, boarding teams and rescue crews on every coast."
 GLA_wd_fleet_renewal:0 "Fleet Renewal Credit"
 GLA_wd_fleet_renewal_desc:0 "Old coasters scrapped and replaced from the District A yards."
 GLA_wd_c_charter:0 "The District C Charter"
 GLA_wd_c_charter_desc:0 "District C runs its own local affairs within Glaceland."
 GLA_wd_c_commissioner:0 "The Resident Commissioner"
 GLA_wd_c_commissioner_desc:0 "One official signs for every ministry in District C."
 GLA_wd_ferry_subsidy:0 "Ferry Fare Subsidy"
 GLA_wd_ferry_subsidy_desc:0 "The treasury pays part of every District C ferry ticket."
 GLA_wd_district_battalions:0 "District Battalions"
 GLA_wd_district_battalions_desc:0 "Each district raises a battalion of local reservists."
 GLA_wd_mountain_corps:0 "The Mountain Corps"
 GLA_wd_mountain_corps_desc:0 "One mobile corps of long-service mountain infantry."
 GLA_wd_forward_stores:0 "Forward Stores"
 GLA_wd_forward_stores_desc:0 "War stocks held toward each land frontier."
 GLA_wd_muster_season:0 "Muster Weekends"
 GLA_wd_muster_season_desc:0 "District battalions train in their own valleys every month."
 GLA_wd_volunteer_companies:0 "Volunteer Companies"
 GLA_wd_volunteer_companies_desc:0 "Movement volunteers attached to the regular formations."
 GLA_wd_two_fields:0 "Two Fields, One Air Arm"
 GLA_wd_two_fields_desc:0 "Every aircraft in the country flies from two airfields."
 GLA_wd_dispersed_wings:0 "Dispersed Wings"
 GLA_wd_dispersed_wings_desc:0 "Squadrons scattered to forest strips in the mountain districts."
 GLA_wd_hardened_fields:0 "Hardened Fields"
 GLA_wd_hardened_fields_desc:0 "Concrete shelters and buried fuel at the two fields."
 GLA_wd_air_watch:0 "The Air Watch Service"
 GLA_wd_air_watch_desc:0 "Civilian observers report aircraft from every district."
 GLA_wd_joint_exercises:0 "Joint Exercises"
 GLA_wd_joint_exercises_desc:0 "Ground-attack crews and infantry observers train together."
 GLA_wd_home_overhaul:0 "Overhaul at Home"
 GLA_wd_home_overhaul_desc:0 "Major aircraft overhauls done in the arms works."
 GLA_wd_sky_watch:0 "The Sky Watch Committee"
 GLA_wd_sky_watch_desc:0 "Astronomers, engineers and district officials watch Ulysses."
 GLA_wd_reserve_stores:0 "A Year in Store"
 GLA_wd_reserve_stores_desc:0 "A year of fuel, grain and medicine spread across ten depots."
 GLA_wd_inland_refuges:0 "Inland Refuges"
 GLA_wd_inland_refuges_desc:0 "Camps, water and roads ready in the interior districts."
 GLA_wd_border_desks:0 "Border Desks"
 GLA_wd_border_desks_desc:0 "One foreign ministry desk for each land neighbour."
 GLA_wd_open_frontiers:0 "Open Frontiers"
 GLA_wd_open_frontiers_desc:0 "Low tariffs and fast crossings on all three land frontiers."
 GLA_wd_licensed_frontiers:0 "Licensed Frontiers"
 GLA_wd_licensed_frontiers_desc:0 "Trade under quota, inspection and licence."
 GLA_wd_applied_institutes:0 "The Applied Institutes"
 GLA_wd_applied_institutes_desc:0 "Engineering and electronics institutes in the capital."
 GLA_wd_renewed_mandate:0 "The Answered Ledger"
 GLA_wd_renewed_mandate_desc:0 "The government has answered the decade ledger in public."
 ac_wd_gla.1.t:0 "The Suspended Ballot"
 ac_wd_gla.1.d:0 "The National Administration that governs Glaceland in 1991 carries a democratic name and a suspended election calendar. Its officials run ten districts, eighteen plants, a small navy and a smaller air arm, and they do it competently enough that few people ask who appointed them. When the question is finally asked aloud, in the capital's press and in district halls from A to J, nobody in the Administration has a ready answer.\n\nThe pollsters' figures make the problem sharper. Barely one citizen in a hundred supports the party whose name the government carries. Close to half want the country run by non-party administrators, as it effectively already is. The other half answers to a nationalist movement that promises discipline, a stronger coast and an end to government by clerks. Democrats and communists together could fill a meeting hall, not a chamber.\n\nThe Administration must decide how the question will be argued before it can decide how it will be answered. District hearings would take a season and invite every grievance in the country into the record. A decision inside the Administration would be faster and quieter, and would confirm everything its critics say about it. Both choices will be remembered when the seals change hands.\n\nMod provenance: history/countries/GLA - Glaceland.txt set_politics and set_popularities; the hearings and every response are provisional gameplay."
 ac_wd_gla.1.a:0 "Hold hearings in every district."
 ac_wd_gla.1.b:0 "Settle it inside the Administration."
 ac_wd_gla.2.t:0 "Returns from the Districts"
 ac_wd_gla.2.d:0 "The hearing clerks return from the ten districts with crates of transcripts. The core districts, the capital and Districts B, G and I, talk about wages, rents and the plants. The empty districts talk about roads they have never had, clinics a day's travel away and young people who leave for the core and do not come back. District C, across the water, talks mostly about the ferries.\n\nOn the constitutional question the returns are as divided as the polls. Officials and managers want a board that keeps things running. Farmers and plant workers split between the nationalist petition and a scattering of voices who want a real vote. Almost every district asks first to be consulted again, and many hearings closed with a vote of thanks to the clerks for coming at all.\n\nThe Administration now holds the returns and must decide what to do with them. Publishing every transcript would show the country to itself, flaws included, and hand the opposition a library of quotations. A summary would be tidier and safer. Officials who sat through the hearings warn privately that a summary will be read as the Administration editing the districts out of their own record.\n\nProvisional gameplay."
 ac_wd_gla.2.a:0 "Publish every return."
 ac_wd_gla.2.b:0 "Publish an approved summary."
 ac_wd_gla.3.t:0 "Half a Country Without Roads"
 ac_wd_gla.3.d:0 "The survey teams come back from Districts C, D, F, H and J with photographs that surprise even the ministers who sent them. Half of Glaceland has no paved road network and no factory of any kind. Villages are joined by farm tracks, forest roads and boats. The frontier districts facing Sfaenland, Luremia and Kaluga could not move a convoy to their own border posts in a wet week.\n\nThe other half of the country is a different place. The capital and Districts B, G and I hold all twelve civilian plants and all six arms works, the logistics centres and nearly all the oil, steel and aluminium. District A holds the four dockyards. The core is busy, crowded and increasingly expensive to live in, and every year it draws the young out of the empty districts.\n\nThe survey's authors refuse to recommend a solution. They price roads, plants, schools and clinics for each empty district and leave the choice to the government: spread industry outward at a higher cost, or concentrate it where it already works and connect the rest by road. The empty districts are watching to see whether the survey becomes a programme or a report on a shelf.\n\nProvisional gameplay."
 ac_wd_gla.3.a:0 "Roads first, everywhere."
 ac_wd_gla_3_a:0 "Roads first, everywhere."
 ac_wd_gla.3.b:0 "Start with the frontier districts."
 ac_wd_gla.4.t:0 "The Collection Gap"
 ac_wd_gla.4.d:0 "The treasury's auditors present a short report with a long appendix. Glaceland collects roughly eighty-five of every hundred owed in tax. Public debt stands near a third of national output. Growth is steady at around three percent and inflation is low, so nothing is on fire. But the gap compounds every year, and the debt grows a little faster than the economy that must carry it.\n\nThe missing fifteen are not hidden in one place. Some is evaded by firms in the core, some is never assessed in the empty districts where the nearest tax office is a day's travel away, and some is simply lost between ministries that keep separate accounts. The oil districts pay royalties under formulas older than most of the wells. Nobody has ever audited all of it at once.\n\nThe auditors want powers to inspect firms, district offices and ministries alike. The ministries object to being audited by the treasury, and the firms object to everything. The government must decide whether to publish the report or keep it for internal use, knowing that publication makes every later tax measure easier to defend and every later scandal harder to bury.\n\nProvisional gameplay."
 ac_wd_gla.4.a:0 "Publish the auditors report."
 ac_wd_gla.4.b:0 "Keep it for the cabinet."
 ac_wd_gla.5.t:0 "A Long Coast and Five Escorts"
 ac_wd_gla.5.d:0 "The naval register is finished, and it fits on two pages. Glaceland has five escorts, two coastal submarines and a merchant fleet of about a hundred and eight hulls, many of them older than their crews. The main naval base and all four dockyards stand in District A, beside the Sfaenland frontier. District C's small post and the jetty on District H's islet complete the list.\n\nAgainst that list stands the coast itself. Seven of the ten districts touch the sea, and the coastline is several times longer than all three land frontiers together. The merchant fleet carries most of the country's trade and every passenger to District C. Fishermen, smugglers and the occasional foreign survey ship use the same waters, and most of the time nobody official sees any of them.\n\nThe admirals agree on the problem and on nothing else. Some want the escorts organised around the convoys, some want submarines hidden along the mountain coasts, and some want a guard service for what actually happens at sea every day. The government is asked first for a simpler decision: whether the navy's weakness is admitted in public or kept as a matter for the defence staff.\n\nProvisional gameplay."
 ac_wd_gla.5.a:0 "Admit it and ask for support."
 ac_wd_gla.5.b:0 "Keep it inside the defence staff."
 ac_wd_gla.5.c:0 "Send the escorts on a coastal tour."
 ac_wd_gla.6.t:0 "Across the Water"
 ac_wd_gla.6.d:0 "District C lies across the water from the rest of Glaceland: twenty-two provinces of plains and low hills, with a small naval post and a harbour town. It has no paved roads and no plants. Its farmers grow food the mainland imports, its fishermen work the surrounding waters, and every ton of anything moves by ship. When storms close the crossing, the district lives on whatever is in its warehouses.\n\nThe islanders' complaints are practical and old. Ferry fares are high and timetables unreliable. Mainland officials arrive for a week and leave before learning the names of the villages. Doctors are scarce, spare parts take weeks, and young people who cross to study in the capital rarely return. Yet the district is loyal in its own stubborn way, and asks mainly to be remembered.\n\nThe government must decide how District C is to be governed within Glaceland. A charter would let the islanders run their own local affairs, at the price of a partner the capital cannot simply instruct. A resident commissioner would get things built faster, at the price of goodwill. Nothing about the district's place in the country is in question; only the manner of its government is.\n\nProvisional gameplay."
 ac_wd_gla.6.a:0 "Cut the ferry fares this season."
 ac_wd_gla.6.b:0 "Send an inspection mission first."
 ac_wd_gla.7.t:0 "Hill Country and Eight Formations"
 ac_wd_gla.7.d:0 "The army's staff map is pinned to a public wall of the defence ministry for the first time. It shows eight infantry formations spread across a country that is mostly forest, hill and mountain, with marsh along some coasts and dry plains around the capital. It shows three land frontiers, one of them longer than the other two combined, and a district across the water that no formation can reach on foot.\n\nThe inventories are honest too: nearly two thousand sets of infantry equipment, about a thousand motor vehicles, a few hundred sets of support equipment and a modest stock of trains. Some of the infantry already trains as mountaineers. Doctrine prefers firepower, because the country will never have numbers. The staff says plainly that it can hold some valleys well and most of the country not at all.\n\nTwo schools are forming inside the officer corps. One wants a battalion in every district, raised from local reservists. The other wants a single professional mountain corps that moves to the threat. Before either wins, the government must decide whether the staff map stays on the public wall or goes back into a safe, knowing that the neighbours' attaches read the newspapers too.\n\nProvisional gameplay."
 ac_wd_gla.7.a:0 "Leave the map on the wall."
 ac_wd_gla.7.b:0 "Return it to the safe."
 ac_wd_gla.8.t:0 "Every Aircraft on Two Fields"
 ac_wd_gla.8.d:0 "The air staff's report opens with a sentence the ministers will remember: every aircraft Glaceland owns stands on one of two airfields. Seventy-two fighters and twelve ground-attack aircraft are divided between the field beside the capital and the field in District B. Both are known to every map-maker in the region. A single well-planned strike on a clear morning could end the air arm before it flew.\n\nThe report is equally blunt about everything else. Radar coverage barely reaches beyond the two fields. Pilots fly too few hours because fuel is rationed by budget rather than by supply, even though the country pumps its own oil. Major overhauls are done abroad and take months. The air arm is proud and capable in small numbers, and it knows exactly how small those numbers are.\n\nThe staff offers two remedies that cannot both be afforded. The country could scatter its squadrons across forest strips in the mountain districts, or bury them in concrete at the two fields it already has. The ministers must first decide something easier: whether the air staff may speak publicly about the risk, or whether the report stays among the people who already lose sleep over it.\n\nProvisional gameplay."
 ac_wd_gla.8.a:0 "Let the air staff brief the press."
 ac_wd_gla.8.b:0 "Keep the report classified."
 ac_wd_gla.9.t:0 "Ulysses Will Strike"
 ac_wd_gla.9.d:0 "In April 1996 the world is told that the asteroid Ulysses will strike the Earth and that nations should prepare. Since the astronomers' announcement of December 1994, Glaceland's committee of astronomers and engineers has watched quietly; now its reports lead every bulletin. Nobody can say where fragments will fall. Glaceland, like every country, must prepare for a danger whose place and scale remain a guess.\n\nThe committee divides into two camps. One wants reserves: a year of fuel, grain and medicine in depots across all ten districts, so that whatever falls, the country can feed and fuel itself. The other wants refuges: most districts and most plants lie on the coast, while Districts D and F and the capital lie inland, and moving people is cheaper than storing a year of food.\n\nPublic mood swings between calm and fright. Shops in the capital run short of bottled water and candles, and coastal families ask relatives inland whether they have a spare room. The treasury warns that either programme costs as much as the defence budget. Before choosing, the government must decide how to speak about a danger it cannot control: plainly and often, or calmly and rarely.\n\nProvisional gameplay: date anchors only, Official Chronicle rows 1994 / 12.10 and 1996 / 04.20 in tools/lore/chronicle.json; the Glacelandic response is gameplay."
 ac_wd_gla.9.a:0 "Speak plainly and often."
 ac_wd_gla_9_a:0 "Speak plainly and often."
 ac_wd_gla.9.b:0 "Speak calmly and rarely."
 ac_wd_gla.10.t:0 "Ulysses Breaks Apart"
 ac_wd_gla.10.d:0 "In July 1999 Ulysses passes through the Earth's Roche limit and begins to break apart. The committee in the capital sits through the night beside its radios and telephones, and district officials stand by in every hall from A to J. Whatever Glaceland prepared over the past three years, reserves or refuges, is now tested against something that does not negotiate.\n\nThe first hours are filled with rumours that travel faster than the official bulletins. Coastal towns report lights in the sky that may be fragments or may be aircraft. Telephone exchanges jam. Some families leave for the interior without waiting for any order, while others refuse to leave at all. The ferries to District C are held in harbour, and the district follows the night by radio like everyone else.\n\nBy dawn the government must decide how to manage the days that follow. It can keep the emergency apparatus fully mobilised until the danger is certainly past, at a heavy cost in lost work, or stand most of it down as soon as the reports allow and accept the risk of being wrong. Either way, the country will remember how its government behaved on this night.\n\nProvisional gameplay: date anchor only, Official Chronicle row 1999 / 07.08, with the break-up from Super Weapons, Stonehenge, in tools/lore/chronicle.json; what falls near Glaceland is not claimed and the response is gameplay."
 ac_wd_gla.10.a:0 "Keep everything mobilised."
 ac_wd_gla.10.b:0 "Stand down as the reports allow."
 ac_wd_gla.11.t:0 "Three Frontiers, Three Desks"
 ac_wd_gla.11.d:0 "The new foreign ministry desks deliver their first joint briefing. Sfaenland shares the longest land frontier with Glaceland, along District A and District F, and is the nearest market for the core plants. Luremia faces District F and the forests of District J. Kaluga touches only a short stretch of District J's mountains. Each relationship has its own history of small disputes and quiet cooperation.\n\nThe briefing is candid about how little the capital knows. Customs posts on the frontiers are understaffed, the roads to them are poor, and most local cooperation, on grazing, timber, water and lost travellers, has been arranged by district officials who never told the ministries. The desks expect every neighbour to watch what Glaceland now does with its own empty frontier districts.\n\nTwo schools are forming in the ministry. One wants open frontiers with low tariffs and fast crossings, turning the empty frontier districts into trade corridors. The other wants trade under licence, keeping those districts as buffers. First, though, the government must decide how to introduce the new desks to the neighbours: with a public conference or with quiet letters.\n\nProvisional gameplay."
 ac_wd_gla.11.a:0 "Host a frontier conference."
 ac_wd_gla.11.b:0 "Send quiet letters."
 ac_wd_gla.12.t:0 "A Commission Drawn by Lot"
 ac_wd_gla.12.d:0 "Ten years after the National Administration opened its books, a commission drawn by lot from the district rolls publishes its ledger of the decade. It counts roads laid in the empty districts and plants opened outside the core, hulls launched in District A, aircraft kept flying, preparations made against Ulysses and money owed abroad. It also counts what was promised and never delivered.\n\nThe ledger pleases nobody completely. The core districts are richer and so are some of the empty ones, but the gap between them has narrowed less than the speeches claimed. The navy and air arm are better organised and still small. The treasury collects more of what it is owed, though not all of it. District C still waits for its ferries in bad weather.\n\nWhoever holds the seals in 2001 must answer the ledger in public. A full answer, chapter by chapter, would admit failures and give critics a decade of material. A short statement of thanks would look confident and evasive at the same time. The commission has already said it will publish any reply in full beside its own findings.\n\nProvisional gameplay."
 ac_wd_gla.12.a:0 "Answer every chapter."
 ac_wd_gla.12.b:0 "Thank the commission briefly."
 ac_wd_gla.13.t:0 "War in Usea"
 ac_wd_gla.13.d:0 "When the ISAF coalition is formed to oppose Erusea, war spreads across Usea. Glaceland is not a party to it and has no wish to become one. Yet within days of the news, shipping insurers raise their premiums, freight rates climb and fuel prices move on every market where Glaceland buys and sells. A war elsewhere arrives in Glacelandic ledgers before it arrives in Glacelandic newspapers.\n\nMerchant owners ask the government what to do. Some of their ships sail routes that touch waters near the war; most do not, but insurers do not distinguish. Exporters worry about contracts and importers about prices. The small navy worries about being asked to protect anything at all. The oil districts, for once, expect higher prices to help rather than hurt.\n\nThe government sets up a freight watch to track rates and advise shippers, and must now decide how far to go. It could advise owners to avoid any route near the war, at a cost to trade, or leave the choice to owners and their insurers and accept the risk of a Glacelandic ship caught in the crossfire. Neutrality, the foreign ministry reminds everyone, is a policy that must be practised daily.\n\nProvisional gameplay: date anchor only, Official Chronicle row 2003 / 08.22 in tools/lore/chronicle.json; fired only after the mod sets ac_ucw_isaf_formed; no Glacelandic part in the war is claimed."
 ac_wd_gla.13.a:0 "Advise owners to avoid the war zone."
 ac_wd_gla.13.b:0 "Leave it to owners and insurers."
 GLA_wd_elected_council_office:0 "Elected Council of Ministers"
 GLA_wd_elected_council_office_desc:0 "A council of ministers drawn from a newly elected chamber, governing collectively and answerable to that chamber for every budget. Provisional gameplay office with no named holder."
 GLA_wd_admin_board_office:0 "Standing Administrative Board"
 GLA_wd_admin_board_office_desc:0 "A standing board of examined senior officials with fixed terms and published targets, governing without parties while the ballot stays suspended. Provisional gameplay office with no named holder."
 GLA_wd_national_directorate_office:0 "National Directorate"
 GLA_wd_national_directorate_office_desc:0 "A directorate formed by the leadership council of the nationalist movement, ruling by decree with rival parties suspended. Provisional gameplay office with no named holder."
 ac_wd_gla_decisions:0 "Glaceland: National Measures"
 ac_wd_gla_decisions_desc:0 "Measures from the national programme of Glaceland. Provisional gameplay unless a source ledger row says otherwise."
 GLA_wd_summer_road_season_decision:0 "A Summer Road Season in District J"
 GLA_wd_summer_road_season_decision_desc:0 "Pay for one extra summer of road crews on the District J mountain route, once the district survey exists."
 GLA_wd_ferry_fares_decision:0 "Subsidise the District C Ferries"
 GLA_wd_ferry_fares_decision_desc:0 "Pay part of every District C ferry ticket for a year; it can be renewed each year."
 GLA_wd_fuel_draw_decision:0 "Draw on the Strategic Stock"
 GLA_wd_fuel_draw_decision_desc:0 "Release fuel from the second depot for a season of exercises; the stock refills before it can be drawn again."
 GLA_wd_coast_exercise_decision:0 "A Combined Coast Exercise"
 GLA_wd_coast_exercise_decision_desc:0 "Run the navy and air arm through a joint exercise along the coastal districts; it can be repeated each year."
 GLA_wd_district_accounts_decision:0 "Publish the District Accounts"
 GLA_wd_district_accounts_decision_desc:0 "Publish what every district received and spent since the survey; a one-time act of transparency."
 GLA_wd_sky_drill_decision:0 "A National Sky-Watch Drill"
 GLA_wd_sky_drill_decision_desc:0 "Rehearse the Ulysses warning procedures in every district; it can be repeated each year."
