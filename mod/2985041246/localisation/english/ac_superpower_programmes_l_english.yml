 ac_snp_ose_public_consultation_desc:0 "Commit twenty political power and two institutional-capacity points to a receiving-office hearing. Restore up to eight support points, at most the ordinary baseline of fifty. This cannot purchase an earned high-support mandate. Both hearings share a thirty-day cooldown."
