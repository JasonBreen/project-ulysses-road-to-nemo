 UGE_up_reserve_programme:0 "Lease a Readiness Reserve Slot"
 UGE_up_reserve_programme_desc:0 "Requires completed national work: Count the Remaining Reserve Space. Fund a bounded 180-day service. Its benefits carry the displayed continuing burden. Completion records useful work once; interruption forfeits the cost. A renewed service requires a new allocation."
 UGE_up_reserve_programme_spirit:0 "Lease a Readiness Reserve Slot"
 UGE_up_reserve_programme_spirit_desc:0 "A funded, temporary national service with a continuing opportunity cost. The underlying physical forces and supplies remain separate."
 UGE_up_adopt_programme:0 "Adopt the National Programme"
 UGE_up_adopt_programme_desc:0 "After the current generic, regional or continuous focus finishes, adopt the persistent national tree while retaining completed content. This grants no starting forces, industry or expired historical preparation."
 ac_up_del_programmes:0 "Delarus: Oversight and Command Obligations"
 ac_up_del_programmes_desc:0 "Civil oversight: [?ac_up_del_oversight|0]/100\nCommand coordination: [?ac_up_del_command|0]/100\nVerified records: [?ac_up_del_records|0]/100\n\nVerified cases: [?ac_up_del_cases|0]/6. Unresolved command obligations: [?ac_up_del_obligations|0]/3. An obligation survives service expiry or displacement until a verified docket closes it. Each unresolved obligation adds a 0.2% consumer-goods factor burden. Three unresolved obligations prevent another command service.\n\nA funded programme costs 25 political power and 2 institutional capacity, reduced to 1 after authorisation reforms, plus the fiscal programme charge when that system is ready. Operational scopes last 90 days and require specific earned capabilities plus the country's finite service resource. These indices do not create physical equipment."
 DEL_up_civil_audit_spirit:0 "Protect Civil Audit Authority"
 DEL_up_civil_audit_spirit_desc:0 "Civil inspectors retain the right to examine command requisitions. The policy supports confidence while consuming political and administrative attention."
 DEL_up_command_delegation_spirit:0 "Delegate Routine Command Authority"
 DEL_up_command_delegation_spirit_desc:0 "Command offices gain discretion to act quickly. Planning improves at a cost to confidence in the civil administration's ability to examine every request."
 DEL_up_published_obligations_spirit:0 "Publish the Obligation Schedule"
 DEL_up_published_obligations_spirit_desc:0 "A public schedule makes costs and refusals visible. It improves the use of ordinary resources while requiring continuing political work to defend the record."
 DEL_up_military_reservations_spirit:0 "Protect Military Reservations"
 DEL_up_military_reservations_spirit_desc:0 "The command chain receives a protected share of available attention. The policy supports war readiness while leaving less capacity for research and civil review."
 DEL_up_inspect_requisitions_spirit:0 "Inspect Emergency Requisitions"
 DEL_up_inspect_requisitions_spirit_desc:0 "Inspection supports organisation by finding incompatible demands. The gain in dependable administration comes at a cost to immediate planning speed."
 DEL_up_emergency_warrants_spirit:0 "Authorise Emergency Warrants"
 DEL_up_emergency_warrants_spirit_desc:0 "A warrant gives the command chain room to act before every docket is complete. The country accepts a continuing public-service burden to support that speed."
 DEL_up_civilian_oversight_spirit:0 "Retain Civilian Oversight"
 DEL_up_civilian_oversight_spirit_desc:0 "A protected civilian review supports confidence after the emergency. It places a continuing political burden on institutions expected to explain difficult decisions."
 DEL_up_joint_inspection_spirit:0 "Adopt Joint Inspection Terms"
 DEL_up_joint_inspection_spirit_desc:0 "Civil and command inspectors will work from a common receiving record. Better organisation retains an ordinary service cost instead of becoming a free postwar bonus."
 DEL_up_inspection_programme:0 "Authorise an Inspection Rota"
 DEL_up_inspection_programme_desc:0 "Requires completed national work: An Office for Administrative Inspection. Fund a bounded 180-day service. Its benefits carry the displayed continuing burden. Completion records useful work once; interruption forfeits the cost. A renewed service requires a new allocation."
 DEL_up_inspection_programme_spirit:0 "Authorise an Inspection Rota"
 DEL_up_inspection_programme_spirit_desc:0 "A funded, temporary national service with a continuing opportunity cost. The underlying physical forces and supplies remain separate."
 DEL_up_command_programme:0 "Accept a Bounded Command Obligation"
