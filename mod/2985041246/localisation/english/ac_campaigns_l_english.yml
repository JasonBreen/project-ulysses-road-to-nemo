 ac_camp.101.t:0 "An empty chair at the table"
 ac_camp.101.desc:0 "The allied table has more chairs than the room was designed to hold. Each chair represents a government that can say no, and a staff officer has already suggested removing the empty ones from the photograph. Shared authority makes command slower and the commitments more credible. Unified direction gives the operations staff clearer answers while concentrating responsibility for mistakes. The coalition needs a command it can use and an agreement its members will honor when the losses cease to be hypothetical. The first reconnaissance operation begins with those obligations rather than with a speech about unity."
 ac_camp.101.a:0 "Circulate a public receiving account."
 ac_camp.101.b:0 "Keep a signed professional return."
 ac_camp.101.z:0 "Close this old message."
