 ac_camp.65.t:0 "The pencil at the receiving table"
 ac_camp.65.desc:0 "The orderly had borrowed the pencil from a child. He had intended to return it when the receiving table obtained its own supplies, but the child kept moving through the queue with her family, and every time he looked up she was a little farther away.\n\nThe homeland evacuation effort was complete in the operational return. The people receiving its consequences were still arriving. Some had papers from an office that no longer answered its telephone. Others had a remembered address and the names of relatives who might have left before them. The officer at the table had learned to write Unknown without making it look like a refusal to ask.\n\nAcross the road, a military vehicle was being redirected toward the actual invasion front. Its passengers watched the queue while their driver argued about priorities. The receiving officer could see both needs and could satisfy neither by pretending the other was less real.\n\nHe entered the completed work alongside its limits. There was no new territorial possession to announce. There was a receiving line that had been funded, staffed and kept operating while the front made the next day's journey uncertain.\n\nNear evening, the child returned for the pencil. The orderly apologized and offered to find another. She told him to keep it until the queue was finished.\n\nHe looked down the road. Then he wrote her family's receiving number on the back of their paper, carefully enough that they would be able to read it after the fold had worn thin."
 ac_camp.65.a:0 "Keep this account."
 ac_camp.65.z:0 "Close this old message."
 ac_camp.3065.t:0 "The pencil at the receiving table — archive"
 ac_camp.3065.desc:0 "The orderly had borrowed the pencil from a child. He had intended to return it when the receiving table obtained its own supplies, but the child kept moving through the queue with her family, and every time he looked up she was a little farther away.\n\nThe homeland evacuation effort was complete in the operational return. The people receiving its consequences were still arriving. Some had papers from an office that no longer answered its telephone. Others had a remembered address and the names of relatives who might have left before them. The officer at the table had learned to write Unknown without making it look like a refusal to ask.\n\nAcross the road, a military vehicle was being redirected toward the actual invasion front. Its passengers watched the queue while their driver argued about priorities. The receiving officer could see both needs and could satisfy neither by pretending the other was less real.\n\nHe entered the completed work alongside its limits. There was no new territorial possession to announce. There was a receiving line that had been funded, staffed and kept operating while the front made the next day's journey uncertain.\n\nNear evening, the child returned for the pencil. The orderly apologized and offered to find another. She told him to keep it until the queue was finished.\n\nHe looked down the road. Then he wrote her family's receiving number on the back of their paper, carefully enough that they would be able to read it after the fold had worn thin."
