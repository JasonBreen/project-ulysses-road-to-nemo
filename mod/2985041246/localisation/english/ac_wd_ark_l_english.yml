l_english:
 ARK_wd_adm_take_stock:0 "The Administration Takes Stock"
 ARK_wd_adm_take_stock_desc:0 "Arklith enters 1991 governed by the National Administration, a standing executive that has run the Duchy since the last vote in 1990 and holds no election on its calendar. Stability is high and enthusiasm is low. Before any reform, the administration publishes what it does and on whose authority, which invites every faction to answer back."
 ARK_wd_adm_electoral_rolls:0 "Dust Off the Electoral Rolls"
 ARK_wd_adm_electoral_rolls_desc:0 "The rolls used in 1990 sit in provincial offices from Marcil to the Halloma Basin, already out of date. Clerks recount voters house by house and post the lists in every town hall. The work costs a season of paperwork and commits nobody to an election, but it removes the excuse that a vote could not be organised at short notice."
 ARK_wd_adm_ducal_title:0 "What the Ducal Title Means"
 ARK_wd_adm_ducal_title_desc:0 "Arklith is styled a duchy, and roughly a third of the country still looks to the ducal house as the source of legitimate government. Nobody has written down which powers the title carries today. Jurists in Cabaria draft the inventory: appointments, pardons, the seal on treaties, the right to call a vote. Every faction reads it as an opening bid."
 ARK_wd_adm_ducal_title_tt_1:0 "Opens four paths for the government of the Duchy; only one can be taken."
 ARK_wd_adm_council_path:0 "A Council Beside the Duke"
 ARK_wd_adm_council_path_desc:0 "Moderate loyalists propose that the ducal house keep its title and its seal while a council of ministers governs, answerable to a chamber elected from the new rolls. It is the compromise most provinces can live with. The National Administration loses its freedom to act alone, and the ducal house trades its long silence for a formal role."
 ARK_wd_adm_household_path:0 "The Household Takes the Seal"
 ARK_wd_adm_household_path_desc:0 "The ducal household argues that a duchy should be governed by its duke, and that the 1990 vote showed how little the parties had to offer. It asks for the seals of state, the officer lists and the budget, with ministers chosen by and answerable to the household. Decisions would come quickly; dissent would have no formal home."
 ARK_wd_adm_board_path:0 "The Houses Want the Board"
 ARK_wd_adm_board_path_desc:0 "The owners of the yards, the shipping lines and the Nieblo mines already fund much of the state through taxes and loans. They propose a governing board drawn from the great commercial houses, keeping the administration but placing their own nominees above its senior civil servants. Efficiency is promised loudly. Fairness is not mentioned at all."
 ARK_wd_adm_assembly_path:0 "Let the Rolls Decide"
 ARK_wd_adm_assembly_path_desc:0 "Reformers in the Llano metropolis and the port unions want an elected civic assembly to govern in its own name, leaving the ducal title as an honour without office. They are a minority, about one voter in seven by the old count, but they are organised, and the refreshed rolls give them a platform the administration cannot quietly withdraw."
 ARK_wd_adm_council_regime:0 "Seat the Ducal Council"
 ARK_wd_adm_council_regime_desc:0 "The ducal council takes the seals from the National Administration. Ministers are named by the council, confirmed by the elected chamber and sworn before the duke, who signs on their advice. The change runs through an office, not a personality. The administration's senior staff stay on as civil servants, uneasy but still employed."
 ARK_wd_adm_household_regime:0 "Household Government"
 ARK_wd_adm_household_regime_desc:0 "A cabinet appointed by the ducal household takes over the ministries. Elections stay off the calendar and the chamber, if it meets at all, merely advises. Provincial governors are replaced by household commissioners. The arrangement is clear about who decides, which reassures investors in the yards and worries everyone who expected the new rolls to be used."
 ARK_wd_adm_board_regime:0 "The Board of the Great Houses"
 ARK_wd_adm_board_regime_desc:0 "A board of nominees from the shipbuilders, shipping lines and mining concerns sits above the ministries and sets the budget. The National Administration becomes its secretariat. Decisions are businesslike and fast. Wages, port fees and mine safety become matters for the board's discretion, and the unions on the coast notice before anyone else."
 ARK_wd_adm_assembly_regime:0 "Convene the Civic Assembly"
 ARK_wd_adm_assembly_regime_desc:0 "Voters on the refreshed rolls elect a civic assembly, which chooses an executive committee to govern. The ducal title remains, with ceremonial duties only. Turnout is uneven: high on the Llano and in the ports, thin in the Nieblo highlands. The committee inherits a stable country with almost no habit of open argument, and must learn one fast."
 ARK_wd_adm_council_budget:0 "A Budget Voted in the Chamber"
 ARK_wd_adm_council_budget_desc:0 "For the first time in years an elected chamber votes the spending plan item by item, with yard subsidies, highland roads and harbour fees argued in public. The session runs long and the press reports every quarrel. Ministers lose the comfort of quiet agreement, and the provinces finally see what Cabaria spends on them."
 ARK_wd_adm_household_commissioners:0 "Commissioners in the Provinces"
 ARK_wd_adm_household_commissioners_desc:0 "Household commissioners arrive in each province with orders to finish what local councils left undone. In Eastern Nieblo the first of them starts on the road the mining towns have petitioned for since the eighties. Commissioners answer to Cabaria alone, so local notables lose their voice, though the roads at last get built on schedule."
 ARK_wd_adm_board_ledgers:0 "The Board Reads the Ledgers"
 ARK_wd_adm_board_ledgers_desc:0 "The board's first act is to read the state's books as if they were a company's. Loss-making ferry routes, idle depots and overstaffed offices are listed for sale or closure. The savings are real and quickly reinvested in the yards. The cuts fall on small towns and junior clerks, who were never consulted and will not forget it."
 ARK_wd_adm_assembly_charter:0 "A Written Civic Charter"
 ARK_wd_adm_assembly_charter_desc:0 "The assembly drafts a charter fixing its own powers, the executive committee's term and the ceremonial duties of the ducal title. Ratification means bargaining with every province, and the highland delegates extract guarantees on mining royalties before they sign. The text is long and imperfect, and it finally gives the courts something to interpret."
 ARK_wd_prt_two_centres:0 "Two Centres of Gravity"
 ARK_wd_prt_two_centres_desc:0 "Government sits in Cabaria, beside the harbours of Puerto Tranquilidad and Cabarion, while the largest city and most of the factories lie inland on the Llano de Arklith. Ministries travel, files travel, and so do grievances. Ending the confusion means choosing which centre the state should serve first, and both will count the cost carefully."
 ARK_wd_prt_rail_survey:0 "Survey the Coast Railway"
 ARK_wd_prt_rail_survey_desc:0 "Freight from the Llano reaches the Cabaria docks on a line laid long ago for smaller trains. The survey counts every bridge, siding and level crossing between the plain and the sea. The first works double the worst stretch near the capital. It costs money the yards wanted, but every hull and every crate rides this line sooner or later."
 ARK_wd_prt_llano_road:0 "The Llano Trunk Road"
 ARK_wd_prt_llano_road_desc:0 "Trucks leaving the factories of the metropolis share one crowded highway with farm carts and buses. A widened trunk road across the Llano de Arklith, with bypasses around the worst market towns, cuts hours from every delivery. The heavy rains test the new surface in its first year, and engineers learn where they should have dug deeper drains."
 ARK_wd_prt_ministries_inland:0 "Move the Ministries Inland"
 ARK_wd_prt_ministries_inland_desc:0 "Planners propose moving the economic ministries to the Llano metropolis, where the factories, unions and most voters already are. Cabaria would keep the formal seat of government but lose the daily traffic of contracts. The port elite objects loudly. Industry gains ministers who can see a production line from their office windows."
 ARK_wd_prt_ministries_coast:0 "Keep Every Ministry in Cabaria"
 ARK_wd_prt_ministries_coast_desc:0 "The opposite answer keeps every ministry by the harbour and brings the Llano to Cabaria instead, with a fast daily train for officials and a liaison office in the metropolis. Coordination stays tight and the yards keep their privileged access. The plain sees its own concerns handled by visitors, and its mayors begin keeping score."
 ARK_wd_prt_ministries_split:0 "Split the Ministries"
 ARK_wd_prt_ministries_split_desc:0 "A third plan divides the state: trade, shipping and foreign affairs stay on the coast, while industry, labour and education move to the Llano. Each region gets a share of the jobs and the prestige. The price is a government permanently on the train, duplicated offices and a cabinet that meets in two cities by turns."
 ARK_wd_prt_llano_quarter:0 "A Government Quarter Inland"
 ARK_wd_prt_llano_quarter_desc:0 "The ministries that moved inland take over an old warehouse district on the edge of the city of Arklith. Officials now meet factory managers over lunch rather than by appointment. Contracts move faster and so do complaints. Some senior staff refuse to leave the coast and retire early, taking decades of memory with them."
 ARK_wd_prt_harbour_offices:0 "Harbour Offices Expand"
 ARK_wd_prt_harbour_offices_desc:0 "With every ministry staying in Cabaria, the harbour quarter grows to house them, and the yard owners win a new berth at Puerto Tranquilidad as part of the bargain. The capital becomes busier and more expensive. Visitors from the Llano find their way to the right office more easily, though not always to a sympathetic one."
 ARK_wd_prt_ministers_train:0 "The Ministers Train"
 ARK_wd_prt_ministers_train_desc:0 "A government split between two cities needs a reliable link. A dedicated morning and evening service runs between Cabaria and the metropolis, and the line through Arklith del Norte is upgraded so the journey takes under two hours. Cabinet papers are read on board. Commuters on the same line notice their own trains running later."
 ARK_wd_prt_provincial_councils:0 "Provincial Councils Meet"
 ARK_wd_prt_provincial_councils_desc:0 "Whatever the address of the ministries, the eight provinces from the Cabar Mountains to Arklith del Sur receive councils with small budgets for roads, clinics and schools, chosen in the way the national order allows. They are modest bodies with modest powers. Complaints now have a local address, and trouble is heard before it spreads."
 ARK_wd_yrd_count_slipways:0 "Count the Twenty Slipways"
 ARK_wd_yrd_count_slipways_desc:0 "Twenty building berths line the four coastal provinces, five each at Cabaria, the Cabar coast, Arklith del Norte and Arklith del Sur. Together they are the largest employer outside the Llano factories. An inspection of every berth, crane and order book shows which yards are full, which are idle and which survive only on state credit."
 ARK_wd_yrd_crane_renewal:0 "Renew the Gantry Cranes"
 ARK_wd_yrd_crane_renewal_desc:0 "Several gantry cranes on the del Norte berths date from before most of their operators were born. Replacing them with heavier lifting gear lets the yard handle larger hull blocks and cuts weeks from each build. The bill is high and the old crane drivers resent the new controls, but the yard takes orders it once turned away."
 ARK_wd_yrd_welders:0 "A School for Welders"
 ARK_wd_yrd_welders_desc:0 "Yard foremen complain that skilled welders leave for foreign yards as soon as they are trained. A public school beside the Cabarion berths takes apprentices from all four coastal provinces, pays a stipend and binds graduates to three years of home service. It costs the treasury steadily and pays off slowly, in hulls that pass inspection."
 ARK_wd_yrd_hulls_export:0 "Hulls for Foreign Owners"
 ARK_wd_yrd_hulls_export_desc:0 "The yards bid for merchant hulls ordered by foreign shipping companies, offering low prices backed by state credit. Order books fill and berths run continuously. The country becomes a supplier to other nations' fleets, exposed to every swing in freight rates abroad, and its own navy waits in line behind paying customers."
 ARK_wd_yrd_naval_programme:0 "A Naval Programme First"
 ARK_wd_yrd_naval_programme_desc:0 "The navy argues that a coast this long, with harbours this busy, needs more than a handful of coastal escorts. A programme of corvettes, patrol craft and submarines would keep every berth working on state orders. Yard income becomes predictable. The bill lands on the budget every year, and the commercial lines lose their repair slots."
 ARK_wd_yrd_refit_trade:0 "Repair and Refit for All"
 ARK_wd_yrd_refit_trade_desc:0 "A third school says new hulls are a crowded market and repairs are not. Dry docks and fitting-out quays would serve any ship that passes the western coast, at fixed and published prices. Margins are thin but reliable, and the skills transfer to wartime damage control. The yards give up the prestige of launching ships."
 ARK_wd_yrd_export_credit:0 "Export Credit for Hull Buyers"
 ARK_wd_yrd_export_credit_desc:0 "Foreign buyers want financing as much as steel. A state credit office in Marcil lends to shipping companies that order hulls from Arklith yards, secured on the ships themselves. Two berths at Arklith del Sur are lengthened for the first contracts. Defaults will come in a bad year, and the treasury will carry them."
 ARK_wd_yrd_escort_class:0 "A Domestic Escort Class"
 ARK_wd_yrd_escort_class_desc:0 "Naval architects design a coastal escort that the yards can build in series, using the hull lines of the existing patrol craft and domestic guns where possible. The first keel is laid at Arklith del Sur with a ceremony the navy enjoys more than the treasury. Series production lowers the unit price after the costly first hull."
 ARK_wd_yrd_dry_docks:0 "Dry Docks on the Cabar Coast"
 ARK_wd_yrd_dry_docks_desc:0 "The Cabar coast has deep water close to shore and chromium mines in the hills behind it, which makes it a natural place for heavy repair. Two dry docks large enough for any merchant ship on the western routes are cut into the shoreline. Owners pay for speed and certainty; the yard pays for its machinery for a decade."
 ARK_wd_yrd_guarantee_fund:0 "A Guarantee Fund for the Yards"
 ARK_wd_yrd_guarantee_fund_desc:0 "Shipbuilding runs on long contracts and short cash. A guarantee fund, paid into by every yard and backed by the treasury, covers suppliers when a buyer defaults mid-build. Owners grumble at the levy. Suppliers stop demanding payment in advance, and smaller yards can bid for contracts that used to go only to the largest."
 ARK_wd_hil_survey:0 "Survey the Nieblo Seams"
 ARK_wd_hil_survey_desc:0 "Most of the country's arms plants and nearly all of its aluminium and tungsten sit in the Nieblo highlands, where mining towns cling to valleys that see the sun late and lose it early. No modern survey says how much ore remains or how safe the shafts are. Geologists and inspectors spend two seasons underground before anyone decides anything."
 ARK_wd_hil_shaft_safety:0 "Shaft Safety Inspectors"
 ARK_wd_hil_shaft_safety_desc:0 "The survey found ventilation that fails in summer, timber props past their age and escape routes blocked by spoil. A corps of mine inspectors with power to close a shaft on the spot is hired from among retired foremen. Output dips while faults are fixed. Accidents fall, and families stop gathering at the pithead every time a siren sounds."
 ARK_wd_hil_mountain_road:0 "The Nieblo Mountain Road"
 ARK_wd_hil_mountain_road_desc:0 "Ore and finished arms leave the Nieblo Mountains on a single road with hairpins that defeat heavy trucks in the rains. Engineers cut a new grade along the valley floor, with tunnels through two spurs and bridges built for heavy loads. It is the most expensive road in the country per kilometre, and soon the busiest."
 ARK_wd_hil_authority:0 "One Highland Authority"
 ARK_wd_hil_authority_desc:0 "The state gathers the mines, smelters and arms plants of both Nieblo provinces under one highland authority, with a single budget and a single wage scale. Investment can be planned across the whole range rather than shaft by shaft. Private owners are bought out at prices they call insulting. The authority becomes the mountains' largest employer."
 ARK_wd_hil_leases:0 "Lease the Seams to the Houses"
 ARK_wd_hil_leases_desc:0 "The alternative leases each seam to commercial houses for twenty years in exchange for royalties and investment commitments. Capital arrives quickly, new shafts open and the treasury collects without managing anything. The houses decide which towns grow and which close, and miners deal with distant boards rather than their government."
 ARK_wd_hil_aluminium_works:0 "Aluminium Works in the East"
 ARK_wd_hil_aluminium_works_desc:0 "Bauxite from the eastern valleys has always left the country as raw ore. The highland authority builds a reduction works near the mines of Eastern Nieblo, drawing on the local oil wells for power. Ingots instead of ore mean more value kept at home and a domestic metal supply for aircraft parts, at the price of a decade of debt."
 ARK_wd_hil_lease_arsenal:0 "A Leased Arsenal Line"
 ARK_wd_hil_lease_arsenal_desc:0 "One of the leaseholders proposes to add a modern arms line beside its new shafts in Eastern Nieblo, selling light weapons to the army and to approved foreign buyers. The state gains jobs and a domestic supplier without spending a coin. It also gains a private arms maker on a frontier shared with three neighbours, with interests of its own."
 ARK_wd_hil_tungsten_tools:0 "Tungsten for Machine Tools"
 ARK_wd_hil_tungsten_tools_desc:0 "Tungsten from the Nieblo seams is sold abroad as concentrate and bought back as cutting tools at many times the price. A small tool works in the Nieblo Mountains turns concentrate into drill bits and lathe tools for the Llano factories. The plant is modest; the lesson that ore can be finished at home matters more than its output."
 ARK_wd_hil_nieblo_power:0 "Power Lines over the Passes"
 ARK_wd_hil_nieblo_power_desc:0 "Mines and arms halls in the Nieblo run on local diesel generators that fail in the cold months. A high-voltage line from the Llano grid crosses the passes to Eastern Nieblo, carried on towers that line crews must reach on foot. Factories gain steady power; the line becomes the first thing a storm or a saboteur would cut."
 ARK_wd_hil_miners_compact:0 "A Compact with the Miners"
 ARK_wd_hil_miners_compact_desc:0 "Miners' delegates, the managers of the seams and the safety inspectors sign a compact on pay, shifts and housing for the mountain towns. Strikes become rarer because grievances now have a table. Wages rise faster than output for a few years. The highlands stop being the place the coast forgets until something goes wrong underground."
 ARK_wd_lla_works_council:0 "The Llano Works Council"
 ARK_wd_lla_works_council_desc:0 "Seven large works and hundreds of small shops make the city of Arklith the country's industrial heart. Owners, unions and the city council meet only when something has already gone wrong. A standing works council brings them to one table every month to plan power, transport and training together. It slows nothing down except surprises."
 ARK_wd_lla_machine_tools:0 "Machine Tools for the Plain"
 ARK_wd_lla_machine_tools_desc:0 "Many Llano workshops still run lathes bought second-hand a generation ago. A state leasing scheme lets shops replace them with modern machine tools and repay from the extra output. Larger works lose their monopoly on precision jobs. The first year floods the plain with half-trained operators; by the second the scrap rate halves."
 ARK_wd_lla_technical_college:0 "A Technical College for Arklith"
 ARK_wd_lla_technical_college_desc:0 "Engineers for the Llano factories are trained abroad or not at all. A technical college in the city of Arklith offers degrees in mechanical, electrical and chemical engineering with placements in the local works. It costs a steady budget and takes years to graduate its first class. The factories stop poaching each other's graduates."
 ARK_wd_lla_household_goods:0 "Goods for Every Household"
 ARK_wd_lla_household_goods_desc:0 "The works council proposes that the Llano turn toward refrigerators, radios, bicycles and buses for the domestic market, with tax relief for families who buy local. Shops fill and wages feel larger. The yards and the army find the plain's best engineers busy with kitchen appliances, and exporters complain the home market makes factories lazy."
 ARK_wd_lla_capital_goods:0 "Machines That Make Machines"
 ARK_wd_lla_capital_goods_desc:0 "The other camp wants the plain to make pumps, engines, rail stock and machine tools: the equipment that other industries depend on. Investment goes to heavy plant and long training. Households wait longer for their comforts. In return, the country can repair and replace its own equipment instead of waiting on foreign suppliers."
 ARK_wd_lla_bus_works:0 "Buses and Trucks from the Llano"
 ARK_wd_lla_bus_works_desc:0 "A converted works on the edge of Arklith builds buses for every province and light trucks for farms and mines. Domestic models are heavier and plainer than imports, and drivers grumble about the gearboxes. Spare parts are cheap and always in stock, and the mountain towns finally get buses designed for their roads."
 ARK_wd_lla_rail_stock:0 "Rolling Stock Built at Home"
 ARK_wd_lla_rail_stock_desc:0 "The coast railway and the Llano lines run on locomotives and wagons bought abroad over decades, in six incompatible types. A rolling stock works in the metropolis builds a single standard wagon and a heavy freight locomotive under licence. Delivery is slow at first, and every unit can be repaired with parts made a few streets away."
 ARK_wd_lla_sustainment_institute:0 "The Sustainment Institute"
 ARK_wd_lla_sustainment_institute_desc:0 "The technical college opens an institute devoted to keeping things running: maintenance schedules, spare-part standards and repair methods for everything from buses to coastal escorts. Foreign partners rarely sell such research. Results appear as fewer breakdowns rather than new inventions, which makes the institute hard to defend in budget debates."
 ARK_wd_lla_housing:0 "Housing for the Factory Districts"
 ARK_wd_lla_housing_desc:0 "Workers drawn to the metropolis from the highlands and the coast crowd into districts built for half their number. A housing programme builds apartment blocks near the works, financed by long state loans to the city. Builders compete with the factories for labour. New tenants arrive faster than the blocks rise, but the worst districts empty."
 ARK_wd_lla_standard_parts:0 "One Standard for Spare Parts"
 ARK_wd_lla_standard_parts_desc:0 "Every ministry, the army and the yards buy spare parts to their own specifications, so a bolt for a bus does not fit a truck from the same works. The institute publishes national standards for fasteners, bearings, fittings and hoses, and state buyers must follow them. Suppliers retool reluctantly. Warehouses shrink and repairs speed up."
 ARK_wd_flt_count_flag:0 "Count the Merchant Flag"
 ARK_wd_flt_count_flag_desc:0 "Several hundred merchant ships fly the Arklith flag, a large fleet for a country of eight provinces. Many are old, some are registered here only for the low fees, and a few have not called at Puerto Tranquilidad in years. Before setting maritime policy, the shipping office counts which hulls are truly Arklith's and who crews them."
 ARK_wd_flt_seafarers_college:0 "The Seafarers College"
 ARK_wd_flt_seafarers_college_desc:0 "Officers and engineers for the merchant fleet have trained abroad or aboard, with no national standard. A seafarers college at Puerto Tranquilidad sets examinations recognised by foreign insurers, which lowers premiums for ships crewed by its graduates. The navy borrows its classrooms in winter, and the college needs old hulls to train on."
 ARK_wd_flt_open_register:0 "Keep the Register Open"
 ARK_wd_flt_open_register_desc:0 "Low fees and light inspection attract foreign owners, who register their ships in Arklith and pay tonnage dues to Cabaria. The income is steady and costs almost nothing to collect. Arklith's name appears on ships it does not control, crewed by people it has never met, and every accident at sea becomes partly its embarrassment."
 ARK_wd_flt_national_line:0 "Found a National Line"
 ARK_wd_flt_national_line_desc:0 "The alternative tightens the register and gathers the best domestic hulls into a national line with regular sailings from Cabaria and Marcil. Foreign owners leave for cheaper flags and the dues fall. In exchange, the country gains a fleet it can count on in a crisis, crewed by its own seafarers and maintained in its own yards."
 ARK_wd_flt_quay_inspectors:0 "Inspectors on Every Quay"
 ARK_wd_flt_quay_inspectors_desc:0 "Two groundings and a fire in harbour push the open register to hire inspectors who board every foreign-owned ship at its first Arklith call. Some owners leave rather than pay for repairs. Those who stay keep the dues coming, and harbour pilots stop refusing to bring certain hulls alongside after dark."
 ARK_wd_flt_scheduled_sailings:0 "Scheduled Sailings Abroad"
 ARK_wd_flt_scheduled_sailings_desc:0 "The national line publishes a timetable: weekly sailings linking Cabaria, Marcil and Leonim with foreign ports, whatever the cargo. Shippers in the Llano can plan around fixed dates for the first time. Empty sailings cost money in slow months, and the quay roads at Arklith del Sur are widened so trucks can meet the ships."
 ARK_wd_flt_harbour_tariff:0 "One Tariff for All Harbours"
 ARK_wd_flt_harbour_tariff_desc:0 "Each harbour on the coast charges its own dues, set by local custom and local friendships. A single published tariff for berthing, pilotage and storage now applies from the Cabar coast to Leonim. Some harbour boards lose income and lobby hard. Shippers stop haggling, and smaller ports win traffic they used to lose to the capital."
 ARK_wd_flt_laid_up_reserve:0 "A Reserve of Laid-Up Hulls"
 ARK_wd_flt_laid_up_reserve_desc:0 "Rather than scrap the oldest ships, the shipping office lays up a dozen in sheltered water off Cabarion with skeleton crews and a maintenance budget. In normal years they cost money and look like rust. In a crisis they can carry grain, fuel or evacuees within weeks, which is far cheaper than chartering at emergency rates."
 ARK_wd_arm_count_army:0 "A Small Army Counts Itself"
 ARK_wd_arm_count_army_desc:0 "The army keeps barracks in every province, a mountain detachment in the Nieblo and almost no public interest in its affairs. War support sits near the bottom of any measure the ministries use. Before asking for anything, the general staff audits its own stocks: rifles, trucks, artillery, spare parts and the soldiers who could actually be fielded."
 ARK_wd_arm_repair_shops:0 "Repair Shops in Every Garrison"
 ARK_wd_arm_repair_shops_desc:0 "Trucks and guns that break down wait months for parts from a central depot near Cabaria. Each garrison now gets its own repair shop with mechanics, a small parts store and authority to cannibalise wrecks. Inventory costs rise and accountants complain about duplication. Vehicles return to service in days instead of seasons."
 ARK_wd_arm_mountain_corps:0 "The Nieblo Mountain Corps"
 ARK_wd_arm_mountain_corps_desc:0 "Three frontiers meet in the Nieblo highlands, and the general staff proposes that the army's best units train to fight there: mountain infantry, pack transport and light artillery that can be carried up a slope. The corps would hold the passes against any intruder. The Llano and the coast would be guarded by reservists only."
 ARK_wd_arm_llano_reserve:0 "A Mobile Reserve on the Llano"
 ARK_wd_arm_llano_reserve_desc:0 "The rival plan concentrates the army on the open plain around the metropolis, motorised and ready to move by road or rail to any province within days. One central reserve covers every frontier at once, on paper. In the highlands it would arrive late and tired, and the mountain towns doubt anyone would come at all."
 ARK_wd_arm_pack_artillery:0 "Pack Artillery for the Passes"
 ARK_wd_arm_pack_artillery_desc:0 "Field guns that need a road are useless above the Nieblo valleys. The corps adopts light mountain guns that break down into mule and truck loads, with crews drilled to reassemble them on a ridge in under an hour. Range and weight of shell are modest. The guns arrive where heavier artillery could only watch from below."
 ARK_wd_arm_motor_pool:0 "A Motor Pool for the Reserve"
 ARK_wd_arm_motor_pool_desc:0 "A reserve that moves by road needs trucks, fuel and drivers who know every route. The army leases trucks from the Llano works in peacetime and keeps a depot of its own on the edge of the plain, with paved loading yards beside the trunk highway. Army and manufacturers find the tie convenient until a crisis tests it."
 ARK_wd_arm_volunteer_army:0 "A Volunteer Army"
 ARK_wd_arm_volunteer_army_desc:0 "With war support this low, compulsion would be resented in every province. The general staff proposes a smaller army of long-service volunteers on decent pay, with skills civilian employers value when they leave. Recruitment posters go up in the Llano and the highlands. The force shrinks in numbers and grows in competence."
 ARK_wd_arm_territorial_militia:0 "Territorial Militias"
 ARK_wd_arm_territorial_militia_desc:0 "The alternative asks every province to raise a part-time militia, drilling on weekends and guarding its own towns, bridges and harbours in an emergency. It is cheap and keeps the army visible in daily life. Training is thin and equipment basic. Every province gains a reason to care about defence, and neighbours notice the armed civilians."
 ARK_wd_arm_sustainment_doctrine:0 "A Doctrine of Sustainment"
 ARK_wd_arm_sustainment_doctrine_desc:0 "The general staff writes down what a small country can actually do: fight close to home, keep every vehicle running and never outrun its supplies. The doctrine favours firepower over manoeuvre and the integrity of units over bold thrusts. It is not exciting reading. It is honest about the army's size, which earlier plans never were."
 ARK_wd_bas_field_study:0 "Study the Halloma Field"
 ARK_wd_bas_field_study_desc:0 "The Halloma Basin holds the largest oil field in the country, under forest and farmland on the Perbla frontier. Wells were drilled piecemeal by small operators, and much of the crude leaves by truck. A field study maps pressure, reserves and the condition of every pump. Without it, any plan for the basin is only a guess."
 ARK_wd_bas_refine_home:0 "Refine at Halloma"
 ARK_wd_bas_refine_home_desc:0 "A refinery in the basin turns crude into diesel and fuel oil for the yards, the fishing fleets and the army's trucks. Imports of refined fuel fall, and the basin gains skilled jobs. Refineries are expensive, dirty and slow to pay back. Neighbouring farms complain about the smell, and the local fire brigade doubles its training."
 ARK_wd_bas_crude_exports:0 "Crude Through Cabaria"
 ARK_wd_bas_crude_exports_desc:0 "The cheaper course moves crude to the coast and sells it unrefined to foreign buyers from the Cabaria terminals. Revenue arrives quickly and the treasury needs it. The country keeps importing refined fuel at prices set elsewhere, and the basin stays a place where oil is pumped and then leaves for someone else to process."
 ARK_wd_bas_fuel_depots:0 "Fuel Depots for the Coast"
 ARK_wd_bas_fuel_depots_desc:0 "Diesel and fuel oil from the new refinery are stored in depots at every coastal base from the Cabar coast to Leonim, so the escorts and the yards no longer wait for imported tankers. The depots need guards and fire crews. Ships refuel at home, faster and cheaper, and the navy stops rationing its patrol hours in the dry months."
 ARK_wd_bas_pipeline:0 "The Basin Pipeline"
 ARK_wd_bas_pipeline_desc:0 "A pipeline from the Halloma field to the Cabaria terminals replaces the tanker trucks that crowd the northern roads. Construction crews follow the existing routes through the forest, and the line opens after two dry seasons. Trucking firms lose their best contract. Crude moves faster and more cheaply, and the roads grow safer."
 ARK_wd_bas_forestry_office:0 "A Forestry Office for the Basin"
 ARK_wd_bas_forestry_office_desc:0 "The basin forests supply pit props for the Nieblo mines, scaffolding for the yards and timber for the housing the Llano still lacks. Logging is unregulated and the best stands near the roads are gone. A forestry office sets quotas, replants cleared land and licenses sawmills, which costs the loggers this year and saves them in twenty."
 ARK_wd_bas_end_flaring:0 "End the Gas Flaring"
 ARK_wd_bas_end_flaring_desc:0 "Operators in the basin burn off the gas that comes up with the crude because nobody pays for it. Capturing it for the Halloma towns and the nearest factories costs compressors and pipe, and the operators want the state to pay. The flares go dark one by one, and the basin towns get gas heating for the first time."
 ARK_wd_nav_squadron_review:0 "Review the Coastal Squadrons"
 ARK_wd_nav_squadron_review_desc:0 "The navy is a coastal force of light escorts and a few submarines, based at Puerto Tranquilidad, Cabarion, Marcil and Leonim. Its doctrine is to stay intact and threaten, never to seek battle. A review of every hull's readiness, from engines to ammunition stocks, tells the admirals how much of that threat is real and how much is paint."
 ARK_wd_nav_lane_patrols:0 "Patrol the Shipping Lanes"
 ARK_wd_nav_lane_patrols_desc:0 "With hundreds of merchant ships under the flag, one school of officers wants the escorts at sea, shadowing the busiest lanes off the western coast and meeting convoys at the edge of territorial waters. Fuel and wear rise steeply. Merchant captains see grey hulls on the horizon, and insurers take note of a navy that actually sails."
 ARK_wd_nav_harbour_approaches:0 "Hold the Harbour Approaches"
 ARK_wd_nav_harbour_approaches_desc:0 "The other school keeps the escorts close and makes the harbour mouths themselves hard to enter: mine stores, boom nets, coastal radar and submarines on station outside each major port. It burns less fuel and protects the yards directly. Merchant ships beyond the horizon must look after themselves until they reach the guarded water."
 ARK_wd_nav_far_tender:0 "A Tender for Distant Patrols"
 ARK_wd_nav_far_tender_desc:0 "Escorts on long patrols return to port every few days to refuel, which wastes half their time at sea. A converted merchant hull from the laid-up reserve becomes a fleet tender, carrying fuel, spares and a small workshop. The escorts stay out twice as long. A single tender is also a single target, and the admirals know it."
 ARK_wd_nav_headland_radar:0 "Radar Above Marcil and Leonim"
 ARK_wd_nav_headland_radar_desc:0 "Radar sets on the headlands above Marcil and Leonim watch every approach to the southern harbours day and night. Operators train with the harbour pilots so that a stranger on the screen is identified within minutes. The stations need power lines, roads and relief crews in bad weather, and the rains test all three."
 ARK_wd_nav_submarine_school:0 "Training the Submarine Crews"
 ARK_wd_nav_submarine_school_desc:0 "Arklith's few coastal submarines are crewed by sailors who learned from older crews and from manuals in foreign languages. A training flotilla based at Cabarion standardises drills, escapes and torpedo handling, using one boat as a permanent classroom. Fewer patrol hours is the price of crews who know what to do when something fails underwater."
 ARK_wd_nav_convoy_exercise:0 "Exercise with the Merchants"
 ARK_wd_nav_convoy_exercise_desc:0 "Once a year the navy and the merchant fleet rehearse a crisis: ships gather off Cabaria, sail in convoy along the coast and practise signals, zigzags and emergency dispersal. Shipping lines lose a few days of trade each time. Masters learn the navy's signals, the navy learns how slowly a laden freighter turns, and both trust each other more."
 ARK_wd_fro_one_map:0 "Four Frontiers on One Map"
 ARK_wd_fro_one_map_desc:0 "Arklith touches four neighbours: Perbla beyond the Halloma Basin and the Cabar hills, Leasath along the southern edge of the Llano and the Nieblo, Dakrain past Eastern Nieblo, and the Gibraltar Mining Zone south of Arklith del Sur. The foreign office has never set one policy for all four. A review puts them on one map and asks what each crossing is for."
 ARK_wd_fro_perbla_customs:0 "Customs Posts on the Perbla Road"
 ARK_wd_fro_perbla_customs_desc:0 "Most trade with Perbla crosses at the Halloma Basin on roads built for farm carts. New customs posts with covered inspection bays, and a resurfaced road to the frontier, cut waiting times for trucks in both directions. Arklith's traders press for lower tariffs in any deal. The posts are small buildings with a large effect on basin markets."
 ARK_wd_fro_leasath_watch:0 "Watch on the Southern Passes"
 ARK_wd_fro_leasath_watch_desc:0 "Leasath shares the longest frontier, along the southern Llano and the Nieblo passes, and its own politics are restless, with a nationalist movement that polls as strongly as its government. Arklith has no quarrel to pursue there. It does want early notice if anything changes, so observation posts on the passes report daily to Cabaria."
 ARK_wd_fro_dakrain_valley:0 "A Valley Commission with Dakrain"
 ARK_wd_fro_dakrain_valley_desc:0 "Eastern Nieblo's valleys run into Dakrain, and herders, ore trucks and smugglers use the same tracks. A joint valley commission meets each season to settle grazing, water rights and crossing hours. It has no power over claims and wants none. Small disputes stop climbing to the ministries, and the valley towns trade a little more openly."
 ARK_wd_fro_dakrain_valley_tt_2:0 "No claim, core or frontier change; the commission settles grazing, water and crossing hours."
 ARK_wd_fro_gibraltar_road:0 "A Haul Road to the South"
 ARK_wd_fro_gibraltar_road_desc:0 "The Gibraltar Mining Zone on the southern edge is run by its own mining administration. A graded haul road from the frontier toward the Marcil quays, with weighbridges and a customs yard, would offer the zone a shorter route to the sea if its administration wants one. Ore trucks would break up the surface every wet season, and maintenance grows."
 ARK_wd_fro_open_crossings:0 "Frontiers Open for Trade"
 ARK_wd_fro_open_crossings_desc:0 "One view says a small trading country lives by its crossings: lower tariffs, faster inspections and transit rights for neighbours' goods heading to the western ports. Traffic and revenue grow. So does smuggling, and the border police warn that open roads carry more than freight. The ports welcome every new truck from inland."
 ARK_wd_fro_neutral_watchful:0 "Neutral and Watchful"
 ARK_wd_fro_neutral_watchful_desc:0 "The other view keeps every crossing courteous and every treaty unsigned. Arklith promises nothing to anyone, buys arms from several suppliers and keeps its frontier posts manned in every season. It avoids entanglement in any neighbour's troubles. It also forgoes the trade friendlier frontiers would bring, and the basin traders say so."
 ARK_wd_fro_transit_cabar:0 "Transit Through the Cabar Hills"
 ARK_wd_fro_transit_cabar_desc:0 "Inland shippers ask to move goods through Arklith to the western harbours under bond, without paying duty twice. A transit agreement and a bonded warehouse zone on the Cabar coast make it possible, with the road through the hills improved for heavy trucks. Dock work grows. Customs officers must now trust paperwork stamped abroad."
 ARK_wd_fro_frontier_police:0 "A Frontier Police Corps"
 ARK_wd_fro_frontier_police_desc:0 "Customs men and soldiers have shared the frontier posts badly for years. A single frontier police corps, trained for searches, patrols and observation, takes over every crossing and the high ground between them, with a radar post above the Halloma road. Soldiers return to barracks, and the corps guards its independence jealously."
 ARK_wd_fro_valley_markets:0 "Markets at the Valley Crossings"
 ARK_wd_fro_valley_markets_desc:0 "With the valley commission meeting regularly, the mining towns of Eastern Nieblo and their neighbours across the Dakrain line hold seasonal markets at the crossings. Wool, tools and produce change hands under the commission's eye. The trade is small in national terms. For the valley towns it separates a hard winter from a bearable one."
 ARK_wd_air_count_squadrons:0 "Count the Fighter Squadrons"
 ARK_wd_air_count_squadrons_desc:0 "Two dozen fighters and a handful of support aircraft make up the air arm, spread across fields at Cabaria, the Halloma Basin, Arklith del Sur and the Llano. Pilots fly too few hours and spares arrive late. The air staff's first task is to work out how many aircraft could fly on any given morning, and the answer is uncomfortable."
 ARK_wd_air_sea_lanes:0 "Wings over the Sea Lanes"
 ARK_wd_air_sea_lanes_desc:0 "The air arm could serve the merchant fleet: patrol aircraft and fighters based on the coast, watching the shipping lanes and the harbour approaches, working alongside the navy's escorts. Coastal fields get the money. The interior and the highland frontiers would rely on the army's own guns if anything came over the mountains."
 ARK_wd_air_highland_screen:0 "A Screen over the Highlands"
 ARK_wd_air_highland_screen_desc:0 "The rival plan builds a fighter screen over the inland frontiers, with fields in the Nieblo foothills and radar on the ridges, so that nothing crosses from any neighbour unseen. It protects the arms plants and the metropolis. The coast keeps what it has, which is not much, and the shipping lines ask who will watch their lanes."
 ARK_wd_air_norte_field:0 "A Field at Arklith del Norte"
 ARK_wd_air_norte_field_desc:0 "Arklith del Norte has busy coastal waters between the capital and Marcil but no airfield. A new field on the coastal plain gives patrol aircraft a base halfway down the coast. Farmers lose land and the rains delay the runway twice. When it opens, aircraft can reach any point on the western lanes within the hour."
 ARK_wd_air_capital_radar:0 "Radar over Puerto Tranquilidad"
 ARK_wd_air_capital_radar_desc:0 "The busiest harbour in the country has no radar of its own beyond what the ships carry. A station on the hills above Puerto Tranquilidad tracks aircraft and shipping across the northern approaches and reports to the coastal wing. Its operators learn to separate fishing boats from intruders, which takes most of a year."
 ARK_wd_air_nieblo_field:0 "A Field in the Nieblo Foothills"
 ARK_wd_air_nieblo_field_desc:0 "The Nieblo Mountains have no airfield, only a strip used by mail planes. Engineers level a plateau in the foothills for a fighter field with hardened shelters. The approach is difficult in cloud and the pilots who train there earn reputations. Fighters based in the foothills can meet anything crossing the passes before it reaches the Llano."
 ARK_wd_air_ridge_radar:0 "Radar on the Nieblo Ridges"
 ARK_wd_air_ridge_radar_desc:0 "A radar post on the highest reachable ridge of the Nieblo looks across three frontiers at once. Supplies go up by cable car and, in winter, on the backs of the crew. The view on the screen is the widest in the country. Keeping the set running in the cold demands a relief rota that the air arm can barely staff."
 ARK_wd_air_flying_school:0 "A Flying School at Cabaria"
 ARK_wd_air_flying_school_desc:0 "Pilots learn on operational fighters, which wastes airframes and fuel. A flying school at the Cabaria field with simple trainers and instructors drawn from the squadrons gives every new pilot two hundred hours before touching a fighter. Squadron strength dips while instructors teach. Graduates arrive knowing how to fly in coastal weather."
 ARK_wd_air_spares_pipeline:0 "A Spares Pipeline for Aircraft"
 ARK_wd_air_spares_pipeline_desc:0 "Half the grounded aircraft on any morning wait for one missing part. The air arm sets up a spares pipeline with stock held at each field, overhaul contracts with the Llano works and a rule that no airframe is cannibalised without written approval. Availability rises month by month, and warehouses fill with parts that may never be used."
 ARK_wd_war_crisis_office:0 "A Crisis Office in Cabaria"
 ARK_wd_war_crisis_office_desc:0 "In March 1995 the Belkan War breaks out far from Arklith's own frontiers. Arklith is not a party and has no wish to become one, but Perbla across the eastern frontier has old ties to Belka, and Arklith ships trade in seas the war now touches. The administration opens a crisis office in Cabaria to follow events hour by hour."
 ARK_wd_war_state_pool:0 "A State War-Risk Pool"
 ARK_wd_war_state_pool_desc:0 "Foreign insurers raise premiums on every ship that sails near the war, and some refuse cover altogether. A state war-risk pool insures Arklith-flagged hulls at fixed rates, backed by the treasury and the lines' own contributions. If a ship is lost, the pool pays and the treasury bleeds. Until then, the fleet keeps sailing while others wait."
 ARK_wd_war_trade_all:0 "Carry Lawful Cargo for All"
 ARK_wd_war_trade_all_desc:0 "As a neutral, Arklith may carry non-military goods for any buyer, and freight rates have doubled. Shipping lines want permission to take every legal cargo they can find. The treasury likes the revenue. Each sailing risks a ship, a crew and an incident that could pull the country into a quarrel, and every belligerent will read the manifests."
 ARK_wd_war_close_ports:0 "Close the Ports to Belligerents"
 ARK_wd_war_close_ports_desc:0 "The cautious course closes Arklith ports to warships and war cargoes of every belligerent, and bans Arklith ships from the war zones until the fighting ends. The fleet loses the richest freight in years and some owners reflag elsewhere. Nobody can accuse the Duchy of helping either side, and the coast stays quiet."
 ARK_wd_war_manifests:0 "Inspectors for Every Manifest"
 ARK_wd_war_manifests_desc:0 "Neutral trade is only neutral if the cargoes are what the papers say. Customs inspectors open containers at random in every port, and masters must sign declarations that their holds carry no munitions. Shipping lines complain about delays. When a foreign navy stops an Arklith ship at sea, the papers stand up and the ship sails on."
 ARK_wd_war_manifests_tt_1:0 "Every outbound cargo is checked against the neutrality rules."
 ARK_wd_war_coast_alert:0 "The Coast on Alert"
 ARK_wd_war_coast_alert_desc:0 "With the ports closed, the escorts and the harbour defences must turn away warships and enforce the ban. Radar crews watch the approaches day and night, and a new station at Arklith del Norte covers the gap north of Marcil. Sailors serve long watches. The coast learns what a neutral's readiness looks like when it must be enforced."
 ARK_wd_war_escorted_convoys:0 "Neutral Convoys Under Escort"
 ARK_wd_war_escorted_convoys_desc:0 "Merchant masters who sailed in the annual exercise ask for escorts through the waters nearest the war. The navy forms small convoys off Cabaria, escorting them to the edge of the danger zone and meeting them on return. The escorts are few and stretched thin. The arrangement works, and its reputation travels among shipowners."
 ARK_wd_war_postwar_freight:0 "Freight After the Treaty"
 ARK_wd_war_postwar_freight_desc:0 "The war ends with Belka defeated and a treaty signed at Lumen. Rebuilding across the region needs steel, cement, timber and ships to carry them, and freight markets stay busy for years. Arklith's yards and lines compete for the work with every neutral flag afloat, and owners argue about how long the boom can last."
 ARK_wd_war_frontier_unease:0 "A Continent Off Balance"
 ARK_wd_war_frontier_unease_desc:0 "Against most predictions, the war ends with Belka on top, and Perbla next door has reason to celebrate its old friend's success. Arklith has no cause to fear either country directly, yet the balance of the continent has shifted and nobody can say where it settles. Reserve officers are recalled for refresher training."
 ARK_wd_sky_announcement:0 "The Sky Has a Date"
 ARK_wd_sky_announcement_desc:0 "The 1994 warning about Ulysses became a certainty in April 1996, when the FCU told the world to expect an impact. Where the fragments will come down is anyone's guess. Arklith keeps its government and harbours on an exposed coast and its factories on an open plain, so the administration starts planning for a threat with no address."
 ARK_wd_sky_watch_room:0 "A National Sky Watch"
 ARK_wd_sky_watch_room_desc:0 "Arklith has no great telescope of its own, but amateur astronomers, college physicists and the air arm's radar crews can share what they see. A national sky watch gathers foreign bulletins, local observations and radar reports in one room in Cabaria and issues a plain summary every week. Rumours weaken when facts arrive on schedule."
 ARK_wd_sky_shelters:0 "Deep Shelters for Three Cities"
 ARK_wd_sky_shelters_desc:0 "Engineers propose deep shelters beneath the metropolis on the Llano, the capital and the southern ports, stocked with water, food and medicine for weeks. The digging disrupts streets for years and the cost is enormous. If fragments fall on a city, people underground will live. If they fall elsewhere, the shelters become costly cellars."
 ARK_wd_sky_dispersal:0 "Plans to Empty the Cities"
 ARK_wd_sky_dispersal_desc:0 "The cheaper plan accepts that no shelter is deep enough for a direct hit and prepares to move people instead: evacuation routes, reception towns in the highlands and the basin, fuel reserves and a fleet of buses and ships. It needs warning time and discipline. It also needs the countryside to welcome the cities, which is not guaranteed."
 ARK_wd_sky_shelter_stores:0 "Stores for the Shelters"
 ARK_wd_sky_shelter_stores_desc:0 "Shelters without supplies are traps. Contracts go to canning works and pharmacies for stocks rotated every two years, and a new packing plant at Arklith del Sur supplies the southern shelters and ships. Rotation sells old stock cheaply to the public, which proves popular. The plant keeps working long after the asteroid leaves the news."
 ARK_wd_sky_reception_towns:0 "Reception Towns in the Highlands"
 ARK_wd_sky_reception_towns_desc:0 "Highland and basin towns are assigned partner districts in the cities and plan to receive them: schools become dormitories, halls become clinics, and roads into the Nieblo are widened for buses. Rehearsals are awkward and some towns resent the burden. Families learn where they would go, which turns panic into a timetable."
 ARK_wd_sky_evacuation_ships:0 "Reserve Hulls on Evacuation Duty"
 ARK_wd_sky_evacuation_ships_desc:0 "The laid-up merchant hulls off Cabarion are surveyed, repaired and assigned to evacuation duty, each with a home port, a crew roster and a destination. Coastal towns that cannot be reached quickly by road now have a ship. Keeping the reserve seaworthy costs more each year, and the shipping office stops calling it a waste."
 ARK_wd_sky_evacuation_ships_tt_2:0 "The laid-up reserve hulls are assigned to evacuation duty."
 ARK_wd_sky_roche:0 "Ulysses Overhead"
 ARK_wd_sky_roche_desc:0 "In July 1999 Ulysses passes through the Earth's Roche limit and begins to break apart. Every plan written since 1996 is now tested against reality. Sirens are checked, shelters and reception towns go on standby and the sky watch reports hourly. The country can do no more than it has done; what remains is to wait and keep order."
 ARK_wd_sky_relief_bureau:0 "Counting the Damage and Debts"
 ARK_wd_sky_relief_bureau_desc:0 "Whatever fell, and wherever it fell, the months after the passage bring insurers reassessing every coast, ships seeking safe harbour and a public that wants to know what the preparations cost. A relief bureau in Cabaria handles arrivals, claims and the return of stocks to the market. It is the first such office, and the country keeps it."
 ARK_wd_mil_review:0 "A Decade of the New Order"
 ARK_wd_mil_review_desc:0 "Ten years after the National Administration first published its powers, the government commissions a review of what the decade built and what it cost: the order chosen in Cabaria, the yards, the highlands, the Llano and the frontiers. Its panel draws members from every province by lot. Its report will set the terms of politics."
 ARK_wd_mil_ducal_constitution:0 "The Ducal Constitution"
 ARK_wd_mil_ducal_constitution_desc:0 "The council consolidates its charter, the chamber's rules and the ducal prerogatives into one written constitution, signed by the duke and ratified by the chamber. Disputes that once needed private mediation go to a court. Every clause costs a negotiation. The result is a duchy whose government nobody needs to guess about."
 ARK_wd_mil_household_code:0 "The Household Code"
 ARK_wd_mil_household_code_desc:0 "A decade of household government has run on custom and verbal instruction. The cabinet now publishes a code listing each prerogative of the ducal house, each power lent to ministers and the narrow agenda left to the advisory chamber. Opponents read it as a cage with a printed key. Foreign lenders read it as a contract they can price."
 ARK_wd_mil_houses_charter:0 "A Charter for the Great Houses"
 ARK_wd_mil_houses_charter_desc:0 "After a decade of complaints that the board governs like a cartel, the great houses accept a published charter: term limits for nominees, rules on conflicts of interest and an annual report to a public audit office. Some houses leave the board rather than open their books. Those who stay gain a legitimacy money could not buy."
 ARK_wd_mil_civic_constitution:0 "The Civic Constitution"
 ARK_wd_mil_civic_constitution_desc:0 "The civic assembly turns its first charter into a full constitution with a bill of rights, an independent court and fixed terms for the executive committee. The ducal title is written in as a ceremonial office with no veto. Ratification takes two sessions. Arklith ends the decade with rules that outlast any single majority."
 ARK_wd_mil_rolls_ballot:0 "Provincial Ballots on the Rolls"
 ARK_wd_mil_rolls_ballot_desc:0 "The electoral rolls refreshed in the early nineties have been kept current, and the provincial councils have had a decade of practice. Councils are now chosen by ballot from the national rolls in every province, whatever the national order. Turnout in the highlands surprises everyone. Local politics finally has local voters."
 ARK_wd_mil_rolls_ballot_tt_2:0 "Provincial councils are chosen by ballot from the national rolls."
 ARK_wd_mil_yards_review:0 "The Yards After Ten Years"
 ARK_wd_mil_yards_review_desc:0 "The yards enter the century busier than they began the last one, and more exposed. A review walks every berth again, this time measuring order books, debts and the health of the small suppliers along the coast. Its authors warn that one failed buyer could test every promise the state has made, and within weeks one does."
 ARK_wd_mil_hull_contracts:0 "Long Contracts for Hulls"
 ARK_wd_mil_hull_contracts_desc:0 "The export yards move from single orders to series contracts, building whole classes of hulls for foreign lines over many years. Berths plan a decade ahead and suppliers invest with confidence. The yards are now bound to the health of distant shipping companies, and every downturn abroad arrives in Marcil a few months later."
 ARK_wd_mil_standing_squadron:0 "A Standing Escort Squadron"
 ARK_wd_mil_standing_squadron_desc:0 "The naval programme matures into a standing squadron of domestically built escorts with a fixed replacement cycle, so that a new hull leaves the yards every year whatever the budget mood. The navy finally plans beyond one election or one cabinet. The treasury loses a lever it used to pull every lean year."
 ARK_wd_mil_refit_network:0 "A Refit Network on the Coast"
 ARK_wd_mil_refit_network_desc:0 "The refit trade grows from a few quays into a network: repair yards on every stretch of the western coast sharing parts, crews and booking systems, so a damaged ship goes to the nearest free dock. Owners know the prices in advance. The yards never launch a famous ship, and never lack work either."
 ARK_wd_mil_guarantee_tested:0 "The Guarantee Fund Holds"
 ARK_wd_mil_guarantee_tested_desc:0 "The yards guarantee fund, mocked for a decade as a levy on success, pays the suppliers of the failed buyer within a month. Not one small firm on the coast closes because of the default. Owners stop complaining about the levy, and foreign lenders begin offering the yards better terms on the strength of the fund."
 ARK_wd_mil_usean_war:0 "War on the Usean Continent"
 ARK_wd_mil_usean_war_desc:0 "In 2003 war returns to the Usean continent, and the FCU founds the ISAF to fight it. Arklith is a world away and has no part in it. Its shipping lines, insurers and yards feel it at once: freight rates rise, charter demand jumps and every route near Usea becomes a calculation. The shipping office convenes the lines to decide an answer."
 ARK_wd_mil_peaceful_charters:0 "Charters for Peaceful Cargo"
 ARK_wd_mil_peaceful_charters_desc:0 "The lines take grain, machinery and building materials for economies disrupted by the war, under strict rules on what may be carried and where. Inspectors check every manifest, as they learned to in 1995. Revenue is strong and the yards gain repair work from ships on longer routes. The risk to crews remains real."
 ARK_wd_mil_home_waters:0 "Keep the Fleet in Home Waters"
 ARK_wd_mil_home_waters_desc:0 "The government asks the lines to keep their ships on routes far from the fighting until the war ends, offering port fee relief in return. Some lines comply and some reflag. The fleet earns less and loses no one. In the ports, crews home for longer spells are grateful, and the merchant families say so publicly."
 ARK_wd_mil_llano_review:0 "The Llano at the Millennium"
 ARK_wd_mil_llano_review_desc:0 "The metropolis has grown by a third since 1991, and its works have changed what they make. A review by the works council and the technical college asks which plants have a future in the new century. A new hall on the edge of Arklith goes to the strongest of them. The weakest learn that state orders will not last forever."
 ARK_wd_mil_basin_tools:0 "Drilling Tools Made in the Basin"
 ARK_wd_mil_basin_tools_desc:0 "The Halloma Basin enters the century with its oil better mapped and its forests better managed than before. A works for drilling equipment and pumps, built beside the field, keeps the maintenance money in the basin rather than paying foreign service firms. Operators sign long contracts. The basin begins making tools it once bought."
 ARK_wd_mil_open_contracts:0 "Publish the State Contracts"
 ARK_wd_mil_open_contracts_desc:0 "Yard credits, mining leases, road contracts and shelter supplies have all been awarded with little public scrutiny for a decade. An act requires every state contract above a modest value to be published with its price, supplier and delivery date. Suppliers who relied on quiet arrangements object. The next tenders come in noticeably cheaper."
 ac_wd_ark_tree:0 "Arklith: National Programme"
 ac_wd_ark_tree_desc:0 "The national focus programme of Arklith, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 ARK_wd_administration_review:0 "The Administration Under Review"
 ARK_wd_administration_review_desc:0 "The National Administration has published its own powers and invited the country to answer."
 ARK_wd_ducal_charter:0 "The Ducal Charter"
 ARK_wd_ducal_charter_desc:0 "A council of ministers governs beside the ducal title and answers to an elected chamber."
 ARK_wd_household_seals:0 "Seals of the Household"
 ARK_wd_household_seals_desc:0 "The ducal household holds the seals of state and names the ministers."
 ARK_wd_board_of_houses:0 "The Board of the Houses"
 ARK_wd_board_of_houses_desc:0 "Nominees of the yards, shipping lines and mines sit above the ministries."
 ARK_wd_civic_mandate:0 "The Civic Mandate"
 ARK_wd_civic_mandate_desc:0 "An elected civic assembly governs; the ducal title is ceremonial."
 ARK_wd_chamber_budget:0 "A Voted Budget"
 ARK_wd_chamber_budget_desc:0 "Every line of the national budget has passed an elected chamber."
 ARK_wd_houses_audit:0 "The Board Audit"
 ARK_wd_houses_audit_desc:0 "State services run on the board ledgers, trimmed of everything that did not pay."
 ARK_wd_ducal_constitution:0 "The Ducal Constitution"
 ARK_wd_ducal_constitution_desc:0 "One written text binds the council, the chamber and the ducal title."
 ARK_wd_household_code:0 "The Household Code"
