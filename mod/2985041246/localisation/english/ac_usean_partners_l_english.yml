 ac_up_uge_programme_desc:0 "A bounded national service capability, supported by continuing civilian allocations. Capacity indices are provisional gameplay measures."
 ac_up_del_programme:0 "Delarus: National Service Programme"
 ac_up_del_programme_desc:0 "A bounded national service capability, supported by continuing civilian allocations. Capacity indices are provisional gameplay measures."
 ac_up_sns_tree:0 "San Salvacion: Continuity and Civil Protection"
 ac_up_sns_tree_desc:0 "National capacity, enduring choices and practical services through the Usean crisis. The national programme branches are authored gameplay alternatives."
 SNS_up_district_switchboards:0 "Connect the District Switchboards"
 SNS_up_district_switchboards_desc:0 "Each district can reach the capital, but too few can reach one another. A common contact book will turn separate local services into a continuity network without claiming ownership of their records."
 SNS_up_district_switchboards_done:0 "Connect the District Switchboards completed"
 SNS_up_district_switchboards_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Unlock funded programme: Rehearse the Continuity Network."
 SNS_up_protection_inventory:0 "Inventory Civil Protection"
 SNS_up_protection_inventory_desc:0 "Shelter lists count doors while medical returns count beds. Comparing them will expose the journey between the two, where an emergency plan most often fails."
 SNS_up_protection_inventory_done:0 "Inventory Civil Protection completed"
 SNS_up_protection_inventory_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Unlock funded programme: Renew a Protection Service."
 SNS_up_dispatch_register:0 "A Register of Dispatches"
 SNS_up_dispatch_register_desc:0 "Instructions leave several offices with different signatures. A register will identify which instruction takes priority and who must explain a cancelled movement."
 SNS_up_dispatch_register_done:0 "A Register of Dispatches completed"
 SNS_up_dispatch_register_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Inspect the Dispatch Chain'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_local_switchboards:0 "Keep Local Switchboard Authority"
 SNS_up_local_switchboards_desc:0 "Local operators know which line fails in bad weather and which official will answer after midnight. Keeping that discretion protects public confidence but requires a larger standing service."
 SNS_up_local_switchboards_done:0 "Keep Local Switchboard Authority completed"
 SNS_up_local_switchboards_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Adopt the enduring policy shown below, including its continuing cost."
 SNS_up_central_dispatch:0 "Build a Central Dispatch Office"
 SNS_up_central_dispatch_desc:0 "A single dispatch office can move scarce crews quickly. Its authority improves coordination, while the districts give up some discretion and the office consumes political attention."
 SNS_up_central_dispatch_done:0 "Build a Central Dispatch Office completed"
 SNS_up_central_dispatch_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Adopt the enduring policy shown below, including its continuing cost."
 SNS_up_service_crews:0 "Put Service Crews on a Rota"
 SNS_up_service_crews_desc:0 "The same technicians cannot maintain a telephone exchange and repair a pumping station at once. A published rota makes that competition visible before anyone calls it an emergency."
 SNS_up_service_crews_done:0 "Put Service Crews on a Rota completed"
 SNS_up_service_crews_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Staff a Tested Relay Network'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_records_crosscheck:0 "Cross-check Missing Records"
 SNS_up_records_crosscheck_desc:0 "Local registers contain duplicates as well as omissions. Cross-checking the files improves continuity work and makes later service authorisations less demanding on institutional capacity."
 SNS_up_records_crosscheck_done:0 "Cross-check Missing Records completed"
 SNS_up_records_crosscheck_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Programme authorisations now consume one institutional capacity instead of two."
 SNS_up_water_desks:0 "Water and Sanitation Desks"
 SNS_up_water_desks_desc:0 "A functioning shelter is of little use without clean water and a maintenance contact. Small joint desks will keep those needs attached to the protection inventory."
 SNS_up_water_desks_done:0 "Water and Sanitation Desks completed"
 SNS_up_water_desks_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Inspect Shelter Water Turnover'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_route_permissions:0 "Standardise Route Permissions"
 SNS_up_route_permissions_desc:0 "A driver carrying an urgent consignment should not negotiate a different permission at every district office. Standard forms preserve accountability while giving dispatchers a usable route."
 SNS_up_route_permissions_done:0 "Standardise Route Permissions completed"
 SNS_up_route_permissions_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Inspect the Dispatch Chain'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_night_contacts:0 "Maintain the Night Contact Book"
 SNS_up_night_contacts_desc:0 "The official responsible for an overnight failure must be identifiable before the failure happens. Naming a duty contact protects the network from depending on a single familiar voice."
 SNS_up_night_contacts_done:0 "Maintain the Night Contact Book completed"
 SNS_up_night_contacts_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Staff a Tested Relay Network'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_volunteer_credentials:0 "Credential Civil Volunteers"
 SNS_up_volunteer_credentials_desc:0 "Experience and enthusiasm are different qualifications. A modest credential scheme will show which volunteers can handle first aid, communications or supervised shelter work."
 SNS_up_volunteer_credentials_done:0 "Credential Civil Volunteers completed"
 SNS_up_volunteer_credentials_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Credential a Replacement Protection Rota'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_depot_receipts:0 "Receipts at Every Depot"
 SNS_up_depot_receipts_desc:0 "A consignment is not delivered because it disappeared from the sending warehouse. Receiving signatures will give the dispatch service a record it can defend."
 SNS_up_depot_receipts_done:0 "Receipts at Every Depot completed"
 SNS_up_depot_receipts_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Inspect the Dispatch Chain'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_line_maintenance:0 "Give the Lines a Maintenance Window"
 SNS_up_line_maintenance_desc:0 "Routine inspection looks wasteful until a neglected connection is needed. Reserving maintenance windows makes the network more dependable at a continuing service cost."
 SNS_up_line_maintenance_done:0 "Give the Lines a Maintenance Window completed"
 SNS_up_line_maintenance_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Staff a Tested Relay Network'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_protected_rosters:0 "Protected Service Rosters"
 SNS_up_protected_rosters_desc:0 "Civil protection needs people who cannot simply be reassigned when another office is short of staff. Protected rosters preserve that capacity and expose its opportunity cost."
 SNS_up_protected_rosters_done:0 "Protected Service Rosters completed"
 SNS_up_protected_rosters_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Credential a Replacement Protection Rota'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_allocation_board:0 "An Accountable Allocation Board"
 SNS_up_allocation_board_desc:0 "An allocation board will hear competing requests for vehicles and technical crews. Its purpose is to leave an intelligible record of which service had to wait."
 SNS_up_allocation_board_done:0 "An Accountable Allocation Board completed"
 SNS_up_allocation_board_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Inspect the Dispatch Chain'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_continuity_manual:0 "Issue the Continuity Manual"
 SNS_up_continuity_manual_desc:0 "The manual will describe how the offices work when the capital cannot answer. It turns the contact book into a continuing national service rather than an opening exercise."
 SNS_up_continuity_manual_done:0 "Issue the Continuity Manual completed"
 SNS_up_continuity_manual_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Advance this service's completed milestone to 1/4."
 SNS_up_protection_charter:0 "A Civil Protection Charter"
 SNS_up_protection_charter_desc:0 "Local authorities will know the minimum service they are expected to maintain and the assistance they may request. The charter strengthens protection while preserving the budget argument that pays for it."
 SNS_up_protection_charter_done:0 "A Civil Protection Charter completed"
 SNS_up_protection_charter_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Advance this service's completed milestone to 1/4."
 SNS_up_dispatch_service:0 "Establish the Dispatch Service"
 SNS_up_dispatch_service_desc:0 "A permanent dispatch service can support later relief and reconstruction. Its standing obligations remain separate from any promise of military alignment."
 SNS_up_dispatch_service_done:0 "Establish the Dispatch Service completed"
 SNS_up_dispatch_service_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Advance this service's completed milestone to 1/4."
 SNS_up_district_exercises:0 "District Continuity Exercises"
 SNS_up_district_exercises_desc:0 "Practice will begin with ordinary failures rather than a prediction of the next catastrophe. Districts must demonstrate how they keep essential instructions moving when an office closes."
 SNS_up_district_exercises_done:0 "District Continuity Exercises completed"
 SNS_up_district_exercises_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Earn the named capability required for 'Open an Accountable Family Contact Service'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_shelter_keys:0 "Account for the Shelter Keys"
 SNS_up_shelter_keys_desc:0 "A shelter plan must identify who opens the building and who checks it afterward. Recording those responsibilities is more useful than counting every public room as available capacity."
 SNS_up_shelter_keys_done:0 "Account for the Shelter Keys completed"
 SNS_up_shelter_keys_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Earn the named capability required for 'Inspect a Staffed Medical Receiving Reserve'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_international_warning:0 "Read the International Warning"
 SNS_up_international_warning_desc:0 "The April 1996 warning changes the scale of contingency planning. Officials must explain what is known and what remains uncertain without treating a scientific forecast as a timetable for panic."
 SNS_up_international_warning_done:0 "Read the International Warning completed"
 SNS_up_international_warning_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation."
 SNS_up_distributed_shelters:0 "A Distributed Shelter Charter"
 SNS_up_distributed_shelters_desc:0 "Local protection sites reduce dependence on a few central locations. Maintaining them places a continuing burden on construction and inspection services."
 SNS_up_distributed_shelters_done:0 "A Distributed Shelter Charter completed"
 SNS_up_distributed_shelters_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Adopt the enduring policy shown below, including its continuing cost."
 SNS_up_priority_corridors:0 "Reserve Priority Corridors"
 SNS_up_priority_corridors_desc:0 "Priority corridors concentrate the available dispatch capacity on movements the administration can sustain. Ordinary traffic bears some of the cost of keeping those routes ready."
 SNS_up_priority_corridors_done:0 "Reserve Priority Corridors completed"
 SNS_up_priority_corridors_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Adopt the enduring policy shown below, including its continuing cost."
 SNS_up_scientific_liaison:0 "A Scientific Liaison Rota"
 SNS_up_scientific_liaison_desc:0 "The warning must reach the people who maintain public instructions. A liaison rota keeps revisions attached to decisions instead of leaving a changing forecast on an unattended desk."
 SNS_up_scientific_liaison_done:0 "A Scientific Liaison Rota completed"
 SNS_up_scientific_liaison_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Earn the named capability required for 'Assign a Civil Scientific Liaison'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_family_enquiries:0 "A Common Family Enquiry Form"
 SNS_up_family_enquiries_desc:0 "People seek information through whichever office they can reach. A common form will make those enquiries usable across the continuity network while keeping access accountable."
 SNS_up_family_enquiries_done:0 "A Common Family Enquiry Form completed"
 SNS_up_family_enquiries_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Programme authorisations now consume one institutional capacity instead of two. Earn the named capability required for 'Open an Accountable Family Contact Service'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_medical_reserve_lists:0 "Reconcile Medical Reserve Lists"
 SNS_up_medical_reserve_lists_desc:0 "Medical stores and trained staff need separate returns. The protection service will identify the gaps that a pile of unopened supplies cannot fill."
 SNS_up_medical_reserve_lists_done:0 "Reconcile Medical Reserve Lists completed"
 SNS_up_medical_reserve_lists_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Earn the named capability required for 'Inspect a Staffed Medical Receiving Reserve'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_forecast_revisions:0 "Explain Revised Forecasts"
 SNS_up_forecast_revisions_desc:0 "A revision is not evidence that every earlier instruction was dishonest. Officials will explain what changes in the estimate require practical changes in local planning."
 SNS_up_forecast_revisions_done:0 "Explain Revised Forecasts completed"
 SNS_up_forecast_revisions_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Earn the named capability required for 'Assign a Civil Scientific Liaison'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_evacuation_contacts:0 "Contacts before Evacuation Orders"
 SNS_up_evacuation_contacts_desc:0 "An evacuation instruction must name a destination and a receiving office. Contact work preserves continuity even when movement cannot begin immediately."
 SNS_up_evacuation_contacts_done:0 "Contacts before Evacuation Orders completed"
 SNS_up_evacuation_contacts_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Earn the named capability required for 'Open an Accountable Family Contact Service'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_shelter_inspections:0 "Shelter Inspection Intervals"
 SNS_up_shelter_inspections_desc:0 "Inspection teams will revisit sites rather than treating a completed form as permanent proof of readiness. Longer protection services become possible when those intervals are credible."
 SNS_up_shelter_inspections_done:0 "Shelter Inspection Intervals completed"
 SNS_up_shelter_inspections_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Earn the named capability required for 'Inspect a Staffed Medical Receiving Reserve'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_stonehenge_access:0 "Account for Stonehenge Access"
 SNS_up_stonehenge_access_desc:0 "The existing railgun complex creates civilian access, security and service questions. Recording those burdens does not grant the national programme authority to create, seize or operate the project."
 SNS_up_stonehenge_access_done:0 "Account for Stonehenge Access completed"
 SNS_up_stonehenge_access_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Earn the named capability required for 'Assign a Civil Scientific Liaison'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_backup_registers:0 "Keep Backup Registers Outside the Main Office"
 SNS_up_backup_registers_desc:0 "A second copy helps only if it can be found without the first office. The network will test retrieval and custody instead of merely duplicating paper."
 SNS_up_backup_registers_done:0 "Keep Backup Registers Outside the Main Office completed"
 SNS_up_backup_registers_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Earn the named capability required for 'Open an Accountable Family Contact Service'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_water_reserve_checks:0 "Check the Water Reserve Plan"
 SNS_up_water_reserve_checks_desc:0 "Water handling requires transport, treatment and responsible staff. Rehearsing that chain makes the protection inventory a service the government can call upon."
 SNS_up_water_reserve_checks_done:0 "Check the Water Reserve Plan completed"
 SNS_up_water_reserve_checks_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Earn the named capability required for 'Inspect Shelter Water Turnover'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_project_burden_review:0 "Review the Project's Civil Burden"
 SNS_up_project_burden_review_desc:0 "Technical importance does not make support work free. The administration will record the ordinary service capacity committed around Stonehenge without changing its owning project state."
 SNS_up_project_burden_review_done:0 "Review the Project's Civil Burden completed"
 SNS_up_project_burden_review_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation."
 SNS_up_mutual_contact_drill:0 "A Mutual Contact Drill"
 SNS_up_mutual_contact_drill_desc:0 "Neighbouring desks will test the route by which an urgent question becomes an acknowledged answer. The drill improves local continuity regardless of a later diplomatic offer."
 SNS_up_mutual_contact_drill_done:0 "A Mutual Contact Drill completed"
 SNS_up_mutual_contact_drill_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Advance this service's completed milestone to 2/4."
 SNS_up_civil_instruction_cards:0 "Practical Civil Instruction Cards"
 SNS_up_civil_instruction_cards_desc:0 "Public instructions will identify actions people can actually take. Their value lies in the services prepared before the crisis, not in distributing a reassuring card afterward."
 SNS_up_civil_instruction_cards_done:0 "Practical Civil Instruction Cards completed"
 SNS_up_civil_instruction_cards_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Advance this service's completed milestone to 2/4."
 SNS_up_preparedness_record:0 "Close the Preparedness Record"
 SNS_up_preparedness_record_desc:0 "The service will record the preparations completed before the July 1999 crisis. Later repairs remain useful, but cannot be backdated into that preparation record."
 SNS_up_preparedness_record_done:0 "Close the Preparedness Record completed"
 SNS_up_preparedness_record_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Work completed before 8 July 1999 also records one preparation credit; later domestic work grants no retrospective preparation. Advance this service's completed milestone to 2/4."
 SNS_up_local_relay_plans:0 "Keep Local Relays Working"
 SNS_up_local_relay_plans_desc:0 "The continuity network must remain useful when central offices are overloaded. Relay plans give local operators a defined responsibility instead of an unlimited emergency mandate."
 SNS_up_local_relay_plans_done:0 "Keep Local Relays Working completed"
 SNS_up_local_relay_plans_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Staff a Tested Relay Network'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_receiving_points:0 "Name the Receiving Points"
 SNS_up_receiving_points_desc:0 "Relief movements require somewhere to arrive and someone to take responsibility. The protection service will publish receiving points sized to actual local capacity."
 SNS_up_receiving_points_done:0 "Name the Receiving Points completed"
 SNS_up_receiving_points_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Inspect Shelter Water Turnover'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_after_the_crisis:0 "The Service after Ulysses"
 SNS_up_after_the_crisis_desc:0 "The crisis makes it necessary to distinguish preparations from repairs. Current service work can protect people and restore routines without claiming an earlier state of readiness."
 SNS_up_after_the_crisis_done:0 "The Service after Ulysses completed"
 SNS_up_after_the_crisis_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Dispatch an Accountable Mobile Service Desk'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_civilian_continuity:0 "Protect Civilian Continuity"
 SNS_up_civilian_continuity_desc:0 "Civil records, family enquiries and essential services receive a protected allocation. The policy supports confidence while reducing the attention available for military mobilisation."
 SNS_up_civilian_continuity_done:0 "Protect Civilian Continuity completed"
 SNS_up_civilian_continuity_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Adopt the enduring policy shown below, including its continuing cost."
 SNS_up_command_circuits:0 "Reserve Command Circuits"
 SNS_up_command_circuits_desc:0 "The command chain receives dependable communications at a continuing civil cost. This helps organise existing forces and does not decide whether the continental war begins."
 SNS_up_command_circuits_done:0 "Reserve Command Circuits completed"
 SNS_up_command_circuits_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Adopt the enduring policy shown below, including its continuing cost."
 SNS_up_repair_requests:0 "Triage Repair Requests"
 SNS_up_repair_requests_desc:0 "The service will separate repairs that restore a useful route from requests that merely clear an embarrassing report. Dispatch discipline makes the distinction enforceable."
 SNS_up_repair_requests_done:0 "Triage Repair Requests completed"
 SNS_up_repair_requests_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Dispatch an Accountable Mobile Service Desk'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_mobile_desks:0 "Prepare Mobile Service Desks"
 SNS_up_mobile_desks_desc:0 "A mobile desk carries authority and records, not simply a vehicle. Teams will practise operating away from their usual office without losing the chain of responsibility."
 SNS_up_mobile_desks_done:0 "Prepare Mobile Service Desks completed"
