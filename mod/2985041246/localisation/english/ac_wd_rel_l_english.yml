l_english:
 REL_wd_gov_chamber_meets:0 "The Relentian Chamber Sits"
 REL_wd_gov_chamber_meets_desc:0 "Relentio governs itself with a ducal crown, an office of state and a chamber gathered from the Sofern harbour councils, the valley towns around Driscol and the Torre Mountain districts. Nobody has yet agreed how those three bodies share power. Opening the question in public costs the office its quiet, but it gives every faction a seat."
 REL_wd_gov_powers_list:0 "What the Ducal Crown May Do"
 REL_wd_gov_powers_list_desc:0 "Clerks list the powers the ducal office actually holds: naming ministers, sealing the budget, commanding the coast guard and dissolving the chamber. Much of the list was written for a crown land and now answers to no throne beyond its own. Publishing it spends goodwill and forces a choice between three ways of governing."
 REL_wd_gov_powers_list_tt_1:0 "Opens three constitutional paths; only one can be taken."
 REL_wd_gov_duchy_path:0 "A Duchy Bound by Its Chamber"
 REL_wd_gov_duchy_path_desc:0 "The constitutional camp would keep the ducal crown and make the cabinet answer to the chamber. Ministers would face questions, budgets would be voted line by line, and the ducal office would sign on advice. It is the most familiar arrangement for a former crown land, and it costs the office its freedom to act alone."
 REL_wd_gov_seals_path:0 "The Seals Stay with the Duchy"
 REL_wd_gov_seals_path_desc:0 "Shipowners and senior officials argue that a small state with one great port cannot wait on chamber votes when a freighter is impounded or a bank wobbles. They want the seals, the budget and the coast guard kept by a council the ducal office names. Decisions come fast, and the chamber becomes a place to complain."
 REL_wd_gov_republic_path:0 "Merchants Propose a Republic"
 REL_wd_gov_republic_path_desc:0 "The harbour councils of Sofern have long run their own quays, and many of their members see no reason to keep a crown at all. They propose an elected executive and a Republic of Relentio, with the ducal title retired to the museums. The ports cheer the idea; the valley towns and the officer corps are far less sure."
 REL_wd_gov_ducal_ministry:0 "Form the Ducal Ministry"
 REL_wd_gov_ducal_ministry_desc:0 "A cabinet drawn from the chamber majority takes the seals and governs collectively in the name of the ducal crown. The change runs through an office, not a person, and the ministry answers for every budget it passes. The ducal office keeps its ceremonies and hands its daily authority to people who must win elections."
 REL_wd_gov_seals_council:0 "Name the Council of Seals"
 REL_wd_gov_seals_council_desc:0 "The ducal office names a small council to hold the seals, the budget and the coast guard, with elections suspended while it governs by order. The chamber survives as an advisory body that meets when it is called. The council is quick and narrow, and every failure from now on will carry its name rather than a minister's."
 REL_wd_gov_harbour_republic:0 "Proclaim the Harbour Republic"
 REL_wd_gov_harbour_republic_desc:0 "The chamber votes a republican charter and elects an executive council from its own benches, with elections fixed on a calendar that no office can move. The ducal crown becomes a coat of arms. Shipowners gain a government that thinks like them, and the valley towns must now win their arguments by votes."
 REL_wd_gov_question_days:0 "Ministers Answer on Fridays"
 REL_wd_gov_question_days_desc:0 "Every Friday the ministers stand in the chamber and take questions from any deputy, broadcast on Sofern radio. Quayside rumours that once lived for weeks are answered in an afternoon. The ministry looks weaker for a while and the coast guard dislikes explaining itself in public. Over the years, people come to trust what they hear argued."
 REL_wd_gov_seals_inspectors:0 "Council Inspectors on the Quays"
 REL_wd_gov_seals_inspectors_desc:0 "The council sends its own inspectors to the customs sheds, the yards and the valley payrolls with authority to stop any contract on the spot. Petty theft drops quickly and so does initiative, because clerks learn to wait for an inspector before signing anything. The council gains control of the money and loses early warning of bad news."
 REL_wd_gov_ports_senate:0 "A Senate of Ports and Valleys"
 REL_wd_gov_ports_senate_desc:0 "The republic adds a second chamber in which the harbour councils, the valley towns and the Torre Mountain districts sit as equals, whatever their population. Sofern loses the easy majority it expected, and the valley gains a veto over port spending. Lawmaking slows, but no single district can capture the republic it helped found."
 REL_wd_gov_civil_service:0 "A Relentian Civil Service"
 REL_wd_gov_civil_service_desc:0 "Whatever constitution prevails, the government needs clerks who answer to Relentio rather than to habits from the crown-land years. A civil service board writes job descriptions, pay grades and a code of conduct for every ministry. Staffing it pulls able people out of the ports and the valley firms, and their employers complain loudly."
 REL_wd_harb_customs_count:0 "Weigh the Sofern Customs"
 REL_wd_harb_customs_count_desc:0 "Sofern is the largest port Relentio has, and its customs sheds are the first money the treasury can count on. Nobody has measured exactly what passes the quays, who pays duty and who has a friend at the gate. A full count of cargo and receipts costs a season of clerical work and a few uncomfortable dinners."
 REL_wd_harb_councils:0 "Charter the Harbour Councils"
 REL_wd_harb_councils_desc:0 "The merchants and dockers of Sofern already run their quays through harbour councils, as they did in the crown-land years. Giving those councils a written charter, a budget line and a seat at the customs table buys the loyalty of the port. The price is that the councils will expect to be asked before every harbour decision."
 REL_wd_harb_quay_road:0 "Rebuild the Quay Roads"
 REL_wd_harb_quay_road_desc:0 "Trucks queue for hours on the narrow roads between the Sofern quays and the main highway, and spoiled cargo is written off every summer. Widening the approaches and adding rail sidings is unglamorous work that pays back within a few years. The city suffers a season of closures, and the hauliers complain until the first lane opens."
 REL_wd_harb_fraeport:0 "Deepen the Fraeport Berths"
 REL_wd_harb_fraeport_desc:0 "Fraeport in North Relentio handles coastal freight and fishing boats, but its berths silt up and larger ships anchor offshore to unload by lighter. Dredging the channel and rebuilding the quay road lets the second port take traffic Sofern cannot. Sofern merchants grumble about subsidising a rival, and the dredgers must return every few years."
 REL_wd_harb_free_port:0 "A Free Port at Sofern"
 REL_wd_harb_free_port_desc:0 "The merchant school wants Sofern declared a free port: low duties, bonded warehouses and foreign firms welcome to trade through the quays. Cargo volumes would rise quickly and so would rents. The treasury gives up a large share of its customs income for a busier port, betting that trade will pay in other ways."
 REL_wd_harb_port_authority:0 "One Authority for Every Quay"
 REL_wd_harb_port_authority_desc:0 "The administrative school wants a single public port authority to own the quays, set the tariffs and plan dredging for Sofern and Fraeport together. Revenue stays with the state and investment follows a plan. The harbour councils lose their private arrangements, and some shippers move to ports where nobody asks questions."
 REL_wd_harb_bonded_sheds:0 "Bonded Sheds on the Waterfront"
 REL_wd_harb_bonded_sheds_desc:0 "Free-port status means little without warehouses where foreign goods can wait duty-free. A row of bonded sheds and light workshops rises beside the main quay, built with merchant money on public land. Rents climb across the harbour district, and residents who lived there for decades start moving inland."
 REL_wd_harb_authority_works:0 "Port Workshops at Fraeport"
 REL_wd_harb_authority_works_desc:0 "The port authority builds a repair and fabrication district at Fraeport to serve both harbours, financed from the tariffs it now collects directly. Cranes, engines and refrigeration units are fixed at home instead of abroad. The workshops are slow to turn a profit, and Sofern deputies ask why their tariffs build someone else's town."
 REL_wd_harb_pilots:0 "Pilots and Tugs for the Channel"
 REL_wd_harb_pilots_desc:0 "Ships entering Sofern rely on harbour pilots and tugs whose boats are older than most of their crews. A new pilot school and a modest tug fleet cut waiting times and the risk of a grounding that would close the channel for weeks. Pilots win better pay, and shipowners pay higher fees on every visit."
 REL_wd_harb_ship_register:0 "A Relentian Ship Register"
 REL_wd_harb_ship_register_desc:0 "Many ships owned in Sofern still carry papers issued in the crown-land years. A Relentian register records every hull, owner, crew list and usual route. Owners dislike the paperwork and the fees, and a few reflag abroad. In any crisis, though, the government will know exactly which ships are its own."
 REL_wd_harb_insurance:0 "A Marine Insurance Exchange"
 REL_wd_harb_insurance_desc:0 "Sofern shippers buy cover in foreign markets that raise premiums whenever a war starts anywhere near the coast. A local insurance exchange, backed by a modest state guarantee, keeps some of that money at home and prices risk with local knowledge. A single bad loss could drain the guarantee, and foreign underwriters will not welcome the rival."
 REL_wd_treas_open_books:0 "Open the First Relentian Budget"
 REL_wd_treas_open_books_desc:0 "Relentio has a government but only the outline of a treasury: customs offices, district tax rolls copied from older files and obligations whose full size nobody has agreed. The first budget must say what the state owns, what it owes and what it can afford this year. Writing it honestly will frighten the chamber."
 REL_wd_treas_tax_roll:0 "A Tax Roll for Every District"
 REL_wd_treas_tax_roll_desc:0 "Tax records in the valley and the Torre Mountain districts are old, incomplete and often kept in someone's cupboard. Assessors visit every farm, workshop and warehouse to build one roll the treasury can trust. Assessment costs salaries and goodwill, and some families discover they have underpaid for years and must now catch up."
 REL_wd_treas_customs_share:0 "Customs as First Revenue"
 REL_wd_treas_customs_share_desc:0 "Until the tax roll is finished, harbour duty is almost the only income the treasury can collect on time. Ministers pledge the first year of customs receipts to salaries and pensions rather than to any new programme. It keeps the state solvent and the clerks paid, and it makes the treasury hostage to every slow month at the quays."
 REL_wd_treas_sound:0 "Balanced Books First"
 REL_wd_treas_sound_desc:0 "The cautious school wants every budget balanced, every loan published and no new borrowing until the treasury has a record lenders respect. Public works slow and the valley firms wait for credit. In exchange, Relentio pays little interest, and nobody abroad doubts that its government means what it signs."
 REL_wd_treas_credit:0 "Credit for the Works"
 REL_wd_treas_credit_desc:0 "The development school wants a state credit bank that lends to the valley halls, the yards and the port workshops at low rates. Growth comes faster and jobs stay local. The treasury carries the risk of every failed loan, and lenders will charge a little more each time the chamber raises the borrowing limit."
 REL_wd_treas_audit_office:0 "An Audit Office Above Party"
 REL_wd_treas_audit_office_desc:0 "An independent audit office checks every ministry's accounts each year and reports to the chamber rather than to the government of the day. Its first report embarrasses several departments. Auditors cost little; their real price is that no government, whatever its politics, can hide its own mistakes for long."
 REL_wd_treas_audit_office_tt_1:0 "Every ministry is audited each year from this point on."
 REL_wd_treas_harbour_bond:0 "A Harbour Bond Issue"
 REL_wd_treas_harbour_bond_desc:0 "The credit bank raises its first money through a bond sold to Sofern savers and foreign buyers, secured on future port revenue. The proceeds fund a new hall for machine parts in the Relentio valley. Interest will be owed for twenty years, and the port's income is now promised to bondholders before ministers."
 REL_wd_treas_savings_banks:0 "Savings Banks in the Valley"
 REL_wd_treas_savings_banks_desc:0 "Valley families keep their savings in cash or in banks headquartered elsewhere. A network of small public savings banks in Driscol and the valley towns gives them a safe place at home, and lends the deposits to local builders for roads and houses. The banks need careful supervision and a reserve in case of a run."
 REL_wd_treas_statistics:0 "A Statistics Office"
 REL_wd_treas_statistics_desc:0 "The government argues about prices, wages and trade with numbers from three sources that never agree. A statistics office publishes one set of figures every quarter, gathered by its own surveyors. Ministers lose the right to choose their favourite numbers, and the chamber gains a common basis for every argument that follows."
 REL_wd_treas_reserve:0 "A Reserve for Lean Seasons"
 REL_wd_treas_reserve_desc:0 "Whichever fiscal school prevailed, the treasury sets aside a fund for the year a big shipper fails or the quays go quiet. It earns little, sits in safe paper and is the first thing every minister wants to spend. If it survives the budget rounds, the next downturn lands on a cushion rather than on payrolls."
 REL_wd_vall_walk_halls:0 "Walk the Valley Arms Halls"
 REL_wd_vall_walk_halls_desc:0 "Relentio's industry rests on arms halls in the Relentio valley around Driscol and a heavy cluster at Torre Mountain, built for a larger kingdom's army and now serving a much smaller state. An inspection team walks every line and counts what runs, what idles and what was never finished. The answer shapes every industrial choice that follows."
 REL_wd_vall_torre_road:0 "The Torre Mountain Haul Road"
 REL_wd_vall_torre_road_desc:0 "Ore, steel and finished goods leave Torre Mountain on a winding road that closes with every heavy storm. Rebuilding it with proper grades, bridges and passing places keeps the halls and mines supplied all year. Engineers spend two seasons on the slopes, and the mountain towns finally get a reliable route to the coast."
 REL_wd_vall_civil:0 "Tractors Instead of Tank Parts"
 REL_wd_vall_civil_desc:0 "The conversion camp wants the valley halls retooled for tractors, pumps, rail wagons and machine tools that a small trading state can actually sell. Workers keep their jobs, though output falls for a year while lines are rebuilt. The army loses capacity it may later regret, and the arms buyers who knew the valley go elsewhere."
 REL_wd_vall_export:0 "Arms Lines Kept for Export"
 REL_wd_vall_export_desc:0 "The export camp says the halls are Relentio's most valuable industrial asset and should keep making shells, rifles and vehicle parts for licensed foreign buyers. Revenue arrives quickly and the skilled workforce stays together. The state now depends on other countries' wars, and every contract invites questions about who will use the goods."
 REL_wd_vall_machine_tools:0 "Machine Tools from Shell Lines"
 REL_wd_vall_machine_tools_desc:0 "Lathes and presses from idle shell lines are rebuilt into a machine-tool works at Driscol that supplies the yards, the port workshops and the farms. It is the first valley plant designed for civilian customers from the start. Retraining takes a year, and engineers who preferred weapons work leave for jobs abroad."
 REL_wd_vall_trucks:0 "Valley Trucks for Valley Roads"
 REL_wd_vall_trucks_desc:0 "The converted halls build a simple, rugged truck for farms, quarries and the Torre Mountain haul road. It will never win a design prize, but parts are cheap and every village mechanic can fix it. Orders from the state and the harbour councils keep the line open while it learns to sell further afield."
 REL_wd_vall_licences:0 "Export Licences and End Users"
 REL_wd_vall_licences_desc:0 "An export board licenses every sale from the valley lines and checks where each shipment finally goes. The halls near Driscol add a line to meet the first contracts. The board is only as honest as the people who sit on it, and each refused buyer is an order a competitor will gladly take."
 REL_wd_vall_proof_range:0 "A Proof Range at Torre Mountain"
 REL_wd_vall_proof_range_desc:0 "Shells and rockets from Torre Mountain have always been tested at ranges outside Relentio. A proof range on the high ground lets the halls test their own output and fix faults before foreign inspectors find them. Nearby farms object to the noise, and the range must be fenced, staffed and insured."
 REL_wd_vall_north_plant:0 "An Engine Works at Fraeport"
 REL_wd_vall_north_plant_desc:0 "North Relentio has fewer industrial jobs than the valley, and its young workers drift south to Sofern every year. An engine and pump works at Fraeport gives the north steady employment and the ports a nearby supplier. The first two years cost far more than they earn while crews learn the trade."
 REL_wd_vall_housing:0 "Housing for the Valley Shifts"
 REL_wd_vall_housing_desc:0 "Valley workers commute for hours from villages because the towns near the halls never built enough housing. A housing programme with new roads and bus routes around Driscol cuts the journey and fills the night shifts. Builders profit, land prices rise, and older residents say the town they knew is disappearing."
 REL_wd_vall_metals:0 "Steel and Tungsten Contracts"
 REL_wd_vall_metals_desc:0 "The tungsten and steel of Faroe and the heavier ore beds of Torre Mountain have mostly left as raw rock. Long contracts with the valley halls and the yards keep more of that metal at home, at prices fixed for five years. Mine owners give up the chance of a boom and gain certainty, which their banks reward."
 REL_wd_nb_envoys:0 "Envoys to Gatewood"
 REL_wd_nb_envoys_desc:0 "Perbla is Relentio's nearest neighbour and the state its people know best, from courts and schools to rail timetables and family ties. The first Relentian envoys to Gatewood must settle practical matters before grand ones: post, pensions, transit and shared files. How the talks begin will colour every agreement after them."
 REL_wd_nb_transit:0 "Transit Papers with Perbla"
 REL_wd_nb_transit_desc:0 "Goods from the Relentian quays reach the interior on Perblan rails and roads, and Perblan cargo uses Relentian berths. A transit agreement sets the paperwork, the fees and the inspection points so that trains do not wait days at a frontier desk. Both sides give a little, and the hauliers notice the difference within a month."
 REL_wd_nb_sister_lands:0 "Letters to Serenava and Terentio"
 REL_wd_nb_sister_lands_desc:0 "Serenava and Terentio were crown lands alongside Relentio, and their towns share courts, customs habits and many family names with the ports. Whatever their governments now are, Relentio writes to their authorities about trade, students and pensions. The letters claim nothing and promise little, but they keep old roads of contact open."
 REL_wd_nb_sister_lands_tt_1:0 "No claim, core or border changes; contacts concern trade, students and pensions only."
 REL_wd_nb_gatewood:0 "Close Ties with Gatewood"
 REL_wd_nb_gatewood_desc:0 "One camp wants Relentio to stay close to Perbla: shared standards, coordinated tariffs and regular meetings between ministers. Trade with the interior flows easily and old networks keep working. Critics warn that Relentio risks becoming a province by contract, and Osean buyers wonder whether Sofern makes its own decisions at all."
 REL_wd_nb_osea:0 "Open the Port to Osean Trade"
 REL_wd_nb_osea_desc:0 "Another camp looks past Perbla to Osea, a vast market and the biggest customer any port could want. Osean shipping lines would get favourable berths and Osean firms easy access to the valley halls. Revenue rises fast. Gatewood will read the choice as a statement, and the valley's old customers will notice."
 REL_wd_nb_neutral:0 "A Harbour for Every Flag"
 REL_wd_nb_neutral_desc:0 "A third camp wants no special friends at all. Relentio would treat every flag alike at its quays, publish one tariff for everyone and stay out of every bloc. Neutrality suits a small trading state and annoys every large one, and it only works if the coast guard can enforce the rules the government publishes."
 REL_wd_nb_timetables:0 "Shared Timetables with Perbla"
 REL_wd_nb_timetables_desc:0 "Relentian and Perblan rail planners agree common timetables, through tickets and shared freight wagons on the line from Torre Mountain to the interior. Travellers stop changing trains at the frontier and freight clears faster. The arrangement ties Relentian rail closely to Perbla's network, which pleases hauliers and worries the ports."
 REL_wd_nb_osean_agents:0 "Osean Shipping Agents at Sofern"
 REL_wd_nb_osean_agents_desc:0 "Osean shipping lines open agencies on the Sofern waterfront and sign long berth contracts for their freighters. Dock work becomes steadier and wages rise. Local shipowners lose their best berths to larger foreign fleets, and the harbour councils argue every month about whether the port still belongs to the people who work in it."
 REL_wd_nb_flag_registry:0 "Neutral Papers for Foreign Hulls"
 REL_wd_nb_flag_registry_desc:0 "Foreign shipowners who want neutral papers can register their hulls in Sofern for a fee, under rules on safety and crew pay that the coast guard actually inspects. The registry earns steady revenue and makes the Relentian flag common on distant seas. Each badly run ship under that flag becomes Relentio's embarrassment in someone else's port."
 REL_wd_nb_trade_fair:0 "The Sofern Trade Fair"
 REL_wd_nb_trade_fair_desc:0 "Whatever partners Relentio chose, its products need buyers who have seen them. A yearly fair on the Sofern waterfront gathers the valley manufacturers, the yard repair firms and the port services in one hall. Hotels fill for a week, foreign delegations sign letters of intent, and the government learns which industries actually sell."
 REL_wd_def_count:0 "Who Guards the Relentian Coast"
 REL_wd_def_count_desc:0 "Relentio's armed forces begin with whatever hulls, aircraft and trained crews are Relentian today: patrol boats at Sofern, a few aircraft on the city field and reservists who learned their trade in a larger service. A frank count shows what can sail and fly this month. The answer is modest, and the officers know it."
 REL_wd_def_marines:0 "Marine Companies at Sofern"
 REL_wd_def_marines_desc:0 "Relentio's marines are few but trained for exactly the jobs a port state needs: securing quays, boarding suspect ships and landing on its own coast. Gathering them into proper companies with boats and radios at Sofern gives the government a fast response force. The army complains that marines take its best volunteers."
 REL_wd_def_sofern_field:0 "Hangars at the Sofern Field"
 REL_wd_def_sofern_field_desc:0 "The airfield outside Sofern was built for a larger air arm and now hosts a handful of aircraft and a great deal of empty concrete. New hangars, fuel stores and a repaired runway let the small air wing work from one well-kept base. The money could have built schools, and the teachers' unions say so in the papers."
 REL_wd_def_volunteers:0 "A Volunteer Defence Force"
 REL_wd_def_volunteers_desc:0 "The volunteer school wants a small, paid professional force: long-service sailors, marines and pilots on career contracts, with no conscription at all. Units stay together and master their equipment. The force is expensive per head and could not hold a long war alone, but a port state lives on trade and needs its workers on the quays."
 REL_wd_def_militia:0 "Harbour and Valley Militia"
 REL_wd_def_militia_desc:0 "The militia school wants every adult who once served to stay on local rolls, training a few weekends a year with the coast guard or the valley defence companies. Mobilisation would be quick and cheap, and the force could hold its home districts. Employers dislike losing workers to drills, and the militia's equipment will always be second-hand."
 REL_wd_def_patrol_boats:0 "Patrol Boats from Sofern Slipways"
 REL_wd_def_patrol_boats_desc:0 "The Sofern yards can build small patrol boats far faster than they could ever build a warship. A class of fast, lightly armed boats for fisheries, customs and rescue work replaces the oldest hulls. They are no match for a real navy, but they make the coast guard visible every day along the coast."
 REL_wd_def_coast_radar:0 "Radar Posts Above Fraeport"
 REL_wd_def_coast_radar_desc:0 "The northern approaches past Fraeport have no radar cover at all, and ships or aircraft can arrive there unannounced. A radar post on the high ground above the port, linked to the coast guard office, closes the gap. It costs little to build and much to staff around the clock, every night of the year."
 REL_wd_def_air_wing:0 "A Small Interceptor Wing"
 REL_wd_def_air_wing_desc:0 "The air staff concentrates its few modern aircraft in one interceptor wing at the Sofern field, trained to identify and escort intruders rather than to fight a long war. Pilots fly more hours and the wing becomes credible. Ground attack and transport work fall to older aircraft, and the army notices how little air support it now has."
 REL_wd_def_joint_staff:0 "One Staff for Sea and Air"
 REL_wd_def_joint_staff_desc:0 "Coast guard, marines and air wing have planned separately, each with its own radio net and maps. A joint staff writes common procedures for searches, boarding operations and air cover. Commanders lose some independence and resent the new paperwork. In return, a single crisis no longer produces three different answers from three offices."
 REL_wd_def_valley_strips:0 "Grass Strips Near Driscol"
 REL_wd_def_valley_strips_desc:0 "Every aircraft Relentio owns sits at the Sofern field, where one bad morning could end the air wing. Grass strips in the valley near Driscol, stocked with fuel and spare parts, give the wing other places to land and rearm. They are uncomfortable, need guards and are hard to supply in winter, but an enemy would have to find them one by one."
 REL_wd_war_news:0 "Sofern Hears of the Belkan War"
 REL_wd_war_news_desc:0 "Fighting around Belka from March 1995 changes life at Sofern long before any soldier is seen. Insurers raise premiums on every lane near the war, freight rates jump and foreign navies ask questions about cargo. Relentio is no party to the fighting, but its port, its ships and its valley halls are part of the market the war is reshaping."
 REL_wd_war_quay_watch:0 "Night Watch on the Quays"
 REL_wd_war_quay_watch_desc:0 "Strangers, smugglers and agents of every side drift into a busy neutral port during a nearby war. The coast guard posts night watches on the Sofern quays and installs a harbour radar to track every arrival. Watches cost overtime and slow cargo handling, and they keep the port from becoming a convenient stage for someone else's operations."
 REL_wd_war_berths:0 "Reception Berths at Sofern"
 REL_wd_war_berths_desc:0 "Ships arriving from the war zone carry people as well as cargo: families, deserters and sailors whose ships will not go home. Reception berths at Sofern register each arrival, provide food and a bed, and decide where they go next. The berths cost money and start arguments in the chamber, but without them every arrival becomes a crisis."
 REL_wd_war_close_port:0 "Close Sofern to War Cargo"
 REL_wd_war_close_port_desc:0 "The government bars munitions and military stores for any belligerent from the Relentian quays and the Relentian flag. Inspectors search suspicious holds and turn ships away. Trade falls and some shipowners move their registrations abroad. Relentio's neutrality becomes visible and believable, which matters more to a small state than a season of freight income."
 REL_wd_war_carry_all:0 "Carry Cargo for Anyone Who Pays"
 REL_wd_war_carry_all_desc:0 "The government lets Relentian ships and quays handle any lawful cargo for any customer, including the armies of countries at war. Freight rates are the highest in a generation and the valley halls fill export orders. Every side watches the port, and each shipload that reaches a front makes Relentio's neutrality look more like a business model."
 REL_wd_war_waldreich_winds:0 "Wind Reports After Waldreich"
 REL_wd_war_waldreich_winds_desc:0 "News that nuclear weapons were used in the Waldreich Mountains reaches Sofern by radio, and the first question in every kitchen is which way the wind blows. The observers and the coast guard publish daily wind and rain readings, and food inspectors test milk, fish and water. The readings will decide whether fear or facts set the public mood."
 REL_wd_war_contraband:0 "Search the Holds"
 REL_wd_war_contraband_desc:0 "The ship register tells inspectors which hulls are Relentian, who owns them and where they usually sail. Customs officers and marines board suspect freighters at the harbour mouth and check manifests against cargo. Owners complain about delays and some captains lie anyway, but each search tells the warring powers that Relentio watches its own ships."
 REL_wd_war_contraband_tt_1:0 "Relentian ships are searched under the register; foreign ships only with cause."
 REL_wd_war_gatewood_lanes:0 "Shared Convoy Schedules"
 REL_wd_war_gatewood_lanes_desc:0 "Relentian and Perblan shipping offices exchange sailing schedules, weather reports and warnings during the war, so that freighters from both countries avoid the same dangers. No warship changes flag and no convoy is placed under foreign command. The exchange saves ships and money, and critics in the chamber call it alignment by timetable."
 REL_wd_war_osean_charters:0 "Osean Charters Through the War"
 REL_wd_war_osean_charters_desc:0 "Osean shipping lines, already at home in Sofern, charter Relentian freighters to carry civilian goods while their own hulls serve the war. Rates are generous and crews earn bonuses. Belkan sympathisers in the valley protest, and insurers treat every Relentian ship as half Osean. The money is real, and so is the risk to the crews."
 REL_wd_war_neutral_colours:0 "Paint the Neutral Colours Large"
 REL_wd_war_neutral_colours_desc:0 "Every Relentian ship at sea paints its name, flag and neutral markings large on both sides of the hull and lights them at night. Captains report their positions to every side on open channels. It is an old practice that works only when everyone believes it, and the coast guard must punish any ship that abuses the markings."
 REL_wd_war_new_tenants:0 "From Berths to Tenancies"
 REL_wd_war_new_tenants_desc:0 "Families who came through the wartime reception berths still sleep in harbour sheds while their papers are processed. A placement office matches each household with a job on the North Relentio fishing boats or in coastal firms short of hands, and with rented rooms nearby. Within a year the arrivals pay taxes; the quarrel over their first rents lasts longer."
 REL_wd_war_stand_down:0 "Stand the Quays Down"
 REL_wd_war_stand_down_desc:0 "Once the fighting no longer threatens the shipping lanes, the coast guard returns to peacetime rotations, inspectors go back to ordinary customs work and the special wartime rules lapse. Standing down too early invites trouble; too late keeps freight expensive and the chamber restless. The government chooses a date, publishes it and keeps it."
 REL_wd_war_belka_beaten:0 "Trade After the Belkan Defeat"
 REL_wd_war_belka_beaten_desc:0 "With Belka defeated, the lanes near the war reopen to ordinary commerce and insurers slowly lower their rates. Rebuilding across the region needs ships, quays and machinery, and Sofern bids for the work alongside larger harbours. The valley halls lose their wartime orders, and the government must find them peacetime customers quickly."
 REL_wd_war_belka_prevails:0 "Trade With a Victorious Belka"
 REL_wd_war_belka_prevails_desc:0 "Belka comes out of its war the victor, and the pattern of trade around it shifts accordingly. Belkan buyers return to the market for steel, trucks and port services, while Osean lines grow cautious about every harbour that serves them. Relentio must decide how much Belkan business it wants and how loudly to say so."
 REL_wd_sky_warning:0 "The Ulysses Warning Reaches Sofern"
 REL_wd_sky_warning_desc:0 "The December 1994 notice about the asteroid Ulysses was a matter for astronomers. The April 1996 announcement that it will strike the Earth is a matter for every government, though nobody can yet say where its fragments will land. Relentio, whose people mostly live along the coast, must plan for a danger it cannot place on a map."
 REL_wd_sky_observatory:0 "An Observatory on Torre Mountain"
 REL_wd_sky_observatory_desc:0 "Torre Mountain's height makes it the natural place in Relentio to watch the sky. An observatory and a tracking radar on the heights, linked to the coast guard office, give the state its own eyes on Ulysses rather than foreign bulletins alone. Astronomers and radar engineers now share one hilltop and one tight budget."
 REL_wd_sky_tide_tables:0 "Flood and Tide Tables"
 REL_wd_sky_tide_tables_desc:0 "Engineers warn that a fragment falling at sea could raise waves along the whole coast. Surveyors map which streets of Sofern, Fraeport and the low coastal districts would flood, and publish tide and evacuation tables for each one. The maps lower property values in the lowest streets, and their owners demand compensation."
 REL_wd_sky_hospitals:0 "Field Hospitals in the Hills"
 REL_wd_sky_hospitals_desc:0 "Whatever happens, injured people will need beds far from the coast. Field hospitals are prepared in schools and halls in the Torre Mountain districts, with stored equipment and volunteer staff trained twice a year. Doctors in Sofern grumble about the drills and the equipment ages in storage, but no city will depend on a single hospital."
 REL_wd_sky_cellars:0 "Shelters Under Sofern and Driscol"
 REL_wd_sky_cellars_desc:0 "The engineering school wants deep shelters under the two largest cities, stocked with water, power and food for weeks. Construction diverts steel and crews from the yards and the valley halls for years. Should fragments fall nearby, hundreds of thousands have a place to go; should they miss, the cost will be argued over for decades."
 REL_wd_sky_evacuation:0 "Evacuation by Sea and Rail"
 REL_wd_sky_evacuation_desc:0 "The planning school would rather buy hours of warning than tons of concrete. Ferries, trains and trucks would move the coastal districts inland on a timetable rehearsed every year. It is cheaper than shelters and depends on notice, disciplined crowds and roads that stay open when everyone uses them at once."
 REL_wd_sky_cellar_stores:0 "Stock the Cellars"
 REL_wd_sky_cellar_stores_desc:0 "Shelters without supplies are only holes. Water tanks, generators, bunks and tinned food go into every completed cellar, with wardens trained to open them in minutes and to manage the crowds inside. Stocks spoil and must be rotated each year, which keeps a small army of clerks busy and the food wholesalers very happy."
 REL_wd_sky_ferries:0 "Ferries on Standby at Fraeport"
 REL_wd_sky_ferries_desc:0 "The evacuation plan depends on ships, and Fraeport becomes the staging port for ferries kept on standby. The quay road is rebuilt to carry columns of buses and the berths are marked for loading in darkness. Shipowners are paid to keep hulls nearby instead of earning abroad, which they accept with visible reluctance."
 REL_wd_sky_roche:0 "Ulysses Crosses the Roche Limit"
 REL_wd_sky_roche_desc:0 "In July 1999 Ulysses passes the distance at which Earth's gravity begins to tear it apart, and the waiting turns into watching. Every warden, crew and hospital volunteer goes to their post while observers track what the sky will do. Whatever falls or does not fall near Relentio, the country will judge its leaders by the next weeks."
 REL_wd_sky_lessons:0 "Lessons from the Watch"
 REL_wd_sky_lessons_desc:0 "When the danger has passed, the government asks wardens, doctors, crews and observers what worked and what failed. The answers are frank: some plans worked as written, others failed on details nobody expected. The report goes to every district council, and the plans are rewritten for the next emergency, whatever form it takes."
 REL_wd_cent_review:0 "Relentio Takes Stock"
 REL_wd_cent_review_desc:0 "After years of building institutions, ports and plans, the government commissions a public account of what Relentio has become: who governs, what the treasury holds, which industries sell and which only survive. A panel drawn from the chamber, the councils and the universities writes it, and its findings will frame the arguments of the new century."
 REL_wd_cent_duchy:0 "A Ducal Constitution in One Text"
 REL_wd_cent_duchy_desc:0 "The ducal ministry drafts a single constitution setting out what the ducal office may sign, what the chamber must approve and which rights no government may suspend. A constitutional court is created to read it. Every clause is fought over for two sessions, and the result is a duchy whose rules any citizen can look up."
 REL_wd_cent_seals:0 "The Council Publishes Its Code"
 REL_wd_cent_seals_desc:0 "The council of seals publishes a standing code listing which powers it holds, which it delegates to ministries and which questions the chamber may still debate. Investors welcome the predictability and diplomats finally know whom to call. Critics reply that a decree printed in a book is still a decree."
 REL_wd_cent_republic:0 "The Republic Writes Its Rights"
 REL_wd_cent_republic_desc:0 "The harbour republic adds a bill of rights to its charter, protecting the press, the unions, the shipowners and the valley towns from any single majority. Courts gain the power to strike down laws that breach it. Passing it takes a long session and several compromises. It is the republic's answer to those who called it a merchants' club."
 REL_wd_cent_civil_exam:0 "Open Examinations for Every Post"
 REL_wd_cent_civil_exam_desc:0 "The civil service board replaces recommendations and family connections with one open examination for every post in the ministries. Graduates from Driscol, Fraeport and Torre Mountain compete on equal terms with those from Sofern. The first intake takes years to reach senior posts, and the patrons of the old system complain about standards."
 REL_wd_cent_civil_exam_tt_2:0 "Every ministry post is filled by open examination from now on."
 REL_wd_cent_free_port_age:0 "The Free Port Comes of Age"
 REL_wd_cent_free_port_age_desc:0 "Years of free-port rules have filled the bonded sheds and brought foreign firms to the Sofern waterfront. The chamber now asks whether low duties still pay for themselves. It keeps the free port but adds a modest levy on transit cargo for dredging and quay repairs. Shippers grumble and stay, because nowhere nearby offers better terms."
 REL_wd_cent_authority_plan:0 "A Twenty Year Port Plan"
 REL_wd_cent_authority_plan_desc:0 "The port authority publishes a twenty-year plan for both harbours: deeper channels at Fraeport, new cranes at Sofern and rail sidings linking them to the valley. Every project is costed and scheduled, and the authority borrows against its tariffs to begin. Shipowners welcome the certainty; deputies wonder whether anyone should plan so far ahead."
 REL_wd_cent_reserve_use:0 "Draw Carefully on the Reserve"
 REL_wd_cent_reserve_use_desc:0 "The reserve fund has grown untouched through several budget rounds. Its trustees release part of it to modernise the oldest works in the Faroe district, where breakdowns now cost more than repairs, and keep the remainder invested. Each party argues it had a better use for the money, and the trustees answer that a reserve spent on everything protects nothing."
 REL_wd_cent_valley_review:0 "The Valley Model Reviewed"
 REL_wd_cent_valley_review_desc:0 "Years after the valley chose its industrial path, the ministry of industry walks the halls again, this time counting exports, wages and the number of firms that depend on a single buyer. The review funds new laboratories at Driscol for whatever the valley now makes best, and every hall manager lobbies to be counted a success."
 REL_wd_cent_usean_war:0 "War on the Usean Lanes"
 REL_wd_cent_usean_war_desc:0 "War in Usea, where Erusea and the coalition formed against it in August 2003 fight over the continent, sends shipping insurers into another panic. Usean cargo routes close or turn dangerous, and freight looks for other ports. Relentio is far from the fighting, but its shipowners, insurers and exporters feel it in every contract they sign."
 REL_wd_cent_new_account:0 "Relentio in Two Thousand Five"
 REL_wd_cent_new_account_desc:0 "At the close of the period the government publishes a plain account of where Relentio stands: its constitution, its ports, its treasury and its relations with every neighbour. The account is a baseline for whoever governs next. It makes no promises about later years; the state has learned that plans rarely survive their first surprise."
 REL_wd_cent_new_account_tt_2:0 "Closes the 1991 to 2005 programme; later eras are not yet written."
 ac_wd_rel_tree:0 "Relentio: National Programme"
 ac_wd_rel_tree_desc:0 "The national focus programme of Relentio, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 REL_wd_chamber_convened:0 "A Chamber Still Finding Its Feet"
 REL_wd_chamber_convened_desc:0 "The chamber sits, the ducal office keeps the seals, and nobody has yet settled who decides what."
 REL_wd_ducal_charter:0 "The Ducal Charter"
 REL_wd_ducal_charter_desc:0 "Ministers answer to the chamber and the ducal office signs on their advice."
 REL_wd_seals_mandate:0 "The Seals Mandate"
 REL_wd_seals_mandate_desc:0 "A council named by the ducal office holds the seals, the budget and the coast guard."
 REL_wd_merchant_mandate:0 "The Merchant Mandate"
 REL_wd_merchant_mandate_desc:0 "The harbour councils press for a republic run like a well-kept ledger."
 REL_wd_ducal_constitution:0 "A Written Ducal Constitution"
 REL_wd_ducal_constitution_desc:0 "One text says what the ducal office may sign and what the chamber must approve."
 REL_wd_seals_code:0 "The Standing Code of the Seals"
 REL_wd_seals_code_desc:0 "The council governs by a published code instead of case-by-case orders."
 REL_wd_republic_rights:0 "The Republican Bill of Rights"
 REL_wd_republic_rights_desc:0 "Courts protect the press, the unions and the small districts from any one majority."
 REL_wd_customs_ledger:0 "The Sofern Customs Ledger"
 REL_wd_customs_ledger_desc:0 "Every cargo across the quays is counted, and the count is the treasury."
 REL_wd_free_port:0 "The Free Port of Sofern"
 REL_wd_free_port_desc:0 "Low duties and bonded sheds draw foreign firms to the quays."
 REL_wd_port_authority:0 "The Relentian Port Authority"
 REL_wd_port_authority_desc:0 "One public authority owns the quays, sets the tariffs and plans the dredging."
 REL_wd_insurance_exchange:0 "The Sofern Insurance Exchange"
 REL_wd_insurance_exchange_desc:0 "Shippers insure their hulls and cargoes at home, priced with local knowledge."
 REL_wd_transit_levy:0 "The Transit Levy"
 REL_wd_transit_levy_desc:0 "A small charge on transit cargo pays for dredging and quay repairs."
 REL_wd_port_plan:0 "The Twenty Year Port Plan"
 REL_wd_port_plan_desc:0 "Every dredge, crane and siding is costed and scheduled years in advance."
 REL_wd_night_shifts:0 "Night Shifts on the Quays"
 REL_wd_night_shifts_desc:0 "Floodlights and double crews keep the cranes working through the night."
 REL_wd_thin_treasury:0 "A Thin Treasury"
 REL_wd_thin_treasury_desc:0 "Customs, a patchwork of district taxes and obligations nobody has fully totalled."
 REL_wd_assessment_year:0 "The Assessment Year"
 REL_wd_assessment_year_desc:0 "Assessors are rebuilding the tax roll district by district."
 REL_wd_customs_windfall:0 "Customs Pledged to Payroll"
 REL_wd_customs_windfall_desc:0 "Harbour duty is pledged first to salaries and pensions."
 REL_wd_sound_books:0 "Balanced Books"
 REL_wd_sound_books_desc:0 "No new borrowing until lenders trust the record."
 REL_wd_development_credit:0 "The Development Credit Bank"
 REL_wd_development_credit_desc:0 "Cheap state credit for the halls, the yards and the port workshops."
 REL_wd_idle_halls:0 "Idle Halls in the Valley"
 REL_wd_idle_halls_desc:0 "Arms lines built for a larger army stand half used."
 REL_wd_civil_lines:0 "Civil Lines in the Valley"
 REL_wd_civil_lines_desc:0 "The halls make tractors, pumps, wagons and machine tools."
 REL_wd_export_lines:0 "Licensed Export Lines"
 REL_wd_export_lines_desc:0 "The halls keep making arms for buyers the export board approves."
 REL_wd_valley_overtime:0 "Valley Overtime"
 REL_wd_valley_overtime_desc:0 "Extra shifts in the halls while the orders last."
 REL_wd_gatewood_ties:0 "Close Ties with Gatewood"
 REL_wd_gatewood_ties_desc:0 "Shared standards and coordinated tariffs with Perbla."
 REL_wd_osean_market:0 "The Osean Market"
 REL_wd_osean_market_desc:0 "Osean lines and buyers have favoured berths at Sofern."
 REL_wd_open_harbour:0 "A Harbour for Every Flag"
 REL_wd_open_harbour_desc:0 "One published tariff for every flag, and no bloc at all."
 REL_wd_osean_charters:0 "Osean Berth Contracts"
 REL_wd_osean_charters_desc:0 "Osean lines hold long contracts for the best Sofern berths."
 REL_wd_flag_registry:0 "Neutral Papers for Hire"
 REL_wd_flag_registry_desc:0 "Foreign owners register hulls in Sofern under inspected rules."
 REL_wd_export_orders:0 "Export Orders on the Books"
 REL_wd_export_orders_desc:0 "Signed foreign orders keep the lines busy."
 REL_wd_coast_guard:0 "The Relentian Coast Guard"
 REL_wd_coast_guard_desc:0 "Patrol boats, a few aircraft and crews who know the coast."
 REL_wd_volunteer_force:0 "A Volunteer Defence Force"
 REL_wd_volunteer_force_desc:0 "Long-service sailors, marines and pilots on career contracts."
 REL_wd_harbour_militia:0 "Harbour and Valley Militia"
 REL_wd_harbour_militia_desc:0 "Former servicemen on local rolls, drilling a few weekends a year."
 REL_wd_interceptor_wing:0 "The Sofern Interceptor Wing"
 REL_wd_interceptor_wing_desc:0 "A few modern aircraft trained to find and escort intruders."
 REL_wd_war_risk_rates:0 "War Risk Premiums"
 REL_wd_war_risk_rates_desc:0 "Insurers charge extra for every lane near the fighting."
 REL_wd_closed_port:0 "No War Cargo at Sofern"
 REL_wd_closed_port_desc:0 "Munitions for any belligerent are barred from the quays and the flag."
 REL_wd_wartime_freight:0 "Wartime Freight"
 REL_wd_wartime_freight_desc:0 "Any lawful cargo for any customer, at wartime rates."
 REL_wd_shared_schedules:0 "Shared Sailing Schedules"
 REL_wd_shared_schedules_desc:0 "Relentian and Perblan shipping offices exchange schedules and warnings."
 REL_wd_war_charters:0 "Osean War Charters"
 REL_wd_war_charters_desc:0 "Relentian freighters carry civilian goods for Osean lines."
 REL_wd_neutral_markings:0 "Neutral Colours at Sea"
 REL_wd_neutral_markings_desc:0 "Every Relentian hull carries large lit neutral markings."
 REL_wd_fallout_watch:0 "The Fallout Watch"
 REL_wd_fallout_watch_desc:0 "Daily wind, rain, food and water readings after Waldreich."
 REL_wd_reconstruction_freight:0 "Reconstruction Freight"
 REL_wd_reconstruction_freight_desc:0 "Ships and quays for the rebuilding after the war."
 REL_wd_belkan_buyers:0 "Belkan Buyers"
 REL_wd_belkan_buyers_desc:0 "A victorious Belka buys steel, trucks and port services."
 REL_wd_new_tenants:0 "From Berths to Tenancies"
 REL_wd_new_tenants_desc:0 "Wartime arrivals housed and placed in work."
 REL_wd_sky_watch:0 "Under the Ulysses Warning"
 REL_wd_sky_watch_desc:0 "Every district plans for a danger nobody can yet place on a map."
 REL_wd_deep_cellars:0 "Cellars Under the Cities"
 REL_wd_deep_cellars_desc:0 "Deep shelters under Sofern and Driscol, stocked for weeks."
 REL_wd_evacuation_drill:0 "The Evacuation Timetable"
 REL_wd_evacuation_drill_desc:0 "Ferries, trains and trucks rehearsed to move the coast inland."
 REL_wd_hospital_reserve:0 "Hospitals in Reserve"
 REL_wd_hospital_reserve_desc:0 "Field hospitals stored in the Torre Mountain districts."
 REL_wd_usean_war_rates:0 "Usean War Premiums"
 REL_wd_usean_war_rates_desc:0 "Insurers reprice every lane after war breaks out in Usea."
 ac_wd_rel.1.t:0 "Who Governs Relentio"
 ac_wd_rel.1.d:0 "The chamber meets for its first full session in a hall borrowed from the Sofern harbour councils, because no building in Relentio was designed to hold a national parliament. The ducal office sends its clerk with a short message: the seals are kept, the coast guard is paid and a budget will follow. Everything else, the message says, is for the chamber to argue.\n\nAnd argue it does. Shipowners from Sofern want a government that moves as quickly as a freight market. Deputies from the Relentio valley around Driscol want protection for the arms halls and the wages they pay. The Torre Mountain districts, smallest of all, want a guarantee that the coast will not outvote them on every question. A few voices ask whether a ducal crown suits a state of merchants at all.\n\nNo camp holds a majority today. What the session can decide is how the question will be argued: openly, with the press gallery full and every speech printed, or quietly, in committee rooms where bargains are easier to strike and harder to explain. Either way, the shipping lines, the valley unions and the officer corps are already counting their friends.\n\nProvisional gameplay."
 ac_wd_rel.1.a:0 "Open the gallery to the press."
 ac_wd_rel.1.b:0 "Settle it in committee."
 ac_wd_rel.2.t:0 "The Sofern Customs Count"
 ac_wd_rel.2.d:0 "For a full season the customs clerks of Sofern have counted everything: every container, sack and barrel that crosses the quays, every receipt issued and every receipt that should have been. Their tally lands on the minister's desk in four thick volumes and a one-page summary that nobody in the harbour wanted written.\n\nThe port is busier than the old books admitted. Duty that ought to reach the treasury has leaked through favours, private storage deals and gate staff whose wages never matched their houses. The harbour councils insist that most of the leak is custom rather than crime, and that the port would stall if every old arrangement ended overnight. Shipping agents warn that foreign lines are watching how Relentio treats its largest asset.\n\nThe government has to choose how to use what it now knows. It can publish the count and let the press and the chamber chase the missing money, at the cost of a bruising year on the quays. Or it can use the figures quietly to renegotiate with the councils, gaining revenue without headlines and leaving the old arrangements half intact.\n\nProvisional gameplay."
 ac_wd_rel.2.a:0 "Publish the count in full."
 ac_wd_rel.2.b:0 "Renegotiate quietly with the councils."
 ac_wd_rel.3.t:0 "The First Relentian Budget"
 ac_wd_rel.3.d:0 "The first Relentian budget is presented to the chamber on a grey morning, printed on paper ordered in a hurry and bound with string. It lists customs receipts, a patchwork of valley taxes and a long column of obligations that the government must honour before it can promise anything new. The finance office reads it aloud in under an hour; the debate takes three weeks.\n\nDeputies from Sofern want lower duties to keep the shipping lines loyal. Valley deputies want credit for the arms halls and their suppliers. Torre Mountain wants its haul road. Everyone wants the coast guard paid and nobody wants to pay for it. Foreign banks send polite letters asking about the state's intentions, and the polite tone fools no one about what the letters mean.\n\nThe government must decide what kind of first impression to make. A lean budget with no borrowing would reassure lenders and disappoint almost everyone at home. A budget that borrows to set the ports and the valley moving would please the chamber and test the patience of creditors who have never lent to Relentio before. The finance office has drafted both versions and waits for a decision.\n\nProvisional gameplay."
 ac_wd_rel.3.a:0 "Present a lean budget."
 ac_wd_rel.3.b:0 "Borrow to get things moving."
 ac_wd_rel.4.t:0 "Silence in the Valley Halls"
 ac_wd_rel.4.d:0 "The inspection team returns from the Relentio valley and Torre Mountain with notebooks full of numbers and photographs of empty floors. Some halls run three shifts on orders signed long ago. Others stand idle with their machines oiled and covered, waiting for contracts that were meant for a much larger army. A few were never finished at all.\n\nAround Driscol the halls are the economy. Shops, schools and bus routes exist because the plants pay wages, and every rumour of closure empties the cafes. At Torre Mountain the arms lines sit beside the ore beds and a haul road that barely survives each winter. The unions want guarantees, the managers want orders and the banks want to know who will pay if neither arrives.\n\nThe government must decide how to speak about the valley before it decides what to do there. A frank statement that some halls will close would let planning begin and frighten thousands of families. A promise that every hall has a future would buy calm now and make every later choice more expensive. The banks are waiting for the answer as eagerly as the unions.\n\nProvisional gameplay."
 ac_wd_rel.4.a:0 "Tell the valley the truth."
 ac_wd_rel_4_a:0 "Tell the valley the truth."
 ac_wd_rel.4.b:0 "Promise every hall a future."
 ac_wd_rel.5.t:0 "Envoys at Gatewood"
 ac_wd_rel.5.d:0 "The Relentian envoys travel to Gatewood with a list of practical questions and instructions to avoid grand ones. Who pays the pensions of officials who served the crown lands? Which court hears a dispute between a Sofern shipper and a Perblan buyer? How do freight trains clear a frontier desk that older timetables never had to allow for?\n\nThe envoys are received correctly and carefully. Both peoples share courts, schools, family ties and a long habit of doing business together, and neither government wants a quarrel that would block the rails or the quays. Yet both also know that every agreement signed now becomes a precedent, and that their own chambers will read each clause looking for concessions. Officials keep the old shared files open on the table between them, because nobody yet knows which records belong to whom.\n\nThe envoys must decide what tone to set. They can ask for a broad settlement covering trade, transit and pensions in one package, which would take longer and risk a single failure sinking everything. Or they can settle small matters one at a time, building trust slowly and leaving the hardest questions for later governments.\n\nProvisional gameplay."
 ac_wd_rel.5.a:0 "Seek a broad settlement."
 ac_wd_rel.5.b:0 "Settle small matters first."
 ac_wd_rel.6.t:0 "War on the Shipping Lanes"
 ac_wd_rel.6.d:0 "In the spring of 1995 the crisis around Belka becomes open war. Relentio is not a party to it, and none of its soldiers is anywhere near a front. Its ships are another matter. Within days, freighters bound for Sofern report warships asking for their papers, and insurers in foreign markets publish new war-risk premiums for every lane near the fighting.\n\nThe port reacts the way ports always do. Some shipowners lay up their hulls and wait; others raise their rates and sail. Cargo that used to go elsewhere suddenly arrives at Sofern, some of it with paperwork that does not bear close reading. On the third day a freighter under a foreign flag docks with a manifest listing machine parts and a hold that the customs officers are not allowed to see.\n\nThe government must decide how hard to look. Holding the ship for a full inspection would show every warring power that Relentian quays are not a convenient back door, and it would start an argument with the ship's owners and their government. Letting it unload with a written warning keeps trade moving and leaves the question of what was in the hold to someone else.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25 in tools/lore/chronicle.json; the Relentian response is gameplay."
 ac_wd_rel.6.a:0 "Hold the ship for inspection."
 ac_wd_rel.6.b:0 "Let it unload with a warning."
 ac_wd_rel.7.t:0 "The Held Freighter"
 ac_wd_rel.7.d:0 "Ten days after the freighter was held, the inspection is complete. Customs officers and marines have opened every container in the hold. Most contain exactly what the manifest promised. Several do not: crated spare parts for military vehicles, packed beneath machine tools and invoiced to a trading company that shares its address with a laundry.\n\nThe ship's owners protest that they had no idea, and their government sends a note demanding the vessel's release. Two other governments, on opposite sides of the war, send notes of their own asking what was found. The harbour councils complain that the inspection has frightened other shippers, while the coast guard points out that frightening careless shippers was the whole point.\n\nThe parts sit in a Relentian shed and the ship is tied up at a Relentian quay. The government can confiscate the cargo and release the ship, setting a clear rule that will be tested again, or return everything with a formal protest and a fine, keeping the quarrel small and the precedent vague. Whatever it decides will be read in every shipping office on the coast.\n\nProvisional gameplay."
 ac_wd_rel.7.a:0 "Confiscate the cargo and release the ship."
 ac_wd_rel.7.b:0 "Fine the owners and let it go."
 ac_wd_rel.8.t:0 "A Coast Under Ulysses"
 ac_wd_rel.8.d:0 "The announcement of April 1996 turns the asteroid Ulysses from an astronomers' topic into a government's problem. The world is told that the asteroid will strike the Earth and that every nation must prepare, yet nobody can say where its fragments will fall. For a state whose people live almost entirely along the coast, every possible answer is frightening.\n\nEngineers warn about waves as well as impacts: a fragment at sea could push water into the low streets of Sofern and Fraeport. Planners argue for shelters, or for evacuation, or for both, and the treasury reminds them that it cannot buy everything at once. Shipowners ask whether their fleets will be requisitioned. Churches fill, and hardware shops run out of tinned food within a week.\n\nBefore it chooses any plan, the government must decide how to speak. It can publish everything it knows and everything it does not, trusting citizens with uncertainty, or it can keep the message calm and short while the experts work. Both approaches have costs, and the first public statement will be quoted back at ministers for years.\n\nProvisional gameplay: date anchors only, ACES Chronicle rows 1994 / 12.10 and 1996 / 04.20 in tools/lore/chronicle.json; Relentian preparations are gameplay."
 ac_wd_rel.8.a:0 "Publish everything we know."
 ac_wd_rel_8_a:0 "Publish everything we know."
 ac_wd_rel.8.b:0 "Keep the message calm."
 ac_wd_rel.9.t:0 "The Watch Night"
 ac_wd_rel.9.d:0 "In July 1999 Ulysses passes Earth's Roche limit, and years of preparation turn into nights of watching. Wardens open their posts, ferry and rail crews sleep beside their vehicles, hospital volunteers switch on their generators and observers report every few minutes to the coast guard office. Schools and halls stand open as assembly points, and the trains wait at the platforms with their doors unlocked.\n\nRadio stations stay on the air all night, reading official bulletins between records. Some families go to their assigned places early; others sit on rooftops to watch the sky. Rumours travel faster than reports: a fire on the horizon, a wave sighted off the coast, a ship that has stopped answering. Each one has to be checked before it can be dismissed or acted upon, and the checking exhausts everyone.\n\nThe government's plans now meet the real thing. Ministers must decide whether to keep the whole coast on alert until the observatories declare the danger past, at great cost to work and nerves, or to stand most districts down after the first nights, trusting the warning network to call them back if it is needed.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1999 / 07.08 in tools/lore/chronicle.json; the Relentian watch is gameplay."
 ac_wd_rel.9.a:0 "Keep the coast on alert."
 ac_wd_rel.9.b:0 "Stand most districts down."
 ac_wd_rel.10.t:0 "An Account of the State"
 ac_wd_rel.10.d:0 "The panel's report on the state of Relentio is published in one volume with a plain cover. It describes what the government has built since it began governing in its own name: a chamber that meets, a treasury that collects, a coast guard that sails and ports that handle more cargo than the old books ever recorded. It also lists what has not been built.\n\nThe valley towns still depend on a handful of buyers. Torre Mountain still feels forgotten by the coast. Young graduates leave for jobs abroad, and too many decisions pass through a few offices and firms. The panel warns that a small state can be agile or fragile, and that the difference lies in whether its institutions can survive a bad year without improvising.\n\nThe government must decide how to answer. It can accept the report in full and publish a response to each recommendation, inviting a season of hostile headlines. Or it can thank the panel, highlight its praise and send the criticisms to committee, where they will move slowly if they move at all. The panel members have already said they will tell the press which course the government took.\n\nProvisional gameplay."
 ac_wd_rel.10.a:0 "Answer every recommendation."
 ac_wd_rel.10.b:0 "Highlight the praise."
 ac_wd_rel.11.t:0 "A Trade Mission Returns"
 ac_wd_rel.11.d:0 "The trade mission comes home after a month abroad with a folder of business cards, three signed contracts and a much longer list of promises. Valley manufacturers found buyers for rugged vehicles and machine parts. The yard firms found ship operators who want cheaper repairs. The port services sold well everywhere, and the arms halls sold well in places the foreign ministry would rather not discuss.\n\nEvery contract comes with a request. One buyer wants credit from the treasury. Another wants a guarantee that deliveries will continue whatever happens at Sofern. A third wants an exclusive agency that would shut out other Relentian firms. The mission leaders insist that small states must say yes more often than large ones; the treasury notes that small states also go bankrupt faster.\n\nThe government must decide how to follow up. It can back the new contracts with state export credit, turning promises into orders at some risk to the treasury. Or it can leave the firms to finance their own deals, keeping the state's money safe and accepting that some of the promises will quietly evaporate.\n\nProvisional gameplay."
 ac_wd_rel.11.a:0 "Back the contracts with export credit."
 ac_wd_rel.11.b:0 "Let the firms finance themselves."
 REL_wd_ducal_ministry_office:0 "Ducal Ministry of the Chamber"
 REL_wd_ducal_ministry_office_desc:0 "A cabinet drawn from the majority of the Relentian chamber, governing collectively in the name of the ducal crown and answerable for every budget it passes. Provisional gameplay office with no named holder."
 REL_wd_seals_council_office:0 "Council of the Ducal Seals"
 REL_wd_seals_council_office_desc:0 "A small council named by the ducal office that keeps the seals, the budget and the coast guard, with the chamber called only for advice. Provisional gameplay office with no named holder."
 REL_wd_harbour_republic_office:0 "Executive Council of the Harbour Republic"
 REL_wd_harbour_republic_office_desc:0 "An executive council elected by the chamber of the Republic of Relentio on a fixed calendar, with the ducal title retired. Provisional gameplay office with no named holder."
 ac_wd_rel_decisions:0 "Relentio: National Measures"
 ac_wd_rel_decisions_desc:0 "Measures from the national programme of Relentio. Provisional gameplay unless a source ledger row says otherwise."
 REL_wd_night_shifts_decision:0 "Night Shifts on the Sofern Quays"
 REL_wd_night_shifts_decision_desc:0 "Pay for floodlights and double crews so the cranes work through the night for half a year."
 REL_wd_customs_amnesty_decision:0 "A Customs Amnesty"
 REL_wd_customs_amnesty_decision_desc:0 "Forgive old unpaid duty for traders who register their stock and pay in full from now on."
 REL_wd_trade_mission_decision:0 "Send a Trade Mission Abroad"
 REL_wd_trade_mission_decision_desc:0 "Send officials and firms abroad for a month to find buyers for Relentian goods and services."
 REL_wd_valley_overtime_decision:0 "Overtime in the Valley Halls"
 REL_wd_valley_overtime_decision_desc:0 "Fund extra shifts in the valley halls for half a year, at some cost to tempers on the shop floor."
 REL_wd_shelter_drill_decision:0 "A Coastwide Shelter Drill"
 REL_wd_shelter_drill_decision_desc:0 "Sound the sirens and walk every district to its assigned shelter or assembly point."
 REL_wd_coast_exercise_decision:0 "A Joint Coast Exercise"
 REL_wd_coast_exercise_decision_desc:0 "Put the coast guard, marines and air wing through a week of searches, boardings and intercepts."
 REL_wd_second_radar_decision:0 "Buy a Second Coastal Radar Set"
 REL_wd_second_radar_decision_desc:0 "Buy one more radar set for the Relentio valley coast, once, from whichever supplier offers the best terms."
