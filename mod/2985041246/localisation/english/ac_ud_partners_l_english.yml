l_english:
 SNS_ud_national_question:0 "The Question of the Administration"
 SNS_ud_national_question_desc:0 "San Salvacion is governed by a national administration that answers to no ballot. It has kept the country neutral and solvent, and nobody has ever asked it what it is for. Every ministry now has an answer ready, and the answers do not agree."
 SNS_ud_national_question_done:0 "The Question of the Administration completed"
 SNS_ud_keep_the_administration:0 "Keep the National Administration"
 SNS_ud_keep_the_administration_desc:0 "The administration's case is simple: it works, and a small country cannot afford an experiment while the continent rearms. Continuity is a choice too, and from now on it will have to be defended as one."
 SNS_ud_keep_the_administration_done:0 "Keep the National Administration completed"
 SNS_ud_charter_movement:0 "The Charter Movement"
 SNS_ud_charter_movement_desc:0 "Lawyers, district clerks and schoolteachers want a written charter that binds the state to neutrality and to an elected assembly. They have no party and no money, only a draft that grows longer at every meeting."
 SNS_ud_charter_movement_done:0 "The Charter Movement completed"
 SNS_ud_protection_directorate:0 "A Directorate for Civil Protection"
 SNS_ud_protection_directorate_desc:0 "The civil protection service is the only national body every district already obeys. Its senior officers propose to govern the way they inspect shelters: by rota, by checklist and without debate."
 SNS_ud_protection_directorate_done:0 "A Directorate for Civil Protection completed"
 SNS_ud_district_councils:0 "The District Water Councils"
 SNS_ud_district_councils_desc:0 "In the dry districts the people who allocate water already decide most of what matters. Their councils ask why a capital that cannot fill a cistern should decide anything else."
 SNS_ud_district_councils_done:0 "The District Water Councils completed"
 SNS_ud_office_reform:0 "Reform the Office, Not the Regime"
 SNS_ud_office_reform_desc:0 "The administration will publish its procedures, open its tenders and appoint inspectors it cannot dismiss. Reform from inside keeps the structure while admitting that the structure needed reform."
 SNS_ud_office_reform_done:0 "Reform the Office, Not the Regime completed"
 SNS_ud_charter_drafting:0 "Draft the Neutral Charter"
 SNS_ud_charter_drafting_desc:0 "Neutrality goes into the first article and the assembly into the second. The draft is read aloud in district halls before it ever reaches the capital, which the administration notices."
 SNS_ud_charter_drafting_done:0 "Draft the Neutral Charter completed"
 SNS_ud_directorate_rota:0 "The Directorate's Emergency Rota"
 SNS_ud_directorate_rota_desc:0 "Every ministry will hold a protection rota and answer for it. The rota is designed to outlast any minister, which is exactly what the Directorate means by stability."
 SNS_ud_directorate_rota_done:0 "The Directorate's Emergency Rota completed"
 SNS_ud_council_congress:0 "A Congress of District Councils"
 SNS_ud_council_congress_desc:0 "Delegates arrive with water tallies, grievances and a list of roads nobody repaired. The congress has to turn a federation of complaints into something that can govern."
 SNS_ud_council_congress_done:0 "A Congress of District Councils completed"
 SNS_ud_administration_mandate:0 "The Administration's Mandate"
 SNS_ud_administration_mandate_desc:0 "The administration will state in public what it governs, for how long and on whose behalf. A mandate without a ballot is still a promise, and promises can be counted."
 SNS_ud_administration_mandate_done:0 "The Administration's Mandate completed"
 SNS_ud_charter_assembly:0 "Convene the Charter Assembly"
 SNS_ud_charter_assembly_desc:0 "The assembly meets under the draft charter and elects a presidium to govern until the first general election. The administration hands over the seals, though many of its officials stay behind their desks."
 SNS_ud_charter_assembly_done:0 "Convene the Charter Assembly completed"
 SNS_ud_directorate_formed:0 "The Directorate Takes the Keys"
 SNS_ud_directorate_formed_desc:0 "The civil protection Directorate assumes the functions of government for the duration of what it calls the national emergency. It does not say when the emergency began, or when it will end."
 SNS_ud_directorate_formed_done:0 "The Directorate Takes the Keys completed"
 SNS_ud_councils_take_office:0 "A Government of the Councils"
 SNS_ud_councils_take_office_desc:0 "A standing committee of district councils takes over the national ministries. The capital now governs at the pleasure of the districts, and the districts disagree with one another loudly."
 SNS_ud_councils_take_office_done:0 "A Government of the Councils completed"
 SNS_ud_quiet_budget:0 "A Quiet, Published Budget"
 SNS_ud_quiet_budget_desc:0 "The budget will be printed, debated in no chamber and defended at every district office. Publishing it is the administration's substitute for an election, and it knows the substitute is imperfect."
 SNS_ud_quiet_budget_done:0 "A Quiet, Published Budget completed"
 SNS_ud_charter_first_session:0 "The First Session"
 SNS_ud_charter_first_session_desc:0 "The assembly's first session must pass a budget, a neutrality law and an electoral calendar. It can probably manage two of the three before the districts lose patience."
 SNS_ud_charter_first_session_done:0 "The First Session completed"
 SNS_ud_directorate_powers:0 "Define the Directorate's Powers"
 SNS_ud_directorate_powers_desc:0 "The Directorate writes down what it may do in an emergency. Written powers are narrower than unwritten ones, and some of its officers would have preferred them unwritten."
 SNS_ud_directorate_powers_done:0 "Define the Directorate's Powers completed"
 SNS_ud_councils_water_compact:0 "The National Water Compact"
 SNS_ud_councils_water_compact_desc:0 "The councils agree the first national allocation of water in the republic's history. Every district gives something up, and every district claims to have given up the most."
 SNS_ud_councils_water_compact_done:0 "The National Water Compact completed"
 SNS_ud_desert_district_survey:0 "Survey the Desert District"
 SNS_ud_desert_district_survey_desc:0 "The desert interior has been surveyed for minerals and for borders, but never for the people who live there. A civil survey will count wells, roads and schools, and the distances between them."
 SNS_ud_desert_district_survey_done:0 "Survey the Desert District completed"
 SNS_ud_water_before_roads:0 "Water before Roads"
 SNS_ud_water_before_roads_desc:0 "Wells, cisterns and pumping stations come first. A district with water keeps its people; a road only makes it easier for them to leave."
 SNS_ud_water_before_roads_done:0 "Water before Roads completed"
 SNS_ud_roads_before_water:0 "Roads before Water"
 SNS_ud_roads_before_water_desc:0 "Roads bring tankers, doctors and buyers for whatever the district produces. Without them a well is a local blessing and a national irrelevance."
 SNS_ud_roads_before_water_done:0 "Roads before Water completed"
 SNS_ud_desert_cooperatives:0 "Desert Cooperatives"
 SNS_ud_desert_cooperatives_desc:0 "Water users' cooperatives will maintain the new works and set local tariffs. They will also become the first organised political voice the interior has ever had."
 SNS_ud_desert_cooperatives_done:0 "Desert Cooperatives completed"
 SNS_ud_transit_concessions:0 "Transit Concessions"
 SNS_ud_transit_concessions_desc:0 "Haulage firms receive concessions on the new roads in return for carrying public freight at fixed rates. The concessions are profitable, which makes them durable and contentious."
 SNS_ud_transit_concessions_done:0 "Transit Concessions completed"
 SNS_ud_neutral_ledger:0 "The Ledger of Neutrality"
 SNS_ud_neutral_ledger_desc:0 "Neutrality is not a mood but an account of what San Salvacion buys, sells, permits and refuses. The ledger will be kept so that any foreign capital can read it and none can rewrite it."
 SNS_ud_neutral_ledger_done:0 "The Ledger of Neutrality completed"
 SNS_ud_usean_correspondence:0 "Letters to Every Usean Capital"
 SNS_ud_usean_correspondence_desc:0 "San Salvacion writes the same letter to every Usean government: it recognises all of them and takes no side in their quarrels. Some replies are warm, some are formal, and one never arrives."
 SNS_ud_usean_correspondence_done:0 "Letters to Every Usean Capital completed"
 SNS_ud_border_posts:0 "Staff the Desert Border Posts"
 SNS_ud_border_posts_desc:0 "The posts in the interior are staffed by whoever was sent there last. A proper rota, working radios and a clear rule of engagement will make neutrality visible on the ground."
 SNS_ud_border_posts_done:0 "Staff the Desert Border Posts completed"
 SNS_ud_skully_islands_watch:0 "After the Skully Islands"
 SNS_ud_skully_islands_watch_desc:0 "Central Usea's Southern District has destroyed a rebel base in the Skully Islands. San Salvacion had no part in it and means to keep it that way, which requires knowing who crosses its own borders."
 SNS_ud_skully_islands_watch_done:0 "After the Skully Islands completed"
 SNS_ud_read_the_warning:0 "Read the Warning"
 SNS_ud_read_the_warning_desc:0 "Central Usea has announced that the asteroid Ulysses will strike the Earth. A small neutral country cannot change an orbit. It can decide how to tell its people, and what to ask of its neighbours."
 SNS_ud_read_the_warning_done:0 "Read the Warning completed"
 SNS_ud_coup_night:0 "The Night of the Coup"
 SNS_ud_coup_night_desc:0 "A coup has broken out across Usea. Unified Command will defeat it, but tonight nobody in San Salvacion knows that, and several officers have stopped answering their telephones."
 SNS_ud_coup_night_done:0 "The Night of the Coup completed"
 SNS_ud_coup_courts:0 "Courts, Not Purges"
 SNS_ud_coup_courts_desc:0 "Those who joined the coup will be tried in open court under ordinary law. It will be slow, and some of them will be acquitted. That is the point."
 SNS_ud_coup_courts_done:0 "Courts, Not Purges completed"
 SNS_ud_coup_cordon:0 "Cordon the Ministries"
 SNS_ud_coup_cordon_desc:0 "The ministries will be guarded, the archives sealed and suspect officers suspended pending review. The review has no deadline."
 SNS_ud_coup_cordon_done:0 "Cordon the Ministries completed"
 SNS_ud_host_terms:0 "The Host Terms"
 SNS_ud_host_terms_desc:0 "Central Usea is leading an international project to place a railgun battery in San Salvacion's desert. The host must decide what it is lending: land, airspace, roads, water and the right to say no."
 SNS_ud_host_terms_done:0 "The Host Terms completed"
 SNS_ud_sovereign_lease:0 "A Sovereign Lease"
 SNS_ud_sovereign_lease_desc:0 "The site is leased, not ceded. San Salvacion keeps its law, its customs posts and its inspectors at the gate. The lease protects neutrality on paper; it cannot make the guns neutral."
 SNS_ud_sovereign_lease_done:0 "A Sovereign Lease completed"
 SNS_ud_joint_custody:0 "Joint Custody of the Site"
 SNS_ud_joint_custody_desc:0 "San Salvacion shares custody with the project's own security. It gains a voice inside the perimeter and a share of the burden of guarding it, and loses the pretence of standing outside."
 SNS_ud_joint_custody_done:0 "Joint Custody of the Site completed"
 SNS_ud_lease_inspectors:0 "Inspectors at the Gate"
 SNS_ud_lease_inspectors_desc:0 "National inspectors will count what enters and leaves the leased site. They will not understand most of it. Their job is to make sure somebody has to explain it to them."
 SNS_ud_lease_inspectors_done:0 "Inspectors at the Gate completed"
 SNS_ud_custody_liaison:0 "A Liaison inside the Perimeter"
 SNS_ud_custody_liaison_desc:0 "A permanent liaison office inside the perimeter will carry questions both ways. The project learns San Salvacion's law; San Salvacion learns what the project will not say."
 SNS_ud_custody_liaison_done:0 "A Liaison inside the Perimeter completed"
 SNS_ud_civil_burden_register:0 "Register the Civil Burden"
 SNS_ud_civil_burden_register_desc:0 "Roads, water, power and housing around the site carry a load nobody budgeted for. A register of that burden is the first step toward asking someone else to share it."
 SNS_ud_civil_burden_register_done:0 "Register the Civil Burden completed"
 SNS_ud_battery_completed:0 "The Battery Is Complete"
 SNS_ud_battery_completed_desc:0 "Stonehenge is complete. Eight railguns stand in San Salvacion's desert, aimed at a sky that will soon be full of falling stone. The country that hosts them did not build them and cannot fire them."
 SNS_ud_battery_completed_done:0 "The Battery Is Complete completed"
 SNS_ud_living_beside_the_guns:0 "Living beside the Guns"
 SNS_ud_living_beside_the_guns_desc:0 "The host district now lives with convoys, floodlights and a perimeter that keeps moving outward. Compensation, curfews and clinics will decide whether the district feels protected or occupied."
 SNS_ud_living_beside_the_guns_done:0 "Living beside the Guns completed"
 SNS_ud_site_security_cordon:0 "A Cordon of Our Own"
 SNS_ud_site_security_cordon_desc:0 "San Salvacion posts its own cordon outside the project's perimeter. It cannot defend the guns against a determined army, but nobody will mistake the site for unguarded land."
 SNS_ud_site_security_cordon_done:0 "A Cordon of Our Own completed"
 SNS_ud_host_water_rights:0 "Water Rights for the Host District"
 SNS_ud_host_water_rights_desc:0 "The site and the district draw on the same water. Fixed allocations, metered and published, will stop the project's thirst from becoming the district's drought."
 SNS_ud_host_water_rights_done:0 "Water Rights for the Host District completed"
 SNS_ud_host_dividend:0 "The Host's Dividend"
 SNS_ud_host_dividend_desc:0 "San Salvacion asks the project's members for a share of the technical work around the site: training, maintenance contracts and access to what its engineers learn."
 SNS_ud_host_dividend_done:0 "The Host's Dividend completed"
 SNS_ud_host_ledger:0 "The Host's Ledger"
 SNS_ud_host_ledger_desc:0 "Everything the country has given, received and refused as host goes into one ledger. If the guns ever change hands, the ledger will show what was San Salvacion's and what was not."
 SNS_ud_host_ledger_done:0 "The Host's Ledger completed"
 SNS_ud_civil_shelter_census:0 "A Census of Civil Shelter"
 SNS_ud_civil_shelter_census_desc:0 "Cellars, tunnels, schools and churches are counted, measured and photographed. Most would protect nobody from a falling fragment, and the census will say so plainly."
 SNS_ud_civil_shelter_census_done:0 "A Census of Civil Shelter completed"
 SNS_ud_shelter_in_place:0 "Shelter Where People Live"
 SNS_ud_shelter_in_place_desc:0 "Reinforced shelters will be built in the towns, close to homes and hospitals. It is expensive, and it bets that the towns are where people should be when the sky breaks."
 SNS_ud_shelter_in_place_done:0 "Shelter Where People Live completed"
 SNS_ud_disperse_the_towns:0 "Disperse the Towns"
 SNS_ud_disperse_the_towns_desc:0 "When the fragments come, the towns will empty into the countryside on a published plan. It is cheaper than shelters, and it relies on trains, roads and the patience of rural hosts."
 SNS_ud_disperse_the_towns_done:0 "Disperse the Towns completed"
 SNS_ud_neighbourhood_wardens:0 "Neighbourhood Wardens"
 SNS_ud_neighbourhood_wardens_desc:0 "Every street gets a warden who knows the shelter, the key and the families who will need help to reach it. Wardens are volunteers, trained and paid a token fee."
 SNS_ud_neighbourhood_wardens_done:0 "Neighbourhood Wardens completed"
 SNS_ud_dispersal_trains:0 "Dispersal Trains"
 SNS_ud_dispersal_trains_desc:0 "Rolling stock is reserved, timetabled and inspected for the day the towns empty. Railway crews rehearse a timetable they hope never to run."
 SNS_ud_dispersal_trains_done:0 "Dispersal Trains completed"
 SNS_ud_preparation_record:0 "Close the Preparation Record"
 SNS_ud_preparation_record_desc:0 "Preparations completed before the impact are recorded and closed. Work done afterwards will be honest relief, not retroactive readiness."
 SNS_ud_preparation_record_done:0 "Close the Preparation Record completed"
 SNS_ud_impact_night:0 "The Night of the Fragments"
 SNS_ud_impact_night_desc:0 "Ulysses has broken apart over the Earth. Stonehenge fires into a sky full of falling stone, and in the towns and villages of San Salvacion the plans meet the night they were written for."
 SNS_ud_impact_night_done:0 "The Night of the Fragments completed"
 SNS_ud_field_hospitals:0 "Field Hospitals in the Districts"
 SNS_ud_field_hospitals_desc:0 "Tents, generators and surgical teams go where the hospitals are full. The injured and the displaced keep arriving, and the field hospitals will stay for months."
 SNS_ud_field_hospitals_done:0 "Field Hospitals in the Districts completed"
 SNS_ud_water_convoys:0 "Water Convoys"
 SNS_ud_water_convoys_desc:0 "Pumping stations lost power and towns filled with people who arrived with nothing. Tanker convoys will run on fixed routes until supply is normal again, with a published timetable so that nobody has to guess."
 SNS_ud_water_convoys_done:0 "Water Convoys completed"
 SNS_ud_refugee_question:0 "The Refugee Question"
 SNS_ud_refugee_question_desc:0 "Erusea has closed its border to refugees. The displaced who cannot cross into Erusea are turning toward San Salvacion, which must decide whether it is a refuge or a corridor."
 SNS_ud_refugee_question_done:0 "The Refugee Question completed"
 SNS_ud_open_reception_centres:0 "Open Reception Centres"
 SNS_ud_open_reception_centres_desc:0 "Reception centres will register, house and feed those who arrive, and give them the right to work. It is generous and costly, and it will change the country."
 SNS_ud_open_reception_centres_done:0 "Open Reception Centres completed"
 SNS_ud_transit_only:0 "Transit Corridors Only"
 SNS_ud_transit_only_desc:0 "Refugees may cross San Salvacion toward other destinations with food, medical care and a ticket, but they may not settle. It keeps the country unchanged and the burden temporary."
 SNS_ud_transit_only_done:0 "Transit Corridors Only completed"
 SNS_ud_invasion_summer:0 "The Summer of the Invasion"
 SNS_ud_invasion_summer_desc:0 "Erusea has invaded San Salvacion and seized Stonehenge. The railguns built to shoot down falling stone are being turned against aircraft. Neutrality has ended without the country choosing to end it."
 SNS_ud_invasion_summer_done:0 "The Summer of the Invasion completed"
 SNS_ud_free_districts:0 "Govern the Free Districts"
 SNS_ud_free_districts_desc:0 "The government still holds part of the country. It will govern what it holds as if the whole republic were watching, because one day the whole republic will judge it."
 SNS_ud_free_districts_done:0 "Govern the Free Districts completed"
 SNS_ud_quiet_ministries:0 "The Quiet Ministries"
 SNS_ud_quiet_ministries_desc:0 "Where the occupation reaches, the ministries go quiet. Officials keep working and keep records, and they keep a second set of records that the occupier never sees."
 SNS_ud_quiet_ministries_done:0 "The Quiet Ministries completed"
 SNS_ud_district_defence_rotas:0 "District Defence Rotas"
 SNS_ud_district_defence_rotas_desc:0 "Every district still free keeps a defence rota of watchers, runners, repair crews and reservists who know the roads. It will not stop an army, but it will slow one."
 SNS_ud_district_defence_rotas_done:0 "District Defence Rotas completed"
 SNS_ud_coalition_supply:0 "Supply from the Coalition"
 SNS_ud_coalition_supply_desc:0 "Central Usea and its partners send what they can spare. The dispatch service will make sure it reaches the districts that need it, not the ones that ask loudest."
 SNS_ud_coalition_supply_done:0 "Supply from the Coalition completed"
 SNS_ud_keep_the_roads_open:0 "Keep the Roads Open"
 SNS_ud_keep_the_roads_open_desc:0 "Bridges are guarded, culverts cleared and fuel cached. A road kept open is the difference between a district that can be relieved and one that has to be written off."
 SNS_ud_keep_the_roads_open_done:0 "Keep the Roads Open completed"
 SNS_ud_records_into_hiding:0 "Records into Hiding"
 SNS_ud_records_into_hiding_desc:0 "Land registers, civil records and payroll lists leave the ministries in suitcases and grain sacks. Whoever governs after the war will need to know who owned what."
 SNS_ud_records_into_hiding_done:0 "Records into Hiding completed"
 SNS_ud_engineers_families:0 "Shelter for the Engineers' Families"
 SNS_ud_engineers_families_desc:0 "The engineers of Stonehenge and their families have escaped Erusean custody. Some of them cross San Salvacion on the way out, and the quiet ministries know how to hide people."
 SNS_ud_engineers_families_done:0 "Shelter for the Engineers' Families completed"
 SNS_ud_exile_ledger:0 "The Ledger of the Occupation"
 SNS_ud_exile_ledger_desc:0 "The quiet ministries keep a ledger of the occupation: requisitions, arrests, damage and debts. It will be presented at the peace, whoever sits across the table."
 SNS_ud_exile_ledger_done:0 "The Ledger of the Occupation completed"
 SNS_ud_count_the_displaced:0 "Count the Displaced"
 SNS_ud_count_the_displaced_desc:0 "Families fleeing the fighting are counted at every post the government can still reach. The count is the first step toward bringing them home."
 SNS_ud_count_the_displaced_done:0 "Count the Displaced completed"
 SNS_ud_liberation_day:0 "Liberation"
 SNS_ud_liberation_day_desc:0 "San Salvacion is liberated. The guns in the desert are silent, the occupier has gone, and the government returns to a country that has learned to govern itself in pieces."
 SNS_ud_liberation_day_done:0 "Liberation completed"
 SNS_ud_erusean_settlement:0 "Under the Erusean Settlement"
 SNS_ud_erusean_settlement_desc:0 "Erusea has won the war and dictates the terms. The government will work inside them, keep its records and wait for the day when the terms can be reopened."
 SNS_ud_erusean_settlement_done:0 "Under the Erusean Settlement completed"
 SNS_ud_armistice_watch:0 "Life under the Armistice"
 SNS_ud_armistice_watch_desc:0 "The fighting has stopped without a victor. The armistice holds because everyone is too exhausted to break it, and San Salvacion must rebuild in the shadow of the lines."
 SNS_ud_armistice_watch_done:0 "Life under the Armistice completed"
 SNS_ud_return_of_the_ministries:0 "Return of the Ministries"
 SNS_ud_return_of_the_ministries_desc:0 "The ministries reopen with whatever staff and records survived. Officials who stayed, officials who fled and officials who served the occupier now share the same corridors."
 SNS_ud_return_of_the_ministries_done:0 "Return of the Ministries completed"
 SNS_ud_desert_after_the_guns:0 "The Desert after the Guns"
 SNS_ud_desert_after_the_guns_desc:0 "The battery in the desert was built for one crisis and fought over in another. Whatever now stands in the desert, the country must decide what the site is: a grave, a ruin, a hazard or a promise."
 SNS_ud_desert_after_the_guns_done:0 "The Desert after the Guns completed"
 SNS_ud_memorial_zone:0 "A Closed Memorial Zone"
 SNS_ud_memorial_zone_desc:0 "The site will be fenced, cleared of hazards and closed to everything except remembrance. Nothing will ever be built there again."
 SNS_ud_memorial_zone_done:0 "A Closed Memorial Zone completed"
 SNS_ud_reclaim_the_desert:0 "Reclaim the Desert District"
 SNS_ud_reclaim_the_desert_desc:0 "The roads, power lines and water works built for the battery will serve the district instead. The country will not waste what the crisis years left behind."
 SNS_ud_reclaim_the_desert_done:0 "Reclaim the Desert District completed"
 SNS_ud_ruin_survey:0 "Survey the Site for Hazards"
 SNS_ud_ruin_survey_desc:0 "Unexploded munitions, damaged power systems and contaminated ground must be mapped before anyone can be kept safe from them. The survey will take years."
 SNS_ud_ruin_survey_done:0 "Survey the Site for Hazards completed"
 SNS_ud_district_water_works:0 "Water Works for the Desert District"
 SNS_ud_district_water_works_desc:0 "The site's water works will be connected to the district's towns. For the first time, the host district gets something back that it can drink."
 SNS_ud_district_water_works_done:0 "Water Works for the Desert District completed"
 SNS_ud_reconstruction_compact:0 "The Reconstruction Compact"
 SNS_ud_reconstruction_compact_desc:0 "Government, districts and returning families sign a compact on what is rebuilt first: houses before ministries, water before monuments, and nobody's district last twice."
 SNS_ud_reconstruction_compact_done:0 "The Reconstruction Compact completed"
 SNS_ud_rebuild_the_districts:0 "Rebuild the Districts"
 SNS_ud_rebuild_the_districts_desc:0 "Schools, clinics and town halls are rebuilt with local labour and national money. Every finished building is opened by a local official, not by a minister."
 SNS_ud_rebuild_the_districts_done:0 "Rebuild the Districts completed"
 SNS_ud_refugees_return:0 "Bring the Displaced Home"
 SNS_ud_refugees_return_desc:0 "Families displaced in the fragment year and the war are offered transport, housing grants and help to reclaim their land. Not all of them will come back."
 SNS_ud_refugees_return_done:0 "Bring the Displaced Home completed"
 SNS_ud_constitution_after_the_war:0 "The Constitution after the War"
 SNS_ud_constitution_after_the_war_desc:0 "Whatever government led the country into the war must now explain itself to the country that came out of it. The constitution will be amended to say what happens next time."
 SNS_ud_constitution_after_the_war_done:0 "The Constitution after the War completed"
 SNS_ud_neutral_again:0 "Neutral Again"
 SNS_ud_neutral_again_desc:0 "San Salvacion returns to the neutrality it never chose to lose, with the guns gone from its desert and a ledger nobody can dispute."
 SNS_ud_neutral_again_done:0 "Neutral Again completed"
 SNS_ud_usean_partnership:0 "A Partner in the New Usea"
 SNS_ud_usean_partnership_desc:0 "Neutrality did not keep the invasion out. San Salvacion will work openly with the countries that came to its aid, as a partner rather than a battlefield."
 SNS_ud_usean_partnership_done:0 "A Partner in the New Usea completed"
 SNS_ud_national_ledger_closed:0 "Close the National Ledger"
 SNS_ud_national_ledger_closed_desc:0 "From the first letter to every capital to the last ledger of the occupation, the republic's accounts are closed and published. The next generation will open a new book."
 SNS_ud_national_ledger_closed_done:0 "Close the National Ledger completed"
 AMB_ud_cabinet_question:0 "Who Signs for Amber?"
 AMB_ud_cabinet_question_desc:0 "Amber is governed by a cabinet that signs contracts on the nation's behalf. Contractors, freight unions and a restless nationalist press all want to know who will hold the pen."
 AMB_ud_cabinet_question_done:0 "Who Signs for Amber? completed"
 AMB_ud_keep_the_contracting_cabinet:0 "Keep the Contracting Cabinet"
 AMB_ud_keep_the_contracting_cabinet_desc:0 "The cabinet has delivered growth without elections and without a scandal anyone could prove. It will keep the pen and promise to sign more carefully."
 AMB_ud_keep_the_contracting_cabinet_done:0 "Keep the Contracting Cabinet completed"
 AMB_ud_board_movement:0 "The Chartered Board Movement"
 AMB_ud_board_movement_desc:0 "The largest contract holders propose a Chartered Development Board: a government of the people who actually build things, answerable to the contracts they sign."
 AMB_ud_board_movement_done:0 "The Chartered Board Movement completed"
 AMB_ud_labour_compact_movement:0 "The Freight Workers' Compact"
 AMB_ud_labour_compact_movement_desc:0 "Rail crews, dockers and warehouse staff propose a compact: they will keep Amber moving if the state guarantees their wages, their safety and a vote."
 AMB_ud_labour_compact_movement_done:0 "The Freight Workers' Compact completed"
 AMB_ud_sovereign_contracts_league:0 "The Sovereign Contracts League"
 AMB_ud_sovereign_contracts_league_desc:0 "A league of nationalists says Amber has sold itself one contract at a time to foreign capitals. It wants every bargain reopened and every foreign clause struck out."
 AMB_ud_sovereign_contracts_league_done:0 "The Sovereign Contracts League completed"
 AMB_ud_cabinet_audit:0 "Audit the Cabinet's Contracts"
 AMB_ud_cabinet_audit_desc:0 "The cabinet submits its own contracts to an independent audit. Some will survive; the ones that do not will cost ministers their posts."
 AMB_ud_cabinet_audit_done:0 "Audit the Cabinet's Contracts completed"
 AMB_ud_board_charter:0 "Write the Board's Charter"
 AMB_ud_board_charter_desc:0 "The charter decides who sits on the Board: contract holders by size, regions by population and two seats for the unions, which everyone expects them to refuse."
 AMB_ud_board_charter_done:0 "Write the Board's Charter completed"
 AMB_ud_labour_compact_terms:0 "Terms of the Compact"
 AMB_ud_labour_compact_terms_desc:0 "The compact's terms are hammered out in the rail sheds: a wage floor, a safety code and an elected cabinet with a freight workers' veto over strikebreaking."
 AMB_ud_labour_compact_terms_done:0 "Terms of the Compact completed"
 AMB_ud_league_rallies:0 "The League in the Squares"
 AMB_ud_league_rallies_desc:0 "The League fills the squares with banners listing every foreign clause in Amber's contracts. The list is accurate. The conclusions drawn from it are another matter."
 AMB_ud_league_rallies_done:0 "The League in the Squares completed"
 AMB_ud_cabinet_mandate:0 "The Cabinet's Renewed Mandate"
 AMB_ud_cabinet_mandate_desc:0 "The cabinet asks the country for nothing and offers it a promise: every contract published and every bargain explained. It must keep the promise without a ballot to renew it."
 AMB_ud_cabinet_mandate_done:0 "The Cabinet's Renewed Mandate completed"
 AMB_ud_development_board:0 "The Chartered Development Board"
 AMB_ud_development_board_desc:0 "The Board takes office and governs Amber as a development project. Its first act is to publish a five-year schedule of contracts, which is also its manifesto."
 AMB_ud_development_board_done:0 "The Chartered Development Board completed"
 AMB_ud_labour_compact_cabinet:0 "The Labour Compact Cabinet"
 AMB_ud_labour_compact_cabinet_desc:0 "A cabinet of the compact takes office with an electoral law, a wage floor and a long memory of every yard that closed. Amber will move, but on the compact's terms."
 AMB_ud_labour_compact_cabinet_done:0 "The Labour Compact Cabinet completed"
 AMB_ud_league_government:0 "The League Takes the Ministries"
 AMB_ud_league_government_desc:0 "The Sovereign Contracts League forms a government of national renegotiation. Foreign partners receive letters, contractors receive deadlines and the press receives instructions."
 AMB_ud_league_government_done:0 "The League Takes the Ministries completed"
 AMB_ud_published_contracts:0 "Publish Every Contract"
 AMB_ud_published_contracts_desc:0 "Every public contract, large or small, is printed in a register any citizen may read. The cabinet discovers how many people can read a contract."
 AMB_ud_published_contracts_done:0 "Publish Every Contract completed"
 AMB_ud_board_schedule:0 "The Board's First Schedule"
 AMB_ud_board_schedule_desc:0 "The Board's first schedule runs for five years and allocates every yard, road and depot. Nothing outside the schedule gets built."
 AMB_ud_board_schedule_done:0 "The Board's First Schedule completed"
 AMB_ud_compact_safety_code:0 "The National Safety Code"
 AMB_ud_compact_safety_code_desc:0 "The compact's safety code applies in every yard and depot: rest periods, inspections and the right to stop work that will kill someone. Freight moves more slowly, and fewer people die moving it."
 AMB_ud_compact_safety_code_done:0 "The National Safety Code completed"
 AMB_ud_league_renegotiation:0 "The Great Renegotiation"
 AMB_ud_league_renegotiation_desc:0 "The League reopens every foreign contract. Partners who sign new terms keep their business; partners who refuse are sued, delayed or expelled."
 AMB_ud_league_renegotiation_done:0 "The Great Renegotiation completed"
 AMB_ud_contract_register_of_usea:0 "A Register of Usean Contracts"
 AMB_ud_contract_register_of_usea_desc:0 "Amber's firms hold contracts in half the capitals of Usea. A register will show what Amber has promised abroad, and what it can still promise at home."
 AMB_ud_contract_register_of_usea_done:0 "A Register of Usean Contracts completed"
 AMB_ud_freight_yards_survey:0 "Survey the Freight Yards"
 AMB_ud_freight_yards_survey_desc:0 "Every yard, siding and depot is surveyed for capacity, condition and the number of employers fighting over it. The survey is the first honest map of Amber's freight."
 AMB_ud_freight_yards_survey_done:0 "Survey the Freight Yards completed"
 AMB_ud_treaty_office:0 "A Treaty Office for Contracts"
 AMB_ud_treaty_office_desc:0 "A small office will read every treaty Amber has signed and flag every clause that commits Amber's freight to someone else's emergency."
 AMB_ud_treaty_office_done:0 "A Treaty Office for Contracts completed"
 AMB_ud_warning_contracts:0 "Contracts after the Warning"
 AMB_ud_warning_contracts_desc:0 "The asteroid warning turns every freight contract into an emergency contract. Clients abroad want guarantees, and the yards at home want to know whose emergency comes first."
 AMB_ud_warning_contracts_done:0 "Contracts after the Warning completed"
 AMB_ud_relief_consortium_seat:0 "A Seat on the Relief Consortium"
 AMB_ud_relief_consortium_seat_desc:0 "Amber joins an international relief consortium as its freight and contracting house. It gains a say over where relief goes and the obligation to deliver it."
 AMB_ud_relief_consortium_seat_done:0 "A Seat on the Relief Consortium completed"
 AMB_ud_independent_contractor:0 "Contract Independently"
 AMB_ud_independent_contractor_desc:0 "Amber will sell its freight to whoever needs it, on Amber's terms and without a consortium's obligations. It will be well paid and not much loved."
 AMB_ud_independent_contractor_done:0 "Contract Independently completed"
 AMB_ud_clearing_house:0 "The Consortium Clearing House"
 AMB_ud_clearing_house_desc:0 "Every relief consignment passing through Amber is logged, priced and cleared in one office. Waste becomes visible, and so does Amber's indispensability."
 AMB_ud_clearing_house_done:0 "The Consortium Clearing House completed"
 AMB_ud_independent_tenders:0 "Independent Tenders"
 AMB_ud_independent_tenders_desc:0 "Amber's firms bid for relief work across Usea in open tenders. They win often, which pleases the treasury and irritates the governments paying the bills."
 AMB_ud_independent_tenders_done:0 "Independent Tenders completed"
 AMB_ud_coup_contracts:0 "Contracts in the Coup Summer"
 AMB_ud_coup_contracts_desc:0 "The coup across Usea leaves Amber holding contracts signed by governments that may not exist next week. Lawyers work through the night, and the trains keep running."
 AMB_ud_coup_contracts_done:0 "Contracts in the Coup Summer completed"
 AMB_ud_battery_service_bids:0 "Service Bids around the Battery"
 AMB_ud_battery_service_bids_desc:0 "With Stonehenge complete in San Salvacion, the host district needs water, freight and maintenance. Amber's firms bid for the civilian service work, and for nothing else."
 AMB_ud_battery_service_bids_done:0 "Service Bids around the Battery completed"
 AMB_ud_relief_rail_plan:0 "A Relief Rail Plan"
 AMB_ud_relief_rail_plan_desc:0 "Locomotives, wagons and crews are earmarked for the day the fragments fall. The plan names the trains, not merely the number of trains."
 AMB_ud_relief_rail_plan_done:0 "A Relief Rail Plan completed"
 AMB_ud_grain_reserve:0 "A Grain Reserve under Contract"
 AMB_ud_grain_reserve_desc:0 "Merchants will hold grain under contract for national relief, paid to keep it and fined for selling it. The reserve exists on paper and in silos, which are not always the same thing."
 AMB_ud_grain_reserve_done:0 "A Grain Reserve under Contract completed"
 AMB_ud_medical_freight:0 "Medical Freight Priority"
 AMB_ud_medical_freight_desc:0 "Medical consignments get the first path on every line in an emergency. Dispatchers practise clearing a whole line for a single wagon of blood and bandages."
 AMB_ud_medical_freight_done:0 "Medical Freight Priority completed"
 AMB_ud_relief_preparation_record:0 "Close the Relief Preparation Record"
 AMB_ud_relief_preparation_record_desc:0 "Preparations completed before the impact are recorded and closed. The consortium will not accept retroactive readiness, and neither will Amber."
 AMB_ud_relief_preparation_record_done:0 "Close the Relief Preparation Record completed"
 AMB_ud_impact_freight:0 "Freight on the Night of the Fragments"
 AMB_ud_impact_freight_desc:0 "The fragments have fallen across Usea. Amber's yards are working, and every government on the continent is asking for the same trains."
 AMB_ud_impact_freight_done:0 "Freight on the Night of the Fragments completed"
 AMB_ud_open_the_yards:0 "Open the Yards to Usea"
 AMB_ud_open_the_yards_desc:0 "Amber's yards will move relief for anyone who needs it, in the order requests arrive. Amber's own districts will wait their turn."
 AMB_ud_open_the_yards_done:0 "Open the Yards to Usea completed"
 AMB_ud_ration_the_yards:0 "Ration the Yards"
 AMB_ud_ration_the_yards_desc:0 "Freight capacity is rationed by a published formula: domestic need first, contracts second, appeals third. Neighbours call it selfish; Amber's districts call it fair."
 AMB_ud_ration_the_yards_done:0 "Ration the Yards completed"
 AMB_ud_relief_trains_abroad:0 "Relief Trains for Neighbours"
 AMB_ud_relief_trains_abroad_desc:0 "Trains loaded in Amber run as far as the lines still reach. The crews come home with stories and, sometimes, with passengers."
 AMB_ud_relief_trains_abroad_done:0 "Relief Trains for Neighbours completed"
 AMB_ud_domestic_relief_first:0 "Domestic Relief First"
 AMB_ud_domestic_relief_first_desc:0 "Amber's own crowded districts receive the first trains and the best crews. Contracts abroad are honoured late."
 AMB_ud_domestic_relief_first_done:0 "Domestic Relief First completed"
 AMB_ud_refugee_freight:0 "Refugees on the Freight Lines"
 AMB_ud_refugee_freight_desc:0 "Erusea has closed its border to refugees. The displaced ride freight trains toward Amber, and the yards become the first place they stop."
 AMB_ud_refugee_freight_done:0 "Refugees on the Freight Lines completed"
 AMB_ud_refugee_work_permits:0 "Work Permits in the Yards"
 AMB_ud_refugee_work_permits_desc:0 "Refugees who can work receive permits for the yards and depots. Amber gets labour, and the unions get a new argument."
 AMB_ud_refugee_work_permits_done:0 "Work Permits in the Yards completed"
 AMB_ud_refugee_transit_corridor:0 "A Sealed Transit Corridor"
 AMB_ud_refugee_transit_corridor_desc:0 "Refugees cross Amber in sealed trains toward other destinations. They are fed and treated, but they do not stay."
 AMB_ud_refugee_transit_corridor_done:0 "A Sealed Transit Corridor completed"
 AMB_ud_war_comes_to_the_yards:0 "War Comes to the Yards"
 AMB_ud_war_comes_to_the_yards_desc:0 "Erusea has invaded San Salvacion, and the war now reaches every partner of Central Usea. Amber's yards, which moved relief for four years, have become targets."
 AMB_ud_war_comes_to_the_yards_done:0 "War Comes to the Yards completed"
 AMB_ud_blackout_rules:0 "Blackout Rules for the Yards"
 AMB_ud_blackout_rules_desc:0 "Lights are dimmed, signals hooded and the night shunting rules rewritten. Accidents rise for a month and then fall as crews learn to work in the dark."
 AMB_ud_blackout_rules_done:0 "Blackout Rules for the Yards completed"
 AMB_ud_coalition_trains:0 "Trains for the Coalition"
 AMB_ud_coalition_trains_desc:0 "Amber's yards carry coalition freight under the same contracts that once carried relief. The difference is what is in the wagons."
 AMB_ud_coalition_trains_done:0 "Trains for the Coalition completed"
 AMB_ud_junction_shelters:0 "Shelters at the Junctions"
 AMB_ud_junction_shelters_desc:0 "Every major junction gets a shelter for crews and passengers. They are cramped and damp, and they are used far more often than anyone hoped."
 AMB_ud_junction_shelters_done:0 "Shelters at the Junctions completed"
 AMB_ud_night_repair_gangs:0 "Night Repair Gangs"
 AMB_ud_night_repair_gangs_desc:0 "Gangs of track workers repair by night what the raids break by day. Each gang knows its stretch of line the way a farmer knows a field."
 AMB_ud_night_repair_gangs_done:0 "Night Repair Gangs completed"
 AMB_ud_fuel_rationing:0 "Ration Fuel for the Lines"
 AMB_ud_fuel_rationing_desc:0 "Fuel goes first to locomotives, then to lorries, then to everyone else. Private motoring all but disappears from Amber's roads."
 AMB_ud_fuel_rationing_done:0 "Ration Fuel for the Lines completed"
 AMB_ud_civil_defence_volunteers:0 "Civil Defence Volunteers"
 AMB_ud_civil_defence_volunteers_desc:0 "Volunteers staff the shelters, the first aid posts and the fire watch. Many of them learned the work during the fragment years."
 AMB_ud_civil_defence_volunteers_done:0 "Civil Defence Volunteers completed"
 AMB_ud_war_contracts:0 "War Contracts"
 AMB_ud_war_contracts_desc:0 "The development programme is converted to war production under contract. Profits are capped; deliveries are not."
 AMB_ud_war_contracts_done:0 "War Contracts completed"
 AMB_ud_civilian_economy_guard:0 "Guard the Civilian Economy"
 AMB_ud_civilian_economy_guard_desc:0 "A protected share of freight and industry is kept for civilian life. The coalition receives less, and Amber's towns stay fed."
 AMB_ud_civilian_economy_guard_done:0 "Guard the Civilian Economy completed"
 AMB_ud_losses_on_the_line:0 "Losses on the Line"
 AMB_ud_losses_on_the_line_desc:0 "Crews killed in the raids are named in a published roll. Their families receive pensions under the safety code, whichever government signed it."
 AMB_ud_losses_on_the_line_done:0 "Losses on the Line completed"
 AMB_ud_exposure_ledger:0 "The Exposure Ledger"
 AMB_ud_exposure_ledger_desc:0 "Amber records what the war cost it: yards destroyed, crews lost, contracts broken. The ledger is meant for the peace conference, and as a warning to the next cabinet."
 AMB_ud_exposure_ledger_done:0 "The Exposure Ledger completed"
 AMB_ud_yards_after_the_war:0 "The Yards after the War"
 AMB_ud_yards_after_the_war_desc:0 "The crisis years are over. Amber's yards are half ruin and half improvisation, and the country must decide whether to rebuild what it had or what it now needs."
 AMB_ud_yards_after_the_war_done:0 "The Yards after the War completed"
 AMB_ud_rebuild_as_before:0 "Rebuild as Before"
 AMB_ud_rebuild_as_before_desc:0 "The old yards will be rebuilt to the old plans by the old firms. It is quick and familiar, and it leaves every old bottleneck where it was."
 AMB_ud_rebuild_as_before_done:0 "Rebuild as Before completed"
 AMB_ud_rebuild_for_usea:0 "Rebuild for a Continent"
 AMB_ud_rebuild_for_usea_desc:0 "The yards will be rebuilt as a hub for the continent's reconstruction freight. Amber bets that the rest of Usea will need trains more than it resents them."
 AMB_ud_rebuild_for_usea_done:0 "Rebuild for a Continent completed"
 AMB_ud_war_damage_claims:0 "Settle the War Damage Claims"
 AMB_ud_war_damage_claims_desc:0 "Contractors, landowners and families file claims for what the crisis years destroyed. A claims tribunal will settle them on published rules, slowly."
 AMB_ud_war_damage_claims_done:0 "Settle the War Damage Claims completed"
 AMB_ud_reconstruction_freight:0 "Reconstruction Freight Contracts"
 AMB_ud_reconstruction_freight_desc:0 "Amber's firms bid for the freight that will rebuild Usea's cities. The contracts are large, long and politically delicate."
 AMB_ud_reconstruction_freight_done:0 "Reconstruction Freight Contracts completed"
 AMB_ud_veterans_of_the_yards:0 "Veterans of the Yards"
 AMB_ud_veterans_of_the_yards_desc:0 "Rail crews who worked through the fragments and the raids are honoured, pensioned and given first claim on the new jobs. They served without uniforms."
 AMB_ud_veterans_of_the_yards_done:0 "Veterans of the Yards completed"
 AMB_ud_new_development_compact:0 "A New Development Compact"
 AMB_ud_new_development_compact_desc:0 "Government, firms and unions sign a development compact for the postwar decade. It is the first bargain in Amber's history written by a country that knows what its bargains can cost."
 AMB_ud_new_development_compact_done:0 "A New Development Compact completed"
 AMB_ud_contract_court:0 "A Standing Contract Court"
 AMB_ud_contract_court_desc:0 "A permanent court will hear disputes over public contracts. Ministers lose their favourite discretion, and firms lose their favourite delays."
 AMB_ud_contract_court_done:0 "A Standing Contract Court completed"
 AMB_ud_freight_partnerships:0 "Freight Partnerships with Neighbours"
 AMB_ud_freight_partnerships_desc:0 "Amber offers its neighbours shared timetables and through-running agreements. Trains cross borders without stopping to change crews."
 AMB_ud_freight_partnerships_done:0 "Freight Partnerships with Neighbours completed"
 AMB_ud_republic_contract_ledger:0 "The Republic's Contract Ledger"
 AMB_ud_republic_contract_ledger_desc:0 "Every bargain Amber made, from the first register to the last reconstruction contract, is bound into one public ledger. The Contract Republic closes its books."
 AMB_ud_republic_contract_ledger_done:0 "The Republic's Contract Ledger completed"
 UGE_ud_reserve_question:0 "The Reserve Question"
 UGE_ud_reserve_question_desc:0 "Ugellas keeps its reserves dispersed: depots, vehicles and trained reservists scattered across the country. The reserve officers who manage them now ask who manages the country."
 UGE_ud_reserve_question_done:0 "The Reserve Question completed"
 UGE_ud_keep_the_national_administration:0 "Keep the National Administration"
 UGE_ud_keep_the_national_administration_desc:0 "The national administration has kept the depots stocked and the borders quiet. It will stay, and it will ask the reserve officers to stay in their depots."
 UGE_ud_keep_the_national_administration_done:0 "Keep the National Administration completed"
 UGE_ud_reserve_officers_circle:0 "The Reserve Officers' Circle"
 UGE_ud_reserve_officers_circle_desc:0 "A circle of reserve officers argues that a dispersed country needs a government that thinks like a dispersed army: decentralised, disciplined and always ready to move."
 UGE_ud_reserve_officers_circle_done:0 "The Reserve Officers' Circle completed"
 UGE_ud_municipal_league:0 "The Municipal League"
 UGE_ud_municipal_league_desc:0 "The towns that host the depots form a league. They want the reserve's money spent locally, its officers answerable locally and a federal parliament."
 UGE_ud_municipal_league_done:0 "The Municipal League completed"
 UGE_ud_administration_inventory:0 "An Inventory of the Republic"
 UGE_ud_administration_inventory_desc:0 "The administration counts what it governs: depots, roads, towns and people. The inventory is dull, accurate and politically useful."
 UGE_ud_administration_inventory_done:0 "An Inventory of the Republic completed"
 UGE_ud_council_doctrine:0 "The Circle's Doctrine of Government"
 UGE_ud_council_doctrine_desc:0 "The circle writes a doctrine of government: every ministry dispersed, every office with a deputy somewhere else, every decision taken where it will be carried out."
 UGE_ud_council_doctrine_done:0 "The Circle's Doctrine of Government completed"
 UGE_ud_federation_charter:0 "The Federal Charter"
 UGE_ud_federation_charter_desc:0 "The league's charter gives each town a seat, each region a budget and the capital the job of coordinating rather than commanding."
 UGE_ud_federation_charter_done:0 "The Federal Charter completed"
 UGE_ud_administration_renewed:0 "The Administration Renews Itself"
 UGE_ud_administration_renewed_desc:0 "The administration renews its mandate the way it renews a depot lease: with an inventory, a review and a signature. Nobody votes, and nobody is surprised."
 UGE_ud_administration_renewed_done:0 "The Administration Renews Itself completed"
 UGE_ud_reserve_council:0 "The Reserve Council Governs"
 UGE_ud_reserve_council_desc:0 "The Reserve Council takes office and moves the ministries out of the capital into dispersed offices. Government becomes something that happens everywhere at once."
 UGE_ud_reserve_council_done:0 "The Reserve Council Governs completed"
 UGE_ud_federal_parliament:0 "The First Federal Parliament"
 UGE_ud_federal_parliament_desc:0 "The municipal league convenes a federal parliament and forms a government answerable to it. The towns now hold the purse, and the capital holds the telephone."
 UGE_ud_federal_parliament_done:0 "The First Federal Parliament completed"
 UGE_ud_depot_leases_published:0 "Publish the Depot Leases"
 UGE_ud_depot_leases_published_desc:0 "Every depot lease, with its cost and its custodian, is published. Towns discover how much they are paid to host the reserve, and how much less than their neighbours."
 UGE_ud_depot_leases_published_done:0 "Publish the Depot Leases completed"
 UGE_ud_dispersed_ministries:0 "Disperse the Ministries"
 UGE_ud_dispersed_ministries_desc:0 "Ministries move into depots, schools and town halls across the country. Officials commute between offices that are deliberately far apart."
 UGE_ud_dispersed_ministries_done:0 "Disperse the Ministries completed"
 UGE_ud_federal_budget:0 "The First Federal Budget"
 UGE_ud_federal_budget_desc:0 "The federal budget gives every town a share of the reserve spending. The share is small; the precedent is large."
 UGE_ud_federal_budget_done:0 "The First Federal Budget completed"
 UGE_ud_depot_census:0 "A Census of the Depots"
 UGE_ud_depot_census_desc:0 "Ugellas has more depots than any map shows. A census will find them, name their custodians and record what is actually inside them."
 UGE_ud_depot_census_done:0 "A Census of the Depots completed"
 UGE_ud_depot_custodians:0 "Custodians for Every Depot"
 UGE_ud_depot_custodians_desc:0 "Every depot gets a named custodian and a deputy who lives somewhere else. A depot without a custodian is a rumour, not a reserve."
 UGE_ud_depot_custodians_done:0 "Custodians for Every Depot completed"
 UGE_ud_neighbour_storage_offer:0 "Storage for Our Neighbours"
 UGE_ud_neighbour_storage_offer_desc:0 "Ugellas offers neighbouring governments space in its dispersed depots for their own emergency stocks. Storage is cheap to offer and expensive to honour."
 UGE_ud_neighbour_storage_offer_done:0 "Storage for Our Neighbours completed"
 UGE_ud_warning_reserves:0 "Reserves after the Warning"
 UGE_ud_warning_reserves_desc:0 "The asteroid warning turns every depot into an emergency depot. Neighbours who stored grain in Ugellas now ask whether they can store people."
 UGE_ud_warning_reserves_done:0 "Reserves after the Warning completed"
 UGE_ud_usean_reserve_pact:0 "A Usean Reserve Pact"
 UGE_ud_usean_reserve_pact_desc:0 "Ugellas signs a reserve pact with its neighbours: shared depots, shared inventories and a shared obligation to open them. Its reserve becomes a regional reserve."
 UGE_ud_usean_reserve_pact_done:0 "A Usean Reserve Pact completed"
 UGE_ud_national_reserve_only:0 "A National Reserve Only"
 UGE_ud_national_reserve_only_desc:0 "The depots are for Ugellas. Neighbours may buy what they need, but the reserve will not be pledged to anyone else's emergency."
 UGE_ud_national_reserve_only_done:0 "A National Reserve Only completed"
 UGE_ud_pact_storage_rotas:0 "Pact Storage Rotas"
 UGE_ud_pact_storage_rotas_desc:0 "Staff from the pact's members rotate through Ugellas's depots to learn them. In an emergency the custodian at the gate may not be Ugellan."
 UGE_ud_pact_storage_rotas_done:0 "Pact Storage Rotas completed"
 UGE_ud_national_reserve_audits:0 "National Reserve Audits"
 UGE_ud_national_reserve_audits_desc:0 "Auditors count every sack, drum and crate in the national reserve twice a year. What is missing is reported, and what is reported is replaced."
 UGE_ud_national_reserve_audits_done:0 "National Reserve Audits completed"
 UGE_ud_coup_depots:0 "The Depots on the Night of the Coup"
 UGE_ud_coup_depots_desc:0 "The coup across Usea reaches Ugellas as a question: who holds the keys to the depots, and will they open them for whoever asks with a rifle?"
 UGE_ud_coup_depots_done:0 "The Depots on the Night of the Coup completed"
 UGE_ud_battery_and_the_reserve:0 "The Battery and the Reserve"
 UGE_ud_battery_and_the_reserve_desc:0 "Stonehenge is complete in San Salvacion. Some ministers ask whether a battery in the desert makes Ugellas's depots unnecessary. The custodians do not think so."
 UGE_ud_battery_and_the_reserve_done:0 "The Battery and the Reserve completed"
 UGE_ud_reserve_ledger:0 "The Reserve Ledger"
 UGE_ud_reserve_ledger_desc:0 "Every depot, every custodian and every pledge is entered in one ledger. When the fragments come, the ledger will say what can be opened and by whom."
 UGE_ud_reserve_ledger_done:0 "The Reserve Ledger completed"
 UGE_ud_shelter_dispersal_plan:0 "A Dispersal Plan for Shelter"
 UGE_ud_shelter_dispersal_plan_desc:0 "Ugellas will meet the fragments the way it meets everything else: spread out. Shelter is assigned by depot, and every depot has a list of the families it will receive."
 UGE_ud_shelter_dispersal_plan_done:0 "A Dispersal Plan for Shelter completed"
 UGE_ud_depot_shelters:0 "Shelters in the Depots"
 UGE_ud_depot_shelters_desc:0 "Depot cellars and tunnels are reinforced to take people as well as stores. It is cheaper than building new shelters and more crowded than anyone admits."
 UGE_ud_depot_shelters_done:0 "Shelters in the Depots completed"
 UGE_ud_mobile_relief_columns:0 "Mobile Relief Columns"
 UGE_ud_mobile_relief_columns_desc:0 "Lorries, field kitchens and medical teams are organised into columns that can reach any district within a day. Each column drills once a season."
 UGE_ud_mobile_relief_columns_done:0 "Mobile Relief Columns completed"
 UGE_ud_uge_preparation_record:0 "Close the Preparation Record"
 UGE_ud_uge_preparation_record_desc:0 "Preparations completed before the impact are recorded and closed. Whatever Ugellas does afterwards will be relief, honestly named."
 UGE_ud_uge_preparation_record_done:0 "Close the Preparation Record completed"
 UGE_ud_impact_dispersal:0 "The Dispersal Night"
 UGE_ud_impact_dispersal_desc:0 "The fragments have fallen. Across Ugellas families walk to their assigned depots by torchlight, and the custodians find out whether their lists were true."
 UGE_ud_impact_dispersal_done:0 "The Dispersal Night completed"
 UGE_ud_open_the_depots:0 "Open the Depots"
 UGE_ud_open_the_depots_desc:0 "The reserve is opened to everyone who needs it. Ugellas will be generous now and short later, and it accepts the trade."
 UGE_ud_open_the_depots_done:0 "Open the Depots completed"
 UGE_ud_hold_the_depots:0 "Hold the Depots"
 UGE_ud_hold_the_depots_desc:0 "The reserve is opened only by ration and only by list. Some will go short now so that the depots are not empty when the second crisis comes."
 UGE_ud_hold_the_depots_done:0 "Hold the Depots completed"
 UGE_ud_depot_kitchens:0 "Depot Kitchens"
 UGE_ud_depot_kitchens_desc:0 "Field kitchens run from every open depot, feeding anyone who queues. Some of them will still be running a year later."
 UGE_ud_depot_kitchens_done:0 "Depot Kitchens completed"
 UGE_ud_reserve_rationing:0 "Reserve Rationing Cards"
 UGE_ud_reserve_rationing_desc:0 "Ration cards are issued by depot, stamped by custodian and counted every week. Black markets appear, and so do the inspectors who close them."
 UGE_ud_reserve_rationing_done:0 "Reserve Rationing Cards completed"
 UGE_ud_refugee_depots:0 "Refugees at the Depots"
 UGE_ud_refugee_depots_desc:0 "Erusea has closed its border to refugees. Families turned back at the Erusean border find their way to Ugellas's depots, where there is food and, sometimes, a roof."
 UGE_ud_refugee_depots_done:0 "Refugees at the Depots completed"
 UGE_ud_depot_villages:0 "Depot Villages"
 UGE_ud_depot_villages_desc:0 "Refugees settle around the depots, building villages where there were only warehouses. Ugellas grows by the size of a town."
 UGE_ud_depot_villages_done:0 "Depot Villages completed"
 UGE_ud_onward_columns:0 "Onward Columns"
 UGE_ud_onward_columns_desc:0 "Refugees are fed, treated and carried onward in the mobility columns to wherever they are expected. Ugellas is a road, not a destination."
 UGE_ud_onward_columns_done:0 "Onward Columns completed"
 UGE_ud_reserves_called:0 "The Reserves Are Called"
 UGE_ud_reserves_called_desc:0 "Erusea has invaded San Salvacion, and Central Usea's partners are at war. Ugellas calls its reservists to the depots they have guarded for a decade."
 UGE_ud_reserves_called_done:0 "The Reserves Are Called completed"
 UGE_ud_dispersed_command_posts:0 "Dispersed Command Posts"
 UGE_ud_dispersed_command_posts_desc:0 "Command posts are spread across the depots so that no single raid can silence them. Orders arrive late, but they arrive."
 UGE_ud_dispersed_command_posts_done:0 "Dispersed Command Posts completed"
 UGE_ud_coalition_depots:0 "Depots for the Coalition"
 UGE_ud_coalition_depots_desc:0 "Ugellas opens its depots to coalition forces moving to the front. Custodians who stored grain now store shells."
 UGE_ud_coalition_depots_done:0 "Depots for the Coalition completed"
 UGE_ud_civil_mobility_orders:0 "Civil Mobility Orders"
 UGE_ud_civil_mobility_orders_desc:0 "Civilian lorries and drivers are registered for mobilisation, with compensation fixed in advance. The order is unpopular and obeyed."
 UGE_ud_civil_mobility_orders_done:0 "Civil Mobility Orders completed"
 UGE_ud_reservist_rotations:0 "Reservist Rotations"
 UGE_ud_reservist_rotations_desc:0 "Reservists rotate between depots and the front so that no unit is worn out and no depot is left unguarded. It is fair and complicated."
 UGE_ud_reservist_rotations_done:0 "Reservist Rotations completed"
 UGE_ud_fuel_caches:0 "Fuel Caches"
 UGE_ud_fuel_caches_desc:0 "Fuel is cached in small quantities across the country. A column can refuel anywhere, and a raid can destroy only a little at a time."
 UGE_ud_fuel_caches_done:0 "Fuel Caches completed"
 UGE_ud_evacuation_columns:0 "Evacuation Columns"
 UGE_ud_evacuation_columns_desc:0 "The relief columns of the fragment years become evacuation columns. They know the roads, the depots and the families."
 UGE_ud_evacuation_columns_done:0 "Evacuation Columns completed"
 UGE_ud_defend_the_depots:0 "Defend the Depots"
 UGE_ud_defend_the_depots_desc:0 "The depots will be defended where they stand. Ugellas keeps its reserve at home and dares anyone to take it."
 UGE_ud_defend_the_depots_done:0 "Defend the Depots completed"
 UGE_ud_empty_the_depots_forward:0 "Empty the Depots Forward"
 UGE_ud_empty_the_depots_forward_desc:0 "The reserve is sent forward to the coalition's front. Ugellas's depots stand empty, and the war is fought with what was in them."
 UGE_ud_empty_the_depots_forward_done:0 "Empty the Depots Forward completed"
 UGE_ud_reserve_losses:0 "The Reserve's Losses"
 UGE_ud_reserve_losses_desc:0 "Reservists killed in the war are named by depot. Every depot keeps its own roll, and every town that hosted a depot reads it."
 UGE_ud_reserve_losses_done:0 "The Reserve's Losses completed"
 UGE_ud_exposure_register:0 "The Exposure Register"
 UGE_ud_exposure_register_desc:0 "Ugellas records what the war cost it: depots lost, stocks spent, columns ambushed. The register will be read at the peace and in every budget after it."
 UGE_ud_exposure_register_done:0 "The Exposure Register completed"
 UGE_ud_dispersal_lessons:0 "Lessons of Dispersal"
 UGE_ud_dispersal_lessons_desc:0 "Officers and custodians write down what dispersal achieved and where it failed. The lessons are blunt, because the people who wrote them were there."
 UGE_ud_dispersal_lessons_done:0 "Lessons of Dispersal completed"
 UGE_ud_depots_after_the_war:0 "The Depots after the War"
 UGE_ud_depots_after_the_war_desc:0 "The crisis years are over. Ugellas's depots are empty, damaged or full of things nobody needs, and the country must decide what a reserve is for in peacetime."
 UGE_ud_depots_after_the_war_done:0 "The Depots after the War completed"
 UGE_ud_restock_the_reserve:0 "Restock the Reserve"
 UGE_ud_restock_the_reserve_desc:0 "The depots will be restocked for the next war or the next crisis. Ugellas will be ready again, and it will pay for readiness every year."
 UGE_ud_restock_the_reserve_done:0 "Restock the Reserve completed"
 UGE_ud_release_the_reserve:0 "Release the Depots to the Towns"
 UGE_ud_release_the_reserve_desc:0 "Depots are handed to the towns for schools, clinics and workshops. Ugellas gives up part of its reserve to rebuild its peace."
 UGE_ud_release_the_reserve_done:0 "Release the Depots to the Towns completed"
 UGE_ud_inventory_of_losses:0 "An Inventory of Losses"
 UGE_ud_inventory_of_losses_desc:0 "Every depot reports what it lost, what it gave and what it still holds. The inventory is the basis of every claim and every compensation."
 UGE_ud_inventory_of_losses_done:0 "An Inventory of Losses completed"
 UGE_ud_reserve_reform:0 "Reform the Reserve"
 UGE_ud_reserve_reform_desc:0 "The reserve is reorganised around the lessons of dispersal: fewer depots, better custodians and columns that train with the towns they serve."
 UGE_ud_reserve_reform_done:0 "Reform the Reserve completed"
 UGE_ud_depot_conversion:0 "Convert the Depots"
 UGE_ud_depot_conversion_desc:0 "Depot buildings become schools, workshops and housing. The conversion is quick, because the buildings were solid, and cheap, because they were already paid for."
 UGE_ud_depot_conversion_done:0 "Convert the Depots completed"
 UGE_ud_mobility_agreements:0 "Mobility Agreements with Neighbours"
 UGE_ud_mobility_agreements_desc:0 "Ugellas signs agreements with its neighbours on shared roads, through traffic and emergency columns. The columns of the war years become a civil service."
 UGE_ud_mobility_agreements_done:0 "Mobility Agreements with Neighbours completed"
 UGE_ud_reservists_home:0 "Reservists Come Home"
 UGE_ud_reservists_home_desc:0 "Reservists are demobilised with pensions, jobs and a place on the custodian lists. The depots they guarded are now guarded by their neighbours."
 UGE_ud_reservists_home_done:0 "Reservists Come Home completed"
 UGE_ud_towns_compensated:0 "Compensate the Host Towns"
 UGE_ud_towns_compensated_desc:0 "Towns that hosted depots through the crisis years are compensated for the burden. The compensation is late and modest, and it is paid."
 UGE_ud_towns_compensated_done:0 "Compensate the Host Towns completed"
 UGE_ud_reserve_law:0 "A Reserve Law for Peacetime"
 UGE_ud_reserve_law_desc:0 "A reserve law sets out what the depots hold, who opens them and who answers for them. It is the first time the reserve has been governed by law rather than habit."
 UGE_ud_reserve_law_done:0 "A Reserve Law for Peacetime completed"
 UGE_ud_civil_mobility_network:0 "A Civil Mobility Network"
 UGE_ud_civil_mobility_network_desc:0 "Roads, lorries and drivers from the columns become a civil transport network. Villages that were reached by the relief columns are now reached by buses."
 UGE_ud_civil_mobility_network_done:0 "A Civil Mobility Network completed"
 UGE_ud_dispersed_republic:0 "The Dispersed Republic"
 UGE_ud_dispersed_republic_desc:0 "Ugellas survived the crisis years by being everywhere at once. The republic now writes that habit into its institutions, its budgets and its maps."
 UGE_ud_dispersed_republic_done:0 "The Dispersed Republic completed"
 DEL_ud_inspection_question:0 "The Inspectors' Question"
 DEL_ud_inspection_question_desc:0 "Delarus is a country of inspectors: of accounts, of requisitions, of promises made by the state. Now the inspectors ask who inspects the government itself."
 DEL_ud_inspection_question_done:0 "The Inspectors' Question completed"
 DEL_ud_keep_the_present_government:0 "Keep the Present Government"
 DEL_ud_keep_the_present_government_desc:0 "The present government has balanced the inspectors against the commanders for years. It will keep doing so, and it will ask both sides to be patient."
 DEL_ud_keep_the_present_government_done:0 "Keep the Present Government completed"
 DEL_ud_inspectorate_movement:0 "The Inspectorate Movement"
 DEL_ud_inspectorate_movement_desc:0 "Senior inspectors argue that the government should be answerable to the same rules it enforces: published accounts, independent audit and an elected chamber to read them."
 DEL_ud_inspectorate_movement_done:0 "The Inspectorate Movement completed"
 DEL_ud_command_council_movement:0 "The Command Council Movement"
 DEL_ud_command_council_movement_desc:0 "Senior commanders argue that inspection has become obstruction. They propose a Command Council that would govern by order and inspect afterwards."
 DEL_ud_command_council_movement_done:0 "The Command Council Movement completed"
 DEL_ud_government_review:0 "A Review of the Government"
 DEL_ud_government_review_desc:0 "The government reviews its own record and publishes the findings. The review is gentle, but it is the first one."
 DEL_ud_government_review_done:0 "A Review of the Government completed"
 DEL_ud_inspectors_charter:0 "The Inspectors' Charter"
 DEL_ud_inspectors_charter_desc:0 "The charter would make the audit office independent, the accounts public and the government answerable to an elected chamber. The inspectors read it aloud at their own congress."
 DEL_ud_inspectors_charter_done:0 "The Inspectors' Charter completed"
 DEL_ud_command_staff_plan:0 "The Command Staff Plan"
 DEL_ud_command_staff_plan_desc:0 "The plan replaces ministries with directorates under a single command staff. Every order will have an author, and every author will have a superior."
 DEL_ud_command_staff_plan_done:0 "The Command Staff Plan completed"
 DEL_ud_government_mandate:0 "The Government's Mandate"
 DEL_ud_government_mandate_desc:0 "The government asks for no new powers and renounces none. It promises to be inspected and to command, and to say which it is doing."
 DEL_ud_government_mandate_done:0 "The Government's Mandate completed"
 DEL_ud_inspectorate_cabinet:0 "The Inspectorate Cabinet"
 DEL_ud_inspectorate_cabinet_desc:0 "An Inspectorate Cabinet takes office under the charter and calls an elected chamber. The audit office now audits the cabinet that created it."
 DEL_ud_inspectorate_cabinet_done:0 "The Inspectorate Cabinet completed"
 DEL_ud_command_council:0 "The Command Council"
 DEL_ud_command_council_desc:0 "The Command Council takes office and suspends the old inspection regime. Orders are faster now, and nobody outside the Council reads them."
 DEL_ud_command_council_done:0 "The Command Council completed"
 DEL_ud_open_dockets:0 "Open the Dockets"
 DEL_ud_open_dockets_desc:0 "Government dockets older than a year are opened to the public. Most are dull, and a few are explosive."
 DEL_ud_open_dockets_done:0 "Open the Dockets completed"
 DEL_ud_inspectorate_first_audit:0 "The First Audit of the State"
 DEL_ud_inspectorate_first_audit_desc:0 "The Inspectorate's first audit of the state is published in full. Three ministers resign, and one of them is from the Inspectorate itself."
 DEL_ud_inspectorate_first_audit_done:0 "The First Audit of the State completed"
 DEL_ud_council_orders:0 "The Council's Standing Orders"
 DEL_ud_council_orders_desc:0 "The Council issues standing orders for every directorate. The orders are clear, numbered and binding, and none of them can be appealed."
 DEL_ud_council_orders_done:0 "The Council's Standing Orders completed"
 DEL_ud_obligations_register:0 "A Register of Foreign Obligations"
 DEL_ud_obligations_register_desc:0 "Delarus has signed treaties, guarantees and relief pledges it can no longer list from memory. A register will record every obligation and who is answerable for it."
 DEL_ud_obligations_register_done:0 "A Register of Foreign Obligations completed"
 DEL_ud_docket_clerks:0 "Train the Docket Clerks"
 DEL_ud_docket_clerks_desc:0 "A corps of docket clerks is trained to read treaties the way inspectors read accounts. They are slow, precise and very hard to bribe."
 DEL_ud_docket_clerks_done:0 "Train the Docket Clerks completed"
 DEL_ud_treaty_verification_offer:0 "Offer to Verify Treaties"
 DEL_ud_treaty_verification_offer_desc:0 "Delarus offers its inspectors to verify other countries' treaty obligations. It is a small country's way of being indispensable."
 DEL_ud_treaty_verification_offer_done:0 "Offer to Verify Treaties completed"
 DEL_ud_warning_dockets:0 "Dockets after the Warning"
 DEL_ud_warning_dockets_desc:0 "The asteroid warning produces a flood of pledges: money, shelters, trains and grain. Delarus opens a docket for every pledge and waits to see which are kept."
 DEL_ud_warning_dockets_done:0 "Dockets after the Warning completed"
 DEL_ud_relief_auditors:0 "Auditors for the Relief Accounts"
 DEL_ud_relief_auditors_desc:0 "Delarus offers to audit the relief accounts of the Usean governments. Its inspectors will follow the money and say where it went."
 DEL_ud_relief_auditors_done:0 "Auditors for the Relief Accounts completed"
 DEL_ud_national_dockets_only:0 "Inspect Only at Home"
 DEL_ud_national_dockets_only_desc:0 "Delarus will inspect its own relief and nobody else's. Foreign accounts are foreign business."
 DEL_ud_national_dockets_only_done:0 "Inspect Only at Home completed"
 DEL_ud_audit_missions:0 "Audit Missions Abroad"
 DEL_ud_audit_missions_desc:0 "Small missions of Delarusian inspectors travel to relief offices across Usea. They are welcomed by the honest and delayed by everyone else."
 DEL_ud_audit_missions_done:0 "Audit Missions Abroad completed"
 DEL_ud_home_inspections:0 "Inspections at Home"
 DEL_ud_home_inspections_desc:0 "Every relief store and shelter in Delarus is inspected on a published schedule. The schedule is kept, which surprises everyone."
 DEL_ud_home_inspections_done:0 "Inspections at Home completed"
 DEL_ud_coup_dockets:0 "The Coup Dockets"
 DEL_ud_coup_dockets_desc:0 "The coup across Usea leaves dockets everywhere: orders signed by officers who were arrested the next morning. Delarus must decide which orders still stand."
 DEL_ud_coup_dockets_done:0 "The Coup Dockets completed"
 DEL_ud_battery_verification:0 "Verifying the Battery's Accounts"
 DEL_ud_battery_verification_desc:0 "Stonehenge is complete in San Salvacion, and its member governments must account for what it cost. Delarus's inspectors are asked to read the civilian accounts."
 DEL_ud_battery_verification_done:0 "Verifying the Battery's Accounts completed"
 DEL_ud_obligations_ledger:0 "The Obligations Ledger"
 DEL_ud_obligations_ledger_desc:0 "Every treaty, pledge and guarantee Delarus has given or received is entered in one ledger, with its status: kept, broken, pending or forgotten."
 DEL_ud_obligations_ledger_done:0 "The Obligations Ledger completed"
 DEL_ud_relief_inspection_plan:0 "A Relief Inspection Plan"
 DEL_ud_relief_inspection_plan_desc:0 "Relief stores, shelters and hospitals are listed for inspection before the fragments fall. A shelter nobody inspected is a promise nobody kept."
 DEL_ud_relief_inspection_plan_done:0 "A Relief Inspection Plan completed"
 DEL_ud_shelter_inspections:0 "Shelter Inspections"
 DEL_ud_shelter_inspections_desc:0 "Inspectors visit every public shelter with a tape measure, a torch and a checklist. Many shelters fail; most are repaired."
 DEL_ud_shelter_inspections_done:0 "Shelter Inspections completed"
 DEL_ud_stores_inspections:0 "Stores Inspections"
 DEL_ud_stores_inspections_desc:0 "Relief stores are counted against their dockets. The difference between the two numbers is called the gap, and the gap is published."
 DEL_ud_stores_inspections_done:0 "Stores Inspections completed"
 DEL_ud_del_preparation_record:0 "Close the Preparation Record"
 DEL_ud_del_preparation_record_desc:0 "Preparations completed before the impact are recorded, inspected and closed. Delarus will not allow anything done afterwards to be backdated."
 DEL_ud_del_preparation_record_done:0 "Close the Preparation Record completed"
 DEL_ud_impact_dockets:0 "Dockets on the Night of the Fragments"
 DEL_ud_impact_dockets_desc:0 "The fragments have fallen. Every relief docket in Delarus is opened at once, and the inspectors discover which of their checklists were real."
 DEL_ud_impact_dockets_done:0 "Dockets on the Night of the Fragments completed"
 DEL_ud_emergency_warrant_relief:0 "Relief by Emergency Warrant"
 DEL_ud_emergency_warrant_relief_desc:0 "Relief officers receive emergency warrants to requisition what they need and account for it later. Relief is faster, and later is a long time."
 DEL_ud_emergency_warrant_relief_done:0 "Relief by Emergency Warrant completed"
 DEL_ud_inspected_relief:0 "Inspected Relief"
 DEL_ud_inspected_relief_desc:0 "Every relief issue is docketed and inspected, even now. Relief is slower, and every sack can be traced."
 DEL_ud_inspected_relief_done:0 "Inspected Relief completed"
 DEL_ud_warrant_convoys:0 "Warrant Convoys"
 DEL_ud_warrant_convoys_desc:0 "Convoys run under emergency warrant, requisitioning lorries and fuel on the road. They arrive, and the paperwork follows them for years."
 DEL_ud_warrant_convoys_done:0 "Warrant Convoys completed"
 DEL_ud_inspected_distribution:0 "Inspected Distribution Points"
 DEL_ud_inspected_distribution_desc:0 "Distribution points are staffed by an inspector and a clerk as well as a cook. Theft falls, and so does the speed of the queues."
 DEL_ud_inspected_distribution_done:0 "Inspected Distribution Points completed"
 DEL_ud_refugee_dockets:0 "Refugee Dockets"
 DEL_ud_refugee_dockets_desc:0 "Erusea has closed its border to refugees. Those who reach Delarus are docketed, and their dockets ask a question the state must answer: stay or move on?"
 DEL_ud_refugee_dockets_done:0 "Refugee Dockets completed"
 DEL_ud_registered_settlement:0 "Registered Settlement"
 DEL_ud_registered_settlement_desc:0 "Refugees may settle in Delarus once they are registered, housed and assigned work. The register will be the most complete in Usea."
 DEL_ud_registered_settlement_done:0 "Registered Settlement completed"
 DEL_ud_inspected_transit:0 "Inspected Transit"
 DEL_ud_inspected_transit_desc:0 "Refugees may cross Delarus under inspection, with food and care, but they may not stay. Their dockets travel with them."
 DEL_ud_inspected_transit_done:0 "Inspected Transit completed"
 DEL_ud_war_obligations:0 "The War's Obligations"
 DEL_ud_war_obligations_desc:0 "Erusea has invaded San Salvacion, and Central Usea's partners are at war. Delarus opens its obligations ledger at the page marked war and finds it longer than expected."
 DEL_ud_war_obligations_done:0 "The War's Obligations completed"
 DEL_ud_requisition_tribunals:0 "Requisition Tribunals"
 DEL_ud_requisition_tribunals_desc:0 "Tribunals hear disputes over wartime requisitions within a week. The army gets its lorries, and the owners get a receipt that a court will honour."
 DEL_ud_requisition_tribunals_done:0 "Requisition Tribunals completed"
 DEL_ud_coalition_commitments:0 "Coalition Commitments"
 DEL_ud_coalition_commitments_desc:0 "Delarus lists what it has promised the coalition and delivers it on schedule. The list is short, and every item on it arrives."
 DEL_ud_coalition_commitments_done:0 "Coalition Commitments completed"
 DEL_ud_air_raid_inspections:0 "Air Raid Inspections"
 DEL_ud_air_raid_inspections_desc:0 "Shelters inspected for the fragments are inspected again for the raids. Most passed the first time; fewer pass now."
 DEL_ud_air_raid_inspections_done:0 "Air Raid Inspections completed"
 DEL_ud_wartime_records:0 "Wartime Records Service"
 DEL_ud_wartime_records_desc:0 "A records service follows the army, the ministries and the shelters, copying everything and storing the copies somewhere else."
 DEL_ud_wartime_records_done:0 "Wartime Records Service completed"
 DEL_ud_command_liaison:0 "Command Liaison"
 DEL_ud_command_liaison_desc:0 "Liaison officers sit in every coalition headquarters that will have them. They report what was promised, what was asked and what was done."
 DEL_ud_command_liaison_done:0 "Command Liaison completed"
 DEL_ud_civil_shelter_audits:0 "Civil Shelter Audits"
 DEL_ud_civil_shelter_audits_desc:0 "Shelter audits are published every month, district by district. A district with a failing shelter gets its repair crew first."
 DEL_ud_civil_shelter_audits_done:0 "Civil Shelter Audits completed"
 DEL_ud_emergency_command:0 "Emergency Command"
 DEL_ud_emergency_command_desc:0 "Inspection is suspended for the duration. The war effort is run by order, and the orders are reviewed after the war."
 DEL_ud_emergency_command_done:0 "Emergency Command completed"
 DEL_ud_inspected_war_effort:0 "An Inspected War Effort"
 DEL_ud_inspected_war_effort_desc:0 "Even the war is inspected. Orders are slower, deliveries are surer, and nobody profits from the emergency without being caught."
 DEL_ud_inspected_war_effort_done:0 "An Inspected War Effort completed"
 DEL_ud_war_losses_docket:0 "The War Losses Docket"
 DEL_ud_war_losses_docket_desc:0 "The dead and the missing are docketed by name, unit and town. Every family receives a copy of the docket that concerns them."
 DEL_ud_war_losses_docket_done:0 "The War Losses Docket completed"
 DEL_ud_exposure_dossier:0 "The Exposure Dossier"
 DEL_ud_exposure_dossier_desc:0 "Delarus compiles a dossier of what the war cost it and what it was promised in return. The dossier will be tabled at the peace."
 DEL_ud_exposure_dossier_done:0 "The Exposure Dossier completed"
 DEL_ud_obligations_closed:0 "Close the Wartime Obligations"
 DEL_ud_obligations_closed_desc:0 "Wartime obligations are reviewed and closed one by one: kept, broken or released. Nothing is left open by accident."
 DEL_ud_obligations_closed_done:0 "Close the Wartime Obligations completed"
 DEL_ud_records_after_the_war:0 "The Records after the War"
 DEL_ud_records_after_the_war_desc:0 "The crisis years are over. Delarus holds the most complete records of the war in Usea, and it must decide whether to open them or seal them."
 DEL_ud_records_after_the_war_done:0 "The Records after the War completed"
 DEL_ud_truth_commission:0 "A Commission on the Record"
 DEL_ud_truth_commission_desc:0 "A commission will open the wartime records and hear anyone who claims they were wronged. It will take years and make enemies."
 DEL_ud_truth_commission_done:0 "A Commission on the Record completed"
 DEL_ud_sealed_archive:0 "Seal the Archive"
 DEL_ud_sealed_archive_desc:0 "The wartime records are sealed for a generation. The country moves on, and the records wait."
 DEL_ud_sealed_archive_done:0 "Seal the Archive completed"
 DEL_ud_testimony_hearings:0 "Testimony Hearings"
 DEL_ud_testimony_hearings_desc:0 "Hearings are held in every district. People testify about requisitions, evacuations and the men who signed the orders."
 DEL_ud_testimony_hearings_done:0 "Testimony Hearings completed"
 DEL_ud_public_records_law:0 "A Public Records Law"
 DEL_ud_public_records_law_desc:0 "A law guarantees public access to state records after a fixed period. Inspection becomes a right, not a favour."
 DEL_ud_public_records_law_done:0 "A Public Records Law completed"
 DEL_ud_archive_custody:0 "Archive Custody"
 DEL_ud_archive_custody_desc:0 "The sealed archive is placed in the custody of a commission that answers to no minister. It cannot be opened early, and it cannot be destroyed."
 DEL_ud_archive_custody_done:0 "Archive Custody completed"
 DEL_ud_usean_inspection_compact:0 "A Usean Inspection Compact"
 DEL_ud_usean_inspection_compact_desc:0 "Delarus offers its neighbours a compact for mutual inspection of reconstruction accounts. Several sign, and some of them mean it."
 DEL_ud_usean_inspection_compact_done:0 "A Usean Inspection Compact completed"
 DEL_ud_reconstruction_inspectors:0 "Reconstruction Inspectors"
 DEL_ud_reconstruction_inspectors_desc:0 "Every reconstruction contract gets an inspector. Building is slower, and the buildings stand."
 DEL_ud_reconstruction_inspectors_done:0 "Reconstruction Inspectors completed"
 DEL_ud_war_claims_tribunal:0 "A War Claims Tribunal"
