l_english:
 WEL_wd_adm_take_stock:0 "An Administration Without Voters"
 WEL_wd_adm_take_stock_desc:0 "The National Administration opens 1991 governing by ordinance, with no election calendar and a party that polls almost nobody. The imperial movement and the union camp between them hold nearly the whole electorate. Before it can do anything else, the administration must say in public how long it intends to govern, and on whose authority."
 WEL_wd_adm_ordinance_index:0 "Index the Emergency Ordinances"
 WEL_wd_adm_ordinance_index_desc:0 "Clerks gather every ordinance issued since the calendar stopped: tariffs, port rules, press licences and district budgets. Many contradict each other and some were never published at all. Printing the full index costs the administration its useful vagueness, but every faction now argues from the same book, and the next step can be argued in the open."
 WEL_wd_adm_ordinance_index_tt_1:0 "Opens four answers to the question of government; only one can be taken."
 WEL_wd_adm_port_hearings:0 "Hearings in the Port Towns"
 WEL_wd_adm_port_hearings_desc:0 "Commissioners sail to the port towns of the main island and the western islands to hear what people want from a government. The halls are crowded and angry, and imperial petitioners outnumber everyone else at most sittings. The record they bring back is honest, which makes it awkward for whoever governs next, and expensive to ignore."
 WEL_wd_adm_path_republic:0 "Reopen the Electoral Rolls"
 WEL_wd_adm_path_republic_desc:0 "The administration's own small party argues that a republic which never votes is not a republic. It proposes rebuilding the rolls district by district and returning power to an elected chamber, accepting that the first election may hand the chamber to its opponents. The case is principled and risky, and few outside the capital believe the administration means it."
 WEL_wd_adm_path_union:0 "The Crown Held in Commission"
 WEL_wd_adm_path_union_desc:0 "The union camp wants the islands governed as a United Kingdom of Wellow, with the crown exercised collectively by a council of the districts rather than by any single holder. It promises to keep party quarrels out of the ports. It also asks the administration to hand the seals to a body nobody has elected, on the strength of a petition."
 WEL_wd_adm_path_imperial:0 "Hear the Imperial Petition"
 WEL_wd_adm_path_imperial_desc:0 "Half the electorate, by the administration's own count, backs the movement that wants a Wellowan Empire: one flag, one fleet and a government that answers to national pride rather than to clerks. Its petition demands power now, without an election it expects to win anyway. Granting it brings discipline to the ports and fear to everyone outside the movement."
 WEL_wd_adm_path_standing:0 "Ordinance as Constitution"
 WEL_wd_adm_path_standing_desc:0 "The senior clerks propose the least dramatic answer: keep governing as before, but turn the emergency ordinances into a written administrative code with fixed rules and a court to enforce them. Nobody votes and nobody is crowned. The ports get predictability and the two great movements get nothing, which they will not forgive quickly."
 WEL_wd_adm_seat_chamber:0 "Seat the Restored Chamber"
 WEL_wd_adm_seat_chamber_desc:0 "The rebuilt rolls produce a chamber, and a cabinet drawn from its majority takes the government seals. The change runs through the office, not a person: ministers govern collectively and face the chamber on a fixed calendar. The administration's clerks stay on as civil servants, and every ordinance must now survive a vote or lapse."
 WEL_wd_adm_union_council:0 "Convene the Union Council"
 WEL_wd_adm_union_council_desc:0 "Delegates from every district, main island and western islands alike, form a union council that holds the crown in commission and governs under the name of the United Kingdom of Wellow. The council decides collectively and prints its minutes. Elections wait until the council judges the districts settled, and the parties are told to be patient."
 WEL_wd_adm_imperial_directorate:0 "Install the Imperial Directorate"
 WEL_wd_adm_imperial_directorate_desc:0 "A directorate drawn from the imperial movement's committees, retired naval officers and loyal clerks takes executive power and proclaims a Wellowan Empire. Decrees replace ordinances, and the party newspapers become the only newspapers. The directorate promises order in the ports and a fleet to be proud of. It has promised nothing to anyone who disagrees."
 WEL_wd_adm_standing_charter:0 "Charter the Standing Administration"
 WEL_wd_adm_standing_charter_desc:0 "The administration reconstitutes itself as a standing body of senior officials under a written charter, still without elections but now bound by its own code and a court that can strike down its ordinances. It governs collectively, as before, with no named head. The charter is dull, legalistic and stable, and gives the movements nothing to celebrate."
 WEL_wd_adm_chamber_wireless:0 "Ministers on the Wireless"
 WEL_wd_adm_chamber_wireless_desc:0 "Chamber sessions are broadcast to every district on state radio, including the western islands, where many voters have never seen a minister in person. The broadcasts expose quarrels the administration once settled behind closed doors, and imperial members use the airtime well. Over a season, though, listeners begin to judge ministers by what they actually say."
 WEL_wd_adm_district_charters:0 "Charters for the Districts"
 WEL_wd_adm_district_charters_desc:0 "The union council grants each district a written charter fixing its share of port dues, its local court and its seat on the council. Western islanders gain guarantees they never had under the ordinances. The capital loses some revenue and much discretion, and the council spends its first winter arbitrating between rival harbour towns."
 WEL_wd_adm_fleet_day:0 "The Imperial Fleet Day"
 WEL_wd_adm_fleet_day_desc:0 "The directorate stages a fleet day at the dockyard district, with every escort and submarine dressed in flags and party committees lining the quays. Recruiting offices open beside the brass bands. The spectacle burns fuel the fleet cannot spare and alarms every shipping agent on the south coast, but it fills the rolls of the naval reserve."
 WEL_wd_adm_ordinance_court:0 "A Court for the Ordinances"
 WEL_wd_adm_ordinance_court_desc:0 "A small administrative court gains the power to strike down ordinances that contradict the code, and its first judgments go against the administration itself. Senior officials grumble, and shipowners welcome rules they can finally plan around. The court cannot make the government popular, but it can make it predictable, which the ports value more."
 WEL_wd_dis_survey:0 "Survey the Outer Districts"
 WEL_wd_dis_survey_desc:0 "Ten of Wellow's sixteen districts have no paved roads worth the name, and the western island districts are reached only by sea. A survey of piers, roads, schools and tax offices costs a season of clerical work and ship time. It tells the capital, for the first time in years, what the outer districts actually lack and what they pay."
 WEL_wd_dis_west_piers:0 "Piers for the Western Islands"
 WEL_wd_dis_west_piers_desc:0 "The western island districts depend on piers built for fishing boats, not freight. Rebuilding the main pier on the large southwestern island, and the road that runs inland from it, costs steel the yards would rather use. Islanders gain a reliable link to the main island instead of a fair-weather one, and the coasters stop waiting offshore."
 WEL_wd_dis_far_west:0 "Roads at the Far West"
 WEL_wd_dis_far_west_desc:0 "The westernmost island district sits far from every other Wellowan harbour and has always been run by whichever official the capital could spare. A road between its harbours and a district office with a permanent staff are modest projects. For the islanders they are proof that the capital, whoever holds it, knows they exist."
 WEL_wd_dis_northwest_island:0 "The Northwest Island Road"
 WEL_wd_dis_northwest_island_desc:0 "The large island off the northwest coast has hill country, a few fishing harbours and two old naval moorings. A coast road joining its harbours lets the catch reach the moorings and the ferries. The work is slow in the hills and costly in a short building season, but the island finally becomes one place instead of several."
 WEL_wd_dis_southeast_islet:0 "An Officer for the Islet"
 WEL_wd_dis_southeast_islet_desc:0 "A small hill islet lies off the southeast coast, close to the sea lanes that run toward Belka. It has one naval mooring and little else. Paving its harbour road and stationing a district officer there costs little and keeps the islet tied to the main island rather than to the passing traffic. The navy also likes the view."
 WEL_wd_dis_northern_lowland:0 "Causeways on the Northern Lowland"
 WEL_wd_dis_northern_lowland_desc:0 "The northern lowland is the largest district on the main island, a wide plain broken by marshes, with almost no roads and no industry at all. Causeways across the worst marshes connect its villages to the capital plain. The work drains money for years before it pays back, yet the lowland's farms are what feed the capital."
 WEL_wd_dis_ferry_timetable:0 "A Ferry Timetable for All"
 WEL_wd_dis_ferry_timetable_desc:0 "A single timetable links every island district to the main island, with state-subsidised ferries running on fixed days in every season. Private owners complain that subsidised ferries undercut them; islanders say it is the first promise from the capital that arrives on schedule. The subsidy is permanent, and so is its bill."
 WEL_wd_dis_councils:0 "Elected Island Councils"
 WEL_wd_dis_councils_desc:0 "Each outer district elects a council with its own budget for piers, schools and roads, while the capital keeps defence, currency and the fleet. Councils spend money where islanders live rather than where clerks sit. They also argue with the capital every budget season, and some will elect imperial petitioners whatever the capital prefers."
 WEL_wd_dis_prefecture:0 "The Island Prefecture"
 WEL_wd_dis_prefecture_desc:0 "A single prefecture staffed from the capital governs every outer district under one code, with prefects rotating between islands every two years. Decisions arrive faster and corruption has fewer corners to hide in. Islanders lose any say in how their harbours are run, and the prefects become the face of a government most never chose."
 WEL_wd_dis_council_canneries:0 "The Councils Build Canneries"
 WEL_wd_dis_council_canneries_desc:0 "The first council budgets go not to monuments but to cold stores and canneries in the fishing harbours of the western islands. Catches that once spoiled on the quay are packed and shipped. The councils borrow to do it, and the capital must decide whether to guarantee the debt or let a council fail in public."
 WEL_wd_dis_prefect_circuit:0 "Prefects on the Ferry Circuit"
 WEL_wd_dis_prefect_circuit_desc:0 "Prefects ride the ferry circuit on a fixed calendar, inspecting tax offices, piers and schools and reporting straight to the capital. A district depot at the far west stores spare parts and paperwork alike. The circuit costs ship time and salaries, and it ends the habit of sending only good news from distant harbours."
 WEL_wd_reg_count_hulls:0 "Count the Merchant Hulls"
 WEL_wd_reg_count_hulls_desc:0 "More than nine hundred merchant hulls fly the Wellowan flag, from ocean tramps to coastal colliers, and they earn more foreign currency than anything the main island makes. Nobody has audited the register in years. Counting every hull, owner and crew list costs a season of harbour work and shows how much income actually sails home."
 WEL_wd_reg_harbour_offices:0 "Harbour Offices in Every Port"
 WEL_wd_reg_harbour_offices_desc:0 "Each port gets a harbour office able to register ships, check crews and collect dues on the spot, starting with the busy marsh ports of the northeast. Owners stop sailing to the capital for paperwork. The offices cost salaries, and they give the state a clerk on every quay, which some owners welcome and others plainly do not."
 WEL_wd_reg_navigation_school:0 "Navigation Schools for Crews"
 WEL_wd_reg_navigation_school_desc:0 "Ship officers trained abroad cost foreign wages and leave when better offers arrive. A navigation school beside the southwestern island moorings trains deck officers and engineers under Wellowan certificates. Four years pass before the first class sails. Owners pay part of the cost, grumbling, and the fleet slowly stops relying on foreign officers."
 WEL_wd_reg_shipping_exchange:0 "A Shipping Exchange in the Capital"
 WEL_wd_reg_shipping_exchange_desc:0 "Charter brokers in the capital trade freight contracts by telephone and handshake, and foreign brokers take most of the commission. An exchange with published rates and a settlement office keeps those commissions at home. It needs a building, a switchboard and rules the brokers dislike, and it earns its keep within two seasons."
 WEL_wd_reg_open:0 "Open the Registry to Foreigners"
 WEL_wd_reg_open_desc:0 "The open-registry school wants any owner in the world to register ships under the Wellowan flag for a modest fee and a light inspection. Fees would pour in and the register might double in a decade. So would the number of rusting hulls with unknown crews, and every foreign war would find some of its cargo flying Wellowan colours."
 WEL_wd_reg_national:0 "A National Line"
 WEL_wd_reg_national_desc:0 "The national-line school wants the state to buy controlling stakes in the largest shipping houses and run their ships on fixed routes with Wellowan crews and Wellowan yards. Freight rates would be steady and the slips busy. Owners who refuse to sell would face higher dues, and the treasury would carry every bad year at sea."
 WEL_wd_reg_mutual:0 "The Shipowners Mutual"
 WEL_wd_reg_mutual_desc:0 "The owners propose a mutual of their own: a pooled insurance fund, a shared repair budget and a common rate book, run by the owners under state supervision. It keeps ships in private hands and spreads the risk of a bad season. Critics note that a mutual run by the biggest owners will look after the biggest owners first."
 WEL_wd_reg_agents_abroad:0 "Registry Agents Abroad"
 WEL_wd_reg_agents_abroad_desc:0 "Registry agents open desks in foreign ports to sign up owners on the spot, and the fees fund a harbour-works company on the south coast. Inspection lags behind registration. The first casualty report involving a Wellowan-flagged hull with a foreign crew reaches the newspapers within a year, and the agents are asked awkward questions."
 WEL_wd_reg_line_routes:0 "Fixed Routes for the Line"
 WEL_wd_reg_line_routes_desc:0 "The national line publishes its first fixed timetable: coastal colliers between the dockyard district and the western islands, and ocean services on set days. Shippers can finally plan. A slip on the southwestern island takes the line's repair contracts, and private owners find themselves undercut on every route the line chooses to serve."
 WEL_wd_reg_hull_pool:0 "The Hull Insurance Pool"
 WEL_wd_reg_hull_pool_desc:0 "The mutual's insurance pool pays its first large claims after a storm season, and every member is still afloat. Premiums stay below what foreign insurers charge. The pool invests its reserves in a repair basin at the eastern ports, which keeps member ships off foreign slipways and their repair money at home."
 WEL_wd_reg_convoy_rules:0 "Sealed Orders for Every Master"
 WEL_wd_reg_convoy_rules_desc:0 "Every registered master receives sealed instructions for a war at sea: assembly ports, signals, escort rendezvous and the routes to avoid. The rules cost nothing until a war comes near, and then they are worth more than any escort. Owners complain about the paperwork; naval officers note the rules assume the navy has escorts to send."
 WEL_wd_fld_ledger:0 "Measure the Western Fields"
 WEL_wd_fld_ledger_desc:0 "Most of Wellow's oil and steel comes from the western district of the main island, the capital plain and the northeastern marshes, worked by plants that were never planned together. A field ledger records every well, mine and furnace with its output and its losses. It costs a year of surveys and settles arguments politicians prefer open."
 WEL_wd_fld_marsh_wells:0 "Wells in the Northeastern Marsh"
 WEL_wd_fld_marsh_wells_desc:0 "The northeastern marsh district holds a third of the nation's oil under ground that swallows roads every spring. Plank causeways and pumping stations let crews reach the wells all year. The work is miserable and expensive, but every barrel that reaches the coast without a detour through the capital saves fuel and freight."
 WEL_wd_fld_west_furnaces:0 "Ore Roads for the Western Furnaces"
 WEL_wd_fld_west_furnaces_desc:0 "The western district's steel works run furnaces that were modern when the yards last expanded. Rebuilding the road and rail links between mines, furnaces and the western harbour cuts the cost of every ton. New furnaces would need room the district no longer has, so the money goes into moving ore faster instead."
 WEL_wd_fld_capital_works:0 "Works Beside the Capital Plain"
 WEL_wd_fld_capital_works_desc:0 "The district west of the capital plain has workers, water and a rail line but almost no plants. Two new works there take the overflow of the capital's crowded industrial quarter, which has no room left to grow. The capital loses some prestige to its neighbour, and the neighbour gains the noise and the wages."
 WEL_wd_fld_refine_home:0 "Refine Every Barrel at Home"
 WEL_wd_fld_refine_home_desc:0 "The refining school says crude sold abroad is wealth given away. It wants every barrel refined in Wellowan plants, with fuel for the fleet and the ferries first and exports only from the surplus. Refineries are expensive and slow to build, and until they are finished the treasury earns less from oil than before."
 WEL_wd_fld_tankers:0 "Crude by Tanker"
 WEL_wd_fld_tankers_desc:0 "The export school says the merchant fleet and the oil fields were made for each other: load the crude, sail it to whoever pays most and buy finished fuel back when needed. Revenue arrives quickly and tanker owners prosper. The fleet's fuel then depends on foreign refineries, and a war at sea could leave the ferries idle."
 WEL_wd_fld_steel_first:0 "Spend the Oil on Steel"
 WEL_wd_fld_steel_first_desc:0 "A third school wants the oil money spent on steel: rolling mills, plate for the yards and rails for the island roads, with new wells deferred until the mills are running. It promises lasting industry rather than quick income. It also asks the oil districts to wait while the steel towns are served first, and they resent it."
 WEL_wd_fld_refinery:0 "A Refinery Beside the Oil District"
 WEL_wd_fld_refinery_desc:0 "The district between the western oil fields and the northwestern highlands has room, water and a sheltered harbour. A refinery there takes crude by pipe from the western wells and sends fuel to the capital by rail. It takes two years to commission and smells for twenty, and the fleet's tanks finally fill at home."
 WEL_wd_fld_tanker_terminal:0 "Deepwater Tanker Jetties"
 WEL_wd_fld_tanker_terminal_desc:0 "Deepwater jetties and storage tanks at the dockyard district let large tankers load without lightering, and a repair slip on the southeastern coast keeps them sailing. The terminal moves crude faster than any refinery could use it. The south coast earns harbour dues, as long as the sea lanes stay calm."
 WEL_wd_fld_plate_mill:0 "A Plate Mill for the Yards"
 WEL_wd_fld_plate_mill_desc:0 "A plate mill on the southeastern coast rolls ship steel for the dockyard district from western ore, cutting out the foreign mills that used to supply every hull. Yards gain a domestic supplier whose prices are not always lower. The oil districts watch their royalties spent on rolling stands and ask when their turn will come."
 WEL_wd_fld_fuel_reserve:0 "The Capital Fuel Reserve"
 WEL_wd_fld_fuel_reserve_desc:0 "The capital already keeps a fuel depot; it becomes a national reserve with written rules for when it may be drawn and who decides. Ferries, the fleet and the heating plants get guaranteed shares. A reserve that is never touched looks like waste in good years, and like foresight in every other kind of year."
 WEL_wd_yrd_open_gates:0 "Open the Yard Gates"
 WEL_wd_yrd_open_gates_desc:0 "Six building slips in the dockyard district, in the south of the main island, build nearly every Wellowan hull, and the yard has not been modernised since the current escorts were laid down. The government opens the gates to inspectors from the navy, the shipowners and the unions at once. Each wants the slips for itself, and there are only six."
 WEL_wd_yrd_apprentices:0 "Apprentices on the Slipways"
 WEL_wd_yrd_apprentices_desc:0 "Half the riveters and welders in the dockyard district are within ten years of retiring, and their children have gone to sea or to the capital. A paid apprenticeship of four years, with housing near the slips, fills the gap slowly. The unions want control of the intake, and the owners want apprentices bound to them for years."
 WEL_wd_yrd_south_cranes:0 "New Cranes on the South Quay"
 WEL_wd_yrd_south_cranes_desc:0 "The dockyard's cranes lift half what modern hull sections weigh, so every ship is built in small pieces and riveted slowly. Heavy cranes on the south quay and a widened yard road change the pace of every keel. The order goes abroad because no Wellowan plant can build them, and the bill arrives in foreign currency."
 WEL_wd_yrd_wage_board:0 "A Wage Board for the Slips"
 WEL_wd_yrd_wage_board_desc:0 "Every spring the yard unions and owners fight over wages, and every spring a hull is late. A standing board of owners, unions and the ministry sets slipway wages for three years at a time. Strikes become rarer and settlements slower, and the ministry now shares the blame for every disappointed welder."
 WEL_wd_yrd_escort_priority:0 "Escorts on Every Slip"
 WEL_wd_yrd_escort_priority_desc:0 "The navy argues that a merchant nation without escorts is a merchant nation waiting to be robbed. It wants the slips given to escorts for five years, with merchant work fitted in around them. The fleet grows and the owners wait, buying abroad the coasters their own yards would have built."
 WEL_wd_yrd_merchant_priority:0 "Merchant Keels First"
 WEL_wd_yrd_merchant_priority_desc:0 "The owners argue that ferries and coasters earn the money that pays for any navy. They want the slips given to merchant hulls, with warships built when there is room. The register grows younger and the island routes run on new ships, while the admirals sail old escorts a few more years."
 WEL_wd_yrd_repair_priority:0 "Repair Before New Keels"
 WEL_wd_yrd_repair_priority_desc:0 "The repair crews argue that the cheapest ship is the one already afloat. They want the slips cleared for refits and repairs that now go to foreign yards, and new construction only when repair work runs out. Ships last longer and the yard earns steadily, but nothing new slides into the water for years."
 WEL_wd_yrd_second_yard:0 "A Second Yard Facing Belka"
 WEL_wd_yrd_second_yard_desc:0 "Six slips are not enough for any plan. A second, smaller yard on the southern coast facing Belka takes the overflow, with two slips for coasters and escorts. It splits skilled workers between two sites and puts a strategic asset within sight of the narrow sea, which the navy notes with mixed feelings."
 WEL_wd_yrd_island_slip:0 "A Slip on the Southwestern Island"
 WEL_wd_yrd_island_slip_desc:0 "The southwestern island has the deepest sheltered water outside the main island and a fishing fleet that repairs its own boats on the beach. A proper slip there builds and mends coasters for the island routes. It brings skilled work to the islands, and it needs steel shipped across a sea that is not always kind."
 WEL_wd_yrd_standard_hull:0 "One Hull, Many Uses"
 WEL_wd_yrd_standard_hull_desc:0 "Yard designers propose a single standard hull that can be finished as a coaster, a ferry or a patrol vessel, built in sections on any slip. Owners lose the bespoke designs they like to boast about. The yards gain speed, spare parts become interchangeable and the navy can requisition merchant hulls that already fit its fittings."
 WEL_wd_flt_muster:0 "Muster the Coastal Fleet"
 WEL_wd_flt_muster_desc:0 "Wellow's navy is a coastal force of escorts and small submarines spread across moorings on the main island and the western islands, trained to survive rather than to win battles. Mustering it in one anchorage for the first time in years shows what it can do and what it lacks. The fuel bill alone shocks the treasury."
 WEL_wd_flt_moorings:0 "Moorings Across the Western Islands"
 WEL_wd_flt_moorings_desc:0 "The western island districts have more naval moorings than any other part of the country, most of them a buoy, a jetty and a fuel tank. Proper roads to the moorings on the middle island, with stores and a telephone line, let a squadron actually live there. The work is cheap, and the moorings stop being lines on a chart."
 WEL_wd_flt_submariners:0 "A School for Submariners"
 WEL_wd_flt_submariners_desc:0 "The small submarines are the navy's only weapon an enemy would genuinely fear, and their crews are trained in the boats themselves, at sea, one crew at a time. A shore school with a diving tank and attack trainers doubles the pace. It costs a building and a year, and veteran captains resent the classroom."
 WEL_wd_flt_sound_patrols:0 "Submarines in the Island Sounds"
 WEL_wd_flt_sound_patrols_desc:0 "The submarine school says the channels between the islands are Wellow's natural defence: narrow, deep and known only to Wellowan pilots. Small boats lying in the sounds can make any intruder pay. The doctrine defends the islands well and the merchant lanes hardly at all, which the shipowners will notice first."
 WEL_wd_flt_escort_screen:0 "Escorts for the Merchant Lanes"
 WEL_wd_flt_escort_screen_desc:0 "The escort school says a navy that guards empty harbours while the merchant fleet sails unprotected has misunderstood its country. It wants the escorts organised around the merchant lanes and drilled with convoys. The lanes become safer, and the islands depend more on the army and the coast watch."
 WEL_wd_flt_island_squadrons:0 "A Squadron for Every Island"
 WEL_wd_flt_island_squadrons_desc:0 "A third school wants the navy split into small squadrons, each based on its own island group with its own repair crew, so that no island waits days for help. The squadrons are close to the people they protect. Each is too small to fight alone, and the admirals fear a navy of parish fleets."
 WEL_wd_flt_convoy_drill:0 "Convoy Drill with the Owners"
 WEL_wd_flt_convoy_drill_desc:0 "With sealed orders in every master's safe, the navy runs its first full convoy exercise: merchant ships assembling at a southern port, forming columns and sailing under escort while aircraft play the attacker. Owners lose a week of trading. Masters and escort captains finally learn each other's signals."
 WEL_wd_flt_islet_radar:0 "Radar on the Southeastern Islet"
 WEL_wd_flt_islet_radar_desc:0 "The islet off the southeast coast, now with a road and a resident officer, looks straight down the sea lanes toward Belka. A radar post on its highest hill extends the coast watch far beyond the main island's horizon. Its crews live in isolation, and the post is the first thing any attacker would destroy."
 WEL_wd_flt_imperial_programme:0 "An Imperial Naval Programme"
 WEL_wd_flt_imperial_programme_desc:0 "The directorate funds a naval programme worthy of the empire it proclaimed: new escorts, a recruiting drive in every port and a training squadron that sails the length of the island chain. Shipyards cheer. The treasury and the merchant owners, who will pay for it, are not asked for their opinion."
 WEL_wd_flt_reserve_crews:0 "Reserve Crews from the Merchant Fleet"
 WEL_wd_flt_reserve_crews_desc:0 "Merchant officers and ratings who agree to train two weeks a year join a naval reserve, ready to crew escorts and auxiliaries if war comes. The merchant fleet is the country's largest pool of trained seamen. Owners lose crews for the drills, and the navy gains men who know the sea better than its own conscripts."
 WEL_wd_air_count:0 "Count the Air Arm"
 WEL_wd_air_count_desc:0 "Wellow's air arm has a few dozen fighters and a handful of support aircraft at two fields, one in the western oil district and one beside the capital. Pilots fly too few hours and spare parts come from abroad. A full count of aircraft, crews and parts tells the government how much of the air arm actually flies."
 WEL_wd_air_capital_field:0 "Lengthen the Capital Runways"
 WEL_wd_air_capital_field_desc:0 "The field beside the capital was laid out for aircraft that are now museum pieces. Longer runways, hard stands and a fuel line from the capital depot let modern fighters operate there in any season. Neighbours complain about the noise. The air arm finally has one field worthy of the name."
 WEL_wd_air_south_field:0 "A Field Facing the Narrow Sea"
 WEL_wd_air_south_field_desc:0 "Every threat the air staff can imagine comes from the south, yet neither field is on the south coast. A new field near the southern shore, looking across the narrow sea toward Belka, cuts minutes from every interception. Building it so close to a neighbour is also a statement, and the foreign ministry asks that it be built quietly."
 WEL_wd_air_island_strips:0 "Grass Strips on the Islands"
 WEL_wd_air_island_strips_desc:0 "The air arm marks out grass strips on the northwest island and at the other island districts where the ground allows, so that aircraft can disperse, refuel or land damaged. The strips need little more than a windsock and a fuel store. They turn the island chain into a string of emergency fields instead of open sea."
 WEL_wd_air_interceptors:0 "Interceptors First"
 WEL_wd_air_interceptors_desc:0 "The interceptor school wants every aircraft and every pilot hour spent on one task: stopping hostile aircraft before they reach the coast. The air arm becomes a shield with radar eyes. It does nothing for the merchant lanes or the army, and its pilots learn little beyond intercepts."
 WEL_wd_air_sea_patrol:0 "Eyes over the Sea Lanes"
 WEL_wd_air_sea_patrol_desc:0 "The patrol school says the air arm should watch the sea: the merchant lanes, the island sounds and the approaches to every port. Patrol aircraft and strike crews trained against ships would protect what actually earns the money. The capital's skies would rely on fewer fighters."
 WEL_wd_air_parts_works:0 "Spare Parts Made at Home"
 WEL_wd_air_parts_works_desc:0 "Grounded aircraft wait months for parts shipped from abroad. A small works on the southeastern coast makes tyres, brakes, filters and simple structural parts under licence. It cannot build an aircraft, but it keeps far more of them flying, and its machinists learn trades the country has never had."
 WEL_wd_air_capital_radar:0 "Radar Around the Capital"
 WEL_wd_air_capital_radar_desc:0 "The capital sits on an inland plain, which gives it time but also a false sense of safety. A radar ring linked to the capital field's control room lets fighters scramble with warning rather than by guesswork. It is expensive for a capital nobody has threatened, which is exactly what the air staff says about every insurance."
 WEL_wd_air_hard_strips:0 "Hard Runways on the Islands"
 WEL_wd_air_hard_strips_desc:0 "The grass strips proved their worth in bad weather and worse landings. The busiest of them, on the southwestern island, gets a hard runway, a hangar and a permanent ground crew. Island aircraft can now operate year round rather than in fair seasons only, and the islanders gain an air link to the capital."
 WEL_wd_air_aggressors:0 "Train Against the Best"
 WEL_wd_air_aggressors_desc:0 "By 1998 former top Belkan Air Force pilots are being hired by various countries as aggressor squadrons. The air staff sees a chance its pilots will never get otherwise: to fight, in practice, against someone better. The price is money, and a political question the foreign ministry would rather not answer."
 WEL_wd_str_coast_watch:0 "Watch the Southern Coast"
 WEL_wd_str_coast_watch_desc:0 "Belka lies across a narrow sea from the south coast, close enough that its aircraft could reach the capital in minutes. The coast watch has lookouts and a few patrol boats but no radar. A radar post on the southern shore and a watch roster in every coastal district cost little and tell the capital what crosses the water."
 WEL_wd_str_belkan_sales:0 "Belka Sells Its Northern Lands"
 WEL_wd_str_belkan_sales_desc:0 "In August 1991 Belka sells its northern territory to FATO and cedes northern islands and the Great Lakes region to Osea. Wellowan shipping agents wake to new flags and new customs posts on familiar coasts. The foreign ministry has to decide what, if anything, a neutral island nation should say about it."
 WEL_wd_str_new_borders:0 "Charts for the New Borders"
 WEL_wd_str_new_borders_desc:0 "When Belka's borders are redrawn in December 1991, every Wellowan chart of the far shore becomes wrong overnight. Hydrographers and customs officers redraw the routes, the ports of entry and the buoyage. The work is unglamorous and urgent, because a master with the wrong chart can start a diplomatic incident."
 WEL_wd_str_war_news:0 "Fighting Beyond the Southern Shore"
 WEL_wd_str_war_news_desc:0 "In March 1995 the Belkan War breaks out on the continent to the south. The narrow sea fills with warships and aircraft, insurers cancel cover and the ports wait for instructions. Wellow is not a party, but the cabinet must decide how the coast watch, the reserves and the ports respond to a war next door."
 WEL_wd_str_closed_ports:0 "Ports Closed to Warships"
 WEL_wd_str_closed_ports_desc:0 "The cabinet closes every Wellowan port and field to the warships and military aircraft of all belligerents, and interns any that arrive. Neutrality becomes a rule rather than a mood. Some merchant trade suffers, both sides are equally annoyed, and the coast watch must enforce the rule in all weathers."
 WEL_wd_str_open_ports:0 "Neutral Ports, Open Trade"
 WEL_wd_str_open_ports_desc:0 "The cabinet keeps every port open to merchant ships of all flags, and lets war cargo through at a premium on dues. The ports grow rich on a war they are not fighting. Each side suspects the other is supplied through Wellow, and the coast watch must still keep the warships out."
 WEL_wd_str_fallout:0 "Measure the Waldreich Fallout"
 WEL_wd_str_fallout_desc:0 "Nuclear devices used in the Waldreich Mountains turn the meteorologists into the most important officials in the country. Sampling stations on the south coast and the islands track the winds and test rain, fish and milk. Publishing results calms some fears and stokes others, and the stations will run for years."
 WEL_wd_str_after_lumen:0 "After the Lumen Treaty"
 WEL_wd_str_after_lumen_desc:0 "The treaty signed in Lumen in June 1995 ends the Belkan War. Insurers return, coasters resume the southern routes and the coast watch stands down its reserve crews. The ports want the wartime rules lifted at once, and the navy wants them kept a little longer, just in case."
 WEL_wd_str_defeated_neighbour:0 "Fuel and Timber for Belka"
 WEL_wd_str_defeated_neighbour_desc:0 "A defeated Belka across the narrow sea needs fuel, timber, food and ships, and has little to pay with. Wellowan owners can sell on credit, barter or wait. The cabinet backs credit for essential cargo, betting that a neighbour rebuilt with Wellowan help will remember it."
 WEL_wd_str_victorious_neighbour:0 "Vigil Toward a Victor"
 WEL_wd_str_victorious_neighbour_desc:0 "A victorious Belka across the narrow sea is a neighbour with momentum, a hardened air force and new territory. Nobody in the capital expects it to turn north, but nobody can promise it will not. The coast watch becomes a permanent command, and the islands' garrisons stay at strength."
 WEL_wd_gar_review:0 "Ten Formations for Sixteen Districts"
 WEL_wd_gar_review_desc:0 "The army fields about ten infantry formations to defend sixteen districts, five of them islands that cannot be reinforced by road. Most formations sit on the main island near the capital. A review of where they stand, what they carry and how they would move by sea comes first, and it embarrasses almost everyone involved."
 WEL_wd_gar_highland_training:0 "Training in the Northwest Highlands"
 WEL_wd_gar_highland_training_desc:0 "The northwestern highlands of the main island are mountain country where trucks struggle and infantry walks. A training area there, with a proper road to reach it, teaches companies to move and fight in hills that cover much of the country. Farmers lose grazing to firing ranges and say so loudly."
 WEL_wd_gar_marsh_engineers:0 "Engineers for the Marshes"
 WEL_wd_gar_marsh_engineers_desc:0 "Marshes cover much of the northern lowland and the northeastern oil district, and the army has never trained to cross them. Engineer companies learn to lay mats, build causeways and bridge channels under pressure. The skills serve the civil road programme as much as the army, which helps the budget case."
 WEL_wd_gar_battalions:0 "A Battalion in Every District"
 WEL_wd_gar_battalions_desc:0 "The district school wins: every district, island or not, raises and keeps its own trained battalion, recruited locally and commanded from its own depot. No island will ever be empty. Battalions on the islands train alone and cannot easily reinforce each other, and the army as a whole grows more parochial."
 WEL_wd_gar_sealift:0 "Brigades That Travel by Sea"
 WEL_wd_gar_sealift_desc:0 "The sea-lift school wins: fewer, better brigades based on the main island, trained to embark on ferries and colliers and land at any island harbour within days. The army becomes a mobile reserve. The islands depend on the ships arriving in time, and the merchant owners on not being requisitioned too often."
 WEL_wd_gar_rifle_works:0 "A Rifle Works West of the Capital"
 WEL_wd_gar_rifle_works_desc:0 "The army buys its rifles, mortars and ammunition abroad and waits for them. A state works in the district west of the capital makes small arms and shells under licence. It is a modest plant that gives the country a floor of self-supply, at prices well above what foreign makers charge."
 WEL_wd_gar_island_depots:0 "Depots on the Northwest Island"
 WEL_wd_gar_island_depots_desc:0 "District battalions on the islands need weapons, food and fuel stored where they serve. A depot on the northwest island, with a road to its harbour, holds a month of supplies for the island battalions. Islanders gain jobs, and the army gains a reason to keep the coast road in good repair."
 WEL_wd_gar_ferry_exercise:0 "Exercises on the Ferry Lines"
 WEL_wd_gar_ferry_exercise_desc:0 "The sea-lift brigades borrow the subsidised ferries for a week and land a full brigade at the western islands. The exercise shows how long loading really takes and how few harbours can unload heavy equipment. Ferry passengers are furious for a week, and the staff learns more than it did in a year."
 WEL_wd_gar_union_guards:0 "District Guards for the Union"
 WEL_wd_gar_union_guards_desc:0 "The union council raises district guards answerable jointly to the council and to each district, recruited locally and trained by the army. The guards are a bridge between the capital and the districts. The army regards them as amateurs, and the imperial movement regards them as a council militia."
 WEL_wd_gar_southern_positions:0 "Positions on the Southern Shore"
 WEL_wd_gar_southern_positions_desc:0 "With war across the narrow sea, the army digs positions along the southern shore and garrisons the beaches nearest the far coast. Nobody expects a landing, but nobody wants to explain afterwards why there were no trenches. Soldiers spend a wet season digging and learn a great deal about their own coast."
 WEL_wd_sky_named_danger:0 "Astronomers Name a Danger"
 WEL_wd_sky_named_danger_desc:0 "In December 1994 the International Astronomical Union warns that the asteroid Ulysses may strike the Earth. In Wellow the news reaches the port taverns before it reaches the ministries. The government has to decide how to speak about a danger that may be years away, may fall anywhere and may never fall at all."
 WEL_wd_sky_lowland_telescopes:0 "Telescopes on the Northern Lowland"
 WEL_wd_sky_lowland_telescopes_desc:0 "The flat northern lowland has dark skies and plenty of room. Telescopes and a tracking radar there, run by a standing committee of astronomers, give Wellow its own measurements instead of borrowed bulletins. The station costs more than its science would justify in calmer years, and every newspaper visits it."
 WEL_wd_sky_grain_reserve:0 "Granaries for the Bad Years"
 WEL_wd_sky_grain_reserve_desc:0 "If fragments disturb the weather, harvests may fail anywhere, and an island nation that imports grain is exposed. Granaries and a mill on the northern lowland hold a winter of food for the islands. Farmers get a guaranteed buyer, and the treasury pays for grain it hopes it will never need."
 WEL_wd_sky_impact_announced:0 "The Impact Is Announced"
 WEL_wd_sky_impact_announced_desc:0 "In April 1996 the FCU announces to the world that Ulysses will strike the Earth. The question is no longer whether, but where and how badly. Wellow draws up impact plans for every district, with shelter lists, ferry schedules and food stocks. Every district office now has a binder nobody wants to open."
 WEL_wd_sky_relief_fleet:0 "Ships for the Stricken Coasts"
 WEL_wd_sky_relief_fleet_desc:0 "The owners and the government agree that Wellow's greatest asset in a disaster is its merchant fleet. Hulls are earmarked to carry relief wherever fragments fall, at cost, with crews from volunteer lists. The country's ships will be away when the impact comes, which some owners and many islanders find hard to accept."
 WEL_wd_sky_home_waters:0 "Every Hull Home for the Impact"
 WEL_wd_sky_home_waters_desc:0 "The cautious answer brings every Wellowan hull home before the danger window and keeps it there. Ships lie in sheltered harbours, crews stay with their families and nothing is risked at sea. Foreign charterers take their business elsewhere, and the fleet's reputation for reliability takes years to recover."
 WEL_wd_sky_ferry_evacuation:0 "A Ferry Out for Every Village"
 WEL_wd_sky_ferry_evacuation_desc:0 "If fragments threaten the coasts, the safest place for islanders is inland on the main island. The ferry timetable gains a hidden twin: an evacuation schedule assigning every coastal village a ferry, a harbour and a destination. Rehearsals disrupt the islands every summer, and nobody hopes to use it."
 WEL_wd_sky_roche_night:0 "The Night the Rock Breaks"
 WEL_wd_sky_roche_night_desc:0 "In July 1999 Ulysses passes through the Earth's Roche limit, and the long wait is over. Wellow's telescopes report what they can see, and the impact plans go from binders to radio bulletins. Whatever falls and wherever it falls, the country that prepared calmly will recover faster than the one that panicked."
 WEL_wd_sky_relief_voyages:0 "Relief Voyages in the Impact Year"
 WEL_wd_sky_relief_voyages_desc:0 "When the impact year comes, the earmarked hulls sail. Wellowan colliers and coasters carry grain, fuel and tents to stricken ports that will take them, and come home empty. The voyages cost the state its insurance and the owners their profits, and give Wellow a name at sea that money cannot buy."
 WEL_wd_sky_insurers:0 "Who Pays for a Falling Sky"
 WEL_wd_sky_insurers_desc:0 "Foreign insurers write impact exclusions into every hull policy, leaving owners uncovered for the one risk everybody is discussing. A state reinsurance fund backs Wellowan hulls for impact damage at a fixed premium. It may cost the treasury a fortune or nothing, and nobody can say which until the sky clears."
 WEL_wd_ins_found:0 "Found a Maritime Polytechnic"
 WEL_wd_ins_found_desc:0 "Wellow sends its engineers, navigators and radio technicians abroad to study, and many never return. A polytechnic in the capital, with faculties of marine engineering, navigation, radio and geology, keeps them at home. It takes a decade to earn a reputation, and its first professors have to be hired from foreign universities."
 WEL_wd_ins_marine_weather:0 "A Weather Service for Shipping"
 WEL_wd_ins_marine_weather_desc:0 "Storms sink more Wellowan ships than any enemy ever has. A marine weather service with a station and a weather radar in the northeastern marsh district broadcasts forecasts to every master and ferry captain four times a day. Owners pay a fee in their dues and soon wonder how they managed without it."
 WEL_wd_ins_radio_beacons:0 "Radio Beacons Along the Coasts"
 WEL_wd_ins_radio_beacons_desc:0 "Masters still navigate the island sounds by lighthouses and memory. A chain of radio beacons along the main island and the western islands lets ships fix their position in fog and darkness. The beacons are simple and cheap, and every hostile navigator would use them too, which the navy points out."
 WEL_wd_ins_ministry_labs:0 "Laboratories Under the Ministries"
 WEL_wd_ins_ministry_labs_desc:0 "One school wants research run by the ministries: the navy's laboratories, the fields' geologists and the ferries' engineers, all funded from the budget and set to public priorities. Research follows the state's needs. It also follows the state's budget cycles, and good engineers dislike forms."
 WEL_wd_ins_owner_labs:0 "Laboratories Paid by the Owners"
 WEL_wd_ins_owner_labs_desc:0 "The other school wants shipowners and oil firms to fund research they can use within years, with the polytechnic as their contractor and tax relief as the state's share. Research moves quickly toward profit. Problems nobody can sell a solution to remain unsolved for a long time."
 WEL_wd_ins_chamber_grants:0 "Research Grants Voted by the Chamber"
 WEL_wd_ins_chamber_grants_desc:0 "The restored chamber votes research grants in open session, with every deputy arguing for a project in their own district. Some grants are wasted on prestige. Others reach island schools and small firms that never had a hearing under the ordinances, and the polytechnic gains friends in every district."
 WEL_wd_ins_admin_engineers:0 "Engineers in the Administration"
 WEL_wd_ins_admin_engineers_desc:0 "The standing administration recruits polytechnic graduates straight into its offices, where they plan roads, ports and power lines by calculation rather than by petition. The administration becomes more competent and more technical, and its plans arrive with costings attached. Districts that cannot argue in numbers find themselves ignored more efficiently than before, and say so."
 WEL_wd_ins_district_schools:0 "Technical Schools in the Districts"
 WEL_wd_ins_district_schools_desc:0 "The elected island councils fund technical schools in their own harbour towns, teaching engine repair, radio and refrigeration. Young islanders no longer have to leave home to learn a trade. The schools are uneven, some excellent and some poor, because each council runs its own."
 WEL_wd_ins_prefect_radio:0 "A Radio Net for the Prefects"
 WEL_wd_ins_prefect_radio_desc:0 "The island prefecture links every prefect's office by radio to the capital, with daily reports and instructions. Decisions that once waited for the ferry now take an hour. The net is efficient and impersonal, and islanders learn that their prefect can no longer claim the capital never answered."
 WEL_wd_dst_estovakia:0 "Sanctions on Estovakia"
 WEL_wd_dst_estovakia_desc:0 "In March 2002 Osea, Emmeria and other nations join in economic sanctions against Estovakia, citing corruption. Wellow is not asked to join, but Wellowan hulls carry cargo to every coast, including Estovakian ones. The registry has to decide whether foreign sanctions lists bind ships that fly its flag."
 WEL_wd_dst_estovakia_tt_1:0 "Opens the registry choice on Estovakian cargo."
 WEL_wd_dst_bar_cargo:0 "Bar Estovakian Cargo"
 WEL_wd_dst_bar_cargo_desc:0 "The registry writes the sanctions into its own rules and bars Wellowan hulls from Estovakian cargo. Owners lose a route, and Osea and Emmeria note the gesture. The register becomes, in practice, a tool of foreign policy, which every future government will be tempted to use again."
 WEL_wd_dst_own_rules:0 "The Registry Keeps Its Own Rules"
 WEL_wd_dst_own_rules_desc:0 "The registry declines to apply any foreign sanctions list and keeps its own rules on cargo and conduct. Owners keep every route open. Wellow's flag becomes more attractive to some owners and more suspect to some governments, and inspectors must watch which cargo the flag is carrying."
 WEL_wd_dst_usean_war:0 "War over Usea"
 WEL_wd_dst_usean_war_desc:0 "In August 2003 the FCU demands that Erusea withdraw from the railgun complex and San Salvacion, and an allied force is formed. The war that follows is a continent away, but within a week insurers have rewritten every premium on the Usean routes and charterers are offering double rates for unnamed cargo."
 WEL_wd_dst_no_war_cargo:0 "No Military Cargo to Usea"
 WEL_wd_dst_no_war_cargo_desc:0 "The country that closed its ports to warships in 1995 applies the same rule at sea: no Wellowan hull may carry military cargo to the war over Usea. Owners lose lucrative charters. The flag keeps its neutrality, and the navy need not explain why it cannot escort anyone that far."
 WEL_wd_dst_war_risk:0 "War Risk Cover for Usean Runs"
 WEL_wd_dst_war_risk_desc:0 "The country that kept its ports open in 1995 keeps its ships sailing in 2003. A state-backed war-risk pool insures Wellowan hulls on the Usean routes at a fixed premium. Freight income rises sharply. If a Wellowan ship is sunk, the treasury pays, and the newspapers ask what it was carrying."
 WEL_wd_dst_flagged_hulls:0 "Foreign Owners, Wellowan Flags"
 WEL_wd_dst_flagged_hulls_desc:0 "The open registry now includes hundreds of foreign-owned hulls, some of them sailing into the war zone on charters their owners will not describe. Inspectors are sent to the busiest foreign ports to check cargo and crews. The fees pay for the inspectors, and some owners quietly leave the register."
 WEL_wd_dst_line_charters:0 "The Line Declines the War"
 WEL_wd_dst_line_charters_desc:0 "The national line receives charter offers for the Usean routes and must decide as a state enterprise what a private owner would decide for profit. Its board declines military cargo and redeploys the ships to the northern routes the war has emptied. Its rivals take the risky money, and the line keeps its ships."
 WEL_wd_dst_mutual_claims:0 "The Mutual Pays Its War Claims"
 WEL_wd_dst_mutual_claims_desc:0 "Two member ships of the shipowners mutual are damaged on Usean routes, and the pool must pay or fail. It pays, raises its premiums and tightens its rules on war cargo. The owners who built the mutual discover that sharing risk means sharing someone else's bad decision."
 WEL_wd_dst_tanker_rates:0 "Tanker Rates Soar"
 WEL_wd_dst_tanker_rates_desc:0 "War over Usea drives tanker rates to heights the crude exporters never imagined, and Wellowan tankers are booked a year ahead. The oil money floods in. The fleet now buys its own fuel back at wartime prices, and the ferries pay more for every crossing than they did before the war."
 WEL_wd_dst_fuel_hedge:0 "Fuel Held Against the War"
 WEL_wd_dst_fuel_hedge_desc:0 "The capital fuel reserve, built for exactly this kind of year, keeps the ferries and heating plants running at pre-war prices while world markets swing. Its rules are tested, argued over and upheld. The reserve's managers finally have an answer for everyone who called it waste."
 WEL_wd_dst_fifteen_years:0 "The Panel Drawn by Lot"
 WEL_wd_dst_fifteen_years_desc:0 "With the war over Usea ended in September 2005, an independent panel drawn by lot reviews how Wellow has governed itself since 1991: its districts, its register, its yards and its fields. The review promises nothing about the years ahead. It gives whoever governs next an honest starting point."
 WEL_wd_dst_fifteen_years_tt_1:0 "Closes the 1991 to 2005 programme; later eras are not yet written."
 ac_wd_wel_tree:0 "Wellow: National Programme"
 ac_wd_wel_tree_desc:0 "The national focus programme of Wellow, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 WEL_wd_caretaker_mandate:0 "The Caretaker Mandate"
 WEL_wd_caretaker_mandate_desc:0 "The National Administration governs by ordinance, with no election calendar and almost no party behind it."
 WEL_wd_port_hearings:0 "The Port Town Hearings"
 WEL_wd_port_hearings_desc:0 "Commissioners have heard every district; the record is public and unflattering."
 WEL_wd_electoral_rolls:0 "Rolls Reopened"
 WEL_wd_electoral_rolls_desc:0 "District clerks are rebuilding the voter rolls for a restored chamber."
 WEL_wd_union_commission:0 "The Crown in Commission"
 WEL_wd_union_commission_desc:0 "The union camp proposes a crown exercised collectively by a council of the districts."
 WEL_wd_imperial_petition:0 "The Imperial Petition"
 WEL_wd_imperial_petition_desc:0 "Petition committees of the imperial movement sit in every port town."
 WEL_wd_standing_ordinances:0 "Standing Ordinances"
 WEL_wd_standing_ordinances_desc:0 "Emergency ordinances are being turned into a permanent administrative code."
 WEL_wd_open_chamber:0 "The Broadcast Chamber"
 WEL_wd_open_chamber_desc:0 "Chamber sessions reach every district by radio; ministers answer in public."
 WEL_wd_union_settlement:0 "The Union Settlement"
 WEL_wd_union_settlement_desc:0 "Written charters fix each district share of port dues and its council seat."
 WEL_wd_imperial_order:0 "The Imperial Order"
 WEL_wd_imperial_order_desc:0 "Decrees, party newspapers and a fleet the directorate parades at every chance."
 WEL_wd_coded_state:0 "The Coded Administration"
 WEL_wd_coded_state_desc:0 "An administrative court holds the government to its own written code."
 WEL_wd_district_survey:0 "The District Survey"
 WEL_wd_district_survey_desc:0 "Every pier, road, school and tax office in sixteen districts is on file."
 WEL_wd_ferry_compact:0 "The Ferry Compact"
 WEL_wd_ferry_compact_desc:0 "Subsidised ferries link every island district to the main island on fixed days."
 WEL_wd_island_councils:0 "Island District Councils"
 WEL_wd_island_councils_desc:0 "Elected councils hold budgets for piers, schools and roads in the outer districts."
 WEL_wd_island_prefecture:0 "The Island Prefecture"
 WEL_wd_island_prefecture_desc:0 "One prefecture staffed from the capital governs every outer district."
 WEL_wd_winter_ferries:0 "Winter Ferry Subsidy"
 WEL_wd_winter_ferries_desc:0 "Extra sailings keep the islands supplied through the storm season."
 WEL_wd_merchant_register:0 "The Merchant Register"
 WEL_wd_merchant_register_desc:0 "More than nine hundred hulls, counted and owing dues to a harbour office."
 WEL_wd_open_registry:0 "The Open Registry"
 WEL_wd_open_registry_desc:0 "Any owner may fly the Wellowan flag for a fee and a light inspection."
 WEL_wd_national_line:0 "The National Line"
 WEL_wd_national_line_desc:0 "State-held shipping houses run fixed routes with Wellowan crews and yards."
 WEL_wd_owners_mutual:0 "The Shipowners Mutual"
 WEL_wd_owners_mutual_desc:0 "Owners pool insurance, repair budgets and a common rate book under supervision."
 WEL_wd_convoy_discipline:0 "Convoy Discipline"
 WEL_wd_convoy_discipline_desc:0 "Every master carries sealed wartime instructions and knows the assembly ports."
 WEL_wd_exchange_commissions:0 "Commissions Kept at Home"
 WEL_wd_exchange_commissions_desc:0 "A shipping exchange in the capital keeps charter commissions in Wellowan hands."
 WEL_wd_field_ledger:0 "The Field Ledger"
 WEL_wd_field_ledger_desc:0 "Every well, mine and furnace is recorded with its output and its losses."
 WEL_wd_home_refining:0 "Refined at Home"
 WEL_wd_home_refining_desc:0 "Crude is refined in Wellowan plants; the fleet and the ferries are served first."
 WEL_wd_crude_exports:0 "Crude by Tanker"
 WEL_wd_crude_exports_desc:0 "Crude sails abroad in Wellowan tankers and finished fuel is bought back."
 WEL_wd_steel_plate:0 "Steel Before Oil"
 WEL_wd_steel_plate_desc:0 "Oil money builds rolling mills, ship plate and rails before new wells."
 WEL_wd_fuel_drawn:0 "Fuel Drawn from Reserve"
 WEL_wd_fuel_drawn_desc:0 "The capital reserve is open; ferries, heating plants and the fleet draw on it."
 WEL_wd_six_slips:0 "Six Slips for a Nation"
 WEL_wd_six_slips_desc:0 "Every slip in the dockyard district is contested by the navy, the owners and the repair crews."
 WEL_wd_apprentice_intake:0 "The Apprentice Intake"
 WEL_wd_apprentice_intake_desc:0 "Four-year apprentices learn riveting and welding beside the retiring crews."
 WEL_wd_escort_slips:0 "Escorts on the Slips"
 WEL_wd_escort_slips_desc:0 "The yards lay down escorts first; merchant work waits."
 WEL_wd_merchant_slips:0 "Merchant Hulls First"
 WEL_wd_merchant_slips_desc:0 "Coasters, ferries and colliers take the slips; warships wait."
 WEL_wd_repair_basins:0 "Repair Before New Keels"
 WEL_wd_repair_basins_desc:0 "The slips are cleared for repair work that once went to foreign yards."
 WEL_wd_standard_hulls:0 "One Hull, Many Uses"
 WEL_wd_standard_hulls_desc:0 "A single standard hull serves as coaster, ferry and patrol vessel."
 WEL_wd_yard_wage_board:0 "The Slipway Wage Board"
 WEL_wd_yard_wage_board_desc:0 "Wages on the slips are set by a board of owners, unions and the ministry."
 WEL_wd_harbour_fleet:0 "The Fleet Kept in Harbour"
 WEL_wd_harbour_fleet_desc:0 "A coastal navy trained to survive rather than to win battles."
 WEL_wd_sound_patrols:0 "Patrols in the Island Sounds"
 WEL_wd_sound_patrols_desc:0 "Small submarines lie in the channels between the islands."
 WEL_wd_escort_screen:0 "The Merchant Lane Screen"
 WEL_wd_escort_screen_desc:0 "Escorts organised around the merchant lanes rather than the harbours."
 WEL_wd_island_squadrons:0 "A Squadron for Every Island"
 WEL_wd_island_squadrons_desc:0 "Each island group keeps its own small squadron and repair crew."
 WEL_wd_imperial_programme:0 "The Imperial Naval Programme"
 WEL_wd_imperial_programme_desc:0 "The directorate funds new escorts and a recruiting drive in every port."
 WEL_wd_air_census:0 "The Air Arm Count"
 WEL_wd_air_census_desc:0 "Aircraft, crews and spare parts counted; the flying hours are honest at last."
 WEL_wd_strait_interceptors:0 "Interceptors over the Narrow Sea"
 WEL_wd_strait_interceptors_desc:0 "An air arm built to deny the southern approaches."
 WEL_wd_sea_patrol_wing:0 "Eyes over the Sea Lanes"
 WEL_wd_sea_patrol_wing_desc:0 "An air arm built to watch the merchant lanes and the island sounds."
 WEL_wd_aggressor_school:0 "The Contract Aggressor School"
 WEL_wd_aggressor_school_desc:0 "Hired instructors fly as the enemy so that Wellowan pilots learn to fight one."
 WEL_wd_strait_watch:0 "Watch on the Narrow Sea"
 WEL_wd_strait_watch_desc:0 "Radar posts, lookouts and patrol boats face the Belkan coast."
 WEL_wd_closed_ports:0 "Ports Closed to Warships"
 WEL_wd_closed_ports_desc:0 "No belligerent warship or military aircraft may use a Wellowan port or field."
 WEL_wd_open_ports:0 "Neutral Ports, Open Trade"
 WEL_wd_open_ports_desc:0 "Merchant ships of every flag trade freely; war cargo pays a premium."
 WEL_wd_fallout_watch:0 "The Fallout Watch"
