 ac_camp.76.t:0 "People who still knew the aircraft"
 ac_camp.76.desc:0 "Pops listened to the mechanic's description of the fault before looking at the pilots. He had not come into the room to make a speech about trust. There was an aircraft to prepare, and the men and women standing around it needed a useful answer.\n\nThe escape had succeeded. The squadron had reached people willing to receive it, though the accusation following Wardog could travel along channels faster than any aircraft. Nagase had begun checking the receiving instructions for precisely that reason. Grimm remained beside the aircraft, looking relieved whenever somebody gave him a task whose meaning was clear.\n\nThe mechanic pointed out the part he could not release without another inspection. Pops nodded. Nothing in the day's politics had made an incomplete inspection more complete. The answer seemed to steady the room. For a few minutes, authority could be recognized in a person accepting responsibility for a specific piece of work.\n\nNagase came back with the verified contact. She waited until the mechanic had finished before speaking. Nobody asked her to make the confirmation sound more certain than it was.\n\nBeyond the hangar, another crew was preparing to leave. The engines rose, settled and rose again. Grimm listened until the aircraft was clear of the receiving area, then turned back toward the people who still knew what needed doing beside him.\n\nThe squadron had lost the safety of an institution it could obey without question. It had not lost every person capable of giving an honest instruction. For the moment, that was enough to begin the next inspection."
