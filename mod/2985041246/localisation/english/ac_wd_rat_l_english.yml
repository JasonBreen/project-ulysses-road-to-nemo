l_english:
 RAT_wd_cncl_january_mandate:0 "The January Mandate"
 RAT_wd_cncl_january_mandate_desc:0 "The ballot papers of New Year's Day 1991 still sit in the council archive, and the democratic camp they returned keeps the support of about seven Ratians in ten. Even so, the council administration has suspended the next poll with no date set, and its ministries rotate the chair among themselves. The council must now debate what that January vote actually authorised, and whether a mandate with no expiry is still a mandate at all."
 RAT_wd_cncl_hearings:0 "Hearings in the Five Districts"
 RAT_wd_cncl_hearings_desc:0 "Council members leave Centrum to hold public hearings in Dormakaj, the Troton Mountains, Ratio Valley and the Zulian Coast. Mill wages and the valleys beyond the Ustian line dominate every session, and some halls turn hostile. The tour costs the council its comfortable distance from the voters, yet it learns which promises the districts would actually believe and which they would laugh at."
 RAT_wd_cncl_ministry_books:0 "Open the Ministry Books"
 RAT_wd_cncl_ministry_books_desc:0 "With the chair rotating, each ministry has blamed the previous holder for every overspent budget. A council audit office reads five years of ministry ledgers and publishes the totals, and several senior officials retire before the figures appear. The exercise costs political comfort and a few loyal servants, but whatever form of government follows will inherit accounts it can trust."
 RAT_wd_cncl_ballot_date:0 "Name the Day of the Ballot"
 RAT_wd_cncl_ballot_date_desc:0 "The liberal wing proposes the simplest repair: publish the date of the next general ballot, the rules for standing and the seats each district will fill. Ministries would then have to campaign instead of rotate. The council loses its freedom to postpone, and the nationalist minority gains a lawful platform that nobody can deny it once the date is printed."
 RAT_wd_cncl_keep_council:0 "Government by Rotation"
 RAT_wd_cncl_keep_council_desc:0 "The ministries argue that the rotating council has kept Ratio calm and solvent, and that a campaign season would only hand the valley question to the loudest speakers. They propose to keep the council, write its rotation into law and postpone the ballot again. Decisions stay quick and quiet, while patience with an unelected council wears thinner every year it lasts."
 RAT_wd_cncl_valley_front:0 "The Valley Front Takes the Squares"
 RAT_wd_cncl_valley_front_desc:0 "Once the government has pressed the Ratian claim in public, the nationalist sixth of the country no longer sounds like a fringe. A movement calling itself the Valley Front fills the Dormakaj squares and demands that the council govern for the lost valleys above all else. Giving it the floor raises war support and costs calm, and the moderates will not forget who opened the door."
 RAT_wd_cncl_party_register:0 "A Register of Parties"
 RAT_wd_cncl_party_register_desc:0 "Before the ballot opens, every party must file its statutes, its accounts and the names of its district committees with an electoral court. The register stops anonymous money flowing into the campaign and gives small parties a legal footing. Party bosses object to open books, and the court needs a full year to process the filings before anyone may stand."
 RAT_wd_cncl_first_ballot:0 "The First Contested Ballot"
 RAT_wd_cncl_first_ballot_desc:0 "Every district from Dormakaj to the Zulian Coast opens its polling halls, and the council seats are fought over by rival lists instead of being handed round by rotation. Clerks of the electoral court sit at every count. The winners form an elected council answerable to the voters rather than to the ministries. Elected ministers move more slowly than appointed ones did, but they carry far more authority when they finally move."
 RAT_wd_cncl_presidium:0 "A Presidium Holds the Seals"
 RAT_wd_cncl_presidium_desc:0 "The rotation law gives way to something firmer: a presidium of five ministry heads that holds the seals, signs the budget and names the district prefects. The council survives as a debating chamber with no vote on money. Government becomes efficient and predictable, and the democratic majority that voted in January loses any real voice in policy."
 RAT_wd_cncl_restoration:0 "A Committee for the Lost Valleys"
 RAT_wd_cncl_restoration_desc:0 "Leaders of the Valley Front accept seats on a committee that suspends the council and governs by decree until the valleys return. Courts, newspapers and unions answer to it. Ratio becomes harder, louder and more united on one question, and far more anxious about every other. Neighbours who once saw a calm republic will now see a nationalist state on their frontier."
 RAT_wd_cncl_restoration_tt_2:0 "No war, claim or border effect; the committee changes only the government at home."
 RAT_wd_cncl_torchlight:0 "Torches Through Centrum"
 RAT_wd_cncl_torchlight_desc:0 "The Front schedules a torchlight march through Centrum every month, and attendance climbs with each one. The marches bring volunteers to the reserve and money to the movement, yet they frighten the mill owners and close the shops along the route. Police overtime alone strains the city budget, and opponents learn to stay indoors on march nights."
 RAT_wd_cncl_settled:0 "The Council Settles Its Form"
 RAT_wd_cncl_settled_desc:0 "Whatever shape the council has taken, its rules still live in a binder of emergency orders and unwritten custom. A short basic statute replaces the binder: how ministers are chosen, how a budget passes and when the arrangement must be reviewed. Drafting it costs a winter of argument. Afterwards every dispute in Centrum opens with a page number instead of a shouting match."
 RAT_wd_val_three_valleys:0 "Three Valleys Beyond the Line"
 RAT_wd_val_three_valleys_desc:0 "Belka took Tyrann Valley, Boikos and the Jeszczed Mountains from Ratio in its years of expansion, and they stayed with Ustio when the republic broke away in 1988. Their people still speak Ratian and many have family in Dormakaj. Ratio has never renounced the claim. Before it chooses an answer, the council must say aloud that the question is open again."
 RAT_wd_val_kin_papers:0 "Papers for Ratian Kin"
 RAT_wd_val_kin_papers_desc:0 "Thousands of Ratian families have relatives in the valleys who cannot easily visit, study or inherit across the Ustian frontier. Offices in Dormakaj issue papers, pay modest pensions to elderly kin and hold school places for valley children. The scheme costs money every year and Ustio watches it closely, but it keeps the claim humane rather than armed."
 RAT_wd_val_disown:0 "Disown the Bombers"
 RAT_wd_val_disown_desc:0 "Some Ratians in the valleys have turned to partisan violence against Ustian rail lines and barracks. The council condemns the attacks by name, closes the private arms channels that run through Dormakaj and offers Ustio its police files. Nationalist papers call it betrayal. Without that public line between grievance and bombing, no foreign mediator will take Ratio seriously."
 RAT_wd_val_purchase:0 "Buy the Valleys Back"
 RAT_wd_val_purchase_desc:0 "The treasury proposes to settle the matter with money: a fund large enough to pay Ustio well above the value of the valleys, with clauses that let Ustian residents and firms move home at Ratian expense. It is the most generous answer and by far the most expensive one. Whether Ustio ever accepts it remains Ustio's own decision."
 RAT_wd_val_purchase_tt_2:0 "No state, core or border change; any transfer is Ustio's answer to the inherited offer."
 RAT_wd_val_observers:0 "Let the Valleys Be Counted"
 RAT_wd_val_observers_desc:0 "A second school argues that land should follow the will of the people living on it. Ratio asks for a supervised vote in the valleys under foreign observers and promises in advance to accept the count, whatever it says. The appeal costs nothing in money and a great deal in pride, because Tyrann might vote differently from Boikos."
 RAT_wd_val_observers_tt_1:0 "No vote is scripted here; any referendum stays with the inherited Ustio events."
 RAT_wd_val_press:0 "Press the Ratian Claim"
 RAT_wd_val_press_desc:0 "The hard line says that Ustio holds the valleys only because Belka once did, and that Ratio should say so in every forum. The claim is pressed in speeches, schoolbooks and frontier exercises. War support rises and the nationalists cheer. Ustian garrisons in the valleys will treat every Ratian manoeuvre as a threat, and plan accordingly."
 RAT_wd_val_press_tt_2:0 "No war, wargoal, claim or border effect is scripted by this tree."
 RAT_wd_val_bonds:0 "Valley Bonds at the Centrum Exchange"
 RAT_wd_val_bonds_desc:0 "To fill the purchase fund without new taxes, the treasury sells long bonds at the Centrum exchange to banks, pension funds and patriotic savers. Buyers insist on seeing the audited ministry books first. The bonds raise real money and tie thousands of households to a peaceful settlement. Interest payments will run for decades whether Ustio sells or not."
 RAT_wd_val_resettlement:0 "Moving Costs for Those Who Choose"
 RAT_wd_val_resettlement_desc:0 "Any settlement will leave people on the wrong side of the line by their own reckoning. Ratio offers moving costs, housing grants and job placement to valley families who choose to leave Ustio, and promises the same to Ustians who wish to go home the other way. The scheme is costly and slow, but it removes the fear of forced moves."
 RAT_wd_val_counters:0 "Neutral Counters Welcome"
 RAT_wd_val_counters_desc:0 "Foreign observers who might one day count a valley vote are invited to travel the Ratian side of the frontier with open papers, visit the kin offices and inspect the Dormakaj garrison. The visits are awkward for officers used to closed bases. They also give outsiders a firsthand reason to believe that Ratio means what it has promised."
 RAT_wd_val_boikos_radar:0 "A Radar Mast Facing Boikos"
 RAT_wd_val_boikos_radar_desc:0 "Frontier divisions on the Dormakaj plain receive a radar head on the hills facing Boikos and orders to report every Ustian movement. The post costs little and watches a long stretch of the line. Ustian officers across the valley will see the mast from their barracks windows, which is partly the reason for building it exactly where it stands."
 RAT_wd_val_war_footing:0 "If the Line Catches Fire"
 RAT_wd_val_war_footing_desc:0 "This focus opens only while Ratio and Ustio are actually at war. The council moves to a war budget: arms lines first, consumer goods rationed, reservists paid from emergency credit. Nothing decided here starts or ends the fighting. It decides only how the home districts carry a war that the generals and diplomats are already conducting."
 RAT_wd_val_war_ended:0 "After the Shooting on the Line"
 RAT_wd_val_war_ended_desc:0 "The war with Ustio is over, on whatever terms the generals and diplomats reached. Ratio must count its dead, pay its reservists home and decide what to tell the families. The war budget is wound down. Nothing in this focus changes the treaty; it decides only how honestly the country mourns and how quickly it demobilises."
 RAT_wd_val_quiet_line:0 "A Commission for a Quiet Line"
 RAT_wd_val_quiet_line_desc:0 "While the frontier stays peaceful, Ratio proposes a standing desk with Ustian officials for crossings, rail traffic and incidents along the line. Neither side gives up its position on the valleys. A patrol that strays or a shot fired at night now leads first to a telephone call. The council pays for the desk and guards its calm."
 RAT_wd_stl_furnace_count:0 "Count the Centrum Furnaces"
 RAT_wd_stl_furnace_count_desc:0 "Centrum sits on the richest steel deposits in Ratio, and its mills feed the arms halls that make up nearly half of the country's industry. Nobody has recently counted which furnaces work, which idle and which exist only in the accounts. Inspectors walk every mill and arms hall from Centrum to the Zulian Coast. The owners open their gates politely and answer the questions rather less so."
 RAT_wd_stl_troton_chromium:0 "Chromium from the Troton Mines"
 RAT_wd_stl_troton_chromium_desc:0 "The Troton Mountains hold chromium and tungsten that Centrum has mostly sold abroad as raw ore. Alloying them at home turns ordinary steel into tool and armour grades worth several times the price. New mills need power lines up the mountain valleys and engineers who can run them, and the mining towns want a share of the margin."
 RAT_wd_stl_shop_councils:0 "Shop Councils in the Mill Towns"
 RAT_wd_stl_shop_councils_desc:0 "Mill workers in Centrum and on the Zulian Coast elect shop councils that agree shift patterns, safety rules and bonus schemes with management. Owners complain about lost authority, and some councils make unrealistic demands in their first year. Strikes become rarer and shorter, and output stops collapsing every time a furnace crew walks out over a grievance nobody heard."
 RAT_wd_stl_plate:0 "Plate for the Tank Parks"
 RAT_wd_stl_plate_desc:0 "The defence school wants the mills to roll armour plate first, so that the tank parks never wait for hulls. A new arms hall in Centrum takes the plate straight from the rolling line. The army gains a domestic armour supply that few neighbours can match, and civilian builders must queue behind every military order for years."
 RAT_wd_stl_girders:0 "Girders Before Guns"
 RAT_wd_stl_girders_desc:0 "The builders' school wants steel for bridges, rails and factory frames instead. A new fabrication hall in Centrum turns billets into girders for the spine line and the valley towns. Construction everywhere speeds up and the steel stays at home. The army must buy its next generation of plate abroad or wait for whatever capacity is left over."
 RAT_wd_stl_ore_ports:0 "Sell Ore Through the Zulian Ports"
 RAT_wd_stl_ore_ports_desc:0 "The trading school argues that Ratio earns most by selling ore and billets to anyone who pays, through the harbours of the Zulian Coast. The coastal rail approaches are widened for heavy ore trains. Foreign currency flows in and consumer shelves fill. Ratio becomes a supplier of other nations' industry rather than the builder of its own."
 RAT_wd_stl_dormakaj_shops:0 "Machine Shops on the Dormakaj Plain"
 RAT_wd_stl_dormakaj_shops_desc:0 "Dormakaj is the largest city in Ratio, and its plain is flat enough to build on cheaply. A machine shop district beside the main rail yards repairs mill equipment, rolling stock and farm machinery for the whole west of the country. It employs young people who would otherwise leave for Centrum. It also stands closer to the Ustian line than any other plant."
 RAT_wd_stl_tungsten_bits:0 "Tungsten Bits for the Drill Crews"
 RAT_wd_stl_tungsten_bits_desc:0 "Troton tungsten makes some of the hardest drill bits and cutting tools in the region, yet the mines themselves still drill with imported steel. A small tool works fits Ratian bits to Ratian drills and sells the surplus. Mining becomes faster and safer underground, and the works trains a cadre of metallurgists that the alloy mills will need."
 RAT_wd_stl_alloy_reserve:0 "A Strategic Reserve of Alloy"
 RAT_wd_stl_alloy_reserve_desc:0 "The mills set aside a reserve of chromium steel billets, stored in rail yards and old mine galleries, for the day imports stop or a crisis demands armour faster than ore can be dug. The reserve ties up capital that could be earning interest. If a crisis does come, the armour workshops will not have to begin from empty bins."
 RAT_wd_stl_valley_foundry:0 "A Foundry in Ratio Valley"
 RAT_wd_stl_valley_foundry_desc:0 "Ratio Valley has one small factory and a single free plot beside the line from the Troton to the coast. A foundry there would cast pump bodies, engine blocks and rail fittings for the whole country. The same plot is the only place on the valley shore where a slipway could stand, so choosing the foundry closes that door for good."
 RAT_wd_rail_walk:0 "Walk the Spine Line"
 RAT_wd_rail_walk_desc:0 "One railway holds Ratio together: the trunk from the Gebet frontier through Dormakaj to Centrum, then on through the Troton Mountains and Ratio Valley to the Zulian Coast. Engineers walk its whole length and list every weak bridge, single-track section and overloaded junction. The survey costs a season of work crews and gives the ministries one shared timetable."
 RAT_wd_rail_centrum_yards:0 "Marshalling Yards at Centrum"
 RAT_wd_rail_centrum_yards_desc:0 "Every train between the west and the coast passes through Centrum, and its cramped yards have become the slowest point on the spine. New sidings, a hump yard and a locomotive depot let freight be sorted without blocking passenger traffic. Building them means months of diverted trains through the capital, and complaints from every district that waits."
 RAT_wd_rail_troton_grades:0 "Easing the Troton Grades"
 RAT_wd_rail_troton_grades_desc:0 "South of Centrum the line climbs into the Troton Mountains on grades so steep that heavy ore trains need two locomotives. Engineers cut new curves and a short tunnel to ease the worst climb. The work is slow, dangerous and expensive in hard rock. Once it is finished, ore and steel reach the coast in half the time they take today."
 RAT_wd_rail_valley_bridges:0 "New Bridges Down the Valley"
 RAT_wd_rail_valley_bridges_desc:0 "Below the Troton the line follows Ratio Valley on old timber and iron bridges that flood every spring. Replacing them with steel spans lifts the line above the water and lets heavier trains reach the coast. Valley towns gain a reliable connection for the first time, and the army a route that does not wash away each year."
 RAT_wd_rail_zulian_spur:0 "A Spur to the Zulian Quays"
 RAT_wd_rail_zulian_spur_desc:0 "The spine stops short of the Zulian quays, so cargo still covers the last stretch by lorry. A spur line runs tracks onto the wharves themselves, letting ore wagons tip straight into ship holds. Dockers fear for their jobs and the harbour masters demand a voice in the timetable. The coast finally joins the national network properly."
 RAT_wd_rail_troop:0 "Troop Trains Take the First Path"
 RAT_wd_rail_troop_desc:0 "The army asks for guaranteed priority on every line: troop and supply trains take the first path, and civil traffic waits. Mobilisation plans become reliable, and divisions can shift from the coast to the western frontier in days. Passengers and freight customers pay with delays every time the general staff decides to run an exercise."
 RAT_wd_rail_passenger:0 "Fares the Mill Towns Can Pay"
 RAT_wd_rail_passenger_desc:0 "The ministry of works prefers fixed passenger paths and cheap fares, so that mill workers can live in the valley towns and commute to Centrum. Housing pressure in the capital eases and the smaller towns stop emptying. The army keeps no guaranteed priority, and its staff officers warn that mobilisation timetables now depend on goodwill."
 RAT_wd_rail_gebet_trunk:0 "Through Freight to Gebet"
 RAT_wd_rail_gebet_trunk_desc:0 "The heaviest line in Ratio runs from Dormakaj across the frontier into Gebet, and most of its trains stop at the border to change crews and papers. A through-running agreement with Gebet lets freight cross without unloading. Customs revenue falls, Dormakaj traders win a larger market, and the trunk becomes a line both governments have reason to protect."
 RAT_wd_rail_boikos_branch:0 "Trains Through to Boikos"
 RAT_wd_rail_boikos_branch_desc:0 "A single-track branch still runs from Dormakaj across the Ustian line into Boikos, a relic of the years before Belka took the valleys. With the purchase offer on the table, Ratio proposes through trains for passengers and mail. It changes no border. It reconnects families, and gives the valleys a daily reminder of which country is courting them."
 RAT_wd_rail_boikos_branch_tt_1:0 "Through running on the existing branch line only; no state, core or border effect."
 RAT_wd_rail_wagon_works:0 "Wagon Works at Dormakaj"
 RAT_wd_rail_wagon_works_desc:0 "Ratio buys most of its locomotives and wagons abroad and repairs them in yards never designed for the work. A wagon works at Dormakaj builds freight cars from Centrum steel and rebuilds worn locomotives. It brings more industry to the plain, which pleases the city, and worries planners who can see how close it stands to the frontier."
 RAT_wd_rail_dormakaj_junction:0 "Rebuild the Dormakaj Junction"
 RAT_wd_rail_dormakaj_junction_desc:0 "Where the Gebet trunk meets the spine, the Dormakaj junction crosses lines on the level, and every crossing train halts the others. A flyover and new platforms separate the flows. The city loses a district of old warehouses to the works. Trains for Gebet, Centrum and the Boikos branch stop delaying each other at last."
 RAT_wd_cst_harbour_board:0 "One Board for Three Harbours"
 RAT_wd_cst_harbour_board_desc:0 "Ratian ships work from three small harbours: Roshniku and Isakas below the Troton Mountains, and Sukaxhija on the Zulian Coast. Each runs its own pilots, dues and berthing rules, and captains complain about all three. A single harbour board standardises them. Local harbour masters lose their fees, and the navy gains one office to deal with."
 RAT_wd_cst_roshniku_basin:0 "Deepen the Roshniku Basin"
 RAT_wd_cst_roshniku_basin_desc:0 "Roshniku is the largest naval base in the country, but its basin silts up and the destroyers must wait for high water to leave. Dredgers deepen the channel and engineers lengthen the repair quay. The work keeps the squadron in port for a season. Afterwards it can sail on any tide and refit without leaving home waters."
 RAT_wd_cst_isakas_watch:0 "A Watch Post Above Isakas"
 RAT_wd_cst_isakas_watch_desc:0 "The approaches to Isakas and Roshniku pass close under the Troton cliffs, where a radar post can see far out to sea. A set mounted there, wired straight to the naval duty officer at Roshniku, tracks hulls and aircraft on one screen. It costs a fraction of a warship. For the first time the navy will know who is approaching before they reach the harbour mouth."
 RAT_wd_cst_escorts:0 "Escorts for the Ore Ships"
 RAT_wd_cst_escorts_desc:0 "The three destroyers are organised as an escort squadron to shepherd ore carriers and tankers along the coast. Crews train in convoy work, signalling and anti-submarine search. It is a modest role, but it matches what Ratio actually ships. The admirals who wanted a fighting squadron have to settle for a protective one."
 RAT_wd_cst_submarines:0 "A School for Coastal Submarines"
 RAT_wd_cst_submarines_desc:0 "Ratio has one coastal submarine and almost nobody trained to fight it. A submarine school at Roshniku would train full crews and develop tactics for the narrow waters off the Troton shore. Submarines deter far larger fleets for little money. The escorts lose their best officers to the new service, and convoy protection suffers for it."
 RAT_wd_cst_zulian_oil:0 "Leases on the Zulian Oil Fields"
 RAT_wd_cst_zulian_oil_desc:0 "The Zulian Coast holds the richest oil in Ratio, worked by a handful of old wells. The council offers leases on published terms, with fixed royalties and a share for the coastal districts. Drillers arrive within a year. The royalty money funds the harbour works, and coastal deputies begin reminding Centrum, at every budget debate, exactly whose wells are paying."
 RAT_wd_cst_valley_slipway:0 "A Slipway on the Valley Shore"
 RAT_wd_cst_valley_slipway_desc:0 "Ratio Valley reaches the sea at two small inlets, and the free plot beside the rail line could take a slipway for patrol boats and coastal freighters. Shipwrights from Roshniku would train valley workers. Choosing the slipway closes the plot to the foundry the steel ministry wants, and the valley must accept a smaller, seasonal trade."
 RAT_wd_cst_hull_register:0 "A Register of Ratian Hulls"
 RAT_wd_cst_hull_register_desc:0 "The harbour board compiles a monthly list of every Ratian-flagged ship, its usual cargo lanes and the frequencies its radio officer keeps. When trouble starts at sea, the naval duty desk can reach every master within hours instead of waiting for news from foreign ports. Owners dislike the paperwork and suspect the list doubles as a requisition roll."
 RAT_wd_cst_sukaxhija_patrols:0 "Patrol Flights from Sukaxhija"
 RAT_wd_cst_sukaxhija_patrols_desc:0 "Tankers loading off the Zulian Coast need watching from the air as well as the sea. A patrol airfield near Sukaxhija lets a few aircraft fly regular sweeps along the shore. The air arm resents lending pilots to naval duty. The leaseholders cover part of the fuel bill, reckoning that an aircraft over their moorings costs less than a lost tanker."
 RAT_wd_arm_parks:0 "Count the Hulls in the Parks"
 RAT_wd_arm_parks_desc:0 "Ratio keeps four tank divisions, four motorised and four of infantry, an army built for a war of firepower on open ground. The tank parks hold some three hundred modern hulls, but nobody can say how many would start on a winter morning. A park inspection lists every vehicle by its true state of repair, however embarrassing the totals."
 RAT_wd_arm_track_shops:0 "Track Shops for Every Division"
 RAT_wd_arm_track_shops_desc:0 "Tanks break tracks, road wheels and gearboxes faster than anything else, and most divisions send them back to Centrum for repair. Field track shops in each division let crews mend their own vehicles within days. There are not enough army mechanics for so many shops, so the first year goes to training fitters recruited from the mill towns."
 RAT_wd_arm_live_fire:0 "Live Fire on the Dormakaj Plain"
 RAT_wd_arm_live_fire_desc:0 "Crews have been firing a fraction of their annual allowance to save money. A full live-fire season on the ranges of the Dormakaj plain lets every crew shoot what the manual demands. Ammunition stocks fall and the neighbouring farms complain about the noise. Gunnery scores rise sharply by the end of the season."
 RAT_wd_arm_plains:0 "Mass the Armour on the Plain"
 RAT_wd_arm_plains_desc:0 "The armoured school wants the tank divisions massed on the Dormakaj plain, where open ground suits them and where any threat from the west would arrive. Concentration makes a counterstroke possible within hours. It leaves the mountains and the coast thinly held, and it places Ratio's best formations in full view of its neighbours."
 RAT_wd_arm_passes:0 "Hold the Troton Passes"
 RAT_wd_arm_passes_desc:0 "The mountain school argues that Ratio's best defence is its terrain. Infantry and engineers dig into the passes of the Troton and the forested hills around Centrum, with armour held behind as a reserve. Any invader would pay dearly for every valley. The plain and Dormakaj, the largest city, would have to be defended from further back."
 RAT_wd_arm_motor:0 "A Motor Reserve at Centrum"
 RAT_wd_arm_motor_desc:0 "A third school would keep the motorised divisions together at Centrum and move them by road and rail to wherever trouble appears. The reserve can reach the plain, the mountains or the coast within days. It depends entirely on fuel, trucks and timetables. If the railways are cut, the reserve is stranded far from the fight."
 RAT_wd_arm_mountain_companies:0 "Mountain Companies in the Troton"
 RAT_wd_arm_mountain_companies_desc:0 "The army already runs a mountaineer school, but only a few companies have passed through it. Each infantry division now forms a mountain company equipped for snow, rock and forest, posted to the passes for whole seasons. Recruits from the mining towns prove the best climbers. Lowland officers regard the posting as a hardship."
 RAT_wd_arm_hull_rebuild:0 "Rebuild the Older Hulls"
 RAT_wd_arm_hull_rebuild_desc:0 "With a reserve of alloy steel in the yards, the workshops can rebuild older tanks instead of scrapping them. New armour plates, engines and gun mantlets give tired hulls another decade of service. It costs less than buying new and keeps the workshops busy. The rebuilt tanks still fall short of the newest foreign designs."
 RAT_wd_arm_staff_course:0 "A Course in Combined Arms"
 RAT_wd_arm_staff_course_desc:0 "Tank, infantry and gun officers in Ratio rarely plan a battle together until one has started. A six-month combined-arms course at Centrum mixes them in the same syndicates, over the same maps and on the same muddy exercise grounds. Divisions lose their best captains for half a year while they attend. Those who return can speak every arm's language."
 RAT_wd_arm_garrisons:0 "Garrisons for Four Frontiers"
 RAT_wd_arm_garrisons_desc:0 "Ratio borders Ustio, Gebet, Wiesmont and Sapin, yet its army has always watched only the west. Standing garrisons are assigned to each frontier with fixed rotation schedules, local maps and liaison officers. It costs barracks and manpower. It also means that no neighbour can be surprised by Ratian movements, or surprise Ratio with its own."
 RAT_wd_air_sixty:0 "Sixty Airframes and a Plan"
 RAT_wd_air_sixty_desc:0 "Forty-eight fighters and a dozen ground-attack machines make up the whole Ratian air arm, based on the fields of Dormakaj and Centrum. Its officers want a clear mission before they ask for more. A review of every airframe, pilot and runway sets out what the air arm can actually defend. The answer is sobering, and the review recommends hard choices."
 RAT_wd_air_dispersal:0 "Dispersal Strips Around Dormakaj"
 RAT_wd_air_dispersal_desc:0 "Dormakaj holds the busiest air base in Ratio, and a single strike could destroy most of the air arm on the ground. Dispersal strips, revetments and fuel caches around the plain let squadrons scatter at the first warning. The farms lose fields to concrete. The air arm gains the ability to survive a first blow."
 RAT_wd_air_centrum_runway:0 "A Long Runway for Centrum"
 RAT_wd_air_centrum_runway_desc:0 "The capital's airfield sits among forested hills, with a short runway that limits heavier aircraft. Lengthening it and adding hardened hangars makes Centrum a proper second base. The engineering is expensive in such broken ground. It gives the air arm somewhere to fall back to if the western fields are threatened."
 RAT_wd_air_interceptors:0 "Interceptors for the Western Sky"
 RAT_wd_air_interceptors_desc:0 "One school wants the whole fighter force tuned to intercept intruders over the frontier, with aircraft held at readiness on the runway and controllers on the ground. Ratian skies would be expensive to violate. The ground-support squadron would wither, leaving the tank divisions without aircraft of their own overhead when they need them most."
 RAT_wd_air_support:0 "Wings for the Armour"
 RAT_wd_air_support_desc:0 "The other school wants the air arm to fly with the tank divisions, training pilots to strike targets the ground forces call in. The armour would never fight alone. The interceptor force would thin out, and the cities would rely on anti-aircraft guns rather than fighters to keep raiders away."
 RAT_wd_air_radar_hills:0 "Radar on the Western Hills"
 RAT_wd_air_radar_hills_desc:0 "A radar head on the hills above Dormakaj can see far enough across the frontiers with Ustio, Gebet and Wiesmont to give the fighters real warning. Linked to the control room at the base, it turns guesswork into interception. The neighbours will notice the mast and may ask what it watches. The air arm's honest answer is everything."
 RAT_wd_air_aggressors:0 "A Contract with an Aggressor Team"
 RAT_wd_air_aggressors_desc:0 "Since the Belkan War, some of the best former Belkan airmen sell their skill abroad as aggressor squadrons. A contract would put such a team in Ratian skies for two seasons, playing the enemy in every exercise, and standards would climb quickly. Officers who remember what Belka took from Ratio dislike Belkans on the payroll, and the fee is steep."
 RAT_wd_air_ground_crews:0 "A School for Ground Crews"
 RAT_wd_air_ground_crews_desc:0 "Ratian aircraft spend too long on the ground waiting for spares and mechanics. A ground crew school at Centrum trains armourers, fitters and radar technicians on a two-year course. Sortie rates rise as aircraft return to service faster. The school competes with industry for exactly the same skilled young people."
 RAT_wd_bw_outbreak:0 "War Beyond the Western Hills"
 RAT_wd_bw_outbreak_desc:0 "Late in March 1995 Belka goes to war, and two of its neighbours, Ustio and Gebet, are also neighbours of Ratio. Ratio itself is not a party. Staff officers are recalled from leave to a map room in the basement of the defence ministry, and every ministry is told to price a long war on the western frontier before the week is out."
 RAT_wd_bw_gebet_line:0 "Guns Heard from Model"
 RAT_wd_bw_gebet_line_desc:0 "Belkan forces assault Model, a border city in Gebet, and refugees and rumours both start moving along the trunk line towards Dormakaj. The frontier with Gebet goes on alert and every train arriving from that side is searched. Trade on the busiest line in Ratio slows sharply for as long as the fighting lasts."
 RAT_wd_bw_trunk_freight:0 "Freight Off the Gebet Trunk"
 RAT_wd_bw_trunk_freight_desc:0 "The through-running agreement with Gebet now carries war risk with every train. The railway diverts freight to the spine and the Zulian ports and restricts through traffic into Gebet to essential goods. Dormakaj traders lose their new market for a while. Rail engineers learn how to reroute a whole economy within a week."
 RAT_wd_bw_ustian_front:0 "When the Ustian Front Breaks"
 RAT_wd_bw_ustian_front_desc:0 "Ustio is falling under Belkan control, and the Boikos line that Ratio has watched for years now has Belkan forces close behind it. The western divisions move to full readiness and reservists in Dormakaj are recalled. Nobody in Centrum knows whether the Belkans intend to stop at the old frontier."
 RAT_wd_bw_reception:0 "Reception Halls at the Crossings"
 RAT_wd_bw_reception_desc:0 "Families fleeing the fighting reach the Dormakaj crossings with what they could carry. Schools and grain warehouses near the frontier become reception halls where each arrival gets soup, a cot and a numbered card. Host towns already short of housing complain loudly, and the bill lands on the interior ministry. The cards at least let scattered relatives find one another."
 RAT_wd_bw_supply_ustio:0 "Sell Ustio What It Needs"
 RAT_wd_bw_supply_ustio_desc:0 "Ratio has no love for Belka, which once took its valleys. The council lets Ratian firms sell food, fuel and medicine to Ustio and its allies, carried to the frontier by Ratian trains. No Ratian unit crosses any border. Belka will remember the trade, and the valley nationalists will complain that Ustio is being helped."
 RAT_wd_bw_supply_ustio_tt_1:0 "Trade only: no war, faction, volunteer or alliance effect."
 RAT_wd_bw_closed:0 "Neither Belka Nor Its Enemies"
 RAT_wd_bw_closed_desc:0 "The council chooses the narrowest path: Ratio sells nothing that shoots or burns to any belligerent, refuses passage to every foreign column and puts a sentry on every crossing. Exiles from Ustio accuse Centrum of looking away, while Belkan envoys suspect that the sentries face in only one direction. The western divisions hold their readiness until the last shot."
 RAT_wd_bw_hospital_trains:0 "Hospital Trains on the Boikos Branch"
 RAT_wd_bw_hospital_trains_desc:0 "The branch line into Boikos, reopened for passengers and mail, now carries hospital trains. Ratian doctors bring wounded and sick civilians out of the war zone to wards in Dormakaj and Centrum. The trains run under medical markings and carry no soldiers. They earn Ratio a gratitude in the valleys that no speech could buy."
 RAT_wd_bw_garrisons_stand:0 "The Frontier Garrisons Stand To"
 RAT_wd_bw_garrisons_stand_desc:0 "The standing garrisons assigned to each frontier before the war now earn their keep. They move to a wartime posture within a day, and liaison officers keep open lines to every neighbouring command. Rotation schedules keep the troops fresh. The army learns what its peacetime planning was really worth."
 RAT_wd_bw_waldreich_ash:0 "Ash from the Waldreich"
 RAT_wd_bw_waldreich_ash_desc:0 "Reports that Belka has set off nuclear weapons among the Waldreich peaks send every Ratian weather station to hourly wind soundings. A fallout watch samples air, water and milk across the western districts and publishes the results daily. Most days show little. The sampling costs money and laboratory time, and it keeps panic from outrunning the facts."
 RAT_wd_bw_guns_silent:0 "When the Belkan Guns Fall Silent"
 RAT_wd_bw_guns_silent_desc:0 "The Belkan War ends, and the council stands down the night shifts of the war room and sends the reservists home, though the frontier stays watchful. Ministries begin counting what the spring cost them: trade lost, crossings crowded, overtime paid. The war is over, yet its consequences on Ratian frontiers have barely begun."
 RAT_wd_bw_belka_won:0 "A Victorious Belka Beyond Ustio"
 RAT_wd_bw_belka_won_desc:0 "Belka emerges from the war as the victor. For Ratio this means a stronger, prouder neighbour just beyond Ustio, the same power that once took the valleys. The western divisions are told to plan for a Belka that may want more. The frontier itself is unchanged, yet from now on each defence budget is drafted against the gloomier forecast."
 RAT_wd_bw_belka_lost:0 "A Defeated Belka Beyond Ustio"
 RAT_wd_bw_belka_lost_desc:0 "Belka ends the war beaten, and the towns of the north need everything at once. Centrum plate, Ratian cement and Dormakaj wagons are bought by builders from every side of the old front, and the mills book two years of orders. A few voices in Dormakaj ask whether a humbled Belka changes anything about the valleys, and the council declines to answer."
 RAT_wd_bw_lessons:0 "What the Spring War Taught"
 RAT_wd_bw_lessons_desc:0 "Ratian staff officers kept a diary of the spring war from their side of the frontier: how fast the front moved, how much hung on fuel and rail, how civilians clogged every road away from the guns. The diary becomes a staff paper on supply, dispersal and civil defence, and its first readers on the council do not enjoy a single page of it."
 RAT_wd_sky_date:0 "A Bulletin for the Coming Impact"
 RAT_wd_sky_date_desc:0 "Ulysses stops being a distant warning in April 1996, when the FCU tells the world that the asteroid will hit the Earth. Nobody can name the impact sites, and Ratio owns no telescope worth the name. The council orders a short, plain bulletin read on the state radio every week, so that rumour at least has something to compete with."
 RAT_wd_sky_cellars:0 "Cellars Under the Centrum Hills"
 RAT_wd_sky_cellars_desc:0 "Centrum is built on forested hills riddled with old mine galleries and storage cellars. Engineers survey them, shore up the safest and stock them with water, lamps and bedding for the districts above. It is cheaper than new bunkers. Families learn where their nearest gallery entrance is, and some refuse to believe it will matter."
 RAT_wd_sky_grain:0 "Fill the Grain Halls"
 RAT_wd_sky_grain_desc:0 "Shoppers strip the shelves every time Ulysses reaches the front page. The council fills state warehouses with enough flour, lamp oil and medicine for a quarter-year of shortage, and sells the oldest sacks back into the shops each month. Stockpiling while prices spike costs the treasury dearly. Warehouses visibly full steady the cities better than any minister on the radio."
 RAT_wd_sky_trains:0 "Timetables Out of the Cities"
 RAT_wd_sky_trains_desc:0 "The reception halls built during the Belkan War already know how to register, feed and house people in a hurry. The evacuation plan reuses them, pairing each city quarter with a numbered train and a hall in the countryside. The first rehearsal leaves a carriage of Centrum pensioners in a valley siding overnight, and the timetables are rewritten twice before families trust them."
 RAT_wd_sky_wardens:0 "Wardens for Every Block"
 RAT_wd_sky_wardens_desc:0 "The opposite plan keeps people at home and below ground. Every city block elects a shelter warden who knows the cellars, the elderly residents and the first-aid kits. It costs little and asks a great deal of volunteers. Its weakness is plain to every engineer who signs off on it: a cellar is only ever as safe as the ground above it."
 RAT_wd_sky_valley_towns:0 "Valley Towns Take the Evacuees"
 RAT_wd_sky_valley_towns_desc:0 "The evacuation timetables send most city dwellers into Ratio Valley, whose small towns lack the roads and water for so many. Engineers widen the valley roads and lay mains to the reception halls. Residents complain that their towns are being treated as a shelter for others. They also gain roads they waited decades for."
 RAT_wd_sky_watch_post:0 "Watching the Sky from the Troton"
 RAT_wd_sky_watch_post_desc:0 "The radar crews of the air arm already watch the western sky. A tracking post high in the Troton, pairing foreign observatory data with Ratian readings, gives the weekly bulletin numbers of its own. It cannot stop anything falling. It lets Ratio say what it knows, and when, without waiting for foreign news."
 RAT_wd_sky_roche:0 "The Night Ulysses Breaks Apart"
 RAT_wd_sky_roche_desc:0 "By the night of 8 July 1999 Ulysses is inside the Roche limit. Whatever its fragments do, recovery crews of engineers, doctors and rail workers stand ready in every district to clear roads, restore power and treat the injured. Each crew knows its depot and its radio channel. Nobody yet knows whether they will be needed."
 RAT_wd_sky_usean_war:0 "Orders from a Distant War"
 RAT_wd_sky_usean_war_desc:0 "Fighting on the far continent of Usea sends buyers hunting for ore, plate and fuel oil wherever they can find them. With every Ratian hull on the register, the harbour board can route ships away from danger and still take the orders. The mills run extra shifts. Nobody in Centrum pretends that the demand will outlast the war."
 RAT_wd_sky_account:0 "Ratio at the Close of 2005"
 RAT_wd_sky_account_desc:0 "With the era closing, the council prints a short ledger of the nation: mills, rails, harbours, garrisons, and the valleys question in whatever shape it now has. No pledges are attached to it. The ledger exists so that the next government, elected or appointed, inherits numbers instead of boasts, and so that Ratians can judge how far the country has travelled since January 1991."
 RAT_wd_sky_account_tt_2:0 "Closes the 1991 to 2005 programme; later eras are not yet written."
 ac_wd_rat_tree:0 "Ratio: National Programme"
 ac_wd_rat_tree_desc:0 "The national focus programme of Ratio, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 RAT_wd_standing_mandate:0 "The Standing Mandate"
 RAT_wd_standing_mandate_desc:0 "The council governs on the January 1991 vote, and no date is set for the next one."
 RAT_wd_district_hearings:0 "Seasonal District Hearings"
 RAT_wd_district_hearings_desc:0 "Council members sit in each district every season and take petitions in public."
 RAT_wd_ballot_calendar:0 "A Published Ballot Calendar"
 RAT_wd_ballot_calendar_desc:0 "The council has named the day the polls reopen and the rules for standing."
 RAT_wd_campaign_season:0 "A Season of Campaigning"
 RAT_wd_campaign_season_desc:0 "Registered parties canvass the five districts; ministries govern with one eye on the count."
 RAT_wd_open_council:0 "The Open Council Charter"
 RAT_wd_open_council_desc:0 "An elected council answers to the districts, with a court to read its charter."
 RAT_wd_rotating_chairs:0 "Rotating Council Chairs"
 RAT_wd_rotating_chairs_desc:0 "Ministries take turns in the chair, and the council governs without a ballot."
 RAT_wd_presidium_rule:0 "Rule by the Presidium"
 RAT_wd_presidium_rule_desc:0 "Five ministry heads hold the seals, sign the budget and name the prefects."
 RAT_wd_valley_front:0 "The Valley Front"
 RAT_wd_valley_front_desc:0 "A nationalist movement built on the lost valleys fills the Dormakaj squares."
 RAT_wd_torchlight_marches:0 "Monthly Torchlight Marches"
 RAT_wd_torchlight_marches_desc:0 "The Front marches through Centrum every month, and the shops along the route close early."
 RAT_wd_restoration_decrees:0 "Decrees of Restoration"
 RAT_wd_restoration_decrees_desc:0 "Government by committee decree in the name of the lost valleys."
 RAT_wd_valleys_question:0 "The Valleys Question"
 RAT_wd_valleys_question_desc:0 "Tyrann Valley, Boikos and the Jeszczed Mountains lie across the Ustian line, and every party has an answer."
 RAT_wd_kin_offices:0 "Offices for Kin Across the Line"
 RAT_wd_kin_offices_desc:0 "Papers, pensions and school places for families with relatives in the valleys."
 RAT_wd_purchase_fund:0 "The Valleys Purchase Fund"
 RAT_wd_purchase_fund_desc:0 "Money set aside to buy the valleys back if Ustio ever names a price."
 RAT_wd_observer_appeal:0 "An Appeal for Observers"
 RAT_wd_observer_appeal_desc:0 "Ratio asks for a supervised vote in the valleys and promises to accept the count."
 RAT_wd_pressed_claim:0 "The Claim Pressed"
 RAT_wd_pressed_claim_desc:0 "The valleys are named in every speech, and the frontier divisions stand ready."
 RAT_wd_valley_bonds:0 "Valley Bonds in Circulation"
 RAT_wd_valley_bonds_desc:0 "Banks, pension funds and patriotic savers hold the long bonds behind the purchase fund."
 RAT_wd_resettlement_fund:0 "The Resettlement Fund"
 RAT_wd_resettlement_fund_desc:0 "Moving costs paid for anyone who chooses to cross the line and settle on the other side."
 RAT_wd_observer_missions:0 "Observer Missions Welcomed"
 RAT_wd_observer_missions_desc:0 "Foreign observers travel the Ratian side of the line with open papers."
 RAT_wd_war_budget:0 "The War Budget"
 RAT_wd_war_budget_desc:0 "Ratio is fighting Ustio, and every ministry pays for the front first."
 RAT_wd_line_commission:0 "The Boikos Line Commission"
 RAT_wd_line_commission_desc:0 "A standing desk with Ustian officials for crossings, rail traffic and incidents."
 RAT_wd_furnace_ledger:0 "The Furnace Ledger"
 RAT_wd_furnace_ledger_desc:0 "Every furnace, rolling mill and arms hall has been counted and costed."
 RAT_wd_alloy_mills:0 "Troton Alloy Mills"
 RAT_wd_alloy_mills_desc:0 "Chromium and tungsten from the Troton harden Centrum steel at home."
 RAT_wd_works_councils:0 "Shop Councils in the Mills"
 RAT_wd_works_councils_desc:0 "Elected shop councils agree shifts, safety rules and bonuses with management."
 RAT_wd_armour_plate:0 "Armour Plate Contracts"
 RAT_wd_armour_plate_desc:0 "The Centrum mills roll plate for the tank parks before anything else."
 RAT_wd_rail_steel:0 "Rails and Girders First"
 RAT_wd_rail_steel_desc:0 "Mill output goes to bridges, rails and the frames of new halls."
 RAT_wd_ore_trade:0 "Ore Down the Valley"
 RAT_wd_ore_trade_desc:0 "Troton ore and Centrum billets sold abroad through the Zulian ports."
 RAT_wd_spine_timetable:0 "The Spine Timetable"
 RAT_wd_spine_timetable_desc:0 "One timetable for the line from the Gebet frontier to the Zulian Coast."
 RAT_wd_troop_trains:0 "Troop Trains First"
 RAT_wd_troop_trains_desc:0 "Military traffic takes the first path on every Ratian line."
 RAT_wd_passenger_rail:0 "Passengers Before Freight"
 RAT_wd_passenger_rail_desc:0 "Cheap fares and fixed passenger paths on the spine."
 RAT_wd_gebet_trunk:0 "The Gebet Through-Running Pact"
 RAT_wd_gebet_trunk_desc:0 "Freight crosses into Gebet on the heaviest Ratian line without unloading."
 RAT_wd_harbour_board:0 "The Board of Three Harbours"
 RAT_wd_harbour_board_desc:0 "Roshniku, Isakas and Sukaxhija share one pilotage and customs board."
 RAT_wd_escort_squadron:0 "The Ore Escort Squadron"
 RAT_wd_escort_squadron_desc:0 "Destroyers organised to shepherd ore carriers and tankers along the coast."
 RAT_wd_submarine_school:0 "The Roshniku Submarine School"
 RAT_wd_submarine_school_desc:0 "Coastal submarine crews trained in home waters."
 RAT_wd_zulian_leases:0 "Zulian Oil Leases"
 RAT_wd_zulian_leases_desc:0 "The coastal oil fields leased on published terms and fixed royalties."
 RAT_wd_tank_parks:0 "The Tank Park Registers"
 RAT_wd_tank_parks_desc:0 "Every hull in the parks is listed by its true state of repair."
 RAT_wd_gunnery_ranges:0 "A Full Live-Fire Season"
 RAT_wd_gunnery_ranges_desc:0 "Every tank crew fires its whole annual allowance on the ranges."
 RAT_wd_armoured_fist:0 "The Plains Armour Doctrine"
 RAT_wd_armoured_fist_desc:0 "The tank divisions are concentrated on the Dormakaj plain."
 RAT_wd_mountain_bastions:0 "Bastions in the Troton"
 RAT_wd_mountain_bastions_desc:0 "Dug-in infantry and engineers hold the passes, with armour behind."
 RAT_wd_motor_reserve:0 "The Centrum Motor Reserve"
 RAT_wd_motor_reserve_desc:0 "Motorised divisions held centrally and moved by road and rail."
 RAT_wd_hull_rebuild:0 "The Hull Rebuild Programme"
 RAT_wd_hull_rebuild_desc:0 "Older tanks rebuilt with alloy plate from the strategic reserve."
 RAT_wd_air_review:0 "The Review of Sixty Airframes"
 RAT_wd_air_review_desc:0 "The air arm knows what it can defend and what it cannot."
 RAT_wd_interceptor_wing:0 "The Frontier Interceptor Wing"
 RAT_wd_interceptor_wing_desc:0 "Fighters at readiness and ground controllers guarding the frontier airspace."
 RAT_wd_support_wing:0 "The Armour Support Wing"
 RAT_wd_support_wing_desc:0 "Pilots trained to strike what the tank divisions call in."
 RAT_wd_aggressor_course:0 "Two Seasons Against Aggressors"
 RAT_wd_aggressor_course_desc:0 "Hired instructors fly against Ratian pilots for two seasons."
 RAT_wd_war_room:0 "The Centrum War Room"
 RAT_wd_war_room_desc:0 "Staff officers follow the war beyond the western hills around the clock."
 RAT_wd_gebet_alarm:0 "Alarm on the Gebet Line"
 RAT_wd_gebet_alarm_desc:0 "Gebet is under attack, and every train from the frontier is searched."
 RAT_wd_trunk_diversion:0 "Diverted Trunk Freight"
 RAT_wd_trunk_diversion_desc:0 "Freight rerouted from the Gebet trunk to the spine and the ports."
 RAT_wd_boikos_front_watch:0 "Readiness on the Boikos Line"
 RAT_wd_boikos_front_watch_desc:0 "The western divisions stand at full readiness facing a front in Ustio."
 RAT_wd_crossing_service:0 "The Crossing Reception Service"
 RAT_wd_crossing_service_desc:0 "Schools and warehouses at the crossings register, feed and house arrivals."
 RAT_wd_supply_corridor:0 "The Dormakaj Supply Corridor"
 RAT_wd_supply_corridor_desc:0 "Food, fuel and medicine sold to Ustio and carried to the line; no Ratian unit crosses."
 RAT_wd_closed_frontier:0 "A Closed and Guarded Frontier"
 RAT_wd_closed_frontier_desc:0 "No transit, no arms sales and every crossing manned."
 RAT_wd_hospital_trains:0 "Hospital Trains West"
 RAT_wd_hospital_trains_desc:0 "Ratian doctors bring the wounded and sick out of Boikos by rail."
 RAT_wd_frontier_alert:0 "Frontier on Alert"
 RAT_wd_frontier_alert_desc:0 "The garrisons of every frontier stand to for a season."
 RAT_wd_fallout_watch:0 "Daily Fallout Sampling"
 RAT_wd_fallout_watch_desc:0 "Air, water and milk sampled daily across the western districts."
 RAT_wd_wary_neighbour:0 "A Wary Western Watch"
 RAT_wd_wary_neighbour_desc:0 "Defence plans now assume a victorious Belka just beyond Ustio."
 RAT_wd_rebuild_orders:0 "Northern Reconstruction Contracts"
 RAT_wd_rebuild_orders_desc:0 "Steel, cement and rolling stock sold to rebuild the war-torn north."
 RAT_wd_sky_bulletins:0 "Weekly Sky Bulletins"
 RAT_wd_sky_bulletins_desc:0 "A plain bulletin about Ulysses read on the state radio every week."
 RAT_wd_hill_cellars:0 "The Hill Cellars"
 RAT_wd_hill_cellars_desc:0 "Old mine galleries and cellars under Centrum shored up and stocked."
 RAT_wd_grain_halls:0 "Full Grain Halls"
 RAT_wd_grain_halls_desc:0 "Three months of grain, fuel and medicine held in state stores."
 RAT_wd_evacuation_trains:0 "Evacuation Timetables Inland"
 RAT_wd_evacuation_trains_desc:0 "Each city quarter is paired with a numbered train and a hall in the countryside."
 RAT_wd_shelter_wardens:0 "Shelter Wardens in Every Block"
 RAT_wd_shelter_wardens_desc:0 "Elected wardens know the cellars, the frail neighbours and the first-aid kits."
 RAT_wd_fragment_crews:0 "Fragment Recovery Crews"
 RAT_wd_fragment_crews_desc:0 "District crews of engineers, doctors and rail workers stand ready."
 RAT_wd_usean_orders:0 "Ore Orders from a Distant War"
 RAT_wd_usean_orders_desc:0 "Shipyards and plants at war on Usea buy Ratian ore and steel."
 RAT_wd_ore_contract:0 "A Season of Ore Contracts"
 RAT_wd_ore_contract_desc:0 "Troton ore and Centrum billets sold forward to foreign buyers."
 RAT_wd_bond_window:0 "The Bond Window"
 RAT_wd_bond_window_desc:0 "Another tranche of valley bonds on sale at the Centrum exchange."
 RAT_wd_relief_columns:0 "Relief Columns Westward"
 RAT_wd_relief_columns_desc:0 "Lorries from the reception halls carry food and medicine to the frontier towns."
 ac_wd_rat.1.t:0 "A Council Without a Calendar"
 ac_wd_rat.1.d:0 "The council hall at Centrum fills early on the morning the ministries finally put their own mandate on the agenda. The January vote of 1991 left the democratic camp with the goodwill of roughly seven Ratians in ten, yet the administration that vote produced has suspended the next ballot indefinitely, and its ministries pass the chair among themselves without asking anyone outside the hall.\n\nThree camps take their seats. The liberal wing wants a date for the next ballot printed before the session closes. The ministry heads argue that rotation has kept the country solvent and calm, and that a campaign would only hand the valley question to whoever shouts loudest. On the back benches a smaller nationalist group says nothing yet, and waits to see how the valleys debate goes.\n\nNobody expects a decision today. The real quarrel is over who writes the options paper the council will vote on next season. The ministries offer their own legal staff, who know every statute and every shortcut. The district councils want a drafting commission of their own members, slower and less expert, but much harder to accuse of writing the answer in advance.\n\nProvisional gameplay."
 ac_wd_rat.1.a:0 "Give the drafting to the district councils."
 ac_wd_rat.1.b:0 "Let the ministry lawyers draft it."
 ac_wd_rat.2.t:0 "What the Valleys Are Worth"
 ac_wd_rat.2.d:0 "The map room of the foreign ministry keeps a framed survey of Tyrann Valley, Boikos and the Jeszczed Mountains drawn before Belka took them, and every visitor is walked past it. The valleys belong to Ustio now. Their towns still speak Ratian, their markets still trade with Dormakaj, and their families still cross the line for weddings and funerals whenever the papers allow it.\n\nThree answers circulate in the ministries. The treasury says Ratio is rich enough to buy the valleys back at a price no sensible government could refuse, and to pay for anyone who wants to move in either direction. Lawyers in the foreign ministry prefer a supervised vote and a promise to accept the count. The general staff and the nationalist papers say Ratio should stop asking and start insisting.\n\nWhatever Ratio chooses, the answer will be Ustio's to give, and Ustio is a young republic with its own pride and its own fears. Partisan violence in the valleys, which nobody in Centrum controls, makes every Ratian statement sound like a threat to Ustian ears. The council must first decide how loudly it is willing to speak at all.\n\nProvisional gameplay."
 ac_wd_rat.2.a:0 "Speak softly and keep the files open."
 ac_wd_rat.2.b:0 "Let the newspapers argue it out."
 ac_wd_rat.3.t:0 "The Furnace Count at Centrum"
 ac_wd_rat.3.d:0 "The inspectors come back from the mills with notebooks full of figures that do not match the ministry ledgers. Centrum's furnaces sit on the richest ore in Ratio, and the arms halls built around them account for nearly half of the national industry. Some furnaces run three shifts. Others have been banked for years while still drawing a maintenance budget, and two appear in the accounts but nowhere on the ground.\n\nThe mill owners call idle capacity insurance, kept warm for orders that may arrive with the next crisis. Their critics in the council reply that insurance nobody can audit is simply waste. Meanwhile the Troton mines sell raw chromium and tungsten abroad for a fraction of what alloy steel would fetch, because no one ever built the mills to use them at home.\n\nThree schools are forming around the figures. One wants armour plate for the tank parks, one wants girders for rails and new factories, and one wants to sell ore and billets to whoever pays best. Before any of them wins, the council has a smaller matter to settle: whether the owners of banked furnaces keep drawing maintenance money while the larger argument goes on.\n\nProvisional gameplay."
 ac_wd_rat.3.a:0 "Stop paying for cold furnaces."
 ac_wd_rat.3.b:0 "Give the owners a year to relight them."
 ac_wd_rat.4.t:0 "Three Harbours, Three Rulebooks"
 ac_wd_rat.4.d:0 "Captains bound for Ratio must learn three sets of rules. Roshniku, the largest naval harbour, sits below the Troton cliffs and charges the highest pilotage on the coast. Isakas, a short run along the same shore, keeps its own berthing lists and its own customs clerks. Sukaxhija on the Zulian Coast handles the oil trade and answers to nobody in Centrum unless it must.\n\nThe navy shares all three harbours with merchant shipping and has long complained that it negotiates berths like a foreign customer. Ship owners complain about the dues, the delays and the clerks. The harbour masters, each of whom collects fees that have quietly become a personal income, complain about anyone who proposes a change.\n\nA single board for all three harbours would standardise pilotage, dues and berthing, and give the navy a seat at the table. It would also end several comfortable careers, and the coastal districts suspect that a board answering to Centrum will spend their harbour money on the capital. The council must decide how much the harbour masters keep, and whether they leave quietly or loudly.\n\nProvisional gameplay."
 ac_wd_rat.4.a:0 "Buy out the harbour masters."
 ac_wd_rat.4.b:0 "Abolish the private fees by decree."
 ac_wd_rat.5.t:0 "Three Hundred Hulls"
 ac_wd_rat.5.d:0 "The park inspectors start at dawn, before anyone can warm an engine and hide a fault. Ratio's army was built for firepower on open ground: four tank divisions, four motorised and four of infantry, with some three hundred modern hulls in the parks. On paper it is one of the heaviest armies in the region for a country of its size.\n\nThe inspection tells a more complicated story. Many tanks start on the first try, and many do not. Spares are hoarded in one division and missing in the next. Crews have fired a fraction of their gunnery allowance to save money, and some drivers have not driven a full day in a year. The officers knew all of this, and none of them wanted it written down.\n\nThe general staff must now decide what kind of army Ratio is maintaining. The armoured school wants the divisions massed on the Dormakaj plain, the mountain school wants the passes held, and a third group wants a motor reserve at Centrum. Sooner than any of that, the staff must deal with the crews who failed: send them back to the schools for a winter and leave their divisions short, or keep them in the ranks and teach them on the job.\n\nProvisional gameplay."
 ac_wd_rat.5.a:0 "Send the failed crews back to school."
 ac_wd_rat.5.b:0 "Teach them in the ranks."
 ac_wd_rat.6.t:0 "Spring War on Two Frontiers"
 ac_wd_rat.6.d:0 "News of the Belkan War reaches Centrum before dawn. Belka is fighting on several fronts at once, and two of the countries beside it, Ustio and Gebet, also share frontiers with Ratio. The war room fills with maps that had been rolled up for decades, and by midday the first reports arrive of queues forming at the Dormakaj crossings.\n\nRatio is not at war, and nobody in the council wants it to be. But Ratio has its own memories of Belka, which once took the valleys now in Ustian hands, and few Ratians wish Belka well. The general staff wants the western divisions at readiness. The interior ministry wants to know how many people might cross and where they would sleep.\n\nThe first decision concerns the crossings. If they stay open, families fleeing the fighting will reach Dormakaj within days, with all the cost and confusion that brings. If they close, Ratio keeps the war at arm's length and leaves the families to whatever lies behind them. Either choice will be remembered on both sides of the line for a generation.\n\nProvisional gameplay."
 ac_wd_rat.6.a:0 "Keep the crossings open."
 ac_wd_rat.6.b:0 "Close the crossings until the front settles."
 ac_wd_rat.7.t:0 "Crowds at the Dormakaj Crossings"
 ac_wd_rat.7.d:0 "A week after the decision to keep the crossings open, the roads into Dormakaj are lined with cars, carts and people on foot. Many arrivals come from the valleys and speak Ratian. Others are families from Ustio and Gebet with no tie to Ratio beyond its nearness. Border police register them as fast as they can and send the rest to schools and sports halls for the night.\n\nThe Dormakaj city council complains that it is carrying a national burden alone. Hospitals run short of beds and the schools have closed for lack of space. Nationalist papers ask why Ratio is housing Ustians while the valleys remain Ustian. Parish groups and trade unions organise kitchens, and a few households take strangers into their homes.\n\nThe council can spread the arrivals across the country by rail, so that every district carries part of the cost, or keep them near the frontier where they can return quickly once the fighting moves away. Either way, the crossings have turned a foreign war into a domestic matter, and the next budget will show it line by line.\n\nProvisional gameplay."
 ac_wd_rat.7.a:0 "Spread the arrivals across the five districts."
 ac_wd_rat.7.b:0 "Keep them near the frontier."
 ac_wd_rat.8.t:0 "Ratio Waits for Ulysses"
 ac_wd_rat.8.d:0 "Word that the FCU now expects Ulysses to hit the Earth reaches Centrum as a few lines on the news wire, and within the hour nobody in the capital talks about anything else. Ratio cannot check the astronomers' sums for itself. It does have deep mine galleries, a dense web of railways, a disciplined army and a public that has so far trusted its council.\n\nThe first days are untidy. Prices for tinned food and candles double in the Centrum markets. A rumour that the fragments will fall on the Troton empties two mining towns overnight, until the miners discover that nobody actually said so. Churches fill, and so do the queues at the banks, as families try to turn savings into something they can carry.\n\nThe council can cap the price of tinned food, candles and lamp oil at once and send inspectors after the shops that break the cap. That would calm households and enrage merchants who restocked at the new prices. Or it can let the market find its own level, trusting that panic burns out faster than any regulation can be enforced across five districts.\n\nProvisional gameplay."
 ac_wd_rat.8.a:0 "Cap the prices of staples."
 ac_wd_rat.8.b:0 "Let the market find its level."
 ac_wd_rat.9.t:0 "Counting the Cost of the Ustian War"
 ac_wd_rat.9.d:0 "The war between Ratio and Ustio is over, and its terms belong to the generals and diplomats who signed them. In Centrum the council turns to what is left at home: reservists to pay off and send back to the mills, families to notify, hospitals full of wounded, and a war budget that must be wound down without collapsing the factories that grew on it.\n\nThe nationalist papers want a monument and a day of mourning. The liberal papers want an inquiry into how the line caught fire in the first place. The ministries want neither, preferring a quiet demobilisation and a short statement. In the valleys across the line, people on both sides wait to see whether the peace will hold.\n\nWhatever the treaty says about the valleys, Ratio must decide how honestly it tells its own story. A public inquiry would name failures on every side, including its own. A monument would honour the dead and harden the next generation. Silence would be cheapest, and would leave the country to remember the war however it chooses, street by street and family by family.\n\nProvisional gameplay."
 ac_wd_rat.9.a:0 "Open a public inquiry."
 ac_wd_rat.9.b:0 "Raise a monument to the fallen."
 ac_wd_rat.9.c:0 "Demobilise quietly."
 RAT_wd_elected_council_office:0 "The Elected Council of Ratio"
 RAT_wd_elected_council_office_desc:0 "A council chosen at the ballot box by all five districts, governing collectively through ministers answerable to its majority. Provisional gameplay office with no named holder."
 RAT_wd_standing_presidium_office:0 "Presidium of the Standing Council"
 RAT_wd_standing_presidium_office_desc:0 "Five ministry heads who hold the seals, sign the budget and name the district prefects, with the council kept as a debating chamber. Provisional gameplay office with no named holder."
 RAT_wd_restoration_committee_office:0 "Committee of National Restoration"
 RAT_wd_restoration_committee_office_desc:0 "A committee drawn from the nationalist movement and the frontier commands, governing by decree in the name of the lost valleys. Provisional gameplay office with no named holder."
 ac_wd_rat_decisions:0 "Ratio: National Measures"
 ac_wd_rat_decisions_desc:0 "Measures from the national programme of Ratio. Provisional gameplay unless a source ledger row says otherwise."
 RAT_wd_ore_season_decision:0 "Sign a Season of Ore Contracts"
 RAT_wd_ore_season_decision_desc:0 "The ministry of mines sells a season of Troton ore and Centrum billets forward to foreign buyers. Repeatable once a year; the mills forgo some alloy work while the contracts run."
 RAT_wd_bond_tranche_decision:0 "Reopen the Bond Window"
 RAT_wd_bond_tranche_decision_desc:0 "The treasury sells another tranche of valley bonds at the Centrum exchange. Available each year once the first bonds have sold."
 RAT_wd_frontier_drill_decision:0 "Raise the Frontier Alert"
 RAT_wd_frontier_drill_decision_desc:0 "The garrisons of every frontier stand to for three months. Repeatable twice a year; the alert burns fuel and overtime."
 RAT_wd_send_relief_columns_decision:0 "Send Relief Columns West"
 RAT_wd_send_relief_columns_decision_desc:0 "Lorries from the reception halls carry food and medicine to the frontier towns. Once only; the columns cost political capital at home."
 RAT_wd_headland_radar_decision:0 "A Radar on the Zulian Headland"
 RAT_wd_headland_radar_decision_desc:0 "Engineers raise a coastal radar above Sukaxhija for shipping and air traffic. A one-time works programme."
 RAT_wd_district_hearing_decision:0 "Summon a District Hearing"
 RAT_wd_district_hearing_decision_desc:0 "Council members sit for a week in one district and take petitions in public. Repeatable once a year."
