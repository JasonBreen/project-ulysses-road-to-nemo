 ac_snc_ose_message_14.t:0 "The Authority after Midnight: The Hearing"
 ac_snc_ose_message_14.d:0 "The duty officer has worked through the night and hears the proposed hearing as a criticism of the decision that kept his service functioning. The civil clerk waits before answering. 'I am asking who can stop renewing it,' she says. He studies the copied instruction and finds no name. A protected mandate could provide one inside the professional chain; civil renewal could expose the same decision to a wider challenge. Neither would make last night's work disappear. The committee must choose how a necessary exception will be prevented from becoming an instruction nobody remembers choosing."
