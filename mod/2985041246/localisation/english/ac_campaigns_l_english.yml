 ac_camp.17.t:0 "A useful failure to simplify"
 ac_camp.17.desc:0 "The review officer asked for a single conclusion. The liaison offered the operation result. That was not quite what had been requested. A conclusion was supposed to explain whether the arrangement should be repeated elsewhere, preferably in language that could be circulated without the accompanying file.\n\nThe liaison read the summary again. The route had required people in occupied territory to disclose information to one authority and ask another authority to respect the limits of its use. The result recorded what had actually happened to that attempt. It could not show that the next driver would receive the same answer at the same checkpoint.\n\nHe added a paragraph about the private inquiry. The review officer wondered whether it was relevant. The liaison said that the woman who had written it would probably consider it relevant. The conversation stopped for a moment, then continued more carefully.\n\nOutside the office, a courier was waiting with dispatches for the next shift. The war had not paused for a medical arrangement, and the command had other duties it could not decline. That was a fact worth preserving beside the reasons the arrangement had needed protection in the first place.\n\nIn the end, the review circulated with an annex. The annex contained the limits of the commitment, the actual answers received, and the questions still awaiting an answer. Someone would complain about its length.\n\nThe liaison sent a copy to the receiving desk. The people inheriting the next request would at least know that a small line on their map might contain a whole afternoon of somebody else's life."
 ac_camp.17.a:0 "Keep this account."
 ac_camp.17.z:0 "Close this old message."
