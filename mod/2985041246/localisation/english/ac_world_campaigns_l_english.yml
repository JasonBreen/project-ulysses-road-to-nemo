 ac_wc_soa.5.d:0 "Suppliers have promised the same skilled shifts to civilian buyers and the services. Every contract looks affordable in isolation. Vey asks whose delivery is allowed to slip when both come due.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
