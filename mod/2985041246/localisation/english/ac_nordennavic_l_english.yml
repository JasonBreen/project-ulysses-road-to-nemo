 NEC_nc_cancel_service_desc:0 "Release the current rota immediately. Funding and institutional effort already spent are not refunded. Delivered time is retained in the record, but the interrupted period cannot unlock a completed-service review."
 NEC_nc_opening_public_spirit:0 "Nordennavic: An Open Hearing"
 NEC_nc_opening_public_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 NEC_nc_opening_ministerial_spirit:0 "Nordennavic: A Ministerial Docket"
 NEC_nc_opening_ministerial_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ac_nec.10.t:0 "Three Ministries, One Quay"
 ac_nec.10.d:0 "The first inter-ministry meeting on the northern harbours begins with a map. The fisheries ministry has marked its landing quays, the transport ministry its freight berths and the defence ministry its reserve anchorages. Several marks sit on top of each other. None of the ministries is wrong; each has simply planned as if the others did not exist.\n\nThe cabinet must decide how to untangle them, and whether to do it in front of the coastal communities who will live with the result."
 ac_nec.10.a:0 "Open the harbour register to public questions."
 ac_nec.10.b:0 "Begin with a protected ministry docket."
 NEC_harbours_ac_nec_policy_callback_0:0 "The standing policy is commercial berth priority. Its continuing cost remains part of the allocation."
 NEC_harbours_ac_nec_policy_callback_1:0 "The standing policy is reserved fleet anchorages. Its continuing cost remains part of the allocation."
 NEC_nc_harbours_reply_public_spirit:0 "A Register of Northern Harbours: Public Return"
 NEC_nc_harbours_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Survey quays, cranes and channels before the next season's commitments are made. Public attention or reserved staff time remains committed to that work."
 NEC_nc_harbours_reply_protected_spirit:0 "A Register of Northern Harbours: Protected Working Return"
 NEC_nc_harbours_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Rotate reserve vessels through maintenance berths without displacing scheduled freight. Public attention or reserved staff time remains committed to that work."
 ac_nec.20.t:0 "The Same Quay, Three Times"
 ac_nec.20.d:0 "The harbour master's board shows one quay booked three times for the same week: a fish-processing ship, a fuel delivery and a reserve vessel due for hull inspection. Each booking was made correctly by a different office. None of them knew about the others.\n\nThe board's secretary proposes publishing the whole season's bookings, so that every user can see the conflicts and settle them before the boats arrive. The reserve staff would rather keep its bookings in a separate protected list; announcing when reserve vessels are in for repair tells anyone watching when they are not at sea.\n\n[NEC_harbours_ac_nec_policy_callback]"
 ac_nec.20.a:0 "Publish the season's bookings."
 ac_nec.20.b:0 "Keep reserve bookings in a protected list."
 NEC_harbours_ac_nec_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 NEC_harbours_ac_nec_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 NEC_harbours_ac_nec_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_nec.50.t:0 "A Harbour Calendar That Includes the Weather"
 ac_nec.50.d:0 "The final review is a calendar with storms marked on it. Winter repairs come first; summer capacity is promised only after they are finished. The quay that was booked three times now has one booking per week, and a note explaining which service waits when the weather closes the harbour.\n\nNobody claims the harbours are larger than they were. The board claims only that its promises can now be kept.\n\n[NEC_harbours_ac_nec_report_callback]\n\n[NEC_harbours_ac_nec_policy_callback]"
 ac_nec.50.a:0 "File the completed service record."
 NEC_reserve_ac_nec_policy_callback_0:0 "The standing policy is civil crews in reserve. Its continuing cost remains part of the allocation."
 NEC_reserve_ac_nec_policy_callback_1:0 "The standing policy is standing reserve squadrons. Its continuing cost remains part of the allocation."
 NEC_nc_reserve_reply_public_spirit:0 "Keep the Maritime Reserve Honest: Public Return"
 NEC_nc_reserve_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Call reserve crews for a scheduled period aboard inspected vessels. Public attention or reserved staff time remains committed to that work."
 NEC_nc_reserve_reply_protected_spirit:0 "Keep the Maritime Reserve Honest: Protected Working Return"
 NEC_nc_reserve_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Reconcile crew lists and vessel inspections with the reserve register. Public attention or reserved staff time remains committed to that work."
 ac_nec.21.t:0 "The Name on Two Lists"
 ac_nec.21.d:0 "A ferry engineer appears on the reserve list twice: once as chief engineer of a patrol vessel and once as a deck hand on a minesweeper that was sold for scrap years ago. He also appears, correctly, on the ferry company's roster for the winter season. When the reserve staff call him for training, the ferry company calls the ministry.\n\nThe reserve inspector wants to publish the corrected list, so that employers and reservists can check it for themselves. The staff would prefer to correct it internally; a public list of how few crews the reserve really has is not a document it wants to circulate.\n\n[NEC_reserve_ac_nec_policy_callback]"
 ac_nec.21.a:0 "Publish the corrected reserve list."
 ac_nec.21.b:0 "Correct the list internally."
 NEC_reserve_ac_nec_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 NEC_reserve_ac_nec_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 NEC_reserve_ac_nec_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_nec.51.t:0 "A Smaller List That Is True"
 ac_nec.51.d:0 "The reserve list at the end of the review is shorter than the one at the beginning. Every name on it belongs to a person who answered the last call, and every vessel to a hull that passed its last inspection. The ferry engineer appears once, with a training period scheduled outside the winter season.\n\nThe reserve is not stronger because its list is shorter. It is more useful, because the government now knows what it can ask of it.\n\n[NEC_reserve_ac_nec_report_callback]\n\n[NEC_reserve_ac_nec_policy_callback]"
 ac_nec.51.a:0 "File the completed service record."
 NEC_consultation_ac_nec_policy_callback_0:0 "The standing policy is open technical consultation. Its continuing cost remains part of the allocation."
 NEC_consultation_ac_nec_policy_callback_1:0 "The standing policy is narrow diplomatic mandate. Its continuing cost remains part of the allocation."
 NEC_nc_consultation_reply_public_spirit:0 "Decide What We Will Discuss: Public Return"
 NEC_nc_consultation_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Answer invitations, brief delegations and record what was discussed. Public attention or reserved staff time remains committed to that work."
 NEC_nc_consultation_reply_protected_spirit:0 "Decide What We Will Discuss: Protected Working Return"
 NEC_nc_consultation_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Publish a summary of consultations and the commitments they did or did not create. Public attention or reserved staff time remains committed to that work."
 ac_nec.22.t:0 "An Invitation Accepted by the Wrong Office"
 ac_nec.22.d:0 "A harbour engineer accepted an invitation to a regional technical meeting, which was entirely within her remit. At the meeting she was asked whether Nordennavic would join a shared maintenance roster, and she said she would ask. The other delegations recorded her answer as a promise.\n\nThe consultation desk proposes publishing the meeting record with a note on what Nordennavic did and did not agree to, so that the misunderstanding is corrected in public. The ministry would rather send a private letter to each delegation; correcting a colleague in public may make technical experts reluctant to attend the next meeting.\n\n[NEC_consultation_ac_nec_policy_callback]"
 ac_nec.22.a:0 "Publish the meeting record with a correction."
 ac_nec.22.b:0 "Correct the record privately with each delegation."
 NEC_consultation_ac_nec_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 NEC_consultation_ac_nec_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 NEC_consultation_ac_nec_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_nec.52.t:0 "A Record of What Was Agreed"
 ac_nec.52.d:0 "The consultation record at the end of the period lists every meeting, who spoke for Nordennavic and what, if anything, was agreed. Most entries say nothing was agreed, which is accurate and useful. The harbour engineer's meeting is listed with its correction.\n\n[NEC_nc_anean_record]\n\nThe settlement does not make Nordennavic more or less willing to cooperate. It makes its willingness legible.\n\n[NEC_consultation_ac_nec_report_callback]\n\n[NEC_consultation_ac_nec_policy_callback]"
 ac_nec.52.a:0 "File the completed service record."
 NEC_technical_reserve_ac_nec_policy_callback_0:0 "The standing policy is civil engineering reserve. Its continuing cost remains part of the allocation."
 NEC_technical_reserve_ac_nec_policy_callback_1:0 "The standing policy is defence technical reserve. Its continuing cost remains part of the allocation."
 NEC_nc_technical_reserve_reply_public_spirit:0 "A National Technical Reserve: Public Return"
 NEC_nc_technical_reserve_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Call reserve specialists for a scheduled exercise on real equipment. Public attention or reserved staff time remains committed to that work."
 NEC_nc_technical_reserve_reply_protected_spirit:0 "A National Technical Reserve: Protected Working Return"
 NEC_nc_technical_reserve_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Retrain reserve members on current equipment and procedures. Public attention or reserved staff time remains committed to that work."
 ac_nec.23.t:0 "The Switchboard Nobody Remembers"
 ac_nec.23.d:0 "During the first exercise the reserve office asks a retired telephone engineer to restore an old coastal switchboard kept for emergencies. He can do it, but only he can: the manuals are lost and the two colleagues who also knew the system have died. The exercise succeeds and the report raises an uncomfortable question about everything else the reserve depends on.\n\nThe reserve office wants to publish a list of skills held by fewer than three registered people, so that training can be planned openly. The defence staff argues that such a list would describe the country's weakest points exactly, and wants it kept protected.\n\n[NEC_technical_reserve_ac_nec_policy_callback]"
 ac_nec.23.a:0 "Publish the list of rare skills."
 ac_nec.23.b:0 "Keep the list of rare skills protected."
 NEC_technical_reserve_ac_nec_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 NEC_technical_reserve_ac_nec_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 NEC_technical_reserve_ac_nec_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_nec.53.t:0 "Skills Written Down"
 ac_nec.53.d:0 "The final review lists the skills the reserve can call on, how many people hold each and when they last practised. The coastal switchboard has a new manual, written by the retired engineer and two younger technicians he trained during the refresher period.\n\nThe reserve remains small. Its members are no longer the only copy of what they know.\n\n[NEC_technical_reserve_ac_nec_report_callback]\n\n[NEC_technical_reserve_ac_nec_policy_callback]"
 ac_nec.53.a:0 "File the completed service record."
 NEC_northern_routes_ac_nec_policy_callback_0:0 "The standing policy is protected fishing and freight lanes. Its continuing cost remains part of the allocation."
 NEC_northern_routes_ac_nec_policy_callback_1:0 "The standing policy is patrolled approaches. Its continuing cost remains part of the allocation."
 NEC_nc_northern_routes_reply_public_spirit:0 "Northern Shipping Routes: Public Return"
 NEC_nc_northern_routes_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep rescue coordination, weather reporting and standby crews ready for a season. Public attention or reserved staff time remains committed to that work."
 NEC_nc_northern_routes_reply_protected_spirit:0 "Northern Shipping Routes: Protected Working Return"
 NEC_nc_northern_routes_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Patrol harbour approaches on a published schedule that includes rescue duties. Public attention or reserved staff time remains committed to that work."
 ac_nec.24.t:0 "A Patrol That Turned Back"
 ac_nec.24.d:0 "A reserve patrol vessel abandoned its scheduled route to assist a fishing boat with a flooded engine room, and towed it home through a rising storm. The patrol log records the route as incomplete. The fishing community records the crew as heroes. The maritime authority must decide which record it intends to keep.\n\nThe authority's director wants the incident published as an example of what the patrols are for. The reserve staff would rather report it internally; a public account of a patrol leaving its route also tells observers when the approaches were unwatched.\n\n[NEC_northern_routes_ac_nec_policy_callback]"
 ac_nec.24.a:0 "Publish the incident as an example."
 ac_nec.24.b:0 "Report the incident internally."
 NEC_northern_routes_ac_nec_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 NEC_northern_routes_ac_nec_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 NEC_northern_routes_ac_nec_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_nec.54.t:0 "A Season Counted in Rescues"
 ac_nec.54.d:0 "The final review counts rescues, inspections and routes kept open, and only then miles patrolled. The patrol that turned back appears in the first column, not as a failure in the last.\n\nThe northern routes are no safer from the weather than they were. The people who use them now know who will come when it turns.\n\n[NEC_northern_routes_ac_nec_report_callback]\n\n[NEC_northern_routes_ac_nec_policy_callback]"
 ac_nec.54.a:0 "File the completed service record."
 NEC_neutral_waters_ac_nec_policy_callback_0:0 "The standing policy is humanitarian transit only. Its continuing cost remains part of the allocation."
 NEC_neutral_waters_ac_nec_policy_callback_1:0 "The standing policy is armed neutral patrols. Its continuing cost remains part of the allocation."
 NEC_nc_neutral_waters_reply_public_spirit:0 "Neutral Waters in a Troubled Region: Public Return"
 NEC_nc_neutral_waters_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Inspect requests for passage, fuel and repairs under the published neutrality rules. Public attention or reserved staff time remains committed to that work."
 NEC_nc_neutral_waters_reply_protected_spirit:0 "Neutral Waters in a Troubled Region: Protected Working Return"
 NEC_nc_neutral_waters_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Patrol territorial waters to observe and report, without engaging foreign vessels. Public attention or reserved staff time remains committed to that work."
 ac_nec.25.t:0 "A Fuel Request in Calm Weather"
 ac_nec.25.d:0 "A foreign naval auxiliary asks to refuel at a northern harbour during an ordinary week. There is no crisis and no war; the request is routine and the fuel is available. The customs officer on duty notices that the published neutrality rules do not say whether routine peacetime requests count as precedent for later ones.\n\nThe ports authority wants to publish the request and its answer, so that every government can see the rules applied in calm weather before anyone tests them in a storm. The foreign ministry would rather answer privately; publishing a foreign navy's movements is a diplomatic act in itself.\n\n[NEC_neutral_waters_ac_nec_policy_callback]"
 ac_nec.25.a:0 "Publish the request and the answer."
 ac_nec.25.b:0 "Answer the request privately."
 NEC_neutral_waters_ac_nec_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 NEC_neutral_waters_ac_nec_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 NEC_neutral_waters_ac_nec_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_nec.55.t:0 "Rules That Were Tested Early"
 ac_nec.55.d:0 "The final review lists every request for passage, fuel and repairs during the period and the rule applied to each. Most were routine. A few were refused, and the refusals were accepted because the rules had been published before anyone needed them.\n\nNordennavic's neutrality is not a promise that its neighbours will keep the peace. It is a promise about what Nordennavic will do if they do not.\n\n[NEC_neutral_waters_ac_nec_report_callback]\n\n[NEC_neutral_waters_ac_nec_policy_callback]"
 ac_nec.55.a:0 "File the completed service record."
 NEC_account_ac_nec_policy_callback_0:0 "The standing policy is civil audit. Its continuing cost remains part of the allocation."
 NEC_account_ac_nec_policy_callback_1:0 "The standing policy is protected reserve ledger. Its continuing cost remains part of the allocation."
 NEC_nc_account_reply_public_spirit:0 "The Reserve's Public Account: Public Return"
 NEC_nc_account_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Commission auditors to examine reserve accounts and readiness returns. Public attention or reserved staff time remains committed to that work."
 NEC_nc_account_reply_protected_spirit:0 "The Reserve's Public Account: Protected Working Return"
 NEC_nc_account_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Inspect reserve vessels, harbours and specialists against the published account. Public attention or reserved staff time remains committed to that work."
 ac_nec.26.t:0 "The Cost Nobody Listed"
 ac_nec.26.d:0 "The auditors find that the reserve's budget is accurate and incomplete. It lists salaries, fuel and maintenance. It does not list the fishing days lost when reserve crews train, the freight delayed when anchorages are reserved, or the hours civil engineers spend on defence work. Nobody hid those costs; nobody was asked to count them.\n\nThe audit office wants the full cost published. The defence committee agrees the costs are real but would rather the figures stay in the protected ledger, where they cannot be read as a measure of how much the country could lose in a crisis.\n\n[NEC_account_ac_nec_policy_callback]"
 ac_nec.26.a:0 "Publish the full cost of the reserves."
 ac_nec.26.b:0 "Keep the full cost in the protected ledger."
 NEC_account_ac_nec_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 NEC_account_ac_nec_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 NEC_account_ac_nec_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_nec.56.t:0 "An Account That Includes Everyone"
 ac_nec.56.d:0 "The final account lists the reserves' cost in money, in lost fishing days, in delayed freight and in borrowed engineering hours. It also lists what the reserves delivered: rescues, repairs, harbour seasons that worked, and refusals given early enough to keep the peace.\n\nParliament can now argue about the reserves with the same numbers in front of every member. That is what the settlement was for.\n\n[NEC_account_ac_nec_report_callback]\n\n[NEC_account_ac_nec_policy_callback]"
 ac_nec.56.a:0 "File the completed service record."
 NEC_nc_final_public_spirit:0 "Nordennavic: Public Maintenance Assessment"
 NEC_nc_final_public_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 NEC_nc_final_readiness_spirit:0 "Nordennavic: Reserved Readiness Return"
 NEC_nc_final_readiness_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 NEC_nc_opening_callback_public:0 "The opening hearing invited public questions. Its final account returns to that promise without pretending that every disagreement has been resolved."
 NEC_nc_opening_callback_ministerial:0 "The opening review began with a protected ministerial docket. Its final account identifies what that process delivered and who must answer for the work still waiting."
 NEC_nc_opening_callback_unanswered:0 "The opening invitation was never ratified. This assessment records that absence and proceeds from the services actually completed."
 ac_nec.80.t:0 "A Northern Country That Knows Its Reserves"
 ac_nec.80.d:0 "The last review of the period sets the harbours, the maritime and technical reserves, the northern routes and the neutrality rules side by side. Each has a cost, a purpose and a record of what it delivered. Some delivered less than their founders hoped; the review says so.\n\nNordennavic has not become a larger or more powerful country. It has become one that can say, accurately, what it is able to do and what it is not.\n\n[NEC_nc_opening_callback]"
 ac_nec.80.a:0 "Support a public maintenance review."
 ac_nec.80.b:0 "Reserve staff for a focused readiness return."
