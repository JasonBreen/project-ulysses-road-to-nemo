 OSE_snp_appropriations_civil_policy_spirit:0 "Civilian service floor"
 OSE_snp_appropriations_civil_policy_spirit_desc:0 "The first federal return contains three promises against the same staff rota. The public-service officer asks which promise should be withdrawn; the defence representative asks why an untested estimate has already become a public commitment. Neither can answer without the receiving offices. A useful appropriation must identify what can actually be sustained, who may change it and which service bears the delay. The federal register will preserve that disagreement instead of resolving it with another uncosted declaration.\n\nGive civilian services a published minimum claim on the schedule. The protection improves administrative continuity while consuming political attention that could support military commitments."
 OSE_snp_appropriations_civil_policy_spirit_settled:0 "Civilian service floor: Standing Settlement"
 OSE_snp_appropriations_civil_policy_spirit_settled_desc:0 "The first federal return contains three promises against the same staff rota. The public-service officer asks which promise should be withdrawn; the defence representative asks why an untested estimate has already become a public commitment. Neither can answer without the receiving offices. A useful appropriation must identify what can actually be sustained, who may change it and which service bears the delay. The federal register will preserve that disagreement instead of resolving it with another uncosted declaration.\n\nRetain the chosen allocation and its cost in a standing appropriation. Future governments inherit both the promise and the office responsible for correcting it. The chosen continuing cost remains."
 OSE_snp_appropriations_protected_policy_spirit:0 "Protected defence appropriation"
 OSE_snp_appropriations_protected_policy_spirit_desc:0 "The first federal return contains three promises against the same staff rota. The public-service officer asks which promise should be withdrawn; the defence representative asks why an untested estimate has already become a public commitment. Neither can answer without the receiving offices. A useful appropriation must identify what can actually be sustained, who may change it and which service bears the delay. The federal register will preserve that disagreement instead of resolving it with another uncosted declaration.\n\nReserve technical staff for predictable defence work. A protected appropriation sustains readiness, while a continuing civilian burden records the capacity withheld from other services."
 OSE_snp_appropriations_protected_policy_spirit_settled:0 "Protected defence appropriation: Standing Settlement"
 OSE_snp_appropriations_protected_policy_spirit_settled_desc:0 "The first federal return contains three promises against the same staff rota. The public-service officer asks which promise should be withdrawn; the defence representative asks why an untested estimate has already become a public commitment. Neither can answer without the receiving offices. A useful appropriation must identify what can actually be sustained, who may change it and which service bears the delay. The federal register will preserve that disagreement instead of resolving it with another uncosted declaration.\n\nRetain the chosen allocation and its cost in a standing appropriation. Future governments inherit both the promise and the office responsible for correcting it. The chosen continuing cost remains."
