 ac_wc_soa.18.d:0 "The admiralty can draw a long voyage on a chart. Vey asks where the spare parts are. Sellen asks who has authorized the mission. Halvek wants an honest limit before a ship has to turn back.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
