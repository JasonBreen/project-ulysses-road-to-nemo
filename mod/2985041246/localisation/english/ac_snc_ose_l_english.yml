 OSE_snc_contact_verification_renew_desc:0 "Reopen this interrupted review at the present date for ten political power and two institutional-capacity points. It requires a new corresponding funded period; no old work is retroactively credited and the service pays its own usual costs."
 OSE_snc_contact_verification_renew_effect_tt:0 "Commit ten political power and two institutional-capacity points to reopen this interrupted review at the present date. A new corresponding funded service must still complete its usual paid work after this request."
 OSE_snc_contact_verification_renew_requirements_tt:0 "This national review was interrupted before completion. Its protocol is complete, no replacement request is open, and ten political power plus two institutional-capacity points are available."
 OSE_snc_replacement_standards_civil_spirit:0 "Independent replacement acceptance"
 OSE_snc_replacement_standards_civil_spirit_desc:0 "The independent examiner wants enough time to refuse a delivery without first negotiating with the office that promised it. Give that examination a protected civil claim. It improves the continuity of receiving work, while demanding political effort whenever an objection delays a publicly announced schedule. The examiner must describe a specific defect and a practical route to a new decision. Independence does not mean an unlimited hold on everybody else's work. It means the person responsible for accepting a replacement is allowed to say that a deadline did not repair the part placed on the bench."
 OSE_snc_replacement_standards_civil_spirit_settled:0 "Independent replacement acceptance: Standing Review"
 OSE_snc_replacement_standards_civil_spirit_settled_desc:0 "The standing replacement standard follows an order beyond the purchasing signature. It retains the selected independent or protected receiving practice and the burden accepted to sustain it. Completed scrutiny improves that practice without promising an equipment delivery that production has not supplied. If an overseas supplier refuses an exchange or disappears from the schedule, the domestic acceptance method still works. The committee leaves room for that possibility in its final account. A dependable standard is one the receiving office can use when the convenient partner, the helpful supervisor or the first promised window is no longer available."
 OSE_snc_replacement_standards_protected_spirit:0 "Protected replacement schedule"
 OSE_snc_replacement_standards_protected_spirit_desc:0 "The receiving services ask for a predictable window in which replacements, technical staff and acceptance authority are available together. Protect that schedule, recording the civilian work it displaces. A workshop should not finish an order only to discover that its examiner has been reassigned to another urgent programme. The policy supports dependable production through coordination, rather than a claim that an instruction can create equipment. A returned part still has to be repaired or replaced. The guarantee concerns who will receive it and who must answer if the next window is also allowed to disappear."
 OSE_snc_replacement_standards_protected_spirit_settled:0 "Protected replacement schedule: Standing Review"
 OSE_snc_replacement_standards_protected_spirit_settled_desc:0 "The standing replacement standard follows an order beyond the purchasing signature. It retains the selected independent or protected receiving practice and the burden accepted to sustain it. Completed scrutiny improves that practice without promising an equipment delivery that production has not supplied. If an overseas supplier refuses an exchange or disappears from the schedule, the domestic acceptance method still works. The committee leaves room for that possibility in its final account. A dependable standard is one the receiving office can use when the convenient partner, the helpful supervisor or the first promised window is no longer available."
 OSE_snc_replacement_standards_public_return_spirit:0 "Open receiving record"
 OSE_snc_replacement_standards_public_return_spirit_desc:0 "Publish the acceptance finding without publishing every protected technical detail. The receiving service can show why a signature was challenged, what the examiner required, and which schedule changed as a result. That account supports public confidence while taking political attention to maintain. It will be inconvenient when a later order fails for a similar reason. The examiner accepts that inconvenience as part of the arrangement. A public standard is useful because a workshop, claimant or successor can recognize when the government has begun treating it as an optional explanation for somebody else's delay."
 OSE_snc_replacement_standards_staff_return_spirit:0 "Protected professional return"
 OSE_snc_replacement_standards_staff_return_spirit_desc:0 "The workshop proposes a professional account detailed enough for the next examiner to repeat the acceptance check. Its supervisors want the failed attempt retained beside the corrected one, despite a purchasing office's preference for a shorter report. Preserve that return within the protected receiving schedule. It improves professional continuity while continuing to reserve civilian capacity for the work. The account cannot claim that every claimant approved the resulting priority. Its value is that an apprentice can see which decision changed, which evidence changed it, and why a signed invoice did not settle the question."
 OSE_snc_replacement_standards_brief:0 "The Part beside the Invoice"
 OSE_snc_replacement_standards_brief_desc:0 "A returned component is placed beside an invoice marked accepted. The workshop can explain how the acceptance happened; the receiving service can explain why it should not have happened that way. Both explanations are necessary. Open a review of replacement standards that follows an order into actual use, rather than ending where a purchasing office obtained the required signature. The existing industrial and procurement settlements provide the starting responsibility. The next question is who may challenge an acceptance after the paperwork has become somebody else's evidence that a commitment was fulfilled."
 OSE_snc_replacement_standards_brief_requirements_tt:0 "From 2006.1.1, an active national administration and the required earlier work are available. The selected policy remains exclusive; conclusions remain available when their real prerequisites finish after the expected calendar."
