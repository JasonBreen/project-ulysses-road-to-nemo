 OSE_snp_crisis_authority_civil_policy_spirit:0 "Civil verification return"
 OSE_snp_crisis_authority_civil_policy_spirit_desc:0 "An urgent request reaches the capital through two channels, each claiming that the other has already approved it. The committee asks for the original order. One officer calls the question a dangerous delay; another says a service cannot obey a chain of authority it cannot identify. These procedures do not decide whether a later conflict occurs. They determine whether the nation has paid for verification, civilian cover and a useful refusal before an emergency narrows every choice.\n\nRequire civilian verification before an exceptional order is renewed. Confidence improves while political attention remains committed to the check."
