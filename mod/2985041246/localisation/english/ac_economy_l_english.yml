l_english:
 ac_economy_rule_group:0 "Project Ulysses experiments"
 ac_economy_rule:0 "Experimental fiscal economy"
 ac_economy_disabled:0 "Disabled (default)"
 ac_economy_disabled_desc:0 "Preserve the inherited campaign economy."
 ac_economy_experimental:0 "Enable fiscal prototype"
 ac_economy_experimental_desc:0 "Enable weekly budgets, debt and domestic procurement for countries with owned states. All fiscal values are provisional gameplay units, not canon GDP. Requires the repaired 1.19 port; runtime validation is pending."
 ac_economy_budget:0 "Treasury and budget (prototype)"
 ac_economy_budget_desc:0 "Provisional fiscal units (FU), not canon currency or GDP.\nTreasury: [?ac_econ_treasury|.2] FU; debt: [?ac_econ_debt|.2]; unpaid bills: [?ac_econ_arrears|.2].\nCurrent weekly estimate: revenue [?ac_econ_revenue|.2], civilian spending [?ac_econ_civilian_spending|.2], military spending [?ac_econ_military_spending|.2], interest [?ac_econ_interest|.2], balance [?ac_econ_balance|.2].\nLast settled week: revenue [?ac_econ_last_revenue|.2], operating spending [?ac_econ_last_spending|.2], interest [?ac_econ_last_interest|.2], balance [?ac_econ_last_balance|.2]. Borrowed [?ac_econ_last_borrowed|.2], new unpaid bills [?ac_econ_last_arrears_added|.2], bills paid [?ac_econ_last_arrears_paid|.2].\nDebt ceiling: [?ac_econ_debt_limit|.2]; available credit: [?ac_econ_credit_room|.2]. Principal repayment and procurement are separate cash transactions.\nContract escrow: [?ac_econ_procurement_escrow|.2]; production pulses remaining: [?ac_econ_procurement_weeks|.0]. Lost military capacity or capitulation pauses production; cancellation refunds escrow.\nTax and service changes each have a shared 30-day cooldown. Refresh updates estimates without moving money."
 ac_econ_budget_modifier:0 "Provisional fiscal policy"
 ac_econ_refresh:0 "Refresh budget estimate"
 ac_econ_refresh_desc:0 "Recalculate estimates after factory, territory or war changes. This does not settle another week or change cash, debt, unpaid bills or procurement."
 ac_econ_borrow_decision:0 "Borrow 5 fiscal units"
 ac_econ_borrow_decision_desc:0 "Receive 5 FU and incur exactly 5 FU of principal. Requires 5 FU of credit room and no unpaid bills. Weekly interest is 0.1% of outstanding principal. The ceiling is 26 weeks of current revenue; a lower ceiling never erases existing debt."
 ac_econ_repay_decision:0 "Repay up to 5 fiscal units"
 ac_econ_repay_decision_desc:0 "Pay the smallest of 5 FU, outstanding debt and available treasury. Unpaid bills take priority and block voluntary debt repayment."
 ac_econ_order_infantry_decision:0 "Fund a basic infantry contract (5 FU)"
 ac_econ_order_infantry_decision_desc:0 "Reserve 5 FU immediately for 100 basic infantry equipment. Requires the existing Infantry Weapons technology, a military factory, no capitulation, no unpaid bills, and no active contract. Delivery takes four weekly production pulses. This is a provisional domestic contract, not an international arms market or an aircraft purchase."
 ac_econ_cancel_order_decision:0 "Cancel the funded infantry contract"
 ac_econ_cancel_order_decision_desc:0 "Refund the active contract's escrow once. Delivered equipment cannot be refunded. Unpaid bills will consume the refunded cash at the next settlement."
 ac_econ_low_tax_decision:0 "Use low taxation"
 ac_econ_low_tax_decision_desc:0 "Set weekly revenue to 15% of fiscal capacity, with +2 percentage points of stability. Provisional calibration. Locks tax changes for 30 days."
 ac_econ_standard_tax_decision:0 "Use standard taxation"
 ac_econ_standard_tax_decision_desc:0 "Set weekly revenue to 20% of fiscal capacity, with no tax stability adjustment. Provisional calibration. Locks tax changes for 30 days."
 ac_econ_high_tax_decision:0 "Use high taxation"
 ac_econ_high_tax_decision_desc:0 "Set weekly revenue to 25% of fiscal capacity, with -3 percentage points of stability. Provisional calibration. Locks tax changes for 30 days."
 ac_econ_basic_services_decision:0 "Fund basic civilian services"
 ac_econ_basic_services_decision_desc:0 "Spend 12% of fiscal capacity each week on civilian services, with no construction bonus. Provisional calibration. Locks service changes for 30 days."
 ac_econ_reconstruction_decision:0 "Fund additional reconstruction"
 ac_econ_reconstruction_decision_desc:0 "Spend 16% of fiscal capacity each week on civilian services, with +5% construction speed. Unpaid bills impose -5 percentage points of stability and -5% construction speed. Provisional calibration. Locks service changes for 30 days."
