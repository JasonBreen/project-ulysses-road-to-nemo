 AUR_sw_resistance_service_1_desc:0 "Smuggle money and equipment to the resistance for one period.\n\nThe interior ministry must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
