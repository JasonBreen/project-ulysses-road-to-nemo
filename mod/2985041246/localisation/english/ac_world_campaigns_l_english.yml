 ac_wc_soa.1.t:0 "Who Commands the Republic?"
 ac_wc_soa.10.d:0 "There are more applicants than instructors. Halvek wants experienced pilots returned to operational units; Sellen wants entry standards that do not depend on family connections. Vey offers a technical route for rejected applicants.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
