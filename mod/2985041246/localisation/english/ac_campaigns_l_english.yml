 AMB_camp_0_register:0 "The reserve has an address"
 AMB_camp_0_register_desc:0 "The reserve has an address. Open the campaign lane and its preparation record.\n\nThe reserve ledger has names in its margins. A driver whose replacement has not arrived, a depot supervisor whose daughter is due home, and a district that has already lent everything it can spare. Publishing an allocation makes its limits visible to everyone who will be disappointed by them. A protected schedule gives command greater discretion while placing more responsibility on the people receiving the report. The transport offer is bounded, funded and subject to a current answer from the coalition. Its costs remain real after a refusal, because preparing a credible commitment was itself work."
