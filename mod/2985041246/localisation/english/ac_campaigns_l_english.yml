 BLK_camp_3_register:0 "The reckoning"
 BLK_camp_3_register_desc:0 "The reckoning. Open the campaign lane and its preparation record.\n\nWhen the crisis reaches its final days, access is less useful than control and control is less durable than its operators believe. A network may seize a command channel while an investigation is still piecing together its existence. It may also find that a witness survived, that a second copy was preserved, or that another government learned to verify a message before acting on it. The reckoning records what the network achieved and what the state tolerated. Its alternate success is explicit authored gameplay; it is not an inevitable verdict on Belka or its people."
