l_english:
 ac_ur.1.t:0 "The Skully Islands"
 ac_ur.1.d:0 "On 31 December 1995, Robert Tyler, commander of the FCU Army Southern District, eliminates a rebel base in the Skully Islands. Unified Command defeats the rebel forces there through the actions of Scarface Squadron (ACES Chronicle, 1995 / 12.31).\n\nThe report names the islands and the squadron. It does not name a wider conspiracy, and it does not move the border. The same day, far to the north, other forces attack Avalon Dam. This dispatch does not concern them."
 ac_ur.1.a:0 "Record the Southern District action."
 ac_ur.2.t:0 "Rebellion across Usea"
 ac_ur.2.d:0 "On 30 May 1997 a rebellion breaks out. A coup d'état is carried out all across Usea (ACES Chronicle, 1997 / 05.30).\n\nGarrisons report officers who will not answer, and radios that have gone quiet. The council does not yet have a list of which commands have turned. Unified Command is already moving.\n\n§YProvisional gameplay§!: the strain on administration is a balance effect. No state changes hands."
 ac_ur.2.a:0 "Hear Unified Command's request."
 ac_ur.3.t:0 "Unified Command"
 ac_ur.3.d:0 "Scarface 1 is in the air. Unified Command asks the council for authority to break the rebellion and then send the emergency staff home.\n\nThe Chronicle records that Unified Command defeats the rebel forces through the efforts of Scarface 1 (ACES Chronicle, 1997 / 05.30). A longer emergency is a gameplay alternative, not a second official history."
 ac_ur.3.a:0 "The rebellion is defeated."
 ac_ur.3.b:0 "Keep the emergency in place. §YProvisional gameplay.§!"
 ac_ur.4.t:0 "Usea reports a coup"
 ac_ur.4.d:0 "Reports from Central Usea say that a coup has broken out across Usea on 30 May 1997. Unified Command is engaged. This government is not asked to choose a side, and no border in this dispatch has moved (ACES Chronicle, 1997 / 05.30)."
 ac_ur.4.a:0 "Note the report."
 ac_ur_command:0 "Usean Emergency"
 ac_ur_command_desc:0 "Southern District records, the Scarface sortie, and the return to civil administration after the 1997 rebellion."
 ac_ur_record_southern_district:0 "File the Skully Islands report"
 ac_ur_record_southern_district_desc:0 "Enter Robert Tyler's 31 December 1995 action in the Southern District record. The filing does not annex or damage the Skully Islands."
 ac_ur_commit_scarface:0 "Commit Scarface 1"
 ac_ur_commit_scarface_desc:0 "Give Scarface 1 the sortie Unified Command has requested. The Chronicle credits that pilot with the defeat of the rebel forces. This decision adds a temporary air effort. It does not create a new commander."
 ac_ur_restore_administration:0 "Restore civil administration"
 ac_ur_restore_administration_desc:0 "Send the emergency staff home and return day-to-day authority to the civil offices. Available once the rebellion has been defeated, or, on the gameplay branch, once the prolonged strain has expired."
 ac_ur_coup_strain:0 "Emergency Strain"
 ac_ur_coup_strain_desc:0 "Councils miss sessions, garrisons argue over orders, and clerks cannot say which signatures still hold. §YProvisional gameplay§!: the penalties are balance values. No province is transferred."
 ac_ur_unified_command:0 "Unified Command"
 ac_ur_unified_command_desc:0 "Unified Command has the authority it asked for. Staff work is faster, and the army's formations hold together while the emergency lasts. §YProvisional gameplay§!: the bonuses are balance values."
 ac_ur_scarface_sortie:0 "Scarface Sortie"
 ac_ur_scarface_sortie_desc:0 "Scarface 1 is flying the missions Unified Command requested. The rest of the squadron's history is not in this file. §YProvisional gameplay§!: the air bonuses are balance values."
 FCU_ur_acknowledge:0 "Acknowledge the Coup"
 FCU_ur_acknowledge_desc:0 "The council reads the 30 May 1997 reports in open session. A coup has been carried out across Usea. The minutes do not name the rebel commands, because the Chronicle does not name them."
 FCU_ur_unified_command:0 "Back Unified Command"
 FCU_ur_unified_command_desc:0 "Vote the emergency authority Unified Command has requested. The Chronicle's outcome is that Unified Command defeats the rebellion."
 FCU_ur_scarface_sortie:0 "The Scarface Sortie"
 FCU_ur_scarface_sortie_desc:0 "Scarface 1 takes off. The Chronicle credits that effort with the defeat of the rebel forces. This focus does not invent a biography or a new officer."
 FCU_ur_stand_down:0 "Stand the Emergency Down"
 FCU_ur_stand_down_desc:0 "The rebellion has been defeated. Release the formations that were called up for it and send the civil offices back to ordinary work."
 FCU_ur_keep_mobilized:0 "Keep Forces Mobilized"
 FCU_ur_keep_mobilized_desc:0 "§YProvisional gameplay.§! The council keeps the emergency call-up after the Chronicle's defeat would already have ended it. No new war and no new border follows from this vote."
 FCU_ur_assessment:0 "Assess the Emergency"
 FCU_ur_assessment_desc:0 "File what the council can say with a source. On 30 May 1997 the coup was defeated by Unified Command, with Scarface 1 in the air. Anything kept in the field after that is a gameplay choice."
