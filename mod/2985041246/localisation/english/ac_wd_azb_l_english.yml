 ac_wd_azb.1.t:0 "An Election Nobody May Hold"
 ac_wd_azb.1.d:0 "The statute book of the Republic of Azbekerania still prints a general ballot every forty-eight months, with dates, polling rules and the duties of district returning officers set out in full. None of it has been used under the present suspension. The National Administration governs under the democratic banner, but when the interior ministry quietly polls the districts, the democrats register at one voter in a hundred.\n\nThe rest of the country has sorted itself into two blocs of nearly equal size. One is the reservists' leagues: former soldiers of the eight formations, their families and the towns that send them, who want the state run like a mobilisation table. The other is the civil establishment of the three industrial cities, career officials and district notables who belong to no party and distrust anyone who does. Each bloc believes the suspension favours the other.\n\nThe Administration cannot answer the calendar question in a single sitting. It can choose who gets to argue about it first. A public hearing gives the leagues a stage and the establishment a grievance. A ministerial review keeps both out of the room. Inviting both to a round table satisfies neither, but it keeps them talking rather than marching.\n\nProvisional gameplay."
 ac_wd_azb.1.a:0 "Hold public hearings in all ten districts."
 ac_wd_azb.1.b:0 "Refer it to a ministerial review."
 ac_wd_azb.1.c:0 "Seat the leagues and the establishment together."
 ac_wd_azb.2.t:0 "The Seven Towns Report"
 ac_wd_azb.2.d:0 "The survey parties return from the seven towns after a season on tracks that their trucks were never built for. Their reports agree on the essentials. District B, District D, District E, District F, District H, District I and District J have no paved road, no factory and no resource any geologist has recorded. Schools and clinics depend on what each town can raise for itself, which is usually very little.\n\nThe details differ. District I is bigger than any of the three cities' districts and takes days to cross. District E climbs into hills and the republic's only mountain country along the Yuktobanian frontier. District J is desert running down to a coast with no harbour. District F is small and quiet and sits in the middle of everything. District B has a coast and a frontier with Seterano and nothing to connect them.\n\nThe ministers must decide what to do with the findings. Publishing them district by district will start an argument between the three cities and the seven towns that no ministry can control. Filing them inside the ministries will let the road budget follow the figures quietly, while every town assumes it was cheated. Either way the towns now know that someone in the capital has looked.\n\nProvisional gameplay."
 ac_wd_azb.2.a:0 "Publish every district return."
 ac_wd_azb.2.b:0 "Keep the returns for the road budget."
 ac_wd_azb.3.t:0 "Three Cities, One Set of Books"
 ac_wd_azb.3.d:0 "The ledger clerks finish adding up the three industrial districts and find that nobody had ever done it before. The Capital District, District A and District C each run four civilian plants and two arms plants and each draws on its own oil, steel, aluminium and rubber. Together they are the whole of the republic's industry. Separately, each city has been negotiating with foreign buyers as if the other two did not exist.\n\nThe export law sends a large share of everything abroad, and the ledger shows how much of the remainder is lost between plant gates and the customs sheds. Rubber is the tightest figure: barely enough for the army's tyres if none is sold. Fuel is the strangest, because the capital's silo is rarely more than half full while the cities export crude oil every week of the year.\n\nThe ministers can use the ledger to force the three city chambers into a single trade policy, which will take years and set the cities against the capital. Or they can hand each chamber its own figures and let the cities tidy their books quietly. The figures will reach the newspapers whichever course is chosen, and the leagues already have a reporter asking about the silo.\n\nProvisional gameplay."
 ac_wd_azb.3.a:0 "Force a single trade policy."
 ac_wd_azb_3_a:0 "Force a single trade policy."
 ac_wd_azb.3.b:0 "Let each city tidy its own books."
 ac_wd_azb.4.t:0 "Eight Formations on the Road"
 ac_wd_azb.4.d:0 "For one week every formation of the army leaves its barracks at the same time. Three march out of the Capital Centre, three from the logistics centre in District A and two from the logistics centre in District C. Their orders are simple: reach an assembly area at the inland crossroads in District F, report strength and return. Nobody has attempted it before, and the staff suspects why.\n\nThe road from the capital is graded only for part of the way. Trucks from District A must come round by rail through District D, and the line can carry one formation at a time. Two formations arrive on schedule, four arrive late, and two never leave their railheads because the wagons went somewhere else. The engineer companies spend more of the week repairing culverts than any of them expected.\n\nThe chief of staff carries the timings to the Administration in person. They show a continental reserve that cannot yet reach the middle of its own country inside a week. Releasing them hands the leagues an argument and the city chambers a scandal about money spent on trucks that sat at railheads. Releasing only photographs of the closing parade, with bands and a fly-past from the capital wing, keeps spirits high and leaves every road as poor as before.\n\nProvisional gameplay."
 ac_wd_azb.4.a:0 "Release the timings."
 ac_wd_azb.4.b:0 "Release the parade photographs."
 ac_wd_azb.5.t:0 "A Map with Three Frontiers"
 ac_wd_azb.5.d:0 "The foreign ministry's new frontier map takes up a whole wall of the cabinet room. A long red line marks the frontier with Yuktobania, running past five districts and close to two of the three industrial cities. A shorter line marks Seterano along District A and District B. A third runs with Aemurraq past the Capital District, District H and District J, closer to the capital than any minister had quite realised.\n\nEach frontier has been handled by whoever happened to live near it. Customs officers in District C keep their own arrangements with their counterparts across the line. Farmers in District B cross to markets on the Seterano side and come back without paperwork. The garrison in the capital has never planned for a frontier only a short drive from the cabinet room. None of these habits has ever been written down.\n\nThe cabinet is asked for a single policy and finds it has three different problems. The ministers can start with the largest neighbour and accept that the other frontiers wait, or start with the frontier nearest the capital, or simply publish the map and ask the districts what they want. The map itself changes nothing on the ground; it only shows the ministers what they had not looked at.\n\nProvisional gameplay."
 ac_wd_azb.5.a:0 "Begin with the Yuktobanian frontier."
 ac_wd_azb.5.b:0 "Begin with the frontier nearest the capital."
 ac_wd_azb.5.c:0 "Publish the map and consult the districts."
 ac_wd_azb.6.t:0 "Shots in the Dark in District D"
 ac_wd_azb.6.d:0 "A night patrol near a crossing in District D meets a party of armed men moving without lights. Somebody fires; the patrol returns fire; the party scatters into the dark. At dawn the patrol finds two abandoned packs full of tinned food and cigarettes, a wounded man who will not give his name and a set of tyre tracks running toward the line. Nobody is dead, which everyone agrees is lucky.\n\nBy noon the incident has three explanations. The patrol commander says smugglers. The district notables say deserters from some army looking for work. The leagues' newspapers say something far worse and print a map with arrows on it. The frontier authorities across the line, contacted by telephone, say they know nothing and would like the wounded man returned.\n\nThe cabinet must decide how large to make the incident. A full inquiry with outside observers will take months and satisfy the careful. A quiet handover of the wounded man will end it in a day and anger the leagues. A loud protest will please the newspapers and commit the republic to a story it cannot prove. Whatever is chosen, the patrols on every frontier will learn from it what the capital expects of them.\n\nProvisional gameplay."
 ac_wd_azb.6.a:0 "Open a full inquiry with observers."
 ac_wd_azb.6.b:0 "Hand the wounded man back quietly."
 ac_wd_azb.6.c:0 "Protest loudly through the ministry."
 ac_wd_azb.7.t:0 "The Inquiry Reports"
 ac_wd_azb.7.d:0 "Three weeks after the shooting in District D the inquiry delivers its report. It is shorter than anyone expected. The armed party were smugglers carrying food and cigarettes, and the first shot came from a nervous patrol member who saw a flashlight and thought it was a weapon. The wounded man was a hired porter. The tyre tracks belonged to a farm truck on the Azbekeranian side.\n\nThe observers sign the report without reservation. The leagues' newspapers, which had printed arrows on maps, print a correction on an inside page. The patrol commander is moved to a training post and his men are retrained in night procedures. The district notables in District D, who had been sure it was deserters, say very little and buy the patrol a meal.\n\nThe cabinet now holds an unusual thing: a frontier incident settled entirely by evidence. It can publish the report in full as an example of how incidents should be handled, at the cost of embarrassing its own army. Or it can thank the observers privately and file the report, keeping the patrols' pride intact and the lesson inside the general staff where it may or may not be read.\n\nProvisional gameplay."
 ac_wd_azb.7.a:0 "Publish the report in full."
 ac_wd_azb.7.b:0 "File it with the general staff."
 ac_wd_azb.8.t:0 "The Staff Opens a War Room"
 ac_wd_azb.8.d:0 "In March 1995 a war begins around Belka. Azbekerania has no part in it and no frontier near it, yet within a week the general staff has opened a war room in the Capital Centre with a wall map, a radio and a duty officer at every hour. The room exists to answer one question that nobody asks aloud in the cabinet: what happens to a small republic when the countries around it go to war?\n\nDispatches arrive from attaches, newspapers and shortwave bulletins, contradictory and late. The leagues demand that the reserve be called up at once, on the principle that nobody was ever criticised for being ready. The civil establishment answers that calling up the reserve would empty the plants in the three cities in the middle of a price boom. Both sides cite the same dispatches.\n\nThe cabinet must give the war room a purpose. It can be a study cell that reports quietly to the staff and costs nothing in public. Or it can be the visible centre of a raised alert, with the formations brought to readiness and the newspapers briefed each week. The first keeps the plants running; the second tells every neighbour that Azbekerania is watching.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25; the Azbekeranian response is gameplay."
 ac_wd_azb.8.a:0 "A quiet study cell."
 ac_wd_azb.8.b:0 "A raised alert, briefed weekly."
 ac_wd_azb.9.t:0 "Ten Districts Ask What to Do"
 ac_wd_azb.9.d:0 "In April 1996 the long-feared announcement is made: Ulysses will strike the Earth, a danger astronomers first raised in December 1994. Which regions will be hit is not yet known to anyone. Within a day every district office in Azbekerania has telephoned the capital for instructions, and the capital has discovered that it has none to read out.\n\nThe questions are practical. The capital and District C want to know whether their coasts are safe. The seven towns want to know whether anyone will bring them food if the roads fail. The general staff wants to know whether the reserve should prepare for war or for disaster, since it cannot do both well. The trade ministry wants to know whether exports will be held back, and is told to wait.\n\nBefore any plan, the cabinet must decide how to speak. It can announce preparations at once and in full, accepting queues at the markets and a rush of families from the coast inland. Or it can urge calm while the ministries work, accepting that the plan will arrive late and that rumours will fill the gap. The coastal districts will feel the choice first.\n\nProvisional gameplay: date anchors only, ACES Chronicle rows 1994 / 12.10 and 1996 / 04.20; Azbekeranian preparations are gameplay."
 ac_wd_azb.9.a:0 "Announce everything at once."
 ac_wd_azb.9.b:0 "Urge calm while the ministries work."
 ac_wd_azb.10.t:0 "A Rumour on the Coast"
 ac_wd_azb.10.d:0 "Two weeks after the government announced its preparations, a rumour spreads along the coast from the capital to District C: the fragments will fall into the sea, and the sea will come ashore. Nobody can say where it started. By the weekend the coast road inland is jammed with cars, carts and trucks, and the evacuation timetables nobody has written yet are already overdue.\n\nIn District F and District D the arrivals overwhelm towns that have never housed visitors. Prices for rooms and bread triple. Some families sleep in schools and some in their vehicles. In the capital, half-empty streets encourage looting in a few warehouses near the naval harbour, and the police ask the garrison for help. The leagues offer their members as volunteers before anyone has asked.\n\nThe cabinet has two ways to respond, neither good. It can deploy the formations to direct traffic, guard the empty streets and run feeding stations, which works and puts soldiers on every corner. Or it can broadcast the astronomers' own statements every hour and trust that facts will slowly outrun fear, which is slower and leaves the inland towns to cope alone for a while.\n\nProvisional gameplay."
 ac_wd_azb.10.a:0 "Put the formations on the roads."
 ac_wd_azb.10.b:0 "Broadcast the astronomers every hour."
 ac_wd_azb.11.t:0 "A Night with the Trucks Running"
 ac_wd_azb.11.d:0 "Ulysses crosses the Roche limit on 8 July 1999. Azbekerania meets the night with its engines running: the formations are drawn up beside their trucks at the Capital Centre and both logistics centres, the evacuation trains are parked in the District D sidings, and an operator sits awake in every district office with orders to report each hour, even if only to say that the hour passed.\n\nMost of what reaches the capital is noise. Foreign stations contradict one another, amateur operators relay what other amateurs claim to have heard, and the duty officers in the plotting room stop chalking rumours on the board after the first few hours. In the seven towns, families crowd into the town offices around radio sets that arrived only months earlier and listen in near silence.\n\nMorning comes and the ten districts are intact, tired and uneasy. Wherever the fragments came down, the consequences will travel to Azbekerania by slower roads: prices, insurance, debris reports and people on the move. The cabinet must choose between holding the formations beside their trucks for weeks while the reports settle, or releasing them to barracks and asking the districts to open their shops and schools as usual.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1999 / 07.08; no damage in Azbekerania is claimed."
 ac_wd_azb.11.a:0 "Keep the formations on alert."
 ac_wd_azb.11.b:0 "Send them back to barracks."
 ac_wd_azb.12.t:0 "What the Railguns Teach"
 ac_wd_azb.12.d:0 "Erusea's invasion of neutral San Salvacion in the summer of 2003, and its seizure of the Stonehenge railguns for use against aircraft, reach the ten districts as newspaper columns about a faraway continent. The Azbekeranian air staff reads them differently, because the war poses the one question its two small wings have never answered: what becomes of an air force when the sky itself is defended from the ground?\n\nThe staff splits at once. One group argues that the railguns prove the value of air defence from the ground: guns and radar are cheaper than fighters, harder to destroy and never need a pilot. The other group answers that ground defences only deny the sky directly above them, and that a country with seventy-two fighters cannot afford to stop renewing them for a decade while it buys guns.\n\nThe cabinet is asked for money before the war in Usea has run its course, and before anyone knows how it will end. It can fund a study that waits for the result. Or it can let both schools prepare competing programmes now, accepting that one of them will lose a budget fight it has been promised it might win. Either way, the air staff will argue about this war for years.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2003 / SUMMER; the Azbekeranian response is gameplay."
 ac_wd_azb.12.a:0 "Fund a study and wait for the result."
 ac_wd_azb_12_a:0 "Fund a study and wait for the result."
 ac_wd_azb.12.b:0 "Let both schools draft programmes."
 AZB_wd_district_convention_office:0 "Cabinet of the Ten-District Convention"
 AZB_wd_district_convention_office_desc:0 "A cabinet chosen by delegates elected from all ten districts, governing collectively and answerable to the convention until general ballots return on a fixed calendar. Provisional gameplay office with no named holder."
 AZB_wd_civil_directorate_office:0 "Directorate of the Permanent Secretaries"
 AZB_wd_civil_directorate_office_desc:0 "A directorate of senior career officials holding the government seals in the name of the civil service, with ministerial posts left vacant and elections under review. Provisional gameplay office with no named holder."
 AZB_wd_reserve_front_office:0 "Council of the Reserve Front"
 AZB_wd_reserve_front_office_desc:0 "A council of senior reserve officers at the head of the merged reservists' leagues, ruling by decree with a muster roll for every citizen. Provisional gameplay office with no named holder."
 ac_wd_azb_decisions:0 "Azbekerania: National Measures"
 ac_wd_azb_decisions_desc:0 "Measures from the national programme of Azbekerania. Provisional gameplay unless a source ledger row says otherwise."
 AZB_wd_call_reserve_class_decision:0 "Call a Reserve Class to Drill"
 AZB_wd_call_reserve_class_decision_desc:0 "One year group of reservists reports for a month of drill, at the cost of their wages and their employers' patience. Repeatable once a year."
 AZB_wd_grade_district_h_decision:0 "Grade the District H Tracks"
 AZB_wd_grade_district_h_decision_desc:0 "Road crews grade and gravel the side tracks off the desert route into District H. A one-time works programme."
 AZB_wd_release_silo_fuel_decision:0 "Release Fuel from the Silo"
 AZB_wd_release_silo_fuel_decision_desc:0 "Sells part of the capital silo at controlled prices to calm a fuel shortage. Once only; refilling takes years."
 AZB_wd_frontier_liaison_day_decision:0 "Hold a Frontier Liaison Day"
 AZB_wd_frontier_liaison_day_decision_desc:0 "District officials meet across the line to settle grazing, smuggling and lost-property grievances. Repeatable every six months."
 AZB_wd_second_truck_hall_decision:0 "Open a Second Truck Hall"
 AZB_wd_second_truck_hall_decision_desc:0 "Funds a second assembly hall beside the first in District D. A one-time charge on the motor programme."
 AZB_wd_joint_wing_exercise_decision:0 "Exercise Both Wings Together"
 AZB_wd_joint_wing_exercise_decision_desc:0 "Both fighter wings and the radar plot fly a week-long joint exercise. Repeatable once a year; it burns fuel."
