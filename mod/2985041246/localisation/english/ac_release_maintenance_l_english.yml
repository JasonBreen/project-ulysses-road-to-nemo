 ac_release_TER_certify_convoy_desc:0 "Spend 5 political power to prepare the selected DLC technical recipe. Assign or rotate factories and dockyards in the Production screen afterward. Check materials, imports and fuel before manufacturing. Certification grants no production line, industry, resources, equipment or personnel and is once per selected technical configuration."
