 SBK_camp_0_register:0 "Living beside the accusation"
 SBK_camp_0_register_desc:0 "Living beside the accusation. Open the campaign lane and its preparation record.\n\nThe residents have learned that a familiar surname can turn a routine question into an interview. A civil file records conduct, dates and witnesses. A rumor can dispense with all three. Protecting civil procedures takes authority away from people who promise quick certainty. A security review keeps more discretion inside the administration while making the integrity of the individual investigator harder to replace. The campaign preserves specific evidence and commitments without making the surrounding population responsible for the existence of a covert network."
