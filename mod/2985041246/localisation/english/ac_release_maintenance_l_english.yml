 ac_release_AWW_maintenance_access:0 "Register current maintenance"
 ac_release_AWW_maintenance_access_desc:0 "Adopt maintenance templates and existing technical support. Costs 25 political power. Existing saves receive no transport reserve, army, aircraft, ship or historical reward from this action."
 ac_release_AWW_certify_rifles:0 "Certify infantry replacements"
 ac_release_AWW_certify_rifles_desc:0 "Spend 5 political power to prepare the selected DLC technical recipe. Assign or rotate factories and dockyards in the Production screen afterward. Check materials, imports and fuel before manufacturing. Certification grants no production line, industry, resources, equipment or personnel and is once per selected technical configuration."
 ac_release_AWW_queue_rifles:0 "Infantry replacements"
 ac_release_AWW_queue_rifles_desc:0 "Use recipe certification and assign factories or dockyards in the Production screen. This retired action changes no existing line and charges no political power."
