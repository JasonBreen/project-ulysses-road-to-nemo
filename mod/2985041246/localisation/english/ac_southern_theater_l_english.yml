 ac_alc_lea_war_footing:0 "Leasath at War"
 ac_alc_lea_war_footing_desc:0 "The ACES Chronicle records Leasath's declaration of war on the Federal Republic of Aurelia for October 2020 (2020 / 10.XX), giving no day. Leasath is on a war footing until the fighting actually ends; this campaign fixes no end date."
 ac_alc_aur_war_footing:0 "Aurelia at War"
 ac_alc_aur_war_footing_desc:0 "The ACES Chronicle records that Leasath's invasion caught Aurelia off guard (2020 / 10.XX). The federation is on a war footing until the fighting actually ends; this campaign fixes no end date."
 ac_alc_aur_griswall_occupied:0 "Griswall Occupied"
 ac_alc_aur_griswall_occupied_desc:0 "Leasathian forces hold Aurelia's capital, as the Chronicle records that almost the whole country fell under Leasath's control (2020 / 10.XX). The federation governs from elsewhere until Aurelian forces actually hold the capital again; the values are provisional gameplay."
 ac_alc_lea_gleipnir_over_aurelia:0 "The Gleipnir Over Aurelia"
 ac_alc_lea_gleipnir_over_aurelia_desc:0 "The Chronicle records that Leasath invaded using the Gleipnir aerial fortress (2020 / 10.XX). In this campaign the fortress flies only because its project was completed; the modifier is provisional gameplay."
 ac_alc_lea_commander_removed:0 "The Commander Removed"
 ac_alc_lea_commander_removed_desc:0 "The Chronicle records that Leasath's commanding officer, Diego Navarro, was removed from office and that the war ended (2020 / 12.XX). The country's will to fight collapses for 120 days; the value is provisional gameplay. Its politics are not changed by script."
 ac_alc_lea_restraint_kept:0 "A Declaration Withheld"
 ac_alc_lea_restraint_kept_desc:0 "Leasath's government withheld the declaration the ACES Chronicle records for October 2020 (2020 / 10.XX), on its own restraint and Aurelia's renegotiated terms and readiness. This earned alternative is provisional gameplay."
 ac_alc_lea_fought_on:0 "Fighting On After the Removal"
 ac_alc_lea_fought_on_desc:0 "Leasath refused the end of the war the ACES Chronicle records for December 2020 (2020 / 12.XX) and fights on. This provisional alternative weighs on the country for 180 days."
 ac_sp_gleipnir_fortress:0 "The Gleipnir"
 ac_sp_gleipnir_fortress_desc:0 "§YProvisional gameplay§! reward. The strategic airship Gleipnir, with optical camouflage, shockwave ballistic missiles and a Shock Cannon, is complete (Super Weapons, Gleipnir). It is never deployed as a unit; the Chronicle records it shot down in November 2020."
 ac_sp_archelon_works:0 "Archelon Fortress"
 ac_sp_archelon_works_desc:0 "§YProvisional gameplay§! reward. A military fortification and weapons plant, built in secret on Sentry Island in the Danern Straits (Super Weapons, Archelon Fortress). The island is not on this map; the Chronicle records the fortress destroyed in December 2020."
 ac_alc.1.t:0 "Leasath Invades Aurelia"
 ac_alc.1.d:0 "Leasath has declared war on the Federal Republic of Aurelia, citing years of exploitation as its just cause, and has invaded. The ACES Chronicle records the declaration for October 2020 (2020 / 10.XX) without a day.\n\nThe grievance is recorded as Leasath's stated claim; this campaign does not judge it. The war ends when the fighting actually ends, not on a calendar date."
 ac_alc.1.a:0 "The south is at war."
 ac_alc.2.t:0 "The Declaration Leasath Withheld"
 ac_alc.2.d:0 "October 2020 has passed without a Leasathian declaration of war. Leasath's own restraint and Aurelia's renegotiated terms and readiness gave its government the standing to withhold the war the ACES Chronicle records (2020 / 10.XX).\n\nThis is an earned alternative to the official record and is provisional gameplay."
 ac_alc.2.a:0 "Record the restraint."
 ac_alc.3.t:0 "Aurelia and Leasath Already at War"
 ac_alc.3.d:0 "When the month the ACES Chronicle gives for Leasath's declaration came (2020 / 10.XX), the two countries were already fighting one another by other means.\n\nThe owner records that war and observes it from outside; the war's end will be recorded when the fighting actually stops."
 ac_alc.3.a:0 "Observe the war as it is."
 ac_alc.4.t:0 "Other Fighting Enters the Southern War"
 ac_alc.4.d:0 "A third country is now at war with Aurelia or Leasath. The owner moves to external observation and the dated news of the official course stops here.\n\nThe war's end will still be recorded when the fighting between Aurelia and Leasath actually stops."
 ac_alc.4.a:0 "Observe the wider war."
 ac_alc.7.t:0 "The War in the South Ends"
 ac_alc.7.d:0 "Leasath's commanding officer has been removed from office, and the war between Leasath and Aurelia has ended in a ceasefire. The ACES Chronicle records the end for December 2020 (2020 / 12.XX); the official abstract records the downfall of the conflict's chief orchestrator.\n\nThis campaign records the end on the day the ceasefire was actually signed."
 ac_alc.7.a:0 "Begin the accounting."
 ac_alc.8.t:0 "An Early Settlement"
 ac_alc.8.d:0 "Aurelia has offered Leasath terms after retaking its capital, and the fighting has stopped before the end the ACES Chronicle records for December 2020 (2020 / 12.XX).\n\nThis is an earned alternative to the official record and is provisional gameplay."
 ac_alc.8.a:0 "Begin the accounting."
 ac_alc.9.t:0 "Leasath Capitulates"
 ac_alc.9.d:0 "Leasath has capitulated. The war ends in an Aurelian victory.\n\nThe ACES Chronicle records a different end: the commander's removal and the end of the war in December 2020 (2020 / 12.XX). This outcome is the actual result of the campaign, not the official one."
 ac_alc.9.a:0 "Record the outcome."
 ac_alc.10.t:0 "Aurelia Capitulates"
 ac_alc.10.d:0 "Aurelia has capitulated. The war ends in a Leasathian victory.\n\nThe ACES Chronicle records a different end: Aurelia's counter-offensive and the end of the war in December 2020 (2020 / 12.XX). This outcome is the actual result of the campaign, not the official one."
 ac_alc.10.a:0 "Record the outcome."
 ac_alc.11.t:0 "The War in the South Ends"
 ac_alc.11.d:0 "The fighting between Aurelia and Leasath has stopped. Neither country capitulated, and no ceasefire was signed through this owner.\n\nThe ACES Chronicle records the end for December 2020 (2020 / 12.XX); this campaign records the day the fighting actually ceased."
 ac_alc.11.a:0 "Begin the accounting."
 ac_alc.12.t:0 "The Fighting Between Aurelia and Leasath Stops"
 ac_alc.12.d:0 "The fighting between Aurelia and Leasath has stopped. The owner observed this war from outside and asserts nothing about how it was fought."
 ac_alc.12.a:0 "Record the cessation."
 ac_alc.13.t:0 "Leasath Fights On"
 ac_alc.13.d:0 "Leasath has refused the end of the war the ACES Chronicle records for December 2020 (2020 / 12.XX) and fights on.\n\nThis is a provisional alternative; the war's end will be recorded when the fighting actually stops."
 ac_alc.13.a:0 "The war goes on."
 ac_alc.15.t:0 "The Gleipnir Over Aurelia"
 ac_alc.15.d:0 "Leasath's invasion uses the Gleipnir aerial fortress, as the ACES Chronicle records (2020 / 10.XX). The Super Weapons record describes a strategic airship with optical camouflage, shockwave ballistic missiles and a Shock Cannon.\n\nIn this campaign the fortress flies because its project was completed; it remains text, not a unit."
 ac_alc.15.a:0 "The sky darkens."
 ac_alc.20.t:0 "Aurelia Overrun"
 ac_alc.20.d:0 "Leasathian forces hold Griswall, the capital of the Federal Republic of Aurelia. The ACES Chronicle records that almost the whole country fell under Leasath's control (2020 / 10.XX), and the official abstract that only Aubrey Base in the remote southwest stayed unoccupied.\n\nThis campaign reports the occupation only because Leasathian forces actually hold the capital; no state was moved by script."
 ac_alc.20.a:0 "The capital is lost."
 ac_alc.21.t:0 "Aubrey Base Holds"
 ac_alc.21.d:0 "Aurelia's Gryphus Squadron has repelled an attack by the Leasath air force on Aubrey Base (2020 / 10.XX).\n\nAubrey Base is not on this map; the record is reported as the Chronicle gives it, in its month."
 ac_alc.21.a:0 "The base holds."
 ac_alc.22.t:0 "Port Patterson Reclaimed"
 ac_alc.22.d:0 "Aurelian forces have reclaimed Port Patterson (2020 / 11.XX).\n\nThe Chronicle gives the month only; no territory changes hands by script."
 ac_alc.22.a:0 "The port is ours."
 ac_alc.23.t:0 "The Gleipnir Shot Down"
 ac_alc.23.d:0 "Aurelian forces have found the means to disable the Gleipnir's stealth and shot the flying fortress down; the key transport hub of Santa Elva was liberated the same day (2020 / 11.XX).\n\nThis campaign reports the loss because the Gleipnir project was completed; its reward is removed."
 ac_alc.23.a:0 "The fortress falls."
 ac_alc.24.t:0 "Sachana Air Base Retaken"
 ac_alc.24.d:0 "Aurelia has launched an assault to reclaim its largest air base, Sachana Air Base in the Raven Woods, and the operation has succeeded (2020 / 12.XX).\n\nThe Chronicle gives the month only; no territory changes hands by script."
 ac_alc.24.a:0 "The air base is ours."
 ac_alc.25.t:0 "Griswall Retaken"
 ac_alc.25.d:0 "Aurelian forces have retaken Griswall, and Leasathian forces have marched away from the mainland to regroup at Archelon Fortress (2020 / XX.XX).\n\nThe Chronicle gives no month. This campaign reports the recapture because Aurelian forces actually hold the capital again."
 ac_alc.25.a:0 "The capital is free."
 ac_alc.26.t:0 "The Commander Removed"
 ac_alc.26.d:0 "Leasath's commanding officer and the chief orchestrator of the conflict, Diego Navarro, has been removed from office (2020 / 12.XX). The ACES Chronicle records that the war ended.\n\nLeasath's politics are not changed by script; its government must now answer."
 ac_alc.26.a:0 "The war is ending."
 ac_alc.27.t:0 "Archelon Fortress Destroyed"
 ac_alc.27.d:0 "Archelon Fortress has been destroyed (2020 / 12.XX).\n\nThis campaign reports the destruction because the Archelon project was completed; its reward is removed. Sentry Island is not on this map."
 ac_alc.27.a:0 "The fortress is gone."
 ac_alc.5.t:0 "October 2020"
 ac_alc.5.d:0 "The ACES Chronicle records that in October 2020 Leasath declared war on the Federal Republic of Aurelia, citing years of exploitation as its just cause, and invaded (2020 / 10.XX).\n\nThe government can declare the war the record describes, or withhold it, if the standing to withhold was earned: Leasath's own restraint as policy, and Aurelia's renegotiated terms and completed readiness review. Withholding is a provisional alternative."
 ac_alc.5.a:0 "Declare war on Aurelia."
 ac_alc.5.b:0 "Withhold the declaration."
 ac_alc.6.t:0 "The End of the War"
 ac_alc.6.d:0 "The commander has been removed. The ACES Chronicle records that the war ended in December 2020 (2020 / 12.XX).\n\nThe government can sign a ceasefire, or fight on. Fighting on is a provisional alternative; the war's end is then recorded when the fighting actually stops."
 ac_alc.6.a:0 "Sign the ceasefire."
 ac_alc.6.b:0 "Fight on."
 AUR_sw_early_settlement:0 "Offer Terms After Griswall"
 AUR_sw_early_settlement_desc:0 "Offer Leasath terms once Griswall is retaken (2020 / XX.XX), before the end the Chronicle records for December 2020 (2020 / 12.XX). Requires the return with terms as policy. If the engine accepts the peace, the war ends now; this earned alternative is provisional gameplay."
 ac_sp_gleipnir:0 "The Gleipnir"
 ac_sp_gleipnir_desc:0 "A strategic airship with optical camouflage, shockwave ballistic missiles and a Shock Cannon (Super Weapons, Gleipnir). Requires the army's place defined and an officer class trained.\n\n§YProvisional gameplay§!: the gate, timing and reward values are balance choices. The Chronicle records the fortress shot down in November 2020."
 ac_sp_gleipnir_reward_camouflage_trials:0 "Camouflage Trials"
 ac_sp_gleipnir_reward_camouflage_trials_desc:0 "The optical camouflage can be tested on the ground first, or in flight at once."
 ac_sp_gleipnir_reward_camouflage_trials_ground:0 "Test on the ground first"
 ac_sp_gleipnir_reward_camouflage_trials_flight:0 "Test in flight"
 ac_sp_archelon:0 "Archelon Fortress"
 ac_sp_archelon_desc:0 "A military fortification and weapons manufacturing plant, built in secret on Sentry Island in the Danern Straits (Super Weapons, Archelon Fortress). Requires the civil war's front held and its roads protected.\n\n§YProvisional gameplay§!: the gate, timing and reward values are balance choices. The island is not on this map; the Chronicle records the fortress destroyed in December 2020."
 ac_sp_archelon_reward_secrecy:0 "Secrecy"
 ac_sp_archelon_reward_secrecy_desc:0 "The fortress's construction can be audited by the assembly, or kept secret even from it."
 ac_sp_archelon_reward_secrecy_audited:0 "Let the assembly audit it"
 ac_sp_archelon_reward_secrecy_secret:0 "Keep it secret"
 ac_sp_tag_aerial_fortress:0 "Aerial Fortress Projects"
 ac_sp_tag_aerial_fortress_speed_factor:0 "Aerial Fortress Projects Speed"
 ac_sp_tag_aerial_fortress_speed_factor_tt:0 " $ac_sp_tag_aerial_fortress_speed_factor$: $RIGHT|+=%1$"
 ac_superweapons_gleipnir:0 "The Gleipnir"
 ac_superweapons_gleipnir_desc:0 "Without the special-projects feature, the Gleipnir programme runs as a timed decision and grants the same reward as the project (Super Weapons, Gleipnir). It is cancelled if the Chronicle's loss of the fortress is reached first.\n\n§YProvisional gameplay§!: cost and duration are balance choices."
 ac_superweapons_archelon:0 "Archelon Fortress"
 ac_superweapons_archelon_desc:0 "Without the special-projects feature, the Archelon programme runs as a timed decision and grants the same reward as the project (Super Weapons, Archelon Fortress). It is cancelled if the Chronicle's destruction of the fortress is reached first.\n\n§YProvisional gameplay§!: cost and duration are balance choices."
