 ac_camp.72.t:0 "A name received in confidence"
 ac_camp.72.desc:0 "The new designation appeared on a small sheet passed between people who had learned to read an order's distribution before its content. Razgriz. The receiving officer said it once to make certain that he would not stumble over it when someone was listening for a different name.\n\nThe president had returned through a successful rescue, and the squadron's work now had an authority beyond the command that had tried to dispose of it. That changed the explanation the government could offer. It did not erase the memory of having been abandoned by people whose instructions had once sounded equally certain.\n\nThe mechanic at the end of the room asked which maintenance return should be used. The officer gave him the current reference and asked that the earlier copies be preserved. A new name could protect an operation. It could also become a convenient place to lose the obligations that had arrived under the old one.\n\nOutside, the crew preparing the next flight was discussing a fault that had followed an aircraft across the change in designation. The argument sounded familiar enough to let the receiving officer breathe more easily. Some responsibilities remained legible when the politics around them had become difficult to recognize.\n\nHe placed the small sheet in the current file. The next orders would require courage, but they would also require the much quieter work of keeping an accurate record of what had been promised to the people expected to carry them out."
