 ac_wc_soa.13.t:0 "The Reservist Has a Job"
 ac_wc_soa.14.d:0 "The exercise stops at a crossing the planning map treated as usable. Halvek wants engineers attached to the column. Vey argues that reliable maintenance may be worth more than additional vehicles.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
