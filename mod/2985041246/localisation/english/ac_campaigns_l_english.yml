 ac_camp.2005.t:0 "A bounded offer from Ugellas"
 ac_camp.2005.desc:0 "The proposed receiving site is less convenient than the principal base. That is part of its purpose. Ugellas has prepared an additional commitment whose usefulness depends on the coalition respecting its capacity and conditions. The operations officer traces the movement on the map and asks whether the local service can remain open at night. The liaison turns to the attachment before answering. A permission to receive one defined commitment is not a promise to absorb every subsequent requirement. The reply will be returned to the government that actually paid for the preparations, where acceptance, refusal and silence remain different entries."
 ac_camp.2005.a:0 "Accept this defined commitment."
 ac_camp.2005.b:0 "Decline the offer."
