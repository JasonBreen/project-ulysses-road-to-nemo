 ac_snc_yuk_message_11.t:0 "Readiness beside the Workshop: The Hearing"
 ac_snc_yuk_message_11.d:0 "The superintendent asks the committee to count the people standing behind the completed order. The receiving officer replies that the return already contains a total. She opens the teaching schedule and shows him where the same examiner appears twice. 'Which office receives her first?' The question changes the hearing. They can publish a civil account of the actual margin or keep a signed professional return detailed enough to repeat the examination. Neither route can remove the time she spent preparing someone else to do the work safely, however much cleaner the totals would look without it."
