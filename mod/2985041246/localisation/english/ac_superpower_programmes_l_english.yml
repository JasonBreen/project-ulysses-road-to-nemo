 YUK_snp_distribution_review_civil_policy_spirit:0 "Standing civil inspection docket"
 YUK_snp_distribution_review_civil_policy_spirit_desc:0 "The district return has reached the capital after the next allocation was already approved. Its shortages are real, but the late date makes them inconvenient for both offices. A civilian reviewer wants a public receiving account. A command liaison fears that publishing a tentative estimate will make the next correction look like misconduct. The disagreement concerns the authority to revise a plan when people depend on it. A useful national procedure must permit correction without pretending that every office has equal spare capacity.\n\nGive civil inspectors protected access to receiving reports. Public confidence improves while command reservations surrender some flexibility."
