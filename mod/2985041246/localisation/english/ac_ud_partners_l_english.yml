 UGE_ud_reserve_pact_spirit_desc:0 "Ugellas's depots are part of a regional reserve shared with its neighbours. Provisional gameplay."
 UGE_ud_national_reserve_spirit:0 "A National Reserve"
 UGE_ud_national_reserve_spirit_desc:0 "The depots are for Ugellas and are pledged to nobody else. Provisional gameplay."
 UGE_ud_open_depots_spirit:0 "The Open Depots"
 UGE_ud_open_depots_spirit_desc:0 "The reserve has been opened to everyone who needs it. Provisional gameplay."
 UGE_ud_held_depots_spirit:0 "The Held Depots"
 UGE_ud_held_depots_spirit_desc:0 "The reserve is opened only by ration and only by list. Provisional gameplay."
 UGE_ud_depot_villages_spirit:0 "The Depot Villages"
 UGE_ud_depot_villages_spirit_desc:0 "Refugees have settled around the depots, building villages where there were warehouses. Provisional gameplay."
 UGE_ud_onward_columns_spirit:0 "The Onward Columns"
 UGE_ud_onward_columns_spirit_desc:0 "Refugees are carried onward by the mobility columns. Provisional gameplay."
 UGE_ud_defended_depots_spirit:0 "The Defended Depots"
 UGE_ud_defended_depots_spirit_desc:0 "The depots are defended where they stand. Provisional gameplay."
 UGE_ud_forward_depots_spirit:0 "The Forward Depots"
 UGE_ud_forward_depots_spirit_desc:0 "The reserve has been sent forward to the coalition's front. Provisional gameplay."
 UGE_ud_war_reserve_spirit:0 "The Restocked Reserve"
 UGE_ud_war_reserve_spirit_desc:0 "The depots have been restocked for the next crisis. Provisional gameplay."
 UGE_ud_civil_depots_spirit:0 "Depots for the Towns"
 UGE_ud_civil_depots_spirit_desc:0 "Depots have been handed to the towns for schools, clinics and workshops. Provisional gameplay."
 DEL_ud_government_continuity_spirit:0 "The Present Government"
 DEL_ud_government_continuity_spirit_desc:0 "The government balances the inspectors against the commanders. Provisional gameplay."
 DEL_ud_inspectorate_government_spirit:0 "The Inspectorate Cabinet"
 DEL_ud_inspectorate_government_spirit_desc:0 "The government answers to the rules it enforces and to an elected chamber. Provisional gameplay."
 DEL_ud_command_council_government_spirit:0 "The Command Council"
 DEL_ud_command_council_government_spirit_desc:0 "The Council governs by order and inspects afterwards, if at all. Provisional gameplay."
 DEL_ud_relief_auditors_spirit:0 "Auditors for Usea"
 DEL_ud_relief_auditors_spirit_desc:0 "Delarusian inspectors audit the relief accounts of the Usean governments. Provisional gameplay."
 DEL_ud_home_inspection_spirit:0 "Inspection at Home"
 DEL_ud_home_inspection_spirit_desc:0 "Delarus inspects its own relief and nobody else's. Provisional gameplay."
 DEL_ud_emergency_warrants_spirit:0 "Emergency Warrants"
 DEL_ud_emergency_warrants_spirit_desc:0 "Relief officers requisition what they need and account for it later. Provisional gameplay."
 DEL_ud_inspected_relief_spirit:0 "Inspected Relief"
 DEL_ud_inspected_relief_spirit_desc:0 "Every relief issue is docketed and inspected. Provisional gameplay."
 DEL_ud_registered_settlement_spirit:0 "Registered Settlement"
 DEL_ud_registered_settlement_spirit_desc:0 "Registered refugees may settle in Delarus with housing and work. Provisional gameplay."
 DEL_ud_inspected_transit_spirit:0 "Inspected Transit"
 DEL_ud_inspected_transit_spirit_desc:0 "Refugees cross Delarus under inspection, and their dockets travel with them. Provisional gameplay."
 DEL_ud_emergency_command_spirit:0 "Emergency Command"
 DEL_ud_emergency_command_spirit_desc:0 "Inspection is suspended for the duration of the war. Provisional gameplay."
 DEL_ud_inspected_war_effort_spirit:0 "An Inspected War Effort"
 DEL_ud_inspected_war_effort_spirit_desc:0 "Even the war effort is inspected. Provisional gameplay."
 DEL_ud_truth_commission_spirit:0 "The Commission on the Record"
 DEL_ud_truth_commission_spirit_desc:0 "The wartime records are open and anyone may claim a wrong. Provisional gameplay."
 DEL_ud_sealed_archive_spirit:0 "The Sealed Archive"
 DEL_ud_sealed_archive_spirit_desc:0 "The wartime records are sealed for a generation. Provisional gameplay."
 SNS_ud_charter_presidium_office:0 "Presidium of the Charter Assembly"
 SNS_ud_charter_presidium_office_desc:0 "The elected presidium of San Salvacion's Charter Assembly. No individual is named; this is a provisional gameplay government."
 SNS_ud_protection_directorate_office:0 "Civil Protection Directorate"
 SNS_ud_protection_directorate_office_desc:0 "The collective Directorate of San Salvacion's civil protection service. No individual is named; this is a provisional gameplay government."
 SNS_ud_council_committee_office:0 "Standing Committee of the District Councils"
 SNS_ud_council_committee_office_desc:0 "The standing committee of San Salvacion's district water councils. No individual is named; this is a provisional gameplay government."
 AMB_ud_development_board_office:0 "Chartered Development Board"
 AMB_ud_development_board_office_desc:0 "The governing board of Amber's largest contract holders. No individual is named; this is a provisional gameplay government."
 AMB_ud_compact_cabinet_office:0 "Labour Compact Cabinet"
 AMB_ud_compact_cabinet_office_desc:0 "The elected cabinet of Amber's freight workers' compact. No individual is named; this is a provisional gameplay government."
 AMB_ud_league_directorate_office:0 "Directorate of the Sovereign Contracts League"
 AMB_ud_league_directorate_office_desc:0 "The ruling directorate of Amber's Sovereign Contracts League. No individual is named; this is a provisional gameplay government."
 UGE_ud_reserve_council_office:0 "Reserve Council"
 UGE_ud_reserve_council_office_desc:0 "The council of Ugellas's reserve officers. No individual is named; this is a provisional gameplay government."
 UGE_ud_federal_cabinet_office:0 "Federal Cabinet"
 UGE_ud_federal_cabinet_office_desc:0 "The cabinet answerable to Ugellas's first federal parliament. No individual is named; this is a provisional gameplay government."
 DEL_ud_inspectorate_cabinet_office:0 "Inspectorate Cabinet"
 DEL_ud_inspectorate_cabinet_office_desc:0 "The cabinet formed under Delarus's Inspectors' Charter. No individual is named; this is a provisional gameplay government."
 DEL_ud_command_council_office:0 "Command Council"
 DEL_ud_command_council_office_desc:0 "The Command Council of Delarus's senior commanders. No individual is named; this is a provisional gameplay government."
