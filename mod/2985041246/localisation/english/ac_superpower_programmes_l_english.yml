 ac_snp.50.t:0 "The Refusal in the Dispatch Return"
 ac_snp.50.d:0 "The completed exercise return includes one refused dispatch. Its receiving office has explained which reservation made the refusal necessary and what would have to change before the request could be accepted. The instructor keeps that explanation beside the successful receiving entry. The national timetable has gained a usable procedure, rather than an assertion that all traffic can move at once. Its standing settlement retains the chosen priority and the opportunity cost shown in the allocation. The trainee can now distinguish a message that was lost from a request that reached a responsible office and received an unwelcome but useful answer.\n\n[YUK_snp_logistics_response_context]\n[YUK_snp_logistics_period_context]\n[YUK_snp_logistics_policy_context]"
 ac_snp.50.a:0 "File the assessment with its unresolved questions."
 ac_snp.50.a_effect_tt:0 "Retain the completed national service record and its prior choices. This acknowledgement authorizes no additional funded period."
 YUK_snp_training_policy_context_1:0 "The standing policy is open professional debriefs. Its continuing opportunity cost remains in the national schedule."
 YUK_snp_training_policy_context_2:0 "The standing policy is staff-directed training reserve. Its continuing opportunity cost remains in the national schedule."
 ac_snp.21.t:0 "The Unsigned Instructor’s Note"
 ac_snp.21.d:0 "A junior instructor has left a note about an exercise return without signing it. The commission secretary asks whether it should be included in the professional review. The staff representative says that an unsigned objection cannot alter a command assessment; another instructor asks why the author did not believe a signed objection would be received. An open debrief could let the training offices test the criticism together. A protected staff return could give the instructor a responsible channel before the dispute becomes public. Neither route proves that the note is correct. The commission must choose how uncertainty can reach somebody able to answer it without treating silence as professional agreement.\n\n[YUK_snp_training_policy_context]\n[ac_snp_yuk_intervention_context]\n[ac_snp_yuk_command_context]"
 ac_snp.21.a:0 "Open the lesson to a professional debrief across receiving offices."
 ac_snp.21.a_effect_tt:0 "Move up to five existing allocation points toward civil receiving offices, protecting active reservations. The two shares still total one hundred."
 ac_snp.21.b:0 "Protect the first staff return and require an accountable answer."
 ac_snp.21.b_effect_tt:0 "Move up to five existing allocation points toward command support, protecting active reservations. The two shares still total one hundred."
