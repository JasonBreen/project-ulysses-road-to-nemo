 FCU_camp_1_register:0 "A surviving coalition"
 FCU_camp_1_register_desc:0 "A surviving coalition. Open the campaign lane and its preparation record.\n\nThe duty controller has learned to distinguish an aircraft that is late from a government that has stopped answering. Both appear as a blank space in the morning return. The rear bases can receive only so much, and the harbor offensive competes with the next replacement flight for crews and attention. A partner's acceptance is recorded separately from the offer. The command cannot assume that a refusal means disloyalty, or that an unanswered request secretly means yes. Its surviving air force must do the work that the timetable proposes."
