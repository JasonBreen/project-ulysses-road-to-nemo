 ac_ecw_luf_holds_capital:0 "Civil War: The LUF Holds the Capital"
 ac_ecw_luf_holds_capital_desc:0 "The Lyes United Front controls the capital and its ministries. LUF authority: [?ac_ecw_luf_authority|0]/100; Eastern Faction strength: [?ac_ecw_eastern_strength|0]/100. Values are provisional gameplay."
 ac_ecw_divided_country:0 "Civil War: A Divided Country"
 ac_ecw_divided_country_desc:0 "No faction governs the whole country. LUF authority: [?ac_ecw_luf_authority|0]/100; Eastern Faction strength: [?ac_ecw_eastern_strength|0]/100. Values are provisional gameplay."
 ac_ecw_luf_in_retreat:0 "Civil War: The LUF in Retreat"
 ac_ecw_luf_in_retreat_desc:0 "The Lyes United Front has lost most of the country. LUF authority: [?ac_ecw_luf_authority|0]/100; Eastern Faction strength: [?ac_ecw_eastern_strength|0]/100. Values are provisional gameplay."
 ac_ecw_civil_war_ended:0 "After the Civil War"
 ac_ecw_civil_war_ended_desc:0 "The fighting is over and the country begins to count what it lost. Relief steadies the public mood; reconstruction absorbs the government's attention for a year."
 ac_ecw_negotiated_peace:0 "A Negotiated Peace"
 ac_ecw_negotiated_peace_desc:0 "The factions signed a settlement before the war was decided by force. The peace is broader than a victory would have been, and keeping every signatory inside it costs political attention."
 ac_ecw.1.t:0 "The Lyes Faction Seizes the Capital"
 ac_ecw.1.d:0 "The Lyes Faction, later known as the Lyes United Front, has seized control of the Estovakian capital (ACES Chronicle, 2007 / 04.03).\n\nThe ministries now answer to a command that much of the country does not accept. In this campaign the country tag, borders and government are unchanged; the struggle is tracked as authority and strength, which are provisional gameplay."
 ac_ecw.1.a:0 "The capital is under new command."
 ac_ecw.2.t:0 "The Estovakian Civil War Begins"
 ac_ecw.2.d:0 "The Lyes United Front has begun to suppress the cities that resist its rule, and other factions have risen against it. The Estovakian Civil War has begun (ACES Chronicle, 2007 / 06.30)."
 ac_ecw.2.a:0 "A country at war with itself."
 ac_ecw.3.t:0 "The Northeastern Platforms Change Hands"
 ac_ecw.3.d:0 "Estovakia's Eastern Faction has taken and restored the oil platforms in the northeast of the country that were held by a public corporation (ACES Chronicle, 2008 / 07.15).\n\nHow much the platforms strengthen the faction in this campaign depends on whether the government took them into state custody beforehand."
 ac_ecw.3.a:0 "The northeast has a new paymaster."
 ac_ecw.4.t:0 "The Anea Initiative Is Put on Hold"
 ac_ecw.4.d:0 "The Republic of Anea Initiative has been put on hold because of the internal strife in Estovakia (ACES Chronicle, 2008 / 10.23).\n\nThe initiative's existing bureau records are not altered by this event; Emmeria decides what to keep while it waits."
 ac_ecw.4.a:0 "The initiative waits."
 ac_ecw.7.t:0 "The Eastern Faction Breaks the LUF"
 ac_ecw.7.d:0 "The Eastern Faction and the Lyes United Front have clashed. The LUF's superior numbers were overwhelmed by the Eastern Faction's new weapons and elite aviation units, and it lost about 80 percent of its territory in a single week (ACES Chronicle, 2013 / 01.15).\n\nNo territory changes hands on the map; the loss is tracked as LUF authority."
 ac_ecw.7.a:0 "The balance has turned."
 ac_ecw.8.t:0 "The Civil War Continues"
 ac_ecw.8.d:0 "The decisive defeat that the historical record places in 2013 has not happened in this campaign: the Eastern Faction is too weak, or the LUF still holds too much of the country. The war goes on.\n\nThis is a provisional alternative. It ends when the LUF's authority collapses or the factions negotiate a settlement."
 ac_ecw.8.a:0 "The fighting goes on."
 ac_ecw.9.t:0 "General Lyes Is Killed; the Civil War Ends"
 ac_ecw.9.d:0 "The Lyes United Front fought on but suffered a major defeat near the border with Emmeria. General Lyes was killed and the Estovakian Civil War is over (ACES Chronicle, 2013 / 10.29)."
 ac_ecw.9.a:0 "The war is over."
 ac_ecw.10.t:0 "An Attack on the Foreign Minister"
 ac_ecw.10.d:0 "Estovakian Foreign Minister Isaac Arensky, a former air marshal of the Northern Highlands Faction, has been left unconscious by a sudden attack. A week later, fifteen former LUF soldiers are arrested for the crime (ACES Chronicle, 2013 / 11.25)."
 ac_ecw.10.a:0 "The peace is fragile."
 ac_ecw.11.t:0 "A New Foreign Minister"
 ac_ecw.11.d:0 "The death of Foreign Minister Arensky, which occurred on 2 December 2013 and was withheld from the public, has been made public. Antonina Koznick, a former captain in the Eastern Faction navy, is named as his successor (ACES Chronicle, 2013 / 12.02 and 2014 / 02.03).\n\nNo leader, advisor or portrait is created by this report."
 ac_ecw.11.a:0 "The government changes hands."
 ac_ecw.12.t:0 "Former LUF Fighters Attack Relief Supplies"
 ac_ecw.12.d:0 "An armed force of former LUF members has attacked a temporary storage facility for relief supplies in the western Estovakian city of Vistoc (ACES Chronicle, 2014 / 02.04)."
 ac_ecw.12.a:0 "The war leaves a long shadow."
 ac_ecw.13.t:0 "The LUF Collapses"
 ac_ecw.13.d:0 "The Lyes United Front's hold on the country has collapsed after a war that lasted longer than the historical record. The fighting is over.\n\nThis ending belongs to a provisional alternative route; the historical war ended on 29 October 2013."
 ac_ecw.13.a:0 "The war is over at last."
 ac_ecw.14.t:0 "A Negotiated Settlement in Estovakia"
 ac_ecw.14.d:0 "Estovakia's factions have signed a negotiated settlement, ending the civil war before it was decided on the battlefield.\n\nThis is an earned alternative to the historical record, in which General Lyes was killed and the war ended on 29 October 2013. It required an accommodating government, a negotiated course and outside support."
 ac_ecw.14.a:0 "Peace by agreement."
 ac_ecw.5.t:0 "Aid for the LUF's Reconstruction Programme"
 ac_ecw.5.d:0 "The ACES Chronicle records that Emmeria ended aid for the LUF's reconstruction programme because the LUF suppressed all opposition (2010 / 02.19).\n\nIf the cabinet has built a monitored, conditional aid policy, it may instead keep a narrow channel open under strict terms. That choice is a provisional alternative."
 ac_ecw.5.a:0 "End aid for the LUF's reconstruction programme."
 ac_ecw.5.b:0 "Continue aid under monitors and strict conditions."
 ac_ecw.6.t:0 "Reconstruction Aid to Estovakia"
 ac_ecw.6.d:0 "The ACES Chronicle records that Emmeria ended aid for Estovakia's reconstruction (2011 / 05.09).\n\nA cabinet that kept a monitored channel open may preserve a humanitarian line instead. That choice is a provisional alternative."
 ac_ecw.6.a:0 "End reconstruction aid to Estovakia."
 ac_ecw.6.b:0 "Keep a humanitarian channel open."
 EVA_ecw_negotiate:0 "Sign a Negotiated Settlement"
 EVA_ecw_negotiate_desc:0 "End the civil war by agreement before it is decided by force. Requires the negotiated-settlement course, an accommodating government, and either Emmerian conditional aid or strong Anean recovery (40 or more), with an Eastern Faction able to sign (strength 20 or more). Costs 50 political power. This is an earned alternative to the historical end in 2013."
 EVA_ecw_outcome_negotiated:0 "The war ended in a negotiated settlement, an alternative to the historical record."
 EVA_ecw_outcome_historical:0 "The war ended as the historical record describes: General Lyes was killed on 29 October 2013."
 EVA_ecw_outcome_late:0 "The war ended late, when the LUF's hold collapsed, in a provisional alternative route."
 EVA_ecw_outcome_none:0 "The civil war's outcome has not yet been recorded."
