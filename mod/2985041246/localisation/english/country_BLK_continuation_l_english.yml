l_english:
 belka_dlp_lost.1.t:0 "The Defeat of Belka"
 belka_dlp_lost.1.d:0 "The Belkan War has ended in defeat. Belka must now face the consequences."
 belka_dlp_lost.1.a:0 "Continue"
 belka_dlp_lost.2.t:0 "A Shattered Army"
 belka_dlp_lost.2.d:0 "The defeat has shattered Belka's army."
 belka_dlp_lost.2.a:0 "Continue"
 belka_dlp_lost.3.t:0 "A Shattered Industry"
 belka_dlp_lost.3.d:0 "The defeat has left Belka's industry in ruins."
 belka_dlp_lost.3.a:0 "Continue"
 belka_dlp_lost.4.t:0 "A Shattered Pride"
 belka_dlp_lost.4.d:0 "The defeat has damaged Belka's national pride."
 belka_dlp_lost.4.a:0 "Continue"
 belka_dlp_lost.5.t:0 "The End of the DLP"
 belka_dlp_lost.5.d:0 "The defeat has brought the DLP's rule to an end."
 belka_dlp_lost.5.a:0 "The party is finished."
 belka_dlp_lost.6.t:0 "New Elections"
 belka_dlp_lost.6.d:0 "Belka must hold new elections after the defeat."
 belka_dlp_lost.6.a:0 "Hold the elections."
 belka_dlp_lost.7.t:0 "The Return of the King"
 belka_dlp_lost.7.d:0 "The king returns to power."
 belka_dlp_lost.7.a:0 "Restore the monarchy."
