 ac_sq_eru_cast_adrien_valcourt:0 "Adrien Valcourt"
 ac_sq_eru_cast_adrien_valcourt_desc:0 "Maritime aviation pilot\n\nAdrien is comfortable navigating above an empty sea and uneasy with the certainty demanded in a crowded briefing room. He believes a professional can serve a country without agreeing with every explanation offered in its name. He has not yet discovered how often that belief will require him to speak."
 ac_sq_eru_cast_celine_marot:0 "Celine Marot"
 ac_sq_eru_cast_celine_marot_desc:0 "Wingman\n\nCeline is patient with frightened crews and impatient with elegant excuses. She trusts procedures because they make promises visible. When orders change faster than the procedures, she must decide whether loyalty means adapting quietly or demanding that somebody explain the change."
 ac_sq_eru_cast_bastien_roux:0 "Bastien Roux"
 ac_sq_eru_cast_bastien_roux_desc:0 "Maintenance chief\n\nBastien has spent enough years beside engines to distrust the word unlimited. He is proud of the squadron's skill and protective of the apprentices inheriting its habits. His most difficult repairs are often the relationships between people who believe the other person has stopped listening."
 ac_sq_eru_cast_lise_armand:0 "Lise Armand"
 ac_sq_eru_cast_lise_armand_desc:0 "Maritime surveillance controller\n\nLise's working day is full of contacts whose intentions are not visible on a screen. She insists that an uncertain identification remain uncertain until somebody has earned the right to change it. That insistence becomes harder when the people waiting for an answer already know which answer they want."
 ac_sq.301.t:0 "The Space Between Bearings"
 ac_sq.301.d_base:0 "Rain followed Adrien Valcourt into the operations room. Lise Armand had left a space in the patrol log where the visiting officer expected a contact's identity. 'A bearing,' she said, tapping the paper, 'is not a name.' Across the table Celine Marot rolled a pencil between two fingers. Their first watch together had ended without incident, yet everyone seemed to want a more impressive account. Bastien Roux arrived with four cups and a maintenance sheet already damp at its edges. He put the cups on the empty part of the chart. 'There. Now nobody can invent an island.' Adrien laughed before the officer did. The recorder was still running, and Lise waited to learn which part of that silence he would sign."
 ac_sq.301.a:0 "Leave the uncertainty in my account."
 ac_sq.301.a.reply:0 "Lise keeps the space open. Celine warns Adrien that the visitor expected the whole watch to sound more certain."
 ac_sq.301.b:0 "Give the visitor a cleaner summary."
 ac_sq.301.b.reply:0 "The visitor leaves satisfied; Celine appreciates avoiding another interrogation, while Lise preserves the original page privately."
 ac_sq.302.t:0 "A Cup Without a Handle"
 ac_sq.302.d_base:0 "Celine had finished the navigation exercise at the chart table eleven seconds before Adrien. She announced it in the mess with such solemnity that Bastien saluted her with a spoon. Adrien objected to her easier weather problem, her generous stopwatch, and finally her habit of winning. Then a steward set down a chipped cup that nobody else would take. Celine claimed it immediately. She said it had belonged to her first instructor, who had made nervous pupils drink from it before an assessment. 'If you can hold this without spilling anything, you can survive a debrief.' Adrien reached for the cup and discovered the missing handle was sharper than it looked. Outside, an engine wound down. For once there was no visitor waiting for an answer and no reason to hurry the conversation."
 ac_sq.302.a:0 "Ask about her first difficult landing."
 ac_sq.302.a.reply:0 "Celine tells the embarrassing version, then insists Adrien owes her an equally honest story."
 ac_sq.302.b:0 "Keep our competition on the board."
 ac_sq.302.b.reply:0 "She writes eleven seconds beside his name, leaving the cup between them untouched."
 ac_sq.303.t:0 "The Boat Below the Cloud"
 ac_sq.303.d_base_callback:0 "In the photograph the fishing boat looked almost toy-sized. Adrien could see a blue tarpaulin, a crooked aerial and something bright on the wheelhouse roof. Lise replayed its broken transmission. Someone on the recording kept repeating a number that could have been a registry, a heading or a plea. Celine thought she could make out a child beside the cabin; Adrien saw only glare in the print. Their disagreement hardened until Bastien placed a magnifying glass between them. 'Neither memory gets bigger if you speak louder.' The harbor office wanted a positive identification before it would stop making calls. Lise had found a civilian operator willing to ask the questions again, slowly. It would mean admitting that the confident description already circulated under Adrien's name had outrun what either of them could verify.\n\nLise opens the first watch's log beside the photograph. 'You left room for an unanswered question once. I kept the room.'"
 ac_sq.303.d_base:0 "In the photograph the fishing boat looked almost toy-sized. Adrien could see a blue tarpaulin, a crooked aerial and something bright on the wheelhouse roof. Lise replayed its broken transmission. Someone on the recording kept repeating a number that could have been a registry, a heading or a plea. Celine thought she could make out a child beside the cabin; Adrien saw only glare in the print. Their disagreement hardened until Bastien placed a magnifying glass between them. 'Neither memory gets bigger if you speak louder.' The harbor office wanted a positive identification before it would stop making calls. Lise had found a civilian operator willing to ask the questions again, slowly. It would mean admitting that the confident description already circulated under Adrien's name had outrun what either of them could verify."
 ac_sq.303.a:0 "Withdraw my confident identification."
 ac_sq.303.a.reply:0 "Celine joins the correction, and the next call begins with questions instead of accusations."
 ac_sq.303.b:0 "Keep the report; question the skipper privately."
 ac_sq.303.b.reply:0 "Celine joins the private questions, protecting the watch from a public reversal while Lise starts a record nobody requested."
 ac_sq.304.t:0 "The Name on the Panel"
 ac_sq.304.d_base:0 "Bastien found the unfastened inspection panel before the aircraft moved. Nothing had been lost except an afternoon, which made the shouting afterward sound especially cheap. An apprentice stood beside the tool cabinet while two supervisors discussed him as though he had already gone. Bastien had signed the release himself. He said that once, quietly, and nobody answered. Celine stood in the doorway holding the apprentice's abandoned lunch. Adrien recognized his own impatience in the morning's request to make the departure slot. The easiest explanation would fit a young worker who had not learned to argue. The harder one would include everybody who had taught him that speed was how people became useful. Bastien reached for a pen and asked Adrien to sit down."
 ac_sq.304.a:0 "Put my rushed request in the record."
 ac_sq.304.a.reply:0 "Bastien leaves space for both signatures; the apprentice finally looks up from the floor."
 ac_sq.304.b:0 "Let Bastien contain it inside maintenance."
 ac_sq.304.b.reply:0 "Bastien accepts responsibility inside the section, grateful for the protection even as the apprentice loses a chance to hear everyone answer."
 ac_sq.305.t:0 "A Photograph for the Wall"
 ac_sq.305.d_base_callback:0 "A framed photograph arrived from the harbor with a note thanking the watch for helping a disabled vessel reach an answer on the radio. The caption underneath called it a daring rescue. Adrien remembered repeating a frequency from the operations desk, keeping the line open and waiting for a civilian operator to confirm the handover. A civilian crew had done the towing. Celine liked the photograph anyway: four people on a wet deck, all laughing at something outside the frame. The station's public liaison wanted Adrien's signature across the corner. Lise offered to find the civilian crew's names first. Bastien was already looking for a hook on the mess wall. 'We could hang something good here,' he said, 'without hanging the wrong story underneath it.'\n\nCeline brings the damaged cup to the table. 'We managed the embarrassing versions before. The true one here is rather decent.'"
 ac_sq.305.d_base:0 "A framed photograph arrived from the harbor with a note thanking the watch for helping a disabled vessel reach an answer on the radio. The caption underneath called it a daring rescue. Adrien remembered repeating a frequency from the operations desk, keeping the line open and waiting for a civilian operator to confirm the handover. A civilian crew had done the towing. Celine liked the photograph anyway: four people on a wet deck, all laughing at something outside the frame. The station's public liaison wanted Adrien's signature across the corner. Lise offered to find the civilian crew's names first. Bastien was already looking for a hook on the mess wall. 'We could hang something good here,' he said, 'without hanging the wrong story underneath it.'"
 ac_sq.305.a:0 "Ask the civilian crew to sign first."
 ac_sq.305.a.reply:0 "The frame returns with crowded handwriting, and Bastien finds a hook strong enough for it."
 ac_sq.305.b:0 "Sign it as the station expects."
 ac_sq.305.b.reply:0 "The picture goes up quickly, though Lise keeps searching for the missing names."
 ac_sq.306.t:0 "The Borrowed Hour"
 ac_sq.306.d_base:0 "Celine asked Adrien to exchange the early watch. Her father had begun forgetting the way home, and a neighbor could stay only until noon. She delivered the request like a maintenance discrepancy, precise enough to conceal how much it cost her to ask. Adrien had promised Bastien that same morning to help an exhausted crew clear old discrepancies before another inspection. In the hangar, the apprentices had laid out the forms and saved him a chair. He could hear their laughter through the open door. Celine watched him look toward it. 'Tell me which promise is already spoken for,' she said. 'I can work with an answer. I cannot work with being grateful for something you intend to resent.'"
 ac_sq.306.a:0 "Take her watch and explain the delay."
 ac_sq.306.a.reply:0 "Bastien grumbles at the rearrangement, then moves the saved chair instead of putting it away."
 ac_sq.306.b:0 "Keep my promise to the ground crew."
 ac_sq.306.b.reply:0 "Celine finds another arrangement; she thanks him for answering plainly and leaves before lunch."
 ac_sq.307.t:0 "Where the Shoreline Ends"
 ac_sq.307.d_base:0 "The emergency exercise used a harbor chart covered with small paper squares. Families, fuel stores, patients, people who needed help down stairs: everything became the same size under the operations-room light. Lise's square for the civilian radio operator fell off whenever someone rolled the chart. An observer suggested removing it because the exercise was supposed to test aviation. Celine put it back with a strip of tape. Adrien had been assigned to explain how patrol crews would keep listening when ordinary arrangements broke down. He found himself staring at a penciled route that ended neatly at the edge of the sheet. Bastien asked who met the people there. Nobody had drawn that part. The observer checked his watch and asked to continue with the demonstration."
 ac_sq.307.a:0 "Stop and ask who receives the families."
 ac_sq.307.a.reply:0 "The demonstration runs late, and Lise obtains a name to write beyond the chart's edge."
 ac_sq.307.b:0 "Finish; ask Lise to repair it afterward."
 ac_sq.307.b.reply:0 "The observer praises the timing while Lise rolls up a chart she must complete alone."
 ac_sq.308.t:0 "The Hand That Shook"
 ac_sq.308.d_base_callback:0 "Celine's hand shook when she tried to lift the cup. A slip on a wet access step had left her wrist swollen, and she had spent the morning demonstrating that she could still fasten buckles with the other hand. Bastien had already taken her name off the departure board. Adrien expected an argument about flying. Instead she asked whether anybody had told the crew waiting for her. 'They will hear that I could not manage a step,' she said. He told her that would be a ridiculous judgment. 'Yes. People are often ridiculous when the person is absent.' Lise brought a chair without making a ceremony of it. The medical call was settled; the story their colleagues would tell about it was still being written.\n\nCeline remembers the earlier exchange. 'You do not owe me another favor. I need this one to be an ordinary arrangement.'"
 ac_sq.308.d_base:0 "Celine's hand shook when she tried to lift the cup. A slip on a wet access step had left her wrist swollen, and she had spent the morning demonstrating that she could still fasten buckles with the other hand. Bastien had already taken her name off the departure board. Adrien expected an argument about flying. Instead she asked whether anybody had told the crew waiting for her. 'They will hear that I could not manage a step,' she said. He told her that would be a ridiculous judgment. 'Yes. People are often ridiculous when the person is absent.' Lise brought a chair without making a ceremony of it. The medical call was settled; the story their colleagues would tell about it was still being written."
 ac_sq.308.a:0 "Let Celine explain her absence herself."
 ac_sq.308.a.reply:0 "She speaks to the crew from the chair, and the questions become practical rather than speculative."
 ac_sq.308.b:0 "Handle the explanation so she can rest."
 ac_sq.308.b.reply:0 "Her watch is covered efficiently, but she hears the account secondhand like everyone else."
 ac_sq.309.t:0 "From the Other Bridge"
 ac_sq.309.d_base:0 "A civilian master invited the patrol representatives aboard while his ship lay alongside. Celine wanted to see the view Adrien kept describing as unmistakable. From the bridge window, the breakwater hid half the approach. The master played back an instruction that had sounded calm in Lise's room and almost incomprehensible beside the ship's engine alarm. Nobody accused anyone. That made Adrien more uncomfortable than an accusation would have. A young officer offered him tea, then asked whether a patrol aircraft could always see a person waving from this deck. Adrien looked at the water before answering. Celine rested her healed hand on the rail. On the way back, she asked whether they should invite the master to their next listening exercise or keep the visit as a useful private lesson."
 ac_sq.309.a:0 "Let him hear our side of the radio."
 ac_sq.309.a.reply:0 "Lise reserves him a chair, warning Adrien that a guest is allowed to disagree aloud."
 ac_sq.309.b:0 "Use his lesson without exposing the room."
 ac_sq.309.b.reply:0 "Adrien changes his phrasing on the next practice call, but the master never hears why."
 ac_sq.310.t:0 "The People Still Waiting"
 ac_sq.310.d_base_callback:0 "The harbor waiting room smelled of wet coats and oranges. Months of warnings, changed arrangements and uncertain travel had taught its occupants to listen whenever a door opened. Adrien and Celine had come to settle a complaint about a missed radio message. They found a woman holding two tickets whose departure times had both been crossed out. She asked neither pilot for a guarantee; she asked which desk would still be there after dark. Adrien knew the aviation answer and none of the others. Lise, reached by telephone, could keep asking until she found someone, though her own watch was nearly over. Bastien arrived carrying a kettle borrowed from the station. He put it where waiting people could reach it, then looked at Adrien as though the next step ought to be equally plain.\n\nThe name written beyond the exercise chart is still in Lise's notebook. This time a person answers when she calls it."
 ac_sq.310.d_base:0 "The harbor waiting room smelled of wet coats and oranges. Months of warnings, changed arrangements and uncertain travel had taught its occupants to listen whenever a door opened. Adrien and Celine had come to settle a complaint about a missed radio message. They found a woman holding two tickets whose departure times had both been crossed out. She asked neither pilot for a guarantee; she asked which desk would still be there after dark. Adrien knew the aviation answer and none of the others. Lise, reached by telephone, could keep asking until she found someone, though her own watch was nearly over. Bastien arrived carrying a kettle borrowed from the station. He put it where waiting people could reach it, then looked at Adrien as though the next step ought to be equally plain."
 ac_sq.310.a:0 "Stay until a receiving person arrives."
 ac_sq.310.a.reply:0 "Celine takes the next call while Adrien learns the difference between a referral and a handover."
 ac_sq.310.b:0 "Leave our contact details and return to duty."
 ac_sq.310.b.reply:0 "The station gets its crew back on time; the woman folds their number inside the altered tickets."
 ac_sq.311.t:0 "An Answer Before the Tide"
 ac_sq.311.d_cap:0 "The captain's appeal reached Lise through a civilian contact who still remembered the watch's names. He was waiting outside a restricted passage, asking how to obtain help for a sick passenger. In their borrowed workroom, the four had neither the authority to change his instruction nor the means to promise an escort. They could still pass his full account to the operators who answered his route. Celine asked Adrien to include the medical request in the formal summary. Another intermediary suggested limiting it to confirmation that the ship had complied. Bastien looked at the telephone as though a person might become visible if they listened carefully enough. Their circumstances had changed. The temptation to tidy away an inconvenient voice had not."
 ac_sq.311.d_war:0 "The maritime restriction now carried the vocabulary of war. A merchant captain held outside the designated passage kept asking for a different instruction, his voice thinning between bursts of interference. Celine heard him mention a sick passenger; another listener heard a pretext. Lise marked both interpretations separately and asked for a medical contact. The watch had no authority to cancel a blockade instruction or promise safe passage. Adrien could, however, ensure that the captain's request traveled with the compliance report instead of disappearing beneath it. Bastien stood in the doorway, jacket over one arm. 'Whatever happens to his ship,' he said, 'let nobody say that he never asked us.' The next transmission began before Adrien had finished his first sentence."
 ac_sq.311.d_base:0 "A merchant captain had been told to wait outside a restricted working channel. From Lise's desk his repeated requests sounded impatient; on the recording Celine heard a man trying to describe a sick passenger without announcing it to everyone listening. The restriction was real, and the watch could not cancel it. What it could do was pass a clearly marked request to the people empowered to answer. Adrien's draft said the ship had complied. Celine asked whether that sentence included the hours before compliance, or the person still waiting for medical advice. Bastien listened from the doorway, jacket over one arm. 'You can obey an instruction,' he said, 'and still tell someone what obeying it is costing.'"
 ac_sq.311.a:0 "Attach the captain's full request."
 ac_sq.311.a.reply:0 "Lise sends the appeal with Adrien's name attached, giving the next desk something it must answer."
 ac_sq.311.b:0 "Record compliance; keep the appeal off the net."
 ac_sq.311.b.reply:0 "The watch avoids a contentious attachment. Celine asks Adrien to ensure the private appeal does not disappear afterward."
 ac_sq.312.t:0 "The Apprentice's Signature"
 ac_sq.312.d_project_unavailable_callback:0 "The apprentice from the loose-panel incident was now trusted to brief a shift. He came to Adrien with a request so carefully phrased that it sounded memorized. A supervisor had suggested removing the old incident from the training example; people were beginning to mistake it for evidence that the maintenance section needed watching. The young man did not ask Adrien to lie. He asked whether doing well for seven years ought to count for something. Bastien, within hearing, kept cleaning a tool that was already clean. Celine asked the former apprentice which version he used when teaching someone new. 'The one where a person can stop the departure,' he answered. Adrien realized the young man had not come for permission to forget. He had come to find out whether the others had.\n\nThe latest bulletin confirmed that Stonehenge had been destroyed. Lise crossed the site's old operating assumptions out of the route folder rather than altering the record of what had been ordered earlier. Adrien wanted the corrected sheet sent to every receiving desk. A squadron could revise its own instructions; it could not restore a strategic installation by keeping its name on a form.\n\nThe training copy still carries Adrien's signature beside Bastien's. The young supervisor has never covered either one."
 ac_sq.312.d_project_unavailable:0 "The apprentice from the loose-panel incident was now trusted to brief a shift. He came to Adrien with a request so carefully phrased that it sounded memorized. A supervisor had suggested removing the old incident from the training example; people were beginning to mistake it for evidence that the maintenance section needed watching. The young man did not ask Adrien to lie. He asked whether doing well for seven years ought to count for something. Bastien, within hearing, kept cleaning a tool that was already clean. Celine asked the former apprentice which version he used when teaching someone new. 'The one where a person can stop the departure,' he answered. Adrien realized the young man had not come for permission to forget. He had come to find out whether the others had.\n\nThe latest bulletin confirmed that Stonehenge had been destroyed. Lise crossed the site's old operating assumptions out of the route folder rather than altering the record of what had been ordered earlier. Adrien wanted the corrected sheet sent to every receiving desk. A squadron could revise its own instructions; it could not restore a strategic installation by keeping its name on a form."
 ac_sq.312.d_base_callback:0 "The apprentice from the loose-panel incident was now trusted to brief a shift. He came to Adrien with a request so carefully phrased that it sounded memorized. A supervisor had suggested removing the old incident from the training example; people were beginning to mistake it for evidence that the maintenance section needed watching. The young man did not ask Adrien to lie. He asked whether doing well for seven years ought to count for something. Bastien, within hearing, kept cleaning a tool that was already clean. Celine asked the former apprentice which version he used when teaching someone new. 'The one where a person can stop the departure,' he answered. Adrien realized the young man had not come for permission to forget. He had come to find out whether the others had.\n\nThe training copy still carries Adrien's signature beside Bastien's. The young supervisor has never covered either one."
 ac_sq.312.d_base:0 "The apprentice from the loose-panel incident was now trusted to brief a shift. He came to Adrien with a request so carefully phrased that it sounded memorized. A supervisor had suggested removing the old incident from the training example; people were beginning to mistake it for evidence that the maintenance section needed watching. The young man did not ask Adrien to lie. He asked whether doing well for seven years ought to count for something. Bastien, within hearing, kept cleaning a tool that was already clean. Celine asked the former apprentice which version he used when teaching someone new. 'The one where a person can stop the departure,' he answered. Adrien realized the young man had not come for permission to forget. He had come to find out whether the others had."
 ac_sq.312.a:0 "Keep the example, with his later record."
 ac_sq.312.a.reply:0 "He adds the years of good work himself, making the lesson about recovery as well as error."
 ac_sq.312.b:0 "Remove it from public training copies."
 ac_sq.312.b.reply:0 "Bastien accepts the instruction, then saves his own copy in the same drawer as before."
 ac_sq.313.t:0 "Four Places at Supper"
 ac_sq.313.d_base:0 "Bastien returned from his wife's funeral with a bag of food the neighbors had refused to let him leave behind. Her illness had lasted long enough for everyone to prepare sentences and not long enough for any sentence to help. He set four plates on the mess table, then fetched a fifth before noticing. Celine looked away. Adrien nearly offered to call the duty officer and remove Bastien from the roster. Lise asked instead whether he wanted somebody to eat with him. Bastien said he could still do his work. 'I know,' she answered. He sat down very slowly. The extra plate remained on the table, and Adrien found himself frightened of moving it, as though the wrong small kindness might take away the last thing Bastien had chosen for himself."
 ac_sq.313.a:0 "Ask what he wants this evening."
 ac_sq.313.a.reply:0 "Bastien asks for company without questions; Adrien sits until the room no longer feels supervised."
 ac_sq.313.b:0 "Arrange leave and a quieter room."
 ac_sq.313.b.reply:0 "The arrangements are considerate, but Bastien learns about them before anyone asks him to stay."
 ac_sq.314.t:0 "Two Voices on One Recording"
 ac_sq.314.d_base_callback:0 "The complaint named Lise. A clipped recording made her instruction sound like permission to ignore a vessel's explanation. Celine had heard the longer exchange and wanted to challenge the clip immediately. Lise wanted a night to reconstruct the sequence without friends speaking on her behalf. Adrien stood between two women who had spent years teaching him to listen, suddenly tempted to settle their disagreement by choosing the louder certainty. Bastien took the cassette from the machine and turned it over. The unplayed side held routine acknowledgments, weather and several long pauses. 'It sounds different when nobody cuts out the waiting,' he said. Celine folded her arms. Lise asked Adrien whether he could bear to have the full recording include the moment she had sounded frightened.\n\nThe captain's earlier unabridged appeal gives Lise a second timestamp. Adrien's awkward attachment has become a useful witness."
 ac_sq.314.d_base:0 "The complaint named Lise. A clipped recording made her instruction sound like permission to ignore a vessel's explanation. Celine had heard the longer exchange and wanted to challenge the clip immediately. Lise wanted a night to reconstruct the sequence without friends speaking on her behalf. Adrien stood between two women who had spent years teaching him to listen, suddenly tempted to settle their disagreement by choosing the louder certainty. Bastien took the cassette from the machine and turned it over. The unplayed side held routine acknowledgments, weather and several long pauses. 'It sounds different when nobody cuts out the waiting,' he said. Celine folded her arms. Lise asked Adrien whether he could bear to have the full recording include the moment she had sounded frightened."
 ac_sq.314.a:0 "Preserve the full exchange, including her fear."
 ac_sq.314.a.reply:0 "Celine stops preparing a defense and helps Lise build an account they can all stand beside."
 ac_sq.314.b:0 "Offer a statement defending Lise's intentions."
 ac_sq.314.b.reply:0 "Lise thanks him, but asks him to distinguish what he heard from what he hopes is true."
 ac_sq.315.t:0 "The Closed Folder"
 ac_sq.315.d_coalition_contact:0 "Adrien was asked to nominate one person to explain the watch's disputed records. The request arrived in a plain folder with a space for a name and an assurance that cooperation would be remembered. Celine read it twice before setting it down. Bastien said a crew could produce a joint account; the liaison had specifically asked for an individual. Lise offered her own name with the briskness she used for unpleasant weather. It would simplify things. Adrien remembered how often simplicity had meant that someone else waited outside the room. Nobody was asking him to invent an answer, only to decide which person would be made to carry it. The folder lay beside the old harbor photograph, just large enough to hide its modest caption.\n\nTheir government's alliance with Central Usea had made a counterpart available across a table that earlier plans treated as a dividing line. Celine brought the disputed tapes, not a congratulatory speech. Lise asked both offices to record the same uncertainties. Friendship would be more useful if it could survive an account that neither party had edited for the other."
 ac_sq.315.d_base:0 "Adrien was asked to nominate one person to explain the watch's disputed records. The request arrived in a plain folder with a space for a name and an assurance that cooperation would be remembered. Celine read it twice before setting it down. Bastien said a crew could produce a joint account; the liaison had specifically asked for an individual. Lise offered her own name with the briskness she used for unpleasant weather. It would simplify things. Adrien remembered how often simplicity had meant that someone else waited outside the room. Nobody was asking him to invent an answer, only to decide which person would be made to carry it. The folder lay beside the old harbor photograph, just large enough to hide its modest caption."
 ac_sq.315.a:0 "Submit our account under my own name."
 ac_sq.315.a.reply:0 "Lise asks why her own offer was not enough; Celine insists Adrien read every attachment before putting their account under his name."
 ac_sq.315.b:0 "Accept Lise's offer to represent the watch."
 ac_sq.315.b.reply:0 "Lise thanks Adrien for respecting her offer, and Bastien begins arranging how the others can support their chosen representative."
 ac_sq.316.t:0 "Rain on the Return"
 ac_sq.316.d_cap_callback:0 "Celine arrived at the borrowed workroom carrying copies of records collected through their remaining civilian contacts. Her journey had taken longer than planned, and Adrien had spent the missing hours asking Lise whether another call would be possible. Now that she stood safely beside the heater, he kept demanding details of every delay. She distinguished what she knew from what she had merely been told. At last she put the damp folder down. 'Are we checking the account,' she asked, 'or finding somewhere to put your fear?' Bastien left dry gloves beside her. There was no flight to debrief and no familiar authority to appeal to, only a friend who had come back and another friend still afraid to say why it mattered.\n\nCeline repeats the civilian master's warning about voices under strain. Adrien recognizes his own clipped instructions in it this time."
 ac_sq.316.d_cap:0 "Celine arrived at the borrowed workroom carrying copies of records collected through their remaining civilian contacts. Her journey had taken longer than planned, and Adrien had spent the missing hours asking Lise whether another call would be possible. Now that she stood safely beside the heater, he kept demanding details of every delay. She distinguished what she knew from what she had merely been told. At last she put the damp folder down. 'Are we checking the account,' she asked, 'or finding somewhere to put your fear?' Bastien left dry gloves beside her. There was no flight to debrief and no familiar authority to appeal to, only a friend who had come back and another friend still afraid to say why it mattered."
 ac_sq.316.d_war_callback:0 "The weather closed behind Celine before Lise could finish reading the revised clearance. Adrien heard the report from the coast, then a sharp breath and an instruction repeated without a reply. Celine's next transmission came through broken by static: she had sight of the breakwater, an unreliable instrument and no intention of chasing an identification into the cloud. Lise found a route that kept her clear of the ships. The room followed each call across a wet chart until the aircraft appeared beyond the harbor lights, too low for anyone watching to mistake the difficulty of its arrival. Afterward, Adrien kept asking for one more detail, as though a complete account could remove the minutes when nobody knew whether she would answer again. 'You are allowed to have been afraid,' Celine told him. 'You are not allowed to turn it into a fault in my report.' Bastien left dry gloves by the heater. Adrien had to decide whether to finish the debrief or finally speak as her friend.\n\nCeline repeats the civilian master's warning about voices under strain. Adrien recognizes his own clipped instructions in it this time."
 ac_sq.316.d_war:0 "The weather closed behind Celine before Lise could finish reading the revised clearance. Adrien heard the report from the coast, then a sharp breath and an instruction repeated without a reply. Celine's next transmission came through broken by static: she had sight of the breakwater, an unreliable instrument and no intention of chasing an identification into the cloud. Lise found a route that kept her clear of the ships. The room followed each call across a wet chart until the aircraft appeared beyond the harbor lights, too low for anyone watching to mistake the difficulty of its arrival. Afterward, Adrien kept asking for one more detail, as though a complete account could remove the minutes when nobody knew whether she would answer again. 'You are allowed to have been afraid,' Celine told him. 'You are not allowed to turn it into a fault in my report.' Bastien left dry gloves by the heater. Adrien had to decide whether to finish the debrief or finally speak as her friend."
 ac_sq.316.d_base_callback:0 "The weather put Celine's return on everyone's mind long before the telephone rang. Her account, delivered afterward beside the drying-room heater, contained no miracle: a diversion considered early, an instruction repeated, a receiving team willing to wait. Adrien kept interrupting with questions she mistook for criticism. At last she asked him whether he was checking her journey or trying to make the hours of worry disappear. Lise looked down at her notes. Bastien laid a dry pair of gloves on the radiator without offering them. Adrien had practiced professional concern for years. In the heat of the small room, with Celine safe and irritated in front of him, it began to look uncomfortably like a way of avoiding the words he actually needed.\n\nCeline repeats the civilian master's warning about voices under strain. Adrien recognizes his own clipped instructions in it this time."
 ac_sq.316.d_base:0 "The weather put Celine's return on everyone's mind long before the telephone rang. Her account, delivered afterward beside the drying-room heater, contained no miracle: a diversion considered early, an instruction repeated, a receiving team willing to wait. Adrien kept interrupting with questions she mistook for criticism. At last she asked him whether he was checking her journey or trying to make the hours of worry disappear. Lise looked down at her notes. Bastien laid a dry pair of gloves on the radiator without offering them. Adrien had practiced professional concern for years. In the heat of the small room, with Celine safe and irritated in front of him, it began to look uncomfortably like a way of avoiding the words he actually needed."
 ac_sq.316.a:0 "Tell her I was afraid for her."
 ac_sq.316.a.reply:0 "She hands him the damp gloves and asks him to sit down before asking anything else."
 ac_sq.316.b:0 "Finish the account before speaking personally."
 ac_sq.316.b.reply:0 "They obtain a careful record, but Celine leaves the room before the other conversation starts."
 ac_sq.317.t:0 "What the New Crew Heard"
 ac_sq.317.d_base:0 "The new trainees knew Adrien through a story he did not remember telling. In their version the fishing boat had concealed a threat, the weather had been worse, and an instinctive maneuver had settled everything. They were disappointed when Lise asked which part of the recording supported that account. One of them said it was only a story meant to give people confidence. Bastien sat at the back with the former apprentice, both suddenly very still. Celine watched Adrien with the expression she once wore over the stopwatch. There was a chance here to be admired without another uncomfortable conversation. There was also a chance to teach a room of young people that being uncertain had never prevented him from doing useful work above the sea."
 ac_sq.317.a:0 "Tell them how little I could see."
 ac_sq.317.a.reply:0 "A trainee asks the first honest question of the afternoon, and Lise rewinds the recording."
 ac_sq.317.b:0 "Let the useful legend stand."
 ac_sq.317.b.reply:0 "The room warms to him; afterward Bastien asks which lesson the next apprentice will inherit."
 ac_sq.318.t:0 "The Missing Names"
 ac_sq.318.d_base_callback:0 "One of the civilian sailors in the old photograph came looking for a copy. He had been younger when it was taken and remembered the tow differently from the station caption. Adrien expected anger. The sailor wanted the picture for a crewmate too ill to travel, and spent most of the visit asking whether Bastien still made the dreadful coffee. Lise found the negative in a sleeve with several names penciled on the back. One had never reached the frame. Celine suggested a new caption, but the sailor said the old one had been on the wall so long that he would be sorry to lose the marks around it. Adrien understood the difficulty: correcting a story could also disturb the little place people had made inside it.\n\nBastien asks the visitor to eat before leaving, using the unceremonious invitation that once helped him remain in the room."
 ac_sq.318.d_base:0 "One of the civilian sailors in the old photograph came looking for a copy. He had been younger when it was taken and remembered the tow differently from the station caption. Adrien expected anger. The sailor wanted the picture for a crewmate too ill to travel, and spent most of the visit asking whether Bastien still made the dreadful coffee. Lise found the negative in a sleeve with several names penciled on the back. One had never reached the frame. Celine suggested a new caption, but the sailor said the old one had been on the wall so long that he would be sorry to lose the marks around it. Adrien understood the difficulty: correcting a story could also disturb the little place people had made inside it."
 ac_sq.318.a:0 "Add the missing name beside the old caption."
 ac_sq.318.a.reply:0 "The sailor writes it himself, and the frame gains another small mark worth keeping."
 ac_sq.318.b:0 "Give him a corrected private copy."
 ac_sq.318.b.reply:0 "He leaves with a useful gift, while the familiar public account remains easy to recognize."
 ac_sq.319.t:0 "A Recommendation in Pencil"
 ac_sq.319.d_base:0 "Celine had been offered instructional work away from Adrien's daily watch. Her application required a recommendation, and she had left the form on his desk with the pencil they once used for navigation times. He wrote that she was dependable, precise and calm under pressure. Then he crossed out calm. It was true often enough, but it left out the woman who had argued in waiting rooms and returned from a frightening watch too angry to accept his evasions. Lise said the application would survive a sentence about judgment. Bastien asked whether Adrien was recommending a colleague or trying to keep her where he could see her. Celine returned before he answered, read the crossed-out word and smiled without making the choice easier."
 ac_sq.319.a:0 "Recommend the colleague who challenges me."
 ac_sq.319.a.reply:0 "Celine reads the finished page twice, then promises to make the trainees just as troublesome."
 ac_sq.319.b:0 "Ask her to remain for another rotation."
 ac_sq.319.b.reply:0 "She agrees to discuss it, but leaves the unsigned form where neither can pretend to miss it."
 ac_sq.320.t:0 "A Place for the Next Voice"
 ac_sq.320.d_cap_callback:0 "The four met in a borrowed room to hand their remaining records to younger volunteers. Lise played a practice call whose long pauses made the listeners wonder whether anything would happen. Bastien laughed at the familiar impatience. Celine set the damaged cup beside the machine; someone had finally smoothed its sharp edge. Neither the recording nor their gathering gave them back the old airfield, authority over the harbor or a settled future for their country. Adrien nevertheless recognized a useful thing within their reach. A young listener wanted to know what made an answer worth trusting. He looked at the carried photograph and the spare chair. Their names would not remain on the same roster, but the next person could inherit more than their silences.\n\nThe late addition to the photograph has faded faster than the printed caption. Celine traces it again before handing the pencil to the trainee."
 ac_sq.320.d_cap:0 "The four met in a borrowed room to hand their remaining records to younger volunteers. Lise played a practice call whose long pauses made the listeners wonder whether anything would happen. Bastien laughed at the familiar impatience. Celine set the damaged cup beside the machine; someone had finally smoothed its sharp edge. Neither the recording nor their gathering gave them back the old airfield, authority over the harbor or a settled future for their country. Adrien nevertheless recognized a useful thing within their reach. A young listener wanted to know what made an answer worth trusting. He looked at the carried photograph and the spare chair. Their names would not remain on the same roster, but the next person could inherit more than their silences."
 ac_sq.320.d_base_callback:0 "On the last morning of the watch's shared roster, Lise played a practice call for a new controller. It was almost entirely silence: a request, a pause, another request phrased more patiently. The trainee asked whether the recording had a conclusion. Bastien laughed. Celine set the damaged cup beside the machine, and Adrien noticed that someone had sanded its sharp edge smooth. Their papers were ready for different desks, whatever happened to the duties around them. The young controller still wanted to know what counted as a successful answer. Adrien looked at the harbor photograph, the penciled names and the chair left clear beside Lise. He could leave a rule, a reassuring story or an invitation to ask again. For the first time, all three possibilities sounded like something a person might remember.\n\nThe late addition to the photograph has faded faster than the printed caption. Celine traces it again before handing the pencil to the trainee."
 ac_sq.320.d_base:0 "On the last morning of the watch's shared roster, Lise played a practice call for a new controller. It was almost entirely silence: a request, a pause, another request phrased more patiently. The trainee asked whether the recording had a conclusion. Bastien laughed. Celine set the damaged cup beside the machine, and Adrien noticed that someone had sanded its sharp edge smooth. Their papers were ready for different desks, whatever happened to the duties around them. The young controller still wanted to know what counted as a successful answer. Adrien looked at the harbor photograph, the penciled names and the chair left clear beside Lise. He could leave a rule, a reassuring story or an invitation to ask again. For the first time, all three possibilities sounded like something a person might remember."
 ac_sq.320.a:0 "Leave room for someone to answer back."
 ac_sq.320.a.reply:0 "Lise gives the trainee the empty chair, and the next recording begins with a question."
 ac_sq.320.b:0 "Leave the account we can all recognize."
 ac_sq.320.b.reply:0 "Bastien carries the familiar photograph to its next wall; nobody asks which memories travel with it."
 ac_sq.350.t:0 "Adrien Valcourt | Maritime aviation pilot"
 ac_sq.350.d:0 "Adrien is comfortable navigating above an empty sea and uneasy with the certainty demanded in a crowded briefing room. He believes a professional can serve a country without agreeing with every explanation offered in its name. He has not yet discovered how often that belief will require him to speak."
 ac_sq.351.t:0 "Celine Marot | Wingman"
 ac_sq.351.d:0 "Celine is patient with frightened crews and impatient with elegant excuses. She trusts procedures because they make promises visible. When orders change faster than the procedures, she must decide whether loyalty means adapting quietly or demanding that somebody explain the change."
 ac_sq.352.t:0 "Bastien Roux | Maintenance chief"
 ac_sq.352.d:0 "Bastien has spent enough years beside engines to distrust the word unlimited. He is proud of the squadron's skill and protective of the apprentices inheriting its habits. His most difficult repairs are often the relationships between people who believe the other person has stopped listening."
 ac_sq.353.t:0 "Lise Armand | Maritime surveillance controller"
 ac_sq.353.d:0 "Lise's working day is full of contacts whose intentions are not visible on a screen. She insists that an uncertain identification remain uncertain until somebody has earned the right to change it. That insistence becomes harder when the people waiting for an answer already know which answer they want."
 ac_sq.390.t:0 "The People on the Other End"
 ac_sq.390.d:0 "Adrien receives Celine's first letter from her instructional posting folded around a trainee's question. She has written no introduction. After all these years she trusts him to recognize an invitation to disagree. Lise keeps the old recordings in order, including the pauses, and Bastien still reserves a chair for somebody who has come to ask an awkward favor. The four do not remember every watch the same way. They have learned to leave their differences where another person can examine them. Nothing in that habit decides the fate of a country or returns a ship already gone. It does mean that a frightened voice is less likely to disappear inside their next confident account. When Adrien answers the trainee, he starts with the part he could not see. Then he names the people who helped him understand it. Celine's reply arrives a week later: she has found a cup even uglier than theirs. He owes her another visit."
 ac_sq.391.t:0 "A Frame That Still Holds"
 ac_sq.391.d:0 "The photograph survives every rearrangement. Bastien knows which bracket to use, Celine knows how to keep it level, and Lise knows where the original caption is stored. Adrien can still make the others laugh by repeating an old objection to Celine's stopwatch. There is affection here, and useful work, and a careful knowledge of which subjects make the room fall quiet. Some requests were carried farther than regulations required. Others were kept private until the people who needed an answer stopped asking. Their correspondence remains friendly, although Lise sends copies when she once might have sent an unguarded note. One afternoon a new clerk asks whose name belongs in the small space beneath the frame. Adrien reaches for a pen, then waits to see who else has heard. The wait is familiar. It also leaves time, if he wants it, to do one small thing more honestly than before."
 ac_sq.392.t:0 "Separate Copies"
 ac_sq.392.d:0 "At the end of their shared roster there are several accounts of the same watch. Lise keeps the recordings. Bastien keeps the repair sheets. Celine keeps a recommendation with a word crossed out in pencil. Adrien discovers that knowing where all these things are kept is different from being welcome to ask for them. They have not become enemies. If a colleague needs help, a telephone still gets answered, although the conversation turns practical sooner than it used to. The empty space between them contains promises made in somebody else's name and questions that were set aside until they sounded like accusations. No grand verdict arrives to arrange those memories for them. Bastien eventually sends Adrien a photograph of the chipped cup, its dangerous edge carefully smoothed. There is no message with it. Adrien places it on his desk instead of in a drawer. A repair can begin without pretending the break was small."
 ac_sq_sns:0 "Empty Frequency"
 ac_sq_sns_desc:0 "SQUADRON DISPATCHES\nChapter position (read or archived): [?ac_sq_chapter]/20\nCrew cohesion: [?ac_sq_cohesion|0]/100\nCredibility: [?ac_sq_credibility|0]/100\n\nPeople remember the promises made here. These dispatches accompany the national campaign."
