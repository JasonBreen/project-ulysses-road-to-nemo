name: Static validation

on:
  push:
  pull_request:

jobs:
  map-validation:
    runs-on: windows-latest
    steps:
      - name: Check out private project
        uses: actions/checkout@v4
      - name: Set up offline contract test runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check briefing artwork and original layout
        run: python tools/frontend_briefing/validate.py
      - name: Check map font and display branding
        run: python tools/frontend_typography/validate.py
      - name: Check faction lifecycle and DLC fallback contracts
        run: python -B tools/Test-UlyssesFactions.py
      - name: Run static regression checks
        shell: pwsh
        run: .\tools\Test-UlyssesStatic.ps1 -ModRoot .\mod\2985041246
