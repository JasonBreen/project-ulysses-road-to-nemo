l_english:
 ALR_communism:0 "Albard"
 ALR_communism_DEF:0 "Albard"
 ALR_neutrality:0 "Albard"
 ALR_neutrality_DEF:0 "Albard"
 ALR_ud_albard_after_the_war:0 "Albard After the War"
 ALR_ud_albard_after_the_war_desc:0 "The war is over. Albard's harbours are full, its order books are long and its neighbours are poorer than ever. The country must decide what a rich neighbour owes."
 ALR_ud_apprentice_halls:0 "The Apprentice Halls"
 ALR_ud_apprentice_halls_desc:0 "Every yard and mill will train apprentices in a common hall, so that a welder trained in Zapland can work in Payton without starting again."
 ALR_ud_armed_harbour:0 "Armed Neutrality in the Roads"
 ALR_ud_armed_harbour_desc:0 "No warship of any side will use Albard's harbours. Patrol craft and new batteries will enforce the rule from the Payton roads to the Zapland shore."
 ALR_ud_armed_harbour_spirit:0 "Armed Neutrality in the Roads"
 ALR_ud_armed_harbour_spirit_desc:0 "No warship of any side uses Albard's harbours, and the batteries make sure of it."
 ALR_ud_arms_embargo_spirit:0 "The Arms Embargo"
 ALR_ud_arms_embargo_spirit_desc:0 "Albard's arsenals sell to Albard alone."
 ALR_ud_arms_exports_spirit:0 "Licensed Arms Exports"
 ALR_ud_arms_exports_spirit_desc:0 "The valley arsenals sell openly to recognised governments under published licences."
 ALR_ud_arms_ledger:0 "The Arms Ledger"
 ALR_ud_arms_ledger_desc:0 "The Yinshi Valley arsenals sell rifles and shells to whoever pays. The government must decide whether that is a business, a policy, or a danger."
 ALR_ud_arms_ledger_tt:0 "Opens the arms export question. No equipment is transferred to any country by this tree."
 ALR_ud_averted_dividend:0 "The Peace Dividend of the Yards"
 ALR_ud_averted_dividend_desc:0 "The continental crisis has been averted. The yards can return to building cargo hulls, and the money held back for war can go to the mill towns instead."
 ALR_ud_blast_furnace_renewal:0 "Renew the Blast Furnaces"
 ALR_ud_blast_furnace_renewal_desc:0 "Half the furnaces around the Payton harbour were lit before most of their crews were born. Relining them will cost a season of output and save a decade of breakdowns."
 ALR_ud_board_charter:0 "The Board's Charter"
 ALR_ud_board_charter_desc:0 "The board publishes a short charter: ministries become departments, ministers become managers, and every department reports quarterly against a plan."
 ALR_ud_board_charter_spirit:0 "The Board's Charter"
 ALR_ud_board_charter_spirit_desc:0 "Ministries are departments and ministers are managers, reporting quarterly against a plan."
 ALR_ud_board_mandate:0 "The Board's Standing Mandate"
 ALR_ud_board_mandate_desc:0 "The board's temporary authority becomes permanent. Albard is governed as a company is governed: by results, by accounts, and by those who own the most shares."
 ALR_ud_board_mandate_spirit:0 "The Board's Standing Mandate"
 ALR_ud_board_mandate_spirit_desc:0 "Albard is governed as a company: by results, by accounts and by its largest shareholders."
 ALR_ud_charter_assembly:0 "The Charter Assembly"
 ALR_ud_charter_assembly_desc:0 "An assembly elected on a broad franchise sits in Payton to write the charter, clause by clause and in public."
 ALR_ud_charter_assembly_spirit:0 "The Charter Assembly"
 ALR_ud_charter_assembly_spirit_desc:0 "An elected assembly writes Albard's charter clause by clause, in public."
 ALR_ud_charter_office:0 "Charter Cabinet"
 ALR_ud_charter_office_desc:0 "A cabinet answerable to the charter assembly governs the Charter Republic until its first ballot. It is an office, not a person; its members are not named in this provisional path."
 ALR_ud_charter_ratified:0 "The Charter Ratified"
 ALR_ud_charter_ratified_desc:0 "The finished charter goes to a national vote and passes. Albard is a republic of written rights, and its next government will be chosen at the ballot box."
 ALR_ud_charter_republic:0 "The Charter Republic"
 ALR_ud_charter_republic_desc:0 "Harbour lawyers and provincial notables propose a republic of written rights and contested elections, in which no house and no union governs by right."
 ALR_ud_commonwealth_charter:0 "The Commonwealth Charter"
 ALR_ud_commonwealth_charter_desc:0 "The charter guarantees the unions' place in government and the owners' right to their property, provided that property is used and its workers are paid."
 ALR_ud_commonwealth_charter_spirit:0 "The Commonwealth Charter"
 ALR_ud_commonwealth_charter_spirit_desc:0 "The unions hold a guaranteed place in government; property is protected so long as it is used and its workers paid."
 ALR_ud_commonwealth_congress:0 "The Commonwealth Congress"
 ALR_ud_commonwealth_congress_desc:0 "Delegates of every union and cooperative meet in Payton to confirm the Commonwealth's constitution and elect its first full labour council."
 ALR_ud_commonwealth_congress_spirit:0 "The Commonwealth Congress"
 ALR_ud_commonwealth_congress_spirit_desc:0 "A full labour council governs under the constitution confirmed by every union and cooperative."
 ALR_ud_commonwealth_office:0 "Commonwealth Labour Council"
 ALR_ud_commonwealth_office_desc:0 "The elected council of the mill and yard unions governs the Labour Commonwealth. It is an office, not a person; its members are not named in this provisional path."
 ALR_ud_council_transit_rules:0 "Council Transit Rules"
 ALR_ud_council_transit_rules_desc:0 "Albard's delegates will draft the council's rules for freight crossing member borders, written by people who actually ship steel for a living."
 ALR_ud_coup_harbour_watch:0 "Harbour Watch After the Coup"
 ALR_ud_coup_harbour_watch_desc:0 "Coup attempts have broken out across Usea. Albard's patrol craft will stop and search any armed vessel entering its waters, whatever flag it flies."
 ALR_ud_double_shifts_spirit:0 "Double Shifts"
 ALR_ud_double_shifts_spirit_desc:0 "The yards work around the clock on repair and cargo orders."
 ALR_ud_drydock_compact:0 "The Drydock Compact"
 ALR_ud_drydock_compact_desc:0 "The three yards will share their drydocks under one booking office, so that no damaged ship waits a month for a berth while another dock stands empty."
 ALR_ud_escort_programme:0 "The Escort Programme"
 ALR_ud_escort_programme_desc:0 "A class of small, fast escorts will be designed in Payton and built in all three yards to the same drawings, with the same guns and the same spares."
 ALR_ud_evacuation_fleet:0 "An Evacuation Fleet"
 ALR_ud_evacuation_fleet_desc:0 "The yards will hold a fleet of hulls ready to carry the coastal towns inland by river and along the shore, should the warning turn into a strike."
 ALR_ud_evacuation_fleet_spirit:0 "The Evacuation Fleet"
 ALR_ud_evacuation_fleet_spirit_desc:0 "A reserve of hulls stands ready to carry the coastal towns to safety."
 ALR_ud_export_embargo:0 "An Arms Embargo"
 ALR_ud_export_embargo_desc:0 "The arsenals will sell to Albard's own forces and no one else. A small country that arms its neighbours may one day meet its own shells coming back."
 ALR_ud_furnace_dividends:0 "Furnace Dividends"
 ALR_ud_furnace_dividends_desc:0 "The board will reinvest the furnace dividends in the peninsula's ore wharves, so that more steel is made from Albardi ore on Albardi ground."
 ALR_ud_harbour_batteries:0 "Batteries for the Harbour"
 ALR_ud_harbour_batteries_desc:0 "What the arsenals no longer sell they can mount at home: anti-aircraft guns around the Payton harbour and a radar post on the peninsula."
 ALR_ud_harbour_courts:0 "Courts for the Harbour"
 ALR_ud_harbour_courts_desc:0 "Commercial courts independent of the shipping houses will settle disputes over cargoes, contracts and wages under one published code."
 ALR_ud_harbour_ledger:0 "Albard's Ledger of Steel"
 ALR_ud_harbour_ledger_desc:0 "Albard is the richest of the small Usean states, and almost nobody outside its boardrooms knows exactly how rich. The new government will open the ledgers before it decides anything."
 ALR_ud_harbour_quarantine:0 "Harbour Quarantine"
 ALR_ud_harbour_quarantine_desc:0 "Arriving ships will anchor in the roads until their passengers are examined, registered and assigned. Albard will help, but it will help in order."
 ALR_ud_harbour_quarantine_spirit:0 "Harbour Quarantine"
 ALR_ud_harbour_quarantine_spirit_desc:0 "Arriving ships anchor in the roads until their passengers are examined and registered."
 ALR_ud_impact_harbour:0 "The Night the Sky Broke"
 ALR_ud_impact_harbour_desc:0 "Ulysses has broken apart over the world. Payton's harbour lights are still burning, but the sea lanes, the markets and the coastal towns of Usea are not what they were yesterday."
 ALR_ud_isaf_contracts_spirit:0 "Commercial Contracts with ISAF"
 ALR_ud_isaf_contracts_spirit_desc:0 "Albard sells steel and fuel to ISAF at its own quays under ordinary contracts. It has not joined the alliance."
 ALR_ud_isaf_supply_contracts:0 "Supply Contracts with ISAF"
 ALR_ud_isaf_supply_contracts_desc:0 "ISAF has asked to buy steel plate and refined fuel. Albard will sell under ordinary commercial contracts, delivered at its own quays, without joining the alliance."
 ALR_ud_labour_commonwealth:0 "The Labour Commonwealth"
 ALR_ud_labour_commonwealth_desc:0 "The mill and yard unions will govern through an elected labour council, with the owners' houses placed under its supervision and their profits under its tax."
 ALR_ud_labour_question:0 "The Mill and Yard Unions"
 ALR_ud_labour_question_desc:0 "The furnace crews and the riveters have their own unions, their own strike funds and long memories. Every plan in this programme depends on them turning up."
 ALR_ud_launch_day:0 "Launch Day in Payton"
 ALR_ud_launch_day_desc:0 "The first ship of the new programme goes down the ways with the whole harbour watching. It is a modest hull, and it is the proof that the yards can deliver."
 ALR_ud_merchant_yards:0 "Yards for the Merchant Fleet"
 ALR_ud_merchant_yards_desc:0 "Albard will build hulls to carry cargo: tankers, ore carriers and coasters. Every neighbour needs them, and none of them will ever fire a shot."
 ALR_ud_merchant_yards_spirit:0 "The Merchant Yards"
 ALR_ud_merchant_yards_spirit_desc:0 "Albard's yards build tankers, ore carriers and coasters for every buyer on the coast."
 ALR_ud_mill_cooperatives:0 "Mill Cooperatives"
 ALR_ud_mill_cooperatives_desc:0 "The smaller mills of the inland towns pass to cooperatives of their own workers, who receive state credit to rebuild the roads that serve them."
 ALR_ud_mill_town_census:0 "Census of the Mill Towns"
 ALR_ud_mill_town_census_desc:0 "The inland mill towns roll most of the country's plate and wire. Inspectors will count their furnaces, their order books and the age of every man on the floor."
 ALR_ud_naval_yards:0 "Yards for the Navy"
 ALR_ud_naval_yards_desc:0 "The yards will specialise in escorts and patrol craft. A rich harbour that cannot defend its own approaches is an invitation."
 ALR_ud_naval_yards_spirit:0 "The Naval Yards"
 ALR_ud_naval_yards_spirit_desc:0 "Albard's yards specialise in escorts and patrol craft for the defence of the harbour approaches."
 ALR_ud_neutral_harbour:0 "A Rich Harbour in a War"
 ALR_ud_neutral_harbour_desc:0 "War has broken out on the continent. Albard is not a party to it, but its oil, its steel and its yards are suddenly worth a great deal to every army in Usea."
 ALR_ud_oil_field_survey:0 "Survey the Coastal Oil"
 ALR_ud_oil_field_survey_desc:0 "Albard pumps oil from the harbour hills, the peninsula and the Zapland shore. Nobody has mapped all three fields together since the wells were first drilled."
 ALR_ud_oil_leases:0 "Lease the Oil Fields"
 ALR_ud_oil_leases_desc:0 "The fields will be leased to private operators in long blocks. The state collects royalties and lets the operators carry the risk of a dry well."
 ALR_ud_oil_leases_spirit:0 "Oil Field Leases"
 ALR_ud_oil_leases_spirit_desc:0 "Private operators work the fields in long blocks and pay the state royalties on every barrel."
 ALR_ud_open_company_ledgers:0 "Open the Company Ledgers"
 ALR_ud_open_company_ledgers_desc:0 "Every company above a certain size must publish its accounts. The voters will finally learn what the opening ledger of this programme only hinted at."
 ALR_ud_open_harbour:0 "An Open Harbour"
 ALR_ud_open_harbour_desc:0 "Erusea has closed its doors to refugees. Albard's harbours will take in those who arrive by sea and find them work in the yards and mills."
 ALR_ud_open_harbour_spirit:0 "An Open Harbour"
 ALR_ud_open_harbour_spirit_desc:0 "Refugees who arrive by sea are taken in and found work in the yards and mills."
 ALR_ud_open_ledgers_spirit:0 "Open Company Ledgers"
 ALR_ud_open_ledgers_spirit_desc:0 "Every large company publishes its accounts, and the voters read them."
 ALR_ud_open_shop:0 "The Open Shop"
 ALR_ud_open_shop_desc:0 "Every yard and mill will hire whom it pleases on whatever terms it can agree. Output will climb; so will the number of men on the picket lines."
 ALR_ud_open_shop_spirit:0 "The Open Shop"
 ALR_ud_open_shop_spirit_desc:0 "Every yard and mill hires on its own terms. Output is high, and so are tempers."
 ALR_ud_peninsula_refinery:0 "The Peninsula Refinery"
 ALR_ud_peninsula_refinery_desc:0 "Crude that leaves Albard unrefined leaves most of its value with it. A refinery and tank farm on the peninsula will keep that value at home."
 ALR_ud_programme_adopted:0 "Albard adopted its national programme from an older save"
 ALR_ud_public_oil_company:0 "A Public Oil Company"
 ALR_ud_public_oil_company_desc:0 "The wells will be gathered into one national company that answers to the treasury. It will pump less in a glut and more in a crisis, whatever the market says."
 ALR_ud_public_oil_spirit:0 "The Public Oil Company"
 ALR_ud_public_oil_spirit_desc:0 "One national company pumps Albard's oil and answers to the treasury rather than the market."
 ALR_ud_ratified_charter_spirit:0 "The Ratified Charter"
 ALR_ud_ratified_charter_spirit_desc:0 "Albard is a republic of written rights, governed by whoever wins the ballot."
 ALR_ud_relief_convoys:0 "Relief Convoys Along the Coast"
 ALR_ud_relief_convoys_desc:0 "Every hull that can sail will carry steel, fuel and medicine to the coastal towns that need them, under the treaty council's relief flag."
 ALR_ud_relief_convoys_spirit:0 "Relief Convoys"
 ALR_ud_relief_convoys_spirit_desc:0 "Albardi hulls carry steel, fuel and medicine to the coastal towns of Usea."
 ALR_ud_repair_yards:0 "Yards for Repair"
 ALR_ud_repair_yards_desc:0 "New hulls are a gamble; old hulls always need mending. Albard will become the drydock of the coast, repairing whatever limps into its harbours."
 ALR_ud_repair_yards_spirit:0 "The Drydocks of the Coast"
 ALR_ud_repair_yards_spirit_desc:0 "Whatever limps into an Albardi harbour leaves it mended."
 ALR_ud_rolling_mill_contracts:0 "Rolling Mill Contracts"
 ALR_ud_rolling_mill_contracts_desc:0 "The mills will sign long contracts with the yards and the railways, so that a good year for ships no longer means a bad year for track."
 ALR_ud_rolling_mills_spirit:0 "Rolling Mill Contracts"
 ALR_ud_rolling_mills_spirit_desc:0 "The mills, the yards and the railways buy and sell under long contracts that smooth the cycle of boom and slump."
 ALR_ud_sell_to_neighbours:0 "Sell to the Neighbours"
 ALR_ud_sell_to_neighbours_desc:0 "Albard will sell arms openly to recognised governments that ask, under export licences published every quarter. Trade makes friends; secrecy makes enemies."
 ALR_ud_shelter_steel:0 "Steel for the Shelters"
 ALR_ud_shelter_steel_desc:0 "The mills will roll shelter plate for every town on the coast: buried bunkers with steel roofs, water tanks and enough beds for the harbour districts."
 ALR_ud_shipping_houses:0 "The Shipping Houses"
 ALR_ud_shipping_houses_desc:0 "The great shipping houses will carry Albardi steel and oil under Albardi flags, with the board guaranteeing their cargoes."
 ALR_ud_shipping_houses_spirit:0 "The Shipping Houses"
 ALR_ud_shipping_houses_spirit_desc:0 "Albardi steel and oil travel under Albardi flags with the board's guarantee behind every cargo."
 ALR_ud_steel_board:0 "The Steel and Shipping Board"
 ALR_ud_steel_board_desc:0 "The great steel and shipping houses will govern through a single board. They already run the country's economy; now they will run its government openly."
 ALR_ud_steel_board_office:0 "Steel and Shipping Board"
 ALR_ud_steel_board_office_desc:0 "The great steel and shipping houses govern Albard through a single board. It is an office, not a person; its members are not named in this provisional path."
 ALR_ud_steel_export_quota:0 "Steel for Export"
 ALR_ud_steel_export_quota_desc:0 "With the furnaces relined and the contracts signed, Albard can promise its neighbours a fixed tonnage of plate every quarter and keep the promise."
 ALR_ud_steel_exports_spirit:0 "Steel for Export"
 ALR_ud_steel_exports_spirit_desc:0 "Albard promises its neighbours a fixed tonnage of plate every quarter, and keeps the promise."
 ALR_ud_steel_reserve:0 "The Strategic Steel Reserve"
 ALR_ud_steel_reserve_desc:0 "A reserve of plate, girders and rail will be stored inland, where the mills can draw on it to rebuild whatever the coming years break."
 ALR_ud_steel_shelters_spirit:0 "Steel Shelters"
 ALR_ud_steel_shelters_spirit_desc:0 "Buried bunkers with steel roofs stand ready under every coastal town."
 ALR_ud_tanker_slips:0 "Tanker Slips on the Peninsula"
 ALR_ud_tanker_slips_desc:0 "Two new slipways on the peninsula will be long enough for the largest tankers Albard's oil can fill. The first keel is promised within the year."
 ALR_ud_three_yards:0 "The Three Shipyards"
 ALR_ud_three_yards_desc:0 "Payton, the peninsula and Zapland each build ships, each badly. The government can afford to make one kind of yard excellent, but not all three."
 ALR_ud_treaty_auditor:0 "Auditor of the Council"
 ALR_ud_treaty_auditor_desc:0 "Albard will pay its share and not a coin more, and it will insist that every member's contribution is audited and published."
 ALR_ud_treaty_auditor_spirit:0 "Auditor of the Council"
 ALR_ud_treaty_auditor_spirit_desc:0 "Albard pays its share and insists that every member's contribution is published."
 ALR_ud_treaty_chair:0 "Albard at the Treaty Council"
 ALR_ud_treaty_chair_desc:0 "Albard pays more into the Central Usean Treaty Council than any other small member. Its delegates have begun to ask what, exactly, the money buys."
 ALR_ud_treaty_paymaster:0 "Paymaster of the Council"
 ALR_ud_treaty_paymaster_desc:0 "Albard will fund the council's common programmes generously, and expect the agenda to reflect it. Money given openly is influence earned openly."
 ALR_ud_treaty_paymaster_spirit:0 "Paymaster of the Council"
 ALR_ud_treaty_paymaster_spirit_desc:0 "Albard funds the treaty council's common programmes generously, and its agenda shows it."
 ALR_ud_ulysses_announcement:0 "The Warning from Central Usea"
 ALR_ud_ulysses_announcement_desc:0 "The treaty council has relayed Central Usea's announcement: the asteroid Ulysses will strike the Earth. Albard has steel, oil and ships, and three years to decide how to use them."
 ALR_ud_valley_arsenals:0 "The Valley Arsenals"
 ALR_ud_valley_arsenals_desc:0 "Export orders will pay for a new shell line in the Yinshi Valley, built to standards every buyer recognises and every inspector can check."
 ALR_ud_wage_board:0 "A National Wage Board"
 ALR_ud_wage_board_desc:0 "Unions, owners and the ministry will sit on one board that sets wages for the mills and yards each spring. Strikes will be rarer; costs will be higher."
 ALR_ud_wage_board_spirit:0 "The National Wage Board"
 ALR_ud_wage_board_spirit_desc:0 "Unions, owners and the ministry set wages for the mills and yards together each spring."
 ALR_ud_who_owns_albard:0 "Who Owns Albard?"
 ALR_ud_who_owns_albard_desc:0 "The furnace owners, the shipping houses, the unions and the harbour lawyers all claim the country's prosperity as their own work, and each wants the government to say so."
 ALR_ud_yard_committees:0 "Yard Committees"
 ALR_ud_yard_committees_desc:0 "Each yard elects a committee that sits with its managers to plan launches, shifts and safety. Disputes are settled on the slipway, not on the picket line."
 ALR_ud_yards_double_shifts:0 "Double Shifts in the Yards"
 ALR_ud_yards_double_shifts_desc:0 "Repair and cargo orders have doubled. The yards will work two shifts, the apprentice halls will graduate their classes early, and the unions will be asked to agree."
 BLD_ud_between_six_borders:0 "Between Six Borders"
 BLD_ud_between_six_borders_desc:0 "War has broken out on the continent. Bulgurdarest is party to none of it, but six neighbours' supply lines, refugees and suspicions now run across its railways."
 BLD_ud_bonded_yards:0 "Bonded Rail Yards"
 BLD_ud_bonded_yards_desc:0 "Sealed yards at the frontier junctions will let foreign freight change trains without paying duty, for a handling fee. Bulgurdarest becomes the region's switching yard."
 BLD_ud_bonded_yards_spirit:0 "Bonded Rail Yards"
 BLD_ud_bonded_yards_spirit_desc:0 "Foreign freight changes trains in sealed frontier yards without paying duty, for a handling fee."
 BLD_ud_border_markets:0 "Border Market Towns"
 BLD_ud_border_markets_desc:0 "The cheaper crossings have filled the frontier towns with traders. Paved squares, market halls and a weekly fair day will turn a traffic jam into a livelihood."
 BLD_ud_border_markets_spirit:0 "Border Market Towns"
 BLD_ud_border_markets_spirit_desc:0 "The frontier towns have become market towns, with fair days and full squares."
 BLD_ud_buyers_week:0 "Buyers' Week"
 BLD_ud_buyers_week_desc:0 "One week each spring when every factory in the country opens its order books on the fair floor. Foreign buyers come for the prices and stay for the contracts."
 BLD_ud_caucus_secretariat:0 "The Caucus Secretariat"
 BLD_ud_caucus_secretariat_desc:0 "A handful of officials in the capital will prepare the caucus's papers, count its votes and make sure no member is surprised in session."
 BLD_ud_common_waybill:0 "A Common Waybill"
 BLD_ud_common_waybill_desc:0 "One form, accepted at every member's frontier, for every wagon and lorry. It is the dullest document in Usea and it will save its users a fortune."
 BLD_ud_council_host:0 "Host the Council Session"
 BLD_ud_council_host_desc:0 "Bulgurdarest will offer to host a full session of the treaty council in the capital, with the fairground halls as its chamber and the whole region watching."
 BLD_ud_crossroads_after_the_war:0 "The Crossroads After the War"
 BLD_ud_crossroads_after_the_war_desc:0 "The war is over. Every neighbour needs to rebuild, and every road to rebuilding runs through Bulgurdarest. The crossroads has never been busier, or more watched."
 BLD_ud_crossroads_at_peace:0 "The Crossroads at Peace"
 BLD_ud_crossroads_at_peace_desc:0 "The continental crisis has been averted. The emergency timetables go back in the drawer, and the trains run for trade again."
 BLD_ud_crossroads_closed:0 "Close the Crossroads"
 BLD_ud_crossroads_closed_desc:0 "A crossroads that takes everyone will be overwhelmed. The frontiers will close to unregistered travellers, with reception only for the sick and for children."
 BLD_ud_crossroads_closed_spirit:0 "The Closed Crossroads"
 BLD_ud_crossroads_closed_spirit_desc:0 "The frontiers are closed to unregistered travellers, except the sick and children."
 BLD_ud_crossroads_couriers:0 "Couriers of the Crossroads"
 BLD_ud_crossroads_couriers_desc:0 "Quiet diplomacy runs on quick messengers. A courier flight from the capital airfield will reach any neighbouring capital before lunch."
 BLD_ud_crossroads_question:0 "Who Governs the Crossroads?"
 BLD_ud_crossroads_question_desc:0 "The placeholder administration that has run Bulgurdarest since 1991 is tired and divided. Royalists, the railway unions and the customs service each claim the state."
 BLD_ud_crossroads_register:0 "The Register of the Crossroads"
 BLD_ud_crossroads_register_desc:0 "Six borders meet at Bulgurdarest. Before the government can decide what the country should be, it wants a register of every road, railway, customs post and mine that makes it a crossroads."
 BLD_ud_crown_charter:0 "The Crown Charter"
 BLD_ud_crown_charter_desc:0 "The council publishes a charter defining what the crown may do, what the council may do, and what neither may do without the other."
 BLD_ud_crown_charter_spirit:0 "The Crown Charter"
 BLD_ud_crown_charter_spirit_desc:0 "A council of notables governs in the crown's name under a published charter."
 BLD_ud_crown_council:0 "Summon the Crown Council"
 BLD_ud_crown_council_desc:0 "The old tsardom never formally ended; it was simply set aside. A council of notables will govern in the crown's name, as a council, without naming a monarch."
 BLD_ud_crown_courts:0 "Courts of the Crown"
 BLD_ud_crown_courts_desc:0 "Judges will sit in the crown's name, with a final appeal to the council. The old courts keep their staff and lose their excuses."
 BLD_ud_crown_office:0 "Crown Council"
 BLD_ud_crown_office_desc:0 "A council of notables governs in the name of the crown of Bulgurdarest. It is an office, not a person; no monarch is named, and its members are not named in this provisional path."
 BLD_ud_customs_directorate:0 "Install the Customs Directorate"
 BLD_ud_customs_directorate_desc:0 "The customs service is the one institution that works everywhere in the country. Its senior officers will govern as a directorate until politics can be trusted again."
 BLD_ud_customs_survey:0 "Count the Crossings"
 BLD_ud_customs_survey_desc:0 "Customs officers will log every lorry, wagon and barge that crosses a Bulgurdaresti frontier for a full season, so that the state finally knows what passes through it and what it earns."
 BLD_ud_directorate_inspectors:0 "Directorate Inspectors"
 BLD_ud_directorate_inspectors_desc:0 "Inspectors drawn from the customs service will audit every ministry as they once audited every wagon: unannounced, thoroughly and in writing."
 BLD_ud_directorate_office:0 "Customs Directorate"
 BLD_ud_directorate_office_desc:0 "The senior officers of the customs service govern as a directorate. It is an office, not a person; its members are not named in this provisional path."
 BLD_ud_engineers_congress:0 "The Engineers' Congress"
 BLD_ud_engineers_congress_desc:0 "Civil engineers from across the region will meet in Expo City every second year to compare bridges, tunnels and railways, and to hire one another."
 BLD_ud_evacuation_junction:0 "The Evacuation Junction"
 BLD_ud_evacuation_junction_desc:0 "The railways will plan for the day when every line runs one way: emergency timetables, reserve rolling stock and reception halls at every junction."
 BLD_ud_evacuation_junction_spirit:0 "The Evacuation Junction"
 BLD_ud_evacuation_junction_spirit_desc:0 "Emergency timetables, reserve rolling stock and reception halls stand ready at every junction."
 BLD_ud_expo_charter:0 "Charter the Expo City Fair"
 BLD_ud_expo_charter_desc:0 "Expo City was built to show things to the world. Its halls are half empty. A new charter will give the fair a board, a calendar and a purpose beyond nostalgia."
 BLD_ud_expo_slipways:0 "The Expo City Slipways"
 BLD_ud_expo_slipways_desc:0 "The dockyards beside the fairground built the exhibition's pavilions by sea. Modern slipways will let them build ships again, for coastal trade and for anyone who pays."
 BLD_ud_ferustian_freight:0 "Freight for Ferustia"
 BLD_ud_ferustian_freight_desc:0 "Landlocked Ferustia needs a road to the sea, and the shortest friendly one runs through the capital's harbour. A standing freight run will carry its rubber out and its imports in."
 BLD_ud_ferustian_freight_spirit:0 "The Ferustian Freight Run"
 BLD_ud_ferustian_freight_spirit_desc:0 "A standing freight run carries Ferustian goods between the passes and the capital's harbour."
 BLD_ud_foreign_leases:0 "Lease the Upper Seams"
 BLD_ud_foreign_leases_desc:0 "Foreign mining houses have offered to work the upper seams at their own cost and pay royalties to the state. Money arrives quickly; control leaves with it."
 BLD_ud_free_crossroads_zone:0 "The Free Crossroads Zone"
 BLD_ud_free_crossroads_zone_desc:0 "The whole country becomes a single customs-free transit zone for goods passing through. The directorate becomes the zone's permanent administration."
 BLD_ud_free_zone_spirit:0 "The Free Crossroads Zone"
 BLD_ud_free_zone_spirit_desc:0 "Goods in transit cross the whole country free of duty under the directorate's administration."
 BLD_ud_household_guard:0 "The Household Guard"
 BLD_ud_household_guard_desc:0 "A ceremonial guard for the council's palace that is also a real battalion, trained in the capital and loyal to the crown rather than to any faction."
 BLD_ud_impact_night:0 "The Night the Sky Broke"
 BLD_ud_impact_night_desc:0 "Ulysses has broken apart over the world. Whatever the night brought elsewhere, the trains are already arriving at the crossroads: from every border, at once, full."
 BLD_ud_isaf_medical_transit_spirit:0 "The Medical Transit"
 BLD_ud_isaf_medical_transit_spirit_desc:0 "ISAF's wounded and medical supplies cross Bulgurdarest by rail under Bulgurdaresti crews. Bulgurdarest has joined no alliance."
 BLD_ud_isaf_transit:0 "The Medical Transit"
 BLD_ud_isaf_transit_desc:0 "ISAF has asked to move its wounded and medical supplies by Bulgurdaresti rail. The trains will run under Bulgurdaresti crews and inspectors; Bulgurdarest joins no alliance."
 BLD_ud_mediators_house:0 "The House of Mediators"
 BLD_ud_mediators_house_desc:0 "Bulgurdarest's talks need a permanent home: an old palace in the capital, refurbished, staffed and open to any neighbour that wants to argue somewhere other than a battlefield."
 BLD_ud_mediators_house_spirit:0 "The House of Mediators"
 BLD_ud_mediators_house_spirit_desc:0 "A permanent house for talks stands open in the capital to any neighbour."
 BLD_ud_mine_committees:0 "Committees on the Mountain"
 BLD_ud_mine_committees_desc:0 "The pits of Mount Sartan come under committees of miners and engineers, who answer for both output and safety to the presidium."
 BLD_ud_mine_safety_board:0 "A Mine Safety Board"
 BLD_ud_mine_safety_board_desc:0 "The cooperatives' first demand is that fewer of their members die underground. Inspectors with real powers will close any gallery that fails their tests."
 BLD_ud_mine_safety_spirit:0 "The Mine Safety Board"
 BLD_ud_mine_safety_spirit_desc:0 "Inspectors with real powers close any gallery that fails their tests."
 BLD_ud_miners_cooperative:0 "The Miners' Cooperatives"
 BLD_ud_miners_cooperative_desc:0 "The pit villages will own their pits. The state lends the capital and buys the ore; the cooperatives decide how it is dug and who digs it."
 BLD_ud_miners_cooperatives_spirit:0 "The Miners' Cooperatives"
 BLD_ud_miners_cooperatives_spirit_desc:0 "The pit villages own their pits and sell their ore to the state."
 BLD_ud_nationalised_railways:0 "Nationalise the Railways"
 BLD_ud_nationalised_railways_desc:0 "The private railway companies pass to the republic. Their timetables will be set for the country's needs rather than their shareholders'."
 BLD_ud_nervada_junction:0 "The Nervada Junction"
 BLD_ud_nervada_junction_desc:0 "Every inland route meets at Nervada. A rebuilt junction with doubled track and modern signalling will keep three borders' worth of trains moving at once."
 BLD_ud_neutral_ground:0 "Neutral Ground"
 BLD_ud_neutral_ground_desc:0 "A country with six neighbours hears every quarrel in the region. Bulgurdarest can offer what most of them lack: a table on neutral ground, and hosts with no stake in the outcome."
 BLD_ud_neutral_ground_tt:0 "Bulgurdarest offers talks only. No war, claim, border, guarantee or faction effect exists anywhere in this tree."
 BLD_ud_open_frontier_tariff:0 "The Open Frontier Tariff"
 BLD_ud_open_frontier_tariff_desc:0 "One low, published tariff at every crossing, the same for every neighbour. Fewer officials, fewer bribes, and a great deal more traffic through the market towns."
 BLD_ud_open_table:0 "An Open Table"
 BLD_ud_open_table_desc:0 "Any two neighbours may meet in the capital, in public, with the press in the gallery. What is agreed in the open is harder to deny at home."
 BLD_ud_open_table_spirit:0 "An Open Table"
 BLD_ud_open_table_spirit_desc:0 "Neighbours meet in the capital in public, with the press in the gallery."
 BLD_ud_open_tariff_spirit:0 "The Open Frontier Tariff"
 BLD_ud_open_tariff_spirit_desc:0 "One low, published tariff applies at every crossing, the same for every neighbour."
 BLD_ud_peoples_committees:0 "People's Committees"
 BLD_ud_peoples_committees_desc:0 "Every works, depot and pit elects a committee. The committees send delegates to the presidium and inspect the ministries in their district."
 BLD_ud_peoples_committees_spirit:0 "People's Committees"
 BLD_ud_peoples_committees_spirit_desc:0 "Elected committees in every works, depot and pit inspect the ministries in their district."
 BLD_ud_peoples_constitution:0 "The People's Constitution"
 BLD_ud_peoples_constitution_desc:0 "A congress of committee delegates from every works, depot and pit adopts the permanent constitution of the People's Republic of Bulgurdarest."
 BLD_ud_peoples_constitution_spirit:0 "The People's Constitution"
 BLD_ud_peoples_constitution_spirit_desc:0 "A congress of committee delegates has given the People's Republic its permanent constitution."
 BLD_ud_peoples_office:0 "Presidium of the People's Republic"
 BLD_ud_peoples_office_desc:0 "A presidium answerable to the elected committees of the works, depots and pits governs the People's Republic. It is an office, not a person; its members are not named in this provisional path."
 BLD_ud_peoples_republic:0 "Proclaim the People's Republic"
 BLD_ud_peoples_republic_desc:0 "The railway unions, the miners and the Nervada works proclaim a people's republic, governed by a presidium answerable to elected committees."
 BLD_ud_programme_adopted:0 "Bulgurdarest adopted its national programme from an older save"
 BLD_ud_quiet_rooms:0 "Quiet Rooms"
 BLD_ud_quiet_rooms_desc:0 "Some things can only be said where no one is listening. The Foreign Ministry will keep rooms, couriers and interpreters for talks that never officially happen."
 BLD_ud_quiet_rooms_spirit:0 "The Quiet Rooms"
 BLD_ud_quiet_rooms_spirit_desc:0 "The Foreign Ministry keeps rooms, couriers and interpreters for talks that never officially happen."
 BLD_ud_relief_corridor:0 "The Relief Corridor"
 BLD_ud_relief_corridor_desc:0 "With Erusea closing its doors, the displaced are looking for other roads. Bulgurdarest will keep its crossings open and its trains running for anyone who reaches them."
 BLD_ud_relief_corridor_spirit:0 "The Relief Corridor"
 BLD_ud_relief_corridor_spirit_desc:0 "Bulgurdarest's crossings stay open and its trains run for the displaced."
 BLD_ud_relief_fair:0 "The Relief Fair"
 BLD_ud_relief_fair_desc:0 "Expo City's halls will become depots: grain, blankets and medicine bought, stored and shipped from the fairground to wherever the trains are needed."
 BLD_ud_relief_fair_spirit:0 "The Relief Fair"
 BLD_ud_relief_fair_spirit_desc:0 "Expo City's halls serve as relief depots for the whole region."
 BLD_ud_royalty_accounts:0 "Royalty Accounts"
 BLD_ud_royalty_accounts_desc:0 "Every tonne the leaseholders lift will be weighed by a state clerk and paid for into a public account. The houses grumble; the treasury smiles."
 BLD_ud_sartan_galleries:0 "Shelter in the Sartan Galleries"
 BLD_ud_sartan_galleries_desc:0 "The old galleries under Mount Sartan run for kilometres. Cleared, shored and stocked, they can shelter the mining towns and much of the capital's population."
 BLD_ud_sartan_galleries_spirit:0 "The Sartan Galleries"
 BLD_ud_sartan_galleries_spirit_desc:0 "The galleries under Mount Sartan are cleared, shored and stocked as shelters."
 BLD_ud_sartan_oil:0 "The Sartan Oil Wells"
 BLD_ud_sartan_oil_desc:0 "Whoever runs the mountain, its oil belongs in Bulgurdaresti tanks before it belongs in anyone else's. New wells and a storage farm at the capital will see to it."
 BLD_ud_sartan_smelter:0 "The Sartan Smelter"
 BLD_ud_sartan_smelter_desc:0 "Ore that leaves the mountain raw leaves most of its value behind. A smelter at the foot of the mountain will send out ingots instead."
 BLD_ud_sartan_survey:0 "Survey Mount Sartan"
 BLD_ud_sartan_survey_desc:0 "Mount Sartan holds oil, aluminium ore and iron in seams that have been worked for a century and never properly mapped. Geologists will map them before anyone argues about who owns them."
 BLD_ud_science_pavilion:0 "A Pavilion of Science"
 BLD_ud_science_pavilion_desc:0 "The fair will be a showcase first: engineers, universities and laboratories exhibiting what Usea can build, and Bulgurdarest hosting the conversation."
 BLD_ud_science_pavilion_spirit:0 "The Pavilion of Science"
 BLD_ud_science_pavilion_spirit_desc:0 "Expo City's fair is a showcase first: the region's engineers and laboratories exhibit there."
 BLD_ud_sky_over_the_crossroads:0 "The Sky Over the Crossroads"
 BLD_ud_sky_over_the_crossroads_desc:0 "Central Usea has announced that the asteroid Ulysses will strike the Earth. If the neighbours flee, many of them will flee through Bulgurdarest. The crossroads must prepare."
 BLD_ud_small_states_caucus_spirit:0 "The Small States' Caucus"
 BLD_ud_small_states_caucus_spirit_desc:0 "The treaty council's smaller members agree their positions in Bulgurdarest before each session."
 BLD_ud_state_mines:0 "A State Mining Trust"
 BLD_ud_state_mines_desc:0 "The state will buy out the failing mine companies and run the mountain as one enterprise, with one plan and one payroll."
 BLD_ud_state_mines_spirit:0 "The State Mining Trust"
 BLD_ud_state_mines_spirit_desc:0 "Mount Sartan is run as one public enterprise with one plan and one payroll."
 BLD_ud_states_caucus:0 "The Small States' Caucus"
 BLD_ud_states_caucus_desc:0 "The council's smaller members vote separately and lose separately. Bulgurdarest will host a caucus where they agree their positions before each session."
 BLD_ud_talks_secretariat:0 "A Secretariat for Talks"
 BLD_ud_talks_secretariat_desc:0 "Every public meeting needs minutes, translations and a record of what was promised. A small permanent secretariat will keep them, and remind the parties."
 BLD_ud_tariff_code:0 "The Directorate Tariff Code"
 BLD_ud_tariff_code_desc:0 "One code, published in full, governs every duty in the country. The directorate's first act is to make its own rules readable."
 BLD_ud_tariff_code_spirit:0 "The Directorate Tariff Code"
 BLD_ud_tariff_code_spirit_desc:0 "One published code governs every duty in the country."
 BLD_ud_trade_hall:0 "A Hall of Trade"
 BLD_ud_trade_hall_desc:0 "The fair will be a market first: buyers and sellers from six borders, contracts signed on the floor, and the city's hotels full every season."
 BLD_ud_trade_hall_spirit:0 "The Hall of Trade"
 BLD_ud_trade_hall_spirit_desc:0 "Expo City's fair is a market first: contracts are signed on the floor every season."
 BLD_ud_train_inspections:0 "Inspect Every Train"
 BLD_ud_train_inspections_desc:0 "No train crosses Bulgurdarest without inspection. Weapons, troops and munitions are turned back at the frontier, whoever's they are."
 BLD_ud_train_inspections_spirit:0 "Every Train Inspected"
 BLD_ud_train_inspections_spirit_desc:0 "No weapon, soldier or munition crosses Bulgurdarest, whoever's it is."
 BLD_ud_transit_clauses:0 "Champion the Transit Clauses"
 BLD_ud_transit_clauses_desc:0 "The council's members move goods across one another's borders every day under a dozen different rules. Bulgurdarest will propose one set, and offer to write it."
 BLD_ud_transit_clauses_spirit:0 "The Transit Clauses"
 BLD_ud_transit_clauses_spirit_desc:0 "Bulgurdarest champions one set of transit rules for every treaty council member."
 BLD_ud_transit_concordat:0 "The Transit Concordat"
 BLD_ud_transit_concordat_desc:0 "The directorate offers every neighbour the same standing terms for transit through Bulgurdarest, signed once and renewed automatically."
 BLD_ud_treaty_broker:0 "Broker at the Treaty Council"
 BLD_ud_treaty_broker_desc:0 "Bulgurdarest sits on the Central Usean Treaty Council with larger and louder members. It cannot outvote them. It can make itself the member everyone needs to reach agreement."
 BLD_ud_tsardom_restored:0 "The Tsardom Restored"
 BLD_ud_tsardom_restored_desc:0 "The council's provisional rule becomes the settled constitution of the Tsardom of Bulgurdarest. The crown is a council; the council is permanent."
 BLD_ud_tsardom_spirit:0 "The Restored Tsardom"
 BLD_ud_tsardom_spirit_desc:0 "The crown council is the settled and permanent constitution of the Tsardom of Bulgurdarest."
 BLD_ud_upper_seam_leases_spirit:0 "Leases of the Upper Seams"
 BLD_ud_upper_seam_leases_spirit_desc:0 "Foreign mining houses work the upper seams and pay royalties to the state."
 BLD_ud_usean_exhibition:0 "The Usean Exhibition"
 BLD_ud_usean_exhibition_desc:0 "A full exhibition, the first in a generation: pavilions from every neighbour that will send one, a season of crowds, and Bulgurdarest at the centre of the map for once."
 BLD_ud_usean_exhibition_spirit:0 "The Usean Exhibition"
 BLD_ud_usean_exhibition_spirit_desc:0 "Bulgurdarest hosts a full exhibition of the region's industry, science and trade."
 CHO_neutrality:0 "Chopinburg"
 CHO_neutrality_DEF:0 "Chopinburg"
 CHO_ud_after_the_war:0 "Chopinburg After the War"
 CHO_ud_after_the_war_desc:0 "The war is over. Chopinburg kept its highlands, its island and its seat on the council. Now it must decide what a small country owes the large ones that fought beside it."
 CHO_ud_announcement_next_door:0 "The Announcement Next Door"
 CHO_ud_announcement_next_door_desc:0 "Central Usea has announced that the asteroid Ulysses will strike the Earth. The news came from just across the highlands, and so, the government fears, will the consequences."
 CHO_ud_assembly_mandate_spirit:0 "The Assembly's Mandate"
 CHO_ud_assembly_mandate_spirit_desc:0 "The union hall has become a parliament with a national mandate."
 CHO_ud_assembly_office:0 "Dockworkers' Assembly"
 CHO_ud_assembly_office_desc:0 "The yard unions, estate tappers and highland hauliers govern Chopinburg through an elected assembly. It is an office, not a person; its members are not named in this provisional path."
 CHO_ud_between_neighbours:0 "A Country Between Neighbours"
 CHO_ud_between_neighbours_desc:0 "Chopinburg is a small republic wedged between Central Usea, Ugellas and Platania. Before it can choose a course, the government must count what it owns and what it owes to each of them."
 CHO_ud_bloc_of_the_small:0 "A Bloc of the Small"
 CHO_ud_bloc_of_the_small_desc:0 "The smaller members will agree their positions before each session and vote together. It is not a faction; it is a habit of meeting for breakfast."
 CHO_ud_capital_refuge:0 "Refuge in the Capital"
 CHO_ud_capital_refuge_desc:0 "The inland capital is the safest place in the country. Schools, cellars and warehouses there will be prepared to shelter the coastal towns."
 CHO_ud_capital_refuge_spirit:0 "Refuge in the Capital"
 CHO_ud_capital_refuge_spirit_desc:0 "The inland capital's schools and cellars are prepared to shelter the coastal towns."
 CHO_ud_capital_road:0 "The Capital Road to the Highlands"
 CHO_ud_capital_road_desc:0 "An all-weather road from the capital to the highland posts will carry customs officers, rangers and, when the passes close, relief."
 CHO_ud_chopinburg_coasters:0 "Build Our Own Coasters"
 CHO_ud_chopinburg_coasters_desc:0 "A country that only repairs other people's ships stays at their mercy. The yards will lay down small coasters for a Chopinburg merchant line."
 CHO_ud_closed_highlands:0 "Close the Highland Passes"
 CHO_ud_closed_highlands_desc:0 "No army will cross Chopinburg's highlands. The passes are closed to military traffic of every flag, and the mountain companies take up their winter posts in summer."
 CHO_ud_closed_highlands_spirit:0 "Closed Highlands"
 CHO_ud_closed_highlands_spirit_desc:0 "The highland passes are closed to every army."
 CHO_ud_coasters_spirit:0 "A Chopinburg Merchant Line"
 CHO_ud_coasters_spirit_desc:0 "Small coasters from the northern yards carry the country's own cargo under its own flag."
 CHO_ud_continental_rubber_spirit:0 "Rubber for the Continent"
 CHO_ud_continental_rubber_spirit_desc:0 "Long contracts carry Chopinburg rubber to every corner of Usea."
 CHO_ud_council_clerks:0 "Send Our Best Clerks"
 CHO_ud_council_clerks_desc:0 "Chopinburg will staff the council's committees with its most capable officials. A small member that drafts the papers decides more than its vote suggests."
 CHO_ud_council_clerks_spirit:0 "Clerks at the Council"
 CHO_ud_council_clerks_spirit_desc:0 "Chopinburg's officials draft the treaty council's papers, and their drafts shape its decisions."
 CHO_ud_coup_on_the_border:0 "The Coup on Our Borders"
 CHO_ud_coup_on_the_border_desc:0 "Coup attempts have broken out across Usea. The highland posts are reinforced, the crossings close at night, and the rangers are told to send armed men back the way they came."
 CHO_ud_crossing_markets:0 "Crossing-Day Markets"
 CHO_ud_crossing_markets_desc:0 "On fixed days the border posts will open as markets, where highland families from both sides trade openly what they used to trade at night."
 CHO_ud_customs_cordon:0 "A Customs Cordon"
 CHO_ud_customs_cordon_desc:0 "Every crossing will have a post, every lorry a manifest and every mule train a licence. The smugglers' paths will be watched and, where possible, closed."
 CHO_ud_customs_cordon_spirit:0 "The Customs Cordon"
 CHO_ud_customs_cordon_spirit_desc:0 "Every highland crossing has a post and every cargo a manifest."
 CHO_ud_directorate_charter:0 "The Directorate Charter"
 CHO_ud_directorate_charter_desc:0 "The temporary directorate becomes the permanent form of government, with a charter that names the exchange, not the street, as the source of authority."
 CHO_ud_directorate_charter_spirit:0 "The Directorate Charter"
 CHO_ud_directorate_charter_spirit_desc:0 "The exchange, not the street, is the source of authority in Chopinburg."
 CHO_ud_directorate_office:0 "Rubber Exchange Directorate"
 CHO_ud_directorate_office_desc:0 "The estate houses, exporters and bankers of the exchange govern Chopinburg as a directorate. It is an office, not a person; its members are not named in this provisional path."
 CHO_ud_dockworkers_assembly:0 "The Dockworkers' Assembly"
 CHO_ud_dockworkers_assembly_desc:0 "The yard unions, estate tappers and highland hauliers will govern through an elected assembly meeting in the union hall, and the first ballot will be held within a year."
 CHO_ud_estate_contracts:0 "Long Estate Contracts"
 CHO_ud_estate_contracts_desc:0 "The directorate will guarantee the estates' prices for ten years in return for investment in roads, clinics and processing."
 CHO_ud_estate_land_reform:0 "Estate Land Reform"
 CHO_ud_estate_land_reform_desc:0 "The assembly will buy out the largest estates and divide them among the tappers who work them. The island will be poorer for a while and fairer for good."
 CHO_ud_estate_monopoly:0 "Confirm the Estate Monopoly"
 CHO_ud_estate_monopoly_desc:0 "The great estate houses already run the island. The state will confirm their monopoly in law, collect a fixed royalty and leave the plantations to the people who know them."
 CHO_ud_estate_monopoly_spirit:0 "The Estate Monopoly"
 CHO_ud_estate_monopoly_spirit_desc:0 "The great estate houses hold the island's rubber in law and pay the state a fixed royalty."
 CHO_ud_estate_railway:0 "The Estate Railway"
 CHO_ud_estate_railway_desc:0 "The estate houses will lay a narrow-gauge line from the plantations to the island harbour, at their own expense and to their own timetable."
 CHO_ud_exchange_directorate:0 "The Exchange Directorate"
 CHO_ud_exchange_directorate_desc:0 "The estate houses, exporters and bankers will govern through a directorate seated in the exchange hall. The country will be run as carefully as a good plantation."
 CHO_ud_exchange_warehouses:0 "Exchange Warehouses"
 CHO_ud_exchange_warehouses_desc:0 "The exchange needs dry, guarded warehouses where latex can wait for a better price instead of rotting at the estate gate."
 CHO_ud_first_assembly_ballot:0 "The First Assembly Ballot"
 CHO_ud_first_assembly_ballot_desc:0 "The assembly's mandate ends with a national vote, open to every adult citizen. Whoever wins will govern a country where the union hall has become a parliament."
 CHO_ud_foreign_buyers:0 "Open the Exchange to Foreign Buyers"
 CHO_ud_foreign_buyers_desc:0 "Foreign trading houses will be allowed seats on the exchange floor. Prices will be higher and more volatile, and the directorate will answer to markets it does not control."
 CHO_ud_foreign_hulls_spirit:0 "Foreign Hulls in the Yards"
 CHO_ud_foreign_hulls_spirit_desc:0 "The northern yards take in any merchant ship whose owners pay their bills."
 CHO_ud_highland_crossings:0 "The Highland Crossings"
 CHO_ud_highland_crossings_desc:0 "The highlands on the Central Usean border and the passes toward Ugellas carry more trade than the customs ledgers admit. The government must decide what kind of border it wants."
 CHO_ud_highland_rangers:0 "Highland Rangers"
 CHO_ud_highland_rangers_desc:0 "Mounted and ski-borne rangers will patrol the high paths between the posts. They will know every shepherd by name and every track by season."
 CHO_ud_highland_stores:0 "Highland Grain Stores"
 CHO_ud_highland_stores_desc:0 "Fuel and grain will be stored in the highlands, away from the coasts, where a reserve can wait out a disaster and feed the capital afterwards."
 CHO_ud_hospital_ships_spirit:0 "Hospital Ship Refits"
 CHO_ud_hospital_ships_spirit_desc:0 "The northern yards refit merchant hulls as unarmed hospital ships for ISAF. Chopinburg has not joined the alliance."
 CHO_ud_impact_night:0 "The Night the Sky Broke"
 CHO_ud_impact_night_desc:0 "Ulysses has broken apart over the world. The country survived the night; the coasts, the ferries and the neighbours' ports are another matter."
 CHO_ud_isaf_hospital_ships:0 "Refit Hospital Ships for ISAF"
 CHO_ud_isaf_hospital_ships_desc:0 "ISAF has asked whether the northern yards will refit merchant hulls as hospital ships. Chopinburg will do the work at cost, without joining the alliance or arming a single hull."
 CHO_ud_island_evacuation:0 "The Island Evacuation Plan"
 CHO_ud_island_evacuation_desc:0 "If the coasts are threatened, the island's people must reach the mainland quickly. Ferries, lighters and the estate railway will be organised into a single evacuation plan."
 CHO_ud_island_evacuation_spirit:0 "The Island Evacuation Plan"
 CHO_ud_island_evacuation_spirit_desc:0 "Ferries, lighters and the estate railway stand ready to move the island's people to the mainland."
 CHO_ud_island_relief_spirit:0 "Island Relief"
 CHO_ud_island_relief_spirit_desc:0 "Relief goes first to Split Island's harbours and villages."
 CHO_ud_land_reform_spirit:0 "Estate Land Reform"
 CHO_ud_land_reform_spirit_desc:0 "The largest estates have been divided among the tappers who work them."
 CHO_ud_latex_processing:0 "Latex Works on the Island"
 CHO_ud_latex_processing_desc:0 "Raw latex sells for little; sheet, crepe and moulded rubber sell for much more. A processing works on Split Island will keep the value of the harvest at home."
 CHO_ud_mountain_companies:0 "The Mountain Companies"
 CHO_ud_mountain_companies_desc:0 "The old mountaineer training will be revived in standing companies that winter in the highlands and know how to hold a pass with very few men."
 CHO_ud_mountain_companies_spirit:0 "The Mountain Companies"
 CHO_ud_mountain_companies_spirit_desc:0 "Standing companies winter in the highlands and can hold a pass with very few men."
 CHO_ud_neighbour_contracts:0 "Repair Contracts with the Neighbours"
 CHO_ud_neighbour_contracts_desc:0 "Rather than wait for ships to arrive, the yards will sign standing repair contracts with the merchant lines of Platania, Ugellas and Central Usea."
 CHO_ud_neighbour_contracts_spirit:0 "Neighbours' Repair Contracts"
 CHO_ud_neighbour_contracts_spirit_desc:0 "Standing contracts keep the neighbours' merchant lines coming back to the northern yards."
 CHO_ud_northern_drydock:0 "The Northern Drydock"
 CHO_ud_northern_drydock_desc:0 "A drydock large enough for ocean freighters would make the northern yards a regional name. It will take two years and most of the yards' credit."
 CHO_ud_northern_yards_survey:0 "Open the Northern Yard Books"
 CHO_ud_northern_yards_survey_desc:0 "The three yards on the northern coast have built little since the old orders dried up. Their books will show what berths, cranes and skilled hands are still available."
 CHO_ud_onward_passage:0 "Onward Passage by Sea"
 CHO_ud_onward_passage_desc:0 "Refugees will be fed and treated, then carried onward to larger countries with more room. Chopinburg will be a harbour, not a home, and will say so plainly."
 CHO_ud_onward_passage_spirit:0 "Onward Passage"
 CHO_ud_onward_passage_spirit_desc:0 "Refugees are fed, treated and carried onward to larger countries."
 CHO_ud_price_board:0 "The Directorate's Price Board"
 CHO_ud_price_board_desc:0 "A board of the directorate will set the prices of rubber, fuel and flour each month, and publish them on the exchange floor at noon."
 CHO_ud_price_board_spirit:0 "The Price Board"
 CHO_ud_price_board_spirit_desc:0 "The directorate publishes the month's prices for rubber, fuel and flour on the exchange floor."
 CHO_ud_programme_adopted:0 "Chopinburg adopted its national programme from an older save"
 CHO_ud_quiet_continent:0 "The Quiet Summer"
 CHO_ud_quiet_continent_desc:0 "The continental crisis has been averted. The highland posts stand down to their peacetime strength, and the money saved can go to the coasts."
 CHO_ud_refugee_berths:0 "Berths for the Displaced"
 CHO_ud_refugee_berths_desc:0 "With Erusea closing its doors, refugees are arriving by sea. The yards' hulls and the island's villages will take them in and count them as residents."
 CHO_ud_refugee_berths_spirit:0 "Berths for the Displaced"
 CHO_ud_refugee_berths_spirit_desc:0 "Refugees who arrive by sea are taken in and counted as residents."
 CHO_ud_relief_fleet_spirit:0 "The Relief Fleet"
 CHO_ud_relief_fleet_spirit_desc:0 "Shelter hulls and coasters sail the damaged coasts with supplies and doctors."
 CHO_ud_repair_berths:0 "Repair Berths for Foreign Hulls"
 CHO_ud_repair_berths_desc:0 "Neighbouring merchant fleets need somewhere to scrape, patch and refit. The northern yards will advertise berths to any flag that pays its bills."
 CHO_ud_rubber_exchange:0 "A State Rubber Exchange"
 CHO_ud_rubber_exchange_desc:0 "All island latex will be sold through a single public exchange in the capital. Growers large and small get one price; the state takes a margin and the foreign buyers deal with one counter."
 CHO_ud_rubber_exchange_spirit:0 "The State Rubber Exchange"
 CHO_ud_rubber_exchange_spirit_desc:0 "All island latex is sold through one public counter at one published price."
 CHO_ud_rubber_for_the_continent:0 "Rubber for the Continent"
 CHO_ud_rubber_for_the_continent_desc:0 "Every army, airline and factory in Usea runs on tyres, seals and hoses. Chopinburg will sell its rubber to all of them under long contracts and keep the island at work."
 CHO_ud_rubber_research_station:0 "The Latex Research Station"
 CHO_ud_rubber_research_station_desc:0 "Chemists at the new works will study tapping schedules, blight and synthetic blends, so that the island is not ruined by a single bad season."
 CHO_ud_small_bloc_spirit:0 "A Bloc of the Small"
 CHO_ud_small_bloc_spirit_desc:0 "The council's smaller members agree their positions in advance and vote together."
 CHO_ud_small_members_caucus:0 "The Small Members' Caucus"
 CHO_ud_small_members_caucus_desc:0 "The breakfast meetings become a standing caucus with a shared secretariat. Larger members now consult it before proposing anything that costs the small ones money."
 CHO_ud_smallest_chair:0 "The Smallest Chair at the Table"
 CHO_ud_smallest_chair_desc:0 "Chopinburg sits on the Central Usean Treaty Council with neighbours many times its size. It can try to be useful to the large members or try to stand with the small ones."
 CHO_ud_smallholder_banks:0 "Smallholder Credit Banks"
 CHO_ud_smallholder_banks_desc:0 "New owners need seed money, tools and a bank that does not belong to the estate next door. Cooperative credit banks will open in every island village."
 CHO_ud_smallholder_charter:0 "The Smallholders' Charter"
 CHO_ud_smallholder_charter_desc:0 "Families who tap trees on rented ground will be offered title to it. The estates shrink, the island's smallholders multiply, and the state must administer thousands of new deeds."
 CHO_ud_smallholder_charter_spirit:0 "The Smallholders' Charter"
 CHO_ud_smallholder_charter_spirit_desc:0 "Thousands of island families now own the trees they tap."
 CHO_ud_smugglers_amnesty:0 "Amnesty for the Mule Trains"
 CHO_ud_smugglers_amnesty_desc:0 "Smugglers who register their animals and routes will be pardoned and licensed as carriers. The state gains drivers who know paths no surveyor has mapped."
 CHO_ud_split_island_harbour:0 "Deepen the Split Island Harbour"
 CHO_ud_split_island_harbour_desc:0 "Island rubber still leaves on lighters because the harbour is too shallow for coasters. Dredgers from the northern yards will deepen it to the estates' quays."
 CHO_ud_split_island_relief:0 "Relief for Split Island"
 CHO_ud_split_island_relief_desc:0 "With the ferries stopped, the island's harbours and villages need food, medicine and fuel. Relief will go first to the island, because the island feeds the treasury."
 CHO_ud_split_island_survey:0 "Survey the Split Island Estates"
 CHO_ud_split_island_survey_desc:0 "The rubber estates around Split Island are the richest ground in the country and the least governed. Surveyors will record who owns each estate, who works it and who is paid for its latex."
 CHO_ud_stonehenge_shadow:0 "Under the Railguns' Watch"
 CHO_ud_stonehenge_shadow_desc:0 "Stonehenge is complete in neutral San Salvacion. Chopinburg's air controllers will coordinate with the project's warning network so that civil traffic is grounded in time."
 CHO_ud_the_two_halls:0 "The Exchange Hall and the Union Hall"
 CHO_ud_the_two_halls_desc:0 "Two buildings in the capital now claim to speak for the country: the hall where rubber is priced and the hall where dockworkers meet. The government cannot ignore either."
 CHO_ud_transit_rules:0 "Write the Transit Rules"
 CHO_ud_transit_rules_desc:0 "Chopinburg's clerks will draft the council's rules for freight crossing member states, and make sure the highland crossings are counted fairly."
 CHO_ud_treaty_relief_call:0 "Invoke the Relief Clauses"
 CHO_ud_treaty_relief_call_desc:0 "Chopinburg will ask the treaty council to honour the relief clauses it fought for. Whatever the council sends, the asking itself will show who keeps promises."
 CHO_ud_treaty_relief_clauses:0 "Relief Clauses in the Treaty"
 CHO_ud_treaty_relief_clauses_desc:0 "Chopinburg will press for clauses that oblige members to help each other after a natural disaster. Small countries need such promises more than large ones."
 CHO_ud_trusted_traders:0 "The Trusted Traders' Pass"
 CHO_ud_trusted_traders_desc:0 "Known hauliers and highland families will carry a pass that lets them cross without search. Trade will speed up; so, the police warn, will everything else."
 CHO_ud_trusted_traders_spirit:0 "The Trusted Traders' Pass"
 CHO_ud_trusted_traders_spirit_desc:0 "Known hauliers and highland families cross without search."
 CHO_ud_union_hall_cabinet:0 "Cabinet in the Union Hall"
 CHO_ud_union_hall_cabinet_desc:0 "Ministers will sit in the union hall itself, where any member can attend the cabinet's weekly reading of its decisions."
 CHO_ud_union_hall_spirit:0 "Cabinet of the Union Hall"
 CHO_ud_union_hall_spirit_desc:0 "Ministers read their decisions aloud each week in the union hall."
 CHO_ud_war_beyond_the_highlands:0 "War Beyond the Highlands"
 CHO_ud_war_beyond_the_highlands_desc:0 "War has broken out on the continent, and Central Usea is at the centre of it. Chopinburg is a treaty member, not a combatant, and must now prove the difference every day."
 CHO_ud_wartime_rubber:0 "Wartime Rubber Prices"
 CHO_ud_wartime_rubber_desc:0 "Every army in Usea wants tyres. Chopinburg will sell to anyone at the published price and refuse every private arrangement, however generous."
 CHO_ud_wartime_rubber_spirit:0 "Wartime Rubber Prices"
 CHO_ud_wartime_rubber_spirit_desc:0 "Chopinburg sells rubber to every buyer at the published price and to none in private."
 CHO_ud_yard_apprentices:0 "Yard Apprentice Schools"
 CHO_ud_yard_apprentices_desc:0 "The yards' best riveters and fitters are past fifty. Apprentice schools will pass their skills to a new generation before they are lost."
 CHO_ud_yard_hulls:0 "Shelter Hulls in the Yards"
 CHO_ud_yard_hulls_desc:0 "Old hulls in the northern yards will be fitted as floating stores and dormitories that can move away from whatever coast is struck."
 CHO_ud_yard_relief_fleet:0 "The Yards' Relief Fleet"
 CHO_ud_yard_relief_fleet_desc:0 "The shelter hulls and every serviceable coaster will sail as a relief fleet along the damaged coasts, carrying supplies out and the injured home."
 CHO_ud_yard_wage_code:0 "The Yard Wage Code"
 CHO_ud_yard_wage_code_desc:0 "A national code will set wages, hours and safety rules in every yard. The yards will cost more and lose fewer men."
 CHO_ud_yard_wage_code_spirit:0 "The Yard Wage Code"
 CHO_ud_yard_wage_code_spirit_desc:0 "Wages, hours and safety rules are fixed by law in every yard."
 DOR_ud_anchorage_yards:0 "Yards for the Anchorage"
 DOR_ud_anchorage_yards_desc:0 "The yard owners of the Lowlands want the money spent on slipways and repair basins, so that ships calling at Dorondo are also built and mended here."
 DOR_ud_anchorage_yards_spirit:0 "Yards of the Anchorage"
 DOR_ud_anchorage_yards_spirit_desc:0 "Ships that call at Dorondo are increasingly built and mended here as well."
 DOR_ud_arsenal_orders:0 "Keep the Arsenals Working"
 DOR_ud_arsenal_orders_desc:0 "The works will keep their military lines open with orders from the republic's own small forces, so that the skills and the jobs do not drift away."
 DOR_ud_aurich_basin:0 "The Aurich Repair Basin"
 DOR_ud_aurich_basin_desc:0 "A dry dock at Aurich on the Spit will take damaged ships off the main anchorage and keep repair work out of the way of the commercial berths."
 DOR_ud_bilateral_desks:0 "Desks for the Neighbours"
 DOR_ud_bilateral_desks_desc:0 "Each neighbouring government gets a desk at the Foreign Ministry with a single official who knows its trade, its ports and its grievances."
 DOR_ud_cabinet_decrees:0 "Decrees of the Cabinet"
 DOR_ud_cabinet_decrees_desc:0 "Tariffs fixed for three years, the tribunal suspended but its awards honoured, and the harbour accounts published every month for anyone to read."
 DOR_ud_cabinet_decrees_spirit:0 "Decrees of the Cabinet"
 DOR_ud_cabinet_decrees_spirit_desc:0 "An emergency cabinet of administrators governs by published decree for a fixed term."
 DOR_ud_cabinet_mandate:0 "The Cabinet's Mandate Renewed"
 DOR_ud_cabinet_mandate_desc:0 "With the books balanced, the assembly renews the cabinet's mandate rather than resume its quarrels. The emergency has become the republic's ordinary government."
 DOR_ud_cabinet_mandate_spirit:0 "The Cabinet's Mandate"
 DOR_ud_cabinet_mandate_spirit_desc:0 "The emergency cabinet has become the republic's ordinary government, with balanced books and published accounts."
 DOR_ud_cabinet_office:0 "Harbour Emergency Cabinet"
 DOR_ud_cabinet_office_desc:0 "A cabinet of senior administrators governs by decree for a fixed term. It is an office, not a person; its members are not named in this provisional path."
 DOR_ud_civilian_contracts:0 "Civilian Contracts for the Works"
 DOR_ud_civilian_contracts_desc:0 "The Iggingen works will bid for civilian orders on the coast: rail cars, pumps and harbour cranes in place of the military contracts that are ending."
 DOR_ud_civilian_contracts_spirit:0 "Civilian Contracts at Iggingen"
 DOR_ud_civilian_contracts_spirit_desc:0 "The Iggingen works build rail cars, pumps and cranes for the coast in place of military orders."
 DOR_ud_closed_to_warships:0 "Closed to Warships"
 DOR_ud_closed_to_warships_desc:0 "The harbour stays open to commerce on equal terms and closed to every warship of every flag. Anti-aircraft batteries go up on the headlands."
 DOR_ud_closed_to_warships_spirit:0 "Closed to Warships"
 DOR_ud_closed_to_warships_spirit_desc:0 "The anchorage serves commerce on equal terms and turns away every warship."
 DOR_ud_coastal_lines:0 "Charter the Coastal Lines"
 DOR_ud_coastal_lines_desc:0 "Regular sailings to the neighbouring coasts will be chartered under the new registry, with published timetables and fares that a small trader can plan around."
 DOR_ud_compact_charter:0 "The Compact Charter"
 DOR_ud_compact_charter_desc:0 "The compact becomes law: tribunal awards guaranteed, apprenticeships funded, and every dispute on the quays heard in court before anyone walks out."
 DOR_ud_compact_charter_spirit:0 "The Compact Charter"
 DOR_ud_compact_charter_spirit_desc:0 "Tribunal awards are guaranteed and every dispute on the quays is heard in court first."
 DOR_ud_compact_office:0 "Social Compact Cabinet"
 DOR_ud_compact_office_desc:0 "The cabinet of the social compact governs on behalf of the parties that signed it. It is an office, not a person; its ministers are not named in this provisional path."
 DOR_ud_compact_ratified:0 "The Compact Ratified"
 DOR_ud_compact_ratified_desc:0 "The first election under the compact returns a mandate to keep it. The bargain is no longer one government's policy but the republic's settled order."
 DOR_ud_compact_ratified_spirit:0 "The Ratified Compact"
 DOR_ud_compact_ratified_spirit_desc:0 "Voters have renewed the social compact. It is the republic's settled order."
 DOR_ud_council_delegation:0 "A Full Delegation to the Council"
 DOR_ud_council_delegation_desc:0 "Dorondo will send permanent staff to the treaty council, seek a seat on every committee and have its shipping lawyers draft the clauses its ships sail under."
 DOR_ud_council_delegation_spirit:0 "A Full Treaty Delegation"
 DOR_ud_council_delegation_spirit_desc:0 "Dorondian staff sit on every committee of the treaty council and draft the clauses its ships sail under."
 DOR_ud_coup_season:0 "The Coup Season"
 DOR_ud_coup_season_desc:0 "Coups have broken out across Usea. Armed ships of uncertain loyalty are seen offshore, and the harbour must decide whom it lets in and whom it turns away."
 DOR_ud_crossing_commission:0 "Sit on the Border Commission"
 DOR_ud_crossing_commission_desc:0 "Dorondo will offer Ferustia a standing commission: monthly meetings, a register of crossings, and small disputes settled before they become incidents."
 DOR_ud_crossing_commission_spirit:0 "The Desert Road Commission"
 DOR_ud_crossing_commission_spirit_desc:0 "Dorondian and Ferustian officials meet monthly on the desert road to settle crossings and small disputes."
 DOR_ud_crossing_houses:0 "Crossing Houses on the Road"
 DOR_ud_crossing_houses_desc:0 "Customs and passport houses on the desert road will open on fixed hours, so that families, traders and workers can cross under a published routine."
 DOR_ud_desert_line:0 "Fortify the Desert Line"
 DOR_ud_desert_line_desc:0 "Entrenched posts and a reserve on the coast road will guard the border properly. A republic with little army needs walls more than conversations."
 DOR_ud_desert_line_spirit:0 "The Desert Line"
 DOR_ud_desert_line_spirit_desc:0 "Entrenched posts guard the Ferustian border. They are ordered to defend and never to advance."
 DOR_ud_desert_line_tt:0 "A defensive line only. No claim, core, border or war effect exists anywhere in this tree."
 DOR_ud_district_council:0 "An Elected District Council"
 DOR_ud_district_council_desc:0 "Iggingen will elect a council of its own with powers over schools, roads and the works, so that its people govern their own daily affairs."
 DOR_ud_district_prefecture:0 "A Prefecture from the Capital"
 DOR_ud_district_prefecture_desc:0 "A single appointed prefecture answering to Dorondo City will run the district. It will be efficient, accountable and unmistakably Dorondian."
 DOR_ud_dock_collectives:0 "The Dock Collectives"
 DOR_ud_dock_collectives_desc:0 "The stevedoring companies pass to collectives of their own workers, who will run the cranes and bid for cargo under the federation's published rates."
 DOR_ud_dock_unions:0 "The Dock Unions Ask to Be Heard"
 DOR_ud_dock_unions_desc:0 "Forty thousand stevedores, crane drivers and yard hands have signed a petition. They do not ask for wages; they ask for a court where grievances are heard."
 DOR_ud_emergency_cabinet:0 "An Emergency Cabinet"
 DOR_ud_emergency_cabinet_desc:0 "The assembly will suspend itself for a fixed term. A cabinet of administrators governs by decree, runs the harbour as one authority and balances the books."
 DOR_ud_evacuation_fleet:0 "Ships for an Evacuation"
 DOR_ud_evacuation_fleet_desc:0 "Every hull in the merchant fleet will be registered for evacuation, fuel reserved and routes charted, so the waterfront can be emptied in days if needed."
 DOR_ud_evacuation_fleet_spirit:0 "The Evacuation Fleet"
 DOR_ud_evacuation_fleet_spirit_desc:0 "Every Dorondian hull is registered, fuelled and routed for an evacuation of the waterfront."
 DOR_ud_families_across:0 "Families Across the Line"
 DOR_ud_families_across_desc:0 "Hundreds of letters ask for passes across the desert road. The district has no power to answer them; only the governments in two capitals can."
 DOR_ud_federation_congress:0 "Congress of the Federation"
 DOR_ud_federation_congress_desc:0 "Delegates of every council meet in Dorondo City to adopt a permanent constitution for a workers' republic and elect its standing federation council."
 DOR_ud_federation_congress_spirit:0 "The Workers' Republic"
 DOR_ud_federation_congress_spirit_desc:0 "A congress of the councils has given the federation a permanent constitution."
 DOR_ud_federation_councils:0 "Councils of the Quays"
 DOR_ud_federation_councils_desc:0 "Every quay, yard and warehouse elects a council to run its work. The councils send delegates to the federation and can recall them at any meeting."
 DOR_ud_federation_councils_spirit:0 "Councils of the Quays"
 DOR_ud_federation_councils_spirit_desc:0 "Every quay, yard and warehouse is run by an elected council of the people who work there."
 DOR_ud_federation_office:0 "Council of the Workers' Federation"
 DOR_ud_federation_office_desc:0 "Delegates of the quays, the yards and the merchant crews govern through the federation council. It is an office, not a person; its members are not named in this provisional path."
 DOR_ud_fleet_cooperative:0 "The Fleet Cooperative"
 DOR_ud_fleet_cooperative_desc:0 "Ships of the merchant fleet become a cooperative of their crews. Masters are elected, profits are shared and the Dorondian flag stays at the stern."
 DOR_ud_great_anchorage:0 "Survey the Great Anchorage"
 DOR_ud_great_anchorage_desc:0 "Harbour engineers will chart every berth, channel and quay of the anchorage at Dorondo City before the republic decides what the harbour should become next."
 DOR_ud_harbour_ledger:0 "The Republic's Harbour Ledger"
 DOR_ud_harbour_ledger_desc:0 "Every spring the Port Office publishes the ledger of the great anchorage. This year the cabinet wants more than a record of ships: it wants a plan for the decade."
 DOR_ud_harbour_of_the_republic:0 "Harbour of the Republic"
 DOR_ud_harbour_of_the_republic_desc:0 "Whatever the anchorage chose to become, it is now planned as a single public asset with a published programme, rather than a quarrel between its tenants."
 DOR_ud_harbour_of_the_republic_spirit:0 "Harbour of the Republic"
 DOR_ud_harbour_of_the_republic_spirit_desc:0 "The anchorage is planned and run as a single public asset with a published programme."
 DOR_ud_harbour_pensions:0 "Pensions for the Quays"
 DOR_ud_harbour_pensions_desc:0 "Stevedores and yard hands will retire on a public pension paid from harbour dues, so that a lifetime on the quays ends in something better than charity."
 DOR_ud_harbour_police:0 "The Harbour Constabulary"
 DOR_ud_harbour_police_desc:0 "A constabulary of the port will keep the quays working through any dispute, so that a picket line cannot become a blockade of the whole anchorage."
 DOR_ud_harbour_radar:0 "Radar on the Headlands"
 DOR_ud_harbour_radar_desc:0 "Radar stations on the headlands will track every hull in the approaches by night and in fog, and give the pilots their first true picture of the harbour."
 DOR_ud_hospital_ships:0 "Hospital Ships"
 DOR_ud_hospital_ships_desc:0 "Liners and ferries will be fitted as hospital ships and moored in the anchorage, with doctors from the capital and stores bought on the republic's credit."
 DOR_ud_hospital_ships_spirit:0 "Hospital Ships"
 DOR_ud_hospital_ships_spirit_desc:0 "Liners and ferries moored in the anchorage serve as hospitals for the landings."
 DOR_ud_iggingen_administration:0 "The Iggingen Administration"
 DOR_ud_iggingen_administration_desc:0 "Iggingen has been governed from the coast as an afterthought for a decade. The republic will decide how the district lives, without touching whose it is."
 DOR_ud_iggingen_administration_tt:0 "Opens the governance of the Iggingen district. Its ownership, cores and borders are unchanged and cannot be changed by this tree."
 DOR_ud_iggingen_arsenals_spirit:0 "The Iggingen Arsenals"
 DOR_ud_iggingen_arsenals_spirit_desc:0 "The works keep their military lines open with orders from the republic's own forces."
 DOR_ud_iggingen_council_spirit:0 "The Iggingen District Council"
 DOR_ud_iggingen_council_spirit_desc:0 "Iggingen elects its own council for schools, roads and the works. The district governs its own daily life."
 DOR_ud_iggingen_prefecture_spirit:0 "The Iggingen Prefecture"
 DOR_ud_iggingen_prefecture_spirit_desc:0 "A single appointed prefecture runs the district on behalf of the capital."
 DOR_ud_impact_landings:0 "Ships Out of the Dark"
 DOR_ud_impact_landings_desc:0 "Ulysses has broken apart over the world. Within days ships begin arriving at the anchorage crowded with passengers from coasts the pilots know only from charts."
 DOR_ud_insured_fleet_spirit:0 "The Insured Fleet"
 DOR_ud_insured_fleet_spirit_desc:0 "A republican pool insures every hull under the Dorondian flag, and owners stay with the registry when rates rise elsewhere."
 DOR_ud_interior_rail:0 "Rail to the Interior"
 DOR_ud_interior_rail_desc:0 "A line from the interior mines to the Lowlands smelters will carry ore to the coast without the long haul on the desert road past the border posts."
 DOR_ud_isaf_berths:0 "Designated Berths for ISAF"
 DOR_ud_isaf_berths_desc:0 "ISAF convoys may use designated berths for supplies and medical cargo, under Dorondian pilots and Dorondian rules, without the republic joining the alliance."
 DOR_ud_isaf_berths_spirit:0 "Designated ISAF Berths"
 DOR_ud_isaf_berths_spirit_desc:0 "ISAF supply and medical convoys use designated berths under Dorondian pilots. Dorondo has not joined the alliance."
 DOR_ud_ledger_after_the_war:0 "The Ledger After the War"
 DOR_ud_ledger_after_the_war_desc:0 "The war is over. The anchorage has stayed busy throughout, and the coasts now come asking for berths, yards and credit for their own recovery."
 DOR_ud_line_garrisons:0 "Garrisons of the Line"
 DOR_ud_line_garrisons_desc:0 "Engineers will dig the posts in and the reserve will exercise on the coast road each season, so that the line is defended by men who know it."
 DOR_ud_lowlands_slipways:0 "The Lowlands Slipways"
 DOR_ud_lowlands_slipways_desc:0 "New slipways in the Dorondo Lowlands will let the yards lay down larger hulls, and train a generation of shipwrights the republic has been importing."
 DOR_ud_merchant_insurance:0 "Insure the Merchant Fleet"
 DOR_ud_merchant_insurance_desc:0 "A republican insurance pool will cover hulls under the Dorondian flag, so that owners stay with the registry when rates rise elsewhere on the coast."
 DOR_ud_merchant_registry:0 "An Open Ship Registry"
 DOR_ud_merchant_registry_desc:0 "Low fees, light inspection and a Dorondian flag for any hull whose owner will pay. The shipping houses promise that the money will follow the flag."
 DOR_ud_neighbour_shipping:0 "Shipping for the Neighbours"
 DOR_ud_neighbour_shipping_desc:0 "Delarus, Calladen and Rohden will be offered berths and freight rates at the anchorage on standing terms, renewed every year."
 DOR_ud_neighbour_shipping_spirit:0 "Shipping for the Neighbours"
 DOR_ud_neighbour_shipping_spirit_desc:0 "Neighbouring governments hold standing berths and freight rates at the anchorage."
 DOR_ud_neutral_anchorage:0 "A Neutral Anchorage"
 DOR_ud_neutral_anchorage_desc:0 "War has broken out on the continent. Every navy and shipping agent in Usea now wants berths, fuel and pilots from the finest anchorage on the coast."
 DOR_ud_night_pilots:0 "Pilots by Night"
 DOR_ud_night_pilots_desc:0 "The pilots' service will guide ships in at every hour, so that the anchorage never closes for darkness and a storm never strands a convoy offshore."
 DOR_ud_open_anchorage:0 "Open the Anchorage"
 DOR_ud_open_anchorage_desc:0 "Every ship that reaches Dorondo may land its passengers, and the republic will count them as future citizens of a country that has always lived by arrivals."
 DOR_ud_open_anchorage_spirit:0 "The Open Anchorage"
 DOR_ud_open_anchorage_spirit_desc:0 "Every ship may land its passengers, and the republic counts them as future citizens."
 DOR_ud_open_crossings_spirit:0 "Open Crossings"
 DOR_ud_open_crossings_spirit_desc:0 "Customs and passport houses on the desert road open on fixed hours for families, traders and workers."
 DOR_ud_open_registry_spirit:0 "The Open Registry"
 DOR_ud_open_registry_spirit_desc:0 "Any hull whose owner pays the fee may fly the Dorondian flag. The anchorage is busier and the inspectors are busier still."
 DOR_ud_open_shop:0 "Keep the Harbour Open Shop"
 DOR_ud_open_shop_desc:0 "Hiring on the quays will stay open to any man with or without a union card. The shipping houses argue that an open harbour must be open to labour too."
 DOR_ud_open_shop_spirit:0 "The Open Shop"
 DOR_ud_open_shop_spirit_desc:0 "Hiring on the quays is open to any worker, union card or not. The cranes move quickly and the unions are bitter."
 DOR_ud_peace_holds:0 "The Peace Holds"
 DOR_ud_peace_holds_desc:0 "The continental crisis has been averted. The insurance markets return to their old rates, and the anchorage goes back to the business of ordinary trade."
 DOR_ud_pilots_service:0 "A Modern Pilots' Service"
 DOR_ud_pilots_service_desc:0 "The harbour pilots ask for radar, night lights and the authority to close the approaches in an emergency. It earns the least and protects the most."
 DOR_ud_pilots_service_spirit:0 "The Pilots' Service"
 DOR_ud_pilots_service_spirit_desc:0 "Pilots with radar and night lights guide every ship through the approaches and can close them in an emergency."
 DOR_ud_port_authority:0 "A Single Port Authority"
 DOR_ud_port_authority_desc:0 "Every berth, warehouse and channel of the republic will be run by one public port authority under the cabinet, with a single budget and a single ledger."
 DOR_ud_port_boards:0 "Elected Port Boards"
 DOR_ud_port_boards_desc:0 "Each district of the harbour will elect a board of owners, workers and residents to run its berths, its warehouses and its share of the dues."
 DOR_ud_port_boards_spirit:0 "Elected Port Boards"
 DOR_ud_port_boards_spirit_desc:0 "Owners, workers and residents run each district of the harbour through elected boards."
 DOR_ud_programme_adopted:0 "Dorondo adopted its national programme from an older save"
 DOR_ud_quay_bunkers:0 "Bunkers Under the Quays"
 DOR_ud_quay_bunkers_desc:0 "Shelters will be cut into the rock beneath the quays and stocked with water and stores, keeping the people of the capital close to the harbour that feeds them."
 DOR_ud_quay_bunkers_spirit:0 "Bunkers Under the Quays"
 DOR_ud_quay_bunkers_spirit_desc:0 "Shelters cut into the rock beneath the quays are stocked for the people of the capital."
 DOR_ud_quiet_member:0 "A Quiet Member"
 DOR_ud_quiet_member_desc:0 "The republic will stay present and reliable on the council but make its own arrangements with its neighbours, desk by desk and contract by contract."
 DOR_ud_quiet_member_spirit:0 "A Quiet Member"
 DOR_ud_quiet_member_spirit_desc:0 "Dorondo is reliable on the council and makes its own arrangements with its neighbours."
 DOR_ud_republic_at_the_crossroads:0 "The Republic at the Crossroads"
 DOR_ud_republic_at_the_crossroads_desc:0 "Three sessions of the assembly have produced no stable majority. The old bargain between the houses, the docks and the state has broken, and something must replace it."
 DOR_ud_reserve_fund:0 "The Harbour Reserve Fund"
 DOR_ud_reserve_fund_desc:0 "A share of every harbour due goes into a reserve fund against hard years, invested abroad and drawn on only by a vote of the whole cabinet."
 DOR_ud_reserve_fund_spirit:0 "The Harbour Reserve Fund"
 DOR_ud_reserve_fund_spirit_desc:0 "A share of every harbour due is set aside against hard years."
 DOR_ud_social_compact:0 "Sign the Social Compact"
 DOR_ud_social_compact_desc:0 "The shipping houses, the dock unions and the government will sign a written bargain, renewed at every election, with the tribunal at its centre."
 DOR_ud_sorted_landings:0 "Sorted Landings"
 DOR_ud_sorted_landings_desc:0 "Every passenger is fed and treated, but those the republic cannot keep are sent onward, and the harbour says so honestly at every berth."
 DOR_ud_sorted_landings_spirit:0 "Sorted Landings"
 DOR_ud_sorted_landings_spirit_desc:0 "Passengers are fed and treated, and those the republic cannot keep are sent onward."
 DOR_ud_transit_clauses:0 "Draft the Transit Clauses"
 DOR_ud_transit_clauses_desc:0 "Dorondian lawyers will draft the council's clauses on emergency shipping and transit, written around the anchorage that most members' cargo passes through."
 DOR_ud_treaty_guarantee:0 "The Treaty as a Guarantee"
 DOR_ud_treaty_guarantee_desc:0 "A small republic with a small army cannot defend its anchorage alone. The treaty council's clauses on transit and mutual help are, in effect, Dorondo's defence."
 DOR_ud_tribunal_awards:0 "Honour the Tribunal's Awards"
 DOR_ud_tribunal_awards_desc:0 "The republic will guarantee payment of every award the tribunal makes, so that a stevedore who wins his case is paid even if his employer folds."
 DOR_ud_ulysses_warning:0 "The Warning from Central Usea"
 DOR_ud_ulysses_warning_desc:0 "Central Usea has announced that the asteroid Ulysses will strike the Earth. A port republic thinks first about the sea, and about what the anchorage is for."
 DOR_ud_wage_tribunal:0 "A Standing Wage Tribunal"
 DOR_ud_wage_tribunal_desc:0 "The old tribunals of wages and conditions will be restored, with judges from the bench and assessors from the unions and the shipping houses."
 DOR_ud_wage_tribunal_spirit:0 "The Wage Tribunal"
 DOR_ud_wage_tribunal_spirit_desc:0 "Grievances on the quays are heard in court before they become strikes."
 DOR_ud_western_interior:0 "Mines of the Western Interior"
 DOR_ud_western_interior_desc:0 "The inland district on the Ferustian border holds steel ore and bauxite that the coast has never properly worked. Surveyors will open new seams."
 DOR_ud_workers_federation:0 "The Workers' Federation"
 DOR_ud_workers_federation_desc:0 "The dock federations, the yards of the Lowlands and the crews of the merchant fleet will form a council of the workers' federation and take the ministries."
 FRU_ud_after_the_coup:0 "The Coup Across the Continent"
 FRU_ud_after_the_coup_desc:0 "Coup attempts have broken out across Usea. Ferustia's border posts are ordered to turn back armed men of every flag and to take in the families who follow them."
 FRU_ud_after_the_war:0 "Ferustia After the War"
 FRU_ud_after_the_war_desc:0 "The war is over. Ferustia emerges unbombed, unoccupied and owed a great many favours. The question is what kind of state it wants to be in a quieter Usea."
 FRU_ud_armed_passes:0 "Armed Neutrality on the Passes"
 FRU_ud_armed_passes_desc:0 "No foreign army will cross Ferustia. Anti-aircraft batteries go up on the mountain approaches, and the passes are closed to all military traffic."
 FRU_ud_armed_passes_spirit:0 "Armed Passes"
 FRU_ud_armed_passes_spirit_desc:0 "The mountain approaches are closed to every army and covered by anti-aircraft batteries."
 FRU_ud_armed_watch:0 "The Armed Watch"
 FRU_ud_armed_watch_desc:0 "The rebellion decrees become a standing watch: fewer slogans, more trained men, and a clear rule that the border posts defend and do not advance."
 FRU_ud_armed_watch_spirit:0 "The Armed Watch"
 FRU_ud_armed_watch_spirit_desc:0 "A standing watch on the Dorondian border replaces the rebellion decrees. Its orders are to defend, never to advance."
 FRU_ud_armed_watch_tt:0 "Replaces the inherited Dorondian Rebelion spirit with a defensive standing watch. Borders, cores and claims are unchanged."
 FRU_ud_between_the_fronts:0 "Between the Fronts"
 FRU_ud_between_the_fronts_desc:0 "War has broken out on the continent. Ferustia is not a party to it, but its airspace, its roads and its markets are suddenly of interest to every army in Usea."
 FRU_ud_border_commission:0 "A Standing Border Commission"
 FRU_ud_border_commission_desc:0 "Officials from both sides of the Altoora road will meet monthly to settle crossings, water rights and stray livestock. It is not peace, but it is a habit that could become one."
 FRU_ud_border_commission_spirit:0 "The Altoora Border Commission"
 FRU_ud_border_commission_spirit_desc:0 "Monthly meetings on the desert road settle crossings and disputes before they become incidents."
 FRU_ud_citizen_reserve:0 "A Citizen Reserve"
 FRU_ud_citizen_reserve_desc:0 "The martial clubs and village musters will become a registered reserve with fixed obligations, civilian officers and a short annual camp."
 FRU_ud_citizen_reserve_spirit:0 "The Citizen Reserve"
 FRU_ud_citizen_reserve_spirit_desc:0 "The old martial clubs have become a registered reserve with civilian officers and fixed obligations."
 FRU_ud_civil_defence_wardens:0 "Civil Defence Wardens"
 FRU_ud_civil_defence_wardens_desc:0 "Each reserve district will name wardens to run sirens, shelters and first aid. In peacetime they inspect cellars; in a crisis they will be the state on every street."
 FRU_ud_close_the_ledger:0 "Close the Ledger of Loss"
 FRU_ud_close_the_ledger_desc:0 "When the last emergency directive is retired, the plains economy will be judged by what it makes rather than by what it lost. The ministry can finally close the ledger."
 FRU_ud_commission_hearings:0 "Public Commission Hearings"
 FRU_ud_commission_hearings_desc:0 "Families divided by the rebellion will be allowed to testify before the commission. Their stories will make the dispute harder to exploit and easier to live with."
 FRU_ud_commune_assemblies:0 "Assemblies of the Commune"
 FRU_ud_commune_assemblies_desc:0 "Every works and estate elects an assembly. The assemblies send delegates to Ganzir and can recall them by a simple majority."
 FRU_ud_commune_assemblies_spirit:0 "Assemblies of the Commune"
 FRU_ud_commune_assemblies_spirit_desc:0 "Every works and estate elects an assembly with the power to recall its delegates."
 FRU_ud_commune_congress:0 "The Congress of the Commune"
 FRU_ud_commune_congress_desc:0 "Delegates from every assembly meet in Ganzir to adopt a permanent constitution for the Ferustian Commune and elect its standing council."
 FRU_ud_commune_congress_spirit:0 "The Congress of the Commune"
 FRU_ud_commune_congress_spirit_desc:0 "A permanent constitution and standing council govern the Ferustian Commune."
 FRU_ud_commune_office:0 "Council of the Ganzir Commune"
 FRU_ud_commune_office_desc:0 "Delegates of the works, the railways and the plantations govern through the council of the commune. It is an office, not a person; its members are not named in this provisional path."
 FRU_ud_constitutional_convention:0 "Call a Constitutional Convention"
 FRU_ud_constitutional_convention_desc:0 "Delegates from every province will draft a republic's constitution in Ganzir. The executive will hand its powers to a presidium until the first free ballot."
 FRU_ud_controlled_passage:0 "Controlled Passage"
 FRU_ud_controlled_passage_desc:0 "Refugees will be fed, treated and moved onward under escort. Ferustia will be a corridor, not a destination, and it will say so at every crossing."
 FRU_ud_controlled_passage_spirit:0 "Controlled Passage"
 FRU_ud_controlled_passage_spirit_desc:0 "Refugees are fed, treated and escorted onward. Ferustia is a corridor, not a destination."
 FRU_ud_convention_charter:0 "The Convention Charter"
 FRU_ud_convention_charter_desc:0 "The charter guarantees courts, a free press and provincial seats. It also requires every ministry to publish its accounts, which the ministries like least."
 FRU_ud_convention_charter_spirit:0 "The Convention Charter"
 FRU_ud_convention_charter_spirit_desc:0 "A presidium governs under a written charter until the first republican ballot."
 FRU_ud_convention_office:0 "Convention Presidium"
 FRU_ud_convention_office_desc:0 "The presidium of Ferustia's constitutional convention governs until the first republican ballot. It is an office, not a person; its members are not named in this provisional path."
 FRU_ud_count_the_works:0 "Count the Plains Works"
 FRU_ud_count_the_works_desc:0 "Inspectors will walk every surviving plant on the Plains of Ganzir and record what can run, what can be repaired and what left with the Dorondian districts."
 FRU_ud_desert_road_watch:0 "Watch the Desert Road"
 FRU_ud_desert_road_watch_desc:0 "Patrols on the Altoora road will be relieved weekly and logged daily. A grievance kept by tired soldiers is a war waiting for an accident."
 FRU_ud_factory_councils:0 "Factory Councils"
 FRU_ud_factory_councils_desc:0 "Councils of workers and engineers will set production plans for each plant, with the commune's planners reconciling them every quarter."
 FRU_ud_field_hospitals:0 "Field Hospitals in Ganzir"
 FRU_ud_field_hospitals_desc:0 "The capital's hospitals will treat the wounded of every side who reach Ferustian soil, under the same rules for all."
 FRU_ud_field_hospitals_spirit:0 "Field Hospitals"
 FRU_ud_field_hospitals_spirit_desc:0 "Ganzir's hospitals treat the wounded of every side under the same rules."
 FRU_ud_first_republic_ballot:0 "The First Republican Ballot"
 FRU_ud_first_republic_ballot_desc:0 "The presidium's mandate ends with a national vote. Whoever wins will govern a republic that the convention built and the provinces now share."
 FRU_ud_ganzir_airfield:0 "Extend the Ganzir Airfield"
 FRU_ud_ganzir_airfield_desc:0 "A landlocked state needs an air bridge it controls. The capital airfield will be lengthened for heavy transports and given a proper all-weather approach."
 FRU_ud_ganzir_commune:0 "Proclaim the Ganzir Commune"
 FRU_ud_ganzir_commune_desc:0 "Factory delegates, rail crews and plantation workers will govern through a council of the commune. The old executive's ministries will answer to elected delegates."
 FRU_ud_ganzir_foundries:0 "Relight the Ganzir Foundries"
 FRU_ud_ganzir_foundries_desc:0 "The oldest foundries in the capital district were banked in the bad years. Their furnaces need firebrick, coke and a promise that the work will not stop again in a year."
 FRU_ud_ganzir_free_press:0 "A Free Press in Ganzir"
 FRU_ud_ganzir_free_press_desc:0 "Censorship offices close. Newspapers will print what they can prove, and the government will answer what they print."
 FRU_ud_garrison_and_citizen:0 "The Garrison and the Citizen"
 FRU_ud_garrison_and_citizen_desc:0 "Ferustia has long expected every citizen to carry a rifle in a crisis. The executive must decide whether that tradition becomes a modern reserve or a professional mountain army."
 FRU_ud_garrison_council:0 "Form the Garrison Council"
 FRU_ud_garrison_council_desc:0 "Commanders of the mountain garrisons will govern as a council, with the plains administration under their orders. Order first; politics, perhaps, later."
 FRU_ud_garrison_office:0 "Garrison Council"
 FRU_ud_garrison_office_desc:0 "The commanders of the mountain garrisons govern as a council. It is an office, not a person; its members are not named in this provisional path."
 FRU_ud_garrison_ordinances:0 "Garrison Ordinances"
 FRU_ud_garrison_ordinances_desc:0 "The council governs by numbered ordinances read on the radio at noon. They are short, specific and enforced by the nearest post."
 FRU_ud_garrison_ordinances_spirit:0 "Garrison Ordinances"
 FRU_ud_garrison_ordinances_spirit_desc:0 "The garrison council governs by short numbered ordinances enforced by the nearest post."
 FRU_ud_grievance_posts_spirit:0 "The Grievance Posts"
 FRU_ud_grievance_posts_spirit_desc:0 "Ferustia keeps its claims in its speeches and its soldiers at their posts. Neither advances."
 FRU_ud_high_pass_battalions:0 "The High Pass Battalions"
 FRU_ud_high_pass_battalions_desc:0 "Three battalions will winter in the high passes, train with skis and mules, and keep the mountain roads open for the plains below."
 FRU_ud_iggingen_file:0 "Open the Iggingen File"
 FRU_ud_iggingen_file_desc:0 "The rebellion left Iggingen and its works under Dorondian administration. Before anyone speaks of it in public, the executive wants one honest file on what Ferustia can and cannot do."
 FRU_ud_iggingen_file_tt:0 "Opens the Iggingen question. No claim, core, border or war effect exists anywhere in this tree."
 FRU_ud_ilsede_machine_shops:0 "The Machine Shops of Ilsede"
 FRU_ud_ilsede_machine_shops_desc:0 "Ilsede kept its machine shops when larger plants closed. Given orders and a rail spur, they can make the parts every other rebuilt works will need."
 FRU_ud_impact_night:0 "The Night of the Fall"
 FRU_ud_impact_night_desc:0 "Ulysses has broken apart over the world. Whatever the night did elsewhere, its consequences will reach the plains within days: by the railways, through the markets and with the refugees."
 FRU_ud_isaf_overflight:0 "The Overflight Arrangement"
 FRU_ud_isaf_overflight_desc:0 "ISAF has asked for permission to cross Ferustian airspace with transports and medical flights. Ferustia will allow it, under its own controllers, without joining the alliance."
 FRU_ud_long_grievance:0 "Keep the Long Grievance"
 FRU_ud_long_grievance_desc:0 "The state will say plainly that it has not forgotten Iggingen, and will keep its border posts manned. It will not fire the first shot, and it will not pretend to be satisfied."
 FRU_ud_mend_the_sector:0 "Mend the Fractured Sector"
 FRU_ud_mend_the_sector_desc:0 "The census, the furnaces and the contracts must now become one economy again. The emergency ledger that has governed industry since the rebellion can be rewritten."
 FRU_ud_mend_the_sector_tt:0 "Ends the inherited Fractured Economic Sector spirit and replaces it with the lighter Mending the Sector."
 FRU_ud_mending_sector_spirit:0 "Mending the Sector"
 FRU_ud_mending_sector_spirit_desc:0 "The emergency ledger is being rewritten. The losses of the rebellion still weigh on industry, but no longer govern it."
 FRU_ud_mountain_corps:0 "A Professional Mountain Corps"
 FRU_ud_mountain_corps_desc:0 "The state will pay for fewer, better soldiers: long-service battalions that know every pass in the Waiapolo range in snow and in fog."
 FRU_ud_mountain_corps_spirit:0 "The Mountain Corps"
 FRU_ud_mountain_corps_spirit_desc:0 "Long-service battalions hold the passes. They are few, expensive and very good."
 FRU_ud_mountain_shelters:0 "Shelters Under the Mountains"
 FRU_ud_mountain_shelters_desc:0 "Mine galleries and railway tunnels in the Waiapolo range will be fitted as shelters, with water, beds and stores for the plains towns."
 FRU_ud_mountain_shelters_spirit:0 "Shelters Under the Mountains"
 FRU_ud_mountain_shelters_spirit_desc:0 "Galleries in the Waiapolo range are stocked to shelter the plains towns."
 FRU_ud_northern_corridor_spirit:0 "The Northern Corridor"
 FRU_ud_northern_corridor_spirit_desc:0 "Ferustian freight reaches the coast through Bulgurdarest's yards under a standing transit arrangement."
 FRU_ud_northern_transit:0 "The Northern Transit"
 FRU_ud_northern_transit_desc:0 "Freight can reach the coast through Bulgurdarest's rail yards. The northern route is longer, but it depends on a neighbour with no quarrel with Ferustia."
 FRU_ud_observer_reports:0 "Reports from the Chamber"
 FRU_ud_observer_reports_desc:0 "A small staff will turn council minutes into briefings for every ministry. Knowing what the neighbours plan is cheaper than guessing."
 FRU_ud_observer_seat:0 "Ask for an Observer's Chair"
 FRU_ud_observer_seat_desc:0 "Ferustia will ask to observe council sessions: no vote, no obligations, but a chance to hear decisions before they reach the border posts."
 FRU_ud_open_plains_spirit:0 "Open Plains"
 FRU_ud_open_plains_spirit_desc:0 "Refugees are settled on the plains and counted as future citizens."
 FRU_ud_open_press_spirit:0 "A Free Press"
 FRU_ud_open_press_spirit_desc:0 "Ferustian newspapers print what they can prove. Ministers have learned to read them."
 FRU_ud_open_the_plains:0 "Open the Plains"
 FRU_ud_open_the_plains_desc:0 "With Erusea closing its doors, refugees are walking inland. Ferustia will receive them, settle them on the plains and count them as future citizens."
 FRU_ud_order_of_the_plains:0 "The Standing Order of the Plains"
 FRU_ud_order_of_the_plains_desc:0 "The temporary council becomes the permanent form of the state: a garrison executive with a civilian cabinet that advises but does not decide."
 FRU_ud_overflight_arrangement_spirit:0 "The Overflight Arrangement"
 FRU_ud_overflight_arrangement_spirit_desc:0 "ISAF transports and medical flights may cross Ferustian airspace under Ferustian control. Ferustia has not joined the alliance."
 FRU_ud_pass_commanders:0 "Commanders of the Passes"
 FRU_ud_pass_commanders_desc:0 "Each pass will have a single commander answerable for road, rail and garrison, with authority over civilian officials in the district."
 FRU_ud_pass_railway_spirit:0 "The Pass Railway"
 FRU_ud_pass_railway_spirit_desc:0 "The Mount Waia line carries freight over the range in every season."
 FRU_ud_pass_survey:0 "Survey the Waiapolo Passes"
 FRU_ud_pass_survey_desc:0 "Every tonne that leaves Ferustia must climb out of the plains. Engineers will survey the passes through the Waiapolo range and Mount Waia before any money is spent."
 FRU_ud_plains_dispersal:0 "Disperse the Plains"
 FRU_ud_plains_dispersal_desc:0 "Rather than gather people where a single strike could reach them, the state will spread stores, clinics and workshops across every district of the plains."
 FRU_ud_plains_dispersal_spirit:0 "A Dispersed Plains"
 FRU_ud_plains_dispersal_spirit_desc:0 "Stores, clinics and workshops are spread across every district of the plains."
 FRU_ud_plains_works:0 "Rebuild the Plains Works"
 FRU_ud_plains_works_board_spirit:0 "Plains Works Board"
 FRU_ud_plains_works_board_spirit_desc:0 "A public board directs the rebuilding of the plains factories. It spends heavily and answers to the executive."
 FRU_ud_plains_works_desc:0 "The state will rebuild heavy industry itself, in Ganzir and Ilsede, with public credit and public managers. Slow, expensive, and entirely under Ferustian control."
 FRU_ud_plantation_charters:0 "Charter the Plantations"
 FRU_ud_plantation_charters_desc:0 "Each concession needs a charter that says how much latex it owes, who keeps the roads, and what happens to the estate workers when prices fall."
 FRU_ud_programme_adopted:0 "Ferustia adopted its national programme from an older save"
 FRU_ud_provincial_seats:0 "Seats for the Provinces"
 FRU_ud_provincial_seats_desc:0 "The mountain districts and the desert road will each send members to the assembly, so that Ganzir no longer decides everything alone."
 FRU_ud_question_of_the_executive:0 "The Question of the Executive"
 FRU_ud_question_of_the_executive_desc:0 "The State Executive has governed by emergency since the rebellion. Soldiers, assemblymen and factory delegates all claim to know what should replace it."
 FRU_ud_ration_boards:0 "Ration Boards"
 FRU_ud_ration_boards_desc:0 "Fuel, flour and tyres will be allocated by district boards under military supervision. Queues will be shorter; complaints will be quieter."
 FRU_ud_ration_boards_spirit:0 "District Ration Boards"
 FRU_ud_ration_boards_spirit_desc:0 "Scarce goods are allocated by district boards under military supervision."
 FRU_ud_relief_trains:0 "Relief Trains over the Passes"
 FRU_ud_relief_trains_desc:0 "Every serviceable locomotive will run relief trains: grain out of the plains, medicine in from the coasts, and the injured to Ganzir's hospitals."
 FRU_ud_relief_trains_spirit:0 "Relief Trains"
 FRU_ud_relief_trains_spirit_desc:0 "Every serviceable locomotive runs relief between the plains, the passes and the coasts."
 FRU_ud_republic_charter_spirit:0 "The Republican Charter"
 FRU_ud_republic_charter_spirit_desc:0 "The convention's republic has passed its first national vote."
 FRU_ud_retire_the_rebellion:0 "Retire the Rebellion Decrees"
 FRU_ud_retire_the_rebellion_desc:0 "The emergency decrees that treat Dorondo as a rebellion in progress have outlived their use. Ferustia will repeal them and govern its own provinces as a state at peace."
 FRU_ud_retire_the_rebellion_tt:0 "Ends the inherited Dorondian Rebelion spirit. Borders, cores and claims are unchanged."
 FRU_ud_rubber_concessions:0 "Open the Rubber Concessions"
 FRU_ud_rubber_concessions_desc:0 "The plantations of Sandbury and Mount Waia can earn money faster than any rebuilt foundry. Concession houses will lease the estates and pay the state in hard currency."
 FRU_ud_rubber_concessions_spirit:0 "Rubber Concession Houses"
 FRU_ud_rubber_concessions_spirit_desc:0 "Leased plantations pay the state in hard currency. The estate workers are less pleased than the treasury."
 FRU_ud_rubber_cooperatives:0 "Rubber Cooperatives"
 FRU_ud_rubber_cooperatives_desc:0 "The plantations pass to the estate workers as cooperatives. The commune buys their latex at a fixed price and sells it abroad."
 FRU_ud_rubber_export_contracts:0 "Sign the Export Contracts"
 FRU_ud_rubber_export_contracts_desc:0 "Concession rubber is worth little until it leaves the country. Long contracts with buyers beyond the passes will steady the price and the state's revenue."
 FRU_ud_rubber_export_houses_spirit:0 "Rubber Export Houses"
 FRU_ud_rubber_export_houses_spirit_desc:0 "Long contracts beyond the passes have steadied the price of Ferustian rubber and the revenue that depends on it."
 FRU_ud_self_reliance_spirit:0 "Self-Reliance"
 FRU_ud_self_reliance_spirit_desc:0 "Ferustia keeps its own counsel and its own reserves, and pays for both."
 FRU_ud_self_reliant_trade:0 "Self-Reliant Trade"
 FRU_ud_self_reliant_trade_desc:0 "Without council arrangements, Ferustia will hold larger reserves of fuel and spare parts and buy from whoever offers the best terms."
 FRU_ud_sky_announcement:0 "The Sky Announcement"
 FRU_ud_sky_announcement_desc:0 "Central Usea has announced that the asteroid Ulysses will strike the Earth. Ferustia has no coast to flee to and no railguns of its own. It has mountains, plains and three years."
 FRU_ud_southern_corridor_spirit:0 "The Southern Corridor"
 FRU_ud_southern_corridor_spirit_desc:0 "The desert road to the Dorondian ports is open to commercial freight under the border commission's supervision."
 FRU_ud_southern_transit:0 "The Southern Transit"
 FRU_ud_southern_transit_desc:0 "The desert road toward the Dorondian ports is the short way to the sea. Using it means trusting the border commission to keep the road open."
 FRU_ud_stand_apart:0 "Stand Apart"
 FRU_ud_stand_apart_desc:0 "The council's promises bind its members, not Ferustia. The executive will keep its own counsel and trade on its own terms."
 FRU_ud_standing_order_spirit:0 "The Standing Order"
 FRU_ud_standing_order_spirit_desc:0 "A garrison executive governs permanently, with a civilian cabinet that advises but does not decide."
 FRU_ud_state_inventory:0 "The State Executive's Inventory"
 FRU_ud_state_inventory_desc:0 "Before the State Executive can promise anything, it must know what survived the years of rebellion: which works still run, which passes still carry trains, and which ministries still answer their telephones."
 FRU_ud_treaty_council_watch:0 "Watch the Treaty Council"
 FRU_ud_treaty_council_watch_desc:0 "Most of Ferustia's neighbours sit on the Central Usean Treaty Council. Ferustia does not. The executive must decide what that absence is worth."
 FRU_ud_treaty_observer_spirit:0 "Observer at the Treaty Council"
 FRU_ud_treaty_observer_spirit_desc:0 "Ferustia hears the council's decisions before they reach its borders, without being bound by them."
 FRU_ud_waia_rail:0 "The Mount Waia Line"
 FRU_ud_waia_rail_desc:0 "A single-track line over the Mount Waia saddle would link the capital to the eastern border crossings in every season. It will be the most expensive mile of track in the country."
 FRU_ud_war_that_did_not_come:0 "The War That Did Not Come"
 FRU_ud_war_that_did_not_come_desc:0 "The continental crisis has been averted. The mobilisation plans go back into their safes, and the money set aside for them can go to the plains instead."
 PLA_communism:0 "Platania"
 PLA_communism_DEF:0 "Platania"
 PLA_neutrality:0 "Platania"
 PLA_neutrality_DEF:0 "Platania"
 PLA_ud_after_the_war:0 "Platania After the War"
 PLA_ud_after_the_war_desc:0 "The war is over. Platanian ships carried survivors, grain and the wounded through the worst of it. Now the houses, the plateau and the islands must decide what the peace is for."
 PLA_ud_blue_water_spirit:0 "The Blue-Water Squadron"
 PLA_ud_blue_water_spirit_desc:0 "A small squadron escorts Platanian shipping beyond the coast."
 PLA_ud_blue_water_squadron:0 "A Blue-Water Squadron"
 PLA_ud_blue_water_squadron_desc:0 "Platania will buy and build a small squadron capable of escorting its merchant ships beyond the coast, wherever the trade routes go."
 PLA_ud_bonded_warehouses:0 "Bonded Warehouses"
 PLA_ud_bonded_warehouses_desc:0 "Goods awaiting onward shipment will be stored in sealed warehouses under customs seal, so that cargoes can pause in Scardilli without paying for the privilege."
 PLA_ud_bridge_road:0 "The Bridge Road Markets"
 PLA_ud_bridge_road_desc:0 "With the crossing open, market towns are growing along the bridge road. The state will survey plots, pave the market squares and post a customs-free fair every spring."
 PLA_ud_chamber_of_houses:0 "The Chamber of Houses"
 PLA_ud_chamber_of_houses_desc:0 "Each merchant house will have a seat in a standing chamber of commerce that drafts the senate's trade bills before they are debated."
 PLA_ud_chartered_guilds_spirit:0 "The Chartered Guilds"
 PLA_ud_chartered_guilds_spirit_desc:0 "The merchant houses trade in fixed shares under guild charters. Fewer fortunes are made, and fewer are lost."
 PLA_ud_coast_guard:0 "A Platanian Coast Guard"
 PLA_ud_coast_guard_desc:0 "Smuggling, wrecks and fishing disputes call for a coast guard with its own cutters, radios and authority to board any vessel in Platanian waters."
 PLA_ud_coast_guard_spirit:0 "The Platanian Coast Guard"
 PLA_ud_coast_guard_spirit_desc:0 "Cutters and radio stations watch Platanian waters for smugglers, wrecks and trespassers."
 PLA_ud_coastal_flotilla:0 "A Coastal Flotilla"
 PLA_ud_coastal_flotilla_desc:0 "Fast boats, minelayers and shore radar will make Platanian waters too costly for anyone to enter uninvited, without pretending to rule the open sea."
 PLA_ud_coastal_flotilla_spirit:0 "The Coastal Flotilla"
 PLA_ud_coastal_flotilla_spirit_desc:0 "Fast boats, minelayers and shore radar guard the approaches to Platanian waters."
 PLA_ud_common_tariff:0 "Argue for a Common Tariff"
 PLA_ud_common_tariff_desc:0 "Platania will press the council for a common outer tariff, so that its members trade freely with each other and buy less from beyond the treaty."
 PLA_ud_common_tariff_spirit:0 "The Common Tariff Campaign"
 PLA_ud_common_tariff_spirit_desc:0 "Platania presses the treaty council for a common outer tariff that favours members' goods."
 PLA_ud_compact_articles:0 "Articles of the Compact"
 PLA_ud_compact_articles_desc:0 "The articles divide revenue by formula, require unanimity on taxes and borders, and let any region suspend a law that falls on it alone."
 PLA_ud_compact_articles_spirit:0 "Articles of the Compact"
 PLA_ud_compact_articles_spirit_desc:0 "Port, plateau and islands share revenue by formula and each holds a veto over the others."
 PLA_ud_compact_council:0 "The Compact Council"
 PLA_ud_compact_council_desc:0 "The executive becomes a permanent council of the three regions. It decides slowly, it rarely decides badly, and it never decides without everyone in the room."
 PLA_ud_compact_council_spirit:0 "The Compact Council"
 PLA_ud_compact_council_spirit_desc:0 "A permanent council of the three regions governs slowly and by consent."
 PLA_ud_compact_office:0 "Compact Executive"
 PLA_ud_compact_office_desc:0 "Port, plateau and islands govern through a compact executive in which each region holds a veto. It is an office, not a person; its members are not named in this provisional path."
 PLA_ud_coup_lessons:0 "After the Coup Attempts"
 PLA_ud_coup_lessons_desc:0 "Coup attempts have broken out across Usea. Platania's harbour guards are told to hold every quay, and the assembly is told to sit until the danger has passed."
 PLA_ud_evacuation_shipping_spirit:0 "Evacuation Shipping"
 PLA_ud_evacuation_shipping_spirit_desc:0 "Every hull in Platanian registry has an evacuation berth and a timetable."
 PLA_ud_exchange_spirit:0 "The Scardilli Exchange"
 PLA_ud_exchange_spirit_desc:0 "Prices, freight rates and insurance are posted every morning in a single exchange hall."
 PLA_ud_farm_credit:0 "Credit for the Plateau Farms"
 PLA_ud_farm_credit_desc:0 "A rural credit bank will lend against the next harvest at rates the Scardilli houses never offered, and will not foreclose in a drought year."
 PLA_ud_ferry_service:0 "The Island Ferry Service"
 PLA_ud_ferry_service_desc:0 "The island board will run a scheduled ferry service, subsidised by the state, so that islanders can reach the mainland markets in every season."
 PLA_ud_free_port:0 "A Free Port Charter"
 PLA_ud_free_port_desc:0 "Scardilli will become a free port: no duties on goods in transit, bonded quays for every flag, and revenue taken from harbour fees rather than customs."
 PLA_ud_free_port_spirit:0 "Free Port of Scardilli"
 PLA_ud_free_port_spirit_desc:0 "Goods in transit pay no duty in Scardilli. The harbour is busier; the treasury is thinner."
 PLA_ud_grain_boards:0 "Grain Boards"
 PLA_ud_grain_boards_desc:0 "Union grain boards will buy the plateau harvest and sell bread in the capital at a fixed price, ending the houses' grip on the city's food."
 PLA_ud_grain_boards_spirit:0 "Union Grain Boards"
 PLA_ud_grain_boards_spirit_desc:0 "Union boards buy the plateau harvest and sell bread in the capital at a fixed price."
 PLA_ud_granaries_spirit:0 "The Plateau Granaries"
 PLA_ud_granaries_spirit_desc:0 "Public granaries buy the plateau harvest at fixed prices and carry the capital through bad years."
 PLA_ud_guild_courts:0 "The Guild Courts"
 PLA_ud_guild_courts_desc:0 "Disputes between houses will be settled in guild courts with merchant judges, faster and cheaper than the state courts and harder to appeal."
 PLA_ud_guild_monopoly:0 "The Chartered Guilds"
 PLA_ud_guild_monopoly_desc:0 "The houses will be organised into chartered guilds with fixed shares of each trade. Competition will fall; so will the bankruptcies that ruined the harbour twice before."
 PLA_ud_harbour_evacuation:0 "Ships for the Coast Towns"
 PLA_ud_harbour_evacuation_desc:0 "Every hull in Platanian registry will be listed for evacuation duty, with a berth assigned to each coastal town and a timetable that can be run on a day's notice."
 PLA_ud_harbour_ledger:0 "The Harbour Ledger of Scardilli"
 PLA_ud_harbour_ledger_desc:0 "Platania has always counted itself in cargoes. Before the new decade begins, the harbour office will count everything else: the islands, the plateau, the inland march and the people who live there."
 PLA_ud_harbour_pilots:0 "Pilots of the Scardilli Roads"
 PLA_ud_harbour_pilots_desc:0 "The harbour pilots know every shoal between the islands and the capital. Formed into a national service, they can be the start of a navy as well as a trade."
 PLA_ud_hospital_port_calls_spirit:0 "Hospital Port Calls"
 PLA_ud_hospital_port_calls_spirit_desc:0 "ISAF hospital ships and tenders may call at Scardilli under Platanian harbour rules. Platania has not joined the alliance."
 PLA_ud_houses_of_scardilli:0 "The Houses of Scardilli"
 PLA_ud_houses_of_scardilli_desc:0 "The great merchant houses of the capital own the warehouses, the lighters and most of the debts in the country. Every government has had to decide what to do with them."
 PLA_ud_impact_tide:0 "The Fall and the Ships"
 PLA_ud_impact_tide_desc:0 "Ulysses has broken apart over the world. Within days the ships began arriving in Platanian harbours, crowded with families who had left everything behind and had nowhere else to go."
 PLA_ud_isaf_port_calls:0 "Port Calls for Hospital Ships"
 PLA_ud_isaf_port_calls_desc:0 "ISAF has asked to use Scardilli for hospital ships and supply tenders. Platania will allow port calls under its own harbour rules, without joining the alliance."
 PLA_ud_island_charter:0 "An Island Charter"
 PLA_ud_island_charter_desc:0 "The islands will receive a charter of their own: an elected island board for harbours, fisheries and schools, under the national law and the national flag."
 PLA_ud_island_charter_spirit:0 "The Island Charter"
 PLA_ud_island_charter_spirit_desc:0 "An elected island board runs the harbours, fisheries and schools of the Pantellia Islands under national law."
 PLA_ud_island_charter_tt:0 "A domestic charter only. The islands remain Platanian; no state, core or border changes."
 PLA_ud_island_compact:0 "The Island Compact"
 PLA_ud_island_compact_desc:0 "The islands, the plateau and the port will govern through a compact executive in which each holds a veto. Nobody will rule Platania alone again."
 PLA_ud_island_garrison:0 "Govern the Islands from Scardilli"
 PLA_ud_island_garrison_desc:0 "The islands will be governed as every other province is, by officials sent from the capital and a garrison that answers to the War Ministry."
 PLA_ud_island_garrison_spirit:0 "The Island Garrison"
 PLA_ud_island_garrison_spirit_desc:0 "Officials from the capital and a garrison of the War Ministry govern the islands."
 PLA_ud_island_harbours:0 "Harbours for the Islands"
 PLA_ud_island_harbours_desc:0 "Breakwaters, cold stores and a deeper channel will let island boats land their catch at home instead of carrying it to Scardilli first."
 PLA_ud_island_seats:0 "Seats for the Islands"
 PLA_ud_island_seats_desc:0 "The islands will send a fixed delegation to the compact executive, regardless of their population, with a standing say over fisheries and sea lanes."
 PLA_ud_island_station:0 "The Pantellia Naval Station"
 PLA_ud_island_station_desc:0 "The garrison will be joined by a naval station with fuel bunkers, a slipway and a signal tower watching the approaches to the islands."
 PLA_ud_lane_agreements:0 "The Sea Lane Agreements"
 PLA_ud_lane_agreements_desc:0 "Pilotage, salvage and harbour fees will be standardised across the treaty's coasts, under rules Platanian pilots have used for a century."
 PLA_ud_line_freighters:0 "Freighters for the Line"
 PLA_ud_line_freighters_desc:0 "The national line will order its first freighters from the Scardilli yards, with Platanian steel and Platanian crews wherever they can be found."
 PLA_ud_march_settlements:0 "Settle the Inland March"
 PLA_ud_march_settlements_desc:0 "The empty inland march between the plateau and the eastern border has been a place to pass through. Wells, roads and a few market towns can make it a place to live."
 PLA_ud_march_settlements_tt:0 "Settles the inland march within Platania's existing borders. No claim, core or border changes."
 PLA_ud_mercantile_senate:0 "The Mercantile Senate"
 PLA_ud_mercantile_senate_desc:0 "A senate of the merchant houses, elected by the ratepayers of the ports, will govern with the assembly beneath it. Commerce built Platania; commerce will run it."
 PLA_ud_mine_cooperatives:0 "Mine Cooperatives"
 PLA_ud_mine_cooperatives_desc:0 "The plateau mines pass to cooperatives of the miners who work them. The union buys their ore at a fixed price and sells it abroad."
 PLA_ud_minefield_charts:0 "Chart the Defensive Fields"
 PLA_ud_minefield_charts_desc:0 "Every channel that could be mined in a crisis will be charted, surveyed and assigned a minelayer, with the charts kept under seal in Scardilli."
 PLA_ud_mining_board_spirit:0 "The Plateau Mining Board"
 PLA_ud_mining_board_spirit_desc:0 "A national board works the plateau ore beds and sells their output abroad."
 PLA_ud_neutral_shipping:0 "Neutral Shipping"
 PLA_ud_neutral_shipping_desc:0 "Platanian ships will sail under their own flag, lit at night and marked on their hulls, carrying civilian cargo for any buyer who can prove it is civilian."
 PLA_ud_neutral_shipping_spirit:0 "Neutral Shipping"
 PLA_ud_neutral_shipping_spirit_desc:0 "Platanian ships sail lit and marked, carrying civilian cargo for any buyer who can prove it."
 PLA_ud_open_harbours:0 "Open Harbours"
 PLA_ud_open_harbours_desc:0 "With Erusea closing its doors, more ships are turning toward Platania. Every harbour will take them in, and the bridge road towns will house their passengers."
 PLA_ud_open_harbours_spirit:0 "Open Harbours"
 PLA_ud_open_harbours_spirit_desc:0 "Every Platanian harbour takes in the refugee ships that reach it."
 PLA_ud_open_lanes:0 "Argue for Open Sea Lanes"
 PLA_ud_open_lanes_desc:0 "Platania will press the council to keep its harbours and sea lanes open to every flag, members and outsiders alike, on the same terms."
 PLA_ud_open_lanes_spirit:0 "Open Sea Lanes"
 PLA_ud_open_lanes_spirit_desc:0 "Platania argues that every treaty harbour should be open to every flag on equal terms."
 PLA_ud_open_tenders:0 "Open Public Tenders"
 PLA_ud_open_tenders_desc:0 "Every public contract above a fixed sum will be put out to open tender and published in the harbour gazette, winners and losers alike."
 PLA_ud_open_tenders_spirit:0 "Open Public Tenders"
 PLA_ud_open_tenders_spirit_desc:0 "Every large public contract is tendered openly and published in the harbour gazette."
 PLA_ud_ore_road:0 "The Ore Road to the Coast"
 PLA_ud_ore_road_desc:0 "Ore is heavy and the coast is far. A graded road and a rail spur from the plateau mines to Casale will carry it down without crushing the farm tracks."
 PLA_ud_pantellia_question:0 "What the Islands Want"
 PLA_ud_pantellia_question_desc:0 "The Pantellia Islands are Platanian, and few islanders dispute it. They do dispute who decides how their harbours, fisheries and ferries are run, and from where."
 PLA_ud_peace_dividend:0 "The Shipping Returns"
 PLA_ud_peace_dividend_desc:0 "The continental crisis has been averted. Insurance rates fall, the convoys stand down, and the merchant houses can put their ships back on the ordinary routes."
 PLA_ud_plateau_granaries:0 "The Plateau Granaries"
 PLA_ud_plateau_granaries_desc:0 "The plateau's farms will come first: public granaries, fixed purchase prices and storage enough to carry the capital through a bad harvest."
 PLA_ud_plateau_mines:0 "Open the Plateau Mines"
 PLA_ud_plateau_mines_desc:0 "The ore beds of the plateau will be worked on a national scale, with concessions, rail sidings and a mining board to sell the output abroad."
 PLA_ud_plateau_refuges:0 "Refuges on the Plateau"
 PLA_ud_plateau_refuges_desc:0 "Shelters, wells and stores will be built on the high plateau, far from the coast, where the population of the harbour towns can be received if the sea becomes dangerous."
 PLA_ud_plateau_refuges_spirit:0 "Refuges on the Plateau"
 PLA_ud_plateau_refuges_spirit_desc:0 "Shelters and stores on the high plateau stand ready for the harbour towns."
 PLA_ud_plateau_seats:0 "Seats for the Plateau"
 PLA_ud_plateau_seats_desc:0 "The plateau will send its own delegation, chosen by the farm councils and the mining towns rather than by the parties of the capital."
 PLA_ud_plateau_survey:0 "Survey the Scofields Plateau"
 PLA_ud_plateau_survey_desc:0 "The plateau feeds the capital and holds the country's ore, yet it sends few members to the assembly and fewer still to the merchant houses. A survey will measure both its wealth and its grievances."
 PLA_ud_plateau_union:0 "The Plateau Cooperative Union"
 PLA_ud_plateau_union_desc:0 "Farm councils, mine crews and dockworkers will form a cooperative union and take the government out of the merchant houses' hands."
 PLA_ud_programme_adopted:0 "Platania adopted its national programme from an older save"
 PLA_ud_quota_berths:0 "Berths by Quota"
 PLA_ud_quota_berths_desc:0 "Each harbour will receive a fixed number of refugee ships a month, with medical inspection on arrival and transport onward for anyone beyond the quota."
 PLA_ud_quota_berths_spirit:0 "Berths by Quota"
 PLA_ud_quota_berths_spirit_desc:0 "Refugee ships are received by monthly quota, inspected and helped onward."
 PLA_ud_quota_berths_tt:0 "Refugee ships beyond the monthly quota receive medical care and transport onward."
 PLA_ud_relief_convoys:0 "Relief Convoys"
 PLA_ud_relief_convoys_desc:0 "Platanian ships will carry grain, medicine and fuel to wherever the harbours are still standing, in convoys organised by the exchange and paid for by the state."
 PLA_ud_relief_convoys_spirit:0 "Relief Convoys"
 PLA_ud_relief_convoys_spirit_desc:0 "Platanian convoys carry grain, medicine and fuel to the harbours still standing."
 PLA_ud_scardilli_exchange:0 "The Scardilli Exchange"
 PLA_ud_scardilli_exchange_desc:0 "Whatever form the houses have taken, their trade will now meet in a single exchange hall where prices, freight rates and insurance are posted every morning."
 PLA_ud_scardilli_yards:0 "Refit the Scardilli Yards"
 PLA_ud_scardilli_yards_desc:0 "The capital's shipyards have built merchant hulls for generations. Refitted with new cranes and a covered slip, they can build warships too, if the state decides it needs them."
 PLA_ud_seals_bridge:0 "The Seals Bridge Crossing"
 PLA_ud_seals_bridge_desc:0 "The coast road and the plateau road meet at Seals Bridge, where an old timber crossing has failed every flood season in living memory. A steel bridge will join the country's two halves."
 PLA_ud_seals_crossing_spirit:0 "The Seals Bridge Crossing"
 PLA_ud_seals_crossing_spirit_desc:0 "A steel bridge joins the coast road to the plateau road in every season."
 PLA_ud_senate_charter:0 "The Senate Charter"
 PLA_ud_senate_charter_desc:0 "The charter sets out the senate's powers over trade, credit and the harbours, and leaves the assembly to argue about everything else."
 PLA_ud_senate_charter_spirit:0 "The Senate Charter"
 PLA_ud_senate_charter_spirit_desc:0 "A senate of the merchant houses governs trade, credit and the harbours under a written charter."
 PLA_ud_senate_elections:0 "The Ratepayers' Ballot"
 PLA_ud_senate_elections_desc:0 "The senate submits itself to its first full election. The franchise is wider than the houses wanted and narrower than the plateau demanded."
 PLA_ud_senate_office:0 "Mercantile Senate"
 PLA_ud_senate_office_desc:0 "A senate of the merchant houses, elected by the ratepayers of the ports, governs Platania. It is an office, not a person; its members are not named in this provisional path."
 PLA_ud_senate_republic_spirit:0 "The Ratepayers' Republic"
 PLA_ud_senate_republic_spirit_desc:0 "The mercantile senate has passed its first full election and governs with a ratepayers' mandate."
 PLA_ud_shipping_line_spirit:0 "The National Shipping Line"
 PLA_ud_shipping_line_spirit_desc:0 "Platanian goods travel in Platanian hulls under a state-owned line."
 PLA_ud_sky_warning:0 "Warning from the Sky"
 PLA_ud_sky_warning_desc:0 "Central Usea has announced that the asteroid Ulysses will strike the Earth. Platania has ships, harbours and a plateau that stands above the sea. It must decide how to use them."
 PLA_ud_squadron_exercises:0 "Squadron Exercises"
 PLA_ud_squadron_exercises_desc:0 "The new squadron will exercise with merchant convoys every season, so that escort and escorted learn each other's habits before they are needed."
 PLA_ud_state_shipping_line:0 "A National Shipping Line"
 PLA_ud_state_shipping_line_desc:0 "The state will buy hulls of its own and carry Platanian goods under a national line, so that the country's trade no longer depends on foreign charters."
 PLA_ud_tariff_schedule:0 "The Tariff Schedule"
 PLA_ud_tariff_schedule_desc:0 "Platanian customs officers will draft the council's tariff schedule themselves, which is the surest way to see that Platanian goods are protected in it."
 PLA_ud_three_platanias:0 "Port, Plateau and Islands"
 PLA_ud_three_platanias_desc:0 "The merchant houses, the plateau farmers and the islanders have each grown stronger in their own way. Each now wants the government to reflect the Platania it lives in."
 PLA_ud_treaty_market:0 "The Treaty Council as a Market"
 PLA_ud_treaty_market_desc:0 "Platania sits on the Central Usean Treaty Council, and its delegates have always treated it as a trading forum first. The question is what Platania should trade for."
 PLA_ud_union_charter:0 "The Union Charter"
 PLA_ud_union_charter_desc:0 "The cooperative union adopts a permanent charter. The houses keep their ships and lose their monopoly; the plateau keeps its harvest and gains a government."
 PLA_ud_union_charter_spirit:0 "The Union Charter"
 PLA_ud_union_charter_spirit_desc:0 "The cooperative union governs under a permanent charter."
 PLA_ud_union_congress:0 "The Union Congress"
 PLA_ud_union_congress_desc:0 "Delegates from every cooperative meet in congress to set prices, wages and the year's plan, and to elect the council that carries it out."
 PLA_ud_union_congress_spirit:0 "The Union Congress"
 PLA_ud_union_congress_spirit_desc:0 "Cooperative delegates set prices, wages and the year's plan in congress."
 PLA_ud_union_office:0 "Council of the Plateau Union"
 PLA_ud_union_office_desc:0 "Delegates of the farm councils, mine crews and dockworkers govern through the council of a cooperative union. It is an office, not a person; its members are not named in this provisional path."
 PLA_ud_war_on_the_continent:0 "War on the Continent"
 PLA_ud_war_on_the_continent_desc:0 "War has broken out in Usea. Platania is not a party to it, but its harbours, its shipping and its place on the treaty council make neutrality a question to be answered every day."
 SCA_monarchism:0 "Scandia"
 SCA_monarchism_DEF:0 "Scandia"
 SCA_ud_bank_quotas_spirit:0 "Quotas for the Banks"
 SCA_ud_bank_quotas_spirit_desc:0 "Each harbour or company takes a surveyed share of the season's catch."
 SCA_ud_bilateral_harbour_deals:0 "Bilateral Harbour Deals"
 SCA_ud_bilateral_harbour_deals_desc:0 "Separate agreements with Calladen and Bulgurdarest will set handling fees, berths and customs for their cargo on the Scandian quays."
 SCA_ud_calm_seas:0 "Calm Seas"
 SCA_ud_calm_seas_desc:0 "The continental crisis has been averted. The navy returns to fishery patrols, and the money set aside for war goes to the harbours instead."
 SCA_ud_capital_refinery:0 "A Refinery for the Capital"
 SCA_ud_capital_refinery_desc:0 "Crude sold abroad returns as fuel bought abroad at twice the price. A small refinery and tank farm in the capital will keep more of the value at home."
 SCA_ud_capital_yards:0 "The Capital Shipyards"
 SCA_ud_capital_yards_desc:0 "The capital's yards build more repairs than ships. New slipways and a modern crane line will let them build coasters, cutters and the occasional order from abroad."
 SCA_ud_catch_quotas:0 "Quotas for the Banks"
 SCA_ud_catch_quotas_desc:0 "The banks are not endless. Each harbour or company will receive a share of the season's catch, set by surveys and enforced at the quay."
 SCA_ud_charts_of_the_coast:0 "Charts of the Scandian Coast"
 SCA_ud_charts_of_the_coast_desc:0 "Every Scandian province touches the sea. Before the cabinet spends a single coin, the Hydrographic Office will chart every harbour, bank, shoal and well along the coast."
 SCA_ud_closed_waters:0 "Closed Waters"
 SCA_ud_closed_waters_desc:0 "No warship of any flag may enter Scandian waters without permission. Batteries on the headlands are manned and the radar chain reports every contact."
 SCA_ud_closed_waters_spirit:0 "Closed Waters"
 SCA_ud_closed_waters_spirit_desc:0 "No warship enters Scandian waters without permission, and the headland batteries are manned."
 SCA_ud_coast_after_the_war:0 "The Coast After the War"
 SCA_ud_coast_after_the_war_desc:0 "The war at sea is over. Scandia's harbours are open, its fleet is fishing and its neutrality held. Now the country must decide what it learned from a decade of emergencies."
 SCA_ud_coast_guard_navy:0 "A Coast Guard Navy"
 SCA_ud_coast_guard_navy_desc:0 "The navy will become a coast guard in all but name: cutters for fishery inspection, smuggling patrols and rescue, armed enough to be obeyed and no more."
 SCA_ud_coast_guard_navy_spirit:0 "A Coast Guard Navy"
 SCA_ud_coast_guard_navy_spirit_desc:0 "Scandia's navy inspects, patrols and rescues. It is armed enough to be obeyed and no more."
 SCA_ud_coastal_commonwealth:0 "Proclaim the Coastal Commonwealth"
 SCA_ud_coastal_commonwealth_desc:0 "A commonwealth of the coasts will replace the old cabinet: an elected parliament, councils in every port and open registers of ships, land and licences."
 SCA_ud_coastal_radar_chain:0 "The Coastal Radar Chain"
 SCA_ud_coastal_radar_chain_desc:0 "Radar sets on the headlands will watch shipping, storms and anything else that crosses the coast, feeding one plot in the capital."
 SCA_ud_coastal_shipping_line:0 "The Coastal Shipping Line"
 SCA_ud_coastal_shipping_line_desc:0 "A scheduled line will call at every Scandian harbour twice a week, carrying mail, freight and passengers along a country that is easier to cross by sea than by road."
 SCA_ud_cold_chain_spirit:0 "The Cold Chain"
 SCA_ud_cold_chain_spirit_desc:0 "Refrigerated stores on the quays let fishermen wait for a fair price."
 SCA_ud_cold_stores:0 "Cold Stores on the Quays"
 SCA_ud_cold_stores_desc:0 "Refrigerated stores on the main quays will let fishermen hold their catch for a better price instead of selling it on the dock the morning it lands."
 SCA_ud_commonwealth_charter:0 "The Commonwealth Charter"
 SCA_ud_commonwealth_charter_desc:0 "The charter guarantees elections every four years, free association for fishermen and dockers, and public accounts for every harbour board."
 SCA_ud_commonwealth_charter_spirit:0 "The Commonwealth Charter"
 SCA_ud_commonwealth_charter_spirit_desc:0 "A provisional cabinet governs under a charter of elections, association and public accounts."
 SCA_ud_commonwealth_elections:0 "The First Commonwealth Elections"
 SCA_ud_commonwealth_elections_desc:0 "The provisional cabinet steps aside for an elected parliament. Every port, however small, sends at least one member to the capital."
 SCA_ud_commonwealth_office:0 "Coastal Commonwealth Cabinet"
 SCA_ud_commonwealth_office_desc:0 "The provisional cabinet of the Coastal Commonwealth governs until the first elected parliament sits. It is an office, not a person; its members are not named in this provisional path."
 SCA_ud_commonwealth_parliament_spirit:0 "The Commonwealth Parliament"
 SCA_ud_commonwealth_parliament_spirit_desc:0 "Every port, however small, sends a member to the elected parliament in the capital."
 SCA_ud_cooperative_auctions:0 "Cooperative Fish Auctions"
 SCA_ud_cooperative_auctions_desc:0 "Each harbour's cooperative will run a public auction at dawn, with prices chalked on a board that every buyer and every crew can read."
 SCA_ud_coup_patrols:0 "Patrols After the Coup"
 SCA_ud_coup_patrols_desc:0 "Coup attempts have broken out across Usea. Armed boats and smugglers' cargoes are reported along the coast, and the navy is ordered to stop and search them."
 SCA_ud_deep_water_trawlers:0 "Deep-Water Trawlers"
 SCA_ud_deep_water_trawlers_desc:0 "The companies will order ocean-going trawlers from the yards on the eastern coast, the first steel fishing hulls ever built in Scandia."
 SCA_ud_escort_the_fleet:0 "Escort the Fishing Fleet"
 SCA_ud_escort_the_fleet_desc:0 "Fishing boats will sail in escorted groups, with lights and flags agreed in advance, and keep well clear of every warship's course."
 SCA_ud_fish_for_the_inland:0 "Fish for the Inland Markets"
 SCA_ud_fish_for_the_inland_desc:0 "Refrigerated wagons will carry Scandian fish to Calladen and Bulgurdarest, turning a coastal staple into the country's steadiest export."
 SCA_ud_fisheries_cooperatives:0 "Fisheries Cooperatives"
 SCA_ud_fisheries_cooperatives_desc:0 "Each harbour will pool its boats, run its own auction and share its cold store, with state loans for nets and engines. The villages stay; the profits stay modest."
 SCA_ud_fisheries_cooperatives_spirit:0 "Fisheries Cooperatives"
 SCA_ud_fisheries_cooperatives_spirit_desc:0 "Each harbour pools its boats, runs its own auction and shares its cold store."
 SCA_ud_fishery_protection:0 "Fishery Protection Patrols"
 SCA_ud_fishery_protection_desc:0 "Cutters will board foreign trawlers on the Scandian banks, check their catch and escort the persistent ones out of national waters."
 SCA_ud_fishing_fleet_relief:0 "The Fleet Feeds the Coast"
 SCA_ud_fishing_fleet_relief_desc:0 "With markets disrupted, the fishing fleet will land its catch for the relief kitchens first, paid from the emergency budget at last season's prices."
 SCA_ud_fleet_register:0 "Register the Fishing Fleet"
 SCA_ud_fleet_register_desc:0 "Half the boats on the coast have never been registered. Inspectors will measure every hull, record every engine and give every crew a number the state can count."
 SCA_ud_free_port:0 "A Free Port for Inland Freight"
 SCA_ud_free_port_desc:0 "A bonded zone on the capital's quays will let goods bound for the inland countries pass through Scandia without duty, for a modest handling fee."
 SCA_ud_free_port_spirit:0 "The Free Port"
 SCA_ud_free_port_spirit_desc:0 "Goods bound for the inland countries pass through the capital's bonded quays without duty."
 SCA_ud_harbour_deals_spirit:0 "Bilateral Harbour Deals"
 SCA_ud_harbour_deals_spirit_desc:0 "Calladen and Bulgurdarest move cargo over the Scandian quays on agreed terms."
 SCA_ud_harbour_regency:0 "Seat the Harbour Regency"
 SCA_ud_harbour_regency_desc:0 "The harbour guilds propose a regency council that governs above party, in trust for the coast, on the model of the old harbour charters. Elections will wait."
 SCA_ud_harbour_screening:0 "Screening at the Quays"
 SCA_ud_harbour_screening_desc:0 "Arrivals will be fed, examined and registered on the quays, then moved inland to Scandia's neighbours or onward by sea under the coordination centre's control."
 SCA_ud_harbour_screening_spirit:0 "Screening at the Quays"
 SCA_ud_harbour_screening_spirit_desc:0 "Arrivals by sea are fed, examined, registered and moved onward under coordination."
 SCA_ud_harbour_shelters:0 "Shelters Behind the Harbour Walls"
 SCA_ud_harbour_shelters_desc:0 "The harbours will be hardened instead: reinforced shelters behind the sea walls, deep cellars in the customs houses and boats ready to move people along the coast."
 SCA_ud_harbour_shelters_spirit:0 "Harbour Shelters"
 SCA_ud_harbour_shelters_spirit_desc:0 "Hardened shelters behind the sea walls and boats on call protect the harbour towns."
 SCA_ud_harbour_survey:0 "Dredge the Harbours"
 SCA_ud_harbour_survey_desc:0 "The smaller harbours are silting up faster than the old dredgers can clear them. New channels on the western and northern coasts will keep them open to laden ships."
 SCA_ud_harbour_wardens:0 "Harbour Wardens"
 SCA_ud_harbour_wardens_desc:0 "Each harbour will have a warden appointed by the regency, responsible for quays, patrols and the fishing quota, and answerable only to the council."
 SCA_ud_hospital_ships:0 "Harbour Rights for Hospital Ships"
 SCA_ud_hospital_ships_desc:0 "ISAF has asked to use Scandian harbours for hospital ships. Scandia will allow it for clearly marked hospital ships only, under its own harbourmasters, without joining the alliance."
 SCA_ud_hospital_ships_spirit:0 "Hospital Ship Harbour Rights"
 SCA_ud_hospital_ships_spirit_desc:0 "Clearly marked ISAF hospital ships may use Scandian harbours under Scandian harbourmasters. Scandia has not joined the alliance."
 SCA_ud_impact_night:0 "The Night the Sky Fell"
 SCA_ud_impact_night_desc:0 "Ulysses has broken apart over the world. Scandia's radar crews tracked the light for hours. Now the radio brings word from other coasts, and the boats begin to arrive."
 SCA_ud_inland_fish_trade_spirit:0 "Fish for the Inland"
 SCA_ud_inland_fish_trade_spirit_desc:0 "Refrigerated wagons carry Scandian fish to the inland markets of Calladen and Bulgurdarest."
 SCA_ud_lifeboat_stations:0 "Lifeboat Stations"
 SCA_ud_lifeboat_stations_desc:0 "New stations with motor lifeboats and trained volunteer crews will be placed so that no stretch of coast is more than an hour from help."
 SCA_ud_maritime_clauses:0 "Argue for Maritime Clauses"
 SCA_ud_maritime_clauses_desc:0 "Scandia's delegates will press the council to adopt common rules for harbours, sea rescue and shipping, where a small coastal member knows more than its partners."
 SCA_ud_maritime_clauses_spirit:0 "Maritime Clauses"
 SCA_ud_maritime_clauses_spirit_desc:0 "Scandia's delegates lead the treaty council's work on harbours, rescue and shipping."
 SCA_ud_merchant_flag_spirit:0 "A Merchant Fleet Under the Flag"
 SCA_ud_merchant_flag_spirit_desc:0 "Tax relief brings shipowners to the Scandian register."
 SCA_ud_merchant_fleet:0 "A Merchant Fleet Under the Flag"
 SCA_ud_merchant_fleet_desc:0 "Scandian cargo travels in foreign hulls and pays foreign freight rates. Tax relief for ships registered under the Scandian flag will start to change that."
 SCA_ud_national_oil_board:0 "A National Oil Board"
 SCA_ud_national_oil_board_desc:0 "The state will own the wells, pay the crews and sell the crude itself. Every unit of profit goes to the budget, and so does every unit of risk."
 SCA_ud_national_oil_board_spirit:0 "The National Oil Board"
 SCA_ud_national_oil_board_spirit_desc:0 "The state owns the Petrol Coast wells and keeps their profits and their risks."
 SCA_ud_naval_reserve:0 "The Fishermen's Naval Reserve"
 SCA_ud_naval_reserve_desc:0 "Fishermen who know every shoal will be enrolled as a naval reserve, with their own boats on call and a short course each winter."
 SCA_ud_naval_reserve_spirit:0 "The Fishermen's Naval Reserve"
 SCA_ud_naval_reserve_spirit_desc:0 "Fishermen and their boats are enrolled for service in an emergency."
 SCA_ud_navy_question:0 "What Navy Can Scandia Afford?"
 SCA_ud_navy_question_desc:0 "Scandia owns a few patrol craft, an elderly training ship and a great deal of coast. The Admiralty must decide what a navy this small is actually for."
 SCA_ud_oil_leases:0 "Lease the Oil Blocks"
 SCA_ud_oil_leases_desc:0 "Companies will bid for blocks of coast, drill at their own expense and pay a royalty on every barrel. The money arrives quickly and so do the foreign engineers."
 SCA_ud_oil_leases_spirit:0 "Oil Leases"
 SCA_ud_oil_leases_spirit_desc:0 "Companies drill leased blocks of coast and pay the state a royalty on every barrel."
 SCA_ud_oil_survey:0 "Survey the Oil Coast"
 SCA_ud_oil_survey_desc:0 "Tar has seeped from the coastal cliffs for generations. Geologists will finally map the field beneath it and estimate what can be pumped and how quickly."
 SCA_ud_open_harbours:0 "Open Harbours"
 SCA_ud_open_harbours_desc:0 "With Erusea closing its doors, boats full of refugees are making for any harbour that will take them. Scandia will take them, house them and count them as neighbours."
 SCA_ud_open_harbours_spirit:0 "Open Harbours"
 SCA_ud_open_harbours_spirit_desc:0 "Refugees arriving by sea are housed and counted as neighbours."
 SCA_ud_open_registers:0 "Open Ship Registers"
 SCA_ud_open_registers_desc:0 "Anyone may now inspect who owns a ship, a berth or a fishing licence. Old harbour fortunes will be visible for the first time."
 SCA_ud_open_registers_spirit:0 "Open Registers"
 SCA_ud_open_registers_spirit_desc:0 "Ownership of ships, berths and licences is public record."
 SCA_ud_patrol_squadron:0 "A Patrol Squadron"
 SCA_ud_patrol_squadron_desc:0 "A small squadron of fast armed craft will train to hold the harbour mouths. It will not win a war at sea, but it will make any visitor think twice."
 SCA_ud_patrol_squadron_spirit:0 "The Patrol Squadron"
 SCA_ud_patrol_squadron_spirit_desc:0 "A small squadron of fast armed craft trains to hold the harbour mouths."
 SCA_ud_petrol_coast_wells:0 "Wells on the Petrol Coast"
 SCA_ud_petrol_coast_wells_desc:0 "The first test wells on the Petrol Coast will show whether the old name was a promise or a joke. If the oil flows, someone will have to decide who owns it."
 SCA_ud_port_councils:0 "Councils in Every Port"
 SCA_ud_port_councils_desc:0 "Each harbour will elect a council to run its quays, its cold store and its share of the fishing quota, instead of waiting for instructions from the capital."
 SCA_ud_programme_adopted:0 "Scandia adopted its national programme from an older save"
 SCA_ud_quiet_member:0 "A Quiet Member"
 SCA_ud_quiet_member_desc:0 "Scandia will vote with the majority, ask for little and spend its effort on bilateral arrangements with the neighbours who actually use its harbours."
 SCA_ud_quiet_member_spirit:0 "A Quiet Member"
 SCA_ud_quiet_member_spirit_desc:0 "Scandia votes with the majority and spends its effort on its own neighbours."
 SCA_ud_regency_charters:0 "Charters for the Fleet"
 SCA_ud_regency_charters_desc:0 "The regency will grant long charters to shipowners who build in Scandian yards and crew with Scandian sailors, in exchange for service in emergencies."
 SCA_ud_regency_council:0 "The Regency Council Sits"
 SCA_ud_regency_council_desc:0 "The council meets in the old customs house and governs by charter. Its seats belong to offices, not persons: harbourmasters, guild wardens and the senior captain of the fleet."
 SCA_ud_regency_council_spirit:0 "The Regency Council"
 SCA_ud_regency_council_spirit_desc:0 "A council of harbour offices governs the coast in trust, by charter and above party."
 SCA_ud_regency_office:0 "Harbour Regency Council"
 SCA_ud_regency_office_desc:0 "A council of harbour offices governs the coast in trust under the old harbour charters. No monarch or dynasty is named or implied; it is an office, not a person, in this provisional path."
 SCA_ud_regency_settlement:0 "The Regency Settlement"
 SCA_ud_regency_settlement_desc:0 "The temporary regency becomes the settled constitution of the coast: a council in trust, an advisory assembly and charters that bind both."
 SCA_ud_regency_settlement_spirit:0 "The Regency Settlement"
 SCA_ud_regency_settlement_spirit_desc:0 "A council in trust and an advisory assembly govern the coast under binding charters."
 SCA_ud_rescue_coordination:0 "The Rescue Coordination Centre"
 SCA_ud_rescue_coordination_desc:0 "Radar, weather reports, lifeboats and the navy's cutters will answer to a single coordination centre in the capital, staffed day and night."
 SCA_ud_rescue_flotillas:0 "Rescue Flotillas"
 SCA_ud_rescue_flotillas_desc:0 "Every fishing boat that can be spared will sail with the lifeboats and cutters, carrying food out and bringing people in from wherever they are found."
 SCA_ud_rescue_flotillas_spirit:0 "Rescue Flotillas"
 SCA_ud_rescue_flotillas_spirit_desc:0 "Fishing boats sail with the lifeboats and cutters on relief work."
 SCA_ud_rescue_network_spirit:0 "The Rescue Network"
 SCA_ud_rescue_network_spirit_desc:0 "Radar, weather stations, lifeboats and cutters answer to one coordination centre."
 SCA_ud_sea_lane_convention:0 "A Sea Lane Convention"
 SCA_ud_sea_lane_convention_desc:0 "The council's members will agree on shared shipping lanes, pilotage and rescue duties along the coast, drafted largely by Scandian officials."
 SCA_ud_sea_neutrality:0 "A Neutral Coast"
 SCA_ud_sea_neutrality_desc:0 "War has broken out on the continent, and much of it will be fought at sea and in the air. Scandia is not a party to it and intends to stay that way."
 SCA_ud_sea_rescue_service:0 "A National Sea Rescue Service"
 SCA_ud_sea_rescue_service_desc:0 "Every winter the banks take boats and crews. A national service will replace the patchwork of village lifeboats with one chain of stations and one telephone number."
 SCA_ud_sea_rescue_spirit:0 "National Sea Rescue"
 SCA_ud_sea_rescue_spirit_desc:0 "One chain of rescue stations answers one telephone number along the whole coast."
 SCA_ud_squadron_exercises:0 "Squadron Exercises"
 SCA_ud_squadron_exercises_desc:0 "The patrol squadron will exercise at night and in heavy weather, against the harbour batteries and the radar chain, until its crews can fight in the dark."
 SCA_ud_tide_watch:0 "The Sea and Sky Watch"
 SCA_ud_tide_watch_desc:0 "The radar chain and the headland stations will keep a joint watch on sea and sky, so that any warning reaches the harbours in minutes rather than hours."
 SCA_ud_trawler_companies:0 "Incorporate the Trawler Companies"
 SCA_ud_trawler_companies_desc:0 "Chartered companies with steel hulls and deep-water range will fish the far banks. They will land more fish with fewer crews, and the crews they release must find other work."
 SCA_ud_trawler_companies_spirit:0 "Trawler Companies"
 SCA_ud_trawler_companies_spirit_desc:0 "Chartered companies fish the far banks with steel hulls and fewer crews."
 SCA_ud_treaty_council_seat:0 "Scandia's Chair at the Council"
 SCA_ud_treaty_council_seat_desc:0 "Scandia sits on the Central Usean Treaty Council with the smallest delegation and the longest coastline. It must decide what to ask of its partners."
 SCA_ud_ulysses_warning:0 "Warning to a Coastal Nation"
 SCA_ud_ulysses_warning_desc:0 "Central Usea has announced that the asteroid Ulysses will strike the Earth. No one knows where the fragments will fall, and Scandia has nothing but coast."
 SCA_ud_upland_refuges:0 "Refuges on the High Ground"
 SCA_ud_upland_refuges_desc:0 "Every coastal town will be assigned higher ground behind it, with stores, water and a road kept clear, so that people can leave the shore within an hour."
 SCA_ud_upland_refuges_spirit:0 "Refuges on the High Ground"
 SCA_ud_upland_refuges_spirit_desc:0 "Every coastal town has stocked high ground behind it and a road kept clear to reach it."
 SCA_ud_weather_stations:0 "Weather Stations on the Headlands"
 SCA_ud_weather_stations_desc:0 "Automatic stations on every headland will report wind, pressure and swell to the capital each hour, so that warnings reach the fleet before the weather does."
 SCA_ud_who_governs:0 "Who Governs the Harbours?"
 SCA_ud_who_governs_desc:0 "The cabinet in the capital governs on paper. The harbourmasters, the fishing guilds and the shipping houses govern in practice. Both want the arrangement settled."
 ac_ud_alr_tree:0 "Albardi National Programme"
 ac_ud_alr_tree_desc:0 "Albard's own programme from 1991: the steel mills, the oil fields, the three shipyards, the unions, the arms trade, the treaty council, the question of who owns the country, Ulysses and the war years. Provisional gameplay built on the mod's geography."
 ac_ud_bld_tree:0 "Bulgurdaresti Crossroads Programme"
 ac_ud_bld_tree_desc:0 "Bulgurdarest's own programme from 1991: the customs and rail hub of six borders, the Expo City fair, the Mount Sartan mines, a table on neutral ground, the treaty council, the question of who governs, Ulysses and the war years. Provisional gameplay built on the mod's geography."
 ac_ud_cho_tree:0 "Chopinburg National Programme"
 ac_ud_cho_tree_desc:0 "Chopinburg's own programme from 1991: the Split Island estates, the northern yards, the highland crossings, the smallest chair at the treaty council, the exchange hall and the union hall, Ulysses and the war years. Provisional gameplay built on the mod's geography."
 ac_ud_dor_tree:0 "Dorondian National Programme"
 ac_ud_dor_tree_desc:0 "Dorondo's own programme from 1991: the great anchorage, the docks and their unions, the governance of Iggingen, the Ferustian border, the treaty council, the republic's political future, Ulysses and the war years. Provisional gameplay built on the mod's geography and starting politics."
 ac_ud_fru_tree:0 "Ferustian National Programme"
 ac_ud_fru_tree_desc:0 "Ferustia's own programme from 1991: mending a fractured economy, finding a way to the sea, the Dorondian question, the martial society, the treaty council, the executive's future, Ulysses and the war years. Provisional gameplay built on the mod's geography and starting spirits."
 ac_ud_mina.101.a:0 "Count the money weekly."
 ac_ud_mina.101.b:0 "Begin with the island."
 ac_ud_mina.101.d:0 "The new year's cabinet paper in Chopinburg was short, because the country is small, and blunt, because its authors had nothing to lose. It began with a map. Central Usea lay across the highlands to one side, larger than Chopinburg many times over. Ugellas lay beyond the passes on another. Platania shared the industrial coast and the empty shore between them. Chopinburg sat in the middle, with an inland capital, a rubber island, three tired shipyards and a seat on a treaty council where everyone else was bigger.\n\nThe paper did not pretend this was a weakness to be overcome. It was a fact to be used. The island's rubber was wanted by every factory on the continent. The northern yards could repair the neighbours' ships. The highland crossings carried more trade than anyone admitted. And the treaty council, for all its size, needed members willing to do the dull work of drafting rules that larger members preferred to argue about.\n\nWhat the paper could not say was which of these things should come first. The estate houses wanted the island settled in their favour. The yard unions wanted orders. The customs service wanted the highlands closed, and the highland families wanted them open. The cabinet resolved, as small cabinets do, to begin everything at once and to count the money weekly.\n\nProvisional gameplay: no source covers Chopinburg; its geography and starting position are mod provenance (history/countries/CHO - Chopinburg.txt, history/states)."
 ac_ud_mina.101.t:0 "A Country Between Neighbours"
 ac_ud_mina.102.a:0 "Hear the island's delegations in the capital."
 ac_ud_mina.102.b:0 "Decide in cabinet and announce it."
 ac_ud_mina.102.d:0 "The surveyors came back from Split Island with sunburn, fevers and three hundred pages of findings, and the findings were worse than anyone had expected. The island's rubber field is one of the richest on the continent. Its ownership is a tangle of old estate grants, unwritten tenancies and debts that pass from father to son. Most of the trees are tapped by families who do not own the ground beneath them and are paid in scrip redeemable only at the estate store.\n\nThree answers are now before the cabinet, and each has its champions. The estate houses propose that the state simply confirm their holdings in law, collect a fixed royalty and leave the plantations to people who have run them for generations. The tappers' associations, backed by the island's priests and schoolteachers, propose a smallholders' charter: title to the ground for the families who work it, and credit banks to help them keep it. The Treasury proposes a third way, a single public exchange in the capital through which all island latex must be sold, so that large and small growers alike receive one price and the state takes its margin at the counter.\n\nEvery answer has a cost. The monopoly is cheap to run and angers the island. The charter is popular and requires an administration Chopinburg does not have. The exchange is efficient and makes the state the island's largest merchant, with every quarrel that implies. The cabinet must choose, because the foreign buyers have begun to ask who they should be talking to.\n\nProvisional gameplay: no source covers Chopinburg; its geography and starting position are mod provenance (history/countries/CHO - Chopinburg.txt, history/states)."
 ac_ud_mina.102.t:0 "The Split Island Question"
 ac_ud_mina.103.a:0 "Tell the managers to advertise the berths."
 ac_ud_mina.103.b:0 "Promise the apprentices first."
 ac_ud_mina.103.d:0 "The books of the three northern yards arrived in the capital in tea chests, and the clerks who opened them found the history of an industry in slow decline. The yards had built coasters and tugs for a generation, then repaired them, then repaired other people's, then very little at all. The cranes still worked. The slipways were sound. The riveters and fitters who knew how to use them were growing old.\n\nYet the books also showed something the cabinet had not expected. Merchant captains from Platania, Ugellas and Central Usea still asked for berths in the northern yards, because the work there was good and cheap and the harbour master did not lose papers. A small, steady trade in repairs had kept the yards alive without anyone in the capital noticing.\n\nThe yard managers' covering letter makes two requests. The first is for apprentices, before the old hands retire and take their skills with them. The second is for a decision: should the yards make a living mending the neighbours' fleets, or should they try once more to build ships of their own? The managers note, politely, that they would like an answer before the next order book closes.\n\nProvisional gameplay: no source covers Chopinburg; its geography and starting position are mod provenance (history/countries/CHO - Chopinburg.txt, history/states)."
 ac_ud_mina.103.t:0 "The Yard Books"
 ac_ud_mina.104.a:0 "Send the rangers to listen before they patrol."
 ac_ud_mina.104.b:0 "Send the customs officers first."
 ac_ud_mina.104.d:0 "On paper, the highland border with Central Usea and the passes toward Ugellas carry a modest trade in timber, wool and machine parts. In practice, the customs service estimates that three cargoes cross unrecorded for every one that crosses with a manifest. Mule trains move by night along paths no surveyor has mapped. Whole villages on both sides of the line live from the difference between one country's prices and the other's.\n\nThe Interior Ministry wants this ended. It proposes a customs cordon: a post at every crossing, a licence for every mule train, mounted rangers on the high paths and a firm rule that what cannot be declared cannot cross. The Ministry of Trade argues the opposite. The highland families have traded across the line for longer than either state has existed. A trusted traders' pass would let known hauliers cross without search, bring the trade into the open, and cost far less than a cordon.\n\nNeither ministry pretends its plan is free of risk. A cordon will be resented in the highlands and may push the smugglers onto worse paths with worse cargoes. A pass will be abused by some of the people who carry it. The highland villages, consulted for once, have replied that they will live with whatever the capital decides, as they always have, but would prefer to be asked again before it changes its mind.\n\nThe old mountaineer training, the General Staff adds, would serve either plan.\n\nProvisional gameplay: no source covers Chopinburg; its geography and starting position are mod provenance (history/countries/CHO - Chopinburg.txt, history/states)."
 ac_ud_mina.104.t:0 "The Highland Crossings"
 ac_ud_mina.105.a:0 "Give the delegation a second typist."
 ac_ud_mina.105.b:0 "Ask the other small members to breakfast."
 ac_ud_mina.105.d:0 "Chopinburg's delegation to the Central Usean Treaty Council travels with two officials, one typist and a briefcase of positions that rarely survive the first morning. The council's large members arrive with staffs of dozens. Their delegates speak first, speak longest and expect the small members to listen. Chopinburg has listened for years. The foreign service now asks whether listening is the best use of its chair.\n\nThere are two ways, the service suggests, for a small member to matter. The first is to become indispensable to the large members: to send the country's most capable clerks to staff the council's committees and draft its papers, so that every rule passes through Chopinburgian hands before it reaches the chamber. The second is to stop acting alone. The council's other small members share Chopinburg's interests in transit, relief and fair contributions. If they agreed their positions before each session and voted together, the large members would have to consult them as a bloc.\n\nThe first path needs talent the country can barely spare. The second needs partners who may not always keep their word. Either way, the delegation will have to grow, and the Treasury has already asked how much a typist costs in the council city.\n\nThe cabinet notes that neither path requires Chopinburg to change its obligations under the treaty, only to take them more seriously than the larger members do.\n\nProvisional gameplay: no source covers Chopinburg; its geography and starting position are mod provenance (history/countries/CHO - Chopinburg.txt, history/states)."
 ac_ud_mina.105.t:0 "The Smallest Chair at the Table"
 ac_ud_mina.106.a:0 "Let the square have its say."
 ac_ud_mina.106.b:0 "Clear the square at dusk."
 ac_ud_mina.106.d:0 "Two buildings stand on opposite sides of the capital's main square, and between them they now hold more authority than the government that sits behind them. The exchange hall is where rubber is priced, contracts signed and credit extended. The union hall is where the yard crews, estate tappers and highland hauliers meet, vote and decide when to stop work. For most of Chopinburg's history the two halls have quarrelled. This year they have each proposed to govern.\n\nThe exchange houses argue that the country lives by its trade, and that those who manage the trade should manage the state. They offer a directorate: the estate houses, exporters and bankers sitting together, setting prices, balancing accounts and running the country with the care of a well-kept ledger. They promise stability, solvency and an end to strikes.\n\nThe unions argue that the country lives by its work, and that those who do the work should choose who governs it. They offer an assembly: elected delegates from every yard, estate and haulage depot, a cabinet that meets in the union hall in public, and a national ballot within a year. They promise fairness, openness and an end to scrip.\n\nThe present government, which owes its existence to neither hall, has discovered that it cannot govern against both. It can choose one. It can try to keep the balance a while longer. The square between the halls has been very crowded every evening this month.\n\nProvisional gameplay: no source covers Chopinburg; its geography and starting position are mod provenance (history/countries/CHO - Chopinburg.txt, history/states)."
 ac_ud_mina.106.t:0 "The Exchange Hall and the Union Hall"
 ac_ud_mina.107.a:0 "The accounts must balance."
 ac_ud_mina.107.d:0 "The handover took place in the exchange hall at the close of trading, so as not to disturb the morning's prices. The outgoing ministers signed the transfer at a table usually reserved for contracts. The directorate, seated in a row beneath the price board, signed it as one body and did not give speeches. Its first notice was posted on the exchange floor ten minutes later: the government of Chopinburg was now the Rubber Exchange Directorate, all ministries would continue their work, and the price of island latex would be published at noon as usual.\n\nThe directorate speaks as an office, and its members prefer it so. They are the heads of estate houses, exporting firms and banks, and they intend to run the country as they run their businesses: carefully, quietly and with the accounts in order. Within a week the Treasury had a new set of books. Within a month the strikes at the northern yards had been settled by a wage agreement the unions had not been asked to sign.\n\nThe union hall has not been closed. Its meetings continue, its newspapers print, and its delegates are invited to submit proposals in writing. Very few of them have done so. The highland families, who distrust both halls equally, report that the customs posts have become more polite and more expensive.\n\nAbroad, the change has been welcomed by the buyers. Platanian and Central Usean trading houses have asked for seats on the exchange floor, and the directorate is considering what such seats should cost.\n\nProvisional gameplay: no source covers Chopinburg; its geography and starting position are mod provenance (history/countries/CHO - Chopinburg.txt, history/states)."
 ac_ud_mina.107.t:0 "The Directorate Takes the Seals"
 ac_ud_mina.108.a:0 "The ballot within a year."
 ac_ud_mina.108.d:0 "The assembly's first session began at the change of shift, so that the night crews from the northern yards could attend before going home. The hall was full by six in the morning. Estate tappers had come by the first ferry from the island, highland hauliers by lorry, and dockworkers from every berth. The outgoing ministers were invited to sit in the front row. Most of them came.\n\nThe assembly governs as an office. Its delegates are elected by their yards, estates and depots and can be recalled by them; the cabinet it appoints meets in the union hall itself and reads its decisions aloud every week to anyone who cares to listen. Its founding resolution sets a national ballot within a year, open to every adult citizen, and forbids the assembly from postponing it.\n\nThe exchange houses have not been abolished. They have been invited to send observers to the cabinet's weekly reading, and to explain, in public, why the scrip still circulating on Split Island should not be redeemed in money at their expense. The observers have attended. Their explanations have not been well received.\n\nThe country is noisier than it was. Strikes have stopped, but meetings have multiplied. Foreign buyers ask whether contracts signed with the old government will be honoured, and the assembly answers that they will, provided the wages paid under them are honest. Whether the union hall can become a parliament before the year is out is the question every newspaper in Chopinburg is now asking.\n\nProvisional gameplay: no source covers Chopinburg; its geography and starting position are mod provenance (history/countries/CHO - Chopinburg.txt, history/states)."
 ac_ud_mina.108.t:0 "The Assembly Meets in the Union Hall"
 ac_ud_mina.109.a:0 "Prepare the coasts and the capital together."
 ac_ud_mina.109.b:0 "Tell the country every estimate we receive."
 ac_ud_mina.109.d:0 "The announcement came from Central Usea on the twentieth of April, and in Chopinburg it was heard first on the highland posts, where the border guards keep their radios tuned to the neighbours' stations. The asteroid Ulysses would strike the Earth. Astronomers had calculated its path; governments across the continent were being told to prepare. By evening the news had reached the island ferries, the northern yards and every cafe in the capital.\n\nChopinburg has no great observatories and no railguns. It has an inland capital, a rubber island exposed to the sea, three shipyards and a seat on a treaty council whose larger members will make the decisions that matter. The cabinet's first meeting after the announcement was given over almost entirely to a single question: where in a small country can people be kept safe from a disaster no one can yet locate?\n\nTwo answers emerged. The coastal provinces want an evacuation plan: ferries, lighters and the estate railway organised to move the island and the shore inland at short notice. The capital's officials want the reverse: prepare the inland city's schools, cellars and warehouses as refuges and bring the coast to them. Both plans cost more than the budget can bear, and both depend on warnings that may arrive late.\n\nThe northern yards have offered a third idea: old hulls fitted as floating stores that can move away from whatever coast is struck. The cabinet has asked them to cost it.\n\nProvisional gameplay: Chopinburg's response is unsourced; the announcement date is official (ACES Chronicle, 1996 / 04.20)."
 ac_ud_mina.109.t:0 "The Announcement Next Door"
 ac_ud_mina.110.a:0 "Send the hulls to the island first."
 ac_ud_mina.110.b:0 "Hold the reserves for the capital."
 ac_ud_mina.110.d:0 "On the eighth of July Ulysses broke apart, and its fragments lit the sky over Usea from one horizon to the other. Chopinburg watched from rooftops, harbour walls and the decks of the shelter hulls. No one in the capital could say that night where the fragments had come down, and the first reports, when they came, contradicted one another.\n\nWhat reached Chopinburg first was not news but absence. Ferries ran late, then not at all, and the island's harbours, which live on the daily boats, began to count their flour and fuel by the sack. On the second day the first boats arrived from the neighbours' damaged ports, crowded with people who had nowhere else to go. On the third day the price of flour doubled in the capital.\n\nThe preparations of three years are now being tested in ways no plan anticipated. The government has the shelter hulls, the stores and whatever the treaty council can be persuaded to send. It does not yet have a clear idea of how long the strain will last, or how many more boats will come. The cabinet has decided to treat every decision as temporary, and to take them quickly.\n\nProvisional gameplay: Chopinburg's response is unsourced; the impact date is official (ACES Chronicle, 1999 / 07.08)."
 ac_ud_mina.110.t:0 "The Night the Sky Broke"
 ac_ud_mina.111.a:0 "Neutrality begins at the passes."
 ac_ud_mina.111.b:0 "Neutrality begins in the yards."
 ac_ud_mina.111.d:0 "Erusea has invaded San Salvacion and seized the railgun site at Stonehenge, and Central Usea is gathering a coalition to drive it out. The news reached Chopinburg the way news always does, across the highlands, and with it came the realisation that the country's largest neighbour is now at war.\n\nChopinburg is a treaty member, not a combatant. Its obligations under the council do not include joining the coalition, and the cabinet has no intention of joining it. But neutrality next door to a belligerent is a demanding thing. Central Usean officers have asked about the highland roads. Merchant captains have asked whether the northern yards will refit hulls for war work. Agents from every side are buying rubber in the exchange at prices that make the estate houses dizzy.\n\nThe General Staff proposes to close the highland passes to every army and to keep the mountain companies on their posts through the summer. The yard managers propose something different: to refit merchant hulls as unarmed hospital ships at cost, for whoever asks, so that the yards serve the war's wounded without serving its armies. The Treasury proposes to sell rubber to all comers at the published price and to refuse every private arrangement.\n\nNone of these proposals excludes the others entirely, but each sets a tone. The cabinet must decide what kind of neutral Chopinburg will be before its neighbours decide for it.\n\nProvisional gameplay: Chopinburg's response is unsourced; the war date is official (ACES Chronicle, 2003 / SUMMER, 2003 / 08.22)."
 ac_ud_mina.111.t:0 "War Beyond the Highlands"
 ac_ud_mina.112.a:0 "Offer the yards to the neighbours' fleets."
 ac_ud_mina.112.b:0 "Send the bills, politely."
 ac_ud_mina.112.d:0 "The war is over. Erusea has surrendered, Central Usea is counting its losses, and the highland posts have returned to their peacetime strength. Chopinburg was never invaded, never bombed and never asked to choose a side in a way it could not refuse. In a decade that took so much from its neighbours, that is no small thing.\n\nIt is also not the end of the story. The neighbours' ports are full of damaged ships, and the northern yards have more work than they can handle. The treaty council, which spent the war arguing about transit and relief, now wants to argue about reconstruction, and Chopinburg's clerks and caucus partners have opinions ready. The island's rubber is in demand for every rebuilt factory on the continent.\n\nThe question the cabinet now faces is what a small country owes the large ones that fought the war, and what they owe it in return. Some ministers want to offer the yards and the clerks freely, as a down payment on goodwill. Others want to be paid, politely and in full, as a small country always should be.\n\nProvisional gameplay: Chopinburg's response is unsourced; the end of the war date is official (ACES Chronicle, 2005 / 09.19)."
 ac_ud_mina.112.t:0 "Chopinburg After the War"
 ac_ud_mina.201.a:0 "Publish the ledger in the gazette."
 ac_ud_mina.201.b:0 "Circulate it to the ministries only."
 ac_ud_mina.201.d:0 "Platania has always kept its accounts at the harbour office in Scardilli, in tall ledgers bound in green cloth, and every government has eventually discovered that those ledgers describe the country better than its census. This year the harbour master has been asked to do something new: to count not only cargoes and tonnage, but people, districts and debts, from the Pantellia Islands to the farthest farms of the Scofields Plateau.\n\nThe first volumes are unflattering. Scardilli is rich, crowded and owed money by almost everyone. Casale moves the ore and grain of the plateau to the sea and keeps little of the profit. The islands land their catch in the capital because they have no cold stores of their own. The plateau feeds the country and mines its ore, and sends fewer members to the assembly than a single harbour ward. Beyond the plateau lies the inland march, a country of passing traffic and very few settled towns.\n\nNone of this is news to Platanians. What is new is seeing it written down in a single place, in figures that cannot be argued with. The harbour office has delivered its ledger to the government with a short covering note. A country that measures itself in cargoes, it observes, will eventually be governed by whoever owns the ships.\n\nProvisional gameplay: no source covers Platania; its geography and treaty membership are mod provenance (history/countries/PLA - Platania.txt, history/states)."
 ac_ud_mina.201.t:0 "The Harbour Ledger"
 ac_ud_mina.202.a:0 "Hear all three proposals in the assembly."
 ac_ud_mina.202.b:0 "Let the houses argue among themselves first."
 ac_ud_mina.202.d:0 "There are eleven great merchant houses in Scardilli, and between them they own most of the warehouses on the quays, most of the lighters in the harbour and a remarkable share of the debts owed by everyone else in Platania. They have survived wars, crashes, fires and at least two governments that promised to break them. They have also, more than once, failed all at once and taken half the country's savings with them.\n\nThree proposals now lie before the government, and each has its party. The free-traders want Scardilli declared a free port, with no duties on goods in transit and the harbour's revenue drawn from fees alone. They argue that a busy port pays for everything, and that the houses will grow too rich to fail. The older houses want the opposite: chartered guilds with fixed shares of each trade, merchant courts and an end to the ruinous competition that brought the last two collapses. A third party, drawn from the ministries and the yards, wants the state to buy hulls of its own and run a national shipping line, so that Platanian trade no longer depends on foreign charters or on the houses' good humour.\n\nEach proposal would change who holds power in Scardilli. The free port would favour the newest houses and the foreign agents who trade with them. The guilds would favour the oldest houses and freeze the order of the harbour as it stands. The national line would bring the state into the harbour as a competitor, and the houses have not forgotten what happened to the last government that tried.\n\nThe harbour office's advice is brief. Whatever is chosen must be chosen soon. The exchange is already pricing in each outcome, and uncertainty is the one cargo nobody in Scardilli can insure.\n\nProvisional gameplay: no source covers Platania; its geography and treaty membership are mod provenance (history/countries/PLA - Platania.txt, history/states)."
 ac_ud_mina.202.t:0 "The Houses of Scardilli"
 ac_ud_mina.203.a:0 "Send a minister out on the morning ferry."
 ac_ud_mina.203.b:0 "Ask the War Ministry for its full plan."
 ac_ud_mina.203.d:0 "The ferry from Scardilli to the Pantellia Islands takes most of a day in good weather and does not run at all in bad. That single fact explains a great deal about island politics. Islanders are Platanian, and very few of them would say otherwise. But they have spent generations waiting for decisions made on the mainland, by officials who come out on the morning boat and leave on the evening one.\n\nThe island councils have sent the government a petition, signed in every harbour on the chain. It does not ask for independence, and its authors are careful to say so in the first paragraph. It asks for an island charter: an elected board to run the harbours, the fisheries and the schools, a subsidised ferry that runs on a timetable, and cold stores so that the catch can be landed at home. It is a modest document, and in Scardilli it has caused alarm out of all proportion to its contents.\n\nThe War Ministry's reply is that the islands guard the approaches to the capital and cannot be left to an elected fisheries board. It proposes the opposite course: govern the islands as any other province, with officials from Scardilli, a proper garrison and a naval station watching the sea lanes. The islanders, it notes, would also gain a slipway and fuel bunkers, which is more than their board could ever afford.\n\nBoth proposals claim to be the best way of keeping the islands Platanian. The cabinet suspects that one of them is right, and that choosing the wrong one would be remembered on the islands for a very long time.\n\nProvisional gameplay: no source covers Platania; its geography and treaty membership are mod provenance (history/countries/PLA - Platania.txt, history/states)."
 ac_ud_mina.203.t:0 "What the Islands Want"
 ac_ud_mina.204.a:0 "Publish both reports on the plateau."
 ac_ud_mina.204.b:0 "Send the reports to the exchange first."
 ac_ud_mina.204.d:0 "The survey teams spent a full season on the Scofields Plateau, and they came back with two reports that seem to describe different countries. The geological report describes ore beds of real value, reachable by modest workings and a rail spur to Casale. The agricultural report describes the farms that feed the capital: good soil, short of water, short of credit and permanently in debt to buyers in Scardilli who set the price of grain before it is harvested.\n\nThe plateau has noticed the surveyors, and it has noticed what they were counting. Its farm councils have begun to ask why the country's food and ore both come from the plateau while its money, its members and its ministries all stay on the coast. The mining towns ask the same question in rougher language. Casale, which carries the plateau's produce to the sea and keeps little of the profit, has started to ask it too.\n\nThe ministries see two ways forward. The plateau can be developed for its ore, with concessions, a mining board and an ore road to the coast. That would bring money and work quickly, and it would bring the merchant houses onto the plateau as investors. Or the plateau can be developed for its farms, with public granaries, fixed purchase prices and a rural credit bank that lends against the harvest. That would bring security more slowly, and it would take the price of bread out of the houses' hands.\n\nThe two plans are not compatible, at least not with the money available. Whichever is chosen, the plateau will remember who chose it, and why.\n\nProvisional gameplay: no source covers Platania; its geography and treaty membership are mod provenance (history/countries/PLA - Platania.txt, history/states)."
 ac_ud_mina.204.t:0 "The Survey of the Plateau"
 ac_ud_mina.205.a:0 "Instruct the delegation to prepare both positions."
 ac_ud_mina.205.d:0 "Platanian delegates to the Central Usean Treaty Council have a reputation in the chamber. Other members arrive with security papers and emergency plans; the Platanians arrive with tariff tables. They have always treated the council as a trading forum first and a defensive arrangement second, and their colleagues have mostly been grateful that someone is willing to read the customs schedules.\n\nThis session, the delegation has asked the government for instructions on a question it can no longer avoid. The council is drafting common rules for trade between its members. Some members want a common outer tariff, so that treaty goods move freely inside and outside goods pay at the border. Others want the council to guarantee open sea lanes and open harbours to every flag, members and outsiders alike, on equal terms.\n\nFor Platania the choice is not abstract. A common tariff would protect the plateau's grain and ore against cheaper imports, and Platanian customs officers would be well placed to draft the schedule. Open sea lanes would suit the harbour of Scardilli, whose wealth comes from carrying everyone's cargo, and the pilots and salvage crews whose rules the council would probably adopt.\n\nThe delegation's own preference is plain from the way its letter is written. It has asked for instructions all the same, because the plateau and the port are both reading the newspapers, and both will hold the government responsible for the answer.\n\nProvisional gameplay: no source covers Platania; its geography and treaty membership are mod provenance (history/countries/PLA - Platania.txt, history/states)."
 ac_ud_mina.205.t:0 "A Market Called a Council"
 ac_ud_mina.206.a:0 "Commission the yards' first warship design."
 ac_ud_mina.206.b:0 "Keep the yards on merchant work for now."
 ac_ud_mina.206.d:0 "The Scardilli yards reopened this week with new cranes on the fitting-out basin and a covered slip large enough to take a frigate. The harbour came out to watch the first plates lifted into place, and the newspapers have already begun to argue about what the yards should build.\n\nThere are two schools of thought in the Admiralty, and each has written a paper. The first holds that Platania lives by the sea lanes and should be able to defend them: a small blue-water squadron of escorts, able to sail with merchant convoys beyond the coast and to show the flag in foreign harbours. It would be expensive, and it would need years of exercises before it was any good, but it would give Platania a voice at sea.\n\nThe second holds that Platania cannot afford to rule the open sea and should not try. It proposes a coastal flotilla instead: fast boats, minelayers, shore radar on the Pantellia Islands and a chart of every channel that could be closed in a crisis. It would make Platanian waters too costly to enter uninvited, and it would cost less than half as much as the squadron.\n\nThe merchant houses favour the squadron, because it would protect their ships wherever they sail. The islanders favour the flotilla, because it would be based on their coasts. The Treasury favours whichever is cheaper, and has said so in a third paper that nobody requested.\n\nProvisional gameplay: no source covers Platania; its geography and treaty membership are mod provenance (history/countries/PLA - Platania.txt, history/states)."
 ac_ud_mina.206.t:0 "The Yards and the Navy"
 ac_ud_mina.207.a:0 "Open the bridge with a market fair."
 ac_ud_mina.207.d:0 "The old timber crossing at Seals Bridge has failed in every flood season anyone can remember. When it fails, the coast road and the plateau road become two separate countries for a month, and the price of bread in Scardilli rises while the plateau's grain waits on the far bank. Every government has promised a proper bridge. This one has built it.\n\nThe new crossing is steel on concrete piers, wide enough for two lorries and a rail track, and high enough to clear any flood the engineers could find in the records. It was paid for partly by the treasury and partly by a levy on the island and plateau trade it now carries, which the islanders and the plateau farmers both noticed and both paid.\n\nAt the opening, a delegation from the islands and a delegation from the plateau crossed from opposite banks and met in the middle, which was the engineers' idea and turned out to be a good one. The newspapers printed the photograph on their front pages. For a few days, at least, Platanians talked about the country as one place rather than three.\n\nProvisional gameplay: no source covers Platania; its geography and treaty membership are mod provenance (history/countries/PLA - Platania.txt, history/states)."
 ac_ud_mina.207.t:0 "The Bridge at Seals Bridge"
 ac_ud_mina.208.a:0 "Let the regions argue it in public."
 ac_ud_mina.208.b:0 "Keep the argument inside the assembly."
 ac_ud_mina.208.d:0 "The assembly in Scardilli was designed for a country of merchants, and for a long time that is what Platania was. It is no longer the only thing Platania is. The plateau has its granaries or its mines, its credit bank or its ore road, and its farm councils and mining towns have learned to organise. The islands have their charter or their station, their harbours and their ferries. The houses of Scardilli have their exchange. Each has grown stronger in its own way, and each now wants the government to reflect the Platania it lives in.\n\nThree answers are being argued in the newspapers and the cafes. The houses and the ratepayers of the ports want a mercantile senate, elected by those who pay the harbour rates, with the assembly beneath it. They argue that commerce built the country and that a government of merchants will at least know how to balance its books. The islanders and many in the smaller towns want a compact: an executive in which port, plateau and islands each hold a veto, so that no region can govern the others again. The plateau's farm councils, mine crews and the dockworkers of Scardilli and Casale want a cooperative union, which would take the government out of the houses' hands entirely.\n\nEach answer frightens someone. The plateau fears a senate of ratepayers, because it pays few harbour rates. The houses fear a cooperative union, for obvious reasons. Almost everyone fears that a compact of vetoes would never decide anything at all, though the islanders point out that this might be an improvement.\n\nThe present government has said little, except that the assembly as it stands cannot carry the argument much longer. The exchange, as usual, has already begun pricing the outcome.\n\nProvisional gameplay: no source covers Platania; its geography and treaty membership are mod provenance (history/countries/PLA - Platania.txt, history/states)."
 ac_ud_mina.208.t:0 "Port, Plateau and Islands"
 ac_ud_mina.209.a:0 "Commerce will be judged by its results."
 ac_ud_mina.209.d:0 "The senate met for the first time in the old exchange hall, because the assembly chamber was too small and because the houses wanted it that way. Its members were elected by the ratepayers of the ports, which means by the people who pay the harbour rates, which means very largely by the merchant houses, their clerks and their creditors. Nobody pretended otherwise.\n\nThe senate governs as an office, and its members are not named in its decrees. Its first acts were characteristically businesslike. It published the national accounts in full, set the harbour rates for the coming year and appointed a commission to draft its own charter, with a clause requiring every public contract above a fixed sum to be tendered openly. The newspapers, most of which are owned by one house or another, approved.\n\nOutside Scardilli the welcome was cooler. On the plateau the farm councils called the senate a counting house with a flag, and pointed out that the franchise excluded most of them. On the islands, the harbour boards asked what a senate of ratepayers would do for fishermen who pay rates on very little. The senate's answer, delivered in its first communique, was that a prosperous harbour would pay for everything else, and that it intended to be judged by results.\n\nThe houses have governed Platania indirectly for most of its history. Now they govern it directly, in public, and must answer for it at the next ballot.\n\nProvisional gameplay: no source covers Platania; its geography and treaty membership are mod provenance (history/countries/PLA - Platania.txt, history/states)."
 ac_ud_mina.209.t:0 "The Mercantile Senate Sits"
 ac_ud_mina.210.a:0 "Slow government is still government."
 ac_ud_mina.210.d:0 "The compact was signed at Seals Bridge, on a table set up in the middle of the new crossing, because none of the three regions would agree to sign it in either of the others. The delegates of the port, the plateau and the islands each brought a copy, each read it aloud and each signed all three. It took most of a day. Nobody complained, because the whole point of the compact is that nothing will be done quickly again.\n\nThe compact executive governs as an office, and its members are not named in its acts. Its articles divide revenue by a formula that everyone has read and nobody fully understands, require unanimity on taxes and on any change to the compact itself, and allow any region to suspend a law that falls on it alone until the executive has met again. In practice this means that the islands can stop a fisheries law, the plateau can stop a grain law and the port can stop a harbour law, and all three can stop a budget.\n\nCritics in Scardilli call it a recipe for paralysis, and they may be right. Its supporters reply that Platania has tried every other recipe, and that a government which cannot act against any region is at least a government no region needs to fear. The islanders, for once, are the most enthusiastic Platanians in the country.\n\nThe first meeting of the executive lasted eleven hours and produced a single decision: to meet again in a month. The newspapers reported this as a failure. The delegates seemed to regard it as a success.\n\nProvisional gameplay: no source covers Platania; its geography and treaty membership are mod provenance (history/countries/PLA - Platania.txt, history/states)."
 ac_ud_mina.210.t:0 "The Compact Is Signed"
 ac_ud_mina.211.a:0 "The harvest belongs to the plateau."
 ac_ud_mina.211.d:0 "The union took office in Casale rather than Scardilli, which told the country most of what it needed to know. The farm councils of the plateau, the mine crews of the ore road and the dockworkers of both ports had been organising together for years, and when the government finally fell they were the only organisation in the country with branches in every district.\n\nThe union's council governs as an office, and its members are not named in its decrees. It describes itself as a congress of cooperatives rather than a party, and its founding programme reads like one: the plateau mines to the miners who work them, the plateau harvest to boards that sell bread at a fixed price, the docks to the cooperatives that load the ships. The merchant houses keep their ships and their warehouses. They lose the right to set the price of everything else.\n\nScardilli received the news in silence. The exchange suspended trading for a day, then reopened with prices that suggested the houses expected to survive, if not to thrive. Some houses have begun moving their registrations abroad. Others have quietly asked the union which of their trades it intends to leave alone, and have been surprised by how long the answer is.\n\nOn the plateau there were bonfires. In the islands, where the union has few members, the harbour boards asked to be consulted before anything changed. The union council has promised that they will be, and has sent a delegation out on the morning ferry to prove it.\n\nProvisional gameplay: no source covers Platania; its geography and treaty membership are mod provenance (history/countries/PLA - Platania.txt, history/states)."
 ac_ud_mina.211.t:0 "The Cooperative Union Takes Office"
 ac_ud_mina.212.a:0 "Prepare the ships and the shelters together."
 ac_ud_mina.212.b:0 "Tell the country everything we know."
 ac_ud_mina.212.d:0 "The announcement reached Scardilli from Central Usea on the twentieth of April, on the morning shipping broadcast, between the weather forecast and the harbour notices. The asteroid Ulysses would strike the Earth. Governments across the continent were being told to prepare. The broadcast continued with the tide tables, because nobody in the studio knew what else to do.\n\nPlatania is a country of harbours, and its first instinct was to look to the sea. The harbour office has already drawn up lists: every hull in Platanian registry, its tonnage, its crew and the number of passengers it could carry in an emergency. The Admiralty has added the island ferries and the coastal craft. On paper, Platanian shipping could move the population of several coastal towns in a matter of days.\n\nThe plateau's answer is different. The coast, its councils argue, is the most exposed place in the country, and the sea may not be safe if fragments fall into it. The plateau stands high above the coast and far from it. Shelters, wells and stores built there could receive the harbour towns, and the bridge at Seals Bridge, if it stands, could carry them. The plateau farmers make the point with some satisfaction. For once the country may need them more than they need the port.\n\nNobody in Platania knows where Ulysses will fall. The government has ordered both plans costed, and has asked the newspapers not to print the shipping lists until a decision is made. They have printed them anyway.\n\nProvisional gameplay: Platania's response is unsourced; the announcement date is official (ACES Chronicle, 1996 / 04.20)."
 ac_ud_mina.212.t:0 "Warning from the Sky"
 ac_ud_mina.213.a:0 "Every warehouse becomes a shelter."
 ac_ud_mina.213.b:0 "Keep the exchange and the quays working."
 ac_ud_mina.213.d:0 "On the eighth of July Ulysses broke apart in the sky, and the night over Platania turned white. Islanders watched from the harbour walls; the plateau watched from its fields. Nobody in the country could say where the fragments had come down, and by morning the rumours had outrun every radio report.\n\nThen the ships began to arrive. The first came into Scardilli two days later, a coaster built for forty passengers carrying more than three hundred people who would not say where they had come from or what they had left behind. More followed every day: fishing boats, ferries, a freighter with families sleeping in its holds. Platania had prepared its ships to carry its own people away from danger. It had not prepared its harbours to receive everyone else's.\n\nThe harbour office is improvising. Warehouses have become dormitories, the exchange hall a clinic, and the bridge road towns are taking in families by the hundred, many of whom arrived with nothing but the clothes they stood in. Grain is being moved down from the plateau faster than the farmers would like. The capacity built over three years of preparation is being spent in weeks.\n\nTwo questions cannot wait. The first is how long Platania can keep its harbours open to every ship that reaches them. The second, which the ministries are already asking quietly, is what happens when the ships keep coming after the space runs out.\n\nProvisional gameplay: Platania's response is unsourced; the impact date is official (ACES Chronicle, 1999 / 07.08)."
 ac_ud_mina.213.t:0 "The Fall and the Ships"
 ac_ud_mina.214.a:0 "Neutrality must be seen at sea."
 ac_ud_mina.214.b:0 "Neutrality must still earn its keep."
 ac_ud_mina.214.d:0 "The war has come to Usea. Erusea has moved against San Salvacion and seized the railgun site at Stonehenge, and Central Usea is gathering a coalition to drive it back. Platania is not a party to the fighting. It holds no alliance obligations beyond its treaty council seat, and its government has said, repeatedly and in writing, that it intends to remain neutral.\n\nNeutrality is easier to declare in a harbour than to keep in one. Within weeks, agents of every kind appeared at the exchange, buying freight space, fuel and insurance for cargoes whose destinations they preferred not to discuss. Insurance rates for Platanian ships doubled, then doubled again. The Admiralty reports unidentified submarines in the approaches to the islands. The treaty council, meanwhile, is debating what its members owe one another in a war that none of them chose.\n\nTwo courses are open. Platania can sail under its own flag, lit and marked, carrying civilian cargo for any buyer who can prove it is civilian, and accept that some will lie. Or it can grant the coalition, now calling itself ISAF, the use of Scardilli for hospital ships and supply tenders under Platanian harbour rules, without joining the alliance. Either choice will be watched by both sides, and either will be remembered.\n\nThe harbour master has posted a single notice on the quays in the meantime. No warship of any flag will enter Scardilli without permission, and no wounded sailor will be refused a berth.\n\nProvisional gameplay: Platania's response is unsourced; the war date is official (ACES Chronicle, 2003 / SUMMER, 2003 / 08.22)."
 ac_ud_mina.214.t:0 "War on the Continent"
 ac_ud_mina.215.a:0 "Put the ships back on the trade routes."
 ac_ud_mina.215.b:0 "Rebuild the island harbours first."
 ac_ud_mina.215.d:0 "The war is over, and Platanian ships are still at sea, carrying grain to harbours that have reopened and survivors home to coasts that are beginning to rebuild. Platania was never invaded and never bombed. Its ships sailed through the worst of the fighting under their own flag, and some of them did not come back. The harbour office is compiling a list of their names for the exchange hall wall.\n\nPeace has brought its own arguments. The houses want the insurance rates to fall and the convoys to stand down. The plateau wants the grain it sent to the coast during the war to be paid for at a fair price. The islands want their harbours, which carried more than their share of the refugee traffic, to be rebuilt first. All three are right, and the treasury cannot pay for all of it at once.\n\nWhatever government Platania chose in the 1990s now faces the question every government faces after a war: what the peace is for. The country that came out of the decade is not the country that entered it. It has a bridge, a navy of sorts and a great many new citizens who arrived by sea. It also has a seat at a treaty council whose members now owe it favours, which in Scardilli is the most valuable cargo of all.\n\nProvisional gameplay: Platania's response is unsourced; the end of the war date is official (ACES Chronicle, 2005 / 09.19)."
 ac_ud_mina.215.t:0 "Platania After the War"
 ac_ud_mina.301.a:0 "Begin with the factories."
 ac_ud_mina.301.b:0 "Begin with the border posts."
 ac_ud_mina.301.d:0 "The report reached the State Executive in four bound volumes and a single page of summary, and it was the summary that kept the lights burning late in Ganzir. Ferustia had survived the rebellion. It had not survived it intact. The furnaces of the capital district were banked, the machine shops of Ilsede worked half weeks, and the plantations of Sandbury and Mount Waia sold their latex to whichever buyer reached the estate gates first.\n\nEveryone in the room knew the deeper problem. For years the country had been governed as if the emergency would end next month. Decrees written for a crisis had become the law of daily life: the industrial ledger that recorded every loss, the rebellion decrees that treated the Dorondian border as a front, the musters that expected every citizen to answer a call to arms. None of them had been designed to last. All of them had.\n\nThe summary closed with a question rather than a recommendation. Ferustia could keep governing by emergency, which it knew how to do, or it could begin the slow work of governing as an ordinary state, which no one in the room had done before. The executive chose to begin with the inventory itself: every works, every pass, every border post and every ministry, counted honestly, before any promise was made.\n\nProvisional gameplay: no source covers Ferustia; its geography and starting spirits are mod provenance (history/countries/FRU - Ferustia.txt, history/states)."
 ac_ud_mina.301.t:0 "The Executive Takes Stock"
 ac_ud_mina.302.a:0 "Publish the ledger in full."
 ac_ud_mina.302.b:0 "Keep the detailed accounts within the ministry."
 ac_ud_mina.302.d:0 "For the first time since the rebellion, the Ministry of Industry has published a ledger with more entries in the column of things repaired than in the column of things lost. The ledger is a modest document. It counts furnaces relit, machine tools recovered, rail spurs reopened and contracts signed. Its importance is that it exists at all.\n\nThe emergency ledger it replaces was written in the worst months, when the works of Iggingen and the districts around it passed under Dorondian administration and took a third of the country's heavy industry with them. Every allocation since then has been made against that loss. Coal went first to the plants that could replace what was gone; skilled workers were directed to them by decree; the rest of the economy waited. It kept Ferustia alive. It also kept Ferustia poor.\n\nRetiring the emergency ledger does not restore what was lost. It changes the question. The plains economy will now be judged by what it can make, and the ministry will plan for growth rather than for survival. Some managers welcome the change. Others, who spent a decade defending their allocations, are less certain that a normal economy will remember them.\n\nProvisional gameplay: no source covers Ferustia; its geography and starting spirits are mod provenance (history/countries/FRU - Ferustia.txt, history/states)."
 ac_ud_mina.302.t:0 "The Ledger of Loss"
 ac_ud_mina.303.a:0 "Let the cabinet argue it out."
 ac_ud_mina.303.b:0 "Brief the border posts first."
 ac_ud_mina.303.d:0 "The file is thin, and that is the first thing the executive notices. Years of speeches about Iggingen have produced very little paper about it. There are maps, lists of works and their pre-rebellion output, names of families who left and families who stayed. There is almost nothing about what Ferustia could actually do.\n\nThe officials who assembled it have been unusually frank. The works of Iggingen run under Dorondian administration, and they run well. The district's people have lived under that administration for most of a decade. The rebellion decrees still describe the matter as a rebellion in progress, but the posts on the Altoora road describe it as a border, and the soldiers who man them describe it as a long, dull watch.\n\nThe file does not recommend a policy. It sets out two. Ferustia can build habits with Dorondo, a commission and crossings and hearings, and accept that the question will be settled slowly or not at all. Or it can keep the grievance alive, keep the posts manned and keep its claim in every speech, while promising never to fire first. Neither path, the officials note, involves taking anything back. That was never on the table.\n\nThe executive reads the file twice and sends it, unannotated, to the cabinet. Its covering note asks only that the ministers decide which of the two habits Ferustia can keep for twenty years, since whichever they choose will almost certainly last that long.\n\nProvisional gameplay: no source covers Ferustia; its geography and starting spirits are mod provenance (history/countries/FRU - Ferustia.txt, history/states)."
 ac_ud_mina.303.t:0 "The Iggingen File"
 ac_ud_mina.304.a:0 "Hear both plans in open cabinet."
 ac_ud_mina.304.b:0 "Hear them in closed session."
 ac_ud_mina.304.d:0 "Ferustians like to say that their country has no army, only citizens who own rifles. It is not quite true, and it has not been true for a long time. The martial clubs and village musters that grew up in the rebellion still drill on Sundays, but the men who taught them are ageing, and the young learn more about marching than about anything a modern war would require.\n\nThe General Staff and the Ministry of the Interior have each sent the executive a plan. The Interior wants the musters registered as a citizen reserve with civilian officers, short annual camps and a duty to run civil defence in a crisis. The General Staff wants the money instead: fewer, better soldiers on long service, trained in the passes, with the musters left to wither.\n\nThe arguments are about more than soldiers. A citizen reserve keeps every household inside the state's defence and keeps the army small and civilian. A professional corps makes the army an institution of its own, competent and separate, and some in Ganzir remember what institutions of that kind have done elsewhere in Usea. Others reply that an untrained militia is a comfort, not a defence.\n\nThe cabinet will have to choose, because the budget cannot carry both. Whatever it decides will shape more than the army. It will decide whether the next crisis finds a Ferustian on every street with a warden's armband, or a few thousand professionals in the passes and a great many civilians waiting to be told what to do.\n\nProvisional gameplay: no source covers Ferustia; its geography and starting spirits are mod provenance (history/countries/FRU - Ferustia.txt, history/states)."
 ac_ud_mina.304.t:0 "The Garrison and the Citizen"
 ac_ud_mina.305.a:0 "Instruct the Foreign Ministry to prepare both answers."
 ac_ud_mina.305.d:0 "The Central Usean Treaty Council met again last week. Ferustia read about it in the newspapers. Most of its neighbours sit at that table; their delegates agree on transit rules, emergency arrangements and the movement of goods that Ferustian lorries will later be asked to obey. Ferustia was not consulted, because Ferustia is not a member.\n\nNo one in Ganzir proposes joining. Membership would bring obligations the executive has no wish to accept and arguments it has no wish to have. The question is narrower. Should Ferustia ask to observe, with no vote and no obligations, so that it hears decisions before they reach its borders? Or should it stand apart entirely, keep larger reserves of its own and trade on whatever terms it can win alone?\n\nThe Foreign Ministry favours observation, and says so at length. The Treasury favours self-reliance, and says so with figures. The executive notes that both arguments assume the same thing: that the council matters to Ferustia whether or not Ferustia matters to the council.\n\nThere is a practical side to the question as well. Ferustian freight crosses member states on every route to the sea. If the council tightens its transit rules, Ferustian lorries will wait at the border for papers they did not know they needed. An observer would know in advance. A country standing apart would need fuel and spare parts enough to wait out the delay, and the Treasury has already priced that reserve to the last drum.\n\nProvisional gameplay: no source covers Ferustia; its geography and starting spirits are mod provenance (history/countries/FRU - Ferustia.txt, history/states)."
 ac_ud_mina.305.t:0 "A Seat Outside the Room"
 ac_ud_mina.306.a:0 "Let the question be argued in public."
 ac_ud_mina.306.b:0 "Keep the argument within the cabinet."
 ac_ud_mina.306.d:0 "The State Executive was created to govern a country in rebellion. It has done so for most of a decade, and it has done so competently enough that few Ferustians can remember any other kind of government. That is precisely the problem now being discussed in every cafe in Ganzir and every mess hall in the passes.\n\nThree answers are on offer. The jurists and the provincial notables want a constitutional convention: a written charter, courts, provincial seats and a free press, with the executive's powers handed to a presidium until the first ballot. The commanders of the mountain garrisons propose something simpler. They have kept the passes open and the border quiet; let them govern as a council, by plain ordinances, until the country is ready for more. The factory delegates and rail crews of the plains have a third answer, and they are loudest of all: a commune of elected assemblies in every works and estate, with the old ministries answering to them.\n\nEach faction has its strength. The convention has the provinces and the newspapers. The garrisons have discipline and the passes. The commune has the plains, which means it has the trains, the furnaces and the plantations. None of them can govern without the others' consent for long, and all of them know it.\n\nThe executive itself has said little. Its last communique notes only that the present arrangement was always meant to be temporary, and that a temporary arrangement which lasts too long becomes a kind of answer of its own.\n\nProvisional gameplay: no source covers Ferustia; its geography and starting spirits are mod provenance (history/countries/FRU - Ferustia.txt, history/states)."
 ac_ud_mina.306.t:0 "The Question of the Executive"
 ac_ud_mina.307.a:0 "The republic begins with its charter."
 ac_ud_mina.307.d:0 "The delegates arrived by every route the country still had: the Mount Waia line, the desert road, buses from the plantation towns and a single chartered aircraft from the eastern border. Some wore suits that had not been out of a wardrobe since before the rebellion. Some wore the work clothes they had left the estates in that morning. All of them were seated in the old assembly hall in Ganzir, which had been cleaned for the occasion and still smelled faintly of the archive boxes stored in it for years.\n\nThe State Executive's last act was to hand its seals to a presidium elected by the delegates. The presidium is an office rather than a person, and it was designed that way on purpose. Its members serve together, sign together and will be replaced together when the first republican ballot is held. The convention's first resolution forbids any of them from standing in that ballot.\n\nOutside the hall the mood is cautious rather than jubilant. Ferustians have seen emergencies declared and extended before. The newspapers, already enjoying a freedom the charter has not yet formally granted, ask the questions everyone is asking: who will command the garrisons, who will pay for the courts, and whether a republic drafted in a single summer can survive its first winter.\n\nThe convention's answer, for now, is the charter itself. Its clauses will be debated one by one, in public, and printed every evening.\n\nProvisional gameplay: no source covers Ferustia; its geography and starting spirits are mod provenance (history/countries/FRU - Ferustia.txt, history/states)."
 ac_ud_mina.307.t:0 "The Convention Sits in Ganzir"
 ac_ud_mina.308.a:0 "Order before politics."
 ac_ud_mina.308.d:0 "There was no parade. The commanders of the mountain garrisons arrived in Ganzir in staff cars, met the State Executive in its offices for three hours and left with its seals. By evening the radio was reading the Garrison Council's first ordinance: all ministries were to continue their work, all border posts were to remain manned, and all political meetings were to be registered with the nearest garrison office.\n\nThe council's members are not named in its ordinances. It speaks as an office, and its commanders have let it be known that they prefer it that way. They are men who have spent careers in the passes, where a road is either open or closed and an order is either obeyed or not. They believe the country needs that clarity more than it needs a debate, and many Ferustians, tired of a decade of emergency, are inclined to agree.\n\nOthers are not. The provincial notables who wanted a convention have been told that a convention can wait. The factory delegates of the plains have been told that their meetings are welcome if they are registered. Both have noticed that the council's ordinances are short, specific and enforced by soldiers.\n\nThe council's first month passes quietly. Trains run on time. The ration queues shorten. The newspapers print the ordinances in full and very little else. Whether that silence is consent or caution, the council does not ask.\n\nProvisional gameplay: no source covers Ferustia; its geography and starting spirits are mod provenance (history/countries/FRU - Ferustia.txt, history/states)."
 ac_ud_mina.308.t:0 "The Garrison Council Takes the Seals"
 ac_ud_mina.309.a:0 "Power to the assemblies."
 ac_ud_mina.309.d:0 "The proclamation was read from the steps of the Ganzir rail works at the change of shift, so that both shifts could hear it. The delegates of the works, the railways and the plantations had met through the night. By morning they had a council, a programme and a name taken from the plains' own old usage: the Ferustian Commune.\n\nThe State Executive did not resist. Its ministries were told to continue their work under the supervision of delegates elected in each department, and most of them did, some with enthusiasm and more with resignation. The garrisons in the passes sent a short message acknowledging the council's authority over civil affairs. What they meant by civil affairs was left, for the moment, undefined.\n\nThe council speaks as an office and its members are not named. The commune's founding text is clear on this point: delegates hold office only while their assemblies want them, and any assembly can recall its delegate by a simple majority. Critics call this a recipe for paralysis. Supporters call it the only kind of government the plains have ever trusted.\n\nIn the plantation towns the estate workers have begun meeting in the same halls where concession agents once read out the price of latex. They intend to read out the price themselves from now on, and to decide for themselves, in open meeting, what it ought to be.\n\nProvisional gameplay: no source covers Ferustia; its geography and starting spirits are mod provenance (history/countries/FRU - Ferustia.txt, history/states)."
 ac_ud_mina.309.t:0 "The Commune Is Proclaimed"
 ac_ud_mina.310.a:0 "Prepare quietly and thoroughly."
 ac_ud_mina.310.b:0 "Tell the country everything we know."
 ac_ud_mina.310.d:0 "The announcement came from Central Usea on the twentieth of April, and it was carried in Ganzir by every radio set that worked. The asteroid Ulysses would strike the Earth. Astronomers had calculated its path; governments across the continent were being told to prepare. For a few hours, the cafes of the capital were silent.\n\nFerustia is a landlocked country. It cannot evacuate to the sea, it builds no railguns and it has no seat on the councils where the great defensive works will be planned. What it has is mountains, plains and time. The Interior Ministry's first estimate is that the country has three years to prepare, and that no one knows yet where the fragments will fall.\n\nTwo schools of thought formed within a week. One holds that the Waiapolo range is the country's natural shelter: mine galleries and railway tunnels can be stocked with water and beds for the plains towns. The other holds that concentration is the greater danger, and that the state should spread its stores, clinics and workshops across every district so that no single blow can cripple it.\n\nThe executive has ordered both plans costed. It has also ordered that nothing be said in public about where Ulysses will fall, because no one in Ferustia knows. The rumours have begun anyway, as rumours do, and the Interior Ministry has started keeping a file of them alongside the costings.\n\nProvisional gameplay: Ferustia's response is unsourced; the announcement date is official (ACES Chronicle, 1996 / 04.20)."
 ac_ud_mina.310.t:0 "The Sky Over the Plains"
 ac_ud_mina.311.a:0 "Every locomotive to relief work."
 ac_ud_mina.311.b:0 "Secure the plains first."
 ac_ud_mina.311.d:0 "On the eighth of July Ulysses passed the point from which it could no longer hold together, and the sky over Usea filled with light. In Ferustia people watched from rooftops and hillsides. No one in Ganzir could say that night where the fragments had come down; the first reports contradicted one another, and the radio stations of the coast fell silent one by one. By morning the plains were quiet, and for a few hours that seemed to be the end of it.\n\nIt was not. Within three days the trains from the coasts stopped running to timetable, then stopped running at all. The markets in Ganzir ran short of flour, then of fuel. On the fifth day the first refugees reached the eastern crossings, on foot and on carts, from towns whose names the border guards did not recognise. The executive's shelter plans had prepared Ferustia to survive a blow. They had not prepared it for the blow to fall on everyone else.\n\nThe ministries now face a different task: keeping the trains moving over the passes, feeding the plains and deciding what to do about the people who keep arriving. The capacity built over three years of preparation is being spent faster than anyone planned. No one in Ganzir yet knows how long the strain will last.\n\nThe first decisions cannot wait for that answer. Trains must be assigned before the grain spoils in the plains depots, and the crossings must be told today whether to let the walkers through. The executive's staff have drafted both orders. They have left the signatures blank.\n\nProvisional gameplay: Ferustia's response is unsourced; the impact date is official (ACES Chronicle, 1999 / 07.08)."
 ac_ud_mina.311.t:0 "The Night of the Fall"
 ac_ud_mina.312.a:0 "Neutrality must be visible."
 ac_ud_mina.312.b:0 "Neutrality must be useful."
 ac_ud_mina.312.d:0 "The war has come to Usea, and for once Ferustia is not at the centre of anyone's quarrel. Erusea's armies have moved against San Salvacion and the railgun site at Stonehenge, and Central Usea is gathering a coalition to push them back. Ferustia is not a party to any of it. It has no treaty obligations, no faction and no wish to acquire either.\n\nThat does not mean the war can be ignored. Ferustia's airspace sits across routes that transport aircraft would like to use. Its roads link countries that may need to move supplies. Its markets are suddenly full of agents buying rubber, fuel and spare parts for armies that would rather not say where they are going. Every request is polite. None of them is entirely innocent.\n\nThe General Staff wants the passes closed and the anti-aircraft batteries manned: armed neutrality, strictly enforced. The Foreign Ministry argues that a neutral that helps no one will be remembered by everyone. Both agree on one point. Whatever Ferustia decides, it must decide it openly and enforce it equally, because a neutral that bends for one side will soon be treated as a belligerent by the other.\n\nIn the meantime the border posts have been given a single instruction, read to every shift: no foreign soldier crosses with a weapon, and no wounded man is turned away, whatever uniform he wears.\n\nProvisional gameplay: Ferustia's response is unsourced; the war date is official (ACES Chronicle, 2003 / SUMMER, 2003 / 08.22)."
 ac_ud_mina.312.t:0 "Between the Fronts"
 ac_ud_mina.313.a:0 "Offer Ferustian help to the neighbours."
 ac_ud_mina.313.b:0 "Look to our own plains first."
 ac_ud_mina.313.d:0 "The war is over, and the reports from the coasts are still being counted. Ferustia never joined the alliances that fought it. Its passes stayed open or closed as its own government decided, and its hospitals treated the wounded who reached them. In a continent that has lost so much in a single decade, that alone makes the country unusual.\n\nIt also makes it visible. Delegations from neighbours that never noticed Ferustia before now arrive in Ganzir asking for rubber, rail capacity and the services of its engineers. The country that spent the 1990s mending its own fractures is being asked to help mend everyone else's. Some in the cabinet see an opportunity. Others see a burden that a small, landlocked state cannot carry for long.\n\nThe questions that defined the decade have not gone away. The Iggingen file is still open, whatever form it has taken. The arguments about the executive, the garrisons and the assemblies continue in whatever institutions the country chose. But they are now the arguments of a state at peace, and for the first time in a generation the people of the plains can afford to have them slowly.\n\nProvisional gameplay: Ferustia's response is unsourced; the end of the war date is official (ACES Chronicle, 2005 / 09.19)."
 ac_ud_mina.313.t:0 "Ferustia After the War"
 ac_ud_mina.401.a:0 "Start with the furnaces and the wells."
 ac_ud_mina.401.b:0 "Start with the yards."
 ac_ud_mina.401.d:0 "The ministry's clerks needed eleven weeks and a borrowed room in the harbour customs house to assemble it, and when they were finished the ledger filled two shelves. It recorded every furnace in the inland mill towns, every slipway on the peninsula and in Zapland, every oil well in the harbour hills, every arsenal in the Yinshi Valley and every contract that bound them to buyers abroad. No government of Albard had ever seen the whole of its own economy on paper at once.\n\nThe figures were remarkable. Albard rolls more steel than several of its larger neighbours, pumps its own oil and builds its own ships. It is, by any measure the ministry could devise, the richest of the small Usean states. It is also a country where almost all of that wealth belongs to a few dozen houses whose books the government had never been permitted to read until now.\n\nThe ledger raises more questions than it answers. Who decides what the yards build? Who sets the wages in the mills? Who chooses the buyers for the arsenals' shells? For a generation the answer has been the houses themselves. The new government has opened the books. What it does with what it found will define the decade.\n\nProvisional gameplay: no source covers Albard; its geography is mod provenance (history/countries/ALR - Albard.txt, history/states)."
 ac_ud_mina.401.t:0 "The Ledger of Steel"
 ac_ud_mina.402.a:0 "Let the yards compete for the contract."
 ac_ud_mina.402.b:0 "Decide in cabinet and announce it."
 ac_ud_mina.402.d:0 "Albard has three shipyards and the money to make one of them excellent. The Payton yards are the oldest and the most crowded, hemmed in by the city that grew up around them. The peninsula yards have room to expand and a skilled workforce that has never had enough orders. The Zapland yards, on the Roca Roja border, have the deepest water and the worst roads. Each builds ships. None builds them well enough to win contracts from the larger coastal powers.\n\nThree proposals reached the cabinet within a week. The shipping houses want merchant hulls: tankers for Albard's oil, ore carriers for its steel trade, coasters for every neighbour's cargo. The naval staff wants escorts, arguing that a harbour this rich is an invitation to anyone with a gunboat. The yard managers themselves propose the least glamorous option of all: become the drydock of the coast, repairing whatever limps into port, a business that never depends on a single buyer's fortunes.\n\nEach proposal comes with a constituency. The merchant hulls would please the houses and the oil exporters. The escorts would please the officers and, quietly, some of the treaty council's members. The repair yards would please the unions, because repair work keeps crews employed through every slump.\n\nWhatever the cabinet chooses, the other two will have to wait. The purse is deep, but it is not bottomless, and half-built programmes in three yards would be worse than one finished programme in one.\n\nProvisional gameplay: no source covers Albard; its geography is mod provenance (history/countries/ALR - Albard.txt, history/states)."
 ac_ud_mina.402.t:0 "Three Yards, One Purse"
 ac_ud_mina.403.a:0 "Invite both sides to the ministry together."
 ac_ud_mina.403.b:0 "Hear them separately and decide alone."
 ac_ud_mina.403.d:0 "The furnace crews of the inland mill towns and the riveters of the three yards belong to the oldest unions in Albard. They have their own halls, their own newspapers and strike funds large enough to keep a yard idle for a season. They also have long memories. Every plan in the government's programme, from relined furnaces to new slipways, depends on their members turning up for work.\n\nThe union secretaries came to the ministry with a single demand: a national wage board on which they would sit as equals with the owners and the government, setting wages for the mills and yards every spring. The owners' associations came the next day with the opposite demand: the open shop, in which every yard and mill hires whom it pleases on whatever terms it can agree, and the government stays out of it.\n\nBoth sides have a case. A wage board would make strikes rarer and costs higher, and it would give the unions a permanent voice in the country's economic policy. The open shop would raise output and lower costs, and it would almost certainly put more men on the picket lines in the first years. The ministry's own economists cannot agree which would be better for Albard in the long run.\n\nWhat everyone agrees on is that the question cannot be left open. A government that refuses to answer it will find the answer chosen for it, in the yards, by whichever side is better organised that winter.\n\nProvisional gameplay: no source covers Albard; its geography is mod provenance (history/countries/ALR - Albard.txt, history/states)."
 ac_ud_mina.403.t:0 "The Mill and Yard Unions"
 ac_ud_mina.404.a:0 "Publish the customer list."
 ac_ud_mina.404.b:0 "Keep the list within the cabinet."
 ac_ud_mina.404.d:0 "The Yinshi Valley arsenals make rifles, shells and mortar bombs. They make them well, and they sell them to whoever pays: neighbouring armies, police forces, and buyers whose credentials the arsenals' sales offices have never felt obliged to examine closely. The opening ledger of this programme listed their customers for the first time. Several ministers asked to read the list twice.\n\nNothing on it is illegal under Albardi law, because Albardi law has never said anything about it. That is the problem the cabinet must now solve. The arsenals employ thousands in a valley that borders both Bulgurdarest and Roca Roja, and their export earnings pay for a good deal of the programme. They are also the part of the economy most likely to draw Albard into quarrels that are not its own.\n\nTwo policies are on the table. The first is open trade: sell to recognised governments that ask, under export licences published every quarter, so that every neighbour knows exactly what every other neighbour has bought. The second is an embargo: the arsenals supply Albard's own forces and no one else, and whatever they no longer sell abroad is mounted at home, around the harbour.\n\nNeither policy is free. Open trade keeps the valley prosperous and makes Albard useful to its neighbours, but it ties the country's reputation to the use its customers make of its shells. An embargo keeps Albard's hands clean and its neighbours less armed, at the cost of the valley's best customers and a good deal of goodwill.\n\nProvisional gameplay: no source covers Albard; its geography is mod provenance (history/countries/ALR - Albard.txt, history/states)."
 ac_ud_mina.404.t:0 "The Arms Ledger"
 ac_ud_mina.405.a:0 "Send the delegation both drafts to argue."
 ac_ud_mina.405.b:0 "Answer within the week."
 ac_ud_mina.405.d:0 "Albard pays more into the common funds of the Central Usean Treaty Council than any other small member, and its delegates have begun to ask what the money buys. The council's agenda is set by its larger members. Its relief arrangements, transit rules and emergency plans are drafted in committees where Albard is one voice among many, however much it contributes.\n\nThe delegation in the council chamber has sent home two proposals. The first is to pay more: fund the council's common programmes generously and openly, become its paymaster, and expect the agenda to reflect it. Money given in public, the delegation argues, is influence earned in public, and no one can accuse Albard of buying favours it has paid for at the front door.\n\nThe second proposal is the opposite. Albard should pay its share and not a coin more, and insist that every member's contribution is audited and published. If the larger members are getting more from the council than they put in, the audits will show it, and Albard will have its influence from the facts rather than from its cheque book.\n\nThe Treasury favours the second proposal for obvious reasons. The Foreign Ministry favours the first, because it believes the council will matter far more in the coming years than anyone in Payton yet realises. Either way, the delegation has asked for an answer before the council's next session.\n\nProvisional gameplay: no source covers Albard; its geography is mod provenance (history/countries/ALR - Albard.txt, history/states)."
 ac_ud_mina.405.t:0 "What the Money Buys"
 ac_ud_mina.406.a:0 "Let the argument run in the newspapers."
 ac_ud_mina.406.b:0 "Keep the negotiations private."
 ac_ud_mina.406.d:0 "The question was printed on a union poster in the Payton harbour districts, and within a month it had become the name of a national argument. Albard is rich. Its programme of relined furnaces, new slipways and refineries is working. The argument is about who deserves the credit, and therefore who deserves to govern.\n\nThe great steel and shipping houses say plainly that the prosperity is theirs. They built the mills, they financed the yards and they found the buyers. They propose to govern openly through a single board, as they have governed the economy quietly for decades. The mill and yard unions answer that nothing was built without their members' hands, and propose a labour commonwealth in which an elected council of the unions governs and the houses pay their share. The harbour lawyers and provincial notables propose a third answer: a charter republic of written rights and contested elections, in which no house and no union governs by right.\n\nThe present government was never designed to settle such a question. It was a placeholder administration, competent at opening ledgers and signing contracts, and it has no mandate to choose among the factions now demanding that it choose. Its ministers have begun to say so in public, which is itself a kind of answer.\n\nEach faction has its strength. The board has the money and the shipping lines. The commonwealth has the yards and the mills, which means it has the country's output. The charter has the courts, the newspapers and the provinces. Albard cannot be governed for long against any of them, and every faction knows it.\n\nProvisional gameplay: no source covers Albard; its geography is mod provenance (history/countries/ALR - Albard.txt, history/states)."
 ac_ud_mina.406.t:0 "Who Owns Albard?"
 ac_ud_mina.407.a:0 "Results will speak for themselves."
 ac_ud_mina.407.d:0 "The Steel and Shipping Board met for the first time in the boardroom of the oldest shipping house in Payton, around a table that had been used for exactly this purpose, informally, for half a century. The difference was that this time the ministers attended as guests. By the end of the afternoon the board had accepted the seals of government and issued its charter: ministries become departments, ministers become managers, and every department reports quarterly against a published plan.\n\nThe board speaks as an office and its members are not named in its communiques. They are the heads of the great houses, or their appointed representatives, and they have let it be known that they prefer to be judged by results rather than by personalities. Their first plan promises higher output from the mills, longer order books for the yards and a steady price for Albardi oil.\n\nThe unions have responded cautiously. The board's charter says nothing about wages, and the union secretaries have noticed. The harbour lawyers have responded less cautiously, pointing out that a government accountable only to its own shareholders is not accountable at all. The newspapers, most of which are owned by houses represented on the board, have responded with enthusiasm.\n\nIn the harbour districts, the reaction is a shrug. The houses ran the country before; now they run it openly. Whether that is better or worse, the first quarterly report will tell.\n\nProvisional gameplay: no source covers Albard; its geography is mod provenance (history/countries/ALR - Albard.txt, history/states)."
 ac_ud_mina.407.t:0 "The Board Takes the Chair"
 ac_ud_mina.408.a:0 "The yards and mills belong to those who work them."
 ac_ud_mina.408.d:0 "The labour council was elected in a single weekend, in union halls from the inland mill towns to the Zapland slipways, and it met for the first time in the largest of them: the riveters' hall on the Payton waterfront, where the strike of a generation ago had been planned. Its first act was to declare the Labour Commonwealth. Its second was to send a delegation to the shipping houses to explain what that would mean for them.\n\nThe commonwealth's charter guarantees the houses their property, provided that property is used and its workers are paid. It does not guarantee them their profits, which will be taxed to fund the yards, the mills and the apprentice halls. The houses' representatives listened politely, asked for the terms in writing and left to consult their lawyers. Several of them have since moved their head offices to the peninsula, though not yet abroad.\n\nThe council speaks as an office and its members are not named. Union delegates hold their seats only while their halls want them, and the charter allows any hall to recall its delegate by a simple majority. The council's first sessions have been long, loud and broadcast on the harbour radio, which has found itself with the largest audience in its history.\n\nIn the mill towns, the mood is jubilant. In the yards it is more practical. The committees want to know when the new orders will arrive, and who will sign them now that the houses no longer do.\n\nProvisional gameplay: no source covers Albard; its geography is mod provenance (history/countries/ALR - Albard.txt, history/states)."
 ac_ud_mina.408.t:0 "The Commonwealth Is Declared"
 ac_ud_mina.409.a:0 "Every clause in public."
 ac_ud_mina.409.d:0 "The proclamation was read on the steps of the harbour customs house, the building where the opening ledger had been compiled, and the choice was deliberate. The Charter Republic, its sponsors said, would govern the way that ledger had been written: in public, with every figure checked and every claim open to challenge. A cabinet answerable to an elected charter assembly would govern until the charter was written and ratified by national vote.\n\nThe cabinet speaks as an office, and its members have agreed not to stand in the first ballot under the charter they are drafting. The assembly that will write it was elected on the broadest franchise Albard has ever known, including the mill towns and the Zapland shore, where many voters had never cast a ballot before. Its sessions are open, its minutes are printed and its debates are long.\n\nThe great houses have accepted the republic with visible reluctance. A charter of written rights protects their property, but it also promises commercial courts independent of them and accounts that must be published. The unions have accepted it with visible suspicion, since a republic in which no house governs by right is also one in which no union does.\n\nIn the harbour cafes, the argument has already moved on to the charter's clauses: the franchise, the courts, the published accounts. That, its sponsors say, is exactly the point of a republic built in public.\n\nProvisional gameplay: no source covers Albard; its geography is mod provenance (history/countries/ALR - Albard.txt, history/states)."
 ac_ud_mina.409.t:0 "The Charter Republic"
 ac_ud_mina.410.a:0 "Prepare with steel."
 ac_ud_mina.410.b:0 "Prepare with ships."
 ac_ud_mina.410.d:0 "The treaty council's message arrived on the twentieth of April, relaying an announcement from Central Usea that the government at first assumed must be mistaken. The asteroid Ulysses would strike the Earth. Astronomers had calculated its path; every member of the council was being asked to prepare. The Payton stock exchange closed early that afternoon and did not open the next day.\n\nAlbard has more to prepare with than most of its neighbours. Its mills can roll plate, its yards can build hulls and its oil fields can fuel whatever is built. What it does not have is any certainty about where the fragments will fall, and the government's planners have been told that no one else has that certainty either. They must prepare for a blow that might land anywhere, or nowhere at all.\n\nTwo plans reached the cabinet within a month. The mills propose to roll shelter plate for every coastal town: buried bunkers with steel roofs, water tanks and beds for the harbour districts, so that the population can stay where it is and wait out the worst. The yards propose an evacuation fleet: a reserve of hulls ready to carry the coastal towns inland by river and along the shore, so that the population can leave if the warning becomes a strike.\n\nThe cabinet cannot afford both on the scale either requires. Whichever it chooses, the mills and yards that lose the argument will be asked to help with the other, and the treaty council will be told that Albard is ready to share whatever it builds.\n\nProvisional gameplay: Albard's response is unsourced; the announcement date is official (ACES Chronicle, 1996 / 04.20)."
 ac_ud_mina.410.t:0 "The Warning Reaches Payton"
 ac_ud_mina.411.a:0 "Every hull to relief work."
 ac_ud_mina.411.b:0 "Secure Albard's own coast first."
 ac_ud_mina.411.d:0 "On the eighth of July Ulysses passed the point from which it could no longer hold together, and the sky over Usea filled with falling light. In Payton the harbour crowds watched from the quays until the police cleared them. By morning the harbour's lights were still burning, and for a few hours that seemed enough.\n\nIt was not. The reports that reached the harbour over the following days described a continent whose sea lanes were disrupted, whose coastal towns had suffered in ways no one had yet measured, and whose markets had stopped functioning almost overnight. Ships that should have arrived did not. Ships that did arrive carried passengers rather than cargo, people who had boarded anything that would float and pointed it toward the nearest lights.\n\nAlbard's preparations had made it ready to protect itself. They had not made it ready to be one of the few places on the coast still working. The yards, the oil fields and the mills are suddenly the most valuable relief assets within hundreds of kilometres, and every neighbour is asking for them at once. The capacity built over three years is being spent faster than anyone planned.\n\nThe first decisions cannot wait. The relief convoys must be assigned and the harbours must be told what to do with the ships now anchoring in the roads. After Erusea's refugee decision, the government expects more of them, not fewer.\n\nProvisional gameplay: Albard's response is unsourced; the impact date is official (ACES Chronicle, 1999 / 07.08)."
 ac_ud_mina.411.t:0 "The Night the Sky Broke"
 ac_ud_mina.412.a:0 "Neutrality must be visible."
 ac_ud_mina.412.b:0 "Neutrality can still be profitable."
 ac_ud_mina.412.d:0 "The war has come to Usea. Erusea's armies have moved into San Salvacion and seized the railgun site at Stonehenge, and Central Usea is gathering a coalition to push them back. Albard is not a party to any of it. It has no faction, no alliance and no intention of acquiring either.\n\nThat does not make it irrelevant. Albard has steel, refined fuel and three working shipyards, and every army on the continent would like a share of all three. Purchasing agents have arrived in Payton within weeks, some in uniform and more in suits, asking for plate, for fuel, for repair berths and for the services of the yards' engineers. Every request is polite and every contract would be profitable. None of them is entirely innocent.\n\nThe naval staff wants armed neutrality, strictly enforced: no warship of any side in Albard's harbours, patrol craft in the roads and batteries on the shore. The shipping houses and the yards argue that ordinary commercial contracts, delivered at Albard's own quays, are what a neutral trading state has always done, and that ISAF in particular will remember who sold to it when it most needed to buy. The unions want to know who will work the double shifts either choice will require.\n\nEveryone agrees on one point. Whatever Albard decides, it must enforce it openly and equally, because a neutral harbour that bends for one side will soon be treated as an enemy port by the other.\n\nProvisional gameplay: Albard's response is unsourced; the war date is official (ACES Chronicle, 2003 / SUMMER, 2003 / 08.22)."
 ac_ud_mina.412.t:0 "A Rich Harbour in a War"
 ac_ud_mina.413.a:0 "Offer credit and steel to the neighbours."
 ac_ud_mina.413.b:0 "Rebuild the mill towns first."
 ac_ud_mina.413.d:0 "The war is over, and Albard has come through it with its harbours full and its order books longer than at any time in its history. Its yards repaired ships, its mills rolled plate and its oil fields fuelled whatever the government's neutrality allowed them to fuel. In a continent that has lost so much since the night the sky broke, that makes the country conspicuous.\n\nIt also makes it the subject of a new argument. Albard's neighbours are poorer than ever, and many of them believe that some of Albard's prosperity was made from their misfortune. Delegations arrive in Payton asking for credit, steel and the services of the yards on terms that the houses, the unions and the treasury all find difficult to accept. The treaty council has begun to ask the same questions more formally.\n\nThe questions that shaped the decade remain. Who owns Albard, and who governs it, has been answered in whatever form the country chose. But a rich country among poor neighbours must now decide what it owes them, and whether generosity is a duty, an investment or a mistake. For the first time, the answer will be argued by a country at peace.\n\nProvisional gameplay: Albard's response is unsourced; the end of the war date is official (ACES Chronicle, 2005 / 09.19)."
 ac_ud_mina.413.t:0 "Albard After the War"
 ac_ud_mina.501.a:0 "Start with the anchorage."
 ac_ud_mina.501.b:0 "Start with the docks."
 ac_ud_mina.501.d:0 "Every spring the Port Office of Dorondo City publishes its ledger, and every spring the republic reads it the way other countries read the speeches of their presidents. It lists the ships that entered the great anchorage, the cargoes they carried, the berths that stood empty and the wages paid on the quays. This year's ledger is the thickest in a decade. Dorondo is rich, and the ledger says so in tonnes.\n\nIt also says other things, in smaller type. The yards of the Lowlands are working at the limit of their slipways. The dock unions have filed more grievances than in any year since the old tribunals were abolished. The works of Iggingen, inland on the desert side of the republic, send their products to the coast on a single road that the Ferustian border posts can watch from their towers. And the republic's defence, as the ledger notes without comment, consists largely of the hope that no one will want to disturb a country that trades with everyone.\n\nThe cabinet has asked the Port Office for something it has never produced: not a record of the year, but a plan for the decade. What should the anchorage become? Who should the docks answer to? How should the republic govern a district that its neighbour still calls its own? The Port Office has replied, with some dignity, that it counts ships and does not make policy. The cabinet has replied that it will have to start.\n\nProvisional gameplay: no source covers Dorondo; its geography and starting politics are mod provenance (history/countries/DOR - Dorondo.txt, history/states)."
 ac_ud_mina.501.t:0 "The Harbour Ledger"
 ac_ud_mina.502.a:0 "Put the three plans before the assembly."
 ac_ud_mina.502.b:0 "Decide in cabinet."
 ac_ud_mina.502.d:0 "The survey of the great anchorage took the harbour engineers four months and filled a room of the Port Office with charts. The anchorage is the finest on this coast: deep water close to shore, shelter from the winter gales, and berths enough for a fleet far larger than the one Dorondo actually owns. For most of the republic's history that surplus was simply wealth. Ships came, paid their dues and left.\n\nThe engineers' report sets out three ways to make the anchorage work harder, and they cannot all be afforded. The shipping houses want an open registry: low fees, light inspection and a Dorondian flag on any hull whose owner will pay for it. The yard owners of the Lowlands want the money spent on slipways and repair basins, so that the ships which call here are also built and mended here. The harbour pilots, who have guided ships through the approaches for generations, want a modern pilots' service with radar, night lights and the authority to close the approaches in an emergency.\n\nEach plan has its party in the assembly and its column in the newspapers. The registry would bring the most money fastest. The yards would bring the most work. The pilots' service would bring the least of either, and the pilots argue that it is the only plan which would still matter if the coast were ever in danger.\n\nThe cabinet must choose one. The other two will wait, perhaps for a decade, and their supporters will not let anyone forget it.\n\nProvisional gameplay: no source covers Dorondo; its geography and starting politics are mod provenance (history/countries/DOR - Dorondo.txt, history/states)."
 ac_ud_mina.502.t:0 "Three Plans for the Anchorage"
 ac_ud_mina.503.a:0 "Receive both delegations together."
 ac_ud_mina.503.b:0 "Receive the unions first."
 ac_ud_mina.503.d:0 "The delegation from the dock unions arrived at the assembly with a petition of forty thousand signatures and a request that was, by their standards, modest. They did not ask for higher wages. They asked for a standing tribunal: a court of wages and conditions where a stevedore's grievance could be heard before it became a strike.\n\nDorondo had such tribunals once. They were abolished in a quieter decade, when the shipping houses argued that an open harbour needed open hiring and the unions were too weak to object. They are not weak now. Almost a quarter of the republic votes for parties that call themselves socialist or communist, and most of those votes are cast within sight of the cranes. A strike on the quays would close the anchorage in a day.\n\nThe shipping houses have answered with a petition of their own, shorter and better printed. They ask the government to keep the harbour an open shop, to protect men who work without a union card, and to give the port a constabulary of its own so that a picket line cannot become a blockade. They point out, correctly, that the republic's prosperity rests on ships choosing to come here rather than elsewhere.\n\nThe cabinet has both petitions on the same table. It knows that whichever it grants, the other side will remember at the next election, and at every election after that.\n\nProvisional gameplay: no source covers Dorondo; its geography and starting politics are mod provenance (history/countries/DOR - Dorondo.txt, history/states)."
 ac_ud_mina.503.t:0 "The Dock Unions Ask to Be Heard"
 ac_ud_mina.504.a:0 "Ask the district what it wants."
 ac_ud_mina.504.b:0 "Decide from the capital."
 ac_ud_mina.504.d:0 "Iggingen has been governed from Dorondo City for most of a decade, and for most of that decade it has been governed as an afterthought. The district's works are productive, its people pay their taxes, and its administration is run by officials on temporary postings who expect to return to the coast. The Ferustian government still describes the district as its own. The people of Iggingen have mostly stopped asking who is right and started asking who will fix the road.\n\nThe Ministry of the Interior has proposed that the republic finally decide how Iggingen is to be governed, without touching the question of whose it is. There are two models on the table. The first would give the district an elected council of its own, with powers over schools, roads and the works, so that its people govern their own affairs whatever the maps in other capitals say. The second would give it a prefecture: a single appointed administration answering directly to the capital, efficient and accountable, and entirely Dorondian.\n\nNeither model changes a border. Both change how the district lives. An elected council would be harder to direct but easier to defend in any future conversation with Ferustia. A prefecture would be simpler to run and would make clear, to anyone watching from the desert posts, that the republic intends to stay.\n\nThe ministry adds a note. Whatever the government chooses, the works themselves will need a decision soon: their military contracts are ending.\n\nProvisional gameplay: no source covers Dorondo; its geography and starting politics are mod provenance (history/countries/DOR - Dorondo.txt, history/states)."
 ac_ud_mina.504.t:0 "Governing Iggingen"
 ac_ud_mina.505.a:0 "Answer the letters while the ministries argue."
 ac_ud_mina.505.b:0 "Keep the letters on file."
 ac_ud_mina.505.d:0 "The letters arrive at the Iggingen district office in the hundreds now. Most of them are about the same thing. A daughter married across the desert road before the rebellion; a father is buried in a Ferustian village; a family's land lies on one side of the posts and its house on the other. Each letter asks for a pass, a permit or simply an explanation of why a journey of an afternoon has become impossible.\n\nThe district administration has no authority to answer them. Crossings on the desert road are a matter for the governments in Dorondo City and Ganzir, and those governments have not spoken to each other about the border in any formal way since the rebellion. The posts on both sides are manned. The soldiers on both sides are bored. Occasionally one of them waves.\n\nThe cabinet has two proposals. The Foreign Ministry suggests that Dorondo offer to sit on a standing border commission with Ferustia: monthly meetings, a crossings register, and a promise to settle small disputes before they become incidents. The Ministry of Defence suggests the opposite. It would fortify the desert line properly, with entrenched posts and a reserve on the coast road, on the grounds that a republic with little army needs walls more than conversations.\n\nNeither ministry proposes to change the border. Both believe their plan is the one that keeps it quiet, and both have a drawer full of the same letters.\n\nProvisional gameplay: no source covers Dorondo; its geography and starting politics are mod provenance (history/countries/DOR - Dorondo.txt, history/states)."
 ac_ud_mina.505.t:0 "Families Across the Line"
 ac_ud_mina.506.a:0 "Let the ministries make their case in public."
 ac_ud_mina.506.b:0 "Settle it in cabinet."
 ac_ud_mina.506.d:0 "Dorondo joined the Central Usean Treaty Council for the same reason it joined every trade convention on the coast: membership was cheap, the meetings were useful and the alternative was to be discussed in rooms where it had no voice. For years the republic sent a modest delegation, voted with the majority and went home. The arrangement suited a country whose army was small and whose ships were everywhere.\n\nThe Foreign Ministry now argues that the council has become something more than a convenience. A small, rich republic cannot defend its anchorage alone, and every treaty clause on transit, emergency shipping and mutual assistance is, in effect, part of Dorondo's defence. The ministry wants a full delegation: permanent staff, a seat on every committee, and the republic's shipping lawyers drafting the clauses that its ships will later sail under.\n\nThe Treasury disagrees, politely. A full delegation costs money and commits the republic to positions it may later regret. Dorondo, the Treasury argues, should remain a quiet member: present, reliable, and free to make its own arrangements with neighbours such as Delarus, Calladen and Rohden, desk by desk and contract by contract, without asking a committee's leave.\n\nBoth ministries agree that the council matters. They disagree about whether Dorondo should be heard in it, or merely protected by it, and about which of the two a small republic can actually afford for the next twenty years.\n\nProvisional gameplay: no source covers Dorondo; its geography and starting politics are mod provenance (history/countries/DOR - Dorondo.txt, history/states)."
 ac_ud_mina.506.t:0 "A Small Republic and a Large Treaty"
 ac_ud_mina.507.a:0 "Let the assembly debate in the open."
 ac_ud_mina.507.b:0 "Negotiate behind closed doors."
 ac_ud_mina.507.d:0 "The republic's assembly has not produced a stable majority in three sessions. The coalitions that governed Dorondo through its prosperous decade were built on a simple bargain: the shipping houses kept the anchorage busy, the government kept taxes low, and the docks were left to argue with the houses on their own. The bargain has broken. The unions are too strong to be ignored, the houses too rich to be overruled, and the voters too divided to give anyone a mandate.\n\nThree answers have formed in the cafes and committee rooms of the capital. The moderate parties of the centre and the left propose a social compact: a written bargain between the houses, the unions and the state, with pensions, elected port boards and a standing tribunal, renewed at every election. The labour federations propose something more radical. Let the docks, the yards and the fleet be run by councils of the people who work them, federated into a workers' government that answers to the quays rather than to the counting houses.\n\nThe third answer comes from the Port Office and the senior civil service, and it is the least popular and the most carefully argued. Suspend the quarrel. Let an emergency cabinet of administrators govern by decree for a fixed term, run the harbour as a public authority, build a reserve fund against hard years, and return the republic to its politicians once the books are balanced.\n\nEach answer has its newspapers and its crowds. None has a majority. The assembly must choose one anyway, or watch the anchorage choose for it.\n\nProvisional gameplay: no source covers Dorondo; its geography and starting politics are mod provenance (history/countries/DOR - Dorondo.txt, history/states)."
 ac_ud_mina.507.t:0 "The Republic at the Crossroads"
 ac_ud_mina.508.a:0 "The bargain is the republic."
 ac_ud_mina.508.d:0 "The compact was signed in the great hall of the Port Office, under the ledger boards where the republic has recorded its ships for a century. Representatives of the shipping houses, the dock unions and the government signed in turn. The document they signed is long, and much of it concerns pensions, apprenticeships and the hours of a night shift. Its first clause is short. Disputes on the quays will be settled at the tribunal, not on the picket line, and the republic will guarantee that the tribunal's awards are paid.\n\nThe new cabinet that governs under the compact is an office rather than a person. Its ministers are drawn from the parties that signed, and its programme is the compact itself. Elections will continue on their usual calendar; the compact's authors were insistent that a bargain renewed by voters every few years is stronger than one imposed once.\n\nNot everyone is pleased. The more radical federations call the compact a truce that the houses will break as soon as trade falls. Some shipowners call it a surrender to the unions. In the cafes of the waterfront the most common view is cautious approval: the cranes are moving, the tribunal is sitting, and for the first time in years no one expects a strike next month.\n\nThe compact's critics and its friends agree on one thing. It will be tested not in a good year but in a bad one.\n\nProvisional gameplay: no source covers Dorondo; its geography and starting politics are mod provenance (history/countries/DOR - Dorondo.txt, history/states)."
 ac_ud_mina.508.t:0 "The Social Compact"
 ac_ud_mina.509.a:0 "The quays govern the republic."
 ac_ud_mina.509.d:0 "The general meeting of the dock federations began at dawn and ended after midnight, and by its close the republic had a new government. Delegates of the quays, the yards of the Lowlands and the crews of the merchant fleet voted to form a council of the workers' federation and to take the ministries under its direction. The previous cabinet resigned before the vote was counted. The army, such as it is, stayed in its barracks.\n\nThe council speaks as an office. Its members are delegates who can be recalled by the federations that sent them, and its founding resolution forbids any of them from holding office for more than two years. Its programme is plain: the docks and the yards to be run by councils of those who work in them, the merchant fleet to become a cooperative of its crews, and the anchorage to remain open to every ship that pays its dues, whatever flag it flies.\n\nThat last point matters more than the rest. The council knows that Dorondo's wealth depends on ships choosing to come here, and that the shipping houses of other countries are watching. Its first communique is addressed to them rather than to its own people. The harbour is open, the dues are unchanged, and the pilots will guide every ship as before.\n\nWhether the houses believe it will be measured, as everything in Dorondo is measured, in the next season's ledger.\n\nProvisional gameplay: no source covers Dorondo; its geography and starting politics are mod provenance (history/countries/DOR - Dorondo.txt, history/states)."
 ac_ud_mina.509.t:0 "The Workers' Federation"
 ac_ud_mina.510.a:0 "Balance the books first."
 ac_ud_mina.510.d:0 "The assembly voted for its own suspension by a narrow margin and in a sullen mood. The motion, drafted by the Port Office and the senior civil service, transfers the government to an emergency cabinet for a fixed term. The cabinet will govern by decree, run the harbour as a single public authority, and build a reserve fund against the next hard year. When its term expires, the assembly will sit again.\n\nThe cabinet is an office. Its members are administrators rather than politicians, and its decrees are signed collectively so that no single official can be blamed or praised. It meets in the Port Office rather than the assembly building, which some see as a statement of priorities and others as an insult. Its first decrees are dull by design: tariffs fixed for three years, the tribunal suspended but its awards honoured, the harbour accounts published monthly.\n\nThe unions call it a government of clerks. The shipping houses call it a government of tax collectors. Both are partly right. The cabinet's answer is that a republic which cannot form a majority still needs someone to keep the cranes moving, and that a fixed term with published accounts is the most honest form of emergency available.\n\nDorondians are a commercial people. Most of them have decided to judge the cabinet the way they judge a ship's master: by whether it brings the cargo in.\n\nProvisional gameplay: no source covers Dorondo; its geography and starting politics are mod provenance (history/countries/DOR - Dorondo.txt, history/states)."
 ac_ud_mina.510.t:0 "The Emergency Cabinet"
 ac_ud_mina.511.a:0 "Prepare without alarming the markets."
 ac_ud_mina.511.b:0 "Publish every plan in full."
 ac_ud_mina.511.d:0 "The announcement from Central Usea reached the Port Office by teleprinter on the twentieth of April, and the harbourmaster read it aloud to the night shift. The asteroid Ulysses would strike the Earth. No one could yet say where the fragments would fall, but every government on the continent was being urged to prepare.\n\nA port republic thinks first about the sea. Within a week the Port Office had produced two plans. The first treated the anchorage as Dorondo's lifeboat: every hull in the merchant fleet registered for an evacuation, fuel reserved, routes charted to safer coasts, and a schedule that could empty the capital's waterfront in a matter of days. The second treated the anchorage as the thing to be protected. It would cut shelters into the rock beneath the quays, stock them with water and stores, and keep the people of Dorondo City close to the harbour that feeds them.\n\nThe arguments were technical and quickly became political. The evacuation plan depended on ships that belonged, in large part, to private houses and foreign owners. The bunker plan depended on engineering the harbour had never attempted. Both were expensive. Neither could be finished in a hurry.\n\nThe cabinet has three years, if the astronomers are right, and money for one plan. It has asked the harbourmaster which he would choose. He has asked, reasonably, to know where the fragments will fall first. No one can tell him.\n\nProvisional gameplay: Dorondo's response is unsourced; the announcement date is official (ACES Chronicle, 1996 / 04.20)."
 ac_ud_mina.511.t:0 "The Warning from Central Usea"
 ac_ud_mina.512.a:0 "Every berth to the landings."
 ac_ud_mina.512.b:0 "Keep the commercial berths working."
 ac_ud_mina.512.d:0 "On the eighth of July Ulysses broke apart, and the night sky over the coast filled with light. In Dorondo City people watched from the quays and the rooftops until dawn, and no one on the waterfront could say where the fragments had come down. The next morning the radio carried only fragments of its own: stations that did not answer, schedules that were cancelled, ports that did not reply to the Port Office's telegrams. The ledger boards still showed the previous day's arrivals.\n\nBy the third day the arrivals were different. Ships came in without cargo manifests, crowded to the rails with passengers. Fishing boats came in from coasts whose names the harbour pilots knew only from charts. Some carried injured people; some carried whole villages. The masters asked the same question at every berth: could they land, and would they be allowed to stay?\n\nThe republic had planned for a blow. It had not planned to become a harbour of refuge for every ship that could still find its way into the approaches. Within a week the Port Office had lost count of the landings, the markets of the capital had run short of flour and fuel, and the hospitals were turning patients away.\n\nThe cabinet must now decide what kind of harbour Dorondo will be. It can open the anchorage to every ship that reaches it, land everyone and count them as future citizens of a republic that has always lived by its arrivals. Or it can sort the landings, treat and feed every passenger but send onward those whom the republic cannot keep, and say so honestly at every berth. In either case the hospital ships must sail tonight.\n\nProvisional gameplay: Dorondo's response is unsourced; the impact date is official (ACES Chronicle, 1999 / 07.08)."
 ac_ud_mina.512.t:0 "Ships Out of the Dark"
 ac_ud_mina.513.a:0 "The harbour serves no army."
 ac_ud_mina.513.b:0 "The harbour serves the wounded first."
 ac_ud_mina.513.d:0 "War has broken out on the continent. Erusea has moved against San Salvacion and seized the railgun site at Stonehenge, and Central Usea is assembling a coalition to answer it. Dorondo is not a party to any of this. It has no alliance obligations, no army worth the name, and no intention of acquiring either.\n\nIt does have the finest anchorage on its coast, and within days every navy and every shipping agent in Usea has noticed. Requests arrive at the Port Office by the dozen: berths for transports, repairs for damaged freighters, fuel, charts, pilots. Some are from belligerents and say so. More are from shipping houses that will not say whose cargo they carry. The insurance markets have doubled their rates for every hull that sails from the republic's quays.\n\nThe cabinet has two proposals before it. The first would make Dorondo a strictly neutral harbour: open to commerce on equal terms, closed to every warship, guarded by anti-aircraft batteries on the headlands. The second, which the Foreign Ministry favours once the coalition has a name and a command, would allow allied convoys to use designated berths for supplies and medical cargo, under Dorondian pilots and Dorondian rules, without the republic joining the alliance.\n\nEither way, the ledger boards in the Port Office will record every arrival. The republic has decided, at least, that it will not hide what its harbour is used for.\n\nProvisional gameplay: Dorondo's response is unsourced; the war date is official (ACES Chronicle, 2003 / SUMMER, 2003 / 08.22)."
 ac_ud_mina.513.t:0 "A Neutral Anchorage"
 ac_ud_mina.514.a:0 "Offer the anchorage to the recovery."
 ac_ud_mina.514.b:0 "Rebuild the republic's own reserves."
 ac_ud_mina.514.d:0 "The war is over, and the first postwar ledger of the Port Office is a strange document. It records more ships than any year of the decade and less cargo; more repairs than new hulls; more passengers than the republic has ever landed in a year of peace. The great anchorage has been busy throughout the war. It has not always been profitable.\n\nDorondo emerges from the war unoccupied, with its harbour working and its institutions in whatever shape its government chose for them. It never joined the fighting, and its quays never stopped recording arrivals. Delegations from the coasts are already arriving to ask for berths, yards and credit for their own recovery, and the shipping houses see a decade of reconstruction contracts in front of them.\n\nThe older questions are still waiting. Iggingen is still governed from the coast, under whatever arrangement the republic chose. The docks and the houses still argue, under whatever compact or council or cabinet now governs them. But they are the arguments of a prosperous port at peace, and the Port Office, for the first time in years, has begun drafting next year's ledger with some confidence.\n\nProvisional gameplay: Dorondo's response is unsourced; the end of the war date is official (ACES Chronicle, 2005 / 09.19)."
 ac_ud_mina.514.t:0 "The Ledger After the War"
 ac_ud_mina.601.a:0 "Start with the fishing banks."
 ac_ud_mina.601.b:0 "Start with the harbours."
 ac_ud_mina.601.d:0 "The Hydrographic Office keeps the oldest charts in the country, and in the first weeks of 1991 the cabinet asked to see all of them. Scandia exists along a single line. Every one of its provinces touches the sea, and almost every one of its citizens lives within sight of salt water. The charts show the harbours, the fishing banks, the shoals and the anchorages in patient detail. They do not show how poor the country has become.\n\nThe report that came with them did. The fishing fleet is old and largely unregistered. The oil beneath the coast has been surveyed in places and guessed at everywhere else. The smaller harbours silt up faster than the dredgers can clear them, and the capital's shipyards build more repairs than ships. Scandia's budget is the smallest of any treaty member on this part of the continent, and every ministry knows exactly how small it is.\n\nAnd yet the sea is the one thing no neighbour can take from Scandia. Calladen and Bulgurdarest send cargo over Scandian quays whenever the rates are right. The banks offshore still fill nets. The cabinet's instruction to the ministries was short: start with the charts. Know every harbour, every boat and every well, and only then decide what a coastal nation with very little money should build first.\n\nProvisional gameplay: no source covers Scandia; its coastline, harbours and oil are mod provenance (history/countries/SCA - Scandia.txt, history/states)."
 ac_ud_mina.601.t:0 "The Charts of the Coast"
 ac_ud_mina.602.a:0 "Hear the villages first."
 ac_ud_mina.602.b:0 "Hear the shipowners first."
 ac_ud_mina.602.d:0 "The cold stores have changed everything on the quays. For the first time Scandian fishermen do not have to sell their catch on the morning it lands, at whatever price the buyers on the dock decide to offer. Fish can now wait a week for a better market. That single fact has turned an old argument about who owns the boats into a new argument about who owns the catch.\n\nThe fishing villages want cooperatives. Each harbour would pool its boats, run its own auction and share its cold store, with the state lending money for nets and engines. The harbour merchants and the capital's banks want something else: incorporated trawler companies with steel hulls, deep-water range and the capital to fish banks the small boats cannot reach. The cooperatives promise to keep the villages alive. The companies promise to make the fleet profitable.\n\nBoth sides have brought figures to the Fisheries Ministry, and both sets of figures are honest. Cooperatives would land less fish but keep more families on the coast. Companies would land more fish with fewer crews, and the crews they let go would need work somewhere else in a country that has very little of it. Neither option makes Scandia rich. One makes it fairer; the other makes it busier.\n\nThe minister has asked the cabinet for a decision before the next season opens, because the banks do not wait for politics, and neither do the buyers who have already started visiting the villages with contracts in their pockets.\n\nProvisional gameplay: no source covers Scandia; its coastline, harbours and oil are mod provenance (history/countries/SCA - Scandia.txt, history/states)."
 ac_ud_mina.602.t:0 "The Price of Fish"
 ac_ud_mina.603.a:0 "Put the fishermen's question in writing."
 ac_ud_mina.603.b:0 "Settle the wells first."
 ac_ud_mina.603.d:0 "The drilling crews on the Petrol Coast have struck oil in quantities the surveyors had only hoped for. The coast earned its name generations ago, when tar seeped out of the cliffs and fishermen scraped it up to caulk their boats. Now the seepage has become a field, and the cabinet must decide who will pump it.\n\nThe Treasury proposes a National Oil Board. The state would own the wells, pay the crews and sell the crude itself, keeping every unit of profit for the budget. It would also bear every unit of risk, and Scandia has never run an industry larger than its fishing fleet. The Ministry of Trade proposes leases instead. Companies would bid for blocks of coast, drill at their own expense and pay the state a royalty on every barrel they lift.\n\nThe arguments are familiar from every small country that has found something valuable under its soil. A state board keeps control and learns slowly and expensively. Leases bring money and expertise quickly, and take a share of both away with them when the field runs down. The fishermen of the Petrol Coast have their own concern, which neither ministry has yet answered: what oil on the water will do to the banks their families have fished for a century.\n\nThe cabinet has promised to answer that question as well, whichever way it chooses. The fishermen have heard promises from the capital before, and have asked for this one in writing.\n\nProvisional gameplay: no source covers Scandia; its coastline, harbours and oil are mod provenance (history/countries/SCA - Scandia.txt, history/states)."
 ac_ud_mina.603.t:0 "Oil on the Petrol Coast"
 ac_ud_mina.604.a:0 "Ask the fishing harbours what they need."
 ac_ud_mina.604.b:0 "Ask the Admiralty what it fears."
 ac_ud_mina.604.d:0 "The Admiralty's annual return is an unusually frank document. Scandia owns a handful of patrol craft, a training ship older than most of the officers who sail in her, and a dockyard in the capital that keeps them all afloat through great ingenuity and very little money. Everything the navy does at sea, from fishery inspection to smuggling patrols, it does with too few hulls and too much coast.\n\nTwo plans are on the minister's desk. The first would turn the navy into a coast guard in all but name: cutters built for inspection, rescue and police work, armed enough to be obeyed by a foreign trawler and no more. The second would spend the same money on a small squadron of fast armed craft, trained to hold the harbour mouths at night and in bad weather. It would not win a war at sea, its advocates admit, but it would make any visitor think twice.\n\nUnderneath the plans is an older argument about what Scandian sea power is for. The coast guard plan assumes that the country's dangers are storms, smugglers and poachers, and that its navy should be useful every single day. The squadron plan assumes that one day a larger navy will come close to the coast, and that Scandia should be able to say no with something more than a radio message.\n\nThe budget allows for one plan, not both, and the Admiralty has asked for an answer before the yards need to order steel.\n\nProvisional gameplay: no source covers Scandia; its coastline, harbours and oil are mod provenance (history/countries/SCA - Scandia.txt, history/states)."
 ac_ud_mina.604.t:0 "What Navy Can Scandia Afford?"
 ac_ud_mina.605.a:0 "Treat the chair as a platform."
 ac_ud_mina.605.b:0 "Treat the chair as a courtesy."
 ac_ud_mina.605.d:0 "Scandia sends the smallest delegation to the Central Usean Treaty Council. Its delegates share a single office, take turns at the translation desk and travel second class. Yet they represent the longest coastline of any member on this part of the continent, and when the council discusses shipping, rescue or harbour fees, they are usually the only people in the room who have actually worked on a quay.\n\nThe Foreign Ministry wants to use that knowledge. It proposes that Scandia press the council to adopt common rules for harbours, sea rescue and shipping lanes, drafted largely by Scandian officials. A small member that writes the rules, the ministry argues, is no longer a small member on those subjects. The Ministry of Trade disagrees. The council, it says, is where large members make large decisions. Scandia should vote with the majority, ask for little and spend its effort on direct arrangements with the neighbours whose cargo actually crosses its quays.\n\nThe disagreement is partly about money. Leading the council's maritime work would require more officials than the delegation has, and more travel than its budget allows. Bilateral deals with Calladen and Bulgurdarest would cost almost nothing and pay quickly in handling fees.\n\nThe cabinet must decide whether Scandia's chair at the council is a platform or a formality. Its delegates have asked, politely, to be told which before the next session.\n\nProvisional gameplay: no source covers Scandia; its coastline, harbours and oil are mod provenance (history/countries/SCA - Scandia.txt, history/states)."
 ac_ud_mina.605.t:0 "A Chair at the Treaty Council"
 ac_ud_mina.606.a:0 "Let the harbours argue it in public."
 ac_ud_mina.606.b:0 "Keep the argument in the customs houses."
 ac_ud_mina.606.d:0 "On paper Scandia is governed from the capital by a cabinet answerable to an assembly that has not been elected in years. In practice it is governed from the harbours. The harbourmasters decide who berths and who waits. The fishing guilds decide who sails and who mends nets ashore. The shipping houses decide which cargo moves and at what price. The cabinet signs what they agree, and the arrangement has worked well enough that nobody has bothered to change it.\n\nThe decade's work has changed it anyway. The cold stores, the oil wells, the rescue service and the navy have all needed decisions that no single harbour could make, and every one of them has exposed how little authority the cabinet really holds. Two answers are now being argued in every customs house on the coast.\n\nThe first comes from the dockers, the younger fishermen and the newspapers of the capital. They want a Coastal Commonwealth: an elected parliament in which every port, however small, sends a member, councils in every harbour, and open registers of who owns every ship, berth and licence. The second comes from the harbour guilds themselves. They propose a regency council, an old form from the harbour charters, in which the great harbour offices govern together above party, in trust for the coast, with elections set aside until the country is stronger.\n\nBoth sides claim to speak for the sea. The cabinet, which speaks for very little, has agreed only that the question can no longer be avoided.\n\nProvisional gameplay: no source covers Scandia; its coastline, harbours and oil are mod provenance (history/countries/SCA - Scandia.txt, history/states)."
 ac_ud_mina.606.t:0 "Who Governs the Harbours?"
 ac_ud_mina.607.a:0 "Every port will have its member."
 ac_ud_mina.607.d:0 "The Commonwealth was proclaimed from the steps of the capital's fish market at dawn, when the auction bell rang and the largest crowd in the city was already awake. The old cabinet resigned the same morning and handed its seals to a provisional cabinet of the Commonwealth, which governs as an office until the first parliament is elected. Its members have agreed not to be named in its decrees.\n\nThe new charter is short and practical. Elections every four years. Free association for fishermen, dockers and seamen. Public accounts for every harbour board. And, most controversially, open registers: anyone may now walk into a customs house and learn who owns a ship, a berth or a fishing licence. Some old harbour fortunes, the newspapers note cheerfully, are about to become a great deal more visible.\n\nNot everyone is cheering. The harbourmasters have accepted the change with careful neutrality, which in Scandia is a form of protest. The shipping houses have asked how open registers will affect their foreign customers. The guilds, who proposed a very different constitution, have said only that they will watch how the Commonwealth governs a bad winter.\n\nThe first bad winter is never far away on this coast. The provisional cabinet has six months to draft electoral rolls for every port, and the fishing season starts in four. Nobody on the quays expects the two calendars to agree.\n\nProvisional gameplay: no source covers Scandia; its coastline, harbours and oil are mod provenance (history/countries/SCA - Scandia.txt, history/states)."
 ac_ud_mina.607.t:0 "The Coastal Commonwealth"
 ac_ud_mina.608.a:0 "Govern in trust for the coast."
 ac_ud_mina.608.d:0 "The regency council first met in the old customs house of the capital, in a room hung with the harbour charters that gave it its form. Its seats belong to offices rather than persons: the senior harbourmasters, the wardens of the fishing guilds, the master of the shipping register and the senior captain of the fleet. Whoever holds those offices sits on the council. No one else does, and no one is named.\n\nThe guilds call the arrangement a regency because it governs in trust, for the coast as a whole, rather than for any party or district. Critics in the capital call it a committee of harbourmasters with a grand title. Both descriptions are accurate. The council has promised an advisory assembly, charters that bind its own members, and elections when the country is stronger. It has not said when that will be.\n\nIn the harbours, the change is barely visible. The people who decided who berthed and who sailed still decide it; now they do so with the seals of the state. The cabinet's ministries continue their work under the council's instructions, and the first of those instructions concern dredging, quotas and the navy's cutters.\n\nThe dockers' newspapers, which wanted a Commonwealth, have been told they may keep publishing. They have printed the charters in full on their front pages, with the clauses about elections underlined twice in red ink.\n\nProvisional gameplay: no source covers Scandia; its coastline, harbours and oil are mod provenance (history/countries/SCA - Scandia.txt, history/states)."
 ac_ud_mina.608.t:0 "The Harbour Regency"
 ac_ud_mina.609.a:0 "Prepare quietly and thoroughly."
 ac_ud_mina.609.b:0 "Tell every harbour everything we know."
 ac_ud_mina.609.d:0 "The announcement came from Central Usea on the twentieth of April: the asteroid Ulysses would strike the Earth, and every government on the continent was being told to prepare. In the capital, the news was read out on the quays over the loudspeakers normally used for storm warnings. The fish auction stopped. For the first time anyone could remember, the boats stayed in harbour on a fair-weather day.\n\nNo one in Scandia knows where the fragments will fall. That uncertainty is the whole of the problem. Scandia is a country made of coastline, and every Scandian has heard what a large enough blow at sea could do to a shore. The weather service has no model for it. The radar chain can watch the sky but cannot change what it sees. The rescue service, built to save a boat at a time, has been asked how it would save a town.\n\nTwo plans emerged from the first emergency cabinet. The Interior Ministry wants every coastal town assigned high ground behind it, stocked with food and water, with a road kept clear so that people can leave the shore within an hour. The Harbour Board wants the harbours hardened instead: shelters behind the sea walls, deep cellars in the customs houses and boats on call to move people along the coast.\n\nBoth plans assume the worst without knowing what the worst will be. The cabinet has ordered both costed, and has asked the radar crews to keep watching.\n\nProvisional gameplay: Scandia's response is unsourced; the announcement date is official (ACES Chronicle, 1996 / 04.20)."
 ac_ud_mina.609.t:0 "Warning to a Coastal Nation"
 ac_ud_mina.610.a:0 "Send every boat that can sail."
 ac_ud_mina.610.b:0 "Secure the harbours first."
 ac_ud_mina.610.d:0 "On the eighth of July Ulysses broke apart over the world. Scandia's radar crews tracked the light for hours, plotting what they could and recording what they could not explain. When dawn came the duty officers were still at their screens, and the harbours were still waiting for the warning they had spent three years preparing to give.\n\nThe news arrived by radio, in fragments. Coasts and cities across Usea had suffered terribly; the details changed with every bulletin. Within days the shipping lanes emptied and the markets for Scandian fish and oil simply stopped. By the end of the first week, boats began to arrive in Scandian harbours: fishing boats, ferries and small craft carrying families who had left other coasts with whatever they could carry.\n\nThe rescue service that was built to save one boat at a time is now being asked to receive hundreds. The cold stores built for the catch are being emptied for the relief kitchens. Every ministry's preparations assumed a single blow and a single recovery. What has come instead is a long strain with no clear end, and the capacity the country built over three years of preparation is being spent faster than anyone planned.\n\nThe cabinet has drafted orders for the fishing fleet and the harbours. It must now decide whether the harbours will stay open to everyone who reaches them, and for how long.\n\nProvisional gameplay: Scandia's response is unsourced; the impact date is official (ACES Chronicle, 1999 / 07.08)."
 ac_ud_mina.610.t:0 "The Night the Sky Fell"
 ac_ud_mina.611.a:0 "Neutrality must be visible."
 ac_ud_mina.611.b:0 "Neutrality must be useful."
 ac_ud_mina.611.d:0 "The war has come to Usea. Erusea's armies have moved against San Salvacion and seized the railgun site at Stonehenge, and Central Usea has founded a coalition, ISAF, to push them back. Much of what follows will be fought at sea and in the air. Scandia is not a party to any of it. It has no faction, no alliance obligations and no wish to acquire either.\n\nA neutral coast is still a coast that every navy can see. Warships of more than one flag will pass within sight of the headlands. Supply ships will want fuel, pilots and berths. Agents are already in the capital asking about fishing boats for charter, with crews who know the shoals and do not ask questions. Every request is polite. None of them is entirely innocent.\n\nThe Admiralty wants Scandian waters closed: no warship of any flag enters without permission, the headland batteries manned and the radar chain reporting every contact. The Foreign Ministry argues that a neutral who helps no one will be remembered by everyone, and that clearly marked hospital ships could be given harbour rights without compromising anything. The fishing guilds want only to know that their boats will be kept out of every warship's way.\n\nWhatever the cabinet decides, the harbourmasters have been given one instruction for every shift: no armed vessel berths without written permission from the capital, and no one in the water is left there, whatever flag they sailed under.\n\nProvisional gameplay: Scandia's response is unsourced; the war date is official (ACES Chronicle, 2003 / SUMMER, 2003 / 08.22)."
 ac_ud_mina.611.t:0 "A Neutral Coast"
 ac_ud_mina.612.a:0 "Open the quays to the continent."
 ac_ud_mina.612.b:0 "Look to our own harbours first."
 ac_ud_mina.612.d:0 "The war is over, and the shipping lanes are filling again. Scandia's harbours stayed open or closed exactly as its government decided. Its rescue crews pulled sailors of more than one flag out of the water, and its fishing fleet kept working, in escorted groups, through every season of the war. In a continent that has lost so much in a single decade, a coast that kept its lights on is worth something.\n\nIt is also worth noticing. Shipping companies that never called at Scandian harbours now ask about berths and handling fees. Neighbours inland want their cargo moved through Scandian quays. The treaty council has asked Scandian officials to help write the rules for a busier sea. The country that spent the 1990s counting its boats is being asked to help run a coastline larger than its own.\n\nThe arguments that defined the decade have not gone away. The harbours still argue with the capital, the fishermen still argue with the shipowners, and the oil on the Petrol Coast still divides the people who live beside it. But they are the arguments of a coastal nation at peace, and for the first time in years the boats can sail on a fair-weather day without anyone looking up at the sky first.\n\nProvisional gameplay: Scandia's response is unsourced; the end of the war date is official (ACES Chronicle, 2005 / 09.19)."
 ac_ud_mina.612.t:0 "The Coast After the War"
 ac_ud_mina.613.a:0 "Keep the fees low and the gate busy."
 ac_ud_mina.613.b:0 "Tighten the inspections at the gate."
 ac_ud_mina.613.d:0 "The bonded zone on the capital's quays opened with very little ceremony: a fence, a gate, a customs office and a sign in three languages. Inside the fence, goods bound for the inland countries can be landed, stored and loaded onto wagons without paying Scandian duty. Outside it, Scandia collects a modest handling fee and a great deal of goodwill.\n\nThe idea is older than the fence. For generations, cargo for Calladen and Bulgurdarest has crossed Scandian quays and paid Scandian duty twice, once on the way in and again whenever the paperwork went wrong. Shippers learned to avoid the coast when they could. The free port is an admission that Scandia earns more by being an easy door than by being an expensive one.\n\nNot everyone agrees. The customs service has lost a source of revenue it guarded for decades, and the merchants of the capital worry that foreign goods passing through untaxed will find their way into Scandian shops. The Treasury replies that the handling fees already exceed the duty that was actually collected, and that a busy quay employs more dockers than an empty one.\n\nOn the first morning a train of empty wagons stood waiting at the gate. By evening it had left, full, for the inland border.\n\nProvisional gameplay: no source covers Scandia; its coastline, harbours and oil are mod provenance (history/countries/SCA - Scandia.txt, history/states)."
 ac_ud_mina.613.t:0 "A Door to the Sea"
 ac_ud_mina.701.a:0 "Begin with the customs posts."
 ac_ud_mina.701.b:0 "Begin with the mountain."
 ac_ud_mina.701.d:0 "There is an old joke in the capital that Bulgurdarest is not a country but a timetable. It is not entirely unfair. Six neighbours meet at its frontiers: Calladen, Albard, Scandia, Ferustia, Central Usea and Roca Roja. Their freight crosses its railways, their traders fill its market towns, and their quarrels are argued in its cafes by people who have relatives on both sides.\n\nThe administration that took office in 1991 inherited all of this and very little paper about it. No one could say with confidence how many trains crossed the frontiers in a week, how much the customs posts collected, who owned which seam on Mount Sartan, or why the great halls of Expo City stood half empty. The ministries had kept the country running. They had not kept count.\n\nThe cabinet's first decision was therefore a modest one. Before choosing what Bulgurdarest should become, it would find out what it was: every road and railway, every customs post and its takings, every mine and every hall. The register would be published. Its compilers were warned that it would make many people angry, and told to compile it anyway.\n\nProvisional gameplay: no source covers Bulgurdarest; its geography and country names are mod provenance (history/countries/BLD - Bulgurdarest.txt, history/states)."
 ac_ud_mina.701.t:0 "Six Borders and a Register"
 ac_ud_mina.702.a:0 "Publish the figures and let the argument begin."
 ac_ud_mina.702.b:0 "Keep the figures inside the ministry for now."
 ac_ud_mina.702.d:0 "For one full season, every customs officer in Bulgurdarest counted. They counted lorries and wagons, barges and handcarts; they counted what was declared and estimated what was not. The results arrived in the capital on a single sheet of figures, and the Finance Ministry read it twice before it believed it.\n\nBulgurdarest moves far more freight than it ever recorded, and earns far less from it than it should. Ferustian rubber, Albard steel and Calladen grain all cross its frontiers, and much of it crosses through a fog of local fees, informal payments and posts that close whenever their officer has business elsewhere. The country is already the region's crossroads. It simply has not decided to be paid for it.\n\nTwo proposals have come back with the figures. The Railway Board wants bonded yards at the frontier junctions: sealed sidings where foreign freight changes trains without paying duty, for a handling fee, so that Bulgurdarest becomes the switching yard of the whole region. The Trade Ministry wants something simpler and more radical: one low tariff, published, the same at every crossing for every neighbour, with the market towns left to grow on the traffic.\n\nBoth promise more money than the fog. Both would put some officials out of work, and those officials have already begun to explain, loudly and at length, why neither can possibly succeed in a country like this one.\n\nProvisional gameplay: no source covers Bulgurdarest; its geography and country names are mod provenance (history/countries/BLD - Bulgurdarest.txt, history/states)."
 ac_ud_mina.702.t:0 "What the Crossings Earn"
 ac_ud_mina.703.a:0 "Open the halls for the next season."
 ac_ud_mina.703.b:0 "Repair the halls before opening them."
 ac_ud_mina.703.d:0 "Expo City was built for a single season of crowds, long before anyone now in government was born. Its pavilions still stand, its avenues are still lined with lamps, and its great central hall still seats more people than live in most Bulgurdaresti towns. For most of the year it is empty. Caretakers sweep the floors and tourists photograph the fountains, and the city council pays the heating bills with a sigh.\n\nThe new fair charter is meant to change that. The board it creates has been told to fill the halls, and the board has divided almost at once over how. One faction wants a market: buyers and sellers from every neighbouring country, contracts signed on the fair floor, hotels full and the city earning its keep. The other wants a showcase: engineers, universities and laboratories from across Usea exhibiting what they can build, with Bulgurdarest hosting the conversation that follows.\n\nThe two are not quite opposites. A market attracts the money that a showcase needs, and a showcase gives a market something worth buying. But the halls can only be arranged one way at a time, the board's budget can only be spent once, and both factions believe the other's version of the fair would be a slow way of emptying it again.\n\nThe board has asked the cabinet to choose, and promised to make the best of whichever answer comes back.\n\nProvisional gameplay: no source covers Bulgurdarest; its geography and country names are mod provenance (history/countries/BLD - Bulgurdarest.txt, history/states)."
 ac_ud_mina.703.t:0 "The Halls of Expo City"
 ac_ud_mina.704.a:0 "Take the map to the cabinet."
 ac_ud_mina.704.b:0 "Take the map to the pit villages first."
 ac_ud_mina.704.d:0 "The geologists' map of Mount Sartan is the first complete one ever made, and it is beautiful: oil in the lower strata, aluminium ore and iron in the seams above, all of it traced in colour through a mountain that men have been digging into for a century. It is also deeply alarming, because it shows how much of that century was wasted.\n\nThe mountain has been worked by a dozen small companies, most of them now bankrupt or nearly so. Their galleries cross one another, their spoil heaps block one another's roads, and their accounts are a matter for the courts. The pit villages that depend on them have learned to distrust every new owner, and they have usually been right to.\n\nThree proposals now lie before the cabinet. The Ministry of Industry wants a State Mining Trust: buy out the failing companies and run the mountain as a single enterprise with a single plan. The miners' unions want the pits to belong to the villages that work them, as cooperatives, with state credit and a state buyer for their ore. And a group of foreign mining houses has offered to lease the upper seams at their own expense, paying royalties to the treasury for every tonne they lift.\n\nEach offer solves a different problem. The trust solves disorder, the cooperatives solve distrust, and the leases solve the treasury. None solves all three, and the mountain cannot be divided three ways.\n\nProvisional gameplay: no source covers Bulgurdarest; its geography and country names are mod provenance (history/countries/BLD - Bulgurdarest.txt, history/states)."
 ac_ud_mina.704.t:0 "Who Owns the Mountain"
 ac_ud_mina.705.a:0 "Make the offer known to every neighbour."
 ac_ud_mina.705.b:0 "Let the neighbours discover it for themselves."
 ac_ud_mina.705.d:0 "Bulgurdarest has never been powerful enough to frighten its neighbours or rich enough to buy them. What it has, by accident of geography, is a seat at the centre of their quarrels. Every dispute between any two of its six neighbours eventually produces traffic through Bulgurdarest: refugees, smugglers, journalists, and sooner or later diplomats looking for somewhere to meet that is not the other side's capital.\n\nThe Foreign Ministry has proposed making a policy of what has so far been an accident. Bulgurdarest would offer neutral ground: a place where any two neighbours may talk, with hosts who take no side and want nothing from the outcome except quiet borders. It would not mediate wars, guarantee borders or join anyone's alliance. It would provide a table, an interpreter and a closed door.\n\nThe ministry is divided on how. One school wants the table to be public: meetings in the capital with the press in the gallery, on the theory that promises made in the open are harder to deny at home. The other wants quiet rooms and couriers, on the theory that the most useful conversations are the ones that never officially happened. Both schools agree on the danger. A host who is caught favouring one guest will not be invited to host again.\n\nThe cabinet has approved the principle. The method is still being argued over, in private, which some ministers consider an answer in itself.\n\nProvisional gameplay: no source covers Bulgurdarest; its geography and country names are mod provenance (history/countries/BLD - Bulgurdarest.txt, history/states)."
 ac_ud_mina.705.t:0 "A Table on Neutral Ground"
 ac_ud_mina.706.a:0 "Instruct the delegation to prepare both."
 ac_ud_mina.706.d:0 "The Central Usean Treaty Council meets with its larger members at the head of the table and its smaller members along the sides. Bulgurdarest sits along the side. It cannot outvote anyone, it cannot outspend anyone, and when the larger members agree among themselves, its delegates learn about it from the communique.\n\nThe Foreign Ministry believes this can be changed without changing Bulgurdarest's size. The country's frontiers touch more members than almost anyone else's, and its railways carry more of their trade. A delegation that understood transit better than anyone else, or one that could deliver the votes of the other small members, might make itself the member that every agreement has to pass through.\n\nTwo strategies are on offer. The first is to champion the council's transit clauses: propose one set of rules for moving goods across every member's frontier, and offer Bulgurdaresti officials to draft and administer them. The second is to organise the small members into a caucus that agrees its positions in advance, so that the larger members must negotiate with a bloc rather than pick off its parts one by one.\n\nEither strategy would make Bulgurdarest more visible on the council. Either would also make it some enemies there. The larger members are not accustomed to negotiating with the side of the table, and they are unlikely to enjoy learning how. The delegation has been told to be patient, polite and very well prepared.\n\nProvisional gameplay: no source covers Bulgurdarest; its geography and country names are mod provenance (history/countries/BLD - Bulgurdarest.txt, history/states)."
 ac_ud_mina.706.t:0 "The Member Everyone Needs"
 ac_ud_mina.707.a:0 "Let the three answers be argued in public."
 ac_ud_mina.707.b:0 "Keep the argument within the cabinet."
 ac_ud_mina.707.d:0 "The administration that took office in 1991 was meant to be a placeholder. It has governed competently enough, kept the trains moving and the customs posts open, but it has never quite explained what it is or why it should continue. Now that the country is busier, richer and more visible than at any time in living memory, three very different groups have decided that they should explain it instead.\n\nThe royalists point out that the Tsardom of Bulgurdarest was never formally abolished, merely set aside, and that a crown council of notables could govern in its name without the expense or the embarrassment of a monarch. The railway unions, the miners of Mount Sartan and the workers of the Nervada factories answer that the country is a timetable, and that the people who run the timetable should run the country: a people's republic, governed by committees. The customs service says the least and perhaps means the most. It is the one institution that functions at every frontier, it has kept the country's accounts for a decade, and its senior officers have quietly let it be known that they could govern as a directorate until politics can be trusted again.\n\nEach group has its strength. The royalists have the notables and the capital. The unions have the railways, which is to say they have everything that moves. The customs service has the frontiers, which is to say it has the money.\n\nThe administration has made no reply. Its silence is being read, in every cafe in the capital, as an admission that it no longer knows the answer.\n\nProvisional gameplay: no source covers Bulgurdarest; its geography and country names are mod provenance (history/countries/BLD - Bulgurdarest.txt, history/states)."
 ac_ud_mina.707.t:0 "Who Governs the Crossroads?"
 ac_ud_mina.708.a:0 "Long live the crown in council."
 ac_ud_mina.708.d:0 "The crown council met for the first time in the old palace of the capital, in a hall that had not been heated for a generation. Its members are notables: magistrates, senior officials, the heads of old families and newer fortunes, chosen by a procedure the royalist societies had drafted years ago and kept in a drawer against exactly this day. They govern in the name of the crown of Bulgurdarest.\n\nThey do not name a monarch. This is deliberate, and it is the council's cleverest decision. A named monarch would need a dynasty, a household, a claim to defend and enemies to answer. A crown governed by a council needs only a charter and a seal. The council is the crown, as far as the state is concerned, and its members serve together, sign together and can be replaced together without anyone needing to be crowned or deposed.\n\nThe country's response has been mixed but calm. Some Bulgurdarestis welcome the crown as a symbol above party, or at least welcome the idea of one. The railway unions have denounced the council as a club for the rich, and the customs service has said nothing at all, which the council has chosen to take as consent. In the market towns, the change is mostly noticed because the stamps on official letters now carry a crown.\n\nThe council's first instruction to the ministries is to continue their work exactly as before. Its second is to prepare a charter defining what the crown may do. It has promised that the charter will be short.\n\nProvisional gameplay: no source covers Bulgurdarest; its geography and country names are mod provenance (history/countries/BLD - Bulgurdarest.txt, history/states)."
 ac_ud_mina.708.t:0 "The Crown Council Sits"
 ac_ud_mina.709.a:0 "All power to the committees."
 ac_ud_mina.709.d:0 "The proclamation was read at the Nervada junction at the hour when the most trains were standing in the station, so that their crews could carry the news down every line in the country. By evening it had reached the capital, Mount Sartan and Expo City, and by the following morning every frontier post had a copy pinned beside the timetable.\n\nThe People's Republic of Bulgurdarest is to be governed by a presidium answerable to elected committees in every works, depot and pit. The presidium is an office, not a person; its members serve together and can be recalled together by a congress of committee delegates. The railway unions, the miners and the Nervada workers who wrote the proclamation insist that this is the point. No one will rule the crossroads alone again.\n\nThe old administration handed over its ministries without resistance and, it must be said, with some relief. The customs service accepted the presidium's authority in a short letter that promised continuity of duties and committed to nothing else. The royalist societies held a dignified protest in the capital and then went home. The neighbours, who depend on Bulgurdaresti railways for a good deal of their trade, have asked only that the trains keep running.\n\nThe presidium's first decree guarantees that they will. Its second orders every committee to meet within a month, and to send its delegate to the capital with a list of what its works needs and what it can give.\n\nProvisional gameplay: no source covers Bulgurdarest; its geography and country names are mod provenance (history/countries/BLD - Bulgurdarest.txt, history/states)."
 ac_ud_mina.709.t:0 "The People's Republic Is Proclaimed"
 ac_ud_mina.710.a:0 "Order at the frontiers, honesty in the ledgers."
 ac_ud_mina.710.d:0 "There was no proclamation. The senior officers of the customs service met the outgoing administration in the Finance Ministry, signed a transfer of authority drafted by their own legal department, and returned to their offices. The radio announced that evening that Bulgurdarest would be governed by a Customs Directorate until further notice, and played the same music it always played.\n\nThe directorate is an office, not a person, and its members have gone to some trouble to stay unnamed. They are career officials who have spent decades at the country's frontiers, inspecting wagons, collecting duties and learning exactly where every rule could be bent and by whom. They do not claim to represent anyone. They claim to know how the country works, and to be able to make it work honestly.\n\nMany Bulgurdarestis find this oddly reassuring. The crown council would have been a club for notables, the people's republic a government of the railway unions. The directorate is merely the customs service, and the customs service, whatever else is said about it, has always opened on time. The royalists and the unions are less reassured. Both have noticed that the directorate controls the frontiers, the frontiers control the money, and the money controls everything else.\n\nThe directorate's first act is to announce that it will publish every rule it enforces, in full, in a single code. Its second is to begin writing that code, which its officers estimate will run to some nine hundred pages.\n\nProvisional gameplay: no source covers Bulgurdarest; its geography and country names are mod provenance (history/countries/BLD - Bulgurdarest.txt, history/states)."
 ac_ud_mina.710.t:0 "The Directorate Takes the Frontiers"
 ac_ud_mina.711.a:0 "Prepare the railways."
 ac_ud_mina.711.b:0 "Prepare the mountain."
 ac_ud_mina.711.d:0 "The announcement came from Central Usea on the twentieth of April: the asteroid Ulysses would strike the Earth. In Bulgurdarest it was heard on station loudspeakers as well as radios, because the railway staff turned up the volume and the crowds on the platforms stopped to listen. By the end of the afternoon the first special trains had been requested, though no one yet knew where they should go.\n\nThe government's planners understood their country's particular danger within a day. Whatever fell from the sky, and wherever it fell, the crossroads could be overwhelmed by what followed. Six neighbours, some of them with long coasts and great cities, would have reasons to send their people somewhere safer. Many of those people would travel by rail, and most of the region's railways run through Bulgurdarest. A crossroads in a catastrophe is a funnel.\n\nTwo plans were drafted within a month. The Railway Board proposed an evacuation junction: emergency timetables that could turn every line one way, reserve rolling stock parked at every frontier, and reception halls at every major station. The Ministry of the Interior proposed something more local. The galleries under Mount Sartan run for kilometres; cleared, shored and stocked, they could shelter the mining towns and much of the capital.\n\nThe first plan assumes that the danger will come from outside and must be moved through. The second assumes that it may come from above and must be survived at home. No one in the capital yet knows which assumption is correct, and both plans cost more than the government has.\n\nProvisional gameplay: Bulgurdarest's response is unsourced; the announcement date is official (ACES Chronicle, 1996 / 04.20)."
 ac_ud_mina.711.t:0 "The Crossroads and the Sky"
 ac_ud_mina.712.a:0 "Every train runs, every hall opens."
 ac_ud_mina.712.b:0 "Count before we promise."
 ac_ud_mina.712.d:0 "On the eighth of July Ulysses broke apart over the world. In Bulgurdarest people watched the sky from station platforms, rooftops and the slopes of Mount Sartan. No one in the capital could say where the pieces had come down, and the radio could only repeat that the night was over. By morning the stations were quiet. By the next morning they were not.\n\nThe trains began arriving on the second morning. They came from every border at once, and they came full: families with whatever they could carry, the injured, the elderly, crews who had driven through the night because no one had told them to stop. The emergency timetables, if they had been prepared, were tested to their limits within a week. If they had not, the stationmasters improvised, and some of their improvisations were remarkable.\n\nThe government now faces the question it has been dreading since 1996. Bulgurdarest can keep its crossings open, run its trains for anyone who reaches them and become the region's refuge and corridor at once, accepting the strain on its food, its housing and its patience. Or it can close its frontiers to all but the sick and the children, protect what it has, and accept that its neighbours will remember the decision for a generation.\n\nIn the meantime, the Expo City halls have been opened as depots. No one ordered it. The caretakers simply unlocked the doors when the first relief lorries arrived, and the board has decided not to ask whose idea it was.\n\nProvisional gameplay: Bulgurdarest's response is unsourced; the impact date is official (ACES Chronicle, 1999 / 07.08)."
 ac_ud_mina.712.t:0 "The Night the Sky Broke"
 ac_ud_mina.713.a:0 "Neutrality must be strict."
 ac_ud_mina.713.b:0 "Neutrality must be humane."
 ac_ud_mina.713.d:0 "War has come to Usea. Erusea's armies have moved against San Salvacion and seized the railguns of Stonehenge, and Central Usea is gathering a coalition to drive them back. Bulgurdarest is a party to none of it. It has signed no alliance, accepted no obligation and has no intention of acquiring either.\n\nIt is, however, a crossroads, and in wartime a crossroads is a prize. Six neighbours' supply lines touch its railways. Their refugees reach its frontiers. Their agents buy fuel, steel and spare parts in its markets, and their diplomats arrive in the capital with polite requests that grow less polite with every week the war continues. The country that spent the 1990s learning to be paid for its traffic must now decide what traffic it will carry at all.\n\nThe frontier service proposes the simplest rule: every train inspected, no weapon, soldier or munition allowed through, whoever's it is. The Foreign Ministry argues for a narrower exception. ISAF has asked to move its wounded and its medical supplies by Bulgurdaresti rail, under Bulgurdaresti crews and inspectors, without any military cargo and without any alliance. A neutral, the ministry argues, can still be humane.\n\nBoth sides agree on one thing. Whatever Bulgurdarest decides, it must apply the rule to every army equally and be seen to do so, because a crossroads that bends for one side will soon find itself treated as part of the other.\n\nProvisional gameplay: Bulgurdarest's response is unsourced; the war date is official (ACES Chronicle, 2003 / SUMMER, 2003 / 08.22)."
 ac_ud_mina.713.t:0 "Between Six Borders"
 ac_ud_mina.714.a:0 "Open the crossroads to the rebuilding."
 ac_ud_mina.714.b:0 "Settle our own accounts first."
 ac_ud_mina.714.d:0 "The war is over. Bulgurdarest was never invaded, never bombed and never forced to choose a side, and it emerges from the war with its railways intact in a region where many are not. Every neighbour needs to rebuild. Almost every road to rebuilding runs through the crossroads.\n\nThe trains have never been fuller. Steel, cement, timber and machinery cross the frontiers in quantities the customs posts struggle to count, and the old complaint that Bulgurdarest earns too little from its traffic has been replaced by a new one: that it earns too much, and that its neighbours have noticed. Every delegation that arrives in the capital to arrange transit also arrives with a list of grievances from the war years.\n\nThe country's institutions, whatever form they have taken by now, face the test that the 1990s prepared them for. The register, the fair, the mountain and the table on neutral ground were all built for a busy, quarrelsome region. That region has arrived. The question is whether Bulgurdarest can stay a crossroads rather than becoming a battlefield of other people's peace.\n\nProvisional gameplay: Bulgurdarest's response is unsourced; the end of the war date is official (ACES Chronicle, 2005 / 09.19)."
 ac_ud_mina.714.t:0 "The Busiest Crossroads in Usea"
