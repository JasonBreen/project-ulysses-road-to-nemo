 ac_camp.115.t:0 "A clause on separate paper"
 ac_camp.115.desc:0 "The council secretary has placed the disputed clause on a separate sheet. It is easier to postpone a sentence when nobody has to look at the rest of the agreement around it. Unanimous consultation preserves every member's opportunity to object. A delegated mandate can deliver a faster answer while narrowing the work the council has expressly authorized. The branch receives the current offers and keeps their permissions separate. It does not create guarantees, foreign bases, faction membership or a shared willingness to fight out of the convenience of one meeting."
 ac_camp.115.a:0 "Circulate a public receiving account."
