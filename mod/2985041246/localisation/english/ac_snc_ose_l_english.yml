 OSE_snc_replacement_standards_protocol:0 "Trace One Complete Order"
 OSE_snc_replacement_standards_protocol_desc:0 "Select an ordinary replacement order and follow its receiving record through a fresh funded procurement-scrutiny period. The committee is not asking the workshop to stage a perfect demonstration. It wants to see a challenge handled while the rest of the schedule continues to exist. The selected lane must complete its work after the present request. Earlier acceptance reports remain in the file, but cannot certify the current procedure. Trace who discovered the defect, who could refuse the delivery, and which other claimant was told that an honest refusal would alter the timetable."
