 ac_camp.106.t:0 "An island receives a continent"
 ac_camp.106.desc:0 "The arriving aircraft are only the visible part of the commitment. Someone has to receive their crews, clear a hangar, keep the communications staff awake, and tell the neighborhood that another building has been requisitioned. A dispersed receiving plan protects capacity by making the headquarters less convenient. A fortified headquarters offers command a firmer center while concentrating its demands. The branch asks for an actual allied acceptance before it records a hosting commitment. The island's government retains its own responsibility for the people already living beneath the flight path."
 ac_camp.106.a:0 "Circulate a public receiving account."
 ac_camp.106.b:0 "Keep a signed professional return."
