 YUK_snc_civil_receiving_protocol:0 "Request the Current Distribution"
 YUK_snc_civil_receiving_protocol_desc:0 "Open a fresh funded distribution-review period through the selected existing lane. The committee wants the allocation being used now, including the current claimant left outside its priority. Earlier completed periods explain how the schedule developed, but cannot provide the missing present answer. The actual service must complete after this request. During war it may deliver reduced domestic continuity and must be understood on those terms. If the receiving period is interrupted, record the spent work without crediting a conclusion and require a current request before a new period can supply the account."
 YUK_snc_civil_receiving_protocol_requirements_tt:0 "From 2010.1.1, an active national administration and the required earlier work are available. The selected policy remains exclusive; conclusions remain available when their real prerequisites finish after the expected calendar."
 YUK_snc_civil_receiving_protocol_effect_tt:0 "Open a fresh review request. Complete the corresponding selected-lane SNP service after this request; existing payments and national reservations remain owned by that service."
 YUK_snc_civil_receiving_review:0 "Hear the Waiting Service"
 YUK_snc_civil_receiving_review_desc:0 "The waiting service has finally received an explanation it can challenge. It has not necessarily received the window it wanted. Review the completed funded period without confusing those outcomes. A selected civil floor can leave a protected demand unanswered; a bounded command claim can leave an ordinary repair delayed. Both costs belong in the receiving account. The committee should be able to identify who answered, which authority was used and whether the claimant learned the changed condition before acting on the old promise. A balanced allocation alone cannot tell that part of the story."
 YUK_snc_civil_receiving_review_requirements_tt:0 "From 2010.1.1, an active national administration and the required earlier work are available. A corresponding selected-lane funded service must have genuinely completed after this branch requested its review."
 YUK_snc_civil_receiving_review_effect_tt:0 "Record the corresponding genuinely completed funded period after this branch requested it."
