 ac_camp.8.t:0 "The report that fits"
 ac_camp.8.desc:0 "Headquarters had asked for a shorter report. The officer removed a paragraph about the search delay and discovered that the remaining account described a much more successful arrangement. The permit had been issued. A vehicle had passed. No prohibited goods had been found. Three facts, none of them false, and none of them sufficient to explain why the municipal administrator was waiting outside again.\n\nThe sergeant brought the correspondence file. It had become thicker because several offices had made their own copies of the same letter. A clerk had underlined the word brother and added a question mark. Another had written No identified military significance in the margin. The officer wondered whether either man had understood that the writer might have considered that the point.\n\nHe returned to the transport account. A limited exception could survive only if the next shift knew its limits. The duty roster changed more often than the instructions. Someone would eventually stop the driver because he had never seen this particular form, and everyone concerned would have a defensible explanation afterward.\n\nThe administrator came in when called. He had brought no new request. Instead he laid a copy of the original authorization on the desk, worn along the fold and discolored where it had been handled in the rain.\n\n\"Could the next patrol be told?\"\n\nThe officer looked at the shorter report and then at the paper on his desk. The exception needed work precisely because the report said that it had already worked."
 ac_camp.8.desc.v0:0 "Headquarters had asked for a shorter report. The officer removed a paragraph about the search delay and discovered that the remaining account described a much more successful arrangement. The permit had been issued. A vehicle had passed. No prohibited goods had been found. Three facts, none of them false, and none of them sufficient to explain why the municipal administrator was waiting outside again.\n\nThe sergeant brought the correspondence file. It had become thicker because several offices had made their own copies of the same letter. A clerk had underlined the word brother and added a question mark. Another had written No identified military significance in the margin. The officer wondered whether either man had understood that the writer might have considered that the point.\n\nHe returned to the transport account. A limited exception could survive only if the next shift knew its limits. The duty roster changed more often than the instructions. Someone would eventually stop the driver because he had never seen this particular form, and everyone concerned would have a defensible explanation afterward.\n\nThe administrator came in when called. He had brought no new request. Instead he laid a copy of the original authorization on the desk, worn along the fold and discolored where it had been handled in the rain.\n\n\"Could the next patrol be told?\"\n\nThe officer looked at the shorter report and then at the paper on his desk. The exception needed work precisely because the report said that it had already worked.\n\nHis authorization was still in the patrol book. The officer made the returning sergeant read the exception aloud before signing the report. Men who disliked an instruction could sometimes lose it between one checkpoint and the next. He kept the original on his desk, where anyone questioning the passage would have to question the signature as well."
