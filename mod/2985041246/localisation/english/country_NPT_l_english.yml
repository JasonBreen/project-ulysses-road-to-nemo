 ### FOCUSES, IDEAS AND TOOLTIPS (Continental War round) ###
 npt_pre_continental_war_focus:0 "North Point National Focus"
 npt_pre_continental_war_focus_desc:0 "North Point's path from the 1991 mandate to the Continental War."
 NPT_1991_elections:0 "The 1991 Elections"
 NPT_1991_elections_desc:0 "The ballot boxes come ashore on the morning ferries, sealed with wax and escorted by a single Defense Forces corporal per island. In the subdivision halls the volunteers lay out long tables, the schoolteachers check the rolls against parish registers, and the radio announcers remind listeners every quarter hour that polling closes at dusk.\n\nNo one in the National Defense Council will say aloud what they expect. The Old Guard officers want quiet confirmation of a system that has kept the islands out of every war on the continent. The Democratic Republicans want a mandate for a civilian government. The young Reformists in their pressed uniforms want the Council to govern at home as firmly as it commands abroad.\n\nWhen the counts are telegraphed to the capital, the Council will have to decide which mandate it is prepared to honour.\n\n§gMod provenance: the archive planned these elections for 20 April 1991 but never wrote the event. The outcome is a player choice and does not change the ruling party or the Council.§!"
 NPT_old_guard_mandate:0 "Old Guard Mandate"
 NPT_old_guard_mandate_desc:0 "The returns from the outer islands come in first, and they are what the Council's clerks predicted: steady, cautious majorities for the status quo. Fishermen, dock workers and pensioners have voted for the arrangement that let their children grow up without conscription notices from a foreign war.\n\nIn the Council chamber the senior officers accept the result without ceremony. Domestic affairs stay with the elected subdivisions; the Council keeps the harbours, the airfields and the foreign ministry. A brief communique is read on the evening broadcast, and the islands go back to work.\n\n§gProvisional gameplay.§!"
 NPT_drp_mandate:0 "Democratic Republican Mandate"
 NPT_drp_mandate_desc:0 "The Democratic Republicans fill the town squares on election night, waving hand-painted placards that call for a parliament of the islands. Their vote has grown in every subdivision, and in the port towns it is a clear majority.\n\nThe Council does not dissolve itself, and no one seriously expected it to. But its spokesmen now speak of consultation and oversight, and a joint committee of subdivision delegates is invited to sit in on budget hearings for the first time. Some officers call it a concession. Others call it the beginning of the end.\n\n§gProvisional gameplay.§!"
 NPT_reformist_mandate:0 "Reformist Mandate"
 NPT_reformist_mandate_desc:0 "The Reformists campaigned from the barracks gates and the naval academy steps, promising an end to the patchwork of island governments and a Council strong enough to plan for the whole nation. The vote rewards them beyond their own expectations.\n\nWithin days, junior officers are seconded to the subdivision offices as liaison staff, and the evening broadcast begins to carry reports on national efficiency in a tone that unsettles the older listeners. The structure of government has not changed yet, but the people inside it now know which way the wind is blowing.\n\n§gProvisional gameplay.§!"
 NPT_national_defense_review:0 "National Defense Review"
 NPT_national_defense_review_desc:0 "Whatever the voters chose, the staff officers on the top floor of the Defense headquarters have the same problem: the continent is rearming, and North Point's forces were sized for a quieter decade.\n\nFor six weeks they work through procurement files, harbour surveys and the logs of every airfield on the islands. Their final report is three volumes long and stamped secret, but its conclusion fits on one page. North Point can stay apart from Usea or stand beside it. It cannot afford to drift between the two.\n\n§gProvisional gameplay.§!"
 NPT_armed_neutrality:0 "Armed Neutrality"
 NPT_armed_neutrality_desc:0 "The Council's foreign minister reads the policy to a hushed press gallery. North Point will join no bloc, sign no alliance and host no foreign base. Instead, every island will be made too costly for anyone to take.\n\nCoastal batteries that have stood under tarpaulins for a decade are uncovered and test-fired. Reservists receive letters with new mobilisation instructions. In the cafes along the harbour, the older men nod; this is the North Point they remember.\n\n§gProvisional gameplay.§!"
 NPT_usean_outreach:0 "Usean Outreach"
 NPT_usean_outreach_desc:0 "A delegation of Council officers and subdivision envoys boards a chartered airliner for the mainland, carrying a briefcase of draft memoranda and very little certainty.\n\nIsolation has kept the islands out of every war in living memory, but the refugees, the trade routes and the falling sky of the coming years do not respect coastlines. The delegation's task is simple to state and hard to achieve: open a door to Central Usea and the treaty organisation it leads, without promising more than the islands can give.\n\n§gProvisional gameplay.§!"
 NPT_island_air_defence:0 "Island Air Defence"
 NPT_island_air_defence_desc:0 "The islands cannot be defended at the waterline alone. Survey teams walk the plateaus with theodolites and wind gauges, marking out runways on grazing land and old salt flats.\n\nBulldozers follow within the month. Pilots train on short strips cut into hillsides, and the radio operators learn to pass interception orders between islands faster than any intruder could cross the straits.\n\n§gProvisional gameplay.§!"
 NPT_self_reliant_industry:0 "Self-Reliant Industry"
 NPT_self_reliant_industry_desc:0 "A neutral nation that buys its rifles abroad is neutral only until the next embargo. The Council's economic office opens a new industrial park on the largest island, offering cheap land and long contracts to any firm that will build here.\n\nMachine shops that once repaired fishing boats begin turning out truck parts and field radios. The work is slow and the products are plain, but every crate stamped with a North Point mark is one less dependency.\n\n§gProvisional gameplay.§!"
 NPT_fcu_consultations:0 "Consultations with Central Usea"
 NPT_fcu_consultations_desc:0 "The first meeting is held in a borrowed conference room with the curtains drawn. By the third, the Central Usean diplomats are flying in on a regular schedule, and the harbour hotel keeps a floor reserved for them.\n\nNothing binding is signed. Instead, the two governments exchange weather data, refugee estimates and shipping schedules, and their officials learn each other's habits. In diplomacy, that is often where trust begins.\n\n§gProvisional gameplay.§!"
 NPT_uto_staff_talks:0 "Treaty Staff Talks"
 NPT_uto_staff_talks_desc:0 "A small team of North Point staff officers spends a month at a treaty headquarters on the mainland. They study air-defence procedures, radio protocols and the logistics of moving a brigade by sea.\n\nWhen they return, they bring binders of translated manuals and a list of contacts on the other side of the strait. The Council does not join the Central Usean Treaty Organization, but its officers now speak the same military language.\n\n§gProvisional gameplay.§!"
 NPT_guarded_neutrality:0 "Guarded Neutrality"
 NPT_guarded_neutrality_desc:0 "Fortified, self-supplied and bound to no one, North Point settles into watchful independence. The radar sites on the northern headlands report every aircraft over the straits, and the evening broadcast reads the day's shipping traffic like a weather forecast.\n\nForeign correspondents call the islands a fortress. The Council prefers to call them prepared. Either way, every government on the continent has noted that North Point intends to stay out of their quarrels.\n\n§gProvisional gameplay.§!"
 NPT_open_the_airfields:0 "Open the Airfields"
 NPT_open_the_airfields_desc:0 "Engineers lengthen the main runways and pour new aprons wide enough for heavy transports. Fuel farms rise behind the hangars, and the harbour authority dredges a deeper channel for tankers.\n\nOfficially the work is for civil aviation. Unofficially, the specifications were drawn up with treaty planners, and everyone involved knows that if the continent burns, these runways may be the safest in Usea.\n\n§gProvisional gameplay.§!"
 NPT_host_isaf:0 "Host ISAF"
 NPT_host_isaf_desc:0 "Stonehenge has pushed the allied forces back across the continent, and the Independent State Allied Forces needs a headquarters beyond the reach of its guns. The request reaches the Council by courier and is answered within the day.\n\nTransport aircraft land through the night. Staff officers in unfamiliar uniforms requisition school buildings for headquarters offices, and the islands' quiet airfields fill with the noise of fighters being repaired and rearmed. North Point's long neutrality ends not with a declaration but with a signed lease and a row of parked aircraft.\n\n§YOfficial:§! ISAF established its headquarters in North Point on 16 September 2004 (ACES Chronicle, 2004 / 09.16). The effects are provisional gameplay."
 NPT_isaf_logistics_hub:0 "ISAF Logistics Hub"
 NPT_isaf_logistics_hub_desc:0 "The allied headquarters needs fuel, food, spare parts and ammunition, and every crate must come through North Point's harbours. The port authority runs shifts around the clock; the rail spurs to the airfields are doubled; warehouses go up faster than the paint can dry.\n\nFor the dock workers and truck drivers of the islands, the war on the continent is no longer something heard on the radio. It is the weight of the cargo on their backs and the overtime on their pay slips.\n\n§gProvisional gameplay.§!"
 NPT_armed_neutrality_idea:0 "Armed Neutrality"
 NPT_armed_neutrality_idea_desc:0 "North Point stays outside every bloc and keeps its coastal defences, reserves and airfields ready. Any government on the continent that eyes the islands must weigh the price of taking them.\n\n§gProvisional gameplay.§!"
 NPT_usean_liaison_idea:0 "Usean Liaison"
 NPT_usean_liaison_idea_desc:0 "Liaison officers and regular staff talks link the Defense Forces with Central Usea and its treaty partners. Translated manuals and shared exercises are slowly wearing down a century of isolation.\n\n§gProvisional gameplay.§!"
 NPT_isaf_rear_base_idea:0 "ISAF Rear Base"
 NPT_isaf_rear_base_idea_desc:0 "North Point hosts the headquarters and rear echelon of the Independent State Allied Forces. Its airfields, harbours and depots sustain the war on the continent.\n\n§YOfficial:§! ACES Chronicle, 2004 / 09.16. The modifiers are provisional gameplay."
 NPT_isaf_formed_tt:0 "The Independent State Allied Forces have been formed"
