 ac_camp.63.t:0 "A crew held in reserve"
 ac_camp.63.desc:0 "The rescue controller had been asked to justify the reserve twice. On the second occasion he put the original allocation beside the proposed alternative and invited the staff officer to sign the change. The officer said that was not necessary. The controller waited until he left before putting the papers away.\n\nThe crew had brought Chopper back. In the first confused receiving account, his name had appeared without an explanation of what it had taken to keep a recovery possible. The controller added the reserve allocation to the file. Keeping that possibility available had meant holding people and equipment out of other useful work. It had required somebody to make the argument before anyone could know which name would depend on it.\n\nThe crew chief checked the receiving instructions again. A rescue plan was not a promise that every aircraft could be reached. Weather, damage, distance and the person at the controls would still matter. The new route recorded what had actually been prepared and the alternate outcome it made possible; it did not rewrite the earlier allocation after the need became obvious.\n\nOutside the office, a pilot was making an ordinary complaint about a piece of equipment. The controller listened to the familiar rhythm of the argument and felt suddenly unwilling to interrupt it.\n\nHe added the reserve crew's names to the duty return. If their work became necessary, the eventual report would probably compress the preparations into a phrase about a timely response. He wanted a record that the response had required time, people, and a refusal to spend them somewhere else."
 ac_camp.63.a:0 "Keep this account."
 ac_camp.63.z:0 "Close this old message."
