 ac_wd_bal.1.t:0 "The November Ballot"
 ac_wd_bal.1.d:0 "In November 1991 the mandate from the ballot of 1987 runs out, and Baltica votes. Polling stations open in schools and works canteens across the five provinces, with ploughs out on the roads because the first snow has already fallen on the plain. The National Administration that has governed under the democratic banner will not survive the count in its present form, and everyone in Silvius knows it.\n\nSeven voters in ten support the democratic parties, which agree that ministers should answer to the chamber and disagree about almost everything else. Most of the rest follow a non-aligned establishment of works directors, harbour owners and senior officers who distrust coalitions and prefer competence to debate. Nearly every family has someone on the reserve list or the works payroll, and both groups expect the next government to remember them.\n\nBefore any answer is chosen, the Administration must settle how the result will be received. It can publish the count from every polling station by the next morning, inviting challenges and recounts, or certify the national result first and release the local figures once a government has been formed. The four years that follow begin with this choice.\n\nProvisional gameplay."
 ac_wd_bal.1.a:0 "Publish every count by morning."
 ac_wd_bal.1.b:0 "Certify the national result first."
 ac_wd_bal.2.t:0 "A Register Taken in Winter"
 ac_wd_bal.2.d:0 "The register clerks set out in January, because that is when farmers, fishermen and forest crews are at home. They travel by rail to the harbour, by sledge into the forest province and on foot up the steepest streets of Silvius. Their ledgers record households, wells, stoves, roads and the distance to the nearest doctor, and the clerks come back with frostbite and complaints in roughly equal measure.\n\nThe figures confirm what everyone suspected and nobody had written down. The capital and its hill hold the works, the offices and the best roads. The inland plain feeds the country and carries its only railway. The forest province, on the Malynea frontier, has the worst roads and the darkest winters, and the two coastal plains depend entirely on the harbour and the weather.\n\nThe planners propose to rank the provinces by need and fund roads, clinics and heating in that order. Deputies from Silvius point out that the works pay most of the taxes. Deputies from the forest point out that their children walk to school in the dark. The cabinet must decide whether the ranking is printed for everyone to argue over, or used quietly inside the planning office.\n\nProvisional gameplay."
 ac_wd_bal.2.a:0 "Print the ranking for everyone."
 ac_wd_bal.2.b:0 "Use it quietly inside the planning office."
 ac_wd_bal.3.t:0 "What the Works Really Cost"
 ac_wd_bal.3.d:0 "The auditors have walked every hall of the arsenal works and both civilian plants, and their report is thicker than anyone expected. The three arms lines employ more people, consume more power and owe more money than the ministries believed. Some machine tools were bought on foreign credit and never installed. Others have run without maintenance for so long that much of what they turn out is rejected by the inspectors.\n\nThe directors blame irregular orders from buyers who appeared, vanished and reappeared. The works councils blame managers who kept two sets of books. The territorial service, which takes a large share of the output, discovers that it has been paying export prices for rifles made a short drive from its own barracks. The foreign creditors will want to know when they are to be paid.\n\nThe government now holds the only honest account of its largest employer. It can share the full report with the works councils, inviting a hard argument about wages and jobs, or brief only the directors and the creditors and settle the books privately. The councils have already heard that the report exists, and their members are waiting at the gates for an answer.\n\nProvisional gameplay."
 ac_wd_bal.3.a:0 "Share the report with the councils."
 ac_wd_bal.3.b:0 "Brief the directors and creditors."
 ac_wd_bal.4.t:0 "Silence at the Works Gates"
 ac_wd_bal.4.d:0 "Three weeks after the audit reaches the works councils, the morning shift at the largest arms line does not go in. The workers stand at the gates in the snow with flasks of tea and hand-painted signs, and refuse to start the lines until someone explains why their wages were frozen while machine tools rusted in their crates. By noon the other four plants have joined them.\n\nThe walkout is orderly and almost silent. Nobody breaks a window, and the councils send volunteers to keep the furnaces warm so that the pipes do not freeze and the housing blocks stay heated. The directors call it blackmail. Deputies from Silvius call it the predictable result of the audit. Foreign buyers with deliveries due this month telephone the ministry one after another.\n\nThe government cannot leave the works idle for long without losing both its exports and the goodwill of every family that depends on a works wage. It can open talks at once with the councils present and the full books on the table, or order each director to settle wage by wage in his own plant. The first is slower and fairer. The second is faster, and it will be remembered.\n\nProvisional gameplay."
 ac_wd_bal.4.a:0 "Open talks with the books on the table."
 ac_wd_bal.4.b:0 "Let each plant settle its own wages."
 ac_wd_bal.5.t:0 "The Harbour Freezes Early"
 ac_wd_bal.5.d:0 "The cold comes weeks early this year, and before the end of November the harbour is freezing along the quays. A grain ship and two freighters loaded with machine tools anchor offshore, waiting for a channel that the harbour's old tugs cannot keep open. The railway from Silvius fills its sidings with wagons that have nowhere to unload.\n\nThe harbour master reports that the tugs were built for summer work and that their crews have never been trained for ice. The shipping lines report that insurers will not cover hulls waiting in drifting ice for more than a few days. In Silvius bread prices rise while the grain ship's cargo sits within sight of the coast, and the newspapers print a photograph of it every morning.\n\nThe government must get the ships in, and in doing so it will decide what kind of harbour Baltica keeps. It can hire an icebreaker abroad at whatever price its owners name, or order the tugs out with volunteer crews and accept the risk to men and hulls. Whatever it chooses this winter will set the harbour's budget for the rest of the decade.\n\nProvisional gameplay."
 ac_wd_bal.5.a:0 "Hire an icebreaker at any price."
 ac_wd_bal.5.b:0 "Send the tugs out with volunteers."
 ac_wd_bal.6.t:0 "A Muster in January"
 ac_wd_bal.6.d:0 "At dawn on a January morning every reservist on the territorial service's lists is told to report to the nearest barracks by noon. The snow on the plain is knee deep and the coastal road is half closed. In Silvius the barracks fill within hours. On the forest province reservists arrive by sledge, by tractor and on skis, and a good many do not arrive at all.\n\nBy evening the service knows more about itself than it has learned in years. The two infantry formations are real, but many names on the lists belong to men who have moved away, aged out or died. The depots hold far more trucks than the formations can drive and too few men licensed to drive them. Coats cut for milder weather send dozens to the infirmary with frostbite.\n\nThe general staff has money for one priority this year. It can spend on the reserve lists and on driving courses, so that the men who report can be moved, or on winter clothing and heated tents, so that the men who report can stay in the field. The reservists, who stood in the snow all day waiting for orders, have already said which they would choose.\n\nProvisional gameplay."
 ac_wd_bal.6.a:0 "Clothe the men first."
 ac_wd_bal.6.b:0 "Fix the lists and train drivers first."
 ac_wd_bal.7.t:0 "Three Frontiers and a Coast"
 ac_wd_bal.7.d:0 "The foreign office spreads its new atlas across a table in Silvius and invites the cabinet to look. The longest line on the map is the frontier with Yuktobania, running from the hills of Silvius across the inland plain to the sea, facing a country many times Baltica's size and governed by its communist party. The shorter lines face Malynea, beside the forest and the harbour plain, and Seterano, whose mountains rise just beyond the capital's hills and close for much of the winter.\n\nThe atlas proposes no change to any of these lines, and nobody at the table wants one. What it shows is how little Baltica knows about the country on the other side of each. Customs posts on the long frontier keep hours that suit neither side. The mountain passes have no rescue service. The coast faces an open sea where the only Baltican ships are merchant hulls.\n\nThe cabinet must decide how Baltica will present itself to its neighbours, and the decision cannot wait for perfect knowledge. It can announce a policy at once and accept that it may need correcting, or send envoys to listen in all three capitals before saying anything. Every neighbour will read the choice as a statement about itself.\n\nProvisional gameplay."
 ac_wd_bal.7.a:0 "Announce a policy at once."
 ac_wd_bal.7.b:0 "Listen in all three capitals first."
 ac_wd_bal.8.t:0 "The Empty Hangars"
 ac_wd_bal.8.d:0 "The airfield near Silvius has a runway, a tower, two hangars and no aircraft that belong to Baltica. Transport flights land a few times a week when the weather allows, and foreign aircraft occasionally ask permission to refuel. The ground crew is a handful of civilians who also clear the snow. The territorial service starts the decade with no air arm and no plan for one.\n\nNow the question has been asked in the chamber. Officers who watch the neighbours' air forces argue that a country without aircraft cannot even see who is flying over it, let alone stop them. Treasury officials reply that one flight of modern fighters would cost more than the service spends in several years. Engineers at the works point out that guns and radar would cost far less and could be maintained at home.\n\nBefore any choice about aircraft, the government must decide what the airfield is for. It can be run as a civil airport with military uses, funded by landing fees and open to anyone, or as a military field that admits civil flights by permission. The difference lies in who decides when the gates close, and the airlines have already asked.\n\nProvisional gameplay."
 ac_wd_bal.8.a:0 "Run it as a civil airport."
 ac_wd_bal.8.b:0 "Run it as a military field."
 ac_wd_bal.9.t:0 "A War Beyond the Horizon"
 ac_wd_bal.9.d:0 "In March 1995 fighting breaks out around Belka, on the far side of the world from Silvius. Baltica is no party to it and has no frontier anywhere near it, yet within a week the war has a desk in every ministry. Crude and grain cost more on every foreign exchange, shipping underwriters attach war clauses to any cargo routed near the fighting, and the works switchboard takes calls from buyers no director has ever met.\n\nFor the first time since the audit the arms lines are offered more orders than they can fill. Some deputies say a lawful order is a lawful order, and that Baltican wages should not wait on other people's peace. Others answer that a small country selling arms into a war acquires enemies it can never afford. The territorial service quietly asks whether its own deliveries will now slip to the back of the queue.\n\nThe cabinet meets twice in one week. The foreign minister wants a statement that Baltica will judge each order on its merits. The trade minister wants no statement at all. The chamber, the works councils and the reserve officers all want to know whether the war will raise wages or prices first, and the government must answer at least that before the spring is out.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25; the Baltican response is gameplay."
 ac_wd_bal.9.a:0 "Promise to judge each order on its merits."
 ac_wd_bal.9.b:0 "Freeze fuel and bread prices for the summer."
 ac_wd_bal.10.t:0 "Ulysses Will Fall"
 ac_wd_bal.10.d:0 "In April 1996 the FCU tells the world that Ulysses will hit the Earth, sixteen months after astronomers first raised the possibility. Where its fragments will come down is unknown, and may remain unknown until very late. Baltica has a hill of solid rock under its capital, winters cold enough to kill anyone left outdoors and a harbour that freezes just when it is most needed.\n\nThe engineers at the works propose cutting shelters into the rock and heating them from the works furnaces. The radio and weather services propose warning and dispersal instead, arguing that a shelter on the hill is useless to a family on the forest province if the roads are closed by snow. The doctors want hospitals moved underground. The treasury asks which of these plans the country can pay for.\n\nThe public mood moves faster than the planners. Hardware shops sell out of stoves and lamps, families on the coast talk about moving in with relatives in Silvius, and places of worship hold evening services every night. The government must decide whether to speak first about the danger or about the plan, knowing it cannot yet offer much of either.\n\nProvisional gameplay: date anchors only, ACES Chronicle rows 1994 / 12.10 and 1996 / 04.20; Baltican preparations are gameplay."
 ac_wd_bal.10.a:0 "Speak first about the plan."
 ac_wd_bal.10.b:0 "Speak first about the danger."
 ac_wd_bal_10_b:0 "Speak first about the danger."
 ac_wd_bal.11.t:0 "The Long July Night"
 ac_wd_bal.11.d:0 "On 8 July 1999 Ulysses passes through the Roche limit of the Earth. In Baltica nobody sleeps. Families sit in the galleries, cellars and shelters they spent three years preparing, or on their doorsteps with radios, watching the sky over the hill of Silvius and the sea beyond the harbour. The trains wait in their stations with crews aboard, ready to move people if a warning comes.\n\nThe radio carries reports from abroad faster than anyone can check them. A merchant master far out at sea describes lights he cannot explain. The weather service reports nothing unusual, then corrects itself, then corrects itself again. The crisis room under the capital keeps a log of every report, and by midnight it has stopped trying to separate rumour from fact and simply writes both down.\n\nAt first light the crisis room counts what it knows, which is far less than it needs. Power is on in Silvius, the trains are running and the harbour master is on the radio. Beyond that every report is partial. Some ministers want the shelters kept open until the world has a clearer picture. Others want the works restarted at once, because a country that lives on its factories cannot afford a week of waiting.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1999 / 07.08; no damage in Baltica is claimed."
 ac_wd_bal.11.a:0 "Keep the shelters open for a week."
 ac_wd_bal.11.b:0 "Restart the works at once."
 ac_wd_bal.12.t:0 "Charters Toward Usea"
 ac_wd_bal.12.d:0 "In the summer of 2003 Erusea invades the neutral country of San Salvacion and seizes Stonehenge, and war spreads across Usea. The continent is far from Baltica's frontiers, but Baltican hulls carry cargo on lanes that reach Usean ports, and the works sell spare parts to Usean buyers. Within a week underwriters withdraw cover on routes toward the fighting and raise it on every route nearby.\n\nBaltican masters will not sail toward Usea until they know who carries the loss if a hull goes down. Both sides of the war telephone the works with orders for trucks, spare parts and ammunition. The chamber, the works councils and the harbour owners all remember the Belkan War, and all remember it differently: as a season of easy profit, or as a lesson in how quickly a small supplier becomes a target.\n\nThe cabinet has two ways to steady the fleet. It can bar every Baltican hull from Usean waters until the war ends and compensate the owners for part of their lost income, or let masters sail where their contracts lead with whatever insurance they can buy. Either way the bill arrives every month the war lasts, and the harbour owners expect an answer before the autumn sailings.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2003 / SUMMER; the Baltican response is gameplay."
 ac_wd_bal.12.a:0 "Keep every hull out of Usean waters."
 ac_wd_bal.12.b:0 "Let masters sail where contracts lead."
 BAL_wd_chamber_cabinet_office:0 "Cabinet of the Elected Chamber"
 BAL_wd_chamber_cabinet_office_desc:0 "A cabinet chosen by the elected chamber of the Baltican Republic and answerable to it, governing collectively with the election calendar written into ordinary law. Provisional gameplay office with no named holder."
 BAL_wd_works_board_office:0 "Board of the National Works"
 BAL_wd_works_board_office_desc:0 "A standing board of the directors of the arsenal works, the civilian plants and the harbour company, holding the government seals while the chamber hears the budget twice a year. Provisional gameplay office with no named holder."
 BAL_wd_defence_council_office:0 "Council of Territorial Defence"
 BAL_wd_defence_council_office_desc:0 "A council of senior officers of the territorial service holding executive power for a declared period of readiness, with the chamber kept for budgets and petitions. Provisional gameplay office with no named holder."
 ac_wd_bal_decisions:0 "Baltica: National Measures"
 ac_wd_bal_decisions_desc:0 "Measures from the national programme of Baltica. Provisional gameplay unless a source ledger row says otherwise."
 BAL_wd_snow_brigades_out_decision:0 "Call Out the Snow Brigades"
 BAL_wd_snow_brigades_out_decision_desc:0 "Pays the volunteer brigades in fuel vouchers to clear lanes, clinic doors and bus stops through a bad spell. Repeatable once a winter."
 BAL_wd_works_overtime_decision:0 "Overtime on All Lines"
 BAL_wd_works_overtime_decision_desc:0 "Runs every line at overtime rates for three months to clear a backlog of orders, at the cost of tired crews. Repeatable twice a year."
 BAL_wd_second_coast_radar_decision:0 "A Second Radar on the Coast"
 BAL_wd_second_coast_radar_decision_desc:0 "Adds a second radar post to watch the far approaches of the harbour. A one-time charge on the harbour budget."
 BAL_wd_runway_extension_decision:0 "Extend the Runway Again"
 BAL_wd_runway_extension_decision_desc:0 "Adds a parallel taxiway and a longer runway so heavy transports can land in winter. A one-time works programme."
 BAL_wd_reserve_week_decision:0 "A Week With the Reserve"
 BAL_wd_reserve_week_decision_desc:0 "Calls one year group of reservists to the depots for a week of winter drill. Repeatable once a year; employers complain."
 BAL_wd_cold_store_rotation_decision:0 "Rotate the Cold Stores"
 BAL_wd_cold_store_rotation_decision_desc:0 "Sells the oldest grain from the cold stores at low prices and refills them from the new harvest. Repeatable once a year."
