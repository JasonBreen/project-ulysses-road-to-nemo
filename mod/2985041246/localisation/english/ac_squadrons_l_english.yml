 ac_sq_eva_cast_nadia_orlov:0 "Nadia Orlov"
 ac_sq_eva_cast_nadia_orlov_desc:0 "Airfield-defense and reconnaissance pilot\n\nNadia grew used to making a small allocation last and dislikes being praised for needing so little. She wants her flight to remain useful without becoming an excuse for neglect. The distinction becomes difficult when refusing an impossible assignment means leaving a real request unanswered."
 ac_sq_eva_cast_pavel_kresin:0 "Pavel Kresin"
 ac_sq_eva_cast_pavel_kresin_desc:0 "Wingman\n\nPavel's first answer to a shortage is to offer more of himself. His courage is real, and so is his impatience with people who ask him to wait. He wants to be trusted with difficult work and has trouble recognizing when trust should include being told to rest."
 ac_sq_eva_cast_vera_dolin:0 "Vera Dolin"
 ac_sq_eva_cast_vera_dolin_desc:0 "Maintenance chief\n\nVera keeps the serviceability board where everyone can see it. She has spent years preventing a temporary workaround from becoming an invisible permanent requirement. She will help a pilot attempt something difficult; she will not help an office pretend the difficulty was never there."
 ac_sq_eva_cast_milan_sarek:0 "Milan Sarek"
 ac_sq_eva_cast_milan_sarek_desc:0 "Route-security controller\n\nMilan sees transport requests arrive from people who have already been told to ask somewhere else. He knows that a stamp can represent accountability or another locked door. He tries to leave a trail clear enough for an honest person to follow, even when honesty is an inconvenient qualification."
 ac_sq.601.t:0 "One Name on the Board"
 ac_sq.601.d_base:0 "The assignment board showed one serviceable aircraft. Pavel Kresin called it enough for the morning's work. Vera Dolin asked him to read the note beneath the green marker: serviceable for the listed task, subject to the inspection already due. Nadia Orlov had arrived expecting to discuss flying and instead found herself listening to an argument about handwriting. Milan Sarek came in with two requests that each assumed the same machine would be available at the same time. Pavel proposed starting early and making the timetable work afterward. Vera moved the marker into Nadia's hand. 'Your name goes beside it,' she said. 'You should know which version you are offering.' Through the open hangar door Nadia could hear railway wagons moving, each unglamorous coupling followed by a pause somebody had allowed for."
 ac_sq.601.a:0 "Keep the limitation beside my name."
 ac_sq.601.a.reply:0 "Milan separates the requests. Pavel accepts the note but dislikes hearing his first offer treated as something Nadia must qualify."
 ac_sq.601.b:0 "Back Pavel's offer to make both work."
 ac_sq.601.b.reply:0 "Pavel is pleased to be trusted, while Vera asks which waiting person will hear about the overlap first."
 ac_sq.602.t:0 "The Tool From Next Door"
 ac_sq.602.d_base:0 "A railway workshop lent Vera a tool she had been waiting weeks to obtain through ordinary channels. Pavel carried it back as though he had personally solved the shortage. Its owner had asked only that the flight return it by the next morning, clean and with its missing latch still missing. Nadia found Milan drafting a thank-you note before anybody had checked whether they could keep that promise. Vera said the donor needed the tool for his own work, an observation that Pavel heard as ingratitude. The workshop's generosity had briefly made their own problem easier to bear. It had not made the other person's problem disappear. Nadia looked at the battered case, the careful wrapping around its handle and the time already penciled beside two separate tasks."
 ac_sq.602.a:0 "Plan the return before using the favor."
 ac_sq.602.a.reply:0 "Vera chooses one task. Pavel returns from arranging another job to find his enthusiasm has committed the crew to something it will decline."
 ac_sq.602.b:0 "Use the opportunity for everything we can."
 ac_sq.602.b.reply:0 "Pavel works enthusiastically, and Milan begins rehearsing how to ask the donor for another day."
 ac_sq.603.t:0 "The Song Nobody Finished"
 ac_sq.603.d_base:0 "The canteen radio failed halfway through a song Pavel knew every word of. He continued singing until he realized the others had stopped to listen. Nadia suggested that knowing the tune might be easier than knowing all the words he was replacing. Milan claimed he had never heard a better account of a broken heater. Even Vera laughed. For a few minutes the four sounded like people who had met somewhere other than a waiting room for spare parts. Then Pavel asked what Nadia would be doing if she had not joined the flight. She began a serious answer and found herself making it smaller, safer, something nobody could mistake for regret. Vera reached behind the radio and left it switched off. There was room for another person's voice without a machine filling the silence."
 ac_sq.603.a:0 "Tell them the answer I nearly gave."
 ac_sq.603.a.reply:0 "Nadia describes a private ambition, and Pavel listens without trying to turn it into a joke."
 ac_sq.603.b:0 "Keep the conversation light."
 ac_sq.603.b.reply:0 "Pavel starts the song again; Nadia laughs with the others and leaves her first answer unsaid."
 ac_sq.604.t:0 "An Address Written Twice"
 ac_sq.604.d_base:0 "Milan's letter to his brother came back with the address crossed out. He copied the same address onto a fresh envelope before admitting to Nadia that he had no newer one. His brother had moved for work, and their last telephone conversation had ended in a disagreement too ordinary to justify the long silence that followed. Pavel offered to ask around the transport clerks. Vera asked whether Milan wanted the flight's working contacts involved in a private search. Milan said it would be only one question. Nadia knew how many small favors could hide inside those words. She also knew that saying no would leave him alone with a returned envelope he was already trying to turn into a clerical error instead of an unfinished conversation."
 ac_sq.604.a:0 "Help him ask through willing personal contacts."
 ac_sq.604.a.reply:0 "Milan writes down what he actually knows, giving the first person he calls permission not to know the rest."
 ac_sq.604.b:0 "Let Pavel use the working network quietly."
 ac_sq.604.b.reply:0 "Milan is grateful for the familiar network looking on his behalf, while Vera asks whose working request will wait behind the favor."
 ac_sq.605.t:0 "The Signature Below Vera's"
 ac_sq.605.d_base_callback:0 "The youngest maintainer was ready to sign an inspection under supervision. He had found a discrepancy Vera expected him to find and another she had missed. Pavel treated the second discovery as a triumph until he saw the apprentice's face. The young man did not want to embarrass the person teaching him. Vera pushed the sheet across the bench and asked him to describe the fault in his own words. Nadia could make the moment easier by praising the whole crew without dwelling on whose inspection had missed what. She could also let the apprentice hear an experienced pilot thank him specifically for disagreeing with an experienced maintainer. Milan waited by the door with a request whose timing had already become inconvenient. For once, nobody asked him to make the inconvenient part disappear.\n\nThe apprentice's wording distinguishes the planned task from broader serviceability. Nadia recognizes the old note that Vera once made her read aloud."
 ac_sq.605.d_base:0 "The youngest maintainer was ready to sign an inspection under supervision. He had found a discrepancy Vera expected him to find and another she had missed. Pavel treated the second discovery as a triumph until he saw the apprentice's face. The young man did not want to embarrass the person teaching him. Vera pushed the sheet across the bench and asked him to describe the fault in his own words. Nadia could make the moment easier by praising the whole crew without dwelling on whose inspection had missed what. She could also let the apprentice hear an experienced pilot thank him specifically for disagreeing with an experienced maintainer. Milan waited by the door with a request whose timing had already become inconvenient. For once, nobody asked him to make the inconvenient part disappear."
 ac_sq.605.a:0 "Thank him for the fault he found."
 ac_sq.605.a.reply:0 "Vera signs below the discovery. Pavel asks Nadia afterward whether the public thanks needed to make her missed fault quite so visible."
 ac_sq.605.b:0 "Praise the crew's work together."
 ac_sq.605.b.reply:0 "Everyone leaves with their dignity intact, though the apprentice is still unsure which disagreement was welcome."
 ac_sq.606.t:0 "The Generator in the Photograph"
 ac_sq.606.d_base:0 "The shelter-preparation photograph showed a generator beside a clean stack of blankets. Vera asked whether anyone had photographed the exhaust arrangement too. Milan said the visitors had already gone. The civilian volunteers were using the picture to explain preparations to families, and nobody wanted to tell them that the useful-looking machine still required a different working position. Pavel offered to move it himself before the next visit. Nadia could see why Vera looked tired: another quiet repair would protect everyone from an awkward explanation while leaving the confident photograph in circulation. A volunteer returned for a forgotten coat and asked whether she could have a copy for her neighborhood. Vera looked at Nadia instead of answering. The photograph was already becoming a promise neither pilot had intended to make."
 ac_sq.606.a:0 "Explain the correction before copying the picture."
 ac_sq.606.a.reply:0 "The volunteer understands the correction. Milan wishes Nadia had let the team finish its repair before exposing their unfinished preparation."
 ac_sq.606.b:0 "Fix the position quietly before anyone returns."
 ac_sq.606.b.reply:0 "Pavel makes the arrangement safer, while the old photograph continues teaching its own incomplete lesson."
 ac_sq.607.t:0 "The Man Who Knew the Approach"
 ac_sq.607.d_base:0 "At an emergency-route exercise, the railway foreman knew the bridge approach by the sound the wagons made over it. The printed plan knew only its width. Milan wanted a clear answer about whether a waiting vehicle could turn there. The foreman said it depended on the wagon standing at the siding and the driver sent to guide it. Pavel disliked depending on somebody's memory. Vera disliked pretending a measurement could replace it. Nadia watched the foreman search for a name on the exercise sheet and fail to find his own. He was willing to help. He was less willing to be blamed later for instructions somebody else had simplified after he left. Milan offered him a pencil, then asked Nadia whether an informal note was enough."
 ac_sq.607.a:0 "Record his conditions under his own words."
 ac_sq.607.a.reply:0 "Milan preserves the conditions. Pavel helps revise the exercise, frustrated that another apparently clear task now needs somebody outside the crew."
 ac_sq.607.b:0 "Turn his experience into a simpler instruction."
 ac_sq.607.b.reply:0 "The exercise team gains a quick rule, while the foreman asks who will be there to explain its exceptions."
 ac_sq.608.t:0 "The Handrail Pavel Missed"
 ac_sq.608.d_base:0 "Pavel injured his shoulder carrying equipment down a wet stair. He blamed the awkward case, the slippery step and finally himself for letting anyone see the fall. The medical advice was rest from the duties that hurt it. By evening he was demonstrating how many other things he could do one-handed. Vera told him to stop volunteering long enough for somebody to ask what help he needed. Milan had already removed his name from a practice assignment and dreaded telling him. Nadia found Pavel in the canteen trying to open a jar against his knee. She could rescue him from that small humiliation without mentioning the larger one. Or she could sit with him until he admitted that being useful did not require making an injury invisible."
 ac_sq.608.a:0 "Ask what hurts before discussing duties."
 ac_sq.608.a.reply:0 "Pavel lets Nadia open the jar and admits which movement he has been pretending not to avoid."
 ac_sq.608.b:0 "Find him useful work immediately."
 ac_sq.608.b.reply:0 "Pavel brightens at being useful again, grateful Nadia can see more than his injury; Vera keeps an eye on his guarded shoulder."
 ac_sq.609.t:0 "A Case With No Handle"
 ac_sq.609.d_base_callback:0 "The portable set arrived in a case whose handle had broken years before. Milan marked it complete because every listed component was inside. Vera asked him to carry it to the exercise truck without using both arms. The argument began as a joke and became serious when nobody could find a safe way to secure it beside the other equipment. Pavel, still careful with his recovering shoulder, watched everyone avoid asking him to help. Nadia noticed a volunteer quietly unpacking her own blanket so it could be used as padding. The case would travel if enough people supplied favors the inventory did not record. Milan had a truck waiting and an increasingly official-looking receipt. Vera held out a strip of cloth to make a temporary grip, asking whether temporary would be written anywhere a stranger could see it.\n\nNadia remembers the railway workshop's battered tool case. Its owner had named the missing latch instead of leaving the borrower to discover it."
 ac_sq.609.d_base:0 "The portable set arrived in a case whose handle had broken years before. Milan marked it complete because every listed component was inside. Vera asked him to carry it to the exercise truck without using both arms. The argument began as a joke and became serious when nobody could find a safe way to secure it beside the other equipment. Pavel, still careful with his recovering shoulder, watched everyone avoid asking him to help. Nadia noticed a volunteer quietly unpacking her own blanket so it could be used as padding. The case would travel if enough people supplied favors the inventory did not record. Milan had a truck waiting and an increasingly official-looking receipt. Vera held out a strip of cloth to make a temporary grip, asking whether temporary would be written anywhere a stranger could see it."
 ac_sq.609.a:0 "Mark the carrying defect on the receipt."
 ac_sq.609.a.reply:0 "Milan qualifies his completed receipt, then asks why the crew could not have fixed a simple carrying problem without reopening the whole account."
 ac_sq.609.b:0 "Make the temporary grip and avoid delay."
 ac_sq.609.b.reply:0 "The truck can leave, but Vera photographs the improvised grip before the clean receipt disappears into Milan's folder."
 ac_sq.610.t:0 "The Person at the Gate"
 ac_sq.610.d_base:0 "A driver brought a civilian request to the access gate after the person authorized to receive it had left. Milan knew the driver from earlier exercises and wanted to accept the papers for convenience. Vera asked whether accepting them would be mistaken for approving the work. The driver was too tired to conceal how much he wanted either answer to be yes. Pavel suggested taking the request inside and sorting the distinction later. Nadia stood beside a gate whose practical purpose suddenly seemed to be making one weary person repeat his story. She could make an exception for someone the flight knew. She could also stay long enough to find an answer that would remain usable when the next unfamiliar driver arrived without the advantage of recognition."
 ac_sq.610.a:0 "Find a receiving person and stay for the call."
 ac_sq.610.a.reply:0 "The driver repeats the request only once more, this time to somebody who can say what accepting it means."
 ac_sq.610.b:0 "Accept the papers as a personal favor."
 ac_sq.610.b.reply:0 "Milan gives the driver a grateful smile and inherits a promise he must explain when the proper desk returns."
 ac_sq.611.t:0 "An Inspection With Two Chairs"
 ac_sq.611.d_aid_accord_callback:0 "Milan arranged an inspection of a proposed civilian consignment and set out a single chair on the receiving side of the table. The representative brought a second person, a technician who wanted to test the equipment before anybody signed. Pavel thought the extra examination implied mistrust of Vera's work. Vera fetched another chair. Nadia watched the technician unwrap a connection, compare it with her own notes and ask a question that had not appeared on Milan's form. The question might delay the proposed handover. It might also be the first useful thing anyone had asked about how the equipment would actually be used. Approval beyond this table remained someone else's decision. The respect shown across it did not. Milan looked at the additional chair as though he should have thought of it before.\n\nThe accepted regional accord had supplied a receiving procedure, not an aircraft full of guaranteed supplies. Milan asked Vera to list compatible items before the next enquiry. Pavel offered to collect the list himself, then waited while Nadia found another person to share the task. The existence of assistance did not relieve them of knowing what they could actually receive and maintain.\n\nVera gives the visiting technician the same patient attention she once gave the young maintainer who found her missed fault. Pavel recognizes the deliberate choice."
