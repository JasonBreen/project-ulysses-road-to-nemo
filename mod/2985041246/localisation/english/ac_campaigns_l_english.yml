 ac_camp.103.t:0 "The second request"
 ac_camp.103.desc:0 "The officer asks for confirmation a second time. Across the desk, his superior closes the folder without answering. There are procedures for a damaged message, procedures for a delayed message, and considerably fewer procedures for the possibility that an intact message should not have been sent. Civilian scrutiny makes the dispute visible. Professional safeguards entrust a smaller circle with keeping an independent copy. Either course costs influence that might otherwise have purchased another convenient assurance from command."
 ac_camp.103.a:0 "Circulate a public receiving account."
 ac_camp.103.b:0 "Keep a signed professional return."
 ac_camp.103.z:0 "Close this old message."
