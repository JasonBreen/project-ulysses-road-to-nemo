 OSE_snc_emergency_review_protocol:0 "Review the Present Exception"
 OSE_snc_emergency_review_protocol_desc:0 "Open a fresh review through the corresponding crisis-authority service. The government is asking about the exception operating now, so a previous completed period cannot certify it. The chosen lane must finish its funded work after the request. During war that work may be reduced domestic continuity; its return must say so. The receiving secretary will retain the current authority, the reason for renewal and the services that bear its burden. If the review is interrupted, the next request begins from the present date instead of treating a cancelled account as an answer."
 OSE_snc_emergency_review_protocol_requirements_tt:0 "From 2010.1.1, an active national administration and the required earlier work are available. The selected policy remains exclusive; conclusions remain available when their real prerequisites finish after the expected calendar."
