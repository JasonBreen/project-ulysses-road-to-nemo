 ac_camp.15.t:0 "The column left empty"
 ac_camp.15.desc:0 "The deadline passed during an ordinary afternoon. There was no announcement. The porter heard the nurse turn a page in the stockbook and knew, from the care with which she did it, that she had stopped expecting the truck.\n\nThe administrator went to the depot office again. The clerk found his reference number in a folder whose label had changed since the previous visit. The request was complete. The permissions, where they existed, had been copied. What nobody could presently supply was a journey that satisfied all the conditions at once.\n\nHe came back with the original papers because leaving them there had begun to feel like abandoning the people whose names were on them. The pharmacist asked whether she should keep a copy. He said yes. They both understood that keeping a copy could not fill a prescription. They did it anyway, because one day somebody might ask why the receiving column had remained empty.\n\nBy the window, the woman put her sewing away. She asked whether the clinic would open the following morning. The nurse answered before the administrator could begin explaining the arrangement.\n\n\"At the usual time.\"\n\nAfter the patients left, the porter moved the stool back beneath the window. He had started doing it every evening. The room would look prepared when the first person arrived, and preparedness was one small thing the people working there still had the power to provide.\n\nThe stockbook remained on the desk. Its blank column would survive the afternoon in which the promise had expired."
 ac_camp.15.a:0 "Keep this account."
 ac_camp.15.z:0 "Close this old message."
