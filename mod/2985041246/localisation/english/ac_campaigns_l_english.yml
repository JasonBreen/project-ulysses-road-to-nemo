 ac_camp.2.t:0 "An exception in triplicate"
 ac_camp.2.desc:0 "The request arrived with the wrong kind of stamp. The duty officer noticed that first because it was the one problem he could solve without telephoning anyone. He sent an orderly for the proper form. The municipal administrator remained standing, holding his hat low enough to hide the dust on it.\n\nThere was a clinic on the officer's district map. A small cross, carefully placed so that it did not touch the line marking a restricted road. He had assumed the cross represented a working institution. Most things on the map represented working institutions until somebody came through the door to explain otherwise.\n\n\"What is in the vehicle?\"\n\n\"Medicines. Dressings. Whatever the depot can release.\"\n\n\"And who will accompany it?\"\n\nThe administrator named a nurse and then stopped. The officer waited. A second name would make the request more complete. It might also make it impossible for the person named to walk home without explaining why his papers had suddenly become interesting.\n\nThe telephone rang on the next desk. Somebody was demanding another transport return for headquarters. The officer could authorize a limited passage, subject to inspection, and spend the afternoon explaining the exception to people who would never see the clinic. Or he could retain the existing restrictions and tell the administrator to submit a correct request through the proper office.\n\nThe orderly returned with three blank copies. He placed them between the men and asked which name should go on the receipt."
 ac_camp.2.a:0 "Authorize inspected medical passage."
 ac_camp.2.b:0 "Maintain the existing restriction."
 ac_camp.2.z:0 "Close this old message."
