 ac_snp.51.a_effect_tt:0 "Retain the completed national service record and its prior choices. This acknowledgement authorizes no additional funded period."
 YUK_snp_distribution_review_policy_context_1:0 "The standing policy is standing civil inspection docket. Its continuing opportunity cost remains in the national schedule."
 YUK_snp_distribution_review_policy_context_2:0 "The standing policy is protected command receiving priorities. Its continuing opportunity cost remains in the national schedule."
 ac_snp.22.t:0 "The Receipt That Does Not Close the Case"
 ac_snp.22.d:0 "A receiving clerk has marked a case complete because the docket contains a receipt. The civil inspector points to a later correction showing that the receiving office had asked for different work. The command liaison says that the original reservation was fulfilled as authorized. Nobody disputes the signatures. They disagree about which question the receipt answers. A standing civil inspection route would give the receiving office more authority to reopen the case. A protected command-priority route would keep responsibility concentrated while requiring the correction to remain attached to the original allocation. The committee must choose how a valid record can still be challenged when it does not explain the service people expected to receive.\n\n[YUK_snp_distribution_review_policy_context]\n[ac_snp_yuk_intervention_context]\n[ac_snp_yuk_command_context]"
 ac_snp.22.a:0 "Let civil receiving offices reopen the discrepancy."
 ac_snp.22.a_effect_tt:0 "Move up to five existing allocation points toward civil receiving offices, protecting active reservations. The two shares still total one hundred."
 ac_snp.22.b:0 "Keep command responsibility and attach the unresolved correction."
 ac_snp.22.b_effect_tt:0 "Move up to five existing allocation points toward command support, protecting active reservations. The two shares still total one hundred."
