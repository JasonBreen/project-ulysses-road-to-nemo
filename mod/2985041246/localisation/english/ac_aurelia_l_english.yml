 AUR_au_services_service_1_spirit:0 "Fund a Service Audit"
 AUR_au_services_service_1_spirit_desc:0 "The federal audit office maintains this funded service for ninety days. Audit federal and provincial services against the register. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 AUR_au_services_service_1:0 "Fund a Service Audit"
 AUR_au_services_service_1_desc:0 "Audit federal and provincial services against the register.\n\nThe federal audit office must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
