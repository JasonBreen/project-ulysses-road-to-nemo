 FCU_fe_security_service_1_spirit_desc:0 "The federal police liaison office maintains this funded service for ninety days. Place investigators with Erusean police for a defined period under Erusean supervision. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 FCU_fe_security_service_1:0 "Second Police Investigators"
 FCU_fe_security_service_1_desc:0 "Place investigators with Erusean police for a defined period under Erusean supervision.\n\nThe federal police liaison office must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 FCU_fe_security_service_2_spirit:0 "Hold a Response Detachment Ready"
 FCU_fe_security_service_2_spirit_desc:0 "The federal defence staff maintains this funded service for ninety days. Keep a small detachment on notice for requests from the provisional government. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 FCU_fe_security_service_2:0 "Hold a Response Detachment Ready"
 FCU_fe_security_service_2_desc:0 "Keep a small detachment on notice for requests from the provisional government.\n\nThe federal defence staff must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 FCU_fe_partners_service_1_spirit:0 "Reconcile the Partner Accounts"
 FCU_fe_partners_service_1_spirit_desc:0 "The treaty secretariat accounts office maintains this funded service for ninety days. Match each partner's pledged contribution with the contribution actually received. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 FCU_fe_partners_service_1:0 "Reconcile the Partner Accounts"
 FCU_fe_partners_service_1_desc:0 "Match each partner's pledged contribution with the contribution actually received.\n\nThe treaty secretariat accounts office must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 FCU_fe_partners_service_2_spirit:0 "Run a Shared Logistics Period"
 FCU_fe_partners_service_2_spirit_desc:0 "The coalition logistics office maintains this funded service for ninety days. Operate common transport and supply services with costs recorded by contributor. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 FCU_fe_partners_service_2:0 "Run a Shared Logistics Period"
 FCU_fe_partners_service_2_desc:0 "Operate common transport and supply services with costs recorded by contributor.\n\nThe coalition logistics office must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 FCU_fe_drawdown_service_1_spirit:0 "Release a Deployment"
 FCU_fe_drawdown_service_1_spirit_desc:0 "The federal defence staff maintains this funded service for ninety days. Return a scheduled deployment to home bases with its duties handed over. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 FCU_fe_drawdown_service_1:0 "Release a Deployment"
 FCU_fe_drawdown_service_1_desc:0 "Return a scheduled deployment to home bases with its duties handed over.\n\nThe federal defence staff must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 FCU_fe_drawdown_service_2_spirit:0 "Exercise the Reserve"
 FCU_fe_drawdown_service_2_spirit_desc:0 "The coalition reserve command maintains this funded service for ninety days. Exercise the retained reserve without adding new units. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 FCU_fe_drawdown_service_2:0 "Exercise the Reserve"
 FCU_fe_drawdown_service_2_desc:0 "Exercise the retained reserve without adding new units.\n\nThe coalition reserve command must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 ERU_fe_oversight_policy_a_spirit:0 "Civil ministries first"
 ERU_fe_oversight_policy_a_spirit_desc:0 "Civil ministries will regain routine authority first: schools, utilities, courts and local registries. Supervisors keep their inspection rights, but ordinary services stop waiting for a foreign signature. The cost is a slower answer whenever security matters cross a civil desk."
 ERU_fe_oversight_policy_a_spirit_settled:0 "Civil ministries first: Standing Settlement"
 ERU_fe_oversight_policy_a_spirit_settled_desc:0 "The settlement does not end oversight by declaration. It sets out how each remaining duty returns to Erusean authority and what evidence that requires. The government keeps its chosen priority and accepts that the partners will read the same record. The continuing opportunity cost remains."
 ERU_fe_oversight_policy_b_spirit:0 "Supervised security directorate"
 ERU_fe_oversight_policy_b_spirit_desc:0 "A supervised security directorate will concentrate police, border and reserve matters in one accountable office. It gives the oversight partners a single counterpart and the government a coherent plan, at a continuing political price for placing so much authority in one place."
 ERU_fe_oversight_policy_b_spirit_settled:0 "Supervised security directorate: Standing Settlement"
 ERU_fe_oversight_policy_b_spirit_settled_desc:0 "The settlement does not end oversight by declaration. It sets out how each remaining duty returns to Erusean authority and what evidence that requires. The government keeps its chosen priority and accepts that the partners will read the same record. The continuing opportunity cost remains."
 ERU_fe_oversight_register:0 "Inventory the Oversight Instruments"
 ERU_fe_oversight_register_desc:0 "The provisional government works under instruments it did not draft and cannot yet amend. Before arguing about their limits, the ministries will list every approval, inspection and reporting duty the oversight arrangement actually requires, and the office that carries each one."
 ERU_fe_oversight_policy_a:0 "Civil Ministries First"
 ERU_fe_oversight_policy_a_desc:0 "Civil ministries will regain routine authority first: schools, utilities, courts and local registries. Supervisors keep their inspection rights, but ordinary services stop waiting for a foreign signature. The cost is a slower answer whenever security matters cross a civil desk."
 ERU_fe_oversight_policy_b:0 "A Supervised Security Directorate"
 ERU_fe_oversight_policy_b_desc:0 "A supervised security directorate will concentrate police, border and reserve matters in one accountable office. It gives the oversight partners a single counterpart and the government a coherent plan, at a continuing political price for placing so much authority in one place."
 ERU_fe_oversight_operations:0 "Return Signatures to Erusean Offices"
 ERU_fe_oversight_operations_desc:0 "Each transferred duty needs an Erusean office that can sign, refuse and answer for it. The ministries will train receiving staff before asking that a supervisor's countersignature be withdrawn, so that the handover does not leave an empty desk."
 ERU_fe_oversight_review:0 "Review a Supervised Service Period"
 ERU_fe_oversight_review_desc:0 "A funded service period under the chosen arrangement must be examined before its procedures become permanent. The review compares the promises in the instruments with the work Erusean offices delivered, and names the duties still waiting for a receiving office."
 ERU_fe_oversight_settlement:0 "An Oversight with an End Date"
 ERU_fe_oversight_settlement_desc:0 "The settlement does not end oversight by declaration. It sets out how each remaining duty returns to Erusean authority and what evidence that requires. The government keeps its chosen priority and accepts that the partners will read the same record."
 ERU_fe_insurrection_policy_a_spirit:0 "District hearings"
 ERU_fe_insurrection_policy_a_spirit_desc:0 "District hearings will give residents a lawful place to raise grievances about the settlement and the oversight. Listening concedes nothing to the insurrection's methods. It does consume political attention and slows the security measures the partners expect."
 ERU_fe_insurrection_policy_a_spirit_settled:0 "District hearings: Standing Settlement"
 ERU_fe_insurrection_policy_a_spirit_settled_desc:0 "The settlement keeps the chosen response as a standing policy with published limits. It declares no victory of its own. It gives the districts a predictable government and leaves a record that later administrations can test. The continuing opportunity cost remains."
 ERU_fe_insurrection_policy_b_spirit:0 "Security cordons"
 ERU_fe_insurrection_policy_b_spirit_desc:0 "Security cordons will protect the public offices, depots and roads the government depends on. They leave armed groups less room to act, at a continuing civilian cost and with the risk that residents meet the state only at checkpoints."
 ERU_fe_insurrection_policy_b_spirit_settled:0 "Security cordons: Standing Settlement"
 ERU_fe_insurrection_policy_b_spirit_settled_desc:0 "The settlement keeps the chosen response as a standing policy with published limits. It declares no victory of its own. It gives the districts a predictable government and leaves a record that later administrations can test. The continuing opportunity cost remains."
 ERU_fe_insurrection_register:0 "Answer Free Erusea"
 ERU_fe_insurrection_register_desc:0 "Free Erusea's armed insurrection made the provisional government's authority a daily question, whether it was put down in days or is still being fought. The cabinet will record where public services stopped, which offices were threatened and which complaints the insurrection used, before choosing how to answer them."
 ERU_fe_insurrection_policy_a:0 "Hearings in the Districts"
 ERU_fe_insurrection_policy_a_desc:0 "District hearings will give residents a lawful place to raise grievances about the settlement and the oversight. Listening concedes nothing to the insurrection's methods. It does consume political attention and slows the security measures the partners expect."
 ERU_fe_insurrection_policy_b:0 "Security Cordons"
 ERU_fe_insurrection_policy_b_desc:0 "Security cordons will protect the public offices, depots and roads the government depends on. They leave armed groups less room to act, at a continuing civilian cost and with the risk that residents meet the state only at checkpoints."
 ERU_fe_insurrection_operations:0 "Separate Policing from Reprisal"
 ERU_fe_insurrection_operations_desc:0 "Every arrest, search and closure will be recorded with the office responsible for it. A response that punishes neighbours for an act it cannot solve would recruit for the next insurrection; written limits are part of the security policy, not a concession."
 ERU_fe_insurrection_review:0 "Review a Completed Response Period"
 ERU_fe_insurrection_review_desc:0 "The cabinet will examine one completed, funded response period rather than claim success from quiet weeks. The review asks whether services resumed, whether complaints were answered and whether the chosen policy reduced the pressure on ordinary administration."
 ERU_fe_insurrection_settlement:0 "A Response the Districts Can Trust"
 ERU_fe_insurrection_settlement_desc:0 "The settlement keeps the chosen response as a standing policy with published limits. It declares no victory of its own. It gives the districts a predictable government and leaves a record that later administrations can test."
 ERU_fe_return_policy_a_spirit:0 "District return registers"
 ERU_fe_return_policy_a_spirit_desc:0 "District offices will keep their own return registers and decide the order in which households move. Local knowledge avoids sending families to houses that no longer exist, at the cost of uneven progress and constant negotiation with the capital."
 ERU_fe_return_policy_a_spirit_settled:0 "District return registers: Standing Settlement"
 ERU_fe_return_policy_a_spirit_settled_desc:0 "The settlement turns resettlement into an ordinary service with a register, inspectors and an appeal route. Later governments inherit families who are home and a record of those who are still waiting. The continuing opportunity cost remains."
 ERU_fe_return_policy_b_spirit:0 "Central resettlement schedule"
 ERU_fe_return_policy_b_spirit_desc:0 "A central schedule will move households according to national priorities for housing, work and transport. It is faster where the capital's figures are right, and politically costly wherever a district learns it must wait."
 ERU_fe_return_policy_b_spirit_settled:0 "Central resettlement schedule: Standing Settlement"
 ERU_fe_return_policy_b_spirit_settled_desc:0 "The settlement turns resettlement into an ordinary service with a register, inspectors and an appeal route. Later governments inherit families who are home and a record of those who are still waiting. The continuing opportunity cost remains."
 ERU_fe_return_register:0 "Bring the Displaced Home"
 ERU_fe_return_register_desc:0 "Years of refugee closures, emergency measures and reconstruction have left families recorded in camps, temporary housing and the wrong districts. The ministries will reconcile those registers before promising anyone a date to go home."
 ERU_fe_return_policy_a:0 "District Return Registers"
 ERU_fe_return_policy_a_desc:0 "District offices will keep their own return registers and decide the order in which households move. Local knowledge avoids sending families to houses that no longer exist, at the cost of uneven progress and constant negotiation with the capital."
 ERU_fe_return_policy_b:0 "A Central Resettlement Schedule"
 ERU_fe_return_policy_b_desc:0 "A central schedule will move households according to national priorities for housing, work and transport. It is faster where the capital's figures are right, and politically costly wherever a district learns it must wait."
 ERU_fe_return_operations:0 "Housing Before Promises"
 ERU_fe_return_operations_desc:0 "A return is only complete when there is a roof, water and a school place. Housing inspectors will certify each destination before a household is told to travel, even when that delays the published figures."
 ERU_fe_return_review:0 "Review the Returns Actually Made"
 ERU_fe_return_review_desc:0 "The review counts households that stayed, not tickets issued. A funded period of returns must be complete before its procedures become national practice, and interrupted or unpaid periods leave the outstanding cases visible."
 ERU_fe_return_settlement:0 "A Return That Lasts"
 ERU_fe_return_settlement_desc:0 "The settlement turns resettlement into an ordinary service with a register, inspectors and an appeal route. Later governments inherit families who are home and a record of those who are still waiting."
 ERU_fe_victor_policy_a_spirit:0 "Local civil authority"
 ERU_fe_victor_policy_a_spirit_desc:0 "Local offices will resume civil administration wherever order allows, and Erusean commanders will answer to them on ordinary matters. The policy lowers the daily friction of occupation, but the army loses some freedom to act quickly."
 ERU_fe_victor_policy_a_spirit_settled:0 "Local civil authority: Standing Settlement"
 ERU_fe_victor_policy_a_spirit_settled_desc:0 "The settlement fixes the terms on which Erusea keeps or reduces its presence. It makes no new territorial claim. It gives the government a sustainable posture and an honest account of what victory now costs each year. The continuing opportunity cost remains."
 ERU_fe_victor_policy_b_spirit:0 "Standing garrison line"
 ERU_fe_victor_policy_b_spirit_desc:0 "The garrison line will stay in place until the government is satisfied that no district will turn against it. Holding the line keeps commanders confident and the cabinet's options open, while soldiers and money stay away from home."
 ERU_fe_victor_policy_b_spirit_settled:0 "Standing garrison line: Standing Settlement"
 ERU_fe_victor_policy_b_spirit_settled_desc:0 "The settlement fixes the terms on which Erusea keeps or reduces its presence. It makes no new territorial claim. It gives the government a sustainable posture and an honest account of what victory now costs each year. The continuing opportunity cost remains."
 ERU_fe_victor_register:0 "Count the Cost of Victory"
 ERU_fe_victor_register_desc:0 "Victory left Erusea responsible for more than it can comfortably govern. The cabinet will list every district, depot and garrison its forces still hold, with the cost of each, before deciding which obligations the republic can sustain."
 ERU_fe_victor_policy_a:0 "Return Authority to Local Offices"
 ERU_fe_victor_policy_a_desc:0 "Local offices will resume civil administration wherever order allows, and Erusean commanders will answer to them on ordinary matters. The policy lowers the daily friction of occupation, but the army loses some freedom to act quickly."
 ERU_fe_victor_policy_b:0 "Hold the Garrison Line"
 ERU_fe_victor_policy_b_desc:0 "The garrison line will stay in place until the government is satisfied that no district will turn against it. Holding the line keeps commanders confident and the cabinet's options open, while soldiers and money stay away from home."
 ERU_fe_victor_operations:0 "Bring the Reserves Home"
 ERU_fe_victor_operations_desc:0 "Reservists called up for the war will be released in an order the economy can absorb. Each unit will hand over its duties to a receiving office before it leaves, so that withdrawal does not create a vacuum."
 ERU_fe_victor_review:0 "Review the Garrison Accounts"
 ERU_fe_victor_review_desc:0 "A completed, funded garrison or demobilisation period must be examined before the policy becomes permanent. The review compares the garrison's cost with the order it actually maintained and the services that resumed."
 ERU_fe_victor_settlement:0 "A Peace That Does Not Need a Garrison"
 ERU_fe_victor_settlement_desc:0 "The settlement fixes the terms on which Erusea keeps or reduces its presence. It makes no new territorial claim. It gives the government a sustainable posture and an honest account of what victory now costs each year."
 ERU_fe_armistice_policy_a_spirit:0 "Joint line commission"
 ERU_fe_armistice_policy_a_spirit_desc:0 "A joint commission will meet the other side's officers on a fixed schedule to resolve incidents before they grow. The commission costs political capital at home, where critics call every meeting a concession."
 ERU_fe_armistice_policy_a_spirit_settled:0 "Joint line commission: Standing Settlement"
 ERU_fe_armistice_policy_a_spirit_settled_desc:0 "The settlement makes the armistice an institution rather than a pause. It keeps the chosen posture, the reporting channel and the costs that come with them. It does not turn the line into a border. The continuing opportunity cost remains."
 ERU_fe_armistice_policy_b_spirit:0 "Fortified line posture"
 ERU_fe_armistice_policy_b_spirit_desc:0 "The line will be fortified and patrolled so that nobody doubts Erusea's ability to hold it. Deterrence is credible and expensive, and every new position gives the other side a reason to build one of its own."
 ERU_fe_armistice_policy_b_spirit_settled:0 "Fortified line posture: Standing Settlement"
 ERU_fe_armistice_policy_b_spirit_settled_desc:0 "The settlement makes the armistice an institution rather than a pause. It keeps the chosen posture, the reporting channel and the costs that come with them. It does not turn the line into a border. The continuing opportunity cost remains."
 ERU_fe_armistice_register:0 "Keep the Armistice Line"
 ERU_fe_armistice_register_desc:0 "The armistice stopped the fighting without settling the questions that started it. The government will map every crossing, observation post and disputed field along the line, and the office answerable for incidents at each."
 ERU_fe_armistice_policy_a:0 "A Joint Line Commission"
 ERU_fe_armistice_policy_a_desc:0 "A joint commission will meet the other side's officers on a fixed schedule to resolve incidents before they grow. The commission costs political capital at home, where critics call every meeting a concession."
 ERU_fe_armistice_policy_b:0 "A Fortified Line Posture"
 ERU_fe_armistice_policy_b_desc:0 "The line will be fortified and patrolled so that nobody doubts Erusea's ability to hold it. Deterrence is credible and expensive, and every new position gives the other side a reason to build one of its own."
 ERU_fe_armistice_operations:0 "Answer Incidents in Writing"
 ERU_fe_armistice_operations_desc:0 "Every shot, crossing and accident on the line will be answered in writing through the agreed channel. Written answers are slower than a retaliatory patrol, and far less likely to restart a war that neither side can afford."
 ERU_fe_armistice_review:0 "Review a Quiet Season"
 ERU_fe_armistice_review_desc:0 "The review needs a funded patrol or commission period that actually finished. A quiet season proves little on its own; the record shows whether incidents were reported, answered and closed."
 ERU_fe_armistice_settlement:0 "An Armistice That Holds"
 ERU_fe_armistice_settlement_desc:0 "The settlement makes the armistice an institution rather than a pause. It keeps the chosen posture, the reporting channel and the costs that come with them. It does not turn the line into a border."
 ERU_fe_ordinary_policy_a_spirit:0 "Civil investment programme"
 ERU_fe_ordinary_policy_a_spirit_desc:0 "Money held back for a war that did not happen will go to housing, transport and schools. The investment is visible and popular, and it leaves the armed forces with less margin if relations sour again."
 ERU_fe_ordinary_policy_a_spirit_settled:0 "Civil investment programme: Standing Settlement"
 ERU_fe_ordinary_policy_a_spirit_settled_desc:0 "The settlement retires the emergency framework and keeps the chosen balance between civil investment and readiness. The republic inherits a normal budget and the obligation to defend it in public. The continuing opportunity cost remains."
 ERU_fe_ordinary_policy_b_spirit:0 "Standing readiness review"
 ERU_fe_ordinary_policy_b_spirit_desc:0 "A standing readiness review will keep the armed forces trained and equipped at a level the budget can sustain. It reassures commanders and neighbours alike, at the cost of money that civilians can see is not reaching them."
 ERU_fe_ordinary_policy_b_spirit_settled:0 "Standing readiness review: Standing Settlement"
 ERU_fe_ordinary_policy_b_spirit_settled_desc:0 "The settlement retires the emergency framework and keeps the chosen balance between civil investment and readiness. The republic inherits a normal budget and the obligation to defend it in public. The continuing opportunity cost remains."
 ERU_fe_ordinary_register:0 "Ordinary Government Again"
 ERU_fe_ordinary_register_desc:0 "The war that many expected did not come. The ministries still carry emergency rules, reserve plans and special budgets written for it. The cabinet will list which of those arrangements are still needed and which can lapse."
 ERU_fe_ordinary_policy_a:0 "A Civil Investment Programme"
 ERU_fe_ordinary_policy_a_desc:0 "Money held back for a war that did not happen will go to housing, transport and schools. The investment is visible and popular, and it leaves the armed forces with less margin if relations sour again."
 ERU_fe_ordinary_policy_b:0 "A Standing Readiness Review"
 ERU_fe_ordinary_policy_b_desc:0 "A standing readiness review will keep the armed forces trained and equipped at a level the budget can sustain. It reassures commanders and neighbours alike, at the cost of money that civilians can see is not reaching them."
 ERU_fe_ordinary_operations:0 "Spend What Was Saved"
 ERU_fe_ordinary_operations_desc:0 "Savings will be spent through ordinary appropriations with published accounts, not emergency decrees. The procedure is slower and less flexible, which is the point: peacetime government should be predictable."
 ERU_fe_ordinary_review:0 "Review the Peacetime Accounts"
 ERU_fe_ordinary_review_desc:0 "A completed, funded period under the new procedures must be reviewed before they replace the emergency rules for good. The review compares the projects promised with the work delivered."
 ERU_fe_ordinary_settlement:0 "A Republic Without an Emergency"
 ERU_fe_ordinary_settlement_desc:0 "The settlement retires the emergency framework and keeps the chosen balance between civil investment and readiness. The republic inherits a normal budget and the obligation to defend it in public."
 FCU_fe_oversight_policy_a_spirit:0 "Advisory oversight"
 FCU_fe_oversight_policy_a_spirit_desc:0 "Advisers will support Erusean ministries without signing in their place. The approach respects the provisional government and keeps Central Usean staffing modest, while accepting slower results and less direct control."
 FCU_fe_oversight_policy_a_spirit_settled:0 "Advisory oversight: Standing Settlement"
 FCU_fe_oversight_policy_a_spirit_settled_desc:0 "The settlement gives the mandate a renewal process and an end condition. Central Usea keeps its chosen posture, its costs and the duty to explain both to its partners and to Erusea. The continuing opportunity cost remains."
 FCU_fe_oversight_policy_b_spirit:0 "Supervising commission"
 FCU_fe_oversight_policy_b_spirit_desc:0 "A supervising commission will countersign key decisions and inspect their implementation. Control is firmer and partners are reassured, at a political and administrative cost that grows with every duty the commission keeps."
 FCU_fe_oversight_policy_b_spirit_settled:0 "Supervising commission: Standing Settlement"
 FCU_fe_oversight_policy_b_spirit_settled_desc:0 "The settlement gives the mandate a renewal process and an end condition. Central Usea keeps its chosen posture, its costs and the duty to explain both to its partners and to Erusea. The continuing opportunity cost remains."
 FCU_fe_oversight_register:0 "Administer the Oversight Mandate"
 FCU_fe_oversight_register_desc:0 "Central Usea has become responsible for supervising a government it fought. The treaty secretariat will list each oversight duty, the officials performing it and the cost to the federation, before the work becomes permanent by habit."
 FCU_fe_oversight_policy_a:0 "Advise, Do Not Govern"
 FCU_fe_oversight_policy_a_desc:0 "Advisers will support Erusean ministries without signing in their place. The approach respects the provisional government and keeps Central Usean staffing modest, while accepting slower results and less direct control."
 FCU_fe_oversight_policy_b:0 "A Supervising Commission"
 FCU_fe_oversight_policy_b_desc:0 "A supervising commission will countersign key decisions and inspect their implementation. Control is firmer and partners are reassured, at a political and administrative cost that grows with every duty the commission keeps."
 FCU_fe_oversight_operations:0 "Hand Back the Routine Duties"
 FCU_fe_oversight_operations_desc:0 "Routine duties will return to Erusean offices on a published schedule once receiving staff are trained. Central Usea keeps the right to inspect, not the obligation to run daily administration indefinitely."
 FCU_fe_oversight_review:0 "Review a Supervision Period"
 FCU_fe_oversight_review_desc:0 "A funded supervision period must be completed and examined before its procedures are renewed. The review asks what Central Usean staff actually did and which duties Erusean offices now perform."
 FCU_fe_oversight_settlement:0 "A Mandate That Can End"
 FCU_fe_oversight_settlement_desc:0 "The settlement gives the mandate a renewal process and an end condition. Central Usea keeps its chosen posture, its costs and the duty to explain both to its partners and to Erusea."
 FCU_fe_security_policy_a_spirit:0 "Civil police liaison"
 FCU_fe_security_policy_a_spirit_desc:0 "Central Usean police advisers and investigators will work alongside Erusean officers. The liaison strengthens civil policing without a military footprint, and it is slower to show results than the partners would like."
 FCU_fe_security_policy_a_spirit_settled:0 "Civil police liaison: Standing Settlement"
 FCU_fe_security_policy_a_spirit_settled_desc:0 "The settlement fixes the terms of continuing support: who can request it, who commands it and when it ends. It keeps the chosen posture and its costs without making Central Usea a party to an internal war. The continuing opportunity cost remains."
 FCU_fe_security_policy_b_spirit:0 "Rapid response detachments"
 FCU_fe_security_policy_b_spirit_desc:0 "Small detachments will stand ready to protect key sites at the provisional government's request. They respond quickly and are expensive to maintain, and every deployment risks being seen as a return of occupying troops."
 FCU_fe_security_policy_b_spirit_settled:0 "Rapid response detachments: Standing Settlement"
 FCU_fe_security_policy_b_spirit_settled_desc:0 "The settlement fixes the terms of continuing support: who can request it, who commands it and when it ends. It keeps the chosen posture and its costs without making Central Usea a party to an internal war. The continuing opportunity cost remains."
 FCU_fe_security_register:0 "Support the Provisional Government's Security"
 FCU_fe_security_register_desc:0 "Free Erusea's insurrection tested the arrangement Central Usea promised to support. Before sending anyone further, the federation will establish what the provisional government has asked for, what it can receive and who will command it."
 FCU_fe_security_policy_a:0 "Civil Police Liaison"
 FCU_fe_security_policy_a_desc:0 "Central Usean police advisers and investigators will work alongside Erusean officers. The liaison strengthens civil policing without a military footprint, and it is slower to show results than the partners would like."
 FCU_fe_security_policy_b:0 "Rapid Response Detachments"
 FCU_fe_security_policy_b_desc:0 "Small detachments will stand ready to protect key sites at the provisional government's request. They respond quickly and are expensive to maintain, and every deployment risks being seen as a return of occupying troops."
 FCU_fe_security_operations:0 "Keep Support Under Erusean Command"
 FCU_fe_security_operations_desc:0 "Every Central Usean team will operate under an Erusean request and an Erusean supervising officer. The rule protects the provisional government's authority and keeps the federation out of a war of its own."
 FCU_fe_security_review:0 "Review a Support Period"
 FCU_fe_security_review_desc:0 "The federation will examine a completed, funded support period before renewing it. The review asks whether Erusean offices could do more on their own afterwards, not how many Central Usean personnel were deployed."
 FCU_fe_security_settlement:0 "Support Without Occupation"
 FCU_fe_security_settlement_desc:0 "The settlement fixes the terms of continuing support: who can request it, who commands it and when it ends. It keeps the chosen posture and its costs without making Central Usea a party to an internal war."
 FCU_fe_partners_policy_a_spirit:0 "Published burden formula"
 FCU_fe_partners_policy_a_spirit_desc:0 "A published formula will set each partner's share of continuing costs. Predictable shares are easier to defend in every capital, and the federation loses the flexibility to absorb a crisis quietly."
 FCU_fe_partners_policy_a_spirit_settled:0 "Published burden formula: Standing Settlement"
 FCU_fe_partners_policy_a_spirit_settled_desc:0 "The settlement keeps the chosen arrangement and makes its costs visible to every member. It does not compel a partner's participation, change any faction or create a new treaty. The continuing opportunity cost remains."
 FCU_fe_partners_policy_b_spirit:0 "Central Usean carriage"
 FCU_fe_partners_policy_b_spirit_desc:0 "Central Usea will carry the coalition's continuing costs itself and ask partners only for what they offer. The choice keeps the coalition calm and costs the federation money and patience every year."
 FCU_fe_partners_policy_b_spirit_settled:0 "Central Usean carriage: Standing Settlement"
 FCU_fe_partners_policy_b_spirit_settled_desc:0 "The settlement keeps the chosen arrangement and makes its costs visible to every member. It does not compel a partner's participation, change any faction or create a new treaty. The continuing opportunity cost remains."
 FCU_fe_partners_register:0 "Share the Burden with Partners"
 FCU_fe_partners_register_desc:0 "The coalition's preparations and their aftermath were paid for jointly, and the bills have not stopped. The treaty secretariat will list which costs Central Usea carries, which partners expected to share and which promises were never written down."
 FCU_fe_partners_policy_a:0 "A Published Burden Formula"
 FCU_fe_partners_policy_a_desc:0 "A published formula will set each partner's share of continuing costs. Predictable shares are easier to defend in every capital, and the federation loses the flexibility to absorb a crisis quietly."
 FCU_fe_partners_policy_b:0 "Central Usean Carriage"
 FCU_fe_partners_policy_b_desc:0 "Central Usea will carry the coalition's continuing costs itself and ask partners only for what they offer. The choice keeps the coalition calm and costs the federation money and patience every year."
 FCU_fe_partners_operations:0 "Let Partners Decline Usefully"
 FCU_fe_partners_operations_desc:0 "Partners must be able to refuse a request without a crisis. Each request will name a domestic fallback, so that a refusal changes the plan rather than breaking it, and no partner's consent is assumed."
 FCU_fe_partners_review:0 "Review the Shared Accounts"
 FCU_fe_partners_review_desc:0 "The secretariat will examine a completed, funded accounting period before the formula or the carriage becomes permanent. The review compares what was promised with what each party actually paid."
 FCU_fe_partners_settlement:0 "A Coalition That Can Afford Itself"
 FCU_fe_partners_settlement_desc:0 "The settlement keeps the chosen arrangement and makes its costs visible to every member. It does not compel a partner's participation, change any faction or create a new treaty."
 FCU_fe_drawdown_policy_a_spirit:0 "Peacetime duties"
 FCU_fe_drawdown_policy_a_spirit_desc:0 "Forces will return to peacetime duties as quickly as receiving bases and civilian jobs allow. The savings are real and the federation's capacity to respond to a new crisis is reduced."
 FCU_fe_drawdown_policy_a_spirit_settled:0 "Peacetime duties: Standing Settlement"
 FCU_fe_drawdown_policy_a_spirit_settled_desc:0 "The settlement fixes the federation's peacetime posture and the costs of keeping it. It records the outcome without reopening it, and leaves later governments a defensible starting point. The continuing opportunity cost remains."
 FCU_fe_drawdown_policy_b_spirit:0 "Coalition reserve"
 FCU_fe_drawdown_policy_b_spirit_desc:0 "A smaller coalition reserve will stay ready and trained. The reserve keeps options open and reassures partners, at a cost that a federation recovering from the crisis will feel every year."
 FCU_fe_drawdown_policy_b_spirit_settled:0 "Coalition reserve: Standing Settlement"
 FCU_fe_drawdown_policy_b_spirit_settled_desc:0 "The settlement fixes the federation's peacetime posture and the costs of keeping it. It records the outcome without reopening it, and leaves later governments a defensible starting point. The continuing opportunity cost remains."
 FCU_fe_drawdown_register:0 "Stand Down the Coalition Posture"
 FCU_fe_drawdown_register_desc:0 "The crisis did not end in a coalition victory, and the posture built for it is no longer affordable in full. The federation will list every deployment, reserve and promise still in force, and what each costs."
 FCU_fe_drawdown_policy_a:0 "Return Forces to Peacetime Duties"
 FCU_fe_drawdown_policy_a_desc:0 "Forces will return to peacetime duties as quickly as receiving bases and civilian jobs allow. The savings are real and the federation's capacity to respond to a new crisis is reduced."
 FCU_fe_drawdown_policy_b:0 "Keep a Coalition Reserve"
 FCU_fe_drawdown_policy_b_desc:0 "A smaller coalition reserve will stay ready and trained. The reserve keeps options open and reassures partners, at a cost that a federation recovering from the crisis will feel every year."
 FCU_fe_drawdown_operations:0 "Account for Every Commitment"
 FCU_fe_drawdown_operations_desc:0 "Each remaining commitment will have an owner, a cost and an end condition. The federation will not keep promises alive only because nobody wrote down how to end them."
 FCU_fe_drawdown_review:0 "Review the Stand-Down"
 FCU_fe_drawdown_review_desc:0 "A completed, funded stand-down or reserve period must be examined before its procedures become the new normal. The review compares the forces released with the capacity actually retained."
 FCU_fe_drawdown_settlement:0 "A Federation After the Crisis"
 FCU_fe_drawdown_settlement_desc:0 "The settlement fixes the federation's peacetime posture and the costs of keeping it. It records the outcome without reopening it, and leaves later governments a defensible starting point."
 ac_fe_funded_cost:0 "£pol_power 35 / 4 cap"
 ac_fe_funded_cost_tt:0 "Authorization commits 35 political power and four institutional-capacity points, plus the applicable programme fee below. Spent resources are not refunded when a period is interrupted."
 ac_fe_fee_macro:0 "Programme fee: 0.002 billion abstract fiscal units."
 ac_fe_fee_legacy:0 "Programme fee: 2 provisional fiscal units."
 ac_fe_fee_none:0 "No fiscal fee currently applies. Political and institutional costs remain."
 ac_fe_eru_services:0 "Erusea: The Oversight Years"
 ac_fe_eru_services_desc:0 "Free Erusea's outbreak and its defeat by Mobius 1 are official (Chronicle 2006 / 09.26). If the insurrection is not answered, the provisional prolonged route tracks pressure: [?ac_fe_pressure|0]/100, containment below 5, crisis review above 85.\n\n[ac_fe_current_service_text]\n[ac_fe_cooldown_text]\nLatest service return: [?ac_fe_elapsed|0]/90 days. Completed periods: [?ac_fe_completed_services|0]. Last interrupted or completed period delivered [?ac_fe_last_delivered_days|0] days.\n\nInventory the Oversight Instruments: [ERU_oversight_ac_fe_policy_text]\nAnswer Free Erusea: [ERU_insurrection_ac_fe_policy_text]\nBring the Displaced Home: [ERU_return_ac_fe_policy_text]\nCount the Cost of Victory: [ERU_victor_ac_fe_policy_text]\nKeep the Armistice Line: [ERU_armistice_ac_fe_policy_text]\nOrdinary Government Again: [ERU_ordinary_ac_fe_policy_text]\n\nAuthorization commits 35 political power and four institutional-capacity points, plus the applicable programme fee below. Spent resources are not refunded when a period is interrupted.\n[ac_fe_fee_text]"
 ERU_fe_cancel_service:0 "End the Current Service Period"
 ERU_fe_cancel_service_desc:0 "Release the current rota immediately. Funding and institutional effort already spent are not refunded. Delivered time is retained in the record, but the interrupted period cannot unlock a completed-service review."
 ac_fe_fcu_services:0 "Central Usea: The Oversight Years"
 ac_fe_fcu_services_desc:0 "[ac_fe_current_service_text]\n[ac_fe_cooldown_text]\nLatest service return: [?ac_fe_elapsed|0]/90 days. Completed periods: [?ac_fe_completed_services|0]. Last interrupted or completed period delivered [?ac_fe_last_delivered_days|0] days.\n\nAdminister the Oversight Mandate: [FCU_oversight_ac_fe_policy_text]\nSupport the Provisional Government's Security: [FCU_security_ac_fe_policy_text]\nShare the Burden with Partners: [FCU_partners_ac_fe_policy_text]\nStand Down the Coalition Posture: [FCU_drawdown_ac_fe_policy_text]\n\nAuthorization commits 35 political power and four institutional-capacity points, plus the applicable programme fee below. Spent resources are not refunded when a period is interrupted.\n[ac_fe_fee_text]"
 FCU_fe_cancel_service:0 "End the Current Service Period"
 FCU_fe_cancel_service_desc:0 "Release the current rota immediately. Funding and institutional effort already spent are not refunded. Delivered time is retained in the record, but the interrupted period cannot unlock a completed-service review."
 ERU_fe_opening_public_spirit:0 "Erusea: An Open Hearing"
 ERU_fe_opening_public_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ERU_fe_opening_ministerial_spirit:0 "Erusea: A Ministerial Docket"
 ERU_fe_opening_ministerial_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ac_fe.10.t:0 "The Files on the Cabinet Table"
 ac_fe.10.d:0 "The cabinet meets with the files the last five years have left behind: emergency regulations, reserve lists, reconstruction registers and agreements that nobody in the room drafted alone. Each minister has marked the pages that touch their department. Some pages carry several marks.\n\n[ERU_fe_route_context]\n\nThe question before the cabinet is how to govern under these arrangements without letting every ordinary decision wait for an extraordinary signature, and how much of that argument to have in public."
 ac_fe.10.a:0 "Open the files to public questions."
 ac_fe.10.b:0 "Begin with a protected cabinet docket."
 FCU_fe_opening_public_spirit:0 "Central Usea: An Open Hearing"
 FCU_fe_opening_public_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 FCU_fe_opening_ministerial_spirit:0 "Central Usea: A Ministerial Docket"
 FCU_fe_opening_ministerial_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ac_fe.11.t:0 "What the Federation Promised"
 ac_fe.11.d:0 "The treaty secretariat has collected every promise the federation made during the Continental War years: to its coalition partners, to its neighbours and to its own citizens. Some promises were written into treaties. Others were made in speeches, and the secretariat has had to reconstruct them from transcripts.\n\n[FCU_fe_route_context]\n\nThe federal cabinet must decide which promises it will keep, which it will renegotiate and which it will openly let lapse, and how much of that sorting to do in front of the partners who heard them."
 ac_fe.11.a:0 "Open the promises to public questions."
 ac_fe.11.b:0 "Begin with a protected cabinet docket."
 ERU_oversight_ac_fe_policy_callback_0:0 "The standing policy is civil ministries first. Its continuing cost remains part of the allocation."
 ERU_oversight_ac_fe_policy_callback_1:0 "The standing policy is supervised security directorate. Its continuing cost remains part of the allocation."
 ERU_fe_oversight_reply_public_spirit:0 "Inventory the Oversight Instruments: Public Return"
 ERU_fe_oversight_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Train Erusean officials to take over routine approvals without a supervisor's countersignature. Public attention or reserved staff time remains committed to that work."
 ERU_fe_oversight_reply_protected_spirit:0 "Inventory the Oversight Instruments: Protected Working Return"
 ERU_fe_oversight_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Compare each surviving oversight duty with the office that now performs it. Public attention or reserved staff time remains committed to that work."
 ac_fe.20.t:0 "A Countersignature at the Bottom of the Page"
 ac_fe.20.d:0 "The circular is ordinary: a school district asks permission to repair a roof before winter. The repair has been approved by the district, costed by the ministry and funded from the provisional budget. It has waited three weeks for a countersignature from an oversight office that has no objection and no time.\n\nThe cabinet secretary lays it beside a dozen others. None is controversial; together they explain why residents have begun to say that nothing in Farbanti can be decided by Eruseans. One minister wants the list published so that the partners see the cost of their caution. Another warns that publishing it will read as an accusation, and that the oversight offices will answer by countersigning more slowly, not less.\n\n[ERU_oversight_ac_fe_policy_callback]"
 ac_fe.20.a:0 "Publish the list of countersigned duties."
 ac_fe.20.b:0 "Keep the duty list inside the cabinet office."
 ERU_oversight_ac_fe_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_oversight_ac_fe_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_oversight_ac_fe_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_fe.50.t:0 "Fewer Signatures, the Same Accountability"
 ac_fe.50.d:0 "The final review is shorter than the first inventory. Several duties have moved to Erusean offices that sign, refuse and answer for their decisions; the oversight staff now inspect a sample instead of reading every page. Others remain where they were, and the record says why.\n\nThe cabinet secretary keeps the old roof-repair circular in the file. It is not evidence that oversight was wrong. It is evidence of what a procedure costs when nobody is responsible for ending it.\n\n[ERU_oversight_ac_fe_report_callback]\n\n[ERU_oversight_ac_fe_policy_callback]"
 ac_fe.50.a:0 "File the completed service record."
 ERU_insurrection_ac_fe_policy_callback_0:0 "The standing policy is district hearings. Its continuing cost remains part of the allocation."
 ERU_insurrection_ac_fe_policy_callback_1:0 "The standing policy is security cordons. Its continuing cost remains part of the allocation."
 ERU_fe_insurrection_reply_public_spirit:0 "Answer Free Erusea: Public Return"
 ERU_fe_insurrection_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep hearing officers, clerks and a protected meeting place available in the affected districts. Public attention or reserved staff time remains committed to that work."
 ERU_fe_insurrection_reply_protected_spirit:0 "Answer Free Erusea: Protected Working Return"
 ERU_fe_insurrection_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Assign guards and inspection teams to the offices, depots and roads that keep services running. Public attention or reserved staff time remains committed to that work."
 ac_fe.21.t:0 "The Office That Stayed Open"
 ac_fe.21.d:0 "A district registry reopened on Monday after a week of closure during the fighting. By Wednesday its clerk had been warned twice to stay at home, and by Friday she had filed both warnings with the police along with the forty applications she processed in between. Her supervisor forwards the file to the cabinet with one question: what is the government prepared to do for the people who keep its offices open?\n\nThe interior ministry wants the file read aloud at the next district hearing, so that residents see who is threatened and who is not afraid. The security directorate wants it held back: names in a public record are names the insurrection can find.\n\n[ERU_insurrection_ac_fe_policy_callback]"
 ac_fe.21.a:0 "Read the file at the district hearing."
 ac_fe.21.b:0 "Protect the file and the clerk's name."
 ERU_insurrection_ac_fe_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_insurrection_ac_fe_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_insurrection_ac_fe_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_fe.51.t:0 "A Government That Is Still There"
 ac_fe.51.d:0 "The final review does not claim a victory. It counts the offices that are open, the hearings that were held, the searches that were recorded and the complaints that received an answer. Some districts are calmer; some are not. The review says which, and why the cabinet believes the difference matters.\n\nThe registry clerk's file is in the appendix. She is still at work.\n\n[ERU_insurrection_ac_fe_report_callback]\n\n[ERU_insurrection_ac_fe_policy_callback]"
 ac_fe.51.a:0 "File the completed service record."
 ERU_return_ac_fe_policy_callback_0:0 "The standing policy is district return registers. Its continuing cost remains part of the allocation."
 ERU_return_ac_fe_policy_callback_1:0 "The standing policy is central resettlement schedule. Its continuing cost remains part of the allocation."
 ERU_fe_return_reply_public_spirit:0 "Bring the Displaced Home: Public Return"
 ERU_fe_return_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Certify destination housing and services before households are asked to travel. Public attention or reserved staff time remains committed to that work."
 ERU_fe_return_reply_protected_spirit:0 "Bring the Displaced Home: Protected Working Return"
 ERU_fe_return_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Schedule transport, receiving offices and first-month support for returning households. Public attention or reserved staff time remains committed to that work."
 ac_fe.22.t:0 "Two Registers, One Family"
 ac_fe.22.d:0 "The family appears twice: once in a camp register as waiting to return, and once in a district register as already home. Both entries are signed. The housing inspector who visits the district address finds a roof, no water connection and a neighbour who says the family came, stayed a fortnight and left again.\n\nThe district office wants to publish the discrepancy with every other one it can find, so that residents can correct the registers themselves. The resettlement office argues that a public list of failed returns will discourage families still deciding whether to travel, and asks for a protected reconciliation first.\n\n[ERU_return_ac_fe_policy_callback]"
 ac_fe.22.a:0 "Publish the discrepancies for correction."
 ac_fe.22.b:0 "Reconcile the registers before publishing."
 ERU_return_ac_fe_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_return_ac_fe_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_return_ac_fe_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_fe.52.t:0 "The Second Visit"
 ac_fe.52.d:0 "The final review is built on second visits. An inspector returns to each certified address after the household has lived there through a season, and records whether they are still there and what they still lack. The numbers are smaller than the original schedule promised. They are also the first numbers that the ministries, the districts and the families agree on.\n\nThe family that appeared twice is now recorded once.\n\n[ERU_return_ac_fe_report_callback]\n\n[ERU_return_ac_fe_policy_callback]"
 ac_fe.52.a:0 "File the completed service record."
 ERU_victor_ac_fe_policy_callback_0:0 "The standing policy is local civil authority. Its continuing cost remains part of the allocation."
 ERU_victor_ac_fe_policy_callback_1:0 "The standing policy is standing garrison line. Its continuing cost remains part of the allocation."
 ERU_fe_victor_reply_public_spirit:0 "Count the Cost of Victory: Public Return"
 ERU_fe_victor_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Transfer routine administration in held districts to receiving civil offices. Public attention or reserved staff time remains committed to that work."
 ERU_fe_victor_reply_protected_spirit:0 "Count the Cost of Victory: Protected Working Return"
 ERU_fe_victor_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Return a scheduled group of reservists to civilian work with their duties handed over. Public attention or reserved staff time remains committed to that work."
 ac_fe.23.t:0 "The Garrison's Monthly Return"
 ac_fe.23.d:0 "The garrison's monthly return arrives with a covering note from its commander. The district is quiet. The quiet costs a battalion, a fuel allocation the ministry of transport wants back and a reservist list whose members ask every week when they will go home. The commander does not recommend withdrawal. He recommends that somebody decide.\n\nThe interior ministry proposes publishing the return so that the public can see what holding the district costs. The general staff would rather present it to the cabinet alone, where the cost can be weighed against risks that are not suitable for print.\n\n[ERU_victor_ac_fe_policy_callback]"
 ac_fe.23.a:0 "Publish the garrison's monthly return."
 ac_fe.23.b:0 "Present the return to the cabinet only."
 ERU_victor_ac_fe_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_victor_ac_fe_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_victor_ac_fe_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_fe.53.t:0 "The Cost Written Down"
 ac_fe.53.d:0 "The final account sets the garrison's cost beside the services that resumed and the reservists who went home. It does not pretend that the choice was free in either direction. The commander's covering note is attached; its request that somebody decide has been answered.\n\nThe settlement makes no claim on territory and asks no foreign government to accept anything. It records what Erusea is willing to pay for the peace it won.\n\n[ERU_victor_ac_fe_report_callback]\n\n[ERU_victor_ac_fe_policy_callback]"
 ac_fe.53.a:0 "File the completed service record."
 ERU_armistice_ac_fe_policy_callback_0:0 "The standing policy is joint line commission. Its continuing cost remains part of the allocation."
 ERU_armistice_ac_fe_policy_callback_1:0 "The standing policy is fortified line posture. Its continuing cost remains part of the allocation."
 ERU_fe_armistice_reply_public_spirit:0 "Keep the Armistice Line: Public Return"
 ERU_fe_armistice_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep liaison officers and interpreters ready to meet on the agreed schedule. Public attention or reserved staff time remains committed to that work."
 ERU_fe_armistice_reply_protected_spirit:0 "Keep the Armistice Line: Protected Working Return"
 ERU_fe_armistice_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Maintain reporting patrols that record incidents for the agreed channel. Public attention or reserved staff time remains committed to that work."
 ac_fe.24.t:0 "A Field Nobody Ploughed"
 ac_fe.24.d:0 "A farmer has asked whether he may plough a field that lies between two observation posts. Both sides have watched it for a year; nobody has crossed it. His request reaches the liaison office as a single handwritten page, and it raises a question the armistice never answered: who decides what happens in the space the line created?\n\nThe liaison officers want to take the request to the joint channel openly, as a test of whether the other side will answer a civilian question. The line command prefers to resolve it quietly through local commanders, where a refusal would embarrass nobody.\n\n[ERU_armistice_ac_fe_policy_callback]"
 ac_fe.24.a:0 "Raise the request through the joint channel."
 ac_fe.24.b:0 "Settle it quietly between local commanders."
 ERU_armistice_ac_fe_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_armistice_ac_fe_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_armistice_ac_fe_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_fe.54.t:0 "The Field Has an Answer"
 ac_fe.54.d:0 "The final review lists the incidents of the year and the answers each received. Most are routine. A few were dangerous and were closed in writing before anyone fired a second shot. The farmer's request is in the list, with the date it was answered and the reason given.\n\nThe armistice remains an armistice. It now has a procedure that both sides have used and neither has had reason to abandon.\n\n[ERU_armistice_ac_fe_report_callback]\n\n[ERU_armistice_ac_fe_policy_callback]"
 ac_fe.54.a:0 "File the completed service record."
 ERU_ordinary_ac_fe_policy_callback_0:0 "The standing policy is civil investment programme. Its continuing cost remains part of the allocation."
 ERU_ordinary_ac_fe_policy_callback_1:0 "The standing policy is standing readiness review. Its continuing cost remains part of the allocation."
 ERU_fe_ordinary_reply_public_spirit:0 "Ordinary Government Again: Public Return"
 ERU_fe_ordinary_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Deliver a scheduled group of civil projects through ordinary appropriations. Public attention or reserved staff time remains committed to that work."
 ERU_fe_ordinary_reply_protected_spirit:0 "Ordinary Government Again: Protected Working Return"
 ERU_fe_ordinary_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Exercise reserve call-up and maintenance procedures without adding new units. Public attention or reserved staff time remains committed to that work."
 ac_fe.25.t:0 "The Emergency Rule Nobody Used"
 ac_fe.25.d:0 "The legal office has found an emergency regulation that allows the transport ministry to requisition trucks without notice. It was written for a war that did not come, renewed twice by habit and never used. It is still in force.\n\nA deputy proposes publishing every such regulation with a date on which it will lapse, so that the public can see what the government no longer needs. The defence ministry asks for a protected review first: some of those powers may be needed again, and announcing their repeal could look like an invitation.\n\n[ERU_ordinary_ac_fe_policy_callback]"
 ac_fe.25.a:0 "Publish the emergency rules with lapse dates."
 ac_fe.25.b:0 "Review the emergency rules in private first."
 ERU_ordinary_ac_fe_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_ordinary_ac_fe_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_ordinary_ac_fe_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_fe.55.t:0 "A Budget Read Aloud"
 ac_fe.55.d:0 "The final peacetime budget is read in the chamber like any other. That is its achievement. The emergency regulations that lapsed are listed in an annex, and the ones the government chose to keep are listed with the reason for each.\n\nNobody can promise that the averted war will stay averted. The republic now prepares for that possibility through ordinary law.\n\n[ERU_ordinary_ac_fe_report_callback]\n\n[ERU_ordinary_ac_fe_policy_callback]"
 ac_fe.55.a:0 "File the completed service record."
 FCU_oversight_ac_fe_policy_callback_0:0 "The standing policy is advisory oversight. Its continuing cost remains part of the allocation."
 FCU_oversight_ac_fe_policy_callback_1:0 "The standing policy is supervising commission. Its continuing cost remains part of the allocation."
 FCU_fe_oversight_reply_public_spirit:0 "Administer the Oversight Mandate: Public Return"
 FCU_fe_oversight_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Place advisers with Erusean ministries for a defined period with a written handover. Public attention or reserved staff time remains committed to that work."
 FCU_fe_oversight_reply_protected_spirit:0 "Administer the Oversight Mandate: Protected Working Return"
 FCU_fe_oversight_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Check that returned duties are performed by trained Erusean offices. Public attention or reserved staff time remains committed to that work."
 ac_fe.26.t:0 "Advisers Without a Desk"
 ac_fe.26.d:0 "The advisory team's report is candid. Its members have been placed in Erusean ministries, given access to files and invited to meetings, and in two ministries nobody has asked them a question in a month. In a third they are asked to sign everything, because Erusean officials prefer that a foreigner carry the responsibility.\n\nThe treaty secretariat considers publishing the report to show the partners that oversight is neither oppressive nor idle. The federal cabinet would rather send it privately to the provisional government, which may read a public version as a list of complaints about its officials.\n\n[FCU_oversight_ac_fe_policy_callback]"
 ac_fe.26.a:0 "Publish the advisory report."
 ac_fe.26.b:0 "Send the report privately to the provisional government."
 FCU_oversight_ac_fe_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 FCU_oversight_ac_fe_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 FCU_oversight_ac_fe_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_fe.56.t:0 "A Mandate With a Calendar"
 ac_fe.56.d:0 "The final review is organised by date. Each oversight duty has a scheduled return to Erusean authority, an inspection that confirms it and a named Central Usean office that will stop doing it. Some dates have passed and the duties have moved. Some have been postponed, with the reason recorded.\n\nNobody in the federal cabinet calls the mandate a success. They call it finite, which is what the partners were promised.\n\n[FCU_oversight_ac_fe_report_callback]\n\n[FCU_oversight_ac_fe_policy_callback]"
 ac_fe.56.a:0 "File the completed service record."
 FCU_security_ac_fe_policy_callback_0:0 "The standing policy is civil police liaison. Its continuing cost remains part of the allocation."
 FCU_security_ac_fe_policy_callback_1:0 "The standing policy is rapid response detachments. Its continuing cost remains part of the allocation."
 FCU_fe_security_reply_public_spirit:0 "Support the Provisional Government's Security: Public Return"
 FCU_fe_security_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Place investigators with Erusean police for a defined period under Erusean supervision. Public attention or reserved staff time remains committed to that work."
 FCU_fe_security_reply_protected_spirit:0 "Support the Provisional Government's Security: Protected Working Return"
 FCU_fe_security_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep a small detachment on notice for requests from the provisional government. Public attention or reserved staff time remains committed to that work."
 ac_fe.27.t:0 "A Request Signed in Farbanti"
 ac_fe.27.d:0 "The request arrives with every stamp the procedure requires: the provisional interior ministry asks for investigators to help with a case it cannot close alone. It also arrives with a second, unsigned note from an Erusean officer who would rather the federation stayed away, because the insurrection's pamphlets already describe every foreign uniform as proof of occupation.\n\nThe federal liaison office proposes answering openly, publishing both the request and the conditions under which Central Usean investigators will work. The defence staff prefers a quiet answer through official channels, so that the investigators arrive without becoming a headline.\n\n[FCU_security_ac_fe_policy_callback]"
 ac_fe.27.a:0 "Answer the request publicly with its conditions."
 ac_fe.27.b:0 "Answer quietly through official channels."
 FCU_security_ac_fe_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 FCU_security_ac_fe_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 FCU_security_ac_fe_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_fe.57.t:0 "Who Asked, Who Commanded"
 ac_fe.57.d:0 "The final review is organised around two questions for every Central Usean team: who asked for it, and who commanded it. The answers are Erusean in every case the review accepts. Two deployments failed that test and were withdrawn early; the review lists them too.\n\nThe insurrection's pamphlets have not stopped. The federation's record now gives the provisional government something to answer them with.\n\n[FCU_security_ac_fe_report_callback]\n\n[FCU_security_ac_fe_policy_callback]"
 ac_fe.57.a:0 "File the completed service record."
 FCU_partners_ac_fe_policy_callback_0:0 "The standing policy is published burden formula. Its continuing cost remains part of the allocation."
 FCU_partners_ac_fe_policy_callback_1:0 "The standing policy is central usean carriage. Its continuing cost remains part of the allocation."
 FCU_fe_partners_reply_public_spirit:0 "Share the Burden with Partners: Public Return"
 FCU_fe_partners_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Match each partner's pledged contribution with the contribution actually received. Public attention or reserved staff time remains committed to that work."
 FCU_fe_partners_reply_protected_spirit:0 "Share the Burden with Partners: Protected Working Return"
 FCU_fe_partners_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Operate common transport and supply services with costs recorded by contributor. Public attention or reserved staff time remains committed to that work."
 ac_fe.28.t:0 "The Invoice With No Addressee"
 ac_fe.28.d:0 "The logistics office has found an invoice for fuel delivered to a coalition depot during the crisis. The supplier has been paid by Central Usea. The pledge that was meant to cover it came from a partner whose records show a different depot, a different month and a smaller quantity. Nobody is accused of anything; the paperwork simply never met.\n\nThe secretariat proposes publishing all such mismatches, so that every partner can correct its own records. The federal treasury fears that a public list will look like a bill sent to friends, and asks to settle the mismatches bilaterally first.\n\n[FCU_partners_ac_fe_policy_callback]"
 ac_fe.28.a:0 "Publish the mismatched accounts."
 ac_fe.28.b:0 "Settle each mismatch bilaterally first."
 FCU_partners_ac_fe_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 FCU_partners_ac_fe_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 FCU_partners_ac_fe_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_fe.58.t:0 "Accounts That Every Partner Can Read"
 ac_fe.58.d:0 "The final review is a table. Each row is a cost, each column a partner, and each cell is either a contribution received, a contribution declined with its domestic fallback, or a cost Central Usea chose to carry. The empty cells are labelled as choices rather than failures.\n\nThe invoice with no addressee is in the table, with the partner that eventually claimed it.\n\n[FCU_partners_ac_fe_report_callback]\n\n[FCU_partners_ac_fe_policy_callback]"
 ac_fe.58.a:0 "File the completed service record."
 FCU_drawdown_ac_fe_policy_callback_0:0 "The standing policy is peacetime duties. Its continuing cost remains part of the allocation."
 FCU_drawdown_ac_fe_policy_callback_1:0 "The standing policy is coalition reserve. Its continuing cost remains part of the allocation."
 FCU_fe_drawdown_reply_public_spirit:0 "Stand Down the Coalition Posture: Public Return"
 FCU_fe_drawdown_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Return a scheduled deployment to home bases with its duties handed over. Public attention or reserved staff time remains committed to that work."
 FCU_fe_drawdown_reply_protected_spirit:0 "Stand Down the Coalition Posture: Protected Working Return"
 FCU_fe_drawdown_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Exercise the retained reserve without adding new units. Public attention or reserved staff time remains committed to that work."
 ac_fe.29.t:0 "A Unit Still on the Roster"
 ac_fe.29.d:0 "A transport company appears on the coalition roster at a base it left months ago. Its commander has written twice to ask whether the unit is still assigned to a coalition task; nobody has answered, because the office that would answer was itself stood down. The company is waiting, fully paid, for an order that will not come.\n\nThe defence staff wants to publish the full roster of remaining commitments, so that every partner can see what the federation still promises. The cabinet would rather review it privately first, in case some of those commitments are ones the partners still rely on.\n\n[FCU_drawdown_ac_fe_policy_callback]"
 ac_fe.29.a:0 "Publish the roster of remaining commitments."
 ac_fe.29.b:0 "Review the roster privately first."
 FCU_drawdown_ac_fe_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 FCU_drawdown_ac_fe_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 FCU_drawdown_ac_fe_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_fe.59.t:0 "Every Commitment Has an Owner"
 ac_fe.59.d:0 "The final review lists each remaining commitment with an owner, a cost and an end condition. The transport company is not on it; it went home with its duties handed over and its commander's letters answered.\n\nThe federation's posture is smaller than it was. It is also, for the first time since the crisis, fully accounted for.\n\n[FCU_drawdown_ac_fe_report_callback]\n\n[FCU_drawdown_ac_fe_policy_callback]"
 ac_fe.59.a:0 "File the completed service record."
 ERU_fe_final_public_spirit:0 "Erusea: Public Maintenance Assessment"
 ERU_fe_final_public_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 ERU_fe_final_readiness_spirit:0 "Erusea: Reserved Readiness Return"
 ERU_fe_final_readiness_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 ERU_fe_opening_callback_public:0 "The opening hearing invited public questions. Its final account returns to that promise without pretending that every disagreement has been resolved."
 ERU_fe_opening_callback_ministerial:0 "The opening review began with a protected ministerial docket. Its final account identifies what that process delivered and who must answer for the work still waiting."
 ERU_fe_opening_callback_unanswered:0 "The opening invitation was never ratified. This assessment records that absence and proceeds from the services actually completed."
 ac_fe.80.t:0 "The Government That Remains"
 ac_fe.80.d:0 "The cabinet's last review of the period is not a celebration. It lists what the government now does for itself, what it still does under supervision or pressure, and what it has not yet managed to do at all. It names the offices responsible for each.\n\nErusea after the Continental War years is not the country its ministers would have designed. It is a country whose government can now be held to account for what it does, by its own people as well as by its partners.\n\n[ERU_fe_opening_callback]"
 ac_fe.80.a:0 "Support a public maintenance review."
 ac_fe.80.b:0 "Reserve staff for a focused readiness return."
 FCU_fe_final_public_spirit:0 "Central Usea: Public Maintenance Assessment"
 FCU_fe_final_public_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 FCU_fe_final_readiness_spirit:0 "Central Usea: Reserved Readiness Return"
 FCU_fe_final_readiness_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 FCU_fe_opening_callback_public:0 "The opening hearing invited public questions. Its final account returns to that promise without pretending that every disagreement has been resolved."
 FCU_fe_opening_callback_ministerial:0 "The opening review began with a protected ministerial docket. Its final account identifies what that process delivered and who must answer for the work still waiting."
 FCU_fe_opening_callback_unanswered:0 "The opening invitation was never ratified. This assessment records that absence and proceeds from the services actually completed."
 ac_fe.81.t:0 "A Federation Accountable for Its Promises"
 ac_fe.81.d:0 "The final account of the period is a list of promises and what became of each. Some were kept in full. Some were kept late, or in part, or in a different form than the speech that made them. A few were openly abandoned, with the reason recorded.\n\nThe federation has not become a different kind of power. It has become one whose partners can read, in one place, what it said it would do and what it did.\n\n[FCU_fe_opening_callback]"
 ac_fe.81.a:0 "Support a public maintenance review."
 ac_fe.81.b:0 "Reserve staff for a focused readiness return."
