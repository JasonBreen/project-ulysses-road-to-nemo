 ac_camp.60.t:0 "The receiving island"
 ac_camp.60.desc:0 "The duty officer found a training schedule beneath the new defense instructions. Someone had crossed out the afternoon exercise without removing the names of the crews assigned to it. For a moment the two documents seemed to describe the same day in different countries.\n\nWardog's place in the crisis would be shaped by decisions made around it. The completed island preparations meant warning coverage, a receiving plan and aircraft that were actually deployed. They did not make the young crews familiar with everything they were about to encounter. The mechanics had begun asking which faults could wait, and the controller had begun answering questions with shorter sentences.\n\nA pilot came through the door looking for the person who could confirm a call. He had written the words down immediately after landing. The officer read them, asked who else had heard them, and put the paper with the originals. Nobody suggested that the pilot should improve his recollection to match the account already being circulated.\n\nOutside, a vehicle stopped beside the fuel point. The driver had brought an item the receiving staff had requested before the situation changed. They unloaded it anyway. The island would still need ordinary supplies after the first emergency had acquired a name.\n\nThe training schedule remained beneath the orders when the officer left. He had intended to take it down. Then he thought of the people coming on duty who might need to remember that the afternoon had once contained something as modest as an exercise that could be postponed."
 ac_camp.60.a:0 "Keep this account."
 ac_camp.60.z:0 "Close this old message."
