 ac_wc_soa_programmes_desc:0 "A focus opens a specific national problem. Its dialogue selects a programme; the operation then needs a separate payment and 90 days of uninterrupted administration. A completed programme supports a renewable, bounded national service. These are original campaign stories and provisional gameplay."
