 ac_camp.78.t:0 "A pilot at the kitchen table"
 ac_camp.78.desc:0 "Yellow Four found Thirteen at a table too small for the meal and the district map laid beside it. He moved the map when she sat down. The gesture made room for her plate while leaving the edges of the marked roads visible beneath his elbow.\n\nOutside, the garrison's newly authorized occupation arrangements were being explained to another patrol. The room was quiet enough to hear the repetition of an instruction through the open window. Four listened, then asked whether the patrol had understood it.\n\nThirteen said he hoped so.\n\n\"They will need more than that at the checkpoint.\"\n\nHe looked toward the window without answering immediately. The squadron's work offered a clearer measure of competence than the roads on the district map. A flight could return with a result. A written permission could arrive at a clinic and remain useless to the next man holding a rifle.\n\nFour began eating. The ordinary task allowed them both to look away from a question neither could settle from the table. A vehicle stopped outside, and somebody called for the officer whose signature was on the passage order.\n\nThirteen moved the map again before standing. This time he put it completely off the table.\n\nFour watched him go. There would be flying to do afterward, and a debrief at which someone would ask whether the squadron had fulfilled its orders. She wanted to believe that a good answer could still be recognized without first deciding which part of the day's orders the question was supposed to mean."
 ac_camp.78.a:0 "Keep this account."
 ac_camp.78.z:0 "Close this old message."
