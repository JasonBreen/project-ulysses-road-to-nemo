 EMM_ANEA_1991_DESC:0 "Emmeria enters the new decade with the means to support a balanced national programme, but every ministry can name work that its present allocation will not finish. Workshops require dependable contracts, the transport network needs maintenance, and the armed forces need crews and replacement equipment as well as impressive returns. The cabinet must decide which promises can be sustained together.\n\nA published budget and protected civilian investment can strengthen confidence and productive capacity. A protected defence allocation instead gives the services a more reliable foundation for training and replacement production, while leaving civilian works to absorb the cost. Permanent regional desks and technical contacts offer practical cooperation without committing the republic to a new military alignment.\n\nBegin with an account of the republic, reconcile its commitments and build the administration that will carry them. The starting government is represented by its office and established national flag; no individual has been assigned an unsupported 1991 term. These national policies and starting strengths are provisional campaign design."
 EVA_ANEA_1991_DESC:0 "Estovakia's industrial returns, district accounts and military reports describe demands that cannot all be met at once. Installed machinery is not always serviceable machinery, and a formation's nominal strength says little about the transport, fuel and trained crews available to it. The administration begins the decade by asking what the federation can actually sustain.\n\nAudited civilian distribution makes allocations traceable and gives districts a way to challenge a missing delivery. It also limits the discretion of commanders who regard dependable supply as essential to readiness. Concentrating distribution in the command chain protects the military allocation, but asks civilian institutions to accept fewer safeguards. Neither policy creates the workshops or trained people that a promise requires.\n\nCorrect the national account, inspect the forces and decide how scarce capacity will be shared. Civil technical exchanges and reliable documents can preserve useful channels abroad without surrendering domestic responsibility. The starting office uses the established national flag in place of an invented leader; its policies and military strengths are provisional campaign design."
