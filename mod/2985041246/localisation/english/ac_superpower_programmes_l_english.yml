 YUK_snp_logistics_civil_policy_spirit:0 "District delivery windows"
 YUK_snp_logistics_civil_policy_spirit_desc:0 "A depot reports an available stock that has already been reserved by a second office. The train is real, the receiving yard is real, and neither reservation alone tells the dispatcher which movement has priority. Civil districts need dependable deliveries; commands need a support schedule that will not change at the last signal. The directorate's choice concerns control of scarce receiving capacity. It cannot repair a missing railway by describing an allocation more forcefully.\n\nProtect ordinary district receiving windows. Civil repair benefits while military movements accept a small scheduling burden."
 YUK_snp_logistics_civil_policy_spirit_settled:0 "District delivery windows: Standing Settlement"
 YUK_snp_logistics_civil_policy_spirit_settled_desc:0 "A depot reports an available stock that has already been reserved by a second office. The train is real, the receiving yard is real, and neither reservation alone tells the dispatcher which movement has priority. Civil districts need dependable deliveries; commands need a support schedule that will not change at the last signal. The directorate's choice concerns control of scarce receiving capacity. It cannot repair a missing railway by describing an allocation more forcefully.\n\nMake the chosen priority a standing agreement. The final rule preserves the cost of exceptional movements instead of treating them as free capacity. The chosen continuing cost remains."
