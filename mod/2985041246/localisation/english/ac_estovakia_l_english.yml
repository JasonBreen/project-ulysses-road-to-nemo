 EVA_ecw_final_public_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 EVA_ecw_final_readiness_spirit:0 "Estovakia: Reserved Readiness Return"
 EVA_ecw_final_readiness_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 EVA_ecw_opening_callback_public:0 "The opening hearing invited public questions. Its final account returns to that promise without pretending that every disagreement has been resolved."
 EVA_ecw_opening_callback_ministerial:0 "The opening review began with a protected ministerial docket. Its final account identifies what that process delivered and who must answer for the work still waiting."
 EVA_ecw_opening_callback_unanswered:0 "The opening invitation was never ratified. This assessment records that absence and proceeds from the services actually completed."
 ac_ecw.170.t:0 "A Country That Kept Its Records"
 ac_ecw.170.d:0 "The cabinet's final review of the war years lists what the ministries kept running, what they lost and what they refused to do. It does not decide who was right. It gives whatever government now governs Estovakia a civil service that remembers the war accurately.\n\n[EVA_ecw_outcome_text]\n\n[EVA_ecw_opening_callback]"
 ac_ecw.170.a:0 "Support a public maintenance review."
 ac_ecw.170.b:0 "Reserve staff for a focused readiness return."
