l_english:
 EHE_wd_cal_overdue:0 "The Election That Lapsed"
 EHE_wd_cal_overdue_desc:0 "Echea's statute book sets a national vote every forty-eight months, and the National Administration has simply let the date go by without naming another. It governs in the name of a democratic party that almost nobody in the country now votes for. Opening the question formally costs the Administration its quiet and its excuses, but every ministry is already waiting for an answer."
 EHE_wd_cal_rolls:0 "Recount the Voter Rolls"
 EHE_wd_cal_rolls_desc:0 "Nobody trusts the voter rolls, which were last revised before the calendar lapsed and still list the dead, the emigrated and the double-registered. Clerks from the capital go district by district with the old ledgers and a new set of rules. The recount is slow and costly, and whichever camp loses the eventual argument will call it rigged anyway."
 EHE_wd_cal_open_press:0 "Let the Newspapers Print It"
 EHE_wd_cal_open_press_desc:0 "One school in the Administration says the calendar question must be argued where everyone can read it. An open press law ends the licensing of printers and lets the nationalist papers, the business sheets and the few democratic pamphlets say what they like. The bloc's papers will outsell everyone else's, and some ministers fear exactly that outcome."
 EHE_wd_cal_licensed_press:0 "Keep the Printing Licences"
 EHE_wd_cal_licensed_press_desc:0 "The other school keeps the old licensing office, which grants and withdraws the right to print. Papers that inflame the calendar quarrel lose their presses for a season. The streets stay calmer and the Administration's voice stays louder. It also convinces the nationalist bloc that the government fears an honest count, and the bloc says so at every rally."
 EHE_wd_cal_set_date:0 "Name the Day and Keep It"
 EHE_wd_cal_set_date_desc:0 "The plainest answer is to announce a polling day, fix it in law and promise that no emergency will move it. The establishment fears the nationalist bloc will win a fair count outright, and the democratic camp barely exists to compete. Ministers who choose the ballot accept that they may be voted out by the people they spent years keeping out of office."
 EHE_wd_cal_no_date:0 "Govern Without a Polling Day"
 EHE_wd_cal_no_date_desc:0 "The second answer comes from inside the ministries. Senior officials propose that the Administration stop calling itself temporary and become a permanent secretariat of department heads, governing by published rules rather than by votes. Port owners, estate families and district notables like the predictability. Nobody voted for it, and the bloc calls it rule by rubber stamp."
 EHE_wd_cal_bloc_terms:0 "Open the Ministries to the Bloc"
 EHE_wd_cal_bloc_terms_desc:0 "The third answer accepts the arithmetic. Half the country stands with the nationalist bloc, so the Administration invites its leaders into the ministries before they take them by other means. The bloc promises discipline, full shifts at the works and a firm line on the frontiers. Its price is the interior and police portfolios, and it rarely gives back what it is lent."
 EHE_wd_cal_polling_clerks:0 "Polling Clerks for Six Districts"
 EHE_wd_cal_polling_clerks_desc:0 "A fair vote needs a clerk, a locked box and a lamp in every polling hall from the jungle coast to the desert hills. The Administration trains clerks in the capital and sends them out with the recounted rolls. District D has no road to half its villages, so many clerks travel by boat. The cost is high and the schedule leaves no slack."
 EHE_wd_cal_restored_cabinet:0 "Seat the Restored Cabinet"
 EHE_wd_cal_restored_cabinet_desc:0 "When the count is done, the new chamber names a cabinet that answers to it, and the National Administration dissolves into ordinary ministries. Whatever the result, the calendar runs again, with the next vote already fixed in law. The cabinet inherits a split country and a thin treasury. It also holds something the old office never had: a mandate it can show."
 EHE_wd_cal_standing_orders:0 "Standing Orders for the Ministries"
 EHE_wd_cal_standing_orders_desc:0 "A permanent secretariat needs rules that bind it, or it is only an office that refuses to leave. The department heads publish standing orders: how budgets are set, how officials are appointed, how complaints reach the top. Publishing them invites a scrutiny the old Administration avoided. Without them, the secretariat would be the same lapsed calendar under a grander name."
 EHE_wd_cal_secretariat:0 "Seal the Permanent Secretariat"
 EHE_wd_cal_secretariat_desc:0 "The department heads take the seals collectively and the old office is retired with formal thanks. No polling day appears anywhere in the new arrangements, though nothing forbids one later. Officials who served the Administration now serve the secretariat at the same desks with the same files. Predictability is the promise; the bloc in the street is the risk nobody has solved."
 EHE_wd_cal_bloc_pact:0 "Put the Bloc Terms in Writing"
 EHE_wd_cal_bloc_pact_desc:0 "Before the bloc takes any more portfolios, officials insist that its promises be written down: which ministries it holds, what happens to serving officials, how long until any election. The bloc's leaders sign a short paper and treat it as a formality while their supporters rally outside. The paper buys the civil service a few protections. It also hands the bloc a legal path to everything else."
 EHE_wd_cal_bloc_executive:0 "Seat the Bloc Executive"
 EHE_wd_cal_bloc_executive_desc:0 "The National Administration hands its seals to an executive drawn from the bloc's leadership, which governs by decree with bloc officials beside every district governor. The ministries keep working; the opposition papers do not. Supporters fill the capital centre for the ceremony. Officials who signed the written terms learn what a signature is worth when the other side holds the police."
 EHE_wd_cal_answer:0 "A Settled Answer at Last"
 EHE_wd_cal_answer_desc:0 "However it was reached, Echea now has a government that can plan beyond the next quarter. Ministries publish five-year budgets for the first time since the calendar lapsed, and foreign lenders return to the capital with questions instead of excuses. The quarrel is not over, because the losing camps still exist. It has moved from the street into the budget."
 EHE_wd_cst_two_escorts:0 "Two Escorts, Four Coasts"
 EHE_wd_cst_two_escorts_desc:0 "Four of the six districts touch the sea, from the jungle shore of District A past the capital centre to the long coast of District D and the bays of District E. The navy that guards them is two coastal escorts, one naval base and sixty merchant convoys. A service built for this coast must first decide what it can actually do with so little."
 EHE_wd_cst_rescue_posts:0 "Lifeboat Posts on the Jungle Shore"
 EHE_wd_cst_rescue_posts_desc:0 "The first job of a small coastal service is rescue rather than war. Lifeboat posts with radios and a radar mast go up along District D, where fishing boats are lost every storm season and no road can bring help. The posts cost little and win friends in villages that rarely see the capital. They also teach crews the coast in every weather."
 EHE_wd_cst_chart_shoals:0 "Chart the Shoals and Channels"
 EHE_wd_cst_chart_shoals_desc:0 "Most charts of the coast were drawn long ago and are wrong about the river mouths, sandbars and channels that shift from year to year. A survey launch with a small team of hydrographers works the coast district by district. The work is slow, unglamorous and essential: an escort that runs aground is as lost as one that is sunk."
 EHE_wd_cst_refit_basin:0 "A Refit Basin at the Capital"
 EHE_wd_cst_refit_basin_desc:0 "The two dockyards at the capital centre build and repair merchant hulls and have no berth to spare for the escorts. A third yard dedicated to refits, with a covered shed and a small dry berth, lets the navy keep both ships ready instead of queuing one behind a merchant job. It takes the last free plot on the capital waterfront."
 EHE_wd_cst_patrol_boats:0 "A Flotilla of Small Patrol Boats"
 EHE_wd_cst_patrol_boats_desc:0 "One school argues that two escorts can never cover four coasts, and that a dozen small patrol boats, cheap to build and crew, would see far more of the sea. They cannot fight a real warship and spend storms in harbour. They can stop smugglers, check fishing permits and answer a distress call on the same afternoon it is made."
 EHE_wd_cst_keep_escorts:0 "Keep Both Escorts Ready"
 EHE_wd_cst_keep_escorts_desc:0 "The other school says the escorts are the only real warships the country has, and that splitting the budget across small boats would leave nothing able to fight. The money goes into crews, spares and fuel so that both escorts can sail at a day's notice. The coast between their patrols stays empty, and the fishing villages notice."
 EHE_wd_cst_interior_guard:0 "Coast Guard Under the Interior"
 EHE_wd_cst_interior_guard_desc:0 "Lifeboats, fishing permits and harbour police are civil work, says the interior ministry, and belong to a coast guard under civilian control. Officers keep their ranks but answer to a minister rather than a general. The service gains friends in the ports and loses some of its claim on the defence budget whenever money runs short."
 EHE_wd_cst_naval_staff:0 "A Naval Section on the Staff"
 EHE_wd_cst_naval_staff_desc:0 "The army staff wants the opposite: one chain of command for every armed service, with a naval section planning the escorts alongside the battalions. Plans for the coast and the frontiers would at last be written together. Rescue work would come second to readiness, and the ports would see more uniforms and fewer lifeboats."
 EHE_wd_cst_fisheries:0 "Fisheries Protection Patrols"
 EHE_wd_cst_fisheries_desc:0 "With a flotilla at sea, the service can enforce the fishing permits that foreign trawlers have long ignored off the jungle coast. Boardings, fines and the occasional seized net bring revenue and a good deal of local gratitude. They also bring diplomatic notes from the owners' governments, which the foreign ministry answers with charts and permit lists."
 EHE_wd_cst_fleet_waits:0 "A Fleet That Waits in Harbour"
 EHE_wd_cst_fleet_waits_desc:0 "The staff's old doctrine holds that a fleet which might sail can matter as much as one that does. Two ready escorts in a defended harbour force any hostile planner to guard against them. The doctrine suits a country with two warships and a long coast. Critics call it a respectable name for staying at anchor, and they are not entirely wrong."
 EHE_wd_cst_pilot_licences:0 "Licensed Pilots for Every Harbour"
 EHE_wd_cst_pilot_licences_desc:0 "With the new charts printed, every merchant ship entering a national harbour must carry a licensed pilot who knows the channels. Pilots pay for their licences, ships pay for the pilots, and groundings fall. Shipowners grumble at the fee. The pilots become the coastal service's eyes in every port, which pleases the service more than the owners."
 EHE_wd_cst_quay_e:0 "Deepen the Quay in District E"
 EHE_wd_cst_quay_e_desc:0 "District E has two industrial plants and a bay that only shallow coasters can enter. Dredging the approach and lengthening the quay lets larger ships load its steel and aluminium directly rather than sending everything by road to the capital centre. Dredgers are hired abroad at a steep day rate. The road to the capital grows a little quieter."
 EHE_wd_wrk_count_lines:0 "Count the Lines and Battalions"
 EHE_wd_wrk_count_lines_desc:0 "Echea runs five arms lines for an army of six battalions, alongside trucks, rail stock and a small fighter line. Most weeks the arms plants in District A, the capital and District E work half shifts. Before anyone decides what the lines are for, the works office counts what each can make, what it costs and who actually buys it."
 EHE_wd_wrk_sidings:0 "New Sidings at the Logistics Centre"
 EHE_wd_wrk_sidings_desc:0 "Everything the works produce passes through the logistics centre in District A, where one siding and a single loading ramp turn every delivery into a queue. Two more sidings, a second ramp and a covered yard let trains load while trucks unload. The rail board pays half. The other half comes from the arms budget, which notices."
 EHE_wd_wrk_machine_tools:0 "Replace the Worn Machine Tools"
 EHE_wd_wrk_machine_tools_desc:0 "The lathes and presses in the capital works are older than most of the people running them. Replacing the worst with modern machine tools raises output per shift and cuts scrap. Imported tools cost foreign currency the treasury guards closely, and the old machines have friends among foremen who know their quirks. The new ones need training first."
 EHE_wd_wrk_export_rifles:0 "Sell Rifles to Foreign Buyers"
 EHE_wd_wrk_export_rifles_desc:0 "The export school says idle lines are wasted capital and that rifles, mortars and trucks sell abroad to any government with a licence and the cash. Full shifts would return, wages would rise and the arms budget would partly pay for itself. Every buyer would tie the country's name to someone else's quarrel, and some buyers would not stay friendly."
 EHE_wd_wrk_replacement_stock:0 "A Replacement Stock for Each Unit"
 EHE_wd_wrk_replacement_stock_desc:0 "The sustainment school wants the lines to build ahead: a full set of replacement rifles, support equipment and trucks for every battalion, stored in depots and rotated as it ages. The army could lose equipment in a hard month and still fight the next. The stock ties up steel and money in sheds, and auditors hate inventories that never move."
 EHE_wd_wrk_repair_lines:0 "Turn Idle Lines to Repair Work"
 EHE_wd_wrk_repair_lines_desc:0 "The repair school says a small country should mend rather than make. Two arms lines are retooled to overhaul trucks, rifles, radios and aircraft parts, keeping old equipment serviceable for years. Output of new equipment falls. Spending falls faster, and the skills built in the repair halls are the same ones civilian industry is short of."
 EHE_wd_wrk_end_user:0 "End-User Certificates"
 EHE_wd_wrk_end_user_desc:0 "Exports need rules or they become scandals. Every sale now requires a certificate naming the final user, signed by the buying government and checked by the foreign ministry. Some brokers walk away. The certificates do not make every sale wise, but they let the works office refuse a buyer without inventing an excuse, and they leave a record."
 EHE_wd_wrk_mountain_depot:0 "A Mountain Depot in District C"
 EHE_wd_wrk_mountain_depot_desc:0 "Replacement stock kept beside the factories would be lost with them. The army wants a depot in the District C mountains, inland and hard to reach, with a small assembly hall where stored rifles and trucks are checked and refitted. Building it means hauling machinery up the new pass road. Once it is there, the stock is far from any coast."
 EHE_wd_wrk_truck_overhaul:0 "Overhaul the Army Trucks"
 EHE_wd_wrk_truck_overhaul_desc:0 "The army's trucks are its mobility, and many are too worn for the hill roads. The new repair halls rebuild them in batches: engines, gearboxes, axles and tyres. A rebuilt truck costs a third of a new one and lasts most of a decade. The battalions lose a share of their transport while each batch is in the halls."
 EHE_wd_wrk_one_pattern:0 "One Calibre and One Truck Pattern"
 EHE_wd_wrk_one_pattern_desc:0 "Whatever the lines are for, the army still uses several rifle patterns and truck models bought at different times. Standardising on one calibre and one truck pattern makes every spare part fit every unit. The transition takes years, retires good equipment early and annoys every officer attached to the old kit. Supply columns become simpler to load and plan."
 EHE_wd_wrk_broker_calls:0 "Brokers Call During the Belkan War"
 EHE_wd_wrk_broker_calls_desc:0 "When the Belkan War begins in March 1995, arms brokers telephone the works office from half a dozen capitals asking what the national lines can deliver and how fast. The country is nowhere near the fighting. The question is whether the works answer the telephone at all, and how many shifts the answer will cost or keep."
 EHE_wd_wrk_sanctions_review:0 "Review Contracts Under the Sanctions"
 EHE_wd_wrk_sanctions_review_desc:0 "In March 2002 Osea, Emmeria and other nations join in economic sanctions against Estovakia. Nothing records whether Echea is counted among the other nations. The works office reviews every supply and export contract anyway for components that could reach Estovakia through a broker, because the country's own suppliers will soon be asking the same questions."
 EHE_wd_grv_tree_count:0 "Count Every Tapped Tree"
 EHE_wd_grv_tree_count_desc:0 "Rubber grows across the jungle districts in groves of every size, from a family's few rows behind a village to estates covering whole valleys. Nobody knows how many trees are tapped, who owns them or where the latex goes. A count by agricultural clerks, grove by grove, is the first step to any rubber policy and the first quarrel about one."
 EHE_wd_grv_latex_floor:0 "A Floor Price for Latex"
 EHE_wd_grv_latex_floor_desc:0 "Latex prices swing with markets far away, and every collapse ruins small tappers who sold their crop forward. A national buying office promises to purchase latex at a published floor price in bad years and sell from its store in good ones. The office needs a reserve to start and discipline to keep it. Tappers will remember whether it pays."
 EHE_wd_grv_coops:0 "Tappers and Their Cooperatives"
 EHE_wd_grv_coops_desc:0 "The first model puts the groves in the hands of the people who tap them. Village cooperatives pool latex, run their own smoking sheds and sell in bulk. Yields stay modest and quality varies from shed to shed. The money stays in the villages, the districts grow steadier, and the old estate owners lose the cheap labour they have always counted on."
 EHE_wd_grv_estates:0 "Charter the Estate Companies"
 EHE_wd_grv_estates_desc:0 "The second model backs the large estates, which have capital, improved seedlings and agents abroad. Chartered estate companies get long leases, export credit and freedom to buy up small groves. Output and quality rise quickly. Many small tappers become wage workers on land they used to work for themselves, and the districts will not forget who signed the charters."
 EHE_wd_grv_state_works:0 "A State Rubber Works"
 EHE_wd_grv_state_works_desc:0 "The third model skips the argument over ownership and goes downstream. A state rubber works buys latex from anyone at the floor price and turns it into sheet, belting and tyres at home instead of exporting raw crop. The plant needs engineers and protection from imports. If it works, the country sells finished goods; if not, the treasury owns a very expensive shed."
 EHE_wd_grv_smoke_sheds:0 "Smoking Sheds for the Villages"
 EHE_wd_grv_smoke_sheds_desc:0 "Cooperatives need somewhere to turn latex into smoked sheet before it spoils. A building programme puts communal smoking and drying sheds in the jungle villages of District D, with a small processing hall at the main landing. The sheds use local timber and labour. Together they give District D its first industrial building of any kind."
 EHE_wd_grv_estate_wharf:0 "Estate Wharves in District A"
 EHE_wd_grv_estate_wharf_desc:0 "The estate companies want their latex on ships rather than in trucks. New wharves and a paved estate road along the District A coast let them load directly for export. The companies pay part of the cost and expect the rest from the treasury. Fishing villages along the shore lose some beach to concrete, and the wharf owners decide who else may use it."
 EHE_wd_grv_tyre_plant:0 "A Tyre and Belting Plant"
 EHE_wd_grv_tyre_plant_desc:0 "The state works builds its main plant in District E, beside the existing factories and the steel they already handle. It makes truck tyres, conveyor belts and hoses for domestic buyers first. The army is the first customer and the most demanding one. Imported tyres were cheaper; the plant's whole case rests on the years when imports cannot be had."
 EHE_wd_grv_replant:0 "Replant the Ageing Groves"
 EHE_wd_grv_replant_desc:0 "Many trees were planted generations ago and yield less every season. A replanting programme pays growers to cut the oldest rows and plant new stock, accepting years without latex from those plots. Growers need credit to survive the gap. The groves that emerge will outproduce the old ones for decades, provided the programme survives several changes of minister."
 EHE_wd_grv_blight_lab:0 "A Laboratory for Leaf Blight"
 EHE_wd_grv_blight_lab_desc:0 "A single fungal blight could wipe out groves planted from the same stock. A small agricultural laboratory in the capital district studies leaf diseases, tests resistant stock and trains inspectors to spot infections early. It is a modest building with a modest staff. Its warning may one day be the difference between a bad season and a ruined district."
 EHE_wd_jun_walk:0 "Walk the Length of District D"
 EHE_wd_jun_walk_desc:0 "District D covers more ground than any other district and has had the least investment: a long jungle coast and river valleys with no road, no factory and no telephone line worth the name. A government team walks and paddles its length for a season, mapping villages, landings and fever zones. Their report is the first account of the district anyone in the capital has read."
 EHE_wd_jun_fever_clinics:0 "Clinics Against the Fevers"
 EHE_wd_jun_fever_clinics_desc:0 "The walking team found fever in almost every village, and the nearest hospital is in the capital centre, two days away by boat. A chain of small clinics, each with a nurse, a medicine store and a radio, brings basic care to the coast. Staffing them is harder than building them, because few trained nurses want to live so far from a road."
 EHE_wd_jun_coast_road:0 "Cut the Coast Road"
 EHE_wd_jun_coast_road_desc:0 "The road party wants a graded road along the coast from the capital to the far end of District D, with bridges over every river. Trucks, buses and the army could then reach every village in a day. The road will take years, swallow budgets and need repairs after every wet season. Once built, it joins District D to the rest of the country for good."
 EHE_wd_jun_steamers:0 "Coastal Steamers Instead"
 EHE_wd_jun_steamers_desc:0 "The harbour party says the sea already connects District D, and that a subsidised steamer service calling at every landing would serve the coast at a fraction of a road's price. A small yard at the main landing would build and repair the boats. Steamers are slower than trucks and stop in storms. They also leave the jungle standing."
 EHE_wd_jun_road_camps:0 "Road Camps and River Bridges"
 EHE_wd_jun_road_camps_desc:0 "Crews building the coast road live in camps that move with the work, each with a clinic, a store and an engineer's office. Bridges go in before the road reaches them so that the camps can be supplied from both banks. The army's engineers lend surveyors and learn jungle building on the way. Every finished bridge shortens the next season's haul."
 EHE_wd_jun_landings:0 "Timber Landings at the River Mouths"
 EHE_wd_jun_landings_desc:0 "Steamers need somewhere to call. Timber landings with a warehouse, a small crane and a harbour light are built at each of the main river mouths, where village trade already gathers. Landings flood and rot faster than concrete. They are cheap enough to rebuild, and each one becomes a market as soon as the first steamer ties up."
 EHE_wd_jun_workshop_town:0 "A Workshop Town at the Landing"
 EHE_wd_jun_workshop_town_desc:0 "Whichever way the coast is joined, the main landing of District D grows into its first real town. A workshop hall for engines, boats and trucks gives the district a trade that does not depend on the harvest. Skilled mechanics must be lured from the capital with housing and higher pay. The workshop's apprentices become the district's first trained workforce."
 EHE_wd_jun_land_titles:0 "Titles for Cleared Land"
 EHE_wd_jun_land_titles_desc:0 "Families clearing jungle plots along the coast have no papers, while estate companies and speculators in the capital claim the same land. A land office issues titles to families who have farmed a plot for five years, with surveys paid by the state. Some claims collide and the courts fill with disputes. A title lets a family borrow against land it can prove is its own."
 EHE_wd_jun_wet_season:0 "Plans for the Wet Season"
 EHE_wd_jun_wet_season_desc:0 "Every year the rains cut District D into islands for months, and every year the government reacts as though surprised. A standing wet-season plan places food, medicine and boats before the rains, assigns army trucks to the worst stretches and publishes which landings stay open. It spends money in dry months on problems that arrive in wet ones."
 EHE_wd_jun_district_deputy:0 "A Deputy for District D"
 EHE_wd_jun_district_deputy_desc:0 "If the calendar returns, District D must be counted in it. Its villages are so scattered that a single polling station would leave most of them unheard, so the electoral office allots the district its own deputy and carries ballot boxes along the coast by boat. The deputy will arrive in the capital with a long list of demands and little patience."
 EHE_wd_hgh_muster:0 "Muster the Six Battalions"
 EHE_wd_hgh_muster_desc:0 "The army is four formations and six battalions spread thin between the coast and two inland districts. District C is mountain and hill on the Sotoa and Central Sotoa frontiers; District F is desert and broken hills facing Aemurraq and Sotoa. Neither has a graded road. Before any reform, the staff musters every battalion and finds out what each can actually reach."
 EHE_wd_hgh_pass_road:0 "A Road Over the District C Passes"
 EHE_wd_hgh_pass_road_desc:0 "District C is three high valleys joined by mule tracks, cut off from the rest of the country whenever rock falls block the passes. A graded road with retaining walls and culverts links it to District E and the coast. The engineers estimate two seasons and the treasury estimates three. Once it opens, the valleys can sell what they grow and the army can reach them."
 EHE_wd_hgh_desert_track:0 "Grade the Track into District F"
 EHE_wd_hgh_desert_track_desc:0 "District F's desert and hills are crossed by tracks that vanish after every sandstorm. Grading a proper track from District A through the district, with water and a fuel stop every day's drive, gives the frontier garrisons a supply line and the hill villages a way to market. The work is hot, dull and permanent, which suits the army's engineers."
 EHE_wd_hgh_firepower:0 "Outshoot, Never Outnumber"
 EHE_wd_hgh_firepower_desc:0 "An army of six battalions will never outnumber anyone, so the staff's doctrine is to outshoot them. Mortars and field guns are concentrated in a support group that can move to whichever battalion is engaged. Gunners need years of training and ammunition the works must supply. Infantry officers complain that firepower is being bought with their manpower."
 EHE_wd_hgh_mountain_rifles:0 "Mountain Rifle Companies"
 EHE_wd_hgh_mountain_rifles_desc:0 "The hill school wants the battalions retrained as mountain rifles: light companies that live in the passes, move on foot and by mule, and know every ridge on the frontier. Infantry already learn mountaineering in basic training. Mountain troops are slow to concentrate and poorly placed to defend the coast. On their own ground they are very hard to dislodge."
 EHE_wd_hgh_motor_columns:0 "Motor Columns for the Coast"
 EHE_wd_hgh_motor_columns_desc:0 "The coast school says the passes defend themselves and the danger lies along the shore, where any landing would come. It wants the battalions motorised on trucks the works already build, held in central reserve and moved by road to wherever a threat appears. Columns need roads, fuel and maintenance. Without them, motor infantry is infantry that waits."
 EHE_wd_hgh_mule_trains:0 "Mule Trains for the Upper Valleys"
 EHE_wd_hgh_mule_trains_desc:0 "Mountain companies live or die by their supply, and trucks cannot climb where they patrol. Each company receives a mule train, handlers hired from the valley villages and fodder stores at the pass huts. Villagers earn steady pay and the army learns their paths. The trains are slow and need daily care, but they never wait for fuel deliveries."
 EHE_wd_hgh_truck_park:0 "A Central Truck Park"
 EHE_wd_hgh_truck_park_desc:0 "Motor columns need a home where trucks are serviced, fuelled and loaded around the clock. A central truck park at the edge of the capital district, with workshops, a fuel depot and a road to the coast, becomes the army's pivot. Every column leaves from there. It is also an obvious target, which the staff accepts as the price of speed."
 EHE_wd_hgh_signal_huts:0 "Signal Huts on the High Ridges"
 EHE_wd_hgh_signal_huts_desc:0 "Radio contact with the valley garrisons fails behind the ridges. A chain of signal huts on the high points, each with a relay set and a small radar for weather and aircraft, keeps District C talking to the capital. Crews rotate monthly because the huts are cold, cramped and lonely. The chain also watches the sky above the frontier."
 EHE_wd_hgh_depot_f:0 "A Workshop Depot in District F"
 EHE_wd_hgh_depot_f_desc:0 "Garrisons in District F wait weeks for spare parts from the coast. A depot at the end of the graded track, with workshops that can rebuild engines and weapons on site, shortens that wait to days. The depot needs water, power and staff willing to live in the desert hills. It becomes the district's largest employer the week it opens."
 EHE_wd_hgh_staff_school:0 "A Staff School in the Hills"
 EHE_wd_hgh_staff_school_desc:0 "Whichever doctrine wins, the battalions need officers trained to plan operations across mountains, desert and coast together. A small staff school in the hill country teaches map work, logistics and combined exercises with the air wing and the coastal service. It takes the best captains away from their units for a year. They return able to run a campaign."
 EHE_wd_hgh_bloc_companies:0 "Volunteer Companies from the Bloc"
 EHE_wd_hgh_bloc_companies_desc:0 "With the bloc in the ministries, its youth wings offer volunteer companies for frontier duty in District F. The volunteers are eager, unpaid and loyal to the bloc first. The staff gains manpower it could not otherwise afford and loses some control over who guards the frontier. Regular officers are attached to every company, and quietly told to keep notes."
 EHE_wd_avn_one_field:0 "Twenty-Four Fighters, One Runway"
 EHE_wd_avn_one_field_desc:0 "The air wing is twenty-four fighters and a handful of reserve airframes on a single air base at the capital. One damaged runway would ground all of them. Before arguing about missions, the wing's officers press for the basics: a second runway, somewhere to disperse, and radar that sees farther than the control tower's binoculars."
 EHE_wd_avn_second_runway:0 "A Crosswind Runway at the Capital"
 EHE_wd_avn_second_runway_desc:0 "A second runway laid across the first lets the wing fly in crosswinds that ground it today and keeps one strip open if the other is cratered. Concrete and drainage are expensive in jungle soil and the work closes the field for weeks. When it reopens, the wing can launch twice as fast and recover in weather that used to divert it."
 EHE_wd_avn_dispersal:0 "Dispersal Strips in District A"
 EHE_wd_avn_dispersal_desc:0 "Grass and gravel strips in District A, near the logistics centre, give the fighters somewhere to go if the capital field is hit. Each strip has a fuel bowser, a tent hangar and a crew that drills twice a year. The strips cost little to build and a great deal to keep ready. A wing that can disperse is a much harder target."
 EHE_wd_avn_capital_radar:0 "Radar on the Heights"
 EHE_wd_avn_capital_radar_desc:0 "Mountains overlook the capital district, and a radar station on the heights would see aircraft long before they reach the coast. The site is hard to reach and needs its own road and generator. The radar feeds the wing's control room and the coastal service's plot. The wing finally sees its own sky without depending on reports from ships."
 EHE_wd_avn_capital_sky:0 "Fighters for the Capital Sky"
 EHE_wd_avn_capital_sky_desc:0 "The fighter school wants every airframe trained for one mission: denying the sky over the capital and the works. Pilots fly intercepts and air combat drills and little else. The country gains a credible air defence for its core. Everything outside that circle, from the jungle coast to the desert hills, sees fighters only on parade days."
 EHE_wd_avn_rescue_wing:0 "A Transport and Rescue Wing"
 EHE_wd_avn_rescue_wing_desc:0 "The service school says a country with no roads to half its villages needs aircraft that carry people more than aircraft that shoot. Part of the budget buys light transports and helicopters for rescue, medical flights and supply drops to the interior. Fewer fighters stay on alert. The wing becomes the most popular part of the armed forces almost overnight."
 EHE_wd_avn_clinic_strips:0 "Airstrips for the Clinics"
 EHE_wd_avn_clinic_strips_desc:0 "The fever clinics along District D need a way to move the seriously ill. Short airstrips beside the largest clinics let light transports land on a cleared field, carry patients to the capital and return with medicine. Each strip needs constant clearing against the jungle. Every evacuation flight is talked about in the district, and remembered there."
 EHE_wd_avn_gunnery_range:0 "A Gunnery Range in District F"
 EHE_wd_avn_gunnery_range_desc:0 "Pilots who never fire live rounds cannot be trusted to hit anything. A gunnery and bombing range in the empty desert of District F, with targets, a scoring hut and a small strip for refuelling, lets the wing train properly without overflying towns. Ammunition costs rise sharply. So does the share of pilots who pass their gunnery tests."
 EHE_wd_avn_mechanics:0 "Mechanics Before Pilots"
 EHE_wd_avn_mechanics_desc:0 "A fighter on the ground for want of a part is no fighter at all. The wing opens a school for aircraft mechanics, trains them on the airframes it actually flies and pays them nearly as much as junior pilots. More aircraft fly each day. The pilots' mess complains about money spent on spanners; the readiness reports end the argument."
 EHE_wd_sky_committee:0 "A Committee for the Asteroid"
 EHE_wd_sky_committee_desc:0 "In December 1994 the International Astronomical Union announces that the asteroid Ulysses will pass close to the Earth, with a chance of impact. Nobody can say where anything might fall. The government forms an impact committee of ministry officials, doctors, engineers and the coastal service, with a mandate to plan against a threat it cannot locate."
 EHE_wd_sky_certain:0 "The FCU Announces the Impact"
 EHE_wd_sky_certain_desc:0 "In April 1996 the President of the FCU tells the world that Ulysses will strike the Earth and sets out plans to counter it. The committee's contingency papers become a programme overnight. Prices for grain, fuel and insurance jump in every market the country trades with, and the capital wants to know what the government will actually do."
 EHE_wd_sky_refuges:0 "Refuges in the District C Mountains"
 EHE_wd_sky_refuges_desc:0 "One plan moves people inland and upward. Refuges dug into the slopes of the District C valleys, stocked with food and water and reached by the pass road, would shelter coastal families if fragments struck the sea nearby. The refuges are expensive and far away. Families on the coast ask how they will get there in time."
 EHE_wd_sky_sea_lift:0 "A Sea-Lift for the Coast"
 EHE_wd_sky_sea_lift_desc:0 "The other plan keeps people where they live and moves them by sea if a fragment threatens. Merchant ships, the coastal service and every fishing boat with an engine are listed, crewed and assigned to a landing. A sea-lift is cheaper than refuges and uses ships the country already owns. It depends on warning time nobody can promise."
 EHE_wd_sky_blood_banks:0 "Blood Banks and Field Hospitals"
 EHE_wd_sky_blood_banks_desc:0 "Whatever falls, the injured will need treatment where they are. The health ministry builds blood banks in the capital and District E, buys tented field hospitals and trains volunteer teams to raise them within a day. Donors queue outside the first banks. The equipment ages in storage, and every year without an impact makes it harder to defend in the budget."
 EHE_wd_sky_refuge_road:0 "Widen the Road to the Refuges"
 EHE_wd_sky_refuge_road_desc:0 "Refuges are useless if the road to them jams. The pass road into District C is widened for two lanes of traffic, with lay-bys, fuel stops and signs marked for evacuation. Practice convoys run each dry season and reveal every bottleneck. Hill villages gain a better road than they ever expected, built for a reason they hope never to see."
 EHE_wd_sky_lift_drill:0 "Rehearse the Sea-Lift"
 EHE_wd_sky_lift_drill_desc:0 "Once a year the coastal service, merchant masters and fishing crews rehearse the sea-lift, loading volunteers at every landing and sailing them to the capital. The first drill is chaos and the second is merely slow. Each costs fuel, a week of lost catches and a great deal of overtime. Each also shortens the time a real evacuation would take."
 EHE_wd_sky_estimate_desk:0 "Read the Monthly Damage Estimate"
 EHE_wd_sky_estimate_desk_desc:0 "From July 1998 the International Astronomical Union's monthly damage estimate includes the possibility of fragments falling on the eastern part of the Anean continent. The committee sets up a desk to read each estimate on the day it is published and translate it into orders for the ministries. The estimates keep changing, and so do the orders."
 EHE_wd_sky_roche:0 "A Radio Watch for the Roche Limit"
 EHE_wd_sky_roche_desc:0 "In July 1999 Ulysses passes through the Roche limit. The committee's estimate desk has prepared for this night for a year: the coastal service is on alert, the field teams are packed and every district office has a radio watch. No fragment's path is known in advance. By morning the country will know how well its plans hold up."
 EHE_wd_sky_spares_hoard:0 "Spares Laid Up Before the Fall"
 EHE_wd_sky_spares_hoard_desc:0 "If shipping stops after an impact, the country's ships, trucks and fighters will run on whatever spare parts are already at home. The committee buys a two-year stock of engines, tyres, filters and radio parts and stores it in dry sheds away from the coast. The purchase drains foreign currency. It turns the sustainment doctrine into something physical."
 EHE_wd_sky_secretariat_tables:0 "Timetables from the Secretariat"
 EHE_wd_sky_secretariat_tables_desc:0 "With the permanent secretariat in charge, impact planning becomes an administrative exercise of the kind department heads do best. Every ministry receives a timetable listing what it must stock, train and inspect by each quarter until the asteroid passes. Inspectors check the timetables. The public sees little of this, which is how the secretariat prefers it."
 EHE_wd_lns_san_salvacion:0 "Delivery Dates Slip"
 EHE_wd_lns_san_salvacion_desc:0 "Erusea's invasion of San Salvacion in the summer of 2003, and its use of the captured Stonehenge railguns against aircraft, start a war far from these coasts. Within weeks foreign suppliers write that engine parts, radio sets and machine tools ordered for the works and the armed services will ship late, if at all. Their factories have found new customers."
 EHE_wd_lns_strip_for_parts:0 "Strip Two to Keep Ten Running"
 EHE_wd_lns_strip_for_parts_desc:0 "One answer is to live on what the country already has. A share of the trucks, two of the fighters and the oldest patrol craft are laid up and stripped for parts, so that everything else keeps moving. The services shrink on paper for the length of the war. Mechanics learn every component by hand, and nothing waits on a foreign delivery date."
 EHE_wd_lns_buy_forward:0 "Buy Spares Forward at Any Price"
 EHE_wd_lns_buy_forward_desc:0 "The other answer is to pay. The treasury signs forward contracts for spare parts and fuel at wartime prices, guaranteeing two years of supply at a painful cost. Nothing is laid up and every unit keeps its strength. The bill falls on the budgets for roads, clinics and the works, and the contracts run on even if the war ends early."
 EHE_wd_lns_rail_freight:0 "Heavy Freight Moves to Rail"
 EHE_wd_lns_rail_freight_desc:0 "With fuel and truck parts dear, the works and the logistics centre move heavy freight from road to rail wherever the two rail paths through the country allow. The rail board adds wagons and night trains and a new loop at District A. Districts without a line still pay the full price of road haulage. Where rail reaches, the savings show in the first month's accounts."
 EHE_wd_lns_parts_register:0 "A National Register of Parts"
 EHE_wd_lns_parts_register_desc:0 "Nobody can say how many spare pumps, bearings or radio sets the coastal service, the battalions and the air wing hold between them, because each keeps its own books. A single register lists every part in every store and lets one service borrow from another. Quartermasters resent the openness. Shortages that once took weeks to solve now take a telephone call."
 EHE_wd_lns_local_spares:0 "Make the Spares at Home"
 EHE_wd_lns_local_spares_desc:0 "Expensive imports make the case the sustainment school has argued since 1991: build the commonest spare parts at home. Filters, gaskets, tyres, bearings and simple radio parts are tooled up in the existing works, at a higher unit cost than peacetime imports. The works gain steady orders. The armed forces gain parts that no distant war can delay."
 EHE_wd_lns_order_books:0 "Suppliers Reopen Their Books"
 EHE_wd_lns_order_books_desc:0 "With the war in Usea recorded as an ISAF victory, foreign factories return to their peacetime customers and delivery dates begin to mean something again. The import queue for the works and the services shortens month by month. Ministers are tempted to cancel every wartime measure at once. The treasury argues for keeping half, because the next shortage will not announce itself either."
 EHE_wd_lns_ledger:0 "The Ledger Since the Lapsed Vote"
 EHE_wd_lns_ledger_desc:0 "In 2005 the government publishes a plain ledger of what has changed since the election calendar lapsed: who governs and how, which districts gained roads, what the works and the groves produce, how the coast and the frontiers are guarded. The ledger promises nothing about the decade ahead. It records what was built, and what it cost."
 EHE_wd_lns_ledger_tt_2:0 "Closes the 1991 to 2005 programme; later eras are not yet written."
 ac_wd_ehe_tree:0 "Echea: National Programme"
 ac_wd_ehe_tree_desc:0 "The national focus programme of Echea, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 EHE_wd_lapsed_calendar:0 "The Lapsed Calendar"
 EHE_wd_lapsed_calendar_desc:0 "The statutory polling day passed and no new one was named."
 EHE_wd_open_press:0 "An Open Press Law"
 EHE_wd_open_press_desc:0 "Any printer may publish on the calendar quarrel; the bloc papers sell best."
 EHE_wd_licensed_press:0 "Printing Licences"
 EHE_wd_licensed_press_desc:0 "Printers who inflame the calendar quarrel lose their presses for a season."
 EHE_wd_ballot_guarantees:0 "Guarantees for the Ballot"
 EHE_wd_ballot_guarantees_desc:0 "A polling day fixed in law that no emergency may move."
 EHE_wd_standing_secretariat:0 "A Standing Secretariat"
 EHE_wd_standing_secretariat_desc:0 "Department heads govern by rule while no polling day is set."
 EHE_wd_bloc_in_ministries:0 "The Bloc in the Ministries"
 EHE_wd_bloc_in_ministries_desc:0 "The nationalist bloc holds the interior and police portfolios."
 EHE_wd_polling_season:0 "The Polling Season"
 EHE_wd_polling_season_desc:0 "Clerks, locked boxes and boats in every district until the count is done."
 EHE_wd_restored_calendar:0 "The Restored Calendar"
 EHE_wd_restored_calendar_desc:0 "A cabinet answerable to the chamber, with the next vote already fixed."
 EHE_wd_secretariat_code:0 "The Secretariat Code"
 EHE_wd_secretariat_code_desc:0 "Published standing orders bind every ministry and every official."
 EHE_wd_bloc_rallies:0 "Bloc Rallies"
 EHE_wd_bloc_rallies_desc:0 "The bloc fills the squares while its terms are written down."
 EHE_wd_bloc_order:0 "Order of the Bloc Executive"
 EHE_wd_bloc_order_desc:0 "Government by decree with bloc officials beside every district governor."
 EHE_wd_planning_horizon:0 "A Planning Horizon"
 EHE_wd_planning_horizon_desc:0 "Ministries budget five years ahead for the first time since the calendar lapsed."
 EHE_wd_coastal_service:0 "The Coastal Service"
 EHE_wd_coastal_service_desc:0 "Two escorts, one naval base and four coasts to watch."
 EHE_wd_patrol_flotilla:0 "The Patrol Boat Flotilla"
 EHE_wd_patrol_flotilla_desc:0 "Small boats in numbers along every coast."
 EHE_wd_ready_escorts:0 "Both Escorts Ready"
 EHE_wd_ready_escorts_desc:0 "Crews, spares and fuel to sail at a day of notice."
 EHE_wd_interior_coast_guard:0 "Coast Guard of the Interior"
 EHE_wd_interior_coast_guard_desc:0 "Lifeboats, permits and harbour police under a civilian minister."
 EHE_wd_naval_section:0 "Naval Section of the Staff"
 EHE_wd_naval_section_desc:0 "The escorts are planned alongside the battalions."
 EHE_wd_fisheries_watch:0 "Fisheries Protection"
 EHE_wd_fisheries_watch_desc:0 "Fishing permits enforced off the jungle coast."
 EHE_wd_fleet_in_harbour:0 "A Fleet in Harbour"
 EHE_wd_fleet_in_harbour_desc:0 "Two ready escorts that any hostile planner must guard against."
 EHE_wd_licensed_pilots:0 "Licensed Harbour Pilots"
 EHE_wd_licensed_pilots_desc:0 "Every merchant ship carries a pilot who knows the channels."
 EHE_wd_half_shift_lines:0 "Lines on Half Shifts"
 EHE_wd_half_shift_lines_desc:0 "Five arms lines paid for and half idle."
 EHE_wd_rifle_exports:0 "Rifles for Export"
 EHE_wd_rifle_exports_desc:0 "Arms lines on full shifts for licensed foreign buyers."
 EHE_wd_certified_exports:0 "Certified Exports"
 EHE_wd_certified_exports_desc:0 "Every sale carries a certificate naming its final user."
 EHE_wd_replacement_stock:0 "The Replacement Stock"
 EHE_wd_replacement_stock_desc:0 "A full set of replacements for every battalion, held in depots."
 EHE_wd_repair_halls:0 "The Repair Halls"
 EHE_wd_repair_halls_desc:0 "Two arms lines retooled to overhaul and mend."
 EHE_wd_one_pattern:0 "One Pattern"
 EHE_wd_one_pattern_desc:0 "One calibre and one truck model across the army."
 EHE_wd_broker_season:0 "The Brokers Calling"
 EHE_wd_broker_season_desc:0 "Arms brokers telephone from abroad while the Belkan War lasts."
 EHE_wd_contract_review:0 "Contracts Under Review"
 EHE_wd_contract_review_desc:0 "Every supply contract checked for routes to a sanctioned buyer."
 EHE_wd_grove_count:0 "The Grove Count"
 EHE_wd_grove_count_desc:0 "A tally of every tapped tree and of who claims it."
 EHE_wd_latex_floor_price:0 "A Floor Under Latex"
 EHE_wd_latex_floor_price_desc:0 "A buying office guarantees a minimum price in bad years."
 EHE_wd_tapper_cooperatives:0 "Tappers Cooperatives"
 EHE_wd_tapper_cooperatives_desc:0 "Village cooperatives pool latex and run their own sheds."
 EHE_wd_estate_charters:0 "Estate Charters"
 EHE_wd_estate_charters_desc:0 "Long leases and export credit for the large estates."
 EHE_wd_state_rubber_works:0 "The State Rubber Works"
 EHE_wd_state_rubber_works_desc:0 "Latex turned into sheet, belting and tyres at home."
 EHE_wd_replanted_groves:0 "Replanted Groves"
 EHE_wd_replanted_groves_desc:0 "Young stock in place of the oldest rows."
 EHE_wd_district_d_office:0 "The District D Office"
 EHE_wd_district_d_office_desc:0 "A permanent government office on the jungle coast."
 EHE_wd_fever_clinics:0 "Fever Clinics"
 EHE_wd_fever_clinics_desc:0 "A nurse, a medicine store and a radio for each group of coastal villages."
 EHE_wd_steamer_service:0 "The Coastal Steamers"
 EHE_wd_steamer_service_desc:0 "Subsidised steamers call at every landing on the coast."
 EHE_wd_land_titles:0 "Titles for Cleared Land"
 EHE_wd_land_titles_desc:0 "Families who have farmed a plot for five years may hold it by title."
 EHE_wd_wet_season_plan:0 "The Wet-Season Plan"
 EHE_wd_wet_season_plan_desc:0 "Food, medicine and boats in place before the rains."
 EHE_wd_six_battalions:0 "Six Battalions"
 EHE_wd_six_battalions_desc:0 "A small army mustered and counted."
 EHE_wd_mountain_rifles:0 "Mountain Rifles"
 EHE_wd_mountain_rifles_desc:0 "Light companies that live in the passes."
 EHE_wd_motor_columns:0 "Motor Columns"
 EHE_wd_motor_columns_desc:0 "Motorised battalions held in central reserve."
 EHE_wd_valley_mule_trains:0 "Mule Trains"
 EHE_wd_valley_mule_trains_desc:0 "Pack animals and village handlers for every hill company."
 EHE_wd_hill_staff_school:0 "The Hill Staff School"
 EHE_wd_hill_staff_school_desc:0 "Officers trained to plan across mountain, desert and coast."
 EHE_wd_frontier_volunteers:0 "Bloc Volunteer Companies"
 EHE_wd_frontier_volunteers_desc:0 "Unpaid bloc volunteers on frontier duty in District F."
 EHE_wd_one_runway_wing:0 "One Runway"
 EHE_wd_one_runway_wing_desc:0 "Twenty-four fighters on a single field."
 EHE_wd_capital_sky_wing:0 "The Capital Sky Wing"
 EHE_wd_capital_sky_wing_desc:0 "Every fighter trained to deny the sky over the core."
 EHE_wd_rescue_wing:0 "The Rescue Wing"
 EHE_wd_rescue_wing_desc:0 "Light transports and helicopters for rescue and supply."
 EHE_wd_mechanics_school:0 "The Mechanics School"
 EHE_wd_mechanics_school_desc:0 "Trained mechanics keep more aircraft flying each day."
 EHE_wd_impact_committee:0 "The Impact Committee"
 EHE_wd_impact_committee_desc:0 "Planners for a threat nobody can locate."
 EHE_wd_mountain_refuges:0 "Mountain Refuges"
 EHE_wd_mountain_refuges_desc:0 "Stocked refuges in the District C valleys."
 EHE_wd_sea_lift_plan:0 "The Sea-Lift Plan"
 EHE_wd_sea_lift_plan_desc:0 "Every hull listed and assigned to a landing."
 EHE_wd_field_hospitals:0 "Field Hospitals"
 EHE_wd_field_hospitals_desc:0 "Blood banks and tented hospitals ready within a day."
 EHE_wd_drilled_crews:0 "Drilled Sea-Lift Crews"
 EHE_wd_drilled_crews_desc:0 "Merchant and fishing crews who have rehearsed the lift."
 EHE_wd_spares_hoard:0 "Spares Laid Up"
 EHE_wd_spares_hoard_desc:0 "Two years of engines, tyres and filters in dry sheds."
 EHE_wd_impact_timetable:0 "The Impact Timetable"
 EHE_wd_impact_timetable_desc:0 "Quarterly targets for every ministry until the asteroid passes."
 EHE_wd_stripped_for_parts:0 "Stripped for Parts"
 EHE_wd_stripped_for_parts_desc:0 "Part of the fleet grounded so that the rest can run."
 EHE_wd_forward_spares:0 "Spares Bought Forward"
 EHE_wd_forward_spares_desc:0 "Two years of parts bought at wartime prices."
 EHE_wd_parts_register:0 "The Parts Register"
 EHE_wd_parts_register_desc:0 "One list of every spare part held by every service."
 EHE_wd_home_spares:0 "Spares Made at Home"
 EHE_wd_home_spares_desc:0 "Common spare parts tooled up in the existing works."
 EHE_wd_order_books:0 "Order Books Reopen"
 EHE_wd_order_books_desc:0 "Foreign suppliers deliver on time again."
 EHE_wd_extra_tapping:0 "An Extra Tapping Round"
 EHE_wd_extra_tapping_desc:0 "Growers paid for one more round before the rains."
 EHE_wd_storm_watch:0 "The Storm-Season Watch"
 EHE_wd_storm_watch_desc:0 "Lifeboat crews and patrols on alert through the storm months."
 EHE_wd_extra_staff_term:0 "An Extra Staff Term"
 EHE_wd_extra_staff_term_desc:0 "Another class of captains through the hill school."
 EHE_wd_sheds_inspected:0 "Sheds Inspected"
 EHE_wd_sheds_inspected_desc:0 "Spares counted and rotated in every depot."
 ac_wd_ehe.1.t:0 "An Election Nobody Scheduled"
 ac_wd_ehe.1.d:0 "The date printed in the statute book came and went without a proclamation. No ballots were printed, no polling halls were opened, and the National Administration issued only a short notice saying that the calendar would be reviewed when conditions allowed. Echea has been governed in that conditional tense ever since, by an office that carries the democratic party's name while almost nobody in the country carries its vote.\n\nThe arithmetic is the problem. Nearly half the country stands with the non-aligned establishment of officials, port owners, estate families and works managers, who value calm above any creed. The other half, by a whisker more, follows the nationalist bloc, which promises a firmer state and says openly that it would win any honest count. Each side suspects the Administration of planning to cheat the other.\n\nThis morning a group of district notables delivered a sealed letter to the capital centre asking for one thing only: a date. They do not say which date, or who should win. Ministers must decide whether to answer in public, where every camp will read the reply and organise around it, or to keep the matter inside the ministries a while longer.\n\nProvisional gameplay."
 ac_wd_ehe.1.a:0 "Publish the letter and invite petitions."
 ac_wd_ehe.1.b:0 "Acknowledge it privately and wait."
 ac_wd_ehe.2.t:0 "Petitions from Six Districts"
 ac_wd_ehe.2.d:0 "Three weeks after the letter was printed, the post office in the capital centre began to fill with petitions. They arrived by truck from District A, by fishing boat and canoe from the coast of District D, down the mule tracks from District C and with hired drivers from the desert hills of District F. Clerks have counted more signatures than there are names on the old voter rolls.\n\nThe petitions do not agree with each other. Bloc committees demand a vote within the year and new rolls drawn up by their own volunteers. Estate families and port owners ask for a date far enough away to settle the economy first. Village councils from the jungle coast mostly ask for roads, clinics and a ballot box they can actually reach.\n\nWhatever the government does with this paper, it has created an expectation. Filing the petitions unanswered would tell every signer that the letter was a trap; answering them all would take months the ministries do not have. The Administration's lawyers suggest a middle course, which pleases nobody and may still be the wisest one on offer.\n\nProvisional gameplay."
 ac_wd_ehe.2.a:0 "Answer every district in public."
 ac_wd_ehe.2.b:0 "Publish a summary and a timetable for replies."
 ac_wd_ehe.2.c:0 "File them and thank the signers."
 ac_wd_ehe.3.t:0 "Two Ships and a Long Coast"
 ac_wd_ehe.3.d:0 "The coastal service's annual report reaches the cabinet with a map folded inside it. The map shows four districts with sea frontage, a naval base at the capital centre, two coastal escorts and the tracks they actually sailed last year. The tracks cluster around the capital. Along the jungle shore of District D and the bays of District E there are long stretches nobody patrolled at all.\n\nFishermen from those coasts complain of foreign trawlers working inside the limits and of boats lost in storms with nobody to answer their radios. Merchant masters complain about silted channels and charts drawn generations ago. Officers complain that half their budget goes on keeping two hulls seaworthy and the other half on fuel for patrols that cannot cover the coast anyway. Nobody disputes the complaints; everyone disputes the cure.\n\nThe report ends with a question rather than a request. Should the service try to be a small navy, or a large coast guard, or something in between that the country can afford? The cabinet cannot answer that today, but it can decide what the service does this year while the argument continues.\n\nProvisional gameplay."
 ac_wd_ehe.3.a:0 "Send the escorts on the long patrol."
 ac_wd_ehe.3.b:0 "Keep them near the capital and save fuel."
 ac_wd_ehe.4.t:0 "Half Shifts at the Arms Works"
 ac_wd_ehe.4.d:0 "The works office's count is blunt. Five arms lines in District A, the capital and District E can turn out rifles, support equipment, motor transport and a few fighters a year. The army they supply has six battalions in four formations, and in most months it orders less than two of those lines could make. The rest of the capacity sits on half shifts, paid for and idle.\n\nWorkers on half shifts are not idle by choice. Their unions want full time or new work. Managers want export licences, or at least a guaranteed order book. The army wants a stock of replacements it can draw on in a hard month, and the treasury wants to know why it funds machine halls that make nothing for days at a time.\n\nThree answers are already circulating in the ministries: sell abroad, build ahead, or turn the lines to repair work. Each has a constituency, and each closes doors the others would open. For now the cabinet must decide only how to pay for the coming quarter while the real decision is prepared. The unions have asked to be heard before anything is signed.\n\nProvisional gameplay."
 ac_wd_ehe.4.a:0 "Pay full shifts and build stock meanwhile."
 ac_wd_ehe.4.b:0 "Keep the half shifts and save the money."
 ac_wd_ehe.5.t:0 "Who Owns the Trees"
 ac_wd_ehe.5.d:0 "The agricultural clerks came back from the jungle districts with sunburn, fever and a count nobody expected. Rubber grows in thousands of small family groves scattered across District A, the capital district and District E, and in a smaller number of large estates that produce most of the latex actually sold abroad. Ownership turns out to be murkier than the count.\n\nMany family groves sit on land the estates also claim. Many estates rely on tappers who own a few rows of their own and sell to whoever pays on the day. Middlemen buy latex forward from desperate families in bad years and sell it at a profit in good ones. Everyone agrees the system is unfair; everyone disagrees about whom it is unfair to. Some families have tapped the same trees for three generations without ever seeing a deed.\n\nThe clerks' report recommends no model. It does recommend that the government choose one soon, because every season of uncertainty sees more trees go untapped and more families leave for the capital. Ministers can begin by protecting the tappers, by reassuring the estates, or by keeping both waiting while the argument is prepared.\n\nProvisional gameplay."
 ac_wd_ehe.5.a:0 "Promise the tappers a hearing first."
 ac_wd_ehe.5.b:0 "Reassure the estate owners."
 ac_wd_ehe.6.t:0 "A District Without a Road"
 ac_wd_ehe.6.d:0 "The walking team's report runs to three volumes and a box of photographs. District D, it says, is a coast of river mouths and jungle valleys where most villages are reached by boat or by footpath. There is no graded road, no factory, no hospital and no permanent government office anywhere in the district. Most villagers have never met an official who did not want taxes.\n\nThe team found reasons for hope as well. Villages trade fish, fruit and handicrafts along the coast; river mouths make natural harbours; young people want schooling and work and are leaving for the capital to find them. Families have been clearing jungle plots for decades without papers, and they are anxious to know whether the land is theirs. Several villages have built their own schoolrooms and are still waiting for a teacher.\n\nThe report ends with a plain recommendation: that the government open an office in the district before it does anything else, so that whatever comes next is planned with the people who will live with it. Ministers already disagree about roads and boats, and about what any of it will cost.\n\nProvisional gameplay."
 ac_wd_ehe.6.a:0 "Open the district office this year."
 ac_wd_ehe.6.b:0 "Send the report to committee."
 ac_wd_ehe.7.t:0 "Six Battalions, Two Frontiers"
 ac_wd_ehe.7.d:0 "The muster took a month and told the general staff what it already feared. Of the six battalions, most are stationed near the capital and the coast, one sits beside the logistics centre in District A, and detachments are spread thin along the inland frontiers. None could reach the upper valleys of District C in less than three days, or the far side of the District F hills in less than four.\n\nThe inland districts are threatened by nobody today. Their frontiers with Central Sotoa, Sotoa and Aemurraq are quiet, crossed by traders and herders and checked by customs posts. But the staff plans for decades rather than for today, and its officers are divided between those who think the hills must be held by troops who live in them and those who think the real danger lies on the coast.\n\nBefore either school wins, the staff needs roads, signals and a doctrine everyone can train to. The cabinet is asked to approve a programme of surveys, exercises and engineering work. Which doctrine follows is left, for now, to the officers who will argue about it.\n\nProvisional gameplay."
 ac_wd_ehe.7.a:0 "Approve the full programme."
 ac_wd_ehe.7.b:0 "Approve the surveys only."
 ac_wd_ehe.8.t:0 "All the Wing on One Runway"
 ac_wd_ehe.8.d:0 "The wing commander's briefing to the cabinet uses a single photograph of the capital air base, taken from a light aircraft at dawn. Every one of the country's twenty-four fighters is visible in it, parked in two neat rows beside the only runway. The commander points out that a single attack, or a single fuel fire, could end the air arm in an afternoon.\n\nThe wing has other problems. Its pilots fly fewer hours than they need because spare parts are scarce. Its radar is a set in the control tower that sees little beyond the coast. Its ground crews are good but few, and when an aircraft breaks, it waits. Meanwhile ministries ask why none of the country's aircraft can fly a doctor to District D. Two reserve airframes have been robbed of parts so often that they no longer count as aircraft.\n\nThe commander asks for money for runways and dispersal first, and a decision about the wing's purpose second. Some ministers would rather settle the purpose first and buy the concrete afterwards. Either way the wing will need to change, and the cabinet must choose how much to spend this year to start.\n\nProvisional gameplay."
 ac_wd_ehe.8.a:0 "Fund the runways now."
 ac_wd_ehe.8.b:0 "Ask for a plan before any money."
 ac_wd_ehe.9.t:0 "The Asteroid Will Strike"
 ac_wd_ehe.9.d:0 "When the President of the FCU announces to the world in April 1996 that Ulysses will strike the Earth, the impact committee's contingency papers stop being contingencies. Nobody in the capital knows where fragments will fall. The announcement does not say, and the astronomers say only that their estimates will be refined month by month.\n\nMarkets react faster than governments. Grain, fuel and shipping insurance rise in every port Echea trades with. Families with savings buy tinned food and lamp oil; families without savings watch the prices. The nationalist bloc demands emergency powers for whoever governs, and the port owners demand that nobody panic. Both demands are printed side by side in the morning papers.\n\nThe committee lays two plans before the cabinet. One would move the coastal population inland to refuges in the mountains of District C; the other would keep people at home and move them by sea if warning came. Both are expensive and neither can be ready for years. The cabinet is asked first how to speak to the country tonight. Whatever it says will be repeated in every district by morning.\n\nProvisional gameplay."
 ac_wd_ehe.9.a:0 "Speak plainly: plans, costs and uncertainty."
 ac_wd_ehe.9.b:0 "Promise protection and leave the details to the committee."
 ac_wd_ehe.10.t:0 "Ulysses Inside the Roche Limit"
 ac_wd_ehe.10.d:0 "In July 1999 the asteroid Ulysses passes through the Roche limit of the Earth. In the capital the impact committee sits through the night in a basement room with radios, telephones and a wall of charts nobody can update fast enough. The coastal service has its escorts at sea, the air wing has crews in the cockpits and the field hospitals are packed on trucks.\n\nReports arrive out of order and contradict each other. Foreign stations read statements from astronomers, then retract them. Radio amateurs on the coast of District D report lights over the sea that might be fragments, aircraft or nothing at all. The committee chair insists that no order be given without two confirmations, and so for hours almost no orders are given.\n\nBy dawn the committee has learned how much its plans depended on information it never had. The question now is what to keep: the readiness, which costs money every day, or the calm that comes from standing it down. Either choice will be second-guessed for years. Ministers who sat through the night are already arguing about which of them was right.\n\nProvisional gameplay."
 ac_wd_ehe.10.a:0 "Keep the readiness for another year."
 ac_wd_ehe.10.b:0 "Stand down and count the cost."
 ac_wd_ehe.11.t:0 "Deliveries Postponed Indefinitely"
 ac_wd_ehe.11.d:0 "The letters arrive in the same week from suppliers in three countries. Engine parts for the escorts, radio sets for the battalions, bearings for the fighter line and replacement spindles for the machine tools in the capital works will ship late, the letters say, or not at all. Erusea's invasion of San Salvacion has started a war, and every factory that can build for it has a new customer.\n\nEchea's armed services run on a sustainment doctrine: few machines, kept working for a long time. That doctrine assumes that parts can be ordered. Within a month the coastal service reports one escort waiting on a pump, the air wing grounds four fighters for want of hydraulic seals, and truck parks in two districts are cannibalising vehicles to keep the rest moving.\n\nThe treasury and the general staff bring two answers to the cabinet: strip part of the fleet to keep the rest running, or pay whatever the market demands for parts bought forward. Before either is chosen, ministers must decide what to tell the services about the months immediately ahead. The services want an answer before the month is out.\n\nProvisional gameplay."
 ac_wd_ehe.11.a:0 "Order the services to conserve every part."
 ac_wd_ehe.11.b:0 "Promise emergency money for the worst shortages."
 EHE_wd_calendar_cabinet_office:0 "Cabinet of the Restored Calendar"
 EHE_wd_calendar_cabinet_office_desc:0 "A cabinet named by the chamber elected at the postponed vote, governing collectively with the next polling day fixed in law. Provisional gameplay office with no named holder."
 EHE_wd_secretariat_office:0 "The Permanent Secretariat"
 EHE_wd_secretariat_office_desc:0 "A collective of department heads holding the seals under published standing orders, with no polling day set. Provisional gameplay office with no named holder."
 EHE_wd_bloc_executive_office:0 "Executive of the National Bloc"
 EHE_wd_bloc_executive_office_desc:0 "An executive drawn from the leadership of the nationalist bloc, ruling by decree with bloc officials beside every district governor. Provisional gameplay office with no named holder."
 ac_wd_ehe_decisions:0 "Echea: National Measures"
 ac_wd_ehe_decisions_desc:0 "Measures from the national programme of Echea. Provisional gameplay unless a source ledger row says otherwise."
 EHE_wd_tapping_round_decision:0 "Pay for an Extra Tapping Round"
 EHE_wd_tapping_round_decision_desc:0 "The buying office pays growers for one more tapping round before the rains. Repeatable once a year; the trees need rest between rounds."
 EHE_wd_storm_watch_decision:0 "Stand Up the Storm-Season Watch"
 EHE_wd_storm_watch_decision_desc:0 "Lifeboat crews and patrol craft go on alert for the storm months, at the cost of fuel and crew rest. Repeatable once a year."
 EHE_wd_creek_bridges_decision:0 "Bridge the Last Creeks in District D"
 EHE_wd_creek_bridges_decision_desc:0 "Engineers bridge the creeks that still cut the coast in the wet season. A one-time works programme."
 EHE_wd_depot_second_hall_decision:0 "A Second Hall at the District F Depot"
 EHE_wd_depot_second_hall_decision_desc:0 "Funds a second workshop hall at the desert depot once the first is running. A one-time charge on the works budget."
 EHE_wd_extra_staff_term_decision:0 "An Extra Term at the Hill School"
 EHE_wd_extra_staff_term_decision_desc:0 "Another class of captains passes through the staff school, leaving their units short for six months. Repeatable once a year."
 EHE_wd_sheds_inspection_decision:0 "Inspect the Spares Sheds"
 EHE_wd_sheds_inspection_decision_desc:0 "Inspectors count and rotate the spares in every depot and publish the shortfalls. Repeatable every six months; quartermasters resent it."
