 OSE_camp_2_register:0 "Authority under suspicion"
 OSE_camp_2_register_desc:0 "Authority under suspicion. Open the campaign lane and its preparation record.\n\nThe disputed order is less dramatic than the investigator expected. It contains no confession, only a time that cannot be reconciled with the original message. To keep it means protecting the people who noticed. To disclose it means choosing an audience while the fighting continues. Rescue coverage, evidence custody and support for a real foothold compete for the same administrative attention. The branch makes those commitments available without pretending that a clean report repairs the damage already done to confidence inside the squadron."
