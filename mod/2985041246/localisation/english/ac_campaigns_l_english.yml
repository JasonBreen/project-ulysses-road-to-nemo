 ac_camp.95.t:0 "A complaint worth hearing"
 ac_camp.95.desc:0 "Chopper objected to the receiving room's choice of chair before asking whether anybody had brought something to drink. The orderly was trying to decide which part of the complaint required a medical answer when Nagase came in and took the spare seat.\n\nGrimm followed with the confidence of a man carrying out a task he had been able to understand completely. He put the drink where Chopper could reach it, then stood beside the door as though waiting for another instruction.\n\nThe rescue had brought their friend back. It had not supplied the old ease with which the squadron had once entered a room together. For a moment each of them seemed to be deciding which ordinary remark would survive the significance being placed on it.\n\nChopper made the decision for them by complaining about the chair again.\n\nNagase asked the orderly whether a different one could be found. The seriousness with which she asked finally made Chopper laugh. Grimm sat down. From the corridor came the sound of someone being redirected toward another receiving office, followed by a door closing too hard.\n\nThere would be later questions about duty, recovery and who had been held in reserve to make this return possible. They did not need to be answered during the first conversation in which the person at the center of them could interrupt.\n\nThe orderly went to look for another chair. When he returned, the three were discussing something he could not follow. He placed it beside them without asking for an explanation, pleased that the room had finally acquired a problem he could solve."
