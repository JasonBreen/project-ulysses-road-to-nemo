 ac_release_AWW_develop_civilian:0 "Develop a civilian workshop"
 ac_release_AWW_develop_civilian_desc:0 "Fund one additional civilian factory in the current controlled core capital. Costs 100 political power and 0.02b in full economy mode or 20 FU in legacy mode; fiscal-disabled campaigns pay the political cost. Takes 90 days. One successful project of each type per country. Loss of control, annexation, capitulation or lost slots can interrupt it; spent funds are not refunded. No cores, population, deposits or financial balances are granted."
 ac_release_AWW_cancel_civilian:0 "Cancel develop a civilian workshop"
 ac_release_AWW_cancel_civilian_desc:0 "Stop this funded project. Costs already spent are not refunded. A 30-day cooldown applies before another development project."
 ac_release_AWW_develop_military:0 "Develop a maintenance arsenal"
 ac_release_AWW_develop_military_desc:0 "Fund one additional military factory in the current controlled core capital. Costs 100 political power and 0.02b in full economy mode or 20 FU in legacy mode; fiscal-disabled campaigns pay the political cost. Takes 90 days. One successful project of each type per country. Loss of control, annexation, capitulation or lost slots can interrupt it; spent funds are not refunded. No cores, population, deposits or financial balances are granted."
 ac_release_AWW_cancel_military:0 "Cancel develop a maintenance arsenal"
 ac_release_AWW_cancel_military_desc:0 "Stop this funded project. Costs already spent are not refunded. A 30-day cooldown applies before another development project."
 ac_release_AWW_maintenance:0 "Release administration and maintenance"
 ac_release_AWW_maintenance_desc:0 "Current capacity determines what this government can support. Baseline transport stock is a once-only future-release grant:2 trains,12 trucks and6 convoys; existing saves receive none. Paid projects do not change territorial settlements or cores. Fuel imports, reinforcement deficits and manual production rotation remain visible responsibilities. AWW and non-core treaty governments retain their inherited recruitment and capacity limits."
 ac_release_AWW_research_name:0 "Domestic maintenance priorities"
 ac_release_AWW_research_desc:0 "Prioritize affordable industry, infantry, technical support and communications. Maintain existing formations; future recruitment still needs real manpower and equipment. Small governments should rotate limited air and naval production manually."
