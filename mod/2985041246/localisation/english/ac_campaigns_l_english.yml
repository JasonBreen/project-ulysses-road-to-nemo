 ac_camp.69.t:0 "The last plot on the screen"
 ac_camp.69.desc:0 "The room had exhausted the ordinary ways of asking for an update. Nobody wanted to interrupt the operators, and everybody wanted to know whether the last report meant what they hoped it meant. The officer standing behind the plotting desk folded his arms, unfolded them, and finally put his hands on the back of an empty chair.\n\nThe verified return supplied the answer they had been waiting for. The last plot on the screen no longer represented a threat descending toward a city. Beyond the operations room, people who had no reason to know the crews' names would continue with an evening that those crews had just helped preserve.\n\nThe controller passed the verified return to the receiving officer. Around them, the command began to separate the questions that had depended on the interception from those that had merely been waiting behind it. There were forces still fighting. There was another government whose acceptance could not be entered on the strength of an allied success. There were investigators whose evidence had become more vulnerable precisely because so many people wanted the crisis to be over.\n\nA technician sat down abruptly, as if remembering that the chair had been there all along. Someone brought water. The ordinary gesture spread through the room with an efficiency no instruction had managed during the previous hour.\n\nThe officer began preparing the reciprocal terms. He left the field marked Accepted empty. The next stage required two governments to agree on what they could enforce, and the operators had just supplied a powerful reason to stop pretending that an intended outcome was the same thing as a completed one."
 ac_camp.69.a:0 "Keep this account."
 ac_camp.69.z:0 "Close this old message."
