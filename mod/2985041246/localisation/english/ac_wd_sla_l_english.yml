l_english:
 SLA_wd_adm_due:0 "The Calendar Runs Out"
 SLA_wd_adm_due_desc:0 "The last national vote in Slavia was held on 9 November 1987, and the inherited four-year calendar puts the next one in November 1991. The National Administration has governed without calling it and without saying why. Before anyone argues about the answer, the Administration must admit in public that the question exists, and that admission alone costs it authority."
 SLA_wd_adm_canteens:0 "Hearings in the Works Canteens"
 SLA_wd_adm_canteens_desc:0 "Most Slavian voters work a shift in an arms hall, a civil works or the harbour, so the Administration sends officials to the canteens at shift change. They answer questions over the noise of the lunch queue and write down every complaint. The hearings are cheap and humbling, and they reach people no party office has ever bothered to visit."
 SLA_wd_adm_rolls:0 "Correct the Electoral Rolls"
 SLA_wd_adm_rolls_desc:0 "The rolls compiled for 1987 still list the dead, the emigrated and families who moved across the city years ago. A team of clerks checks every block against the housing and ration registers. Whatever form of government follows, it will need to know who lives in the republic. The clerks also learn which blocks stopped answering letters long ago."
 SLA_wd_adm_four_answers:0 "Four Answers on the Table"
 SLA_wd_adm_four_answers_desc:0 "By the end of the hearings four answers have hardened. Some want the overdue ballot held and a federation built on it. The managers of the halls and the harbour want to govern as a board. The works delegates want the councils to take the keys. The defence staff, trusted by a city that expects to fight, offers itself. Only one answer can win."
 SLA_wd_adm_four_answers_tt_1:0 "Opens four constitutional paths; only one can be taken."
 SLA_wd_adm_ballot_path:0 "Hold the Overdue Ballot"
 SLA_wd_adm_ballot_path_desc:0 "The first answer is the simplest to explain and the hardest to carry out: hold the vote that fell due in November, on rolls the clerks have corrected, and let a chamber of the Slavian Federation form the government. Only a sliver of voters backs the democratic party today, so the Administration would hand power to institutions that barely exist."
 SLA_wd_adm_board_path:0 "The Managers Offer a Board"
 SLA_wd_adm_board_path_desc:0 "Directors of the five arms halls, the two civil works, the harbour and the banks propose to govern the republic as one board, setting budgets the way a company does and choosing ministers for competence. Output would rise and decisions would come quickly. Ordinary Slavians would see their country run by the people who already sign their wage packets."
 SLA_wd_adm_works_path:0 "The Councils Ask for the Keys"
 SLA_wd_adm_works_path_desc:0 "Close to a quarter of the city votes communist, and that strength is packed onto the shop floors of the arms halls. Its delegates propose a federation of works councils, each hall and dock electing its share of one national council. Workers would hold real power for the first time. The managers and the defence staff would lose theirs, and are already saying so."
 SLA_wd_adm_defence_path:0 "The General Staff Offers Itself"
 SLA_wd_adm_defence_path_desc:0 "Nine in ten Slavians say they would defend the city if it came to that, and the defence staff reads the figure as a mandate. It offers a board of senior officers to govern under an ordinance of defence, with civil ministries taking their priorities from the general staff. The city would be ready for anything except argument, which it would no longer be allowed."
 SLA_wd_adm_federal_council:0 "A Council Chosen by the Chamber"
 SLA_wd_adm_federal_council_desc:0 "The chamber elected on the overdue ballot chooses a federal council to govern collectively, and the Slavian Federation takes the place of the old republic. The change runs through the office, not a person. The council answers to the chamber for every budget and appointment, and inherits an arms economy and a defence staff it has never once commanded."
 SLA_wd_adm_managers_board:0 "Install the Board of Managers"
 SLA_wd_adm_managers_board_desc:0 "The board of managers takes the seals of government and the Administration's clerks become its staff. Elections stay suspended while the board publishes quarterly accounts in their place. It is a government that knows exactly what every hall produces and very little about what every household needs. The office governs collectively; no single person holds it."
 SLA_wd_adm_works_federation:0 "Proclaim the Federation of the Works"
 SLA_wd_adm_works_federation_desc:0 "Delegates of the halls, the civil works and the docks convene as a federative council and proclaim the Slavian Federative Socialist Republic. Managers may stay on as employees of the councils if they accept the terms. The council governs collectively under rules of its own making. Production meetings replace board meetings, and the very first of them runs past midnight."
 SLA_wd_adm_defence_board:0 "Swear In the Defence Board"
 SLA_wd_adm_defence_board_desc:0 "A board of senior officers takes its oath before both infantry formations on the parade ground and assumes executive power under the ordinance of defence. Parties are suspended for a duration the ordinance does not define. The board governs collectively and names no chief. Readiness is now the republic's constitution, and that constitution reads like a staff manual."
 SLA_wd_adm_two_readings:0 "Every Law Read Twice"
 SLA_wd_adm_two_readings_desc:0 "The federal chamber adopts one simple rule: each bill is read twice, a month apart, and printed in the newspapers between the readings. Laws pass slowly and lobbyists get a month to complain. In return nobody in Lhesk can claim a law was sprung on them, which matters in a republic that had not voted since 1987."
 SLA_wd_adm_board_wall:0 "Targets on the Board Room Wall"
 SLA_wd_adm_board_wall_desc:0 "Each director's targets for output, cost and harbour tonnage go up on the board room wall and into print every month. Directors who miss them twice are replaced. The method rewards whatever can be counted and ignores whatever cannot, so housing and schools fall behind the halls. The managers call that focus; their critics call it neglect."
 SLA_wd_adm_open_books:0 "Open the Books of Every Hall"
 SLA_wd_adm_open_books_desc:0 "Every hall, works and dock publishes its accounts to the people who work in it, line by line, including what the former managers were paid. Delegates spend weeks learning to read a balance sheet. Waste falls once everyone can see it, and so does the comfort of those who used to hide it. Foreign creditors politely ask for copies as well."
 SLA_wd_adm_reserve_roll:0 "Every Adult on the Reserve Roll"
 SLA_wd_adm_reserve_roll_desc:0 "The board enters every adult in the republic on a single reserve roll, with an assignment, an assembly point and a yearly drill. In a country of one province the roll is short enough to keep current by hand. It turns the city's eagerness to fight into organised readiness, at the price of a population that always feels half on duty."
 SLA_wd_adm_settled:0 "The Settlement in Print"
 SLA_wd_adm_settled_desc:0 "Whichever answer prevailed, the government prints a short text explaining who governs, how they are chosen and how the arrangement may be changed. Copies sell at every kiosk in the city for the price of a newspaper. It ends years of rumour about what the Administration intended, and hands the next quarrel a document to argue over."
 SLA_wd_city_ledger:0 "Survey Every Street of Lhesk"
 SLA_wd_city_ledger_desc:0 "Slavia is a single province, and that province is the city of Lhesk and the plain around it. There are no regions to balance, only streets, blocks, drains and wells, and nobody has counted them in a generation. A survey team walks the whole republic in one season. Every complaint the canteens raise can now be checked against a map."
 SLA_wd_city_drains:0 "Storm Drains Before the Rains"
 SLA_wd_city_drains_desc:0 "From January to May heavy rain sweeps in off the sea, and the plain never properly dries; mud is a fact of life in every month. The worst streets flood each spring and lorries bog down outside the arms halls. Clearing and widening the storm drains is dull engineering that every household notices, and it costs a season of torn-up roads."
 SLA_wd_city_cisterns:0 "Cisterns for the Dry Months"
 SLA_wd_city_cisterns_desc:0 "Between June and September the rain stops and the afternoon heat climbs into the high thirties. The city mains lose pressure every afternoon and the upper floors run dry. Rooftop and street cisterns, filled in the wet season and drawn down through the summer, cost little and need constant inspection. The alternative is a summer of queues at the standpipes."
 SLA_wd_city_flats:0 "Flats Within Walking Distance"
 SLA_wd_city_flats_desc:0 "Workers in the arms halls live in crowded blocks across the city and lose an hour each way on buses that crawl through the mud. New flats on empty lots beside the halls shorten the journey and ease the crowding. The lots belong to the halls, which were keeping them for an expansion that the full slot count says will never come."
 SLA_wd_city_wards:0 "Elected Ward Committees"
 SLA_wd_city_wards_desc:0 "Using the corrected electoral rolls, each ward of Lhesk elects a committee with a small budget for its own drains, lamps and markets. The committees are slow and noisy, and some will be captured by whoever turns out on a wet evening. Unless the national ballot comes first, they will be the first bodies anyone in Slavia has elected since 1987."
 SLA_wd_city_manager:0 "One Manager for the Whole City"
 SLA_wd_city_manager_desc:0 "The opposite answer appoints a single city manager with authority over every street, pipe and permit, answerable to the national government rather than to the wards. In a country that is one city, the manager is in effect a second prime minister for daily life. Works go faster and complaints have one address, which may or may not reply."
 SLA_wd_city_ward_purses:0 "Ward Purses and Ward Accounts"
 SLA_wd_city_ward_purses_desc:0 "Committees that survive their first year receive a fixed share of the city budget and must publish what they spend it on. Some build playgrounds, some fix roofs and one buys a fire engine. Waste becomes visible and local, which makes it easier to stop. The national ministries lose a little control over the street, and grumble about it."
 SLA_wd_city_works_schedule:0 "The Manager Ranks the Works"
 SLA_wd_city_works_schedule_desc:0 "The city manager publishes one ranked schedule of works for the whole republic: drains first, then housing, then roads, then everything else. Projects move up the list only by the manager's decision. The schedule is efficient and infuriating. Wards with priorities of their own learn to lobby a single office, and the office learns to say no."
 SLA_wd_city_trams:0 "Trams Along the Harbour Road"
 SLA_wd_city_trams_desc:0 "A tram line on the road between the harbour and the arms halls carries shift workers on rails instead of through mud. Laying it means a year of diversions and a loan the treasury dislikes. Once running it moves more people than the buses ever did, and it keeps moving in the wet season when the buses stall."
 SLA_wd_city_federal_seats:0 "Wards Send Members to the Chamber"
 SLA_wd_city_federal_seats_desc:0 "Under the Federation each ward of Lhesk becomes a constituency and sends its own member to the federal chamber. Members can be found at their ward office on a weekday, which suits voters and exhausts members. A commission must draw the boundaries, and every party watches its pencil. Local grievances now reach the chamber by name."
 SLA_wd_city_charter:0 "The Charter of Lhesk"
 SLA_wd_city_charter_desc:0 "The city government and the national government are, in practice, the same people, and the charter finally says where one ends and the other begins. Streets, markets, water and transport go to the city; defence, money, the harbour and foreign affairs stay national. Lawyers will argue about the edges for years. The middle is settled."
 SLA_wd_ars_inventory:0 "Inventory of the Arms Halls"
 SLA_wd_ars_inventory_desc:0 "Five arms halls dominate Slavian industry, against only two civil works, and every building slot in the province is taken. The republic cannot grow by building; it can only change what its halls make and how well they make it. An inventory of every press, lathe, payroll and order book comes first, and the managers dislike outsiders counting."
 SLA_wd_ars_steel:0 "Steel from the Plain"
 SLA_wd_ars_steel_desc:0 "Slavia mines enough steel for its own halls and some to spare, but sells most of the ore raw and buys back finished plate. A contract that sends the ore to the civil works for rolling keeps more of the value at home. The civil works must turn away other orders to take it, and with no free slots nothing new can be built to help."
 SLA_wd_ars_light_metal:0 "Aluminium for the Air Guard"
 SLA_wd_ars_light_metal_desc:0 "The republic's aluminium deposits are modest but real, and the air guard's fighters need panels, ribs and spares that now come from abroad. A small airframe shop inside one of the arms halls reworks the metal into parts. It takes floor space from the rifle lines and needs sheet-metal workers the city must train. The guard promises to buy all of it."
 SLA_wd_ars_civil_lines:0 "Civil Lines in the Rifle Halls"
 SLA_wd_ars_civil_lines_desc:0 "One school of thought says a city at peace does not need five arms halls. It proposes running civil lines inside two of them, building pumps, vans, stoves and tram parts under a protected price. The halls keep their workers and their roofs. The defence staff loses capacity it may want back, and the export houses lose their best product."
 SLA_wd_ars_licensed_sales:0 "Rifles for Licensed Buyers"
 SLA_wd_ars_licensed_sales_desc:0 "The export school says the halls are the republic's one comparative advantage and should sell to any government the cabinet licenses. Credit, a sales office at the harbour and a published licence list would keep every line busy. Revenue arrives quickly. So does the question every Slavian abroad will hear: whose wars are the rifles from Lhesk in?"
 SLA_wd_ars_garrison_halls:0 "An Arsenal for the City Alone"
 SLA_wd_ars_garrison_halls_desc:0 "The third school keeps all five halls on the republic's own orders, building reserves for the two formations and the air guard instead of selling abroad or converting. The city would never run short of rifles or shells. It would also pay for stock that sits in sheds, and the halls would lose the discipline of customers who can say no."
 SLA_wd_ars_vans:0 "Delivery Vans Off the Rifle Lines"
 SLA_wd_ars_vans_desc:0 "The first civil order is a light delivery van built on a frame the old rifle presses can stamp out. Shopkeepers, ward committees and the harbour office all want one. The vans are plain and a little overweight. They prove the halls can make something other than weapons, and they bring peacetime wages into households that only knew war work."
 SLA_wd_ars_end_users:0 "End-User Certificates at the Quay"
 SLA_wd_ars_end_users_desc:0 "Every crate of rifles leaving the harbour now carries a certificate naming its buyer and end use, checked by customs and published once a year. Some buyers go elsewhere rather than sign. The certificates cannot stop resale, but they let the republic state what it intended, and refuse anyone who lied to it the last time."
 SLA_wd_ars_magazines:0 "Magazines Beneath the Halls"
 SLA_wd_ars_magazines_desc:0 "Stock built for the city's own reserve goes into magazines dug under the arms halls, dry, ventilated and guarded. A formation cut off in its own neighbourhood could draw rifles and rounds without crossing the city. The digging takes a year and the halls work around the noise. These are the most expensive cellars in Lhesk."
 SLA_wd_ars_council_prices:0 "The Councils Price the Contracts"
 SLA_wd_ars_council_prices_desc:0 "Under the Federation of the Works the council of each hall sets the price of its own contracts, and a national council settles disputes between halls. Prices fall where workers find waste and rise where they find danger. Foreign buyers must now bargain with elected delegates instead of managers, and a few of them say they prefer it."
 SLA_wd_ars_cool_shifts:0 "Shifts in the Cool Hours"
 SLA_wd_ars_cool_shifts_desc:0 "In July and August the arms halls are ovens by noon; output drops while accidents climb. Moving heavy work to the night and early morning, with a long break through the afternoon heat, costs night allowances and upsets every family's routine. The halls run cooler and safer, and the city learns to sleep through the sound of lathes."
 SLA_wd_ars_silo:0 "Never Let the Silo Run Low"
 SLA_wd_ars_silo_desc:0 "Slavia pumps a little oil from the plain and stores its fuel in a single silo. In a crisis that silo is the republic's whole margin. Keeping it full means buying ahead of need and working the local wells harder. The treasury dislikes paying for fuel that sits still; the defence staff dislikes the thought of it standing empty."
 SLA_wd_ars_ten_years:0 "The Halls After Ten Years"
 SLA_wd_ars_ten_years_desc:0 "Ten years after the first inventory the treasury repeats it hall by hall and sets the two side by side. The comparison shows which model the republic chose and what the choice cost in jobs, debt and readiness. It is published in full. Whatever the managers think of the figures, the next government will start from numbers, not slogans."
 SLA_wd_hbr_office:0 "A Harbour Office for the Republic"
 SLA_wd_hbr_office_desc:0 "Slavia has a naval base, a long quay and sixty convoys on its register, but no warships, and it has never asked for any; the harbour belongs to cargo. A single harbour office takes over berths, pilots, dues and the convoy list from four ministries that each did a quarter of the job. The ministries are not grateful to lose them."
 SLA_wd_hbr_channel:0 "Dredge the Harbour Mouth"
 SLA_wd_hbr_channel_desc:0 "Every wet season the rain carries silt off the plain into the harbour mouth, and every summer the channel is a little shallower. Larger ships now wait for the tide or anchor outside. A dredging contract restores the depth, and it must be renewed every few years. The cost is permanent, and so is the alternative, which is fewer ships."
 SLA_wd_hbr_fuel_jetty:0 "A Fuel Jetty to the Silo"
 SLA_wd_hbr_fuel_jetty_desc:0 "Imported fuel now comes ashore by hose and crosses the city by tanker lorry to reach the silo. A dedicated jetty and pipeline would land it directly and keep the tankers off the streets. It is a modest engineering job with an obvious target painted on it, and the defence staff asks for the line to be buried, which doubles the price."
 SLA_wd_hbr_breakwater_radar:0 "Radar on the Breakwater"
 SLA_wd_hbr_breakwater_radar_desc:0 "A surface radar at the end of the breakwater lets the harbour office see ships coming in through fog and rain, and lets the air guard see anything flying low over the water. It is the republic's first look beyond its own shore. The set is second-hand and its operators learn on the job. Ships stop arriving unannounced."
 SLA_wd_hbr_transit:0 "Transit Cargo Through Lhesk"
 SLA_wd_hbr_transit_desc:0 "The harbour could earn its keep handling cargo bound for other countries, landed at Lhesk and sent on by road. Transit fees would pay for the dredging and the office alike. The quay would fill with other people's goods and the city's roads with other people's lorries, and the republic's own imports would queue behind them in busy months."
 SLA_wd_hbr_home_first:0 "The Republic's Cargo First"
 SLA_wd_hbr_home_first_desc:0 "The other answer gives priority on every berth to the republic's own fuel, food, steel and parts, with transit accepted only when there is room. Ships carrying Slavian cargo never wait. Revenue is lower, and shippers looking for a dependable transit port go elsewhere. In a crisis the city knows its own supplies will be first ashore."
 SLA_wd_hbr_coast_watch:0 "Coast Watchers in Fishing Boats"
 SLA_wd_hbr_coast_watch_desc:0 "Without warships the republic's eyes at sea are the fishing crews and weekend sailors who go out every day. A volunteer coast watch gives them radios, a reporting card and a small fee for each sighting. Reports are patchy and often wrong. They are also nearly free, and they reach water no radar on the breakwater can see."
 SLA_wd_hbr_mates:0 "Classes for Mates and Masters"
 SLA_wd_hbr_mates_desc:0 "Slavian convoys depend on officers trained abroad, and the good ones leave for foreign lines. Evening classes for mates and masters at the harbour office let local sailors qualify at home. Foreign insurers must recognise the certificates, which takes a year of letters. The republic gains ship's officers who live in Lhesk and sail for it."
 SLA_wd_hbr_dues_formula:0 "Harbour Dues by Formula"
 SLA_wd_hbr_dues_formula_desc:0 "The board of managers replaces bargained harbour dues with a published formula based on tonnage, berth time and cargo class. Shippers who used to haggle lose their discounts; newcomers gain certainty. The board revises the formula once a year and posts it on the harbour office door. Revenue rises and favouritism has nowhere to hide."
 SLA_wd_grd_muster:0 "Muster of the Two Formations"
 SLA_wd_grd_muster_desc:0 "The army of Slavia is two infantry formations of four battalions each, every formation with an engineer company in support, all stationed in Lhesk because there is nowhere else to put them. A full muster on the parade ground counts every rifle, truck and reservist. The count runs short in some places and long in others, and both are news."
 SLA_wd_grd_street_schools:0 "Street-Fighting Schools"
 SLA_wd_grd_street_schools_desc:0 "Any war fought for Slavia would be fought in the streets of Lhesk, yet the formations train mostly in open fields. The engineers build a mock block of houses, cellars and courtyards on waste ground near the halls, and every battalion rotates through it. The training is slow, loud and hard on the neighbours, who complain about blanks at dawn."
 SLA_wd_grd_engineers:0 "Engineers Survey the Approaches"
 SLA_wd_grd_engineers_desc:0 "The engineer companies walk the three land approaches to the city on the Slavian side: the hills toward Valka in the west, the foot of the Seteranoan mountains in the north and the short plain road toward Seterano in the east. They map culverts, bridges and ground that turns to mud. No line is moved and nothing is built across a frontier."
 SLA_wd_grd_every_block:0 "Every Block a Strongpoint"
 SLA_wd_grd_every_block_desc:0 "The first doctrine accepts that two formations cannot hold a frontier and plans to hold the city instead, block by block, with prepared positions in cellars, courtyards and the arms halls themselves. An attacker would have to take Lhesk street by street. The plan writes off the approaches and asks the population to live inside a fortress."
 SLA_wd_grd_screen:0 "Screens on the Three Approaches"
 SLA_wd_grd_screen_desc:0 "The second doctrine posts light screens on the western hills, the northern foothills and the eastern road, with the main body held centrally on trucks to reinforce whichever approach is threatened. It depends on the engineers' maps and on roads that survive the wet season. It keeps the fighting outside the city, provided the screens hold."
 SLA_wd_grd_household_levy:0 "A Levy of Every Household"
 SLA_wd_grd_household_levy_desc:0 "The third doctrine trusts the city's readiness more than its regulars. Every household provides one trained adult to a neighbourhood company, armed from the halls and drilled at weekends. The formations become a hard core inside a mass of part-time soldiers. Training is thin, but the numbers are large for a country this size, and every street has defenders."
 SLA_wd_grd_cellars:0 "Knock Through the Cellars"
 SLA_wd_grd_cellars_desc:0 "Engineers open passages between the cellars of neighbouring buildings so that defenders can move beneath the streets. Owners are compensated, and some are still not pleased. The passages double as shelters and storerooms, which helps the case. A plan of the whole network is kept by the defence staff and by nobody else."
 SLA_wd_grd_crossroads:0 "A Reserve at the Crossroads"
 SLA_wd_grd_crossroads_desc:0 "The central reserve takes over a depot at the main crossroads of the city, with trucks fuelled and loaded and drivers sleeping on site. It can reach any of the three approaches before a screen is overrun, if the roads are passable. Fuel use climbs and the depot never sleeps. The screens finally believe someone is coming to help them."
 SLA_wd_grd_companies:0 "Companies by Neighbourhood"
 SLA_wd_grd_companies_desc:0 "The levy is organised into companies by neighbourhood, so that people drill beside those they live beside and would fight beside. Officers come from the formations; sergeants are elected. Local loyalty makes the companies cohesive and sometimes stubborn. Every neighbourhood now knows its assembly point, its armoury and its company's number."
 SLA_wd_grd_officer_school:0 "An Officer School by the Harbour"
 SLA_wd_grd_officer_school_desc:0 "Slavian officers have trained abroad or learned on the job. A school in old harbour buildings now teaches tactics, logistics and command for the republic's own conditions: mud, streets and three short approaches. The first classes are small and the instructors tired. Within a few years the formations will be led by officers trained for this ground."
 SLA_wd_grd_staff_college:0 "A Staff College Under the Board"
 SLA_wd_grd_staff_college_desc:0 "With the defence board in government, the general staff becomes the planning office of the state and needs more planners than it has. A staff college trains officers in budgets, supply and administration as well as operations. Graduates go to ministries as often as to battalions. The college makes the board competent, and its grip harder to loosen."
 SLA_wd_air_count:0 "Count the Air Guard"
 SLA_wd_air_count_desc:0 "The air guard of Slavia is twelve fighters on one field with four more in reserve, enough to watch the sky over a single province and little more. A count of pilots, mechanics, spares and fuel shows how many can actually fly on an ordinary morning. The answer is fewer than twelve, and the guard would prefer that nobody printed it."
 SLA_wd_air_second_runway:0 "A Second Runway Inland"
 SLA_wd_air_second_runway_desc:0 "One runway means a single bomb or a burst tyre closes the whole air guard. A second runway on the inland edge of the plain, with taxiways and fuel points, lets the fighters keep flying if the first is out of action. The ground is soft in the wet season and must be drained deep before any concrete is poured. The work is costly and permanent."
 SLA_wd_air_radar_ring:0 "Radars on the Three Approaches"
 SLA_wd_air_radar_ring_desc:0 "The air guard can only intercept what it can see, and today it sees mostly what pilots report by radio. Radar sets covering the western hills, the northern mountains and the sea give warning of anything approaching. The mountains mask part of the northern view. The sets need crews, power and spares, all of which compete with the halls."
 SLA_wd_air_alert:0 "Pairs on Five-Minute Alert"
 SLA_wd_air_alert_desc:0 "The first answer keeps two fighters armed and crewed at the end of the runway at every hour, ready to launch within five minutes of a radar contact. It is the most visible protection the guard can give the city. It wears out airframes and pilots faster than any other posture, and leaves little time or fuel for training."
 SLA_wd_air_school:0 "A Flying School Before More Fighters"
 SLA_wd_air_school_desc:0 "The second answer accepts a thinner alert and puts the guard's hours into training, opening a flying school that produces Slavian pilots instead of hiring them. In five years the guard would have twice the pilots for the same aircraft. Meanwhile the sky over Lhesk would be watched less closely than the defence staff would like."
 SLA_wd_air_dispersal:0 "Strips Along the Coast Road"
 SLA_wd_air_dispersal_desc:0 "The third answer scatters the guard along straight stretches of the coast road, widened and marked as emergency strips with fuel bowsers hidden nearby. No attacker could destroy the guard on the ground in a single raid. The strips are crude and the road must close whenever they are used. Drivers learn to look up before overtaking."
 SLA_wd_air_revetments:0 "Revetments for Every Fighter"
 SLA_wd_air_revetments_desc:0 "Earth and concrete revetments around each parking place protect the fighters from blast and splinters, and nets hide them from a casual glance. The work uses spoil from the storm drains and labour from the engineers. It is unglamorous, and it is the cheapest way to be sure the guard still exists an hour into a war."
 SLA_wd_air_airframe_shop:0 "Airframe Parts Made in Lhesk"
 SLA_wd_air_airframe_shop_desc:0 "The airframe shop in the arms hall begins delivering panels, ribs and simple spares to the guard. Fighters that waited weeks for parts from abroad are flying again in days. The shop cannot build an aircraft and does not try. It gives the guard a home supply of whatever breaks most often, and mechanics who understand the metal."
 SLA_wd_air_aggressors:0 "Hired Aggressor Pilots"
 SLA_wd_air_aggressors_desc:0 "Former Belkan Air Force aces are selling their skills abroad, and several governments now employ them as aggressor squadrons that play the enemy in training. The guard could take a few on contract to hunt its own pilots over the sea. Nobody is named and nothing is signed until the defence staff has vetted the terms. The lessons would be harsh, costly and remembered."
 SLA_wd_fr_map:0 "Three Frontiers and One Shore"
 SLA_wd_fr_map_desc:0 "Slavia touches only two countries. Valka lies to the west across a line of hills. Seterano's mountains rise along the whole north, and a short stretch of plain meets Seterano again in the east. The south is open sea. The frontier office maps every road, track and post on the Slavian side. No line moves and no claim is made."
 SLA_wd_fr_hill_posts:0 "Posts Facing the Western Hills"
 SLA_wd_fr_hill_posts_desc:0 "The western frontier runs through hills where shepherds, smugglers and day labourers cross with little paperwork. Staffed posts on the main tracks, manned in shifts from the city, record the traffic and turn nobody back without cause. The posts are lonely and wet for half the year. They give the republic its first honest count of who comes and goes."
 SLA_wd_fr_flood_watch:0 "Flood Gauges Below the Mountains"
 SLA_wd_fr_flood_watch_desc:0 "Rain falling on the mountains to the north drains across the plain toward the sea, and in a wet spring the streams rise faster than the city can react. Gauges and a telephone line along the foot of the mountains, on the Slavian side, give hours of warning. The same gauges measure the silt that later fills the harbour mouth."
 SLA_wd_fr_plain_road:0 "Our End of the Eastern Road"
 SLA_wd_fr_plain_road_desc:0 "The road east across the plain toward Seterano is the one easy land route out of the republic. The Slavian section is narrow, unlit and floods each spring. Rebuilding it properly, with a staffed crossing, costs little next to the halls. What Seterano does with its own side of the road is for Seterano to decide."
 SLA_wd_fr_no_bloc:0 "Armed and in No Bloc"
 SLA_wd_fr_no_bloc_desc:0 "The first posture declares that Slavia will join no alliance, host no foreign troops and lend its ground to nobody's war, while keeping its formations and air guard ready. It suits a city that would fight but does not want to. Larger powers may find the declaration convenient or irritating. Either way it costs Slavia only its options."
 SLA_wd_fr_open_gates:0 "Open Gates for Trade"
 SLA_wd_fr_open_gates_desc:0 "The second posture opens every staffed crossing to traders and travellers with the least possible paperwork, and invites the neighbours to do likewise without asking anything in return. Markets near the crossings would grow and the harbour would gain inland customers. Smuggling would grow too, and the frontier office would have to live with it."
 SLA_wd_fr_permits:0 "A Permit for Every Crossing"
 SLA_wd_fr_permits_desc:0 "The third posture closes the informal paths and requires a permit for every crossing, issued at the posts and checked on the way out and back. Smuggling falls and the frontier office knows exactly who is in the republic. Day labourers and shepherds lose a living. The neighbours learn that Slavia watches its doors, as intended."
 SLA_wd_fr_talks_offer:0 "An Offer of Practical Talks"
 SLA_wd_fr_talks_offer_desc:0 "Whatever posture it chose, the republic writes to Valka and Seterano offering regular talks on floods, crossings, fires and stray livestock, with no treaty and no conditions. Whether either neighbour sends anyone is theirs to decide. The offer is a letter and a reserved room. It shows that Slavia expects to live beside them for a long time."
 SLA_wd_uly_notice:0 "The Asteroid Warning"
 SLA_wd_uly_notice_desc:0 "In December 1994 the astronomers' union warns that an asteroid named Ulysses is coming near the planet and could hit it. Nobody can say where fragments might fall. For most countries the first plan is to move people inland. Slavia has no inland. The Administration forms an impact committee and admits on its first day that the usual answers do not fit."
 SLA_wd_uly_shelters:0 "Shelters Under the Old Quarter"
 SLA_wd_uly_shelters_desc:0 "If the people cannot leave the city, the city can go underground. Deep shelters under the old quarter, linked to the cellars and stocked with water for weeks, would hold much of the population. Digging in wet ground near the sea is slow and costly, and the pumps must run every day. Once built, the shelters serve in any war as well."
 SLA_wd_uly_ships:0 "Berths for an Evacuation Fleet"
 SLA_wd_uly_ships_desc:0 "The republic's sixty convoys could, in an emergency, carry part of the population out to sea or to any port willing to take them. Reserving berths, fuel and boarding lists turns that possibility into a plan. Ships cost money to keep idle, and every destination depends on someone else. The plan also needs warning time nobody can promise."
 SLA_wd_uly_corridors:0 "Ask for Corridors Overland"
 SLA_wd_uly_corridors_desc:0 "Using the channel its frontier talks opened, the republic asks Valka and Seterano whether Slavian families could shelter on their side of the hills and mountains if an impact were forecast near Lhesk. It asks; it assumes no answer. Lists of families, routes and assembly points are drawn up anyway, so that any answer can be acted on fast."
 SLA_wd_uly_pumps:0 "Pump Crews for the Shelters"
 SLA_wd_uly_pumps_desc:0 "Shelters dug below the water table flood without pumps, and pumps fail without crews. A standing pump service with spare engines, fuel and a duty roster keeps every shelter dry through the wet season. It is a permanent payroll for a disaster that may never come. The crews also clear flooded streets each spring, which wins them friends."
 SLA_wd_uly_boarding:0 "Boarding Drills by Ward"
 SLA_wd_uly_boarding_desc:0 "Each ward practises walking to its assigned berth with one bag per person, timed by harbour officials with stopwatches. The first drill takes three times as long as planned and blocks the harbour road for an afternoon. Later drills improve. Families come to know their berth number the way they know their own address."
 SLA_wd_uly_lists:0 "Family Lists for the Routes"
 SLA_wd_uly_lists_desc:0 "Every household is assigned a route, a vehicle or a column and an assembly point, in case a neighbour agrees to take them. The lists are revised every season as families move and children are born. Nobody knows whether they will ever be used. Keeping them makes the impact committee the best-informed office in the republic."
 SLA_wd_uly_impact:0 "The Impact Is Confirmed"
 SLA_wd_uly_impact_desc:0 "In April 1996 the FCU president tells every nation that Ulysses is going to hit and that a plan to counter it exists. Where the fragments will come down is still unknown. The impact committee moves from planning to rehearsal, every ministry adds an asteroid line to its budget, and stocks of water, grain and medicine are bought and stored."
 SLA_wd_uly_breakwater_watch:0 "Watchers on the Breakwater"
 SLA_wd_uly_breakwater_watch_desc:0 "The volunteer coast watch takes on a new duty: logging bright objects in the night sky and reporting them to the impact committee, helped by a sky-search radar on the breakwater. Most reports are aircraft, satellites or planets. A few are real meteors and go to foreign observatories. The watchers become the republic's only astronomers."
 SLA_wd_uly_roche:0 "Standby Through the Roche Night"
 SLA_wd_uly_roche_desc:0 "In July 1999 Ulysses crosses the Roche limit and comes close enough for the pull of the planet to matter. The impact committee keeps every shelter, berth and route list on standby through the night. Whatever the morning brings, the republic will have to explain afterwards what it did and why. The committee prepares two statements in advance and hopes to need neither."
 SLA_wd_war_belka:0 "The Belkan War on the Radio"
 SLA_wd_war_belka_desc:0 "Late in March 1995 fighting begins in the Belkan War, a long way from Lhesk. Slavia is not a party and its frontiers stay quiet. Within a week fuel prices, freight rates and insurance premiums move, and foreign buyers ring the arms halls. The war arrives in the republic as a set of prices and a set of telephone calls, and both need answers."
 SLA_wd_war_sell_licensed:0 "Sell on Licence in Wartime"
 SLA_wd_war_sell_licensed_desc:0 "The halls can sell rifles and rounds to any buyer the republic licenses, parties to the war included, under the end-user rules already on the books. The orders are large and paid in advance. Every crate will be photographed by somebody. Slavia would profit from a war it has no part in, and be remembered for it by both sides."
 SLA_wd_war_embargo:0 "No Arms to Warring Parties"
 SLA_wd_war_embargo_desc:0 "The republic declares that no weapons will leave Lhesk for any party to the war while it lasts. Fuel and food may sail; rifles may not. The halls lose orders and the workers lose overtime. The republic gains a clean record in a war it did not choose, and a reason for buyers on every side to trust its neutrality afterwards."
 SLA_wd_war_lumen:0 "The Treaty Signed in Lumen"
 SLA_wd_war_lumen_desc:0 "The Belkan War is over by the end of June 1995, closed by a treaty at Lumen. Freight and fuel prices start to fall, slowly, and the arms enquiries dry up. The treasury reviews what the war cost the republic and what it earned. Whatever the halls chose, there are now a few months of figures showing how a distant war reaches a port city."
 SLA_wd_war_belka_won:0 "Bids for Belkan Rebuilding"
 SLA_wd_war_belka_won_desc:0 "In this world Belka has come out of the war on top, and its purchasing agents are looking for steel, trucks and spares to rebuild and rearm. Slavian halls can bid for the civil orders. The contracts are welcome and politically loaded, and the republic must decide how closely to tie its industry to a victorious power far away."
 SLA_wd_war_belka_lost:0 "Belkan Engineers Seek Work"
 SLA_wd_war_belka_lost_desc:0 "With Belka defeated, engineers and technicians from its industries look for work abroad, and a few write to the Slavian halls. Hiring them would bring skills the republic lacks, above all in aircraft and electronics. It would also draw scrutiny from the victors, and the defence staff insists on vetting each applicant before any contract."
 SLA_wd_war_usea:0 "Insurers Hear of Usea First"
 SLA_wd_war_usea_desc:0 "In August 2003 the ISAF is formed against Erusea after the seizure of Stonehenge, and war spreads across Usea. Slavia is far from it, but the freight lanes, insurers and arms buyers are not. The harbour office and the halls feel the war before the newspapers explain it. The republic has two years of prices and choices ahead."
 SLA_wd_war_usea_contracts:0 "Contracts for the Usean Market"
 SLA_wd_war_usea_contracts_desc:0 "Having sold on licence in the Belkan War, the halls take the same course again: civil and military orders from licensed buyers connected with the Usean war, paid in advance and certified at the quay. Shifts lengthen and overtime returns. So do the photographers, and this time they know exactly where to stand."
 SLA_wd_war_relief_cargo:0 "Relief Cargo for Usea"
 SLA_wd_war_relief_cargo_desc:0 "Having refused arms to the Belkan War, the republic keeps its word in the Usean one and offers its convoys for relief cargo instead: food, medicine and building materials consigned to civilian agencies. The voyages are long and earn little, and crews take real risks in contested waters. Slavia's name for neutrality survives another war."
 SLA_wd_war_continental_end:0 "The Continental War Ends"
 SLA_wd_war_continental_end_desc:0 "With Farbanti fallen and the surrender of Erusea accepted by the ISAF, the Continental War is over. Slavian freight rates ease and the insurers relax. The treasury writes a second account of how a distant war reached Lhesk, ten years after the first. Comparing the two shows whether the republic has learned to live with wars it does not fight."
 SLA_wd_cent_count:0 "Count the Republic Again"
 SLA_wd_cent_count_desc:0 "Ten years after the street survey the republic counts itself again: households, jobs, wages, flats, rifles and ships. The comparison shows what the decade changed and what it left alone. A city-state can be counted completely, which is both its advantage and its embarrassment, and every figure will be quoted by someone who dislikes the government."
 SLA_wd_cent_apprentices:0 "Apprentices at the Lathes"
 SLA_wd_cent_apprentices_desc:0 "Young Slavians who once went straight into the arms halls at sixteen now take three-year apprenticeships split between a hall and a technical school. Output dips slightly while they learn. The halls gain machinists who can set up their own work, and the republic gains citizens who could find a job somewhere other than a rifle line."
 SLA_wd_cent_debt:0 "Pay Down the Treasury Debt"
 SLA_wd_cent_debt_desc:0 "The treasury carries a debt of about three tenths of the republic's yearly output, inherited and rolled over through the nineties. Three budgets in surplus would cut it sharply. Wards, halls and the defence staff would all receive less in the meantime. The prize is a republic that can borrow in a crisis without asking anyone's leave."
 SLA_wd_cent_hall_labs:0 "Research Rooms in the Halls"
 SLA_wd_cent_hall_labs_desc:0 "Each arms hall sets aside a room and a small budget for research into its own products and processes, staffed by engineers and the best apprentices. The rooms produce mostly small improvements and the occasional patent. They are the first research the republic does for itself instead of buying abroad, and they cost the halls some profit."
 SLA_wd_cent_account:0 "The Republic Since 1991 in Tables"
 SLA_wd_cent_account_desc:0 "At the close of 2005 the government sets out in one plain report what the republic has become since 1991: the form of its government, the output of its halls, the record of its harbour and air guard, and its conduct through the asteroid years and the distant wars. The report makes no forecasts. Its tables become the starting line for whoever holds office next."
 SLA_wd_cent_account_tt_1:0 "Closes the 1991 to 2005 programme; later eras are written separately."
 ac_wd_sla_tree:0 "Slavia: National Programme"
 ac_wd_sla_tree_desc:0 "The national focus programme of Slavia, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 SLA_wd_caretaker_mandate:0 "A Mandate Past Its Term"
 SLA_wd_caretaker_mandate_desc:0 "The National Administration governs on a mandate whose four-year term ran out in November 1991."
 SLA_wd_canteen_forums:0 "Questions at Shift Change"
 SLA_wd_canteen_forums_desc:0 "Officials answer the workforce in the canteens of the halls and the docks every month."
 SLA_wd_ballot_calendar:0 "A Published Polling Calendar"
 SLA_wd_ballot_calendar_desc:0 "Polling day, rolls and counting rules are printed a year ahead of every vote."
 SLA_wd_managers_compact:0 "Compact of the Directors"
 SLA_wd_managers_compact_desc:0 "Directors of the halls, the harbour and the banks agree one budget with the government."
 SLA_wd_works_delegates:0 "Delegates from the Shop Floor"
 SLA_wd_works_delegates_desc:0 "Elected delegates of the arms halls and docks sit beside the ministers."
 SLA_wd_defence_ordinance:0 "Ordinance of Defence"
 SLA_wd_defence_ordinance_desc:0 "Civil ministries take their priorities from the general staff."
 SLA_wd_federal_law:0 "Two Readings a Month Apart"
 SLA_wd_federal_law_desc:0 "Every federal bill is read twice and printed in the newspapers between readings."
 SLA_wd_board_targets:0 "Monthly Targets for Each Director"
 SLA_wd_board_targets_desc:0 "Output, cost and harbour tonnage are posted for every director, every month."
 SLA_wd_open_books:0 "Accounts Open to the Workforce"
 SLA_wd_open_books_desc:0 "Each hall, works and dock publishes its books to the people who work in it."
 SLA_wd_reserve_roll:0 "One Roll for Every Adult"
 SLA_wd_reserve_roll_desc:0 "Every adult in the republic has an assignment, an assembly point and a yearly drill."
 SLA_wd_settlement_text:0 "A Constitution Sold at Kiosks"
 SLA_wd_settlement_text_desc:0 "The settled form of government, printed and sold for the price of a newspaper."
 SLA_wd_street_ledger:0 "Register of Streets and Drains"
 SLA_wd_street_ledger_desc:0 "Every block, well and drain of the single province entered in one register."
 SLA_wd_summer_cisterns:0 "Cisterns Filled in the Rains"
 SLA_wd_summer_cisterns_desc:0 "Rooftop and street cisterns keep water flowing from June to September."
 SLA_wd_worker_flats:0 "Flats Beside the Halls"
 SLA_wd_worker_flats_desc:0 "New flats on hall land cut the journey to work for shift crews."
 SLA_wd_ward_committees:0 "Committees in Every Ward"
 SLA_wd_ward_committees_desc:0 "Each ward of Lhesk elects a committee with a small budget of its own."
 SLA_wd_city_manager_office:0 "Office of the City Manager"
 SLA_wd_city_manager_office_desc:0 "One appointed manager holds authority over every street, pipe and permit."
 SLA_wd_ward_purses:0 "Ward Budgets in Print"
 SLA_wd_ward_purses_desc:0 "Ward committees spend a fixed share of the city budget and publish every item."
 SLA_wd_manager_schedule:0 "One Ranked List of Works"
 SLA_wd_manager_schedule_desc:0 "Drains, housing and roads are built in the order the city manager sets."
 SLA_wd_constituency_offices:0 "A Member in Every Ward"
 SLA_wd_constituency_offices_desc:0 "Each ward elects a member of the federal chamber who keeps an office on its street."
 SLA_wd_street_charter:0 "Charter of the City Streets"
 SLA_wd_street_charter_desc:0 "Streets, water, markets and transport belong to the city; defence and money stay national."
 SLA_wd_hall_inventory:0 "Seven Buildings Counted"
 SLA_wd_hall_inventory_desc:0 "Every press, lathe and payroll in the five arms halls and two civil works is on record."
 SLA_wd_rolled_plate:0 "Plate Rolled at Home"
 SLA_wd_rolled_plate_desc:0 "Slavian ore is rolled into plate at the civil works instead of sold raw."
 SLA_wd_civil_retooling:0 "Civil Lines Under Arms Hall Roofs"
 SLA_wd_civil_retooling_desc:0 "Two arms halls run protected civil lines for pumps, vans and tram parts."
 SLA_wd_licensed_exports:0 "Rifles Sold Under Licence"
 SLA_wd_licensed_exports_desc:0 "Every line busy with orders from governments on a published licence list."
 SLA_wd_garrison_arsenal:0 "Halls Working for the City"
 SLA_wd_garrison_arsenal_desc:0 "All five halls build reserves for the republic and sell nothing abroad."
 SLA_wd_van_orders:0 "Vans for Shops and Wards"
 SLA_wd_van_orders_desc:0 "A plain delivery van stamped out on the old rifle frames sells across the city."
 SLA_wd_end_user_office:0 "Certificates for Every Crate"
 SLA_wd_end_user_office_desc:0 "Buyers and end uses of every arms export are named and published once a year."
 SLA_wd_hall_magazines:0 "Dry Magazines Under the Floors"
 SLA_wd_hall_magazines_desc:0 "Reserve rifles and rounds stored in ventilated cellars below the arms halls."
 SLA_wd_council_prices:0 "Prices Set by Hall Councils"
 SLA_wd_council_prices_desc:0 "Each hall council prices its own contracts; a national council settles disputes."
 SLA_wd_cool_hour_shifts:0 "Lathes at Night in Summer"
 SLA_wd_cool_hour_shifts_desc:0 "Heavy work moves to the night and early morning through the hot months."
 SLA_wd_silo_reserve:0 "The Silo Never Below Half"
 SLA_wd_silo_reserve_desc:0 "Fuel bought ahead of need and the local wells pumped to keep the silo full."
 SLA_wd_decade_audit:0 "The Second Hall Inventory"
 SLA_wd_decade_audit_desc:0 "Ten years of hall figures compared line by line and published in full."
 SLA_wd_harbour_office:0 "One Counter for the Harbour"
 SLA_wd_harbour_office_desc:0 "Berths, pilots, dues and the convoy list handled by a single office."
 SLA_wd_dredged_channel:0 "A Channel Kept Deep"
 SLA_wd_dredged_channel_desc:0 "The harbour mouth is dredged on contract every few years against the silt."
 SLA_wd_fuel_jetty:0 "A Buried Fuel Line"
 SLA_wd_fuel_jetty_desc:0 "Imported fuel lands at a jetty and runs underground to the silo."
 SLA_wd_transit_wharf:0 "Foreign Cargo on the Quay"
 SLA_wd_transit_wharf_desc:0 "Goods bound for other countries landed at Lhesk and sent on by road."
 SLA_wd_home_cargo:0 "Slavian Ships Never Wait"
 SLA_wd_home_cargo_desc:0 "Berths go first to the republic's own fuel, food, steel and parts."
 SLA_wd_coast_watchers:0 "Radios in the Fishing Fleet"
 SLA_wd_coast_watchers_desc:0 "Fishing crews and sailors report sightings at sea for a small fee."
 SLA_wd_mates_classes:0 "Evening Classes at the Quay"
 SLA_wd_mates_classes_desc:0 "Local sailors qualify as mates and masters without going abroad."
 SLA_wd_dues_formula:0 "Dues Posted on the Door"
 SLA_wd_dues_formula_desc:0 "Harbour dues follow a published formula of tonnage, berth time and cargo class."
 SLA_wd_territorial_muster:0 "Two Formations Counted"
 SLA_wd_territorial_muster_desc:0 "Every rifle, truck and reservist card of the army is on one muster roll."
 SLA_wd_street_schools:0 "Mock Streets by the Halls"
 SLA_wd_street_schools_desc:0 "Battalions rotate through a training block of houses, cellars and courtyards."
 SLA_wd_block_defence:0 "A Fortress of Streets"
 SLA_wd_block_defence_desc:0 "Prepared positions in cellars, courtyards and the halls themselves."
 SLA_wd_approach_screen:0 "Light Screens Forward"
 SLA_wd_approach_screen_desc:0 "Screens on the western hills, northern foothills and eastern road."
 SLA_wd_household_levy:0 "One Defender per Household"
 SLA_wd_household_levy_desc:0 "Every household provides a trained adult to a weekend company."
 SLA_wd_linked_cellars:0 "Passages Under the Streets"
 SLA_wd_linked_cellars_desc:0 "Cellars knocked through so defenders can move below ground."
 SLA_wd_crossroads_reserve:0 "Trucks Loaded at the Crossroads"
 SLA_wd_crossroads_reserve_desc:0 "A central reserve kept fuelled and loaded, able to reach any approach in time."
 SLA_wd_neighbourhood_companies:0 "Companies Drawn by Street"
 SLA_wd_neighbourhood_companies_desc:0 "Neighbours drill together, with elected sergeants and a known armoury."
 SLA_wd_officer_school:0 "Officers Trained for Mud and Streets"
 SLA_wd_officer_school_desc:0 "A harbour school teaches command for the republic's own ground."
 SLA_wd_staff_college:0 "Planners for the Board"
 SLA_wd_staff_college_desc:0 "Officers trained in budgets and administration as well as operations."
 SLA_wd_air_guard:0 "Sixteen Airframes on One Field"
 SLA_wd_air_guard_desc:0 "Twelve fighters and four in reserve watch the sky over a single province."
 SLA_wd_alert_pairs:0 "Two Fighters Always Armed"
 SLA_wd_alert_pairs_desc:0 "A pair of fighters waits at the runway end, crewed, at every hour."
 SLA_wd_flying_school:0 "Pilots Trained at Home"
 SLA_wd_flying_school_desc:0 "Training hours come before alert hours while a flying school fills the cockpits."
 SLA_wd_coast_strips:0 "Road Strips and Hidden Bowsers"
 SLA_wd_coast_strips_desc:0 "Straight stretches of the coast road serve as emergency runways."
 SLA_wd_revetments:0 "Earth Walls Round the Fighters"
 SLA_wd_revetments_desc:0 "Blast walls and nets protect every parking place on the field."
 SLA_wd_airframe_shop:0 "Spares from the Airframe Shop"
 SLA_wd_airframe_shop_desc:0 "Panels, ribs and simple spares made from Slavian aluminium."
 SLA_wd_aggressor_contract:0 "Contract Aggressors Overhead"
 SLA_wd_aggressor_contract_desc:0 "Hired instructors fly against the guard's pilots in exercises."
 SLA_wd_frontier_office:0 "Survey of the Two Frontiers"
 SLA_wd_frontier_office_desc:0 "Every road, track and post on the Slavian side of both frontiers is mapped."
 SLA_wd_hill_posts:0 "Posts on the Shepherd Tracks"
 SLA_wd_hill_posts_desc:0 "Staffed posts on the western tracks count who crosses and when."
 SLA_wd_flood_gauges:0 "Gauges Along the Foothills"
 SLA_wd_flood_gauges_desc:0 "Stream gauges and a telephone line warn the city of floods from the mountains."
 SLA_wd_east_crossing:0 "A Lit Crossing on the Plain"
 SLA_wd_east_crossing_desc:0 "The Slavian end of the eastern road is paved, lit and staffed."
 SLA_wd_no_bloc:0 "Ready, and Allied to Nobody"
 SLA_wd_no_bloc_desc:0 "No alliance, no foreign troops and no territory lent to any war."
 SLA_wd_open_gates:0 "Crossings Open to Traders"
 SLA_wd_open_gates_desc:0 "Minimal paperwork for anyone crossing with goods or looking for work."
 SLA_wd_crossing_permits:0 "Paper for Every Journey"
 SLA_wd_crossing_permits_desc:0 "Informal paths closed; every crossing needs a permit checked both ways."
 SLA_wd_impact_committee:0 "The Impact Committee Sits Daily"
 SLA_wd_impact_committee_desc:0 "Ministries plan together for an impact nobody can yet place."
 SLA_wd_deep_shelters:0 "Pumped Shelters in Wet Ground"
 SLA_wd_deep_shelters_desc:0 "Deep shelters under the old quarter, linked to the cellars and stocked with water."
 SLA_wd_evacuation_berths:0 "Ships Held for the Worst Case"
 SLA_wd_evacuation_berths_desc:0 "Berths, fuel and boarding lists reserved for moving people out to sea."
 SLA_wd_corridor_lists:0 "A Request Left Open"
 SLA_wd_corridor_lists_desc:0 "The republic has asked its neighbours about shelter overland and awaits any answer."
 SLA_wd_shelter_pumps:0 "A Standing Pump Service"
 SLA_wd_shelter_pumps_desc:0 "Spare engines, fuel and crews keep every shelter dry through the wet season."
 SLA_wd_boarding_drills:0 "Every Family Knows Its Berth"
 SLA_wd_boarding_drills_desc:0 "Wards rehearse the walk to their assigned berths with one bag each."
 SLA_wd_route_lists:0 "Routes and Columns by Household"
 SLA_wd_route_lists_desc:0 "Every household holds a route, a vehicle and an assembly point in case an offer comes."
 SLA_wd_impact_stockpiles:0 "Water, Grain and Medicine Laid By"
 SLA_wd_impact_stockpiles_desc:0 "Emergency stocks bought for the years before the asteroid arrives."
 SLA_wd_sky_log:0 "A Log of the Night Sky"
 SLA_wd_sky_log_desc:0 "Volunteer watchers record bright objects and pass genuine meteors abroad."
 SLA_wd_war_premium:0 "Premiums on Every Slavian Hull"
 SLA_wd_war_premium_desc:0 "Fuel, freight and insurance all cost more while the Belkan War lasts."
 SLA_wd_wartime_licences:0 "Orders Paid in Advance"
 SLA_wd_wartime_licences_desc:0 "Licensed buyers, including parties to the war, fill the order books."
 SLA_wd_arms_shut:0 "No Rifles Leave for the War"
 SLA_wd_arms_shut_desc:0 "Fuel and food may sail; weapons may not, to any party at war."
 SLA_wd_belkan_orders:0 "Contracts from Belkan Agents"
 SLA_wd_belkan_orders_desc:0 "Civil orders for steel, trucks and spares from a victorious Belka."
 SLA_wd_belkan_engineers:0 "Vetted Engineers from Belka"
 SLA_wd_belkan_engineers_desc:0 "A few Belkan technicians on contract in the halls and the air guard."
 SLA_wd_usean_contracts:0 "Overtime from the Usean War"
 SLA_wd_usean_contracts_desc:0 "Licensed orders connected with the war in Usea, certified at the quay."
 SLA_wd_relief_cargo:0 "Convoys for Relief Only"
 SLA_wd_relief_cargo_desc:0 "Food, medicine and building materials for civilian agencies in Usea."
 SLA_wd_second_count:0 "Two Counts Side by Side"
 SLA_wd_second_count_desc:0 "Figures for 1991 and 2001 compared street by street and hall by hall."
 SLA_wd_apprentice_scheme:0 "Three Years at Lathe and Desk"
 SLA_wd_apprentice_scheme_desc:0 "Apprentices split their time between the halls and a technical school."
 SLA_wd_surplus_budgets:0 "Three Budgets in Surplus"
 SLA_wd_surplus_budgets_desc:0 "Wards, halls and the defence staff receive less while the debt is paid down."
 SLA_wd_hall_labs:0 "A Research Room in Every Hall"
 SLA_wd_hall_labs_desc:0 "Engineers and apprentices improve the products and processes of their own hall."
 SLA_wd_canteen_week:0 "A Week of Canteen Hearings"
 SLA_wd_canteen_week_desc:0 "Ministers answer the night and day shifts in person."
 SLA_wd_range_fortnight:0 "A Fortnight on the Ranges"
 SLA_wd_range_fortnight_desc:0 "Battalions fire their annual courses on the coastal ranges."
 SLA_wd_scramble_week:0 "Scrambles at Unannounced Hours"
 SLA_wd_scramble_week_desc:0 "The air guard launches against surprise drills set by the radar crews."
 SLA_wd_drains_flushed:0 "Drains Cleared for the Rains"
 SLA_wd_drains_flushed_desc:0 "Every storm drain flushed and inspected before the wet season."
 SLA_wd_fuel_release:0 "Silo Fuel at Fixed Prices"
 SLA_wd_fuel_release_desc:0 "Fuel from the silo sold to households and lorries at a fixed price."
 ac_wd_sla.1.t:0 "The Calendar in the Cabinet Room"
 ac_wd_sla.1.d:0 "A printed electoral calendar hangs in the Administration's cabinet room, issued in 1987 and never replaced. Someone has ringed the ninth of November 1991 in red ink. Under the inherited four-year rule, that is when the Slavian Republic should next vote. Nobody in the room admits to the ink, and nobody has taken the calendar off its nail.\n\nSince that last vote the Administration has governed by ordinary decree, and most of Lhesk has let it. Seven in ten voters still back the non-aligned label it governs under. Almost a quarter vote communist, most of them on the floors of the arms halls and the docks. A handful follow the nationalists and hardly anyone the democrats. Public order is brittle, yet readiness to fight for the city is very high, a mixture each minister explains in a different way.\n\nNothing has to be settled today, but the date is only months away and editors can read a calendar too. The cabinet can extend its own mandate by quiet decree, announce a public review of how the republic should be governed, or send officials into the shift-change canteens to ask the workforce directly. The last course will begin an argument the Administration cannot finish on its own.\n\nProvisional gameplay."
 ac_wd_sla.1.a:0 "Extend the mandate by decree."
 ac_wd_sla.1.b:0 "Announce a public review."
 ac_wd_sla.1.c:0 "Send officials to the canteens."
 ac_wd_sla.2.t:0 "Questions Until Dawn"
 ac_wd_sla.2.d:0 "The officials sent to the canteens expected an hour of polite questions. At the largest arms hall the night shift keeps them until sunrise. Workers climb onto benches to speak, the kitchen staff stop serving to listen, and a delegate reads out demands written on the back of a production chart: published wages, safe ventilation, a vote on the overdue ballot and a seat for the halls in whatever government comes next.\n\nNot everyone in the room agrees. Older foremen want the managers left alone to run the halls as they always have. Younger fitters want the councils to take the halls over outright. A few reservists say the city should put its defences in order before it argues about anything else at all. The officials write every word down, and by morning their notebooks hold the four quarrels the republic will spend the coming years having.\n\nThe managers have already heard what happened and want the notebooks treated as confidential. The delegates want them printed in full. The Administration now owns a night it neither planned nor can undo, and must choose between the two demands, knowing that the halls will judge its answer long before any minister has finished explaining it.\n\nProvisional gameplay."
 ac_wd_sla.2.a:0 "Print the notebooks in full."
 ac_wd_sla.2.b:0 "Keep the notebooks for the cabinet."
 ac_wd_sla.3.t:0 "A Survey Walked in One Season"
 ac_wd_sla.3.d:0 "The survey teams finish their walk of Slavia in a single season, something few countries anywhere could say. They have measured every street, counted every flat, tested every well and lifted every drain cover in the republic. On every sheet they drew, the republic, the province and the city of Lhesk turn out to be one place, running from the foot of the western hills to the harbour on the southern shore.\n\nThe report is blunt. The old drains were laid for a smaller city and overflow every wet season, and the plain stays muddy in every month of the year. Water pressure collapses on summer afternoons, when the heat reaches the high thirties and no rain has fallen for weeks. Arms workers live far from the halls and lose hours each week on crowded buses. Market streets have grown up without licences, inspectors or drains of their own.\n\nThe ministers now hold a complete picture of their country, and so do the newspapers, which received copies through an error nobody will own. The government must decide who will act on the findings: committees elected in each ward, which would be slow and popular, or one office with authority over every street, which would be quick and answerable to nobody close at hand.\n\nProvisional gameplay."
 ac_wd_sla.3.a:0 "Promise the wards a say."
 ac_wd_sla.3.b:0 "Promise one office for the works."
 ac_wd_sla.4.t:0 "Clipboards in the Arms Halls"
 ac_wd_sla.4.d:0 "The inventory teams walk the five arms halls with clipboards and a camera, and the managers walk beside them the whole way. After the harbour sheds, the halls are the largest buildings in Lhesk, and in most families someone works a shift in one. Two civil works across the city make nearly everything else the republic produces, from rolled plate to tram spares, and neither has seen new machines in years.\n\nEvery building plot zoned for industry in the province is taken, and there is nowhere else to put another, because the province is the whole country. Whatever the republic wants from its industry in the next decade must come from what these seven buildings make and how well they make it. The teams find idle lathes, presses booked twice over and an export order book that leans on a handful of foreign buyers.\n\nThe managers want the findings treated as commercial secrets. The works delegates want them pinned to the canteen walls. The defence staff asks only for a list of what the halls could turn out in a month if the city were threatened. The cabinet must choose who reads the inventory first, and that choice will colour every argument about the halls that follows.\n\nProvisional gameplay."
 ac_wd_sla.4.a:0 "Pin the findings in the canteens."
 ac_wd_sla_4_a:0 "Pin the findings in the canteens."
 ac_wd_sla.4.b:0 "Brief the managers in confidence."
 ac_wd_sla.4.c:0 "Hand the defence staff the first copy."
 ac_wd_sla.5.t:0 "One Counter at Six in the Morning"
 ac_wd_sla.5.d:0 "At six in the morning the new harbour office opens its doors for the first time, and a line of ship agents is already waiting on the quay. Until now each of them dealt with four ministries for berths, pilots, dues and the convoy list, and each ministry kept its own hours and its own forms. The harbour office has one counter, one ledger and a clock on the wall. By noon the line is longer than when it started.\n\nThe quay is long and the naval base is small. There are no warships and nobody in the republic is asking for any. What the harbour handles is cargo: fuel for the silo, food, steel plate, machine parts and the crates the arms halls sell abroad. Sixty convoys sail under Slavian registration. Silt washed off the plain narrows the channel every spring, and the larger ships already wait outside for the tide.\n\nThe office must settle its first priority. It can clear the backlog by working through the night, which exhausts the clerks and pleases the agents, or close the counter for a week to write proper rules, which angers everyone now and spares them later. Either way, the harbour has a single address for the first time, and every complaint will now arrive at it.\n\nProvisional gameplay."
 ac_wd_sla.5.a:0 "Work through the night."
 ac_wd_sla.5.b:0 "Close for a week and write the rules."
 ac_wd_sla.6.t:0 "The Whole Army on One Field"
 ac_wd_sla.6.d:0 "Both infantry formations of the Slavian army stand on the parade ground together for the first time in years: four battalions in each, an engineer company with each formation and trucks parked in rows behind them. The entire army of the republic fits on one field. Families crowd the railings, the harbour sirens sound at noon, and behind the ceremony clerks count every rifle, helmet and reservist card.\n\nThe count describes a people that expects to defend itself and has thought less about how. Nine in ten citizens tell pollsters they would fight for Lhesk if it came to that. The formations still train in open fields, though any real fighting would be in streets and cellars. Their trucks sink into the plain every wet season, and the engineers have plans of the city but none of the three land approaches beyond it.\n\nThe defence staff wants the muster repeated every year as a public show of readiness. The treasury answers that a full muster closes the harbour road for a day and costs a week of hall output while reservists queue for their cards. The Administration must decide whether readiness is something Slavia displays to itself and its neighbours, or something it simply keeps.\n\nProvisional gameplay."
 ac_wd_sla.6.a:0 "Make the muster a yearly holiday."
 ac_wd_sla.6.b:0 "Muster quietly, one battalion at a time."
 ac_wd_sla.7.t:0 "A Thin Folder of Frontiers"
 ac_wd_sla.7.d:0 "The frontier office delivers its survey in a single folder, and the ministers notice at once how thin it is. Valka lies to the west behind a line of hills crossed by shepherds' tracks. Seterano's mountains rise along the whole north, and Seterano's plain meets Slavia again in the east along a stretch so short that a lorry is across it in minutes. To the south there is only the sea.\n\nEvery one of these frontiers is quiet, and no file in the office records a quarrel over any of them. Each is also poorly known on the Slavian side. Valka is governed under its democratic label with elections suspended, before an electorate split almost evenly between non-aligned and nationalist camps. Seterano is larger, with frontiers of its own to watch. Neither has asked the republic for anything, and the republic has asked nothing of either.\n\nNothing on the ground is altered by the folder. What it reveals is how few doors the republic has: two land neighbours, one easy road, one harbour. Before choosing whether to stand apart, open those doors or watch them closely, the government must decide what to tell the shepherds and drivers who cross the hills every week and have never once been asked for a paper.\n\nProvisional gameplay."
 ac_wd_sla.7.a:0 "Post notices on every track."
 ac_wd_sla.7.b:0 "Say nothing until the posts are built."
 ac_wd_sla.8.t:0 "Nowhere Inland to Go"
 ac_wd_sla.8.d:0 "In December 1994 the International Astronomical Union warns that an asteroid named Ulysses is heading near enough to the planet that a collision cannot be ruled out. The warning reaches Lhesk on the late radio news. Before dawn the Administration has convened an impact committee, and its first question is one most countries answer without thinking: if the worst is forecast, where will the people go?\n\nSlavia has no inland. The republic is a single province, a city on a plain between hills, mountains and the sea. Every evacuation plan the committee finds in foreign handbooks begins by moving families away from the coast to towns further inside the country. There are no such towns. Any refuge must be underground, at sea or across a frontier, and each of those depends on something the committee does not have: concrete, ships or a neighbour's consent.\n\nNobody knows where fragments might fall, and it may be years before anybody does. The committee could say so plainly and risk alarm, or work quietly until it has a plan worth announcing. Shops on the harbour road are already selling out of bottled water, and the ward offices are taking calls from families who want to know whether they ought to leave the republic now.\n\nProvisional gameplay: date anchor only, Official Chronicle row 1994 / 12.10 in tools/lore/chronicle.json; the Slavian response is gameplay."
 ac_wd_sla.8.a:0 "Tell the city the plain truth."
 ac_wd_sla_8_a:0 "Tell the city the plain truth."
 ac_wd_sla.8.b:0 "Work quietly until there is a plan."
 ac_wd_sla.9.t:0 "A Long Night of Radios"
 ac_wd_sla.9.d:0 "On 8 July 1999 Ulysses comes inside the Roche limit, the distance within which the pull of the planet can tear a body apart. In Lhesk the impact committee has been awake since the previous afternoon. Shelters, berths and route lists stand ready, the harbour road is closed to lorries, and the air guard's radar crews watch screens that were built to find aircraft rather than anything falling from far higher up.\n\nThe city listens to the radio in courtyards and on flat roofs, because July nights are too hot for indoors. Reports from abroad are confused and contradict each other from one bulletin to the next. Some families have gone down to the shelters or out to the quay without being told to; most have stayed at home. The committee's own instructions say to act only on confirmed information, and by midnight it has very little.\n\nWhatever the night brings, the committee must issue a statement by morning. It can set out everything it did and why, mistakes included, or publish a short notice that the city is calm and the plans worked as intended. Readers will compare either version with what they saw from their own windows. The committee has two drafts on the table and one hour before the presses run.\n\nProvisional gameplay: date anchor only, Official Chronicle row 1999 / 07.08 in tools/lore/chronicle.json; no damage in Slavia is claimed or denied."
 ac_wd_sla.9.a:0 "Publish the full account."
 ac_wd_sla.9.b:0 "Issue the short notice."
 ac_wd_sla.10.t:0 "Premiums Before Headlines"
 ac_wd_sla.10.d:0 "The Belkan War begins in late March 1995, a long way from Lhesk. The first the republic hears of it is a news bulletin; the second is a telephone call from a shipping insurer raising every premium on the Slavian register. By the end of the week fuel costs more at the silo, freight rates have jumped, and foreign buyers are asking whether the arms halls could fill a large order quickly.\n\nSlavia has no part in the war and no frontier anywhere near it. Most of the city follows the news with the uneasy distance of people who have watched other countries fight on television before. The arms workers follow it more closely, because orders mean overtime. The defence staff follows it most closely of all, studying what the fighting shows about air power over cities and how long small countries can stay out of the way.\n\nThe Administration must decide how the republic will speak about the war. A plain statement of neutrality now would steady the markets and disappoint the halls. A statement that says only that Slavia is watching would keep every option open and every buyer interested. Whichever is chosen will be read abroad as the republic's position for as long as the fighting lasts.\n\nProvisional gameplay: date anchor only, Official Chronicle row 1995 / 03.25 in tools/lore/chronicle.json; the Slavian response is gameplay."
 ac_wd_sla.10.a:0 "Declare neutrality at once."
 ac_wd_sla.10.b:0 "Say only that Slavia is watching."
 ac_wd_sla.11.t:0 "The Usean War Reaches the Quay"
 ac_wd_sla.11.d:0 "In the summer of 2003 Erusea seizes the Stonehenge railguns in San Salvacion, and in August the FCU forms the ISAF to oppose it. War spreads across Usea. In Lhesk the harbour office hears of it from the insurers before the newspapers can explain it. Premiums on every Slavian convoy rise overnight, and some charterers cancel voyages toward Usean waters altogether.\n\nThe war is far away and the republic is not part of it. Its effects arrive by sea and by telephone: dearer fuel at the silo, buyers asking about rifles and trucks, families with relatives in Usean ports queuing at the harbour office for news. The halls remember the Belkan War and what they decided then. So do the buyers, who know exactly what kind of seller Slavia turned out to be eight years ago.\n\nThe cabinet meets to set a course for a war that may last for years. Some ministers want the convoys kept out of Usean waters entirely until the fighting ends. Others point out that the convoys are how the republic earns its living, and that masters know their own risks. Before any policy is written, the cabinet must decide what it will tell the crews.\n\nProvisional gameplay: date anchors only, Official Chronicle rows 2003 / SUMMER and 2003 / 08.22 in tools/lore/chronicle.json; the Slavian response is gameplay."
 ac_wd_sla.11.a:0 "Keep the convoys out of the war zone."
 ac_wd_sla.11.b:0 "Let each master decide with full information."
 ac_wd_sla.12.t:0 "One Volume, Two Decades of Figures"
 ac_wd_sla.12.d:0 "The second count of the republic is finished, and for the first time Slavia can lay two complete pictures of itself side by side, taken ten years apart. The clerks have counted the same streets, flats, halls and berths and bound the figures in one heavy volume. A city-state has nowhere to hide its numbers, and this volume hides none of them.\n\nSome lines have improved and some have not moved at all. The government that emerged from the quarrel over the overdue ballot has had a decade to show what it can do. The halls still employ most working adults. The harbour handles more cargo or less, depending on choices made years ago. Young Slavians still leave for work abroad, and most who stay still begin their working lives at sixteen in an arms hall.\n\nThe ministers must decide how the volume reaches the public. Sold at the kiosks like a newspaper, it would arm the opposition, the councils and every foreign correspondent at once. Sent first to the wards for comment, it would arrive later with the city's replies bound in, and be called delayed by everyone in a hurry. Either way, the figures will frame the next argument about the republic.\n\nProvisional gameplay."
 ac_wd_sla.12.a:0 "Sell the volume at every kiosk."
 ac_wd_sla.12.b:0 "Send it to the wards first."
 SLA_wd_federal_council_office:0 "Federal Council of the Slavian Federation"
 SLA_wd_federal_council_office_desc:0 "A council chosen by the chamber elected on the overdue ballot, governing collectively and answering to that chamber for every budget and appointment. Provisional gameplay office with no named holder."
 SLA_wd_managers_board_office:0 "Board of Managers of the Republic"
 SLA_wd_managers_board_office_desc:0 "A board of the directors of the arms halls, civil works, harbour and banks, governing the republic as one budget with elections suspended. Provisional gameplay office with no named holder."
 SLA_wd_works_council_office:0 "Federative Council of the Works"
 SLA_wd_works_council_office_desc:0 "A council of delegates elected by the halls, civil works and docks, governing the Slavian Federative Socialist Republic and answerable to the works councils. Provisional gameplay office with no named holder."
 SLA_wd_defence_board_office:0 "Defence Board of the Slavian Republic"
 SLA_wd_defence_board_office_desc:0 "A board of senior officers governing under an ordinance of defence, with parties suspended and civil ministries taking their priorities from the general staff. Provisional gameplay office with no named holder."
 ac_wd_sla_decisions:0 "Slavia: National Measures"
 ac_wd_sla_decisions_desc:0 "Measures from the national programme of Slavia. Provisional gameplay unless a source ledger row says otherwise."
 SLA_wd_canteen_day_decision:0 "Reopen the Canteen Hearings"
 SLA_wd_canteen_day_decision_desc:0 "Ministers spend a week answering the night and day shifts in the canteens of the halls and docks. Repeatable every six months."
 SLA_wd_range_course_decision:0 "Send the Battalions to the Ranges"
 SLA_wd_range_course_decision_desc:0 "Each battalion fires its annual course on the coastal ranges. Repeatable every six months; it costs ammunition from the halls."
 SLA_wd_scramble_call_decision:0 "Call an Unannounced Scramble"
 SLA_wd_scramble_call_decision_desc:0 "The radar crews set a surprise contact and the air guard launches against it. Repeatable once a year."
 SLA_wd_main_runway_decision:0 "Lengthen the Main Runway"
 SLA_wd_main_runway_decision_desc:0 "Extends the original runway and its apron for heavier aircraft. A one-time charge on the air budget."
 SLA_wd_drain_flush_decision:0 "Flush the Drains Before January"
 SLA_wd_drain_flush_decision_desc:0 "Crews flush and inspect every storm drain ahead of the wet season. Repeatable once a year."
 SLA_wd_silo_release_decision:0 "Release Silo Fuel at a Fixed Price"
 SLA_wd_silo_release_decision_desc:0 "Sells fuel from the silo to households and lorries at a fixed price for a season. Repeatable once a year."
