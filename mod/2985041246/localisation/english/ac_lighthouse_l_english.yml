 ac_lhw_ose_war_footing_desc:0 "The ACES Chronicle records Erusea's declaration of war on the Osean Federation for 15 May 2019 (2019 / 05.15). The federation is on a war footing until the fighting actually ends; this campaign fixes no end date."
 ac_lhw_eru_elevator_held:0 "The Space Elevator Held"
 ac_lhw_eru_elevator_held_desc:0 "Erusean forces hold the International Space Elevator, as the Chronicle records (2019 / 05.15). Holding it steadies the kingdom and ties down its forces; the values are provisional gameplay."
 ac_lhw_eru_arsenal_birds_two:0 "Two Arsenal Birds Over the Elevator"
 ac_lhw_eru_arsenal_birds_two_desc:0 "The official abstract records that Erusea seized control of the Arsenal Birds with the elevator (Abstracts, ACE COMBAT 7). Both unmanned aircraft the Osean project completed screen the elevator for Erusea; the modifier is provisional gameplay."
 ac_lhw_eru_arsenal_bird_one:0 "One Arsenal Bird Over the Elevator"
 ac_lhw_eru_arsenal_bird_one_desc:0 "The Chronicle records that the Arsenal Bird Liberty was shot down by a reactivated Stonehenge battery (2019 / 08.19). One of the two seized aircraft remains; the modifier is provisional gameplay."
 ac_lhw_ose_ports_struck:0 "Four Ports Struck"
 ac_lhw_ose_ports_struck_desc:0 "The Chronicle records terrorist strikes by drones at four major naval ports in Osea (2019 / 05.15). Naval coordination and repair suffer for ninety days; the value is provisional gameplay."
 ac_lhw_ose_eastern_wind:0 "Operation Eastern Wind"
 ac_lhw_ose_eastern_wind_desc:0 "The Chronicle records that Osean forces work with the IUN Peacekeeping Force in Operation Eastern Wind and that the advance into Erusean-held territory has begun (2019 / 05.17). The operation strains supply for ninety days; the value is provisional gameplay."
 ac_lhw_ose_kestrel_ii_lost:0 "Kestrel II Lost"
 ac_lhw_ose_kestrel_ii_lost_desc:0 "The Chronicle records that the aircraft carrier Kestrel II, a cornerstone of the attack on Farbanti, was sunk and that the offensive ended in failure (2019 / 05.30). Naval coordination suffers for ninety days; the value is provisional gameplay."
 ac_lhw_ose_strike_group:0 "The Long Range Strategic Strike Group"
 ac_lhw_ose_strike_group_desc:0 "The Chronicle records that Osean forces formed the Long Range Strategic Strike Group in hopes of ending the war quickly (2019 / 08.10). The group improves air missions until the fighting ends; the value is provisional gameplay."
 ac_lhw_ose_stonehenge_battery:0 "A Stonehenge Battery Reactivated"
 ac_lhw_ose_stonehenge_battery_desc:0 "The Chronicle records that Osean forces reactivated one of Stonehenge's anti-asteroid batteries (2019 / 08.19). The battery supports the federation's air defence for 120 days; the value is provisional gameplay."
 ac_lhw_eru_capital_attacked:0 "Farbanti Under Attack"
 ac_lhw_eru_capital_attacked_desc:0 "The Chronicle records that Osean forces began an attack on Farbanti (2019 / 09.19). The capital's administration suffers for sixty days; the value is provisional gameplay."
 ac_lhw_usea_blackout:0 "Network communications across Usea were cut"
 ac_lhw_usea_blackout_desc:0 "The Chronicle records that an operation to destroy military satellites cut off network communications across the entire Usean continent (2019 / 09.19). Every Continental War participant feels it for ninety days; the value is provisional gameplay."
 ac_lhw_eru_internal_conflict:0 "Internal Conflict"
 ac_lhw_eru_internal_conflict_desc:0 "The Chronicle records that Shilage and other small nations annexed by Erusea declared independence, that Erusea refused to recognise them and that internal conflict followed (2019 / 10.01). The conflict weighs on the kingdom for 120 days; the value is provisional gameplay. No border changes."
 ac_lhw_eru_restraint_kept:0 "A Declaration Withheld"
 ac_lhw_eru_restraint_kept_desc:0 "Erusea's government withheld the declaration of war the ACES Chronicle records for 15 May 2019 (2019 / 05.15), under the treaty obligations it chose to keep. This earned alternative is provisional gameplay."
 ac_lhw_eru_fought_on:0 "Fighting On Past Expo City"
 ac_lhw_eru_fought_on_desc:0 "Erusea refused the ceasefire the ACES Chronicle records for 1 December 2019 (2019 / 12.01) and fights on. This provisional alternative weighs on the kingdom for 180 days."
 ac_lhw_ose_war_record:0 "Osea: The War Record"
 ac_lhw_ose_war_record_desc:0 "A public record of the Lighthouse War is being compiled for 180 days. It costs political attention and steadies a country that wants to know what happened. Provisional gameplay."
 ac_sp_arsenal_birds_elevator_screen:0 "The Arsenal Birds"
 ac_sp_arsenal_birds_elevator_screen_desc:0 "§YProvisional gameplay§! reward. Two unmanned Arsenal Birds, the prototype Liberty and the upgraded Justice, maintain a defensive radius around the International Space Elevator (Super Weapons, Arsenal Birds). Their effect lasts while Osea controls them."
 ac_sp_alicorn_cruiser:0 "The Alicorn in Custody"
 ac_sp_alicorn_cruiser_desc:0 "§YProvisional gameplay§! reward. The Erusean Royal Navy's submarine aviation cruiser Alicorn is complete and held under the custody rules the republic wrote for it (Super Weapons, Alicorn). It is never deployed by script."
 ac_lhw.1.t:0 "The Lighthouse War Begins"
 ac_lhw.1.d:0 "Terrorist strikes by drones have hit four major naval ports in Osea. On the same day the Kingdom of Erusea declared war on the Osean Federation, and Erusean forces captured the International Space Elevator. The war the ACES Chronicle calls the Lighthouse War has begun (2019 / 05.15).\n\nThe official product page records Erusea's stated grievance: it accuses Osea of massive overreach in their joint international projects. The Chronicle gives no reason for the declaration, and this campaign asserts none beyond the stated accusation. The war ends when the fighting actually ends, not on a calendar date."
 ac_lhw.1.a:0 "The continent is at war."
 ac_lhw.2.t:0 "The Declaration That Erusea Withheld"
 ac_lhw.2.d:0 "15 May 2019 has passed without an Erusean declaration of war. The kingdom kept the treaty obligations it chose after the oversight years and withheld the declaration the ACES Chronicle records for this day (2019 / 05.15).\n\nThis is an earned alternative to the official record and is provisional gameplay. Osea has made no corresponding undertaking, and nothing prevents a later war by other means."
 ac_lhw.2.a:0 "Record the restraint."
 ac_lhw.3.t:0 "Osea and Erusea Already at War"
 ac_lhw.3.d:0 "On the date the ACES Chronicle gives for Erusea's declaration of war on Osea (2019 / 05.15), the two countries were already fighting one another by other means.\n\nThe Lighthouse War owner records that war and observes it from outside: it asserts none of the official course and issues no further dated news. The war's end will be recorded when the fighting actually stops."
 ac_lhw.3.a:0 "Observe the war as it is."
 ac_lhw.4.t:0 "Other Fighting Enters the Lighthouse War"
 ac_lhw.4.d:0 "A third country is now at war with Osea or Erusea. The war between the two is no longer the complete explanation of the fighting, and the Lighthouse War owner moves to external observation.\n\nThe dated news of the official course stops here. The war's end will still be recorded when the fighting between Osea and Erusea actually stops."
 ac_lhw.4.a:0 "Observe the wider war."
 ac_lhw.7.t:0 "A Ceasefire at Expo City"
 ac_lhw.7.d:0 "Osea and Erusea have signed a ceasefire treaty at the Expo City Conference, as the ACES Chronicle records for 1 December 2019 (2019 / 12.01). The fighting between them has stopped.\n\nThe official abstract records that a voluntary coalition of Osean forces and a traditionalist sect of the Erusean Army forced the surrender of the Erusean Army radicals before the ceasefire. This campaign asserts that only where its own course ran that far; it creates no coalition, sect or faction, and it records the end on the day the war actually ended."
 ac_lhw.7.a:0 "Begin the accounting."
 ac_lhw.8.t:0 "An Early Ceasefire"
 ac_lhw.8.d:0 "Osea and Erusea have signed a ceasefire before the Expo City Conference the ACES Chronicle records for 1 December 2019 (2019 / 12.01). Erusea's elevator policy earned it the standing to offer one, and Osea accepted.\n\nThis is an earned alternative to the official record and is provisional gameplay. The fighting has stopped; the war's account begins."
 ac_lhw.8.a:0 "Begin the accounting."
 ac_lhw.9.t:0 "Erusea Capitulates"
 ac_lhw.9.d:0 "Erusea has capitulated. The war between Osea and Erusea ends in an Osean victory.\n\nThe ACES Chronicle records a different end: a ceasefire treaty signed at the Expo City Conference on 1 December 2019 (2019 / 12.01). This outcome is the actual result of the campaign, not the official one."
 ac_lhw.9.a:0 "Record the outcome."
 ac_lhw.10.t:0 "Osea Capitulates"
 ac_lhw.10.d:0 "Osea has capitulated. The war between Osea and Erusea ends in an Erusean victory.\n\nThe ACES Chronicle records a different end: a ceasefire treaty signed at the Expo City Conference on 1 December 2019 (2019 / 12.01). This outcome is the actual result of the campaign, not the official one."
 ac_lhw.10.a:0 "Record the outcome."
 ac_lhw.11.t:0 "The Lighthouse War Ends"
 ac_lhw.11.d:0 "The fighting between Osea and Erusea has stopped. Neither country capitulated, and no ceasefire treaty was signed through this owner.\n\nThe ACES Chronicle records the war's end at the Expo City Conference on 1 December 2019 (2019 / 12.01). This campaign records the end on the day the fighting actually ceased, which is today."
 ac_lhw.11.a:0 "Begin the accounting."
 ac_lhw.12.t:0 "The Fighting Between Osea and Erusea Stops"
 ac_lhw.12.d:0 "The fighting between Osea and Erusea has stopped. The Lighthouse War owner observed this war from outside and asserts nothing about how it was fought.\n\nThe ACES Chronicle's course for the war (2019 / 05.15 to 12.01) is not asserted here; the end is recorded on the day the fighting actually ceased."
 ac_lhw.12.a:0 "Record the cessation."
 ac_lhw.13.t:0 "Erusea Fights On"
 ac_lhw.13.d:0 "Erusea has refused the ceasefire the ACES Chronicle records for the Expo City Conference (2019 / 12.01) and fights on.\n\nThis is a provisional alternative to the official record. The owner issues no further dated news; the war's end will be recorded when the fighting actually stops."
 ac_lhw.13.a:0 "The war goes on."
 ac_lhw.20.t:0 "Operation Eastern Wind"
 ac_lhw.20.d:0 "Osean forces are working with the IUN Peacekeeping Force in Operation Eastern Wind. The advance into Erusean-held territory has begun (2019 / 05.17).\n\nThe Chronicle names the operation and the force; this campaign creates neither and moves no territory by script."
 ac_lhw.20.a:0 "The advance begins."
 ac_lhw.21.t:0 "Kestrel II Sunk"
 ac_lhw.21.d:0 "A two-pronged offensive to secure Chopinburg airspace and attack the Erusean capital of Farbanti has failed. The aircraft carrier Kestrel II, a cornerstone of the attack on Farbanti, has been sunk (2019 / 05.30).\n\nThe Chronicle records the failure and the loss; no ship is represented and no state changes hands."
 ac_lhw.21.a:0 "Count the losses."
 ac_lhw.22.t:0 "Former President Harling Dies"
 ac_lhw.22.d:0 "Osean forces attempted to rescue former president Vincent Harling from the space elevator. The former president was caught in an attack during the operation and died (2019 / 06.06).\n\nThe Chronicle does not say whose attack it was; the official abstract calls the rescue attempt botched. This campaign records the death as the record gives it and asserts nothing more."
 ac_lhw.22.a:0 "Mourn."
 ac_lhw.23.t:0 "The Long Range Strategic Strike Group"
 ac_lhw.23.d:0 "Osean forces have formed the Long Range Strategic Strike Group in hopes of ending the war quickly (2019 / 08.10).\n\nThe Chronicle names the group; this campaign creates no unit and records the decision as Osea's own."
 ac_lhw.23.a:0 "Form the group."
 ac_lhw.24.t:0 "Stonehenge Fires Again"
 ac_lhw.24.d:0 "Osean forces have reactivated one of Stonehenge's anti-asteroid batteries and shot down the Arsenal Bird Liberty (2019 / 08.19).\n\n[ac_lhw_liberty_text]"
 ac_lhw.24.a:0 "The battery holds."
 ac_lhw.25.t:0 "Farbanti and the Blackout"
 ac_lhw.25.d:0 "Osean forces have begun an attack on Farbanti. An operation to destroy military satellites has cut off network communications across the entire Usean continent (2019 / 09.19).\n\nThe Chronicle does not say whose operation it was, and this campaign does not. The blackout weighs on every Continental War participant for ninety days; the value is provisional gameplay. The attack is reported only because Osean forces actually hold Erusean ground; no territory was moved by script."
 ac_lhw.25.a:0 "The screens go dark."
 ac_lhw.26.t:0 "Declarations of Independence"
 ac_lhw.26.d:0 "The autonomous state of Shilage and other small nations annexed by the Kingdom of Erusea have declared independence. The Erusean government refuses to recognise their independence, and internal conflict follows (2019 / 10.01).\n\n[ac_lhw_shilage_text]\n\nNo territory changes hands by script; the declarations are recorded as the Chronicle records them."
 ac_lhw.26.a:0 "Answer the declarations."
 ac_lhw.27.t:0 "General Labarthe Killed"
 ac_lhw.27.d:0 "Erusean conservative General Édouard Labarthe has been killed by Osean forces (2019 / 10.10).\n\nThe Chronicle gives the fact and his description; this campaign records no more."
 ac_lhw.27.a:0 "Note the record."
 ac_lhw.28.t:0 "The Clash at the Space Elevator"
 ac_lhw.28.d:0 "Osean and Erusean forces have clashed near the space elevator, and the Arsenal Bird Justice has been shot down (2019 / 10.31).\n\nThe official abstract records that a voluntary coalition of Osean forces and a traditionalist sect of the Erusean Army shot it down and forced the surrender of the Erusean Army radicals. This campaign records the clash and the loss; it creates no coalition, sect or faction."
 ac_lhw.28.a:0 "The sky over the elevator clears."
 ac_lhw.29.t:0 "The Arsenal Birds Change Hands"
 ac_lhw.29.d:0 "Erusea has seized control of the Arsenal Birds with the International Space Elevator, as the official abstract records for 15 May 2019 (Abstracts, ACE COMBAT 7).\n\nThe two unmanned aircraft the Osean project completed now screen the elevator for Erusea. The modifier is provisional gameplay; the aircraft remain text, not units."
 ac_lhw.29.a:0 "The birds fly for Erusea."
 ac_lhw.5.t:0 "The Declaration of 15 May 2019"
 ac_lhw.5.d:0 "Drones have struck four major naval ports in Osea. The ACES Chronicle records that on this day the Kingdom of Erusea declared war on the Osean Federation and captured the International Space Elevator (2019 / 05.15). The official product page records the kingdom's stated grievance: massive Osean overreach in their joint international projects.\n\nThe government can declare the war the record describes, or withhold the declaration under the treaty obligations it chose to keep, if that record was earned: the oversight file closed and the obligations kept as policy. Withholding is a provisional alternative to the official record."
 ac_lhw.5.a:0 "Declare war on Osea."
 ac_lhw.5.b:0 "Withhold the declaration under the obligations kept."
 ac_lhw.6.t:0 "The Expo City Conference"
 ac_lhw.6.d:0 "The ACES Chronicle records that Osea and Erusea signed a ceasefire treaty at the Expo City Conference on 1 December 2019 (2019 / 12.01).\n\nThe government can sign the ceasefire the record describes, or fight on. Fighting on is a provisional alternative; the owner then issues no further dated news, and the war's end is recorded when the fighting actually stops."
 ac_lhw.6.a:0 "Sign the ceasefire."
 ac_lhw.6.b:0 "Fight on."
 ac_lhw_ose_crisis:0 "Osea: The Lighthouse War"
 ac_lhw_ose_crisis_desc:0 "[ac_lhw_status_text]\n\nThe war owner follows the ACES Chronicle's 2019 entries as reference anchors. It changes no territory, creates no unit and ends the war only when the fighting actually stops or the ceasefire is actually signed."
 OSE_lw_strike_group:0 "Form the Long Range Strategic Strike Group"
 OSE_lw_strike_group_desc:0 "Form the strike group the Chronicle records for 10 August 2019 (2019 / 08.10). Its air missions improve until the war ends. Once per war; provisional gameplay."
 OSE_lw_repair_ports:0 "Repair the Struck Ports"
 OSE_lw_repair_ports_desc:0 "Repair the four naval ports the drones struck (2019 / 05.15) and end the coordination penalty early. Once; provisional gameplay."
 OSE_lw_war_record:0 "Compile the War Record"
 OSE_lw_war_record_desc:0 "Compile a public record of the Lighthouse War over 180 days. It costs political attention and steadies the country. Once; provisional gameplay."
 ERU_lw_early_ceasefire:0 "Offer an Early Ceasefire"
 ERU_lw_early_ceasefire_desc:0 "Offer Osea a ceasefire before the Expo City Conference the Chronicle records for 1 December 2019 (2019 / 12.01). Requires the elevator kept running as policy. If the engine accepts the peace, the war ends now; this earned alternative is provisional gameplay."
 ac_sp_arsenal_birds:0 "Arsenal Birds"
 ac_sp_arsenal_birds_desc:0 "Massive unmanned aircraft to defend the International Space Elevator, powered by microwave energy sent from the elevator itself and resupplied by unmanned ships launched from the Tyler Island Mass Driver (Super Weapons, Arsenal Birds). Two are planned: the prototype Liberty and the upgraded Justice.\n\n§YProvisional gameplay§!: the opening date and reward values are balance choices. The Chronicle records both aircraft shot down in 2019."
 ac_sp_arsenal_birds_reward_elevator_trials:0 "Elevator Trials"
 ac_sp_arsenal_birds_reward_elevator_trials_desc:0 "The first flight trials around the elevator show that the microwave power link holds further out than the design assumed. The programme can commit both airframes to the trials now, or keep the second on the ground until the first has flown a full rotation."
 ac_sp_arsenal_birds_reward_elevator_trials_two_airframes:0 "Fly both airframes"
 ac_sp_arsenal_birds_reward_elevator_trials_one_airframe:0 "Fly one airframe first"
 ac_sp_alicorn:0 "Alicorn"
 ac_sp_alicorn_desc:0 "A nuclear-powered submarine for the Erusean Royal Navy's Rán Fleet: 495 metres long, both an aircraft carrier and a long-range railgun platform, designed to strike while submerged and beyond enemy reach (Super Weapons, Alicorn). Requires the submarine cruiser authorised and its custody rules set.\n\n§YProvisional gameplay§!: the gate, timing and reward values are balance choices. The cruiser is built and held in custody; it is never deployed by script."
 ac_sp_alicorn_reward_custody_crews:0 "Custody Crews"
 ac_sp_alicorn_reward_custody_crews_desc:0 "The cruiser's first crew is being chosen while the hull is still in the yard. The custody rules the republic wrote can be built into the crew's training now, or the fleet can choose its own crew first and read the rules afterwards."
 ac_sp_alicorn_reward_custody_crews_written:0 "Train the crew to the custody rules"
 ac_sp_alicorn_reward_custody_crews_fleet:0 "Let the fleet choose its crew"
 ac_sp_tag_unmanned_aviation:0 "Unmanned Aviation Projects"
 ac_sp_tag_unmanned_aviation_speed_factor:0 "Unmanned Aviation Projects Speed"
 ac_sp_tag_unmanned_aviation_speed_factor_tt:0 " $ac_sp_tag_unmanned_aviation_speed_factor$: $RIGHT|+=%1$"
 ac_sp_tag_submarine_aviation:0 "Submarine Aviation Projects"
 ac_sp_tag_submarine_aviation_speed_factor:0 "Submarine Aviation Projects Speed"
 ac_sp_tag_submarine_aviation_speed_factor_tt:0 " $ac_sp_tag_submarine_aviation_speed_factor$: $RIGHT|+=%1$"
 ac_superweapons_arsenal_birds:0 "Arsenal Birds"
 ac_superweapons_arsenal_birds_desc:0 "Without the special-projects feature, the Arsenal Birds programme runs as a timed decision and grants the same reward as the project (Super Weapons, Arsenal Birds). It is cancelled if the Chronicle's loss of both aircraft is reached first.\n\n§YProvisional gameplay§!: cost and duration are balance choices."
 ac_superweapons_alicorn:0 "Alicorn"
 ac_superweapons_alicorn_desc:0 "Without the special-projects feature, the Alicorn programme runs as a timed decision and grants the same reward as the project (Super Weapons, Alicorn). Requires the submarine cruiser authorised and its custody rules set.\n\n§YProvisional gameplay§!: cost and duration are balance choices."
 ac_lhw_status_0:0 "Ended: Erusea capitulated. The ceasefire the Chronicle records for 1 December 2019 did not occur."
 ac_lhw_status_1:0 "Ended: Osea capitulated. The ceasefire the Chronicle records for 1 December 2019 did not occur."
 ac_lhw_status_2:0 "Ended: the ceasefire was signed after the official course had run to the clash at the elevator. The Chronicle's Expo City date is a reference anchor; the war ended on the day it was actually signed."
 ac_lhw_status_3:0 "Ended: an early ceasefire was earned and signed before the Expo City date (earned alternative, provisional gameplay)."
 ac_lhw_status_4:0 "Ended: the ceasefire was signed before the official course had run its length. The Chronicle's Expo City date is a reference anchor."
 ac_lhw_status_5:0 "Ended: the fighting stopped while the owner observed the war from outside."
 ac_lhw_status_6:0 "Ended: the fighting stopped without a ceasefire signed through this owner. The Chronicle's Expo City date is a reference anchor."
 ac_lhw_status_7:0 "Running past the Expo City date: Erusea refused the ceasefire (provisional alternative); the official course is complete and the end will be recorded when the fighting stops."
 ac_lhw_status_8:0 "Running under external observation: the ceasefire was signed but the engine kept the war; the end will be recorded when the fighting stops."
 ac_lhw_status_9:0 "Running under external observation: other fighting entered the war, and the official course is no longer asserted."
 ac_lhw_status_10:0 "Running under external observation: Osea and Erusea were already at war when the Chronicle's declaration date came."
 ac_lhw_status_11:0 "Running on the official course since the declaration the Chronicle records for 15 May 2019 (2019 / 05.15)."
 ac_lhw_status_12:0 "Withheld: Erusea kept its obligations and did not declare (earned alternative, provisional gameplay)."
 ac_lhw_status_13:0 "Closed: the Continental War did not end in an ISAF victory in this history, so the sourced 2019 route is unreachable. No war is invented in its place."
 ac_lhw_status_14:0 "Closed: the principal pair could not fight the recorded war, or the record's dates had passed."
 ac_lhw_status_15:0 "Pending: the ACES Chronicle records Erusea's declaration of war on Osea for 15 May 2019."
 ac_lhw_liberty_text_0:0 "In this campaign the Arsenal Birds were completed and seized with the elevator; one remains over it. The modifier is provisional gameplay."
 ac_lhw_liberty_text_1:0 "In this campaign no Arsenal Bird project was completed. The Chronicle's Liberty is recorded as the source names it; no airframe is represented."
 ac_lhw_shilage_text_0:0 "Shilage exists as a country in this campaign. Its standing is its own, and this record changes nothing about it."
 ac_lhw_shilage_text_1:0 "Shilage was released and later annexed in this campaign. The declaration is recorded as the Chronicle records it; nothing is released by script."
 ac_lhw_shilage_text_2:0 "Shilage is not a country in this campaign. The Chronicle's declaration is recorded in text only."
 ac_lhw_shilage_text_3:0 "Whether Shilage exists as a country in this campaign is not changed by this record."
 ERU_lw_route_context_0:0 "The ISAF's victory of 2005 and the oversight years that followed are in the files, with Free Erusea's insurrection and its defeat by Mobius 1 in 2006. The road the official record describes for 2019 runs through this history."
 ERU_lw_route_context_1:0 "The ISAF's victory of 2005 and the oversight years that followed are in the files, with Free Erusea's insurrection among them. The road the official record describes for 2019 runs through this history."
 ERU_lw_route_context_2:0 "The war ended in Erusea's favour. The files hold garrison returns and the accounts of districts the republic still administers; the official record's 2019 war belongs to a history this republic did not have."
 ERU_lw_route_context_3:0 "The war ended in an armistice. The files hold the armistice terms and the incident reports from the line; the official record's 2019 war belongs to a history this republic did not have."
 ERU_lw_route_context_4:0 "The war many expected did not come. The files hold the emergency rules written for it; the official record's 2019 war belongs to a history this republic did not have."
 ERU_lw_route_context_5:0 "The files hold the records of the Continental War years and the obligations they left behind."
 FCU_lw_route_context_0:0 "Since 2005 the federation has supported Erusea's provisional government under ISAF oversight, and it has watched that oversight end."
 FCU_lw_route_context_1:0 "The Continental War ended in Erusea's favour, and the federation's undertakings were made for a continent that war reshaped."
 FCU_lw_route_context_2:0 "The Continental War ended in an armistice, and several undertakings assumed a peace treaty that was never signed."
 FCU_lw_route_context_3:0 "The Continental War did not come, and several undertakings were made for a war that never started."
 FCU_lw_route_context_4:0 "Several undertakings were made for circumstances that have since changed."
