l_english:
 ac_anea.1.t:0 "An Emmerian Relief Accord"
 ac_anea.1.d:0 "Emmeria proposes a standing civilian relief accord. Every service period will require a fresh allocation, and the recipient must choose who controls distribution. The founding offer expires after sixty days; its acceptance does not deliver supplies on its own."
 ac_anea.1.a:0 "Accept the accord and its separate service authorisations."
 ac_anea.1.b:0 "Rely on domestic recovery."
 ac_anea.1.c:0 "Record that the offer is no longer actionable."
 ac_anea.10.t:0 "Anean Reconstruction Sanctions"
 ac_anea.10.d:0 "The reconstruction review has ended in sanctions. Diversion, administrative failures and incomplete verified deliveries have prevented an agreed alternative. Humanitarian services may resume under monitored distribution, and a later review can recognise actual reform."
 ac_anea.10.a:0 "Record the actual outcome."
 ac_anea.11.t:0 "An Alternative to Sanctions"
 ac_anea.11.d:0 "Two monitored relief services and an audited distribution system have given the reconstruction review a different outcome. Cooperation will continue under the live accord. This is an earned campaign alternative to the historical sanctions course."
 ac_anea.11.a:0 "Record the actual outcome."
 ac_anea.12.t:0 "Verified Reform Changes the Review"
 ac_anea.12.d:0 "The record now includes audited distribution, two completed monitored services and sufficient civilian recovery. Sanctions have been lifted. The earlier review remains part of the national record; completed costs and aid are not replayed."
 ac_anea.12.a:0 "Record the actual outcome."
 ac_anea.20.t:0 "An Anean Consultative Bureau"
 ac_anea.20.d:0 "Emmeria and Estovakia have opened a civilian bureau for technical information and relief logistics. Nordennavic is invited to participate without a change of government, border or military alignment. A refusal leaves the bilateral bureau in place."
 ac_anea.20.a:0 "Participate in civilian coordination."
 ac_anea.20.b:0 "Keep our existing arrangements."
 ac_anea_prepare_decision:0 "Exercise Civil Protection"
 ac_anea_prepare_decision_desc:0 "Commit 25 political power and 180 days of civilian construction attention to gain 3 preparedness. This is a shelter, evacuation and emergency-supply exercise; it expires before the crisis."
 ac_anea_repair_decision:0 "Fund a Domestic Repair Programme"
 ac_anea_repair_decision_desc:0 "Commit 35 political power and 180 days of civilian construction attention to gain 4 recovery. Domestic repair remains useful if aid is refused, suspended or interrupted."
 ac_anea_train_decision:0 "Protect Readiness Training"
 ac_anea_train_decision_desc:0 "Commit 25 political power and 180 days of civilian construction attention to gain 6 army experience and 3 air experience. Training does not increase civil preparedness."
 EMM_an_enter_campaign:0 "Enter the Anean Campaign"
 EMM_an_enter_campaign_desc:0 "After the current generic focus is finished, adopt the new national campaign while retaining completed content. No starting army, industry, technology or historical preparation rewards are granted."
 EVA_an_enter_campaign:0 "Enter the Anean Campaign"
 EVA_an_enter_campaign_desc:0 "After the current generic focus is finished, adopt the new national campaign while retaining completed content. No starting army, industry, technology or historical preparation rewards are granted."
 ac_anea_offer_decision:0 "Propose the Relief Accord"
 ac_anea_offer_decision_desc:0 "Send the once-only founding offer. Estovakia has sixty days to respond. Separate service authorisations pay for actual assistance."
 ac_anea_serve_decision:0 "Authorise a Relief Service"
 ac_anea_serve_decision_desc:0 "Pay 25 political power and carry a 1% consumer-goods burden for 180 days. Monitored participation also costs Estovakia 15 political power. Three deliveries give 4 recovery each under monitoring, or 2 each under command distribution. Completion is followed by a 180-day cooldown."
 ac_anea_resume_decision:0 "Reopen Aid under Audited Distribution"
 ac_anea_resume_decision_desc:0 "Pay 25 political power to reopen the suspended accord after Estovakia adopts audited distribution. Service authorisation remains a separate payment."
 ac_anea_review_decision:0 "Recognise Verified Reconstruction Reform"
 ac_anea_review_decision_desc:0 "Lift active sanctions after audited distribution, two completed monitored services, recovery of at least 40 and a still-valid accord. This does not undo the earlier review or replay rewards."
 ac_anea_bureau_decision:0 "Open the Anean Consultative Bureau"
 ac_anea_bureau_decision_desc:0 "Coordinate civilian information and relief logistics with Estovakia. Invite Nordennavic where eligible. This creates no common state, military alliance or forced integration."
 ac_anea_recovery:0 "Anea: Civil Protection and Recovery"
 ac_anea_recovery_desc:0 "Preparedness: [?ac_anea_preparedness|0]/100. Recovery: [?ac_anea_recovery|0]/100.\n\nCivil protection changes the crisis starting position. Domestic repair restores civilian capacity. Readiness training protects military skills at an opportunity cost. These are provisional campaign measures."
 ac_anea_relief:0 "Anea: Aid and Regional Cooperation"
 ac_anea_relief_desc:0 "[GetAneaAccordStatus]\n[GetAneaSanctionsStatus]\n\nCurrent service deliveries: [?EMM.ac_anea_service_stage|0]/3. Completed monitored services: [?EMM.ac_anea_monitored_cycles|0].\n\nAn alternative to sanctions requires audited Estovakian distribution, two completed monitored services, recovery of at least 40 and a valid accord. Each service and cooldown lasts 180 days."
 ac_anea_relief_burden:0 "Anean Relief Allocation"
 ac_anea_relief_burden_desc:0 "A funded 180-day relief service reserves civilian production. Paid allocations and completed deliveries persist if cooperation ends."
 ac_anea_monitored_service:0 "Monitored Relief Administration"
 ac_anea_monitored_service_desc:0 "Civil administrators maintain audited distribution during the service. Their political allocation was paid at authorisation."
 ac_anea_sanctions:0 "Reconstruction Sanctions"
 ac_anea_sanctions_desc:0 "Restrictions following the reconstruction review impede imports and industrial recovery. Verified reform can earn reconsideration."
 ac_anea_bureau:0 "Anean Civilian Consultation"
 ac_anea_bureau_desc:0 "Civilian technical and logistics coordination improves rebuilding. This office carries no military or constitutional integration."
 ac_anea_domestic_works:0 "Competing National Allocations"
 ac_anea_domestic_works_desc:0 "The current civil-protection, repair or training allocation ties up some civilian construction attention for 180 days."
 ac_anea_status_frozen:0 "Suspended: distribution reform is required."
 ac_anea_status_live:0 "Accepted and eligible for renewed service."
 ac_anea_status_pending:0 "Awaiting a reply within the 60-day window."
 ac_anea_status_none:0 "No active bilateral accord."
 ac_anea_status_sanctions:0 "Sanctions active."
 ac_anea_status_alternative:0 "Monitored cooperation chosen at the review."
 ac_anea_status_lifted:0 "Sanctions lifted after verified reform."
 ac_anea_status_review:0 "No current sanctions decision."
 ac_anea_accord_tt:0 "The accord permits separately funded 180-day services. Acceptance grants no equipment or recovery by itself."
 ac_anea_service_tt:0 "Pay the authorisation costs once. Deliveries occur after 60, 120 and 180 days, subject to continued eligibility. Completed aid is retained if the service is interrupted."
