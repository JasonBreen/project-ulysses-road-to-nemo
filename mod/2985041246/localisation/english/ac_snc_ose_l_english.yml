 OSE_snc_contact_verification_protocol:0 "Exercise the Countercheck"
 OSE_snc_contact_verification_protocol_desc:0 "The next review begins with two deliberately incompatible reports and a receiving officer who is not allowed to reconcile them by deleting either one. Request a fresh funded period through the existing air-watch service. The selected civil or protected lane must actually deliver that work after this instruction. Old exercise results remain useful background, but cannot certify the present chain. At the end, the office must show where the second account entered, who answered it, and whether an urgent instruction reached its recipient with its uncertainty still attached."
 OSE_snc_contact_verification_protocol_requirements_tt:0 "From 2006.1.1, an active national administration and the required earlier work are available. The selected policy remains exclusive; conclusions remain available when their real prerequisites finish after the expected calendar."
 OSE_snc_contact_verification_protocol_effect_tt:0 "Open a fresh review request. Complete the corresponding selected-lane SNP service after this request; existing payments and national reservations remain owned by that service."
 OSE_snc_contact_verification_review:0 "Hear the Controller Again"
 OSE_snc_contact_verification_review_desc:0 "The controller is invited back after the funded period, before its results have been condensed into a favourable summary. She identifies one warning that was improved by a second account and another that remained unresolved. The committee asks whether the receiving chain understood the difference. Its review uses completed work, including the delays that the selected policy accepted. An interrupted exercise provides no substitute for that return. The useful finding may be a limit rather than a success: there are instructions the government should be unable to issue confidently until somebody answers the person listening at the first desk."
 OSE_snc_contact_verification_review_requirements_tt:0 "From 2006.1.1, an active national administration and the required earlier work are available. A corresponding selected-lane funded service must have genuinely completed after this branch requested its review."
 OSE_snc_contact_verification_review_effect_tt:0 "Record the corresponding genuinely completed funded period after this branch requested it."
