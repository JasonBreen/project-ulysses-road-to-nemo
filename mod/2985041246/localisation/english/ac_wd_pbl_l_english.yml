l_english:
 PBL_wd_crown_court_sits:0 "The Court Sits at Gatewood"
 PBL_wd_crown_court_sits_desc:0 "The crown opens the 1991 session at Gatewood with a kingdom that runs on arms plants, a service year and four crown lands that answer to one throne. Before any reform, the court has to agree who actually governs. Opening the question costs the palace its habit of deciding in private, but it buys every faction a hearing."
 PBL_wd_crown_powers_ledger:0 "A Ledger of Royal Powers"
 PBL_wd_crown_powers_ledger_desc:0 "Clerks of the court list every power the crown actually uses: appointments, war powers, the budget seal, the pardon and the right to dissolve the chamber. The list is dull and dangerous at once, because every faction will read it as a menu. Compiling it spends political capital and makes the next choice unavoidable."
 PBL_wd_crown_powers_ledger_tt_1:0 "Opens the four constitutional paths; only one can be taken."
 PBL_wd_crown_parliament_path:0 "Ministers Answer to the Chamber"
 PBL_wd_crown_parliament_path_desc:0 "The constitutional camp wants the crown kept and the cabinet made answerable to an elected chamber. Ministers would face questions, budgets would be voted and the palace would sign rather than decide. It is the path closest to how the kingdom already claims to work, and it costs the crown the quiet authority it still enjoys."
 PBL_wd_crown_privy_path:0 "The Seals Return to the Palace"
 PBL_wd_crown_privy_path_desc:0 "Courtiers argue that a kingdom with a fragile arms economy cannot wait on chamber votes. They propose that the great seals, the budget and the officer lists go back to a privy council chosen by the throne, with the chamber left to advise. The palace gains speed. The parties lose their reason to cooperate with anyone."
 PBL_wd_crown_order_path:0 "The Doctrine of Order"
 PBL_wd_crown_order_path_desc:0 "A hard faction at court, followers of the creed called Perblan Totalitarianism, holds that elected governments slide back into greed and self-interest the moment they feel safe. It offers obedience in exchange for safety: rule by decree, a policed press and a crown that answers to no chamber. Order arrives quickly; consent never does."
 PBL_wd_crown_assembly_path:0 "The Assembly Claims the Seals"
 PBL_wd_crown_assembly_path_desc:0 "Deputies from the four crown lands propose that the elected assembly govern in its own name, with the crown kept as a ceremonial office above party. It would end the throne's working role while keeping its symbols. Industrial towns and the Relentio ports favour the idea; the officer corps and the palace staff do not."
 PBL_wd_crown_parliament_ministry:0 "Form the Crown Ministry"
 PBL_wd_crown_parliament_ministry_desc:0 "A cabinet drawn from the chamber majority takes the government seals, and the crown is bound to act on ministerial advice. The change runs through the office, not a person: the ministry governs collectively and answers for its budget. The palace loses daily control, and the chamber gains the blame for every bad year."
 PBL_wd_crown_privy_council:0 "Convene the Privy Council"
 PBL_wd_crown_privy_council_desc:0 "The throne names a small privy council to hold the seals, the officer lists and the budget. Elections are suspended while the council governs by order, keeping the chamber as a sounding board. It is efficient and narrow. Every decision now carries the crown's name, so every failure will carry it too."
 PBL_wd_crown_order_directorate:0 "Install the Directorate of Order"
 PBL_wd_crown_order_directorate_desc:0 "A directorate of court officers, police chiefs and loyal ministers takes executive power under the crown's banner. Decrees replace statutes, parties are suspended and the newspapers report to a censor. The directorate promises calm in the arms towns and a disciplined service year. It pays for that calm with fear, which never balances a budget."
 PBL_wd_crown_assembly_government:0 "Seat the Assembly Government"
 PBL_wd_crown_assembly_government_desc:0 "The assembly elects an executive committee that governs in its own right, and the crown withdraws to ceremony, honours and the oath of office. Elections stay on a fixed calendar. The arms trusts lose their private line to the palace, and the deputies inherit an economy built for war that they have never had to run."
 PBL_wd_crown_question_time:0 "Question Time for Ministers"
 PBL_wd_crown_question_time_desc:0 "Every week the ministers stand in the chamber and answer questions from any deputy, broadcast on national radio. Scandals that once stayed in palace corridors now reach every kitchen. The government looks weaker for a while and the officer corps dislikes being questioned in public. Over time, people trust what they can hear argued."
 PBL_wd_crown_privy_estates:0 "Crown Estates Pay Their Way"
 PBL_wd_crown_privy_estates_desc:0 "The privy council orders the crown's own estates in the old heartland to fund a modern mill instead of the court's ceremonies. It is a show of seriousness that costs the palace some comfort and much patronage, and courtiers lose their sinecures. Old Perbla gains a working plant and a reason to defend the council's rule."
 PBL_wd_crown_order_censors:0 "A Censor in Every Newsroom"
 PBL_wd_crown_order_censors_desc:0 "The directorate places a censor in every newspaper, radio studio and printing house, with authority to stop any story touching security, the crown or the economy. Rumours vanish from print and move to kitchens and bars. Foreign correspondents leave. The government gains silence and loses the ability to hear bad news before it becomes a crisis."
 PBL_wd_crown_assembly_charter:0 "A Written Federal Charter"
 PBL_wd_crown_assembly_charter_desc:0 "The assembly drafts a federal charter defining the powers of the executive committee, the deputies and the four crown lands, and the narrow ceremonial duties left to the throne. Ratification needs every land's consent, which costs months of bargaining and several concessions. The charter is long and imperfect, and widely read."
 PBL_wd_lands_count:0 "Count the Four Crown Lands"
 PBL_wd_lands_count_desc:0 "Perbla is a union of four crown lands, Perbla proper, Serenava, Terentio and Relentio, held together by one throne and a tangle of old charters. Nobody in Gatewood has an accurate count of their roads, schools or tax rolls. A full census costs a season of clerical work and tells every land exactly what it is owed."
 PBL_wd_lands_serenava:0 "Serenava Frontier Towns"
 PBL_wd_lands_serenava_desc:0 "Serenava is the crown land that faces Osea, and its towns live among airfields and bunker lines left by older governments. Residents want roads that serve markets as well as garrisons. Paving the civil roads costs money the army would rather spend on concrete, but a frontier that resents Gatewood is a poor frontier."
 PBL_wd_lands_terentio:0 "Wells for the Terentio Towns"
 PBL_wd_lands_terentio_desc:0 "Terentio's towns stretch from the desert fields to the northern coast, and most of them still haul water by truck. Drilling municipal wells and fixing the roads between them is cheap compared to an oil rig, yet it has never been anyone's priority. The crown pays now so that the desert stops treating Gatewood as a stranger."
 PBL_wd_lands_relentio:0 "Relentio Harbour Councils"
 PBL_wd_lands_relentio_desc:0 "Relentio holds the busiest docks in the kingdom and a merchant class that already runs its own harbour councils. Recognising those councils formally, and rebuilding the coastal road between them, buys the loyalty of the ports. The price is that Relentio will expect a voice in every customs decision the crown makes afterwards."
 PBL_wd_lands_old_perbla:0 "Old Perbla Keeps Its Mills"
 PBL_wd_lands_old_perbla_desc:0 "The heartland around Old Perbla has steel and tungsten mines but few modern mills to use them. A crown loan lets the district build its own finishing works instead of shipping ore to the arms plants. It is a modest investment, and it reminds the other three lands that Perbla proper also needs work."
 PBL_wd_lands_dakrain_commission:0 "A Frontier Commission with Dakrain"
 PBL_wd_lands_dakrain_commission_desc:0 "Dakrain disputes the Terentio frontier, and herders, smugglers and water trucks cross it every day without asking anyone. A joint commission on crossings, wells and customs posts changes nobody's claim, but it gives both sides a desk to call before an incident turns into a crisis. The cost is admitting in public that the dispute exists."
 PBL_wd_lands_dakrain_commission_tt_1:0 "No claim, core or border changes; the commission handles crossings, water and customs only."
 PBL_wd_lands_charters:0 "Charters for Each Crown Land"
 PBL_wd_lands_charters_desc:0 "Each crown land receives a written charter with its own budget line, local courts and a governor answerable to a land diet. Gatewood keeps defence, foreign affairs and the currency. Devolution calms the outer lands and speeds local building, though it hands four treasuries the power to bargain with the capital every year."
 PBL_wd_lands_chancery:0 "One Chancery in Gatewood"
 PBL_wd_lands_chancery_desc:0 "The opposite answer folds the old charters into one chancery at Gatewood, with a single tax code and prefects sent out from the capital. Decisions get faster and the budget gets simpler. The outer lands lose their separate seals, and their notables will remember who took them the next time Gatewood asks for help."
 PBL_wd_lands_diets:0 "Diets Meet in Every Land"
 PBL_wd_lands_diets_desc:0 "With charters signed, each crown land convenes its own diet. Their first budgets go to projects Gatewood never funded, and the Serenava diet votes a workshop district for its garrison towns. The diets are slow and quarrelsome, and the crown must now negotiate rather than instruct, but local money finally builds local things."
 PBL_wd_lands_prefects:0 "Prefects on the Circuit"
 PBL_wd_lands_prefects_desc:0 "Chancery prefects ride the rail circuit from Gatewood through every land, inspecting tax offices, schools and road works on a fixed calendar. Their reports go straight to the capital. The circuit costs salaries and train time, and it ends the local habit of reporting only good news, which is exactly why land notables hate it."
 PBL_wd_lands_accord:0 "The Crown Lands Accord"
 PBL_wd_lands_accord_desc:0 "Whichever constitutional answer the crown chose, the four lands sign a short accord fixing the shares of revenue, the language of the courts and the order of precedence at state occasions. It is mostly paperwork. It also ends a decade of petitions and lets later governments plan without reopening the union every year."
 PBL_wd_heavy_audit:0 "Audit the Unfinished Plants"
 PBL_wd_heavy_audit_desc:0 "The arms sector that dominates the economy is full of half-built halls, idle presses and contracts paid but never delivered. An audit team from the treasury walks every plant and prices what it would take to finish or close it. The audit annoys the trusts and costs a year of political quiet, but nothing else can start without it."
 PBL_wd_heavy_finish_halls:0 "Finish What Was Started"
 PBL_wd_heavy_finish_halls_desc:0 "Some unfinished halls in the Serenava garrison towns need only roofs, power lines and machine tools to work. The crown pays to finish the most advanced of them rather than starting new ones, accepting that the money rewards contractors who failed the first time. Finished halls are cheaper than new ones, and the workforce is already there."
 PBL_wd_heavy_missing_funds:0 "Publish the Missing Funds"
 PBL_wd_heavy_missing_funds_desc:0 "The audit found money paid for machines that were never installed. Publishing the totals, without trial by newspaper of individuals, tells the trusts that the old arrangements are over. It costs stability, because the numbers are ugly, and it makes enemies among suppliers who expected discretion. Honest books make later reforms believable."
 PBL_wd_heavy_plowshares:0 "Plowshares from the Arsenals"
 PBL_wd_heavy_plowshares_desc:0 "The conversion school says the kingdom builds too many shells for a country at peace. It proposes turning arms halls into plants for trucks, pumps, rail stock and household goods, protected for a decade. Civil output rises and jobs stay local. The army loses capacity it may want back, and the trusts lose their richest customer."
 PBL_wd_heavy_arsenal:0 "An Arsenal for Export"
 PBL_wd_heavy_arsenal_desc:0 "The export school says the arms plants are the kingdom's comparative advantage and should sell to any buyer the crown approves. Licences, credit and a sales office would keep the lines running at full rate. Revenue comes fast and the army keeps its supplier base. The kingdom becomes dependent on other countries' wars and its own discretion."
 PBL_wd_heavy_circuits_lead:0 "Let Electronics Lead Industry"
 PBL_wd_heavy_circuits_lead_desc:0 "A third school wants the national electronics firm, already the kingdom's best-known company, to set the pace. Arms plants would shrink toward components, sensors and machine controls, with credit flowing to suppliers. It promises higher value per worker. It also deepens the dependence on one firm that the treasury already fears."
 PBL_wd_heavy_tractor_lines:0 "Truck and Tractor Lines"
 PBL_wd_heavy_tractor_lines_desc:0 "The first conversion contract retools two arms halls in the Relentio valley to build trucks and tractors for the crown lands. Machine tools come from idle shell lines, and the workforce keeps its jobs. Output is slow for a year while crews retrain, and the army watches its reserve capacity vanish into farm equipment."
 PBL_wd_heavy_shops_before_shells:0 "Shops Before Shells"
 PBL_wd_heavy_shops_before_shells_desc:0 "Converted plants turn to household goods, and the treasury lowers excise on stoves, radios and bicycles for two years. Shops fill for the first time in a generation. The tax break costs revenue, and some trusts complain that they now compete with imports they cannot beat. The goodwill in the towns is real and measurable."
 PBL_wd_heavy_export_board:0 "An Arms Export Board"
 PBL_wd_heavy_export_board_desc:0 "A crown export board licenses every sale, checks end users and finances new orders with credit. The Relentio valley plants get two new lines to meet the first contracts. The board's rules are only as strict as the government that appoints it, and every foreign order ties the kingdom's reputation to someone else's war."
 PBL_wd_heavy_licence_lines:0 "Licensed Production Lines"
 PBL_wd_heavy_licence_lines_desc:0 "Foreign designs built under licence keep the export lines modern without a full design bureau. The kingdom pays royalties and accepts limits on resale, while its engineers learn from every drawing. A plant in the western valley takes the first licence. It is a faster route than domestic design, and a more dependent one."
 PBL_wd_heavy_component_suppliers:0 "Components for Every Factory"
 PBL_wd_heavy_component_suppliers_desc:0 "Arms halls in the western valley convert to circuit boards, wiring looms and instrument panels that every other factory needs. The electronics firm guarantees orders for five years, and small suppliers multiply around the plant. The guarantee means the firm, not the treasury, now sets the pace of a whole district."
 PBL_wd_heavy_supplier_credit:0 "Credit for Small Suppliers"
 PBL_wd_heavy_supplier_credit_desc:0 "A crown credit window lends to small component makers that the big firm will not finance. Loans carry low rates in exchange for open books and shared test labs. Defaults will happen and the treasury will carry them. The aim is a second tier of suppliers, so that the kingdom does not stand or fall with one company."
 PBL_wd_heavy_shock_reserve:0 "A Reserve Against the Shock"
 PBL_wd_heavy_shock_reserve_desc:0 "Whatever model wins, the treasury sets aside a reserve fund for the day a major customer cancels or a firm fails. It is invested in nothing glamorous and earns little. Ministers will be tempted to raid it every budget year. If it survives, the next industrial shock lands on a cushion instead of on the streets."
 PBL_wd_serv_review:0 "Review the Service Year"
 PBL_wd_serv_review_desc:0 "For more than a century every young Perblan has served a year in uniform, a policy built to match the size of Osea's forces. The year produces a vast reserve and a heavy bill for barracks, rations and lost labour. A royal review asks whether the old answer still fits a kingdom that wants to grow."
 PBL_wd_serv_depots:0 "Repair the Training Depots"
 PBL_wd_serv_depots_desc:0 "Many training depots date from the previous century and flood every spring. Rebuilding their roads, ranges and kitchens makes the service year less miserable and less wasteful. The depot at Torre Mountain goes first. The work takes engineering units off frontier duty for a season, which the border commands resent."
 PBL_wd_serv_keep_year:0 "The Year Stays"
 PBL_wd_serv_keep_year_desc:0 "The crown keeps universal service but rewrites it: shorter drill, more field training and a proper reserve call-up schedule. The large army remains, and Osea still faces a kingdom where every adult knows how to fight. The economy keeps paying for a year of every worker's youth, and the barracks budget stays enormous."
 PBL_wd_serv_volunteer:0 "A Professional Core"
 PBL_wd_serv_volunteer_desc:0 "The reformers build a professional core of paid volunteers and long-service officers, while the universal year shrinks to basic training and reserve listing. Units are better trained and stay together. Families welcome the change and employers gain workers. The trained reserve will thin within a decade, and generals warn about Osea."
 PBL_wd_serv_civil_option:0 "A Civil Service Year"
 PBL_wd_serv_civil_option_desc:0 "A compromise keeps the year of service but lets conscripts choose civil brigades that build roads, wells and clinics in the crown lands. The army keeps a smaller intake of willing recruits, and public works speed up across the poorer districts. Officers complain that the choice drains their best candidates into shovels instead of rifles."
 PBL_wd_serv_reserve_rolls:0 "Rolls of the Reserve"
 PBL_wd_serv_reserve_rolls_desc:0 "A single reserve register lists every trained adult by skill, district and unit, updated each year at the local town hall. Mobilisation that took weeks now takes days. Keeping the rolls current costs clerks and patience, and civil liberties groups object to a state that knows where every former soldier lives."
 PBL_wd_serv_career_pay:0 "Career Pay for Volunteers"
 PBL_wd_serv_career_pay_desc:0 "Volunteer pay rises to compete with industry, with housing, pensions and technical courses for those who sign on for longer terms. Recruiting stops being a struggle. The wage bill climbs sharply and the treasury must find the money every year. In return the kingdom gets soldiers who stay long enough to master their equipment."
 PBL_wd_serv_civil_brigades:0 "Brigades for the Crown Lands"
 PBL_wd_serv_civil_brigades_desc:0 "The civil brigades take on their first large project, the roads and water lines of the Terentio desert districts. Conscripts work in rotations under engineers from the army and the ministry of works, and results are visible within a year. Critics note that free labour also undercuts private builders in the same districts."
 PBL_wd_serv_armour_parks:0 "Keep the Armour Parks Running"
 PBL_wd_serv_armour_parks_desc:0 "The kingdom keeps hundreds of tanks and tracked guns that need more maintenance than the budget allows. A workshop programme cannibalises the worst vehicles to keep the rest running and trains mechanics in every armoured unit. Fewer machines will be ready, but those that are will actually move when the frontier needs them."
 PBL_wd_serv_staff_college:0 "A Staff College at Gatewood"
 PBL_wd_serv_staff_college_desc:0 "Officers learn planning, logistics and combined arms at a staff college instead of inheriting habits from their regiments. The superior firepower school that guides the army is rewritten for the kit the kingdom actually owns. The college takes good officers out of units for a year, and curriculum fights delay its first graduation."
 PBL_wd_serv_frontier_divisions:0 "Divisions for the Frontier"
 PBL_wd_serv_frontier_divisions_desc:0 "Whatever service model the kingdom chose, the army assigns its readiest divisions to the Serenava frontier that faces Osea. Units rotate on fixed schedules rather than whenever a crisis looms. Standing frontier divisions cost more than a reserve that waits at home, but they make every later border decision quicker."
 PBL_wd_circ_one_firm:0 "One Firm Holds the Kingdom"
 PBL_wd_circ_one_firm_desc:0 "The national electronics firm supplies almost every circuit used by the army and by civilian industry. Its success is a national boast and a national risk. Before choosing a policy, ministers commission a frank study of what the kingdom would lose if the firm stumbled. The study costs goodwill with a board that dislikes outside eyes."
 PBL_wd_circ_public_labs:0 "Public Laboratories at Gatewood"
 PBL_wd_circ_public_labs_desc:0 "The crown opens public laboratories beside the university at Gatewood, so that research no longer lives only inside the firm. Graduates can test designs without signing the firm's contracts. The labs need a standing budget and years to matter. They are the first public alternative to a private monopoly of know-how."
 PBL_wd_circ_second_source:0 "A Second Source for Parts"
 PBL_wd_circ_second_source_desc:0 "The army orders that every critical component must have a second qualified maker, even at a higher price. A small plant in the harbour district of Perbla proper wins the first contracts. The firm protests that duplication wastes money. The defence staff answers that a single supplier is a single point of failure."
 PBL_wd_circ_crown_stake:0 "A Crown Stake in the Firm"
 PBL_wd_circ_crown_stake_desc:0 "The treasury buys a minority stake and two seats on the firm's board, gaining a veto over closures and foreign sales of the core plants. Private investors resent the intrusion and the share price sinks. In exchange the kingdom gains a hand on the wheel of the company it cannot afford to lose."
 PBL_wd_circ_open_market:0 "Open the Components Market"
 PBL_wd_circ_open_market_desc:0 "The opposite course opens defence component tenders to every qualified supplier, foreign or domestic, and ends the firm's informal preference. Prices fall and new makers appear. The firm loses guaranteed orders and may cut jobs at Gatewood. Ministers bet that competition will make the sector sturdier than protection ever did."
 PBL_wd_circ_avionics:0 "Avionics with the Belkan Branch"
 PBL_wd_circ_avionics_desc:0 "The South Belka Munitions branch at Gatewood builds aircraft parts and needs local electronics. A joint avionics workshop seats Perblan engineers beside the branch's designers on navigation and fire control sets. The arrangement depends on the old friendship holding. While it lasts, it is the fastest way to learn aircraft electronics."
 PBL_wd_circ_coastal_radar:0 "Radar Sets for the Coast"
 PBL_wd_circ_coastal_radar_desc:0 "Locally built radar sets go to the Sofern coast first, where the navy and the air arm share the busiest approaches in the kingdom. Each station proves that domestic electronics can be trusted in service. The sets are heavier and less refined than imported ones. They are also repairable at home, which matters more."
 PBL_wd_circ_institute:0 "The Gatewood Institute"
 PBL_wd_circ_institute_desc:0 "The public laboratories merge into a technical institute with its own degrees, test ranges and contract office. It trains the engineers the firm and its rivals both need. The institute costs more each year than the labs did. It also outlives any single company, which is the whole point of building it."
 PBL_wd_circ_field_radios:0 "Field Radios for the Service Year"
 PBL_wd_circ_field_radios_desc:0 "Every conscript class trains on radios, field telephones and simple sensors made in Gatewood. The kits are rugged and cheap, and they produce a generation of recruits who can repair electronics in the field. The order keeps smaller suppliers busy. It also ties the service year more tightly to the electronics sector."
 PBL_wd_circ_rescue_plan:0 "A Plan for the Bad Year"
 PBL_wd_circ_rescue_plan_desc:0 "Treasury and defence staff write a sealed plan for the day the electronics firm cannot pay its suppliers: emergency credit, protected payrolls and priority orders for critical lines. Nobody wants to need it. Drafting it costs time and a few leaks that worry investors. Having it means a crisis is met by procedure rather than panic."
 PBL_wd_bord_news:0 "News from the Belkan War"
 PBL_wd_bord_news_desc:0 "When fighting breaks out around Belka in 1995, Perbla is not a party to it, but it is close to every side. Osea is its largest neighbour and Belka its oldest friend. The crown puts the frontier commands on watch and opens a war room at Gatewood. Watching costs fuel, overtime and nerves; ignoring the war would cost far more."
 PBL_wd_bord_court_debate:0 "The Court Weighs the Old Alliance"
 PBL_wd_bord_court_debate_desc:0 "The court has always spoken of Belka as a brother nation, and some officers talk openly about helping it. Others remember that Osea sits on the Serenava frontier. The debate is held in closed session, and its record decides what the kingdom says in public. Any armed intervention remains a separate and grave decision outside this debate."
 PBL_wd_bord_refugee_posts:0 "Posts for Those Who Flee"
 PBL_wd_bord_refugee_posts_desc:0 "War on the continent will send people looking for safety, and some will reach the kingdom by sea or over land. Reception posts at the main crossings and harbours register arrivals, give them food and a bed, and decide where they go next. The posts cost money and invite argument. Without them, arrivals become a crisis instead of a task."
 PBL_wd_bord_frontier_bunkers:0 "Man the Serenava Bunkers"
 PBL_wd_bord_frontier_bunkers_desc:0 "The bunker lines along the Serenava frontier were built for a war with Osea that never came. The frontier divisions reoccupy them, clear their fields of fire and wire them to new radar posts. Osea will notice, and the move costs goodwill on the far side of the line. The kingdom would rather be noticed than surprised."
 PBL_wd_bord_stance_belka:0 "Keep Faith with Old Friends"
 PBL_wd_bord_stance_belka_desc:0 "The crown declares public sympathy for Belka, keeps its envoys in place and lets the Gatewood munitions branch fill Belkan orders under existing contracts. No Perblan unit crosses any border. Osea will treat the kingdom as an unfriendly neighbour for years. The officer corps and the arms trusts approve, and the ports fear for their trade."
 PBL_wd_bord_stance_belka_tt_2:0 "Commits no troops. Any armed intervention remains the separate inherited Belkan decision path."
 PBL_wd_bord_stance_neutral:0 "Neither Banner Nor Border"
 PBL_wd_bord_stance_neutral_desc:0 "The crown proclaims armed neutrality: no arms to either side, no transit for foreign troops and full readiness on every frontier. It satisfies nobody and protects everyone. Belka will call it betrayal, Osea will call it suspicious, and the readiness bill will run for as long as the war does. The kingdom stays its own master."
 PBL_wd_bord_stance_osea:0 "A Quiet Channel to Osea"
 PBL_wd_bord_stance_osea_desc:0 "The foreign ministry opens a discreet channel to Osea, promising that Perbla will not let its territory or factories serve the war against it. In return, trade across the frontier continues. The court's Belkan sympathisers call it a betrayal of a century of friendship. The ports and the converted plants keep their customers."
 PBL_wd_bord_branch_orders:0 "Orders for the Gatewood Branch"
 PBL_wd_bord_branch_orders_desc:0 "Belkan contracts placed with the munitions branch at Gatewood are honoured in full, and the crown lets the branch add a production line. Jobs and foreign currency follow. Every crate shipped is a fact Osea will remember. The trusts insist the orders are only business; the frontier divisions know that business has a return address."
 PBL_wd_bord_frontier_patrols:0 "Patrols Along Every Frontier"
 PBL_wd_bord_frontier_patrols_desc:0 "Neutral patrols fly along every frontier and coast, reporting any foreign aircraft that strays into Perblan airspace. The northern Terentio state receives a new radar post to close a gap in coverage. The patrols burn fuel and airframe hours. They also make neutrality visible, which is the only kind of neutrality anyone respects."
 PBL_wd_bord_crossings_open:0 "Keep the Crossings Open"
 PBL_wd_bord_crossings_open_desc:0 "Border posts on the Serenava frontier stay open for trucks, rail freight and families, with extra customs officers to keep war contraband out. Repairs to the frontier roads make the crossings faster. Trade keeps flowing and the frontier towns stay calm. Belkan sympathisers at court see every open gate as a favour to the enemy."
 PBL_wd_bord_raid_drills:0 "Air Raid Drills in Sofern"
 PBL_wd_bord_raid_drills_desc:0 "Sofern is the largest city and port in the kingdom, and its people have never practised for an air raid. Civil defence wardens run sirens, blackouts and shelter drills, and the harbour gets an extra radar post. The drills frighten shopkeepers and slow the port for a week. They also make the war feel real to those who must survive it."
 PBL_wd_bord_stand_down:0 "Stand the Frontier Down"
 PBL_wd_bord_stand_down_desc:0 "Once the court judges that the fighting no longer threatens Perblan soil, the frontier commands return to peacetime rotations and reservists go home. The war room at Gatewood closes and its files go to the archive. Standing down too early would be reckless; standing down too late keeps factories short of workers."
 PBL_wd_air_count:0 "Count the Air Arm Airframes"
 PBL_wd_air_count_desc:0 "The air arm is small, old and concentrated on the giant Serenava airfields that face Osea. An honest count shows how many fighters can actually fly, how many pilots are current and how much fuel the stores hold. The answer embarrasses the air staff. It also gives the crown a real baseline for every later decision."
 PBL_wd_air_pilot_school:0 "A Pilot School at Gatewood"
 PBL_wd_air_pilot_school_desc:0 "Pilots have trained in their squadrons, each with its own habits. A central school near the capital standardises flying, navigation and gunnery, and graduates move between units without retraining. The school takes instructors out of frontline squadrons for its first two years. After that, every pilot in the arm speaks the same language."
 PBL_wd_air_dispersal:0 "Dispersal Fields in Old Perbla"
 PBL_wd_air_dispersal_desc:0 "Everything the kingdom owns in the air sits on a handful of fields in Serenava, where one bad morning could end the air arm. Dispersal strips in the Old Perbla heartland give squadrons somewhere to go. They are rough fields with fuel bladders and tents, cheap to build, miserable to operate and much harder to destroy at once."
 PBL_wd_air_interceptors:0 "Interceptors Over the Crown Lands"
 PBL_wd_air_interceptors_desc:0 "The air staff chooses defence: interceptors, ground control and fast reaction from hardened fields. The arm's purpose becomes keeping foreign aircraft out of Perblan skies rather than supporting distant ground battles. The army loses its promised air support. The kingdom gains an air arm that can credibly deny its airspace to a larger neighbour."
 PBL_wd_air_strike:0 "Strike Wings for the Army"
 PBL_wd_air_strike_desc:0 "The air staff chooses to support the army: strike aircraft, forward controllers and joint training with the frontier divisions. The arm becomes the army's long-range artillery, and air defence falls back on ground guns and luck. The army is delighted. The treasury notes that strike munitions cost more each year than interceptor fuel."
 PBL_wd_air_spares:0 "Spares from Gatewood Electronics"
 PBL_wd_air_spares_desc:0 "Grounded aircraft usually wait for one imported part. A domestic spares programme gives Gatewood suppliers the drawings for radios, instruments and wiring looms and pays them to stock replacements. Readiness rises within a year. Foreign makers grumble about licences, and the air arm grows more tied to the national electronics sector."
 PBL_wd_air_reserve_pilots:0 "Reserve Pilots from Civil Flying"
 PBL_wd_air_reserve_pilots_desc:0 "Civil flying clubs and airline crews join an air reserve, training on light aircraft at the Sofern field and reporting for refresher flying each summer. In a crisis they ferry aircraft, fly liaison missions and free regular pilots for combat. The reserve costs little. It also gives thousands of citizens a stake in the air arm."
 PBL_wd_air_radar_chain:0 "A Radar Chain for the Air Arm"
 PBL_wd_air_radar_chain_desc:0 "A chain of linked radar posts across Serenava feeds a single control room, so that the air arm sees intruders minutes earlier than before. Gatewood engineers build most of the sets. The chain is expensive and needs constant calibration. Without it, even the best pilots are scrambled late and blind."
 PBL_wd_air_crown_review:0 "The Crown Air Review"
 PBL_wd_air_crown_review_desc:0 "Every squadron flies over Gatewood for a public review, with open hangars, school visits and a recruiting fair. It is theatre, and expensive theatre, burning fuel and maintenance hours on a parade. It also lifts the arm's morale, fills the pilot school's waiting list and shows neighbours that the kingdom's aircraft can fly together."
 PBL_wd_coast_yards:0 "Sofern Yards Back to Work"
 PBL_wd_coast_yards_desc:0 "Sofern's yards build and repair almost every hull the kingdom owns, but half the slipways stand idle for lack of orders. A steady programme of refits and small escorts keeps the yards working and their skilled crews employed. The navy gets ships back faster. The treasury commits to a shipbuilding budget it cannot easily cut later."
 PBL_wd_coast_baleton:0 "Harbour Works at Baleton"
 PBL_wd_coast_baleton_desc:0 "Baleton, the naval harbour near the capital, has deep berths but a road and rail link built for a smaller fleet. Widening the quays and rebuilding the access roads lets ships load and repair in days rather than weeks. Commuters in the capital district suffer a year of closures. The navy finally gets a proper home port."
 PBL_wd_coast_escorts:0 "Escorts for the Convoy Lanes"
 PBL_wd_coast_escorts_desc:0 "The kingdom's trade moves by sea, and its convoys sail with little protection. Small escorts with sonar, guns and depth charges join each convoy on the main lanes, and crews train on real routes rather than exercises. Escorts are unglamorous ships, and they are the ones a trading kingdom needs most when a war breaks out nearby."
 PBL_wd_coast_submarines:0 "A Submarine Screen"
 PBL_wd_coast_submarines_desc:0 "The navy decides that a few coastal submarines can make any approach dangerous for a stronger fleet. Sofern specialises in building and maintaining them, and crews train in the coastal shallows they would defend. Submarines are cheap deterrence. They cannot escort a convoy or show the flag, and merchants notice the difference."
 PBL_wd_coast_surface:0 "Surface Escort Flotillas"
 PBL_wd_coast_surface_desc:0 "The navy decides that protecting trade matters more than threatening invaders. Sofern builds flotillas of surface escorts and the navy organises them around the main convoy lanes. The ships are visible at sea and in foreign ports. They are also easier targets, and the escort budget grows with every route merchants open."
 PBL_wd_coast_watch_office:0 "Coastal Watch at the Harbour"
 PBL_wd_coast_watch_office_desc:0 "The harbour district of Perbla proper gets a coastal radar and a watch office that tracks shipping, smugglers and fishing boats in all weather. The navy and customs share the data. The station costs little, but staffing it around the clock does not. It ends the old practice of learning about arrivals when they dock."
 PBL_wd_coast_fishery:0 "Fishery Patrols"
 PBL_wd_coast_fishery_desc:0 "Fishing towns along the coast lose catches to foreign trawlers working inside Perblan waters. Patrol boats enforce the limits, and the harbour roads are rebuilt so catches reach markets fresh. Crews gain sea time on real missions. Trawler owners protest to their governments, and the foreign ministry spends a year answering their notes."
 PBL_wd_coast_marines:0 "Marine Battalions at Sofern"
 PBL_wd_coast_marines_desc:0 "The marines are scattered in harbour guard companies. Gathering them into battalions at Sofern, with landing craft and joint drills alongside the navy, gives the kingdom a force that can secure its own ports and coast quickly. Marines draw the best volunteers away from the army. Their real value is speed when a harbour needs holding."
 PBL_wd_coast_merchant_register:0 "A Merchant Fleet Register"
 PBL_wd_coast_merchant_register_desc:0 "Every Perblan merchant ship is listed with its owner, crew, cargo type and the routes it sails. In peacetime the register is a customs tool. In a crisis it tells the navy which ships to protect, which to recall and which could be requisitioned. Owners dislike the paperwork, and a few reflag their ships abroad."
 PBL_wd_after_relief:0 "Open the Relief Offices"
 PBL_wd_after_relief_desc:0 "The war years leave the kingdom with displaced families, returning reservists and businesses that lost foreign customers. Relief offices in each crown land handle housing, jobs and small grants under one roof. They cost money and attract complaints from every side. They also turn scattered grievances into cases that can be closed."
 PBL_wd_after_new_homes:0 "From Reception Posts to Homes"
 PBL_wd_after_new_homes_desc:0 "People who arrived at the wartime reception posts still live in temporary halls. The crown funds housing and roads on the edge of the Relentio valley towns, where factories need workers. Newcomers become tenants and taxpayers rather than wards. Some councils resent the arrivals, and the programme must be defended every budget year."
 PBL_wd_after_reservists_home:0 "Send the Reservists Home"
 PBL_wd_after_reservists_home_desc:0 "With the frontier stood down, the last reservists return to civilian life with a bonus, a job placement and their old posts protected by law. A closed plant in northern Relentio reopens with returning workers. Employers grumble about the protected posts, and the towns are glad to have their sons and daughters back."
 PBL_wd_after_veterans:0 "Pensions for Service Veterans"
 PBL_wd_after_veterans_desc:0 "Veterans of the war-year mobilisations ask for pensions, medical care and priority in civil service hiring. The crown grants a modest package funded by a small levy on arms exports. Veterans' clubs become loyal to the government that paid them. The levy angers the trusts, and future governments inherit a promise they cannot reduce."
 PBL_wd_after_ulysses:0 "Ulysses in the Night Sky"
 PBL_wd_after_ulysses_desc:0 "The asteroid Ulysses is now a fixed subject of every bulletin, with warnings that fragments will strike the Earth within a few years. The kingdom cannot change the asteroid's path, only its own readiness. The crown convenes scientists, engineers and civil defence officials to decide what readiness means and what it will cost."
 PBL_wd_after_shelters:0 "Shelters Under the Cities"
 PBL_wd_after_shelters_desc:0 "The civil defence school wants deep shelters under Gatewood, Sofern and the other large towns, stocked with water and power for weeks. Crews and steel are diverted from industry for years. If debris ever falls near the kingdom, millions have somewhere to go. If it never does, the kingdom will own very expensive basements."
 PBL_wd_after_warning:0 "An Early Warning Network"
 PBL_wd_after_warning_desc:0 "The scientific school argues that warning time saves more lives than concrete. An observatory link, radar posts and a national siren network would give each district hours of notice, with evacuation plans instead of bunkers. It is cheaper and smarter, and useless if the warning comes and nobody has anywhere safe to go."
 PBL_wd_after_arklith_roads:0 "Trade Roads to Arklith"
 PBL_wd_after_arklith_roads_desc:0 "Wartime caution froze trade with every neighbour, including Arklith on the western frontier. Reopening customs posts and rebuilding the western valley roads restores a modest but steady market for Perblan goods. Arklith's traders want lower tariffs in return. The deal is small, peaceful and unglamorous, which is what the economy needs."
 PBL_wd_after_osean_thaw:0 "A Thaw with Osea"
 PBL_wd_after_osean_thaw_desc:0 "The quiet wartime channel to Osea becomes an open trade and transit agreement once the fighting ends. Osean buyers return to Perblan ports and factories, and the frontier towns prosper. The court's Belkan sympathisers call it the price of betrayal. Ministers call it the reward for keeping a promise when keeping it was hard."
 PBL_wd_after_belkan_ties:0 "Help for Belkan Friends"
 PBL_wd_after_belkan_ties_desc:0 "The kingdom keeps faith with Belka after the war, offering credit, contracts for the Gatewood munitions branch and university places for Belkan students. Old friendships deepen. Osea notes every gesture and keeps its frontier posture stiff for years. The arms trusts welcome the business, and the ports pay for the chill."
 PBL_wd_after_neutral_dividend:0 "The Neutrality Dividend"
 PBL_wd_after_neutral_dividend_desc:0 "Having refused both sides, the kingdom markets itself as a neutral venue for talks, banking and shipping. Its harbours handle cargo with fewer questions, and its diplomats host meetings both sides need. Neutrality pays modest dividends. It also requires a frontier army credible enough that nobody tests whether the crown means it."
 PBL_wd_desert_survey:0 "Survey the Terentio Fields"
 PBL_wd_desert_survey_desc:0 "The Terentio desert holds oil and bauxite that the kingdom has barely tapped, worked by a few old rigs and the arms plants that sit on the same ground. A geological survey maps the fields properly and rebuilds the track to the main deposits. The survey takes two dry seasons, and its maps will decide who gets rich."
 PBL_wd_desert_pipeline:0 "Pipelines and Water Wells"
 PBL_wd_desert_pipeline_desc:0 "Oil fields need water, roads and pipelines before they need drillers. The crown lays a pipeline corridor from the desert to Torre Mountain, where the refineries and smelters will sit, and drills wells for the towns along it. The corridor is slow to build. Once it exists, every later desert project costs less."
 PBL_wd_desert_crown_oil:0 "A Crown Oil Company"
 PBL_wd_desert_crown_oil_desc:0 "A state oil company holds every Terentio lease and pays its profits into the treasury. Drilling is slower, because the company is cautious and politically managed, but the revenue stays at home. The crown gains a second income besides arms, and another national champion that must be rescued if it ever stumbles."
 PBL_wd_desert_concessions:0 "Concessions to Private Drillers"
 PBL_wd_desert_concessions_desc:0 "The crown auctions drilling concessions to private firms, domestic and foreign, for royalties and local hiring rules. Rigs go up quickly and the fields produce within a few years. Royalties are smaller than full ownership, and Terentio's towns will deal with managers who answer to shareholders rather than to Gatewood."
 PBL_wd_desert_land_share:0 "A Share for the Desert Land"
 PBL_wd_desert_land_share_desc:0 "Under its crown land charter, Terentio's diet claims a fixed share of oil revenue for its own budget. The crown agrees, and the land spends its first share on a workshop district in its northern towns. Gatewood receives less. The desert finally sees oil money building things where the oil is, and its loyalty firms up."
 PBL_wd_desert_chancery_royalty:0 "Royalties to the Chancery"
 PBL_wd_desert_chancery_royalty_desc:0 "The single chancery collects all oil royalties centrally and allocates them by national plan. Its first allocation funds an industrial park in the northern Terentio state, chosen by Gatewood rather than by the desert towns. Revenue is larger and easier to steer. Local notables complain that the wealth flows past them to the capital."
 PBL_wd_desert_shared_revenue:0 "Desert Revenues Shared"
 PBL_wd_desert_shared_revenue_desc:0 "The Crown Lands Accord already fixes how revenue is shared, so oil income is split by formula between the treasury and all four lands. Old Perbla uses its share to repair the heartland roads. Nobody gets everything they want, and nobody can claim the desert's money was taken by stealth, which keeps the union quiet."
 PBL_wd_desert_smelters:0 "Smelters in the Western Valley"
 PBL_wd_desert_smelters_desc:0 "Bauxite from the desert and steel from the western valley mines meet at a new smelter complex on the Arklith road. Aluminium can be rolled at home instead of shipped out as ore. The smelters need enormous power and years of debt. They give the air arm and the electronics sector a domestic metal supply."
 PBL_wd_desert_fuel_research:0 "Fuel Research at Gatewood"
 PBL_wd_desert_fuel_research_desc:0 "Gatewood's laboratories and the oil sector fund joint research on refining, lubricants and synthetic fuels from the desert's heavier crude. The army wants fuel independence and the firms want higher margins. Results come slowly and the budget is easy to cut, but every point of yield gained stays in the kingdom."
 PBL_wd_desert_railway:0 "A Railway Across the Desert"
 PBL_wd_desert_railway_desc:0 "A heavy railway links the desert fields and the smelters to the coast, replacing convoys of tanker trucks on bad roads. Freight costs fall and the army gains a fast supply line inland. The railway is the largest civil project in the kingdom's recent history, and its debt will outlast the ministers who opened it."
 PBL_wd_mill_review:0 "Ten Years of the New Order"
 PBL_wd_mill_review_desc:0 "A decade after the crown question was first opened, the government commissions a public review of how the kingdom governs itself: what it built, whom it failed and what it now costs to run. The panel is chosen by lot rather than from the government's friends. Its findings will frame every political choice of the new century."
 PBL_wd_mill_parliament:0 "A Constitution in One Volume"
 PBL_wd_mill_parliament_desc:0 "The ministry consolidates a century of charters, conventions and court rulings into one written constitution, ratified by the chamber and signed by the crown. Disputes that once needed palace mediation go to a constitutional court. Drafting takes two sessions and every clause becomes a battle. The result is a government nobody must guess about."
 PBL_wd_mill_privy:0 "The Prerogative Written Down"
 PBL_wd_mill_privy_desc:0 "The privy council records exactly which powers the throne holds, which it delegates and which the chamber may still debate. Clarity strengthens the council: no minister can plead confusion, and no deputy can claim a right the text omits. Critics call it absolutism with an index. Investors call it predictable, and that wins the argument."
 PBL_wd_mill_order:0 "The Ordered Kingdom"
 PBL_wd_mill_order_desc:0 "The directorate replaces emergency decrees with a permanent code of public order, giving its police, censors and labour boards a legal footing. Strikes vanish from the arms towns and crime falls. Talented people quietly leave for jobs abroad, and those who stay learn to say less. The kingdom is orderly, efficient and noticeably quieter."
 PBL_wd_mill_assembly:0 "The Federal Parliament Act"
 PBL_wd_mill_assembly_desc:0 "The assembly government passes a federal act creating two chambers, one elected by population and one by the four crown lands, with the crown kept as a symbol of their union. Lawmaking slows, but the outer lands finally hold a formal veto. The arrangement is clumsy, durable and hard for any single faction to capture."
 PBL_wd_mill_civil_exam:0 "A Civil Service Examination"
 PBL_wd_mill_civil_exam_desc:0 "Ministries in Gatewood still hire through family, regiment and party. A single competitive examination for every civil service post opens careers to graduates from all four lands. Years pass before the new intake reaches senior posts. Meanwhile the examined juniors outperform their patrons, which quietly makes it the most popular reform."
 PBL_wd_mill_civil_exam_tt_2:0 "Ministries hire by open examination from this point on."
 PBL_wd_mill_public_accounts:0 "A Public Accounts Act"
 PBL_wd_mill_public_accounts_desc:0 "The published arms audit of the early nineties set a precedent, and this act makes it law: every crown contract above a set value is published with its price, supplier and delivery date. Suppliers grumble about exposure. Overpriced bids fall within a year, and the press finds fewer scandals because there are fewer secrets."
 PBL_wd_mill_industry_review:0 "The Industrial Model Revisited"
 PBL_wd_mill_industry_review_desc:0 "Ten years after the industrial reckoning, the treasury asks whether the chosen model still fits. It walks the plants again, this time measuring exports, wages and dependence rather than waste, and funds a new hall in northern Relentio as a test case. The review costs a year of argument with every trust in the kingdom."
 PBL_wd_mill_civil_board:0 "A Civil Works Board"
 PBL_wd_mill_civil_board_desc:0 "Ten years of conversion have produced trucks, tractors and appliances, and a generation of workers who never made a shell. Protection for converted plants ends, replaced by a works board that funds exports and modernisation. Weak plants will close. The strong ones finally compete on their own merits, which was the point all along."
 PBL_wd_mill_arsenal_contracts:0 "Long Contracts for the Arsenal"
 PBL_wd_mill_arsenal_contracts_desc:0 "The export board moves from single sales to long service contracts that bundle weapons, spares, training and upgrades over decades. Revenue becomes steady and the arms lines plan years ahead. Every long contract also ties the kingdom to the conduct of its customers, and scrutiny of sales becomes the hottest political question in Gatewood."
 PBL_wd_mill_circuit_exports:0 "Circuits for Foreign Markets"
 PBL_wd_mill_circuit_exports_desc:0 "The component economy has matured enough to sell abroad. Gatewood suppliers win foreign contracts for sensors, control boards and communications equipment, backed by crown export credit. The national firm remains the anchor, but it no longer carries the whole sector. Foreign competitors respond with price cuts and lawsuits."
 PBL_wd_mill_firm_stress:0 "Stress Test the Electronics Firm"
 PBL_wd_mill_firm_stress_desc:0 "Treasury officials run the sealed rescue plan as a full exercise, assuming the electronics firm misses its payroll on a Monday morning. Banks, suppliers and the defence staff all take part. The exercise exposes gaps that a real crisis would have found first. Word leaks, and the firm's investors spend a nervous week."
 PBL_wd_mill_shock_cushion:0 "Draw on the Shock Reserve"
 PBL_wd_mill_shock_cushion_desc:0 "The industrial shock reserve has grown untouched for a decade. Rather than spend it on promises, the government uses a slice to retool the oldest plants in Sofern before they fail on their own, and the rest stays in reserve. Every party has a better idea for the money, and the reserve's board must defend it."
 PBL_wd_mill_second_sources:0 "Second Sources Pay Off"
 PBL_wd_mill_second_sources_desc:0 "The second-source rule for defence parts, once mocked as duplication, has produced a ring of capable suppliers around the harbour district. One of them is now large enough to run a small arms line in a Serenava garrison town. Prices stay higher than a monopoly would charge, and nobody in the defence staff misses the old single point of failure."
 PBL_wd_pac_news:0 "Osea Goes to War"
 PBL_wd_pac_news_desc:0 "In September 2010 Osea, the large neighbour the service year was built to match, is suddenly at war with Yuktobania. The kingdom is not a belligerent, but Osean ports, buyers and warships are part of its daily life. The security council convenes to judge what the war means for Perblan trade, shipping and safety."
 PBL_wd_pac_harbour_guard:0 "Guard the Neutral Harbours"
 PBL_wd_pac_harbour_guard_desc:0 "Warring navies and their submarines make every sea lane nervous, and Perblan harbours handle cargo for peaceful and warlike customers alike. Naval police inspect suspicious ships, harbour defences go on alert and the coast watch doubles its shifts. The measures slow trade and cost overtime, and they keep the ports from becoming targets."
 PBL_wd_pac_supply_osea:0 "Sell to the Osean War Effort"
 PBL_wd_pac_supply_osea_desc:0 "Osean buyers want trucks, electronics and munitions at once, and they pay well. The government lets Perblan firms take the orders under export rules that bar weapons to any other belligerent. Factories run three shifts. Yuktobania notes the sales, and prosperity now depends partly on a war the kingdom did not choose."
 PBL_wd_pac_stay_clear:0 "Stay Clear of the Pacific"
 PBL_wd_pac_stay_clear_desc:0 "The government refuses military sales to any party in the war and limits its role to humanitarian shipping and diplomacy. Osean buyers go elsewhere, and some frontier businesses suffer. The kingdom's reputation for distance grows. When the war ends, nobody has a grievance against Perbla, which may prove worth more than the lost orders."
 PBL_wd_pac_three_shifts:0 "Three Shifts in the Arms Halls"
 PBL_wd_pac_three_shifts_desc:0 "Wartime orders fill the old arms halls in the Relentio valley, and a new line opens to meet Osean demand for shells and spares. Workers earn overtime and the trusts post record profits. Everyone knows that orders like these vanish when the war ends, and ministers warn the trusts not to borrow as though the demand will last."
 PBL_wd_pac_relief_ships:0 "Relief Ships for the War Zone"
 PBL_wd_pac_relief_ships_desc:0 "Perblan hospital ships and grain freighters sail under neutral colours to ports on both sides of the war, carrying medicine and food rather than munitions. The crews take real risks, and the voyages cost the treasury without earning anything. They give the kingdom a reputation as an honest broker that its diplomats will spend for years."
 PBL_wd_pac_merchant_recall:0 "Call Up the Merchant Register"
 PBL_wd_pac_merchant_recall_desc:0 "The merchant register compiled in the nineties proves its worth: every Perblan ship in a dangerous lane is known, routed and warned. Ships near the war zone are recalled, and a new coastal watch post in northern Relentio tracks them home. Owners complain about lost voyages. The aim is that no Perblan crew becomes a casualty of this war."
 PBL_wd_pac_lessons:0 "Lessons from the Osean War"
 PBL_wd_pac_lessons_desc:0 "Perblan officers study the war next door closely: the submarines, the air battles over cities and the vulnerability of ports and carriers to determined attack. A joint study recommends more air defence, dispersed bases and smaller, more numerous ships. It is uncomfortable for admirals with big-ship plans, and the cheapest lesson the kingdom will buy."
 PBL_wd_pac_capital_defence:0 "Air Defence for the Capital"
 PBL_wd_pac_capital_defence_desc:0 "Following the study, Gatewood receives a modern air defence network of radars and missile batteries linked to the air arm's control room. The capital had relied on fighters alone. The batteries are expensive and their crews need a year to train. The capital district can now defend itself while the fighters are elsewhere."
 PBL_wd_net_national:0 "A National Data Network"
 PBL_wd_net_national_desc:0 "Ministries, banks, factories and military commands now run on networks that depend on foreign satellites and undersea cables. A national data network with domestic routing and backup links keeps essential services online under pressure. Building it takes years of digging and fibre. The electronics sector wins most contracts, and complains about the deadlines anyway."
 PBL_wd_net_ground_stations:0 "Satellite Ground Stations"
 PBL_wd_net_ground_stations_desc:0 "Ground stations in the Old Perbla heartland receive weather, navigation and communications data from leased satellite capacity. The kingdom does not own a satellite, but it controls its own antennas, receivers and data. Leases are expensive. The stations also train the engineers the kingdom would need if it ever launched something of its own."
 PBL_wd_net_sounding_rockets:0 "A Sounding Rocket Programme"
 PBL_wd_net_sounding_rockets_desc:0 "Gatewood engineers launch small sounding rockets from the Terentio desert to test sensors and train launch crews. It is a modest programme, far from orbit. Neighbours ask pointed questions about missiles, and the foreign ministry answers them carefully. The programme keeps rocket skills at home without promising a space programme."
 PBL_wd_net_export_park:0 "Electronics for the Wider World"
 PBL_wd_net_export_park_desc:0 "The electronics sector has grown from one famous firm into a cluster of exporters selling navigation, communications and sensor equipment abroad. A new export park in the western valley gathers testing, logistics and customs under one roof. Exporters want more tax relief; the crown offers just enough to keep them at home."
 PBL_wd_net_drone_news:0 "Drones Strike Osean Harbours"
 PBL_wd_net_drone_news_desc:0 "In May 2019 drone attacks hit four major Osean naval ports on the same day a new war begins between Osea and Erusea. Perblan ports are smaller but built the same way, with open quays and soft defences. The security council meets that night to ask what a cheap drone could do to Sofern or Baleton, and how fast anyone could stop it."
 PBL_wd_net_harbour_guns:0 "Guns Around Every Harbour"
 PBL_wd_net_harbour_guns_desc:0 "The navy rings Sofern, Baleton and the harbour district with radar-guided guns and short-range missiles designed to swat small drones. It is proven technology and visible protection. The batteries are expensive to man around the clock, and drones cost a fraction of the shells used to stop them. The ports sleep better regardless."
 PBL_wd_net_signal_shield:0 "Jam the Drone Signals"
 PBL_wd_net_signal_shield_desc:0 "Gatewood engineers argue that most small drones depend on radio links and satellite navigation that can be jammed or spoofed. A network of electronic shields around the ports is cheaper than guns and uses domestic expertise. It disrupts civil radio nearby, and it may fail entirely against a drone that flies without any signal."
 PBL_wd_net_dark_sky:0 "If the Satellites Go Dark"
 PBL_wd_net_dark_sky_desc:0 "When satellites over Usea are destroyed in the autumn of 2019 and network communications across that continent collapse, the kingdom sees what dependence on orbit can mean. The national network is hardened with ground backups, radio relays and manual procedures. Hardening costs money and convenience, and keeps the kingdom working if its sky goes quiet."
 PBL_wd_net_signals_reserve:0 "A Signals Reserve"
 PBL_wd_net_signals_reserve_desc:0 "Network engineers, radio amateurs and electronics graduates join a signals reserve that trains on weekends to defend networks, run jammers and restore communications after an attack. The service year tradition adapts to a new kind of front. The reserve costs little and gives the kingdom skills no conscript class could provide."
 PBL_wd_net_account_2020:0 "The Kingdom at Twenty Twenty"
 PBL_wd_net_account_2020_desc:0 "At the end of the decade the government publishes a plain account of where the kingdom stands: its industry, its frontier, its networks and the four crown lands that still share one throne. The account is a baseline for whoever governs next. It promises nothing about the years ahead, because the kingdom has learned how quickly years change."
 PBL_wd_net_account_2020_tt_2:0 "Closes the 1991 to 2020 programme; later decades are not yet written."
 ac_wd_pbl_tree:0 "Perbla: National Programme"
 ac_wd_pbl_tree_desc:0 "The national focus programme of Perbla, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 PBL_wd_court_in_session:0 "Court in Session"
 PBL_wd_court_in_session_desc:0 "The crown has put the government itself on the order paper; every faction is listening."
 PBL_wd_ministry_charter:0 "The Ministry Charter"
 PBL_wd_ministry_charter_desc:0 "Ministers answer to the elected chamber and the crown signs on their advice."
 PBL_wd_privy_seal:0 "The Privy Seal"
 PBL_wd_privy_seal_desc:0 "The great seals sit with a privy council chosen by the throne."
 PBL_wd_order_decrees:0 "Decrees of Order"
 PBL_wd_order_decrees_desc:0 "Government by decree under the hardline creed of Perblan Totalitarianism."
 PBL_wd_assembly_mandate:0 "The Assembly Mandate"
 PBL_wd_assembly_mandate_desc:0 "The elected assembly governs in its own name; the crown reigns but does not rule."
 PBL_wd_settled_constitution:0 "A Settled Constitution"
 PBL_wd_settled_constitution_desc:0 "One written constitution and a court to read it."
 PBL_wd_crown_prerogative:0 "The Written Prerogative"
 PBL_wd_crown_prerogative_desc:0 "The throne knows exactly what it may do, and does it."
 PBL_wd_ordered_kingdom:0 "The Ordered Kingdom"
 PBL_wd_ordered_kingdom_desc:0 "A permanent code of public order replaces emergency decrees."
 PBL_wd_federal_parliament:0 "The Federal Parliament"
 PBL_wd_federal_parliament_desc:0 "Two chambers, one for the people and one for the four crown lands."
 PBL_wd_crown_lands_compact:0 "Compact of the Crown Lands"
 PBL_wd_crown_lands_compact_desc:0 "A census-backed compact among Perbla, Serenava, Terentio and Relentio."
 PBL_wd_land_charters:0 "Charters of the Four Lands"
 PBL_wd_land_charters_desc:0 "Each crown land keeps its own budget, courts and diet."
 PBL_wd_single_chancery:0 "The Single Chancery"
 PBL_wd_single_chancery_desc:0 "One chancery at Gatewood governs every crown land by one code."
 PBL_wd_arms_ledger:0 "The Arms Ledger"
 PBL_wd_arms_ledger_desc:0 "Every arms plant has been audited; the waste is now on paper."
 PBL_wd_plowshare_works:0 "Plowshare Works"
 PBL_wd_plowshare_works_desc:0 "Arms halls retooled for trucks, pumps and household goods under protection."
 PBL_wd_southern_arsenal:0 "The Southern Arsenal"
 PBL_wd_southern_arsenal_desc:0 "Arms lines kept at full rate for licensed export."
