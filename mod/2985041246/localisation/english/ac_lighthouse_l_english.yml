 ERU_lw_sovereignty_service_1_spirit:0 "Publish a Compliance Return"
 ERU_lw_sovereignty_service_1_spirit_desc:0 "The treaty compliance office maintains this funded service for ninety days. Compile and publish the republic's compliance with its 2005 undertakings for the year. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 ERU_lw_sovereignty_service_1:0 "Publish a Compliance Return"
 ERU_lw_sovereignty_service_1_desc:0 "Compile and publish the republic's compliance with its 2005 undertakings for the year.\n\nThe treaty compliance office must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
