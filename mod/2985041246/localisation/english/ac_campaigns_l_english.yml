 ac_camp.107.t:0 "The driver's penciled name"
 ac_camp.107.desc:0 "The reserve ledger has names in its margins. A driver whose replacement has not arrived, a depot supervisor whose daughter is due home, and a district that has already lent everything it can spare. Publishing an allocation makes its limits visible to everyone who will be disappointed by them. A protected schedule gives command greater discretion while placing more responsibility on the people receiving the report. The transport offer is bounded, funded and subject to a current answer from the coalition. Its costs remain real after a refusal, because preparing a credible commitment was itself work."
 ac_camp.107.a:0 "Circulate a public receiving account."
 ac_camp.107.b:0 "Keep a signed professional return."
