 SNS_up_settlement_instructions_tt:0 "Dispatch discipline: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Reconcile Domestic and Partner Dispatches'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_public_recovery_record:0 "Publish the Recovery Record"
 SNS_up_public_recovery_record_desc:0 "A public record protects confidence and invites disputes over omissions. The administration accepts the political work of answering them."
 SNS_up_public_recovery_record_done:0 "Publish the Recovery Record completed"
