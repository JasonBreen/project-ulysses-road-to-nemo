 ac_camp.2006.t:0 "A bounded offer from Delarus"
 ac_camp.2006.desc:0 "The inspection docket contains a question directed at the command receiving it. A hurried acceptance could preserve the appearance of accountability while denying the inspectors the records they need. Delarus has funded a defined service and attached its requirements. The reviewing officer reads those before considering how the result might be described in the next coalition report. There is no reward merely for having been offered scrutiny. Accepting the commitment supplies present consent to the proposed work. Refusing it leaves the expense of preparation with the sender and the unresolved cases with the institutions responsible for answering them."
 ac_camp.2006.a:0 "Accept this defined commitment."
 ac_camp.2006.b:0 "Decline the offer."
 ac_camp.2006.z:0 "Close this old message."
