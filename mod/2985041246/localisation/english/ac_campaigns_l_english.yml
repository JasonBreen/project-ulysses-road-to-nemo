 ac_camp.83.t:0 "The access they called control"
 ac_camp.83.desc:0 "The confirmation reached the room after several minutes in which nobody admitted to waiting. The handler checked the authentication and placed it where the others could see. Their strategic access operation had succeeded before the investigations could prevent it.\n\nThe network had obtained a foothold in the command channel it sought. It had done so by spending resources, preserving contacts and accepting an exposure trail that could still bring consequences after the immediate operation. The handler had made a habit of calling each request a limited favor. With the confirmation in front of him, the combined weight of those favors was becoming difficult to describe in the same reassuring language.\n\nOne of the men described the result as control. The technician corrected him with visible reluctance. Access depended on an operator continuing to obey, on a system continuing to respond, and on other people not changing the conditions while the room congratulated itself. The handler let the correction stand. It made the success less satisfying and the next decision more accurate.\n\nAcross the ocean, the war had not acquired a new belligerent merely because this room had found a way to influence it. Belka's population had not voted for the operation, and the country's conventional forces had not received an order to enter the conflict.\n\nThe handler began the continuation account. It would record what the network actually preserved through the final crisis. A moment of access was not yet an ending. The people in the room would have to live through the difference, along with people who had never been told that the choice existed."
 ac_camp.83.a:0 "Keep this account."
 ac_camp.83.z:0 "Close this old message."
