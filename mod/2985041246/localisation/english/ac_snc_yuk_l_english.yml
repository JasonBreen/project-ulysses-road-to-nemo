 ac_snc_yuk_message_30.t:0 "A Return with Somewhere to Go"
 ac_snc_yuk_message_30.d:0 "The national return is balanced again. This time, the receiving secretary can follow each reservation to an office, a signed instruction and an account of the work completed. There are still unanswered requests. A commander wants another protected period; a civil representative wants a waiting workshop released from an old promise. Neither has been erased to make the conclusion look unanimous. The government can keep an open receiving record or a bounded professional account. The choice will matter when the next demand arrives, whether a partner has answered, refused or ceased to be eligible. The return has become useful because somebody can finally be asked to receive it."
