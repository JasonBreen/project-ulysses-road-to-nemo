 ac_snc_yuk_message_22.t:0 "A Port Return with a Recipient: The Return"
 ac_snc_yuk_message_22.d:0 "The selected period is complete, and the delayed receiver knows who amended his order. He still believes the priority should have been different. The port secretary records his objection beside the liaison's explanation rather than averaging them into agreement. A public account will make the choice easier to challenge; a professional return will retain more detail within the receiving chain. Either route carries a continuing burden. The useful change is that a future claimant can find a responsible recipient before bringing an approved order to a window that has already been promised to somebody else.\n\n[YUK_snc_ports_orders_hearing_context]"
