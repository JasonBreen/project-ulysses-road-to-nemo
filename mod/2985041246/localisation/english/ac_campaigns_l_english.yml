 FCU_camp_3_policy_b_desc:0 "Terms of victory. Choose the protected or command mandate and accept its continuing cost.\n\nThere is no useful column for the silence after the victory announcement. The command has plans for demobilization and an estimate for the supervising mission, but the first delegation wants to know whether a particular road is open. Terms of victory determine who answers that question and who can appeal the answer. The standing account returns to the people encountered during the campaign. It leaves an occupation agreement, an evacuation record and a refused request recognizable as different things, even after the flags outside headquarters have changed."
