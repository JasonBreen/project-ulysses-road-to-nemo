 LEA_grievance_ac_alc_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_alc.98.t:0 "A Grievance on the Record"
 ac_alc.98.d:0 "The final review lists the ledgers, the arbitration's progress and the speeches. The ledger that said otherwise is in the file, published or not, with the decision.\n\n[LEA_grievance_ac_alc_report_callback]\n\n[LEA_grievance_ac_alc_policy_callback]"
 ac_alc.98.a:0 "File the completed service record."
 LEA_restraint_ac_alc_policy_callback_0:0 "The standing policy is restraint toward aurelia. Its continuing cost remains part of the allocation."
 LEA_restraint_ac_alc_policy_callback_1:0 "The standing policy is readiness on the border. Its continuing cost remains part of the allocation."
