 YUK_snp_maritime_support_civil_policy_spirit:0 "Protected civil port services"
 YUK_snp_maritime_support_civil_policy_spirit_desc:0 "The fleet's maintenance schedule and the port's civil receiving plan reserve the same specialist crew. A naval officer offers a shorter deadline; the harbour superintendent asks which inspection that deadline omits. Neither wants a ship to fail at sea. The commission must decide who can protect a maintenance reservation, how civilian delays are recorded and what a support promise means when it reaches the quay. No written schedule can replace fuel, a serviceable hull or a real naval base.\n\nProtect ordinary civil port services. Reliable repair work improves while military logistics accepts the cost of less flexible receiving windows."
