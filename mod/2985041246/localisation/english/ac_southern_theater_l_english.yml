 ac_alc.121.t:0 "A Country That Answered for Its War"
 ac_alc.121.d:0 "The last review of the period lists the decisions Leasath took after its civil war: the grievance, the army, the war and its end. Some entries are not to its credit; they are in the list.\n\nLeasath has a record of what it did. That is where an answer begins.\n\n[LEA_sw_opening_callback]"
 ac_alc.121.a:0 "Support a public maintenance review."
 ac_alc.121.b:0 "Reserve staff for a focused readiness return."
