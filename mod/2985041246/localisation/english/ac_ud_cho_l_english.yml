l_english:
 CHO_ud_admin_audit:0 "Audit the National Administration"
 CHO_ud_admin_audit_desc:0 "Chopinburg enters 1991 under a National Administration that governs with the election calendar suspended and a public split between loyal administrators and a loud nationalist movement. Before anyone argues about the next government, the ministries must show what they spend and who they employ. The audit costs months of goodwill inside the civil service."
 CHO_ud_ministry_rolls:0 "Publish the Ministry Payrolls"
 CHO_ud_ministry_rolls_desc:0 "The audit found offices whose staff lists had not been checked since before the charter was suspended. Printing every ministry payroll in the capital papers exposes absent clerks and double salaries. It will anger senior officials who built careers on quiet arrangements, but it gives later budgets a figure the public can test."
 CHO_ud_district_delegates:0 "Hear the District Delegates"
 CHO_ud_district_delegates_desc:0 "Five districts outside the capital send delegates who have rarely been heard in the ministries. District C wants harbour money, District E wants yard contracts, District F wants a fair price for its ore, and the two empty districts want roads at all. Listening commits the administration to answers it cannot yet afford."
 CHO_ud_charter_ballot:0 "Restore the Charter Ballot"
 CHO_ud_charter_ballot_desc:0 "Lift the suspension and set a date for the first national ballot in years. The administration hands its future to voters who have had little practice, and the nationalist halls will campaign hard. The ministries lose their ability to act by decree, but the government gains a mandate the districts can recognise."
 CHO_ud_keep_administration:0 "Keep the Administration Seated"
 CHO_ud_keep_administration_desc:0 "Leave the election calendar suspended and make the ministries earn their authority through results instead. A board of senior administrators would set targets, publish them and answer for misses. It is efficient and predictable, and it keeps the nationalist halls away from power, but it asks the districts to accept rule they never voted for."
 CHO_ud_answer_rally:0 "Answer the National Rally"
 CHO_ud_answer_rally_desc:0 "The nationalist movement fills halls in the capital and the harbour towns while the administration fills only its offices. Bringing the movement inside government would give the state a mass following and a ready supply of volunteers. The price is a louder, harder politics, and districts that never joined the rallies will feel shut out."
 CHO_ud_district_rolls:0 "Voter Rolls in Every District"
 CHO_ud_district_rolls_desc:0 "No ballot is credible until every district has a register. Clerks travel to the jungle harbours of District C, the yards of District E and the empty plains of District B, often by boat or on foot after the rains. The registration drive is slow and expensive, but it is the part of the charter people will actually see."
 CHO_ud_district_rolls_tt_1:0 "Registers are posted in the capital and in all five outer districts."
 CHO_ud_charter_council:0 "Convene the Charter Council"
 CHO_ud_charter_council_desc:0 "With the registers posted and the ballot counted, a Charter Council of elected members takes over the ministries from the National Administration. It is a collective body, slow to agree and quick to argue, and it will hold regular elections from now on. Its first budget will be the first one voters can punish."
 CHO_ud_ministry_scorecards:0 "Scorecards for Every Ministry"
 CHO_ud_ministry_scorecards_desc:0 "Each ministry receives three targets a year and a public scorecard showing whether it met them. Road miles in District B, harbour tonnage in District C and yard hours in District E are counted and printed. Officials who miss twice are replaced. The system rewards measurable work and quietly neglects anything hard to count."
 CHO_ud_admin_directorate:0 "Seat the Administrative Directorate"
 CHO_ud_admin_directorate_desc:0 "The board of senior administrators becomes the government in name as well as fact. An Administrative Directorate replaces the old National Administration, keeps elections suspended and governs by published plan. It answers to its own targets rather than to voters, which makes it steady in good years and brittle when the targets fail."
 CHO_ud_rally_halls_open:0 "Rally Halls in the Capital"
 CHO_ud_rally_halls_open_desc:0 "The movement is given the use of public halls in the capital and the harbour towns, along with a place on district committees. Attendance becomes a path to jobs and promotion. Volunteers sign up for the coast watch and the reserve, while shopkeepers and clerks who stay away learn to keep their opinions private."
 CHO_ud_rally_halls_open_tt_2:0 "Movement volunteers fill the coast watch and army reserve rolls."
 CHO_ud_renewal_committee:0 "Seat the National Renewal Committee"
 CHO_ud_renewal_committee_desc:0 "A National Renewal Committee drawn from the movement's leadership takes the ministries and dissolves the old administration. It promises discipline, work on the coast and pride in the districts, and it has no intention of holding elections. Trading partners will treat the country more warily, and dissent at home will have fewer outlets."
 CHO_ud_district_budget:0 "A Budget Every District Can Read"
 CHO_ud_district_budget_desc:0 "Whatever government now sits in the capital, the districts expect to see their share. A single budget book, printed by district rather than by ministry, shows how much goes to the rubber coast, the plateau, the yards and the empty plains. Arguments become sharper but shorter, and every later programme has a baseline."
 CHO_ud_grove_census:0 "Count the District C Groves"
 CHO_ud_grove_census_desc:0 "District C holds most of the country's rubber, spread across jungle groves behind three small harbours. Nobody in the capital knows how many trees are tapped, who owns them or how much latex leaves without paying duty. A census of every grove, made by surveyors on foot during the dry weeks, is the first step to a policy."
 CHO_ud_rubber_board:0 "A State Rubber Board"
 CHO_ud_rubber_board_desc:0 "The state buys all latex at a fixed price, grades it in the harbour sheds and sells it abroad under one mark. Revenue flows straight to the treasury and the factories get a reliable supply. Growers lose the right to bargain, and smuggling will rise whenever the fixed price falls behind the market."
 CHO_ud_grower_coops:0 "Grower Cooperatives on the Coast"
 CHO_ud_grower_coops_desc:0 "Families who tap the groves form cooperatives that grade, store and sell their own latex, with the state lending sheds and boats. Income stays in District C and the coast becomes calmer. The treasury collects only an export duty, so the capital has less money for its own plans and less say over prices."
 CHO_ud_lease_groves:0 "Lease the Groves to Outside Buyers"
 CHO_ud_lease_groves_desc:0 "Large buyers from abroad lease whole blocks of groves for twenty years and bring their own tapping crews, sheds and ships. Lease money arrives quickly and pays for building elsewhere. In return the country gives up control of its most valuable crop, and local growers become hired hands on land they once worked themselves."
 CHO_ud_latex_works:0 "Latex Works at the Harbours"
 CHO_ud_latex_works_desc:0 "Raw latex sells cheaply; sheet, crepe and moulded goods sell for more. Building a processing works beside the largest of the three District C harbours keeps the value at home and gives the coast steady factory jobs. It needs power, fresh water and a road the rains cannot wash out, which the district lacks."
 CHO_ud_jungle_tracks:0 "Tracks Through the Groves"
 CHO_ud_jungle_tracks_desc:0 "Latex is carried out of the groves on foot or by cart along tracks that vanish each rainy season. Graded and drained tracks with small bridges would let lorries reach the works all year round. The labour comes from the growers themselves, paid in cash, and the work will take most of a year."
 CHO_ud_harbour_customs:0 "One Customs House, Three Harbours"
 CHO_ud_harbour_customs_desc:0 "Each of the three District C harbours keeps its own customs clerks, ledgers and favourites. Merging them into a single customs house with one ledger closes the gaps that let latex leave unrecorded. Harbour towns will lose jobs and local influence, but the treasury and the convoy planners will finally see the whole trade."
 CHO_ud_synthetic_trials:0 "Synthetic Rubber Trials"
 CHO_ud_synthetic_trials_desc:0 "Natural rubber is plentiful today, but a blight, a storm season or a closed sea lane could cut supply overnight. A small laboratory at the latex works experiments with synthetic compounds made from plateau oil. It will not replace the groves, yet it keeps chemists employed and gives the army a fallback for tyres and seals."
 CHO_ud_tyre_plant:0 "A Tyre Plant for the Army"
 CHO_ud_tyre_plant_desc:0 "The army's lorries and the air arm's aircraft run on imported tyres bought at high prices. A plant beside the latex works, built to military specifications, would supply both and sell the surplus. It turns District C into a strategic district, which raises its importance in any future emergency and makes it a target."
 CHO_ud_growers_price_board:0 "Growers Set the Grove Price"
 CHO_ud_growers_price_board_desc:0 "Because the census was published grove by grove, growers can see what their neighbours produce and earn. A price board elected by the growers meets each month at the customs house and posts a reference price. Middlemen lose their margin, disputes fall, and the coast trusts the capital a little more."
 CHO_ud_growers_price_board_tt_1:0 "The growers price board meets monthly at the customs house."
 CHO_ud_quiet_export_quota:0 "A Quiet Export Quota"
 CHO_ud_quiet_export_quota_desc:0 "With the census kept inside the ministry, the government can set export quotas that buyers cannot easily check. Holding back part of each season's latex lifts the price abroad and fills a reserve fund. It works only while the figures stay secret, and growers suspect they are paid for less than they deliver."
 CHO_ud_rubber_for_escorts:0 "Rubber Credit for the Escorts"
 CHO_ud_rubber_for_escorts_desc:0 "Foreign shipyards will supply designs and fittings for escort hulls if paid partly in rubber delivered over several seasons. Pledging future latex as credit gives the navy a way to renew its ships without draining the treasury. It also ties a share of every harvest to the yards for years, whatever happens to prices."
 CHO_ud_rain_gauges:0 "Rain Gauges Across the Flats"
 CHO_ud_rain_gauges_desc:0 "The capital, District B, District E and the desert hinterland all share the low country of the flats, where heavy rain turns roads to mud for weeks at a time. A network of rain gauges and flood wardens in every district records where water gathers and when it peaks. It is cheap, dull and overdue work."
 CHO_ud_storm_drains:0 "Storm Drains Under the Capital"
 CHO_ud_storm_drains_desc:0 "The capital's streets flood every heavy season, closing shops, workshops and the road to the air base. Brick storm drains under the main avenues, sized from the wardens' records, would carry the water to outfalls beyond the city. Digging will close streets for a year, and contractors want paying long before the benefit is felt."
 CHO_ud_raised_roads:0 "Raised Roads Over the Mud"
 CHO_ud_raised_roads_desc:0 "District E's yards depend on a single road that disappears under water whenever the rains are heavy. Raising the road on an embankment with culverts every few hundred metres keeps steel, timber and workers moving to the yards. The embankment uses spoil dug from the capital drains, so the two projects share their cost."
 CHO_ud_district_b_dykes:0 "Dykes for the District B Fields"
 CHO_ud_district_b_dykes_desc:0 "District B is good, flat farmland with no buildings and no roads worth the name, mostly because it floods. Low dykes and drainage ditches around the best fields would make it worth settling. Farmers will not move there until a dry season proves the work, so the state must carry the cost alone at first."
 CHO_ud_mud_line_depots:0 "Depots Above the Mud Line"
 CHO_ud_mud_line_depots_desc:0 "Army supply depots on the flats sit on low ground and must be emptied when the water rises. Moving fuel, food and ammunition to raised platforms near the road junctions keeps units supplied through the mud season. The army must give up some convenient town depots that officers have used for years."
 CHO_ud_flats_dry:0 "The Flats Kept Dry"
 CHO_ud_flats_dry_desc:0 "With drains, dykes and raised roads working together, the wardens can predict and limit most floods instead of reacting to them. The flood service becomes a permanent drainage authority with its own budget and engineers. It will compete with every other ministry for money, but the flats will be usable in every season."
 CHO_ud_weather_service:0 "A National Weather Service"
 CHO_ud_weather_service_desc:0 "The wardens' gauges, the air base observers and the harbour masters all keep separate weather records. A national weather service combines them, adds a radar mast at the capital and issues daily forecasts for the farms, the yards and the air arm. Forecasting will also matter if the sky ever brings more than rain."
 CHO_ud_plateau_assay:0 "Assay the Plateau Seams"
 CHO_ud_plateau_assay_desc:0 "District F sits on a dry plateau with oil, aluminium ore and iron that support two civilian works and two arms works. Nobody has mapped how long the seams will last or how deep they run. An assay by the mines ministry, with drilling teams and a field laboratory, decides how much to invest above ground."
 CHO_ud_smelt_on_plateau:0 "Smelt on the Plateau"
 CHO_ud_smelt_on_plateau_desc:0 "Build smelters and refineries next to the mines so that District F ships finished metal and fuel rather than ore and crude. The plateau gains skilled jobs and the railway carries lighter loads. Power and water are scarce up there, so the works will run hot and expensive until their supply lines mature."
 CHO_ud_ore_to_capital:0 "Ore Trains to the Capital"
 CHO_ud_ore_to_capital_desc:0 "Send raw ore and crude down to the capital, where power, labour and the older works already exist. Processing stays concentrated in one city that is easier to supply and defend. District F remains a mining district with fewer skilled jobs, and its towns will feel that the capital takes the wealth and leaves the dust."
 CHO_ud_plateau_power:0 "A Power Station on the Plateau"
 CHO_ud_plateau_power_desc:0 "Every plan for District F runs into the same limit: there is not enough electricity. A thermal station burning plateau oil would light the mining towns, run pumps for the seams and feed new works. It consumes fuel the country might want to sell, and its chimneys will be the tallest structure on the plateau."
 CHO_ud_plateau_rail:0 "Grade the Plateau Railway"
 CHO_ud_plateau_rail_desc:0 "The line that climbs from the flats to the plateau is steep, single track and slow, and it limits everything District F can ship. Easing its grades and adding passing loops would double its capacity. Track gangs will work through the hot season, and traffic will be cut to a few trains a day while they do."
 CHO_ud_aluminium_line:0 "An Aluminium Rolling Line"
 CHO_ud_aluminium_line_desc:0 "Aluminium ore from District F currently leaves the country as ore and returns as expensive sheet. A rolling line beside the new power station would supply sheet and extrusions to the air arm's workshops and the yards. It needs specialist engineers who must be trained or hired abroad, and the first output will be poor."
 CHO_ud_plateau_shell_works:0 "Shell Works on the Plateau"
 CHO_ud_plateau_shell_works_desc:0 "Steel, power and a railway put District F in a position to make artillery shells and mortar bombs far from the shore. Dispersing ammunition work inland suits a country that already spreads its forces along the coast. Neighbours will notice, and each mining town will have to accept a magazine at its edge."
 CHO_ud_plateau_hostels:0 "Hostels for Plateau Workers"
 CHO_ud_plateau_hostels_desc:0 "Miners and smelter crews on the plateau live in tents and borrowed rooms, and most leave after one hot season. Proper hostels with water, a canteen and a clinic would keep trained men and women long enough to repay their training. The housing budget comes out of the works' first profits, delaying expansion."
 CHO_ud_plateau_hostels_tt_1:0 "Worker hostels open in each District F mining town."
 CHO_ud_empty_survey:0 "Survey the Two Empty Districts"
 CHO_ud_empty_survey_desc:0 "District B and the desert hinterland together hold a large share of the country's land and almost none of its buildings, roads or works. Before the state spends money there, a survey team records water, soil, tracks and the few settlements that exist. The survey takes a full year and decides which district gets the first road."
 CHO_ud_district_b_road:0 "A Paved Road to District B"
 CHO_ud_district_b_road_desc:0 "District B lies close to the capital but is reached only by farm tracks that close in the rains. A paved road from the edge of the capital across the plains would let produce reach the markets and settlers reach the land. The road is short and cheap by national standards, which makes it a good first test."
 CHO_ud_hinterland_wells:0 "Wells Across the Hinterland"
 CHO_ud_hinterland_wells_desc:0 "The desert hinterland cannot be crossed, garrisoned or settled without water. Drilling a line of wells along the route of the survey track creates stopping points every day's drive. The wells cost little compared to a road, but each one needs a keeper, and keepers have to be persuaded to live in the desert."
 CHO_ud_homestead_grants:0 "Homestead Grants on the Plains"
 CHO_ud_homestead_grants_desc:0 "Offer families from the crowded capital a plot of District B land, seed and a small loan, with title after five years of farming. Homesteads create a loyal rural population close to the capital. They grow slowly, they need schools and clinics, and the state cannot direct what the families choose to grow."
 CHO_ud_state_farms_b:0 "State Farms for District B"
 CHO_ud_state_farms_b_desc:0 "Organise District B as a few large state farms run by the agriculture ministry, with hired crews and machinery bought in bulk. Output rises fast and feeds the capital and the army. Workers have no stake in the land, the farms depend on ministry budgets, and the plains stay thinly settled outside harvest season."
 CHO_ud_district_b_market:0 "A Market Town for District B"
 CHO_ud_district_b_market_desc:0 "Farms need a place to sell grain, repair machines and buy supplies without travelling to the capital. A market town at the road's midpoint, with a grain store, a workshop and a district office, gives District B its first real centre. Its success depends on whether the farms around it actually produce a surplus."
 CHO_ud_hinterland_relays:0 "Relay Masts, Not Settlers"
 CHO_ud_hinterland_relays_desc:0 "Accept that the hinterland will stay empty and use it for what empty land does best: carrying signals and watching the sky. A chain of relay masts and a radar post links the capital to the far coast and the plateau. It costs little to staff, but it leaves the district without people to defend or develop it."
 CHO_ud_hinterland_settlers:0 "Settlers for the Hinterland Wells"
 CHO_ud_hinterland_settlers_desc:0 "Turn the wells into small settlements with irrigated gardens, a school and a police post, and pay families to stay for ten years. A settled hinterland is easier to govern and harder for anyone to cross unseen. The subsidy runs for a decade, and many families will still leave when the first drought arrives."
 CHO_ud_grants_formula:0 "A Grants Formula for the Districts"
 CHO_ud_grants_formula_desc:0 "The district delegates heard in 1991 asked for a fair rule rather than favours. A formula based on population, distance from the capital and missing services decides each district's share of development grants. The capital's own projects lose some priority, and every district will lobby to change the formula in its favour."
 CHO_ud_air_arm_review:0 "Review the Forty-Eight Fighters"
 CHO_ud_air_arm_review_desc:0 "The air arm has forty-eight fighters, one air base at the capital and too few instructors to train replacements. A review counts which airframes can fly, which pilots are current and what spares exist. The findings will embarrass the service, but they set the size of every later air budget."
 CHO_ud_second_airfield:0 "A Second Airfield on the Plateau"
 CHO_ud_second_airfield_desc:0 "With only one air base, a single raid or flood could ground the entire air arm. A second field in District F, dry and high above the flats, gives the fighters a place to disperse and train in clear weather. It is far from the harbours the fighters are meant to protect."
 CHO_ud_coastal_airstrip:0 "An Airstrip for District C"
 CHO_ud_coastal_airstrip_desc:0 "District C's harbours and rubber works have no air cover closer than the capital. A short airstrip cut from the edge of the groves would let a flight of fighters stand alert over the coast. Jungle humidity and heavy rain will wear out aircraft and crews quickly, and the strip will need constant repair."
 CHO_ud_interceptor_screen:0 "An Interceptor Screen"
 CHO_ud_interceptor_screen_desc:0 "Train the fighters for one job: meeting hostile aircraft over the country's own territory, guided from the ground. The doctrine fits a small country that does not intend to fight abroad. It leaves the coast and the convoys without an air arm able to strike ships, and it depends on radar the country does not yet have."
 CHO_ud_coastal_strike_wing:0 "A Coastal Strike Wing"
 CHO_ud_coastal_strike_wing_desc:0 "Train a share of the fighters to carry bombs and rockets against ships and landing craft off the coast. The doctrine suits a country whose real exposure is its long shoreline and its convoy routes. Pilots trained for strike work are less practised in air combat, and the wing will need longer runways."
 CHO_ud_capital_runway:0 "Lengthen the Capital Runway"
 CHO_ud_capital_runway_desc:0 "The capital's runway was laid for older, lighter aircraft and is short for loaded fighters in hot, humid air. Extending it and adding hardstands and drainage keeps it usable through the rains. The work closes the base to heavy traffic for months, so the other fields must carry the air arm while it lasts."
 CHO_ud_ground_controllers:0 "Ground Controllers for the Fighters"
 CHO_ud_ground_controllers_desc:0 "An interceptor screen is only as good as the people on the ground telling pilots where to go. A control room at the capital, a radar mast and a corps of trained controllers turn the screen into a working system. Controllers take two years to train and are easily lured away by civil aviation."
 CHO_ud_anti_ship_range:0 "An Anti-Ship Practice Range"
 CHO_ud_anti_ship_range_desc:0 "Strike pilots need targets that move on water. A practice range off the District E coast, with towed targets supplied by the yards, gives them that. Boat owners will lose a stretch of water during exercises and complain loudly, and the range will draw attention from anyone watching the coast."
 CHO_ud_air_mechanics:0 "Mechanics Before More Fighters"
 CHO_ud_air_mechanics_desc:0 "More aircraft are useless without people to keep them flying. A mechanics school at the capital base, taking apprentices from the yards and the plateau works, raises the number of serviceable fighters on any given day. It delays new purchases by a budget year, which the pilots will resent."
 CHO_ud_yard_inventory:0 "Inventory the District E Yards"
 CHO_ud_yard_inventory_desc:0 "District E's three dockyards build and repair the navy's three destroyers, its single submarine and the merchant hulls of the coast trade. Their slipways are old and their order book is thin. An inventory of yards, hulls and skilled workers shows what the navy can maintain and what it should stop pretending to own."
 CHO_ud_harbour_pilots:0 "A Harbour Pilots School"
 CHO_ud_harbour_pilots_desc:0 "The country has four naval harbours spread between District C and District E, each with awkward channels known only to a few old pilots. A pilots school in District E trains young officers and merchant mates in every channel. Ships move faster and safer, and the navy stops depending on a handful of men near retirement."
 CHO_ud_convoy_escorts:0 "Escort the Merchant Convoys"
 CHO_ud_convoy_escorts_desc:0 "Organise the destroyers and armed merchant ships to escort coastal convoys between the harbours and out to the shipping lanes. The country's trade, rubber above all, travels by sea, and escorts protect it directly. Escort duty is slow and wears out hulls, and it leaves no ships free to watch the approaches."
 CHO_ud_submarine_pickets:0 "Submarine Pickets Offshore"
 CHO_ud_submarine_pickets_desc:0 "Station the submarine and small patrol craft far out on the approaches to watch for hostile ships and report them early. A small navy cannot fight every intruder, but it can refuse to be surprised. Merchant ships sail without escorts, and the picket boats spend long, lonely weeks at sea."
 CHO_ud_island_watch:0 "Watch the Coast After Skully"
 CHO_ud_island_watch_desc:0 "At the end of 1995 rebels in the Skully Islands showed how a small armed group can use remote islands and coastline, until Unified Command defeated them. This country's shore is long and thinly watched. A coast watch of volunteers, harbour police and naval reservists closes the gaps, at the cost of a standing payroll."
 CHO_ud_convoy_office:0 "A Convoy Office in District E"
 CHO_ud_convoy_office_desc:0 "Merchant masters, harbour clerks and naval officers each keep their own sailing lists. A convoy office in District E collects them, schedules departures and decides which ships sail together. Masters lose some freedom to sail when they like, and the office becomes the country's best record of who carries what."
 CHO_ud_escort_hulls_credit:0 "Escort Designs on Rubber Credit"
 CHO_ud_escort_hulls_credit_desc:0 "The rubber credit agreed with foreign yards can now be called in. Modern escort designs and fittings, paid for in latex over several harvests, reach the District E drawing offices. They give the escort force real speed and sensors, but every poor harvest from now on will be felt in the navy budget."
 CHO_ud_picket_relay:0 "Pickets Report by Radio Relay"
 CHO_ud_picket_relay_desc:0 "A picket that cannot report is just a lonely boat. Radio relays on headlands and a shore station in District C pass sightings to the capital within minutes. The system makes the pickets useful, but it depends on equipment bought abroad and on operators who will be scarce in any emergency."
 CHO_ud_coastal_mines:0 "Mine Stores for the Approaches"
 CHO_ud_coastal_mines_desc:0 "Defensive minefields could close the harbour approaches in a crisis, but only if the mines are already stored, maintained and charted. Magazines in District E and District C hold a stock of moored mines and the charts to lay them. Boat owners and merchants will want assurance that no field is laid without warning."
 CHO_ud_ulysses_warning:0 "Hear the Ulysses Warning"
 CHO_ud_ulysses_warning_desc:0 "In April 1996 Central Usea announced that the asteroid Ulysses would strike the Earth, and fragments could fall anywhere. The country must decide what to tell its people, what to build and what to stockpile in the years before the pass. The first decision is how openly the government speaks about the danger."
 CHO_ud_national_shelters:0 "A National Shelter Plan"
 CHO_ud_national_shelters_desc:0 "Fund shelters, reserves and warning sirens from a special levy, built and run entirely by the country's own ministries. The government keeps full control of where shelters go and who uses them. The levy raises prices on everyday goods, and a small state must build the whole programme with its own engineers."
 CHO_ud_treaty_shelter_compact:0 "The Treaty Council Shelter Compact"
 CHO_ud_treaty_shelter_compact_desc:0 "Join other Treaty Council members in a common shelter compact that shares designs, engineers and warning data. Shelters go up faster and cost less. In exchange the compact sets standards, inspects sites and expects help for other members when fragments fall, which ties relief planning to decisions taken elsewhere."
 CHO_ud_observatory_bulletins:0 "Weekly Observatory Bulletins"
 CHO_ud_observatory_bulletins_desc:0 "Since the government chose openness, astronomers and the flood wardens publish a weekly bulletin on the asteroid, its predicted pass and what it means for the coast and the flats. Panic drops once people see regular facts. Every revised forecast also makes headlines, and the bulletins must never be caught softening bad news."
 CHO_ud_rumour_desks:0 "Rumour Control Desks"
 CHO_ud_rumour_desks_desc:0 "Since the government chose to release only confirmed figures, rumours fill the gap. Rumour desks in every district answer questions by telephone and notice board, correcting false dates and miracle cures. They calm the markets, but people learn to ask the desks what the government is not saying."
 CHO_ud_capital_shelters:0 "Shelters Under the Capital"
 CHO_ud_capital_shelters_desc:0 "The capital holds most of the country's people and industry on flat, waterlogged ground where deep digging floods. Shelters must be half buried, reinforced and pumped. The first ones go under schools, the hospital and the main works, and the queue for places will show the public exactly who the state protects first."
 CHO_ud_grain_fuel_reserve:0 "Grain and Fuel Reserves"
 CHO_ud_grain_fuel_reserve_desc:0 "A strike anywhere on the coast could cut harbours and roads for weeks. A national reserve of grain, medicine and fuel, stored on the dry plateau and in the capital, buys that time. Filling it takes money away from development and ties up plateau oil that would otherwise be exported."
 CHO_ud_coast_evac:0 "Evacuation Tables for the Coast"
 CHO_ud_coast_evac_desc:0 "Low harbour towns in District C and District E would be the hardest places to protect from fragments or the waves they might raise. Evacuation tables assign every street a route, a shelter and a time. Drawing them up means admitting which towns cannot be defended, and property values there will fall."
 CHO_ud_rubber_sheeting:0 "Rubber Sheeting for Shelters"
 CHO_ud_rubber_sheeting_desc:0 "Half buried shelters on the flats leak in every heavy rain. The latex works in District C can roll waterproof sheeting to line them, along with seals for doors and vents. It is a rare case where the rubber coast and the capital need each other, and it keeps the works busy when exports slow."
 CHO_ud_hospital_reserve:0 "A Hospital Bed Reserve"
 CHO_ud_hospital_reserve_desc:0 "The capital's hospital and the district clinics run full in an ordinary year. A reserve of beds, stretchers and trained volunteers, stored in schools and warehouses, doubles emergency capacity on paper. It costs relatively little, but volunteers must be retrained each year or the reserve exists only in a ledger."
 CHO_ud_hospital_reserve_tt_1:0 "Stretchers, beds and volunteer rosters are stored in every district."
 CHO_ud_last_drills:0 "The Last Drills Before the Pass"
 CHO_ud_last_drills_desc:0 "In the final months before Ulysses passes, every district runs full drills: sirens, evacuation by table, shelter entry and hospital reception. The drills expose gaps while there is still time to fix them. They also frighten people, and attendance falls each time the predicted danger feels more distant."
 CHO_ud_coup_news:0 "The Coup Across Usea"
 CHO_ud_coup_news_desc:0 "On 30 May 1997 a coup broke out across Usea, and Unified Command moved to defeat it. At home the army's units must report their loyalty and the government must decide how far to trust them. The question is not only who rules this year, but how the army answers to civilians afterwards."
 CHO_ud_loyalty_commission:0 "An Army Loyalty Commission"
 CHO_ud_loyalty_commission_desc:0 "A commission of civil servants, judges and senior officers interviews every unit commander about the May days: where they were, who they called and what orders they gave. The army resents being questioned by outsiders. The alternative, trusting every officer on their word, is worse after what happened elsewhere in Usea."
 CHO_ud_defend_charter:0 "Defend the Charter Ballot"
 CHO_ud_defend_charter_desc:0 "The charter restored earlier in the decade faces its first real test. Instead of suspending ballots in the emergency, the government keeps the electoral calendar and invites every district to watch the count. If it succeeds, the charter becomes harder to suspend again; if turnout falls, opponents will call it a failure."
 CHO_ud_directorate_officers:0 "Audit the Directorate Officers"
 CHO_ud_directorate_officers_desc:0 "The administrative path chosen earlier left senior officials and officers working closely, with few outsiders watching. After the coup, the ministries' own auditors examine every contract between the army and the administration. Some friendships will end, and the audit shows that unelected government can still police its own ranks."
 CHO_ud_rein_rally:0 "Rein In the Rally Halls"
 CHO_ud_rein_rally_desc:0 "A mass movement with drilled volunteers looks different after a coup. The government puts the rally halls' volunteer squads under the coast watch chain of command and bans uniforms outside parades. Movement veterans will call this betrayal, but the state cannot allow armed loyalties it does not control."
 CHO_ud_defence_directorate:0 "Seat a Coastal Defence Directorate"
 CHO_ud_defence_directorate_desc:0 "Hand government to a Coastal Defence Directorate of senior officers and security officials until Usea is calm. It promises order, fast decisions and a firm grip on the army it comes from. It suspends elections, overrides the districts and sets a precedent that every later government will have to unwind."
 CHO_ud_civil_government:0 "Keep the Government Civilian"
 CHO_ud_civil_government_desc:0 "Refuse to hand power to the officers, whatever the emergency. The civilian government keeps its ministries, places the army under a civilian oversight board and publishes its orders. It is slower in a crisis and the officer corps will grumble, but the country avoids inviting the army into politics."
 CHO_ud_quiet_officer_review:0 "A Quiet Review of Officers"
 CHO_ud_quiet_officer_review_desc:0 "Units confined to barracks during the coup reported at different speeds and in different moods. A confidential review of the late and reluctant commanders lets the army retire or move them without a public trial. The army keeps its dignity, but the public never learns who hesitated."
 CHO_ud_street_patrols_end:0 "Bring the Patrols Off the Streets"
 CHO_ud_street_patrols_end_desc:0 "Soldiers kept in the capital's streets after the coup reassured some people and frightened many others. Withdrawing them on a published schedule, district by district, returns policing to the police. Officers who enjoyed the visibility will object, and any incident during the withdrawal will be blamed on the decision."
 CHO_ud_mutiny_code:0 "A Written Mutiny Code"
 CHO_ud_mutiny_code_desc:0 "Write down, for the first time, exactly what counts as mutiny, who judges it and what the penalties are. Officers know where the line is and the courts can enforce it. A written code also shows that the army can be held to account, which some commanders will read as an insult to their service."
 CHO_ud_reporting_amnesty:0 "Amnesty for Late Reporters"
 CHO_ud_reporting_amnesty_desc:0 "Declare that any soldier or officer who reported late during the coup, without joining it, faces no further action. The amnesty ends speculation and lets the army move on. It also tells the next plotters that hesitation costs nothing, and officers who reported at once feel their loyalty went unrewarded."
 CHO_ud_barracks_out:0 "Barracks Out of the Capital"
 CHO_ud_barracks_out_desc:0 "The army's largest barracks sit beside the ministries, a reminder of how easily soldiers could reach the government. Moving the main garrison to new barracks in District B, beside the road and the farms, puts distance between the army and politics. The move is expensive, and officers' families will resist leaving the capital."
 CHO_ud_railgun_debate:0 "The Railgun Question"
 CHO_ud_railgun_debate_desc:0 "In June 1998 Central Usea completed Stonehenge, eight railguns in neutral San Salvacion meant to break up the asteroid's fragments. This country is not part of the project and cannot know whether the guns will protect its coast. The government must decide how far to rely on them and what to build in case they fail."
 CHO_ud_join_council_watch:0 "Join the Treaty Council Air Watch"
 CHO_ud_join_council_watch_desc:0 "Share radar reports, debris tracking and air defence plans with the other Treaty Council members. The country gets early warning far beyond its own masts and a voice in the council's air committees. In return it accepts council standards and the expectation that its own skies will be watched by others too."
 CHO_ud_declare_neutral_skies:0 "Declare Neutral Airspace"
 CHO_ud_declare_neutral_skies_desc:0 "Announce that the national airspace is closed to every military aircraft but the country's own, whatever the emergency, and that the government takes no side in Usean disputes. Neutrality keeps the country out of other states' plans. It also means the air arm must watch and defend its skies without help."
 CHO_ud_every_capital:0 "Talks With Every Capital"
 CHO_ud_every_capital_desc:0 "Keep channels open to every Usean government, Treaty Council member or not, through trade missions, liaison officers and quiet consultations. The country becomes useful to everyone and committed to no one. The policy brings influence and information, but it relies on diplomats more than radar, and partners may doubt its word."
 CHO_ud_capital_debris_radar:0 "Debris Radar Over the Capital"
 CHO_ud_capital_debris_radar_desc:0 "Whatever policy the country follows, it needs to see what is falling toward it. A debris tracking radar at the capital, paired with the weather records, gives minutes of warning instead of none. The equipment is imported, expensive and fragile in the humidity, and its operators must be trained in a hurry."
 CHO_ud_radar_district_c:0 "A Radar Post for District C"
 CHO_ud_radar_district_c_desc:0 "The rubber coast has the country's busiest harbours and its longest exposed shore. A radar post on the hills behind the groves covers the harbour approaches and the sea lanes beyond. The jungle damages equipment quickly, so the post needs its own workshop, its own generator and a crew willing to live there."
 CHO_ud_radar_plateau:0 "A Radar Post on the Plateau"
 CHO_ud_radar_plateau_desc:0 "The plateau's height gives radar a long view across the flats and the interior. A post near the District F mining towns watches the inland approaches and the high debris tracks. It is the cheapest post to build and the hardest to supply with spare parts, which come up the slow railway."
 CHO_ud_relief_budget_shift:0 "Move Air Funds to Relief"
 CHO_ud_relief_budget_shift_desc:0 "Having decided to trust Stonehenge with the sky, the government moves part of the air defence budget into relief stores, hospitals and roads. The decision frees money now and saves lives after any impact. If the railguns miss a fragment headed for the coast, the decision will be remembered bitterly."
 CHO_ud_debris_roofs:0 "Debris Roofs for the Works"
 CHO_ud_debris_roofs_desc:0 "Planning as if the railguns will miss means protecting what the country cannot replace. Reinforced roofs and blast walls go up over the capital's main works and the largest plant in each district. Production slows while builders work around the machines, but the works should survive anything short of a direct hit."
 CHO_ud_capital_aa:0 "Anti-Air Guns for the Capital"
 CHO_ud_capital_aa_desc:0 "Radar gives warning; guns give an answer. A ring of anti-air batteries around the capital, fed by the radar posts, protects the city and its works against hostile aircraft. Gun crews are drawn from the army reserve, and their training competes with every other demand on it."
 CHO_ud_fragments_fall:0 "When the Fragments Fell"
 CHO_ud_fragments_fall_desc:0 "On 8 July 1999 Ulysses passed the Roche limit and broke apart, and fragments fell across the world. Reports from across Usea describe damaged towns, closed ports and families on the move. The government must organise relief at home and decide how to receive people arriving from elsewhere."
 CHO_ud_open_harbour_camps:0 "Open Camps at the Harbours"
 CHO_ud_open_harbour_camps_desc:0 "Receive displaced people at the District C and District E harbours in organised camps with food, clinics and registration. The camps are visible, easy to supply by sea and welcomed abroad. They also concentrate thousands of people in low coastal towns, and closing them later will be harder than opening them."
 CHO_ud_disperse_inland:0 "Disperse the Displaced Inland"
 CHO_ud_disperse_inland_desc:0 "Move arrivals quickly from the harbours to small reception points in District B, the plateau towns and the capital's outskirts. No single town carries the whole burden and nobody settles in a camp. Dispersal needs transport, roads and willing host families, and it spreads the strain into every district at once."
 CHO_ud_field_hospitals:0 "Field Hospitals on the Flats"
 CHO_ud_field_hospitals_desc:0 "Hospitals in the capital fill within days, and the district clinics cannot handle injuries or the sickness that follows crowding and broken water supplies. Field hospitals in tents and schools, staffed by army doctors and volunteers, spread care across the flats. They draw down medical stores that took years to build."
 CHO_ud_clear_runways:0 "Keep the Capital Runway Open"
 CHO_ud_clear_runways_desc:0 "Relief flights and medical evacuations need the capital runway open day and night, but it was built for a small air arm. Engineers add lighting, hardstands and a second taxiway so that cargo aircraft can unload while fighters stay on alert. Until the work is done, relief must come by road and sea."
 CHO_ud_army_relief_columns:0 "Army Relief Columns"
 CHO_ud_army_relief_columns_desc:0 "Because the government sent the army to the coast, its lorries and engineers now carry food, water and tents along fixed relief routes. The columns are disciplined and fast. Soldiers gain experience in movement and supply, while some coastal towns grow uneasy at seeing troops in charge of their streets."
 CHO_ud_district_relief_boards:0 "District Relief Boards"
 CHO_ud_district_relief_boards_desc:0 "Because relief was placed in the districts' hands, each district forms a board of officials, doctors and local volunteers that sets its own priorities. Help reaches people who know the board members. Districts with weak administrations, the empty ones above all, fall behind and ask the capital to step in."
 CHO_ud_drained_camps:0 "Camps on Drained Ground"
 CHO_ud_drained_camps_desc:0 "The drainage work on the flats pays a second dividend: dry ground for tents, kitchens and latrines through the rainy season. Placing camps and reception points on drained land prevents the floods and fevers that would otherwise follow. District B farmers lose some fields for the duration and expect compensation."
 CHO_ud_open_shelters:0 "Shelters Open to the Displaced"
 CHO_ud_open_shelters_desc:0 "The shelters dug under the capital before the pass stand mostly empty once the immediate danger is over. Opening them as temporary housing for displaced families gives roofs and pumps to people who have neither. Residents who queued for places before the pass will ask why newcomers get them first."
 CHO_ud_open_shelters_tt_1:0 "Capital shelters house displaced families until the emergency ends."
 CHO_ud_evacuate_by_table:0 "Evacuate by the Tables"
 CHO_ud_evacuate_by_table_desc:0 "The evacuation tables drawn up for the coast now guide families out of damaged or threatened harbour streets. Because routes and shelters were assigned in advance, the movement is orderly and quick. People who ignored the drills, or whose streets were left off the tables, still need help from someone."
 CHO_ud_drill_wardens:0 "Drill Wardens on the Streets"
 CHO_ud_drill_wardens_desc:0 "Wardens trained in the last drills before the pass already know every street, shelter and route in their districts. Putting them in charge of local registration and distribution saves days of confusion. They are volunteers, and many are exhausted after months of drills followed by weeks of real emergency."
 CHO_ud_rebuild_capital_roads:0 "Rebuild the Capital Roads"
 CHO_ud_rebuild_capital_roads_desc:0 "Relief traffic, heavy rain and overloaded lorries have broken the capital's roads faster than crews can patch them. A proper rebuilding programme, with drained foundations and new surfaces on the main routes, replaces patching with repair. It closes roads for months and takes engineers away from the districts."
 CHO_ud_relief_wind_down:0 "Wind Down the Emergency"
 CHO_ud_relief_wind_down_desc:0 "Emergency powers, ration cards and relief command posts were meant to be temporary. Ending them on a published date, district by district, returns ordinary government and tells people the worst has passed. Some officials prefer emergency powers, and some families still depend on relief that must become welfare."
 CHO_ud_lean_budget:0 "A Budget for the Lean Years"
 CHO_ud_lean_budget_desc:0 "Shelters, reserves, relief and lost trade have emptied the treasury, and buyers for rubber and ore are scarce after the impact. A lean budget cuts new projects, freezes salaries and delays the districts' grants. It keeps the state solvent, but every district will feel the cuts and blame the capital for them."
 CHO_ud_harbour_quota:0 "A Quota at the Harbours"
 CHO_ud_harbour_quota_desc:0 "After Erusea stopped taking in refugees in April 2000, pressure on the smaller Usean coasts grew. A fixed yearly quota, processed at the District E harbour, lets the country admit families in an orderly way. The quota pleases relief agencies abroad and angers people at home who feel the lean years leave nothing to share."
 CHO_ud_close_coast:0 "Close the Coast to New Arrivals"
 CHO_ud_close_coast_desc:0 "Follow the Erusean example of April 2000 and stop admitting new arrivals by sea, apart from medical emergencies. The coast watch and the navy turn boats away. Many voters welcome the decision in the lean years, but the country's reputation abroad suffers and the navy's crews dislike the work they are given."
 CHO_ud_resettle_district_b:0 "Resettle Arrivals in District B"
 CHO_ud_resettle_district_b_desc:0 "The homestead scheme on the District B plains still has land without families. Offering arrivals homestead plots on the same terms as citizens turns a burden into settlers. Older homesteaders worry about competition, and the scheme only works if the dykes and the market town keep pace with new farms."
 CHO_ud_phantom_payroll:0 "Cut the Phantom Payroll"
 CHO_ud_phantom_payroll_desc:0 "The payrolls published in the early years still show names that never come to work. With every coin now counted, the finance ministry removes them, along with duplicate allowances and pensions paid to the dead. The savings are real and quick, and the officials who signed those payrolls will be unhappy."
 CHO_ud_reschedule_debts:0 "Reschedule the Relief Debts"
 CHO_ud_reschedule_debts_desc:0 "The relief years were paid for partly with short loans that now fall due together. Negotiating longer terms with the lenders spreads payments across a decade. It costs more interest in total and gives creditors a say in the budget, but it avoids a default that would close every market to the country."
 CHO_ud_close_harbour_camps:0 "Close the Harbour Camps"
 CHO_ud_close_harbour_camps_desc:0 "The harbour camps opened after the impact have become semi-permanent towns with schools, markets and police posts. Closing them means moving residents into housing elsewhere or helping them leave. The process is slow, contested and expensive, but camps cannot remain the main address of thousands of families forever."
 CHO_ud_quota_classes:0 "Classes for the Quota Families"
 CHO_ud_quota_classes_desc:0 "Families admitted under the quota need language, work permits and schooling to stop depending on relief. Evening classes in District E, run by teachers and earlier arrivals, teach the national language and the rules of work. The classes are cheap, but they need steady funding through years when every budget line is challenged."
 CHO_ud_quota_classes_tt_1:0 "Evening classes run in every District E harbour town."
 CHO_ud_balance_ledger:0 "Balance the Ledger"
 CHO_ud_balance_ledger_desc:0 "Once the debts are rescheduled and the worst cuts have done their work, the budget can stop shrinking. Balancing the ledger restores the districts' grants on a smaller scale and lifts the salary freeze. It also makes the finance ministry the most powerful office in government, with a veto over every new idea."
 CHO_ud_war_news:0 "News From San Salvacion"
 CHO_ud_war_news_desc:0 "In the summer of 2003 Erusea invaded neutral San Salvacion and seized Stonehenge, and in August Central Usea founded ISAF to resist. The railguns built to protect the continent are now turned against aircraft. The country must choose its own posture without sending its small forces abroad."
 CHO_ud_armed_neutrality:0 "Armed Neutrality on the Coast"
 CHO_ud_armed_neutrality_desc:0 "Declare strict neutrality and back it with a full guard on the coast, the harbours and the airspace. No warring side may use the country's territory, ports or skies. The posture demands men and money for the whole war and gives the country no friends when it ends, but it keeps the fighting away."
 CHO_ud_quiet_help:0 "Quiet Help for the Coalition"
 CHO_ud_quiet_help_desc:0 "Stay formally outside the war while selling fuel, rubber and repair work to the coalition's forces through the District E yards and the plateau oil fields. The arms works run at full capacity. The help is quiet only until someone on the other side notices, and the country's neutrality becomes a matter of opinion."
 CHO_ud_trade_every_side:0 "Trade With Every Side"
 CHO_ud_trade_every_side_desc:0 "Sell rubber, fuel and ship repairs to anyone who pays, coalition or Erusean, through neutral brokers. War prices refill the treasury emptied in the lean years. Both sides will suspect the country of favouring the other, and support for the war effort at home stays low because there is no side to support."
 CHO_ud_ration_fuel_tyres:0 "Ration Fuel and Tyres"
 CHO_ud_ration_fuel_tyres_desc:0 "Whatever the country's posture, the war disrupts imports and raises prices. Rationing fuel and tyres for private use keeps the army, the coast guard and the relief services supplied. Drivers, farmers and traders feel it first and loudest, and a black market will grow in the harbour towns."
 CHO_ud_neutral_guard:0 "Guard Posts on Every Harbour"
 CHO_ud_neutral_guard_desc:0 "Neutrality means stopping warships, aircraft and armed boats that try to use the harbours or shelter in home waters. Guard posts with guns, searchlights and radio at each harbour make the declaration credible. They need a standing garrison through the war, drawn from reservists who would rather be at home."
 CHO_ud_coalition_yards:0 "Coalition Repairs in District E"
 CHO_ud_coalition_yards_desc:0 "Damaged coalition ships can be repaired in the District E yards without crossing any formal line. The yards fill with work, skilled hands return from abroad and the arms works gain contracts. Every repaired hull is also evidence that a hostile power could cite against the country's claim to be neutral."
 CHO_ud_war_prices:0 "War Prices for Rubber and Fuel"
 CHO_ud_war_prices_desc:0 "Wartime demand pushes rubber and fuel prices higher than they have been in a decade. The treasury takes a windfall levy on exports and spends it on the capital's works before peace returns prices to normal. Growers and drillers complain that the state takes their good years and leaves them the bad."
 CHO_ud_reservist_depots:0 "Reservists at the Raised Depots"
 CHO_ud_reservist_depots_desc:0 "The depots moved above the mud line in the early years can now equip reservists called up for the war. Units mobilise faster and stay supplied through the rains. The call-ups take workers from farms and works just as wartime demand peaks, and employers ask for exemptions."
 CHO_ud_war_insurance:0 "War Insurance at the Customs House"
 CHO_ud_war_insurance_desc:0 "Shipowners refuse to sail without war risk insurance, and foreign insurers charge ruinous rates. The single customs house can now issue state-backed war cover for ships carrying the country's cargo, priced from its complete trade records. Cover keeps the harbours working, and one sunk ship would cost the treasury dearly."
 CHO_ud_war_insurance_tt_1:0 "Ships sailing from the District C harbours carry state war cover."
 CHO_ud_coast_watch_stands_to:0 "The Coast Watch Stands To"
 CHO_ud_coast_watch_stands_to_desc:0 "The coast watch founded after the Skully Islands rebellion has years of practice spotting strangers on the shore. In wartime it reports smugglers, deserters and armed boats that try to use quiet coves. Volunteers need pay and radios now rather than thanks, and some coastal villages resent being watched."
 CHO_ud_neutral_convoy_rules:0 "Convoy Rules for Neutral Waters"
 CHO_ud_neutral_convoy_rules_desc:0 "The convoy office writes new rules for wartime: neutral markings, lights, sailing lists filed with every navy in the area and routes that avoid the war zones. Merchant masters gain some protection from mistaken attacks. The rules slow trade and depend on warring navies respecting them, which is never certain."
 CHO_ud_council_liaison:0 "Treaty Council Liaison Officers"
 CHO_ud_council_liaison_desc:0 "Membership in the council air watch gives the country a seat in its wartime coordination rooms. Liaison officers share radar tracks and warnings while the country stays formally outside the fighting. Early warning improves, but other members expect information to flow both ways and ask uncomfortable questions."
 CHO_ud_neutral_skies_enforced:0 "Neutral Skies, Enforced"
 CHO_ud_neutral_skies_enforced_desc:0 "The neutral airspace declared in 1998 is tested by aircraft from both sides. Fighters scramble to intercept every intruder and escort it away or force it down. Pilots gain hard experience, and each incident risks a diplomatic quarrel or, worse, an exchange of fire that someone will call an act of war."
 CHO_ud_wartime_back_channels:0 "Back Channels in Wartime"
 CHO_ud_wartime_back_channels_desc:0 "The channels kept open to every capital since 1998 become valuable once Usea is at war. The country's diplomats carry messages about prisoners, shipping and local truces that the warring governments cannot send directly. The role brings influence and occasional gratitude, and it can end abruptly if a message goes wrong."
 CHO_ud_war_accounts:0 "Close the War Accounts"
 CHO_ud_war_accounts_desc:0 "By the autumn of 2005 the government must decide when the emergency measures end, whatever the final terms abroad. Closing the war accounts lifts rationing, releases reservists and publishes what the war years cost. The publication will start arguments about the posture chosen in 2003 that will last for years."
 CHO_ud_draft_compact:0 "Draft the Recovery Compact"
 CHO_ud_draft_compact_desc:0 "Fifteen years of reform, warning, impact and war have left the country tired, indebted and still standing. A recovery compact sets out what the next decade must deliver: rebuilt harbours, a working plateau, settled districts and an honest government. Drafting it forces every faction to say what it wants and what it will give up."
 CHO_ud_open_elections:0 "Return to Open Elections"
 CHO_ud_open_elections_desc:0 "Whatever government brought the country through the war, the compact can end with a normal national election and a Recovery Assembly chosen by it. Parties will form around the old arguments about rubber, the plateau and the war years. Government becomes noisier and slower, and much harder for any group to capture."
 CHO_ud_governors_council:0 "A Council of District Governors"
 CHO_ud_governors_council_desc:0 "Let the compact be carried out by a council of the six district governors, appointed for their records in the relief and war years. Each district gains a direct voice in national decisions and the capital loses its automatic lead. Elections remain suspended, and governors may favour their districts over the country."
 CHO_ud_rubber_exports_return:0 "Rubber Exports Return"
 CHO_ud_rubber_exports_return_desc:0 "With shipping insured again at normal rates, the rubber coast can sell abroad without wartime risks. New buyers, refurbished harbours and the latex works' spare capacity rebuild the trade. Prices are lower than at the wartime peak, and growers must accept that the windfall years are gone."
 CHO_ud_yard_contracts:0 "Merchant Hull Contracts"
 CHO_ud_yard_contracts_desc:0 "The District E yards survived on repair work and wartime orders. Long-term contracts for merchant hulls and fishing boats, backed by state guarantees, give them a steady order book for the first time since 1991. Yard workers gain security, while the treasury carries the risk if buyers default."
 CHO_ud_directorate_stands_down:0 "The Directorate Stands Down"
 CHO_ud_directorate_stands_down_desc:0 "The Coastal Defence Directorate seated after the 1997 coup still holds offices it promised to hold only for the emergency. Standing down formally, with honours for its members and a professional army code in its place, closes the chapter. Some officers want to stay, and the army's new role must be written in law."
 CHO_ud_civil_decade:0 "A Decade of Civil Rule"
 CHO_ud_civil_decade_desc:0 "Since the coup the army has answered to a civilian board, and nearly a decade of practice has turned emergency oversight into routine. Writing the board's powers into a permanent civil service code makes the arrangement independent of any one government. Officers accept it more readily than they would have in 1997."
 CHO_ud_vote_observers:0 "Observers for the Count"
 CHO_ud_vote_observers_desc:0 "Because the compact itself went to a national vote, every later count is watched closely. Inviting observers from abroad and from every district to the next national count shows that the result can be trusted. The observers will also report faults, and their reports will be read in every Usean capital."
 CHO_ud_governors_conference:0 "An Annual Governors Conference"
 CHO_ud_governors_conference_desc:0 "Because the governors signed the compact, they meet each year to review its progress district by district. The conference keeps the districts committed and spots failures early. It also becomes the place where governors trade favours, and the capital's ministries must attend as equals rather than as masters."
 CHO_ud_plateau_mill_upgrade:0 "Plateau Mills to Modern Gauge"
 CHO_ud_plateau_mill_upgrade_desc:0 "The smelters built on the plateau in the early years are worn and inefficient. Rebuilding them to modern standards with better furnaces, cleaner power and automated rolling keeps District F competitive. The work idles the mills for a season and needs engineers trained at home rather than hired abroad."
 CHO_ud_ore_line_double:0 "Double-Track the Ore Line"
 CHO_ud_ore_line_double_desc:0 "The ore trains that have carried District F's output to the capital since the early years run on a single line that cannot take more traffic. Doubling the track and adding modern wagons lets the capital's works grow. The plateau towns, still mostly mining camps, ask again what they gain from the arrangement."
 CHO_ud_reopen_coast:0 "Reopen the Coast to Arrivals"
 CHO_ud_reopen_coast_desc:0 "The coast closed to new arrivals in 2000 remains closed years after the emergency that justified it. Reopening it under a modest annual quota restores the country's standing abroad and brings workers to districts that need them. Opponents argue that the closure kept the lean years bearable and should stay."
 CHO_ud_quota_citizenship:0 "Citizenship for Quota Families"
 CHO_ud_quota_citizenship_desc:0 "Families admitted under the harbour quota in the lean years have lived, worked and paid taxes here for years. A path to citizenship ends their uncertain status and makes them full members of their districts. Nationalist groups object loudly, but employers and district governors back the measure."
 CHO_ud_compact_accounts:0 "Close the Compact Accounts"
 CHO_ud_compact_accounts_desc:0 "By the end of its decade the recovery compact should show results in the ledgers rather than in speeches. Auditors compare its promises with miles of road, harbour tonnage and plateau output. The report decides whether the compact's programme becomes the normal way of government or is quietly replaced."
 CHO_ud_college_charter:0 "A National Technical College"
 CHO_ud_college_charter_desc:0 "The country has spent twenty years hiring engineers, controllers and chemists from abroad or training them in a hurry. A national technical college in the capital, with workshops at the yards, the latex works and the plateau mills, trains them at home. It takes a decade to repay itself and competes with schools for every teacher."
 CHO_ud_yard_electronics:0 "Electronics Courses for the Yards"
 CHO_ud_yard_electronics_desc:0 "Modern hulls carry more electronics than steel by value, and the District E yards cannot fit or repair them. A college course with a teaching workshop at the yards trains technicians to install and maintain sensors, radios and engine controls. Graduates are in demand everywhere, and some will leave for better pay abroad."
 CHO_ud_weather_radar_net:0 "A Weather Radar Network"
 CHO_ud_weather_radar_net_desc:0 "The single weather radar at the capital cannot see storms forming over the sea or the desert. New masts on the District E coast and in the hinterland give the forecasters a national picture. Farmers, the yards and the air arm all benefit, and the masts double as a watch on the sky."
 CHO_ud_ground_station:0 "A Satellite Ground Station"
 CHO_ud_ground_station_desc:0 "Weather, navigation and communications increasingly come from satellites the country does not own. A ground station at the capital receives and processes their data for the forecasters, the harbours and the government. It ties the country to foreign operators, and the dish is the most expensive instrument it has ever bought."
 CHO_ud_relay_data_line:0 "Relay Masts Into a Data Line"
 CHO_ud_relay_data_line_desc:0 "The relay masts built across the hinterland in the early years now carry little traffic. Re-equipping them as a digital data line links the plateau, the far coast and the capital to the college and the forecasters. It is a cheap upgrade because the masts, wells and access tracks already exist."
 CHO_ud_latex_chemistry:0 "Rubber Chemistry Laboratories"
 CHO_ud_latex_chemistry_desc:0 "Natural rubber now competes with synthetic products everywhere. Laboratories at the college and the latex works develop specialty compounds, medical goods and industrial seals that sell for far more than raw sheet. The research takes years to pay and needs chemists the country has only recently begun to train."
 CHO_ud_plateau_engineering:0 "Plateau Engineering Course"
 CHO_ud_plateau_engineering_desc:0 "Mining, smelting and railway engineering on the plateau have always depended on a few experienced men and women. A college course based in District F turns their knowledge into a curriculum, with field work in the seams and the mills. Graduates stay on the plateau more often than those trained in the capital."
 CHO_ud_graduates_service:0 "Graduates Into the Ministries"
 CHO_ud_graduates_service_desc:0 "The first college graduates are ready for public service. Placing them in the ministries, the yards and the district offices replaces some officials appointed during the emergencies with technically trained staff. Older officials resist being judged by people half their age, but the government becomes more capable."
 CHO_ud_thirty_year_account:0 "A Thirty-Year Account"
 CHO_ud_thirty_year_account_desc:0 "Nearly thirty years after the National Administration's audit, the government publishes a full account of what the country built, lost and changed. Districts compare their roads, works and harbours with the figures of 1991. The account will be argued over, but it gives the next generation a baseline as honest as the first."
 CHO_ud_thirty_year_account_tt_2:0 "The account is printed district by district, as in 1991."
