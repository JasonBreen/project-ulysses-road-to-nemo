 FAT_fsb_sweep_warrants:0 "Close the Expired Warrants"
 FAT_fsb_sweep_warrants_desc:0 "Unlock a registry sweep of expired or ineligible partner warrants.\n\nAdministrative closure only: no cash or completion award. New authorisations have a 30-day cooldown. "
 FAT_fsb_sweep_warrants_tt:0 "Unlock a registry sweep of expired or ineligible partner warrants.\n\nAdministrative closure only: no cash or completion award. New authorisations have a 30-day cooldown. "
 FAT_fsb_succession_review:0 "No Automatic Successor"
 FAT_fsb_succession_review_desc:0 "Unlock a succession review that closes outstanding warrants before a new domestic mandate.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. This authorisation is once only; interruption does not refund its costs. "
