 AUR_sw_exile_service_1_spirit:0 "Run the Exile Ministries"
 AUR_sw_exile_service_1_spirit_desc:0 "The cabinet office maintains this funded service for ninety days. Staff and fund the ministries operating in exile for one period. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 AUR_sw_exile_service_1:0 "Run the Exile Ministries"
 AUR_sw_exile_service_1_desc:0 "Staff and fund the ministries operating in exile for one period.\n\nThe cabinet office must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 AUR_sw_exile_service_2_spirit:0 "Pay the Displaced Service"
 AUR_sw_exile_service_2_spirit_desc:0 "The treasury maintains this funded service for ninety days. Pay the salaries and pensions of displaced civil servants. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 AUR_sw_exile_service_2:0 "Pay the Displaced Service"
 AUR_sw_exile_service_2_desc:0 "Pay the salaries and pensions of displaced civil servants.\n\nThe treasury must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 AUR_sw_resistance_service_1_spirit:0 "Supply the Resistance"
 AUR_sw_resistance_service_1_spirit_desc:0 "The interior ministry maintains this funded service for ninety days. Smuggle money and equipment to the resistance for one period. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
