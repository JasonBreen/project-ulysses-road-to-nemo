 ac_snp.1.t:0 "The Register Has Three Spaces"
 ac_snp.1.d:0 "The federal receiving clerk has drawn three spaces across the new schedule. A committee member asks why the form is so small when the country has many services. The clerk answers that a limited register must be capable of refusing a promise. A civil administrator wants the first hearing to let ordinary receiving offices challenge the reservations made in their names. The defence representative asks that staff first have a protected channel for explaining uncertain estimates. Neither proposal supplies another trained team. Both can make the register more credible, while giving a different audience the first claim on its attention. The clerk places the blank schedule between them and waits for an instruction that can be entered without writing the same space twice."
 ac_snp.1.a:0 "Begin with a civil receiving-office hearing."
 ac_snp.1.a_effect_tt:0 "Civil support +4, readiness support -2. Both observations remain within zero to one hundred."
 ac_snp.1.b:0 "Begin with a protected readiness return."
 ac_snp.1.b_effect_tt:0 "Readiness support +4, civil support -2. Both observations remain within zero to one hundred."
 ac_snp.2.t:0 "The Two Columns Must Still Add Up"
 ac_snp.2.d:0 "The allocation secretary draws a line beneath the civil and command columns. Their total is one hundred, although each receiving office has brought requests that would use more. A district administrator asks for greater discretion to release ordinary services. The command representative wants a protected support share so a national undertaking has a responsible office behind it. Neither can satisfy every request by changing the label on the columns. The first hearing will establish who may question an allocation before it becomes a promise to another service. The secretary asks both representatives to leave the unaccepted requests on the table. A useful docket must record what was displaced as well as what the government chose to receive."
 ac_snp.2.a:0 "Give the first discretion to civil receiving offices."
 ac_snp.2.a_effect_tt:0 "Move up to five existing allocation points toward civil receiving offices, protecting active reservations. The two shares still total one hundred."
 ac_snp.2.b:0 "Protect the first command-support reservation."
 ac_snp.2.b_effect_tt:0 "Move up to five existing allocation points toward command support, protecting active reservations. The two shares still total one hundred."
 OSE_snp_appropriations_policy_context_1:0 "The standing policy is civilian service floor. Its continuing opportunity cost remains in the national schedule."
 OSE_snp_appropriations_policy_context_2:0 "The standing policy is protected defence appropriation. Its continuing opportunity cost remains in the national schedule."
 ac_snp.10.t:0 "The Third Copy"
 ac_snp.10.d:0 "The receiving clerk lays three copies of the same staff reservation across the committee table. Each bears a different departmental seal. The chair asks which copy should become the public record; the clerk answers that choosing a copy will not release a single worker. A civil-service representative proposes a hearing at which the receiving offices can challenge the reservation. The defence representative asks for a protected session first, so junior staff can explain how the duplicate promises were made without answering for their superiors in public. Both want a usable register. They disagree about which protection must come first, and the clerk waits with all three copies still open.\n\n[OSE_snp_appropriations_policy_context]"
 ac_snp.10.a:0 "Let the receiving offices challenge the public schedule."
 ac_snp.10.a_effect_tt:0 "Civil support +4, readiness support -2. Both observations remain within zero to one hundred."
 ac_snp.10.b:0 "Protect the first staff testimony and publish the limits."
 ac_snp.10.b_effect_tt:0 "Readiness support +4, civil support -2. Both observations remain within zero to one hundred."
 OSE_snp_appropriations_response_context_civil:0 "The earlier reply gave the civil receiving offices the first route for a challenge. The assessment retains that decision and the responsibilities it reserved."
 OSE_snp_appropriations_response_context_protected:0 "The earlier reply protected the first professional or command return. The assessment preserves the uncertainty and identifies the office responsible for answering it."
 OSE_snp_appropriations_response_context_unanswered:0 "No first reply was ratified. The chair reads that absence into the final record before turning to the service period and its receiving office."
 OSE_snp_appropriations_period_context_domestic:0 "The latest qualifying period was funded as reduced domestic continuity during war. Records, training liaison and maintenance administration continued while other staff answered urgent national needs."
 OSE_snp_appropriations_period_context_ordinary:0 "The latest qualifying period completed its ordinary national receiving work. The assessment retains its costs and identifies the office expected to answer when another funded period is requested."
 ac_snp.40.t:0 "A Reservation with an Answer"
 ac_snp.40.d:0 "The clerk returns with the same three copies, now attached to a completed receiving period. The committee can trace the service actually performed and the work displaced by it. One of the original departments has asked that its superseded reservation be removed. The chair leaves it in the file. A later reader needs to understand why the office declined a promise as well as why it accepted another. The standing appropriation preserves the selected priority and its continuing burden. It gives the next government a responsible receiving office, rather than permission to count the same staff three times.\n\n[OSE_snp_appropriations_response_context]\n[OSE_snp_appropriations_period_context]\n[OSE_snp_appropriations_policy_context]"
 ac_snp.40.a:0 "File the assessment with its unresolved questions."
 ac_snp.40.a_effect_tt:0 "Retain the completed national service record and its prior choices. This acknowledgement authorizes no additional funded period."
 OSE_snp_productive_capacity_policy_context_1:0 "The standing policy is civil apprenticeship reserve. Its continuing opportunity cost remains in the national schedule."
 OSE_snp_productive_capacity_policy_context_2:0 "The standing policy is defence tooling guarantee. Its continuing opportunity cost remains in the national schedule."
 ac_snp.11.t:0 "The Apprentice at the Back of the Room"
 ac_snp.11.d:0 "An apprentice has attended the whole workshop meeting without speaking. When the superintendent begins to close the docket, she asks whether the training release listed beside her name is still real. A repair deadline has already used the reserved hours. The production representative offers an internal arrangement: a senior worker will cover the lessons after the shift. The training secretary asks that the release itself be restored and the delayed productive work recorded openly. Neither proposal gives the workshop an extra person. The apprentice wants the qualification and knows that the worker offering to teach her is already staying late. The board must decide whose promise it will protect.\n\n[OSE_snp_productive_capacity_policy_context]"
 ac_snp.11.a:0 "Protect the scheduled training release and record the delay."
 ac_snp.11.a_effect_tt:0 "Civil support +4, readiness support -2. Both observations remain within zero to one hundred."
 ac_snp.11.b:0 "Accept supervised instruction within a protected workshop rota."
 ac_snp.11.b_effect_tt:0 "Readiness support +4, civil support -2. Both observations remain within zero to one hundred."
 OSE_snp_productive_capacity_response_context_civil:0 "The earlier reply gave the civil receiving offices the first route for a challenge. The assessment retains that decision and the responsibilities it reserved."
