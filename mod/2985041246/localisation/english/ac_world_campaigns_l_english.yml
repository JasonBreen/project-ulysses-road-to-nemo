 CSO_wc_adopt:0 "Open the National Campaign"
 CSO_wc_adopt_desc:0 "Adopt the dedicated national campaign from an idle generic or regional tree. Completed focuses remain recorded. No starting forces, industry, fiscal account or old historical rewards are reseeded."
