 OSE_snc_pacific_channel_protocol:0 "Test the Receiving Procedure"
 OSE_snc_pacific_channel_protocol_desc:0 "Request a fresh civil-space period to test how an inquiry reaches the person able to answer it. Begin with domestic material, so a foreign refusal cannot make the review impossible. The selected civil or protected lane must deliver its actual funded work after this request. Where an established joint record is relevant, mark the part it contributed without claiming that a completed debris programme is a new operational capability. The final receiving return should show who could answer, which authority they used, and what happened when a question remained outside that authority."
