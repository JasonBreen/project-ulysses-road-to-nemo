 SNS_up_protection_accounts_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together."
 SNS_up_settlement_instructions:0 "Read the Actual Settlement"
 SNS_up_settlement_instructions_desc:0 "National instructions must follow the settlement that actually exists. The service will not assume victory, liberation or continued independence merely because the calendar has advanced."
