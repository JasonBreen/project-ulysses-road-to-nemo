 ac_camp.9.t:0 "The space outside the map"
 ac_camp.9.desc:0 "The intelligence section had annotated the district map so thoroughly that the liaison borrowed a clean copy. On it, the clinic was merely a building. The road had no colored arrows. For a moment the absence of military significance looked like a form of peace.\n\nThe latest message contained a stock return and a request that nobody include the driver's name in the next circulation. The liaison could not tell which part of the arrangement had frightened him. A checkpoint, a letter, a conversation with a neighbor: the command received effects more readily than causes.\n\nA staff officer asked whether the route could support anything larger. The question was reasonable. That made refusing to answer it require a better reason than discomfort. The liaison explained what had been offered and what had not. He heard himself becoming precise in the way people become precise when they are trying to preserve a promise that others consider inconvenient.\n\nThe officer nodded and asked for the information to be marked accordingly. A note would not protect a convoy by itself. It would, however, oblige the next person to know that a boundary existed before deciding to cross it.\n\nThe liaison placed the clean map inside the medical file. There was no new military target to report. There were people expecting a particular vehicle to remain a particular kind of vehicle. Keeping that expectation intact had become work for a command fighting a war it could not afford to lose."
