 NEC_nc_harbours_service_1_spirit:0 "Fund a Harbour Survey Season"
 NEC_nc_harbours_service_1_spirit_desc:0 "The northern harbour board maintains this funded service for ninety days. Survey quays, cranes and channels before the next season's commitments are made. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 NEC_nc_harbours_service_1:0 "Fund a Harbour Survey Season"
 NEC_nc_harbours_service_1_desc:0 "Survey quays, cranes and channels before the next season's commitments are made.\n\nThe northern harbour board must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 NEC_nc_harbours_service_2_spirit:0 "Run a Reserve Mooring Rota"
 NEC_nc_harbours_service_2_spirit_desc:0 "The maritime reserve staff maintains this funded service for ninety days. Rotate reserve vessels through maintenance berths without displacing scheduled freight. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
