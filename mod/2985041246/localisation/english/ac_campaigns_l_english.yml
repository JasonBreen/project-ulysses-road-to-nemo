 ac_camp.81.t:0 "The witness who needed a door"
 ac_camp.81.desc:0 "The witness asked which entrance he should use when he returned. The investigator had expected a question about protection, and realized that this was one. A man could be promised confidentiality in a room whose only door opened onto an office where everybody knew his face.\n\nThe independent investigation had completed its work. Its evidence could corroborate the foreign inquiry without requiring either foreign government to accept an unsupported assurance from Belka. That was why the witness mattered, and why keeping him alive and reachable had become a political choice rather than an administrative detail.\n\nHe had brought a procurement copy with the receiving marks still visible. No single line explained the network. The connections between the marks did. An order had been made convenient, an objection had been redirected, and a request had acquired the appearance of authority as it moved.\n\nThe investigator explained where the testimony would go and what could not be promised. The witness listened more closely to the limits than to the assurances. He had spent years hearing assurances offered by people who retained the power to forget them.\n\nBeyond the window, staff were leaving for the evening. The ordinary traffic of the institution made the investigation's protection look fragile. It depended on people continuing to make inconvenient decisions after the immediate argument had ended.\n\nThe investigator walked the witness to a different entrance. Tomorrow there would still be questions about the file. At least one answer could be supplied before the man had to ask again."
 ac_camp.81.a:0 "Keep this account."
 ac_camp.81.z:0 "Close this old message."
