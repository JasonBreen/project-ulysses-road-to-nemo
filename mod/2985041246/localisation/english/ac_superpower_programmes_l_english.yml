 OSE_snp_appropriations_review:0 "Audit an Appropriation Period"
 OSE_snp_appropriations_review_desc:0 "The first federal return contains three promises against the same staff rota. The public-service officer asks which promise should be withdrawn; the defence representative asks why an untested estimate has already become a public commitment. Neither can answer without the receiving offices. A useful appropriation must identify what can actually be sustained, who may change it and which service bears the delay. The federal register will preserve that disagreement instead of resolving it with another uncosted declaration.\n\nCompare an actually completed receiving period with the original promise. Unfunded intentions and cancelled work cannot stand in for the missing return."
 OSE_snp_appropriations_review_effect_tt:0 "Record the branch’s genuinely completed service period as the basis for a standing settlement."
 OSE_snp_appropriations_settlement:0 "A Federal Promise That Can Be Kept"
 OSE_snp_appropriations_settlement_desc:0 "The first federal return contains three promises against the same staff rota. The public-service officer asks which promise should be withdrawn; the defence representative asks why an untested estimate has already become a public commitment. Neither can answer without the receiving offices. A useful appropriation must identify what can actually be sustained, who may change it and which service bears the delay. The federal register will preserve that disagreement instead of resolving it with another uncosted declaration.\n\nRetain the chosen allocation and its cost in a standing appropriation. Future governments inherit both the promise and the office responsible for correcting it."
 OSE_snp_appropriations_settlement_effect_tt:0 "Improve the selected policy’s benefit by twenty percent while retaining its same continuing cost."
 OSE_snp_productive_capacity_civil_policy_spirit:0 "Civil apprenticeship reserve"
 OSE_snp_productive_capacity_civil_policy_spirit_desc:0 "A plant superintendent brings a list of idle shifts, followed by a shorter list of qualified people. The procurement officer has already counted both as available capacity. Across the table, a technical college asks which apprentices will be released for examinations. The discussion concerns time, trained labour and dependable orders. Whatever the board chooses will reach the workshop floor, where somebody must turn the order into goods and explain which other work had to wait.\n\nProtect a civilian apprenticeship rota. Better workshop continuity is earned by diverting staff from the shortest route to defence readiness."
 OSE_snp_productive_capacity_civil_policy_spirit_settled:0 "Civil apprenticeship reserve: Standing Settlement"
 OSE_snp_productive_capacity_civil_policy_spirit_settled_desc:0 "A plant superintendent brings a list of idle shifts, followed by a shorter list of qualified people. The procurement officer has already counted both as available capacity. Across the table, a technical college asks which apprentices will be released for examinations. The discussion concerns time, trained labour and dependable orders. Whatever the board chooses will reach the workshop floor, where somebody must turn the order into goods and explain which other work had to wait.\n\nKeep the chosen training and order policy in ordinary practice. The final compact improves continuity while preserving the burden accepted earlier. The chosen continuing cost remains."
 OSE_snp_productive_capacity_protected_policy_spirit:0 "Defence tooling guarantee"
 OSE_snp_productive_capacity_protected_policy_spirit_desc:0 "A plant superintendent brings a list of idle shifts, followed by a shorter list of qualified people. The procurement officer has already counted both as available capacity. Across the table, a technical college asks which apprentices will be released for examinations. The discussion concerns time, trained labour and dependable orders. Whatever the board chooses will reach the workshop floor, where somebody must turn the order into goods and explain which other work had to wait.\n\nGive defence workshops predictable technical orders. The improvement carries a civilian opportunity cost, and the receiving office must still wait for the manufacturing line to deliver."
