 NEC_nc_neutral_waters_service_1_spirit:0 "Fund a Port Control Period"
 NEC_nc_neutral_waters_service_1_spirit_desc:0 "The ports and customs authority maintains this funded service for ninety days. Inspect requests for passage, fuel and repairs under the published neutrality rules. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 NEC_nc_neutral_waters_service_1:0 "Fund a Port Control Period"
 NEC_nc_neutral_waters_service_1_desc:0 "Inspect requests for passage, fuel and repairs under the published neutrality rules.\n\nThe ports and customs authority must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 NEC_nc_neutral_waters_service_2_spirit:0 "Run a Neutrality Patrol"
 NEC_nc_neutral_waters_service_2_spirit_desc:0 "The maritime reserve staff maintains this funded service for ninety days. Patrol territorial waters to observe and report, without engaging foreign vessels. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 NEC_nc_neutral_waters_service_2:0 "Run a Neutrality Patrol"
 NEC_nc_neutral_waters_service_2_desc:0 "Patrol territorial waters to observe and report, without engaging foreign vessels.\n\nThe maritime reserve staff must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 NEC_nc_account_service_1_spirit:0 "Fund an Independent Audit"
 NEC_nc_account_service_1_spirit_desc:0 "The national audit office maintains this funded service for ninety days. Commission auditors to examine reserve accounts and readiness returns. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 NEC_nc_account_service_1:0 "Fund an Independent Audit"
 NEC_nc_account_service_1_desc:0 "Commission auditors to examine reserve accounts and readiness returns.\n\nThe national audit office must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 NEC_nc_account_service_2_spirit:0 "Run a Readiness Inspection"
 NEC_nc_account_service_2_spirit_desc:0 "The reserve inspectorate maintains this funded service for ninety days. Inspect reserve vessels, harbours and specialists against the published account. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 NEC_nc_account_service_2:0 "Run a Readiness Inspection"
 NEC_nc_account_service_2_desc:0 "Inspect reserve vessels, harbours and specialists against the published account.\n\nThe reserve inspectorate must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 NEC_nc_harbours_policy_a_spirit:0 "Commercial berth priority"
 NEC_nc_harbours_policy_a_spirit_desc:0 "Commercial berths will have priority at the busiest harbours. Trade and fishing gain predictable access, and the reserve accepts longer notice whenever it needs a quay for exercises or repairs."
 NEC_nc_harbours_policy_a_spirit_settled:0 "Commercial berth priority: Standing Settlement"
 NEC_nc_harbours_policy_a_spirit_settled_desc:0 "The settlement keeps the chosen priority and a maintenance calendar that respects the weather. Harbours remain limited by their quays and crews; the difference is that every promise is now made against a real season. The continuing opportunity cost remains."
 NEC_nc_harbours_policy_b_spirit:0 "Reserved fleet anchorages"
 NEC_nc_harbours_policy_b_spirit_desc:0 "Selected anchorages will be held for the maritime reserve throughout the year. The reserve can assemble quickly, while freight and fishing pay the price in crowded remaining berths."
 NEC_nc_harbours_policy_b_spirit_settled:0 "Reserved fleet anchorages: Standing Settlement"
 NEC_nc_harbours_policy_b_spirit_settled_desc:0 "The settlement keeps the chosen priority and a maintenance calendar that respects the weather. Harbours remain limited by their quays and crews; the difference is that every promise is now made against a real season. The continuing opportunity cost remains."
 NEC_nc_harbours_register:0 "A Register of Northern Harbours"
 NEC_nc_harbours_register_desc:0 "Nordennavic's harbours serve fishing fleets, coastal freight and the maritime reserve, often from the same quays. The harbour board will record every berth, crane and repair crew, and which service has first claim on each."
 NEC_nc_harbours_policy_a:0 "Open Commercial Berths"
 NEC_nc_harbours_policy_a_desc:0 "Commercial berths will have priority at the busiest harbours. Trade and fishing gain predictable access, and the reserve accepts longer notice whenever it needs a quay for exercises or repairs."
 NEC_nc_harbours_policy_b:0 "Reserve Fleet Anchorages"
 NEC_nc_harbours_policy_b_desc:0 "Selected anchorages will be held for the maritime reserve throughout the year. The reserve can assemble quickly, while freight and fishing pay the price in crowded remaining berths."
 NEC_nc_harbours_operations:0 "Winter Repairs Before Summer Promises"
 NEC_nc_harbours_operations_desc:0 "Ice, storms and short daylight decide what a northern harbour can do. Maintenance crews will finish winter repairs before the board promises summer capacity to anyone."
 NEC_nc_harbours_review:0 "Review a Harbour Season"
 NEC_nc_harbours_review_desc:0 "The board will review one funded harbour season that actually finished. A plan that worked on paper but failed in the first storm cannot become national practice."
 NEC_nc_harbours_settlement:0 "Harbours Ready in Every Season"
 NEC_nc_harbours_settlement_desc:0 "The settlement keeps the chosen priority and a maintenance calendar that respects the weather. Harbours remain limited by their quays and crews; the difference is that every promise is now made against a real season."
 NEC_nc_reserve_policy_a_spirit:0 "Civil crews in reserve"
 NEC_nc_reserve_policy_a_spirit_desc:0 "Reserve crews will keep civilian jobs on fishing boats, ferries and freighters and train in short, regular periods. The country keeps their skills at sea, and accepts a slower call-up."
 NEC_nc_reserve_policy_a_spirit_settled:0 "Civil crews in reserve: Standing Settlement"
 NEC_nc_reserve_policy_a_spirit_settled_desc:0 "The settlement fixes the reserve's size, readiness and cost at a level the country can sustain. It creates no new ships. It gives the government a reserve whose numbers can be trusted. The continuing opportunity cost remains."
 NEC_nc_reserve_policy_b_spirit:0 "Standing reserve squadrons"
 NEC_nc_reserve_policy_b_spirit_desc:0 "A small number of reserve squadrons will be kept crewed and ready throughout the year. They can respond quickly, and the crews they keep from civilian work are a cost the coastal economy feels."
 NEC_nc_reserve_policy_b_spirit_settled:0 "Standing reserve squadrons: Standing Settlement"
 NEC_nc_reserve_policy_b_spirit_settled_desc:0 "The settlement fixes the reserve's size, readiness and cost at a level the country can sustain. It creates no new ships. It gives the government a reserve whose numbers can be trusted. The continuing opportunity cost remains."
 NEC_nc_reserve_register:0 "Keep the Maritime Reserve Honest"
 NEC_nc_reserve_register_desc:0 "The maritime reserve exists partly on paper: crews listed against vessels that are laid up, sold or crewed by the same people twice. The reserve staff will count the sailors and hulls that could actually sail."
 NEC_nc_reserve_policy_a:0 "Civil Crews in Reserve"
 NEC_nc_reserve_policy_a_desc:0 "Reserve crews will keep civilian jobs on fishing boats, ferries and freighters and train in short, regular periods. The country keeps their skills at sea, and accepts a slower call-up."
 NEC_nc_reserve_policy_b:0 "Standing Reserve Squadrons"
 NEC_nc_reserve_policy_b_desc:0 "A small number of reserve squadrons will be kept crewed and ready throughout the year. They can respond quickly, and the crews they keep from civilian work are a cost the coastal economy feels."
 NEC_nc_reserve_operations:0 "Train with the Ships We Have"
 NEC_nc_reserve_operations_desc:0 "Training will use the vessels Nordennavic actually has, not the ones in old plans. No exercise will assume a hull that has not been inspected or a crew that has not been called."
 NEC_nc_reserve_review:0 "Review a Reserve Training Period"
 NEC_nc_reserve_review_desc:0 "The staff will review a completed, funded training period before its methods replace the old reserve rules. Attendance, inspected vessels and lessons recorded matter more than the size of the list."
 NEC_nc_reserve_settlement:0 "A Reserve That Answers When Called"
 NEC_nc_reserve_settlement_desc:0 "The settlement fixes the reserve's size, readiness and cost at a level the country can sustain. It creates no new ships. It gives the government a reserve whose numbers can be trusted."
 NEC_nc_consultation_policy_a_spirit:0 "Open technical consultation"
 NEC_nc_consultation_policy_a_spirit_desc:0 "Engineers, harbour officials and scientists may consult foreign counterparts on technical matters without a ministerial mandate for each meeting. Expertise travels more easily, and the ministry has less control over what is said."
 NEC_nc_consultation_policy_a_spirit_settled:0 "Open technical consultation: Standing Settlement"
 NEC_nc_consultation_policy_a_spirit_settled_desc:0 "The settlement keeps the chosen scope of consultation and the costs that come with it. It joins no alliance and accepts no other government's authority. Nordennavic decides, case by case, what to discuss. The continuing opportunity cost remains."
 NEC_nc_consultation_policy_b_spirit:0 "Narrow diplomatic mandate"
 NEC_nc_consultation_policy_b_spirit_desc:0 "Only the foreign ministry will speak for Nordennavic, on subjects the cabinet has approved in advance. The country's commitments stay clear and limited, and many useful technical contacts are slower to arrange."
 NEC_nc_consultation_policy_b_spirit_settled:0 "Narrow diplomatic mandate: Standing Settlement"
 NEC_nc_consultation_policy_b_spirit_settled_desc:0 "The settlement keeps the chosen scope of consultation and the costs that come with it. It joins no alliance and accepts no other government's authority. Nordennavic decides, case by case, what to discuss. The continuing opportunity cost remains."
 NEC_nc_consultation_register:0 "Decide What We Will Discuss"
 NEC_nc_consultation_register_desc:0 "Neighbouring governments and regional bodies send invitations to talks, studies and exercises. The foreign ministry will record which subjects Nordennavic is willing to discuss, who may speak for it and what it will not commit to."
 NEC_nc_consultation_policy_a:0 "Open Technical Consultation"
 NEC_nc_consultation_policy_a_desc:0 "Engineers, harbour officials and scientists may consult foreign counterparts on technical matters without a ministerial mandate for each meeting. Expertise travels more easily, and the ministry has less control over what is said."
 NEC_nc_consultation_policy_b:0 "A Narrow Diplomatic Mandate"
 NEC_nc_consultation_policy_b_desc:0 "Only the foreign ministry will speak for Nordennavic, on subjects the cabinet has approved in advance. The country's commitments stay clear and limited, and many useful technical contacts are slower to arrange."
 NEC_nc_consultation_operations:0 "Answer Invitations Without Overpromising"
 NEC_nc_consultation_operations_desc:0 "Every invitation will receive an answer that states what Nordennavic can offer and what it cannot. A clear refusal is better than an acceptance that later has to be withdrawn."
 NEC_nc_consultation_review:0 "Review the Consultation Record"
 NEC_nc_consultation_review_desc:0 "The ministry will review a completed, funded consultation period before its rules become permanent. The review asks which contacts produced useful work and which only produced obligations."
 NEC_nc_consultation_settlement:0 "Consultation on Our Own Terms"
 NEC_nc_consultation_settlement_desc:0 "The settlement keeps the chosen scope of consultation and the costs that come with it. It joins no alliance and accepts no other government's authority. Nordennavic decides, case by case, what to discuss."
 NEC_nc_technical_reserve_policy_a_spirit:0 "Civil engineering reserve"
 NEC_nc_technical_reserve_policy_a_spirit_desc:0 "The technical reserve will be organised around civil emergencies: power, water, harbours and communications. Its members train for the disasters a northern country expects, and defence work receives less priority."
 NEC_nc_technical_reserve_policy_a_spirit_settled:0 "Civil engineering reserve: Standing Settlement"
 NEC_nc_technical_reserve_policy_a_spirit_settled_desc:0 "The settlement fixes the technical reserve's purpose, size and cost. It conscripts no one. It gives Nordennavic a list of skilled people it can actually call, and the obligation to treat them fairly. The continuing opportunity cost remains."
 NEC_nc_technical_reserve_policy_b_spirit:0 "Defence technical reserve"
 NEC_nc_technical_reserve_policy_b_spirit_desc:0 "The technical reserve will support the armed forces' maintenance and communications first. Defence gains depth, and civil authorities must plan for emergencies with fewer reserve specialists."
 NEC_nc_technical_reserve_policy_b_spirit_settled:0 "Defence technical reserve: Standing Settlement"
 NEC_nc_technical_reserve_policy_b_spirit_settled_desc:0 "The settlement fixes the technical reserve's purpose, size and cost. It conscripts no one. It gives Nordennavic a list of skilled people it can actually call, and the obligation to treat them fairly. The continuing opportunity cost remains."
 NEC_nc_technical_reserve_register:0 "A National Technical Reserve"
 NEC_nc_technical_reserve_register_desc:0 "Engineers, electricians and technicians who left public service still hold skills the country may need in a storm, a disaster or a crisis. The government will record who is willing to be called, for what work and on what terms."
 NEC_nc_technical_reserve_policy_a:0 "A Civil Engineering Reserve"
 NEC_nc_technical_reserve_policy_a_desc:0 "The technical reserve will be organised around civil emergencies: power, water, harbours and communications. Its members train for the disasters a northern country expects, and defence work receives less priority."
 NEC_nc_technical_reserve_policy_b:0 "A Defence Technical Reserve"
 NEC_nc_technical_reserve_policy_b_desc:0 "The technical reserve will support the armed forces' maintenance and communications first. Defence gains depth, and civil authorities must plan for emergencies with fewer reserve specialists."
 NEC_nc_technical_reserve_operations:0 "Keep the Skills Current"
 NEC_nc_technical_reserve_operations_desc:0 "A reserve register is only useful if its members can still do the work. Short refresher periods will keep skills current and remove names that no longer match a real person and skill."
 NEC_nc_technical_reserve_review:0 "Review a Reserve Call-Up"
 NEC_nc_technical_reserve_review_desc:0 "The government will review a completed, funded call-up before the reserve's rules become permanent. The review asks who answered, what they could do and how long it took."
 NEC_nc_technical_reserve_settlement:0 "Expertise the Country Can Call On"
 NEC_nc_technical_reserve_settlement_desc:0 "The settlement fixes the technical reserve's purpose, size and cost. It conscripts no one. It gives Nordennavic a list of skilled people it can actually call, and the obligation to treat them fairly."
 NEC_nc_northern_routes_policy_a_spirit:0 "Protected fishing and freight lanes"
 NEC_nc_northern_routes_policy_a_spirit_desc:0 "Fishing and freight lanes will receive protected status, weather services and priority for rescue resources. Coastal communities gain security for their livelihoods, and the reserve has fewer ships for other tasks."
 NEC_nc_northern_routes_policy_a_spirit_settled:0 "Protected fishing and freight lanes: Standing Settlement"
 NEC_nc_northern_routes_policy_a_spirit_settled_desc:0 "The settlement keeps the chosen protection for the northern routes and a rescue service built into every patrol. It claims no new waters and changes no border. The continuing opportunity cost remains."
 NEC_nc_northern_routes_policy_b_spirit:0 "Patrolled approaches"
 NEC_nc_northern_routes_policy_b_spirit_desc:0 "The approaches to Nordennavic's harbours will be patrolled regularly by reserve vessels. Visible patrols deter trouble and reassure the public, at a steady cost in fuel and crews."
 NEC_nc_northern_routes_policy_b_spirit_settled:0 "Patrolled approaches: Standing Settlement"
 NEC_nc_northern_routes_policy_b_spirit_settled_desc:0 "The settlement keeps the chosen protection for the northern routes and a rescue service built into every patrol. It claims no new waters and changes no border. The continuing opportunity cost remains."
 NEC_nc_northern_routes_register:0 "Northern Shipping Routes"
 NEC_nc_northern_routes_register_desc:0 "Fishing grounds, coastal freight lanes and the approaches to the harbours share the same cold waters. The maritime authority will chart which routes matter most, in which seasons, and who answers when a vessel is in trouble."
 NEC_nc_northern_routes_policy_a:0 "Protected Fishing and Freight Lanes"
 NEC_nc_northern_routes_policy_a_desc:0 "Fishing and freight lanes will receive protected status, weather services and priority for rescue resources. Coastal communities gain security for their livelihoods, and the reserve has fewer ships for other tasks."
 NEC_nc_northern_routes_policy_b:0 "Patrolled Approaches"
 NEC_nc_northern_routes_policy_b_desc:0 "The approaches to Nordennavic's harbours will be patrolled regularly by reserve vessels. Visible patrols deter trouble and reassure the public, at a steady cost in fuel and crews."
 NEC_nc_northern_routes_operations:0 "Rescue Before Patrol Schedules"
 NEC_nc_northern_routes_operations_desc:0 "Every patrol will also be a rescue service. A crew that passes a vessel in distress to complete its patrol schedule has failed at the more important task."
 NEC_nc_northern_routes_review:0 "Review a Season at Sea"
 NEC_nc_northern_routes_review_desc:0 "The authority will review one funded season at sea that actually finished, counting rescues, inspections and routes kept open rather than miles patrolled."
 NEC_nc_northern_routes_settlement:0 "Routes Kept Open"
 NEC_nc_northern_routes_settlement_desc:0 "The settlement keeps the chosen protection for the northern routes and a rescue service built into every patrol. It claims no new waters and changes no border."
 NEC_nc_neutral_waters_policy_a_spirit:0 "Humanitarian transit only"
 NEC_nc_neutral_waters_policy_a_spirit_desc:0 "Only humanitarian transit and civilian trade will be permitted through Nordennavic's waters and ports during a neighbour's conflict. The rule is simple to explain and to verify, and it leaves the country with little leverage."
 NEC_nc_neutral_waters_policy_a_spirit_settled:0 "Humanitarian transit only: Standing Settlement"
 NEC_nc_neutral_waters_policy_a_spirit_settled_desc:0 "The settlement fixes the terms of Nordennavic's neutrality and the costs of maintaining it. It takes no side in any conflict, joins no faction and makes no claim on a neighbour. The continuing opportunity cost remains."
 NEC_nc_neutral_waters_policy_b_spirit:0 "Armed neutral patrols"
 NEC_nc_neutral_waters_policy_b_spirit_desc:0 "Neutral patrols will make sure no side uses Nordennavic's waters or ports for its own purposes. Armed neutrality is credible and expensive, and it needs ships at sea when others would prefer they were not."
 NEC_nc_neutral_waters_policy_b_spirit_settled:0 "Armed neutral patrols: Standing Settlement"
 NEC_nc_neutral_waters_policy_b_spirit_settled_desc:0 "The settlement fixes the terms of Nordennavic's neutrality and the costs of maintaining it. It takes no side in any conflict, joins no faction and makes no claim on a neighbour. The continuing opportunity cost remains."
 NEC_nc_neutral_waters_register:0 "Neutral Waters in a Troubled Region"
 NEC_nc_neutral_waters_register_desc:0 "Relations among Nordennavic's neighbours are tense, and nobody can promise that a crisis beyond its waters will stay there. The government will decide in advance what passage, supplies and services it would permit if one came."
 NEC_nc_neutral_waters_policy_a:0 "Humanitarian Transit Only"
 NEC_nc_neutral_waters_policy_a_desc:0 "Only humanitarian transit and civilian trade will be permitted through Nordennavic's waters and ports during a neighbour's conflict. The rule is simple to explain and to verify, and it leaves the country with little leverage."
 NEC_nc_neutral_waters_policy_b:0 "Armed Neutral Patrols"
 NEC_nc_neutral_waters_policy_b_desc:0 "Neutral patrols will make sure no side uses Nordennavic's waters or ports for its own purposes. Armed neutrality is credible and expensive, and it needs ships at sea when others would prefer they were not."
 NEC_nc_neutral_waters_operations:0 "Say No Before Being Asked"
 NEC_nc_neutral_waters_operations_desc:0 "Requests for passage, fuel and repairs will be answered according to published rules, before a crisis makes every answer political. A refusal announced early is easier to defend than one improvised under pressure."
 NEC_nc_neutral_waters_review:0 "Review a Neutrality Period"
 NEC_nc_neutral_waters_review_desc:0 "The government will review a completed, funded neutrality period before its rules are fixed. The review asks whether the rules were understood, applied consistently and respected."
 NEC_nc_neutral_waters_settlement:0 "A Neutrality Others Can Rely On"
 NEC_nc_neutral_waters_settlement_desc:0 "The settlement fixes the terms of Nordennavic's neutrality and the costs of maintaining it. It takes no side in any conflict, joins no faction and makes no claim on a neighbour."
 NEC_nc_account_policy_a_spirit:0 "Civil audit"
 NEC_nc_account_policy_a_spirit_desc:0 "Independent auditors will examine the reserves' accounts and readiness, and their reports will be public. Confidence rises, and so does the political cost of every shortfall the audit finds."
 NEC_nc_account_policy_a_spirit_settled:0 "Civil audit: Standing Settlement"
 NEC_nc_account_policy_a_spirit_settled_desc:0 "The settlement fixes how the reserves are accounted for and reviewed. It keeps the chosen balance between openness and protection, and the obligation to explain the reserves to the people who pay for them. The continuing opportunity cost remains."
 NEC_nc_account_policy_b_spirit:0 "Protected reserve ledger"
 NEC_nc_account_policy_b_spirit_desc:0 "Readiness details will stay in a protected ledger shared only with the relevant parliamentary committee. Sensitive information stays protected, at the price of public suspicion about what is being kept back."
 NEC_nc_account_policy_b_spirit_settled:0 "Protected reserve ledger: Standing Settlement"
 NEC_nc_account_policy_b_spirit_settled_desc:0 "The settlement fixes how the reserves are accounted for and reviewed. It keeps the chosen balance between openness and protection, and the obligation to explain the reserves to the people who pay for them. The continuing opportunity cost remains."
 NEC_nc_account_register:0 "The Reserve's Public Account"
 NEC_nc_account_register_desc:0 "The maritime and technical reserves have grown out of decisions made over many years. The government will publish what they cost, what they have delivered and what they are for, so that parliament decides the next budget with a full account."
 NEC_nc_account_policy_a:0 "A Civil Audit"
 NEC_nc_account_policy_a_desc:0 "Independent auditors will examine the reserves' accounts and readiness, and their reports will be public. Confidence rises, and so does the political cost of every shortfall the audit finds."
 NEC_nc_account_policy_b:0 "A Protected Reserve Ledger"
 NEC_nc_account_policy_b_desc:0 "Readiness details will stay in a protected ledger shared only with the relevant parliamentary committee. Sensitive information stays protected, at the price of public suspicion about what is being kept back."
 NEC_nc_account_operations:0 "Count What the Reserve Costs"
 NEC_nc_account_operations_desc:0 "Every vessel, specialist and harbour reservation will be costed, including the civilian work it displaces. A reserve that looks cheap because its costs are hidden is not cheap."
 NEC_nc_account_review:0 "Review the Long Service Record"
 NEC_nc_account_review_desc:0 "The government will review a completed, funded audit or readiness period before the account becomes the standard for future budgets."
 NEC_nc_account_settlement:0 "A Reserve the Public Understands"
 NEC_nc_account_settlement_desc:0 "The settlement fixes how the reserves are accounted for and reviewed. It keeps the chosen balance between openness and protection, and the obligation to explain the reserves to the people who pay for them."
