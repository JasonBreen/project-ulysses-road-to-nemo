 ac_wc_soa.10.t:0 "Seats in the Training Flight"
 ac_wc_soa.11.d:0 "The air staff counts aircraft that cannot fly until a small component arrives. Vey wants interchangeable parts; Halvek wants repair authority at the airfield. Sellen asks who can reject an unsafe aircraft.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
 ac_wc_soa.11.defer:0 "Return the proposal to the staff"
 ac_wc_soa.11.p0:0 "Independent Airworthiness Staff"
