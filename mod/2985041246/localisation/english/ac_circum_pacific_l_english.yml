 ac_cpw_outcome_yuktobanian_victory:0 "Osea capitulated"
 ac_cpw_pre_existing_war:0 "A principal was already at war when the declaration came"
 ac_cpw_existing_war_observed:0 "Osea and Yuktobania were already at war when the Chronicle's declaration date came"
 ac_cpw_late_start_skipped:0 "The Chronicle's declaration date had passed before this content first loaded"
 ac_cpw_principal_missing:0 "Osea or Yuktobania did not exist when the calendar opened"
 ac_cpw_principal_unable:0 "Osea or Yuktobania could not fight the recorded war"
 ac_cpw_declaration_refused:0 "The engine did not create the declared war; the owner is closed"
 ac_cpw_appeal_made:0 "Harling and Nikanor have asked their militaries to disarm"
 ac_cpw_peace_can_offer:0 "A peace on the joint appeal's terms can be offered"
 ac_cpw_peace_offered:0 "This government offered peace on the appeal's terms in the last thirty days"
 ac_cpw_peace_refused:0 "An offer of peace on the appeal's terms was refused"
 ac_cpw_peace_made:0 "Osea and Yuktobania made peace on the appeal's terms"
 ac_cpw_peace_not_made:0 "A peace on the appeal's terms was accepted but the engine kept the war"
 ac_cpw_outcome_peace:0 "The Circum-Pacific War ended in a peace on the appeal's terms"
 ac_cpw_arkbird_committed:0 "The Arkbird was sent to the front"
 ac_cpw_arkbird_held_back:0 "The Arkbird was kept on debris duty (provisional alternative)"
 ac_cpw_arkbird_sabotaged:0 "The Arkbird's engines were destroyed"
 ac_cpw_arkbird_lost:0 "The Arkbird was shot down"
 ac_cpw_summit_held:0 "The Arkbird Summit was held"
 ac_cpw_summit_skipped:0 "The Arkbird Summit date passed without a completed Arkbird"
 ac_cpw_declaration_asked:0 "The Yuktobanian government has been asked about the declaration"
 ac_cpw_declaration_pending:0 "The Yuktobanian declaration is pending"
 ac_cpw_declaration_window:0 "The declaration window is open"
 ac_cpw_ose_fallen:0 "Osea has fallen during the Circum-Pacific War"
