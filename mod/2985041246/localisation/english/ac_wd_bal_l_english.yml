l_english:
 BAL_wd_rep_mandate_runs_out:0 "The 1987 Mandate Runs Out"
 BAL_wd_rep_mandate_runs_out_desc:0 "Baltica enters 1991 governed by the National Administration, an office under a democratic banner whose mandate dates from the ballot of November 1987. The next vote falls due in November. Seven voters in ten back the democratic camp and most of the rest a non-aligned establishment, so the real question is not who wins but what kind of government the winners will build."
 BAL_wd_rep_roll_of_voters:0 "Clean the Roll of Voters"
 BAL_wd_rep_roll_of_voters_desc:0 "Clerks in Silvius compare the electoral roll with the works payrolls, the reserve register and the harbour lists, and find names that should have been struck years ago beside families who were never added. Correcting the roll before the vote costs the Administration a season of complaints from every party, but it gives the result a credibility that no later government could borrow."
 BAL_wd_rep_roll_of_voters_tt_1:0 "Opens the three answers to the ballot; only one can be taken."
 BAL_wd_rep_open_gallery:0 "Open the Chamber Gallery"
 BAL_wd_rep_open_gallery_desc:0 "Budget debates have been held behind closed doors, with the press told the result afterwards. Opening the gallery to reporters and to anyone willing to queue for a seat lets voters watch deputies bargain over rifles, roads and heating allowances. Ministers lose the comfort of private compromise and some deals become impossible, but the public begins to see where its taxes actually go."
 BAL_wd_rep_chamber_path:0 "Ministers From the Chamber"
 BAL_wd_rep_chamber_path_desc:0 "The democratic majority proposes the simplest answer: let the newly elected chamber choose a cabinet and hold it to account, with the Administration dissolved into ordinary ministries. Most voters want exactly that. The works directors and the defence staff warn that a cabinet built on coalitions will argue over every rifle and every lathe while a very large neighbour sits on the long frontier."
 BAL_wd_rep_works_path:0 "The Directors Offer a Board"
 BAL_wd_rep_works_path_desc:0 "Directors of the arsenal works, the harbour company and the two civilian plants propose another settlement. A board of the enterprises would govern, with the chamber kept as a consultative body, and judge each policy by whether the works stay busy and wages are paid. The non-aligned establishment likes the idea. The democratic majority sees a few managers walking into the state through the factory gate."
 BAL_wd_rep_defence_path:0 "The Defence Staff Steps Forward"
 BAL_wd_rep_defence_path_desc:0 "Officers of the territorial service argue that a country of one hill, one plain and one harbour, beside a vast neighbour, cannot afford a government that may change every four years. They offer a defence council to hold the state, with the chamber kept for budgets and petitions. The idea has more support than the polls suggest, because nearly every family has someone on the reserve list."
 BAL_wd_rep_chamber_cabinet:0 "Swear In the Chamber Cabinet"
 BAL_wd_rep_chamber_cabinet_desc:0 "The chamber elects a cabinet, and the National Administration hands over its seals in a short ceremony in Silvius. Ministers now answer to deputies, and the election calendar is written into ordinary law instead of being renewed by habit. Coalition bargaining begins the same afternoon. The works directors and the defence staff keep their posts, but they now petition a minister instead of sitting beside one."
 BAL_wd_rep_works_board:0 "Seat the Board of the Works"
 BAL_wd_rep_works_board_desc:0 "The directors of the arsenal works, the harbour company and the civilian plants take the government seals as a standing board. The chamber meets twice a year to hear the budget and cannot amend it. Orders are signed in days rather than months and wages arrive on time. The unions and the democratic camp, who were promised a vote, note that nobody asked them anything."
 BAL_wd_rep_defence_council:0 "Convene the Defence Council"
 BAL_wd_rep_defence_council_desc:0 "Senior officers of the territorial service take executive power for what they call a period of readiness. Parties are not banned and the chamber still sits, but the council writes the budget and appoints the ministers. Drills run on schedule and the reserve rolls fill. Nobody on the council has said how long readiness lasts, and that silence is noticed in every embassy in Silvius."
 BAL_wd_rep_chamber_code:0 "A Code of Ministerial Duty"
 BAL_wd_rep_chamber_code_desc:0 "The first chamber cabinet writes down what ministers owe the deputies: answers to written questions within a month, published contracts above a set value and a register of every gift. The opposition turns the code against the government within weeks. Ministers grumble that half their working day now goes on answering letters, yet public trust in the cabinet climbs steadily."
 BAL_wd_rep_board_wages:0 "Wages Before Dividends"
 BAL_wd_rep_board_wages_desc:0 "Pressed by unrest at the gates, the board signs a pact that puts wages ahead of any payment to the enterprises' owners and creditors. Workers get a written guarantee and a seat on each works council. Directors lose money they had counted on, and two foreign creditors demand faster repayment. The board keeps its seals and gains a reason for the works to want it to keep them."
 BAL_wd_rep_readiness_terms:0 "Publish the Terms of Readiness"
 BAL_wd_rep_readiness_terms_desc:0 "Under pressure from the chamber and from lenders abroad, the defence council publishes the conditions under which readiness would end and civilian ministers return: a full reserve, a quiet frontier and a balanced budget. Few believe the conditions will ever be declared met. The document still gives the public a measure to hold the officers to, and the officers know it."
 BAL_wd_rep_republic_holds:0 "The Republic Holds Together"
 BAL_wd_rep_republic_holds_desc:0 "By the middle of the decade the quarrel of 1991 has become routine. Whatever answer won, ministries know who signs their orders, the works know who sets their quotas and the reserve knows who can call it out. Small countries live on being predictable, and Baltica's neighbours and customers begin to treat it as a settled place where a contract signed today will still hold next year."
 BAL_wd_rep_audit_office:0 "An Audit Office for the Republic"
 BAL_wd_rep_audit_office_desc:0 "The arsenal audit showed what a single honest inspection could find. A permanent audit office, independent of every ministry and reporting to the chamber, now inspects one ministry and one works contract after another each year. Officials resent it and several careers end in its reports. The savings it finds in its first three years pay for the office many times over."
 BAL_wd_hill_five_provinces:0 "Ledger of the Five Provinces"
 BAL_wd_hill_five_provinces_desc:0 "Baltica is small enough to cross in a few days: Silvius on its hill, an inland plain, a forest province toward Malynea and two coastal plains, one of them holding the harbour. Nobody has measured them properly in a generation. A land and household register takes a winter of work and settles the arguments about which province pays for which road."
 BAL_wd_hill_snow_roads:0 "Roads Kept Open Through Winter"
 BAL_wd_hill_snow_roads_desc:0 "For months each year the country lies under snow, and blizzards close the road from Silvius to the coast for days at a time. Graders, salt stores and plough depots at every junction keep traffic moving through the worst weeks. The works pay for it through road taxes they resent, and the plough crews become the best-known public servants in the country."
 BAL_wd_hill_harbour_line:0 "Double Track to the Harbour"
 BAL_wd_hill_harbour_line_desc:0 "A single railway runs from Silvius across the inland plain to the harbour, carrying everything the works send abroad and much of what the country eats. A second track and new passing loops let freight and passenger trains run without waiting for each other. The plain loses farmland to embankments, and the project swallows most of the works budget for two years."
 BAL_wd_hill_upper_mains:0 "Water Mains on the Upper Streets"
 BAL_wd_hill_upper_mains_desc:0 "The upper streets of Silvius still draw water from cisterns filled by pumps that freeze every hard winter. New mains laid below the frost line, with a pumping station at the foot of the hill, end the bucket queues. Digging through rock is slow and costly, and the cistern keepers who carried water up the hill lose their trade overnight."
 BAL_wd_hill_rural_clinics:0 "Clinics Beyond the Capital"
 BAL_wd_hill_rural_clinics_desc:0 "Outside Silvius the only doctors work at the harbour and in the works infirmary, and in a blizzard a sick child on the forest province may wait two days for either. A small clinic in each province, with a snow vehicle and a radio, brings care within an hour of every household. Doctors are scarce and must be paid well to live outside the capital."
 BAL_wd_hill_build_upward:0 "Build Upward on the Hill"
 BAL_wd_hill_build_upward_desc:0 "One school of planners wants Silvius to stay on its hill, close to the works and easy to defend, with taller housing blocks, covered walkways against the snow and every service within a short walk. Building upward is cheap in land and expensive in steel. Residents who like their low old streets object, and the works families who need flats fastest do not."
 BAL_wd_hill_spread_plain:0 "A New Quarter on the Plain"
 BAL_wd_hill_spread_plain_desc:0 "The other school wants a new district of low houses and gardens on the inland plain, along the railway to the harbour, with fast trains to the works. Land is cheap there and the houses can be warm and spacious. The defence staff points out that a town spread across open ground is harder to protect, and farmers ask where their own fields are supposed to go."
 BAL_wd_hill_snow_brigades:0 "Volunteer Snow Brigades"
 BAL_wd_hill_snow_brigades_desc:0 "Every blizzard closes the plain for a day or two, and the plough crews cannot reach every lane. Brigades of volunteers, organised by street and paid in fuel vouchers, dig out bus stops, clinic doors and the homes of the elderly. The scheme costs little and makes neighbours of strangers. It also gives the government a list of willing hands that the territorial service quietly copies."
 BAL_wd_hill_works_heat:0 "Heat From the Works Chimneys"
 BAL_wd_hill_works_heat_desc:0 "The arsenal works burn fuel all winter to keep their furnaces hot, and most of that heat leaves through the chimneys. Piping it into the nearest housing blocks warms thousands of flats for the cost of insulation and pumps. Households pay less for fuel, and the works gain a public reason to keep running, which their directors mention at every budget debate."
 BAL_wd_works_ledger_open:0 "Open the Arsenal Ledgers"
 BAL_wd_works_ledger_open_desc:0 "Three arms lines and two civilian plants make up nearly all of Baltica's industry, and the arms lines are older, larger and better paid. Nobody outside the directors' offices knows what they cost or who buys their output. An audit of every order, wage and debt takes a year, and it will decide which parts of the works the country can afford to keep."
 BAL_wd_works_orders_book:0 "One Order Book for the Works"
 BAL_wd_works_orders_book_desc:0 "Each arms line has kept its own order book, its own suppliers and its own salesmen, and they regularly bid against one another for the same foreign contract. A single order book, kept in Silvius and open to all three lines, ends the undercutting. Directors lose some freedom and one of them resigns in protest, but the works stop selling below cost."
 BAL_wd_works_councils_elected:0 "Works Councils at Every Gate"
 BAL_wd_works_councils_elected_desc:0 "Each plant elects a council of workers that meets the management monthly and sees the order book, the safety record and the wage bill. The councils slow some decisions and kill a few bad ones. Strikes, which used to start without warning at the gates, now start, if at all, after a month of argument that everyone can see coming."
 BAL_wd_works_export_lines:0 "Arms Lines for Export"
 BAL_wd_works_export_lines_desc:0 "The first model keeps all three arms lines at full rate and sells what the territorial service cannot use to licensed foreign buyers. Exports pay for the works and for a large share of the budget. The risk is plain to everyone: Baltica would live on other countries' quarrels, and every sale to one side of a dispute is remembered by the other."
 BAL_wd_works_civil_conversion:0 "Two Lines to Civilian Work"
 BAL_wd_works_civil_conversion_desc:0 "The second model converts two of the three arms lines to tractors, pumps, rail wagons and heating plant, which the country now buys abroad at high prices. Output falls for two years while the lines are retooled, and skilled gunsmiths must learn new trades. The country ends up less dependent on foreign wars and more dependent on its own customers."
 BAL_wd_works_reserve_arsenal:0 "An Arsenal for Baltica Alone"
 BAL_wd_works_reserve_arsenal_desc:0 "The third model makes the works an arsenal for Baltica alone. The lines run below capacity in peacetime, building stocks of rifles, trucks and spare parts for the territorial service, and keep the tooling ready to surge if the frontier ever turns dangerous. It is the costliest model in peacetime and the most reassuring to a public that expects to defend itself."
 BAL_wd_works_export_licences:0 "Licences Signed in Silvius"
 BAL_wd_works_export_licences_desc:0 "Every export now needs a licence signed in Silvius and published within a month, naming the buyer, the weapon and the quantity. Some buyers walk away rather than be named. Those who stay pay more for a supplier whose word is public. The works lose quick sales and gain long contracts, and the chamber gains a list it can argue about every session."
 BAL_wd_works_wagon_orders:0 "Wagons for the Harbour Line"
 BAL_wd_works_wagon_orders_desc:0 "The converted lines win their first large order at home: freight wagons for the railway to the harbour and pumps for the new water mains. Domestic orders are smaller than arms contracts and paid more slowly. They also keep money inside Baltica, and the works councils, who feared that conversion meant closure, start to believe in the plan."
 BAL_wd_works_surge_drills:0 "Surge Drills at the Works"
 BAL_wd_works_surge_drills_desc:0 "Twice a year the reserve arsenal runs a surge drill: every line called back to full rate for a week, reservists from the works rolls reporting to their benches and the railway clearing paths for ammunition trains. The drills cost a week of normal output. They prove the arsenal can wake quickly, and they tell the neighbours so without a word being said."
 BAL_wd_works_spare_parts:0 "Spare Parts Before New Rifles"
 BAL_wd_works_spare_parts_desc:0 "The territorial service keeps more trucks than it can run, because many wait for parts the works never make: the profit is in new rifles, not in gaskets and axles. A standing quota for spare parts, paid at a fixed margin, keeps the motor pool on the road. Directors call it unglamorous work. The quartermasters call it long overdue."
 BAL_wd_works_board_quotas:0 "The Board Sets the Quotas"
 BAL_wd_works_board_quotas_desc:0 "Under the board of the works, the directors who govern the country also run its factories, and quotas are set in the same room as the budget. Orders move quickly from ministry to bench. Every dispute between a plant and the public is now a dispute with the government itself, and the unions learn to petition the board as employer and state at once."
 BAL_wd_works_tool_room:0 "A Tool Room for All Five Plants"
 BAL_wd_works_tool_room_desc:0 "Each of the five plants has kept its own tool room, and none of them can make a precision jig without borrowing a machine from another. A shared tool room, staffed by the best machinists from every plant, now makes jigs, gauges and dies for all of them. The plants resent losing their best hands to it, and productivity rises across all of them within a year."
 BAL_wd_works_old_debts:0 "Pay Off the Old Machine Debts"
 BAL_wd_works_old_debts_desc:0 "The audit found debts the works ran up before 1991, mostly to foreign suppliers of machine tools. Paying them off from five years of earnings, whatever model the country chose, frees the works from creditors who attach conditions to every new loan. The budget is tight for two years, and the works councils accept a wage freeze to see it done."
 BAL_wd_ore_resource_survey:0 "What Lies Under the Hill"
 BAL_wd_ore_resource_survey_desc:0 "Baltica records modest steel, oil and rubber, enough to feed part of its own works and little more. The survey maps in the ministry predate the works themselves. A new survey with drilling rigs and core samples tells the ministries how long each source will last and how much more could be won with better equipment. The answers are less generous than the directors hoped."
 BAL_wd_ore_keep_home:0 "Steel for Baltican Lathes"
 BAL_wd_ore_keep_home_desc:0 "The first option keeps every ton of steel and every barrel of crude for the works and the territorial service, at prices set below the world market. The works gain secure supply and cheap inputs. The treasury loses export earnings it badly needs, and producers complain that they subsidise the arsenal with every shipment they are forbidden to sell abroad."
 BAL_wd_ore_sell_abroad:0 "Steel and Crude for Hard Currency"
 BAL_wd_ore_sell_abroad_desc:0 "The second option sells what the works do not need to foreign buyers through the harbour, at world prices and in hard currency. The treasury gains earnings that pay for imported machine tools and food. The works must then buy their own inputs at the same prices as foreigners, and in a lean year they will be outbid for their own country's steel."
 BAL_wd_ore_deeper_wells:0 "New Rigs for the Old Wells"
 BAL_wd_ore_deeper_wells_desc:0 "The wells that supply Baltica's crude were drilled with equipment that cannot reach below the first oil-bearing layer. New rigs, bought abroad with an engineering contract, reach deeper and slow the decline of the field. They cost more than the crude they recover in their first three years. After that the field pays for them every year it keeps flowing."
 BAL_wd_ore_synthetic_rubber:0 "Rubber From the Laboratory"
 BAL_wd_ore_synthetic_rubber_desc:0 "The country's own rubber covers only part of what its trucks and plants consume, and imported rubber arrives by sea when the harbour is not frozen. Chemists at the works propose a small synthetic process using local crude as feedstock. Output is expensive and modest. It ends the fear that a frozen harbour or a foreign embargo could stop every truck in the country."
 BAL_wd_ore_fuel_reserve:0 "A Buried Fuel Reserve"
 BAL_wd_ore_fuel_reserve_desc:0 "A hard winter can close the harbour and the frontier crossings at the same time, and Baltica then has only what it holds in its tanks. A reserve large enough for two winters, stored in buried tanks around Silvius, keeps heating and transport running whatever the weather. Filling it takes a year of crude that could otherwise have been sold."
 BAL_wd_ore_price_board:0 "A Price Board for Fuel and Steel"
 BAL_wd_ore_price_board_desc:0 "Whatever the country decided about selling abroad, domestic prices for fuel and steel have swung wildly with every foreign quarrel. A price board publishes quarterly prices for both, with a small fund to smooth the sharpest jumps. Producers lose some windfall profits and buyers lose some bargains. Everyone gains the ability to plan a year ahead."
 BAL_wd_harbour_sixty_hulls:0 "Sixty Hulls, One Harbour"
 BAL_wd_harbour_sixty_hulls_desc:0 "Baltica keeps no fighting navy, but sixty merchant hulls sail under its flag, and almost all of them load and unload at one harbour on the coastal plain. The harbour has a single naval berth, a rail head and cranes older than most of their operators. A survey of every quay and hull tells the ministries what the merchant fleet can actually carry."
 BAL_wd_harbour_ice_tugs:0 "Tugs That Break Ice"
 BAL_wd_harbour_ice_tugs_desc:0 "In the coldest weeks the harbour freezes along the quays, and ships wait offshore for days while their cargoes of food and machine tools wait with them. Two heavy tugs with reinforced bows keep a channel open all winter. Their crews are the closest thing Baltica has to a naval service, and they learn more seamanship in one winter than in years of summer work."
 BAL_wd_harbour_open_quays:0 "Open Quays for Every Flag"
 BAL_wd_harbour_open_quays_desc:0 "One plan opens the harbour to every flag on equal terms, with low dues, quick inspections and bonded warehouses for goods in transit. Traders from all three neighbours and from farther afield are invited to use Baltican quays. Dues rise with volume. Customs officers warn that a harbour open to everyone is also a harbour where nobody looks closely at the crates."
 BAL_wd_harbour_every_crate:0 "Every Crate Inspected"
 BAL_wd_harbour_every_crate_desc:0 "The other plan keeps the harbour under a strict regime: every crate opened or scanned, every manifest checked against the works order book and preference given to Baltican hulls. Traffic grows slowly and dues stay high. The arms works prefer it, because nothing leaves the country that the government cannot account for, and nothing arrives unseen either."
 BAL_wd_harbour_cinigrad_news:0 "Submarines Announced at Cinigrad"
 BAL_wd_harbour_cinigrad_news_desc:0 "In September 1991 Yuktobania announces a new class of submarine at a political convention in Cinigrad, and the news reaches Silvius with the evening papers. Baltica has no navy to set against anything, but its merchant masters ask what the announcement means for the lanes off their own coast. The government doubles the coast watch for a year and asks masters to report every unusual contact."
 BAL_wd_harbour_rail_cranes:0 "New Cranes at the Rail Head"
 BAL_wd_harbour_rail_cranes_desc:0 "Freight arrives at the harbour on the single railway from Silvius and waits for cranes that lift one load in the time a modern crane lifts four. Replacing them, and laying sidings so wagons can be loaded beside the ships, cuts the time a hull spends at the quay by half. The cranes are bought abroad and their operators retrained at the harbour's expense."
 BAL_wd_harbour_coast_radar:0 "Radar on the Coastal Plain"
 BAL_wd_harbour_coast_radar_desc:0 "The harbour cannot see beyond the horizon, and in fog or snow it cannot see much closer either. A radar post on the coastal plain watches the approaches and guides ships into the channel the tugs keep open. The army wants the same set to watch for aircraft. Sharing it means arguments over the watch schedule, settled by giving each service its own shifts."
 BAL_wd_harbour_mates_school:0 "A School for Merchant Officers"
 BAL_wd_harbour_mates_school_desc:0 "Baltican hulls are officered largely by foreigners, because the country has trained few of its own above the rank of able seaman. A merchant marine school at the harbour, with a training ship and an ice navigation course, turns out mates and engineers in three years. Shipping lines must pay for places in the school, which they do while grumbling."
 BAL_wd_guard_winter_muster:0 "Muster in the Snow"
 BAL_wd_guard_winter_muster_desc:0 "The territorial service has two infantry formations, a reserve list longer than its barracks and depots holding more rifles and trucks than the formations could use. Nobody has called the whole reserve out in winter. A full muster in January, with snow on the plain and the roads half closed, shows what the service can really do and what it only claims to do."
 BAL_wd_guard_depot_drivers:0 "More Trucks Than Drivers"
 BAL_wd_guard_depot_drivers_desc:0 "The service holds hundreds of trucks in its depots, far more than two infantry formations need, and too few soldiers licensed to drive them. A driving school at the depot, with winter courses on the coastal road, turns infantrymen into drivers and mechanics. The trucks start moving, the fuel bill rises and the depots finally learn which vehicles still run."
 BAL_wd_guard_hill_redoubt:0 "Hold the Hill of Silvius"
 BAL_wd_guard_hill_redoubt_desc:0 "The first doctrine concentrates the service on Silvius and its hills, with dug-in positions, stored ammunition and every street mapped for defence. A capital on high ground with the works inside its perimeter can hold for weeks. The plain, the forest and the coast would be watched rather than held, and the people who live there understand exactly what that means."
 BAL_wd_guard_frontier_screens:0 "Screens in the Forest and Passes"
 BAL_wd_guard_frontier_screens_desc:0 "The second doctrine pushes the service out to the frontiers: small companies along the Yuktobanian line from the hills to the coast, others in the forest facing Malynea, and mountain troops on the passes toward Seterano. The screens would delay anything that crossed and report it within minutes. They are thin, cold and lonely, and companies rotate every month to keep morale from freezing along with the men."
 BAL_wd_guard_plain_reserve:0 "A Motor Reserve on the Plain"
 BAL_wd_guard_plain_reserve_desc:0 "The third doctrine uses the trucks the service already owns. A motorised reserve stationed on the inland plain, astride the railway, could reach any frontier or the harbour within hours. It needs fuel, drivers and roads kept open in winter. It also leaves the frontiers lightly watched for the first hours of any crisis, as the forest villages point out at every public meeting."
 BAL_wd_guard_rock_galleries:0 "Ammunition Galleries in the Hill"
 BAL_wd_guard_rock_galleries_desc:0 "Under the redoubt doctrine the service cuts storage galleries into the rock of the hill and fills them with ammunition, food and medical stores for a long siege. The works deliver to them by a short rail spur. Engineers warn about damp and the treasury warns about the bill, but the stores are proof against weather and against almost anything else."
 BAL_wd_guard_mountain_companies:0 "Mountain Companies on the Passes"
 BAL_wd_guard_mountain_companies_desc:0 "The service already trains a few men for mountain work, and the screens doctrine makes them its elite. Companies posted to the passes toward Seterano learn to ski, climb and live in snow caves for a week at a time. Recruits volunteer in larger numbers than expected. Injuries from cold and falls in training are a real cost, and the papers report every one."
 BAL_wd_guard_night_drives:0 "Night Drives Across the Plain"
 BAL_wd_guard_night_drives_desc:0 "The motorised reserve practises driving to every frontier at night and in snow, with headlights masked and the railway carrying fuel ahead of the convoys. The first drills end in ditches. By the second winter the reserve reaches the Malynea frontier in under three hours. Farmers on the plain grow used to trucks passing their houses at two in the morning."
 BAL_wd_guard_reserve_register:0 "A Register of the Reserve"
 BAL_wd_guard_reserve_register_desc:0 "The reserve list has been kept on cards in each barracks, and nobody knows how many reservists have moved, aged out or died. A single register, matched against the tax rolls and the works payrolls, shows who could actually report. The list shrinks sharply. What remains is a reserve the service can count on, rather than one it merely counts."
 BAL_wd_guard_winter_kit:0 "Kit for Twenty Below"
 BAL_wd_guard_winter_kit_desc:0 "The service's uniforms were not cut for Baltican winters, and every January men are sent home with frostbite. Proper winter kit, with layered clothing, felt boots, white smocks and heated tents, costs more per soldier than a rifle. It is the first thing reservists ask about at every muster, and the first change they notice when it finally arrives."
 BAL_wd_guard_council_review:0 "The Council Reviews the Service"
 BAL_wd_guard_council_review_desc:0 "Under the defence council the territorial service is reviewed by the officers who also govern the country. Inspections are frequent, promotions follow drill results and budgets arrive on time. The service has never been better funded. It has also never been so close to politics, and junior officers learn that a poor inspection can end a career faster than any war."
 BAL_wd_guard_full_strength:0 "The Service at Full Strength"
 BAL_wd_guard_full_strength_desc:0 "By the late nineties the territorial service has a doctrine, a register that matches its barracks and clothing for the climate it actually serves in. It is still small. It is no longer a list of names and a depot of trucks, and the military attaches who watch every autumn exercise report home that Baltica could make any trespass expensive."
 BAL_wd_air_empty_field:0 "An Airfield Without Aircraft"
 BAL_wd_air_empty_field_desc:0 "Baltica has one airfield near Silvius and no aircraft of its own to fly from it. The runway serves a few transport flights a week and the occasional visiting foreign aircraft. Lengthening it and adding hard standing makes it usable in all seasons, and forces a question nobody has wanted to ask: should the country ever base fighters there?"
 BAL_wd_air_runway_ploughs:0 "Runway Ploughs and Heated Lamps"
 BAL_wd_air_runway_ploughs_desc:0 "Snow closes the runway for days each winter, and the approach lights freeze. Runway ploughs, de-icing equipment and heated lamps keep it open in all but the worst blizzards. Transport flights stop cancelling and the mail arrives on time. The ground crews, trained on equipment borrowed from abroad, become the nucleus of any air service Baltica may one day build."
 BAL_wd_air_interceptor_flight:0 "A Flight of Interceptors"
 BAL_wd_air_interceptor_flight_desc:0 "One answer is a small flight of interceptors bought abroad, with pilots trained by the seller, to police the country's skies and escort any intruder away. It would give Baltica combat aviation, which the service of 1991 does not have. The cost is enormous for a budget this size, and the pilots would need years of training before the flight could do more than show the flag."
 BAL_wd_air_ground_guns:0 "Guns and Radar Instead of Fighters"
 BAL_wd_air_ground_guns_desc:0 "The other answer leaves the sky to guns and radar. Anti-aircraft batteries on the hill and around the harbour, tied to radar posts, cannot chase an intruder but can make any attack costly. The plan costs a fraction of a fighter flight and uses soldiers the service already has. It also accepts that Baltican skies belong to whoever is willing to fly in them."
 BAL_wd_air_frontier_reports:0 "Air Reports Over the Frontiers"
 BAL_wd_air_frontier_reports_desc:0 "Baltica cannot watch its skies alone, so it offers each neighbour the same exchange: every unidentified aircraft any of them detects near the shared frontiers reported to the others within minutes. The offer goes in identical notes to all three capitals. It is not an alliance and nobody calls it one, but Baltican reports go out on an open channel whether or not anyone answers."
 BAL_wd_air_foreign_courses:0 "Pilots on Foreign Courses"
 BAL_wd_air_foreign_courses_desc:0 "The interceptor flight needs pilots, and Baltica has no school to train them. Cadets go abroad on courses paid for by the treasury, and the best return as instructors. It takes five years to build a cadre that can fly in Baltican winters. Until then the flight depends on foreign instructors, who are expensive and leave whenever their contracts end."
 BAL_wd_air_radar_ring:0 "A Radar Ring Around Silvius"
 BAL_wd_air_radar_ring_desc:0 "The gun plan depends on seeing aircraft early, so radar posts on the hills around Silvius and on the coastal plain are linked to one control room under the capital. The ring watches day and night. It sees well beyond Baltica's frontiers, which the neighbours notice, and the government assures them that it watches the sky and not their territory."
 BAL_wd_air_heated_hangars:0 "Warm Hangars for Winter Visitors"
 BAL_wd_air_heated_hangars_desc:0 "Foreign transport aircraft that land at Silvius in winter often cannot leave for days, because their engines freeze overnight. Heated hangars and engine warmers make the airfield a reliable stop for relief and cargo flights. Landing fees pay for part of the work. The army notes that any hangar warm enough for a visitor is warm enough for aircraft of its own."
 BAL_wd_air_winter_exercise:0 "A Winter Air Exercise"
 BAL_wd_air_winter_exercise_desc:0 "Whichever answer Baltica chose, the airfield hosts a winter exercise each year: transports landing in snow, the interceptors or the guns tracking practice targets towed by a hired aircraft, and the radar room plotting everything. The exercise is small. Observers come from abroad, and Baltica learns more about its own weak points in one week than in a year."
 BAL_wd_nbr_frontier_atlas:0 "An Atlas of the Frontiers"
 BAL_wd_nbr_frontier_atlas_desc:0 "Baltica's longest land frontier runs from the hills of Silvius to the sea along Yuktobania, a country many times its size governed by its communist party. Shorter frontiers face the small republics of Malynea and Seterano, the second across mountains. The foreign office compiles everything it knows about all three into one atlas, and is alarmed by how thin the volume turns out to be."
 BAL_wd_nbr_long_frontier_trade:0 "Trade Across the Long Frontier"
 BAL_wd_nbr_long_frontier_trade_desc:0 "The first posture treats the long frontier as an opportunity. Customs posts open longer hours and Baltican works offer spare parts and civilian goods to Yuktobanian buyers. Trade grows fast. So does the share of Baltica's income that depends on one enormous customer, and every policy made in Silvius starts to be weighed against how it will be received across that line."
 BAL_wd_nbr_small_republics:0 "Talks With the Small Republics"
 BAL_wd_nbr_small_republics_desc:0 "The second posture looks to the two small republics. Baltica offers Malynea and Seterano regular consultations on frontier crossings, weather warnings, air reports and trade. Nothing binds anyone and no alliance is proposed. Three small democracies speaking together on practical matters are harder to ignore than three speaking apart, and the cost is the suspicion of the largest neighbour."
 BAL_wd_nbr_no_favourites:0 "No Favourites on Any Frontier"
 BAL_wd_nbr_no_favourites_desc:0 "The third posture treats every neighbour exactly alike: the same customs rules, the same visa terms and no special arrangement with anyone. Baltica explains its policy in identical notes to all three capitals. It forgoes the trade of the first posture and the friendships of the second. In return no neighbour can say that Baltica has chosen anyone against it."
 BAL_wd_nbr_common_forms:0 "Yuktobanian Forms at the Posts"
 BAL_wd_nbr_common_forms_desc:0 "Trucks queue for a day at the long frontier while officers on both sides inspect the same cargo. Baltican customs adopt Yuktobanian forms and inspection standards, so a cargo cleared on the far side needs only a seal check on Baltica's. The change is technical and unilateral. Some deputies still dislike the idea of a neighbour's paperwork deciding what crosses into the republic."
 BAL_wd_nbr_open_weather:0 "An Open Weather and Fire Watch"
 BAL_wd_nbr_open_weather_desc:0 "The consultations produce a practical first step. Baltica builds weather stations, forest fire watches and avalanche posts along its frontiers and broadcasts their reports every hour on an open frequency that anyone across the line may use. Blizzards and fires do not stop at customs posts. The network costs little and saves lives in its first winter."
 BAL_wd_nbr_identical_notes:0 "The Policy of Identical Notes"
 BAL_wd_nbr_identical_notes_desc:0 "Baltica turns its even-handed practice into declared policy, read in the chamber and sent to every capital that keeps an embassy in Silvius. It promises to sell nothing to any party in a dispute among its neighbours and to let no foreign force cross its land. The declaration is cheap to make and costly to keep, and the arms works resent the orders it forbids."
 BAL_wd_nbr_pass_patrols:0 "Snow Patrols on the Seterano Passes"
 BAL_wd_nbr_pass_patrols_desc:0 "The mountain passes toward Seterano close for much of the winter, and travellers caught by blizzards depend on whoever reaches them first. Baltican snow patrols, with huts, radios and rescue teams, keep the Baltican side of the passes watched all season and answer any call for help from the slopes. The patrols cost little and earn goodwill far beyond their size."
 BAL_wd_nbr_attache_corps:0 "Attaches in Every Neighbour Capital"
 BAL_wd_nbr_attache_corps_desc:0 "Baltica's foreign service has been a handful of diplomats who also handle trade. A small corps of attaches posted to the three neighbouring capitals reports on armies, harvests, prices and politics, and keeps the government from learning about its neighbours from foreign newspapers. It costs salaries, housing and secure radio, and it means Baltica will hear bad news first."
 BAL_wd_belka_war_news:0 "News of the Belkan War"
 BAL_wd_belka_war_news_desc:0 "In March 1995 war breaks out around Belka, a world away from Baltica's frontiers. The fighting reaches Silvius through prices: fuel and grain rise on the foreign exchanges, insurers add premiums to every cargo and arms buyers the works have never met begin to call. The government must decide how a small arms-making country behaves when someone else's war is good for business."
 BAL_wd_belka_no_sales:0 "No Arms to the Belligerents"
 BAL_wd_belka_no_sales_desc:0 "The first answer forbids every export of arms or munitions to any country at war, and to any buyer who might resell to one. The works lose the largest orders they have seen in years, and some foreign creditors call in loans. In return Baltica stays out of every belligerent's ledger, and no postwar government can accuse it of arming the other side."
 BAL_wd_belka_war_orders:0 "Fill the Wartime Orders"
 BAL_wd_belka_war_orders_desc:0 "The second answer lets the works sell to any licensed buyer whose government is not under an embargo, and the order book fills within weeks. Overtime returns to all three arms lines and the treasury collects export taxes it had almost forgotten. Some cargoes will end up at the front. Everyone in the chamber knows it, and the opposition says so at every sitting."
 BAL_wd_belka_risk_pool:0 "A State Pool for War Risk"
 BAL_wd_belka_risk_pool_desc:0 "Insurers abroad raise premiums on every Baltican cargo, whatever its destination, because underwriters cannot tell one small flag from another at this distance. A state pool that insures Baltican hulls against war risk at fixed rates keeps the merchant fleet sailing. The treasury carries the risk. If one ship is lost the pool can pay; if several are lost the budget cannot."
 BAL_wd_belka_lumen_treaty:0 "The Lumen Treaty Reaches Silvius"
 BAL_wd_belka_lumen_treaty_desc:0 "In June 1995 a treaty signed in Lumen ends the Belkan War. Prices fall back over the summer, insurers drop their premiums and the arms buyers stop calling as suddenly as they began. The works must decide what to do with lines that ran at wartime rates. The government must decide what the war taught a country that took no part in it."
 BAL_wd_belka_staff_study:0 "What a Distant War Teaches"
 BAL_wd_belka_staff_study_desc:0 "Baltican officers read every report of the Belkan War that reaches them, from foreign newspapers, attaches and the works' own buyers. They study how a small republic was nearly overrun within days of the outbreak, and how fuel depots and bridges became the first targets. The lessons go into a staff study the territorial service will argue about for the rest of the decade."
 BAL_wd_belka_belkan_buyers:0 "Belka Returns to the Market"
 BAL_wd_belka_belkan_buyers_desc:0 "In this outcome Belka has come out of the war on the winning side of the peace. Belkan buyers return with long lists of spare parts and machine tools, and Belkan banks offer credit to suppliers who stayed out of the fighting. The works can take the orders. Osean buyers will notice which suppliers do, and their governments keep lists of their own."
 BAL_wd_belka_allied_buyers:0 "Buyers From the Allied Side"
 BAL_wd_belka_allied_buyers_desc:0 "In this outcome Belka has lost, and the allied governments shape the peace. Buyers who relied on Belkan suppliers for spare parts and machine tools look elsewhere, and small neutral works appear on their lists. Their orders arrive with inspection clauses attached. Baltica can accept them, or keep its works free of foreign inspectors and its order book thin."
 BAL_wd_sky_word_from_astronomers:0 "Word From the Astronomers"
 BAL_wd_sky_word_from_astronomers_desc:0 "By April 1996 the danger first raised by astronomers in December 1994 is a certainty: the FCU announces that Ulysses will hit the Earth, without saying where. For Baltica the planning problem is particular. Its capital stands on solid rock, its winters can kill anyone left in the open and its harbour ices over. Each ministry drafts a scheme, and all of them reach for one budget."
 BAL_wd_sky_rock_of_silvius:0 "Shelters in the Rock of Silvius"
 BAL_wd_sky_rock_of_silvius_desc:0 "The first plan cuts shelter halls into the rock beneath Silvius, heated by the works and stocked for weeks, large enough to take in families from the plain and the coast as well as the capital. Rock is the best shelter there is. Cutting it is slow, and everyone outside the capital is told to travel to the hill when the warning comes, whatever the weather."
 BAL_wd_sky_warn_and_disperse:0 "Warn Early, Disperse Wide"
 BAL_wd_sky_warn_and_disperse_desc:0 "The second plan spends on warning rather than concrete: observing time bought abroad, sirens in every village and a dispersal plan that moves people out of large buildings into heated shelters spread across all five provinces. It saves more lives if the warning comes in time. In midwinter, a dispersal ordered too early could kill people by itself."
 BAL_wd_sky_cold_stores:0 "Grain and Medicine in Store"
 BAL_wd_sky_cold_stores_desc:0 "If fragments fall anywhere near, the harbour could close and the frontier crossings with it, and Baltica buys much of its grain and medicine abroad. A reserve of grain, seed and medicine, held in cold stores across the provinces, buys the country a year of self-reliance. Filling it raises food prices for a season, and the shops say so loudly."
 BAL_wd_sky_deep_wards:0 "Hospitals Below Ground"
 BAL_wd_sky_deep_wards_desc:0 "Hospitals are the buildings a country can least afford to evacuate. Moving operating theatres, generators and wards for the critically ill into reinforced basements in Silvius and at the harbour lets them keep working through any strike or blizzard. Surgeons lose months while their departments move. The doctors support the plan and complain about the timetable."
 BAL_wd_sky_roche_night:0 "A Night Spent Underground"
 BAL_wd_sky_roche_night_desc:0 "Ulysses crosses the Roche limit of the Earth on 8 July 1999, and Baltica spends that night underground or beside a radio. Three years of preparation come down to hours the government cannot influence at all. Whatever falls, and wherever it falls, the country will wake to a changed world and to the bill for every scheme it paid for."
 BAL_wd_sky_relief_column:0 "A Relief Column for Others"
 BAL_wd_sky_relief_column_desc:0 "If Ulysses spares Baltica, others will not be so lucky. The government prepares a relief column of trucks, field kitchens, heated tents and medical teams from the territorial service, ready to go wherever it is invited. It has no destination yet and claims none. Keeping it ready costs fuel and men, and offering it ends Baltica's comfortable distance from other people's disasters."
 BAL_wd_century_great_power_thaw:0 "Osea and Yuktobania in One Project"
 BAL_wd_century_great_power_thaw_desc:0 "Osea and Yuktobania announce in October 1999 that they will jointly convert the Arkbird to clear debris from satellite orbits. To a small republic on the frontier of the larger partner, the technical details matter less than the handshake. Great powers busy cooperating leave less room for frontier tension, and the government drafts its budget for the new decade on that hope."
 BAL_wd_century_shorter_service:0 "Shorter Reserve Service"
 BAL_wd_century_shorter_service_desc:0 "One camp argues that the thaw lets Baltica shorten reserve service, release young men to the works and the harbour and spend the savings on schools and housing. The territorial service would shrink to a training cadre. If the thaw holds, the country grows richer. If it does not, rebuilding the reserve will take years that a crisis might not allow."
 BAL_wd_century_whole_reserve:0 "Keep the Reserve Whole"
 BAL_wd_century_whole_reserve_desc:0 "The other camp argues that thaws between great powers come and go, while Baltica's frontier stays exactly where it is. The reserve keeps its full term of service and its winter exercises, and the savings from the thaw go into equipment rather than schools. The country stays ready, and young men who would rather be working say so at every election."
 BAL_wd_century_graduates:0 "Engineers Who Stay Home"
 BAL_wd_century_graduates_desc:0 "Young engineers trained at the works leave for better pay abroad as soon as their apprenticeships end. Bursaries that repay a student's fees for every year spent working in Baltica, together with housing near the works, keep a growing share at home. The scheme is expensive and some graduates leave anyway. Those who stay become the first generation to run the works without foreign advisers."
 BAL_wd_century_ballot_2003:0 "The Ballot of November 2003"
 BAL_wd_century_ballot_2003_desc:0 "Under the chamber cabinet, Baltica votes again in November 2003, the fourth ballot since the mandate of 1987 expired. The campaign is fought over the thaw, the reserve, the Usean war and the pensions of the works families. Whoever wins, the count confirms that the republic changes its governments on schedule and by vote, rather than by crisis."
 BAL_wd_century_usean_charters:0 "Charters Refused Toward Usea"
 BAL_wd_century_usean_charters_desc:0 "When Erusea invades San Salvacion in the summer of 2003 and takes Stonehenge, the war seems a continent away from Silvius. It reaches Baltica by sea within days: underwriters withdraw cover on the lanes to Usea, buyers on both sides telephone the works, and Baltican masters turn down charters toward the fighting. Once more a distant war sets the price of a Baltican winter."
 BAL_wd_century_usea_averted:0 "The Usean Lanes Stay Calm"
 BAL_wd_century_usea_averted_desc:0 "In this outcome war in Usea has been averted, and the lanes toward Usean ports carry ordinary traffic at ordinary premiums. Baltican masters accept Usean charters again and the works keep their spare parts customers on the continent. The government quietly retires the contingency plans it drafted, and the harbour owners ask whether the war-risk surcharge can be dropped as well."
 BAL_wd_century_usean_wagons:0 "Rail Wagons for a Rebuilt Usea"
 BAL_wd_century_usean_wagons_desc:0 "In this outcome the ISAF has won and Usea begins to rebuild its railways, ports and power lines. Baltican works bid for orders of wagons, pumps and spare parts, the kind of goods they can make without new tooling. Payment stretches over years. The orders still keep the lines busy at a moment when military buyers everywhere are cutting back."
 BAL_wd_century_erusean_offices:0 "Erusean Offices in Usean Ports"
 BAL_wd_century_erusean_offices_desc:0 "In this outcome Erusea has won its war, and the trade offices that now run Usean ports set fresh terms for foreign shippers: inspections at the quay and preferred prices for favoured suppliers. Baltican owners must decide whether access is worth the conditions. Accepting keeps hulls working. It also binds Baltican trade to authorities that many older customers distrust."
 BAL_wd_century_reserve_review:0 "The Reserve in a New Century"
 BAL_wd_century_reserve_review_desc:0 "With the service at full strength and the reserve question settled, the territorial staff turns its best instructors into a permanent cadre that rotates through every depot. Reservists train on current equipment rather than whatever the depot happens to hold. The cadre costs career salaries the service has never paid before, and it keeps the reserve from going stale."
 BAL_wd_century_independent_audit:0 "Baltica Takes Stock in 2005"
 BAL_wd_century_independent_audit_desc:0 "In 2005 the cabinet office in Silvius commissions independent auditors to examine everything the republic has built since the ballot of 1991: its laws, its works, its harbour, its reserve and its shelters. The auditors come from the universities and the courts, not the ministries. Their report closes this era of the programme with figures instead of slogans, and the next government inherits them."
 BAL_wd_century_independent_audit_tt_2:0 "Closes the 1991 to 2005 programme; later eras are not yet written."
 ac_wd_bal_tree:0 "Baltica: National Programme"
 ac_wd_bal_tree_desc:0 "The national focus programme of Baltica, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 BAL_wd_expiring_mandate:0 "The Expiring Mandate"
 BAL_wd_expiring_mandate_desc:0 "The mandate from the ballot of November 1987 runs out in November 1991."
 BAL_wd_public_gallery:0 "The Public Gallery"
 BAL_wd_public_gallery_desc:0 "Budget debates are open to the press and to anyone who queues for a seat."
 BAL_wd_chamber_mandate:0 "Ministers Answer to Deputies"
 BAL_wd_chamber_mandate_desc:0 "A cabinet chosen by the elected chamber, bargaining for every budget."
 BAL_wd_works_charter:0 "The Works Charter"
 BAL_wd_works_charter_desc:0 "Directors of the works and the harbour claim a share of government."
 BAL_wd_defence_watch:0 "Readiness Before Politics"
 BAL_wd_defence_watch_desc:0 "The territorial staff argues that a small country cannot afford a changeable government."
 BAL_wd_ministerial_code:0 "The Ministerial Code"
 BAL_wd_ministerial_code_desc:0 "Written answers within a month, published contracts and a register of gifts."
 BAL_wd_works_wage_pact:0 "The Wage Pact"
 BAL_wd_works_wage_pact_desc:0 "Wages come before any payment to owners or creditors, with a worker seat on each council."
 BAL_wd_readiness_charter:0 "The Readiness Charter"
 BAL_wd_readiness_charter_desc:0 "Published conditions under which the defence council would return power to ministers."
 BAL_wd_audit_office:0 "The Republic Audit Office"
 BAL_wd_audit_office_desc:0 "An independent office audits every ministry and every works contract each year."
 BAL_wd_campaign_season:0 "A Campaign Season"
 BAL_wd_campaign_season_desc:0 "Ministers campaign, the chamber argues and decisions wait for the count."
 BAL_wd_province_register:0 "The Province Register"
 BAL_wd_province_register_desc:0 "Households, wells, stoves and roads in all five provinces, on one register."
 BAL_wd_hill_waterworks:0 "Water Below the Frost Line"
 BAL_wd_hill_waterworks_desc:0 "Mains laid deep enough that the upper streets no longer queue at frozen cisterns."
 BAL_wd_dense_hill:0 "Silvius Builds Upward"
 BAL_wd_dense_hill_desc:0 "Tall blocks and covered walkways keep the capital on its defensible hill."
 BAL_wd_plain_quarter:0 "Houses on the Plain"
 BAL_wd_plain_quarter_desc:0 "Low houses and gardens along the railway, with fast trains to the works."
 BAL_wd_works_heat:0 "Heat From the Works"
 BAL_wd_works_heat_desc:0 "Furnace heat piped from the arsenal works into the nearest housing blocks."
 BAL_wd_winter_volunteers:0 "The Snow Volunteers"
 BAL_wd_winter_volunteers_desc:0 "Street brigades, paid in fuel vouchers, dig out what the ploughs miss."
 BAL_wd_snow_brigade_call:0 "The Brigades Are Out"
 BAL_wd_snow_brigade_call_desc:0 "Every volunteer brigade is clearing lanes, doors and stops this week."
 BAL_wd_provincial_clinics:0 "A Clinic in Every Province"
 BAL_wd_provincial_clinics_desc:0 "A doctor, a radio and a snow vehicle within an hour of every household."
 BAL_wd_arsenal_ledger:0 "The Arsenal Ledger"
 BAL_wd_arsenal_ledger_desc:0 "Every order, wage and debt of the works, on paper for the first time."
 BAL_wd_common_order_book:0 "One Order Book"
 BAL_wd_common_order_book_desc:0 "The three arms lines stop underbidding each other for the same foreign contract."
 BAL_wd_export_arsenal:0 "Arsenal for Export"
 BAL_wd_export_arsenal_desc:0 "All three arms lines at full rate, selling the surplus to licensed buyers."
 BAL_wd_converted_lines:0 "Converted Lines"
 BAL_wd_converted_lines_desc:0 "Two arms lines retooled for tractors, pumps, wagons and heating plant."
 BAL_wd_reserve_arsenal:0 "The Reserve Arsenal"
 BAL_wd_reserve_arsenal_desc:0 "Lines kept below capacity, stocks built for the territorial service, tooling ready to surge."
 BAL_wd_licensed_exports:0 "Published Export Licences"
 BAL_wd_licensed_exports_desc:0 "Every export licence names the buyer, the weapon and the quantity."
 BAL_wd_civil_order_book:0 "Orders at Home"
 BAL_wd_civil_order_book_desc:0 "Converted lines fill domestic orders for wagons, pumps and boilers."
 BAL_wd_surge_arsenal:0 "The Surge Arsenal"
 BAL_wd_surge_arsenal_desc:0 "Twice a year the reserve arsenal proves it can wake to full rate in a week."
 BAL_wd_spares_first:0 "Spares First"
 BAL_wd_spares_first_desc:0 "A standing quota of gaskets, axles and barrels keeps the motor pool on the road."
 BAL_wd_board_quotas:0 "Quotas From the Board"
 BAL_wd_board_quotas_desc:0 "The board that governs the country also sets the quotas of its factories."
 BAL_wd_works_councils:0 "Works Councils"
 BAL_wd_works_councils_desc:0 "An elected council at every plant sees the order book, the safety record and the wage bill."
 BAL_wd_works_debt_cleared:0 "Free of the Old Creditors"
 BAL_wd_works_debt_cleared_desc:0 "The debts found by the audit are paid, and with them the conditions on every loan."
 BAL_wd_overtime_lines:0 "Overtime on Every Line"
 BAL_wd_overtime_lines_desc:0 "Every line runs extra shifts to clear the order backlog."
 BAL_wd_survey_maps:0 "The New Survey Maps"
 BAL_wd_survey_maps_desc:0 "Drilling cores and survey maps show what the state can mine and pump."
 BAL_wd_home_inputs:0 "Inputs Kept at Home"
 BAL_wd_home_inputs_desc:0 "Steel and crude reserved for the works at prices below the world market."
 BAL_wd_export_earnings:0 "Hard Currency Earnings"
 BAL_wd_export_earnings_desc:0 "Surplus steel and crude sold through the harbour at world prices."
 BAL_wd_fuel_reserve:0 "The Buried Fuel Reserve"
 BAL_wd_fuel_reserve_desc:0 "Buried tanks around Silvius hold fuel for two winters."
 BAL_wd_price_board:0 "The Price Board"
 BAL_wd_price_board_desc:0 "One board publishes the domestic prices of fuel and steel each quarter."
 BAL_wd_harbour_register:0 "The Harbour Register"
 BAL_wd_harbour_register_desc:0 "Every quay, crane and Baltican hull surveyed and listed."
 BAL_wd_ice_tugs:0 "Tugs With Ice Bows"
 BAL_wd_ice_tugs_desc:0 "Two reinforced tugs keep a channel open through the winter."
 BAL_wd_open_quays:0 "Open Quays"
 BAL_wd_open_quays_desc:0 "Low dues, quick inspections and bonded warehouses for every flag."
 BAL_wd_inspected_quays:0 "The Inspection Regime"
 BAL_wd_inspected_quays_desc:0 "Every crate opened or scanned, every manifest matched to the order book."
 BAL_wd_coast_alert:0 "Coast Watch Doubled"
 BAL_wd_coast_alert_desc:0 "Masters report every unusual contact off the coast for a year."
 BAL_wd_mates_school:0 "Baltican Mates and Engineers"
 BAL_wd_mates_school_desc:0 "Merchant officers trained at home, with an ice navigation course."
 BAL_wd_rail_head_cranes:0 "Cranes at the Rail Head"
 BAL_wd_rail_head_cranes_desc:0 "Modern cranes and sidings halve the time a hull spends at the quay."
 BAL_wd_muster_lessons:0 "Lessons of the Winter Muster"
 BAL_wd_muster_lessons_desc:0 "What one January muster taught the service about itself."
 BAL_wd_driver_school:0 "The Depot Driving School"
 BAL_wd_driver_school_desc:0 "Infantrymen trained as drivers and mechanics for the depot trucks."
 BAL_wd_hill_redoubt:0 "The Hill Redoubt"
 BAL_wd_hill_redoubt_desc:0 "The service concentrated on Silvius and its hills, with the works inside the perimeter."
 BAL_wd_frontier_screens:0 "Frontier Screens"
 BAL_wd_frontier_screens_desc:0 "Small companies along every land frontier and on the mountain passes."
 BAL_wd_plain_reserve:0 "The Plain Reserve"
 BAL_wd_plain_reserve_desc:0 "A motorised reserve astride the railway on the inland plain."
 BAL_wd_hill_fortress:0 "Stores in the Rock"
 BAL_wd_hill_fortress_desc:0 "Ammunition, food and medical stores in galleries cut into the hill."
 BAL_wd_mountain_screens:0 "Mountain Companies"
 BAL_wd_mountain_screens_desc:0 "Ski and climbing companies that can live a week in snow caves."
 BAL_wd_motor_reserve:0 "The Night Drivers"
 BAL_wd_motor_reserve_desc:0 "A reserve that can reach any frontier in hours, at night and in snow."
 BAL_wd_reserve_register:0 "The Reserve Register"
 BAL_wd_reserve_register_desc:0 "One register of reservists, matched to the tax rolls and payrolls."
 BAL_wd_winter_kit:0 "Winter Kit for Every Reservist"
 BAL_wd_winter_kit_desc:0 "Layered clothing, felt boots, white smocks and heated tents."
 BAL_wd_council_inspectors:0 "Inspections by the Council"
 BAL_wd_council_inspectors_desc:0 "The officers who govern also inspect, promote and fund the service."
 BAL_wd_reserve_week:0 "The Reserve Is Out"
 BAL_wd_reserve_week_desc:0 "One year group of reservists is in the depots for a week of winter drill."
 BAL_wd_reserve_cadre:0 "The Reserve Cadre"
 BAL_wd_reserve_cadre_desc:0 "A core of long-service instructors keeps the reserve current in the new century."
 BAL_wd_interceptor_flight:0 "The Interceptor Flight"
 BAL_wd_interceptor_flight_desc:0 "A small flight of interceptors bought abroad to police Baltican skies."
 BAL_wd_ground_air_defence:0 "Guns Over the Hill"
 BAL_wd_ground_air_defence_desc:0 "Anti-aircraft batteries on the hill and around the harbour, tied to radar."
 BAL_wd_pilot_contracts:0 "Cadets on Foreign Courses"
 BAL_wd_pilot_contracts_desc:0 "Baltican cadets trained abroad, returning as instructors."
 BAL_wd_radar_ring:0 "The Radar Ring"
 BAL_wd_radar_ring_desc:0 "Radar posts on the hills and the coast, linked to one control room."
 BAL_wd_air_reporting:0 "Air Reports Across the Frontiers"
 BAL_wd_air_reporting_desc:0 "Unidentified aircraft near the frontiers reported to any neighbour that listens."
 BAL_wd_frontier_office:0 "The Frontier Desk"
 BAL_wd_frontier_office_desc:0 "One desk in the foreign office follows all three land frontiers and the coast."
 BAL_wd_long_frontier_trade:0 "Trade on the Long Frontier"
 BAL_wd_long_frontier_trade_desc:0 "Customs posts open longer and the works sell across the Yuktobanian line."
 BAL_wd_small_republic_talks:0 "Talks With the Small Republics"
 BAL_wd_small_republic_talks_desc:0 "Regular consultations offered to Malynea and Seterano on practical matters."
 BAL_wd_even_handed:0 "No Favourites"
 BAL_wd_even_handed_desc:0 "The same customs rules and visa terms for every neighbour."
 BAL_wd_joint_customs:0 "Common Customs Forms"
 BAL_wd_joint_customs_desc:0 "Baltican customs accept Yuktobanian forms, so a cleared cargo needs only a seal check."
 BAL_wd_neighbour_network:0 "The Open Weather Network"
 BAL_wd_neighbour_network_desc:0 "Frontier weather, fire and avalanche reports broadcast every hour."
 BAL_wd_declared_neutrality:0 "Declared Neutrality"
 BAL_wd_declared_neutrality_desc:0 "No sales to any party in a dispute among neighbours, and no foreign force on Baltican land."
 BAL_wd_pass_patrols:0 "Patrols on the Passes"
 BAL_wd_pass_patrols_desc:0 "Huts, radios and rescue teams on the Baltican side of the mountain passes."
 BAL_wd_attache_corps:0 "The Attache Corps"
 BAL_wd_attache_corps_desc:0 "Attaches in every neighbouring capital report on armies, harvests and prices."
 BAL_wd_war_prices:0 "War Prices"
 BAL_wd_war_prices_desc:0 "Fuel, grain and insurance cost more while war burns around Belka."
 BAL_wd_war_embargo:0 "No Arms to Belligerents"
 BAL_wd_war_embargo_desc:0 "No Baltican arms to any country at war or to any buyer who might resell."
 BAL_wd_war_orders:0 "The Wartime Order Book"
 BAL_wd_war_orders_desc:0 "Licensed buyers from any country not under embargo fill the order book."
 BAL_wd_war_risk_pool:0 "The War Risk Pool"
 BAL_wd_war_risk_pool_desc:0 "The state insures Baltican hulls against war risk at fixed rates."
 BAL_wd_belkan_credit:0 "Belkan Credit Lines"
 BAL_wd_belkan_credit_desc:0 "Belkan buyers and banks favour suppliers who stayed out of the war."
 BAL_wd_allied_buyers:0 "Buyers From the Allied Side"
 BAL_wd_allied_buyers_desc:0 "New buyers for parts once bought in Belka, with inspection clauses attached."
