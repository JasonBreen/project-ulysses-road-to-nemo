 OSE_snp_appropriations_service_1_domestic_spirit_desc:0 "During war, the receiving office limits this ninety-day period to domestic continuity. Records, training liaison and maintenance administration receive a reduced schedule while other staff answer urgent national needs."
 OSE_snp_appropriations_service_1:0 "Reconcile Receiving Returns"
 OSE_snp_appropriations_service_1_desc:0 "Sustain a finite reconciliation period for domestic commitments.\n\nLatest observed work: [?ac_snp_ose_appropriations_1_elapsed|0]/90 days.\n\nA funded period lasts ninety days. Wartime authorization performs reduced domestic continuity work. Annexation, capitulation, loss of all controlled national territory or cancellation ends the period without completion credit; spent resources remain committed. Successful completion starts this scope's ninety-day cooldown."
 OSE_snp_appropriations_service_1_effect_tt:0 "Authorize the named ninety-day receiving scope. Reserve its national capacity and pay the displayed political, institutional and applicable fiscal costs. Wartime work uses the reduced domestic-continuity variant."
 OSE_snp_appropriations_service_1_cancel:0 "End: Reconcile Receiving Returns"
 OSE_snp_appropriations_service_1_cancel_desc:0 "Stop this specific receiving period. Delivered time and spent resources remain in the record; incomplete work receives no review credit."
