l_english:
 recta.1.t:0 "The Question of Recta"
 recta.1.d:0 "Rectan regional leaders have pressed their long-standing case for independence once more. With the Belkan forces withdrawing from the land, the government has agreed to let Recta declare its own state, while both sides promise to keep the close ties that have always bound Gebet and Recta together."
 recta.1.a:0 "Let Recta go its own way."

 ### FOCUSES, IDEAS AND TOOLTIPS (Continental War round) ###
 REC_consolidate_the_republic:0 "Consolidate the Republic"
 REC_consolidate_the_republic_desc:0 "Recta has its own state at last. Before anything else, the new institutions must be made to work inside the borders we already hold.\n\n§gMod provenance and provisional gameplay.§!"
 REC_local_recovery_programme:0 "Local Recovery Programme"
 REC_local_recovery_programme_desc:0 "Once the local settlement after the war is resolved, recovery can begin in earnest. This programme builds on the choice made in our first postwar administration briefing.\n\n§gProvisional gameplay.§!"
 REC_state_administration:0 "State Administration"
 REC_state_administration_desc:0 "Ministries, roads and offices have to be built for a state that was a province until recently.\n\n§gProvisional gameplay.§!"
 REC_close_ties_with_gebet:0 "Close Ties with Gebet"
 REC_close_ties_with_gebet_desc:0 "Recta and Gebet promised to keep the ties that have always bound them. We keep that promise.\n\n§gProvisional gameplay.§!"
 REC_independent_course:0 "An Independent Course"
 REC_independent_course_desc:0 "Friendship with Gebet does not mean dependence. Recta will chart its own course.\n\n§gProvisional gameplay.§!"
 REC_hardline_communism:0 "Hardline Communism"
 REC_hardline_communism_desc:0 "The party will hold the young republic together through discipline and central control.\n\n§gProvisional gameplay.§!"
 REC_reform_communism:0 "Reform Communism"
 REC_reform_communism_desc:0 "Elected councils and limited market reforms will give the republic broader support.\n\n§gProvisional gameplay.§!"
 REC_gebet_economic_compact:0 "Gebet Economic Compact"
 REC_gebet_economic_compact_desc:0 "A reconstruction and relief compact with Gebet pools scarce resources across the border.\n\n§gProvisional gameplay.§!"
 REC_rectan_border_guard:0 "Rectan Border Guard"
 REC_rectan_border_guard_desc:0 "A border guard of our own is the first sign of a state that can stand alone.\n\n§gProvisional gameplay.§!"
 REC_party_security_organs:0 "Party Security Organs"
 REC_party_security_organs_desc:0 "The security organs of the party are rebuilt to protect the republic from its enemies, real and imagined.\n\n§gProvisional gameplay.§!"
 REC_economic_councils:0 "Economic Councils"
 REC_economic_councils_desc:0 "Factory and district councils are given real authority over local production.\n\n§gProvisional gameplay.§!"
 REC_fato_partnership:0 "Partnership with FATO"
 REC_fato_partnership_desc:0 "Our neighbours in FATO faced the same war. Closer co-operation serves us both.\n\n§gProvisional gameplay.§!"
 REC_fato_distance:0 "Keep FATO at Arm's Length"
 REC_fato_distance_desc:0 "Recta will be cordial with FATO but bound by no commitments.\n\n§gProvisional gameplay.§!"
 REC_party_discipline_idea:0 "Party Discipline"
 REC_party_discipline_idea_desc:0 "The party enforces strict discipline across the young republic. Provisional gameplay."
 REC_council_reform_idea:0 "Council Reforms"
 REC_council_reform_idea_desc:0 "Elected councils share power with the party and local managers. Provisional gameplay."
 REC_local_settlement_resolved_tt:0 "Any pending local settlement decision has been completed"
 rec_postwar_consolidation_focus:0 "Rectan Consolidation"
 rec_postwar_consolidation_focus_desc:0 "Recta's postwar consolidation inside the states it already holds."
