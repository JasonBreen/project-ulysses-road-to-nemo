l_english:

 ac_belkan_campaign:0 "Belkan Campaign"
 ac_belkan_campaign_desc:0 "Provisional campaign systems for the 1991 Belkan opening and its postwar handoff. These mechanics preserve alternate outcomes without asserting an official chronology."
 ac_postwar_continuation:0 "Postwar Continuation"
 ac_postwar_local_settlement:0 "Local Settlement"
 ac_belkan_postwar:0 "Belkan Postwar Continuation"
 ac_belkan_postwar_desc:0 "A provisional postwar focus tree for classified, known, and unresolved Belkan War outcomes."

 ac_belkan_prewar_briefing:0 "Brief the Cabinet"
 ac_belkan_prewar_briefing_desc:0 "Bring the cabinet, industry, logistics staff, and security apparatus into a common prewar planning process."
 ac_belkan_industrial_mobilization:0 "Industrial Mobilization"
 ac_belkan_industrial_mobilization_desc:0 "Prepare factories and procurement offices for a crisis without declaring that the archive specifies a single historical mobilization plan."
 ac_belkan_logistics_network:0 "Map the Logistics Network"
 ac_belkan_logistics_network_desc:0 "Prioritize the transport and supply routes needed for a sustained campaign."
 ac_belkan_security_mandate:0 "Issue a Security Mandate"
 ac_belkan_security_mandate_desc:0 "Expand emergency authority to protect the state while accepting the political cost of tighter security."
 ac_belkan_ultimatum:0 "The Ultimatum"
 ac_belkan_ultimatum_desc:0 "Convert preparations into a final diplomatic demand. The branch remains a gameplay abstraction around the existing Belkan War start."
 ac_belkan_council_mandate:0 "Mandate the War Council"
 ac_belkan_council_mandate_desc:0 "Give the war council a defined political mandate before the existing war-start event is called."

 ac_postwar_reconstruction:0 "Reconstruction Program"
 ac_postwar_reconstruction_desc:0 "Begin a provisional recovery program after the existing Belkan War outcome handoff."
 ac_postwar_recovery_budget:0 "Fund Recovery"
 ac_postwar_recovery_budget_desc:0 "Shift limited capacity toward rebuilding and restore one industrial project."
 ac_postwar_demobilization:0 "Demobilize the Emergency State"
 ac_postwar_demobilization_desc:0 "Reduce wartime pressure and convert the emergency establishment into a more stable postwar administration."
 ac_postwar_victory_settlement:0 "Ratify the Victory Settlement"
 ac_postwar_victory_settlement_desc:0 "Consolidate the victory or narrow-peace branch selected by the existing outcome flags."
 ac_postwar_defeat_settlement:0 "Ratify the Defeat Settlement"
 ac_postwar_defeat_settlement_desc:0 "Consolidate a post-defeat settlement while leaving the specific future political path open."
 ac_postwar_victory_legacy:0 "Write the Victory Legacy"
 ac_postwar_victory_legacy_desc:0 "Turn the selected victory settlement into a durable civic narrative. This is provisional gameplay content."
 ac_postwar_defeat_legacy:0 "Survive the Defeat"
 ac_postwar_defeat_legacy_desc:0 "Build a survivable state after defeat, with the long-term political direction left to future authored content."
 ac_postwar_unclassified_settlement:0 "Stabilize the Unclassified Settlement"
 ac_postwar_unclassified_settlement_desc:0 "Stabilize the state when the archive does not identify a supported victory or defeat outcome."
 ac_postwar_unclassified_legacy:0 "Preserve Administrative Continuity"
 ac_postwar_unclassified_legacy_desc:0 "Carry an unresolved postwar handoff forward without inventing a definitive historical outcome."

 ac_belkan_war_council:0 "Convene the War Council"
 ac_belkan_war_council_desc:0 "Start the existing Belkan War event chain after the new prewar preparation branch is complete."
 ac_belkan_logistics_requisition:0 "Requisition for the Front"
 ac_belkan_logistics_requisition_desc:0 "Choose a high-tax supply drive for the opening phase of the war."
 ac_belkan_civilian_reserve:0 "Protect the Civilian Reserve"
 ac_belkan_civilian_reserve_desc:0 "Choose basic services and domestic stability over the most aggressive opening requisitions."
 ac_belkan_front_command:0 "Establish Front Command"
 ac_belkan_front_command_desc:0 "Consolidate operational planning as the war develops."
 ac_belkan_endurance_program:0 "Commit to Endurance"
 ac_belkan_endurance_program_desc:0 "Accept the political cost of a longer war in exchange for additional national endurance."
 ac_postwar_ratify_victory:0 "Ratify the Postwar Contract"
 ac_postwar_ratify_victory_desc:0 "Record the selected victory settlement and close the provisional reconstruction contract."

 ac_prewar_cabinet:0 "Prewar Cabinet"
 ac_prewar_cabinet_desc:0 "A provisional planning cabinet coordinates the opening campaign."
 ac_industrial_preparations:0 "Industrial Preparations"
 ac_industrial_preparations_desc:0 "Preparatory work improves the state's ability to absorb wartime disruption."
 ac_frontline_logistics:0 "Frontline Logistics"
 ac_frontline_logistics_desc:0 "A focused logistics staff prepares the country for sustained operations."
 ac_security_mandate:0 "Security Mandate"
 ac_security_mandate_desc:0 "Emergency security powers improve war readiness at a political cost."
 ac_war_supply_drive:0 "War Supply Drive"
 ac_war_supply_drive_desc:0 "High-tax wartime procurement prioritizes military supply over civilian comfort."
 ac_war_civilian_reserve:0 "Civilian Reserve"
 ac_war_civilian_reserve_desc:0 "A protected civilian reserve trades some military momentum for social stability."
 ac_war_front_command:0 "Front Command"
 ac_war_front_command_desc:0 "A unified front command improves planning during the middle phase of the war."
 ac_war_endurance:0 "War Endurance"
 ac_war_endurance_desc:0 "The state commits to sustaining the war despite accumulating political strain."
 ac_postwar_civic_legacy:0 "Civic Victory Legacy"
 ac_postwar_civic_legacy_desc:0 "The victory settlement is remembered through a provisional civic narrative."
 ac_postwar_survivor_state:0 "Survivor State"
 ac_postwar_survivor_state_desc:0 "The defeated state prioritizes survival and administrative continuity."
 ac_postwar_wacht_settlement:0 "Narrow Peace Settlement"
 ac_postwar_wacht_settlement_desc:0 "Consolidate the narrow-peace branch selected by the existing outcome flags."
 ac_postwar_occupation_burden:0 "Occupation Administration Burden"
 ac_postwar_occupation_burden_desc:0 "The selected settlement imposes a temporary administrative burden on the occupying government."
 ac_postwar_guarantor:0 "Peace Guarantor's Burden"
 ac_postwar_guarantor_desc:0 "Enforcing the settlement carries a temporary political and administrative burden."

 ac_campaign.1.t:0 "The Cabinet Briefing"
 ac_campaign.1.d:0 "The cabinet now has a shared brief for a possible crisis. The archive establishes the campaign context, while this preparation sequence is provisional gameplay content."
 ac_campaign.1.a:0 "Set the work in motion."
 ac_campaign.2.t:0 "Industry on Alert"
 ac_campaign.2.d:0 "Industrial preparation has begun. The choice improves readiness but does not decide the war's eventual outcome."
 ac_campaign.2.a:0 "Authorize the preparations."
 ac_campaign.3.t:0 "The Logistics Map"
 ac_campaign.3.d:0 "The logistics staff has identified the routes that must remain usable if the campaign expands."
 ac_campaign.3.a:0 "Keep the routes open."
 ac_campaign.4.t:0 "The Security Mandate"
 ac_campaign.4.d:0 "Emergency security powers are available. They may improve readiness, but the political cost will be visible."
 ac_campaign.4.a:0 "Issue the mandate."
 ac_campaign.5.t:0 "The Final Demand"
 ac_campaign.5.d:0 "The cabinet has converted preparation into a final demand. What follows uses the archive's existing war-start path."
 ac_campaign.5.a:0 "Send the demand."
 ac_campaign.6.t:0 "A Mandate for War"
 ac_campaign.6.d:0 "The war council has a political mandate. The final decision to enter the existing war chain remains in the player's hands."
 ac_campaign.6.a:0 "Prepare the council."
 ac_campaign.20.t:0 "Requisition for the Front"
 ac_campaign.20.d:0 "The opening phase demands a choice: prioritize a high-tax supply drive or preserve a civilian reserve."
 ac_campaign.20.a:0 "Supply the front at any cost."
 ac_campaign.21.t:0 "Protect the Civilian Reserve"
 ac_campaign.21.d:0 "Domestic stability can be protected while the front is supplied more cautiously."
 ac_campaign.21.a:0 "Keep the reserve intact."
 ac_campaign.22.t:0 "Front Command Consolidated"
 ac_campaign.22.d:0 "The campaign has reached the stage where operational coordination matters more than a single opening surge."
 ac_campaign.22.a:0 "Unify the front command."
 ac_campaign.23.t:0 "The Endurance Program"
 ac_campaign.23.d:0 "The war has become a test of endurance. Sustaining it will carry a political cost even if the front remains viable."
 ac_campaign.23.a:0 "Endure."
 ac_campaign.30.t:0 "Reconstruction Begins"
 ac_campaign.30.d:0 "The Belkan War outcome has handed the country into a provisional reconstruction arc. The next focuses turn that handoff into gameplay."
 ac_campaign.30.a:0 "Begin the recovery."
 ac_campaign.31.t:0 "A Victory Settlement"
 ac_campaign.31.d:0 "The selected victory branch now has a political settlement. Its long-term meaning remains an authored gameplay path rather than a claim about official history."
 ac_campaign.31.a:0 "Record the settlement."
 ac_campaign.32.t:0 "A Defeat Settlement"
 ac_campaign.32.d:0 "The defeat branch now has a political settlement. The state survives, but future development remains open for later content."
 ac_campaign.32.a:0 "Accept the settlement."
 ac_campaign.33.t:0 "The Victory Legacy"
 ac_campaign.33.d:0 "The victory branch has produced a civic legacy. This is a provisional gameplay outcome for the continuation."
 ac_campaign.33.a:0 "Remember and rebuild."
 ac_campaign.34.t:0 "The Survivor State"
 ac_campaign.34.d:0 "The defeated state has consolidated enough continuity to move beyond the immediate settlement."
 ac_campaign.34.a:0 "Survive and continue."
 ac_campaign.35.t:0 "An Unclassified Settlement"
 ac_campaign.35.d:0 "The archive does not identify a supported victory or defeat branch for this handoff. The continuation records a neutral settlement and keeps the future path open."
 ac_campaign.35.a:0 "Stabilize what remains."
 ac_campaign.36.t:0 "Administrative Continuity"
 ac_campaign.36.d:0 "The unresolved branch has preserved enough continuity to move beyond the immediate settlement without asserting an invented canon outcome."
 ac_campaign.36.a:0 "Keep the record open."
