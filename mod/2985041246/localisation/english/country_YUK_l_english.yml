l_english:

 ### PARTIES ###

 ### IDEAS ###
 yuk_top_heavy_command_structure: "Top-Heavy Command Structure"
 yuk_top_heavy_command_structure_desc: "The Yuktobanian Army places a great emphasis on strictly following the chain of command, with a culture discouraging individual unit officers from taking initiative in battles without express orders from the more experienced and higher-ranking generals and field marshals."
 
 ### FOCUSES ###

 
 ### EVENTS ###
 yuktobania_fp.1.t: "The Belkan War"
 yuktobania_fp.1_desc: "War has broken out on the Osean continent between the Belkan Federation and the Osean Federation. Though the Oseans are out primary geopolitical rival, the Belkans are no angels either. They are, objectively, more diametrically opposed to us politically after all.\n\nIf we do not intervene, it would, at best for us, result in both Dinsmark and Oured bloodying their noses while we grow our strength. At worst for us, the Belkans win a decisive victory and we have a new geostrategic rival to deal with. One far more militarist and nationalistic than even the most hawkish Osean.\n\nIf we intervene, it will result in Yuktobania boots on the ground and pilots in the air in Osea. It will cost us a lot of resources but could result in a strong showing of Yuktobanian military prowess along with lowering the chance of a Belkan victory. However, if the Oseans lose anyway, it would be a great embarassment for us and we will have to deal with a strong Belka."
 yuktobania_fp.1.a: "Intervention is worth the risk"
 yuktobania_fp.1.b: "Let them bleed each other dry"

 ### FOCUSES, IDEAS AND TOOLTIPS (Continental War round) ###
 yuk_reform_focus:0 "Yuktobanian Army Reform"
 yuk_reform_focus_desc:0 "Yuktobania's army reform and Arkbird co-operation through 2005."
 YUK_review_the_command_structure:0 "Review the Command Structure"
 YUK_review_the_command_structure_desc:0 "In the Yuktobanian Army a battalion does not move until the order comes down from above, and the order does not come down until every desk above it has signed. It has served the army well in parades and less well in exercises.\n\nThe General Staff appoints a review board of colonels and staff officers. They read after-action reports from a dozen years of manoeuvres, interview company commanders and time how long it takes a field request to reach a decision. Their findings will shape the army for a generation.\n\n§gMod provenance and provisional gameplay.§!"
 YUK_lessons_of_the_intervention:0 "Lessons of the Intervention"
 YUK_lessons_of_the_intervention_desc:0 "Our volunteers came home from the Belkan War with medals, scars and notebooks. Their reports fill a basement archive at the General Staff academy.\n\nThe analysts find a pattern. Where our officers were allowed to act on their own judgement, they did well. Where they waited for orders from a distant headquarters, they lost time, ground and men. The question is whether the army will listen.\n\n§gProvisional gameplay.§!"
 YUK_army_reform_commission:0 "Army Reform Commission"
 YUK_army_reform_commission_desc:0 "We kept our soldiers out of the Belkan War and watched it from a distance, through attaché reports, broadcasts and satellite photographs. Now the promised commission on army reform can begin its work.\n\nIts members are drawn from every service and every rank above major. They study how the Osean and Belkan armies fought, where their chains of command broke and where they held, and they draft a plan to make our own army faster to act without making it less disciplined.\n\n§gProvisional gameplay.§!"
 YUK_arkbird_debris_talks:0 "Arkbird Debris Talks"
 YUK_arkbird_debris_talks_desc:0 "The fragments of Ulysses are still falling, and the orbits above every nation are crowded with debris. Osea proposes converting its Arkbird aircraft into a platform for clearing that debris, and invites Yuktobanian engineers to take part.\n\nIn the foreign ministry the old rivals debate whether to accept. The arguments for refusal are familiar. The argument for acceptance is simpler: the sky falls on Yuktobania too.\n\n§YOfficial:§! Osea and Yuktobania co-operated to convert the Arkbird for debris clearing on 8 October 1999 (ACES Chronicle, 1999 / 10.08). The effects are provisional gameplay."
 YUK_expeditionary_staff_college:0 "Expeditionary Staff College"
 YUK_expeditionary_staff_college_desc:0 "Officers who served abroad are given a wing of the staff academy and a mandate to teach. Their classes are full of maps of foreign terrain, supply tables and case studies written from their own notebooks.\n\nStudents learn how to fight far from home, how to work with allies who speak another language and how to make decisions when the radio is silent.\n\n§gProvisional gameplay.§!"
 YUK_volunteer_veterans:0 "Volunteer Veterans"
 YUK_volunteer_veterans_desc:0 "The volunteers who returned from the war are scattered across garrisons that never saw combat. The General Staff gathers them into training cadres and sends them back out to teach.\n\nRecruits listen differently to an instructor who has been shot at. Within a year, the cadres have changed the tone of training in half the army's divisions.\n\n§gProvisional gameplay.§!"
 YUK_delegate_field_initiative:0 "Delegate Field Initiative"
 YUK_delegate_field_initiative_desc:0 "The commission's first recommendation is the hardest for the old generals to accept: field officers will be trusted to act on their own judgement within the intent of their orders.\n\nNew field manuals are printed and distributed. Company commanders are tested in exercises where the radio goes quiet on purpose, and promotions begin to reward initiative instead of obedience alone.\n\n§gProvisional gameplay.§!"
 YUK_combined_arms_exercises:0 "Combined Arms Exercises"
 YUK_combined_arms_exercises_desc:0 "On the training ranges the army and air force hold their largest joint exercises in years. Tank companies call in air support directly instead of routing the request through three headquarters.\n\nMistakes are made, aircraft are late and a bridge is captured by the wrong side. The umpires record it all, and the next exercise goes better.\n\n§gProvisional gameplay.§!"
 YUK_arkbird_debris_programme:0 "Arkbird Debris Programme"
 YUK_arkbird_debris_programme_desc:0 "Yuktobanian engineers join the Osean programme to adapt the Arkbird for debris clearing. They arrive with their own instruments, their own interpreters and a long list of conditions from the foreign ministry.\n\nThe work is strictly civil: tracking fragments, planning intercept paths and clearing the orbits that both nations' satellites depend on. For the engineers who share a hangar and a canteen, the rivalry of their governments feels very far away.\n\n§YOfficial:§! ACES Chronicle, 1999 / 10.08. The effects are provisional gameplay."
 YUK_expeditionary_command:0 "Expeditionary Command"
 YUK_expeditionary_command_desc:0 "The lessons of the intervention are written into regulation. The top-heavy command structure is retired, and a new expeditionary command takes its place, built around officers who have learned to fight far from home.\n\nThe old generals grumble at the retirement parade. The younger officers keep their notebooks open.\n\n§gProvisional gameplay.§!"
 YUK_reformed_field_command:0 "Reformed Field Command"
 YUK_reformed_field_command_desc:0 "The commission's reforms become law. The top-heavy command structure is replaced by a field command in which battalion and regiment commanders decide within the intent of their orders.\n\nStaff officers who once spent their days signing requests now spend them planning. The army moves faster, and it still marches in step.\n\n§gProvisional gameplay.§!"
 YUK_orbital_debris_tracking:0 "Orbital Debris Tracking"
 YUK_orbital_debris_tracking_desc:0 "A new radar station rises on a hilltop outside the capital, its dish turning slowly against the night sky. Its operators track the fragments the Arkbird must clear and pass their data to the joint programme.\n\nEvery night the screen shows the same thing: hundreds of small points of light moving across the dark. Every week there are a few less.\n\n§gProvisional gameplay.§!"
 YUK_army_reform_complete:0 "Army Reform Complete"
 YUK_army_reform_complete_desc:0 "The reform programme is complete. The new structure is in place, the field manuals have been reprinted and a new arms works opens to equip the units that need it most.\n\nAt the closing session of the commission, the chairman reads a short statement: the army that marches past the reviewing stand this year is not the army that marched past it a decade ago.\n\n§gProvisional gameplay.§!"
 YUK_civil_space_cooperation:0 "Civil Space Co-operation"
 YUK_civil_space_cooperation_desc:0 "Years of working side by side in the debris programme have built something the diplomats did not expect: habit. Engineers phone their counterparts across the ocean without asking permission first, and joint papers appear in technical journals.\n\nThe governments remain rivals. But for now, above the clouds, they are colleagues.\n\n§gProvisional gameplay.§!"
 yuk_expeditionary_command:0 "Expeditionary Command"
 yuk_expeditionary_command_desc:0 "Officers who served in the Belkan War intervention now shape how the army plans and fights. Training and doctrine are built around operating far from home.\n\n§gProvisional gameplay.§!"
 yuk_reformed_field_command:0 "Reformed Field Command"
 yuk_reformed_field_command_desc:0 "Field officers may now take the initiative within the intent of their orders. Staff work is spent on planning instead of signatures.\n\n§gProvisional gameplay.§!"
 yuk_arkbird_partnership:0 "Arkbird Partnership"
 yuk_arkbird_partnership_desc:0 "Yuktobania takes part in the Osean programme to use the Arkbird for orbital debris clearing. Its engineers share hangars, data and canteens with their old rivals.\n\n§YOfficial:§! ACES Chronicle, 1999 / 10.08. The modifiers are provisional gameplay."
 YUK_intervened_tt:0 "We intervened in the Belkan War"
 YUK_belkan_war_over_tt:0 "The Belkan War is over"
 YUK_stood_aside_tt:0 "We stayed out of the Belkan War, and either chose not to intervene or the war has ended"
