l_english:
 ac_sp_excalibur:0 "Excalibur Hardening Programme"
 ac_sp_excalibur_desc:0 "The tower stands above the Belkan lowlands like a needle driven into the sky. Its chemical laser was conceived under the ballistic-missile-defence programme begun in 1981, and on 23 December 1994 the engineers declared it complete (ACES Chronicle, 1994 / 12.23; Super Weapons, Excalibur). The defence ministry has since learned that completion is not the same as readiness.\n\nEvery firing cycle leaves the relay mirrors scorched and the coolant lines straining. Technicians at the base of the tower log each discharge by hand, and the maintenance reports reaching the ministry grow longer every week. Officers of the air-defence command want the tower to fire more often. The engineers want time to rebuild what each shot burns away.\n\nThe hardening programme is the compromise: shielded optics, reinforced power feeds and a rebuilt cooling plant, all fitted while the tower stays on watch. If it succeeds, Excalibur will hold the sky above Belka for longer than its designers ever promised.\n\n§YProvisional gameplay§!: the tower itself was raised by our national focus (mod provenance). This programme and its reward values are balance choices."

§YProvisional gameplay§!: reward values are balance placeholders."
 ac_sp_v2:0 "Project V2"
 ac_sp_v2_desc:0 "Deep inside the Belkan defence establishment lies a plan that no minister names aloud in open session. Its files carry a single designation, V2. They describe a mass-retaliation weapon, meant for the day the nation's other defences have failed.\n\nThe secret will not stay buried. Belka's V2 mass-retaliation plans came to light on 17 May 1995, and the V2 launch facilities at Avalon Dam were attacked on 31 December 1995 (ACES Chronicle, 1995 / 05.17 and 12.31). The window is closing: the programme must be finished before the end of 1995, or not at all.\n\nIn the launch halls, officers drill countdowns against stopwatches while engineers argue over warhead integration and guidance tolerances. Requisitions arrive stamped with priorities that outrank everything else in the national budget. Few of the people working on the project speak about what the weapon is for.\n\nCompleting the programme records it for later content. It does not change the existing nuclear-strike chain. §YProvisional gameplay§!: reward values are balance placeholders."

This project records its completion for later content; it does not change the existing nuclear-strike chain.

§YProvisional gameplay§!: reward values are balance placeholders."
 ac_sp_stonehenge:0 "Stonehenge Turret Network"
 ac_sp_stonehenge_desc:0 "On 20 April 1996 the FCU announced that the asteroid Ulysses would strike Earth (ACES Chronicle, 1996 / 04.20). From that day the question in every ministry was no longer whether the fragments would fall, but how many could be stopped before they did.\n\nThe FCU's answer is Stonehenge: eight railguns in a desert region of neutral San Salvacion, built by an FCU-led international project to destroy fragments of Ulysses before they reach the ground (Super Weapons, Stonehenge). Survey teams mark firing positions in the sand. Convoys haul barrel sections across the desert by night to spare the crews the heat. Partner governments send engineers and money in proportions their finance ministers dispute at every meeting.\n\nThe schedule has one date that matters. The batteries were completed on 19 June 1998 (ACES Chronicle, 1998 / 06.19), and every month of delay is a month in which the sky is undefended. Site managers count the days in the margins of their progress reports.\n\nIts builders measure success in fragments destroyed and cities spared. §YProvisional gameplay§!: the opening date, duration and reward values are balance choices."

§YProvisional gameplay§!: the opening date, duration and reward values are balance choices."
 ac_sp_arkbird:0 "Arkbird Debris-Clearing Conversion"
 ac_sp_arkbird_desc:0 "On 8 July 1999 Ulysses passed Earth's Roche limit (ACES Chronicle, 1999 / 07.08). In the months that followed, low orbit became a hazard: debris crowded the paths of satellites and launches, and tracking stations logged new objects faster than they could catalogue them.\n\nOsea's answer is the Arkbird, the great aircraft built to fly at the edge of space. On 8 October 1999 Osea and Yuktobania began working together to convert it into a platform for clearing that debris (ACES Chronicle, 1999 / 10.08). Engineers strip out equipment, fit collection and tracking systems, and rehearse rendezvous procedures in simulators until they become routine.\n\nMission controllers from both nations share the control rooms, and the work moves only as fast as the two delegations can reconcile their procedures. This is a civilian, unarmed conversion: no weapon is fitted and none is planned. When Yuktobania joins the work in earnest, the joint crews earn a co-operation bonus.\n\nThe Arkbird's later weaponisation belongs to another decade and is out of scope. §YProvisional gameplay§!: reward values are balance placeholders."

§YProvisional gameplay§!: reward values are balance placeholders."
 ac_sp_megalith:0 "Megalith"
 ac_sp_megalith_desc:0 "Erusean planners have a name for the fortress they mean to build: Megalith, a stronghold made to bring down the fragments of Ulysses that still circle the world (ACES Chronicle, Super Weapons, Megalith).\n\nNo construction date has ever been published. What the planners can show is survey maps, excavation schedules and requests for steel and concrete on a scale no treasury would approve in peacetime. The Continental War changes that arithmetic.\n\nEngineers work in shifts under floodlights, cutting launch silos into the rock, while staff officers press for the day the fortress can be declared operational. Above the site the sky is still crowded with debris, and every clear night is a reminder of why the fortress is being built.\n\n§YProvisional gameplay§!: the programme opens once the Continental War begins, and its timing and rewards are balance choices."

§YProvisional gameplay§!: the programme opens once the Continental War begins, and its timing and rewards are balance choices."
 ac_sp_rhongomyniad:0 "Project Rhongomyniad"
 ac_sp_rhongomyniad_desc:0 "The war is over, and Belka has won it. In the halls of the victorious state, the Tower of Excalibur is no longer talked about as a defence. It is talked about as a beginning.\n\nProject Rhongomyniad was promised by the national focus that bears its name: a long programme to raise the tower to unprecedented power, carried out in secrecy where possible and in open conflict where not. Engineers who hardened Excalibur are recalled to the site. Orders for power-plant components and optical assemblies pass through the ministries without explanation.\n\nOfficers who tour the tower come back quieter than they left. Diplomats abroad are told to deny that anything is under way, and to keep their answers short.\n\n§YProvisional gameplay§! (mod provenance: the Belkan-victory focus tree). This is not an official ACE COMBAT weapon or event."

§YProvisional gameplay§! (mod provenance: the Belkan-victory focus tree). This is not an official ACE COMBAT weapon or event."
 ac_sp_excalibur_reward_mirror_relays:0 "Relay Mirror Trials"
 ac_sp_excalibur_reward_mirror_relays_desc:0 "The test log is blunt: the tower's relay mirrors lose alignment after every sustained discharge, and each realignment costs days. A team of optics engineers proposes accelerated trials, cycling the mirrors under full load until the failure points show themselves.\n\nThe tower's senior engineers object. Rushed trials will burn through spares the factories cannot yet replace. Shielding the optics first is slower, but safer. The defence ministry must decide which risk it would rather carry."
 ac_sp_excalibur_reward_mirror_relays_accelerate:0 "Rush the trials"
 ac_sp_excalibur_reward_mirror_relays_shielding:0 "Shield the optics first"
 ac_sp_v2_reward_launch_sites:0 "Launch Site Layout"
 ac_sp_v2_reward_launch_sites_desc:0 "Before a single warhead is fitted, the launch sites have to be settled. The planners put two layouts before the ministry. One disperses the launchers across many smaller sites that are harder to find and harder to strike. The other concentrates them in a single hardened site built to survive whatever is thrown at it.\n\nThe officers favour dispersal. The engineers point out that every extra site multiplies the cables, crews and secrets that must be kept."
 ac_sp_v2_reward_launch_sites_dispersed:0 "Disperse the launchers"
 ac_sp_v2_reward_launch_sites_hardened:0 "Harden a single site"
 ac_sp_stonehenge_reward_international_crews:0 "International Crews"
 ac_sp_stonehenge_reward_international_crews_desc:0 "Partner governments have offered engineers to the turret project, and they arrive with their own tools, their own standards and their own reporting lines back home. The site managers in San Salvacion could pool every crew into a single workforce: faster, but harder to account for.\n\nOr the national crews could keep their own sectors and schedules. That is slower, but every partner can see exactly what its money has bought."
 ac_sp_stonehenge_reward_international_crews_pooled:0 "Pool the crews"
 ac_sp_stonehenge_reward_international_crews_national:0 "Keep national crews"
 ac_sp_arkbird_reward_yuktobanian_crews:0 "Yuktobanian Crews"
 ac_sp_arkbird_reward_yuktobanian_crews_desc:0 "Yuktobanian specialists have arrived at the conversion site with flight-control software, rendezvous procedures and their own orbital experience. Osean engineers who were expecting observers find colleagues instead.\n\nFolding them into joint crews means rewriting manuals in two languages and reconciling procedures line by line. It will also cut months from the schedule."
 ac_sp_arkbird_reward_yuktobanian_crews_joint:0 "Integrate the joint crews"
 ac_sp_megalith_reward_silo_complex:0 "Silo Complex"
 ac_sp_megalith_reward_silo_complex_desc:0 "The excavation teams have reached bedrock beneath the fortress site. Now the general staff faces the choice the engineers have been dreading. The launch silos can be cut deep, where nothing short of a direct hit can reach them, or built fast and shallow so the fortress is ready sooner.\n\nDeep silos mean more months under floodlights. Fast silos mean a fortress that can be damaged, but one that exists while the war is still being decided."
 ac_sp_megalith_reward_silo_complex_deep:0 "Dig the silos deep"
 ac_sp_megalith_reward_silo_complex_fast:0 "Build them fast"
 ac_sp_rhongomyniad_reward_tower_secrecy:0 "Tower Secrecy"
 ac_sp_rhongomyniad_reward_tower_secrecy_desc:0 "Rhongomyniad cannot stay hidden forever. Foreign intelligence services have noticed the convoys, the power-plant orders and the closed airspace around the tower. The ministers could keep the work covert, at the cost of slower requisitions and an endless supply of cover stories.\n\nOr they could show the world what Belka is building, and let that knowledge do some of a weapon's work."
 ac_sp_rhongomyniad_reward_tower_secrecy_covert:0 "Keep the work covert"
 ac_sp_rhongomyniad_reward_tower_secrecy_open:0 "Show it to the world"
 ac_sp_reward_breakthrough:0 "Engineering Breakthrough"
 ac_sp_reward_breakthrough_desc:0 "A test series the engineers had scheduled as routine beats every prediction. The data is checked twice, then a third time, and the result holds.\n\nThe programme director orders the findings folded into the next prototype at once, and the night shift stays on to start the work."
 ac_sp_reward_breakthrough_option:0 "Exploit the result"
 ac_sp_reward_test_setback:0 "Test Setback"
 ac_sp_reward_test_setback_desc:0 "A prototype fails under load during a full-power test. No one is hurt, but the assembly is ruined and weeks of work go with it.\n\nThe investigation board traces the failure to a component that passed every inspection. The engineers clear the test stand and start again."
 ac_sp_reward_test_setback_option:0 "Rebuild the prototype"
 ac_sp_reward_field_trials_orbital:0 "Orbital Field Trials"
 ac_sp_reward_field_trials_orbital_desc:0 "Trajectory and tracking trials test the team's equipment and procedures under real conditions for the first time. Most of the results are unremarkable.\n\nA few are not, and the engineers who catch them come away sharper than before."
 ac_sp_reward_field_trials_orbital_option:0 "Record the trials"
 ac_sp_reward_field_trials_air_defence:0 "Air-Defence Field Trials"
 ac_sp_reward_field_trials_air_defence_desc:0 "Live tracking trials against target drones test the team's equipment and procedures under real conditions for the first time. Most of the results are unremarkable.\n\nA few are not, and the engineers who catch them come away sharper than before."
 ac_sp_reward_field_trials_air_defence_option:0 "Record the trials"
 ac_sp_reward_field_trials_naval:0 "Naval Field Trials"
 ac_sp_reward_field_trials_naval_desc:0 "Sea trials test the team's equipment and procedures in real weather for the first time. Most of the results are unremarkable.\n\nA few are not, and the engineers who catch them come away sharper than before."
 ac_sp_reward_field_trials_naval_option:0 "Record the trials"
 ac_sp_reward_oversight_review:0 "Oversight Review"
 ac_sp_reward_oversight_review_desc:0 "Officials from the finance ministry arrive at the facility with questions about spending that has outrun every estimate. They want ledgers, contracts and explanations, and they have brought auditors to read them.\n\nThe programme can pay to move faster and argue about the bill later. Or it can open its books and accept the audit, trading time for political goodwill."
 ac_sp_reward_oversight_review_accelerate:0 "Spend more to move faster"
 ac_sp_reward_oversight_review_audit:0 "Accept the audit"
 ac_sp_excalibur_hardened:0 "Hardened Excalibur"
 ac_sp_excalibur_hardened_desc:0 "§YProvisional gameplay§! reward. The completed hardening programme protects the tower and its air-defence role."
 ac_sp_v2_deterrent:0 "V2 Deterrent"
 ac_sp_v2_deterrent_desc:0 "§YProvisional gameplay§! reward. The V2 programme is ready. Its existence weighs on the nation."
 ac_sp_stonehenge_battery:0 "Stonehenge Battery"
 ac_sp_stonehenge_battery_desc:0 "§YProvisional gameplay§! reward. Stonehenge's railguns stand ready to engage falling fragments of Ulysses."
 ac_sp_arkbird_debris_clearing:0 "Arkbird Debris Clearing"
 ac_sp_arkbird_debris_clearing_desc:0 "§YProvisional gameplay§! reward. The Arkbird clears orbital debris left by Ulysses. It carries no weapons."
 ac_sp_arkbird_joint_operations:0 "Joint Arkbird Operations"
 ac_sp_arkbird_joint_operations_desc:0 "§YProvisional gameplay§! reward. Osea and Yuktobania run the Arkbird debris-clearing work together."
 ac_sp_megalith_fortress:0 "Megalith Fortress"
 ac_sp_megalith_fortress_desc:0 "§YProvisional gameplay§! reward. Megalith's silos are ready to engage orbiting fragments of Ulysses."
 ac_sp_rhongomyniad_tower:0 "Tower of Rhongomyniad"
 ac_sp_rhongomyniad_tower_desc:0 "§YProvisional gameplay§! reward. Provisional gameplay: the upgraded tower replaces the hardened Excalibur."
 ac_superweapons:0 "Superweapon Programmes"
 ac_superweapons_desc:0 "Without the special-projects feature, superweapon programmes run as timed decisions. Each one finishes with the same reward as its special project."
 ac_superweapons_programme_started_tt:0 "The programme finishes when this decision expires and grants the same reward as its special project."
