 ac_sq.611.d_base:0 "Milan arranged an inspection of a proposed civilian consignment and set out a single chair on the receiving side of the table. The representative brought a second person, a technician who wanted to test the equipment before anybody signed. Pavel thought the extra examination implied mistrust of Vera's work. Vera fetched another chair. Nadia watched the technician unwrap a connection, compare it with her own notes and ask a question that had not appeared on Milan's form. The question might delay the proposed handover. It might also be the first useful thing anyone had asked about how the equipment would actually be used. Approval beyond this table remained someone else's decision. The respect shown across it did not. Milan looked at the additional chair as though he should have thought of it before."
 ac_sq.611.a:0 "Let the receiver test before signing."
 ac_sq.611.a.reply:0 "Vera welcomes the receiver testing her work. Pavel is less certain why his crew must keep proving its word to every new visitor."
 ac_sq.611.b:0 "Ask her to trust the completed inspection."
 ac_sq.611.b.reply:0 "Pavel appreciates Nadia defending the crew. Vera continues answering the technician privately, trying to keep pride from ending the useful questions."
 ac_sq.612.t:0 "The First Easy Lift"
 ac_sq.612.d_base:0 "Pavel's shoulder no longer stopped him reaching the high shelf. He demonstrated this to Nadia three times before admitting that he had dreaded the movement for months. The medical restrictions had ended; the habit of hiding discomfort had not. Milan was arranging a routine assignment that would give him a familiar place beside the others again. Vera wanted to hear what Pavel himself thought would be a sensible first day. Pavel said he could do whatever they needed. Nadia had heard him offer that sentence so often she nearly accepted it as an answer. Outside the canteen someone was singing the half-remembered song from years before, getting the same words wrong. For a moment she could offer him a place in the group without asking him to prove how much of himself he was willing to spend."
 ac_sq.612.a:0 "Ask Pavel to choose a bounded return."
 ac_sq.612.a.reply:0 "He names a task with an ending, and Milan writes that ending down as carefully as the start."
 ac_sq.612.b:0 "Show confidence by treating him as before."
 ac_sq.612.b.reply:0 "Pavel is relieved to be ordinary again, though Vera notices how quickly the old offer returns."
 ac_sq.613.t:0 "The Bench They Were Losing"
 ac_sq.613.d_base:0 "The borrowed training bench had to go back to the civilian workshop that owned it. Vera had known this for weeks and told nobody because she kept hoping to arrange another place first. Nadia found her taking the apprentice's practice pieces out of its drawers. Pavel offered to ask the owner for an extension. Milan offered to describe the training as more urgent than the owner's ordinary work. Vera stopped packing. The bench had become so familiar that returning a favor now felt like losing something they had earned. She disliked hearing her own resentment in the offers. Nadia picked up a small practice joint marked with several failed attempts. The useful part might travel without the furniture, if Vera could bear to let the next lesson look different from the one she had built."
 ac_sq.613.a:0 "Return the bench and plan with its owner."
 ac_sq.613.a.reply:0 "Vera arranges the return, then admits how painful it is to watch Nadia defend the neighbor when she had hoped for a friend beside her."
 ac_sq.613.b:0 "Ask for more time under a stronger justification."
 ac_sq.613.b.reply:0 "Vera feels her loss has been understood; Milan asks for more time, quietly making their neighbor carry the cost of that reassurance."
 ac_sq.614.t:0 "The Question Asked Three Times"
 ac_sq.614.d_base_callback:0 "A receiving clerk refused to answer Milan's inspection question a fourth time. She had already explained the destination to a driver, a stores worker and someone telephoning from another office. Milan had none of their notes. Pavel heard obstruction; Nadia heard a person being asked to begin again because everyone else's records ended at the edge of a desk. Vera set the equipment down and asked which answer was actually missing. The clerk unfolded three receipts so carefully that the paper was nearly transparent at the creases. Milan looked embarrassed and reached for a fresh form. The room needed a useful record, but not necessarily another clean beginning that made the person across the table carry the full weight of everyone else's incomplete handover.\n\nMilan finds the foreman's signed conditions in an older folder. He knows they remained useful because somebody preserved the wording instead of asking for it again."
 ac_sq.614.d_base:0 "A receiving clerk refused to answer Milan's inspection question a fourth time. She had already explained the destination to a driver, a stores worker and someone telephoning from another office. Milan had none of their notes. Pavel heard obstruction; Nadia heard a person being asked to begin again because everyone else's records ended at the edge of a desk. Vera set the equipment down and asked which answer was actually missing. The clerk unfolded three receipts so carefully that the paper was nearly transparent at the creases. Milan looked embarrassed and reached for a fresh form. The room needed a useful record, but not necessarily another clean beginning that made the person across the table carry the full weight of everyone else's incomplete handover."
 ac_sq.614.a:0 "Reconcile the existing accounts with her."
 ac_sq.614.a.reply:0 "The clerk points out the missing handover, and Milan writes the explanation beside his own name."
 ac_sq.614.b:0 "Insist on one complete fresh declaration."
 ac_sq.614.b.reply:0 "The new form is clear, while Vera listens to the clerk repeating the same weary sentences."
 ac_sq.615.t:0 "The Signature Withheld"
 ac_sq.615.d_base:0 "The civilian receiver declined a proposed handover after finding that its equipment could not be used with the arrangement available at her end. The refusal was narrower than the arguments forming around it. Pavel wanted to defend the crew's effort. Milan wanted a signature showing that the receiver had chosen not to proceed. Vera wanted the incompatibility described before anybody attached blame. Nadia could hear the personal hurt in each voice: hours had been spent, hopes raised, work made visible through a delivery that would not now produce the expected ending. Nobody at the table could settle a national aid policy by being disappointed. They could decide whether a person was allowed to refuse an unsuitable offer without having her refusal turned into evidence against her."
 ac_sq.615.a:0 "Record the incompatibility and respect her refusal."
 ac_sq.615.a.reply:0 "Vera records the incompatibility. Pavel asks Nadia to acknowledge their wasted hopes as plainly as she acknowledges the receiver's right to refuse."
 ac_sq.615.b:0 "Ask her to sign responsibility for the delay."
 ac_sq.615.b.reply:0 "Pavel feels the crew's work has been acknowledged, but the receiver leaves less willing to ask another question."
 ac_sq.616.t:0 "Ready on the Morning Sheet"
 ac_sq.616.d_sanctions_review_callback:0 "The readiness summary omitted a qualification Vera had written beside the flight's available aircraft. The author said the detailed sheets remained attached and everyone who needed them could read them. Pavel argued that the summary was not technically wrong. Nadia recognized the feeling behind his defense: after so much difficult work, it was painful to hand somebody a page that looked like another list of limitations. Milan had a copy already waiting to be carried onward. Vera asked him to put it down until Nadia answered. Nothing about the aircraft changed while they spoke. Only the distance between what a reader would expect and what the crew had actually offered was growing. Nadia remembered receiving the green marker on her first morning, long before she knew whose approval would become difficult to disappoint.\n\nThe latest diplomatic notice confirmed that sanctions remained in force. Milan would not tell callers that every shipment was forbidden, or that a sympathetic officer could simply waive the rules. He asked for the actual decision attached to each refused request. Vera kept those replies beside the serviceability board. A clear account of a shortage was still work worth doing, even when it could not immediately fill a shelf.\n\nThe old receipt for the handleless case is still attached to its equipment record. Its qualification survived because somebody put it where a hurried reader had to see it."
