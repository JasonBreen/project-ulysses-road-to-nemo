 YUK_camp_2_register:0 "The homeland behind the front"
 YUK_camp_2_register_desc:0 "The homeland behind the front. Open the campaign lane and its preparation record.\n\nThe receiving line begins with an officer trying to borrow a pencil. Beyond his table, families wait beside a vehicle that will not start. The invasion has made the distinction between front and rear depend on the hour, and the orderly cannot promise that the same road will be open tomorrow. Supporting the homeland means accepting a burden that does not vanish when the military situation improves. The review distinguishes an actual evacuation effort from a report prepared to reassure a distant ministry."
