 ac_camp.73.t:0 "The two receiving frequencies"
 ac_camp.73.desc:0 "The operators had prepared for confusion. They had not prepared for how moving it would be to hear two services confirm the same instruction without making a threat out of the difference in their accents.\n\nThe mixed-force preparations were complete. The current Yuktobanian command had supplied a receiving arrangement, and the Osean staff had circulated it with the limits intact. The joint effort could therefore use an agreement that existed beyond the hope expressed in a broadcast.\n\nA naval officer asked for confirmation of a unit's position. On the other frequency, his counterpart asked the same question in a different order. The operator waited until both answers could be repeated without contradiction. Men who had spent the war learning to identify a voice as hostile were being asked to recognize it as responsible for an adjoining piece of work.\n\nThe Kestrel's place in the original war record would be remembered alongside the political appeals and the final effort against the network. The current operators had a less complete view. They knew the instructions in front of them, the people who had answered, and the next report they needed to receive before another group of crews could proceed.\n\nNear the end of the watch, someone brought food into the room. The operator covering the second frequency shook his head, listened, and reached for his pencil. The other man left the plate beside him rather than taking it away.\n\nFor the moment, both channels were working. Keeping them that way had become a shared responsibility."
