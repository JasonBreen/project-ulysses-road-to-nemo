 SBK_fsb_civil_charter_desc:0 "Unlock a costed standing civil charter tailored to subject or independent status.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Standing full-mode annual commitment: nominal GDP / 2000, recorded exactly when the standing account is reconciled. Remove it through the campaign review. Legacy and disabled modes retain the political/physical burden without a new cash commitment."
