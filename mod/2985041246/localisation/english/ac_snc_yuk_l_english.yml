 YUK_snc_scientific_custody_civil_spirit:0 "Published scientific receiving method"
 YUK_snc_scientific_custody_civil_spirit_desc:0 "Adopt a civil method whose stated limitations travel with the result. The research office must explain what the examination established and which questions it could not answer. Defending that precision takes political attention when a broader announcement would have sounded more impressive. In return, the method remains useful to domestic researchers without a foreign acceptance. Cooperation can add evidence where its existing record supports it, but an unanswered inquiry remains unanswered. A published account should be clear enough that a later receiving office can use the result without inheriting a promise the scientists never made."
 YUK_snc_scientific_custody_civil_spirit_settled:0 "Published scientific receiving method: Standing Review"
 YUK_snc_scientific_custody_civil_spirit_settled_desc:0 "The standing method retains its selected civil or protected explanation and the burden accepted to sustain it. Improve that practice through the completed review without claiming that every hoped-for exchange occurred. Existing project and partnership records remain authoritative for what they actually established. The domestic receiving method is useful after refusal, interruption, war or a partner's loss of eligibility. Its final account gives a successor enough information to ask a better question without first untangling an invented promise from the scientific work that was genuinely received, examined and kept for the people who will use it next."
 YUK_snc_scientific_custody_protected_spirit:0 "Protected custody examination"
 YUK_snc_scientific_custody_protected_spirit_desc:0 "A protected examination can retain technical detail that cannot be circulated openly, provided its receiving authority and limitations remain signed. Reserve the necessary civilian capacity and accept the resulting opportunity cost. The professional route must preserve the unanswered questions as carefully as the useful findings. It cannot treat an old partnership record as permanent permission to answer for another country, or a completed debris programme as an operating military system. If an exchange is refused or interrupted, the domestic examination continues from the material it actually received and states where the missing answer would have mattered."
 YUK_snc_scientific_custody_protected_spirit_settled:0 "Protected custody examination: Standing Review"
 YUK_snc_scientific_custody_protected_spirit_settled_desc:0 "The standing method retains its selected civil or protected explanation and the burden accepted to sustain it. Improve that practice through the completed review without claiming that every hoped-for exchange occurred. Existing project and partnership records remain authoritative for what they actually established. The domestic receiving method is useful after refusal, interruption, war or a partner's loss of eligibility. Its final account gives a successor enough information to ask a better question without first untangling an invented promise from the scientific work that was genuinely received, examined and kept for the people who will use it next."
 YUK_snc_scientific_custody_public_return_spirit:0 "Open receiving record"
 YUK_snc_scientific_custody_public_return_spirit_desc:0 "Publish the result together with its limit. The receiving staff expect questions about why an answer stops where a previous announcement seemed to continue. They accept the political burden because a method that can be challenged is less likely to be mistaken for an unqualified promise. The account leaves the received cooperative material in its proper place and preserves the unanswered inquiry without treating it as a refusal that nobody actually issued. It supports a later verified exchange, if eligible participants choose one, while remaining a complete domestic practice when no such exchange can be arranged."
 YUK_snc_scientific_custody_staff_return_spirit:0 "Protected professional return"
 YUK_snc_scientific_custody_staff_return_spirit_desc:0 "Retain a professional custody record that follows the actual method and its examination, with a named receiving authority beside each handover. Its protected schedule continues to reserve civilian capacity. The staff agree that the restriction makes it more important to keep the unanswered inquiry in the file. A later officer should be able to distinguish a question that was refused from one that never reached the appropriate recipient. The record can support a new verification channel, but cannot establish another country's present consent or resurrect an earlier programme by repeating the name written on its completed return."
 YUK_snc_scientific_custody_brief:0 "Where the Method Was Received"
 YUK_snc_scientific_custody_brief_desc:0 "A technical method has reached the research office with a covering letter that describes a broader understanding than the attached record can establish. The scientists do not dispute the value of the received work. They dispute the additional promise made in its name. Begin from the existing technical-cooperation settlement and trace which methods were examined domestically, which arrived through an established partnership, and which questions remain unanswered. A completed debris-clearing programme is part of that history. It does not authorize a receiving officer to invent a new capability, an operating commitment or another government's continuing consent."
