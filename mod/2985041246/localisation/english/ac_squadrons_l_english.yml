 ac_sq_sns_cast_elena_neris:0 "Elena Neris"
 ac_sq_sns_cast_elena_neris_desc:0 "Air-defense pilot\n\nElena likes a patrol that ends with nothing to report. She knows how much work is hidden inside that outcome. Serving a small country has taught her that staying out of somebody else's conflict is an active responsibility, not a promise the rest of the world is obliged to respect."
 ac_sq_sns_cast_rafael_caro:0 "Rafael Caro"
 ac_sq_sns_cast_rafael_caro_desc:0 "Wingman\n\nRafael knows the names of the people who bring food to the station and the children who wait by its fence. His confidence comes from those connections. He finds it difficult to accept that a carefully planned withdrawal can sometimes protect them better than staying visibly in place."
 ac_sq_sns_cast_mina_vale:0 "Mina Vale"
 ac_sq_sns_cast_mina_vale_desc:0 "Radio and maintenance lead\n\nMina can make an unreliable radio intelligible, but refuses to call it reliable afterward. She trains the people who will have to work without her and stores copies of instructions where they can actually be found. She considers a second way to reach somebody an ordinary courtesy."
 ac_sq_sns_cast_oren_serra:0 "Oren Serra"
 ac_sq_sns_cast_oren_serra_desc:0 "Civil-defense and radar controller\n\nOren joined expecting to watch a border and found himself answering calls from schools, hospitals and distant observation posts. He has learned to listen before deciding that a weak signal is unimportant. He is less certain what to do when a strong voice tells him to stop listening."
 ac_sq.401.t:0 "Say Your Name Again"
 ac_sq.401.d_base:0 "Oren Serra's first practice transmission vanished after the second syllable. Mina Vale leaned beneath the console, tapped a connector and told him to try again. This time his voice reached the speaker loudly enough to make him wince. Rafael Caro applauded from the doorway. Elena Neris asked what Oren had been trying to say before the equipment interrupted him. 'Only my name.' Mina emerged with dust on one sleeve. 'That is a useful place to start.' Outside the window an aircraft sat motionless beside a service cart; its pilot was here, listening to a young man learn how to be heard. Oren reached for the switch, then hesitated. Elena could make the next attempt a test he had to pass, or the beginning of a conversation they would all need to keep having."
 ac_sq.401.a:0 "Answer him as a colleague."
 ac_sq.401.a.reply:0 "Oren hears his name returned clearly and makes the next call without watching the floor."
 ac_sq.401.b:0 "Run the formal radio check first."
 ac_sq.401.b.reply:0 "Mina records a satisfactory test; Oren rehearses his introduction once more after everyone leaves."
 ac_sq.402.t:0 "The Last Seat on the Bus"
 ac_sq.402.d_base:0 "The school bus smelled of warm vinyl and the oranges a teacher had brought for the civil-protection exercise. Rafael knew three children by name and had promised to sit at the back until the return journey. Elena had been asked to make a brief appearance, wave beside the bus and get back to the station. Then an elderly passenger climbed aboard with a walking frame nobody had included in the seating diagram. The teacher began moving children. Oren, holding the exercise list, counted the available places twice. Rafael looked toward the station road, where a car waited for both pilots. 'We can be photographed leaving,' he said. 'Or somebody can help her find a seat.' The photographer lowered his camera and waited for Elena to decide which part of the visit mattered."
 ac_sq.402.a:0 "Take the return bus with Rafael."
 ac_sq.402.a.reply:0 "The waiting car leaves empty, and Oren changes the exercise list while the passengers watch."
 ac_sq.402.b:0 "Return to station; ask for another helper."
 ac_sq.402.b.reply:0 "The replacement eventually arrives, but Rafael spends the journey explaining why Elena had to go."
 ac_sq.403.t:0 "The Bell That Rang Twice"
 ac_sq.403.d_base_callback:0 "A faulty connection sent the exercise signal through a school speaker after the exercise had finished. Oren was the first voice parents reached, and he used the phrase all clear before he knew what had happened. Mina traced the crossed cable while Elena answered the next telephone. By noon the misunderstanding had become a joke at the station. Rafael began to imitate Oren's solemn reassurance, then stopped when he saw the young controller in the doorway. Oren had written a correction but did not want it sent: another message might frighten people again. Elena understood the wish to let a harmless mistake become yesterday's story. The trouble was that the people outside their fence had not been present when everyone inside agreed it was harmless.\n\nOren looks at Elena rather than the floor this time. 'I would like them to hear it from the person who answered first.'"
 ac_sq.403.d_base:0 "A faulty connection sent the exercise signal through a school speaker after the exercise had finished. Oren was the first voice parents reached, and he used the phrase all clear before he knew what had happened. Mina traced the crossed cable while Elena answered the next telephone. By noon the misunderstanding had become a joke at the station. Rafael began to imitate Oren's solemn reassurance, then stopped when he saw the young controller in the doorway. Oren had written a correction but did not want it sent: another message might frighten people again. Elena understood the wish to let a harmless mistake become yesterday's story. The trouble was that the people outside their fence had not been present when everyone inside agreed it was harmless."
 ac_sq.403.a:0 "Stand beside Oren while he explains."
 ac_sq.403.a.reply:0 "Oren gives the correction with Elena beside him; Rafael worries that a frightened colleague has been made the public face of a broken wire."
 ac_sq.403.b:0 "Send an unsigned technical notice."
 ac_sq.403.b.reply:0 "Mina describes the repair accurately, and Rafael is relieved that Oren can return to work without becoming the incident everyone quotes."
 ac_sq.404.t:0 "A Patrol With Nothing to Report"
 ac_sq.404.d_base:0 "Rafael wanted their uneventful patrol exercise at the chart table described as flawless. Elena said that would require forgetting the instruction he had repeated after losing his place on the route sheet. He accused her of saving every small error for the debrief. She accused him of collecting small errors until they looked like confidence. Mina set two mugs down hard enough to end the exchange. Then she asked which one would help her carry a radio up the tower after lunch. Both volunteered immediately. Halfway up, with Rafael holding the heavier end, Elena began to laugh. He asked whether the debrief would mention that too. From below, Oren called that their open microphone was still transmitting. Neither pilot could see his expression, but they could hear him trying not to laugh with them."
 ac_sq.404.a:0 "Admit the debrief became personal."
 ac_sq.404.a.reply:0 "Rafael admits the missed reference in return, and Mina makes them finish carrying the radio."
 ac_sq.404.b:0 "Keep the argument about flying standards."
 ac_sq.404.b.reply:0 "Rafael accepts the correction, although their easy conversation ends before they reach the top."
 ac_sq.405.t:0 "Mina's Second Copy"
 ac_sq.405.d_base:0 "Mina stored duplicate contact cards in a biscuit tin nobody was allowed to use for biscuits. A visiting clerk thought the arrangement charming until she asked him to find a telephone number with the power off. Elena watched him struggle in the dim workshop. Rafael suggested that the tin should travel with their next exercise team. Mina wanted another copy left with the civilian volunteers instead. Oren worried about handing personal numbers to people outside the station. The cards included a hospital night desk, a bus mechanic and a woman who knew which neighbors could not use the stairs. Elena recognized how much patient asking had gone into the collection. Mina closed the tin and said a spare was only useful if the person who needed it could reach it."
 ac_sq.405.a:0 "Ask permission to share a civilian copy."
 ac_sq.405.a.reply:0 "Mina helps Oren call each contact, turning a useful list into a promise people knowingly make."
 ac_sq.405.b:0 "Keep both copies within the station."
 ac_sq.405.b.reply:0 "The numbers stay protected, while the civilian volunteers continue asking the same first questions."
 ac_sq.406.t:0 "The Heavy Bag"
 ac_sq.406.d_base_callback:0 "At the next assembly exercise, an older woman refused to leave a bag at the collection point. The volunteers explained the weight limit. She explained that the bag held photographs, a heavy coat and the household papers she could not replace. Rafael offered to carry it himself. The offer would solve one difficult conversation and teach everyone watching that an exception required knowing a pilot. Oren held the clipboard without moving his pen. Elena asked Mina what the equipment case beside her weighed. 'Too much,' Mina answered, 'because I packed it for the people I knew would complain if I forgot anything.' The woman sat down on her bag. The exercise timetable continued to advance, impressively indifferent to the person it was supposed to help.\n\nThe woman recognizes Rafael from the bus. 'You stayed last time,' she tells him. 'I thought you might understand why I have brought this.'"
 ac_sq.406.d_base:0 "At the next assembly exercise, an older woman refused to leave a bag at the collection point. The volunteers explained the weight limit. She explained that the bag held photographs, a heavy coat and the household papers she could not replace. Rafael offered to carry it himself. The offer would solve one difficult conversation and teach everyone watching that an exception required knowing a pilot. Oren held the clipboard without moving his pen. Elena asked Mina what the equipment case beside her weighed. 'Too much,' Mina answered, 'because I packed it for the people I knew would complain if I forgot anything.' The woman sat down on her bag. The exercise timetable continued to advance, impressively indifferent to the person it was supposed to help."
 ac_sq.406.a:0 "Find a fair way to divide the load."
 ac_sq.406.a.reply:0 "The queue slows, but Oren learns to ask about a bag before treating it as a number."
 ac_sq.406.b:0 "Let Rafael carry this one privately."
 ac_sq.406.b.reply:0 "She gets her belongings through; the next family must still persuade someone to make an exception."
 ac_sq.407.t:0 "A Notice Nobody Could Read"
 ac_sq.407.d_base:0 "The new preparedness notice was detailed, authoritative and printed in letters too small for the caretaker at the assembly hall to read. He handed it to Elena with an embarrassed joke about needing a pilot's eyes. Oren had spent hours checking every number. He looked wounded when Rafael suggested reading it aloud during the volunteers' evening meeting. Mina pointed to an instruction that depended on a telephone the hall did not possess. The caretaker offered the old loudspeaker and a room where anyone could come with questions. Elena could already imagine an untidy evening of repeated explanations. She could also imagine the neat sheet hanging on a locked door after everyone at the station had agreed that the warning had been delivered."
 ac_sq.407.a:0 "Read it aloud and stay for questions."
 ac_sq.407.a.reply:0 "The questions improve the notice. Rafael stays to help, but asks Elena when the volunteers were going to be allowed their evening back."
 ac_sq.407.b:0 "Print larger copies and finish the round."
 ac_sq.407.b.reply:0 "The caretaker thanks them for the clear letters, keeping his other questions until another visit."
 ac_sq.408.t:0 "The Stronger Voice"
 ac_sq.408.d_base_callback:0 "A weak caller asked about a bus that had not reached its collection point. A much stronger voice then told Oren to keep the channel clear for station traffic. He obeyed, watched the receiver lamp and waited for permission to try again. By the time Elena came into the room he had written the caller's fragment on the back of his own hand. Rafael wanted to confront whoever had interrupted. Mina was already connecting the spare receiver, but refused to make the choice for the young controller. There was no evidence of a disaster, only a missed arrival and a person who had not finished asking. Elena asked Oren whether he remembered the caller's voice. He repeated it so exactly that nobody in the room could mistake it for an unimportant signal.\n\nOne of the contacts who agreed to share her number knows the collection point. Mina places the civilian copy beside Oren's receiver."
 ac_sq.408.d_base:0 "A weak caller asked about a bus that had not reached its collection point. A much stronger voice then told Oren to keep the channel clear for station traffic. He obeyed, watched the receiver lamp and waited for permission to try again. By the time Elena came into the room he had written the caller's fragment on the back of his own hand. Rafael wanted to confront whoever had interrupted. Mina was already connecting the spare receiver, but refused to make the choice for the young controller. There was no evidence of a disaster, only a missed arrival and a person who had not finished asking. Elena asked Oren whether he remembered the caller's voice. He repeated it so exactly that nobody in the room could mistake it for an unimportant signal."
 ac_sq.408.a:0 "Help Oren reopen a separate contact."
 ac_sq.408.a.reply:0 "Oren finishes the interrupted question, while Rafael asks Elena to accept the criticism that may follow instead of leaving it with the youngest voice."
 ac_sq.408.b:0 "Require clearance before another call."
 ac_sq.408.b.reply:0 "Oren waits beside the spare receiver, keeping the fading fragment visible on his hand."
 ac_sq.409.t:0 "Someone Else's Hands"
 ac_sq.409.d_base:0 "Mina let the newest volunteer assemble the portable set without touching it once. Elena found the restraint painful to watch. The young woman connected one lead incorrectly, looked toward Mina and received only a question: what had she expected to hear? Rafael was due at another appointment and suggested a quicker demonstration. Mina asked him how quickly he could demonstrate being available every time the set failed. Oren laughed, then began explaining so eagerly that he almost took the volunteer's place. Elena recognized the urge. It felt generous to do the difficult part for someone; it was harder to remain nearby while another person learned to do it badly. The receiver crackled, went silent, and finally produced a clear unfamiliar voice."
 ac_sq.409.a:0 "Give the volunteer time to finish."
 ac_sq.409.a.reply:0 "Mina leaves her hands on the bench, and the young woman makes the final connection herself."
 ac_sq.409.b:0 "Have Oren demonstrate the difficult steps."
 ac_sq.409.b.reply:0 "The set works before Rafael must leave, but the volunteer asks to repeat the lesson later."
 ac_sq.410.t:0 "At the Fork in the Road"
 ac_sq.410.d_base_callback:0 "Two lines of vehicles met at a road junction where an old exercise sign pointed in the wrong direction. The civilian radio team called the station because drivers recognized the pilots' voices. Elena found a child sitting beside an unattended bag while adults argued about which bus his family had taken. Nobody knew whether the family had traveled onward or was still looking from the other queue. Rafael wanted to carry the child from vehicle to vehicle until someone recognized him. Oren wanted to keep one place where a searching relative could find an answer. Mina took down the old sign before somebody else followed it. A truck driver offered her a sheet of cardboard. Elena had to decide whether their most useful contribution was another urgent search or one dependable point that would remain.\n\nAn assembly volunteer recognizes the family's bag from an earlier exercise. The questions Oren learned to ask now give him a useful description."
 ac_sq.410.d_base:0 "Two lines of vehicles met at a road junction where an old exercise sign pointed in the wrong direction. The civilian radio team called the station because drivers recognized the pilots' voices. Elena found a child sitting beside an unattended bag while adults argued about which bus his family had taken. Nobody knew whether the family had traveled onward or was still looking from the other queue. Rafael wanted to carry the child from vehicle to vehicle until someone recognized him. Oren wanted to keep one place where a searching relative could find an answer. Mina took down the old sign before somebody else followed it. A truck driver offered her a sheet of cardboard. Elena had to decide whether their most useful contribution was another urgent search or one dependable point that would remain."
 ac_sq.410.a:0 "Keep a receiving point and organize the search."
 ac_sq.410.a.reply:0 "Rafael searches while Oren stays with the child, giving every returning person the same place to ask."
 ac_sq.410.b:0 "Search together before the buses leave."
 ac_sq.410.b.reply:0 "Their voices carry through the waiting vehicles, but Mina must explain why the radio point is empty."
 ac_sq.411.t:0 "The Mast on the Ground"
 ac_sq.411.d_base_callback:0 "A spring squall brought down the workshop aerial and sent Mina home with a burned palm from the hurried power isolation. She insisted the portable set was ready. Rafael heard that as reassurance; Elena heard the warning beneath it. Oren found the volunteer Mina had trained and asked her to check his setup. It was an awkward reversal, made worse when someone suggested waiting for the real expert to return. Mina arrived with her hand bandaged and her coat still wet. She had heard the suggestion over the working radio. 'If it needs my hand on it,' she said, lifting the bandage, 'then I have spent years teaching the wrong lesson.' Elena pulled out a chair while the volunteer waited beside a connection she knew was correct.\n\nThe volunteer recognizes the fault before Oren explains it. Mina's slow afternoon of teaching has become time they do not have to lose today."
 ac_sq.411.d_base:0 "A spring squall brought down the workshop aerial and sent Mina home with a burned palm from the hurried power isolation. She insisted the portable set was ready. Rafael heard that as reassurance; Elena heard the warning beneath it. Oren found the volunteer Mina had trained and asked her to check his setup. It was an awkward reversal, made worse when someone suggested waiting for the real expert to return. Mina arrived with her hand bandaged and her coat still wet. She had heard the suggestion over the working radio. 'If it needs my hand on it,' she said, lifting the bandage, 'then I have spent years teaching the wrong lesson.' Elena pulled out a chair while the volunteer waited beside a connection she knew was correct."
 ac_sq.411.a:0 "Let the trained crew run the set."
 ac_sq.411.a.reply:0 "Mina sits down, and Oren asks the volunteer to make the first clear call."
 ac_sq.411.b:0 "Ask Mina to supervise every connection."
 ac_sq.411.b.reply:0 "She stays without complaint, keeping her bandaged hand carefully below the edge of the table."
 ac_sq.412.t:0 "A Voice After Visiting Hours"
 ac_sq.412.d_project_unavailable:0 "Oren's father had begun sleeping through hospital visits. The young controller could still coax him into a few words over a bedside telephone, which made leaving the station's night watch feel less urgent than it was. Elena found Oren listening to a recorded message after the other lines had gone quiet. His father was asking whether the old kitchen clock had been repaired. Oren said he kept meaning to take it in. Rafael volunteered to cover the next watch before anyone asked him. Mina, who had seen how many favors Rafael was already carrying, looked toward Elena. There was enough goodwill in the room for one evening. Whether there was enough honesty to make the arrangement last was a different question.\n\nThe latest bulletin confirmed that Stonehenge had been destroyed. Mina took its old technical contact off the emergency answer list, while preserving the number in the archive. Rafael asked whether removing it looked like giving up. Elena told him that sending a frightened caller to a silent desk was not a form of resolve. They needed a receiving person, not the reassurance of an old line."
 ac_sq.412.d_base:0 "Oren's father had begun sleeping through hospital visits. The young controller could still coax him into a few words over a bedside telephone, which made leaving the station's night watch feel less urgent than it was. Elena found Oren listening to a recorded message after the other lines had gone quiet. His father was asking whether the old kitchen clock had been repaired. Oren said he kept meaning to take it in. Rafael volunteered to cover the next watch before anyone asked him. Mina, who had seen how many favors Rafael was already carrying, looked toward Elena. There was enough goodwill in the room for one evening. Whether there was enough honesty to make the arrangement last was a different question."
 ac_sq.412.a:0 "Arrange shared cover and send Oren now."
 ac_sq.412.a.reply:0 "Rafael takes half the watch and Elena the other half, giving Oren an evening nobody has to buy with another complete night."
 ac_sq.412.b:0 "Accept Rafael's offer of the whole watch."
 ac_sq.412.b.reply:0 "Oren gets his evening; Rafael values Elena trusting his offer, though Mina watches the private tiredness he has not named."
 ac_sq.413.t:0 "An Empty Place by the Fence"
 ac_sq.413.d_cap:0 "Their borrowed communications room had to be vacated by evening. Mina packed the portable set while Oren tried to confirm which civilian contacts knew the new address. Rafael disliked leaving another recognizable door behind. He carried the old station key although nobody in the room could promise when it would open anything for them again. Elena said that continuing the work mattered more than keeping the furniture in one place. He answered that finding the work mattered too. There were no aircraft here to disperse and no claim to control the roads outside. There were people who might still come looking for a familiar voice, and a move that would leave them speaking to an empty room unless somebody stayed long enough to explain."
 ac_sq.413.d_war:0 "Wartime dispersal instructions made the gap by the fence feel like an accusation. Rafael wanted to remain visibly present until every nearby family knew where to ask for help. Elena wanted him to stop measuring protection by whether he personally stood beside the gate. Neither pilot could promise what the wider fighting would do. They could ensure that a moving watch left a usable contact behind. Mina had packed the portable set; Oren had found no confirmed recipient for its new location. Rafael held the old gate key in his fist. 'Tell me who they find after we move,' he said. Elena realized that repeating the order would not answer the question, even when obeying it was necessary."
 ac_sq.413.d_base:0 "The station rehearsed moving aircraft and equipment to an alternate working area. Rafael disliked the quiet space left behind. People who passed the fence knew where to wave; a covered cart and a locked door would look like abandonment. Elena reminded him that a rehearsal was the time to discover which promises depended on a familiar building. He answered that buildings were sometimes how people found the promise at all. Mina asked whether anyone had told the volunteers where the radio team would be. Oren checked the exercise instructions and discovered the answer was no. There was no enemy in this argument, only four people who had spent years making themselves useful in one recognizable place. Rafael held the gate key so tightly that its teeth marked his palm."
 ac_sq.413.a:0 "Make the handover visible before moving."
 ac_sq.413.a.reply:0 "The volunteers receive the new contact. Rafael finds the delay necessary and still resents being told that his own presence is replaceable."
 ac_sq.413.b:0 "Move promptly and explain from the new site."
 ac_sq.413.b.reply:0 "The equipment travels on schedule, while Mina works to reach people still looking for the old door."
 ac_sq.414.t:0 "One More Journey"
 ac_sq.414.d_cap_callback:0 "The civilian transfer was being arranged through contacts scattered beyond the old station's reach. Rafael wanted to accompany the next available journey rather than wait in the borrowed communications room. Elena would not pretend that their uniforms gave them control of the road or access to their former working area. What remained to them was a driver they knew, a receiving person who had answered and Rafael's stubborn offer to go. Mina noticed his shaking coffee before he did. Oren asked whether a trained civilian contact could make the handover instead. Rafael looked betrayed. 'They need somebody who stays,' he said. Elena had to answer the friend in front of her without turning their diminished circumstances into an excuse to spend him without limit.\n\nOren still has the junction's receiving book. He finds a volunteer who once stayed there when everyone else wanted to keep searching."
 ac_sq.414.d_cap:0 "The civilian transfer was being arranged through contacts scattered beyond the old station's reach. Rafael wanted to accompany the next available journey rather than wait in the borrowed communications room. Elena would not pretend that their uniforms gave them control of the road or access to their former working area. What remained to them was a driver they knew, a receiving person who had answered and Rafael's stubborn offer to go. Mina noticed his shaking coffee before he did. Oren asked whether a trained civilian contact could make the handover instead. Rafael looked betrayed. 'They need somebody who stays,' he said. Elena had to answer the friend in front of her without turning their diminished circumstances into an excuse to spend him without limit."
 ac_sq.414.d_war_callback:0 "Rafael's patrol had followed a civilian convoy until the road disappeared beneath smoke. The last vehicle stopped before the bend. He circled wide, keeping the aircraft clear of the firing reported farther inland, while Oren tried three receiving contacts in succession. At the fourth attempt, someone answered. Rafael stayed until the drivers had a destination, then brought the aircraft home with his hands shaking as he unfastened the straps. He still wanted to accompany the next bus himself. Elena could not turn one flight's arrival into a promise that every road was safe. Mina had the drivers' names; Oren had a recipient who would answer again if the route changed. 'They need somebody who stays,' Rafael said. Nobody disputed that. Elena disputed the quiet assumption that staying always meant spending another piece of Rafael after the moment when he should have rested.\n\nOren still has the junction's receiving book. He finds a volunteer who once stayed there when everyone else wanted to keep searching."
 ac_sq.414.d_war:0 "Rafael's patrol had followed a civilian convoy until the road disappeared beneath smoke. The last vehicle stopped before the bend. He circled wide, keeping the aircraft clear of the firing reported farther inland, while Oren tried three receiving contacts in succession. At the fourth attempt, someone answered. Rafael stayed until the drivers had a destination, then brought the aircraft home with his hands shaking as he unfastened the straps. He still wanted to accompany the next bus himself. Elena could not turn one flight's arrival into a promise that every road was safe. Mina had the drivers' names; Oren had a recipient who would answer again if the route changed. 'They need somebody who stays,' Rafael said. Nobody disputed that. Elena disputed the quiet assumption that staying always meant spending another piece of Rafael after the moment when he should have rested."
 ac_sq.414.d_base_callback:0 "A road closure left a civilian transfer running later than anyone had promised. Rafael offered to accompany one more bus, though he was due to rest before returning to aviation duties. Elena had heard that phrase often enough to dislike it. Oren's receiving contact would wait for the passengers, but could not say how long the onward connection would hold. Mina spread the drivers' names across the desk and asked which of them actually needed a pilot beside them. Rafael took that badly. 'They need somebody who will stay,' he said. Elena looked at his shaking coffee and understood that he was still thinking of the unattended bag at the junction. The next journey might help real people. It might also be the wrong answer to a question he had never stopped carrying.\n\nOren still has the junction's receiving book. He finds a volunteer who once stayed there when everyone else wanted to keep searching."
 ac_sq.414.d_base:0 "A road closure left a civilian transfer running later than anyone had promised. Rafael offered to accompany one more bus, though he was due to rest before returning to aviation duties. Elena had heard that phrase often enough to dislike it. Oren's receiving contact would wait for the passengers, but could not say how long the onward connection would hold. Mina spread the drivers' names across the desk and asked which of them actually needed a pilot beside them. Rafael took that badly. 'They need somebody who will stay,' he said. Elena looked at his shaking coffee and understood that he was still thinking of the unattended bag at the junction. The next journey might help real people. It might also be the wrong answer to a question he had never stopped carrying."
 ac_sq.414.a:0 "Give the handover to a rested volunteer."
 ac_sq.414.a.reply:0 "Rafael helps brief the volunteer, then asks whether Elena could have trusted his judgment instead of deciding where his limit lay."
 ac_sq.414.b:0 "Let Rafael finish the journey he promised."
 ac_sq.414.b.reply:0 "Rafael leaves grateful that Elena honored his promise, while Mina asks who will notice the limit he still refuses to name."
 ac_sq.415.t:0 "The Clock in the Workshop"
 ac_sq.415.d_district_displaced_callback:0 "Oren brought his father's kitchen clock to the workshop after the funeral. The repair had been finished months earlier; now he wanted to know whether anyone at the station could use it. Mina suggested putting it where the radio team could hear the hour. Rafael said the ticking would interfere with recordings. Everyone knew that was an ordinary practical objection, and everyone heard Oren stop breathing for a moment anyway. Elena remembered the recorded question about the clock and wondered how many times he had listened to it since. There was no grand memorial to arrange, only a small object whose new place would make an absence permanent. Mina cleared a patch of shelf and waited. For once she had found something she would not repair without being asked.\n\nThe district containing Stonehenge was outside national control. Oren could no longer promise access to its old receiving office, however familiar the name sounded. Mina asked him to write a second route before distributing the revised contact cards. He kept the first route in the book, clearly marked as unavailable, so a returning volunteer would know what had changed rather than assume a printing error.\n\nOren tells Elena that the evening they covered was one of his father's good evenings. He has never found a neat way to thank both pilots for it."
 ac_sq.415.d_district_displaced:0 "Oren brought his father's kitchen clock to the workshop after the funeral. The repair had been finished months earlier; now he wanted to know whether anyone at the station could use it. Mina suggested putting it where the radio team could hear the hour. Rafael said the ticking would interfere with recordings. Everyone knew that was an ordinary practical objection, and everyone heard Oren stop breathing for a moment anyway. Elena remembered the recorded question about the clock and wondered how many times he had listened to it since. There was no grand memorial to arrange, only a small object whose new place would make an absence permanent. Mina cleared a patch of shelf and waited. For once she had found something she would not repair without being asked.\n\nThe district containing Stonehenge was outside national control. Oren could no longer promise access to its old receiving office, however familiar the name sounded. Mina asked him to write a second route before distributing the revised contact cards. He kept the first route in the book, clearly marked as unavailable, so a returning volunteer would know what had changed rather than assume a printing error."
 ac_sq.415.d_base_callback:0 "Oren brought his father's kitchen clock to the workshop after the funeral. The repair had been finished months earlier; now he wanted to know whether anyone at the station could use it. Mina suggested putting it where the radio team could hear the hour. Rafael said the ticking would interfere with recordings. Everyone knew that was an ordinary practical objection, and everyone heard Oren stop breathing for a moment anyway. Elena remembered the recorded question about the clock and wondered how many times he had listened to it since. There was no grand memorial to arrange, only a small object whose new place would make an absence permanent. Mina cleared a patch of shelf and waited. For once she had found something she would not repair without being asked.\n\nOren tells Elena that the evening they covered was one of his father's good evenings. He has never found a neat way to thank both pilots for it."
 ac_sq.415.d_base:0 "Oren brought his father's kitchen clock to the workshop after the funeral. The repair had been finished months earlier; now he wanted to know whether anyone at the station could use it. Mina suggested putting it where the radio team could hear the hour. Rafael said the ticking would interfere with recordings. Everyone knew that was an ordinary practical objection, and everyone heard Oren stop breathing for a moment anyway. Elena remembered the recorded question about the clock and wondered how many times he had listened to it since. There was no grand memorial to arrange, only a small object whose new place would make an absence permanent. Mina cleared a patch of shelf and waited. For once she had found something she would not repair without being asked."
 ac_sq.415.a:0 "Ask Oren to choose its place."
 ac_sq.415.a.reply:0 "He puts it in the workshop, where its ticking becomes another familiar sound people can work beside."
 ac_sq.415.b:0 "Offer to store it somewhere quieter."
 ac_sq.415.b.reply:0 "Oren agrees politely, and Mina wraps the clock as though the repair had not quite finished."
 ac_sq.416.t:0 "Before the Microphone Opens"
 ac_sq.416.d_cap_callback:0 "The volunteers had assembled a small recording corner in a borrowed room, using a repaired microphone and chairs from different buildings. Nobody claimed that it gave the old station back to them, or that their voices could reach every place they once served. Oren's draft named the contacts that still answered and left out the ones he could not confirm. Rafael wanted a declaration that would make people remember who they were. Elena worried about making an invitation sound like authority they no longer possessed. Mina turned the microphone aside while they discussed it. From the next room a volunteer practiced the announcement again. Even under these circumstances, a person could be reassured by hearing one true thing that was still possible.\n\nOren remembers the hall caretaker asking them to leave room for questions. He has written a pause into the new recording for exactly that reason."
 ac_sq.416.d_cap:0 "The volunteers had assembled a small recording corner in a borrowed room, using a repaired microphone and chairs from different buildings. Nobody claimed that it gave the old station back to them, or that their voices could reach every place they once served. Oren's draft named the contacts that still answered and left out the ones he could not confirm. Rafael wanted a declaration that would make people remember who they were. Elena worried about making an invitation sound like authority they no longer possessed. Mina turned the microphone aside while they discussed it. From the next room a volunteer practiced the announcement again. Even under these circumstances, a person could be reassured by hearing one true thing that was still possible."
 ac_sq.416.d_war_callback:0 "The civilian studio's repaired microphone carried practical notices between interruptions in its wartime schedule. The volunteers asked the station team for a reassuring contribution. Rafael wanted to tell listeners that their country would endure; Elena would not put a military prediction into a message about finding assistance. Oren had drafted names, opening arrangements and a request to call again if the first attempt failed. Mina turned the microphone aside before the conversation became sharp. They could offer solidarity without claiming a victory, and usefulness without pretending danger had ended. Rafael asked whether a list of contacts was enough to keep anybody listening. Through the window they could hear a volunteer rehearsing a notice, patiently giving each unfamiliar name the time it needed.\n\nOren remembers the hall caretaker asking them to leave room for questions. He has written a pause into the new recording for exactly that reason."
 ac_sq.416.d_war:0 "The civilian studio's repaired microphone carried practical notices between interruptions in its wartime schedule. The volunteers asked the station team for a reassuring contribution. Rafael wanted to tell listeners that their country would endure; Elena would not put a military prediction into a message about finding assistance. Oren had drafted names, opening arrangements and a request to call again if the first attempt failed. Mina turned the microphone aside before the conversation became sharp. They could offer solidarity without claiming a victory, and usefulness without pretending danger had ended. Rafael asked whether a list of contacts was enough to keep anybody listening. Through the window they could hear a volunteer rehearsing a notice, patiently giving each unfamiliar name the time it needed."
 ac_sq.416.d_base_callback:0 "The civilian studio had a repaired microphone, two mismatched chairs and a window that would not close properly. Its volunteers wanted the station team to record a short guide explaining where people should ask for assistance. Rafael liked the idea until the producer asked for stories that would make listeners proud. Oren's draft had no heroes, only opening hours, names and the instruction to call again if nobody answered. Mina tested the cable, then turned the microphone away so the four could argue without becoming a recording. Elena could make the broadcast memorable by telling the sort of story people expected from a pilot. Or she could leave the attention on the ordinary voices whose availability made the promises usable. Outside the window, someone was practicing the same announcement until the words sounded natural.\n\nOren remembers the hall caretaker asking them to leave room for questions. He has written a pause into the new recording for exactly that reason."
 ac_sq.416.d_base:0 "The civilian studio had a repaired microphone, two mismatched chairs and a window that would not close properly. Its volunteers wanted the station team to record a short guide explaining where people should ask for assistance. Rafael liked the idea until the producer asked for stories that would make listeners proud. Oren's draft had no heroes, only opening hours, names and the instruction to call again if nobody answered. Mina tested the cable, then turned the microphone away so the four could argue without becoming a recording. Elena could make the broadcast memorable by telling the sort of story people expected from a pilot. Or she could leave the attention on the ordinary voices whose availability made the promises usable. Outside the window, someone was practicing the same announcement until the words sounded natural."
 ac_sq.416.a:0 "Give listeners names they can actually reach."
 ac_sq.416.a.reply:0 "Rafael reads the first contact slowly, making an ordinary promise sound like something worth keeping."
 ac_sq.416.b:0 "Lead with the station's most reassuring story."
 ac_sq.416.b.reply:0 "The recording is warmly received, though Oren must shorten the practical instructions to make it fit."
 ac_sq.417.t:0 "Names Meant to Be Found"
 ac_sq.417.d_base:0 "A volunteer asked Oren to display the old receiving lists so families could find people who had traveled separately. The request made immediate human sense. So did Mina's objection: some names belonged to people who had asked not to have their movements announced. Rafael proposed asking everyone again, then fell quiet when he saw how many numbers had changed. Elena found the entry for the child from the road junction, with a careful note showing who had finally collected him. A good record could reconnect people. It could also expose a decision somebody had made for safety, privacy or reasons the station had never been entitled to know. Oren put a blank request card beside the list, hoping they could help one person find another without turning every private journey into a public notice."
 ac_sq.417.a:0 "Offer mediated requests with the names protected."
 ac_sq.417.a.reply:0 "Mina helps the volunteers answer inquiries one at a time, preserving the reasons people trusted the list."
 ac_sq.417.b:0 "Publish the list so families can search directly."
 ac_sq.417.b.reply:0 "Rafael helps families search directly; Mina and Oren must answer the people who expected their private movements to remain private."
 ac_sq.418.t:0 "The Pilot Who Could Leave"
 ac_sq.418.d_base_callback:0 "Rafael was asked to train a rotating group of civilian liaison volunteers. The assignment meant fewer familiar watches with Elena and more afternoons listening to other people explain what they needed. He tried to make the change sound temporary. Mina asked why useful work needed an apology. Oren, now steady enough to tease him, offered to conduct a final radio check on the instructor. Elena recognized the old uneasiness in Rafael's smile: leaving a recognizable place still felt too much like leaving the people who found him there. He asked whether she thought he was being moved aside. She could reassure him by insisting the old watch would always need him. She could also admit that teaching other people to stay had become a kind of courage he was unusually qualified to pass on.\n\nRafael remembers the volunteer who took his place on the delayed transfer. 'I was angry,' he admits. 'She did it well anyway.'"
 ac_sq.418.d_base:0 "Rafael was asked to train a rotating group of civilian liaison volunteers. The assignment meant fewer familiar watches with Elena and more afternoons listening to other people explain what they needed. He tried to make the change sound temporary. Mina asked why useful work needed an apology. Oren, now steady enough to tease him, offered to conduct a final radio check on the instructor. Elena recognized the old uneasiness in Rafael's smile: leaving a recognizable place still felt too much like leaving the people who found him there. He asked whether she thought he was being moved aside. She could reassure him by insisting the old watch would always need him. She could also admit that teaching other people to stay had become a kind of courage he was unusually qualified to pass on."
 ac_sq.418.a:0 "Tell him the new work needs his experience."
 ac_sq.418.a.reply:0 "He asks Mina for the training tin, accepting that being needed can look different from being summoned."
 ac_sq.418.b:0 "Promise to keep his old place ready."
 ac_sq.418.b.reply:0 "Rafael is visibly relieved, while Oren wonders which future volunteer will get that same reassurance."
 ac_sq.419.t:0 "The Silence Test"
 ac_sq.419.d_base_callback:0 "Mina asked the team to turn off the main set during a scheduled exercise. Oren hated the idea. Years of practice had made an unanswered frequency feel personal, even when every participant had agreed to the silence in advance. Rafael's volunteers were meant to move to the spare arrangement without being prompted. Elena watched the receiver lamp go dark and heard Oren's fingers tap the edge of the desk. Thirty seconds passed. A minute. Mina did not reach for a switch. Somewhere beyond their room, people were doing the work they had been taught to do without the reassuring presence of the original four. Oren asked whether they should intervene before someone became worried. Then, on the small receiver nobody was staring at, a hesitant voice gave its name.\n\nOren glances at the spare set he once needed permission to use. Elena notices that he has placed it within the trainee's reach."
 ac_sq.419.d_base:0 "Mina asked the team to turn off the main set during a scheduled exercise. Oren hated the idea. Years of practice had made an unanswered frequency feel personal, even when every participant had agreed to the silence in advance. Rafael's volunteers were meant to move to the spare arrangement without being prompted. Elena watched the receiver lamp go dark and heard Oren's fingers tap the edge of the desk. Thirty seconds passed. A minute. Mina did not reach for a switch. Somewhere beyond their room, people were doing the work they had been taught to do without the reassuring presence of the original four. Oren asked whether they should intervene before someone became worried. Then, on the small receiver nobody was staring at, a hesitant voice gave its name."
 ac_sq.419.a:0 "Let the new team complete the test."
 ac_sq.419.a.reply:0 "The volunteers answer one another. Oren asks afterward whether Elena understood what it cost him not to reassure them first."
 ac_sq.419.b:0 "Restore the main set and guide them through."
 ac_sq.419.b.reply:0 "Oren welcomes the familiar guidance, and Mina asks when their replacements will be allowed an uncertain minute of their own."
 ac_sq.420.t:0 "The Frequency Is Not Empty"
 ac_sq.420.d_cap_callback:0 "The newest volunteer remembered Rafael from a school bus long before the old station became somewhere they could speak about more easily than visit. She set a headset on the table in their borrowed room and asked which chair was free. Mina moved a stack of papers. Oren began explaining the remaining contacts, carefully distinguishing the people who still answered from arrangements they could no longer promise. Elena stood beside the door, refusing to mistake this small continuity for restored control or an ending to the country's troubles. The young woman had nevertheless come looking for useful work. On the portable receiver a voice asked whether anyone was listening. Rafael looked toward Elena, and the volunteer waited for them to decide whether she could answer.\n\nThe volunteer recognizes Oren's patient silence from the exercise. This time she reaches for the switch before anyone has to reassure her."
 ac_sq.420.d_cap:0 "The newest volunteer remembered Rafael from a school bus long before the old station became somewhere they could speak about more easily than visit. She set a headset on the table in their borrowed room and asked which chair was free. Mina moved a stack of papers. Oren began explaining the remaining contacts, carefully distinguishing the people who still answered from arrangements they could no longer promise. Elena stood beside the door, refusing to mistake this small continuity for restored control or an ending to the country's troubles. The young woman had nevertheless come looking for useful work. On the portable receiver a voice asked whether anyone was listening. Rafael looked toward Elena, and the volunteer waited for them to decide whether she could answer."
 ac_sq.420.d_base_callback:0 "The newest volunteer remembered Rafael from the school bus. She had been a child then; now she carried a headset in a bag of her own and wanted to know which chair was free. Rafael protested that he could not possibly have been working so long. Mina offered evidence. Oren began explaining the receiving book, then stopped and let the young woman ask her first question. Elena stood by the open door, hearing conversation occupy a silence she once thought it was her duty to fill. There were duties beyond this room and circumstances none of them could settle with a clear voice. Here, at least, somebody new had arrived knowing she could ask to belong. The spare set crackled. The volunteer looked toward the four familiar faces and waited to see whether they would let her answer.\n\nThe volunteer recognizes Oren's patient silence from the exercise. This time she reaches for the switch before anyone has to reassure her."
 ac_sq.420.d_base:0 "The newest volunteer remembered Rafael from the school bus. She had been a child then; now she carried a headset in a bag of her own and wanted to know which chair was free. Rafael protested that he could not possibly have been working so long. Mina offered evidence. Oren began explaining the receiving book, then stopped and let the young woman ask her first question. Elena stood by the open door, hearing conversation occupy a silence she once thought it was her duty to fill. There were duties beyond this room and circumstances none of them could settle with a clear voice. Here, at least, somebody new had arrived knowing she could ask to belong. The spare set crackled. The volunteer looked toward the four familiar faces and waited to see whether they would let her answer."
 ac_sq.420.a:0 "Give her the next answer."
 ac_sq.420.a.reply:0 "She says her name clearly, and Oren returns it as though this were the most ordinary welcome."
 ac_sq.420.b:0 "Make one last call as the old watch."
 ac_sq.420.b.reply:0 "Their four voices sound reassuringly familiar, while the young volunteer waits with her hand beside the switch."
 ac_sq.450.t:0 "Elena Neris | Air-defense pilot"
 ac_sq.450.d:0 "Elena likes a patrol that ends with nothing to report. She knows how much work is hidden inside that outcome. Serving a small country has taught her that staying out of somebody else's conflict is an active responsibility, not a promise the rest of the world is obliged to respect."
 ac_sq.451.t:0 "Rafael Caro | Wingman"
 ac_sq.451.d:0 "Rafael knows the names of the people who bring food to the station and the children who wait by its fence. His confidence comes from those connections. He finds it difficult to accept that a carefully planned withdrawal can sometimes protect them better than staying visibly in place."
 ac_sq.452.t:0 "Mina Vale | Radio and maintenance lead"
 ac_sq.452.d:0 "Mina can make an unreliable radio intelligible, but refuses to call it reliable afterward. She trains the people who will have to work without her and stores copies of instructions where they can actually be found. She considers a second way to reach somebody an ordinary courtesy."
 ac_sq.453.t:0 "Oren Serra | Civil-defense and radar controller"
 ac_sq.453.d:0 "Oren joined expecting to watch a border and found himself answering calls from schools, hospitals and distant observation posts. He has learned to listen before deciding that a weak signal is unimportant. He is less certain what to do when a strong voice tells him to stop listening."
 ac_sq.490.t:0 "An Answer Someone Else Can Give"
 ac_sq.490.d:0 "Elena no longer knows every voice that answers on the shared arrangements. Mina considers this evidence that their years of work were useful. Rafael complains that his trainees have learned to question him, then repeats their best questions to anyone willing to listen. Oren keeps his father's clock where its ticking enters the quiet parts of a recording. They have not made uncertainty disappear, and none of their small habits can promise a country's future. They have made it easier for somebody frightened or unfamiliar to find a patient person instead of a closed procedure. Sometimes the four still gather and hear a call handled without their help. It gives Elena the same pleasure an uneventful patrol once did: the knowledge of work hidden inside an ordinary outcome. On one such evening the newest volunteer asks whether anybody minds if she changes an old instruction. Mina gives her a pencil. Rafael asks her to explain. Oren listens until she finishes."
 ac_sq.491.t:0 "The Familiar Voice"
 ac_sq.491.d:0 "People still ask for Elena, Rafael, Mina or Oren by name. The four have helped enough callers to deserve that trust, and made enough private exceptions to know how difficult it is to hand over. Mina keeps the spare sets ready. Oren keeps a careful receiving book. Rafael remains the person who volunteers before checking how tired he is, although Elena sometimes catches him in time. Their work continues, with affection and arguments and a few silences nobody quite knows how to name. New volunteers learn the written arrangements and then learn whom to ask when the written arrangements fail. Elena hears both a kindness and a weakness in that second lesson. One evening a caller reaches the wrong person and is helped anyway. She tells the others about it over tea. For a moment the familiar watch can imagine a future in which being remembered is less important than leaving an answer within somebody else's reach."
 ac_sq.492.t:0 "Four Numbers in the Book"
 ac_sq.492.d:0 "The contact book still lists all four names. It takes more care now to choose which number to call. Mina answers technical questions and sends replacement instructions without a personal note. Rafael can fill a room with reassurance, then leave before Elena asks how he is sleeping. Oren keeps the clock, though he moves it away from the microphone. Elena finds herself repeating an old joke and realizing that the person who once laughed first is no longer listening in the same way. They have not forgotten the people they helped. What they remember differently is who paid for the help, and who was allowed to say that the cost had become too much. A young volunteer eventually returns the biscuit tin with its cards sorted and one new contact added by permission. The four recognize Mina's careful handwriting on the lid. The old arrangements cannot repair every friendship. They can still leave someone else a way to begin."
 ac_sq_emm:0 "The Open Corridor"
 ac_sq_emm_desc:0 "SQUADRON DISPATCHES\nChapter position (read or archived): [?ac_sq_chapter]/20\nCrew cohesion: [?ac_sq_cohesion|0]/100\nCredibility: [?ac_sq_credibility|0]/100\n\nPeople remember the promises made here. These dispatches accompany the national campaign."
