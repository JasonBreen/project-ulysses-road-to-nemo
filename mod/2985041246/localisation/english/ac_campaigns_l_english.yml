 ac_camp.109.t:0 "The signature she knew"
 ac_camp.109.desc:0 "The inspector recognizes the signature before she recognizes the error. It belongs to an officer who was helpful during the last crisis, and that makes asking for the original file more difficult. Independent inspection preserves a route around the command that issued the order. Command inspection can obtain faster cooperation while narrowing the people allowed to dispute its conclusions. The operational docket records a defined service to the coalition. It cannot erase the unresolved cases that made the inspection necessary, or treat an unanswered foreign request as an acceptance."
 ac_camp.109.a:0 "Circulate a public receiving account."
 ac_camp.109.b:0 "Keep a signed professional return."
