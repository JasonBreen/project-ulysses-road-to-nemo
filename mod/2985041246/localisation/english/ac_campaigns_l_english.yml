 ac_camp.71.t:0 "The person beyond the uniform"
 ac_camp.71.desc:0 "The liaison did not begin by asking the officer to trust him. That was the first useful thing about the conversation. He gave a receiving detail that could be checked independently and waited while the operator did so.\n\nBartlett's place in the history of the war had made the idea of an independent contact easier for some men to imagine and harder for others to accept. The current receiving staff could not borrow his reputation as a substitute for doing their own work. They needed to know who had supplied a message and what could presently be confirmed about it.\n\nThe officer put the reply beside the original. There were people imprisoned behind the authority claimed by the current orders, and the recovery effort would fail if everyone asking a question was required to approach the office that had arranged the silence.\n\nAcross the table, the liaison described the limits of the contact. The operator wrote them down without improving them. A protected uncertainty could still be useful. An invented certainty would become another weapon in the hands of whoever learned to circulate it first.\n\nWhen the conversation ended, neither man offered a declaration about the character of the other's nation. They had agreed to preserve one channel and to verify the next message before making another promise.\n\nThe officer watched the liaison leave. The uniform had been the easiest thing about him to recognize, and the least sufficient explanation for why the conversation had been possible."
 ac_camp.71.a:0 "Keep this account."
 ac_camp.71.z:0 "Close this old message."
