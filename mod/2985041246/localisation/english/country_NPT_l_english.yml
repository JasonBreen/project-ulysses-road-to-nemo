 ### FOCUSES, IDEAS AND TOOLTIPS (Continental War round) ###
 NPT_1991_elections:0 "The 1991 Elections"
 NPT_1991_elections_desc:0 "The archive planned subdivision elections for 20 April 1991 but never wrote the event. This focus leaves the result to us: choose which mandate the National Defense Council will work with. The choice shifts public support only; it does not change the ruling party or the Council.\n\n§gMod provenance; the outcome is a player choice.§!"
 NPT_old_guard_mandate:0 "Old Guard Mandate"
 NPT_old_guard_mandate_desc:0 "The voters endorse the status quo. The National Defense Council keeps foreign and military affairs, and the subdivisions keep their domestic autonomy.\n\n§gProvisional gameplay.§!"
 NPT_drp_mandate:0 "Democratic Republican Mandate"
 NPT_drp_mandate_desc:0 "The Democratic Republican Party makes strong gains on a platform of a democratically elected central government. The Council stays in place, but the call for civilian oversight grows louder.\n\n§gProvisional gameplay.§!"
 NPT_reformist_mandate:0 "Reformist Mandate"
 NPT_reformist_mandate_desc:0 "The young officers who call themselves the Reformists win wide support for a stronger central authority under the National Defense Council.\n\n§gProvisional gameplay.§!"
 NPT_national_defense_review:0 "National Defense Review"
 NPT_national_defense_review_desc:0 "Whatever the mandate, the Defense Forces must decide what they are for in a Usea that is rearming around us.\n\n§gProvisional gameplay.§!"
 NPT_armed_neutrality:0 "Armed Neutrality"
 NPT_armed_neutrality_desc:0 "North Point will stay outside every bloc and make itself too costly to threaten.\n\n§gProvisional gameplay.§!"
 NPT_usean_outreach:0 "Usean Outreach"
 NPT_usean_outreach_desc:0 "Isolation has kept us safe, but our future is bound to the continent. We open talks with Central Usea and the treaty organisation it leads.\n\n§gProvisional gameplay.§!"
 NPT_island_air_defence:0 "Island Air Defence"
 NPT_island_air_defence_desc:0 "Our islands are defended first from the air. New airfields will cover the approaches.\n\n§gProvisional gameplay.§!"
 NPT_self_reliant_industry:0 "Self-Reliant Industry"
 NPT_self_reliant_industry_desc:0 "A neutral state cannot depend on foreign factories. We expand our own industrial base.\n\n§gProvisional gameplay.§!"
 NPT_fcu_consultations:0 "Consultations with Central Usea"
 NPT_fcu_consultations_desc:0 "Regular political consultations with Central Usea build trust between our governments.\n\n§gProvisional gameplay.§!"
 NPT_uto_staff_talks:0 "Treaty Staff Talks"
 NPT_uto_staff_talks_desc:0 "Our officers begin staff talks with the Central Usean Treaty Organization on air and sea security.\n\n§gProvisional gameplay.§!"
 NPT_guarded_neutrality:0 "Guarded Neutrality"
 NPT_guarded_neutrality_desc:0 "Fortified, self-reliant and aligned with no one, North Point watches the continent from a distance.\n\n§gProvisional gameplay.§!"
 NPT_open_the_airfields:0 "Open the Airfields"
 NPT_open_the_airfields_desc:0 "We expand our airfields to standards our partners could use in a crisis.\n\n§gProvisional gameplay.§!"
 NPT_host_isaf:0 "Host ISAF"
 NPT_host_isaf_desc:0 "The Independent State Allied Forces needs a secure rear base off the continent. We offer North Point.\n\n§YOfficial:§! ISAF established its headquarters in North Point on 16 September 2004 (ACES Chronicle, 2004 / 09.16). The effects are provisional gameplay."
 NPT_isaf_logistics_hub:0 "ISAF Logistics Hub"
 NPT_isaf_logistics_hub_desc:0 "Ports, depots and airfields are expanded to sustain the allied forces staging through our islands.\n\n§gProvisional gameplay.§!"
 NPT_armed_neutrality_idea:0 "Armed Neutrality"
 NPT_armed_neutrality_idea_desc:0 "North Point stays outside every bloc and keeps its defences ready. Provisional gameplay."
 NPT_usean_liaison_idea:0 "Usean Liaison"
 NPT_usean_liaison_idea_desc:0 "Liaison officers and regular staff talks link our Defense Forces with Central Usea and its treaty partners. Provisional gameplay."
 NPT_isaf_rear_base_idea:0 "ISAF Rear Base"
 NPT_isaf_rear_base_idea_desc:0 "North Point hosts the headquarters and rear echelon of the Independent State Allied Forces (ACES Chronicle, 2004 / 09.16). The modifiers are provisional gameplay."
 NPT_isaf_formed_tt:0 "The Independent State Allied Forces have been formed"
 npt_pre_continental_war_focus:0 "North Point National Focus"
 npt_pre_continental_war_focus_desc:0 "North Point's path from the 1991 mandate to the Continental War."
