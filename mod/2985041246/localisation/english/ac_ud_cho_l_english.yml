 ac_ud_cho.1.t:0 "The Administration Audit"
 ac_ud_cho.1.d:0 "The audit began in the finance ministry, where clerks carried ledgers up from basement stores that had not been opened since the election calendar was suspended. Within a month the auditors had found offices with more staff on paper than chairs at their desks, district grants approved by officials who no longer held their posts, and contracts renewed year after year without a single tender.\n\nThe findings travelled faster than the auditors. In the capital, nationalist speakers read the worst entries aloud in their halls and demanded a cleaner state. Senior administrators answered that the ministries had kept the country fed, paid and defended through difficult years, and that a handful of bad ledgers did not make a failed government. The district delegates waiting in the capital mostly asked when the roads would come.\n\nThe National Administration now has to decide what the audit is for. It can publish everything and let the public judge, accepting the damage to its own standing. It can keep the findings inside government and repair the worst offices quietly. Either way, the audit has ended the comfortable assumption that nobody would ever look.\n\nProvisional gameplay."
 ac_ud_cho.1.a:0 "Publish the full audit."
 ac_ud_cho.1.b:0 "Repair the worst offices quietly."
 ac_ud_cho.2.t:0 "The Grove Census"
 ac_ud_cho.2.d:0 "The surveyors spent the dry weeks walking the District C groves with tally books, measuring tapes and a letter of authority that few growers had ever seen. They counted trees row by row, noted which were tapped and which had been abandoned, and asked each family who owned the land. Many families did not know; others knew very well and refused to say.\n\nThe result surprised the capital. The groves are larger and older than the ministry records claimed, and a real share of the latex leaves through small coves and private jetties rather than the three harbours. Some growers are prosperous and well organised. Many more sell to middlemen at whatever price is offered on the day, and owe money to the same men.\n\nThe census can be published grove by grove, giving growers the same figures the state holds and inviting arguments over every number. Or it can stay in the ministry, where it becomes a tool for setting quotas and prices that nobody outside can check. Either choice will shape the trade on the rubber coast for years.\n\nProvisional gameplay."
 ac_ud_cho.2.a:0 "Publish the census, grove by grove."
 ac_ud_cho.2.b:0 "Keep the figures inside the ministry."
 ac_ud_cho.3.t:0 "Ore Samples From the Plateau"
 ac_ud_cho.3.d:0 "The drilling teams spent a hot season on the District F plateau, sinking cores beside the old workings and along the dry valleys between the mining towns. Their samples went first to a field laboratory in a borrowed schoolroom, then down the slow plateau railway to the capital, where the mines ministry laid them out on long tables and argued over them for weeks. Some of the cores broke on the way down and had to be drilled again.\n\nThe seams are good. Oil, aluminium ore and iron are all present in quantities that justify investment for decades, though the richest deposits lie deeper than the current workings and will need pumps, power and proper engineering. Water is the binding limit. Every new works on the plateau will compete with the mining towns for the same scarce wells.\n\nThe survey turns a vague hope into a concrete choice. The country can build its processing works on the plateau, beside the seams, or carry the raw material down to the capital where power and labour already exist. Before that choice, the ministry must decide how to spend the first money the survey has justified.\n\nProvisional gameplay."
 ac_ud_cho.3.a:0 "Fund deeper drilling first."
 ac_ud_cho_3_a:0 "Fund deeper drilling first."
 ac_ud_cho.3.b:0 "Fund new wells for the mining towns first."
 ac_ud_cho.4.t:0 "Two Districts Without Roads"
 ac_ud_cho.4.d:0 "The survey teams came back from District B and the desert hinterland with notebooks full of what was missing. District B has good flat soil that floods in the rains, a scattering of farms, and tracks that close for weeks at a time. The hinterland has sand, scrub, a few herding families and almost no water away from the coast.\n\nNeither district has a works, an airfield or a paved road. Both send delegates to the capital who ask, every year, why the state collects taxes there and builds nothing in return. Officials answer that money spent where nobody lives is money wasted. The delegates reply that nobody will live there until the money is spent.\n\nThe survey cannot settle that argument, but it can decide where the first road goes. District B is close to the capital and could feed it. The hinterland is larger, emptier and harder, but it lies across the routes between the coast and the plateau. The ministry has money for one start this year, and the other district will have to wait. Its delegates have already said they will remember which district was chosen.\n\nProvisional gameplay."
 ac_ud_cho.4.a:0 "Start with the District B plains."
 ac_ud_cho.4.b:0 "Start with the desert hinterland."
 ac_ud_cho.5.t:0 "The Yards in District E"
 ac_ud_cho.5.d:0 "The inspectors counted three dockyards in District E, each with slipways laid down for a different generation of ships. One yard still builds small merchant hulls. One repairs the navy's destroyers and its single submarine. The third mostly waits for work, its cranes kept turning by a skeleton crew who remember busier years.\n\nThe navy's own figures were worse than expected. Spare parts for the destroyers come from abroad and arrive late. The submarine spends more time in the yard than at sea. The merchant fleet that carries the country's trade along the coast is old, and many of its masters have never sailed in company with a warship. The coast is long and the force watching it is small. Several officers privately call the navy a coast guard with a few warships attached.\n\nThe inventory leaves the admiralty with a choice about what to fix first. It can spend the yards' limited capacity refitting the ships it already has, or drawing up modern designs for escorts the country may build later. Neither choice will satisfy the officers who want both, and the budget allows only one.\n\nProvisional gameplay."
 ac_ud_cho.5.a:0 "Refit the ships we have."
 ac_ud_cho.5.b:0 "Draw up new escort designs."
 ac_ud_cho_5_b:0 "Draw up new escort designs."
 ac_ud_cho.6.t:0 "The Asteroid Warning"
 ac_ud_cho.6.d:0 "The announcement from Central Usea on 20 April 1996 reached the ministries by wire before it reached the newspapers, and for a few hours officials argued over what to say. By evening the radio stations had the story anyway. The asteroid Ulysses would strike the Earth, its fragments could fall anywhere, and nobody in the capital could say what that meant for a small coastal country.\n\nThe next morning the queues began: at banks, at grocers, at the fuel depot beside the air base. Meeting halls filled every evening. The flood wardens, who had spent years measuring rain, found themselves answering questions about orbits. The ministries had plans for floods, storms and the occasional fire, but none for something falling out of the sky. Several districts asked the capital for instructions that nobody had yet written.\n\nThe government now has to decide how it will speak about the danger in the years before the pass. Telling people everything the astronomers know builds trust but feeds fear with every revised forecast. Releasing only confirmed figures keeps the markets calmer but invites rumours. Either way, the shelters, stores and drills must start now.\n\nProvisional gameplay: the date is from Chronicle, 1996 / 04.20; the national response is not sourced."
 ac_ud_cho.6.a:0 "Tell the public everything the astronomers know."
 ac_ud_cho.6.b:0 "Release only what the ministries can confirm."
 ac_ud_cho.7.t:0 "News of the May Coup"
 ac_ud_cho.7.d:0 "On 30 May 1997 news reached the capital that a coup had broken out across Usea. The reports were confused and contradictory: units declaring for one side or another, airfields closed, radio stations silent. Unified Command was moving against the plotters, but nobody in the ministries could say how far the coup had spread or who might be part of it.\n\nThe government's first act was to call every army unit and ask it to report. Most did within hours. Some took a day, citing broken telephones and absent commanders; a few reported only after senior officers drove out to see them in person. No shots were reported in Chopinburg, but nobody in the ministries slept well either. Rumours of secret meetings in the officers' clubs circulated for days, and none could be confirmed or denied.\n\nNow the government must decide how to hold the army until the crisis passes. It can confine units to barracks until each one has reported and been checked, which is safe but leaves the streets without soldiers. Or it can keep loyal units visible in the capital's streets, which reassures some people and frightens others.\n\nProvisional gameplay: the date is from Chronicle, 1997 / 05.30; the national response is not sourced."
 ac_ud_cho.7.a:0 "Confine every unit to barracks until it reports."
 ac_ud_cho.7.b:0 "Keep loyal units in the capital streets."
 ac_ud_cho.8.t:0 "The Directorate Takes the Ministries"
 ac_ud_cho.8.d:0 "The Coastal Defence Directorate took over the ministries on a quiet morning. Its members, senior officers and security officials, arrived in civilian clothes and met the permanent secretaries one by one. Orders went out by telephone: the election calendar suspended, district councils advisory only, and every ministry required to report its readiness for further emergencies.\n\nThe capital reacted with a mixture of relief and unease. Shopkeepers welcomed the promise of order after weeks of rumour. Lawyers and journalists noticed that the first decree had no end date. In the districts, governors waited to see whether the new government would listen to them or simply send instructions down the wire. The nationalist halls, the business chambers and the old administrators all sent letters of congratulation, each hoping for something different in return.\n\nThe Directorate must now decide how to present itself. It can publish a date by which it will hand power back, which reassures the public but sets a deadline that will be hard to meet. Or it can govern without a date and rely on results to justify itself, which leaves every critic free to say it never intends to leave.\n\nProvisional gameplay."
 ac_ud_cho.8.a:0 "Publish a date for handing back power."
 ac_ud_cho.8.b:0 "Govern without a date."
 ac_ud_cho.9.t:0 "The Railgun Debate"
 ac_ud_cho.9.d:0 "Central Usea completed Stonehenge on 19 June 1998: eight railguns in a desert region of neutral San Salvacion, built by an international project to break up the fragments of Ulysses before they reached the ground. The capital newspapers printed diagrams of the guns, and for a few days the country argued about little else.\n\nThe air arm and the ministries split. One side argued that the railguns made national air defence spending wasteful: no small country could do better than the guns, and the money would save more lives in hospitals and stores. The other side pointed out that nobody could promise which fragments the guns would hit, or whether a small coast like this one would be covered at all. The flood wardens, asked for their view, said only that they had never seen a forecast that was never wrong.\n\nThe government has to settle the budget before the debate becomes a political fight. Trusting the railguns frees money for relief. Planning as if they will miss keeps money in roofs, radar and drills. Either choice will be judged harshly by whoever turns out to have been wrong after the pass.\n\nProvisional gameplay: Stonehenge completion is Chronicle, 1998 / 06.19; the national debate is not sourced."
 ac_ud_cho.9.a:0 "Trust the railguns and fund relief."
 ac_ud_cho.9.b:0 "Plan as if the guns will miss."
 ac_ud_cho.10.t:0 "The Night of the Fragments"
 ac_ud_cho.10.d:0 "On 8 July 1999 Ulysses passed the Roche limit and broke apart. Through the night the radar operators, flood wardens and harbour masters reported what they could see and hear: bright streaks over the sea, distant flashes, radio static. By morning the reports from across Usea described damaged towns, closed ports and roads crowded with families. The first radio messages from the harbours spoke of high water and broken windows, and then the lines went quiet for several hours.\n\nThe country's own preparations were tested at once. Shelters opened, the hospitals called in volunteers and the harbour masters counted which ships could still sail. Messages arrived from coastal towns asking for food, water and tents, and from abroad asking whether the harbours could receive boats carrying people with nowhere else to go.\n\nThe government must decide who leads the relief effort. Sending the army to the coast puts lorries, engineers and discipline where they are needed most, but places soldiers in charge of civilian streets. Placing relief in the districts' hands keeps it local and accountable, but leaves weaker districts struggling with tasks they have never faced.\n\nProvisional gameplay: the date is from Chronicle, 1999 / 07.08; the national response is not sourced."
 ac_ud_cho.10.a:0 "Send the army to the coast."
 ac_ud_cho.10.b:0 "Put the districts in charge of relief."
 ac_ud_cho.11.t:0 "War Comes to Usea"
 ac_ud_cho.11.d:0 "In the summer of 2003 Erusea invaded neutral San Salvacion and seized Stonehenge, turning the railguns built against asteroid fragments on aircraft instead. On 22 August Central Usea founded ISAF to resist. In the capital the news arrived as a series of shocks: closed air routes, shipping insurance rising by the day, and foreign diplomats asking where the country stood.\n\nThe government has no intention of sending its small forces into a continental war. But neutrality is not simple when the warring sides need fuel, rubber, repairs and airspace, and when any harbour on the coast could shelter a damaged ship. The air arm, the coast watch and the harbour masters all ask for orders, and the treasury asks what the war will cost.\n\nThe first orders concern the country's own forces. The government can mobilise only the coast guard and the naval reserve, keeping the economy running and the army at peace strength. Or it can call up the army reserve as well, showing every side that the country will defend itself, at the price of workers taken from farms and works.\n\nProvisional gameplay: Chronicle, 2003 / SUMMER and 2003 / 08.22; the national response is not sourced."
 ac_ud_cho.11.a:0 "Mobilise the coast guard and naval reserve."
 ac_ud_cho.11.b:0 "Call up the army reserve as well."
 ac_ud_cho.12.t:0 "The War Accounts"
 ac_ud_cho.12.d:0 "The war accounts were published in the autumn of 2005: fuel rationed, reservists paid, ships insured, harbours guarded, aircraft scrambled. The figures showed a country that had spent heavily to stay outside a war fought across its own continent. Each district received its own page of the report, and each page started its own arguments.\n\nSupporters of the wartime posture pointed to the harbours that kept working and the soldiers who stayed at home. Critics pointed to the cost, the black markets in the harbour towns and the reputation the posture had earned abroad. Both sides agreed that the country had changed during the war years, and neither agreed how. The newspapers printed both views side by side and sold more copies than in any month of the war.\n\nWith rationing ending and reservists going home, the government has to decide what to do with the wartime machinery. It can keep part of it, the guard posts, the convoy rules and the reserve stores, as a standing precaution. Or it can dismantle all of it, release the money for recovery and trust that the continent's wars are over.\n\nProvisional gameplay."
 ac_ud_cho.12.a:0 "Keep a standing precaution."
 ac_ud_cho.12.b:0 "Dismantle it and fund recovery."
 ac_ud_cho.13.t:0 "The Recovery Compact"
 ac_ud_cho.13.d:0 "The draft compact ran to forty pages and took six months to write. Its authors, drawn from the ministries, the districts and the political groups of the day, listed what the country needed within ten years: rebuilt harbours, a modern plateau, settled empty districts, a technical college, and a government the next generation would accept as legitimate.\n\nThe arguments were familiar. District C wanted the rubber trade restored first. District F wanted its mills modernised. District E wanted yard contracts, and District B wanted roads and schools for its farms. The capital wanted all of it, paid for by someone else. Every faction found something to dislike, which the authors took as a sign of balance. The draft was printed in every district newspaper, and the letters pages filled for weeks.\n\nThe final question is how the compact becomes binding. It can be put to a national vote, which gives it legitimacy but risks a rejection that would set recovery back years. Or the six district governors can sign it as an agreement among the districts, which is faster and more certain but leaves ordinary citizens as spectators.\n\nProvisional gameplay."
 ac_ud_cho.13.a:0 "Put the compact to a national vote."
 ac_ud_cho.13.b:0 "Let the district governors sign it."
