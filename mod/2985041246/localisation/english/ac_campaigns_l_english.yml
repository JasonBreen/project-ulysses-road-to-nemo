 ac_camp.111.t:0 "The road outside the meeting"
 ac_camp.111.desc:0 "The minister's map shows an access corridor. The local authority's copy shows schools, a hospital and the bridge on which the morning buses queue. A parliamentary mandate makes those competing obligations public before the offer is sent. A limited executive mandate offers a faster answer with a narrower circle responsible for its enforcement. The commitment requires a receiving government's present acceptance and can be refused. Its conclusion records the mandate that was used rather than granting an alliance, a guarantee or an automatic entry into war."
 ac_camp.111.a:0 "Circulate a public receiving account."
 ac_camp.111.b:0 "Keep a signed professional return."
