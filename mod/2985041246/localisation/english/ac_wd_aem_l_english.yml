l_english:
 AEM_wd_adm_no_party:0 "A Government Without a Party"
 AEM_wd_adm_no_party_desc:0 "Aemurraq enters 1991 governed by the National Administration, a body of ministers and senior officials that sits under a democratic banner yet commands about one voter in a hundred. Elections are suspended, and the public divides almost evenly between a nationalist movement and a non-aligned establishment. Naming that problem openly costs the ministers their quiet, but every later reform starts here."
 AEM_wd_adm_mandate_audit:0 "Audit the Emergency Orders"
 AEM_wd_adm_mandate_audit_desc:0 "Lawyers from the ministries read every order that keeps the elections suspended: the original emergency acts, the extensions, the clauses nobody has tested in court. Their study shows the mandate rests on habit more than law. Publishing that finding makes the Administration look weaker for a season, and it forces each faction to say what it would put in the mandate's place."
 AEM_wd_adm_mandate_audit_tt_1:0 "Opens the four answers to the caretaker question; only one can be taken."
 AEM_wd_adm_constituent_path:0 "Call a Constituent Assembly"
 AEM_wd_adm_constituent_path_desc:0 "The reform wing of the Administration proposes an elected assembly with a single task: to write the constitution that the suspended elections were supposed to serve. The democratic camp is tiny, so the seats would fill with nationalists and the non-aligned establishment. Ministers accept that risk, because a mandate written by voters is the only one the street cannot simply dismiss."
 AEM_wd_adm_boards_path:0 "Seat the Export Boards"
 AEM_wd_adm_boards_path_desc:0 "Aemurraq lives on oil, steel and aluminium sold abroad, and the chartered boards that handle those exports already employ more clerks than several ministries. Their chairmen propose to govern through a council of boards, judging each policy by whether it keeps cargoes moving. The establishment likes the idea. The nationalist half of the country sees a cartel walking into the state."
 AEM_wd_adm_resolve_path:0 "The Movement Claims the State"
 AEM_wd_adm_resolve_path_desc:0 "Half the public follows the nationalist movement, which calls the Administration a committee of clerks guarding exporters' profits. Its leaders offer to end the suspension of politics by ending politics as a contest: one movement, one programme, every district disciplined from the capital. Their rallies fill the squares quickly, and their opponents fill the boards' offices just as fast."
 AEM_wd_adm_command_path:0 "The Route Officers Step In"
 AEM_wd_adm_command_path_desc:0 "Officers of the services that guard the convoys, pipelines and frontier roads argue that only they stand outside both camps. They propose a command council to hold the state until the factions calm down, with the ministries kept on as staff. It promises order without a winner, and it leaves a country run by people trained to secure routes rather than to persuade voters."
 AEM_wd_adm_constituent_cabinet:0 "Seat the Constituent Cabinet"
 AEM_wd_adm_constituent_cabinet_desc:0 "The assembly is elected, sits in the capital and chooses a cabinet answerable to it, while elections return to a fixed calendar. Government passes from a single office to a body of ministers who can be voted out. Nationalist deputies hold many seats and use them loudly; the cabinet must bargain for every budget, yet it carries a mandate no earlier government could claim."
 AEM_wd_adm_board_council:0 "Convene the Council of Boards"
 AEM_wd_adm_board_council_desc:0 "Chairmen of the oil, steel, aluminium and shipping boards form a standing council and take the government seals. Elections stay suspended, and ministries report to the council as if they were export departments. Contracts are signed faster than ever and the budget balances. Voters, who were never consulted, notice that the council answers mainly to its own ledgers."
 AEM_wd_adm_resolve_directorate:0 "Install the Resolve Directorate"
 AEM_wd_adm_resolve_directorate_desc:0 "A directorate drawn from the nationalist movement takes executive power and rules by decree. Opposition offices close, the district councils are dissolved and a movement official sits beside every governor. Public order improves in the first months and recruiting offices fill. Exporters and foreign buyers grow cautious, because a government that answers to rallies can change its mind overnight."
 AEM_wd_adm_route_command:0 "Form the Route Command Council"
 AEM_wd_adm_route_command_desc:0 "Senior officers from the route security services, the frontier garrisons and the air wing assume power for a declared transition. Parties are not banned, but they are not consulted either. Convoys sail on schedule and the frontier roads stay open. The council has no plan for handing power back, and every faction knows that a transition without a date rarely ends on its own."
 AEM_wd_adm_constituent_text:0 "Ratify the Written Constitution"
 AEM_wd_adm_constituent_text_desc:0 "The assembly finishes a written constitution after two years of drafting: an elected chamber, a cabinet answerable to it, district councils with their own budgets and a court to settle quarrels among them. Ratification costs a hard season of bargaining with nationalist deputies, who extract a strong speakership. The text is imperfect, but it is the first one Aemurraq has voted for."
 AEM_wd_adm_board_ledgers:0 "Publish the Board Ledgers"
 AEM_wd_adm_board_ledgers_desc:0 "Facing complaints that the council governs for its own members, the boards publish annual ledgers showing every contract, price and royalty they handle. The disclosure embarrasses several chairmen and loses the council some private deals. It also gives the public a reason to believe that export revenue reaches the treasury, which is the only argument a government of boards can make."
 AEM_wd_adm_resolve_brigades:0 "Movement Brigades in the Districts"
 AEM_wd_adm_resolve_brigades_desc:0 "The directorate organises the movement's younger members into brigades that repair roads, guard depots and parade on national days in every district. They bring energy and cheap labour to places the ministries never reached. They also watch their neighbours and report on them, and the export boards quietly move their best clerks abroad rather than work under brigade supervisors."
 AEM_wd_adm_command_timetable:0 "A Timetable for the Transition"
 AEM_wd_adm_command_timetable_desc:0 "Pressed by exporters and foreign buyers, the command council publishes the conditions under which it would hand power to civilians: stable prices, secure routes and a census of voters. Nobody believes the dates, but the conditions become a public yardstick. The officers gain patience from the street and lose the freedom to rule without ever explaining themselves."
 AEM_wd_adm_settled:0 "The Caretaker Years End"
 AEM_wd_adm_settled_desc:0 "Whichever answer the country chose, the arguments of the early nineties give way to routine. Ministries know whom they serve, the districts know whom to petition and the export boards know whom to lobby or obey. A settled order is not necessarily a popular one. It is, at least, one that foreign buyers and neighbours can predict, and that alone lowers the price of everything."
 AEM_wd_dist_census:0 "Census of the Five Districts"
 AEM_wd_dist_census_desc:0 "Aemurraq is five districts: the Capital District, the harbour district on the coast, the hill and jungle country of District B with its logistics centre, the plant towns of District E and the vast, roadless District D. Nobody in the capital has counted their wells, schools or tax rolls properly. A census takes a full season and ends most arguments about who is owed what."
 AEM_wd_dist_capital_roads:0 "Ring Roads Around the Capital"
 AEM_wd_dist_capital_roads_desc:0 "The Capital District holds most of the civilian plants, the only air base and the fuel silo, yet its roads are those of a small desert town. Widening the ring roads around the capital centre lets trucks reach the plants without crossing the markets. The works close the main streets for a year, and merchants complain every single day the barriers stay up."
 AEM_wd_dist_logistics_centre:0 "The Logistics Centre on Three Shifts"
 AEM_wd_dist_logistics_centre_desc:0 "District B's logistics centre supplies half the country, but the roads that feed it climb through hills and jungle on routes graded for pack animals. Paving the climbs and adding passing bays lets the centre run three shifts. The district gains jobs and the army gains a dependable depot, though jungle maintenance will eat a slice of every future works budget."
 AEM_wd_dist_district_e:0 "A Second Road for District E"
 AEM_wd_dist_district_e_desc:0 "District E has two civilian plants, two arms plants and the steel and oil to feed them, but its towns sit at the end of a single road. Plant managers want a second route so that one washout cannot halt production for a week. The district's notables want housing first. The ministry pays for the road and promises the housing later, as ministries do."
 AEM_wd_dist_interior_trunk:0 "A Trunk Road into District D"
 AEM_wd_dist_interior_trunk_desc:0 "District D is the largest district by far, twenty-seven provinces of desert, hill, jungle and plain, and it has no developed roads at all. A trunk road from the capital into the interior is the most expensive single project the ministries have ever attempted. It will take two years, swallow the road budget and decide whether the interior ever joins the rest of the country."
 AEM_wd_dist_councils:0 "A Council for Each District"
 AEM_wd_dist_councils_desc:0 "Each district receives an elected council with its own budget line, its own works office and a governor answerable to the council rather than to the capital. Local projects move faster, and District D finally has a body that speaks for it. The capital loses the ability to shift money between districts freely, and every budget becomes a negotiation among five."
 AEM_wd_dist_prefects:0 "Prefects from the Capital"
 AEM_wd_dist_prefects_desc:0 "The opposite answer sends prefects from the capital to run every district on one code, one tax rate and one calendar of works. Decisions get faster, and money moves to wherever the ministries judge it is needed, usually the interior. District notables lose their old influence, and they will remember who took it the first time a prefect makes an expensive mistake."
 AEM_wd_dist_interior_workshops:0 "Workshops for the Interior"
 AEM_wd_dist_interior_workshops_desc:0 "With the trunk road open, the ministries place a workshop town in District D to repair trucks, pumps and generators for the interior. It is a small plant by the standards of District E, but it is the first in a district that has never had one. Skilled workers must be persuaded to move inland, and their housing costs more than the machines."
 AEM_wd_dist_d_wells:0 "Wells Along the Trunk Road"
 AEM_wd_dist_d_wells_desc:0 "Settlers, drivers and road crews follow the trunk road inland, and they need water before anything else. Boring wells at regular stages along the route turns a line on the map into a string of halts with fuel, water and a telephone. Without wells nobody stays. With them, the interior begins to fill, slowly and unevenly, along the road."
 AEM_wd_dist_interior_council:0 "The Interior Speaks for Itself"
 AEM_wd_dist_interior_council_desc:0 "The new District D council meets for the first time in a schoolhouse on the trunk road, with delegates who travelled two days to attend. Its first demand is that the interior keep a share of any oil or minerals found beneath it. Granting that costs the treasury future revenue, but it ties the interior's notables to the national order rather than against it."
 AEM_wd_dist_interior_survey:0 "Prefect Survey of the Interior"
 AEM_wd_dist_interior_survey_desc:0 "Prefects drive the trunk road to its end and then continue by truck and on foot to map every settlement in District D. Their survey sets road priorities by population and freight rather than by which notable shouts loudest. It is efficient and resented in equal measure. The ministries gain a plan for the interior that nobody there was asked to approve."
 AEM_wd_dist_accord:0 "The Accord of Five Districts"
 AEM_wd_dist_accord_desc:0 "Whichever arrangement the country chose, the five districts sign a short accord fixing their revenue shares, the order of road works for the decade and the right of each district to appeal to a common court. It is a dry document and it ends years of petitions. Later governments can plan without reopening the question of who pays for whom."
 AEM_wd_oil_fuel_ledger:0 "The National Fuel Ledger"
 AEM_wd_oil_fuel_ledger_desc:0 "Oil from District B, District E and the Capital District feeds a single fuel silo and a civilian economy that burns more than anyone measures. The ministries keep no common account of who pumps, who refines and who exports. A national ledger costs a year of inspectors' visits to every well and depot, and it shows the export boards exactly how much they have been undercounting."
 AEM_wd_oil_ore_survey:0 "Count the Steel and Bauxite"
 AEM_wd_oil_ore_survey_desc:0 "Steel ore and bauxite come out of the same three districts as the oil, often from pits opened decades ago and never surveyed properly. Geologists from the capital map the seams, the water tables and the haul roads. The survey costs little in money but takes the best engineers away from production for a season, and it settles which pits deserve investment."
 AEM_wd_oil_smelter:0 "Rebuild the Smelter Line"
 AEM_wd_oil_smelter_desc:0 "Bauxite from the hill pits and power from the oil fields make aluminium the natural third export, but the old smelter line runs at half capacity on worn equipment. Rebuilding it with modern cells doubles output and supplies workshops at home. The power bill rises sharply, and each summer the ministry must decide whether cheap power goes to the smelter or the towns."
 AEM_wd_oil_export_houses:0 "Chartered Export Houses"
 AEM_wd_oil_export_houses_desc:0 "One school holds that Aemurraq should do what it already does well: sell crude, steel and aluminium abroad through chartered houses with long contracts and guaranteed tonnage. The houses bring foreign currency quickly and ask little of the treasury. Their critics answer that a country selling raw materials stays poor, and that one bad price year would empty the budget."
 AEM_wd_oil_refine_home:0 "Refine It at Home"
 AEM_wd_oil_refine_home_desc:0 "Engineers and the plant managers of District E argue for keeping the crude at home and selling fuel, rolled steel and finished aluminium instead. That means new refineries, smelters and years of protected prices before the plants pay for themselves. Exporters lose volume in the meantime. If it works, Aemurraq sells finished goods rather than holes in the ground."
 AEM_wd_oil_state_office:0 "The State Oil Office"
 AEM_wd_oil_state_office_desc:0 "A third proposal puts every well, pipeline and export licence under a single state office that sets output, prices and investment by plan. Revenue flows straight to the treasury and the boards lose their private deals. The office would be slow, and its directors would answer to whichever government held the capital, for better or for worse."
 AEM_wd_oil_terminal_works:0 "Terminal Works at the Harbour"
 AEM_wd_oil_terminal_works_desc:0 "The export houses pay for a bulk terminal in the harbour district, with storage tanks, ore sheds and a works yard that services the loading cranes and pipelines. It is the first industrial site on that coast beyond the naval yards. The houses insist on long berthing rights in return, which the navy grants with visible reluctance."
 AEM_wd_oil_refinery:0 "A Refinery for District D"
 AEM_wd_oil_refinery_desc:0 "The refining school wins a site in District D, on open ground close enough to the oil districts for pipelines and far enough from the capital to spread the jobs. Construction runs late and over budget, as refineries always do. Once running, it turns crude that used to leave by tanker into fuel for Aemurraq's own trucks, ships and aircraft."
 AEM_wd_oil_state_pipeline:0 "A State Pipeline to the Silo"
 AEM_wd_oil_state_pipeline_desc:0 "The state oil office lays a pipeline and a chain of depots from the oil districts to the capital, so that the silo never again depends on trucks queuing at the wells. It is plain engineering and plain politics: whoever controls the valves controls the capital's fuel. The office makes sure the valves answer to it alone."
 AEM_wd_oil_long_contracts:0 "Twenty-Year Supply Contracts"
 AEM_wd_oil_long_contracts_desc:0 "With the terminal working, the export houses sign supply contracts that run for twenty years, with tonnage, price formulas and penalties fixed in advance. Foreign buyers gain certainty and Aemurraq gains steady currency. The price formulas look generous in a bad year and painful in a good one, and every later government inherits them."
 AEM_wd_oil_refined_exports:0 "Refined Fuel for Export"
 AEM_wd_oil_refined_exports_desc:0 "The District D refinery produces more than the country can burn, and the surplus goes abroad as finished fuel at several times the price of crude. Export houses that once sold barrels now sell tanker loads of diesel and aviation fuel. Protected prices at home can begin to fall. Foreign refiners who lost a supplier complain, and they buy anyway."
 AEM_wd_oil_first_plan:0 "Publish the First Oil Plan"
 AEM_wd_oil_first_plan_desc:0 "The state oil office publishes its first plan: output targets by district, a reserve held in the silo, investment by year and the share of revenue that goes to the treasury. Private traders dismiss it as wishful arithmetic. The plan's real value is that it exists in public, so the office can be judged against its own numbers."
 AEM_wd_oil_price_bands:0 "Price Bands for Fuel at Home"
 AEM_wd_oil_price_bands_desc:0 "Domestic fuel prices swing with every foreign crisis, and each swing reaches bread and bus fares within a week. Price bands let the ministry absorb small shocks from a reserve fund and pass large ones on gradually. The system costs money in calm years and political courage in bad ones, when the bands must be widened and everyone notices."
 AEM_wd_sea_route_service:0 "The Route Security Service"
 AEM_wd_sea_route_service_desc:0 "Sixty merchant ships fly Aemurraq's flag, carrying oil, steel and aluminium to foreign buyers, while the navy owns two coastal escorts. The convoy desks, harbour police and escort crews belong to three different ministries. Merging them into a single route security service gives every cargo one office to call. The ministries lose staff and budget, and say so loudly."
 AEM_wd_sea_third_slip:0 "A Third Slip at the Naval Yard"
 AEM_wd_sea_third_slip_desc:0 "The naval yard in the harbour district can build two hulls at a time and repair little else. A third slip, with cranes heavy enough for tankers, lets the yard maintain the merchant fleet without sending ships abroad for every overhaul. It takes the last good waterfront in the district, and the export houses grumble that their own plans have just lost a berth."
 AEM_wd_sea_coast_road:0 "The Coast Road to the Yards"
 AEM_wd_sea_coast_road_desc:0 "The harbour district reaches the capital by a road that floods in winter and narrows to one lane at the passes. Rebuilding it lets fuel, steel and crews reach the yards in a day rather than three. It is a modest project beside the interior trunk road, and it matters more to the navy than any new ship it could buy this decade."
 AEM_wd_sea_headland_radar:0 "Headland Radar Above the Harbour"
 AEM_wd_sea_headland_radar_desc:0 "Merchant masters report ships shadowing them just beyond sight of the coast, and the route service has no way to see what they describe. Radar on the headlands above the harbour covers the approaches day and night. The sets are imported, the crews need a year of training and the first winter storms knock half of them out, but the coast is no longer blind."
 AEM_wd_sea_escorts:0 "An Escort in Every Convoy"
 AEM_wd_sea_escorts_desc:0 "One doctrine says escorts belong with the cargo: every convoy sails with at least one armed ship, and merchant masters follow the escort's orders. It protects the ships that matter, wherever they go. It also means the navy is always at sea, always tired and never massed, and the coast is guarded by whatever happens to be in harbour."
 AEM_wd_sea_patrols:0 "Patrol the Home Approaches"
 AEM_wd_sea_patrols_desc:0 "The other doctrine keeps the escorts near home, patrolling the approaches every Aemurraqi ship must cross, and leaves the open sea to the masters and their insurers. Patrols are cheaper and keep the fleet concentrated. Ships far from home are on their own, and the export houses ask whether their premiums now pay for a navy that never leaves sight of land."
 AEM_wd_sea_insurance_pool:0 "A Shipping Insurance Pool"
 AEM_wd_sea_insurance_pool_desc:0 "Foreign underwriters price Aemurraqi cargoes as if every voyage were a gamble, and the premiums eat the margin on bulk exports. A national pool, backed by the treasury and the export houses together, insures the merchant fleet at home. It keeps foreign currency in the country. It also means that one bad year at sea lands directly on the national budget."
 AEM_wd_sea_escort_hulls:0 "Escort Hulls from Our Own Slips"
 AEM_wd_sea_escort_hulls_desc:0 "With the third slip working, the yard lays down escort hulls to its own design: simple ships with good radios and enough range for the export routes. They are slower and lighter than foreign designs and far cheaper to keep at sea. The naval staff learns more from building two hulls at home than it ever learned from buying ten abroad."
 AEM_wd_sea_masters_school:0 "A School for Merchant Masters"
 AEM_wd_sea_masters_school_desc:0 "Masters and mates of the merchant fleet learned their trade aboard foreign ships, and they follow foreign signal books. A school in the harbour district trains them in national convoy procedures, radio discipline and damage control. Courses take officers off ships for months at a time. In return, the route service can order a convoy by radio and expect every master to understand."
 AEM_wd_sea_flag_rules:0 "Rules for Ships Under Our Flag"
 AEM_wd_sea_flag_rules_desc:0 "Ships registered under Aemurraq's flag must now meet national standards for crews, radios and maintenance, inspected at the harbour each year. Some owners re-register abroad rather than pay for the repairs. Those who stay gain cheaper cover from the pool and priority in the escort schedule, and the flag begins to mean something to foreign harbour masters."
 AEM_wd_army_rolls:0 "Call the Volunteer Rolls"
 AEM_wd_army_rolls_desc:0 "The army is a volunteer force of four formations with six battalions' worth of trained men, equipped from small stocks of rifles and trucks. Nobody has counted how many volunteers would actually report if called. A muster across all five districts costs a week of pay and transport, and reveals which garrisons exist only in the returns."
 AEM_wd_army_hill_companies:0 "Hill and Jungle Companies"
 AEM_wd_army_hill_companies_desc:0 "District B and District D hold the only hills and jungle in a desert country, and the land frontier runs partly through them. Infantry trained for open sand moves badly there. Raising companies that train in the hills each season, with the mountaineering instructors already on the army's books, gives the garrisons a skill that costs time rather than money."
 AEM_wd_army_frontier_posts:0 "Posts on Three Frontiers"
 AEM_wd_army_frontier_posts_desc:0 "Aemurraq shares land frontiers with Azbekerania, Echea and Sotoa, and the crossings are watched by customs huts rather than soldiers. Small army posts at the main crossings, linked by track to the logistics centre, give early warning of trouble and somewhere to stop smugglers. The posts claim nothing beyond the line. They only make the line visible."
 AEM_wd_army_militia:0 "A Militia in Every District"
 AEM_wd_army_militia_desc:0 "One answer to a small army is a large reserve: every district raises a militia of part-time volunteers who drill on weekends and guard depots, bridges and wells in a crisis. It is cheap and popular in the towns. Militia officers owe their posts to district notables, and a militia trained to guard its own district rarely wants to leave it."
 AEM_wd_army_regulars:0 "Long-Service Regulars"
 AEM_wd_army_regulars_desc:0 "The other answer keeps the army small and makes it better: long-service volunteers on career pay, trained to move quickly between districts by truck and rail. Regulars cost several times as much per soldier as militia, and recruitment is slow in a country where the oil fields pay better. What the army lacks in numbers it gains in readiness."
 AEM_wd_army_trucks:0 "Trucks Before Tanks"
 AEM_wd_army_trucks_desc:0 "The army's research priority has always been plain: transport, replacement equipment and service it can afford. The general staff makes it formal, spending a small procurement budget on trucks, spare parts and rifles rather than heavy armour it could neither fuel nor repair. Officers who wanted prestige are disappointed. Every formation keeps moving with what the country can make."
 AEM_wd_army_arms_works:0 "Small Arms Works in District D"
 AEM_wd_army_arms_works_desc:0 "District D gains a small arms works that turns District E steel into rifles, mortars and spare parts close to the interior garrisons. It saves the long haul from the older arms plants and spreads defence jobs into the poorest district. The works would also make a tempting target in any war, which the general staff notes and the ministry ignores."
 AEM_wd_army_staff_college:0 "A Staff College for the Garrisons"
 AEM_wd_army_staff_college_desc:0 "Officers of the garrisons learned staff work on the job and abroad, each in a different school. A national staff college in the capital teaches one method for planning, supply and orders. The first classes are small and the instructors are borrowed from the route service. The army gains officers who write orders the same way, which matters more than any new rifle."
 AEM_wd_air_service_wing:0 "Thirty-Six Service Fighters"
 AEM_wd_air_service_wing_desc:0 "The air arm flies thirty-six service fighters from a single air base in the Capital District, with pilots trained abroad and spares bought one crate at a time. It can defend the capital for a short while and do little else. Making it a wing with its own staff, budget and maintenance plan is the first step toward an air arm that lasts."
 AEM_wd_air_capital_field:0 "Lengthen the Capital Air Base"
 AEM_wd_air_capital_field_desc:0 "The capital's air base has one runway, a handful of shelters and fuel delivered by truck from the silo. Lengthening the runway, adding dispersal pads and piping fuel in directly lets the whole wing operate together and receive heavier transports. The works close the base for months, while the fighters borrow a desert strip and their pilots complain constantly."
 AEM_wd_air_coast_strip:0 "A Patrol Strip on the Coast"
 AEM_wd_air_coast_strip_desc:0 "Merchant ships leaving the harbour district pass beyond the fighters' reach within an hour. A patrol strip on the coast lets the wing cover the first leg of every route and lets the route service call for help that might actually arrive. The strip is basic: a runway, a fuel bladder and tents. It doubles the time an aircraft can stay over the lanes."
 AEM_wd_air_ground_control:0 "Ground Control for the Capital"
 AEM_wd_air_ground_control_desc:0 "Fighters cannot intercept what nobody can see. A ground control station beside the capital air base tracks aircraft across the Capital District and talks the wing onto them by radio. The set is the most expensive single item the air arm owns, and its controllers must be trained abroad. Without it, the alert crews would simply be guessing."
 AEM_wd_air_interceptors:0 "An Interceptor Wing"
 AEM_wd_air_interceptors_desc:0 "One school wants the wing to own the sky over the capital and the plants: fast-climbing fighters, ground control and alert crews at five minutes' readiness. It is the classic answer for a small air arm guarding a valuable capital. It leaves the coast and the sea lanes to the navy and the route service, who notice and complain in writing."
 AEM_wd_air_route_patrol:0 "A Route Patrol Wing"
 AEM_wd_air_route_patrol_desc:0 "The other school wants long-range aircraft that patrol the sea lanes and frontier roads, reporting shadows to the route service and covering convoys on their first day out. Patrol work builds endurance and navigation rather than dogfighting. The capital keeps fewer fighters on alert, which the ministers dislike every time they hear engines overhead."
 AEM_wd_air_parts_line:0 "Airframe Parts from Our Aluminium"
 AEM_wd_air_parts_line_desc:0 "With the smelter line rebuilt, the wing's maintenance depot begins making its own airframe panels, brackets and ducting from Aemurraqi aluminium. Spares that once took months to arrive are cut and riveted in the capital. The parts are heavier than the originals and need constant inspection, but the wing no longer grounds aircraft for want of a bracket."
 AEM_wd_air_aggressors:0 "Contract Instructors for the Wing"
 AEM_wd_air_aggressors_desc:0 "Former top pilots of the Belkan Air Force are now hired by various countries to fly as aggressor squadrons. The wing can hire such instructors to fly against its own pilots in training. Their fees are high and their politics are their own business. Pilots who survive a month against them learn more than a year of ordinary drills could teach."
 AEM_wd_bw_news:0 "War Breaks Out Around Belka"
 AEM_wd_bw_news_desc:0 "In March 1995 war breaks out around Belka, far from Aemurraq's frontiers. Its first effects arrive through the markets rather than the sky: oil prices jump, insurers add war-risk premiums to routes near the fighting and unfamiliar buyers start calling the export boards. The ministers must decide quickly whether this war is someone else's misfortune or Aemurraq's opportunity."
 AEM_wd_bw_sell_all:0 "Sell to Any Buyer Who Pays"
 AEM_wd_bw_sell_all_desc:0 "The export boards argue that oil and rifles are commodities like any other, and that refusing buyers only hands the business to someone else. Selling to every party that pays in cash fills the arms plants in District E and the treasury alike. Every buyer's enemy will remember who supplied the shells, and some of those enemies have long memories."
 AEM_wd_bw_embargo:0 "No Arms to Any Belligerent"
 AEM_wd_bw_embargo_desc:0 "The opposing view holds that a small country with a large merchant fleet survives by being nobody's arsenal. An embargo on arms to every belligerent keeps fuel and civilian goods flowing but stops every weapons contract. The arms plants lose orders and their workers lose overtime. Aemurraqi ships, in return, are less likely to be stopped and searched at sea."
 AEM_wd_bw_windfall:0 "Bank the Wartime Windfall"
 AEM_wd_bw_windfall_desc:0 "High wartime oil prices bring more revenue in one season than in the two years before. The ministry can spend it at once on roads and wages, or bank it in a stabilisation fund for the years when prices fall again. Spending wins votes and the fund wins nothing visible. The ministers bank most of it, knowing nobody will thank them."
 AEM_wd_bw_lumen:0 "The Treaty Signed at Lumen"
 AEM_wd_bw_lumen_desc:0 "A treaty signed in Lumen in June 1995 ends the Belkan War. Oil prices drift back down and the insurers cut their war-risk premiums on most routes. The export boards want the wartime prices back; the ministries want to know how much of the boom was real. The end of the war is a relief and a budget problem at the same time."
 AEM_wd_bw_arms_audit:0 "Account for the Arms Sales"
 AEM_wd_bw_arms_audit_desc:0 "With the war over, foreign governments ask who sold what to whom, and Aemurraq's arms plants appear in several answers. Licensing every future arms export, with buyer, quantity and end use published each year, turns an embarrassment into a system. The plants keep most of their customers. A few of the more discreet buyers take their business elsewhere."
 AEM_wd_bw_clean_hands:0 "A Reputation for Clean Hands"
 AEM_wd_bw_clean_hands_desc:0 "The embargo held for the whole war, and foreign ministries noticed. Aemurraqi ships were searched less often, its diplomats were welcomed as neutral hosts and the export boards found buyers who wanted a supplier with no enemies. The arms plants are still short of orders. The country, however, has earned a reputation that no later government could buy."
 AEM_wd_bw_belka_lost:0 "Machine Tools at Bargain Prices"
 AEM_wd_bw_belka_lost_desc:0 "In this outcome Belka has lost the war, and its defeat leaves factories, machine tools and trained staff looking for new customers abroad. Aemurraq's ministries can buy surplus machinery cheaply and offer contracts to engineers willing to relocate. The bargains are real. So is the risk that the victors will see the country as a refuge for the losing side."
 AEM_wd_bw_belka_won:0 "Orders from a Victorious Belka"
 AEM_wd_bw_belka_won_desc:0 "In this outcome Belka has won the war, and its ministries need fuel, aluminium and shipping for their own reconstruction. Purchasing missions arrive with long lists and prompt payment. Accepting the orders fills Aemurraq's tankers. It also places the country among Belka's suppliers at the moment Belka's defeated neighbours are deciding whom to remember."
 AEM_wd_uly_announcement:0 "The Asteroid Is Coming"
 AEM_wd_uly_announcement_desc:0 "Astronomers warned in December 1994 that the asteroid Ulysses might strike the Earth. In April 1996 the warning becomes an announcement: it will strike, and nations must prepare. Nobody can say where fragments will fall. Aemurraq has deserts, a crowded capital and a merchant fleet at sea, and every ministry suddenly has a plan that needs money."
 AEM_wd_uly_cisterns:0 "Cisterns and Deep Shelters"
 AEM_wd_uly_cisterns_desc:0 "Engineers propose shelters cut beneath the capital and the district towns, with sealed cisterns holding weeks of water. In a desert country, water is the first thing to fail after any disaster. The plan is slow and enormously expensive. It protects people who reach the shelters in time, and does nothing for anyone caught on the open road."
 AEM_wd_uly_warning_net:0 "A Warning Net Across the Districts"
 AEM_wd_uly_warning_net_desc:0 "Radar and observatory specialists propose a warning net instead: tracking stations, sirens in every town and a radio chain that can clear a district within hours, with its main tracking post in District D. Warning is cheaper than concrete and covers the roads and the sea. It depends entirely on accurate tracking, and on people believing the sirens at three in the morning."
 AEM_wd_uly_staple_reserve:0 "A Reserve of Grain and Fuel"
 AEM_wd_uly_staple_reserve_desc:0 "In a desert country, grain and clean water run short first after any disruption, and most of the oil leaves by sea. A national reserve of grain, medicine and fuel, held in the districts rather than the capital, buys weeks of breathing space. Filling the stores pushes up market prices just as the public is already nervous, and the markets notice."
 AEM_wd_uly_open_drills:0 "Rehearse the Evacuation in Public"
 AEM_wd_uly_open_drills_desc:0 "The constituent cabinet takes its preparations to the chamber, publishing every plan and rehearsing evacuations in public with deputies taking part. The first drills are clumsy and the press mocks them. By the third, towns know their routes and shelters, and the cabinet has turned a frightening subject into a civic duty the nationalist deputies cannot easily attack."
 AEM_wd_uly_board_grain:0 "The Boards Buy Forward"
 AEM_wd_uly_board_grain_desc:0 "The council of boards treats the asteroid as a supply problem and solves it the way the boards solve everything: with contracts. Grain, medicine and water containers are bought forward on long terms and stored in board warehouses near every district town. The stores are efficient and well guarded, and the boards alone decide when and to whom they are released."
 AEM_wd_uly_brigade_stores:0 "Brigades Guard the Stores"
 AEM_wd_uly_brigade_stores_desc:0 "The directorate hands preparation to the movement brigades, who dig cisterns, stack sandbags and guard the reserve depots with evident enthusiasm. Volunteers sign up faster than the depots can use them. The brigades also keep the shelter rolls, and families with the wrong neighbours or the wrong opinions find their names lower down the list."
 AEM_wd_uly_officer_shelters:0 "Officers Run the Shelters"
 AEM_wd_uly_officer_shelters_desc:0 "The command council treats the impact as a military emergency and runs it like one. Officers draw up evacuation tables, garrisons rehearse road control and every district receives a duty officer with authority over the shelters. The drills are punctual and thorough. Civilians obey because they must, and the council learns how much it enjoys running the civilian state."
 AEM_wd_uly_roche_night:0 "Listening Through the Roche Night"
 AEM_wd_uly_roche_night_desc:0 "On 8 July 1999 Ulysses passes through the Roche limit of the Earth. For Aemurraq the night is spent listening: to shortwave bulletins, to the warning chain and to merchant masters reporting by radio from distant routes. Whatever falls, wherever it falls, the country will feel it through the markets and the sea lanes for years afterwards."
 AEM_wd_uly_harbour_reception:0 "Ships Seeking Harbour"
 AEM_wd_uly_harbour_reception_desc:0 "When Erusea stops taking in refugees in April 2000, the route service expects ships carrying displaced families to try any harbour that might admit them, including the harbour district. Admitting them strains housing and the reserve stores. Turning them away saves money and costs the country its standing with every merchant master who watches a ship leave again."
 AEM_wd_uly_district_stores:0 "Reserve Depots in Every District"
 AEM_wd_uly_district_stores_desc:0 "The district accord fixes revenue shares, so the reserve can finally be spread fairly: a depot in each district, sized by population and distance from the capital. District E's depot needs a better road to reach its plant towns, and the accord pays for it. The capital loses its monopoly on emergency stores, which is what the other four districts wanted."
 AEM_wd_uc_san_salvacion:0 "War Reaches San Salvacion"
 AEM_wd_uc_san_salvacion_desc:0 "In the summer of 2003 Erusea invades the neutral country of San Salvacion, seizes Stonehenge and begins using its railguns as anti-air batteries. Usea lies far from Aemurraq's districts, yet Usean ports buy its steel and Usean lanes carry its oil. Insurers move before governments do, and within weeks every cargo bound for Usean waters costs more to send."
 AEM_wd_uc_isaf_fuel:0 "Fuel Contracts with the ISAF"
 AEM_wd_uc_isaf_fuel_desc:0 "In August 2003 the FCU establishes the ISAF to oppose Erusea. Its quartermasters need fuel, steel and shipping, and they pay on time. Signing supply contracts fills the plants and the tankers without sending a single Aemurraqi soldier. Erusea will regard every such cargo as hostile, and Aemurraqi ships near its coast will be treated accordingly."
 AEM_wd_uc_neutral_flag:0 "No Cargo for Either Side"
 AEM_wd_uc_neutral_flag_desc:0 "The neutral camp wants nothing loaded in Aemurraq to reach either army: no fuel for the ISAF, no steel for Erusea, and inspectors on the wharf to make sure of it. Merchant masters gain a flag that both navies have reason to respect. The export boards lose the most profitable contracts of the decade and say so at every opportunity."
 AEM_wd_uc_cash_cargoes:0 "Cash Cargoes for Any Port"
 AEM_wd_uc_cash_cargoes_desc:0 "A third view treats the war as a market: Aemurraq sells fuel and steel to civilian buyers in any port that pays in advance, and asks nothing about where the cargo goes next. Revenue rises fast and the plants run overtime. Both sides suspect Aemurraq of supplying the other, and the insurers price that suspicion into every single voyage."
 AEM_wd_uc_war_freight:0 "Export Houses Chase War Freight"
 AEM_wd_uc_war_freight_desc:0 "The chartered export houses, built for long contracts and steady tonnage, discover that wartime freight pays three times the peacetime rate. They charter every spare hull and fill them with crude and ore. The houses grow rich and royalties rise with them. The merchant fleet ages faster than anyone planned, because nobody will take a ship out of service."
 AEM_wd_uc_refinery_overtime:0 "Refineries on Three Shifts"
 AEM_wd_uc_refinery_overtime_desc:0 "Usean buyers want refined fuel rather than crude, and the refining programme is ready for them. The plants move to three shifts, paying overtime and squeezing maintenance into the margins. Output and revenue climb together. Engineers warn that equipment run this hard for two years will need a long and expensive rest once the war is over."
 AEM_wd_uc_state_quota:0 "Wartime Quotas from the Oil Office"
 AEM_wd_uc_state_quota_desc:0 "The state oil office allocates wartime sales by quota: so much for home use, so much for the reserve and so much for foreign contracts at prices it sets itself. Private traders call it a monopoly in a uniform. It keeps domestic fuel cheap while the world pays war prices, and it puts more revenue under ministerial control than ever before."
 AEM_wd_uc_escort_run:0 "Escorts on the Usean Run"
 AEM_wd_uc_escort_run_desc:0 "Under the escort doctrine, every convoy bound for Usean waters sails with an armed Aemurraqi ship that turns back at the edge of the war zone. The escorts log more sea time in two years than in the previous decade. Crews are exhausted and hulls need refits, but masters keep sailing because someone is sailing with them."
 AEM_wd_uc_home_approaches:0 "Close Guard on the Approaches"
 AEM_wd_uc_home_approaches_desc:0 "Under the patrol doctrine, the navy tightens its watch on the approaches to the harbour district and leaves distant routes to the insurers. A second radar post on the headlands and constant patrols keep the coast safe from any raider the war sends wandering. Masters bound for Usea are alone beyond the horizon, and their association says so weekly."
 AEM_wd_uc_railguns_silent:0 "The Railguns Fall Silent"
 AEM_wd_uc_railguns_silent_desc:0 "In this outcome Stonehenge has been destroyed and its railguns no longer command the Usean sky. Insurers cut their war-risk rates on the routes nearest the fighting, and masters who refused Usean charters begin to accept them. Aemurraq drops its surcharge on Usean cargoes, which pleases the export boards and costs the treasury a useful source of revenue."
 AEM_wd_uc_rebuilding_orders:0 "Orders for the Rebuilding"
 AEM_wd_uc_rebuilding_orders_desc:0 "In this outcome the war ends with the ISAF victorious, and rebuilding begins along the battered Usean coast. Ports, bridges and power lines need steel, aluminium and fuel by the shipload. Aemurraq's boards and plants bid for the contracts beside larger exporters. The orders are welcome, but payment stretches over years and the creditors are nearly bankrupt themselves."
 AEM_wd_uc_erusea_terms:0 "Trading with a Victorious Erusea"
 AEM_wd_uc_erusea_terms_desc:0 "In this outcome Erusea has won its war, and the Usean lanes now run past ports under Erusean control. Its trade offices invite foreign suppliers to sign new terms, with inspection rights and preferred prices. Signing keeps Aemurraqi cargoes moving into Usea. It also ties the country's largest new customer to a government many of its old customers distrust."
 AEM_wd_uc_fifteen_years:0 "An Account of Fifteen Years"
 AEM_wd_uc_fifteen_years_desc:0 "As the war in Usea winds down, the government publishes a plain account of fifteen years: how Aemurraq is governed, what its districts produced, how its ships fared and what the asteroid and two distant wars cost. The account promises nothing about the next era. It records where the country stands, so whoever governs next starts from figures rather than slogans."
 AEM_wd_uc_fifteen_years_tt_2:0 "Closes the 1991 to 2005 programme; later eras are not yet written."
 ac_wd_aem_tree:0 "Aemurraq: National Programme"
 ac_wd_aem_tree_desc:0 "The national focus programme of Aemurraq, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 AEM_wd_caretaker_mandate:0 "The Caretaker Mandate"
 AEM_wd_caretaker_mandate_desc:0 "An administration without a party governs on renewed emergency orders."
 AEM_wd_constituent_promise:0 "A Constituent Promise"
 AEM_wd_constituent_promise_desc:0 "An elected assembly will write the constitution the suspended elections were meant to serve."
 AEM_wd_board_charters:0 "Charters of the Export Boards"
 AEM_wd_board_charters_desc:0 "The oil, steel, aluminium and shipping boards claim a share of government."
 AEM_wd_movement_squares:0 "The Movement in the Squares"
 AEM_wd_movement_squares_desc:0 "The nationalist movement fills the squares and presses its claim to the state."
 AEM_wd_route_officers:0 "Officers of the Routes"
 AEM_wd_route_officers_desc:0 "Officers of the route services stand ready to hold the state."
 AEM_wd_written_constitution:0 "The Written Constitution"
 AEM_wd_written_constitution_desc:0 "A ratified constitution with an elected chamber, district councils and a common court."
 AEM_wd_open_ledgers:0 "Open Board Ledgers"
 AEM_wd_open_ledgers_desc:0 "Every board contract, price and royalty is published each year."
 AEM_wd_movement_brigades:0 "Movement Brigades"
 AEM_wd_movement_brigades_desc:0 "Brigades of young movement members repair roads and guard depots in every district."
 AEM_wd_transition_timetable:0 "The Transition Timetable"
 AEM_wd_transition_timetable_desc:0 "Published conditions under which the command council would hand power back."
 AEM_wd_district_compact:0 "The District Compact"
 AEM_wd_district_compact_desc:0 "A census-backed understanding among the five districts."
 AEM_wd_district_councils:0 "Elected District Councils"
 AEM_wd_district_councils_desc:0 "Each district has an elected council, its own works office and a budget line."
 AEM_wd_capital_prefects:0 "Prefects of the Capital"
 AEM_wd_capital_prefects_desc:0 "Prefects from the capital run every district on one code."
 AEM_wd_interior_council:0 "The Interior Council"
 AEM_wd_interior_council_desc:0 "District D keeps a share of whatever is found beneath it."
 AEM_wd_fuel_ledger:0 "The Fuel Ledger"
 AEM_wd_fuel_ledger_desc:0 "One account of every well, pipeline and depot in the country."
 AEM_wd_export_houses:0 "Chartered Export Houses"
 AEM_wd_export_houses_desc:0 "Crude, steel and aluminium sold abroad through chartered houses."
 AEM_wd_home_refining:0 "Refined at Home"
 AEM_wd_home_refining_desc:0 "Crude kept at home for refineries and smelters under protected prices."
 AEM_wd_state_oil_office:0 "The State Oil Office"
 AEM_wd_state_oil_office_desc:0 "One office sets output, prices and investment for every well."
 AEM_wd_export_contracts:0 "Twenty-Year Contracts"
 AEM_wd_export_contracts_desc:0 "Long supply contracts guarantee tonnage and foreign currency."
 AEM_wd_refined_exports:0 "Refined Fuel Abroad"
 AEM_wd_refined_exports_desc:0 "Aemurraqi refineries sell finished fuel rather than crude."
 AEM_wd_oil_plan:0 "The First Oil Plan"
 AEM_wd_oil_plan_desc:0 "A published plan for output, reserves and investment."
 AEM_wd_fuel_price_bands:0 "Fuel Price Bands"
 AEM_wd_fuel_price_bands_desc:0 "A reserve fund smooths domestic fuel prices within published bands."
 AEM_wd_route_service:0 "The Route Security Service"
 AEM_wd_route_service_desc:0 "Convoy desks, harbour police and escort crews in one service."
 AEM_wd_convoy_escorts:0 "Escorts with the Cargo"
 AEM_wd_convoy_escorts_desc:0 "Every convoy sails with at least one armed ship."
 AEM_wd_approach_patrols:0 "Patrols on the Approaches"
 AEM_wd_approach_patrols_desc:0 "The escorts guard the home approaches and leave the open sea to insurers."
 AEM_wd_insurance_pool:0 "The Shipping Insurance Pool"
 AEM_wd_insurance_pool_desc:0 "A national pool insures the merchant fleet at home."
 AEM_wd_flag_standards:0 "Standards of the Flag"
 AEM_wd_flag_standards_desc:0 "Ships under the national flag meet inspected standards for crews and radios."
 AEM_wd_volunteer_garrisons:0 "The Volunteer Garrisons"
 AEM_wd_volunteer_garrisons_desc:0 "A small volunteer army counted district by district."
 AEM_wd_hill_companies:0 "Hill and Jungle Companies"
 AEM_wd_hill_companies_desc:0 "Companies that train each season in the hills and jungle."
 AEM_wd_district_militia:0 "District Militias"
 AEM_wd_district_militia_desc:0 "Part-time volunteers who guard depots, bridges and wells at home."
 AEM_wd_long_service:0 "Long-Service Regulars"
 AEM_wd_long_service_desc:0 "A small army of career volunteers moved by truck and rail."
 AEM_wd_service_wing:0 "The Service Fighter Wing"
 AEM_wd_service_wing_desc:0 "Thirty-six fighters with their own staff and maintenance plan."
 AEM_wd_interceptor_wing:0 "The Interceptor Wing"
 AEM_wd_interceptor_wing_desc:0 "Fighters on alert to deny the sky over the capital."
 AEM_wd_patrol_wing:0 "The Route Patrol Wing"
 AEM_wd_patrol_wing_desc:0 "Long-range patrols over sea lanes and frontier roads."
 AEM_wd_contract_instructors:0 "Contract Instructors"
 AEM_wd_contract_instructors_desc:0 "Hired aggressor instructors fly against the wing in training."
 AEM_wd_war_premium:0 "The War Premium"
 AEM_wd_war_premium_desc:0 "Wartime oil prices and war-risk insurance reach every cargo."
 AEM_wd_open_order_book:0 "An Open Order Book"
 AEM_wd_open_order_book_desc:0 "Arms and fuel sold to any buyer who pays in cash."
 AEM_wd_arms_embargo:0 "No Arms to Belligerents"
 AEM_wd_arms_embargo_desc:0 "Fuel and civilian goods flow; weapons contracts stop."
 AEM_wd_windfall_fund:0 "The Windfall Fund"
 AEM_wd_windfall_fund_desc:0 "Wartime oil revenue banked against the years of low prices."
 AEM_wd_export_licences:0 "Published Arms Licences"
 AEM_wd_export_licences_desc:0 "Every arms export licensed, with buyer and end use published."
 AEM_wd_neutral_reputation:0 "Clean Hands"
 AEM_wd_neutral_reputation_desc:0 "A reputation as a supplier with no enemies."
 AEM_wd_belkan_orders:0 "Belkan Purchasing Missions"
 AEM_wd_belkan_orders_desc:0 "Orders for fuel, aluminium and shipping from a victorious Belka."
 AEM_wd_sky_watch:0 "Watch on the Sky"
 AEM_wd_sky_watch_desc:0 "Ministries plan for an impact whose location nobody can name."
 AEM_wd_deep_cisterns:0 "Cisterns and Shelters"
 AEM_wd_deep_cisterns_desc:0 "Sealed cisterns and shelters under the capital and district towns."
 AEM_wd_warning_net:0 "The Warning Net"
 AEM_wd_warning_net_desc:0 "Tracking stations, sirens and a radio chain in every district."
 AEM_wd_staple_reserve:0 "The Staple Reserve"
 AEM_wd_staple_reserve_desc:0 "Grain, medicine and fuel stored in the districts."
 AEM_wd_open_drills:0 "Public Evacuation Drills"
 AEM_wd_open_drills_desc:0 "Rehearsed in public, with deputies taking part."
 AEM_wd_board_grain:0 "Board Grain Contracts"
 AEM_wd_board_grain_desc:0 "Emergency stores bought forward and held by the boards."
 AEM_wd_brigade_stores:0 "Brigade-Guarded Stores"
 AEM_wd_brigade_stores_desc:0 "Movement brigades dig cisterns and keep the shelter rolls."
 AEM_wd_officer_shelters:0 "Duty Officers for the Shelters"
 AEM_wd_officer_shelters_desc:0 "Garrison officers run evacuation tables and shelters."
 AEM_wd_harbour_reception:0 "Reception at the Harbour"
 AEM_wd_harbour_reception_desc:0 "Ships carrying displaced families may land at the harbour district."
 AEM_wd_war_risk:0 "Usean War Risk"
 AEM_wd_war_risk_desc:0 "Insurers price the Usean war into every cargo."
 AEM_wd_isaf_contracts:0 "ISAF Supply Contracts"
 AEM_wd_isaf_contracts_desc:0 "Fuel and steel sold to the ISAF quartermasters; no troops committed."
 AEM_wd_neutral_flag:0 "A Flag Both Navies Respect"
 AEM_wd_neutral_flag_desc:0 "Nothing loaded in Aemurraq may reach either army."
 AEM_wd_cash_cargoes:0 "Cash Cargoes"
 AEM_wd_cash_cargoes_desc:0 "Civilian buyers in any port, paid in advance, no questions asked."
 AEM_wd_war_freight:0 "War Freight Charters"
 AEM_wd_war_freight_desc:0 "Export houses charter every spare hull at wartime rates."
 AEM_wd_refinery_overtime:0 "Refineries on Overtime"
 AEM_wd_refinery_overtime_desc:0 "Three shifts at every refinery while the war lasts."
 AEM_wd_state_quota:0 "Wartime Oil Quotas"
 AEM_wd_state_quota_desc:0 "The oil office allocates home, reserve and foreign shares."
 AEM_wd_reconstruction_orders:0 "Reconstruction Orders"
 AEM_wd_reconstruction_orders_desc:0 "Steel and fuel for rebuilding the Usean coast, on long credit."
 AEM_wd_cautious_trade:0 "Terms with Erusea"
 AEM_wd_cautious_trade_desc:0 "Cargoes reach Usea on terms set by a victorious Erusea."
 AEM_wd_escorted_season:0 "An Escorted Season"
 AEM_wd_escorted_season_desc:0 "The route service escorts the busiest months of the export year."
 AEM_wd_fuel_release:0 "Reserve Fuel Released"
 AEM_wd_fuel_release_desc:0 "Reserve fuel sold at band prices to calm a spike."
 AEM_wd_inspected_ministries:0 "Ministries Under Inspection"
 AEM_wd_inspected_ministries_desc:0 "Unannounced inspections keep officials honest and nervous."
 AEM_wd_market_days:0 "Market Days at the Crossings"
 AEM_wd_market_days_desc:0 "Traders from both sides of the line meet at the frontier posts."
 ac_wd_aem.1.t:0 "A Mandate Nobody Voted For"
 ac_wd_aem.1.d:0 "The National Administration meets in the capital centre with an agenda its members have postponed for years. The emergency orders that suspended elections are due for renewal, and for the first time the ministry lawyers will not countersign them without a recorded cabinet vote. Aemurraq is governed by an office that sits under a democratic banner while the democratic camp itself barely registers in any count of public opinion.\n\nOutside, the country has split almost exactly in two. Half answers to a nationalist movement that fills the squares and promises discipline, pride and an end to government by clerks. The other half belongs to a non-aligned establishment of export boards, senior officials and district notables who care more about stable prices than about any creed. Neither half trusts the Administration, and neither has yet found a lawful way to replace it.\n\nThe ministers cannot settle the country's future at one sitting. They can decide how the argument will be conducted: in public, with the press in the gallery and the movement's speakers given airtime on the state radio, or inside the ministries, where the export boards already keep their chairs. Whatever they choose will be read as a signal by both halves of the country, and by every foreign buyer of Aemurraqi oil.\n\nProvisional gameplay."
 ac_wd_aem.1.a:0 "Argue it in public, on the radio."
 ac_wd_aem.1.b:0 "Keep it inside the ministries."
 ac_wd_aem.1.c:0 "Invite the boards and the movement to talks."
 ac_wd_aem.2.t:0 "Five Districts Report"
 ac_wd_aem.2.d:0 "The census teams return from the five districts with trucks full of ledgers and a list of grievances longer than the ledgers. The Capital District holds most of the civilian plants, the only air base and the fuel silo, and complains that it pays most of the taxes. District E, with its arms and civilian plants, calls its single road a scandal. District B points to the logistics centre and asks why its hill roads were laid out for mules.\n\nThe harbour district on the coast has the naval base and the yards and wants a road that does not flood every winter. District D is the strangest return of all: the largest district by far, twenty-seven provinces of desert, hill, jungle and plain with a long coastline, and no paved road, no plant and no resource the old surveys ever recorded. Its delegates arrived late because there was no way to arrive early.\n\nThe ministers must decide how to present the census. Printed in full, it will start a long quarrel about fairness among the five districts that no ministry can steer. Held inside the ministries, it will quietly shape the budget while every district assumes the worst about the others. Either way, the figures for District D will decide the road budget for the rest of the decade.\n\nProvisional gameplay."
 ac_wd_aem.2.a:0 "Print every district figure."
 ac_wd_aem.2.b:0 "Brief only the ministries."
 ac_wd_aem.3.t:0 "What the Wells Really Pump"
 ac_wd_aem.3.d:0 "The inspectors sent to every well, pipeline and depot have finished, and their figures do not match anyone's. Output from District B, District E and the Capital District is higher than the export boards reported and lower than the ministries assumed. Several pipelines carry no meters at all. The fuel silo in the capital, which the army counts on for its trucks and fighters, is less than half full on most days of the year.\n\nEveryone has an explanation. The boards blame old equipment and honest rounding. The ministries blame the boards. Plant managers in District E say they have been buying fuel back from exporters at foreign prices because the domestic allocation never arrived. The movement's newspapers print the gap between the two sets of figures on their front pages and invite readers to guess where the difference went.\n\nThe government now holds the only honest account of the country's oil, and must decide what to do with it. It can use the audit to reopen every export licence, which will take years and enrage the boards, or let the boards correct their own books in exchange for a quiet settlement. The figures will not stay secret either way.\n\nProvisional gameplay."
 ac_wd_aem.3.a:0 "Reopen every export licence."
 ac_wd_aem_3_a:0 "Reopen every export licence."
 ac_wd_aem.3.b:0 "Let the boards correct their books."
 ac_wd_aem.4.t:0 "A Tanker Overdue"
 ac_wd_aem.4.d:0 "A tanker loaded at the harbour district misses its reporting call two days out. The convoy desk at the trade ministry assumes the navy is handling it; the navy assumes the harbour police have heard from the owners; the harbour police assume the ship has simply switched off its radio to save power. For two days nobody looks. Then the owners telephone the capital and ask, politely, whether anyone knows where their ship is.\n\nThe tanker turns up drifting with engine failure, its crew safe and its cargo intact. The search that found it was organised by merchant masters on the radio rather than by any office of the state. Foreign underwriters raise their premiums on Aemurraqi cargoes the following week, and the masters' association writes an open letter asking which of the three offices is responsible for them at sea.\n\nThe new route security service is supposed to answer that question, and this is its first test. The government can publish a full inquiry naming every failure, which will embarrass three ministries at once, or settle quietly with the owners and the underwriters. The masters will judge the new service by the choice, and they talk to every crew in the fleet.\n\nProvisional gameplay."
 ac_wd_aem.4.a:0 "Publish the inquiry and its failures."
 ac_wd_aem.4.b:0 "Settle quietly with the owners."
 ac_wd_aem.5.t:0 "Muster Day in Five Districts"
 ac_wd_aem.5.d:0 "For the first time in years, every volunteer on the army rolls is called to report on a single day. In the Capital District the barracks overflow and the trucks run out of seats. In District B the hill companies arrive early, in good order and short of boots. In District D, where the rolls list hundreds of names, a few dozen men walk in from the interior and ask where everyone else is.\n\nBy evening the figures are clear and uncomfortable. The four formations exist, but two of them are far below strength, and the stocks of rifles, trucks and support equipment would not outfit even the men who did report. Officers who had signed paper returns for years avoid each other in the mess. The quartermasters, who always knew, are quietly pleased that someone has finally asked them.\n\nThe general staff must report to the government, and the government must decide what the public hears. Publishing the real strength will shake confidence and invite the movement's newspapers to ask who was paid for soldiers who never existed. Reporting the paper strength keeps calm for now and leaves the army as hollow as it was this morning.\n\nProvisional gameplay."
 ac_wd_aem.5.a:0 "Publish the true strength."
 ac_wd_aem.5.b:0 "Report the paper strength."
 ac_wd_aem.6.t:0 "Prices of a Distant War"
 ac_wd_aem.6.d:0 "In March 1995 war breaks out around Belka. Aemurraq is no party to it and its frontiers are nowhere near the fighting, yet within days the war is present in every ministry. Oil prices jump on the foreign exchanges. Underwriters add war-risk premiums to routes near the fighting and to any ship whose cargo might be resold. Buyers the export boards have never met begin calling with large orders and few questions.\n\nThe arms plants in District E and the capital see overtime for the first time in years. The movement's speakers say the country should take every order it can get, since the belligerents will not thank anyone for staying poor. The establishment worries about foreign memories and about ships being stopped at sea. Several embassies ask, in identical language, what Aemurraq intends to sell and to whom.\n\nThe government must answer before the boards answer for it. It can declare at once that Aemurraq takes no side, which costs nothing today and may cost orders tomorrow, or say only that existing contracts will be honoured, which keeps every option open and satisfies nobody abroad. Either statement will be read in capitals that Aemurraq's ministers have rarely visited.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25; the Aemurraqi response is gameplay."
 ac_wd_aem.6.a:0 "Declare that Aemurraq takes no side."
 ac_wd_aem.6.b:0 "Say only that contracts will be honoured."
 ac_wd_aem.7.t:0 "The Asteroid Will Strike"
 ac_wd_aem.7.d:0 "Astronomers warned in December 1994 that the asteroid Ulysses might pass close enough to strike the Earth. In April 1996 the warning becomes an announcement: it will strike, and nations must prepare. Nobody can yet say where the fragments will fall. Aemurraq has a crowded capital, towns that depend on a few wells, a merchant fleet spread across distant routes and no experience of planning for anything this large.\n\nEvery ministry discovers a plan that needs money. Engineers want shelters and sealed cisterns under the towns. Radar and observatory specialists want a warning net that can clear a district in hours. The export boards want to know whether their ships should stay in port. The treasury points out that any of these plans costs as much as a decade of road building, and that the roads are not finished.\n\nThe public reaction arrives before any plan does. Markets in the capital sell out of water containers, places of worship fill and some families in the harbour district talk of moving inland. The government must decide how to speak about a danger it cannot control: openly and at once, accepting a rush on the markets, or calmly and slowly, accepting that preparation will lag.\n\nProvisional gameplay: date anchors only, ACES Chronicle rows 1994 / 12.10 and 1996 / 04.20; Aemurraqi preparations are gameplay."
 ac_wd_aem.7.a:0 "Prepare openly and at once."
 ac_wd_aem.7.b:0 "Urge calm and keep working."
 ac_wd_aem.8.t:0 "Queues at the Grain Markets"
 ac_wd_aem.8.d:0 "Three weeks after the government began preparing in public, the markets break. Grain, flour, water containers and fuel cans sell out in the capital by noon each day, and prices for staples double within a fortnight. District towns at the end of long roads run out entirely. Traders who can afford to wait hold back stock, and everyone knows who they are.\n\nThe movement blames exporters for shipping grain money abroad. The export boards blame the ministries for frightening the public. Crews from foreign ships in the harbour district buy whatever is left and sail away with it. The district councils, where they exist, send telegrams to the capital that grow shorter and angrier as the week goes on.\n\nThe cabinet has two tools and little time. It can fix the price of staples and ration them by household, which needs clerks, inspectors and patience the country has not shown before. Or it can let prices run, import as fast as the ships can carry, and trust that high prices will draw new supply into the country before tempers break in the queues outside the market halls.\n\nProvisional gameplay."
 ac_wd_aem.8.a:0 "Fix staple prices and ration."
 ac_wd_aem.8.b:0 "Let prices run and import more."
 ac_wd_aem.9.t:0 "The Night Ulysses Passed"
 ac_wd_aem.9.d:0 "On 8 July 1999 the asteroid Ulysses passes through the Roche limit of the Earth. In Aemurraq the night is spent listening. Families gather around radios in the capital and the district towns, the warning chain reports every hour whether or not there is anything to report and the shelters, where they exist, hold more people than their designers ever imagined.\n\nMerchant masters on distant routes report by radio what they can see and hear from their bridges, which is mostly rumour relayed from other ships. The route service logs every call. Officials in the capital try to separate what is known from what is feared, and find that the line moves every few minutes. Nobody in the government sleeps, and nobody pretends to.\n\nBy morning the country is still standing and still frightened. Whatever has fallen, and wherever it has fallen, the markets, the sea lanes and the insurers will carry the consequences to Aemurraq for years. The government must decide whether to keep its emergency measures in force while the world takes stock, or to stand the districts down and let ordinary life resume.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1999 / 07.08; no Aemurraqi damage is claimed."
 ac_wd_aem.9.a:0 "Keep the emergency measures in force."
 ac_wd_aem.9.b:0 "Stand the districts down."
 ac_wd_aem.10.t:0 "War Comes to Usea"
 ac_wd_aem.10.d:0 "In the summer of 2003 Erusea invades the neutral country of San Salvacion, seizes Stonehenge and begins using its railguns as anti-air batteries. Usea is far from Aemurraq's districts, but Usean ports buy Aemurraqi steel and Usean lanes carry Aemurraqi oil. By the time the ministers meet, insurers have already suspended cover on several routes and doubled it on the rest.\n\nMasters of the merchant fleet refuse Usean charters until someone tells them who will pay if their ships are lost. Buyers on both sides of the war call the export boards with orders larger than anything since the Belkan War, and the boards forward the calls to the cabinet without comment. The movement and the establishment, for once, agree on something: the country should not send soldiers. They agree on nothing else.\n\nThe government must set Aemurraq's posture before every ship in the fleet sets its own. Keeping all cargoes away from Usean waters is safe and expensive. Sailing wherever the contracts lead is profitable and dangerous. Every later choice about whom to supply will follow from what the ministers say this week.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2003 / SUMMER; the Aemurraqi response is gameplay."
 ac_wd_aem.10.a:0 "Keep every cargo away from Usean waters."
 ac_wd_aem.10.b:0 "Sail where the contracts are."
 AEM_wd_constituent_cabinet_office:0 "Cabinet of the Constituent Assembly"
 AEM_wd_constituent_cabinet_office_desc:0 "A cabinet chosen by and answerable to an elected constituent assembly, governing collectively while elections return to a fixed calendar. Provisional gameplay office with no named holder."
 AEM_wd_board_council_office:0 "Council of the Export Boards"
 AEM_wd_board_council_office_desc:0 "A standing council of the chairmen of the oil, steel, aluminium and shipping boards, holding the government seals with elections still suspended. Provisional gameplay office with no named holder."
 AEM_wd_resolve_directorate_office:0 "Directorate of National Resolve"
 AEM_wd_resolve_directorate_office_desc:0 "A directorate drawn from the nationalist movement, ruling by decree with movement officials beside every district governor. Provisional gameplay office with no named holder."
 AEM_wd_route_command_office:0 "Route Security Command Council"
 AEM_wd_route_command_office_desc:0 "A council of senior officers from the route security services, the frontier garrisons and the air wing, holding power for a declared transition. Provisional gameplay office with no named holder."
 ac_wd_aem_decisions:0 "Aemurraq: National Measures"
 ac_wd_aem_decisions_desc:0 "Measures from the national programme of Aemurraq. Provisional gameplay unless a source ledger row says otherwise."
 AEM_wd_escort_season_decision:0 "Escort the Export Season"
 AEM_wd_escort_season_decision_desc:0 "The route service escorts the busiest four months of the export year, at the cost of fuel and crew rest. Repeatable once a year."
 AEM_wd_fuel_reserve_release_decision:0 "Open the Fuel Reserve"
 AEM_wd_fuel_reserve_release_decision_desc:0 "Sells part of the fuel reserve at band prices to calm a domestic price spike. Once only; the reserve takes years to refill."
 AEM_wd_interior_grading_decision:0 "Grade the Interior Tracks"
 AEM_wd_interior_grading_decision_desc:0 "Road crews grade and gravel the side tracks off the District D trunk road. A one-time works programme."
 AEM_wd_second_interior_plant_decision:0 "Commission a Second Interior Plant"
 AEM_wd_second_interior_plant_decision_desc:0 "Funds a second workshop plant in District D once the first is running. A one-time charge on the works budget."
 AEM_wd_ministry_inspection_decision:0 "Inspect a Ministry Unannounced"
 AEM_wd_ministry_inspection_decision_desc:0 "Inspectors arrive at one ministry without warning and publish what they find. Repeatable every six months; officials resent it."
 AEM_wd_crossing_market_days_decision:0 "Market Days at the Crossings"
 AEM_wd_crossing_market_days_decision_desc:0 "The frontier posts host open market days for traders from both sides of the line. Repeatable once a year."
