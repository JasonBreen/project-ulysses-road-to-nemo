 OSE_snp_procurement_scrutiny_civil_policy_spirit:0 "Independent acceptance tests"
 OSE_snp_procurement_scrutiny_civil_policy_spirit_desc:0 "A contractor's report describes a successful delivery. The receiving workshop describes a crate it cannot yet use. The inspector refuses to choose between those accounts before checking the contract, the stock record and the manufacturing schedule. An invoice can be paid without making a machine serviceable; an order can also be delayed without becoming evidence of betrayal. Scrutiny must protect operational needs while giving the receiving crew time to explain what still has to be done.\n\nGive independent inspectors protected time. Factory learning improves, while the slower administrative route carries an enduring political cost."
