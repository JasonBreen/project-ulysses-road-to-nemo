 ac_wd_pbl.1.t:0 "The Crown Question"
 ac_wd_pbl.1.d:0 "The session opens in the old throne hall at Gatewood with the usual music and an unusual agenda. For the first time in living memory the clerks have placed the government itself on the order paper. Perbla is a kingdom of four crown lands held together by one throne, a century-old service year and an economy that leans on its arms plants. Each of those pillars now has a faction that wants it rebuilt.\n\nThe constitutional camp wants ministers who answer to an elected chamber. The palace party wants the seals returned to a privy council that can act without waiting for votes. A harder faction speaks of order above all, of a crown that governs by decree because elected governments always drift back to greed. Deputies from the outer lands ask whether the crown needs to govern at all, or only to reign.\n\nNone of these camps commands a majority today. What the court decides in this first session is not which answer wins, but how the question will be argued: in the open, with the chamber and the press watching, or behind the palace doors. Either way, the arms trusts, the officer corps and the four lands are already counting their friends.\n\nProvisional gameplay."
 ac_wd_pbl.1.a:0 "Argue it in the open chamber."
 ac_wd_pbl.1.b:0 "Keep the debate inside the palace."
 ac_wd_pbl.2.t:0 "Four Lands, One Throne"
 ac_wd_pbl.2.d:0 "The census clerks return from the crown lands with trunks of ledgers and a list of complaints. Serenava, the frontier land facing Osea, says it carries the kingdom's airfields and bunker lines but receives little else. Terentio, spread between the desert fields and the northern coast, reports towns that still haul their water by truck. Relentio, home of the great port of Sofern, wants its harbour councils recognised and its customs revenue respected.\n\nPerbla proper, around Gatewood and the old heartland, has its own grievance: it pays most of the taxes and is blamed for most of the decisions. The old charters that bind the four lands disagree with one another about courts, the language of record and who may levy what. Every land can quote a charter that favours it, and most of them do.\n\nMinisters must decide how to present the census. Published in full, it will start a long argument about fairness that the crown cannot control. Kept for the ministries, it will guide policy quietly while every land suspects the worst. The crown lands have lived together for generations; the question is whether they will keep doing so out of loyalty or out of habit.\n\nProvisional gameplay."
 ac_wd_pbl.2.a:0 "Publish the census in full."
 ac_wd_pbl.2.b:0 "Keep it for the ministries."
 ac_wd_pbl.3.t:0 "The Unfinished Plants"
 ac_wd_pbl.3.d:0 "The audit teams have walked every arms plant in the kingdom, and their report is long. The last expansion left halls without roofs, presses delivered but never installed, and payrolls for production lines that exist only on paper. Arms output still dominates the economy, which means the waste is not a side issue. In many districts it is the economy.\n\nEconomists have warned for years that a sector this large and this fragile could take the whole kingdom down with it if a big customer vanished or a major firm failed. The audit puts numbers on that warning. Some plants can be finished cheaply; others should never have been started. A handful of contractors were paid twice for the same work, and the trusts would very much like that paragraph removed.\n\nThe treasury wants the audit to become the foundation of a new industrial model, whatever that model turns out to be. The trusts want it treated as a confidential briefing. The officer corps asks only that nothing be closed before it knows what it would lose. The cabinet has the report on the table and must decide who else gets to read it.\n\nProvisional gameplay."
 ac_wd_pbl.3.a:0 "Share the report with the chamber."
 ac_wd_pbl_3_a:0 "Share the report with the chamber."
 ac_wd_pbl.3.b:0 "Brief the trusts privately."
 ac_wd_pbl.4.t:0 "One Firm, One Kingdom"
 ac_wd_pbl.4.d:0 "The study on the national electronics firm arrives with a plain title and an alarming summary. The firm makes nearly every circuit the army uses and most of those in civilian industry, from radios to factory controls. It is famous abroad and proud at home. If it failed, the study concludes, whole sectors would stop within weeks for lack of parts.\n\nThe firm's board insists it is healthy and that the study insults a national success. Its few rivals say the firm uses its size to starve them of contracts. The defence staff says it does not care who is right; it wants a second source for anything that keeps an aircraft flying or a radar turning. The university at Gatewood says it could train twice the engineers if it had laboratories outside the firm's gates.\n\nThe government now has to decide what kind of partner the crown should be to the kingdom's most important company. It can back the firm as a national champion, or it can work patiently to make the kingdom less dependent on it. Either path takes years, and the firm's board will be reading every line of the cabinet minutes.\n\nProvisional gameplay."
 ac_wd_pbl.4.a:0 "Back the firm as a national champion."
 ac_wd_pbl_4_a:0 "Back the firm as a national champion."
 ac_wd_pbl.4.b:0 "Plan for a kingdom less dependent on it."
 ac_wd_pbl_4_b:0 "Plan for a kingdom less dependent on it."
 ac_wd_pbl.5.t:0 "The Service Year Debate"
 ac_wd_pbl.5.d:0 "For more than a century every young Perblan has spent a year in uniform. The policy was built to match the size of Osea's forces, and it has given the kingdom an enormous pool of trained reservists. It has also given it barracks that flood every spring, a training budget larger than some ministries and a year of every worker's youth spent away from fields and factories.\n\nThe general staff wants the year kept and modernised; in its view, the frontier with Osea has not moved and neither should the policy. Employers and many families want it shortened or made voluntary, arguing that a growing economy needs young workers more than parade grounds. A third group proposes that conscripts be allowed to serve in civil brigades building roads and wells in the poorer crown lands.\n\nThe royal review must hear all of them before it recommends anything. How it is run matters as much as what it concludes: a review led by generals will be trusted by the army and doubted by everyone else, while a review open to employers and families will be trusted by the public and resented in the officers' messes.\n\nProvisional gameplay."
 ac_wd_pbl.5.a:0 "Let the general staff lead the review."
 ac_wd_pbl.5.b:0 "Give employers and families a voice."
 ac_wd_pbl.6.t:0 "War Beyond the Frontier"
 ac_wd_pbl.6.d:0 "In the spring of 1995 the long crisis around Belka becomes open war. Perbla is not a party to it, yet it can hardly stand apart from it in spirit. Belka has been the kingdom's oldest friend for generations, and the Belkan munitions branch at Gatewood employs thousands. Osea, the largest neighbour, sits directly across the Serenava frontier, and the service year was built a century ago to match its army.\n\nThe first days bring rumours faster than facts. Radio bulletins contradict each other, foreign embassies ask what Perbla intends, and shipping insurers raise their rates on every lane near the war. Frontier commanders in Serenava report heavy traffic on the far side of the line, though nobody can say whether it is guarding or preparing. In the capital, crowds gather outside newspaper offices waiting for the evening editions.\n\nThe crown has opened a war room in Gatewood and placed the frontier commands on watch. It has not yet said where its sympathies lie, and every faction is pressing for a statement. The government's first task is smaller and harder: to decide how much of its own uncertainty it should share with the public.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25 in docs/research/CHRONICLE_INDEX.md; the Perblan response is gameplay."
 ac_wd_pbl.6.a:0 "Tell the public everything we know."
 ac_wd_pbl.6.b:0 "Reassure first, explain later."
 ac_wd_pbl.7.t:0 "The Old Alliance Debated"
 ac_wd_pbl.7.d:0 "Behind closed doors, the court takes up the question every officers' mess has argued since the war began: what does Perbla owe Belka? The friendship between the two nations is old enough to be ceremonial and warm enough to be real. Belkan contracts keep the munitions branch at Gatewood busy, and many senior officers trained beside Belkan colleagues. Osea, by long habit, is the neighbour the kingdom plans against.\n\nA loud minority wants more than sympathy. They speak of a second front, of a brother nation in its hour of need, of honour. Others answer that any second front would be fought on Perblan soil, along the Serenava bunkers, against a neighbour many times larger. The ports and converted factories, which trade across the frontier every day, want no part of it. The crown listens to all of them and says very little.\n\nThe decision recorded today is a statement of policy, not a declaration of war. Any armed intervention would be a separate and grave act, taken only if the war itself forced the question. What the court can settle now is the tone: how warmly Perbla speaks of its old friend, and how carefully it speaks to its larger neighbour.\n\nMod provenance: events/Perbla.txt perbla_intervention.1 to .3 and the historical_friends and historical_enemies opinion modifiers in common/on_actions/ac_on_actions.txt; this debate commits no forces and leaves that path unchanged."
 ac_wd_pbl.7.a:0 "Speak warmly of our old friends."
 ac_wd_pbl.7.b:0 "Speak carefully to everyone."
 ac_wd_pbl.7.c:0 "Remind Osea of our frontier divisions."
 ac_wd_pbl.8.t:0 "Ulysses in the Night Sky"
 ac_wd_pbl.8.d:0 "Since the astronomers' warning of December 1994, the asteroid called Ulysses has been a distant worry. In April 1996 it becomes a near one, when the world is told that it will strike the Earth and that nations must prepare. Nobody can yet say where the fragments will fall. Perbla, like every country, has to plan for a danger whose location is still a guess.\n\nThe crown's advisers split along familiar lines. Engineers propose deep shelters under the large cities, stocked for weeks. Astronomers and radar specialists propose early warning and evacuation instead, arguing that hours of notice save more lives than concrete. The treasury notes that either plan costs as much as a new arms programme, and the arms trusts note that their own plans would be delayed.\n\nPublic mood swings between panic and denial. Places of worship are full, hardware shops sell out of tinned food, and some families on the coast talk of moving inland. The government must decide how to speak about a threat it cannot control, and whether its first priority is calm or preparation. Both, the ministers know, cannot be bought at once.\n\nProvisional gameplay: date anchors only, ACES Chronicle rows 1994 / 12.10 and 1996 / 04.20 in docs/research/CHRONICLE_INDEX.md; Perblan preparations are gameplay."
 ac_wd_pbl.8.a:0 "Prepare openly and quickly."
 ac_wd_pbl_8_a:0 "Prepare openly and quickly."
 ac_wd_pbl.8.b:0 "Keep calm and keep working."
 ac_wd_pbl.9.t:0 "Oil Under Terentio"
 ac_wd_pbl.9.d:0 "The geological survey of the Terentio desert is finished, and its maps are better than anyone hoped. The fields hold far more oil than the old rigs suggested, and the bauxite beds stretch toward Torre Mountain. For a kingdom that has lived on arms contracts, the desert offers a second income that does not depend on anyone else's war.\n\nThe question is who will own it. A crown company would keep the revenue at home but drill slowly, managed by ministries with other priorities. Private concessions would bring rigs and foreign capital within a few years but hand the desert's future to shareholders. Terentio's own towns, which have hauled water by truck for generations, want to know what share of the wealth will stay where it is pumped.\n\nInvestors are already calling the ministry, and some are offering terms that sound generous until the fine print. The trusts want first claim on the steel and power the new fields will need. Before any model is chosen, the government must decide whether to slow the rush or welcome it, knowing that whatever it says this week will be quoted in every negotiation that follows.\n\nProvisional gameplay."
 ac_wd_pbl.9.a:0 "Keep the desert under the crown for now."
 ac_wd_pbl.9.b:0 "Let the investors move fast."
 ac_wd_pbl_9_b:0 "Let the investors move fast."
 ac_wd_pbl.10.t:0 "Ten Years On"
 ac_wd_pbl.10.d:0 "A decade after the crown question was first opened, an independent panel publishes its review of how the kingdom governs itself. It lists what the chosen order has built, whom it has failed and what it now costs to run. The panel includes judges, economists and deputies from all four crown lands, and its members were chosen by lot rather than by the government of the day.\n\nThe findings are mixed in ways every faction can quote. The industrial towns are richer and the frontier is calm, but the outer lands still feel governed from Gatewood, young graduates still leave for jobs abroad, and too many decisions depend on a handful of offices and firms. The panel warns that the next decade will test whether the arrangements of the nineties can bend without breaking.\n\nThe government must decide how to answer. It can publish the review unedited and accept a season of hostile headlines, or release an approved summary that highlights success and buries the rest. Either way, the review will set the terms of political argument for the new century, and every faction already has its quotations ready.\n\nProvisional gameplay."
 ac_wd_pbl.10.a:0 "Publish the review unedited."
 ac_wd_pbl.10.b:0 "Release an approved summary."
 ac_wd_pbl.11.t:0 "The Monday Morning Exercise"
 ac_wd_pbl.11.d:0 "At six on a Monday morning the treasury opens the sealed rescue plan and runs it as though the national electronics firm had missed its payroll. Banks are told to freeze credit lines, suppliers are told to expect no payment, and the defence staff is asked which aircraft would be grounded first. Nobody outside the exercise is supposed to know.\n\nBy noon the gaps are obvious. The emergency credit line takes three days to clear rather than three hours. Two critical radar parts have no second source after all. The plan assumed the firm's managers would cooperate, and in the exercise they did not. By evening a newspaper has the story, and the firm's investors begin a nervous week of phone calls to the ministry.\n\nThe exercise has done its job: it found the failures before a real crisis did. Now the government must decide what to do with what it learned. It can close the gaps quietly and deny the leak, or publish the lessons and accept that the firm's reputation will take a knock. The defence staff has already said which it prefers, and the firm's board has said the opposite.\n\nProvisional gameplay."
 ac_wd_pbl.11.a:0 "Close the gaps quietly."
 ac_wd_pbl_11_a:0 "Close the gaps quietly."
 ac_wd_pbl.11.b:0 "Publish the lessons."
 ac_wd_pbl.12.t:0 "A Neighbour at War"
 ac_wd_pbl.12.d:0 "In late September 2010 Yuktobania declares war on Osea and attacks an Osean port. Perbla wakes to the news that its largest neighbour, the country its service year was built to match, is fighting a war that has nothing to do with the Serenava frontier. For once, Osea's guns point away from Perbla.\n\nThe consequences arrive anyway. Shipping insurers raise rates on every lane that touches Osean waters. Osean buyers call Perblan factories asking for trucks, electronics and munitions, and they want them now. Yuktobanian diplomats ask pointed questions about what Perbla intends to sell. Frontier towns that live on trade with Osea worry about their customers, and harbour masters worry about submarines.\n\nThe security council meets in Gatewood to decide the kingdom's posture. Some ministers see a commercial opportunity that may not come again. Others see a trap: a neutral kingdom that sells to one side of a war is no longer neutral in the eyes of the other. The first decision is how to describe Perbla's position in public, before Osean and Yuktobanian newspapers describe it for the kingdom.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2010 / 09.27 in docs/research/CHRONICLE_INDEX.md; the Perblan response is gameplay."
 ac_wd_pbl.12.a:0 "Declare strict neutrality at once."
 ac_wd_pbl.12.b:0 "Keep every option open for now."
 ac_wd_pbl.13.t:0 "Drones Over the Harbours"
 ac_wd_pbl.13.d:0 "On 15 May 2019 drone attacks strike four major Osean naval ports, and on the same day Erusea declares war on Osea. The footage from the Osean harbours is everywhere by evening: small, cheap aircraft slipping past defences built for missiles and bombers. Perbla's own harbours at Sofern and Baleton are smaller, but they are built the same way.\n\nThe security council meets the same night. The navy reports that its harbour defences could not reliably stop a swarm of small drones. The engineers at Gatewood argue that most such drones depend on radio links and satellite navigation that could be jammed. The ports' owners ask who will pay for any of it, and the ministers ask how long it would take.\n\nNobody in the room expects Perbla to be a target. That is precisely what worries the navy: the Osean ports did not expect it either. The government must decide whether to treat this as a distant war's lesson or as an immediate warning, and the answer will shape a decade of spending. Whatever it chooses, the harbour masters want an answer before the summer shipping season begins.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2019 / 05.15 in docs/research/CHRONICLE_INDEX.md; the Perblan response is gameplay."
 ac_wd_pbl.13.a:0 "Treat it as an immediate warning."
 ac_wd_pbl.13.b:0 "Study it before spending."
 ac_wd_pbl_13_b:0 "Study it before spending."
