 ac_wc_soa.16.d:0 "A merchant operator and the naval staff both need the same experienced crews. The fleet can pay for voluntary reserve service, train around commercial schedules, or hold a dedicated escort rotation.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
