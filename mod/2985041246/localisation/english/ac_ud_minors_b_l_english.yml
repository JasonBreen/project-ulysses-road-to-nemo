l_english:
 CAL_ud_accord_corridors:0 "Corridors of the Accord"
 CAL_ud_accord_corridors_desc:0 "The continental accord has held. Freight held back during the crisis floods the corridors, and the timetables strain to carry it.\n\nProvisional gameplay on the averted-war alternative; in the official chronology the war happens."
 CAL_ud_administration_review:0 "Review the National Administration"
 CAL_ud_administration_review_desc:0 "The National Administration governs without elections under a constitution that was suspended so long ago that most officials have never read it. The review will start by reading it.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_adopt_programme:0 "Adopt the The Crossroads Programme"
 CAL_ud_adopt_programme_desc:0 "Replace the shared regional or generic programme with Calladen's national programme once its current focus is idle. Completed focuses are kept. No equipment, factories or historical rewards are granted. Provisional gameplay."
 CAL_ud_belligerent_cargo:0 "Belligerent Cargo Requests"
 CAL_ud_belligerent_cargo_desc:0 "Erusea has invaded San Salvacion. Within weeks, requests arrive at the clearing house to move cargo for the war across Calladen's corridors.\n\nProvisional gameplay. The war it answers is official (ACES Chronicle, 2003 / SUMMER onward)."
 CAL_ud_bilateral_frontier_treaties:0 "Bilateral Frontier Treaties"
 CAL_ud_bilateral_frontier_treaties_desc:0 "Separate frontier treaties with each neighbour, negotiated one at a time. Each one is a small victory; together they are a lot of paperwork.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_bilateral_treaties:0 "Calladen has signed bilateral frontier treaties"
 CAL_ud_bonded_corridors:0 "Bonded Corridors Doctrine"
 CAL_ud_bonded_corridors_desc:0 "Transit goods will travel only on bonded routes between licensed depots, sealed at one frontier and opened at the other. It is slower, safer and more profitable for the state.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_bonded_corridors_spirit:0 "Bonded Corridors"
 CAL_ud_bonded_corridors_spirit_desc:0 "Transit goods travel only on bonded routes between licensed depots, sealed at one frontier and opened at the other.\n\nProvisional gameplay."
 CAL_ud_bulgurdaresti_desk:0 "The Bulgurdaresti Desk"
 CAL_ud_bulgurdaresti_desk_desc:0 "Bulgurdarest meets Calladen only in the inland district, but most of its freight to the sea crosses there. A desk at the junction will handle it.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_capital_fuel_wharf:0 "The Capital Fuel Wharf"
 CAL_ud_capital_fuel_wharf_desc:0 "A fuel wharf on the capital district's harbour will let tankers unload directly into the railway's storage instead of into road tankers.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_charter_office:0 "Council of the Electoral Charter"
 CAL_ud_charter_office_desc:0 "A cabinet answerable to elected district assemblies under Calladen's written charter. An unnamed office government; no individual officeholder is asserted. Provisional gameplay."
 CAL_ud_clearing_house:0 "The Crossroads Clearing House"
 CAL_ud_clearing_house_desc:0 "Fees, tolls and customs credits from all four frontiers will be settled in one office in the capital district. Calladen becomes the place where Usean transit is accounted for.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_constitutional_commission:0 "Seat a Constitutional Commission"
 CAL_ud_constitutional_commission_desc:0 "A commission of jurists, district officials and frontier commanders will report on how Calladen should be governed. Each of them already has an answer.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_corridor_authority:0 "The Corridor Authority"
 CAL_ud_corridor_authority_desc:0 "Every road, rail line and depot that carries transit freight passes to one authority, answerable only to the Directorate.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_corridor_authority_spirit:0 "The Corridor Authority"
 CAL_ud_corridor_authority_spirit_desc:0 "One authority owns every road, rail line and depot that carries transit freight.\n\nProvisional gameplay."
 CAL_ud_corridor_directorate_spirit:0 "Corridor Directorate"
 CAL_ud_corridor_directorate_spirit_desc:0 "Engineers and customs officials govern by plan. Their plans are good; their patience with objections is short.\n\nProvisional gameplay."
 CAL_ud_corridor_readiness_audit:0 "Corridor Readiness Audit"
 CAL_ud_corridor_readiness_audit_desc:0 "With Stonehenge complete and the impact a year away, every corridor, shelter and reserve will be inspected and the results published.\n\nProvisional gameplay, opened by the official completion of Stonehenge (ACES Chronicle, 1998 / 06.19)."
 CAL_ud_council_delegation:0 "A Customs Delegation to the Council"
 CAL_ud_council_delegation_desc:0 "Three of Calladen's four neighbours sit with it on the Central Usean Treaty Council. A permanent customs delegation will make sure the council's rules fit the crossroads.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_council_freight_standards:0 "Council Freight Standards"
 CAL_ud_council_freight_standards_desc:0 "Seals, wagon papers and inspection forms will be the same across the council's members, printed in Calladen and checked in Calladen.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_council_transit_protocol:0 "Draft the Council Transit Protocol"
 CAL_ud_council_transit_protocol_desc:0 "Calladen will draft a common transit protocol for every council member. If the council adopts it, Calladen's code becomes everyone's code.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_council_transit_protocol_spirit:0 "Treaty Council Transit Protocol"
 CAL_ud_council_transit_protocol_spirit_desc:0 "Calladen's customs follow a common protocol drafted for the members of the Central Usean Treaty Council.\n\nProvisional gameplay."
 CAL_ud_coup_reports:0 "The Coup Reports"
 CAL_ud_coup_reports_desc:0 "Reports of a coup across Usea reach the capital district by telex. The National Administration must decide what its own garrisons are told, and what it asks of them.\n\nProvisional gameplay, opened by the official Usea-wide coup (ACES Chronicle, 1997 / 05.30)."
 CAL_ud_crossing_registry:0 "Register Every Crossing"
 CAL_ud_crossing_registry_desc:0 "Every person who crosses a Calladenian frontier will be registered, with name, purpose and destination. The lines at the posts grow longer.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_crossroads_after_war:0 "The Crossroads After the War"
 CAL_ud_crossroads_after_war_desc:0 "The war has ended, one way or another. Calladen counts what crossed its frontiers, what it refused, and what its neighbours now think of the crossroads.\n\nProvisional gameplay after the Continental War outcome (ACES Chronicle, 2005 / 09.19 for the official ending)."
 CAL_ud_crossroads_clearing_house_spirit:0 "The Crossroads Clearing House"
 CAL_ud_crossroads_clearing_house_spirit_desc:0 "Transit fees, tolls and customs credits from four frontiers are settled in one office in the capital district.\n\nProvisional gameplay."
 CAL_ud_crossroads_survey:0 "Survey the Crossroads"
 CAL_ud_crossroads_survey_desc:0 "Nobody has ever counted how much freight crosses Calladen, from where, and to whom. The survey will count every wagon and truck at every frontier post for a full season.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_customs_code:0 "Write a Single Customs Code"
 CAL_ud_customs_code_desc:0 "Calladen's customs rules are four separate arrangements, one for each neighbour, patched together over decades. A single code would make the crossroads legible to everyone who uses it.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_directorate_office:0 "Transit Directorate"
 CAL_ud_directorate_office_desc:0 "The senior engineers and customs officials of the National Administration, governing by plan. An unnamed office government; no individual officeholder is asserted. Provisional gameplay."
 CAL_ud_district_assemblies:0 "Elect Three District Assemblies"
 CAL_ud_district_assemblies_desc:0 "The capital district, Port Edwards and the interior each elect an assembly. Their first sessions are mostly about roads.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_dorondan_desk:0 "The Dorondan Desk"
 CAL_ud_dorondan_desk_desc:0 "Dorondo's frontier runs straight into the capital district. A desk in the capital will handle the busiest commuter and freight crossing in the country.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_dorondo_road:0 "Widen the Dorondo Road"
 CAL_ud_dorondo_road_desc:0 "The road from the Dorondan frontier into the capital is narrow, old and always full. Widening it is the most popular public work Calladen could start.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_electoral_charter:0 "Adopt the Electoral Charter"
 CAL_ud_electoral_charter_desc:0 "The commission's jurists propose a written charter: district assemblies, a cabinet answerable to them, and elections on a fixed calendar.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_electoral_charter_spirit:0 "The Electoral Charter"
 CAL_ud_electoral_charter_spirit_desc:0 "The National Administration governs under a written charter, answerable to elected district assemblies.\n\nProvisional gameplay."
 CAL_ud_engineers_cabinet:0 "A Cabinet of Engineers"
 CAL_ud_engineers_cabinet_desc:0 "Every ministry is given to the official who knows its work best. The cabinet meets with drawings on the table instead of newspapers.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_evacuation_timetables:0 "Evacuation Timetables"
 CAL_ud_evacuation_timetables_desc:0 "Every train, bus and truck in Calladen is given a place in an evacuation timetable, practised on quiet Sundays.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 CAL_ud_ferustian_desk:0 "The Ferustian Desk"
 CAL_ud_ferustian_desk_desc:0 "Ferustia borders both the capital district and the interior, and it is not a member of the treaty council. Its freight needs a desk of its own and rules of its own.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_ferustian_exception:0 "The Ferustian Exception"
 CAL_ud_ferustian_exception_desc:0 "Ferustian freight will cross on separate terms negotiated directly with Ferustia, outside any council protocol. It is awkward, and it keeps the busiest frontier open.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_ferustian_terms:0 "Calladen keeps separate customs terms for Ferustia"
 CAL_ud_first_general_election:0 "The First General Election"
 CAL_ud_first_general_election_desc:0 "The first national election under the charter. Polling stations at the frontier posts let commuters vote on their way across.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_frontier_council:0 "Seat the Frontier Security Council"
 CAL_ud_frontier_council_desc:0 "The frontier commanders propose that a country made of borders should be governed by the people who guard them. The council would rule until the frontiers are secure.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_frontier_council_spirit:0 "Frontier Security Council"
 CAL_ud_frontier_council_spirit_desc:0 "The frontier is the nation, the council says, and every crossing is a question of security first.\n\nProvisional gameplay."
 CAL_ud_frontier_guard:0 "Raise the Frontier Guard"
 CAL_ud_frontier_guard_desc:0 "A national frontier guard, separate from the customs service and armed, will take over every crossing from the civilian inspectors.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_frontier_office:0 "Frontier Security Council"
 CAL_ud_frontier_office_desc:0 "The commanders of the frontier posts and their civilian allies, governing the crossroads as a frontier. An unnamed office government; no individual officeholder is asserted. Provisional gameplay."
 CAL_ud_garrison_review:0 "Review the Garrison Commands"
 CAL_ud_garrison_review_desc:0 "Every garrison commander will report in person to the capital district, explain the orders they hold, and go back with new ones.\n\nProvisional gameplay, opened by the official Usea-wide coup (ACES Chronicle, 1997 / 05.30)."
 CAL_ud_garrisons_reviewed:0 "Calladen has reviewed its garrison commands"
 CAL_ud_humanitarian_corridors:0 "Humanitarian Corridors"
 CAL_ud_humanitarian_corridors_desc:0 "Refugees may cross Calladen on marked corridors with food, shelter and medical posts along the way, and stay if they have nowhere else to go.\n\nProvisional gameplay, opened by the official Erusean refugee closure (ACES Chronicle, 2000 / 04.21)."
 CAL_ud_humanitarian_corridors_spirit:0 "Humanitarian Corridors"
 CAL_ud_humanitarian_corridors_spirit_desc:0 "Refugees may cross Calladen on marked corridors, with food, shelter and medical posts along the way.\n\nProvisional gameplay."
 CAL_ud_interior_freight_office:0 "Joint Interior Freight Office"
 CAL_ud_interior_freight_office_desc:0 "Calladenian and Bulgurdaresti hauliers will book loads through one office at the interior junction, so that no truck crosses the frontier empty.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_interior_highway:0 "The Interior Highway"
 CAL_ud_interior_highway_desc:0 "A modern highway from the Bulgurdaresti frontier to the interior junction, built for heavy trucks rather than market carts.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_interior_junction:0 "The Interior Junction"
 CAL_ud_interior_junction_desc:0 "Every route across Calladen meets in the inland district. Sidings, depots and warehouses there will let freight change trains instead of waiting at the frontiers.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_interior_market_towns:0 "Interior Market Towns"
 CAL_ud_interior_market_towns_desc:0 "The market towns on the Ferustian side of the interior district grow with every season of transit trade. A little investment will turn their workshops into factories.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_interior_shelters:0 "Shelters in the Interior District"
 CAL_ud_interior_shelters_desc:0 "The interior district is furthest from the sea and best connected by rail. Shelters and stores under its depots will serve the whole country.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 CAL_ud_interior_shelters_spirit:0 "Interior District Shelters"
 CAL_ud_interior_shelters_spirit_desc:0 "Shelters and stores under the interior district's depots, sized for the people who live there and those passing through.\n\nProvisional gameplay."
 CAL_ud_licensed_war_freight:0 "Licensed War Freight"
 CAL_ud_licensed_war_freight_desc:0 "Belligerent cargo will cross under licence, at a premium, on the bonded routes. Calladen will be paid for its geography.\n\nProvisional gameplay. The war it answers is official (ACES Chronicle, 2003 / SUMMER onward)."
 CAL_ud_licensed_war_freight_spirit:0 "Licensed War Freight"
 CAL_ud_licensed_war_freight_spirit_desc:0 "Belligerent cargo crosses Calladen under licence, at a premium, on the bonded routes.\n\nProvisional gameplay."
 CAL_ud_national_service:0 "National Service Law"
 CAL_ud_national_service_desc:0 "Every young Calladenian will serve a term on the frontier posts. The council calls it a school of citizenship; the depots call it a labour shortage.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_national_service_spirit:0 "National Service"
 CAL_ud_national_service_spirit_desc:0 "Every young Calladenian serves a term on the frontier posts. The posts are fully manned; the depots are short of hands.\n\nProvisional gameplay."
 CAL_ud_national_tariff_reserve:0 "Reserve National Tariff Powers"
 CAL_ud_national_tariff_reserve_desc:0 "Calladen will keep the power to set its own transit tariffs and bargain with each neighbour separately. The council may advise; it will not decide.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_national_tariff_reserve_spirit:0 "National Tariff Reserve"
 CAL_ud_national_tariff_reserve_spirit_desc:0 "Calladen keeps the power to set its own transit tariffs and negotiates with each neighbour separately.\n\nProvisional gameplay."
 CAL_ud_neighbour_shelter_terms:0 "Calladen has shelter compacts with its neighbours"
 CAL_ud_neutral_transit_rules:0 "Neutral Transit Rules"
 CAL_ud_neutral_transit_rules_desc:0 "No cargo for any belligerent will cross Calladen, whatever its papers say. The corridors stay open for everything else.\n\nProvisional gameplay. The war it answers is official (ACES Chronicle, 2003 / SUMMER onward)."
 CAL_ud_neutral_transit_spirit:0 "Neutral Transit Rules"
 CAL_ud_neutral_transit_spirit_desc:0 "No cargo for any belligerent crosses Calladen, whatever its papers say.\n\nProvisional gameplay."
 CAL_ud_open_transit:0 "Open Transit Doctrine"
 CAL_ud_open_transit_desc:0 "Transit goods will cross on one declaration and one seal, and inspectors will stop a wagon only when they have a reason. Freight will move faster, and some of it will be things Calladen would rather not carry.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_open_transit_spirit:0 "Open Transit Doctrine"
 CAL_ud_open_transit_spirit_desc:0 "Goods in transit cross Calladen on one declaration and one seal, inspected only when there is cause.\n\nProvisional gameplay."
 CAL_ud_port_edwards_dockyard:0 "A Dockyard at Port Edwards"
 CAL_ud_port_edwards_dockyard_desc:0 "Port Edwards has quays but no yard. A dockyard there will build and repair the coasters that carry Calladen's transit freight along the shore.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_port_edwards_line:0 "The Port Edwards Line"
 CAL_ud_port_edwards_line_desc:0 "A rebuilt line from the Scandian frontier down to Port Edwards will let inland freight reach the sea without passing through the capital district.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_port_edwards_quays:0 "Rebuild the Port Edwards Quays"
 CAL_ud_port_edwards_quays_desc:0 "Calladen's sea trade runs through two harbours, and the smaller one at Port Edwards has been left to decay. Rebuilt quays will give the inland routes a second outlet.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_refugees_at_frontier:0 "Refugees at the Frontier Posts"
 CAL_ud_refugees_at_frontier_desc:0 "Erusea has closed its doors to refugees, and the roads and railways that might have led there now lead to Calladen's frontier posts instead.\n\nProvisional gameplay, opened by the official Erusean refugee closure (ACES Chronicle, 2000 / 04.21)."
 CAL_ud_registered_transit:0 "Registered Transit Only"
 CAL_ud_registered_transit_desc:0 "Refugees may cross Calladen only when registered at the frontier and sponsored onward by the country they are going to.\n\nProvisional gameplay, opened by the official Erusean refugee closure (ACES Chronicle, 2000 / 04.21)."
 CAL_ud_registered_transit_spirit:0 "Registered Transit"
 CAL_ud_registered_transit_spirit_desc:0 "Refugees may cross Calladen only when registered at the frontier and sponsored onward.\n\nProvisional gameplay."
 CAL_ud_relief_berths:0 "Relief Berths at Port Edwards"
 CAL_ud_relief_berths_desc:0 "Relief ships unload at Port Edwards, away from the crowded capital harbour, straight onto the rebuilt line inland.\n\nProvisional gameplay, opened by the official impact (ACES Chronicle, 1999 / 07.08)."
 CAL_ud_relief_free_passage:0 "Calladen gave relief cargo free passage"
 CAL_ud_relief_priority_spirit:0 "Relief Priority on the Railways"
 CAL_ud_relief_priority_spirit_desc:0 "Relief trains run ahead of ordinary freight on every Calladenian line.\n\nProvisional gameplay."
 CAL_ud_relief_tolled:0 "Calladen charged its normal tolls on relief cargo"
 CAL_ud_relief_train_service_decision:0 "Run the Relief Train Service"
 CAL_ud_relief_train_service_decision_desc:0 "Give relief trains priority on every Calladenian line for four months. Costs 25 political power and 2 institutional capacity; when the fiscal model is ready, it also books a programme payment. Provisional gameplay."
 CAL_ud_relief_trains:0 "Relief Trains to the Neighbours"
 CAL_ud_relief_trains_desc:0 "Relief trains will run ahead of all other freight on every line, to whichever frontier asks for them.\n\nProvisional gameplay, opened by the official impact (ACES Chronicle, 1999 / 07.08)."
 CAL_ud_relief_transit:0 "Relief Transit Through the Crossroads"
 CAL_ud_relief_transit_desc:0 "After the impact, relief for Calladen's neighbours must cross Calladen. The country's corridors are about to carry the most important freight they have ever carried.\n\nProvisional gameplay, opened by the official impact (ACES Chronicle, 1999 / 07.08)."
 CAL_ud_rolling_stock_reserve:0 "A Rolling-Stock Reserve"
 CAL_ud_rolling_stock_reserve_desc:0 "Locomotives, wagons and the fuel to run them will be held back at the interior junction, ready for the day ordinary traffic stops.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 CAL_ud_scandian_crossings:0 "Joint Crossings with Scandia"
 CAL_ud_scandian_crossings_desc:0 "Calladenian and Scandian officers will work from the same buildings at the busiest crossings, so that a wagon is inspected once and not twice.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_scandian_desk:0 "The Scandian Desk"
 CAL_ud_scandian_desk_desc:0 "Scandia meets Calladen at Port Edwards and along the inland district. A permanent desk will handle every Scandian crossing under the new code instead of case by case.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_sea_rail_interchange:0 "The Sea-Rail Interchange"
 CAL_ud_sea_rail_interchange_desc:0 "Both harbours and the inland railway will work from one timetable. A ship's cargo can be on a train the same day it is unloaded.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_sea_rail_interchange_spirit:0 "The Sea-Rail Interchange"
 CAL_ud_sea_rail_interchange_spirit_desc:0 "Port Edwards and the capital district quays share one timetable with the inland railway.\n\nProvisional gameplay."
 CAL_ud_shared_freight_yards:0 "Shared Freight Yards"
 CAL_ud_shared_freight_yards_desc:0 "New freight yards on the capital district's frontier side, shared with Dorondan carriers, will take the trucks off the city streets.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_shelter_compacts:0 "Shelter Compacts with the Neighbours"
 CAL_ud_shelter_compacts_desc:0 "Calladen and its neighbours agree to shelter each other's travellers if an alarm catches them on the wrong side of a frontier.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 CAL_ud_tariffs_by_formula:0 "Tariffs by Formula"
 CAL_ud_tariffs_by_formula_desc:0 "Transit tariffs will be set by a published formula, recalculated every quarter, instead of by negotiation. Hauliers complain about the formula and stop complaining about favouritism.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_through_freight:0 "A Through-Freight Timetable"
 CAL_ud_through_freight_desc:0 "One timetable for every transit train, agreed with the neighbours' railways, so that a wagon leaving one frontier knows when it will reach the other.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_transit_directorate:0 "Form the Transit Directorate"
 CAL_ud_transit_directorate_desc:0 "The administration's engineers and customs officials propose to govern as they run the corridors: by plan, by timetable and without elections that might interrupt either.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_transit_fees_decision:0 "Transit Fee Season"
 CAL_ud_transit_fees_decision_desc:0 "Add a temporary surcharge on transit freight at every frontier post for six months. Costs 25 political power and 2 institutional capacity; when the fiscal model is ready, it also books a programme payment. Provisional gameplay."
 CAL_ud_transit_fees_spirit:0 "Transit Fee Season"
 CAL_ud_transit_fees_spirit_desc:0 "A temporary surcharge on transit freight, collected at every frontier post.\n\nProvisional gameplay."
 CAL_ud_transit_rights_act:0 "The Transit Rights Act"
 CAL_ud_transit_rights_act_desc:0 "The elected cabinet writes the right of lawful passage into law, so that no future government can close the crossroads by decree.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 CAL_ud_transit_rights_spirit:0 "The Transit Rights Act"
 CAL_ud_transit_rights_spirit_desc:0 "The right of lawful passage across Calladen is written into law and cannot be suspended by decree.\n\nProvisional gameplay."
 CAL_ud_ulysses_corridors:0 "The Ulysses Corridors"
 CAL_ud_ulysses_corridors_desc:0 "Central Usea has announced that Ulysses will strike Earth. A country that lives on moving things must now plan how to move people, and where to keep them still.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 CAL_ud_war_cargo_refused:0 "Calladen refuses belligerent cargo"
 RJR_ud_accord_on_the_frontier:0 "The Accord on the Frontier"
 RJR_ud_accord_on_the_frontier_desc:0 "The continental accord has held. The frontier with Central Usea is quiet, and the traffic that waited out the crisis is moving on the interior roads again.\n\nProvisional gameplay on the averted-war alternative; in the official chronology the war happens."
 RJR_ud_adopt_programme:0 "Adopt the The Mountain Republic"
 RJR_ud_adopt_programme_desc:0 "Replace the shared regional or generic programme with Roca Roja's national programme once its current focus is idle. Completed focuses are kept. No equipment, factories or historical rewards are granted. Provisional gameplay."
 RJR_ud_arms_length_frontier:0 "Hold the Frontier at Arm's Length"
 RJR_ud_arms_length_frontier_desc:0 "Roca Roja will keep its own frontier rules and its own customs. The Federal Republic is a good neighbour; it is not the republic's patron, and must not become one.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_arms_length_spirit:0 "Arm's Length Frontier"
 RJR_ud_arms_length_spirit_desc:0 "Roca Roja keeps its own frontier rules and its own counsel. Central Usea is a neighbour, not a patron.\n\nProvisional gameplay."
 RJR_ud_associate_with_central_usea:0 "Associate with Central Usea"
 RJR_ud_associate_with_central_usea_desc:0 "The interior's roads, customs and frontier police will adopt the Federal Republic's rules. Trade will cross the line more easily, and Roca Roja will be counted as Central Usea's friend.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_associated:0 "Roca Roja has associated its frontier with Central Usea"
 RJR_ud_canton_charters:0 "Charters for the Three Cantons"
 RJR_ud_canton_charters_desc:0 "Each canton will receive a written charter setting out its taxes, its courts and its roads. What is not in a charter belongs to the canton, not the League.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_cantonal_league:0 "Proclaim the Cantonal League"
 RJR_ud_cantonal_league_desc:0 "The three districts propose to become three cantons, each with its own assembly, joined in a League that may do only what all three allow. The capital will have to persuade the mountains.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_cantonal_league_spirit:0 "The Cantonal League"
 RJR_ud_cantonal_league_spirit_desc:0 "Three cantons, three assemblies and a League Council that may only do what all three allow.\n\nProvisional gameplay."
 RJR_ud_cantonal_militia:0 "The Cantonal Militia"
 RJR_ud_cantonal_militia_desc:0 "Each canton will keep a militia trained in its own valleys, lent to the League only to defend the republic. It is cheap, local and very hard to dislodge.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_cantonal_militia_spirit:0 "The Cantonal Militia"
 RJR_ud_cantonal_militia_spirit_desc:0 "Every canton keeps its own militia, trained in its own valleys, and lends it to the League only for defence.\n\nProvisional gameplay."
 RJR_ud_cantonal_office:0 "League Council of the Cantons"
 RJR_ud_cantonal_office_desc:0 "Delegates of the three cantonal assemblies, acting together only where all three agree. An unnamed office government; no individual officeholder is asserted. Provisional gameplay."
 RJR_ud_cantonal_treasuries:0 "Cantonal Treasuries"
 RJR_ud_cantonal_treasuries_desc:0 "Each canton will keep its own treasury and pay an agreed share to the League. Disputes about the share will be settled in public, every year.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_capital_air_station:0 "The Capital Air Station"
 RJR_ud_capital_air_station_desc:0 "The republic's only air base sits beside the capital. Longer runways and hangars will let it hold a real squadron instead of a training flight.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_capital_district_assembly:0 "The Capital District Assembly"
 RJR_ud_capital_district_assembly_desc:0 "The capital's merchants, dockers and clerks will elect a district assembly, so that the capital speaks to the other districts as one voice and not as three companies.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_capital_docks:0 "Deepen the Capital Docks"
 RJR_ud_capital_docks_desc:0 "The harbour board's first project is to dredge the inner basin and lengthen the slipways, so the capital can build and repair the hulls that carry mountain ore.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_capital_freight_terminal:0 "Capital Freight Terminal"
 RJR_ud_capital_freight_terminal_desc:0 "A freight terminal where mountain roads meet the capital's quays, so that council traffic can change from truck to ship without a week's wait.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_capital_harbour_board:0 "The Capital Harbour Board"
 RJR_ud_capital_harbour_board_desc:0 "The capital's docks are run by three companies, a municipal clerk and a great deal of goodwill. A single harbour board will run the cranes, the sidings and the berths to one timetable.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_capital_harbour_spirit:0 "The Capital Harbour Board"
 RJR_ud_capital_harbour_spirit_desc:0 "One board now runs the capital's docks, cranes and rail sidings, instead of three companies and a municipal clerk.\n\nProvisional gameplay."
 RJR_ud_chain_of_command_review:0 "Review the Chain of Command"
 RJR_ud_chain_of_command_review_desc:0 "Whatever happened elsewhere, the republic will write down who may give its soldiers orders, and who may not, and read the list aloud in every barracks.\n\nProvisional gameplay, opened by the official Usea-wide coup (ACES Chronicle, 1997 / 05.30)."
 RJR_ud_commonwealth_land_law:0 "The Commonwealth Land Law"
 RJR_ud_commonwealth_land_law_desc:0 "The interior's large estates will be divided among the families who farm them. Owners will be paid from the Commonwealth's mining revenue, slowly.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_commonwealth_office:0 "Commonwealth Council of Delegates"
 RJR_ud_commonwealth_office_desc:0 "An elected council resting on the mine and mill councils of the highlands and the interior. An unnamed office government; no individual officeholder is asserted. Provisional gameplay."
 RJR_ud_constitution_debate:0 "The Mountain Constitution Debate"
 RJR_ud_constitution_debate_desc:0 "Three district assemblies now exist and none of them accepts the National Administration as a permanent government. A joint debate will decide what kind of republic the three districts are willing to share.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_convene_three_districts:0 "Convene the Three Districts"
 RJR_ud_convene_three_districts_desc:0 "The capital, the interior and the highlands have each been governed by their own habits for as long as anyone remembers. The National Administration will call their councils together and ask what holds the republic together.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_council_delegation:0 "A Standing Council Delegation"
 RJR_ud_council_delegation_desc:0 "Roca Roja has been a member of the Central Usean Treaty Council without a permanent delegation. The capital assembly will staff one, so that the republic is heard between meetings as well as at them.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_council_road_fund:0 "A Council Road Fund"
 RJR_ud_council_road_fund_desc:0 "If council traffic uses the highland roads, the council can help pay for them. The delegation will propose a shared road fund and a fair share for Roca Roja.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_council_transport_committee:0 "Chair the Transport Committee"
 RJR_ud_council_transport_committee_desc:0 "Roca Roja's delegation will stand for the chair of the council's transport committee. A small republic can lead where it is the one that does the work.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_coup_bulletins:0 "Reports of a Coup"
 RJR_ud_coup_bulletins_desc:0 "Radio stations across Usea report a coup breaking out across the continent, with few details and fewer certainties. The capital must decide what its own garrisons should do while the news is still uncertain.\n\nProvisional gameplay, opened by the official Usea-wide coup (ACES Chronicle, 1997 / 05.30)."
 RJR_ud_coup_calm:0 "Roca Roja kept its garrisons in barracks after the coup reports"
 RJR_ud_coup_garrisons:0 "Roca Roja garrisoned its district offices after the coup reports"
 RJR_ud_customs_posts_spirit:0 "Frontier Customs Posts"
 RJR_ud_customs_posts_spirit_desc:0 "Roca Rojan customs posts on every interior road collect duties and record who crosses, in both directions.\n\nProvisional gameplay."
 RJR_ud_deep_galleries:0 "Shelters in the Deep Galleries"
 RJR_ud_deep_galleries_desc:0 "The safest galleries will be ventilated, lit, stocked and assigned to the towns above them. Miners will do the work, as only miners can.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 RJR_ud_distance_kept:0 "Roca Roja holds Central Usea at arm's length"
 RJR_ud_escort_through_the_passes:0 "Escort Them Through the Passes"
 RJR_ud_escort_through_the_passes_desc:0 "District escorts will take the columns across the mountains and see them safely out the other side. The republic will feed them on the way and not keep them.\n\nProvisional gameplay, opened by the official Erusean refugee closure (ACES Chronicle, 2000 / 04.21)."
 RJR_ud_escorted_passage_spirit:0 "Escorted Passage"
 RJR_ud_escorted_passage_spirit_desc:0 "Refugee columns cross the passes with district escorts and leave by the other side.\n\nProvisional gameplay."
 RJR_ud_federal_association:0 "Form a Federal Association Cabinet"
 RJR_ud_federal_association_desc:0 "The capital and the frontier towns propose a parliamentary cabinet that looks to Central Usea for its model, its markets and its friendship, and answers to an elected parliament for all three.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_federal_association_spirit:0 "Federal Association"
 RJR_ud_federal_association_spirit_desc:0 "A cabinet that looks to Central Usea for its model and its markets, and answers to a parliament for both.\n\nProvisional gameplay."
 RJR_ud_federal_civil_service:0 "A Federal Civil Service"
 RJR_ud_federal_civil_service_desc:0 "The cabinet will replace three district payrolls with one civil service, recruited by examination and posted wherever the republic needs it, including the highlands.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_federal_civil_service_spirit:0 "Federal Civil Service"
 RJR_ud_federal_civil_service_spirit_desc:0 "One civil service for three districts, recruited by examination and paid from one treasury.\n\nProvisional gameplay."
 RJR_ud_federal_elections:0 "The First Federal Elections"
 RJR_ud_federal_elections_desc:0 "The first elections held in all three districts on one day under one law. Polling in the high valleys will take a week to count, and longer to argue over.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_federal_office:0 "Federal Association Cabinet"
 RJR_ud_federal_office_desc:0 "A parliamentary cabinet that seeks the closest association with Central Usea that the treaty council allows. An unnamed office government; no individual officeholder is asserted. Provisional gameplay."
 RJR_ud_federal_standards_law:0 "The Federal Standards Law"
 RJR_ud_federal_standards_law_desc:0 "Weights, gauges and building codes will follow the Federal Republic's standards, so that Roca Rojan mills can sell across the frontier without refitting.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_frontier_association_spirit:0 "Frontier Association with Central Usea"
 RJR_ud_frontier_association_spirit_desc:0 "The interior's roads, customs and frontier police work to the same rules as the Federal Republic's across the line.\n\nProvisional gameplay."
 RJR_ud_frontier_customs_posts:0 "Frontier Customs Posts"
 RJR_ud_frontier_customs_posts_desc:0 "Roca Rojan posts on every interior road will collect duties and record who crosses. The republic will know its own frontier better than its neighbour does.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_frontier_office:0 "The Frontier Office at Roca Roja"
 RJR_ud_frontier_office_desc:0 "The interior faces Central Usea across a long frontier of roads, farms and family ties. An office at Roca Roja will gather every frontier question into one place, and one policy.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_frontier_relief_corridor:0 "Relief Corridor to Central Usea"
 RJR_ud_frontier_relief_corridor_desc:0 "Central Usea has asked for relief. A cleared corridor across the interior, with district escorts, will carry it there faster than any other route.\n\nProvisional gameplay, opened by the official impact (ACES Chronicle, 1999 / 07.08)."
 RJR_ud_gallery_shelters_spirit:0 "Deep Gallery Shelters"
 RJR_ud_gallery_shelters_spirit_desc:0 "The old mine galleries under the Scofield have been ventilated, stocked and assigned to the towns above them.\n\nProvisional gameplay."
 RJR_ud_grain_stores_spirit:0 "Highland Grain Stores"
 RJR_ud_grain_stores_spirit_desc:0 "Granaries in the high valleys hold a year's bread for the three districts.\n\nProvisional gameplay."
 RJR_ud_highland_defence:0 "Defence of the Highlands"
 RJR_ud_highland_defence_desc:0 "Brigades, signal posts and supply roads will work from one highland plan with one staff. It is the most a small republic can do on its own.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_highland_defence_spirit:0 "Defence of the Highlands"
 RJR_ud_highland_defence_spirit_desc:0 "Brigades, signal posts and supply roads now work from one highland plan.\n\nProvisional gameplay."
 RJR_ud_highland_district_assembly:0 "The Highland District Assembly"
 RJR_ud_highland_district_assembly_desc:0 "The Scofield villages and mining camps will send delegates to a highland assembly. It is the first time the mountains have been asked to govern anything beyond a valley.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_highland_grain_stores:0 "Highland Grain Stores"
 RJR_ud_highland_grain_stores_desc:0 "Granaries in the high valleys will hold a year's bread for the three districts, bought now while the continent's harvests still move freely.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 RJR_ud_highland_mine_councils:0 "Highland Mine Councils"
 RJR_ud_highland_mine_councils_desc:0 "Every highland mine will elect a council with authority over shifts, safety and output. The Commonwealth's authority begins underground.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_highland_mining_leases:0 "Highland Mining Leases"
 RJR_ud_highland_mining_leases_desc:0 "Highland claims have been worked under family titles nobody has written down. Registered leases will put the steel and aluminium seams on the national books.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_highland_relief_depots:0 "Relief Depots in the Interior"
 RJR_ud_highland_relief_depots_desc:0 "Fuel and medical depots along the interior roads will supply evacuees going up into the mountains, or relief convoys coming down from them.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 RJR_ud_hold_the_passes:0 "Hold the Passes"
 RJR_ud_hold_the_passes_desc:0 "The army will be organised to hold every pass for as long as it takes help to arrive. Positions will be prepared and stocked in peacetime.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_hold_the_passes_spirit:0 "Hold the Passes"
 RJR_ud_hold_the_passes_spirit_desc:0 "The army is organised to hold every pass in the highlands for as long as it takes help to arrive.\n\nProvisional gameplay."
 RJR_ud_interior_district_assembly:0 "The Interior District Assembly"
 RJR_ud_interior_district_assembly_desc:0 "The interior's farmers and frontier towns will elect their own assembly. Whatever the republic decides about Central Usea, the interior will want to be asked first.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_interior_rail_spurs:0 "Interior Rail Spurs"
 RJR_ud_interior_rail_spurs_desc:0 "Rail spurs from the interior market towns to the mountain roads will carry ore down and supplies up, in peace and in war.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_interior_settlers_spirit:0 "Settlers in the Interior"
 RJR_ud_interior_settlers_spirit_desc:0 "Families who came over the mountain roads are building new villages in the Roca Roja interior.\n\nProvisional gameplay."
 RJR_ud_joint_commission_spirit:0 "Joint Frontier Commission"
 RJR_ud_joint_commission_spirit_desc:0 "A standing commission with Central Usea settles every frontier question before it becomes a dispute.\n\nProvisional gameplay."
 RJR_ud_joint_frontier_commission:0 "A Joint Frontier Commission"
 RJR_ud_joint_frontier_commission_desc:0 "A standing commission with the Federal Republic will settle frontier questions before they become disputes: water, roads, grazing and the farms that straddle the line.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_keep_the_passes_open:0 "Keep the Passes Open"
 RJR_ud_keep_the_passes_open_desc:0 "Whatever the republic has promised, the pass roads must stay open for food, fuel and the sick. The highland brigades will keep them clear through the war winters.\n\nProvisional gameplay. The war it answers is official (ACES Chronicle, 2003 / SUMMER onward)."
 RJR_ud_land_law_spirit:0 "The Commonwealth Land Law"
 RJR_ud_land_law_spirit_desc:0 "Interior estates have been divided among the families who farm them, and the valleys have filled with new houses.\n\nProvisional gameplay."
 RJR_ud_mine_safety_decision:0 "Mine Safety Inspectorate"
 RJR_ud_mine_safety_decision_desc:0 "Send inspectors to every highland mine for a season, and accept slower work for steadier output. Costs 25 political power and 2 institutional capacity; when the fiscal model is ready, it also books a programme payment. Provisional gameplay."
 RJR_ud_mine_safety_spirit:0 "Mine Safety Inspectorate"
 RJR_ud_mine_safety_spirit_desc:0 "Inspectors visit every highland mine this season, and the mines work more steadily for it.\n\nProvisional gameplay."
 RJR_ud_miners_commonwealth:0 "Found the Miners' Commonwealth"
 RJR_ud_miners_commonwealth_desc:0 "The highland mine councils and the interior's tenant farmers propose a commonwealth: councils at the workplace, an elected Council of Delegates above them, and the land for those who work it.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_miners_commonwealth_spirit:0 "The Miners' Commonwealth"
 RJR_ud_miners_commonwealth_spirit_desc:0 "Mine and mill councils govern production; an elected Council of Delegates governs everything else.\n\nProvisional gameplay."
 RJR_ud_mobile_mountain_reserve:0 "A Mobile Mountain Reserve"
 RJR_ud_mobile_mountain_reserve_desc:0 "A small reserve will move along the valley roads to whichever pass is threatened. It needs good roads and good signals more than it needs fortifications.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_mobile_reserve_spirit:0 "Mobile Mountain Reserve"
 RJR_ud_mobile_reserve_spirit_desc:0 "A small reserve moves along the valley roads to wherever the passes are threatened.\n\nProvisional gameplay."
 RJR_ud_mountain_brigades:0 "The Mountain Brigades"
 RJR_ud_mountain_brigades_desc:0 "Highland recruits know the passes better than any map. Brigades raised and trained in the Scofield will defend the mountains they grew up in.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_mountain_transit_protocol:0 "The Mountain Transit Protocol"
 RJR_ud_mountain_transit_protocol_desc:0 "Council traffic between the coast, Platania, Albard and Bulgurdarest crosses Roca Rojan mountains. The delegation will table a protocol for that traffic, written in the capital.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_neutral_roads_ordinance:0 "The Neutral Roads Ordinance"
 RJR_ud_neutral_roads_ordinance_desc:0 "No military cargo will cross Roca Rojan roads for any belligerent. Civilian traffic will be searched and allowed through. Both sides will find this inconvenient.\n\nProvisional gameplay. The war it answers is official (ACES Chronicle, 2003 / SUMMER onward)."
 RJR_ud_neutral_roads_spirit:0 "Neutral Roads Ordinance"
 RJR_ud_neutral_roads_spirit_desc:0 "No military cargo crosses Roca Rojan roads for any belligerent. Civilian traffic is searched and allowed through.\n\nProvisional gameplay."
 RJR_ud_night_of_the_impact:0 "The Night of the Impact"
 RJR_ud_night_of_the_impact_desc:0 "The impact night passes over the mountains as over everywhere else. By morning the signal posts and the district offices have a long list of requests, and very few answers.\n\nProvisional gameplay, opened by the official impact (ACES Chronicle, 1999 / 07.08)."
 RJR_ud_pass_field_hospitals:0 "Field Hospitals in the Passes"
 RJR_ud_pass_field_hospitals_desc:0 "Army field hospitals will be set up at the head of each pass, where the roads from the coast and the interior meet the mountain towns.\n\nProvisional gameplay, opened by the official impact (ACES Chronicle, 1999 / 07.08)."
 RJR_ud_pass_road_plan:0 "The Pass Road Evacuation Plan"
 RJR_ud_pass_road_plan_desc:0 "If the coast must be emptied, the people of the capital will go up the pass roads. The plan assigns every road a timetable and every town a destination.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 RJR_ud_protocol_tabled:0 "Roca Roja has tabled the Mountain Transit Protocol at the Treaty Council"
 RJR_ud_rear_area_requests:0 "Rear-Area Requests from Central Usea"
 RJR_ud_rear_area_requests_desc:0 "The new allied command asks Roca Roja to let its roads, depots and hospitals serve the rear area under civil contracts. The republic would stay out of the fighting and inside the war.\n\nProvisional gameplay. ISAF's founding is official (ACES Chronicle, 2003 / 08.22)."
 RJR_ud_rear_area_services:0 "Roca Roja provides rear-area services to Central Usea"
 RJR_ud_rear_area_spirit:0 "Rear-Area Services"
 RJR_ud_rear_area_spirit_desc:0 "Roca Rojan roads, depots and hospitals serve Central Usea's rear area under civil contracts.\n\nProvisional gameplay."
 RJR_ud_refugees_escorted:0 "Roca Roja escorts mountain-road refugees through the passes"
 RJR_ud_refugees_on_the_mountain_roads:0 "Refugees on the Mountain Roads"
 RJR_ud_refugees_on_the_mountain_roads_desc:0 "Erusea has closed its doors to refugees. Columns turned away elsewhere are now walking the long roads into Roca Roja, and the passes are full.\n\nProvisional gameplay, opened by the official Erusean refugee closure (ACES Chronicle, 2000 / 04.21)."
 RJR_ud_refugees_settled:0 "Roca Roja settles mountain-road refugees in the interior"
 RJR_ud_relief_corridor_spirit:0 "Relief Corridor to Central Usea"
 RJR_ud_relief_corridor_spirit_desc:0 "Relief convoys cross the interior to the Federal Republic on cleared roads with district escorts.\n\nProvisional gameplay."
 RJR_ud_republic_after_the_war:0 "The Mountain Republic After the War"
 RJR_ud_republic_after_the_war_desc:0 "The war has ended, one way or another. The three districts take stock of what they gave, what they refused, and what their neighbour across the frontier now expects of them.\n\nProvisional gameplay after the Continental War outcome (ACES Chronicle, 2005 / 09.19 for the official ending)."
 RJR_ud_road_programme_decision:0 "Highland Road Programme"
 RJR_ud_road_programme_decision_desc:0 "Send road crews out on the Scofield passes for a season, paid by the state. Costs 25 political power and 2 institutional capacity; when the fiscal model is ready, it also books a programme payment. Provisional gameplay."
 RJR_ud_road_works_spirit:0 "Highland Road Works"
 RJR_ud_road_works_spirit_desc:0 "Road crews are out on the Scofield passes for the season, paid by the state.\n\nProvisional gameplay."
 RJR_ud_roads_neutral:0 "Roca Roja keeps its roads neutral in the war"
 RJR_ud_scofield_mine_roads:0 "Mine Roads of the Scofield"
 RJR_ud_scofield_mine_roads_desc:0 "The survey shows mines that send their ore down by mule because no road reaches them. Graded roads to the upper workings will change what the highlands can sell.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_scofield_pass_survey:0 "Survey the Scofield Passes"
 RJR_ud_scofield_pass_survey_desc:0 "Nobody in the capital has an accurate map of the Scofield passes, the mines above them or the villages between. The survey will walk every road the highlands use.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_settle_the_interior:0 "Settle Them in the Interior"
 RJR_ud_settle_the_interior_desc:0 "The refugees will be given land and building materials in the interior's empty valleys. They will become Roca Rojans, whether or not the valleys are ready.\n\nProvisional gameplay, opened by the official Erusean refugee closure (ACES Chronicle, 2000 / 04.21)."
 RJR_ud_signal_posts_on_the_heights:0 "Signal Posts on the Heights"
 RJR_ud_signal_posts_on_the_heights_desc:0 "Signal and radar posts on the Scofield heights will watch the passes and the sky beyond them, and report to the capital in minutes.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 RJR_ud_three_district_readiness:0 "Readiness of the Three Districts"
 RJR_ud_three_district_readiness_desc:0 "With Stonehenge complete and the impact a year away, each district assembly will report in public what is ready, what is not, and why.\n\nProvisional gameplay, opened by the official completion of Stonehenge (ACES Chronicle, 1998 / 06.19)."
 RJR_ud_transit_protocol_spirit:0 "The Mountain Transit Protocol"
 RJR_ud_transit_protocol_spirit_desc:0 "Treaty-council traffic crosses the highlands under rules that Roca Roja drafted and the council adopted.\n\nProvisional gameplay."
 RJR_ud_tunnel_census:0 "Count the Mine Tunnels"
 RJR_ud_tunnel_census_desc:0 "Generations of highland mining have left galleries under the Scofield that no map records. The census will find them, measure them and decide which are safe.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 RJR_ud_war_on_the_frontier:0 "War Beyond the Frontier"
 RJR_ud_war_on_the_frontier_desc:0 "Erusea has invaded San Salvacion and taken Stonehenge. Central Usea, Roca Roja's neighbour along the whole interior frontier, is preparing for war, and its requests are already arriving.\n\nProvisional gameplay. The war it answers is official (ACES Chronicle, 2003 / SUMMER onward)."
 RJR_ud_word_of_ulysses:0 "Word of Ulysses"
 RJR_ud_word_of_ulysses_desc:0 "Central Usea has announced that the asteroid Ulysses will strike Earth. The three districts turn, as they always do in a crisis, to the mountains, and ask what the mountains can do.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 RJR_ud_workers_schools:0 "Workers' Schools of Roca Roja"
 RJR_ud_workers_schools_desc:0 "Evening schools in every mining town and market village will teach engineering, accounting and law to people who never expected to need them.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_accord_dividend:0 "The Accord Dividend"
 SYC_ud_accord_dividend_desc:0 "The continental accord has held, and the sea lanes are open. Shipping that waited out the crisis is looking for cargo.\n\nProvisional gameplay on the averted-war alternative; in the official chronology the war happens."
 SYC_ud_accounts_audited:0 "Spayca's executive accounts have been audited"
 SYC_ud_adamas_minor_airfield:0 "Airfield on Adamas Minor"
 SYC_ud_adamas_minor_airfield_desc:0 "A forward airfield on Adamas Minor extends the fighter screen over the oil terminal and the western sea approaches.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_adamas_minor_oil:0 "Lease the Adamas Minor Oilfield"
 SYC_ud_adamas_minor_oil_desc:0 "The oil under Adamas Minor has been pumped by whoever happened to own a rig. A single lease, with the state as landlord, will put it on the national books.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_adopt_programme:0 "Adopt the The Chromium Archipelago"
 SYC_ud_adopt_programme_desc:0 "Replace the shared regional or generic programme with Spayca's national programme once its current focus is idle. Completed focuses are kept. No equipment, factories or historical rewards are granted. Provisional gameplay."
 SYC_ud_alta_smelter_works:0 "The Alta Smelter Works"
 SYC_ud_alta_smelter_works_desc:0 "The national smelters need a works at Alta with its own rail spur to the quays. It is the largest building project the islands have attempted.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_archipelago_after_the_war:0 "The Archipelago After the War"
 SYC_ud_archipelago_after_the_war_desc:0 "The war has ended, one way or another. The islands take stock of what they sold, what they refused, and what the continent now owes them or holds against them.\n\nProvisional gameplay after the Continental War outcome (ACES Chronicle, 2005 / 09.19 for the official ending)."
 SYC_ud_archipelago_defence:0 "Defence of the Archipelago"
 SYC_ud_archipelago_defence_desc:0 "Air watch, radar and harbour patrols will work from one island plan with one staff. It is the most the islands can do without allies.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_archipelago_defence_spirit:0 "Defence of the Archipelago"
 SYC_ud_archipelago_defence_spirit_desc:0 "Air watch, harbour patrols and reserve companies now work from one island plan.\n\nProvisional gameplay."
 SYC_ud_board_quotas:0 "Set Board Production Quotas"
 SYC_ud_board_quotas_desc:0 "Every pit on Calafia receives an output quota and an inspector. The quota is negotiable before it is set and not afterwards.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_board_quotas_spirit:0 "Mineral Board Quotas"
 SYC_ud_board_quotas_spirit_desc:0 "The Board sets output for every pit and every smelter. The quotas are met; the people who meet them are not consulted.\n\nProvisional gameplay."
 SYC_ud_calafia_radar_chain:0 "The Calafia Radar Chain"
 SYC_ud_calafia_radar_chain_desc:0 "Radar posts on the Calafia heights can see far past the outer islands. Linked to Wyatt, they give the islands warning.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_channel_minefields:0 "Register the Channel Minefields"
 SYC_ud_channel_minefields_desc:0 "Defensive minefields in the inter-island channels, charted and registered with the harbourmasters so that neutral shipping can still pass safely.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_chartered_exchanges:0 "Charter the Ore Exchanges"
 SYC_ud_chartered_exchanges_desc:0 "Under the charter, ore is sold on open exchanges at Wyatt and New Rudigo, with published prices and licensed brokers. Buyers who once dealt with the executive now deal with the market.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_chromium_exchange:0 "The Wyatt Chromium Exchange"
 SYC_ud_chromium_exchange_desc:0 "A permanent exchange at Wyatt where concession ore is priced in public. Buyers on the continent will learn to watch it.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_chromium_reserve:0 "The Strategic Chromium Reserve"
 SYC_ud_chromium_reserve_desc:0 "A share of every year's ore will be held back in a reserve that no contract can claim. It is insurance against buyers, and against the years ahead.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_chromium_reserve_spirit:0 "The Strategic Chromium Reserve"
 SYC_ud_chromium_reserve_spirit_desc:0 "A stockpile held back from every contract, so that no single buyer can name the price of Spayca's future.\n\nProvisional gameplay."
 SYC_ud_coastal_patrol_flotilla:0 "Coastal Patrol Flotilla"
 SYC_ud_coastal_patrol_flotilla_desc:0 "A flotilla of patrol craft for the channels between the islands, crewed by men who already know every rock in them.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_compact_office:0 "Compact Coordinating Committee"
 SYC_ud_compact_office_desc:0 "Delegates of the pit and quay committees, governing until the first Compact congress. An unnamed office government; no individual officeholder is asserted. Provisional gameplay."
 SYC_ud_compact_wage_scale:0 "The Compact Wage Scale"
 SYC_ud_compact_wage_scale_desc:0 "One wage scale for miners, smelter hands and dockers, published and enforced. Employers on the islands will have to plan around it.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_compact_wages_spirit:0 "The Compact Wage Scale"
 SYC_ud_compact_wages_spirit_desc:0 "One wage scale for the pits and the quays, negotiated by the committees and enforced by the Compact.\n\nProvisional gameplay."
 SYC_ud_concession_licences:0 "Licence Foreign Concessions"
 SYC_ud_concession_licences_desc:0 "Foreign firms will be licensed to work the seams and ship the ore. Licence fees arrive quickly, and the risk of a bad year sits with someone else.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_concession_royalties:0 "The Calafia Royalty Schedule"
 SYC_ud_concession_royalties_desc:0 "Concession holders will pay by the tonne on a published schedule instead of a flat licence. The schedule is a promise that the islands will notice what is taken.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_continental_trade_desks:0 "Trade Desks on the Continent"
 SYC_ud_continental_trade_desks_desc:0 "Small trade offices in the continental ports will sell island ore and listen to what the continent is saying about the islands.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_convoy_insurance:0 "Island Convoy Insurance"
 SYC_ud_convoy_insurance_desc:0 "An island insurance office will underwrite Spaycan hulls, so that a lost freighter is a claim and not a bankruptcy.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_cooperative_freighters:0 "Cooperative Freighter Lines"
 SYC_ud_cooperative_freighters_desc:0 "Laid-up freighters are bought by the dockers' cooperatives and put back to sea under the Compact flag, carrying island ore to whoever will buy it.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_council_observer:0 "Spayca holds an observer seat at the Treaty Council"
 SYC_ud_council_observer_spirit:0 "Treaty Council Observer"
 SYC_ud_council_observer_spirit_desc:0 "Spayca sits at the Central Usean Treaty Council without a vote. It hears every shipping rule before it is written.\n\nProvisional gameplay."
 SYC_ud_council_shipping_protocol:0 "Treaty Council Shipping Protocol"
 SYC_ud_council_shipping_protocol_desc:0 "As an observer, Spayca drafts a shipping protocol for the council's ports. If it is adopted, island hulls will be the ones that already comply.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_directorate_order_spirit:0 "Directorate Order"
 SYC_ud_directorate_order_spirit_desc:0 "The Directorate's security office keeps the pits working and the newspapers careful.\n\nProvisional gameplay."
 SYC_ud_directorate_security:0 "The Directorate Security Office"
 SYC_ud_directorate_security_desc:0 "A security office answerable to the Board chairmen will keep strikes short and newspapers careful. It works, and it is remembered.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_dock_and_mine_compact:0 "Sign the Dock and Mine Compact"
 SYC_ud_dock_and_mine_compact_desc:0 "Miners at Calafia and Alta and dockers at Wyatt have organised separately for years. A single compact would let their committees speak for the islands' working majority, and govern them.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_embargo:0 "Spayca embargoes ore to the belligerents"
 SYC_ud_executive_accounts:0 "Audit the Executive Accounts"
 SYC_ud_executive_accounts_desc:0 "Licence fees, port dues and ore royalties have passed through the executive for a generation without a published account. An audit will show where the money went, and who has been relying on nobody asking.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_executive_review:0 "Review the Executive Office"
 SYC_ud_executive_review_desc:0 "The executive has governed the islands for years by habit and by licence. Before anyone argues about who should govern, the office will set out what it actually does, who it answers to, and what it has promised the mining towns.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_export_drive_decision:0 "Chromium Export Drive"
 SYC_ud_export_drive_decision_desc:0 "Push island ore through the Wyatt exchange and the continental trade desks for six months. Costs 25 political power and 2 institutional capacity; when the fiscal model is ready, it also books a programme payment. Provisional gameplay."
 SYC_ud_export_drive_spirit:0 "Chromium Export Drive"
 SYC_ud_export_drive_spirit_desc:0 "A temporary sales push through the Wyatt exchange and the island trade desks.\n\nProvisional gameplay."
 SYC_ud_free_port_charter:0 "Proclaim the Free Port Charter"
 SYC_ud_free_port_charter_desc:0 "Wyatt's traders and the island delegations propose a written charter: an open port, elected island councils and a cabinet that answers to them. The executive office would become a ministry among ministries.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_free_port_courts:0 "Commercial Courts of the Free Port"
 SYC_ud_free_port_courts_desc:0 "Disputes under the charter will go to standing commercial courts with published judgments. The cabinet loses a lever; the port gains a reputation.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_free_port_courts_spirit:0 "Commercial Courts of the Free Port"
 SYC_ud_free_port_courts_spirit_desc:0 "Charter disputes go to standing commercial courts instead of the executive's desk, and investors have noticed.\n\nProvisional gameplay."
 SYC_ud_free_port_office:0 "Free Port Council of Ministers"
 SYC_ud_free_port_office_desc:0 "A cabinet answerable to elected island councils under the Free Port Charter. An unnamed office government; no individual officeholder is asserted. Provisional gameplay."
 SYC_ud_free_port_spirit:0 "The Free Port Charter"
 SYC_ud_free_port_spirit_desc:0 "Wyatt is a free port under a written charter: open ore exchanges, elected island councils and a cabinet that answers to them.\n\nProvisional gameplay."
 SYC_ud_fuel_and_food_reserve:0 "Fuel and Food Reserve"
 SYC_ud_fuel_and_food_reserve_desc:0 "Islands that import half their food cannot wait for the continent's ports to reopen. A reserve of fuel and food will be bought now, while it is cheap.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 SYC_ud_harbour_denial:0 "Harbour Denial Doctrine"
 SYC_ud_harbour_denial_desc:0 "Island defence will rest on closing the harbours: patrol craft, coastal guns and minefields. Fighters will be a second line.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_harbour_denial_spirit:0 "Harbour Denial Doctrine"
 SYC_ud_harbour_denial_spirit_desc:0 "The islands are defended at their harbour mouths: patrol craft, registered minefields and coastal batteries.\n\nProvisional gameplay."
 SYC_ud_harbours_open:0 "Spaycan harbours are open to refugee ships"
 SYC_ud_hillside_shelters:0 "Hillside Shelters of Eastern Adamas"
 SYC_ud_hillside_shelters_desc:0 "Shelters cut into the hills behind Wyatt and the mining towns, using the miners' own skills and machinery. It is slow, expensive work.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 SYC_ud_hillside_shelters_spirit:0 "Hillside Shelters"
 SYC_ud_hillside_shelters_spirit_desc:0 "Shelters cut into the hills behind Wyatt and the mining towns, with stores and a register of who goes where.\n\nProvisional gameplay."
 SYC_ud_impact_night_bulletins:0 "The Impact Night Bulletins"
 SYC_ud_impact_night_bulletins_desc:0 "On the night of the impact the Wyatt office broadcasts every hour. What it says, and what it admits it does not know, will be remembered.\n\nProvisional gameplay, opened by the official impact (ACES Chronicle, 1999 / 07.08)."
 SYC_ud_innsmouth_terminal:0 "Fuel Terminal at Innsmouth"
 SYC_ud_innsmouth_terminal_desc:0 "Tanks and a loading jetty at Innsmouth let tankers take Adamas Minor's oil without calling at Wyatt first.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_interceptor_screen:0 "The Interceptor Screen"
 SYC_ud_interceptor_screen_desc:0 "Island defence will rest on fighters held at readiness and guided from the ground. Patrol craft will be a second line.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_interceptor_screen_spirit:0 "The Interceptor Screen"
 SYC_ud_interceptor_screen_spirit_desc:0 "Island air defence rests on fighters held at readiness at Wyatt and on the outer islands.\n\nProvisional gameplay."
 SYC_ud_island_air_watch:0 "Island Air Watch"
 SYC_ud_island_air_watch_desc:0 "The islands are defended from the air or not at all. A standing air watch will put the eight air-base levels Spayca already owns to deliberate use.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_island_delegations:0 "Hear the Island Delegations"
 SYC_ud_island_delegations_desc:0 "Calafia, Alta and Adamas Minor each send a delegation to Wyatt with a list of complaints. Hearing them in public costs the executive some dignity and gives the islands their first shared forum.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_island_elections:0 "Hold Island-Wide Elections"
 SYC_ud_island_elections_desc:0 "The first elections held on all four islands at once. Polling stations on Adamas Minor are a fishing boat and a ledger, and the results will be argued over for a month.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_island_shelter_census:0 "Island Shelter Census"
 SYC_ud_island_shelter_census_desc:0 "Who lives where, who can walk, and which cellars, mines and tunnels could hold them. The census is the first plan that counts everyone on all four islands.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 SYC_ud_licence_seats:0 "Board Seats for Licence Holders"
 SYC_ud_licence_seats_desc:0 "Foreign licence holders are offered seats on the Board in exchange for refining a share of their ore on the islands. The Board becomes larger and harder to argue with.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_merchant_evacuation_plan:0 "Merchant Evacuation Plan"
 SYC_ud_merchant_evacuation_plan_desc:0 "If the islands must be evacuated, or must take in the evacuated, the merchant fleet is the only means. The plan assigns every hull a role.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 SYC_ud_merchant_registry:0 "Register the Merchant Fleet"
 SYC_ud_merchant_registry_desc:0 "Spaycan hulls carry ore, fuel and other people's cargo all over Usea. A proper registry will show the islands what fleet they own, and what it is worth to everyone else.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_mineral_board:0 "Seat the Mineral Board"
 SYC_ud_mineral_board_desc:0 "The concession holders and smelter owners offer to take the islands in hand as they have taken the pits in hand: a Mineral Board with authority over output, prices and, in practice, everything else.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_mineral_board_office:0 "Mineral Board Directorate"
 SYC_ud_mineral_board_office_desc:0 "The chairmen of the Mineral Board, governing the islands as the Board governs the pits. An unnamed office government; no individual officeholder is asserted. Provisional gameplay."
 SYC_ud_mineral_survey:0 "Survey the Adamas Chromium"
 SYC_ud_mineral_survey_desc:0 "Nobody has surveyed the chromium seams under Calafia and Alta since the first concessions were granted. A new survey will tell the islands how much they own, and how long it will last.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_national_smelters:0 "Found National Smelters"
 SYC_ud_national_smelters_desc:0 "The ore stays on the islands. A national smelting company, owned by the state, will refine it at Alta before anything is sold.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_national_smelting_spirit:0 "National Smelting Programme"
 SYC_ud_national_smelting_spirit_desc:0 "The state keeps the ore on the islands and refines it at Alta, at the price of slower revenue and a larger payroll.\n\nProvisional gameplay."
 SYC_ud_neutral_flag_registry:0 "The Neutral Flag Registry"
 SYC_ud_neutral_flag_registry_desc:0 "Foreign owners may register their hulls under the Spaycan flag, at a price and under neutral rules. The registry fills quickly.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_news_from_san_salvacion:0 "News from San Salvacion"
 SYC_ud_news_from_san_salvacion_desc:0 "Erusea has invaded San Salvacion and taken Stonehenge. The islands sell to both sides of the strait and are protected by neither.\n\nProvisional gameplay. The war it answers is official (ACES Chronicle, 2003 / SUMMER onward)."
 SYC_ud_observer_seat:0 "Seek a Treaty Council Seat"
 SYC_ud_observer_seat_desc:0 "Spayca will ask the Central Usean Treaty Council for an observer's seat: no vote and no obligations, but a hearing before every rule on shipping.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_open_harbours:0 "Open the Harbours"
 SYC_ud_open_harbours_desc:0 "Refugee ships may berth and land their passengers, who will be housed, fed and registered by the islands.\n\nProvisional gameplay, opened by the official Erusean refugee closure (ACES Chronicle, 2000 / 04.21)."
 SYC_ud_open_harbours_spirit:0 "Open Harbours"
 SYC_ud_open_harbours_spirit_desc:0 "Refugee ships may berth and land their passengers. The islands are more crowded and less sure of themselves.\n\nProvisional gameplay."
 SYC_ud_ore_at_cost:0 "Spayca sells railgun-project ore at cost"
 SYC_ud_ore_at_market:0 "Spayca sells railgun-project ore at market prices"
 SYC_ud_ore_concessions_spirit:0 "Foreign Ore Concessions"
 SYC_ud_ore_concessions_spirit_desc:0 "Licensed foreign firms work the Calafia pits and ship the ore away unrefined. The licence fees are reliable; the work is not ours.\n\nProvisional gameplay."
 SYC_ud_ore_embargo:0 "Embargo Ore to Belligerents"
 SYC_ud_ore_embargo_desc:0 "No Spaycan chromium will be sold to any belligerent, whatever it offers. The islands lose money and keep their word.\n\nProvisional gameplay. The war it answers is official (ACES Chronicle, 2003 / SUMMER onward)."
 SYC_ud_ore_embargo_spirit:0 "Ore Embargo"
 SYC_ud_ore_embargo_spirit_desc:0 "No Spaycan chromium is sold to a belligerent, whatever it offers.\n\nProvisional gameplay."
 SYC_ud_ore_freighter_lines:0 "Ore Freighter Lines"
 SYC_ud_ore_freighter_lines_desc:0 "Scheduled freighter lines from the island quays to the continental ports. Ore leaves on a timetable instead of when a buyer's ship turns up.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_ore_withheld:0 "Spayca keeps its ore for its own shelters"
 SYC_ud_permanent_neutral:0 "Spayca has declared permanent neutrality"
 SYC_ud_permanent_neutrality:0 "Declare Permanent Neutrality"
 SYC_ud_permanent_neutrality_desc:0 "Spayca will bind itself to no council and no bloc, in law. Its flag will be respected because it is never lent to anyone else's quarrel.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_permanent_neutrality_spirit:0 "Permanent Neutrality"
 SYC_ud_permanent_neutrality_spirit_desc:0 "The islands bind themselves to no bloc and no council. Neutral flags are respected because they are never lent.\n\nProvisional gameplay."
 SYC_ud_pit_committees:0 "Pit and Quay Committees"
 SYC_ud_pit_committees_desc:0 "Each pit and each quay elects a committee with a voice on hours, safety and the price of the company store. The Compact's authority starts at the pithead.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_railgun_ore_contracts:0 "Ore for the Railgun Project"
 SYC_ud_railgun_ore_contracts_desc:0 "The FCU-led international railgun project needs high-grade steel, and high-grade steel needs chromium. The islands must decide on what terms, if any, they will sell.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 SYC_ud_readiness_review:0 "The Readiness Review of 1999"
 SYC_ud_readiness_review_desc:0 "With Stonehenge complete and the impact a year away, the executive will audit every preparation in public and say plainly what is not ready.\n\nProvisional gameplay, opened by the official completion of Stonehenge (ACES Chronicle, 1998 / 06.19)."
 SYC_ud_refugee_ships_at_wyatt:0 "Refugee Ships at Wyatt"
 SYC_ud_refugee_ships_at_wyatt_desc:0 "Erusea has closed its doors to refugees, and the ships that would have landed there are turning towards the islands instead.\n\nProvisional gameplay, opened by the official Erusean refugee closure (ACES Chronicle, 2000 / 04.21)."
 SYC_ud_relief_charter_decision:0 "Charter Relief Freighters"
 SYC_ud_relief_charter_decision_desc:0 "Charter island freighters for relief work on the continent for four months. Costs 25 political power and 2 institutional capacity; when the fiscal model is ready, it also books a programme payment. Provisional gameplay."
 SYC_ud_relief_charter_spirit:0 "Relief Freighter Charter"
 SYC_ud_relief_charter_spirit_desc:0 "Island freighters chartered for relief work on the continent, paid for by the state.\n\nProvisional gameplay."
 SYC_ud_relief_convoys:0 "Relief Convoys to the Continent"
 SYC_ud_relief_convoys_desc:0 "Island freighters will carry fuel, food and medical stores to the continental ports that ask for them, on the state's account.\n\nProvisional gameplay, opened by the official impact (ACES Chronicle, 1999 / 07.08)."
 SYC_ud_royalty_schedule_spirit:0 "The Calafia Royalty Schedule"
 SYC_ud_royalty_schedule_spirit_desc:0 "Concession holders now pay by the tonne, on a published schedule that the islands' delegations can read for themselves.\n\nProvisional gameplay."
 SYC_ud_stainless_lines:0 "Stainless Steel Lines"
 SYC_ud_stainless_lines_desc:0 "With chromium refined at Alta, the islands can make stainless steel themselves instead of buying it back from the continent.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 SYC_ud_tide_and_sky_watch:0 "Tide and Sky Watch"
 SYC_ud_tide_and_sky_watch_desc:0 "The radar chain, the harbourmasters' tide boards and the air watch will report into one office at Wyatt, which will report to everyone.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 SYC_ud_transit_only:0 "Transit Passage Only"
 SYC_ud_transit_only_desc:0 "Refugee ships may refuel and resupply at the island quays, then sail on. Nobody lands without a sponsor.\n\nProvisional gameplay, opened by the official Erusean refugee closure (ACES Chronicle, 2000 / 04.21)."
 SYC_ud_transit_passage:0 "Spaycan harbours allow refugee transit only"
 SYC_ud_transit_passage_spirit:0 "Transit Passage"
 SYC_ud_transit_passage_spirit_desc:0 "Refugee ships may refuel and resupply, then sail on. Nobody lands without a sponsor.\n\nProvisional gameplay."
 SYC_ud_ulysses_briefing:0 "The Ulysses Briefing"
 SYC_ud_ulysses_briefing_desc:0 "Central Usea has announced that the asteroid Ulysses will strike Earth. Spayca's executive must decide what islands with no observatory and one radar chain can do to prepare.\n\nProvisional gameplay, opened by the official Ulysses announcement (ACES Chronicle, 1996 / 04.20)."
 SYC_ud_war_risk_pool:0 "War-Risk Shipping Pool"
 SYC_ud_war_risk_pool_desc:0 "Island owners, insurers and the state pool their risk so that Spaycan hulls stay at sea while the continent fights.\n\nProvisional gameplay. The war it answers is official (ACES Chronicle, 2003 / SUMMER onward)."
 SYC_ud_war_risk_pool_spirit:0 "War-Risk Shipping Pool"
 SYC_ud_war_risk_pool_spirit_desc:0 "A shared insurance pool keeps Spaycan hulls at sea while the continent is at war.\n\nProvisional gameplay."
 SYC_ud_wartime_sales:0 "Sell to Every Buyer"
 SYC_ud_wartime_sales_desc:0 "Spayca will sell to every buyer who pays in advance and collects at its own quays. Neutrality is a price list.\n\nProvisional gameplay. The war it answers is official (ACES Chronicle, 2003 / SUMMER onward)."
 SYC_ud_wartime_sales_spirit:0 "Wartime Ore Sales"
 SYC_ud_wartime_sales_spirit_desc:0 "Spayca sells to every buyer who pays in advance and collects at its own quays.\n\nProvisional gameplay."
 SYC_ud_wyatt_air_station:0 "Expand the Wyatt Air Station"
 SYC_ud_wyatt_air_station_desc:0 "Wyatt's air station needs longer runways and hardened stores before it can hold more than a training flight at readiness.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 ac_ud_cal_tree:0 "The Crossroads Programme"
 ac_ud_cal_tree_desc:0 "Calladen is small, but four countries border it and much of their freight crosses it. The programme decides how the crossroads is governed, how its customs and corridors work, and what a transit state owes its neighbours in the Ulysses years and the war that follows them.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 ac_ud_minb.101.a:0 "Begin with the books."
 ac_ud_minb.101.b:0 "Begin with the islands."
 ac_ud_minb.101.d:0 "The executive office at Wyatt occupies the top two floors of the old customs house, and from its windows a visitor can watch most of the islands' economy load itself onto other people's ships. Ore trains come down from the Calafia pits at dawn. By noon the freighters are low in the water. By evening the money has been counted, and most of it has already been promised.\n\nSpayca has more chromium than any other state in Usea and more merchant hulls than a country of its size has any right to own. It has no land border, no seat on the Central Usean Treaty Council, and a government that has never been asked what it is for. The executive governs because it always has. The mining towns of Calafia and Alta accept this as long as the pay arrives; Adamas Minor, with its oil rigs and its one airfield, accepts it as long as Wyatt leaves it alone.\n\nThe review the executive has ordered will not change any of this by itself. It will write down what the office does, what it has promised, and to whom. The clerks have been told to be thorough. Several of them have already asked whether that is wise.\n\nThe islands are rich, isolated and undecided. Every faction in Wyatt agrees that this cannot last. None of them agrees on what should replace it.\n\nProvisional gameplay: Spayca's states, resources and 1991 government are mod provenance (history/states 343, 346, 593, 599; history/countries/SYC - Spayca.txt)."
 ac_ud_minb.101.t:0 "The Chromium Archipelago"
 ac_ud_minb.102.a:0 "Call the elections within the year."
 ac_ud_minb.102.b:0 "Let the councils settle in first."
 ac_ud_minb.102.d:0 "The charter was read aloud on the steps of the customs house, which is where Wyatt has always announced the things it wanted the harbour to hear. It runs to forty articles. The first makes Wyatt a free port. The second creates elected councils on each of the four islands. The thirty-eighth, which nobody read aloud, abolishes the executive office as an office and turns its staff into a ministry.\n\nThe traders who wrote most of it are delighted. Open exchanges mean published prices, and published prices mean that a broker in New Rudigo can compete with a broker in Wyatt. The island delegations are delighted for different reasons: for the first time Calafia and Alta will elect the people who decide what happens to their pits, and Adamas Minor will elect someone who has actually been there.\n\nNot everyone is delighted. The concession holders, who negotiated their licences with the executive in private, now find that every renewal will be argued in a council chamber. The smelter owners worry that open exchanges will price island ore for foreign buyers, not island works. And the dockers, who were not asked, note that the charter says a great deal about ports and very little about the people who work in them.\n\nThe new Council of Ministers sits for the first time tomorrow. Its first decision will be how quickly to call the elections the charter promises. Its second will be how to explain to the islands that a charter is a beginning and not a result.\n\nThis is an alternate political path for an unsourced state. The Spaycan free port is not established in any official chronology.\n\nProvisional gameplay."
 ac_ud_minb.102.t:0 "The Free Port Charter"
 ac_ud_minb.103.a:0 "Let the Board set the quotas."
 ac_ud_minb.103.b:0 "Keep the executive's seal on every quota."
 ac_ud_minb.103.d:0 "The Mineral Board met for the first time in the boardroom of the largest concession company at New Rudigo, because it had a long table and the executive's offices did not. Eleven chairs. Seven belong to concession holders, two to the smelter owners, one to the oil leaseholders on Adamas Minor and one, at the foot of the table, to the executive office, which will keep the seals and do as it is told.\n\nThe Board's argument is simple and has the merit of being true: the islands live on ore, and the people who know most about ore are the people who mine it. Quotas will be set by those who understand production. Prices will be negotiated by those who understand buyers. Politics, the chairmen say, has cost the islands money for long enough.\n\nWhat the Board does not say, because it does not need to, is that it will also decide who works, at what wage, and what happens to a pit committee that objects. The dockers at Wyatt struck for two days when the Board was announced. The strike ended when the ore trains stopped and the quays had nothing to load.\n\nAbroad, the Board's arrival is read as stability. Contracts will be honoured. Shipments will arrive on time. At home it is read as the old arrangement made honest: the islands were always governed by the people who own the pits, and now they are governed by them in writing.\n\nThis is an alternate political path for an unsourced state. The Mineral Board is not established in any official chronology.\n\nProvisional gameplay."
 ac_ud_minb.103.t:0 "The Mineral Board"
 ac_ud_minb.104.a:0 "Honour the licences for now."
 ac_ud_minb.104.b:0 "Review every licence at once."
 ac_ud_minb.104.d:0 "The Compact was signed in the union hall at Haja by delegates from every pit on Alta and Calafia and every quay at Wyatt and Innsmouth. It took eleven hours. The miners wanted a single wage scale; the dockers wanted control of the loading schedules; the smelter hands wanted to be counted as miners rather than dockers, and were. Nobody wanted the executive office, but everyone agreed that somebody had to keep its records.\n\nWhat emerged is a government by committee. Each pit and each quay elects delegates; the delegates elect a Coordinating Committee; the Committee governs the islands until a congress can be called to write something more permanent. The executive's clerks have been kept on. Several of them seem relieved to be told plainly what to do.\n\nThe concession holders have not been expropriated, yet. They have been told that their licences will be honoured, that their ore will be loaded at the Compact's rates, and that their foremen will now answer to a pit committee. Two companies have already announced that they are reconsidering their investment in the islands. The Committee has announced that it is reconsidering their licences.\n\nThe Compact has the support of most of the people who live on the islands and the hostility of most of the people who buy from them. It has inherited a merchant fleet, an ore trade and a credit rating. It will need all three, and it will need the buyers on the continent to believe that a committee can keep a delivery schedule.\n\nThis is an alternate political path for an unsourced state. The Compact is not established in any official chronology.\n\nProvisional gameplay."
 ac_ud_minb.104.t:0 "The Dock and Mine Compact"
 ac_ud_minb.105.a:0 "Publish the survey in full."
 ac_ud_minb.105.b:0 "Circulate it to the delegations only."
 ac_ud_minb.105.d:0 "The survey teams came back from Calafia with more than the executive expected. The seams run deeper than the concession maps show and further under Alta than anyone had guessed. At the present rate of extraction the islands will be exporting chromium for longer than anyone now living will be alive to see.\n\nThat is the good news. The difficult news is in the second volume of the survey, which sets out who actually benefits. The concession holders pay a flat licence fee that has not changed in years. The ore leaves the islands unrefined. The steel made from it is sold back to Spayca at continental prices. The survey's authors, who are engineers and not politicians, have written this down without comment, which has made it more effective than any pamphlet.\n\nTwo answers are now being argued in Wyatt. The first is to keep the concessions and charge properly for them: royalties by the tonne, a public exchange, a reserve. The second is to found national smelters at Alta, keep the ore on the islands and sell steel instead of rock. The first is quicker and safer. The second is slower, more expensive and, its supporters say, the only way the islands will ever be more than a quarry.\n\nBoth answers begin with the survey. Neither can be taken back once the contracts are signed.\n\nProvisional gameplay."
 ac_ud_minb.105.t:0 "Who Owns the Ore"
 ac_ud_minb.106.a:0 "Insure the fleet first."
 ac_ud_minb.106.b:0 "Open the trade desks first."
 ac_ud_minb.106.d:0 "The harbourmaster's office at Wyatt has kept a list of Spaycan hulls for as long as there has been a harbourmaster. It is not a registry. It records which ships called and what they paid, and it has never been used to answer the question the executive now wants answered: how many ships do the islands own, where are they, and what would happen if they stopped?\n\nThe answer, once the clerks have finished, is surprising even to people who expected to be surprised. Spaycan owners operate enough tonnage to carry a large share of the ore, fuel and general cargo moving between the continental ports. Many of these hulls never call at the islands at all. They are registered at Wyatt because the fees are low and the questions few, and they earn their keep carrying other people's goods.\n\nThis is a source of income and a source of exposure. A fleet that carries for everyone is useful to everyone, and in a crisis it will be wanted by everyone. Insurance, protection and the question of whose cargo a Spaycan ship will carry are about to become matters of state.\n\nThe register is only a list. What the islands do with it will decide whether the fleet is an asset or a hostage.\n\nProvisional gameplay."
 ac_ud_minb.106.t:0 "The Spaycan Register"
 ac_ud_minb.107.a:0 "Take the question seriously."
 ac_ud_minb.107.b:0 "Thank the council politely."
 ac_ud_minb.107.d:0 "The trade desks on the continent have done their work: they sell ore, and they listen. What they have heard most often, from port officials and shipping agents alike, is that the Central Usean Treaty Council is drafting common rules for the ports of its members. Spaycan hulls will have to follow those rules whether or not Spayca has any say in them.\n\nOne of the desks has gone further and brought back an informal suggestion. The council could admit Spayca as an observer: no vote, no obligations under the council's treaties, but a seat at the table when shipping is discussed. It would be the first time the islands had sat in any continental body.\n\nThe executive's oldest advisers are against it. An observer seat today becomes a membership application tomorrow, they argue, and a member is expected to take sides. The islands have survived by never being on anyone's side. The answer, if there must be one, is to say so in law: permanent neutrality, written down, so that no future government can drift into a bloc.\n\nThe younger officials reply that neutrality written down is still neutrality nobody else has agreed to respect. The decision belongs to the focus that follows. This event only records that the question has now been asked.\n\nProvisional gameplay: the Central Usean Treaty Council is the mod's CNEA membership (mod provenance)."
 ac_ud_minb.107.t:0 "An Invitation from the Council"
 ac_ud_minb.108.a:0 "Publish the list."
 ac_ud_minb.108.b:0 "Fund the list first."
 ac_ud_minb.108.d:0 "The announcement from Central Usea reached Wyatt at the same speed as it reached everywhere else: by radio, then by telex, then by every newspaper on the islands under the same headline. An asteroid called Ulysses will strike Earth. The Federal Republic has said when, approximately, and has said that it is preparing. It has not said what anyone else should do.\n\nThe executive convened a briefing the next morning. It was attended by the harbourmasters, the radar officers from Calafia, two engineers from the survey teams and, because nobody thought to stop them, a delegation from the mining towns who wanted to know whether the pits could be used as shelters. Nobody in the room could answer the most important questions. Spayca has no observatory. Its radar sees aircraft, not stones falling from orbit. Its civil defence plan was written for storms.\n\nWhat the islands do have is a great deal of rock, a great many ships and miners who know how to dig. By the end of the morning the briefing had produced a list: count the population and the cellars; join the radar, the tide boards and the air watch into one reporting office; buy fuel and food while they are cheap; give every hull in the register a role. None of it will stop an asteroid. All of it might matter afterwards.\n\nThe briefing's last note is a reminder that the islands do not know where the fragments will fall, and must not pretend to.\n\nProvisional gameplay: the Ulysses announcement is official (ACES Chronicle, 1996 / 04.20); Spayca's response is not."
 ac_ud_minb.108.t:0 "The Ulysses Briefing"
 ac_ud_minb.109.a:0 "Sell at market price."
 ac_ud_minb.109.b:0 "Sell at cost."
 ac_ud_minb.109.c:0 "Keep the ore for the shelters."
 ac_ud_minb.109.d:0 "The purchasing agents for the FCU-led international railgun project arrived at Wyatt without much ceremony. They want chromium, a great deal of it, refined to a specification the islands can only partly meet. They are prepared to pay, they say, a fair price. They are also prepared to explain at some length why the project matters to everyone in Usea, including the islands, and why a fair price might reasonably be lower than a market price.\n\nThe executive's position is awkward. The railgun project is the most serious answer anyone has proposed to Ulysses, and refusing to supply it would be remembered. But Spayca is not a party to the project, has no say in where the guns are built or who controls them, and owes nothing to its organisers. The islands are also preparing their own shelters, which need the same steel.\n\nThree answers are on the table. Sell at market price, as Spayca would sell to anyone. Sell at cost, as a contribution that the islands can point to afterwards. Or keep the ore for the hillside shelters and the islands' own preparations, and let the project buy elsewhere.\n\nThis decision does not change the project's timetable or its completion. It only decides what the islands will be able to say about their part in it.\n\nProvisional gameplay: Stonehenge as an FCU-led international project is official (ACES Chronicle, 1998 / 06.19; Super Weapons, Stonehenge); Spayca's ore contracts are not."
 ac_ud_minb.109.t:0 "Ore for the Railgun Project"
 ac_ud_minb.110.a:0 "Load the freighters."
 ac_ud_minb.110.b:0 "Count what we have first."
 ac_ud_minb.110.d:0 "The Wyatt reporting office went on the air at dusk and did not go off it until long after dawn. Every hour it read the same short bulletin: what the continental stations were reporting, what the islands' own watch posts had logged, and what the office did not know. It did not know very much. That, the duty officer said on the third broadcast, was the most important thing anybody could tell the islands.\n\nThe islands' watch posts logged lights in the sky and readings on instruments that nobody had calibrated for this. The harbourmasters logged the tides. The radar officers on Calafia logged a great deal of interference and very little else. The office broadcast all of it, unedited, with the time attached, so that whatever happened next the islands would have a record.\n\nBy morning the continental stations were reporting damage in places the islands trade with, and asking for help. The first requests came in by radio from port authorities who knew Spaycan freighters by name. They want fuel, food and medical stores, and they want ships that can carry them.\n\nThe bulletins will be read again for years. The question now is what the islands do with the freighters they have been counting since the briefing.\n\nProvisional gameplay: the impact is official (ACES Chronicle, 1999 / 07.08); no impact site or damage on Spayca is asserted."
 ac_ud_minb.110.t:0 "The Impact Night"
 ac_ud_minb.111.a:0 "Send out doctors while we decide."
 ac_ud_minb.111.b:0 "Keep the ships at anchor for now."
 ac_ud_minb.111.d:0 "The first ship arrived at Wyatt in the early morning, low in the water and with no cargo manifest. Its master explained to the harbour pilot that Erusea had closed its doors to refugees and that the port he had been bound for had refused him a berth. He had fuel for three more days. He had nearly four hundred people aboard.\n\nBy the end of the week there were nine such ships in the roads off Wyatt and more reported at sea. Some had been chartered by relief organisations, some by the refugees themselves, and some by owners who had seen a market. The harbourmaster has put them all at anchor and sent water out. He has asked the executive what he is supposed to do next.\n\nThere are two answers and neither is comfortable. The islands could open the harbours: let the ships berth, land their passengers, and house and feed them in towns that are already crowded. Or the islands could offer transit: fuel, water, food and repairs at the quays, and then the ships sail on to someone else's harbour.\n\nWhatever the islands decide will be noticed on the continent and in the ships still at sea.\n\nProvisional gameplay: the Erusean refugee closure is official (ACES Chronicle, 2000 / 04.21); the ships at Wyatt are not."
 ac_ud_minb.111.t:0 "Ships Turned Away"
 ac_ud_minb.112.a:0 "Raise the insurance pool."
 ac_ud_minb.112.b:0 "Recall the trade desks."
 ac_ud_minb.112.d:0 "The news came in on the trade desks' telex before it reached the radio: Erusean forces have crossed into San Salvacion and taken the railgun installation the islands once sold ore to build. The trade desks' next messages were about prices. Chromium has jumped. So have insurance rates for any hull bound for a continental port.\n\nSpayca is not a party to this war and has no intention of becoming one. But its freighters carry cargo for ports on both sides, its ore goes into steel that both sides will want, and its harbours are the nearest neutral anchorage for anyone who needs one. Within a week, agents of both sides had called at Wyatt. Each was polite. Each wanted to know whom the islands intended to sell to.\n\nThe executive has three choices and has been warned that none of them is neutral in the way the islands would like. It can embargo ore to all belligerents, losing money and keeping its word. It can sell to every buyer who pays and collects, which is profitable and will be called something else on the continent. Or it can try to do both, case by case, which will satisfy nobody.\n\nWhatever the islands decide, the war will be decided elsewhere.\n\nProvisional gameplay: Erusea's invasion of San Salvacion and seizure of Stonehenge is official (ACES Chronicle, 2003 / SUMMER)."
 ac_ud_minb.112.t:0 "News from San Salvacion"
 ac_ud_minb.113.a:0 "Publish the war accounts."
 ac_ud_minb.113.b:0 "Rebuild the fleet first."
 ac_ud_minb.113.d:0 "The war is over, and the islands are taking stock. The trade desks have reopened. The insurance pool has paid its last claims and is counting what it has left. The harbourmaster at Wyatt has stopped recording which flag each ship flies before he records what it carries.\n\nWhat Spayca sold, and to whom, is now a matter of record, and the record is being read on the continent. Governments that bought island ore during the war remember the price. Governments that were refused remember that too. The islands' neutrality has survived, more or less, but it has acquired a history, and histories are argued over.\n\nAt home, the war years have changed the islands in ways that the executive is only beginning to measure. The merchant fleet is smaller and older. The pits are deeper. The people who came on the refugee ships, those who stayed, have children in island schools. The shelters behind Wyatt are now storerooms, and nobody is quite ready to fill them in.\n\nThe review that began the islands' long decade asked what the government was for. The answer is now written in ten years of decisions. Spayca will go on selling ore to Usea. What Usea thinks of Spayca is a question for the years after this one.\n\nProvisional gameplay: the war's official end is ACES Chronicle, 2005 / 09.19; Spayca's part in it is not."
 ac_ud_minb.113.t:0 "The Archipelago After the War"
 ac_ud_minb.201.a:0 "Start with the customs code."
 ac_ud_minb.201.b:0 "Start with the interior district."
 ac_ud_minb.201.d:0 "The survey teams stood at every frontier post for a full season with clipboards and counters, and when they had finished the National Administration discovered something it had suspected for years and never measured: Calladen is a corridor that happens to have a country attached. Freight from Scandia, Dorondo, Ferustia and Bulgurdarest crosses its three districts on the way to somewhere else, and a large share of it never stops long enough to pay anything.\n\nThe capital district handles the heaviest traffic, most of it from the Dorondan frontier, which runs almost into the city. Port Edwards, the smaller harbour, sees inland freight that could not afford the capital's quays. The interior district, inland and unglamorous, turns out to be the place where nearly every route meets, and where nearly every delay begins.\n\nThe customs service has four sets of rules, one for each neighbour, written at different times by different governments. Inspectors apply whichever set they learned first. Hauliers know which posts are slow, which are expensive, and which can be persuaded.\n\nThe survey's authors end with a sentence the Administration has had printed and pinned in every ministry: a crossroads that does not know its own traffic is not governed by anyone.\n\nProvisional gameplay: Calladen's states, resources, neighbours and 1991 government are mod provenance (history/states 15, 355, 393; history/countries/CAL - Calladen.txt; adjacency from the province map)."
 ac_ud_minb.201.t:0 "Counting the Crossroads"
 ac_ud_minb.202.a:0 "Circulate both chapters."
 ac_ud_minb.202.b:0 "Ask the hauliers."
 ac_ud_minb.202.d:0 "The draft customs code reached the Administration's desk with two final chapters, because its authors could not agree on one. Both chapters accept the same basic idea: Calladen will have one code for all four frontiers instead of four. They disagree about what that code should be for.\n\nThe first chapter proposes open transit. Goods crossing Calladen would travel on a single declaration and a single seal, inspected only when an officer has a reason. Hauliers would save days on every journey. The neighbours would come to rely on Calladen's corridors, and Calladen would earn its living from volume. Its critics point out that a country which inspects nothing will soon carry things it would rather not, and that a corridor everyone relies on is a corridor everyone will want to control.\n\nThe second chapter proposes bonded corridors. Transit goods would travel only on fixed routes between licensed depots, sealed at one frontier and opened at the other. It is slower, and hauliers will complain. But the state would know what crosses it, could charge for the privilege, and could close a corridor without closing the country.\n\nThe customs service is divided. So are the neighbours' trade attaches, who have begun to call at the capital district with opinions of their own.\n\nProvisional gameplay."
 ac_ud_minb.202.t:0 "Two Customs Doctrines"
 ac_ud_minb.203.a:0 "Fix the first election date."
 ac_ud_minb.203.b:0 "Let the assemblies sit first."
 ac_ud_minb.203.d:0 "The charter was adopted in the old assembly hall in the capital district, which had been used as a records office for so long that the clerks had to move filing cabinets to make room for the delegates. It is short. It restores elected assemblies in the three districts, creates a cabinet answerable to them, and fixes a calendar of elections that no government can postpone by decree.\n\nThe jurists who wrote it insist that it changes less than it seems. The National Administration remains; its officials keep their posts; the customs code and the corridors are untouched. What changes is who the Administration answers to. Until now it answered to itself. From now on it answers to people who use the roads.\n\nThat is precisely what worries its opponents. The engineers who run the corridors fear that elected assemblies will spend the transit revenues on whatever wins votes in the capital district, and leave the interior junction to decay. The frontier commanders fear that elected politicians will open the frontiers to anyone with a ticket and close them only after something has gone wrong. Both have said so publicly. Both have been told that they may stand for election.\n\nThe neighbours are watching with interest. Calladen's elections will be the first in the region in some time, and the hauliers who cross its frontiers every day will be watching the polling stations at the posts, where commuters can vote on their way across.\n\nThis is an alternate political path for an unsourced state. The Electoral Charter is not established in any official chronology.\n\nProvisional gameplay."
 ac_ud_minb.203.t:0 "The Electoral Charter"
 ac_ud_minb.204.a:0 "Publish the ten-year programme."
 ac_ud_minb.204.b:0 "Hear the district councils once more."
 ac_ud_minb.204.d:0 "The Transit Directorate held its first meeting in the drawing office of the railway administration, because it had the largest tables in the capital district and nobody saw any reason to move them. Seven directors: the chief engineers of the railways and the roads, the head of the customs service, the harbourmaster of the capital district, the depot superintendent of the interior junction, and two senior officials of the National Administration who had spent their careers keeping all of the others supplied.\n\nTheir argument is that Calladen is a machine for moving freight, and machines are run by engineers. Elections would interrupt the timetables. Frontier commanders would close the crossings at the first rumour. The Directorate will govern by plan, publish its plans, and be judged by whether the trains run.\n\nThe plans are good. Within a month the Directorate has published a ten-year programme for the corridors, a new tariff schedule and a list of every depot that needs repair. What it has not published is any way for someone who disagrees to change its mind. The district councils have been reduced to advisory bodies. Their first advice, that the plan pays too little attention to the people who live along the corridors, was received politely and filed.\n\nAbroad, the Directorate is welcomed by everyone who ships freight across Calladen. At home it is welcomed by the people who work for it, tolerated by the people who use it, and quietly resented by the people who live beside it.\n\nThis is an alternate political path for an unsourced state. The Transit Directorate is not established in any official chronology.\n\nProvisional gameplay."
 ac_ud_minb.204.t:0 "The Transit Directorate"
 ac_ud_minb.205.a:0 "Keep the barriers down."
 ac_ud_minb.205.b:0 "Reopen the crossings with guards."
 ac_ud_minb.205.d:0 "The Frontier Security Council was proclaimed at the main Dorondan crossing, in front of the customs house, with the barrier down and the traffic held for an hour so that everyone could hear. Its members are the commanders of the frontier posts and a handful of civilian officials who have argued for years that Calladen's borders are its only real defence and its greatest weakness.\n\nTheir case is simple and widely shared. Calladen is small, its neighbours are larger, and everything that crosses its frontiers is someone else's business conducted on Calladenian soil. A country made of borders, the council says, must be governed by the people who guard them. Every crossing will be a question of security first and of trade second. The council will govern until the frontiers are secure, and it will decide when that is.\n\nThe first measures are visible within days. Armed guards replace civilian inspectors at the busiest posts. Every traveller is asked for a destination and a purpose. The bonded routes, if Calladen has them, are patrolled; if it does not, the council announces that it will create them. Queues at the frontiers lengthen, and hauliers begin to talk openly about routes that avoid Calladen altogether.\n\nThe neighbours have reacted cautiously. None of them objects to a secure frontier. All of them have noticed that the council's speeches describe the neighbours, by name, as the source of every danger the frontier must guard against.\n\nThis is an alternate political path for an unsourced state. The Frontier Security Council is not established in any official chronology.\n\nProvisional gameplay."
 ac_ud_minb.205.t:0 "The Frontier Security Council"
 ac_ud_minb.206.a:0 "Prepare a draft protocol."
 ac_ud_minb.206.b:0 "Prepare the bilateral case."
 ac_ud_minb.206.d:0 "Calladen has been a member of the Central Usean Treaty Council for as long as most of its officials can remember, and for most of that time membership has meant attending meetings, signing communiques and paying a modest subscription. The customs delegation now being sent to the council's offices is the first time Calladen has gone there wanting something.\n\nWhat it wants is simple to state. Three of Calladen's four neighbours, Scandia, Dorondo and Bulgurdarest, are members of the council. Ferustia is not. If the council writes common rules for transit freight, Calladen's corridors will either fit those rules or be bypassed by them. The delegation's task is to make sure the rules fit.\n\nThere are two ways to do this. The delegation could offer Calladen's own customs code as the basis for a council protocol: one set of seals and papers from one end of the membership to the other, drafted, printed and checked in Calladen. Or it could argue that transit tariffs are a matter for each member, keep Calladen's power to bargain with each neighbour separately, and accept a lot of paperwork as the price of freedom.\n\nThe council's secretariat has already let it be known that it would welcome a draft. It has also let it be known that Ferustia will not be bound by anything the council adopts.\n\nProvisional gameplay: the Central Usean Treaty Council is the mod's CNEA membership; Scandia, Dorondo and Bulgurdarest are members and Ferustia is not (mod provenance, history files)."
 ac_ud_minb.206.t:0 "The Council and the Crossroads"
 ac_ud_minb.207.a:0 "Start the timetables."
 ac_ud_minb.207.b:0 "Start the shelters."
 ac_ud_minb.207.d:0 "The announcement from Central Usea reached the capital district by radio in the middle of a working day. Ulysses, an asteroid, will strike Earth. The Federal Republic is preparing. Every other government in Usea now has to decide what preparing means for it.\n\nFor Calladen the question arrived already shaped. The country's whole life is movement: freight, commuters, trucks, trains, ships. The Administration's first emergency meeting spent less than ten minutes on the asteroid and more than two hours on the railways. If the alarm is raised, who moves first? Where do they go? What happens to the freight trains already on the lines, the trucks already at the frontiers, the travellers who happen to be in Calladen that day?\n\nBy evening there was a plan to make a plan. Every train, bus and truck would be assigned a place in an evacuation timetable. The interior district, furthest from the sea and best connected, would be the place to build shelters and keep reserves. The neighbours would be asked to agree that a traveller caught on the wrong side of a frontier would be sheltered wherever they were.\n\nNone of this will stop Ulysses. The Administration knows it and has said so. What the corridors can do is make sure that whatever happens next happens to a country that knows where its people are.\n\nProvisional gameplay: the Ulysses announcement is official (ACES Chronicle, 1996 / 04.20); Calladen's response is not."
 ac_ud_minb.207.t:0 "The Ulysses Corridors"
 ac_ud_minb.208.a:0 "Call the commanders in."
 ac_ud_minb.208.b:0 "Double the frontier posts."
 ac_ud_minb.208.d:0 "The first reports came in on the customs telex before the radio had them: officers in several Usean states had moved against their governments, and nobody yet knew how many or where. By noon the reports were contradictory. By evening it was clear that something large was happening across the continent, and that Calladen's neighbours were as uncertain as Calladen was.\n\nThe National Administration met through the night. Nobody in the room could say whether any Calladenian officer had been approached, and nobody wanted to be the one to ask. The frontier posts were full of armed men who had spent years complaining about civilian government. The garrisons in the capital district answered to commanders the Administration knew mostly by reputation.\n\nTwo courses were argued. The first was to say nothing, trust the garrisons, and avoid giving any officer a reason to feel suspected. The second was to call every commander to the capital district, one at a time, to explain their orders and receive new ones. The first risked being wrong. The second risked insulting the people it was meant to reassure.\n\nThe Administration chose to review. Whatever the commanders thought of it, the review would at least establish who commanded what, which was more than the Administration had known the day before.\n\nProvisional gameplay: the Usea-wide coup is official (ACES Chronicle, 1997 / 05.30); no Calladenian unit or officer is named or asserted to have taken part."
 ac_ud_minb.208.t:0 "The Coup Reports"
 ac_ud_minb.209.a:0 "Let relief pass free of tolls."
 ac_ud_minb.209.b:0 "Charge the normal tolls."
 ac_ud_minb.209.d:0 "The night of the impact passed in Calladen with the radios on and the trains stopped. By morning the continental stations were reporting damage in places that Calladen's corridors serve every day, and by noon the requests had begun to arrive at the clearing house, the customs desks and the railway administration all at once.\n\nRelief for Calladen's neighbours must cross Calladen. Fuel, food, medical stores and engineers are already on the move from the sea and from other frontiers, and every one of those shipments will pass through a Calladenian post, a Calladenian depot and, in most cases, the interior junction. The corridors built for trade are now the corridors of relief.\n\nThe question in front of the Administration is not whether to let relief pass. Nobody has argued that. It is how. Relief could travel free of tolls and ahead of all other freight, which would be generous, popular and expensive. Or it could pay the normal tolls and take its place in the timetable, which would keep the clearing house solvent and the ordinary freight moving, and be remembered for a long time by the neighbours.\n\nThe relief trains are already being made up at the junction while the Administration decides. Nobody in Calladen asserts that the impact damaged the country itself, and the bulletins say so plainly.\n\nProvisional gameplay: the impact is official (ACES Chronicle, 1999 / 07.08); no impact site or damage in Calladen is asserted."
 ac_ud_minb.209.t:0 "Relief Through the Crossroads"
 ac_ud_minb.210.a:0 "Send medical teams to the posts."
 ac_ud_minb.210.b:0 "Count the arrivals first."
 ac_ud_minb.210.d:0 "The frontier posts noticed it before the Administration did. The usual queues of trucks and commuters had begun to include families with luggage, then buses chartered by relief agencies, then whole trains whose passengers had no onward tickets. Erusea had closed its doors to refugees, and the people who might have gone there were looking for somewhere else.\n\nCalladen does not border Erusea. It does not need to. Its corridors connect the continent, and people who have been turned away from one destination are moving along those corridors in search of another. Most of them do not want to stay in Calladen. Many of them have nowhere else that will take them.\n\nThe frontier posts are asking for instructions. The Administration has two answers before it. It could open humanitarian corridors: marked routes across the country, with food, shelter and medical posts, and permission to stay for those who have nowhere else to go. Or it could allow registered transit only: refugees cross when they are registered at the frontier and sponsored onward by the country they are going to, and wait at the posts until they are.\n\nThe first answer will crowd the interior district. The second will crowd the frontier posts. Either way, the neighbours will watch what Calladen does and plan around it.\n\nProvisional gameplay: the Erusean refugee closure is official (ACES Chronicle, 2000 / 04.21); the arrivals at Calladen's posts are not."
 ac_ud_minb.210.t:0 "Refugees at the Frontier Posts"
 ac_ud_minb.211.a:0 "Hold every request for review."
 ac_ud_minb.211.b:0 "Ask the treaty council's view."
 ac_ud_minb.211.d:0 "Erusea has invaded San Salvacion and taken the railgun installation there. Calladen is nowhere near the fighting, and for a few weeks the war was something on the radio. Then the requests began to arrive at the clearing house: freight for the war, routed across Calladen because that is the shortest way, with papers that describe it as something else.\n\nThe clearing house has been asked to move fuel, vehicles, spare parts and crates whose manifests say machinery. Some requests come with official letters; some come with offers of payment that would cover the corridor budget for a year. The customs service can usually tell what a crate contains. It cannot always tell who will use it.\n\nThe Administration has two answers before it. It could adopt neutral transit rules: no cargo for any belligerent crosses Calladen, whatever its papers say, and the corridors stay open for everything else. Or it could license war freight: belligerent cargo crosses on the bonded routes, under licence, at a premium, and Calladen is paid for its geography.\n\nThe first answer will cost money and may anger whichever side was relying on the corridors. The second will make money and will be called something unpleasant by whichever side was not.\n\nProvisional gameplay: Erusea's invasion of San Salvacion and seizure of Stonehenge is official (ACES Chronicle, 2003 / SUMMER)."
 ac_ud_minb.211.t:0 "Cargo for the War"
 ac_ud_minb.212.a:0 "Publish the war ledgers."
 ac_ud_minb.212.b:0 "Rebuild the corridors first."
 ac_ud_minb.212.d:0 "The war is over, and the clearing house has reopened its full set of ledgers. For the first time in years the Administration can see the whole picture: what crossed Calladen during the war, what was refused, what was paid, and what was lost when the traffic stopped.\n\nThe corridors held. Trains ran, roads stayed open, and the interior junction never closed for more than a day. That is the achievement Calladen will point to. What its neighbours will point to is less simple. Every decision about who could cross and on what terms is now a matter of record, and every neighbour has its own reading of that record.\n\nAt home the war years have left their marks. The frontier posts are larger and better manned than they were. The refugees who stayed have become commuters, hauliers and customs clerks. The shelters under the interior depots are used to store wagons nobody has room for anywhere else.\n\nCalladen began this decade by counting its traffic. It ends it knowing that the traffic is the country, and that the country is only as safe as the corridors that cross it. What it does with that knowledge belongs to the years after this one.\n\nProvisional gameplay: the war's official end is ACES Chronicle, 2005 / 09.19; Calladen's part in it is not."
 ac_ud_minb.212.t:0 "The Crossroads After the War"
 ac_ud_minb.301.a:0 "Start with the capital."
 ac_ud_minb.301.b:0 "Start with the mountains."
 ac_ud_minb.301.d:0 "The National Administration meets in a converted customs hall in the capital, which is close to the sea and a long way from everything else Roca Roja contains. From its windows the clerks can watch freighters load mountain ore at the quays. The ore came down from the Scofield on trucks and mules. Very few of the clerks have ever been up there.\n\nRoca Roja is three districts that share a flag and not much else. The capital trades by sea and thinks of itself as the republic. The interior farms the long valleys that run to the Central Usean frontier and thinks of itself as the part of the republic that actually borders anyone. The Scofield highlands mine steel and aluminium ore, keep their own counsel and think of the other two as places where the ore is sold.\n\nThe Administration has governed all three for years without elections and without much objection, because it has asked very little of anyone. That arrangement is running out. The interior wants a say in frontier policy. The highlands want roads. The capital wants a seat at the treaty council that means something.\n\nCalling the three district councils together is the first step. Nobody in the hall pretends to know what the second will be.\n\nProvisional gameplay: Roca Roja's three states, resources, neighbours and 1991 government are mod provenance (history/states 67, 416, 465; history/countries/RJR - Roca Roja.txt)."
 ac_ud_minb.301.t:0 "Three Districts, One Republic"
 ac_ud_minb.302.a:0 "Read every complaint first."
 ac_ud_minb.302.b:0 "Settle the double duties now."
 ac_ud_minb.302.d:0 "The new frontier office at Roca Roja occupies a farmhouse a short drive from the Central Usean line. Its first week is spent reading. There are frontier agreements nobody has enforced, customs schedules nobody has updated, and a drawer full of complaints from farmers whose fields lie on both sides of the line and who have paid duty twice on the same harvest.\n\nThe interior's people are not anxious about Central Usea. They trade with it, marry into it and listen to its radio stations. What they want is a policy. The Federal Republic is the largest and richest neighbour Roca Roja has, and the frontier office has been asked to decide how close the republic should stand to it.\n\nOne answer is association: adopt the Federal Republic's frontier rules, its customs schedules and its road standards, and let the interior's trade cross the line as if it were not there. The other is distance: keep Roca Roja's own rules, its own customs posts and its own counsel, and be a good neighbour without becoming a dependant.\n\nBoth answers have supporters in the interior. Neither will be popular in the highlands, which suspect that whoever wins, the mountains will pay.\n\nProvisional gameplay."
 ac_ud_minb.302.t:0 "The Frontier Office"
 ac_ud_minb.303.a:0 "Promise the roads first."
 ac_ud_minb.303.b:0 "Register the claims first."
 ac_ud_minb.303.d:0 "The survey teams spent the summer walking the Scofield passes with theodolites, notebooks and mules borrowed from the mines. They came back thinner, sunburnt and with a map that nobody in the capital had seen before. It shows forty working mines, a dozen abandoned ones, nine passes usable in winter and three usable only by people who were born there.\n\nIt also shows how the highlands actually live. Ore comes down to the interior by mule and truck on roads the mining families built themselves. Claims are held under titles written in family Bibles. Disputes are settled by the oldest miner in the valley, and the republic's courts have not been consulted in living memory.\n\nThe highlands' councils have read the survey with suspicion. A map, one of them told the survey leader, is the first thing the capital needs before it can tax you. But the same councils have asked, politely, whether the capital might now be able to build them a road.\n\nThe survey's authors recommend both: graded roads to the upper workings, and registered leases for every working claim. The highlands will have to be persuaded that the second is the price of the first, and that the capital means to keep both promises.\n\nProvisional gameplay."
 ac_ud_minb.303.t:0 "The Scofield Survey"
 ac_ud_minb.304.a:0 "Publish all three drafts."
 ac_ud_minb.304.b:0 "Ask the districts to report back."
 ac_ud_minb.304.d:0 "The joint session of the three district assemblies met in the capital's largest hall and lasted eleven days. The capital's delegates arrived with a draft constitution. The interior's arrived with amendments to it. The highlands' arrived with a list of questions about roads, which they insisted on reading into the record before anything else could be discussed.\n\nBy the end of the first week three proposals had emerged. The capital and the frontier towns favour a federal association: a parliamentary cabinet, a single civil service and the closest relationship with Central Usea that the treaty council allows. The rural interior and much of the highlands favour a cantonal league: three cantons, three assemblies and a League Council that may do only what all three agree. The mining towns and the interior's tenant farmers favour a commonwealth built on the mine councils, with land for those who work it.\n\nThe National Administration has said that it will hand over to whichever government the republic chooses. It has not said what it will do if the republic cannot choose.\n\nThe debate's last day ended without a vote. The delegates went home to consult their districts, which is what Roca Rojans do when they cannot agree, and which is why they have so rarely had to.\n\nProvisional gameplay."
 ac_ud_minb.304.t:0 "The Mountain Constitution"
 ac_ud_minb.305.a:0 "Promise the highlands their roads."
 ac_ud_minb.305.b:0 "Begin with the civil service."
 ac_ud_minb.305.d:0 "The Federal Association Cabinet took office in the capital on a wet morning, before a crowd that was larger than expected and mostly from the capital. Its programme fits on one page. A parliament elected by all three districts. A civil service recruited by examination and paid from one treasury. Federal standards for weights, gauges and roads, borrowed from Central Usea because Central Usea already has them. And the closest association with the Federal Republic that the treaty council allows, short of anything that would make Roca Roja less than a state.\n\nThe capital is delighted. Its merchants have wanted Central Usean standards for years, and its clerks will staff the new civil service. The frontier towns are cautiously pleased: association means the double duties will end. The highlands are not pleased at all. A single civil service, the highland councils point out, means officials from the capital in every mining valley, and federal standards mean federal inspectors.\n\nAcross the frontier, the Federal Republic has welcomed the new government warmly and promised nothing. Its officials have said that Roca Roja's choices are its own. Several of them have privately asked when the standards law will be passed.\n\nThe Cabinet's first test will be the federal elections, which it has promised within two years. Its second will be persuading the highlands that a federal republic is still their republic, and that an examination in the capital is not a way of keeping mountain families out of the civil service.\n\nThis is an alternate political path for an unsourced state. The Federal Association Cabinet is not established in any official chronology.\n\nProvisional gameplay."
 ac_ud_minb.305.t:0 "The Federal Association Cabinet"
 ac_ud_minb.306.a:0 "Write the canton charters at once."
 ac_ud_minb.306.b:0 "Let each canton write its own."
 ac_ud_minb.306.d:0 "The League was proclaimed in the interior, at Roca Roja itself, because the capital's delegates could not agree to hold it in the capital and the highlands' delegates refused to come down any further. Three cantons now exist where there were three districts. Each has its own assembly, its own courts, its own taxes and its own militia. The League Council in the capital may do what all three cantons allow, and nothing else.\n\nThe highlands are jubilant. For the first time the Scofield governs itself in law and not only in practice, and the capital needs the highland assembly's consent to build so much as a bridge. The interior is satisfied: its frontier policy is now its own business. The capital, which proposed none of this, has accepted it with the resignation of a city that knows it is outvoted.\n\nThe League's critics, most of them in the capital, point out that a government which can do only what three assemblies agree on will do very little. The League's defenders reply that the republic has never needed much government, and has always needed to be asked.\n\nAt the treaty council the League will speak with one voice, provided the three cantons have agreed beforehand what the voice should say. The first such agreement took nine days. The council has been patient, and several of its larger members have quietly asked whether a League that needs nine days to agree on a sentence can be relied on in a crisis.\n\nThis is an alternate political path for an unsourced state. The Cantonal League is not established in any official chronology.\n\nProvisional gameplay."
 ac_ud_minb.306.t:0 "The Cantonal League"
 ac_ud_minb.307.a:0 "Honour every frontier agreement."
 ac_ud_minb.307.b:0 "Begin with the mine councils."
 ac_ud_minb.307.d:0 "The Commonwealth was founded at a mass meeting in the largest mining town of the Scofield, attended by delegates from every mine council in the highlands and from the tenant farmers' associations of the interior. The capital sent observers. They were seated, given tea and told politely that their district would have its full share of delegates once it had organised councils of its own.\n\nThe Commonwealth's programme is simple and alarming to anyone who owns land. Every mine and every mill will be run by an elected council with authority over shifts, safety and output. An elected Council of Delegates will govern the republic above them. The interior's large estates will be divided among the families who farm them, and the owners paid from mining revenue over twenty years. Elections will continue, and the Commonwealth intends to win them.\n\nThe highlands are euphoric. The interior is divided between tenants who expect land and owners who expect ruin. The capital is alarmed, and its merchants have begun asking the treaty council whether a member state may change its constitution this quickly. The council has replied, after some delay, that it may.\n\nAcross the frontier, the Federal Republic has said nothing in public. In private its officials have asked whether the Commonwealth intends to honour the frontier agreements. The Council of Delegates has answered that it intends to honour every agreement that the people of Roca Roja have reason to keep.\n\nThis is an alternate political path for an unsourced state. The Miners' Commonwealth is not established in any official chronology.\n\nProvisional gameplay."
 ac_ud_minb.307.t:0 "The Miners' Commonwealth"
 ac_ud_minb.308.a:0 "Survey the galleries first."
 ac_ud_minb.308.b:0 "Buy the grain first."
 ac_ud_minb.308.d:0 "The announcement from Central Usea reached the capital by radio, the interior by its neighbours across the frontier, and the highlands two days later by a truck driver who had heard it in a roadside cafe and assumed everyone else had too. An asteroid called Ulysses will strike Earth. The Federal Republic is preparing. It has asked its friends to prepare too.\n\nRoca Roja has no observatory, no early-warning radar worth the name and no idea where the fragments will fall. What it has is mountains, and the people who have dug into them for generations. Within a week the highland councils had sent the capital a message that was half offer and half demand: the old galleries under the Scofield could shelter the republic, if somebody paid to make them safe.\n\nThe district offices have drawn up their own lists. The capital wants an evacuation plan for its coast. The interior wants fuel and medical depots along its roads. The highlands want the galleries surveyed, ventilated and stocked, and they want their own people to do the work.\n\nNone of this will stop an asteroid. All of it may decide who is still standing afterwards, and the republic does not intend to pretend it knows where the fragments will fall.\n\nProvisional gameplay: the Ulysses announcement is official (ACES Chronicle, 1996 / 04.20); Roca Roja's response is not."
 ac_ud_minb.308.t:0 "Word of Ulysses"
 ac_ud_minb.309.a:0 "Guard the district offices."
 ac_ud_minb.309.b:0 "Keep the garrisons in barracks."
 ac_ud_minb.309.d:0 "The first reports came over the radio in the early afternoon and contradicted each other by evening. A coup has broken out across Usea. Some stations reported fighting, others reported that the fighting was over, and one reported both within the same bulletin. The capital's telex machines filled with messages from neighbours asking what Roca Roja knew. Roca Roja knew nothing more than anyone else.\n\nWhat the republic does know is that it has soldiers, barracks and district offices, and that nobody has ever written down precisely who may order the soldiers to do what. The garrison commanders have asked for instructions. Some of them want to put guards on every district office until the news is clearer. Others warn that soldiers on the streets of the capital will frighten people more than the radio has.\n\nThe Administration's advisers are divided. Guards are a sign of strength, and strength may prevent trouble. Guards are also a sign that the government expects trouble, and expectations have a way of being met.\n\nWhatever happens elsewhere in Usea will be settled elsewhere. What happens in the republic's barracks tonight will be settled in the capital, by people who will have to explain their choice to all three districts in the morning.\n\nProvisional gameplay: the Usea-wide coup of 1997 / 05.30 is official (ACES Chronicle); no rebel country is named and no event in Roca Roja is asserted."
 ac_ud_minb.309.t:0 "Reports of a Coup"
 ac_ud_minb.310.a:0 "Clear the corridor first."
 ac_ud_minb.310.b:0 "Count the hospitals first."
 ac_ud_minb.310.d:0 "The signal posts on the Scofield heights stayed manned through the night of the impact, though nobody was certain what they were watching for. The duty officers logged lights, pressure readings and long silences on the radio. The district offices stayed open. In the capital, people gathered on the quays and in the squares because it seemed better than being alone.\n\nBy morning the reports from the continent were arriving faster than anyone could read them. Central Usea, across the interior frontier, was asking its neighbours for help: medical stores, fuel, vehicles and roads that could carry them. The interior district assembly met at dawn and voted, without much debate, to clear a corridor across the valleys to the Federal Republic.\n\nUp in the passes, the army's field hospitals were set up before anyone had formally ordered them. The highland brigades had rehearsed this for two years and did not wait to be asked.\n\nThe republic did not know where the fragments had fallen, or what would follow them, and said so plainly in every bulletin it broadcast. What it did know was how many trucks it had, where the roads went, and which of them were still open by noon.\n\nProvisional gameplay: the impact is official (ACES Chronicle, 1999 / 07.08); no impact site or damage in Roca Roja is asserted."
 ac_ud_minb.310.t:0 "The Night of the Impact"
 ac_ud_minb.311.a:0 "Send the hospitals more stores."
 ac_ud_minb.311.b:0 "Ask the cantons and districts to share the cost."
 ac_ud_minb.311.d:0 "The first column reached the head of the pass road at dusk: perhaps two hundred people, most of them on foot, some with carts, a few with nothing at all. They had been walking for weeks. Erusea had closed its doors to refugees, and the places they had tried after that had closed their doors too. Somebody had told them that the mountain republic still let people through.\n\nBy the end of the month the field hospitals in the passes were treating more refugees than soldiers, and the district offices were feeding columns that arrived every few days. The highland villages have shared what they have. Their councils have now written to the capital asking how long they are expected to go on sharing it.\n\nTwo answers are being argued. The interior has empty valleys and too few hands to farm them; the refugees could be settled there, given land and building materials, and become Roca Rojans. Or the columns could be escorted across the mountains and out the other side, fed on the way, and left to find a country that will keep them.\n\nNeither answer is free, and neither will be forgotten by the people in the columns.\n\nProvisional gameplay: the Erusean refugee closure is official (ACES Chronicle, 2000 / 04.21); the columns in Roca Roja are not."
 ac_ud_minb.311.t:0 "Columns on the Pass Roads"
 ac_ud_minb.312.a:0 "Double the frontier office staff."
 ac_ud_minb.312.b:0 "Put the brigades on the pass roads."
 ac_ud_minb.312.d:0 "The news reached the interior before it reached the capital, carried across the frontier by Central Usean radio and by farmers who had watched troop trains moving south all night. Erusea has invaded San Salvacion and taken the great railgun installation there. The Federal Republic is mobilising. Its frontier with Roca Roja, so quiet for so long, is suddenly full of vehicles.\n\nRoca Roja is not at war and has no intention of being at war. But it shares a long frontier with a country that is, and its roads, depots and hospitals are exactly what an army's rear area needs. Within a fortnight Central Usean officials had called at the frontier office with a list. They were polite. They mentioned the treaty council more than once.\n\nThe republic has two answers available, and both have costs. It can let its roads and hospitals serve Central Usea's rear area under civil contracts, staying out of the fighting but inside the war. Or it can declare its roads neutral: no military cargo for any belligerent, civilian traffic searched and allowed through.\n\nEither way, the passes must stay open for food, fuel and the sick. The highland brigades have already been told, and have already moved.\n\nProvisional gameplay: Erusea's invasion of San Salvacion and seizure of Stonehenge is official (ACES Chronicle, 2003 / SUMMER)."
 ac_ud_minb.312.t:0 "War Beyond the Frontier"
 ac_ud_minb.313.a:0 "Repair the pass roads."
 ac_ud_minb.313.b:0 "Publish the war accounts."
 ac_ud_minb.313.d:0 "The war is over, and the traffic on the interior roads is changing. Fewer military trucks, more farm carts. The frontier office has gone back to reading complaints about double duties. In the highlands the brigades are coming home, and the mine councils are asking when the roads they kept open will be repaired.\n\nWhat Roca Roja did in the war years is now a matter of record, and Central Usea has read it. If the republic served the rear area, the Federal Republic remembers the roads and the hospitals, and expects the friendship to continue. If the republic kept its roads neutral, the Federal Republic remembers that too, and the treaty council's next meeting will be polite and slightly cold.\n\nAt home the three districts have changed. The interior has new villages, or new memories of columns passing through. The capital has new quays and new debts. The highlands have galleries that were dug for shelters and are now used as storerooms, and nobody is in a hurry to fill them in.\n\nThe National Administration once called the three districts together to ask what held the republic together. A decade later the answer is the mountains, and the roads through them, and the people who kept those roads open.\n\nProvisional gameplay: the war's official end is ACES Chronicle, 2005 / 09.19; Roca Roja's part in it is not."
 ac_ud_minb.313.t:0 "After the War"
 ac_ud_minb_programme_cooldown:0 "A national programme was started within its cooldown"
 ac_ud_minors_b_programmes:0 "National Programmes"
 ac_ud_minors_b_programmes_desc:0 "National programmes of the smaller Usean states. Each one is paid in political power and institutional capacity, and through the fiscal model when it is ready. Provisional gameplay."
 ac_ud_rjr_tree:0 "The Mountain Republic"
 ac_ud_rjr_tree_desc:0 "Roca Roja is three districts that rarely agree: a coastal capital that trades, an interior that faces Central Usea across a long frontier, and the Scofield highlands that mine and keep to themselves. The programme joins them into one republic, decides how close to stand to the Federal Republic, and carries the mountains through the Ulysses years and the war that follows.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
 ac_ud_syc_tree:0 "The Chromium Archipelago"
 ac_ud_syc_tree_desc:0 "Spayca's four islands hold more chromium than any other Usean state and a merchant fleet out of all proportion to their population. The programme decides who owns the ore, who governs the islands, and how a neutral archipelago lives through the Ulysses years and the war that follows them.\n\nProvisional gameplay. Geography, resources and neighbours are mod provenance."
