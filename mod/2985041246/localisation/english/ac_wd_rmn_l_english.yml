l_english:
 RMN_wd_pol_canvass:0 "The Winter Canvass"
 RMN_wd_pol_canvass_desc:0 "Romny enters 1991 governed by an unnamed National Administration that carries democratic colours while the election calendar stays shut. Canvassers sent through all six districts come back with a hard count: half the country follows the national movement, nearly half wants non-party government, and one citizen in a hundred backs the colours the Administration wears. Nobody can govern well without knowing that."
 RMN_wd_pol_movement_halls:0 "Inside the Movement Halls"
 RMN_wd_pol_movement_halls_desc:0 "The national movement meets in rented halls beside the arms works and the logistics centre, where its speakers promise discipline, work and pride to young men who drill on Sundays. Sending officials to sit in the back rows and read the pamphlets costs nothing but nerve. It tells the Administration what half its citizens actually want before anyone sits down to bargain with them."
 RMN_wd_pol_notables:0 "The Non-Party Lists"
 RMN_wd_pol_notables_desc:0 "The other great camp has no party at all. It is a loose web of district notables, co-operative boards, works managers and retired prefects who want competent government and no ideology. Publishing the names on their informal lists makes them visible for the first time, and answerable. Several notables would much rather have stayed comfortably out of sight."
 RMN_wd_pol_papers:0 "Licences for District Papers"
 RMN_wd_pol_papers_desc:0 "Romny has one official gazette and a handful of movement sheets printed on borrowed presses. Licensing a weekly paper in every district, under a single press law, lets each camp argue in print rather than in halls and on street corners. The papers will attack the Administration from both sides at once, and the censors who once read everything lose their jobs."
 RMN_wd_pol_works_councils:0 "Elected Councils in the Works"
 RMN_wd_pol_works_councils_desc:0 "Half of Romny's factories make arms, and their workforces are the national movement's best recruiting ground. Elected works councils with a say over shifts, safety and canteens give those workers a channel that does not run through a movement hall. Managers lose some control of their own floors, and the movement accuses the Administration of buying its members with soup."
 RMN_wd_pol_path_charter:0 "Write the Charter First"
 RMN_wd_pol_path_charter_desc:0 "A small circle of jurists inside the Administration proposes the slow road: write a charter of rights, courts and a single chamber, entrench it, and only then open the ballot. The democratic colours would finally mean something. Both great camps would fight the draft clause by clause, and the Administration would govern unloved for years while they did."
 RMN_wd_pol_path_bench:0 "Hand the Seals to the Notables"
 RMN_wd_pol_path_bench_desc:0 "The non-party camp asks for what it already half has: a governing bench of district notables, chosen from the lists, ruling without parties and without a national campaign. Works managers, co-operative boards and prefects would openly run the country they already run informally. It is calm and competent. The movement, with half the country behind it, would be shut out by design."
 RMN_wd_pol_path_movement:0 "Open the Door to the Movement"
 RMN_wd_pol_path_movement_desc:0 "Half the country follows the national movement, and its leaders say a government that ignores half its people has no right to the seals. Letting the movement form an executive would match power to numbers. It would also hand the state to a movement that distrusts courts, papers and the non-party half of Romny, and that the frontier commanders already watch carefully."
 RMN_wd_pol_regime_republic:0 "Proclaim the Constituent Republic"
 RMN_wd_pol_regime_republic_desc:0 "The charter is ratified by a constituent assembly elected under its own rules, and a cabinet answerable to the new chamber takes the seals from the Administration. The change runs through the office, not a person. The first chamber is fractious, with movement and non-party deputies outnumbering the charter's authors, and every vote is a lesson in losing gracefully."
 RMN_wd_pol_regime_bench:0 "Seat the Bench of Districts"
 RMN_wd_pol_regime_bench_desc:0 "Each district sends notables from its list to a governing bench that sits in the capital and decides by majority, with no parties and no national campaign. The Administration's officials become the bench's clerks. Decisions are quick and practical. The national movement calls the bench a club of managers, and its halls fill every week the bench is in session."
 RMN_wd_pol_regime_movement:0 "The Movement Executive Takes the Seals"
 RMN_wd_pol_regime_movement_desc:0 "An executive committee of the national movement takes the seals and governs by decree, with the halls as its offices and the Sunday drill clubs as its stewards. Elections stay shut. The arms districts celebrate. The non-party half of the country goes quiet in public, and lenders, neighbours and the frontier staff all start reading the executive's statements twice."
 RMN_wd_pol_charter_court:0 "Seat the Charter Court"
 RMN_wd_pol_charter_court_desc:0 "The republic appoints a charter court of judges with fixed terms who can strike down any law that breaches the entrenched articles. Movement deputies object that unelected judges now outrank the chamber. The court's first judgments are cautious and narrowly argued. They still prove that the charter binds whoever holds the cabinet, which was the whole point of writing it first."
 RMN_wd_pol_bench_rotation:0 "One Seat in Three Rotates"
 RMN_wd_pol_bench_rotation_desc:0 "Critics say the bench is a closed club, and they are partly right. A rule that one seat in three rotates each spring, filled from fresh district lists, brings in younger managers and co-operative officers. Some veterans lose their seats and sulk. The bench becomes less cosy and more legitimate, though it still has no place for the movement's half of the country."
 RMN_wd_pol_movement_columns:0 "Labour Columns for the Plains"
 RMN_wd_pol_movement_columns_desc:0 "The executive turns the drill clubs into labour columns that spend each summer cutting roads and drains across the empty districts. Young men gain pay, uniforms and a purpose, and the roads arrive faster than any ministry could manage. The columns answer to the movement, not the ministries, and each one is a body in the field that the guard does not command."
 RMN_wd_dist_stakes:0 "Stake Out the Empty Districts"
 RMN_wd_dist_stakes_desc:0 "Three of Romny's six districts hold no road worth the name, no factory and no recorded mineral: the district the capital railway clips on its way to the logistics centre, District E at the frontier junction, and District F on the coast. Each still counts a large population on paper. Survey crews with pegs and chains go out first, because nobody can build on land nobody has measured."
 RMN_wd_dist_rail_corner:0 "Halts Along the Rail Corner"
 RMN_wd_dist_rail_corner_desc:0 "The level-two line from the capital to the logistics centre cuts across one corner of the rail-corner district and stops nowhere in it. Building halts, sidings and a gravel road from the track inland gives the district its first link to anywhere. The railway objects to stops that slow its freight, and the district asks why nobody thought of this sooner."
 RMN_wd_dist_junction_road:0 "A Road Out to the Junction"
 RMN_wd_dist_junction_road_desc:0 "District E is the only part of Romny that touches both Yuktobania and Kaluga, yet no railway reaches it and its tracks turn to mud every spring. A graded road from the capital district to the frontier corner gives traders, inspectors and the guard a way in. It also makes the junction easier to reach from the other side, which the frontier staff notes in writing."
 RMN_wd_dist_coast_road:0 "The District F Shore Road"
 RMN_wd_dist_coast_road_desc:0 "District F is a long stretch of coastal plain with no town of any size and no road along its shore. A shore road from the capital district gives fishing hamlets a way to market and the survey crews a way to work. It is the cheapest of the three district roads, because the ground is flat and dry, and also the least urgent of them."
 RMN_wd_dist_planned_towns:0 "Towns Drawn in the Capital"
 RMN_wd_dist_planned_towns_desc:0 "The planning school wants the state to build towns to a single pattern: a square, a works, a school, housing in rows and a road or rail link, placed where the survey says water and soil are good. Towns rise quickly and look alike. Settlers go where the plan sends them, and the treasury carries the whole cost and all of the blame."
 RMN_wd_dist_homesteads:0 "Land to Whoever Ploughs It"
 RMN_wd_dist_homesteads_desc:0 "The other school would rather give land away. Any family that farms a surveyed plot for five years receives title to it, with tools on credit and a road promised within reach. Settlement is slower and patchier, and the plots follow good soil rather than any plan. It costs the treasury far less, and the settlers owe the state nothing beyond their taxes."
 RMN_wd_dist_rail_corner_works:0 "A Works Hall at the Rail Corner"
 RMN_wd_dist_rail_corner_works_desc:0 "The first planned town rises beside the new halts at the rail corner, and its square faces a works hall built before the houses are finished. The hall makes pipe, fittings and window frames for the next towns. Workers come from the capital on contract, and the district finally has something to point at on a map besides survey pegs."
 RMN_wd_dist_shore_mill:0 "A Co-operative Mill on the Shore"
 RMN_wd_dist_shore_mill_desc:0 "Homestead families along the District F shore pool their first harvests to build a mill and repair shop beside the shore road. The state lends the machinery and the families own the building. It is small and slow to pay back. It is also the first factory in Romny that belongs to the people who work in it, which both great camps notice at once."
 RMN_wd_dist_boards:0 "District Boards from the Lists"
 RMN_wd_dist_boards_desc:0 "With the non-party lists now public, each empty district can draw a small board from the notables who actually live there. The boards decide where the next well, school and road spur goes, and answer for it at an open meeting every quarter. The capital loses some control of its own programme, and gains people on the ground who will defend it."
 RMN_wd_dist_small_yard:0 "A Boat Yard for District F"
 RMN_wd_dist_small_yard_desc:0 "Romny owns no dockyard at all; its single naval base serves freighters and coasters at the capital quay. A small yard on the District F shore, building and repairing coasters and fishing boats, gives the country its first hull trade. The yard will never build warships. It will keep the convoy fleet repaired without queuing for foreign berths."
 RMN_wd_dist_settled_census:0 "Count the Settled Districts"
 RMN_wd_dist_settled_census_desc:0 "Some years after the first pegs went in, census clerks return to the three empty districts and count what has changed: households, wells, schools, fields under plough and workshops with a roof. The figures will decide the next budget. They will also show whether the chosen model worked, and the losing school is already preparing its objections to the method."
 RMN_wd_works_sheet:0 "Put the Ten Works on One Sheet"
 RMN_wd_works_sheet_desc:0 "Romny has ten factories of any size, and five of them make arms: rifles, trucks, rail wagons and support equipment for a guard of four formations. They sit in the capital district, District B and the marsh district, each run from its own ministry desk. One inventory sheet, with costs, orders and idle shifts, is the first view anyone has had of the whole."
 RMN_wd_works_marsh_drains:0 "Drain the Marsh Works Yards"
 RMN_wd_works_marsh_drains_desc:0 "The two arms works in the marsh district stand on ground that floods each spring, and their yards turn to black mud that swallows trucks to the axle. Draining the yards and raising the access road on a causeway is unglamorous work. Shifts stop losing days to water, and the railway spur from the capital stops sinking a little further every year."
 RMN_wd_works_centre_sheds:0 "Sheds at the Logistics Centre"
 RMN_wd_works_centre_sheds_desc:0 "The logistics centre in District B is where two guard formations sit and where most finished equipment waits for collection. It has too few covered sheds, so trucks and wagons rust in the open. New sheds, loading ramps and a paved apron make the centre a working depot. The money comes from the works budget, and the works managers complain about it."
 RMN_wd_works_spares:0 "A Shelf of Spare Barrels"
 RMN_wd_works_spares_desc:0 "The sustainment school says a small guard does not need new rifles every year; it needs barrels, tyres, springs and radios on the shelf when old ones fail. Turning the arms works toward replacement parts keeps every formation working longer at lower cost. Output looks small on paper, and the movement calls it a factory programme for a country that has given up."
 RMN_wd_works_motor:0 "Trucks for Flat Country"
 RMN_wd_works_motor_desc:0 "The motor school points at the plains: a country this flat should move on wheels, and its arms works already turn out trucks. A new assembly hall at the logistics centre would build many more, with engines and axles made at home. The trucks would serve farms and towns as well as the guard, provided the fuel to run them can be found."
 RMN_wd_works_civil:0 "Turn Half the Halls Civil"
 RMN_wd_works_civil_desc:0 "The civil school wants the balance moved. Half the factories make arms for a country at peace with everyone, while shops in the capital import pumps, stoves and bicycles. Converting halls in the marsh district to household goods would fill those shelves. The guard would lose capacity it may want back, and arms workers would need to learn new trades."
 RMN_wd_works_depots:0 "Parts Depots Along the Line"
 RMN_wd_works_depots_desc:0 "Spare parts are only useful where the trucks break down. Depots at the capital centre, the logistics centre and the marsh works, each stocked from the same catalogue, put a replacement within a day of any formation. The catalogue takes a year to agree, because every ministry desk used its own part numbers, and some still insist theirs were better."
 RMN_wd_works_tyre_line:0 "A Tyre and Axle Line"
 RMN_wd_works_tyre_line_desc:0 "Romny grows rubber and imports almost every tyre it fits. A tyre and axle line beside the new truck hall uses home latex and home steel, so a truck built at the logistics centre rolls on parts made in the same district. The line needs foreign moulds and foreign chemists for its first years, and their fees are high."
 RMN_wd_works_household:0 "Stoves, Pumps and Bicycles"
 RMN_wd_works_household_desc:0 "The converted halls start with goods that need little new tooling: cast stoves, hand pumps, bicycle frames and pressure lamps. They sell out in the capital within weeks and reach the empty districts by the new roads. Margins are thin, the import merchants protest to the ministry, and the halls must keep learning faster than their competitors abroad."
 RMN_wd_works_apprentices:0 "Apprentice Benches in Every Works"
 RMN_wd_works_apprentices_desc:0 "Every works keeps a bench of apprentices who learn on real orders under a master for three years, paid a wage from the first week. The scheme costs output, because masters teach instead of making, and some apprentices leave as soon as they qualify. Without it, Romny's works will still be run by men who learned their trade before 1991."
 RMN_wd_works_wagon_shop:0 "Rebuild the Wagon Shops"
 RMN_wd_works_wagon_shop_desc:0 "Romny's works build rail wagons as well as rifles, and its stock of trains is small and old. Rebuilding the wagon shops at the capital centre for steel-bodied wagons with one coupling standard serves every model, whatever the works now make. The shops will sit idle between orders, which the treasury dislikes, and be busy when the line needs them, which the railway likes."
 RMN_wd_res_ledger:0 "Count What the Ground Gives"
 RMN_wd_res_ledger_desc:0 "Romny's resources sit in three districts only: steel ore, bauxite, a little oil and rubber groves in the capital district, District B and the marsh district. The empty districts have none recorded. A full geological and agricultural ledger, district by district, prices every deposit and grove. It shows a country richer in rubber than in almost anything else, and poorer in reliable buyers."
 RMN_wd_res_groves:0 "Replant the Rubber Groves"
 RMN_wd_res_groves_desc:0 "Many rubber trees in the capital district and District B are past their best, tapped too hard for too long by tenants with no reason to replant. A replanting scheme with grove roads, nurseries and a guaranteed price for new latex will cut output for several years before it raises it. The tenants want the guarantee in writing, and so does the treasury."
 RMN_wd_res_sell_raw:0 "Sell Raw from the Capital Quay"
 RMN_wd_res_sell_raw_desc:0 "The trading school says Romny should do what it does best and sell ore, bauxite and latex raw through the capital quay to whoever pays most. The money comes quickly and nobody needs to build new factories. Every price swing abroad becomes a budget crisis at home, though, and the country stays a supplier of other people's industries."
 RMN_wd_res_keep_home:0 "Feed the Home Works First"
 RMN_wd_res_keep_home_desc:0 "The industrial school wants raw materials kept at home under export quotas, so that Romny's own works buy them first and at a fixed price. Factories gain a secure supply and the country gains finished goods to sell. Exporters lose margin and complain to every minister, and the quotas invite smuggling across the long frontier with Yuktobania."
 RMN_wd_res_quay_scales:0 "Public Scales on the Capital Quay"
 RMN_wd_res_quay_scales_desc:0 "Raw cargo is only as valuable as its weight and grade, and cargo at the capital quay has been weighed by the buyers' own clerks. Public scales, a grading office and published prices for each shipment stop the quiet short-weighting that has cost exporters dearly. Buyers threaten to go elsewhere. Few do, because the cargo is good and the alternatives lie farther away."
 RMN_wd_res_smelter:0 "An Alumina Smelter at the Rail Corner"
 RMN_wd_res_smelter_desc:0 "Bauxite from the marsh district and District B leaves the country as rock. A smelter beside the new halts at the rail corner, fed by rail from both deposits, would turn it into alumina and then metal for the truck and wagon shops. It needs a great deal of power and patience, and its first years will run at a loss."
 RMN_wd_res_war_prices:0 "Latex Prices in a Distant War"
 RMN_wd_res_war_prices_desc:0 "In the spring of 1995 war breaks out around Belka, far from Romny's frontiers. Within weeks the price of rubber and aluminium jumps as buyers stock up against shortages. Romny takes no part in the war and wants none. Whether it should sell into the price spike or hold stock for its own works is a question the cabinet must settle this season."
 RMN_wd_res_marsh_pits:0 "Deeper Pits in the Marsh"
 RMN_wd_res_marsh_pits_desc:0 "The marsh district's ore lies under waterlogged ground that the old pits never reached below a few metres. Pumps, timbering and a small school for pit engineers would open the deeper seams. The work is dangerous and slow, the pumps burn fuel the country must buy, and the engineers learn methods that will serve every later mine in Romny."
 RMN_wd_res_synthetic:0 "Latex from the Laboratory"
 RMN_wd_res_synthetic_desc:0 "Natural rubber is Romny's best card, and the chemists in the capital want to know how long it will stay one. Small trials in synthetic latex, run with the tyre makers, teach the country what its competitors might do. Planters fear the research will undercut them. The chemists answer that it is better to learn the threat in a laboratory than to meet it in the market."
 RMN_wd_guard_review:0 "Two Garrisons for Six Districts"
 RMN_wd_guard_review_desc:0 "Romny's territorial guard is four infantry formations of six battalions, each with an engineer company. Two sit at the capital centre and two at the logistics centre in District B. None is stationed in the marsh district or District E, though both face Yuktobania. A review of where the guard sits, and why, is overdue and will embarrass several commanders."
 RMN_wd_guard_mountain_manual:0 "Retire the Mountain Manual"
 RMN_wd_guard_mountain_manual_desc:0 "The guard still trains from a mountain warfare manual, though Romny's highest ground is a railway embankment. A rewritten manual for open plain, ditches, marsh and river lines teaches what soldiers will actually face. The mountain instructors protest that their skills are rare and worth keeping, and a few are kept on to teach climbing to the engineers."
 RMN_wd_guard_marsh_anchor:0 "Anchor the Line on the Marsh"
 RMN_wd_guard_marsh_anchor_desc:0 "The fixed-defence school wants the guard dug in where the ground helps: the marsh district, the one stretch of Romny that is not open plain. Prepared positions and a causeway road behind them would give a small army a place to hold. The plains to either side would be watched rather than defended, and the districts there know it."
 RMN_wd_guard_wheels:0 "Put the Guard on Wheels"
 RMN_wd_guard_wheels_desc:0 "The mobile school points to the depots: Romny holds hundreds of trucks in stock while its infantry walks. Putting every formation on wheels, with drivers trained and fuel allotted, would let two garrisons reach any district in a day. The trucks would wear out faster and the fuel bill would climb, but the plains would stop being a weakness."
 RMN_wd_guard_district_rolls:0 "Reserve Rolls in Every District"
 RMN_wd_guard_district_rolls_desc:0 "Every district keeps a roll of trained reservists who can report to the nearest garrison within three days, with their rifles held at the district office. The rolls bring the empty districts into the guard for the first time. Clerks must be paid, rifles counted and reservists drilled each year, and some district officials resent the extra duty."
 RMN_wd_guard_drill_clubs:0 "Bring the Drill Clubs Under the Guard"
 RMN_wd_guard_drill_clubs_desc:0 "The national movement's Sunday drill clubs train young men with old rifles and no officers. Registering every club with the guard, under guard instructors and guard rules, turns an unofficial militia into a reserve the state commands. The movement's leaders call it theft of their members. Many members are glad of real training and a proper range."
 RMN_wd_guard_junction_company:0 "A Company at the Junction"
 RMN_wd_guard_junction_company_desc:0 "District E touches two neighbours and has never had a soldier stationed in it. A single company in a barracks near the junction road, rotated every six months from the capital garrisons, gives the guard eyes on the frontier corner and the district a reason to believe it belongs to the country. Neighbours will notice the barracks, and the frontier staff must explain it."
 RMN_wd_guard_batteries:0 "Guns Before More Battalions"
 RMN_wd_guard_batteries_desc:0 "The guard's doctrine already favours firepower over numbers, which suits a country that cannot raise many battalions. Buying and training a few modern batteries, with observers at every formation headquarters, multiplies what the infantry can hold. The guns cost more than a battalion, and their crews take two years to train properly."
 RMN_wd_guard_engineers:0 "Engineers for Ditches and Bridges"
 RMN_wd_guard_engineers_desc:0 "Each formation's engineer company spends most of its time on parade. Retraining them for the real terrain, with pontoons, ditching machines and demolition kits, lets the guard cross the marsh streams and the drains of the plains, and deny them to anyone else. The engineers also start building culverts for the district roads, which the ministries gladly accept."
 RMN_wd_guard_map_games:0 "Map Games for the Plains"
 RMN_wd_guard_map_games_desc:0 "The general staff runs a winter of map games on the plains: columns, depots, river lines and the long frontier, played out on tables in the capital. Officers from every formation take turns on both sides. The games expose supply gaps nobody wanted to see. The staff shares the lessons inside the guard and keeps the umpires' notes locked away."
 RMN_wd_air_apron:0 "Twelve on the Capital Field"
 RMN_wd_air_apron_desc:0 "Romny's air arm is twelve fighters on the capital field with four more in reserve, all flown from a single runway beside the quay. It exists to guard the sky over a small country, and it can barely guard the capital. Counting pilots, mechanics, fuel and flying hours shows how thin it is before anyone decides what it is for."
 RMN_wd_air_second_field:0 "A Second Field at the Logistics Centre"
 RMN_wd_air_second_field_desc:0 "The logistics centre in District B already handles freight from the capital line, and its flat ground needs little preparation for a runway. A second field there, with fuel tanks and a dispersal apron, means a single accident or a single storm can no longer ground the whole air arm. The field also brings the fighters nearer the frontier."
 RMN_wd_air_coast_radar:0 "Radar on the Capital Coast"
 RMN_wd_air_coast_radar_desc:0 "The air arm sees only what its pilots see. A radar post on the capital coast, linked by telephone to the field, gives the fighters minutes of warning instead of seconds. The equipment is foreign and its operators must be trained abroad. Once it works, the air arm can stop flying standing patrols that it cannot afford."
 RMN_wd_air_line_patrol:0 "Patrols Along the Line"
 RMN_wd_air_line_patrol_desc:0 "One school wants the fighters flying regular patrols along the Yuktobanian and Kalugan frontiers, watching for strays, smugglers' aircraft and anything the radar misses. The patrols build airmanship and show the flag. They also burn fuel and airframes, and a fighter near a frontier is always one navigation error away from a diplomatic incident."
 RMN_wd_air_capital_cover:0 "Cover the Capital First"
 RMN_wd_air_capital_cover_desc:0 "The other school says twelve fighters cannot guard a long frontier and should not try. They should sit at readiness over the capital, the quay and the fuel silo, the targets that matter most, and fly only when the radar calls them. The pilots fly fewer hours. The outer districts learn that the air arm is not for them."
 RMN_wd_air_junction_radar:0 "A Radar Mast at the Junction"
 RMN_wd_air_junction_radar_desc:0 "Patrols along the frontier need eyes on the ground ahead of them. A radar mast in District E, covering the corner where Romny meets Yuktobania and Kaluga, tells the patrols where to look. Its crew lives far from the capital in a district with no comforts, and the posting quickly becomes the least wanted in the air arm."
 RMN_wd_air_longer_runway:0 "Extend the Field Beside the Quay"
 RMN_wd_air_longer_runway_desc:0 "Keeping every fighter at readiness over the capital means the capital field must handle them all, plus transports and visitors. A longer runway, hardened shelters and a second taxiway let the field launch the whole squadron at once. The quay loses some warehouse ground to the extension, and the merchants who rented it lose their leases."
 RMN_wd_air_mechanics:0 "Mechanics on Long Contracts"
 RMN_wd_air_mechanics_desc:0 "Romny trains good mechanics and then loses them to the freight companies and the truck works, which pay better. Long contracts with housing, a pension and a bonus for every year served keep crews at the field. The air arm's budget strains. Aircraft that fly when called are worth more than a squadron waiting for parts and people."
 RMN_wd_air_club_scholarships:0 "Flying Club Scholarships"
 RMN_wd_air_club_scholarships_desc:0 "The country has a handful of private flying clubs at the capital and the logistics centre. Scholarships that pay a club's fees in exchange for five years of reserve service give the air arm a pipeline of pilots who have already flown solo. Most club members are children of the notables, and the movement complains about privilege in the cockpit."
 RMN_wd_front_walk:0 "Walk the Yuktobanian Frontier"
 RMN_wd_front_walk_desc:0 "Three of Romny's districts face Yuktobania: District B, the marsh district and District E, where Kaluga also meets the line. No railway crosses the frontier, and most of it runs across open plain marked by posts and ditches. Officials who walk its length for the first time return with notes on crossings, farms split by the line and customs huts nobody staffs."
 RMN_wd_front_customs_huts:0 "Staff the Customs Huts"
 RMN_wd_front_customs_huts_desc:0 "The customs huts along the plain are staffed one day in three, if at all. Putting inspectors in every hut, with telephones and a ledger, ends the easy smuggling of tyres, spirits and fuel across the line. Smugglers move to the fields between the huts, and farm families who cross daily for work or kin now need passes to do it."
 RMN_wd_front_good_neighbour:0 "Good Neighbour Letters"
 RMN_wd_front_good_neighbour_desc:0 "One school says Romny's safety lies in friendship with the giant next door: regular letters from Romny's frontier offices, a standing offer to talk, and trade terms that make Romny useful to Yuktobania. Markets may open and the frontier stays calm. Critics warn that a small country that leans too far toward one neighbour soon finds it cannot stand up straight."
 RMN_wd_front_many_customers:0 "No Single Patron"
 RMN_wd_front_many_customers_desc:0 "A second school would spread Romny's trade so thinly that no buyer matters too much. Rubber goes to one market, ore to another and trucks to a third, with the foreign ministry keeping a ledger of every customer's share. Contracts are smaller and harder to win. In return, Romny can refuse anyone without fearing for its budget."
 RMN_wd_front_watch_posts:0 "A Watch Along the Posts"
 RMN_wd_front_watch_posts_desc:0 "The third school trusts neither friendship nor trade. It wants observation towers along the posts, guard patrols in the frontier districts and every crossing logged. Nothing about it is hostile, and the frontier staff insists so in writing. Neighbours will still read a line of towers as a message, and farmers will live with soldiers in their fields."
 RMN_wd_front_junction_desk:0 "A Liaison Desk at District E"
 RMN_wd_front_junction_desk_desc:0 "With a guard company now stationed near the junction, the foreign ministry adds a small liaison desk beside its barracks. Its officials answer every complaint from across the line within a day, whether about strayed cattle, a lost lorry or an aircraft heard at night. Romny proposes nothing and claims nothing there. It simply makes sure someone picks up the telephone."
 RMN_wd_front_cinigrad_news:0 "News from the Cinigrad Convention"
 RMN_wd_front_cinigrad_news_desc:0 "In September 1991 a political convention in Cinigrad hears Yuktobania unveil a new class of submarine. Romny keeps no navy and wants none, yet five of its six districts face the sea and its trade moves by coaster from the capital quay. Fishing skippers, lighthouse keepers and the harbour police form a coast watch that reports anything odd offshore."
 RMN_wd_front_trade_fair:0 "A Buyers Fair at the Logistics Centre"
 RMN_wd_front_trade_fair_desc:0 "Every autumn the logistics centre clears two sheds and invites buyers from any country to inspect trucks, tyres, ore and latex on the spot. Freight, lodging and a customs desk are provided free. The fair is cheap to run and loud to advertise. Whether it brings one large buyer or many small ones depends on which school the cabinet has chosen."
 RMN_wd_front_thaw_bonds:0 "Borrow While the Powers Agree"
 RMN_wd_front_thaw_bonds_desc:0 "News arrives in October 1999 that Osea and Yuktobania will cooperate to convert the Arkbird into a platform clearing debris from satellite orbits. Romny has no part in it. The treasury's interest is narrower: lenders who once priced every Romny bond as frontier risk now quote longer terms. The cabinet borrows while the mood lasts and spends it on the districts."
 RMN_wd_sky_bulletins:0 "Bulletins on the Asteroid"
 RMN_wd_sky_bulletins_desc:0 "Late in 1994 word comes from the International Astronomical Union: the asteroid named Ulysses will pass near the Earth and may strike it. Romny owns no telescope able to follow it. Translating foreign bulletins and reading them on the national radio every week keeps rumour in check, and keeps the asteroid at every supper table, which some ministers think unwise."
 RMN_wd_sky_announcement:0 "An Impact Without a Place"
 RMN_wd_sky_announcement_desc:0 "In April 1996 the FCU President says publicly that Ulysses will hit the Earth and announces plans to counter it. Where the fragments come down is anyone's guess, and Romny cannot work it out alone. The cabinet must plan for an unplaced danger in a country of open plain with little natural cover, five coastal districts and a long, low shoreline."
 RMN_wd_sky_earth_shelters:0 "Earth Shelters in Every Town"
 RMN_wd_sky_earth_shelters_desc:0 "A plain has no caves or cuttings to hide in, so the engineers propose to dig. Earth-covered shelters with timber roofs and concrete doors, one for every street in the capital and the district towns, would hold families for days. Digging them employs thousands and costs a fortune. Nobody knows whether they would stand up to what is coming."
 RMN_wd_sky_inland_dispersal:0 "Move the Coast to the Marsh"
 RMN_wd_sky_inland_dispersal_desc:0 "The marsh district is the only part of Romny that does not touch the sea. Planners who distrust the coast in any disaster propose dispersal instead of shelters: trains and trucks to carry families from the coastal districts to reception camps around the marsh works. The plan costs far less, and depends on warning time, roads and fuel that may not exist."
 RMN_wd_sky_grain:0 "Grain Pits for Two Seasons"
 RMN_wd_sky_grain_desc:0 "Whatever falls, harvests and imports may fail for a season or two. Lined grain pits in every district, filled from the state buying office at harvest price, would feed the country through a bad year. The pits take land and labour. Farmers grumble at the fixed price, and the movement accuses the Administration of hoarding grain for its friends."
 RMN_wd_sky_sirens:0 "One Siren Code for Six Districts"
 RMN_wd_sky_sirens_desc:0 "Each district sounds its sirens differently, and some have none. A single national code, with sirens on every works roof and a telephone tree from the capital radio, would tell every household the same thing at the same moment. Installing it is cheap. Teaching six districts to obey it, rather than climb on roofs to look, is the hard part."
 RMN_wd_sky_reserve_wards:0 "Reserve Wards in the School Halls"
 RMN_wd_sky_reserve_wards_desc:0 "The capital hospital has fewer beds than a single bad week would need. Reserve wards in school halls and works canteens, with stored beds, dressings and a roster of retired nurses, can open within a day of the sirens. Doctors call the plan improvised, which it is. It is still better than turning the injured away at the gate."
 RMN_wd_sky_roche_night:0 "All Night by the Radio"
 RMN_wd_sky_roche_night_desc:0 "On 8 July 1999 Ulysses passes through Earth's Roche limit. In Romny the sirens are tested at dusk, the shelters or reception camps are opened, and the radio stays on all night with foreign bulletins read in turn. Nobody in the cabinet knows what the coming weeks hold for the country. They know only that every plan is being tested at once."
 RMN_wd_sky_tally:0 "Count the Cost of Preparing"
 RMN_wd_sky_tally_desc:0 "When the skies clear, the ministries count what the impact years cost Romny in money, harvests, shelters dug and trust spent. Whatever the fragments did elsewhere, every district has paid for preparation. A frank tally tells the next government which measures earned their price. It also shows which ones were bought to calm a frightened public, and the press will want both lists."
 RMN_wd_dec_audit:0 "Ten Years of Accounts"
 RMN_wd_dec_audit_desc:0 "A decade after the winter canvass, the treasury and the statistical office prepare one volume comparing Romny in 1991 with Romny in 2000: roads, works, garrisons, harvests, debts and votes, if any were cast. It is the first full account of the country anyone has attempted. Every camp will quote it, and the government must first decide who sees it."
 RMN_wd_dec_republic:0 "A Second Charter Session"
 RMN_wd_dec_republic_desc:0 "The republic's charter promised a review session after ten years, and the chamber now holds it. Movement and non-party deputies arrive with amendments to the entrenched articles. Most fail, a few pass, and the court approves the method. The session proves the charter can change without breaking, and costs a season of legislative business and a great deal of patience."
 RMN_wd_dec_bench:0 "The Bench Reports to the Districts"
 RMN_wd_dec_bench_desc:0 "After a decade in office, the bench of districts tours every district and reads its accounts aloud in public halls, answering questions from anyone who stands up. Movement members stand up often. The tour is exhausting and occasionally rough. It gives a government without elections something close to a mandate, renewed in person, one hall at a time."
 RMN_wd_dec_movement:0 "The Executive Reviews Its Decrees"
 RMN_wd_dec_movement_desc:0 "Ten years of rule by decree have left a shelf of orders that contradict each other. The movement executive appoints a commission to consolidate them into codes, and quietly drops the harshest. The halls call it softening; the ministries call it housekeeping. Lenders and neighbours read the new codes closely, and the non-party half of the country reads them most closely of all."
 RMN_wd_dec_published:0 "The Accounts in Weekly Instalments"
 RMN_wd_dec_published_desc:0 "The district papers licensed under the press law each print the decade volume in weekly instalments, with a page for readers' letters. The letters are angry, specific and occasionally right. Ministries must answer the best of them in print. Officials hate the exercise. The public, for the first time, argues about Romny's choices from the same set of figures."
 RMN_wd_dec_far_war:0 "Freight Rates in a Far War"
 RMN_wd_dec_far_war_desc:0 "In August 2003 the FCU demands that Erusea withdraw from San Salvacion and establishes the ISAF. The war on the Usean continent is far from Romny, but freight insurers raise their rates on every route toward Usean waters, and buyers there delay their payments. Covering the coasters' insurance costs the treasury money. Romny takes no side and says so plainly."
 RMN_wd_dec_district_e_works:0 "A Works Hall for District E"
 RMN_wd_dec_district_e_works_desc:0 "The last empty district to get a factory is District E, at the frontier junction. A works hall beside the junction road, building truck bodies and farm trailers, gives the district wages and the frontier corner a settled town around it. The site is exposed and the planners know it. Leaving District E empty for another decade would cost more."
 RMN_wd_dec_second_programme:0 "Draft the Second Programme"
 RMN_wd_dec_second_programme_desc:0 "With the century turned, the ministries draft a second national programme to run past 2005. It takes the decade volume, the district census and the works sheet and asks one question of every line: did it pay? The drafting committee includes every camp willing to sit, and the arguments are long. The programme that emerges is modest, costed and widely read."
 ac_wd_rmn_tree:0 "Romny: National Programme"
 ac_wd_rmn_tree_desc:0 "The national focus programme of Romny, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 RMN_wd_borrowed_colours:0 "Colours Without a Following"
 RMN_wd_borrowed_colours_desc:0 "The Administration governs under democratic colours that one citizen in a hundred supports."
 RMN_wd_rights_charter:0 "The Entrenched Draft"
 RMN_wd_rights_charter_desc:0 "A charter of rights and courts written before any ballot is opened."
 RMN_wd_notables_bench:0 "The Notables Agreement"
 RMN_wd_notables_bench_desc:0 "District notables, managers and co-operative boards share the seals."
 RMN_wd_movement_pledge:0 "The Movement Pledge"
 RMN_wd_movement_pledge_desc:0 "Half the country is promised a government that matches its numbers."
 RMN_wd_charter_court:0 "Judges of the Charter"
 RMN_wd_charter_court_desc:0 "A court with fixed terms may strike down any law that breaches the charter."
 RMN_wd_rotating_bench:0 "A Bench That Rotates"
 RMN_wd_rotating_bench_desc:0 "One seat in three on the bench is refilled from fresh district lists each spring."
 RMN_wd_labour_columns:0 "Movement Road Columns"
 RMN_wd_labour_columns_desc:0 "Drill clubs turned into labour columns that cut roads across the plains."
 RMN_wd_works_councils:0 "Shop Floor Councils"
 RMN_wd_works_councils_desc:0 "Elected councils in every works with a say over shifts, safety and canteens."
 RMN_wd_district_survey:0 "Stakes on Empty Ground"
 RMN_wd_district_survey_desc:0 "Survey pegs and chains across the three empty districts."
 RMN_wd_planned_towns:0 "Ministry Town Plans"
 RMN_wd_planned_towns_desc:0 "Towns built to one pattern where the survey finds water and soil."
 RMN_wd_homestead_grants:0 "Homestead Titles"
 RMN_wd_homestead_grants_desc:0 "Title to any surveyed plot farmed for five years, with tools on credit."
 RMN_wd_district_boards:0 "Boards from the District Lists"
 RMN_wd_district_boards_desc:0 "Local boards decide where the next well, school and road spur goes."
 RMN_wd_works_inventory:0 "Ten Works on One Sheet"
 RMN_wd_works_inventory_desc:0 "Every factory, order and idle shift listed in one inventory."
 RMN_wd_spares_first:0 "The Replacement Doctrine"
 RMN_wd_spares_first_desc:0 "Arms works turned toward barrels, tyres, springs and radios on the shelf."
 RMN_wd_motor_works:0 "Motor Halls of the Plains"
 RMN_wd_motor_works_desc:0 "Truck assembly at the logistics centre for farms, towns and the guard."
 RMN_wd_civil_halls:0 "Halls Turned Civil"
 RMN_wd_civil_halls_desc:0 "Arms halls in the marsh district retooled for household goods."
 RMN_wd_replacement_depots:0 "One Catalogue of Parts"
 RMN_wd_replacement_depots_desc:0 "Parts depots on the railway, stocked from one agreed catalogue."
 RMN_wd_truck_and_tyre:0 "Home Tyres on Home Trucks"
 RMN_wd_truck_and_tyre_desc:0 "Trucks from the logistics centre roll on home latex and home steel."
 RMN_wd_household_lines:0 "Household Goods Lines"
 RMN_wd_household_lines_desc:0 "Stoves, pumps, bicycles and lamps sold from the converted halls."
 RMN_wd_apprentice_benches:0 "The Three-Year Bench"
 RMN_wd_apprentice_benches_desc:0 "Apprentices paid to learn on real orders beside a master."
 RMN_wd_resource_ledger:0 "The Ground Ledger"
 RMN_wd_resource_ledger_desc:0 "Every deposit and grove priced, district by district."
 RMN_wd_raw_exports:0 "Raw Cargo at the Quay"
 RMN_wd_raw_exports_desc:0 "Ore, bauxite and latex sold raw to whoever pays most."
 RMN_wd_home_stock:0 "Home Works Buy First"
 RMN_wd_home_stock_desc:0 "Export quotas keep raw materials for the works at a fixed price."
 RMN_wd_graded_cargo:0 "Graded and Weighed"
 RMN_wd_graded_cargo_desc:0 "Public scales and published grades for every cargo at the capital quay."
 RMN_wd_war_premium:0 "Wartime Latex Premium"
 RMN_wd_war_premium_desc:0 "Rubber and aluminium sell high while a distant war lasts."
 RMN_wd_auction_season:0 "Auction Season at the Quay"
 RMN_wd_auction_season_desc:0 "The latex crop sold by open auction under the public scales."
 RMN_wd_guard_garrisons:0 "Two Garrisons Only"
 RMN_wd_guard_garrisons_desc:0 "Four formations split between the capital centre and the logistics centre."
 RMN_wd_marsh_anchor:0 "Anchored on the Marsh"
 RMN_wd_marsh_anchor_desc:0 "Prepared positions in the one district the ground itself defends."
 RMN_wd_motor_columns:0 "A Guard on Wheels"
 RMN_wd_motor_columns_desc:0 "Every formation carried by truck, with drivers trained and fuel allotted."
 RMN_wd_district_rolls:0 "District Reserve Rolls"
 RMN_wd_district_rolls_desc:0 "Trained reservists in every district, rifles held at the district office."
 RMN_wd_registered_clubs:0 "Clubs on the Guard Register"
 RMN_wd_registered_clubs_desc:0 "Movement drill clubs trained by guard instructors under guard rules."
 RMN_wd_crossing_drill:0 "Ditch and Stream Drill"
 RMN_wd_crossing_drill_desc:0 "Engineers trained with pontoons and ditching machines for flat wet ground."
 RMN_wd_one_field_wing:0 "The Single Squadron"
 RMN_wd_one_field_wing_desc:0 "Twelve fighters and one runway beside the capital quay."
 RMN_wd_frontier_patrol:0 "The Line Patrol"
 RMN_wd_frontier_patrol_desc:0 "Fighters on regular patrol along the frontier with Yuktobania and Kaluga."
 RMN_wd_capital_umbrella:0 "Umbrella over the Quay"
 RMN_wd_capital_umbrella_desc:0 "Fighters held at readiness over the capital, the quay and the fuel silo."
 RMN_wd_ground_crews:0 "Mechanics Who Stay"
 RMN_wd_ground_crews_desc:0 "Long contracts, housing and a pension for the field crews."
 RMN_wd_frontier_desk:0 "Desk for the Long Line"
 RMN_wd_frontier_desk_desc:0 "One office in the capital follows every post and hut on the frontier."
 RMN_wd_customs_service:0 "Inspectors in Every Hut"
 RMN_wd_customs_service_desc:0 "Customs huts on the plain staffed every day, with telephones and ledgers."
 RMN_wd_good_neighbour:0 "Letters Across the Line"
 RMN_wd_good_neighbour_desc:0 "Regular letters and a standing offer of talks to the large neighbour."
 RMN_wd_many_customers:0 "Customers in Every Direction"
 RMN_wd_many_customers_desc:0 "Trade spread so thinly that no single buyer matters too much."
 RMN_wd_watchers:0 "Towers Along the Posts"
 RMN_wd_watchers_desc:0 "Observation towers and logged crossings along the whole frontier."
 RMN_wd_junction_liaison:0 "Someone at the Telephone"
 RMN_wd_junction_liaison_desc:0 "A liaison desk at District E answers every complaint within a day."
 RMN_wd_coast_watch:0 "Skippers on Coast Watch"
 RMN_wd_coast_watch_desc:0 "Fishing skippers and lighthouse keepers report anything unusual offshore."
 RMN_wd_trade_fair:0 "Fair Season at the Centre"
 RMN_wd_trade_fair_desc:0 "An autumn fair for foreign buyers in the logistics centre sheds."
 RMN_wd_thaw_credit:0 "Bonds at Longer Terms"
 RMN_wd_thaw_credit_desc:0 "Lenders quote longer terms while the great powers cooperate."
 RMN_wd_crossing_sweep:0 "Crossings Swept at Night"
 RMN_wd_crossing_sweep_desc:0 "A week of inspectors and patrols on every crossing after dark."
 RMN_wd_sky_watch:0 "Weekly Asteroid Bulletins"
 RMN_wd_sky_watch_desc:0 "Foreign bulletins on Ulysses translated and read on the radio each week."
 RMN_wd_earth_shelters:0 "Shelters Under the Streets"
 RMN_wd_earth_shelters_desc:0 "Earth-covered shelters dug for every street in the towns."
 RMN_wd_marsh_dispersal:0 "Reception Camps Inland"
 RMN_wd_marsh_dispersal_desc:0 "Trains, trucks and camps to move coastal families to the marsh district."
 RMN_wd_grain_pits:0 "Two Seasons Underground"
 RMN_wd_grain_pits_desc:0 "Lined grain pits in every district, filled at harvest price."
 RMN_wd_siren_code:0 "The National Siren Code"
 RMN_wd_siren_code_desc:0 "One siren code and one telephone tree for all six districts."
 RMN_wd_reserve_wards:0 "Wards in the School Halls"
 RMN_wd_reserve_wards_desc:0 "Stored beds and a roster of retired nurses ready to open in a day."
 RMN_wd_decade_accounts:0 "The Decade Volume"
 RMN_wd_decade_accounts_desc:0 "One account of the country in 1991 and in 2000, district by district."
 RMN_wd_open_accounts:0 "Accounts in the Papers"
 RMN_wd_open_accounts_desc:0 "The decade volume printed in weekly instalments with readers answered."
 RMN_wd_second_session:0 "The Review Session"
 RMN_wd_second_session_desc:0 "The chamber reviews the entrenched articles after ten years."
 RMN_wd_bench_tour:0 "The Bench on Tour"
 RMN_wd_bench_tour_desc:0 "The bench reads its accounts aloud in every district hall."
 RMN_wd_decree_codes:0 "Decrees into Codes"
 RMN_wd_decree_codes_desc:0 "A decade of decrees consolidated into codes, the harshest quietly dropped."
 RMN_wd_far_war_freight:0 "Insured Against a Far War"
 RMN_wd_far_war_freight_desc:0 "State cover for coasters and cargo on routes toward a distant war."
 RMN_wd_second_programme:0 "The Second Programme"
 RMN_wd_second_programme_desc:0 "A costed national programme to run past 2005."
 ac_wd_rmn.1.t:0 "The Canvass Returns"
 ac_wd_rmn.1.d:0 "The canvassers come back from the six districts in the first weeks of the year with notebooks, tally sheets and sore feet. Their count is simple to state and hard to read aloud. Half of the country's adults say they follow the national movement. Nearly as many want government by non-party notables and administrators. One in a hundred backs the democratic colours under which the National Administration governs, and another one in a hundred the labour left.\n\nThe Administration has run Romny with its election calendar shut. It has kept the works open, the guard paid and the capital quay busy, but it has not built a following of any size. The national movement fills halls beside the arms works and the logistics centre, while the notables run the co-operatives, the district offices and most of the trade without belonging to any party at all.\n\nNeither camp is a majority on its own, and neither will accept the other's government willingly. Before any minister proposes what Romny should become, the cabinet must decide what to do with the count itself. Printed in full, it tells both camps exactly how strong they are. Filed with the cabinet, it guides the Administration for a season and leaks within the year.\n\nProvisional gameplay."
 ac_wd_rmn.1.a:0 "Print every tally sheet."
 ac_wd_rmn.1.b:0 "File the count with the cabinet."
 ac_wd_rmn.2.t:0 "A Rally at the Logistics Centre"
 ac_wd_rmn.2.d:0 "On a Sunday in spring the national movement fills the yard of the logistics centre with marchers from every hall in the country. They arrive by truck, by train and on foot, carrying banners for work, order and the nation. Speakers stand on a flatbed wagon and demand that the Administration hand the seals to the half of Romny that, in their words, actually believes in something.\n\nThe officials sent to watch from the back rows report a crowd that is disciplined, sober and young. Many marchers are arms workers; many more are farm sons from districts with no road and no prospects. The drill clubs keep order with whistles. The speeches attack the notables as a club of managers and the Administration as a government borrowed from nobody.\n\nThe rally breaks up peacefully at dusk, and a written list of demands reaches the cabinet the next morning. Ministers must decide how the state answers. It can receive the movement's delegation in public, as one camp among others, or decline to meet it and let the papers reply. A third voice in the cabinet wants the drill clubs asked to register with the guard. Every hall will know the answer by Friday.\n\nProvisional gameplay."
 ac_wd_rmn.2.a:0 "Receive the delegation in public."
 ac_wd_rmn.2.b:0 "Decline, and let the papers answer."
 ac_wd_rmn.2.c:0 "Ask the drill clubs to register with the guard."
 ac_wd_rmn.3.t:0 "Pegs Across Empty Ground"
 ac_wd_rmn.3.d:0 "The survey crews return from the three empty districts with chains, pegs, soil samples and a shared sense of disbelief. The registers say each district holds about as many people as the capital district. On the ground the crews found scattered farms, fishing hamlets, cart tracks and almost nothing a ministry would call a town. No factory, paved road or recorded mineral lies in any of them.\n\nThe rail-corner district is crossed by the capital line at one corner and served by none of it. District E, at the frontier junction, meets Yuktobania and Kaluga across open plain and turns to mud every spring. District F runs along the coast for a long way with no landing deeper than a fishing slip. All three are flat, mostly dry and fertile in patches, and all three have been governed by letter.\n\nThe crews recommend roads before anything else, and two settlement schools are already quarrelling over what should follow. Before choosing, the cabinet must decide how far it trusts the registers. Their population figures decide grants, reserve rolls and school budgets. If they are wrong, every plan built on them is wrong as well, and the empty districts will be planned for people who may not be there.\n\nProvisional gameplay."
 ac_wd_rmn.3.a:0 "Recount the three districts first."
 ac_wd_rmn.3.b:0 "Plan on the registers as they stand."
 ac_wd_rmn_3_b:0 "Plan on the registers as they stand."
 ac_wd_rmn.4.t:0 "The Works Sheet Is Read"
 ac_wd_rmn.4.d:0 "The inventory team lays one long sheet across the cabinet table. Ten works are listed on it, five making arms and five making everything else. The arms works in the capital district, District B and the marsh district build rifles, trucks, rail wagons and support equipment for four guard formations. Each has its own ministry desk, its own suppliers and its own idea of what a full order book looks like.\n\nThe sheet shows idle shifts in every arms works between orders, and shortages in every civil works during them. Trucks leave the line faster than the guard has drivers to use them, and hundreds sit in the depots. Rail wagons are built to three different coupling standards. The civil works, meanwhile, import parts the arms works could make in an afternoon if anyone asked them.\n\nThree schools are already circulating memoranda: spares and sustainment, motor works for the plains, or a shift of half the halls to civil goods. The works managers want the sheet kept confidential until a model is chosen. The treasury wants it put in front of the movement and the notables, who both claim to speak for the workers on those idle shifts.\n\nProvisional gameplay."
 ac_wd_rmn.4.a:0 "Show the sheet to both camps."
 ac_wd_rmn_4_a:0 "Show the sheet to both camps."
 ac_wd_rmn.4.b:0 "Keep it with the managers."
 ac_wd_rmn.5.t:0 "Latex, Bauxite and Rock"
 ac_wd_rmn.5.d:0 "The ledger of Romny's resources arrives in two volumes, one geological and one agricultural. Steel ore lies in the capital district, District B and the marsh district in roughly equal measure. Bauxite follows the same three districts. There is a little oil and, more unusually for a country this size, a working crop of rubber in groves tapped by tenants who rarely see a written contract.\n\nThe empty districts have nothing recorded at all, which the geologists suspect means nobody has looked. Most of what is mined or tapped leaves through the capital quay as raw cargo, weighed by the buyers' own clerks and priced in foreign money. The works at home buy imported steel shapes, and tyres made from latex that may well have left Romny the season before.\n\nThe cabinet must decide what the ledger is for. The trading school wants it printed for foreign buyers as a catalogue. The industrial school wants it kept as a planning document for quotas and home works. The planters want to know whether either school intends to replant the groves, and the miners want pumps before they hear any more promises.\n\nProvisional gameplay."
 ac_wd_rmn.5.a:0 "Print it as a catalogue for buyers."
 ac_wd_rmn.5.b:0 "Keep it as a planning document."
 ac_wd_rmn_5_b:0 "Keep it as a planning document."
 ac_wd_rmn.6.t:0 "Where the Guard Sleeps"
 ac_wd_rmn.6.d:0 "The guard's own review is shorter than the cabinet expected and blunter than the commanders wanted. Four formations of six battalions, each with an engineer company, are split between the capital centre and the logistics centre in District B. They have rifles, support equipment and hundreds of trucks in the depots. They have no posting in the marsh district or District E, the two other districts that face Yuktobania.\n\nRomny's ground offers little to a defender. The capital district and four of the others are open plain, cut by drains and slow streams. Only the marsh district breaks the pattern, with ground soft enough to stop a column. The guard's training manual, meanwhile, was written for mountain warfare, and its instructors still teach rope work on the drill ground beside the quay.\n\nNobody in the review describes any neighbour as a threat. It simply notes that a guard sitting in two garrisons can protect the capital and the logistics centre, and nothing else. One school of officers wants to dig in on the marsh; another wants the whole guard on wheels. First, the commanders must decide how much of the review leaves their offices.\n\nProvisional gameplay."
 ac_wd_rmn.6.a:0 "Brief the cabinet in full."
 ac_wd_rmn.6.b:0 "Keep the review inside the guard."
 ac_wd_rmn.7.t:0 "The Air Arm Is Counted"
 ac_wd_rmn.7.d:0 "The air arm's count fits on a single page. Twelve fighters stand on the capital field beside the quay, with four more airframes in reserve and a fuel silo that serves the field, the works and the guard's trucks alike. There is one runway, one control hut and one telephone line to the ministry. On a clear day the whole air arm can be seen from the end of the runway.\n\nThe pilots are well trained and few. The mechanics are better trained and fewer, because the freight companies pay them more. Flying hours are rationed by fuel, and fuel is rationed by the treasury. The fighters can reach the frontier with Yuktobania and Kaluga in minutes, but nobody on the ground would see them coming or going, because Romny has no radar at all.\n\nTwo schools argue about what the air arm is for. One wants it patrolling the frontier, where it can learn and be seen. The other wants it held over the capital, where everything valuable sits. Before either wins, the commanders want more money, and the treasury wants to know what the money would buy that twelve fighters cannot already do.\n\nProvisional gameplay."
 ac_wd_rmn.7.a:0 "Fund more flying hours."
 ac_wd_rmn.7.b:0 "Hold the budget and train on the ground."
 ac_wd_rmn_7_b:0 "Hold the budget and train on the ground."
 ac_wd_rmn.8.t:0 "The Line on the Plain"
 ac_wd_rmn.8.d:0 "The officials who walk the frontier come back with a long report. Three districts face Yuktobania: District B with its logistics centre, the marsh district with its arms works, and District E, where Kaluga also meets the line. The frontier runs mostly across open plain, marked by stone posts, ditches and the occasional customs hut. No railway crosses it, and the roads that do are cart tracks.\n\nThe report describes farms split by the line, families with relatives on both sides, smugglers who move tyres and spirits at night, and customs huts staffed one day in three. Nothing in it suggests hostility from anyone. It does suggest that Romny has never decided how to live beside a neighbour many times its size, and that each district office has improvised its own answer.\n\nThree schools are already pressing the cabinet: friendship and trade with Yuktobania written into letters, trade spread so widely that no buyer matters too much, or watchtowers and patrols along the posts. Before any of them is heard, the cabinet must decide whether the report goes back to the districts that live on the line, or stays in the capital with the people who will choose for them.\n\nProvisional gameplay."
 ac_wd_rmn.8.a:0 "Send the report to the frontier districts."
 ac_wd_rmn.8.b:0 "Keep it in the capital."
 ac_wd_rmn.9.t:0 "The Plain Has No Caves"
 ac_wd_rmn.9.d:0 "The radio carries the FCU President's announcement in the afternoon, and by evening every district office has a queue. Ulysses will strike the Earth. Nobody can say where its fragments will fall, and Romny has no observatory, no satellite and no partner who can tell it more than the bulletins already say. The cabinet meets at night in the capital and the lights stay on until dawn.\n\nThe country's geography offers little comfort. Five of its six districts touch the sea along a low coast, and all but the marsh district are open plain with no hills, caves or cuttings to hide in. Engineers propose to dig shelters under every street. Planners propose to move families inland to the marsh district instead. Both plans cost more than the works budget, and neither can be finished quickly.\n\nThe public mood swings between panic and a stubborn refusal to believe it. Grain disappears from the shops, prayer halls fill, and the movement's halls hold meetings about order and duty that draw far beyond their usual members. The cabinet must decide how to speak to the country tonight, before either camp speaks for it.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1996 / 04.20; the response in Romny is gameplay."
 ac_wd_rmn.9.a:0 "Speak plainly and announce the plans."
 ac_wd_rmn_9_a:0 "Speak plainly and announce the plans."
 ac_wd_rmn.9.b:0 "Promise calm and plan quietly."
 ac_wd_rmn.10.t:0 "The Volume on the Table"
 ac_wd_rmn.10.d:0 "The first full account of the country since 1991 runs to six hundred pages and weighs as much as a brick. It compares Romny at the start of the decade with Romny now, district by district: kilometres of road, works with a roof, guard posts, harvests, debts, schools and the camp that holds the seals. Its authors were drawn from the treasury, the statistical office and the district offices.\n\nIts findings flatter nobody completely. The empty districts are less empty, and in places still empty. The works are busier, but the arms halls still swing between idle shifts and rush orders. The frontier is calm and the guard better placed than it was. The camp that governs has its achievements, and the camps that do not have their grievances printed on the same pages.\n\nThe cabinet must decide who reads it first. Sent to the district offices, it will be argued over in every town hall before ministers have finished their own copies. Sent to the leaders of the camps, it will be argued over in private and quoted selectively in public. The figures will be the same either way; the argument that follows will not.\n\nProvisional gameplay."
 ac_wd_rmn.10.a:0 "Send it to the district offices first."
 ac_wd_rmn.10.b:0 "Send it to the camp leaders first."
 ac_wd_rmn.11.t:0 "Letters to the Accounts"
 ac_wd_rmn.11.d:0 "A month after the volume reaches the district offices, the replies begin to arrive in sacks. Farmers in the rail-corner district dispute the harvest tables. Works councils in the marsh district send corrected shift counts. A schoolteacher in District F writes forty pages on the children who walk an hour to class, with a map drawn by her pupils pinned to the back.\n\nNot every letter is useful, and some are simply angry. The movement halls send form letters by the hundred, each with the same three complaints. Notables send polite notes defending the figures their own offices supplied. Yet the statistical office finds dozens of genuine errors and several hamlets missing from the registers, and admits the volume was wrong in ways the capital could never have seen.\n\nThe cabinet must decide what to do with the corrections. A second, corrected edition would take another year and concede that the first was flawed. A supplement listing the errors could be printed in weeks, but would bury the best letters in small type. Either way, the people who wrote in will be watching to see whether anyone in the capital read them.\n\nProvisional gameplay."
 ac_wd_rmn.11.a:0 "Print a corrected edition."
 ac_wd_rmn.11.b:0 "Print a supplement of errors."
 RMN_wd_constituent_cabinet_office:0 "Cabinet Under the Entrenched Charter"
 RMN_wd_constituent_cabinet_office_desc:0 "A cabinet answerable to the chamber elected under the entrenched charter, governing collectively and bound by the judgments of the charter court. Provisional gameplay office with no named holder."
 RMN_wd_district_bench_office:0 "Bench of the Six Districts"
 RMN_wd_district_bench_office_desc:0 "A governing bench of notables drawn from the published district lists, deciding by majority with no parties and no national campaign. Provisional gameplay office with no named holder."
 RMN_wd_movement_executive_office:0 "Executive Committee of the National Movement"
 RMN_wd_movement_executive_office_desc:0 "An executive committee of the national movement governing by decree, with the movement halls serving as its offices. Provisional gameplay office with no named holder."
 ac_wd_rmn_decisions:0 "Romny: National Measures"
 ac_wd_rmn_decisions_desc:0 "Measures from the national programme of Romny. Provisional gameplay unless a source ledger row says otherwise."
 RMN_wd_district_road_season_decision:0 "A Dry Season of Road Gangs"
 RMN_wd_district_road_season_decision_desc:0 "Send the road gangs back to the rail-corner district for one dry season; adds a road level there once."
 RMN_wd_latex_auction_decision:0 "Hold the Latex Auction at the Quay"
 RMN_wd_latex_auction_decision_desc:0 "Auction the season of latex at the capital quay in open bidding; it can be held once a year."
 RMN_wd_plains_manoeuvres_decision:0 "Call Autumn Manoeuvres on the Plains"
 RMN_wd_plains_manoeuvres_decision_desc:0 "Exercise both garrisons across the open districts with the engineers and the reserve rolls; it can be repeated each year."
 RMN_wd_crossing_sweep_decision:0 "Order a Night Sweep of the Crossings"
 RMN_wd_crossing_sweep_decision_desc:0 "Put inspectors and guard patrols on every frontier crossing for a week of nights; it can be repeated each half year."
 RMN_wd_siren_test_decision:0 "Sound the Noon Siren Test"
 RMN_wd_siren_test_decision_desc:0 "Test every siren and telephone tree in the six districts at the same minute; it can be repeated within the year."
 RMN_wd_canvass_again_decision:0 "Send the Canvassers Out Again"
 RMN_wd_canvass_again_decision_desc:0 "Repeat the winter canvass now that the district lists are public, to see how the camps have moved; once only."
