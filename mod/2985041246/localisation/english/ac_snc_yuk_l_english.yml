 ac_snc_yuk_message_12.t:0 "Two Orders for One Window: The Hearing"
 ac_snc_yuk_message_12.d:0 "The civilian receiver has brought the order that told him his window was confirmed. The naval liaison has brought an equally confident instruction. The port secretary places them together without deciding which uniform should speak first. 'Somebody amended a schedule neither of you received,' she says. They can make the explanation public or retain a signed professional account, but both versions must keep the delayed claimant in view. There is no foreign delegation whose approval can resolve this particular collision. The government must decide how its own receiving offices will answer before it offers a wider arrangement to anyone else."
