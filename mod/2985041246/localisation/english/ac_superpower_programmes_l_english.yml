 ac_snp.47.t:0 "Authority That Can Receive a Question"
 ac_snp.47.d:0 "The clerk brings the original instruction to the final exercise review. Its missing approval has not been quietly added to the old copy. The completed period records how the receiving office asked its question and which authority was required to answer. That procedure gives the standing mandate a practical limit, whether the government chose public verification or protected delegation. It predicts no future conflict and grants no permanent emergency powers. The liaison asks that the next exercise retain the same right to stop at an unanswered line. The committee agrees that the record would be less useful if its final page contained only success.\n\n[OSE_snp_crisis_authority_response_context]\n[OSE_snp_crisis_authority_period_context]\n[OSE_snp_crisis_authority_policy_context]"
 ac_snp.47.a:0 "File the assessment with its unresolved questions."
 ac_snp.47.a_effect_tt:0 "Retain the completed national service record and its prior choices. This acknowledgement authorizes no additional funded period."
 YUK_snp_allocation_policy_context_1:0 "The standing policy is civil receiving authority. Its continuing opportunity cost remains in the national schedule."
 YUK_snp_allocation_policy_context_2:0 "The standing policy is command allocation reserve. Its continuing opportunity cost remains in the national schedule."
 ac_snp.18.t:0 "The Messenger Returns with the Docket"
 ac_snp.18.d:0 "A district messenger returns an allocation docket because the receiving office cannot release the staff listed on it. The command representative recognizes the reservation but has a second claim against the same hours. The civil administrator asks which office should explain the delay to the people waiting for ordinary services. A public receiving route would reserve more discretion for those civil offices. A protected command route would concentrate responsibility for the support commitment and require the delay to be recorded there. Neither creates additional staff. The messenger waits while the secretariat decides who will receive the next unanswered request, and which share of the finite allocation that answer must use.\n\n[YUK_snp_allocation_policy_context]\n[ac_snp_yuk_intervention_context]\n[ac_snp_yuk_command_context]"
 ac_snp.18.a:0 "Give civil receiving offices the larger share of discretion."
 ac_snp.18.a_effect_tt:0 "Move up to five existing allocation points toward civil receiving offices, protecting active reservations. The two shares still total one hundred."
 ac_snp.18.b:0 "Reserve the command share and identify who answers for displaced work."
 ac_snp.18.b_effect_tt:0 "Move up to five existing allocation points toward command support, protecting active reservations. The two shares still total one hundred."
