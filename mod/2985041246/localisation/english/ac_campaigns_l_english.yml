 ac_camp.13.t:0 "The first delivery"
 ac_camp.13.desc:0 "The truck arrived after the porter had stopped looking for it. He was carrying the baker's stool back into the waiting room when the engine sounded beyond the corner. For an instant nobody moved. Then the nurse was outside, reading the labels before the driver had finished telling her which boxes had been opened.\n\nThere was less than the stockbook had requested. There was also a carton the depot had added because someone there had recognized the clinic's name. The pharmacist put that carton aside until she could discover whether it contained what the label promised. Experience had made gratitude a careful procedure.\n\nThe driver wanted a receipt. The administrator wrote one, made a copy and asked whether he had been delayed. The driver looked toward the street before answering. He described the road, the search and the people he had spoken to. The administrator recorded the delays separately from the permission. A successful arrival did not make either of them disappear.\n\nBy the window, the woman waiting for news of her brother asked whether there had been a letter. The driver said there had been several papers. He did not know whether any of them was the paper she meant. She thanked him for looking, although he had not said that he had looked.\n\nInside, the nurse crossed two items off the list of substitutes. She left the opening hours where they were. The clinic would open tomorrow with a little more to offer, and with the same people bringing the questions the medicines could not answer."
 ac_camp.13.a:0 "Keep this account."
 ac_camp.13.z:0 "Close this old message."
