 ac_camp.16.t:0 "The account of an exception"
 ac_camp.16.desc:0 "The officer's replacement arrived with a cleaner map and a complete set of district instructions. They spent the morning comparing the two. Near midday, the departing officer took the clinic file out of the transfer box and placed it separately on the desk.\n\n\"That one needs explaining.\"\n\nHis replacement opened it. The papers contained the route as it had been requested, the permissions that had been issued, the questions that had been retained, and the outcome entered when the operation closed. It was a less convenient record than the summary headquarters had asked for.\n\nThe younger man read the search reports twice. He wanted to know which instructions had been effective. The officer found himself answering with the names of people rather than the numbers of orders. A sergeant who had telephoned before holding a vehicle. An administrator who had returned with the same worn paper. A nurse who had refused to describe an empty shelf as a temporary inconvenience.\n\n\"And now?\"\n\nThe officer looked at the cleaned-up map. A change of staff could make a functioning exception disappear more efficiently than a deliberate refusal. It could also reopen a restriction that everyone had begun to treat as unavoidable.\n\nHe wrote the receiving contact on the cover and left the original authorization inside. His replacement would have his own choices to make. At least those choices would not begin with the comforting assumption that the cross on the map represented a clinic whose doors opened by themselves."
 ac_camp.16.a:0 "Keep this account."
 ac_camp.16.z:0 "Close this old message."
