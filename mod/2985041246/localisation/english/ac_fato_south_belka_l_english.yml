 ac_fsb_sbk_civil_instruction:0 "Instruction within the Existing Service"
 ac_fsb_sbk_civil_instruction_desc:0 "The administration can improve instruction for personnel already assigned to it. Fund a bounded course and accept its political cost. This is organisation and maintenance, with no instant recruitable population or new formation grant."
 SBK_fsb_civil_instruction:0 "Instruction within the Existing Service"
 SBK_fsb_civil_instruction_desc:0 "Unlock a paid service-instruction interval using existing support equipment.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Consume actual stock: 10 support equipment. Benefit lasts 120 days. New authorisations have a 180-day cooldown. "
