 ac_camp.61.t:0 "The distance below the surface"
 ac_camp.61.desc:0 "The receiving officer read the operational return in a compartment too narrow for the second chair. The man delivering it remained standing, one shoulder turned toward the door so that someone carrying equipment could still pass.\n\nThe maritime denial preparations had been completed. That was the sentence intended for the command account. The attached pages contained the part that interested the officer: communications limits, withdrawal instructions, and the assumptions made by people who would not be present when a crew discovered that an assumption had failed.\n\nHe asked which instructions had been confirmed independently. The answer referred him to a message whose author was several offices away. He requested the original and watched the messenger decide whether that was an accusation.\n\nThere were many ways to be brave in a vessel that disappeared beneath the sea. Asking for an inconvenient confirmation was less visible than the others and could leave a longer mark on a career. The officer signed the completed work, retained its limitations, and refused to turn the difference between a credible plan and an inevitable success into a question of national loyalty.\n\nAbove them, the war would be described through large distances and dramatic names. Here the distance between the last clear instruction and the next uncertain reply could be measured by the length of a compartment.\n\nThe messenger took the signed copy away. The receiving officer kept the original on the desk until the end of the watch, where anyone asking for an assurance would have to see the conditions attached to it."
 ac_camp.61.a:0 "Keep this account."
 ac_camp.61.z:0 "Close this old message."
