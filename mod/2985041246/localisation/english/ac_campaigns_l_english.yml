 ac_camp.2003.t:0 "A bounded offer from North Point"
 ac_camp.2003.desc:0 "The receiving request names a headquarters, but the island's return names beds, hangars and working shifts. North Point has prepared a bounded hosting commitment. Accepting it records present allied consent; it does not annex the island's responsibilities into a command chart. The receiving officer asks whether the local authority's limits have been circulated. The clerk says they are attached to the original. Nobody in the room has read the attachment yet. Before the answer goes back, somebody will have to decide whether an inconvenient condition is part of an offer or an obstacle to be removed from it."
 ac_camp.2003.a:0 "Accept this defined commitment."
 ac_camp.2003.b:0 "Decline the offer."
 ac_camp.2003.z:0 "Close this old message."
