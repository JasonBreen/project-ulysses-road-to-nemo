l_english:
 ac_release_AWW_repair_network:0 "Restore owned domestic connections"
 ac_release_AWW_repair_network_desc:0 "Spend 50 political power and 0.02b (20 FU in legacy; political cost only with fiscal rules disabled) to add missing level 1 land connections after 90 days, once. Requires an exact documented release footprint and current control of every route province. Existing rail levels and receiving ports are preserved. No link crosses water; detached components rely on their existing ports and convoys. Loss of territory or control interrupts the project without refund. Unknown release shapes require normal manual construction."
 ac_release_AWW_cancel_network:0 "Cancel domestic connection work"
 ac_release_AWW_cancel_network_desc:0 "Stop this funded project without a refund; a 30-day cooldown applies."
