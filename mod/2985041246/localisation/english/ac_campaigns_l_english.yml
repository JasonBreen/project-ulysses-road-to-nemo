 ac_camp.4.t:0 "The name in the margin"
 ac_camp.4.desc:0 "The pharmacist recognized the handwriting before she read the name. It belonged to a woman who had once corrected every spelling error in the municipal circular, including the mayor's. Beside her request for information was the careful addition: My brother has not returned.\n\nThe administrator could remember the brother's face more readily than his address. A delivery driver, usually cheerful, with a habit of leaving his cap on the counter while he searched for a receipt. He might have been delayed, detained, injured, or persuaded that a different road offered a better chance of getting home. None of those possibilities could be entered in the column marked Current location.\n\nThe new medical passage had acquired its own list of questions. Who would drive? Who would inspect? Which names could be shown? The pharmacist had already been asked whether the vehicle might carry a message. She had answered that a message weighed very little, and had regretted the answer as soon as she saw the relief in the woman's face.\n\nNow the paper lay between them. Adding a missing person's inquiry would turn the route into something more complicated than the garrison had been asked to authorize. Refusing it would mean explaining, in the language of a functioning administration, why a family should wait without asking.\n\nThe pharmacist folded the letter along its existing crease. The name disappeared inside it. She could keep a private copy and pursue the inquiry separately, or add the request to the official medical file, where somebody with access to the occupation records might finally read it."
 ac_camp.4.a:0 "Keep a private inquiry beside the medical file."
 ac_camp.4.b:0 "Submit the name through the official channel."
 ac_camp.4.z:0 "Close this old message."
