 ac_release_SBK_develop_civilian:0 "Develop a civilian workshop"
 ac_release_SBK_develop_civilian_desc:0 "Fund one additional civilian factory in the current controlled core capital. Costs 100 political power and 0.02b in full economy mode or 20 FU in legacy mode; fiscal-disabled campaigns pay the political cost. Takes 90 days. One successful project of each type per country. Loss of control, annexation, capitulation or lost slots can interrupt it; spent funds are not refunded. No cores, population, deposits or financial balances are granted."
 ac_release_SBK_cancel_civilian:0 "Cancel develop a civilian workshop"
 ac_release_SBK_cancel_civilian_desc:0 "Stop this funded project. Costs already spent are not refunded. A 30-day cooldown applies before another development project."
