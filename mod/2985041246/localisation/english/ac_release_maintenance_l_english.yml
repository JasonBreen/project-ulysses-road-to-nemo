 ac_release_SBK_maintenance:0 "Release administration and maintenance"
 ac_release_SBK_maintenance_desc:0 "Current capacity determines what this government can support. Baseline transport stock is a once-only future-release grant:2 trains,12 trucks and6 convoys; existing saves receive none. Paid projects do not change territorial settlements or cores. Fuel imports, reinforcement deficits and manual production rotation remain visible responsibilities. AWW and non-core treaty governments retain their inherited recruitment and capacity limits."
