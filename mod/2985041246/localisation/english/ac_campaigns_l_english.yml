 ac_camp.70.t:0 "The names left off the return"
 ac_camp.70.desc:0 "The receiving officer had been instructed to expect a movement that would not appear in the ordinary duty return. He read the instruction, checked its authority, and asked for an original copy to be retained somewhere outside the office that had sent it.\n\nWardog's departure had succeeded. The people protecting it had broken with a compromised command in ways that could not be repaired by a later explanation of good intentions. A clerk could be accused of losing a document. A controller could be accused of recognizing the wrong voice. The flight crews would bear accusations large enough to make those smaller choices easy to forget.\n\nIn the receiving room, someone asked which names should be entered. The officer answered that the private list should be complete. An absent name could become an excuse to deny that a person had ever needed protection.\n\nThe aircraft brought work with them. A mechanic wanted a current fault return. Another asked where the next service instruction would come from. The officer had spent the day preparing for a political crisis and found himself relieved by questions that admitted the possibility of an ordinary answer.\n\nHe sent the crews toward the people who could help them and remained beside the private receiving list. Outside, a pilot looked back at the closed door, then followed the others.\n\nThe departure had made a future possible without making it safe. Somewhere in the old command structure, the public return would be written. Here, at least, the people who had arrived would not have to rely on that return to prove that they existed."
