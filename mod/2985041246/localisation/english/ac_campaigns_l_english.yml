 ac_camp_recaptured_battery_desc:0 "A provisional campaign commitment. Its continuing benefit retains its administrative opportunity cost."
 ac_camp.2400.t:0 "What to leave standing"
 ac_camp.2400.desc:0 "The engineering return describes a site that can no longer be treated as an inevitable part of the landscape. The strike preparations are complete. The command must now decide what it intends to leave behind.\n\nDisabling the system preserves a damaged site whose surviving machinery remains a future responsibility. Destroying it follows the historical assault and removes the battery as a strategic threat. Securing it intact requires the site actually to be under San Salvacion's control; no entry in the operation file can supply that possession.\n\nThe engineers have attached separate recommendations. One concerns the immediate air campaign. Another concerns the people who would have to live beside what remains when the campaign is over. The officer receiving the return puts both on the table. Neither can be answered by quietly substituting a different plan after the decision has been made."
 ac_camp.2400.a:0 "Destroy the battery."
 ac_camp.2400.b:0 "Disable it and preserve the site."
 ac_camp.2400.c:0 "Secure the intact engineering site."
 ac_camp.2400.d:0 "The disposition has already been recorded."
 ac_camp.2400.z:0 "Close this old message."
 ac_camp.1.t:0 "The hours on the door"
 ac_camp.1.desc:0 "The porter had taken the opening hours down twice. Both times the nurse put them back before the first patient arrived. The paper was yellowing at the corners. Beneath it, someone had scratched the old municipal crest with a key and then, apparently ashamed of the effort, tried to rub the mark away.\n\nThere were six people waiting when the truck failed to appear. By noon there were twenty-three. The man from the bakery brought his own stool. A woman stood with a sleeping child and refused the chair offered to her, as though sitting down would acknowledge that nobody knew how long this would take.\n\nThe nurse laid the stockbook before the local administrator. She had crossed out the names of medicines already exhausted. What remained looked reassuring until he understood that she had begun listing the substitutes beneath them. The porter listened from the doorway. Outside, an occupation patrol was stopping a cyclist. The soldier held the bicycle while his partner read the man's papers with the unhurried concentration of someone whose own appointment could not be missed.\n\n\"I can ask for a vehicle,\" the administrator said.\n\n\"Then ask.\"\n\nHe looked at the municipal stamp beside the stockbook. Requests bearing that stamp went into an office run by the people who had closed the road. Going there might bring the medicines. It would certainly create a file.\n\nThe nurse turned the book around so he could read the last column. She had titled it Patients expected tomorrow. There were no numbers in it yet."
 ac_camp.1.a:0 "Put the request in writing."
 ac_camp.1.b:0 "Keep the patient list outside their files."
 ac_camp.1.z:0 "Close this old message."
