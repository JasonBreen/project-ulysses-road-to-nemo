 ac_wc_soa.2.d:0 "A requisition reaches a family before its explanation does. Sellen brings the appeal to the table. Halvek warns that an order whose legality cannot be established quickly may fail in the field.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
