 OSE_snc_guarantor_limits_renew:0 "Renew: Read the Unkept Promise"
 OSE_snc_guarantor_limits_renew_desc:0 "Reopen this interrupted review at the present date for ten political power and two institutional-capacity points. It requires a new corresponding funded period; no old work is retroactively credited and the service pays its own usual costs."
 OSE_snc_guarantor_limits_renew_effect_tt:0 "Commit ten political power and two institutional-capacity points to reopen this interrupted review at the present date. A new corresponding funded service must still complete its usual paid work after this request."
 OSE_snc_guarantor_limits_renew_requirements_tt:0 "This national review was interrupted before completion. Its protocol is complete, no replacement request is open, and ten political power plus two institutional-capacity points are available."
 OSE_snc_contact_verification_civil_spirit:0 "Independent contact verification"
 OSE_snc_contact_verification_civil_spirit_desc:0 "A second account is not an instruction to wait forever. It names which observation is missing and who can obtain it, allowing a controller to preserve a warning while challenging an unjustified identification. Give that practice a civil verification mandate. The additional hearings and explanations consume political attention, particularly when a confident response would have been easier to announce. In return, professional work can proceed on a record that distinguishes a confirmed contact from a feared one. The unanswered question remains visible to the person who will eventually authorize a response."
 OSE_snc_contact_verification_civil_spirit_settled:0 "Independent contact verification: Standing Review"
 OSE_snc_contact_verification_civil_spirit_settled_desc:0 "The standing identification procedure now tells the receiving officer what remains unknown. It preserves the selected public account or signed countercheck, together with the cost that made it possible to sustain. A completed national review can support future dialogue even if another government refuses to answer. It does not establish that an incident has occurred, or that a particular aircraft belongs to any country. Its achievement is smaller and more durable: when a warning becomes an instruction, the person expected to obey can find the evidence, the limitation and the name of somebody responsible for both."
 OSE_snc_contact_verification_protected_spirit:0 "Protected response countercheck"
 OSE_snc_contact_verification_protected_spirit_desc:0 "The protected response chain gives an authorized duty officer a clear route through competing reports. It does not make that officer's first interpretation infallible. Require a signed countercheck inside the chain and retain the observation that caused it, even when the eventual instruction must remain restricted. This policy reserves civilian capacity for professional readiness. Its advantage is a dependable receiving responsibility; its cost is work that other offices cannot claim during the protected period. A fast instruction will be judged by the evidence it carried, rather than the number of desks it managed to bypass."
 OSE_snc_contact_verification_protected_spirit_settled:0 "Protected response countercheck: Standing Review"
 OSE_snc_contact_verification_protected_spirit_settled_desc:0 "The standing identification procedure now tells the receiving officer what remains unknown. It preserves the selected public account or signed countercheck, together with the cost that made it possible to sustain. A completed national review can support future dialogue even if another government refuses to answer. It does not establish that an incident has occurred, or that a particular aircraft belongs to any country. Its achievement is smaller and more durable: when a warning becomes an instruction, the person expected to obey can find the evidence, the limitation and the name of somebody responsible for both."
 OSE_snc_contact_verification_public_return_spirit:0 "Open receiving record"
 OSE_snc_contact_verification_public_return_spirit_desc:0 "The public version of the review will contain an unanswered question. A press officer worries that it will become the only sentence anybody remembers. The controller answers that a confident sentence would be less accurate, and considerably easier to misuse later. Publish the record with its limitation. The choice supports civil confidence through an account that can be challenged, while taking continued political work to explain. It does not disclose every professional procedure. It establishes that uncertainty itself is not misconduct, and that an honest warning need not be converted into a certainty before it is allowed to matter."
 OSE_snc_contact_verification_staff_return_spirit:0 "Protected professional return"
 OSE_snc_contact_verification_staff_return_spirit_desc:0 "The duty staff propose a signed internal countercheck, available to the next officer who must use the response chain. They accept that restricted circulation creates a responsibility to preserve the dissenting report rather than merely mentioning that somebody disagreed. Adopt that professional return with its continuing civilian opportunity cost. The resulting record can support a later verified channel, but only because the countercheck was actually exercised and assessed. Neither secrecy nor an urgent tone can stand in for the missing work. The government is keeping a professional answer, not purchasing permission to stop asking questions."
 OSE_snc_contact_verification_brief:0 "Keep the Uncertain Track"
 OSE_snc_contact_verification_brief_desc:0 "The liaison exercise ends with an unidentified contact still marked unidentified. A senior observer calls the result inconclusive. The controller replies that the contact was inconclusive before the exercise began, and nobody acquired the evidence needed to change that. Begin a national review of how uncertainty travels from observation to instruction. Civil aviation, air defence and the receiving offices need a shared way to ask a second question without silently cancelling the first warning. The aim is a dependable account of what was known, not a reassuring diagram in which every track acquires a convenient answer."
 OSE_snc_contact_verification_brief_requirements_tt:0 "From 2006.1.1, an active national administration and the required earlier work are available. The selected policy remains exclusive; conclusions remain available when their real prerequisites finish after the expected calendar."
 OSE_snc_contact_verification_brief_effect_tt:0 "Open the named national continuation from its earned prior settlement."
