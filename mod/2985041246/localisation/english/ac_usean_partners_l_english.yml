 SNS_up_local_repair_compacts_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Staff the Permanent Recovery Record'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_coalition_accounts:0 "Reconcile Coalition Accounts"
