 ac_camp.102.t:0 "An answer worth keeping"
 ac_camp.102.desc:0 "A verified channel is a modest thing to defend in a committee room. It has no launch ceremony and offers little for a photograph. Its value lies in knowing who received a message, who changed its wording, and whether the answer belonged to the government whose seal it carried. Public accountability exposes the channel to political scrutiny. A protected investigation shields its sources while increasing the burden on the people entrusted to judge them. Neither arrangement supplies the other government's consent. That answer must still arrive from the other side of the ocean."
 ac_camp.102.a:0 "Circulate a public receiving account."
 ac_camp.102.b:0 "Keep a signed professional return."
