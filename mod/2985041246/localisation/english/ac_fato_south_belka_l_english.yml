 ac_fsb_sbk_workshop_round:0 "The Municipal Maintenance Round"
 ac_fsb_sbk_workshop_round_desc:0 "The workshops need predictable parts and a chance to teach the next crew. Fund a temporary maintenance round using current support stock. It remains worthwhile whether the country is independent, supervised or waiting on an unanswered adviser request."
 SBK_fsb_workshop_round:0 "The Municipal Maintenance Round"
 SBK_fsb_workshop_round_desc:0 "Unlock a domestic stock-backed workshop interval available under every alignment.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Consume actual stock: 10 support equipment. Benefit lasts 120 days. New authorisations have a 180-day cooldown. "
