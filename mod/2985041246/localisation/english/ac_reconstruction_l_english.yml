 NPT_rc_mandate_service_1_spirit:0 "Exercise the Mandate Desk"
 NPT_rc_mandate_service_1_spirit_desc:0 "The parliamentary liaison and civil-service duty desk maintains this funded service for ninety days. Test how a foreign request is accepted, limited or refused without promising facilities twice. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 NPT_rc_mandate_service_1:0 "Exercise the Mandate Desk"
 NPT_rc_mandate_service_1_desc:0 "Test how a foreign request is accepted, limited or refused without promising facilities twice.\n\nThe parliamentary liaison and civil-service duty desk must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears above."
 NPT_rc_mandate_service_2_spirit:0 "Inspect the Withdrawal Instructions"
 NPT_rc_mandate_service_2_spirit_desc:0 "The parliamentary inspection committee maintains this funded service for ninety days. Verify that local services can resume ordinary work when an external commitment ends. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
