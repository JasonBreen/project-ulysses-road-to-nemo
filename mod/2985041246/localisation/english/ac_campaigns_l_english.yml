 ac_camp.2900.t:0 "An order both sides can hear"
 ac_camp.2900.desc:0 "The receiving operator kept the original beside the decoded text. There were officers in the room who would once have considered that an insult. Now none of them asked him to put it away.\n\nThe terms had arrived from an authenticated Osean authority after the political rescues and the completed final interception. They proposed a reciprocal cessation in the campaign's own war. The staff had checked the present participants. No wider conflict could be settled by treating this exchange as an instruction to governments that had never agreed to it.\n\nAround the table, the practical questions began. Which orders would be sent first? Who would confirm receipt? What would happen if a unit received only half the exchange? The people asking had spent the war discovering how much damage could fit between an apparently clear instruction and the person expected to obey it.\n\nThe political representative waited until the military objections had been recorded. An agreement could survive an objection that had been heard. It was less likely to survive an assurance written over a question nobody had answered.\n\nOutside, the duty staff were preparing another situation return. They would continue until they received a different order through a channel they could recognize. Hope had reached the building before authority to act on it, and the interval was becoming painful.\n\nThe offer remained open for a limited time. Acceptance would end the qualifying bilateral war only if its conditions still held when the answer was executed. Refusal would be recorded as refusal. Silence would remain silence. The operator placed a blank receiving sheet beside the original and waited for a decision that both countries would have to carry."
 ac_camp.2900.a:0 "Accept the reciprocal ceasefire."
 ac_camp.2900.b:0 "The terms cannot be accepted."
 ac_camp.2900.z:0 "Close this old message."
 OSE_camp_peace_offer:0 "Send the reciprocal ceasefire terms"
 OSE_camp_peace_offer_desc:0 "Requires restored political authority, the completed interception, and an isolated campaign-owned war. Both sides must agree. The offer expires after fourteen days."
 OSE_camp_peace_renew:0 "Renew the ceasefire offer"
 OSE_camp_peace_renew_desc:0 "Prepare a fresh offer after refusal or expiry. Costs the normal programme authorization; spent costs are not refunded."
 ac_camp_clinic_sponsor_cost:0 "Authorize this one receiving operation: FCU pays 25 political power, 2 institutional capacity and the shared programme fee only if San Salvacion starts it. No payment is made by this reply."
