l_english:
 WIE_wd_adm_inventory:0 "Inventory of the Executive Office"
 WIE_wd_adm_inventory_desc:0 "The National Administration governs from Mankovce as a single executive office, with no ballot on the calendar since the vote dated January 1991. Before anyone argues about its future, its own clerks list every power it uses, every decree still in force and every post it fills. The work takes months and embarrasses several ministries."
 WIE_wd_adm_payroll:0 "Print the Payroll of the State"
 WIE_wd_adm_payroll_desc:0 "The inventory showed that nobody outside the office knows how many people the state employs or what they are paid. Printing the payroll of every ministry, district office and state company invites ridicule and a few resignations. It also makes it harder for any later government, whatever its colour, to hide its friends on the books."
 WIE_wd_adm_state_councils:0 "Advisory Councils in Four States"
 WIE_wd_adm_state_councils_desc:0 "Alaoboa, Vakia, Farnlands and South Gangel each receive an advisory council of mayors, employers and union delegates that meets every quarter and may question the state governor in public. The councils have no budget and no veto. They give regional grievances a room other than the street, and they warn the capital of trouble early."
 WIE_wd_adm_chamber:0 "Return to a Chamber of Deputies"
 WIE_wd_adm_chamber_desc:0 "Three Wielvakians in ten already back the democratic camp. Its leaders propose a chamber elected from the four states, a cabinet answerable to it and polling on a fixed date. The Administration would surrender its seals within a year. Officers and lowland industrialists warn that a campaign season would split the country along regional lines."
 WIE_wd_adm_staff:0 "Seals to the General Staff"
 WIE_wd_adm_staff_desc:0 "In a country where eight people in ten tell pollsters they would back a war, the general staff is the most trusted institution in the capital. Its senior officers offer to govern as a council until the frontiers are settled, with ministries reporting to them. Decisions would come quickly. Civilian politics would wait, for years if necessary."
 WIE_wd_adm_directorate:0 "A Wielvakian State Directorate"
 WIE_wd_adm_directorate_desc:0 "The nationalist camp is small, about one voter in eight, but loud in South Gangel, where FATO maintains a claim. It wants a directorate that governs by decree in the name of the nation and treats every frontier as a grievance. It promises discipline and pride. It would also teach every neighbour to assume the worst of Wielvakia."
 WIE_wd_adm_office_stays:0 "The Executive Office Endures"
 WIE_wd_adm_office_stays_desc:0 "The majority that keeps the Administration in place wants nothing dramatic. The executive office stays, but under a written statute fixing its term, its powers and a public review every four years by the state councils. No ballot is promised. Reformers call it a polite postponement; administrators call it the first rulebook the office has had."
 WIE_wd_adm_polling_day:0 "Polling Day in Four States"
 WIE_wd_adm_polling_day_desc:0 "The chamber's first election runs on one day across Alaoboa, Vakia, Farnlands and South Gangel, counted in public halls before observers from every party. Turnout is high in the capital and lower in the lowland towns. Losing candidates complain of boundaries drawn in a hurry, and the winners must now govern beside an opposition that can vote them out."
 WIE_wd_adm_staff_budget:0 "A Budget Drafted at Headquarters"
 WIE_wd_adm_staff_budget_desc:0 "Under the staff council the national budget is drafted by the officers who plan the army's year, with every ministry request ranked against readiness. Spending becomes predictable and the arms halls receive their orders early. Schools, clinics and the state councils learn that a well argued request still comes second to fuel and spares."
 WIE_wd_adm_leagues:0 "The Directorate Youth Leagues"
 WIE_wd_adm_leagues_desc:0 "The directorate organises the young into leagues with uniforms, summer camps in the Vakia hills and evening drill in the lowland towns. Membership is voluntary on paper and expected in practice. The leagues carry the directorate's message and feed the army keen recruits, while parents who keep their children home find their permits delayed."
 WIE_wd_adm_four_year_review:0 "The Four-Year Review"
 WIE_wd_adm_four_year_review_desc:0 "The statute's first review arrives, and the councils of the four states sit together for a week to question the executive office in public. They cannot dismiss it, but their report is printed and argued over in every newspaper. Ministers who fail the review are moved quietly. The office learns that a rulebook also produces a scorecard."
 WIE_wd_adm_examinations:0 "Written Tests for Every Clerk"
 WIE_wd_adm_examinations_desc:0 "With the payroll in print, posts filled by family and favour can no longer be denied. Every new entrant to the civil service now sits a written examination marked by a board that includes outsiders. Patronage networks in every party lose their easiest currency, and recruitment slows for two years while the boards learn their trade."
 WIE_wd_adm_compact:0 "A Compact of the Four States"
 WIE_wd_adm_compact_desc:0 "Whatever government sits in Mankovce, the four states sign a short compact fixing their shares of oil revenue, the seats of state offices and the language of the courts. Vakia, the only coast, wins a guaranteed harbour budget. The compact settles nothing grand, but it stops every budget year from reopening what the country owes each region."
 WIE_wd_oil_survey:0 "Survey the Three Lowland Fields"
 WIE_wd_oil_survey_desc:0 "Wielvakia pumps oil from three fields of roughly equal size, under South Gangel, Farnlands and the plains around the capital, and no one has measured their reserves with modern methods. Seismic crews and core samples tell the government what it owns before it decides who should pump it. The survey costs a season and some goodwill."
 WIE_wd_oil_gathering_lines:0 "Gathering Lines in Farnlands"
 WIE_wd_oil_gathering_lines_desc:0 "Farnlands wells still send crude to the railhead by tanker truck over farm roads that break up every spring. Buried gathering lines and a hard road to the Nadomlin railhead cut the truck traffic in half. Farmers object to trenches across their fields, and the compensation bill is larger than the engineers first estimated."
 WIE_wd_oil_gangel_roads:0 "Hard Roads for South Gangel Wells"
 WIE_wd_oil_gangel_roads_desc:0 "The South Gangel field lies beside the FATO frontier, and its access roads were laid for carts. Paving them, adding bridges strong enough for drilling rigs and lighting the junctions makes the field workable all year. It also makes the frontier district easier for anyone to reach, which the border police note in their monthly report."
 WIE_wd_oil_state_company:0 "A Single State Oil Company"
 WIE_wd_oil_state_company_desc:0 "One school wants all three fields placed under a single state company that drills, pipes, refines and sells, with its profits paid straight into the budget. It would plan the fields as one system and keep foreign firms out. It would also become the largest employer in the country, and every government would treat it as a purse."
 WIE_wd_oil_concessions:0 "Auction the Lowland Blocks"
 WIE_wd_oil_concessions_desc:0 "The rival school wants the fields divided into blocks and auctioned to private drillers, domestic or foreign, who pay royalties and tax on every barrel. Investment would arrive faster than any budget could supply it. The state would lose control of how fast the fields are drained, and high bidders may cut corners on safety and wages."
 WIE_wd_oil_capital_refinery:0 "A Refinery Beside the Capital"
 WIE_wd_oil_capital_refinery_desc:0 "The state company's first large project is a refinery on the edge of the capital, fed by pipe from all three fields and sized for the whole country's fuel. Wielvakia stops shipping crude abroad and buying petrol back. The plant takes the last open industrial plot in Alaoboa, and the nearest suburb learns what a refinery smells like."
 WIE_wd_oil_tank_farms:0 "Tank Farms in the Capital Hills"
 WIE_wd_oil_tank_farms_desc:0 "The capital's fuel silo is topped up and new tank farms are dug into the hills beside the city, holding enough fuel for the army and essential services for a season. Fuel bought for storage earns nothing and ages slowly. If the region's wars ever close the roads and sea lanes, the country will not run dry within a month."
 WIE_wd_oil_licence_code:0 "Safety Terms for Every Licence"
 WIE_wd_oil_licence_code_desc:0 "Drillers who won the auctions are now bound by one code covering safety, wages and the sealing of spent wells, enforced by inspectors paid from a levy on every barrel. The worst operators threaten to leave, and one does. The rest accept the code once they see that the inspectors also stop rivals from undercutting them with reckless crews."
 WIE_wd_oil_ring_road:0 "A Ring Road for the Tankers"
 WIE_wd_oil_ring_road_desc:0 "Private drillers sell crude to whoever pays best, and most of it leaves by tanker truck through the capital's streets. A ring road around Mankovce, paid for from the concession levy, keeps the tankers out of the centre and speeds every other kind of freight. Residents welcome the quiet; shops on the old route lose their passing trade."
 WIE_wd_oil_trunk_pipeline:0 "The Trunk Pipeline to Vakia"
 WIE_wd_oil_trunk_pipeline_desc:0 "Lowland oil has only one way to the sea, across the mountains to the Vakia harbours. A trunk pipeline through the passes, with pumping stations and a tank farm at the port, lets Wielvakia load tankers instead of trains. The mountain route is costly to build and to guard, and the Nordlandic coast nearby will watch the tankers sail."
 WIE_wd_oil_barrel_fund:0 "An Oil Revenue Fund"
 WIE_wd_oil_barrel_fund_desc:0 "Oil money has always gone straight into the year's budget, rising and falling with the price. With the compact of the four states fixing each region's share, a revenue fund now takes a set portion of every barrel, invests it and pays out a steady sum each year. Ministers lose a pot they liked to spend, and the country gains a cushion against the day crude collapses."
 WIE_wd_ore_gallery_count:0 "Count the Vakia Mine Galleries"
 WIE_wd_ore_gallery_count_desc:0 "Most of the country's tungsten and chromium comes from galleries cut into the Vakia mountains above the forests and dry valleys of the coast. Inspectors walk every gallery, record what is worked and what has flooded, and map who owns which seam. Several owners have no papers at all, and the count must decide what to do about them."
 WIE_wd_ore_winter_roads:0 "Mine Roads Through the Passes"
 WIE_wd_ore_winter_roads_desc:0 "Ore leaves the Vakia galleries by mule track and narrow lorry roads that close every winter. Graded roads with retaining walls and avalanche sheds keep the mines working through the cold months. Road crews are scarce, and the work takes them off every other project in Vakia for two seasons. Mining towns see their first winter wages."
 WIE_wd_ore_assay_laboratory:0 "An Assay Laboratory at Mankovce"
 WIE_wd_ore_assay_laboratory_desc:0 "Foreign ore buyers set the price by their own assays, and Wielvakian sellers have no means to argue. A national assay laboratory in the capital tests every shipment and publishes grades that buyers must accept or dispute in writing. It needs chemists the country barely has, and within a year it pays for itself in better prices."
 WIE_wd_ore_raw_sales:0 "Sell the Ore as It Comes"
 WIE_wd_ore_raw_sales_desc:0 "The simplest policy sells tungsten and chromium concentrate to foreign smelters on long contracts, at the best price the assay laboratory can defend. Money arrives quickly and the mines expand. The country stays a quarry for other people's alloy works, and if wars drive prices up, Wielvakia will have sold its future output cheaply."
 WIE_wd_ore_home_alloys:0 "Keep the Ore for Wielvakian Steel"
 WIE_wd_ore_home_alloys_desc:0 "The other policy restricts concentrate exports and directs the ore to domestic mills, where it hardens armour plate, gun barrels and machine tools. The arms halls gain a supply no foreign buyer can outbid. Mine owners lose their best customers and say so loudly, and the mills must learn alloy work they have never done at scale."
 WIE_wd_ore_ten_year_terms:0 "Ten-Year Ore Contracts"
 WIE_wd_ore_ten_year_terms_desc:0 "Foreign smelters offer ten-year contracts at fixed prices in exchange for guaranteed tonnage. The treasury can plan around the revenue and the mines can borrow against it. If prices rise the buyers win; if they fall Wielvakia does. Negotiators hold out for a review clause every three years, which costs a long winter of talks."
 WIE_wd_ore_armour_plate:0 "Armour Plate from Lowland Mills"
 WIE_wd_ore_armour_plate_desc:0 "Lowland steel and Vakia chromium meet in the capital's mills, which roll their first armour plate of domestic alloy. The plate is heavier and slower to make than imported grades, and the first batches fail their tests. By the third year the tank workshops stop ordering plate from abroad and the repair yards stop waiting on foreign ships."
 WIE_wd_ore_carbide_tools:0 "Hard Alloys for Machine Tools"
 WIE_wd_ore_carbide_tools_desc:0 "Tungsten carbide tips and chromium tool steels make every lathe and drill in the country faster and longer lived. Working from the assay laboratory's samples, a small team learns to sinter carbide inserts for domestic workshops. It is fiddly, costly work with a high reject rate, and every insert made at home is one fewer to import."
 WIE_wd_ore_rescue_stations:0 "Rescue Stations in the Galleries"
 WIE_wd_ore_rescue_stations_desc:0 "Gallery collapses kill Vakia miners every year, and the nearest rescue team is often a day away. Stations with breathing sets, trained crews and telephone lines to each mine cut that to an hour. Owners must pay a levy for the stations and many resent it. Miners' families, who have buried too many, notice who paid and who argued."
 WIE_wd_ore_mining_school:0 "A Mining School in Vakia"
 WIE_wd_ore_mining_school_desc:0 "Vakia supplies the ore while the capital keeps the engineers. A school in the mining district trains assayers, mine surveyors and furnace hands where the work is, with places reserved for miners' children. Teachers have to be lured from the capital with housing and bonuses. In time the district's best graduates need not leave home for skilled work."
 WIE_wd_arm_armour_paper:0 "Why Six Tank Divisions"
 WIE_wd_arm_armour_paper_desc:0 "Wielvakia fields six tank divisions beside four of infantry and four motorised, an armoured share few neighbours can match. The tanks burn lowland fuel, wear out lowland roads and absorb most of the army budget. Before another hull is bought, the general staff must explain in writing what the armour is for and where it would fight."
 WIE_wd_arm_farnlands_range:0 "A Tank Range on the Farnlands Plain"
 WIE_wd_arm_farnlands_range_desc:0 "Tank crews have trained on cramped grounds where a battalion cannot deploy. A large range on the open Farnlands plain, with tank roads, firing lanes and a repair camp, lets whole battalions manoeuvre and shoot together. Farmers who lease the land are paid well and still object to the noise, the dust and the ruts in their tracks."
 WIE_wd_arm_fuel_allowance:0 "Fuel Allowance for Every Crew"
 WIE_wd_arm_fuel_allowance_desc:0 "Crews that never drive cannot fight, and Wielvakian tank crews have been rationed to a few days in the field each year to save fuel. The army now guarantees every crew a fixed training allowance, drawn from the lowland wells before any crude is exported. The oil budget feels the difference at once; the divisions feel it within a season."
 WIE_wd_arm_massed:0 "Mass the Armour on the Low Lands"
 WIE_wd_arm_massed_desc:0 "The armoured school wants all six tank divisions held together on the lowland plain, where the ground suits them and the fuel is close. An intruder from any frontier would meet a single armoured fist within two days. The doctrine is simple and powerful, and it leaves Vakia and its mountain passes to the infantry and to hope."
 WIE_wd_arm_passes:0 "Hold the Passes, Keep a Reserve"
 WIE_wd_arm_passes_desc:0 "The mountain school points out that the Vakia passes carry the main routes from the Ratian and Nordlandic frontiers to the coast. It wants infantry and mountain troops dug into those passes, with the tanks held back as a central reserve rather than a striking force. Fewer tanks would need fuel, and the savings could go into exports."
 WIE_wd_arm_motor_brigades:0 "Motor Brigades over Tank Divisions"
 WIE_wd_arm_motor_brigades_desc:0 "A third group of officers wants to break the heavy divisions into smaller mechanised brigades mixing tanks, infantry carriers and guns, able to move on lowland roads and fight in mountain valleys alike. Each brigade would be weaker alone and quicker everywhere. The reform would take years, and the tank generals see it as an attack on their branch."
 WIE_wd_arm_railhead_parks:0 "Repair Parks at the Railheads"
 WIE_wd_arm_railhead_parks_desc:0 "Six divisions massed together need workshops close behind them. Repair parks at the lowland railheads can change an engine overnight and rebuild a gearbox in a day. The parks draw skilled fitters away from civilian garages that pay better. With them, the armoured fist can stay in the field for longer than a single week."
 WIE_wd_arm_pass_works:0 "Fieldworks in the Vakia Passes"
 WIE_wd_arm_pass_works_desc:0 "Holding the passes needs more than infantry on hillsides. Engineers cut covered positions, ammunition stores and lateral roads along the main routes from the frontiers to the coast, so defenders can shift between valleys unseen. The work scars several mountain parks, and the army posts sentries where hikers once picnicked."
 WIE_wd_arm_valley_trials:0 "Brigade Trials in the Valleys"
 WIE_wd_arm_valley_trials_desc:0 "The first two mixed brigades spend a year on trial, driving from the Farnlands plain into the Vakia valleys and back on public roads. Umpires mark every mistake, and the reports are blunt. Several of the tank generals' objections turn out to be right. The trials cost fuel and pride, and they show what the brigades must still learn."
 WIE_wd_arm_call_up:0 "A Register of Former Conscripts"
 WIE_wd_arm_call_up_desc:0 "Limited conscription produces a modest intake, but everyone who has served is still on paper somewhere, scattered across district offices. A single call-up register lists them by skill, district and last unit, updated each year. Mobilisation that took weeks now takes days, and civil liberties groups dislike a state that knows so much."
 WIE_wd_arm_career_crews:0 "Long-Service Tank Crews"
 WIE_wd_arm_career_crews_desc:0 "The alternative spends the money on fewer, better soldiers: tank crews signed for long terms on career pay, with housing and technical courses, who keep the same vehicle for years. Their gunnery and maintenance improve beyond anything a conscript achieves. The wage bill climbs every year, and the reserve behind them stays thin."
 WIE_wd_arm_mobilisation_tables:0 "Mobilisation Tables at Headquarters"
 WIE_wd_arm_mobilisation_tables_desc:0 "Under the staff council, headquarters writes mobilisation tables for every reservist, train and fuel truck in the country and rehearses them twice a year on the lowland railways. Civil traffic stops for a day each time. The tables turn a small army with large stores into one that is ready in days, and ministries resent the short notice."
 WIE_wd_bord_frontier_review:0 "Four Neighbours, Four Rulebooks"
 WIE_wd_bord_frontier_review_desc:0 "Wielvakia touches FATO, Gebet, Ratio and Nordlands, and each frontier runs by its own forms, hours and habits. Officers at the Gangl crossings never speak to colleagues on the Nordlandic side. A frontier review gathers every post's records in Mankovce to learn what crosses, where and how often. Several posts turn out to keep no records."
 WIE_wd_bord_gangel_brief:0 "A Legal Brief on South Gangel"
 WIE_wd_bord_gangel_brief_desc:0 "FATO maintains a claim to South Gangel, and when Belka sells its northern lands to FATO in late August 1991 the neighbour across the Gangl crossings grows larger overnight. The foreign ministry prepares a brief on the claim and the treaties behind the frontier. It moves no line on any map, but the government will not be caught unprepared."
 WIE_wd_bord_gangel_brief_tt_1:0 "No claim, core or border changes; the brief sets out the Wielvakian legal position only."
 WIE_wd_bord_northern_hours:0 "Common Hours at the Northern Posts"
 WIE_wd_bord_northern_hours_desc:0 "The crossings from Farnlands and Vakia into Nordlands carry light traffic over mountain roads and through small harbours. Wielvakian officers there now keep posted hours, use bilingual forms and staff a telephone line for their Nordlandic counterparts, whatever Nordlands arranges on its own side. Smugglers who relied on confusion notice first."
 WIE_wd_bord_centrum_trains:0 "Through Trains into Ratio"
 WIE_wd_bord_centrum_trains_desc:0 "Lines from the capital and the Vakia mountains run into Ratio at Centrum and the Troton Mountains, but every train stops at the frontier to change crews and papers. Through running with shared signalling and joint inspection would halve the waits. Rail unions fear for their jobs, and the scheme needs Ratian agreement Wielvakia cannot command."
 WIE_wd_bord_gebet_liaison:0 "Liaison Posts on the Gebet Frontier"
 WIE_wd_bord_gebet_liaison_desc:0 "Gebet, independent since 1988, lies across the frontier from South Gangel and Alaoboa and shares its other frontier with Belka. Liaison posts with radios and a small radar at the South Gangel junction let the two border services talk and watch the air. Gebetan officials welcome the contact, and both sides know which sky the radar watches."
 WIE_wd_bord_open_crossings:0 "Open Frontiers, Quick Crossings"
 WIE_wd_bord_open_crossings_desc:0 "With the review complete, one camp wants every crossing open around the clock with inspections by sample only. Lowland trade with all four neighbours would grow quickly and frontier towns would prosper. Smuggling would grow too, and the police warn that an open frontier is just as easy to cross in the other direction when times turn bad."
 WIE_wd_bord_armed_crossings:0 "Armed Posts, Closed Nights"
 WIE_wd_bord_armed_crossings_desc:0 "The cautious camp wants every crossing staffed by armed customs police and closed between dusk and dawn, with every vehicle searched. Traders would queue and complain. The state would know what enters the country, which matters more than cheap imports in a region where land is being sold and borders redrawn."
 WIE_wd_bord_convention:0 "Propose a Frontier Convention"
 WIE_wd_bord_convention_desc:0 "A third camp wants Wielvakia to offer all four neighbours one common text on crossing hours, incident reporting and the return of stray livestock, vehicles and conscripts. Nobody is obliged to sign. The offer costs diplomats' time and invites polite refusals, but it shows the region a neighbour that prefers paperwork to patrols."
 WIE_wd_bord_convention_tt_1:0 "An offer only; it creates no faction, guarantee or alliance and binds no neighbour."
 WIE_wd_bord_transit_lanes:0 "Transit Lanes for Lowland Trucks"
 WIE_wd_bord_transit_lanes_desc:0 "Open crossings bring more lorries than the South Gangel roads can carry. Dedicated transit lanes with weigh stations, truck stops and customs clearance at the depot rather than the frontier keep through traffic moving. Hauliers on both sides save hours, and the district's villages lose the quiet they had before the lorries came."
 WIE_wd_bord_guard_corps:0 "A Frontier Guard Corps"
 WIE_wd_bord_guard_corps_desc:0 "Armed crossings need patrols between them. A uniformed frontier guard, drawn from former conscripts and trained in mountain and plain alike, walks the line between posts on all four frontiers. It costs barracks, vehicles and wages. Neighbours notice the new uniforms and ask, through the proper channels, what they are meant to stop."
 WIE_wd_bord_secretariat:0 "A Frontier Secretariat at Mankovce"
 WIE_wd_bord_secretariat_desc:0 "Whatever answers come back, the convention offer leaves behind a small secretariat in the capital that logs every frontier complaint from any neighbour and replies within a week. It has no power to settle anything. It does make Wielvakia the easiest neighbour in the region to talk to, which is worth something when tempers run high."
 WIE_wd_bord_gangel_rallies:0 "Rallies in South Gangel"
 WIE_wd_bord_gangel_rallies_desc:0 "Under the directorate, the movement holds rallies in the South Gangel towns facing the Gangl crossings, with bands, banners and speeches about the district's place in the nation. The rallies change no claim and no frontier. They lift the movement's members, worry the district's traders, and are reported in detail across the line."
 WIE_wd_bord_gangel_rallies_tt_1:0 "No claim, core or border changes; the rallies are domestic politics only."
 WIE_wd_cst_naval_review:0 "Two Harbours and Three Slipways"
 WIE_wd_cst_naval_review_desc:0 "Wielvakia's only coast runs along Vakia, where two harbours, one large and one small, shelter two destroyers and a single submarine beside three working slipways. The same coast carries the country's ore and may one day carry its oil. A naval review asks whether the fleet exists to fight, to escort, or to show a flag the neighbours can see."
 WIE_wd_cst_cliff_radar:0 "Radar Heads on the Vakia Cliffs"
 WIE_wd_cst_cliff_radar_desc:0 "Ships bound for the Vakia harbours are seen only when they round the breakwater. Radar heads on the cliffs above both harbours, feeding a single plot room, track every hull in range and every aircraft low over the water. The Nordlandic coast is near enough to appear on the screens, which must be explained before the sets are switched on."
 WIE_wd_cst_slipway_hire:0 "Repair Work for the Slipways"
 WIE_wd_cst_slipway_hire_desc:0 "Three slipways cannot build a fleet, but they can repair one. The yards bid for overhaul and conversion work on coasters, ferries and fishing boats of any flag, keeping welders busy between naval orders. Prices must undercut larger yards elsewhere in the region, and the navy loses priority on the slipways for two years."
 WIE_wd_cst_ore_escorts:0 "Convoy Escort for the Ore Trade"
 WIE_wd_cst_ore_escorts_desc:0 "One school wants the navy organised around the ore ships: the two destroyers escort groups of merchant hulls out of Vakia and the submarine trains them to spot a shadow. It turns a token fleet into a working one with a clear task. It also ties the navy to trade routes that the region's wars may close without asking."
 WIE_wd_cst_inshore_boats:0 "Patrol Boats for the Inshore Waters"
 WIE_wd_cst_inshore_boats_desc:0 "The other school wants small, fast patrol boats built at home for the inshore waters and harbour mouths, with the destroyers kept as a reserve. Boats are cheap, the slipways can build them and conscripts can crew them. They cannot go far from the coast, which is precisely where this school thinks the navy belongs."
 WIE_wd_cst_destroyer_refit:0 "Refit the Two Destroyers"
 WIE_wd_cst_destroyer_refit_desc:0 "Escort work demands ships that can stay at sea for a week. Both destroyers go through the dry dock in turn for new sonar, radios and engine overhauls, and the dock gates are replaced first so the work can happen at all. For a year only one escort is available, and the ore shippers are told to keep their sailings in step."
 WIE_wd_cst_fishery_patrols:0 "Fishery Patrols off Vakia"
 WIE_wd_cst_fishery_patrols_desc:0 "The first patrol boats go to work on the fishing grounds, checking catches, chasing trawlers that ignore closed seasons and towing broken boats home in storms. The fishermen grumble about inspections and cheer the rescues. The crews learn the coast's every rock and current, which is the training no exercise could provide."
 WIE_wd_cst_maritime_patrol:0 "Maritime Patrol from the Vakia Field"
 WIE_wd_cst_maritime_patrol_desc:0 "The Vakia airfield is the largest in the country. Longer runways, a maritime patrol hangar and a fuel store let aircraft watch the sea lanes far beyond the reach of the cliff radar. The navy and the air arm must share one field and one budget line, and their first joint planning meetings are not friendly ones."
 WIE_wd_cst_port_budget:0 "A Harbour Budget for Vakia"
 WIE_wd_cst_port_budget_desc:0 "The compact of the four states guarantees Vakia a harbour budget, and the first instalment arrives. New cranes, dredging and a rail spur to the quay let the harbours handle ore, crude and general cargo on one site. The lowland states watch the spending closely, and the port authority prints its accounts to forestall them."
 WIE_wd_cst_naval_school:0 "A Naval School at the Main Harbour"
 WIE_wd_cst_naval_school_desc:0 "Officers have been trained abroad or not at all, and ratings learn their trades on the job. A naval school at the main Vakia harbour teaches navigation, engineering and gunnery to both, with a small training vessel of its own. The school is expensive for a fleet of three hulls, and it is the only way the fleet will ever grow."
 WIE_wd_air_count:0 "Forty-Eight Fighters, Two Main Fields"
 WIE_wd_air_count_desc:0 "The air arm flies forty-eight fighters and a dozen ground attack aircraft from two main fields, the capital's and the Vakia coast's, with a single grass strip in South Gangel. Pilots fly fewer hours than their instructors did. A review asks what the air arm should protect first: the capital, the armour on the plain, or the coast."
 WIE_wd_air_nadomlin_field:0 "A Dispersal Field near Nadomlin"
 WIE_wd_air_nadomlin_field_desc:0 "Farnlands has no military airfield, so every aircraft in that part of the country must fly from the capital. A dispersal field on the plain near Nadomlin, with hardened shelters and fuel from the local wells, gives the air arm somewhere to scatter in a crisis. It also puts fighters within minutes of the Nordlandic and FATO frontiers."
 WIE_wd_air_gangel_runway:0 "Concrete for the South Gangel Strip"
 WIE_wd_air_gangel_runway_desc:0 "South Gangel's grass strip is the Wielvakian field closest to the FATO and Gebet frontiers. With the legal brief on the FATO claim written, the government lays a concrete runway, taxiways and blast pens there. It is a modest base, and it says in the plainest language an air force has that the district is defended."
 WIE_wd_air_flying_hours:0 "Flying Hours Before New Airframes"
 WIE_wd_air_flying_hours_desc:0 "New aircraft are expensive and slow to arrive; flying hours are neither. The air arm spends its budget on fuel, spares and instructors so that every pilot flies twice as often, and postpones any purchase of new airframes. The fleet ages a little faster, and the pilots who fly it become a good deal better at their work."
 WIE_wd_air_army_support:0 "Close Support for the Tank Divisions"
 WIE_wd_air_army_support_desc:0 "The dozen ground attack aircraft have never trained with the armour they are meant to support. Joint exercises on the Farnlands range, forward air controllers in every tank brigade and a shared radio net teach pilots and tank commanders to speak the same language. Accidents happen, and every exercise is reviewed in detail."
 WIE_wd_air_capital_control:0 "A Control Room at the Capital Field"
 WIE_wd_air_capital_control_desc:0 "Interception without radar is guesswork. A radar head and an underground control room at the capital field watch the approaches to Mankovce from every frontier and scramble fighters with minutes to spare. The room needs crews around the clock and the radar must be explained to four neighbours before it is switched on."
 WIE_wd_air_capital_pens:0 "Blast Pens at the Capital Field"
 WIE_wd_air_capital_pens_desc:0 "The capital's aircraft stand in rows on open aprons, a target that a single raid could destroy. Concrete blast pens, a second runway and buried fuel lines turn the field into one that can absorb a strike and keep flying. The work closes the field in turns for a year, and its squadrons lodge at the Vakia field while it lasts."
 WIE_wd_air_hired_aggressors:0 "Hire Foreign Aggressor Instructors"
 WIE_wd_air_hired_aggressors_desc:0 "By mid 1998 former top pilots of the Belkan Air Force are working abroad as aggressor instructors for whoever pays. A short contract would bring a few to the capital field to fly against Wielvakian pilots. Training would improve quickly. Their past would follow them, and some officers ask what else such instructors might pass on."
 WIE_wd_air_home_aggressors:0 "Train Aggressors at Home"
 WIE_wd_air_home_aggressors_desc:0 "The alternative takes the best squadron leaders off the line for a year to write their own tactics manual and fly as an enemy unit in borrowed markings. It is slower, and the first course repeats mistakes nobody abroad would make. It also builds knowledge that belongs to the air arm and cannot leave on the next flight out."
 WIE_wd_air_lowland_plan:0 "An Air Plan for the Low Lands"
 WIE_wd_air_lowland_plan_desc:0 "Fields, radars and squadrons have grown one project at a time. A single air defence plan now ties them together: which radar feeds which control room, which squadron scatters to which field, and where the anti-aircraft guns stand. Writing it exposes every gap, and closing them will take the rest of the decade."
 WIE_wd_war_outbreak:0 "War Breaks Out Near Gebet"
 WIE_wd_war_outbreak_desc:0 "In late March 1995 the Belkan War breaks out. Gebet, across the frontier from South Gangel and Alaoboa, also borders Belka. Wielvakia is not a party. The government puts the frontier commands on alert, opens a situation room under the capital and orders the border police to count every vehicle that crosses in either direction."
 WIE_wd_war_open_crossings:0 "Keep the Gebet Crossings Open"
 WIE_wd_war_open_crossings_desc:0 "One answer keeps the Gebet crossings open to anyone with papers, and to families without them once they register. It is the decent course and the costly one. Frontier towns fill, prices rise and the security services worry about who else might cross among the families. Gebet, at least, will remember who kept the door open."
 WIE_wd_war_sealed_crossings:0 "Seal the Gebet Crossings"
 WIE_wd_war_sealed_crossings_desc:0 "The other answer closes the crossings to everyone except diplomats and relief convoys until the front settles. Wielvakia keeps the war at arm's length and the frontier towns stay calm. Families on the far side are left to whatever lies behind them, and that choice will be remembered on both sides of the line for years."
 WIE_wd_war_model_radar:0 "Radar for the South Gangel Junction"
 WIE_wd_war_model_radar_desc:0 "When Belkan forces assault Model, a border city in Gebet, the fighting comes near enough that the government takes no chances. A second air defence radar goes to South Gangel and the sirens are tested in a public drill so people know what they mean. The drill frightens some of the towns it is meant to reassure."
 WIE_wd_war_reception_halls:0 "Reception Halls in South Gangel"
 WIE_wd_war_reception_halls_desc:0 "Open crossings need somewhere for families to sleep. Schools, sports halls and a disused barracks in South Gangel become reception halls with kitchens, clinics and registration desks run by the district and volunteers. Pupils lose their gyms and taxpayers lose their patience. The halls keep the arrivals off the roads and out of the cold."
 WIE_wd_war_gebet_line:0 "Two Divisions to the Gebet Line"
 WIE_wd_war_gebet_line_desc:0 "Sealed crossings mean little without troops behind them. Two divisions, one armoured and one motorised, move to the frontier opposite Gebet and dig in along the roads into South Gangel and Alaoboa. Their fuel and ammunition come from stocks meant for training, and the divisions left in the parks drill less for a year."
 WIE_wd_war_relief_fuel:0 "Fuel for the Relief Convoys"
 WIE_wd_war_relief_fuel_desc:0 "Relief convoys bound for the war zone cannot buy fuel at any price once they leave the lowland depots. The state company releases fuel from the capital's tank farms at cost to any relief convoy that asks, whatever flag it flies. It drains a reserve built for Wielvakian emergencies and earns the country quiet gratitude."
 WIE_wd_war_grain_stores:0 "Seal the Lowland Grain Stores"
 WIE_wd_war_grain_stores_desc:0 "When nuclear devices are used in the Waldreich Mountains, nobody in the Low Lands knows what the wind might carry. The government seals the season's grain in the state stores and releases it only after laboratory tests, with results posted at every market. Farmers wait for their money, and buyers trust what they eat."
 WIE_wd_war_stand_down:0 "Stand Down the Frontier Commands"
 WIE_wd_war_stand_down_desc:0 "Once the fighting beyond Gebet is over and the news from Belka is of treaties rather than fronts, the frontier commands stand down. Reservists go home, the situation room is mothballed and the border police return to customs work. The government publishes what the war months cost in fuel, overtime and lost trade, a large figure for a country that never fired a shot."
 WIE_wd_war_reconstruction:0 "Lowland Bids for Rebuilding Work"
 WIE_wd_war_reconstruction_desc:0 "With Belka defeated, the Allied nations and the countries around the war begin to rebuild what was bombed, and they need steel, fuel, trucks and cement. Lowland factories bid for the orders and win a share. The work is welcome and temporary, and it draws the factories toward markets that may vanish once the rebuilding ends."
 WIE_wd_war_long_watch:0 "A Victorious Belka Two Frontiers Away"
 WIE_wd_war_long_watch_desc:0 "Belka has won its war, and the balance of power beyond Gebet has shifted for years to come. Wielvakia shares no frontier with Belka, but Gebet does, and Gebet shares one with Wielvakia. The army keeps its frontier divisions at higher readiness and the budget pays for it. Nobody in Mankovce expects the region to settle soon."
 WIE_wd_war_officer_oath:0 "A Fresh Oath for the Officers"
 WIE_wd_war_officer_oath_desc:0 "When A World With No Boundaries launches a coup at the end of 1995, governments across the region start asking whom their own officers really answer to. Every Wielvakian officer renews the oath of service and declares any foreign association, and a small board reviews the declarations. Most officers find it insulting, and a few find it alarming."
 WIE_wd_sky_announcement:0 "The Asteroid Announcement"
 WIE_wd_sky_announcement_desc:0 "Wielvakians learn of the coming impact from the FCU President's broadcast in April 1996, together with the news that a defence against the asteroid is being planned. Which countries lie in the path of its debris is anybody's guess. The country owns no observatory, no public shelters and no plan, so a civil defence commission is convened in the capital within the week and asks for everything at once."
 WIE_wd_sky_data_line:0 "A Data Line to the Observatories"
 WIE_wd_sky_data_line_desc:0 "Without telescopes of its own, Wielvakia depends on what foreign observatories publish. A leased data line and a small team of astronomers and programmers in the capital receive the orbit updates and turn them into plain advice for the commission. It is borrowed knowledge, and it arrives hours faster than the newspapers."
 WIE_wd_sky_city_shelters:0 "Shelters Under the Capital"
 WIE_wd_sky_city_shelters_desc:0 "One camp wants deep shelters dug under Mankovce and the lowland towns, with ventilation, water and supplies for weeks. Construction would tear up the streets for two years and swallow the commission's budget. When it is done, the cities will have somewhere to go that is not a cellar, whatever falls and wherever it lands."
 WIE_wd_sky_dispersal:0 "Plans to Leave the Lowland Towns"
 WIE_wd_sky_dispersal_desc:0 "The other camp says shelters are useless on an open plain if the danger is fire and blast, and that people should leave instead. Every lowland town receives a dispersal plan naming trains, roads and host villages in the Vakia hills. Plans are cheap to write and hard to rehearse, and villagers ask who will feed the guests."
 WIE_wd_sky_gallery_shelters:0 "Lease the Deep Vakia Galleries"
 WIE_wd_sky_gallery_shelters_desc:0 "Vakia's worked-out mine galleries are the deepest spaces in the country. The commission leases the safest of them from their owners, shores them, installs lights and air, and stocks them for the mining towns. Owners demand rent and miners point out which galleries flood. The registry from the gallery count shows which ones are sound."
 WIE_wd_sky_evacuation_trains:0 "Evacuation Trains on the Lowland Lines"
 WIE_wd_sky_evacuation_trains_desc:0 "The dispersal plans depend on the railways. Sidings at the Farnlands stations are lengthened, spare carriages are kept serviceable and timetables are written for moving whole towns in a day. The work improves ordinary rail service as well, though freight customers complain about carriages kept idle in the sidings."
 WIE_wd_sky_impact_drills:0 "Drills for the Fragment Estimate"
 WIE_wd_sky_impact_drills_desc:0 "When the astronomers revise their damage estimate in July 1998 to allow for fragments falling on eastern Anea, the commission takes the warning as a lesson rather than a reprieve: estimates change. Every district now runs impact drills twice a year, with sirens, assembly points and rehearsed routes. Attendance falls after the first drill."
 WIE_wd_sky_recovery_teams:0 "Standing Recovery Teams"
 WIE_wd_sky_recovery_teams_desc:0 "As Ulysses passes the Roche limit in July 1999, the commission turns from shelter to recovery. Engineers, medics and heavy plant are organised into standing teams, kept ready for whatever the fragments or anything else might do. They cost wages every year whether or not disaster comes, and in most years it does not."
 WIE_wd_sky_recovery_teams_tt_1:0 "No damage in Wielvakia is assumed; the teams stand ready only."
 WIE_wd_sky_help_neighbours:0 "Recovery Teams for the Neighbours"
 WIE_wd_sky_help_neighbours_desc:0 "The orbit updates keep arriving after the asteroid's passage, and with them reports of where help is needed. The commission offers its standing teams to any neighbour that asks, travelling with their own fuel and food so that they burden nobody. The cost falls on the Wielvakian budget; the goodwill, when it comes, falls on Wielvakia."
 ac_wd_wie_tree:0 "Wielvakia: National Programme"
 ac_wd_wie_tree_desc:0 "The national focus programme of Wielvakia, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 WIE_wd_office_inventory:0 "The Office Takes Stock"
 WIE_wd_office_inventory_desc:0 "The National Administration is listing its own powers, decrees and posts before deciding what to keep."
 WIE_wd_state_councils:0 "Quarterly State Councils"
 WIE_wd_state_councils_desc:0 "Advisory councils in each of the four states question their governors every quarter."
 WIE_wd_chamber_charter:0 "Charter of the Chamber"
 WIE_wd_chamber_charter_desc:0 "A chamber elected from the four states is drafting its rules, and the cabinet already answers to it."
 WIE_wd_elected_chamber:0 "Deputies of the Four States"
 WIE_wd_elected_chamber_desc:0 "Deputies from Alaoboa, Vakia, Farnlands and South Gangel make and unmake governments."
 WIE_wd_staff_seals:0 "Seals at Headquarters"
 WIE_wd_staff_seals_desc:0 "The general staff governs as a council until the frontiers are judged settled."
 WIE_wd_staff_budget:0 "The Readiness Budget"
 WIE_wd_staff_budget_desc:0 "Every ministry request is ranked against the army plan for the year."
 WIE_wd_directorate_order:0 "Government by Directorate Decree"
 WIE_wd_directorate_order_desc:0 "The directorate governs by decree in the name of the nation."
 WIE_wd_directorate_leagues:0 "The Directorate Leagues"
 WIE_wd_directorate_leagues_desc:0 "Uniformed youth leagues drill in every lowland town and camp in the Vakia hills."
 WIE_wd_office_statute:0 "Statute of the Executive Office"
 WIE_wd_office_statute_desc:0 "The executive office governs under a written statute with a review every four years."
 WIE_wd_reviewed_office:0 "An Office Under Review"
 WIE_wd_reviewed_office_desc:0 "The four state councils have questioned the executive office in public and printed their verdict."
 WIE_wd_service_examinations:0 "Entrance by Examination"
 WIE_wd_service_examinations_desc:0 "Every new civil servant passes a written examination set by a mixed board."
 WIE_wd_field_survey:0 "Three Fields Surveyed"
 WIE_wd_field_survey_desc:0 "The state now knows roughly how much oil lies under the three lowland fields."
 WIE_wd_national_oil_company:0 "One Company for Lowland Crude"
 WIE_wd_national_oil_company_desc:0 "A single state company drills, pipes, refines and sells all lowland oil."
 WIE_wd_lowland_concessions:0 "Auctioned Lowland Blocks"
 WIE_wd_lowland_concessions_desc:0 "Private drillers work auctioned blocks and pay royalties on every barrel."
 WIE_wd_regulated_concessions:0 "Concessions Under One Code"
 WIE_wd_regulated_concessions_desc:0 "Every licensed driller works to the same safety, wage and abandonment rules."
 WIE_wd_oil_revenue_fund:0 "The Barrel Fund"
 WIE_wd_oil_revenue_fund_desc:0 "A fixed share of oil revenue is invested and paid out as a steady yearly sum."
 WIE_wd_mine_registry:0 "Register of the Galleries"
 WIE_wd_mine_registry_desc:0 "Every Vakia mine gallery, seam and owner is entered on one register."
 WIE_wd_ore_contracts:0 "Concentrate for Foreign Smelters"
 WIE_wd_ore_contracts_desc:0 "Tungsten and chromium concentrate is sold abroad at assayed prices."
 WIE_wd_long_ore_contracts:0 "Ten-Year Ore Agreements"
 WIE_wd_long_ore_contracts_desc:0 "Fixed prices and guaranteed tonnage, reopened for review every three years."
 WIE_wd_alloy_reserve:0 "Ore for the Home Mills"
 WIE_wd_alloy_reserve_desc:0 "Concentrate exports are restricted and domestic mills receive the ore first."
 WIE_wd_plate_mills:0 "Plate Rolled from Vakia Chromium"
 WIE_wd_plate_mills_desc:0 "The capital mills roll armour plate from domestic alloy."
 WIE_wd_mine_rescue:0 "Gallery Rescue Stations"
 WIE_wd_mine_rescue_desc:0 "Trained crews can reach any Vakia gallery within an hour of a collapse."
 WIE_wd_metallurgy_school:0 "The Mining District School"
 WIE_wd_metallurgy_school_desc:0 "Assayers, surveyors and furnace hands are trained where the ore is dug."
 WIE_wd_armour_first:0 "The Armour Question"
 WIE_wd_armour_first_desc:0 "The general staff must explain in writing what six tank divisions are for."
 WIE_wd_fuel_allowance:0 "Guaranteed Training Fuel"
 WIE_wd_fuel_allowance_desc:0 "Every tank crew draws a fixed fuel allowance for field training."
 WIE_wd_massed_armour:0 "The Armoured Fist"
 WIE_wd_massed_armour_desc:0 "Six tank divisions held together on the lowland plain."
 WIE_wd_pass_defence:0 "Infantry in the Passes"
 WIE_wd_pass_defence_desc:0 "Infantry and mountain troops hold the Vakia passes; the armour waits in reserve."
 WIE_wd_motor_brigades:0 "Mixed Motor Brigades"
 WIE_wd_motor_brigades_desc:0 "Tanks, carriers and guns in brigades that fit both plain and valley."
 WIE_wd_brigade_trials:0 "Valley Brigade Trials"
 WIE_wd_brigade_trials_desc:0 "The new brigades are tested on mountain roads and lowland tracks."
 WIE_wd_call_up_register:0 "The Call-Up Register"
 WIE_wd_call_up_register_desc:0 "Every former conscript is listed by district, skill and unit."
 WIE_wd_career_crews:0 "Career Tank Crews"
 WIE_wd_career_crews_desc:0 "Long-service crews on career pay keep the same tank for years."
 WIE_wd_mobilisation_tables:0 "Rehearsed Mobilisation Tables"
 WIE_wd_mobilisation_tables_desc:0 "Every reservist, train and fuel truck has a slot in the headquarters tables."
 WIE_wd_frontier_review:0 "The Frontier Review"
 WIE_wd_frontier_review_desc:0 "Crossing records from all four frontiers are being gathered in Mankovce."
 WIE_wd_northern_posts:0 "Posted Hours on the Northern Posts"
 WIE_wd_northern_posts_desc:0 "The crossings into Nordlands keep posted hours, bilingual forms and a telephone line."
 WIE_wd_ratian_rail:0 "Through Trains to Centrum"
 WIE_wd_ratian_rail_desc:0 "Trains cross into Ratio without changing crews at the frontier."
 WIE_wd_open_frontiers:0 "Spot Checks Only"
 WIE_wd_open_frontiers_desc:0 "Crossings stay open around the clock with inspections by sample."
 WIE_wd_armed_frontiers:0 "Closed Nights on the Frontier"
 WIE_wd_armed_frontiers_desc:0 "Armed customs police staff every crossing, closed from dusk to dawn."
 WIE_wd_convention_proposal:0 "A Draft Frontier Convention"
 WIE_wd_convention_proposal_desc:0 "Wielvakia has offered every neighbour a common text on crossings and incidents."
 WIE_wd_frontier_guard:0 "The Frontier Guard Corps"
 WIE_wd_frontier_guard_desc:0 "A uniformed corps patrols between the crossings on all four frontiers."
 WIE_wd_frontier_secretariat:0 "The Frontier Secretariat"
 WIE_wd_frontier_secretariat_desc:0 "A small office in Mankovce answers frontier complaints from any neighbour."
 WIE_wd_coast_command:0 "The Vakia Coast Command"
 WIE_wd_coast_command_desc:0 "Two destroyers, one submarine and two harbours under one command."
 WIE_wd_slipway_contracts:0 "Slipways for Hire"
 WIE_wd_slipway_contracts_desc:0 "The Vakia yards overhaul coasters and ferries of any flag."
 WIE_wd_ore_convoys:0 "Escorted Ore Sailings"
 WIE_wd_ore_convoys_desc:0 "Ore ships leave the Vakia harbours in escorted groups."
 WIE_wd_inshore_patrols:0 "The Inshore Flotilla"
 WIE_wd_inshore_patrols_desc:0 "Small fast boats patrol the Vakia coast and the harbour mouths."
 WIE_wd_fishery_patrols:0 "Fishery Protection off Vakia"
 WIE_wd_fishery_patrols_desc:0 "Patrol boats check catches and rescue crews in bad weather."
 WIE_wd_vakia_port_fund:0 "The Vakia Port Fund"
 WIE_wd_vakia_port_fund_desc:0 "A guaranteed share of national revenue for the only coast."
 WIE_wd_naval_school:0 "The Harbour Naval School"
 WIE_wd_naval_school_desc:0 "Officers and ratings trained at the main Vakia harbour."
 WIE_wd_air_review:0 "The Air Arm Review"
 WIE_wd_air_review_desc:0 "The air arm is deciding what it must defend first."
 WIE_wd_flying_hours:0 "Hours Before Hulls"
 WIE_wd_flying_hours_desc:0 "More flying hours for existing pilots before any new aircraft."
 WIE_wd_aggressor_course:0 "The Hired Aggressor Course"
 WIE_wd_aggressor_course_desc:0 "Foreign instructors fly against Wielvakian pilots at the capital field."
 WIE_wd_home_instructors:0 "Home-Grown Aggressors"
 WIE_wd_home_instructors_desc:0 "A unit of Wielvakian squadron leaders writes and flies its own enemy tactics."
 WIE_wd_lowland_air_plan:0 "The Low Lands Air Plan"
 WIE_wd_lowland_air_plan_desc:0 "One plan links radar, fighters and dispersal fields across the plain."
 WIE_wd_war_alert:0 "Alert on the Gebet Frontier"
 WIE_wd_war_alert_desc:0 "Frontier commands stay on alert while Belka is at war."
 WIE_wd_refuge_crossings:0 "Crossings Open to Families"
 WIE_wd_refuge_crossings_desc:0 "Families from Gebet may cross and register at the frontier towns."
 WIE_wd_sealed_crossings:0 "Sealed Gebet Crossings"
 WIE_wd_sealed_crossings_desc:0 "The Gebet crossings admit only diplomatic and relief traffic."
 WIE_wd_reception_halls:0 "Halls for the Arrivals"
 WIE_wd_reception_halls_desc:0 "Schools and sports halls in South Gangel house registered arrivals."
 WIE_wd_gebet_line:0 "Two Divisions on the Gebet Line"
 WIE_wd_gebet_line_desc:0 "Two divisions hold the frontier opposite Gebet."
 WIE_wd_relief_fuel:0 "Fuel for Relief Convoys"
 WIE_wd_relief_fuel_desc:0 "Stored fuel is released at cost for relief convoys of every flag."
 WIE_wd_grain_seal:0 "Sealed Grain Stores"
 WIE_wd_grain_seal_desc:0 "Lowland grain from the war months is stored, tested and released only when clean."
 WIE_wd_rebuild_contracts:0 "Rebuilding Orders for Lowland Mills"
 WIE_wd_rebuild_contracts_desc:0 "Lowland factories supply the rebuilding of the war-damaged region."
 WIE_wd_long_watch:0 "The Long Watch"
 WIE_wd_long_watch_desc:0 "A victorious Belka lies two frontiers away, and the army stays ready."
 WIE_wd_officer_oath:0 "The Renewed Officer Oath"
 WIE_wd_officer_oath_desc:0 "Every officer has renewed the oath and declared any foreign association."
 WIE_wd_impact_watch:0 "The Impact Commission"
 WIE_wd_impact_watch_desc:0 "A civil defence commission plans for an asteroid whose fragments nobody can place."
 WIE_wd_city_shelters:0 "Shelters Under Mankovce"
 WIE_wd_city_shelters_desc:0 "Deep shelters under the capital and the lowland towns."
 WIE_wd_dispersal_plans:0 "Plans to Leave the Cities"
 WIE_wd_dispersal_plans_desc:0 "Every lowland town knows which train, road and village to use."
 WIE_wd_gallery_shelters:0 "Shelters in the Worked-Out Galleries"
 WIE_wd_gallery_shelters_desc:0 "Disused Vakia mine galleries fitted out as shelters."
 WIE_wd_impact_drills:0 "Impact Drills"
 WIE_wd_impact_drills_desc:0 "Sirens, assembly points and rehearsed routes in every district."
 WIE_wd_recovery_teams:0 "Teams Kept Ready for Disaster"
 WIE_wd_recovery_teams_desc:0 "Engineers, medics and heavy plant held ready for any disaster."
 WIE_wd_regional_recovery:0 "Help Across the Frontiers"
 WIE_wd_regional_recovery_desc:0 "Wielvakian recovery teams work wherever a neighbour asks for them."
 WIE_wd_crude_forward:0 "Crude Sold Forward"
 WIE_wd_crude_forward_desc:0 "A season of lowland crude has been sold before it is pumped."
 WIE_wd_autumn_manoeuvres:0 "Manoeuvres on the Plain"
 WIE_wd_autumn_manoeuvres_desc:0 "Whole divisions are in the field on the Farnlands range."
 WIE_wd_relief_train:0 "The Relief Train"
 WIE_wd_relief_train_desc:0 "A Wielvakian relief train runs to the frontier with food and medicine."
 WIE_wd_port_calls:0 "Foreign Calls at Vakia"
 WIE_wd_port_calls_desc:0 "Visiting merchant ships load and unload under reduced harbour dues."
 ac_wd_wie.1.t:0 "The Ledger of the Executive Office"
 ac_wd_wie.1.d:0 "The inventory arrives at the cabinet room in Mankovce in eleven bound volumes, each one stamped by a different ministry. Since the vote dated January 1991 the National Administration has governed without a further ballot on the calendar, and until now nobody, including the Administration itself, had written down in one place what the office actually does.\n\nThe volumes make uneasy reading. Decrees from earlier governments were never repealed and are still enforced in some districts and ignored in others. Two ministries license the same oil wells. Several hundred salaried posts have no recorded duties. The army takes the largest single share of the budget, and the line for schools in Vakia has not changed in years. Democrats will read the ledger as proof that the office must answer to someone. Officers will read it as proof that only discipline can repair it, and the nationalist benches will find in it a state gone soft.\n\nBefore any of those arguments begins, the cabinet must decide what happens to the volumes themselves. A printed summary would put the worst pages in every newspaper and start the debate on the public's terms. Kept as a working paper, the ledger stays a tool for the office to reform itself quietly, provided the clerks who compiled it can be trusted to keep their copies in their desks.\n\nProvisional gameplay."
 ac_wd_wie.1.a:0 "Print a summary for the public."
 ac_wd_wie.1.b:0 "Keep it as an internal working paper."
 ac_wd_wie.2.t:0 "Ledger Pages in the Morning Papers"
 ac_wd_wie.2.d:0 "Two weeks after the cabinet chose discretion, a Mankovce daily prints four photographed pages of the inventory on its front page. They are the worst four the paper could have chosen: the list of posts without duties, with the ministries that pay them and the totals for each. By noon the opposition benches have copies, and by evening so have the advisory clubs in every lowland town.\n\nThe Administration's press office first calls the pages incomplete, which is true, and then out of context, which convinces nobody. Officials named in the columns telephone their ministers. Editors in Vakia and Farnlands ask what else the volumes contain about their districts. Inside the ministries, the clerks who compiled the ledger find themselves interviewed by security officers about who had access to which drawer.\n\nThere are two ways out. The cabinet can confirm the pages, release the rest of the inventory and take the damage in one blow, hoping that candour now buys patience later. Or it can hunt for the source of the leak, say nothing more about the contents and wait for the papers to find another story. The second course is quieter, and the clerks will remember how they were treated.\n\nProvisional gameplay."
 ac_wd_wie.2.a:0 "Confirm the pages and release the rest."
 ac_wd_wie.2.b:0 "Find the leak and say nothing more."
 ac_wd_wie.3.t:0 "Three Fields, One Plain"
 ac_wd_wie.3.d:0 "The seismic crews finish their last lines across the Farnlands plain in the autumn and send their tapes to the capital for processing. For the first time the government can lay the three lowland fields side by side: South Gangel beside the FATO frontier, Farnlands near the Nordlandic one, and the field under the plains around Mankovce. Each holds roughly a third of the country's crude.\n\nThe maps also show how badly the fields have been worked. Wells were drilled where the land was cheap rather than where the oil was thickest. Neighbouring operators pump from the same pocket and race each other to drain it. Water is creeping into the oldest wells at Farnlands, and the gathering roads in South Gangel close every spring. Much of what the surveyors need to know is in the drilling logs that private operators have kept for themselves.\n\nThe survey board asks the cabinet for one ruling before it writes its report. The logs could be bought from the operators at a fair price, which costs money and admits that the drillers own what they recorded. Or the Administration can order the logs handed over as a condition of every licence, which is faster, cheaper and certain to start a quarrel with the people who actually run the wells.\n\nProvisional gameplay."
 ac_wd_wie.3.a:0 "Pay the operators for their logs."
 ac_wd_wie_3_a:0 "Pay the operators for their logs."
 ac_wd_wie.3.b:0 "Order the logs handed over."
 ac_wd_wie.4.t:0 "What the Galleries Hold"
 ac_wd_wie.4.d:0 "The inspectors come down from the Vakia mountains after a summer underground with a register that runs to several thousand entries. Tungsten and chromium leave the district in sacks, lorries and rail wagons from dozens of workings, large and small, cut into hillsides above the forests and the dry valleys near the coast. The ore is the richest in the country; the record of who may dig it is the poorest.\n\nRoughly one gallery in five has no papers at all. Some are worked by families who have dug the same seam for generations and never thought to register it. Others were opened by contractors who vanished after the first good year and left their crews to carry on alone. The inspectors also found flooded workings with miners still inside them on the day of the visit, and timbering that no engineer would sign.\n\nThe ministry must now decide who owns the unpapered seams. Registering them to the crews who work them would settle the mountains, keep production steady and cost the treasury the fees it might have charged. Auctioning them to the highest bidder would raise money at once and bring in companies with capital for pumps and timber, and it would put a great many Vakia families out of the only work they have.\n\nProvisional gameplay."
 ac_wd_wie.4.a:0 "Register the seams to the crews who work them."
 ac_wd_wie.4.b:0 "Auction the unpapered seams."
 ac_wd_wie.5.t:0 "A Paper on Six Divisions"
 ac_wd_wie.5.d:0 "The general staff delivers its paper on the armour as ordered, forty pages long, and the defence committee reads it in a single sitting. Wielvakia keeps six tank divisions, four of infantry and four motorised, with some three hundred modern tanks in the parks and a doctrine built around firepower. Few countries of its size carry so heavy an armoured share, and the paper does not pretend otherwise.\n\nIts argument is plain. Between the FATO crossings and the Gebet line the Low Lands are open plain, ideal ground for tanks and poor ground for anything else, and the country's oil, arms halls and capital all sit on that plain. The armour exists, the staff writes, so that no neighbour can ever think the plain is cheap to take. What the paper does not settle is how much fuel, ammunition and training that deterrent needs to be real rather than decorative.\n\nThe committee must answer with money. Funding the training the paper asks for means pumping lowland crude into tank engines rather than into export tankers, and it means crews in the field for weeks every year. Sending the paper back for a cheaper answer keeps the treasury calm and the parks full, and leaves the divisions looking stronger on parade than they would be in a crisis.\n\nProvisional gameplay."
 ac_wd_wie.5.a:0 "Fund the training the paper asks for."
 ac_wd_wie.5.b:0 "Ask the staff for a cheaper answer."
 ac_wd_wie.6.t:0 "Four Frontiers on One Desk"
 ac_wd_wie.6.d:0 "For the first time, the customs records of every Wielvakian crossing lie on the same desk in Mankovce. There are four frontiers and four ways of doing things. Toward FATO the posts at the Gangl crossings run long queues and short tempers. Toward Gebet the traffic is local, farmers and market vans. Toward Ratio the trains stop to change crews. Toward Nordlands the roads climb into the mountains and the harbours are small.\n\nThe review finds that each frontier has grown its own habits. Forms differ from post to post, hours are set by whoever commands the station, and complaints from the other side are answered by letter weeks later or not at all. South Gangel is the delicate case. FATO maintains a claim to the district, and every delay or rough inspection there is read on both sides as a statement of some kind.\n\nThe frontier directorate can only reform one frontier properly at a time. Starting with the FATO crossings would address the busiest and most sensitive posts first, at the risk of making a neighbour wonder why it was singled out. Starting with the quieter frontiers would build procedures where nothing is contentious and carry them to South Gangel once they have been tested.\n\nProvisional gameplay."
 ac_wd_wie.6.a:0 "Begin with the FATO crossings."
 ac_wd_wie.6.b:0 "Begin with the quieter frontiers."
 ac_wd_wie.7.t:0 "A Fleet of Three Hulls"
 ac_wd_wie.7.d:0 "The naval review opens on the quay of the larger Vakia harbour with the whole fleet in view: two destroyers and one submarine, all three alongside at once because there is fuel and crew for only one of them to sail on any given day. Behind them stand three slipways, a dry dock that needs new gates and a smaller harbour along the coast with a single pier.\n\nThe admirals argue that the coast is the country's only door to the sea and that ore ships, and one day oil tankers, will use it whatever the navy can do. The army notes that the fleet costs as much each year as an armoured brigade and has never fired a shot in anger. The treasury asks whether a coast this short needs a fleet at all, or only a coast guard with good radios.\n\nThe first question is a practical one. Keeping both destroyers in commission means two crews at sea in turns, real training and an empty fuel line in the budget. Laying one up in reserve frees money and lets its crew train ashore on the slipways and the radar, but a destroyer tied to the quay for a few years rarely sails again without a costly refit.\n\nProvisional gameplay."
 ac_wd_wie.7.a:0 "Keep both destroyers at sea."
 ac_wd_wie.7.b:0 "Lay one up and train its crew ashore."
 ac_wd_wie.8.t:0 "Sixty Aircraft, Two Runways"
 ac_wd_wie.8.d:0 "The air arm's planners spread their maps across the briefing room at the capital field. Wielvakia flies forty-eight fighters and twelve ground attack aircraft from two main bases, the capital's and the Vakia coast's, with a grass strip in South Gangel and nothing at all in Farnlands. Pilots log fewer hours a year than their instructors did, and spares are drawn from one shared store.\n\nEach service wants the air arm for itself. The army wants fighters over the tank divisions on the plain, where any war on the Low Lands would be decided. The navy wants patrols over the coast and the harbour approaches. The civil defence office wants the capital covered first, because one raid on Mankovce would do more damage than any number of raids on fields and harbours.\n\nSixty aircraft cannot do all three. The planners need a first priority to build the next years around: where the radar goes first, where the shelters are dug, which squadrons train for which mission. The others will get what is left over, and every service chief in the room knows that what is left over in an air arm this size is not very much.\n\nProvisional gameplay."
 ac_wd_wie.8.a:0 "Cover the capital first."
 ac_wd_wie.8.b:0 "Cover the tank divisions first."
 ac_wd_wie.8.c:0 "Cover the coast first."
 ac_wd_wie.9.t:0 "War Beyond the Gebet Frontier"
 ac_wd_wie.9.d:0 "The first wire reports reach the situation room under the capital before dawn: Belka has gone to war. Gebet, which shares a frontier with Belka on one side and with South Gangel and Alaoboa on the other, is a neighbour whose traders and day workers cross into Wielvakia every morning. Within hours, the telephones at the frontier posts are ringing with questions nobody can answer.\n\nWielvakia is not a party to the war, and the government says so in its first statement. But the frontier commands are on alert, the reservists of the South Gangel garrisons are checking their call-up papers, and the oil terminals on the plain are suddenly worth guarding. Shopkeepers in the frontier towns report queues for flour, candles and batteries. The armoured divisions, built for exactly this ground, sit in their parks waiting for orders.\n\nThe cabinet's first decision concerns the frontier towns. Preparing them now for families who may cross, with halls, kitchens and registration desks, would cost money and might itself suggest that the government expects the worst. Leaving the towns as they are keeps the country calm for the moment, and leaves the mayors to improvise if the war comes closer to the frontier than anyone hopes.\n\nProvisional gameplay."
 ac_wd_wie.9.a:0 "Prepare the frontier towns for arrivals."
 ac_wd_wie.9.b:0 "Leave the towns as they are for now."
 ac_wd_wie.10.t:0 "The First Arrivals at South Gangel"
 ac_wd_wie.10.d:0 "Ten days after the halls were readied, the first families from Gebet arrive at the South Gangel crossings by bus, car and farm cart. Most of them have relatives in Wielvakia and expect to stay for weeks rather than years. They bring their papers, their savings and stories of roads closed by soldiers, and the frontier police register them at trestle tables set up in the customs sheds.\n\nThe numbers are manageable for now. The difficulty is everything around them. The reception halls are school gyms whose pupils have nowhere else to go, the district hospital is already short of beds, and local landlords have doubled their rents overnight. A few lowland politicians complain that Wielvakia is taking on a burden that belongs to richer countries further from the war.\n\nThe district governor asks the capital for a ruling. The arrivals could stay in South Gangel, close to the frontier and their own homes, housed in halls and spare rooms at public expense. Or they could be moved on to camps on the edge of the capital, where services are better and the frontier district can return to normal, at the cost of sending frightened families further from everything they know.\n\nProvisional gameplay."
 ac_wd_wie.10.a:0 "Keep them in the South Gangel halls."
 ac_wd_wie.10.b:0 "Move them on to camps near the capital."
 ac_wd_wie.11.t:0 "Mankovce Hears the Asteroid News"
 ac_wd_wie.11.d:0 "The evening radio carries the FCU President's broadcast into every kitchen in Mankovce: Ulysses is on a collision course, and a defence against it is being prepared. What the broadcast cannot tell anyone is which countries lie under the debris. Wielvakia has no telescope of its own to consult, and by the next morning the capital's hardware shops have sold out of shovels, candles and tinned food.\n\nThe civil defence commission meets the same week and discovers how little it has to work with. The capital has no public shelters worth the name. The lowland towns sit on open plain with nothing to hide under, while the old mine galleries of Vakia are the deepest holes in the country and belong to private owners. Railway timetables assume that nobody ever needs to leave a city all at once.\n\nBefore it can weigh shelters against evacuation, the commission has a smaller crisis on its desk. Shopkeepers have doubled their prices on torches, water cans and tinned meat, and the queues outside are growing angrier by the day. Capping those prices and rationing the scarcest goods would calm the queues, empty the shelves faster and leave the ministry to find new supplies. Leaving the shops alone lets high prices pull fresh stock in from abroad, at the cost of a capital convinced that its merchants are profiting from fear.\n\nProvisional gameplay."
 ac_wd_wie.11.a:0 "Cap prices and ration the scarcest goods."
 ac_wd_wie.11.b:0 "Let high prices bring in new stock."
 WIE_wd_chamber_cabinet_office:0 "Cabinet of the Wielvakian Chamber"
 WIE_wd_chamber_cabinet_office_desc:0 "A cabinet drawn from the majority of a chamber elected in Alaoboa, Vakia, Farnlands and South Gangel, governing collectively and answerable to the deputies. Provisional gameplay office with no named holder."
 WIE_wd_staff_council_office:0 "Governing Council of the Staff"
 WIE_wd_staff_council_office_desc:0 "Senior officers of the general staff sitting as a council, with ministries reporting to them until the frontiers are judged settled. Provisional gameplay office with no named holder."
 WIE_wd_state_directorate_office:0 "Directorate of the Wielvakian State"
 WIE_wd_state_directorate_office_desc:0 "A directorate drawn from the nationalist movement and its allies in the frontier districts, governing by decree in the name of the nation. Provisional gameplay office with no named holder."
 ac_wd_wie_decisions:0 "Wielvakia: National Measures"
 ac_wd_wie_decisions_desc:0 "Measures from the national programme of Wielvakia. Provisional gameplay unless a source ledger row says otherwise."
 WIE_wd_sell_crude_forward_decision:0 "Sell Lowland Crude Forward"
 WIE_wd_sell_crude_forward_decision_desc:0 "The treasury sells a season of lowland crude before it is pumped and spends the money now. Repeatable once a year; the fields carry less investment while the sale runs."
 WIE_wd_plain_manoeuvres_decision:0 "Hold Manoeuvres on the Plain"
 WIE_wd_plain_manoeuvres_decision_desc:0 "Whole divisions take the field on the Farnlands range for three months. Repeatable once a year; the manoeuvres burn training fuel."
 WIE_wd_joint_state_session_decision:0 "Convene the State Councils Together"
 WIE_wd_joint_state_session_decision_desc:0 "The four state councils sit together in the capital for a week of public questions. Repeatable once a year."
 WIE_wd_nadomlin_radar_decision:0 "A Radar Mast at Nadomlin"
 WIE_wd_nadomlin_radar_decision_desc:0 "Engineers raise a radar mast beside the Nadomlin dispersal field to cover the northern frontiers. A one-time works programme."
 WIE_wd_send_relief_train_decision:0 "Send a Relief Train to the Frontier"
 WIE_wd_send_relief_train_decision_desc:0 "A train of food and medicine runs to the Gebet frontier for the families on both sides. Once only; it costs political capital at home."
 WIE_wd_open_harbour_dues_decision:0 "Cut the Harbour Dues for a Season"
 WIE_wd_open_harbour_dues_decision_desc:0 "The Vakia harbours halve their dues for visiting merchant ships for six months. Repeatable once a year."
