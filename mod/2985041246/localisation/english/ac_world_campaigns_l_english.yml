 CSO_wc_e1_air_opened_desc:0 "One Air Service, Many Tasks: the national discussion has opened."
 CSO_wc_e1_air_operate:0 "Fund: One Air Service, Many Tasks"
 CSO_wc_e1_air_operate_desc:0 "Pay 25 political power and, when the full fiscal owner is ready, 0.02 billion. Carry out the selected programme for 90 days. Territory loss or capitulation interrupts the work without a completion reward. Paid costs are retained; retry remains available. This operation grants no factories, units or equipment."
