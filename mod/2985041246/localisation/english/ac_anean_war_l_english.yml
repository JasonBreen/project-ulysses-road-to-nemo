 ac_eew_eva_war_footing:0 "Estovakia at War"
 ac_eew_eva_war_footing_desc:0 "The ACES Chronicle records Estovakia's invasion of Gracemeria and the outbreak of the Emmeria-Estovakia War for 30 August 2015 (2015 / 08.30). The federation is on a war footing until the fighting actually ends; this campaign fixes no end date."
 ac_eew_emm_war_footing:0 "Emmeria at War"
 ac_eew_emm_war_footing_desc:0 "The ACES Chronicle records Estovakia's invasion of Gracemeria and the outbreak of the Emmeria-Estovakia War for 30 August 2015 (2015 / 08.30). The republic is on a war footing until the fighting actually ends; this campaign fixes no end date."
 ac_eew_emm_capital_occupied:0 "Gracemeria Occupied"
 ac_eew_emm_capital_occupied_desc:0 "Estovakian forces hold the capital, as the Chronicle records they seized Gracemeria (2015 / 08.30). The republic governs from elsewhere until Emmerian forces actually hold the capital again; the values are provisional gameplay."
 ac_eew_emm_khesed_secured:0 "Khesed Island Secured"
 ac_eew_emm_khesed_secured_desc:0 "The Chronicle records that Bartolomeo Fortress fell and Emmerian forces established full control of Khesed Island (2015 / 12.27). The western base steadies the republic for ninety days; the value is provisional gameplay."
 ac_eew_eva_moloch_retreat:0 "The Moloch Desert Retreat"
 ac_eew_eva_moloch_retreat_desc:0 "The Chronicle records that Estovakian forces retreated after a large-scale battle in the Moloch Desert (2016 / 03.25). Army organisation suffers for sixty days; the value is provisional gameplay."
 ac_eew_eva_coup:0 "The Coup"
 ac_eew_eva_coup_desc:0 "The Chronicle records that an antigovernment coup in Estovakia left its forces unable to fight (2016 / 04.01). The federation's will to fight collapses for 120 days; the value is provisional gameplay. Its politics are not changed by script."
 ac_eew_eva_restraint_kept:0 "A Declaration Withheld"
 ac_eew_eva_restraint_kept_desc:0 "Estovakia's government withheld the invasion the ACES Chronicle records for 30 August 2015 (2015 / 08.30), on the civil-war policies both governments chose and a record of contact between them. This earned alternative is provisional gameplay."
 ac_eew_eva_fought_on:0 "Fighting On After the Coup"
 ac_eew_eva_fought_on_desc:0 "Estovakia refused the ceasefire agreement the ACES Chronicle records for 1 April 2016 (2016 / 04.01) and fights on. This provisional alternative weighs on the federation for 180 days."
 ac_sp_aerial_fleet_initiative:0 "The Aerial Fleet"
 ac_sp_aerial_fleet_initiative_desc:0 "§YProvisional gameplay§! reward. The Aerial Fleet Initiative is complete: an Aigaion-class heavy command cruiser escorted by Kottos-class electronic support and Gyges-class fire support platforms (Super Weapons, Aigaion, Kottos and Gyges). The aircraft remain text, not units; the Chronicle records the fleet's destruction (2016 / 02.20)."
 ac_sp_chandelier_railgun:0 "The Chandelier"
 ac_sp_chandelier_railgun_desc:0 "§YProvisional gameplay§! reward. The Chandelier railgun, built to destroy fragments of Ulysses, is complete (Super Weapons, Chandelier). It is never fired by script; the Chronicle records its destruction on Sonne Island (2016 / 04.01)."
 ac_eew.1.t:0 "The Emmeria-Estovakia War Begins"
 ac_eew.1.d:0 "Estovakian forces have begun an invasion of Gracemeria, the capital of the Republic of Emmeria. Base and carrier air squadrons could not counter the heavy command cruiser Aigaion, and Emmerian forces have decided to retreat to western Anea. The ACES Chronicle records the outbreak of the Emmeria-Estovakia War for this day (2015 / 08.30).\n\nThe capital's fall is reported only when Estovakian forces actually hold it; the war ends when the fighting actually ends, not on a calendar date."
 ac_eew.1.a:0 "Anea is at war."
 ac_eew.2.t:0 "The Invasion That Estovakia Withheld"
 ac_eew.2.d:0 "30 August 2015 has passed without an Estovakian invasion of Emmeria. Both governments' choices in the civil war years and a record of contact between them gave Estovakia's government the standing to withhold the invasion the ACES Chronicle records for this day (2015 / 08.30).\n\nThis is an earned alternative to the official record and is provisional gameplay. Nothing prevents a later war by other means."
 ac_eew.2.a:0 "Record the restraint."
 ac_eew.3.t:0 "Emmeria and Estovakia Already at War"
 ac_eew.3.d:0 "On the date the ACES Chronicle gives for Estovakia's invasion of Emmeria (2015 / 08.30), the two countries were already fighting one another by other means.\n\nThe owner records that war and observes it from outside: it asserts none of the official course and issues no further dated news. The war's end will be recorded when the fighting actually stops."
 ac_eew.3.a:0 "Observe the war as it is."
 ac_eew.4.t:0 "Other Fighting Enters the Anean War"
 ac_eew.4.d:0 "A third country is now at war with Emmeria or Estovakia. The war between the two is no longer the complete explanation of the fighting, and the owner moves to external observation.\n\nThe dated news of the official course stops here. The war's end will still be recorded when the fighting between Emmeria and Estovakia actually stops."
 ac_eew.4.a:0 "Observe the wider war."
 ac_eew.7.t:0 "A Ceasefire Agreement"
 ac_eew.7.d:0 "Emmeria and Estovakia have agreed a ceasefire. The ACES Chronicle records the ceasefire agreement after the coup that left Estovakia's forces unable to fight (2016 / 04.01), and the official abstract records that it ended the conflict.\n\nThis campaign records the end on the day the agreement was actually signed."
 ac_eew.7.a:0 "Begin the accounting."
 ac_eew.8.t:0 "An Early Settlement"
 ac_eew.8.d:0 "Emmeria has offered Estovakia terms after the liberation of its capital, and the fighting has stopped before the coup and ceasefire the ACES Chronicle records for 1 April 2016 (2016 / 04.01).\n\nThis is an earned alternative to the official record and is provisional gameplay. The war's account begins."
 ac_eew.8.a:0 "Begin the accounting."
 ac_eew.9.t:0 "Estovakia Capitulates"
 ac_eew.9.d:0 "Estovakia has capitulated. The war between Emmeria and Estovakia ends in an Emmerian victory.\n\nThe ACES Chronicle records a different end: a coup in Estovakia and a ceasefire agreement (2016 / 04.01). This outcome is the actual result of the campaign, not the official one."
 ac_eew.9.a:0 "Record the outcome."
 ac_eew.10.t:0 "Emmeria Capitulates"
 ac_eew.10.d:0 "Emmeria has capitulated. The war between Emmeria and Estovakia ends in an Estovakian victory.\n\nThe ACES Chronicle records a different end: the liberation of Gracemeria (2016 / 03.31), a coup in Estovakia and a ceasefire agreement (2016 / 04.01). This outcome is the actual result of the campaign, not the official one."
 ac_eew.10.a:0 "Record the outcome."
 ac_eew.11.t:0 "The Emmeria-Estovakia War Ends"
 ac_eew.11.d:0 "The fighting between Emmeria and Estovakia has stopped. Neither country capitulated, and no ceasefire was signed through this owner.\n\nThe ACES Chronicle records the war's end in a ceasefire agreement after the coup of 1 April 2016 (2016 / 04.01). This campaign records the end on the day the fighting actually ceased, which is today."
 ac_eew.11.a:0 "Begin the accounting."
 ac_eew.12.t:0 "The Fighting Between Emmeria and Estovakia Stops"
 ac_eew.12.d:0 "The fighting between Emmeria and Estovakia has stopped. The owner observed this war from outside and asserts nothing about how it was fought.\n\nThe ACES Chronicle's course for the war (2015 / 08.30 to 2016 / 04.01) is not asserted here; the end is recorded on the day the fighting actually ceased."
 ac_eew.12.a:0 "Record the cessation."
 ac_eew.13.t:0 "Estovakia Fights On"
 ac_eew.13.d:0 "Estovakia has refused the ceasefire agreement the ACES Chronicle records after the coup of 1 April 2016 (2016 / 04.01) and fights on.\n\nThis is a provisional alternative to the official record. The owner issues no further dated news; the war's end will be recorded when the fighting actually stops."
 ac_eew.13.a:0 "The war goes on."
 ac_eew.14.t:0 "A Settlement in Estovakia, No March on Gracemeria"
 ac_eew.14.d:0 "Estovakia's civil war ended in a negotiated settlement in this history, and the federation that signed it is not the one the ACES Chronicle records invading Emmeria (2015 / 08.30).\n\nThe owner closes the sourced route: no war is invented in its place. Both governments' records of these years continue in their own branches."
 ac_eew.14.a:0 "Record the divergence."
 ac_eew.16.t:0 "An Aircraft Signature Off Estovakia"
 ac_eew.16.d:0 "Yuktobanian spy satellites have spotted a massive aircraft signature near the southeast coast of Estovakia (2015 / 04.21).\n\nThe ACES Chronicle records the sighting and does not say what the signature was. This campaign asserts nothing beyond the record."
 ac_eew.16.a:0 "Note the sighting."
 ac_eew.20.t:0 "Gracemeria Falls"
 ac_eew.20.d:0 "Estovakian forces hold Gracemeria, the capital of the Republic of Emmeria, as the ACES Chronicle records they seized it on 30 August 2015 (2015 / 08.30). The Emmerian government governs from the west.\n\nThis campaign reports the fall only because Estovakian forces actually hold the capital; no state was moved by script."
 ac_eew.20.a:0 "The capital is lost."
 ac_eew.21.t:0 "Fireballs Over the Retreat"
 ac_eew.21.d:0 "Witnesses report multiple giant fireballs attacking Emmerian forces as they retreat, in several places at once (2015 / 11.XX).\n\nThe ACES Chronicle records the sighting for November 2015 without giving the day or saying what the fireballs were. This campaign reports it in that month and asserts no cause."
 ac_eew.21.a:0 "Note the reports."
 ac_eew.22.t:0 "Bombers Over Vitoze"
 ac_eew.22.d:0 "Estovakia has sent a large formation of bombers toward the city of Vitoze on Khesed Island, and the remaining Emmerian forces based at Campagna Airport have intercepted them (2015 / 11.24).\n\nKhesed Island is not on this map; the record is reported as the Chronicle gives it."
 ac_eew.22.a:0 "The island holds."
 ac_eew.23.t:0 "The Breakthrough at Sipli Field"
 ac_eew.23.d:0 "Aiming to retake Khesed Island, Emmerian ground forces have broken through the Estovakian front-line base at Sipli Field (2015 / 11.27).\n\nThe Chronicle records the breakthrough; no territory changes hands by script."
 ac_eew.23.a:0 "Press on."
 ac_eew.24.t:0 "Khesed Island Secured"
 ac_eew.24.d:0 "Bartolomeo Fortress has fallen, and Emmerian forces have established full control of Khesed Island (2015 / 12.27).\n\nThe island is not on this map; the republic's western base is represented by a timed spirit, which is provisional gameplay."
 ac_eew.24.a:0 "The west is secure."
 ac_eew.25.t:0 "The Landing at Rargom Beach"
 ac_eew.25.d:0 "Emmerian land, air and sea forces have made a successful landing offensive at Rargom Beach on the western edge of Anea and established a bridgehead (2016 / 01.26).\n\nThe Chronicle records the landing; no territory changes hands by script."
 ac_eew.25.a:0 "Hold the bridgehead."
 ac_eew.26.t:0 "Along the Selumna Peaks"
 ac_eew.26.d:0 "Emmerian ground forces are moving east along the Selumna Peaks (2016 / 02.12).\n\nThe Chronicle records the advance; this campaign records no more."
 ac_eew.26.a:0 "Keep moving."
 ac_eew.27.t:0 "Cavallia Air Force Base Captured"
 ac_eew.27.d:0 "Emmerian forces have captured Cavallia Air Force Base in San Loma (2016 / 02.15).\n\nThe Chronicle records the capture; no state changes hands by script."
 ac_eew.27.a:0 "Take the base."
 ac_eew.28.t:0 "The Aerial Fleet Destroyed"
 ac_eew.28.d:0 "The Emmerian Air Force has attacked and destroyed the Aerial Fleet, restoring air superiority to Emmerian forces (2016 / 02.20).\n\nThis campaign reports the destruction because the Aerial Fleet project was completed; its reward is removed."
 ac_eew.28.a:0 "The sky is clear."
 ac_eew.29.t:0 "Ragno Fortress"
 ac_eew.29.d:0 "Emmerian forces have made a decisive strike on Ragno Fortress in Grageo Canyon (2016 / 03.06).\n\nThe Chronicle records the strike; this campaign records no more."
 ac_eew.29.a:0 "Note the strike."
 ac_eew.30.t:0 "The Moloch Desert"
 ac_eew.30.d:0 "A large-scale battle between Emmeria and Estovakia has broken out in the Moloch Desert, and Estovakian forces have retreated (2016 / 03.25).\n\nThe retreat weighs on Estovakia's army for sixty days; the value is provisional gameplay."
 ac_eew.30.a:0 "Count the cost."
 ac_eew.31.t:0 "Fort Norton"
 ac_eew.31.d:0 "Emmerian forces have assaulted the mining city of Fort Norton, and Estovakia has been prevented from transporting catalysts for weapons of mass destruction (2016 / 03.26).\n\nThe Chronicle records the assault and the catalysts; this campaign records no more."
 ac_eew.31.a:0 "Note the record."
 ac_eew.32.t:0 "Gracemeria Liberated"
 ac_eew.32.d:0 "Emmerian forces have liberated Gracemeria. That night a large number of cruise missiles were fired at the city and shot down in midair by patrolling fighters (2016 / 03.31).\n\nThis campaign reports the liberation because Emmerian forces actually hold the capital again."
 ac_eew.32.a:0 "The capital is free."
 ac_eew.33.t:0 "The Coup in Estovakia"
 ac_eew.33.d:0 "An antigovernment coup in Estovakia has left its forces unable to fight. Gustav Dvornik, one of the main architects of the invasion of Emmeria, is dead (2016 / 04.01).\n\nThe ACES Chronicle records that a ceasefire agreement followed. The federation's politics are not changed by script; its government must now answer."
 ac_eew.33.a:0 "The war is ending."
 ac_eew.34.t:0 "The Chandelier Destroyed"
 ac_eew.34.d:0 "Emmerian forces have destroyed the Chandelier on Sonne Island (2016 / 04.01).\n\nThis campaign reports the destruction because the Chandelier project was completed; its reward is removed. The railgun was never fired by script."
 ac_eew.34.a:0 "The railgun is gone."
 ac_eew.5.t:0 "The Invasion of 30 August 2015"
 ac_eew.5.d:0 "The ACES Chronicle records that on this day Estovakian forces began an invasion of Gracemeria, the capital of the Republic of Emmeria, and that the Emmeria-Estovakia War broke out (2015 / 08.30). It records no reason for the invasion, and this campaign asserts none.\n\nThe government can begin the invasion the record describes, or withhold it, if the standing to withhold was earned: the federation's civil-war talks settled on a negotiated peace, Emmeria's aid kept its monitors, and a record of contact between the two survives. Withholding is a provisional alternative to the official record."
 ac_eew.5.a:0 "Begin the invasion."
 ac_eew.5.b:0 "Withhold the invasion."
 ac_eew.6.t:0 "The Ceasefire Agreement"
 ac_eew.6.d:0 "The coup has left the federation's forces unable to fight. The ACES Chronicle records that a ceasefire agreement followed (2016 / 04.01).\n\nThe government can sign the ceasefire the record describes, or fight on. Fighting on is a provisional alternative; the owner then issues no further dated news, and the war's end is recorded when the fighting actually stops."
 ac_eew.6.a:0 "Sign the ceasefire."
 ac_eew.6.b:0 "Fight on."
 EMM_ew_early_settlement:0 "Offer Terms After the Liberation"
 EMM_ew_early_settlement_desc:0 "Offer Estovakia terms once Gracemeria is free (2016 / 03.31), before the coup and ceasefire the Chronicle records for 1 April 2016 (2016 / 04.01). Requires the return with terms as policy. If the engine accepts the peace, the war ends now; this earned alternative is provisional gameplay."
 ac_sp_aerial_fleet:0 "The Aerial Fleet"
 ac_sp_aerial_fleet_desc:0 "The Aerial Fleet Initiative (the P/F-X program): an Aigaion-class heavy command cruiser that fires Nimbus cruise missiles and serves as an airborne carrier, escorted by Kottos-class electronic support and Gyges-class fire support platforms (Super Weapons, Aigaion, Kottos and Gyges). Requires the civil war won by the Eastern Faction and the maintenance base rebuilt.\n\n§YProvisional gameplay§!: the gate, timing and reward values are balance choices. The Chronicle records the fleet's destruction on 20 February 2016."
 ac_sp_aerial_fleet_reward_escort_doctrine:0 "Escort Doctrine"
 ac_sp_aerial_fleet_reward_escort_doctrine_desc:0 "The cruiser's escorts can be built around electronic support first, jamming the enemy's radar and communications, or around fire support first, with multi-barrel cannons and missiles beside the cruiser."
 ac_sp_aerial_fleet_reward_escort_doctrine_electronic:0 "Electronic support first"
 ac_sp_aerial_fleet_reward_escort_doctrine_fire_support:0 "Fire support first"
 ac_sp_chandelier:0 "The Chandelier"
 ac_sp_chandelier_desc:0 "The Chandelier railgun, developed to destroy fragments of Ulysses and incomplete when the asteroid arrived (Super Weapons, Chandelier). Requires the railgun's files reopened and a funded period of construction.\n\n§YProvisional gameplay§!: the gate, timing and reward values are balance choices. It is never fired by script; the Chronicle records its destruction on Sonne Island on 1 April 2016."
 ac_sp_chandelier_reward_firing_rules:0 "Firing Rules"
 ac_sp_chandelier_reward_firing_rules_desc:0 "The railgun's firing rules can be written into its control systems before the first test, or the general staff can set its own procedures and the rules follow."
 ac_sp_chandelier_reward_firing_rules_written:0 "Build the rules into the controls"
 ac_sp_chandelier_reward_firing_rules_staff:0 "Let the staff set procedures"
 ac_sp_tag_aerial_fleet:0 "Aerial Fleet Projects"
 ac_sp_tag_aerial_fleet_speed_factor:0 "Aerial Fleet Projects Speed"
 ac_sp_tag_aerial_fleet_speed_factor_tt:0 " $ac_sp_tag_aerial_fleet_speed_factor$: $RIGHT|+=%1$"
 ac_superweapons_aerial_fleet:0 "The Aerial Fleet"
 ac_superweapons_aerial_fleet_desc:0 "Without the special-projects feature, the Aerial Fleet programme runs as a timed decision and grants the same reward as the project (Super Weapons, Aigaion). It is cancelled if the Chronicle's destruction of the fleet is reached first.\n\n§YProvisional gameplay§!: cost and duration are balance choices."
 ac_superweapons_chandelier:0 "The Chandelier"
 ac_superweapons_chandelier_desc:0 "Without the special-projects feature, the Chandelier programme runs as a timed decision and grants the same reward as the project (Super Weapons, Chandelier). It is cancelled if the Chronicle's destruction of the railgun is reached first.\n\n§YProvisional gameplay§!: cost and duration are balance choices."
 ac_eew_status_0:0 "Ended: Estovakia capitulated. The ceasefire the Chronicle records for 1 April 2016 did not occur."
 ac_eew_status_1:0 "Ended: Emmeria capitulated. The ceasefire the Chronicle records for 1 April 2016 did not occur."
 ac_eew_status_2:0 "Ended: the ceasefire was signed after the coup, as the official course records (2016 / 04.01)."
 ac_eew_status_3:0 "Ended: an early settlement was earned and signed after the liberation (provisional gameplay)."
 ac_eew_status_4:0 "Ended: a ceasefire was signed before the official course had run its length."
 ac_eew_status_5:0 "Ended: the fighting stopped while the owner observed the war from outside."
 ac_eew_status_6:0 "Ended: the fighting stopped without a ceasefire signed through this owner."
 ac_eew_status_7:0 "Running after the coup: Estovakia refused the ceasefire; the end is recorded when the fighting stops."
 ac_eew_status_8:0 "Under external observation: the ceasefire was signed but the engine kept the war."
 ac_eew_status_9:0 "Under external observation: other fighting entered the war; the official course is no longer asserted."
 ac_eew_status_10:0 "Under external observation: the pair was already at war on the Chronicle's invasion date."
 ac_eew_status_11:0 "Running on the official course since the invasion of 30 August 2015 (2015 / 08.30)."
 ac_eew_status_12:0 "Withheld: Estovakia withheld the invasion on its earned standing (provisional gameplay)."
 ac_eew_status_13:0 "Closed: Estovakia's civil war ended in a negotiated settlement; the sourced 2015 route does not apply."
 ac_eew_status_14:0 "Closed: the Eastern Faction did not win Estovakia's civil war here; the sourced 2015 route is unreachable."
 ac_eew_status_15:0 "Closed: the pair could not fight the recorded war, or the record's dates had passed."
 ac_eew_status_16:0 "Pending: the Chronicle records Estovakia's invasion of Emmeria for 30 August 2015."
 EMM_ew_route_context_0:0 "Across the border the Eastern Faction won Estovakia's civil war, as the official record says it did. The road the record describes for 2015 runs through this history."
 EMM_ew_route_context_1:0 "Across the border Estovakia's civil war ended in a negotiated settlement. The official record's 2015 war belongs to a history this republic's neighbour did not have."
 EMM_ew_route_context_2:0 "Across the border Estovakia's civil war has not ended. The official record's 2015 war needs a neighbour that is no longer fighting itself."
 EMM_ew_route_context_3:0 "Across the border Estovakia has its own records of the civil war years."
 EVA_ew_route_context_0:0 "The Eastern Faction won the civil war, as the official record says it did, and its officers hold the federation's offices."
 EVA_ew_route_context_1:0 "The civil war ended in a negotiated settlement, and the factions that signed it share the federation's offices."
 EVA_ew_route_context_2:0 "The civil war has not ended, and the federation's offices are held by whoever holds the buildings."
 EVA_ew_route_context_3:0 "The civil war years are in the files, with their obligations."
