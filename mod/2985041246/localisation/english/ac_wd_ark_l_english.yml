 ac_wd_ark.1.t:0 "Who Governs the Duchy"
 ac_wd_ark.1.d:0 "The National Administration has governed Arklith since the vote of 1990, and it has done so competently enough that few people ask by what right. The ministries in Cabaria run, the yards launch their hulls and the Llano factories keep their shifts. Yet the Duchy has no election on its calendar, and the administration's own lawyers concede that its mandate rests more on habit than on any written grant.\n\nPublishing the administration's powers has brought every faction into the open. Loyalists of the ducal house, still about a third of the country by the old measures, want the title to mean something again, either beside a council of ministers or above it. The owners of the yards, shipping lines and Nieblo mines want a board that runs the state the way they run their companies. A smaller but organised camp in the Llano and the port unions wants an elected assembly and nothing else.\n\nNothing has been decided yet. What the administration chooses today is how the argument will be held: openly, with the press and the provinces watching, or quietly in the corridors of Cabaria, where the great houses and the ducal household already have friends. Either choice will be remembered by the camp it disappoints.\n\nProvisional gameplay."
 ac_wd_ark.1.a:0 "Hold the argument in public."
 ac_wd_ark.1.b:0 "Keep it inside the ministries."
 ac_wd_ark.2.t:0 "Port and Plain"
 ac_wd_ark.2.d:0 "Ask in Cabaria where the country's future lies and the answer points to the harbours: Puerto Tranquilidad and Cabarion, the yards along the coast, the merchant fleet that carries Arklith's name to foreign ports. Ask in the city of Arklith on the Llano and the answer is the factories, the seven great works and the workshops around them, and a population larger than any coastal province can claim.\n\nThe state has never resolved which of the two it serves first. Officials commute by the coast railway, files go missing between offices, and both regions are convinced the other receives the larger share of the budget. Planners have drawn up three answers: move the economic ministries inland, keep everything by the harbour, or split the government between them and accept the cost of running it from two cities.\n\nBefore any of those plans is chosen, the government must decide how to frame the question. It can treat it as a technical matter of efficiency, to be settled by surveys of traffic and cost, or as a political bargain between two regions that both believe they carry the country. The surveys will be quicker. The bargain will last longer.\n\nProvisional gameplay."
 ac_wd_ark.2.a:0 "Let the surveys decide."
 ac_wd_ark_2_a:0 "Let the surveys decide."
 ac_wd_ark.2.b:0 "Bargain with both regions."
 ac_wd_ark.3.t:0 "The Order Book"
 ac_wd_ark.3.d:0 "The inspectors' report on the twenty slipways reads like a ship's log of the last decade. Some berths at Arklith del Norte and Arklith del Sur have worked without a pause; others on the Cabar coast have built nothing larger than a tug in three years. Cranes, welding gear and dry docks vary from modern to museum pieces, often in the same yard. Payrolls are full everywhere, because no yard owner wants to be the first to dismiss skilled hands.\n\nThe order book itself is thin. Foreign shipping companies have plenty of yards to choose from, and Arklith wins contracts mainly on price, with the state's credit making up the difference. The navy has ordered little beyond maintenance. Repair work comes and goes with the passing traffic. Every owner has a plan to fix this, and every plan requires the treasury.\n\nThe government must decide how much of the report to release. Published in full, it will show foreign buyers exactly where the yards are weak, and give the unions a clear view of which berths are at risk. Kept within the ministry and the owners' association, it will guide a quieter reform, at the cost of rumours along the coast that something is being hidden.\n\nProvisional gameplay."
 ac_wd_ark.3.a:0 "Publish it for the yards and the unions."
 ac_wd_ark_3_a:0 "Publish it for the yards and the unions."
 ac_wd_ark.3.b:0 "Share it with the owners only."
 ac_wd_ark.4.t:0 "Under Whose Flag"
 ac_wd_ark.4.d:0 "The shipping office has finished its count of the merchant fleet, and the results surprise even its own clerks. Several hundred ships carry the Arklith flag, far more than a country of eight provinces could load with its own trade. Some are owned and crewed at home and call at Puerto Tranquilidad every month. Many more belong to foreign companies that registered here for low fees and have never seen the coast.\n\nThe foreign-owned hulls pay their dues on time and ask for little. They also bring risk: old ships, crews of uncertain training and owners whose other business is not always visible. A single disaster at sea involving an Arklith-flagged ship would land on the Duchy's reputation regardless of who owned it. Meanwhile, the domestic lines complain that the open register undercuts them on every route they sail.\n\nTwo opinions dominate the shipping office. One says the register is a business like any other and should be run for revenue, with inspections tight enough to avoid scandal. The other says a flag should mean something, and that a smaller, national fleet would serve the country better in a crisis. Before choosing, the office must decide whom to consult.\n\nProvisional gameplay."
 ac_wd_ark.4.a:0 "Consult the foreign owners as well."
 ac_wd_ark.4.b:0 "Consult only the domestic lines and crews."
 ac_wd_ark.5.t:0 "The Highland Ledger"
 ac_wd_ark.5.d:0 "The survey teams come down from the Nieblo with crates of core samples and notebooks full of warnings. The aluminium and tungsten seams of both highland provinces are richer than the old maps suggested, especially in the eastern valleys. The shafts that reach them are in worse condition than anyone admitted: ventilation that fails in the warm months, props past their age and escape routes that end in rock.\n\nThe highland towns depend on the mines and the arms plants beside them, which together employ most working adults in some valleys. Wages are low, prices are high and the roads to the Llano close for days at a time in the rains. The mining families have learned not to expect much from Cabaria. Their delegates have nonetheless travelled down with the survey, to make sure the report is read.\n\nTwo proposals are already circulating. The state could bring every mine and plant under one public authority, or lease the seams to the commercial houses for investment and royalties. Before either can be argued, the government must decide what it says to the delegates who are waiting in the corridor, and whether it promises them anything now.\n\nProvisional gameplay."
 ac_wd_ark.5.a:0 "Promise safety first, output second."
 ac_wd_ark.5.b:0 "Promise investment and jobs."
 ac_wd_ark_5_b:0 "Promise investment and jobs."
 ac_wd_ark.6.t:0 "The Works Council Meets"
 ac_wd_ark.6.d:0 "For the first time, the owners of the seven great works on the Llano, the unions that organise their shifts and the city council of Arklith sit in one room with a single agenda. The meeting is stiff. Owners speak of energy prices and foreign competition; union delegates speak of housing, overtime and the workers who arrive each week from the highlands and the coast. The city's officials mostly take notes.\n\nBeneath the formalities, everyone knows what the plain needs. Its machine tools are old, its engineers are few and its power supply falters whenever several works run full shifts at once. The works make almost everything the country uses, from buses to rifles to pump housings, and almost none of it is made as well as it could be. Foreign buyers have noticed.\n\nThe council's first decision is about its own character. It can become a planning body with access to the ministries and a budget of its own, or remain a forum where problems are aired and settled by the parties themselves. A planning body would move faster and carry the state's weight. A forum would keep the government at arm's length from wages and prices.\n\nProvisional gameplay."
 ac_wd_ark.6.a:0 "Make it a planning body."
 ac_wd_ark_6_a:0 "Make it a planning body."
 ac_wd_ark.6.b:0 "Keep it a forum."
 ac_wd_ark.7.t:0 "The Army Counts Its Rifles"
 ac_wd_ark.7.d:0 "The general staff's audit runs to several volumes, and the summary is blunt. Arklith has an army sized for a small country with no enemies, which is what it believes itself to be. Garrisons in every province maintain their barracks and parade grounds. The mountain detachment in the Nieblo trains hard. Elsewhere, trucks wait for parts, artillery waits for crews and many soldiers have not fired a live round in a year.\n\nPublic interest is close to nil. War support sits near the bottom of every measure the ministries track, and most voters, asked about defence, mention the navy's escorts protecting the merchant fleet before they mention the army at all. The officers know that any request for money will be compared with the yards, the highlands and the metropolis, and lose.\n\nThe staff therefore proposes to begin with what costs least: repair, reorganisation and honest planning. The question is how loudly to say so. A public report would invite debate and perhaps support. A confidential one would avoid alarming anyone and keep the army's weaknesses away from foreign eyes, at the price of another decade of indifference.\n\nProvisional gameplay."
 ac_wd_ark.7.a:0 "Publish an honest summary."
 ac_wd_ark.7.b:0 "Keep the audit confidential."
 ac_wd_ark.8.t:0 "Four Frontiers"
 ac_wd_ark.8.d:0 "The frontier review lays the country's borders out on a single table in the foreign office in Cabaria. To the east, Perbla, beyond the Halloma Basin and the Cabar hills, a larger kingdom with old friends of its own. To the south, Leasath along the edge of the Llano and the Nieblo passes. Past Eastern Nieblo, Dakrain. On the southern edge of Arklith del Sur, the Gibraltar Mining Zone and its mining administration.\n\nNone of these frontiers is in dispute, and the review does not propose to change any of them. What it finds is that each is managed by a different ministry, under different rules, with different priorities. Customs officials at the Halloma crossings work to one code; border police in the Nieblo passes to another. Nobody in Cabaria has ever asked whether the four policies make sense together.\n\nThe review's authors offer two broad directions: open the crossings to trade and transit, or keep them courteous but watchful and promise nothing to anyone. Before that choice, the government must decide how much to say to the neighbours about the review itself. Openness would reassure them. Discretion would keep options available.\n\nProvisional gameplay."
 ac_wd_ark.8.a:0 "Inform every neighbour."
 ac_wd_ark.8.b:0 "Keep the review internal."
 ac_wd_ark.9.t:0 "War Beyond Perbla"
 ac_wd_ark.9.d:0 "In March 1995 the Belkan War breaks out. Arklith has no part in it and no treaty that could draw it in. Yet the news lands hard in Cabaria. Perbla, on the eastern frontier, has old ties to Belka, and nobody knows how far its sympathies will go. Arklith-flagged ships sail in waters that are suddenly dangerous, and the crisis office opens with more questions than staff.\n\nWithin days the practical effects arrive. Foreign insurers raise premiums on any hull bound anywhere near the fighting. Shippers who usually book space months ahead call daily for news. Rumours spread in the Halloma Basin that the Perbla frontier will close, though nothing on the ground suggests it. In the Llano, factories that buy foreign parts begin hoarding.\n\nThe administration must decide what it will tell the country. It can speak frankly about the risks to shipping and trade, which may cause a run on stores and a rush to reflag ships. Or it can reassure first and explain later, accepting that if things go badly the public will remember being told all was well. The crisis office has drafted both statements and waits for a signature.\n\nProvisional gameplay: date anchor only, Chronicle row 1995 / 03.25; the Arklith response is gameplay."
 ac_wd_ark.9.a:0 "Speak frankly about the risks."
 ac_wd_ark.9.b:0 "Reassure first."
 ac_wd_ark.10.t:0 "The Insurers Raise the Rates"
 ac_wd_ark.10.d:0 "Two weeks into the war, the foreign insurance syndicates that cover most of Arklith's merchant fleet publish new rates. War-risk premiums on routes near the fighting rise several times over; some routes are excluded altogether. Owners of older ships find themselves uninsurable at any price. Several masters radio from foreign ports that they will not sail until someone tells them who pays if they are sunk.\n\nThe shipping lines come to Cabaria in a body. They want the state to guarantee their hulls, or at least to share the risk, and they point out that a fleet idling in harbour pays no dues and buys no fuel. The treasury answers that a guarantee is a blank cheque written on a war it cannot control. Both are right, which makes the meeting long.\n\nThere are middle courses. The state could cover only domestic-owned ships, or only routes it judges safe, or only hulls that sail under navy escort. Each would leave someone unprotected and angry. The crisis office recommends a decision within the week, before the masters abroad make it for the government by selling their ships.\n\nProvisional gameplay: date anchor only, Chronicle row 1995 / 03.25; the insurance crisis is gameplay."
 ac_wd_ark.10.a:0 "Guarantee the domestic lines."
 ac_wd_ark.10.b:0 "Leave the risk with the owners."
 ac_wd_ark.10.c:0 "Cover only escorted sailings."
 ac_wd_ark.11.t:0 "A Date in the Sky"
 ac_wd_ark.11.d:0 "In December 1994 astronomers warned that the asteroid called Ulysses could strike the Earth. In April 1996 the warning becomes an announcement: it will. Governments are told to prepare. Nobody can yet say where the fragments will fall, or how many there will be, or whether a coast, a plain or a mountain range is the safer place to be.\n\nIn Arklith the news arrives on the evening broadcasts and reaches the morning markets as panic. Bottled water and tinned food sell out in Cabaria and the city of Arklith. Churches and union halls fill. The sky watch, a handful of amateur astronomers and radar crews, is suddenly asked questions it cannot answer. Foreign bulletins contradict each other daily, and every radio phone-in has a caller who claims to know where the fragments will land. The ports report families booking passage abroad without any idea where abroad would be safer.\n\nThe government has two tasks. The first is to plan, and engineers are already drafting proposals for shelters beneath the cities or for evacuation to the highlands and the basin. The second is to keep the country calm while it plans. How much uncertainty the government admits in public will shape whether people trust the plans when they come.\n\nProvisional gameplay: date anchors only, Chronicle rows 1994 / 12.10 and 1996 / 04.20; the Arklith response is gameplay."
 ac_wd_ark.11.a:0 "Admit what nobody knows."
 ac_wd_ark.11.b:0 "Promise a plan within the month."
 ac_wd_ark.12.t:0 "Ulysses Overhead"
 ac_wd_ark.12.d:0 "In July 1999 Ulysses passes through the Earth's Roche limit and begins to break apart. In Arklith, sirens are tested at noon, ships in the reserve raise steam and the sky watch moves its reports from weekly to hourly. Families who rehearsed their routes check them again. The broadcasts carry foreign bulletins, then local ones, then foreign ones again.\n\nThe plans written since 1996 are about to be judged. Shelters stand stocked, or reception towns stand ready, depending on what the government chose. Neither plan can do anything about where the fragments fall. Both depend on people trusting the instructions they receive in the next hours, and on officials resisting the temptation to improvise. In the Llano works, managers ask whether to bank the furnaces. In the highlands, miners ask whether to stay underground. Every question reaches Cabaria at once, and the crisis office answers them in order.\n\nThe government's last decision before the night is simple and difficult. It can order the plans into effect now, on the strength of uncertain warnings, accepting the disruption if nothing comes. Or it can wait for clear warnings and act on them, accepting the risk that clear warnings may come too late to matter. Neither choice will look wise to everyone in the morning.\n\nProvisional gameplay: date anchor only, Chronicle row 1999 / 07.08; no fragment fall in Arklith is claimed."
 ac_wd_ark.12.a:0 "Put the plans into effect tonight."
 ac_wd_ark.12.b:0 "Wait for clear warning."
 ac_wd_ark.13.t:0 "Ten Years On"
 ac_wd_ark.13.d:0 "The review panel, drawn by lot from all eight provinces, delivers its report at the turn of the century. It is long, careful and in places harsh. It credits the decade with order and growth: the yards are busier, the Llano works more modern, the highland towns safer. It faults the state for deciding too much in Cabaria and explaining too little everywhere else.\n\nEach camp reads the report for its own purposes. Supporters of the government chosen in the early nineties find praise; its opponents find enough criticism to quote for years. The yards and the shipping lines read the chapter on credit and guarantees with particular care. The Llano reads the chapter on industry and asks why its name appears so rarely in the recommendations.\n\nThe government must decide what to do with the report. It can adopt its recommendations wholesale, binding itself to a programme it did not write. It can thank the panel and choose selectively. Or it can submit the report to the provinces for comment, which will take months and produce a second, louder argument. The panel members, at least, have already gone home.\n\nProvisional gameplay."
 ac_wd_ark.13.a:0 "Adopt the recommendations."
 ac_wd_ark.13.b:0 "Choose selectively."
 ac_wd_ark.13.c:0 "Send it to the provinces."
 ac_wd_ark.14.t:0 "A Buyer Walks Away"
 ac_wd_ark.14.d:0 "A foreign shipping company with two hulls half built on Arklith berths announces that it cannot pay. Its creditors abroad have seized its accounts, its directors have stopped answering letters and the hulls sit on the slipways with their plating unfinished. Suppliers who delivered steel, engines and wiring want their money. The yard wants to know who will pay its welders next month.\n\nThis is the case the yards have always feared and rarely planned for. A default on one contract can ripple through dozens of small suppliers in the coastal provinces, some of whom have no other customer. The question in the ministry is not whether the state will help, but how, and how much it will expect back when the hulls are finally sold.\n\nOptions are limited. The state can buy the hulls, finish them and sell them itself, taking the risk and any profit. It can lend the yard enough to finish them and leave the sale to the owners. Or it can let the yard and its suppliers settle among themselves, as any other business would, and accept the closures that follow.\n\nProvisional gameplay."
 ac_wd_ark.14.a:0 "Buy and finish the hulls."
 ac_wd_ark.14.b:0 "Lend to the yard."
 ac_wd_ark.14.c:0 "Let the market settle it."
 ac_wd_ark.15.t:0 "Freight for a Distant War"
 ac_wd_ark.15.d:0 "In August 2003 the FCU founds the ISAF to fight Erusea on the Usean continent, and the war that follows touches every shipping market in the world. Arklith has no part in it. Its lines feel it within weeks: charter rates for bulk carriers rise, insurers redraw their maps and buyers who had hesitated over new hulls sign contracts to secure capacity before prices rise further.\n\nThe shipping office reports offers from many directions. Some are innocent: grain, machinery, building materials for economies disrupted by the fighting. Others are less clear, with cargo descriptions that could cover almost anything. The yards report a rush of repair work from ships diverted onto longer routes. In Cabaria, the old debates of 1995 return as if they had never ended.\n\nThe government must set the terms. It can let the lines take every lawful cargo, with inspections to keep them honest, or ask them to keep their ships closer to home until the war is over. Either way, it must decide quickly, because the lines are already signing contracts and the masters are already at sea.\n\nProvisional gameplay: date anchor only, Chronicle row 2003 / 08.22; the Arklith response is gameplay."
 ac_wd_ark.15.a:0 "Take every lawful cargo."
 ac_wd_ark.15.b:0 "Keep the ships close to home."
 ARK_wd_ducal_council_office:0 "Ducal Council of Ministers"
 ARK_wd_ducal_council_office_desc:0 "A council of ministers named under the ducal title and confirmed by a chamber elected from the national rolls; the duke signs on its advice. Provisional gameplay office with no named holder."
 ARK_wd_ducal_household_office:0 "Household Cabinet of the Duchy"
 ARK_wd_ducal_household_office_desc:0 "A cabinet appointed by the ducal household that holds the seals, the budget and the officer lists, with any chamber kept as an advisory body. Provisional gameplay office with no named holder."
 ARK_wd_houses_board_office:0 "Board of the Great Houses"
 ARK_wd_houses_board_office_desc:0 "A board of nominees from the shipbuilders, shipping lines and mining concerns that sets the budget and directs the National Administration as its secretariat. Provisional gameplay office with no named holder."
 ARK_wd_civic_assembly_office:0 "Executive Committee of the Civic Assembly"
 ARK_wd_civic_assembly_office_desc:0 "An executive committee chosen by a civic assembly elected from the national rolls, with the ducal title kept as a ceremonial honour. Provisional gameplay office with no named holder."
 ac_wd_ark_decisions:0 "Arklith: National Measures"
 ac_wd_ark_decisions_desc:0 "Measures from the national programme of Arklith. Provisional gameplay unless a source ledger row says otherwise."
 ARK_wd_yard_credit_line_decision:0 "Open a Yard Credit Line"
 ARK_wd_yard_credit_line_decision_desc:0 "The treasury lends to idle berths for six months so they can bid on new contracts. Costs political power and ties up state credit."
 ARK_wd_harbour_drill_decision:0 "Harbour Defence Drill"
 ARK_wd_harbour_drill_decision_desc:0 "Escorts, pilots and harbour crews rehearse closing the approaches to Puerto Tranquilidad. Gains naval experience at the cost of a day of port traffic."
 ARK_wd_highland_road_crews_decision:0 "Highland Road Crews"
 ARK_wd_highland_road_crews_decision_desc:0 "Road crews widen the valley road into Eastern Nieblo before the rains. A one-time works programme paid from the national budget."
 ARK_wd_shelter_rotation_decision:0 "Rotate the Shelter Stocks"
 ARK_wd_shelter_rotation_decision_desc:0 "Old shelter supplies are sold cheaply and replaced with fresh stock, which keeps the shelters credible and the public reassured."
 ARK_wd_capital_runways_decision:0 "Lengthen the Cabaria Runways"
 ARK_wd_capital_runways_decision_desc:0 "The main field in Cabaria gains longer runways and new hardstands. A one-time investment for the air arm."
 ARK_wd_relief_voyage_decision:0 "Send a Relief Voyage"
 ARK_wd_relief_voyage_decision_desc:0 "A reserve hull sails with food and medicine for a stricken foreign port. Costs political power and earns goodwill at home."
 ARK_wd_freight_levy_decision:0 "War-Risk Freight Levy"
 ARK_wd_freight_levy_decision_desc:0 "A temporary levy on charter profits earned during the Usean war funds the treasury. Unpopular with the lines."
