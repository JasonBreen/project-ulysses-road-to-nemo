 OSE_snp_civil_space_policy_context_2:0 "The standing policy is protected bounded testing. Its continuing opportunity cost remains in the national schedule."
 ac_snp.15.t:0 "The Notebook outside the Sealed Folder"
 ac_snp.15.d:0 "A technical archivist brings two objects to the review: a sealed programme folder and an ordinary notebook of methods that the researchers used to check their observations. The security officer asks which belongs to the cooperation record. The archivist answers that the notebook can be useful even when the programme's present status permits no new exchange. A civil researcher wants the transferable methods opened to independent scrutiny. The test representative asks for a protected technical return before uncertain results are treated as established knowledge. Two measurements remain unanswered in the notebook's margin, and neither researcher will mark them complete merely to empty the agenda. The committee must decide how to keep useful knowledge without promising a result that the responsible programme has not delivered.\n\n[OSE_snp_civil_space_policy_context]\n[ac_snp_arkbird_context]"
 ac_snp.15.a:0 "Open the reusable methods and mark uncertain results clearly."
 ac_snp.15.a_effect_tt:0 "Civil support +4, readiness support -2. Both observations remain within zero to one hundred."
 ac_snp.15.b:0 "Protect the technical return until the uncertainty is examined."
 ac_snp.15.b_effect_tt:0 "Readiness support +4, civil support -2. Both observations remain within zero to one hundred."
