 YUK_snc_field_answers_hearing_context_missed:0 "The invitation went unanswered. This assessment records delivered work without inventing an agreement that nobody signed."
 ac_snc_yuk_message_20.t:0 "An Order That Can Be Answered: The Return"
 ac_snc_yuk_message_20.d:0 "The field representative recognizes his question in the completed return. Beside it is the receiving officer's answer and a qualification neither of them had expected to need. 'I can use this,' he says. The liaison asks whether it should become an open account or a signed professional correction. The secretary records the distinction. The chosen audience will change the burden of explaining the result, but it must not change which command structure performed the work. A useful review has found a receiving responsibility; it has not quietly exchanged the government's earlier decisions for a more convenient history.\n\n[ac_snp_yuk_command_context]\n\n[YUK_snc_field_answers_hearing_context]"
