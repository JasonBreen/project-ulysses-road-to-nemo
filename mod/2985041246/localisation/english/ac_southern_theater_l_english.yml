 ac_alc.94.t:0 "A Neighbour at Peace"
 ac_alc.94.d:0 "The final review lists the commission's sessions, the incidents on the border and the complaint about the old terms, with each government's answer.\n\nThe list is long. None of its entries became a war.\n\n[AUR_neighbour_ac_alc_report_callback]\n\n[AUR_neighbour_ac_alc_policy_callback]"
 ac_alc.94.a:0 "File the completed service record."
 LEA_war_government_ac_alc_policy_callback_0:0 "The standing policy is the commander governs. Its continuing cost remains part of the allocation."
 LEA_war_government_ac_alc_policy_callback_1:0 "The standing policy is the assembly governs. Its continuing cost remains part of the allocation."
 LEA_sw_war_government_reply_public_spirit:0 "Govern the War: Public Return"
 LEA_sw_war_government_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Prepare and publish one month's report on the war. Public attention or reserved staff time remains committed to that work."
 LEA_sw_war_government_reply_protected_spirit:0 "Govern the War: Protected Working Return"
 LEA_sw_war_government_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Issue and record the war government's decrees for one period. Public attention or reserved staff time remains committed to that work."
 ac_alc.65.t:0 "Figures the Command Will Not Sign"
 ac_alc.65.d:0 "The month's report lists casualties higher than the command has announced. The command refuses to sign it; the assembly's clerk refuses to publish it unsigned.\n\nThe government can publish the report with the command's objection, or accept the command's figures.\n\n[LEA_war_government_ac_alc_policy_callback]"
 ac_alc.65.a:0 "Publish with the objection."
 ac_alc.65.b:0 "Accept the command's figures."
 LEA_war_government_ac_alc_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 LEA_war_government_ac_alc_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 LEA_war_government_ac_alc_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_alc.95.t:0 "Who Decided the War"
 ac_alc.95.d:0 "The final review lists the war government's decisions with the body that took each one. The unsigned report is in the file, with the figures that turned out to be right.\n\n[LEA_war_government_ac_alc_report_callback]\n\n[LEA_war_government_ac_alc_policy_callback]"
 ac_alc.95.a:0 "File the completed service record."
 LEA_occupation_ac_alc_policy_callback_0:0 "The standing policy is civil administration. Its continuing cost remains part of the allocation."
 LEA_occupation_ac_alc_policy_callback_1:0 "The standing policy is military administration. Its continuing cost remains part of the allocation."
 LEA_sw_occupation_reply_public_spirit:0 "Administer the Occupied Regions: Public Return"
 LEA_sw_occupation_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Administer the occupied regions' food, schools and records for one period. Public attention or reserved staff time remains committed to that work."
 LEA_sw_occupation_reply_protected_spirit:0 "Administer the Occupied Regions: Protected Working Return"
 LEA_sw_occupation_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Audit one period's requisitions against their receipts. Public attention or reserved staff time remains committed to that work."
 ac_alc.66.t:0 "Receipts Nobody Can Pay"
 ac_alc.66.d:0 "The audit has found thousands of requisition receipts for goods Leasath has no budget to pay for. Their holders are queuing outside the civil office.\n\nThe administration can publish the list and a payment schedule it cannot yet fund, or pay what it can and keep the rest in the file.\n\n[LEA_occupation_ac_alc_policy_callback]"
 ac_alc.66.a:0 "Publish the list and a schedule."
 ac_alc.66.b:0 "Pay what can be paid."
 LEA_occupation_ac_alc_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 LEA_occupation_ac_alc_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 LEA_occupation_ac_alc_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_alc.96.t:0 "An Occupation on Record"
 ac_alc.96.d:0 "The final review lists the occupied regions with their administration, requisitions and receipts paid. The unpaid receipts are listed too.\n\n[LEA_occupation_ac_alc_report_callback]\n\n[LEA_occupation_ac_alc_policy_callback]"
 ac_alc.96.a:0 "File the completed service record."
 LEA_aftermath_ac_alc_policy_callback_0:0 "The standing policy is transitional government. Its continuing cost remains part of the allocation."
 LEA_aftermath_ac_alc_policy_callback_1:0 "The standing policy is government of the officers. Its continuing cost remains part of the allocation."
 LEA_sw_aftermath_reply_public_spirit:0 "After the Commander: Public Return"
 LEA_sw_aftermath_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Bring one formation home and discharge its conscripts. Public attention or reserved staff time remains committed to that work."
 LEA_sw_aftermath_reply_protected_spirit:0 "After the Commander: Protected Working Return"
 LEA_sw_aftermath_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Hold a public hearing on the war's conduct and costs. Public attention or reserved staff time remains committed to that work."
 ac_alc.67.t:0 "The Commander's Papers"
 ac_alc.67.d:0 "The removed commander's office has been sealed. His papers describe how the invasion was planned and who approved it. Several of the people named are in the new government.\n\nThe government can publish the papers, or hand them to a closed commission.\n\n[LEA_aftermath_ac_alc_policy_callback]"
 ac_alc.67.a:0 "Publish the papers."
 ac_alc.67.b:0 "Hand them to a closed commission."
 LEA_aftermath_ac_alc_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 LEA_aftermath_ac_alc_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 LEA_aftermath_ac_alc_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_alc.97.t:0 "Leasath After the War"
 ac_alc.97.d:0 "The final review lists the government's decisions since the commander's removal, the soldiers brought home and the hearings held. The commander's papers are where the government decided to put them.\n\n[LEA_aftermath_ac_alc_report_callback]\n\n[LEA_aftermath_ac_alc_policy_callback]"
 ac_alc.97.a:0 "File the completed service record."
 LEA_grievance_ac_alc_policy_callback_0:0 "The standing policy is arbitration of the old terms. Its continuing cost remains part of the allocation."
 LEA_grievance_ac_alc_policy_callback_1:0 "The standing policy is the grievance as policy. Its continuing cost remains part of the allocation."
 LEA_sw_grievance_reply_public_spirit:0 "State the Grievance: Public Return"
 LEA_sw_grievance_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Fund one period of the arbitration case. Public attention or reserved staff time remains committed to that work."
 LEA_sw_grievance_reply_protected_spirit:0 "State the Grievance: Protected Working Return"
 LEA_sw_grievance_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Publish one period's recovered mining ledgers. Public attention or reserved staff time remains committed to that work."
 ac_alc.68.t:0 "A Ledger That Says Otherwise"
 ac_alc.68.d:0 "One recovered ledger shows that an Aurelian firm paid more in royalties than Leasath's own state mines did. The ministry of information wants it left out of the publication.\n\nThe government can publish every ledger, including this one, or publish a selection.\n\n[LEA_grievance_ac_alc_policy_callback]"
 ac_alc.68.a:0 "Publish every ledger."
 ac_alc.68.b:0 "Publish a selection."
 LEA_grievance_ac_alc_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
