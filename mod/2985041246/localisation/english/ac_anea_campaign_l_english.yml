l_english:
 ac_anea_emm_tree:0 "Emmeria: The Burden of Recovery"
 ac_anea_emm_tree_desc:0 "National capacity, civil protection and sustainable recovery, 1991–2005. The national policy branches are authored alternatives."
 EMM_an_national_account:0 "An Account of the Republic"
 EMM_an_national_account_desc:0 "The new decade begins with more commitments than any single ministry can see. A common account of public services, productive capacity and the defence establishment will show where promises overlap. The cabinet must begin with what the country can sustain, rather than the strength it hopes to display."
 EMM_an_budget_review:0 "The Public Budget Review"
 EMM_an_budget_review_desc:0 "Published accounts will reveal which services depend on emergency appropriations year after year. Ministers can defend their priorities, but must also identify the people and equipment required to deliver them. The first review will establish a continuing argument over civilian provision and the protected defence allocation."
 EMM_an_civil_priority:0 "Protect Civil Investment"
 EMM_an_civil_priority_desc:0 "Water systems, workshops and local transport form the productive base on which every other promise rests. Protecting their investment programme improves construction and public confidence, while leaving less capacity for military expansion. The services will have to make greater use of the forces already available."
 EMM_an_defence_priority:0 "Protect Defence Allocations"
 EMM_an_defence_priority_desc:0 "The services ask for a stable allocation rather than a succession of emergency purchases. A protected programme supports readiness and replacement production, while civilian ministries absorb more of the shortage. The cabinet accepts that a larger military establishment must be supported every year."
 EMM_an_annual_compact:0 "The Annual Service Compact"
 EMM_an_annual_compact_desc:0 "National ministries and local authorities will agree which tasks can be funded before publishing their annual plans. The compact gives the selected budget policy an administrative foundation, but creates a permanent obligation to explain delays. It is a method of keeping promises manageable, rather than an unlimited spending programme."
 EMM_an_workshop_register:0 "Register Productive Workshops"
 EMM_an_workshop_register_desc:0 "A national register will distinguish firms able to repair existing machinery from those equipped to manufacture replacements. Contracts can then be sized to real capacity. Smaller workshops gain a route into public work, and the government gains a more reliable account of its industrial reserves."
 EMM_an_freight_timetables:0 "A Common Freight Timetable"
 EMM_an_freight_timetables_desc:0 "Commercial rail operators and public depots use different priorities when traffic is heavy. A common timetable will reserve maintenance periods and identify substitute routes. The gains come from using the network more reliably; the scheme does not assume that every government consignment can jump ahead of civilian trade."
 EMM_an_supplier_standards:0 "Supplier Inspection Standards"
 EMM_an_supplier_standards_desc:0 "Interchangeable fittings and traceable inspection records matter when an urgent repair reaches an unfamiliar workshop. Suppliers will receive a common specification and a clear appeals process. Compliance costs will be shared through longer contracts instead of being disguised as free industrial efficiency."
 EMM_an_regional_contracts:0 "Regional Maintenance Contracts"
 EMM_an_regional_contracts_desc:0 "The transport and utilities ministries will offer standing contracts to crews outside the capital. Keeping those crews available consumes administrative attention, but reduces the dependence of distant districts on a single repair office. The same relationships can support domestic reconstruction if a later emergency disrupts normal procurement."
 EMM_an_force_returns:0 "Readiness beyond Paper Strength"
 EMM_an_force_returns_desc:0 "The armed forces will report serviceable equipment, trained crews and available transport separately from nominal unit strength. An honest return may look less impressive, but it makes exercises and replacement orders possible. The first result will be a plan for sustaining existing formations."
 EMM_an_airfield_crews:0 "Permanent Airfield Crews"
 EMM_an_airfield_crews_desc:0 "Aircraft cannot disperse safely when every trained ground crew belongs to the main station. A permanent rotation will teach smaller airfields to refuel, inspect and service visiting aircraft. This investment supports military availability and does not substitute for civilian shelters or evacuation planning."
 EMM_an_coastal_patrols:0 "Coordinate Coastal Patrols"
 EMM_an_coastal_patrols_desc:0 "Harbour authorities and naval watch officers will exchange a common shipping picture. Patrols can concentrate on gaps in coverage instead of duplicating reports from the busiest ports. The navy gains practice in sustained operations, while commercial traffic retains predictable access to the coast."
 EMM_an_reserve_transport:0 "Reserve Transport Exercises"
 EMM_an_reserve_transport_desc:0 "A short reserve exercise will follow equipment from depot to unit and back again. Rail timetables, fuel handling and maintenance returns will decide whether a formation can move without exhausting its support. The results improve military logistics without keeping a large reserve permanently mobilised."
 EMM_an_regional_desks:0 "Permanent Regional Desks"
 EMM_an_regional_desks_desc:0 "Diplomats need a working record of commercial delays, transport rules and consular problems before a crisis arrives. Permanent desks will maintain those contacts between visits by ministers. Their routine work preserves channels for practical agreements without committing the republic to a new military alignment."
 EMM_an_civil_contacts:0 "Civil Technical Contacts"
 EMM_an_civil_contacts_desc:0 "Engineers and administrators can compare inspection methods even when governments disagree about larger questions. Technical contacts will focus on sanitation, transport and public works. They offer a modest improvement in domestic practice while leaving the cabinet free to decide the scope of later cooperation."
 EMM_an_consular_rota:0 "A Consular Emergency Rota"
 EMM_an_consular_rota_desc:0 "Consulates will name the officials responsible for missing-person enquiries, travel documents and emergency communications. A rota cannot provide unlimited assistance, but it prevents the first requests from disappearing between offices. The cabinet will retain this civil capacity alongside its ordinary diplomatic work."
 EMM_an_neighbour_protocols:0 "Practical Neighbour Protocols"
 EMM_an_neighbour_protocols_desc:0 "The regional desks will put their work into a set of contact and document protocols. These arrangements cover civilian enquiries and technical assistance, with no automatic promise of troops or money. A later government will inherit functioning channels while retaining responsibility for each substantive commitment."
 EMM_an_national_programme:0 "A Sustainable National Programme"
 EMM_an_national_programme_desc:0 "The initial inventory has become a working programme. Its value lies in recording the costs that annual plans used to hide: maintenance, trained staff, transport and the opportunity to challenge an allocation. Future governments can change the priorities, but will inherit institutions capable of explaining the consequences."
 EMM_an_scientific_desk:0 "A Scientific Assessment Desk"
 EMM_an_scientific_desk_desc:0 "The international asteroid announcement requires a permanent scientific contact, rather than an improvised ministerial committee. Specialists will distinguish an observed risk from speculation and report what new information could change the assessment. The desk prepares an accountable warning process without pretending to know where fragments will fall."
 EMM_an_municipal_surveys:0 "Survey Municipal Shelter Space"
 EMM_an_municipal_surveys_desc:0 "Civil authorities will inspect basements, public buildings and access routes that could serve during a major emergency. Capacity must be measured in water, sanitation and safe access as well as floor space. The survey turns existing structures into a defensible plan while exposing costly gaps."
 EMM_an_local_wardens:0 "Train Local Civil Wardens"
 EMM_an_local_wardens_desc:0 "Local wardens will rehearse opening shelters, recording arrivals and reporting missing residents. Their work makes a warning actionable for households without transport or specialist knowledge. Training requires time away from ordinary duties, but reduces dependence on military personnel for basic civilian protection."
 EMM_an_shelter_refit:0 "Refit the Capital Shelter"
 EMM_an_shelter_refit_desc:0 "The revised assessment has made practical shelter work urgent. Crews preparing the capital shelter must test safe access, communications, sanitation and the services that will support residents once the doors close. Construction competes with other civilian projects and provides protection rather than an anti-asteroid weapon."
 EMM_an_evacuation_register:0 "An Evacuation and Family Register"
 EMM_an_evacuation_register_desc:0 "Evacuation can separate families long after the immediate danger passes. Local offices will maintain compatible arrival and tracing records, with procedures for people who have lost their documents. The register improves the usefulness of shelter capacity while requiring continuing clerical work and safeguards against arbitrary exclusion."
 EMM_an_emergency_freight:0 "Emergency Freight Reservations"
 EMM_an_emergency_freight_desc:0 "Emergency plans must name the wagons and loading crews they intend to use. Commercial operators will reserve a limited allocation under a published schedule instead of accepting several incompatible promises. The arrangement improves civil preparedness at the cost of political capital and some normal flexibility."
 EMM_an_medical_stores:0 "Rotate Emergency Medical Stores"
 EMM_an_medical_stores_desc:0 "A reserve that expires unopened is an expensive fiction. Hospitals and suppliers will rotate medical stocks through ordinary use while preserving an emergency minimum. The programme protects civilian treatment capacity and imposes an ongoing obligation to maintain records, trained staff and distribution arrangements."
 EMM_an_water_teams:0 "Independent Water and Power Teams"
 EMM_an_water_teams_desc:0 "Shelters and hospitals need crews who can restore essential services when the main network is unavailable. Mobile civilian teams will carry standard connections and practise temporary installations. Assigning them to emergency duty reduces the crews available for routine public works."
 EMM_an_protected_reserve:0 "A Protected Civil Reserve"
 EMM_an_protected_reserve_desc:0 "The cabinet must decide whether supplies earmarked for civil emergencies can be requisitioned by another service. A protected reserve improves confidence that plans will survive the first shortage. Keeping it intact consumes civilian capacity which could otherwise support new construction or military expansion."
 EMM_an_dispersal_plan:0 "An Air Dispersal Plan"
 EMM_an_dispersal_plan_desc:0 "Military planners will test alternate operating fields and the movement of ground crews. This work keeps the air arm available after disruption, but does not add shelter places or evacuation vehicles. The cabinet must therefore judge its value alongside the separate civilian protection programme."
 EMM_an_reserve_instructors:0 "Retain Reserve Instructors"
 EMM_an_reserve_instructors_desc:0 "The services will preserve a small cadre of instructors instead of expanding every active formation. The cadre protects training capacity through disruption, while its payroll competes with the civil reserve. Reservists will be called for limited exercises rather than indefinite emergency mobilisation."
 EMM_an_port_contingency:0 "Military Port Contingencies"
 EMM_an_port_contingency_desc:0 "The navy will rehearse moving its repair and stores functions away from a single main port. Naval exercises will use realistic fuel and transport allocations. The programme protects fleet availability; civilian freight and shelter planning remain separate responsibilities with their own budgets."
 EMM_an_readiness_ceiling:0 "A Sustainable Readiness Ceiling"
 EMM_an_readiness_ceiling_desc:0 "Continuous mobilisation would consume the reserves intended to last through a prolonged emergency. The cabinet will set a sustainable ceiling for military exercises and preserve maintenance intervals. The services gain a dependable programme while accepting limits on demonstrations of immediate strength."
 EMM_an_warning_protocol:0 "Publish the Warning Protocol"
 EMM_an_warning_protocol_desc:0 "The scientific desk and local authorities will agree which observations justify a warning and who is responsible for issuing it. Publishing the protocol makes uncertainty visible without presenting every new estimate as a certainty. Clear responsibilities protect public confidence when advice changes."
 EMM_an_relief_contacts:0 "Contact Neighbouring Relief Offices"
 EMM_an_relief_contacts_desc:0 "Officials will exchange the practical details needed to request assistance: receiving points, cargo documentation and the staff authorised to accept a shipment. These are planning arrangements, rather than a promise to bear unlimited costs. They can support later aid if both governments remain willing."
 EMM_an_technical_briefings:0 "Open Technical Briefings"
 EMM_an_technical_briefings_desc:0 "Emergency engineers will explain what the plans can deliver and which shortfalls remain. Open briefings expose the cabinet to criticism, but give local authorities a basis for their own preparations. The government must continue paying for the staff who turn those questions into practical instructions."
 EMM_an_mutual_receiving:0 "Prepare Civil Receiving Points"
 EMM_an_mutual_receiving_desc:0 "Potential receiving points will practise sorting civilian supplies and directing people to the responsible office. A small exercise now is cheaper than discovering incompatible documents during a real disruption. The preparations create capacity for cooperation while preserving a separate decision about whether to use it."
 EMM_an_preparedness_review:0 "Review the Civil Protection Plan"
 EMM_an_preparedness_review_desc:0 "The final review compares shelter access, medical stores, emergency transport and warning responsibilities. It will record a bounded level of preparedness rather than proclaiming complete safety. Unfinished work remains unfinished, and military readiness is reported separately from the civilian protection account."
 EMM_an_civil_account:0 "Take Stock of Civil Resilience"
 EMM_an_civil_account_desc:0 "The crisis has tested the difference between a written plan and a functioning service. Ministries will report actual disruption, available repair crews and the reserves still intact. This assessment begins reconstruction from the country that now exists, while preserving the record of preparations that were completed before the emergency."
 EMM_an_utility_repair:0 "Repair Essential Utilities"
 EMM_an_utility_repair_desc:0 "Water, power and communications crews will receive a common list of essential repairs. Priorities will follow the needs of hospitals, housing and transport instead of whichever ministry submits the largest claim. Restoring those services improves recovery while tying up crews that could otherwise support new construction."
 EMM_an_housing_records:0 "Reconcile Housing and Compensation"
 EMM_an_housing_records_desc:0 "The administration must connect emergency accommodation records to a usable compensation process. Clear eligibility and an appeal route will prevent temporary displacement from becoming a permanent administrative dispute. The programme improves recovery through predictable decisions, at the cost of political attention and staff time."
 EMM_an_domestic_reserve:0 "Replenish the Domestic Reserve"
 EMM_an_domestic_reserve_desc:0 "Assistance abroad cannot rest on supplies that domestic services may need tomorrow. The government will replenish its own emergency reserve and publish the minimum that aid programmes cannot consume. This protects confidence in continued assistance while accepting a slower pace of other civilian commitments."
 EMM_an_standing_services:0 "Keep a Standing Repair Service"
 EMM_an_standing_services_desc:0 "Experienced crews should not disappear as soon as the most visible repairs are complete. A standing service will preserve the records and practical skills needed for future disruption. It improves civilian recovery and maintenance, while carrying a continuing cost in the construction programme."
 EMM_an_aid_review:0 "The Foreign Assistance Review"
 EMM_an_aid_review_desc:0 "The aid initiative must be judged against available cargo capacity, receiving arrangements and the domestic reserve. The cabinet will decide how broadly to offer assistance and what evidence it needs from the recipient. The review prepares a national policy; the separate bilateral accord still requires a valid partner and consent."
 EMM_an_broad_assistance:0 "A Broad Assistance Mandate"
 EMM_an_broad_assistance_desc:0 "A broad mandate gives relief administrators room to respond quickly to urgent requests. It preserves civilian contact even when inspection arrangements are incomplete, while exposing the government to criticism if supplies fail to reach their intended use. The policy carries a real domestic burden rather than creating free cargo."
 EMM_an_conditional_assistance:0 "Assistance against Delivery Records"
 EMM_an_conditional_assistance_desc:0 "The cabinet will require accountable receiving and delivery records before extending its commitments. The requirement can slow aid and strain relations, but gives domestic officials a basis for defending continued support. The policy does not manufacture compliance: Estovakia must choose and sustain its own distribution arrangements."
 EMM_an_receiving_liaison:0 "A Civil Receiving Liaison"
 EMM_an_receiving_liaison_desc:0 "Experienced liaison staff will compare documents, identify missing consignments and keep technical contact open. If aid is refused or interrupted, the staff will return to domestic freight coordination. The programme therefore remains useful without forcing another government to accept assistance."
 EMM_an_defence_replacement:0 "Replace Worn Defence Equipment"
 EMM_an_defence_replacement_desc:0 "The services will distinguish equipment lost to disruption from machinery simply reaching the end of its useful life. Replacement priorities will follow the chosen national allocation policy. The programme restores military readiness without awarding additional civilian recovery merely for buying equipment."
 EMM_an_air_training_rota:0 "Restore the Air Training Rota"
 EMM_an_air_training_rota_desc:0 "The air arm will rebuild its instructor rotation around aircraft and ground crews that can be sustained. A dependable rota is more useful than a short burst of flying followed by exhausted maintenance teams. Keeping the programme staffed competes with other demands for skilled labour."
 EMM_an_fleet_refit:0 "A Measured Fleet Refit"
 EMM_an_fleet_refit_desc:0 "Naval workshops will schedule refits around the vessels the country can crew and fuel. A measured programme avoids taking every useful escort out of service at once. The navy retains a credible coastal role while accepting that national recovery has other claims on the industrial base."
 EMM_an_balanced_readiness:0 "A Balanced Readiness Settlement"
 EMM_an_balanced_readiness_desc:0 "The cabinet and services will set a lasting balance between training, maintenance and replacement. The settlement rewards a force that can operate within its means rather than the largest possible establishment. Civil protection and external aid retain their separate budgets and their own tests of success."
 EMM_an_sanctions_desk:0 "Maintain the Sanctions Review Desk"
 EMM_an_sanctions_desk_desc:0 "Officials will prepare a record of distribution practices, completed aid and the recipient administration. The desk supports the actual review without assuming that a calendar date determines the result. A credible reform record can justify an alternative, while unresolved diversion leaves the historical sanctions course available."
 EMM_an_independent_relief:0 "Relief through Domestic Capacity"
 EMM_an_independent_relief_desc:0 "The government will preserve a domestic capacity to inspect, store and transport civilian relief supplies even when a particular bilateral service is suspended. This keeps trained people useful without routing assistance around a refusal or sanctions policy. Domestic recovery remains an available conclusion."
 EMM_an_consultative_agency:0 "A Civil Consultative Agency"
 EMM_an_consultative_agency_desc:0 "The Republic of Anea initiative offers a forum for practical work, not a completed common state. The national delegation will prepare technical consultation and civilian logistics proposals. Participation by a neighbour requires consent, and refusal leaves the delegation free to improve domestic coordination."
 EMM_an_cooperation_record:0 "Publish the Cooperation Record"
 EMM_an_cooperation_record_desc:0 "The government will publish what its international commitments actually delivered, together with the costs borne at home. Effective cooperation, limited consultation and suspension must be reported differently. The account preserves an institutional lesson without claiming that a consultative bureau has merged the countries or their armed forces."
 EMM_an_recovery_assessment:0 "The Republic after Recovery"
 EMM_an_recovery_assessment_desc:0 "The final assessment will compare civilian services, sustained defence capability and the results of assistance. Some work has taken longer than the reporting calendar allowed, but it must still be brought into the public account. Ministers must decide whether to preserve a standing recovery institution or release part of its capacity for ordinary civilian use."
 ac_anea_eva_tree:0 "Estovakia: The Burden of Recovery"
 ac_anea_eva_tree_desc:0 "National capacity, civil protection and sustainable recovery, 1991–2005. The national policy branches are authored alternatives."
 EVA_an_national_account:0 "The State of the Federation"
 EVA_an_national_account_desc:0 "Industrial reports, military returns and district accounts describe different countries. The administration needs one inventory of the roads, workshops and trained people it can actually call upon. Reconciling those accounts is a political undertaking: every corrected figure takes a promise away from someone who expected it to be honoured."
 EVA_an_allocation_review:0 "The Allocation Register"
 EVA_an_allocation_review_desc:0 "District requests and service orders repeatedly reserve the same transport and machinery. A common register will force the administration to acknowledge the shortfall. It must then choose whether distribution is subject to public audit or concentrated in the command chain that can move resources most quickly."
 EVA_an_audited_distribution:0 "Audit Civil Distribution"
 EVA_an_audited_distribution_desc:0 "A civilian inspection service will track public allocations from the warehouse to the receiving district. Publishing the record makes diversion harder and protects confidence in the administration. Commanders lose discretion over some supplies, and the inspectors require staff who could otherwise support military readiness."
 EVA_an_command_distribution:0 "Distribution through the Command Chain"
 EVA_an_command_distribution_desc:0 "The command chain will concentrate requisition authority and keep trained formations supplied. It can act quickly, but civilian offices have fewer ways to challenge an order or prove that a promised delivery never arrived. The administration accepts this loss of confidence in exchange for a more dependable military allocation."
 EVA_an_district_liaisons:0 "District Liaison Officers"
 EVA_an_district_liaisons_desc:0 "Every district will have a named liaison who can trace a request through the chosen allocation system. The officers cannot eliminate shortages, but they can prevent officials from treating an unanswered form as a completed delivery. Maintaining the service imposes a continuing administrative burden on the centre."
 EVA_an_industrial_returns:0 "Correct the Industrial Returns"
 EVA_an_industrial_returns_desc:0 "Factories will separate installed machinery from machinery that can actually run a full shift. Inspectors will record shortages of power, parts and skilled labour. Honest returns reduce impressive production claims, while making it possible to direct limited investment towards work that can be completed."
 EVA_an_rail_dispatch:0 "A National Rail Dispatch Office"
 EVA_an_rail_dispatch_desc:0 "Local dispatchers face incompatible priorities from civilian ministries and the services. A national office will keep a visible order of work and a reserve for breakdowns. Its success depends on limiting exceptional orders rather than promising that every claimant can receive priority."
 EVA_an_repair_cooperatives:0 "Workshop Repair Cooperatives"
 EVA_an_repair_cooperatives_desc:0 "Small workshops will pool scarce gauges, specialist tools and repair knowledge. This offers a practical way to restore equipment without waiting for an entirely new plant. Public contracts will pay for availability as well as output, tying part of the industrial budget to maintenance."
 EVA_an_industrial_reserve:0 "Protect the Maintenance Reserve"
 EVA_an_industrial_reserve_desc:0 "A reserve of spares is easy to consume when production targets are missed. A protected maintenance allocation will keep worn machinery in service, although it reduces the resources available for immediate expansion. The government must defend this less visible investment against more impressive new programmes."
 EVA_an_command_returns:0 "Inspect Command Readiness"
 EVA_an_command_returns_desc:0 "Inspectors will compare the strength claimed by headquarters with the transport, equipment and trained crews held by each formation. Units that can deploy safely will receive first call on the exercise programme. The inspection measures readiness without treating civilian allocations as a military reserve."
 EVA_an_air_maintenance:0 "An Air Maintenance Establishment"
 EVA_an_air_maintenance_desc:0 "The air arm needs a permanent system for inspection intervals, replacement parts and instructor rotations. A maintenance establishment will concentrate that knowledge and provide deployable crews. Keeping it staffed carries a cost, but protects aircraft already bought from becoming expensive entries in a ledger."
 EVA_an_coastal_support:0 "Support the Coastal Flotillas"
 EVA_an_coastal_support_desc:0 "Small fleets require dependable fuel handling and shore maintenance more than ambitious declarations of naval power. Support teams will rehearse the return of damaged vessels and the movement of stores between ports. The programme improves naval endurance without creating a strategic fleet that the country cannot sustain."
 EVA_an_mobile_workshops:0 "Mobile Military Workshops"
 EVA_an_mobile_workshops_desc:0 "Army workshops will practise moving with the formations they support, carrying the tools required for common breakdowns. This makes the existing force easier to sustain in an exercise or an emergency. It also reserves skilled mechanics for the military when civilian industry would welcome their labour."
 EVA_an_foreign_records:0 "Reconcile Foreign Commitments"
 EVA_an_foreign_records_desc:0 "The foreign office will compile the commercial and technical obligations spread across several ministries. A signed agreement is useful only if the office responsible for delivery knows what it promised. Reconciling the record preserves freedom of action while making later requests for assistance more credible."
 EVA_an_technical_exchanges:0 "Civil Technical Exchanges"
 EVA_an_technical_exchanges_desc:0 "Civil engineers will exchange inspection procedures and repair methods with willing neighbours. The programme concerns ordinary public works, and it does not grant a foreign government authority over domestic decisions. Practical contacts can nevertheless keep a useful channel open when political relations are strained."
 EVA_an_border_documents:0 "Standardise Civil Documents"
 EVA_an_border_documents_desc:0 "Clear travel and cargo documents reduce the opportunity for local officials to impose their own requirements. The administration will publish a common set of forms and a contact for disputes. Predictability costs some discretion, but improves confidence in routine dealings across the frontier."
 EVA_an_neighbour_channels:0 "Keep Neighbour Channels Open"
 EVA_an_neighbour_channels_desc:0 "The foreign office will maintain a small permanent channel for transport, public-health and missing-person enquiries. Its work is deliberately narrower than a military alliance. Even a government pursuing self-reliance will benefit from being able to ask a precise question and receive an accountable answer."
 EVA_an_national_programme:0 "Commitments the State Can Keep"
 EVA_an_national_programme_desc:0 "The initial inventory has become a working programme. Its value lies in recording the costs that annual plans used to hide: maintenance, trained staff, transport and the opportunity to challenge an allocation. Future governments can change the priorities, but will inherit institutions capable of explaining the consequences."
 EVA_an_risk_office:0 "A Permanent Risk Office"
 EVA_an_risk_office_desc:0 "The international asteroid announcement raises questions that the ordinary ministries cannot answer alone. A small technical office will follow new assessments and identify decisions that cannot wait for certainty. Its first task is to distinguish practical civil protection from programmes whose promised results remain unproven."
 EVA_an_district_capacity:0 "Count District Shelter Capacity"
 EVA_an_district_capacity_desc:0 "District offices will inspect buildings, water access and evacuation routes using the same standard. A shelter claim must identify who can open the building and provide essential services. The survey is politically difficult because an honest count will reduce several impressive local totals."
 EVA_an_civil_engineers:0 "Protect Civil Engineering Teams"
 EVA_an_civil_engineers_desc:0 "Civil engineering crews will receive a reserve of tools and transport for essential-service repairs. Protecting that allocation limits the equipment commanders can requisition for exercises. The administration must defend a civilian capability whose value becomes obvious only when ordinary networks are disrupted."
 EVA_an_evacuation_routes:0 "Mark Practical Evacuation Routes"
 EVA_an_evacuation_routes_desc:0 "Evacuation orders are useful only when local authorities know how people without private transport will move. District exercises will test walking routes, assisted transport and receiving points. The programme improves civil protection without claiming that an untested strategic project will eliminate the danger."
 EVA_an_district_shelters:0 "Equip District Shelters"
 EVA_an_district_shelters_desc:0 "The government will fund water storage, sanitation and basic communications in the shelters that passed inspection. The programme favours practical capacity over impressive construction claims. Its cost is borne now, while the public benefit depends on keeping staff and supplies available until needed."
 EVA_an_distribution_depots:0 "Inspect Emergency Distribution Depots"
 EVA_an_distribution_depots_desc:0 "Inspectors will compare warehouse records with actual stocks and access to transport. A counted consignment cannot also be promised to several ministries. The inspection improves preparedness only when its findings are used to protect the civilian reserve from arbitrary requisition."
 EVA_an_spare_connections:0 "Standardise Emergency Connections"
 EVA_an_spare_connections_desc:0 "Water, power and vehicle repair teams need compatible connections before they can assist another district. Workshops will produce common fittings and inspection sheets. The work is less visible than a major new facility, but it reduces the number of essential repairs delayed by a missing specialist component."
 EVA_an_medical_rotations:0 "Rotate Civil Medical Reserves"
 EVA_an_medical_rotations_desc:0 "Hospitals will rotate emergency medicines and equipment through ordinary service, with a recorded minimum held back for disruption. The reserve improves practical treatment capacity instead of creating a nominal stockpile that no one inspects. Maintaining the rota consumes staff and administrative attention."
 EVA_an_civil_freight:0 "Ring-Fence Emergency Civil Freight"
 EVA_an_civil_freight_desc:0 "A limited transport allocation will be reserved for shelters, hospitals and essential utilities. Commanders must plan around it rather than assume every vehicle is available to the military. The decision strengthens preparedness and makes the opportunity cost of civilian protection explicit."
 EVA_an_air_defence_drills:0 "Air-Defence Readiness Drills"
 EVA_an_air_defence_drills_desc:0 "The air arm will practise identification, communications and the dispersal of service crews. The drills improve its ability to operate through disruption, but cannot protect civilians from falling fragments. Military readiness remains a separate claim on scarce maintenance and training capacity."
 EVA_an_military_transport:0 "Exercise Military Transport Columns"
 EVA_an_military_transport_desc:0 "Commanders will test the ability to move a formation with its fuel, workshops and communications. Exercises must account for the civilian transport allocation rather than quietly consuming it. The resulting military capability is useful, but it does not increase the measure of civilian preparedness."
 EVA_an_command_reserves:0 "Keep a Trained Command Reserve"
 EVA_an_command_reserves_desc:0 "A small reserve of trained staff will practise replacing exhausted headquarters teams. It supports continuity in the armed forces without requiring indefinite mobilisation of all formations. The reserve carries a continuing administrative cost which the civilian ministries will see in their own staffing returns."
 EVA_an_readiness_limits:0 "Set Readiness Limits"
 EVA_an_readiness_limits_desc:0 "Maintenance and training capacity impose limits that orders cannot remove. The government will establish a sustainable programme instead of demanding that every formation remain at its highest readiness. The services retain dependable support while accepting that some resources must remain outside the military chain."
 EVA_an_chandelier_account:0 "Account for the Chandelier Commitment"
 EVA_an_chandelier_account_desc:0 "The anti-asteroid undertaking promises protection on a scale that local civil works cannot match. Its technical account must distinguish completed systems from unproven expectations and explain the resources still required. The cabinet will not count an unfinished installation as an operational defence against Ulysses."
 EVA_an_chandelier_research:0 "Continue the Unfinished Research"
 EVA_an_chandelier_research_desc:0 "Specialists will retain the technical team and record the work still needed for the anti-asteroid undertaking. Continuing research preserves expertise, while committing resources that shelters and essential services could use immediately. Retaining the team preserves knowledge; it cannot turn the unfinished undertaking into an operational defence before the danger arrives."
 EVA_an_redirect_engineers:0 "Redirect Engineers to Civil Protection"
 EVA_an_redirect_engineers_desc:0 "The cabinet will move available engineering resources from the unfinished undertaking into shelters and emergency services. Some specialised work will be lost, but the transferred teams can deliver practical protection before the crisis. This choice preserves the distinction between an ambitious proposal and a functioning capability."
 EVA_an_technical_archive:0 "Preserve the Technical Record"
 EVA_an_technical_archive_desc:0 "Whichever allocation was chosen, the government will preserve test results, unfinished designs and inspection records. An honest archive prevents later officials from presenting incomplete work as an available weapon. It also leaves civilian specialists a basis for recovering useful engineering knowledge after the crisis."
 EVA_an_preparedness_review:0 "Publish the Remaining Shortfalls"
 EVA_an_preparedness_review_desc:0 "The final review will state which civilian measures are actually ready and which remain promises. It does not erase shortages or count military exercises as shelter capacity. Publishing the account imposes a political cost, while giving local officials a realistic basis for the emergency ahead."
 EVA_an_crisis_returns:0 "The Civilian Damage Returns"
 EVA_an_crisis_returns_desc:0 "District reports must distinguish damage, interrupted services and supplies that disappeared before reaching the public. The administration will begin recovery from verified conditions, distinguishing inspected reports from places where communications have yet to be restored. Completed civil preparations matter; an unfinished strategic undertaking does not become a functioning shield after the fact."
 EVA_an_water_recovery:0 "Restore Water and Sanitation"
 EVA_an_water_recovery_desc:0 "Repair teams will give water and sanitation systems a clear priority alongside the hospitals that depend on them. Restoring an essential service requires receiving parts, retaining skilled crews and recording what was completed. The programme improves recovery through practical work rather than a nominal factory award."
 EVA_an_district_repairs:0 "District Repair Agreements"
 EVA_an_district_repairs_desc:0 "District administrations will agree on repair schedules that match the equipment and labour actually available. Publishing those commitments makes it harder to report the same team as working in several places. The agreements improve recovery, while exposing missed deadlines to public criticism."
 EVA_an_civil_claims:0 "Hear Civilian Supply Claims"
 EVA_an_civil_claims_desc:0 "A recorded complaint must be traced to a warehouse, transport order or receiving office. The administration will fund an appeals service that can identify where a promised consignment stopped. The work restores confidence in public distribution and consumes officials who could otherwise support more centralised command."
 EVA_an_local_recovery:0 "A Domestic Recovery Programme"
 EVA_an_local_recovery_desc:0 "Local services need a programme that remains useful whether foreign assistance arrives or not. Repair workshops, utilities and district offices will share a realistic order of work. The government accepts slower progress where capacity is limited, while preserving a route to recovery under diplomatic isolation."
 EVA_an_aid_position:0 "State the Aid Position"
 EVA_an_aid_position_desc:0 "The government must answer the aid initiative in terms that can be carried out. Accepting monitored distribution changes who may inspect allocations; choosing self-reliance requires an honest domestic plan. Neither position can compel a donor to pay, and a refused or expired accord must leave a useful national route."
 EVA_an_monitored_access:0 "Open Civil Receiving Access"
 EVA_an_monitored_access_desc:0 "Civil receiving offices will provide records for agreed inspections and protect the crews assigned to delivery work. This commits political authority to making assistance traceable. The policy is useful only while both governments remain eligible and willing, and its costs remain if a later interruption ends the service."
 EVA_an_domestic_self_reliance:0 "Pursue Domestic Self-Reliance"
 EVA_an_domestic_self_reliance_desc:0 "The government will limit its dependence on foreign receiving arrangements and place repair priorities within domestic institutions. Progress will rely on the resources and transport it can mobilise at home. This remains a practical recovery route, while accepting the diplomatic and administrative cost of refusing wider monitoring."
 EVA_an_delivery_account:0 "Account for Every Civil Delivery"
 EVA_an_delivery_account_desc:0 "The national account will record delivered aid, domestic consignments and unresolved losses separately. It will never count an authorised service as if all of its cargo had arrived. A government pursuing self-reliance can use the same discipline to improve domestic allocation and rebuild confidence."
 EVA_an_serviceable_force:0 "Rebuild a Serviceable Force"
 EVA_an_serviceable_force_desc:0 "The armed forces will prioritise equipment and transport required to sustain the formations they can actually field. A smaller serviceable force is preferable to paper strength consuming civilian repair capacity. The programme restores military readiness while leaving civil recovery to its own allocations and measurable work."
 EVA_an_aircrew_pipeline:0 "Restore the Aircrew Pipeline"
 EVA_an_aircrew_pipeline_desc:0 "Training will resume at a rate supported by available aircraft, instructors and ground crews. The air arm must account for maintenance and replacement losses rather than demanding a return to every pre-crisis target at once. A continuing training institution protects capability while consuming scarce specialist labour."
 EVA_an_coastal_repairs:0 "Repair the Coastal Support Chain"
 EVA_an_coastal_repairs_desc:0 "Naval support crews will restore the movement of fuel, stores and repair components between usable ports. The programme concentrates on existing conventional vessels. It creates neither a new strategic fleet nor a means of avoiding the civilian shortages that the wider reconstruction programme must address."
 EVA_an_command_settlement:0 "A Sustainable Command Settlement"
 EVA_an_command_settlement_desc:0 "The services will accept a lasting relationship between equipment, maintenance and training capacity. Protecting that relationship imposes a cost on other uses of industry, but prevents repeated emergency requisitions. Civil administrators retain the separate duty of accounting for supplies intended for public recovery."
 EVA_an_review_response:0 "Prepare a Diplomatic Review Response"
 EVA_an_review_response_desc:0 "The administration will compile its actual distribution record before answering the sanctions review. Successful monitored services and restored civilian capacity may support an earned alternative. Where those conditions are absent, the government must confront the consequences rather than declare reform complete through a change of wording."
 EVA_an_civilian_salvage:0 "Recover Civilian Engineering Value"
 EVA_an_civilian_salvage_desc:0 "Specialists will examine the preserved technical record for methods useful to power, communications and heavy repair work. Useful knowledge can be recovered without presenting the unfinished Chandelier as an operational weapon. The programme retains a civilian engineering team whose work competes with military technical priorities."
 EVA_an_anea_delegation:0 "A Delegation to Civil Consultation"
 EVA_an_anea_delegation_desc:0 "The Republic of Anea initiative presents a chance for limited technical consultation. The delegation will prepare proposals for civilian information and logistics work without promising a merged state or an automatic military alliance. If another country refuses, the same staff will support domestic coordination."
 EVA_an_recovery_record:0 "Preserve the Recovery Record"
 EVA_an_recovery_record_desc:0 "The administration will retain a public record of repaired services, delivered supplies and the costs of its chosen allocation policy. Effective consultation, restricted contact and isolation require different lessons. The record gives later officials evidence of what worked, what failed and which commitments remained beyond the resources the administration could command."
 EVA_an_recovery_assessment:0 "The Federation after Recovery"
 EVA_an_recovery_assessment_desc:0 "The final account compares civilian services, the sustained military establishment and the actual results of assistance. Work that runs beyond the original reporting period must still be included, together with the shortages that remain unresolved. The government must choose whether to preserve a permanent civil repair institution or redirect some of that capacity towards immediate domestic reconstruction."
 EMM_an_civil_priority_spirit:0 "Civil Investment Priority"
 EMM_an_civil_priority_spirit_desc:0 "Protected civilian investment supports construction and confidence. The defence production programme receives a smaller share of industrial attention."
 EMM_an_defence_priority_spirit:0 "Protected Defence Allocation"
 EMM_an_defence_priority_spirit_desc:0 "A dependable military allocation supports replacement production and training. Civilian construction carries the opportunity cost."
 EMM_an_freight_network_spirit:0 "Scheduled Freight Network"
 EMM_an_freight_network_spirit_desc:0 "Common timetables and maintenance records make supply more reliable, while the coordinating office requires permanent administrative attention."
 EMM_an_maintenance_service_spirit:0 "Regional Maintenance Service"
 EMM_an_maintenance_service_spirit_desc:0 "Standing civilian repair crews improve construction efficiency. Maintaining availability ties up part of the civil economy."
 EMM_an_air_service_spirit:0 "Dispersed Air Service"
 EMM_an_air_service_spirit_desc:0 "Trained ground crews preserve air availability while a standing establishment consumes administrative resources."
 EMM_an_reserve_logistics_spirit:0 "Exercised Reserve Logistics"
 EMM_an_reserve_logistics_spirit_desc:0 "A trained transport reserve reduces military supply demand, at a continuing cost in civilian availability."
 EMM_an_protected_reserve_spirit:0 "Protected Civil Reserve"
 EMM_an_protected_reserve_spirit_desc:0 "A maintained civil reserve strengthens confidence and resilience, while reserving capacity from ordinary civilian use."
 EMM_an_instructor_cadre_spirit:0 "Retained Instructor Cadre"
 EMM_an_instructor_cadre_spirit_desc:0 "A standing cadre improves army training. Keeping specialists available consumes political and administrative attention."
 EMM_an_readiness_ceiling_spirit:0 "Sustainable Readiness Ceiling"
 EMM_an_readiness_ceiling_spirit_desc:0 "A bounded exercise programme preserves military organisation while restraining expansion of the active establishment."
 EMM_an_domestic_reserve_spirit:0 "Replenished Domestic Reserve"
 EMM_an_domestic_reserve_spirit_desc:0 "Domestic emergency stocks protect confidence in continued assistance. Maintaining the minimum reserve ties up civilian resources."
 EMM_an_standing_service_spirit:0 "Standing Civil Repair Service"
 EMM_an_standing_service_spirit_desc:0 "Experienced crews improve repair and reconstruction work, while their permanent availability consumes civilian capacity."
 EMM_an_broad_aid_spirit:0 "Broad Assistance Mandate"
 EMM_an_broad_aid_spirit_desc:0 "A broad mandate protects civilian contact and public confidence, but requires continuing administrative work. Actual services retain their separate costs and delivery checks."
 EMM_an_conditional_aid_spirit:0 "Conditional Assistance Mandate"
 EMM_an_conditional_aid_spirit_desc:0 "Documented conditions make continuing commitments easier to defend. Negotiating those conditions consumes attention that could serve domestic reconstruction."
 EMM_an_recovery_training_spirit:0 "Restored Training Rota"
 EMM_an_recovery_training_spirit_desc:0 "A dependable instructor rotation improves training while retaining specialists away from civilian work."
 EMM_an_balanced_readiness_spirit:0 "Balanced Readiness Settlement"
 EMM_an_balanced_readiness_spirit_desc:0 "A sustainable force retains organisation and dependable support. The agreement carries a continuing civilian opportunity cost."
 EMM_an_recovery_office_spirit:0 "Permanent Recovery Office"
 EMM_an_recovery_office_spirit_desc:0 "An experienced civilian office preserves repair knowledge and public confidence, while requiring continuing staff and appropriations."
 EVA_an_audited_distribution_spirit:0 "Audited Civil Distribution"
 EVA_an_audited_distribution_spirit_desc:0 "Traceable public allocations improve confidence and construction. The military receives less discretion over scarce industrial capacity."
 EVA_an_command_distribution_spirit:0 "Command-Directed Distribution"
 EVA_an_command_distribution_spirit_desc:0 "Concentrated requisition authority protects military organisation and output, while public confidence suffers."
 EVA_an_dispatch_service_spirit:0 "National Dispatch Service"
 EVA_an_dispatch_service_spirit_desc:0 "A common dispatch record reduces supply waste while consuming permanent administrative attention."
 EVA_an_industrial_reserve_spirit:0 "Protected Industrial Maintenance"
 EVA_an_industrial_reserve_spirit_desc:0 "A protected spare-parts reserve keeps production dependable, while reducing the capacity available for civilian expansion."
 EVA_an_air_maintenance_spirit:0 "Air Maintenance Establishment"
 EVA_an_air_maintenance_spirit_desc:0 "A standing inspection and service establishment reduces accidents, while its payroll competes with civilian needs."
 EVA_an_mobile_workshops_spirit:0 "Mobile Military Workshops"
 EVA_an_mobile_workshops_spirit_desc:0 "Deployable workshop crews reduce supply demand, but reserve skilled labour from civilian construction."
 EVA_an_civil_freight_spirit:0 "Protected Emergency Civil Freight"
 EVA_an_civil_freight_spirit_desc:0 "A ring-fenced civilian allocation improves confidence in emergency provision. The protected transport cannot also serve military supply."
 EVA_an_command_reserve_spirit:0 "Trained Command Reserve"
 EVA_an_command_reserve_spirit_desc:0 "A small trained reserve supports military organisation, at a continuing administrative cost."
 EVA_an_readiness_limits_spirit:0 "Sustainable Readiness Limits"
 EVA_an_readiness_limits_spirit_desc:0 "A measured programme supports the force that can actually be maintained. It restrains the speed of military expansion."
 EVA_an_local_recovery_spirit:0 "Domestic Recovery Programme"
 EVA_an_local_recovery_spirit_desc:0 "Repair priorities remain useful under diplomatic isolation. The programme protects civilian construction while reducing military production capacity."
 EVA_an_aid_open_spirit:0 "Civil Receiving Access"
 EVA_an_aid_open_spirit_desc:0 "Open civil receiving arrangements improve confidence, while monitoring requires staff and political attention. Actual deliveries depend on a valid accepted accord."
 EVA_an_self_reliance_spirit:0 "Domestic Self-Reliance"
 EVA_an_self_reliance_spirit_desc:0 "Domestic allocation protects freedom of action and military discretion, but limits the efficiency of civilian reconstruction."
 EVA_an_aircrew_pipeline_spirit:0 "Restored Aircrew Pipeline"
 EVA_an_aircrew_pipeline_spirit_desc:0 "A sustainable instructor and maintenance pipeline improves training, while consuming permanent administrative attention."
 EVA_an_command_settlement_spirit:0 "Sustainable Command Settlement"
 EVA_an_command_settlement_spirit_desc:0 "The services retain a supportable organisation, while a continuing civil allocation limits immediate military output."
 EVA_an_recovery_office_spirit:0 "Permanent Civil Repair Office"
 EVA_an_recovery_office_spirit_desc:0 "An experienced civilian institution preserves repair knowledge and confidence. Its standing staff carry a continuing administrative cost."
 EVA_an_retained_research:0 "Retained Technical Research"
 ac_anea.101.t:0 "The Account behind the Promises"
 ac_anea.101.d:0 "The first national account is on the cabinet table. Transport officials have named the wagons that several ministries expected to use, while local authorities have listed services sustained by appropriations that were supposed to be temporary. The country has the capacity to act, but it cannot honour every promise at once. Publishing the discrepancies will invite criticism; keeping them inside the administration will leave more discretion with the officials who must resolve them. Neither course predicts the emergency that lies ahead."
 ac_anea.101.a:0 "Publish the account and invite local scrutiny."
 ac_anea.101.b:0 "Give the coordinating office authority to settle the discrepancies."
 ac_anea.102.t:0 "The Cost of a Protected Allocation"
 ac_anea.102.d:0 "The budget review has reached the point where a percentage becomes a postponed repair, an unfilled training place or an official told to explain a missed deadline. Ministers can preserve the selected national priority and pay for a public review of its costs, or give the service chiefs and civil departments more room to negotiate privately. The choice does not alter the budget by itself. It determines how visibly its consequences will be recorded and how much authority the centre must spend defending them."
 ac_anea.102.a:0 "Fund a public review of the selected allocation."
 ac_anea.102.b:0 "Keep the settlement within the responsible departments."
 ac_anea.103.t:0 "A Warning that Must Be Explained"
 ac_anea.103.d:0 "The international warning has made uncertainty a matter of ordinary government. Local officials want to know which action they should take now, and citizens want to know why scientific assessments can change without either being dishonest. The cabinet can fund a programme of practical civil instructions, or retain more of the available attention for the readiness of the services. The latter remains a military preparation: an exercised formation is not a shelter, a medical reserve or a plan for residents without transport."
 ac_anea.103.a:0 "Pay for practical civil instructions and local exercises."
 ac_anea.103.b:0 "Retain the trained military liaison staff."
 ac_anea.104.t:0 "The Shelter Work Must Be Real"
 ac_anea.104.d:0 "The revised assessment includes the eastern part of Anea, and work on the capital shelter has made emergency provision visible to the public. A building can appear complete before access, sanitation and the receiving rota are ready. The cabinet must choose whether to spend more authority testing those less visible arrangements or preserve a reserve of staff for military contingency work. The building work must be matched by people and services that can sustain those who enter."
 ac_anea.104.a:0 "Inspect access, sanitation and the receiving rota."
 ac_anea.104.b:0 "Preserve the military contingency staff."
 ac_anea.105.t:0 "What the Preparations Preserved"
 ac_anea.105.d:0 "The reports now concern actual services, rather than estimates of future danger. Some offices can use their emergency records immediately; others are still finding the people who were supposed to maintain them. The national recovery account reflects the civil preparations completed before the crisis and Emmeria's comparatively resilient starting position. Ministers can keep experienced crews on immediate civilian work or release part of their time to restore service training. Neither decision changes the completed preparedness record."
 ac_anea.105.a:0 "Keep the crews on essential civilian work."
 ac_anea.105.b:0 "Restore the service training timetable."
 ac_anea.106.t:0 "Assistance within the Republic's Means"
 ac_anea.106.d:0 "The assistance initiative for Estovakia requires cargo space, staff and receiving arrangements, not simply a declaration of sympathy. A broad mandate can keep civil contact open; a conditional mandate can defend the programme through traceable records. The cabinet must decide whether to prepare the selected policy for the bilateral accord or reserve more capacity for domestic recovery. The accord itself has a response window and requires both countries to remain eligible. An authorised service will be charged and delivered separately."
 ac_anea.106.a:0 "Prepare the selected assistance mandate for delivery."
 ac_anea.106.b:0 "Protect domestic capacity before authorising another service."
 ac_anea.107.t:0 "The Assistance Record under Review"
 ac_anea.107.d:0 "The diplomatic review has reached an actual policy decision. The cabinet must now explain what that decision requires at home: a credible inspection capacity, a domestic reserve and records that distinguish an authorised service from delivered assistance. It can retain a standing civilian review team or release some of those specialists to the services. The review date itself does not determine whether sanctions are active; the diplomatic outcome follows the recipient's policy, completed monitored services and recovery record."
 ac_anea.107.d_sanctions:0 "The review has imposed sanctions. The diplomatic review has reached an actual policy decision. The cabinet must now explain what that decision requires at home: a credible inspection capacity, a domestic reserve and records that distinguish an authorised service from delivered assistance. It can retain a standing civilian review team or release some of those specialists to the services. The review date itself does not determine whether sanctions are active; the diplomatic outcome follows the recipient's policy, completed monitored services and recovery record."
 ac_anea.107.d_alternative:0 "The review has accepted an earned alternative to sanctions. The diplomatic review has reached an actual policy decision. The cabinet must now explain what that decision requires at home: a credible inspection capacity, a domestic reserve and records that distinguish an authorised service from delivered assistance. It can retain a standing civilian review team or release some of those specialists to the services. The review date itself does not determine whether sanctions are active; the diplomatic outcome follows the recipient's policy, completed monitored services and recovery record."
 ac_anea.107.d_lifted:0 "Verified reforms have earned the lifting of previously imposed sanctions. The diplomatic review has reached an actual policy decision. The cabinet must now explain what that decision requires at home: a credible inspection capacity, a domestic reserve and records that distinguish an authorised service from delivered assistance. It can retain a standing civilian review team or release some of those specialists to the services. The review date itself does not determine whether sanctions are active; the diplomatic outcome follows the recipient's policy, completed monitored services and recovery record."
 ac_anea.107.d_limited:0 "The review has recorded a limited or ineligible diplomatic relationship. The diplomatic review has reached an actual policy decision. The cabinet must now explain what that decision requires at home: a credible inspection capacity, a domestic reserve and records that distinguish an authorised service from delivered assistance. It can retain a standing civilian review team or release some of those specialists to the services. The review date itself does not determine whether sanctions are active; the diplomatic outcome follows the recipient's policy, completed monitored services and recovery record."
 ac_anea.107.a:0 "Keep an independent civilian review team."
 ac_anea.107.b:0 "Return part of the staff to readiness work."
 ac_anea.108.t:0 "An Institution or an Immediate Dividend"
 ac_anea.108.d:0 "The final recovery account has reached the cabinet after the relevant work was completed. It records civilian services, sustained defence capability and assistance actually delivered, including the cost of programmes that were refused or interrupted. A permanent recovery office would preserve skilled staff and institutional memory, while imposing a continuing claim on public administration. Releasing that capacity would bring an immediate civilian benefit but leave less standing expertise for another disruption. This assessment closes the covered national programme without predicting the next war."
 ac_anea.108.a:0 "Maintain a permanent recovery office."
 ac_anea.108.b:0 "Release the reserve for immediate civilian recovery."
 ac_anea.201.t:0 "Several Countries in One Set of Returns"
 ac_anea.201.d:0 "The first reconciled account shows how far apart the reports have drifted. A workshop counted as available by one ministry is waiting for parts in another; transport promised to a district also appears in a military exercise plan. The administration can expose the contradictions and accept the political cost, or concentrate authority in a small coordinating staff. The choice will shape how shortages are explained and who has the authority to demand a correction when an official return conceals a missing service."
 ac_anea.201.a:0 "Publish the discrepancies and hear the districts."
 ac_anea.201.b:0 "Give the coordinating staff authority to reconcile them."
 ac_anea.202.t:0 "Who Can Challenge an Allocation?"
 ac_anea.202.d:0 "The distribution register has made a political problem visible. A district can acknowledge that an order exists while still receiving none of the supplies it describes. Civil inspectors ask for the power to trace the consignment and hear an appeal. The command authorities argue that every additional signature slows urgent work. The government can fund scrutiny of its selected distribution policy, or preserve more discretion inside the responsible offices. The enduring audit or command policy remains a separate national commitment."
 ac_anea.202.a:0 "Pay for an accountable public complaints record."
 ac_anea.202.b:0 "Retain discretion within the allocating offices."
 ac_anea.203.t:0 "Protection before Certainty"
 ac_anea.203.d:0 "The international warning has reached the district offices before anyone can give them a complete local picture. The administration must distinguish measures that can protect civilians from promises depending on unfinished technology. It can fund practical surveys and emergency engineering, or keep more technical staff within the military readiness programme. Both have an opportunity cost. Only the civil protection work directly improves shelter access, evacuation arrangements and essential services for the public."
 ac_anea.203.a:0 "Fund the civil engineering and shelter surveys."
 ac_anea.203.b:0 "Preserve technical staff for command readiness."
 ac_anea.204.t:0 "Anea Enters the Revised Estimate"
 ac_anea.204.d:0 "The revised scientific estimate includes the possibility of fragments falling in eastern Anea. District authorities need instructions based on what can actually be completed before the emergency. They ask for protected transport and engineering teams. Technical advocates also argue for preserving the personnel committed to the unfinished anti-asteroid undertaking. The government can reinforce practical civilian work or retain a record and team for future technical research. Preserving that research will not make the Chandelier operational when Ulysses arrives."
 ac_anea.204.a:0 "Protect district transport and civilian engineering."
 ac_anea.204.b:0 "Retain the specialist technical record and staff."
 ac_anea.205.t:0 "The Returns after the Crisis"
 ac_anea.205.d:0 "District reports describe interrupted services, lost connections and repair teams without the parts they expected. The national account combines inspected district reports with the shortages confirmed by transport and utility offices. Completed civil preparedness has mitigated the initial disruption, while the unfinished strategic undertaking provides no retroactive protection. The administration can place available specialists on water and sanitation or restore military maintenance first. The decision changes the work that happens next; it cannot rewrite preparations that were never completed."
 ac_anea.205.a:0 "Put essential civilian services first."
 ac_anea.205.b:0 "Restore the military maintenance establishment first."
 ac_anea.206.t:0 "The Conditions of Receiving Assistance"
 ac_anea.206.d:0 "The aid initiative has made receiving arrangements a matter of national policy. Delivery records mean little if inspectors cannot trace a consignment after it leaves the warehouse. The government can establish audited civilian distribution, paying the political cost of changing earlier practice, or keep its present allocation system and prepare a more self-reliant recovery. This choice does not answer a pending diplomatic offer on the country's behalf. The separate accord still requires an eligible response, and every service has its own costs and delivery checks."
 ac_anea.206.a:0 "Establish audited civilian distribution for the recovery programme."
 ac_anea.206.b:0 "Retain the current allocation and strengthen domestic repair."
 ac_anea.207.t:0 "An Answer Based on the Actual Record"
 ac_anea.207.d:0 "The sanctions review has produced its actual diplomatic outcome. A change of language cannot replace completed monitored services, accountable distribution and restored civilian capacity. The administration must now decide whether to publish a repair timetable that can be checked or preserve more of its discretion for military readiness. The first course improves domestic recovery under either diplomatic outcome. The second keeps trained staff in the services while accepting that civilian confidence will recover more slowly."
 ac_anea.207.d_sanctions:0 "The review has imposed sanctions. The sanctions review has produced its actual diplomatic outcome. A change of language cannot replace completed monitored services, accountable distribution and restored civilian capacity. The administration must now decide whether to publish a repair timetable that can be checked or preserve more of its discretion for military readiness. The first course improves domestic recovery under either diplomatic outcome. The second keeps trained staff in the services while accepting that civilian confidence will recover more slowly."
 ac_anea.207.d_alternative:0 "The review has accepted an earned alternative to sanctions. The sanctions review has produced its actual diplomatic outcome. A change of language cannot replace completed monitored services, accountable distribution and restored civilian capacity. The administration must now decide whether to publish a repair timetable that can be checked or preserve more of its discretion for military readiness. The first course improves domestic recovery under either diplomatic outcome. The second keeps trained staff in the services while accepting that civilian confidence will recover more slowly."
 ac_anea.207.d_lifted:0 "Verified reforms have earned the lifting of previously imposed sanctions. The sanctions review has produced its actual diplomatic outcome. A change of language cannot replace completed monitored services, accountable distribution and restored civilian capacity. The administration must now decide whether to publish a repair timetable that can be checked or preserve more of its discretion for military readiness. The first course improves domestic recovery under either diplomatic outcome. The second keeps trained staff in the services while accepting that civilian confidence will recover more slowly."
 ac_anea.207.d_limited:0 "The review has recorded a limited or ineligible diplomatic relationship. The sanctions review has produced its actual diplomatic outcome. A change of language cannot replace completed monitored services, accountable distribution and restored civilian capacity. The administration must now decide whether to publish a repair timetable that can be checked or preserve more of its discretion for military readiness. The first course improves domestic recovery under either diplomatic outcome. The second keeps trained staff in the services while accepting that civilian confidence will recover more slowly."
 ac_anea.207.a:0 "Publish a repair timetable that can be checked."
 ac_anea.207.b:0 "Protect the service cadres and retain allocation discretion."
 ac_anea.208.t:0 "What Must Survive the Emergency"
 ac_anea.208.d:0 "The concluding account is based on work completed, supplies delivered and the sustained cost of the chosen military establishment. It may record effective assistance, limited cooperation or a recovery pursued under isolation. The government can preserve a permanent civilian repair institution with a continuing administrative cost, or release its reserve into immediate reconstruction. Either decision will shape the services available to the next administration, which must inherit a usable record of the promises made and the capacity that remains."
 ac_anea.208.a:0 "Preserve a permanent civil repair office."
 ac_anea.208.b:0 "Use the reserve for immediate reconstruction."
 ac_anea_emm_plan_name:0 "Emmerian recovery priorities"
 ac_anea_emm_plan_desc:0 "Historical policy preferences with independently evaluated aid and recovery outcomes."
 ac_anea_eva_plan_name:0 "Estovakian recovery priorities"
 ac_anea_eva_plan_desc:0 "Historical policy preferences with independently evaluated aid and recovery outcomes."
