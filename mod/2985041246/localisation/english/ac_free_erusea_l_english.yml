 ERU_fe_route_context_0:0 "Since September 2005 the provisional government has worked under ISAF oversight. The surrender terms and supervision protocols are among the files, and the choice to accept them was made in Farbanti before this cabinet met."
 ERU_fe_route_context_1:0 "The war ended in Erusea's favour. Among the files are garrison returns and administrative orders for districts the army still holds, with the cost of each."
 ERU_fe_route_context_2:0 "The war ended in an armistice. Among the files are the armistice terms, the incident reports from the line and the reserve lists that keep it manned."
 ERU_fe_route_context_3:0 "The war many expected did not come. Among the files are the emergency rules, reserve plans and special budgets written for it, most of them still in force."
 ERU_fe_route_context_4:0 "Among the files are the records of the Continental War years and the obligations they left behind."
 FCU_fe_route_context_0:0 "Since September 2005 those promises include support for Erusea's provisional government under ISAF oversight."
 FCU_fe_route_context_1:0 "The war ended in Erusea's favour, and some of those promises were made for an outcome that did not happen."
 FCU_fe_route_context_2:0 "The war ended in an armistice, and several promises assumed a peace treaty that was never signed."
 FCU_fe_route_context_3:0 "The war many expected did not come, and several promises were made for a war that never started."
 FCU_fe_route_context_4:0 "Several of those promises were made for circumstances that have since changed."
