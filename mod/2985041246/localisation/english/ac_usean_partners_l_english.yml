 SNS_up_scope_dispatch_chain:0 "Inspect the Dispatch Chain"
 SNS_up_scope_dispatch_chain_desc:0 "Check signed instructions, route permission, receipt and the allocation appeal together. The complete chain supports dependable existing supply while reserving political attention.\n\nConsumes one verified continuity record. The record or slot is not refunded, including after interruption. One operational scope may run at a time. Its benefits and opportunity costs last 90 days. All listed focus capabilities are required; they are distinct parts of this service rather than interchangeable capacity points."
