 DEL_camp_0_register:0 "A signature that survives"
 DEL_camp_0_register_desc:0 "A signature that survives. Open the campaign lane and its preparation record.\n\nThe inspector recognizes the signature before she recognizes the error. It belongs to an officer who was helpful during the last crisis, and that makes asking for the original file more difficult. Independent inspection preserves a route around the command that issued the order. Command inspection can obtain faster cooperation while narrowing the people allowed to dispute its conclusions. The operational docket records a defined service to the coalition. It cannot erase the unresolved cases that made the inspection necessary, or treat an unanswered foreign request as an acceptance."
