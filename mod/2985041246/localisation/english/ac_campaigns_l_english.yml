 ac_camp.5.t:0 "The purpose of the search"
 ac_camp.5.desc:0 "The sergeant had arranged the contents of the stopped vehicle on a tarpaulin. He was proud of the orderliness. Boxes of dressings stood in one row, bottles in another, and a small bag of personal belongings occupied a space of its own. The driver watched the bag rather than the medicines.\n\nThe duty officer read the search return. There was no contraband. There was a letter, which had therefore become the most interesting object present. The sergeant had placed it beneath a clean stone to keep the wind from turning it over.\n\n\"It could be a code.\"\n\n\"Anything could be a code.\"\n\nThe answer sounded sharper than the officer intended. Behind him, a corporal was repeating the vehicle's permit number into a radio that would not give a clear reply. The delay had become a reason for further delay. Every additional question demonstrated the diligence of the men asking it while making the original permission a little less useful.\n\nThe officer could limit the search to the authority stated on the permit. That would mean returning the letter unread and taking responsibility for what he had chosen not to know. He could also retain it for examination, release the medicines, and report that the route remained open. Both accounts would be technically defensible in the office receiving them.\n\nThe driver asked whether he could put the bag back in the cab. He addressed the question to the sergeant, because that was the man holding it. The officer realized that neither of them was waiting for an explanation of policy."
 ac_camp.5.a:0 "Search within the written authority."
 ac_camp.5.b:0 "Retain the correspondence for examination."
 ac_camp.5.z:0 "Close this old message."
