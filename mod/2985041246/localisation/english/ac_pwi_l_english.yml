l_english:
 ac_pwi_aftermath:0 "The Peace We Inherit"
 ac_pwi_recovery:0 "Recovery"
 ac_pwi_confidence:0 "Political confidence"
 ac_pwi_tension:0 "Settlement tension"
 ac_pwi_preparedness:0 "Preparedness"
 ac_pwi_relief_capacity:0 "Relief capacity"
 ac_pwi_aftermath_desc:0 "POSTWAR CABINET BRIEFING\nRecovery: [?ac_pwi_recovery|.0]/100. Political confidence: [?ac_pwi_confidence|.0]/100. Settlement tension: [?ac_pwi_tension|.0]/100.\nPressures change through policy and events; they do not decay every week. High tension can produce a diplomatic crisis, never an automatic new war. These indices are provisional gameplay measures.\nPreparedness: [?ac_pwi_preparedness|.0]/100. Calendar milestones continue during war; domestic reconstruction resumes when peace returns."
 ac_pwi.1.t:0 "The peace we inherit"
 ac_pwi.1.d:0 "The maps record the outcome of the war. They do not record the families waiting for news, the soldiers awaiting orders, or the ministries competing for the means to rebuild. [Root.GetLeader]'s government must publish a program it can sustain. Recovery, political confidence and settlement tension will follow the decisions taken here."
 ac_pwi.1.a:0 "Open the postwar cabinet brief."
 ac_pwi.2.t:0 "Soldiers at the station"
 ac_pwi.2.d:0 "Returning personnel bring skills that the country needs in uniform and in civilian life. Employers want hands; commanders want cadres. The government cannot promise every veteran both an immediate discharge and a permanent military post."
 ac_pwi.2.a:0 "Fund civilian reintegration."
 ac_pwi.2.b:0 "Retain an experienced training cadre."
 ac_pwi.3.t:0 "Emergency powers after the emergency"
 ac_pwi.3.d:0 "The offices established during the war still control documents, appointments and access. Civilian oversight would reassure some communities. Security officials warn that a rapid dismantling would scatter expertise. The cabinet must define an accountable mandate or accept the political cost of retaining exceptional powers."
 ac_pwi.3.a:0 "Require public oversight."
 ac_pwi.3.b:0 "Retain powers under a restricted mandate."
 ac_pwi_repair_program:0 "Commission a recovery program"
 ac_pwi_repair_program_desc:0 "Spend political capital on recovery: recovery +8, confidence +3. Available below 75 recovery, once every 180 days. If the fiscal prototype is enabled, requests its existing reconstruction policy; no separate treasury is created."
 ac_pwi_public_accounts:0 "Publish the public accounts"
 ac_pwi_public_accounts_desc:0 "Release audited progress reports: confidence +8, tension -3. Available below 70 confidence, once every 180 days. This is political accountability, not a cash transaction."
 ac_pwi_deescalate:0 "Convene a settlement review"
 ac_pwi_deescalate_desc:0 "Offer a public review of disputed commitments: tension -15, confidence -3, war support -2 percentage points. Available at 50 tension or higher, once every 180 days. No territory, cores or treaty obligations change automatically."
 ac_pwi_rearm:0 "Retain military production capacity"
 ac_pwi_rearm_desc:0 "Prioritize military readiness: army experience +10, confidence +3, recovery -5, tension +10. Requires the revanchist program or a containment policy. Once every 180 days; grants no war goal."
 ac_pwi.50.t:0 "The settlement under strain"
 ac_pwi.50.d:0 "Foreign offices are asking whether preparations announced as defensive remain compatible with the peace. [Root.GetLeader] can accept a costly review or defend the government's discretion. Neither answer settles the dispute by force."
 ac_pwi.50.a:0 "Pay the political cost of a review."
 ac_pwi.50.b:0 "Maintain our position."
 ac_pwi.51.t:0 "Confidence in the cabinet"
 ac_pwi.51.d:0 "Promises have outpaced the government's capacity to deliver. The ministries propose either a public reconstruction review or a narrower program. Both leave a route back to recovery; neither can erase the cost of earlier decisions."
 ac_pwi.51.a:0 "Pay for a public reconstruction review."
 ac_pwi.51.b:0 "Narrow the program and defend it."
 ac_pwi_missing:0 "Account for the Missing"
 ac_pwi_missing_desc:0 "Open war records and prisoner inquiries. Families need an answer that can survive a change of government."
 ac_pwi_soldiers:0 "Receive the Returning Soldiers"
 ac_pwi_soldiers_desc:0 "Decide how returning personnel divide their future between civilian life and military service."
 ac_pwi_services:0 "Restore Essential Services"
 ac_pwi_services_desc:0 "Restore the administrative capacity needed to deliver relief. This adds no duplicate factory or inherited reconstruction reward."
 ac_pwi_powers:0 "Review the Emergency Powers"
 ac_pwi_powers_desc:0 "Define what wartime institutions may retain, and to whom they must answer."
 ac_pwi_commission:0 "Convene the Reconstruction Commission"
 ac_pwi_commission_desc:0 "Put competing reconstruction proposals before the cabinet. Publish the costs instead of promising that every ministry can expand at once."
 ac_pwi_program:0 "Publish the Settlement Program"
 ac_pwi_program_desc:0 "Commit the government to an initial postwar program. The institutions already governing Belka remain in place."
 ac_pwi_defeat_obligations:0 "Read the Settlement Obligations"
 ac_pwi_defeat_obligations_desc:0 "Distinguish binding inherited consequences from demands that still require negotiation."
 ac_pwi_defeat_repair:0 "Rebuild a Viable State"
 ac_pwi_defeat_repair_desc:0 "Prioritize essential capacity over prestige projects. The peace has left a government to preserve, not an unlimited reconstruction fund."
 ac_pwi_defeat_reform:0 "Reform the Defeated Forces"
 ac_pwi_defeat_reform_desc:0 "Rebuild training and civilian oversight without erasing the inherited government or granting a new arsenal."
 ac_pwi_defeat_neighbors:0 "Deal with the Victorious Powers"
 ac_pwi_defeat_neighbors_desc:0 "Authorize talks from Belka's actual position after defeat. Any assistance still requires the other government to agree."
 ac_pwi_victory_administration:0 "Administer the Existing Gains"
 ac_pwi_victory_administration_desc:0 "Create a workable administration for the territory the inherited peace actually transferred. Annexed Ustio is handled here; this creates no new borders or restoration."
 ac_pwi_victory_costs:0 "Publish the Cost of Occupation"
 ac_pwi_victory_costs_desc:0 "Military victory does not exempt the treasury and civil service from the cost of governing."
 ac_pwi_victory_expectations:0 "Answer the Veterans' Expectations"
 ac_pwi_victory_expectations_desc:0 "Recognize service without promising every veteran a permanent place in an expanding army."
 ac_pwi_victory_dividend:0 "Secure a Sustainable Victory"
 ac_pwi_victory_dividend_desc:0 "Choose an administration that can outlast the victory parade. This does not repeat the inherited victory-tree rewards."
 ac_pwi_wacht_terms:0 "Publish the Narrow Peace"
 ac_pwi_wacht_terms_desc:0 "Describe what Wacht am Wal actually achieved. A limited settlement is not a mandate for every wartime claim."
 ac_pwi_wacht_frontier:0 "Review the Frontier Establishment"
 ac_pwi_wacht_frontier_desc:0 "Balance reassurance at home against the signal sent to neighboring governments."
 ac_pwi_wacht_recognition:0 "Seek Recognition of the Settlement"
 ac_pwi_wacht_recognition_desc:0 "Prepare reciprocal diplomacy rather than assuming recognition has already been granted."
 ac_pwi_wacht_restraint:0 "Make Restraint Credible"
 ac_pwi_wacht_restraint_desc:0 "Turn the narrower peace into a durable program without disguising it as conventional victory."
 ac_pwi.4.t:0 "A state after defeat"
 ac_pwi.4.d:0 "The cabinet has reviewed the obligations, recovery priorities and armed forces it inherited. The monarchy or other government already established by the existing campaign remains in office. The next decision concerns its policy, not a compulsory change of constitution."
 ac_pwi.4.a:0 "Put the postwar direction before the cabinet."
 ac_pwi.5.t:0 "A victory that must be governed"
 ac_pwi.5.d:0 "Administration now follows the military settlement. The resources committed to governing cannot also be spent twice on domestic recovery. Belka can seek accommodation, consolidate control, or retain capacity for future confrontation."
 ac_pwi.5.a:0 "Put the postwar direction before the cabinet."
 ac_pwi.6.t:0 "A peace narrower than the slogans"
 ac_pwi.6.d:0 "Wacht am Wal has its own balance of risks and opportunities. The government can build on restraint or interpret the settlement as temporary. Neighboring capitals will judge the program by what follows."
 ac_pwi.6.a:0 "Put the postwar direction before the cabinet."
 ac_pwi_negotiated_1:0 "Civilian Oversight"
 ac_pwi_negotiated_1_desc:0 "Negotiated Recovery: Make recovery and accountable administration the government's priority. Cooperation requires reciprocal consent; military recovery is slower."
 ac_pwi_negotiated_2:0 "Offer Reconstruction Agreements"
 ac_pwi_negotiated_2_desc:0 "Negotiated Recovery: Make recovery and accountable administration the government's priority. Cooperation requires reciprocal consent; military recovery is slower."
 ac_pwi_negotiated_3:0 "Reintegrate the Wartime Institutions"
 ac_pwi_negotiated_3_desc:0 "Negotiated Recovery: Make recovery and accountable administration the government's priority. Cooperation requires reciprocal consent; military recovery is slower."
 ac_pwi_negotiated_4:0 "A Government of Recovery"
 ac_pwi_negotiated_4_desc:0 "Negotiated Recovery: Make recovery and accountable administration the government's priority. Cooperation requires reciprocal consent; military recovery is slower."
 ac_pwi.10.t:0 "Negotiated Recovery: the national settlement"
 ac_pwi.10.d:0 "The government has committed itself to rebuilding through accommodation. Public oversight and international agreements offer stability, but the recovery program leaves less room for rapid military expansion."
 ac_pwi.10.a:0 "Carry this settlement into the coming years."
 ac_pwi_authoritarian_1:0 "Centralize the Reconstruction Offices"
 ac_pwi_authoritarian_1_desc:0 "Authoritarian Consolidation: Concentrate authority to deliver the program. Administrative and military benefits come with restrictions and greater foreign suspicion."
 ac_pwi_authoritarian_2:0 "Define the Security Mandate"
 ac_pwi_authoritarian_2_desc:0 "Authoritarian Consolidation: Concentrate authority to deliver the program. Administrative and military benefits come with restrictions and greater foreign suspicion."
 ac_pwi_authoritarian_3:0 "Control the Reconstruction Program"
 ac_pwi_authoritarian_3_desc:0 "Authoritarian Consolidation: Concentrate authority to deliver the program. Administrative and military benefits come with restrictions and greater foreign suspicion."
 ac_pwi_authoritarian_4:0 "A Government of Order"
 ac_pwi_authoritarian_4_desc:0 "Authoritarian Consolidation: Concentrate authority to deliver the program. Administrative and military benefits come with restrictions and greater foreign suspicion."
 ac_pwi.11.t:0 "Authoritarian Consolidation: the national settlement"
 ac_pwi.11.d:0 "The government has placed reconstruction under concentrated authority. Administrative and military institutions are more closely aligned. Restrictions at home and suspicion abroad are part of that settlement."
 ac_pwi.11.a:0 "Carry this settlement into the coming years."
 ac_pwi_revanchist_1:0 "Retain the Military Cadres"
 ac_pwi_revanchist_1_desc:0 "Revanchist Preparation: Retain the means to challenge the peace. Readiness comes at the expense of civilian recovery and access to cooperation; this grants no war goal."
 ac_pwi_revanchist_2:0 "Protect Military Production"
 ac_pwi_revanchist_2_desc:0 "Revanchist Preparation: Retain the means to challenge the peace. Readiness comes at the expense of civilian recovery and access to cooperation; this grants no war goal."
 ac_pwi_revanchist_3:0 "Challenge the Settlement Diplomatically"
 ac_pwi_revanchist_3_desc:0 "Revanchist Preparation: Retain the means to challenge the peace. Readiness comes at the expense of civilian recovery and access to cooperation; this grants no war goal."
 ac_pwi_revanchist_4:0 "A Government of Armed Revision"
 ac_pwi_revanchist_4_desc:0 "Revanchist Preparation: Retain the means to challenge the peace. Readiness comes at the expense of civilian recovery and access to cooperation; this grants no war goal."
 ac_pwi.12.t:0 "Revanchist Preparation: the national settlement"
 ac_pwi.12.d:0 "The government has retained cadres and industrial capacity for a challenge to the settlement. Other capitals have reasons to be cautious. The program leaves Belka prepared for crises, without committing the country to a second war."
 ac_pwi.12.a:0 "Carry this settlement into the coming years."
 OSE_pwi_brief:0 "The Cost of Peace"
 OSE_pwi_brief_desc:0 "Place the settlement before Congress. Osea's role depends on the outcome actually reached."
 OSE_pwi_accounts:0 "Balance Home and Overseas Commitments"
 OSE_pwi_accounts_desc:0 "Review assistance against domestic priorities; neither budget is unlimited."
 OSE_pwi_oversight:0 "Review the Military Mandate"
 OSE_pwi_oversight_desc:0 "Require civilian oversight of continued military commitments."
 OSE_pwi_guarantor:0 "A Victorious Power's Responsibility"
 OSE_pwi_guarantor_desc:0 "Prepare assistance and security diplomacy from a position of victory. Other governments retain the right to refuse."
 OSE_pwi_constraints:0 "Recognize the Limits of Our Position"
 OSE_pwi_constraints_desc:0 "A constrained Osea must rebuild credibility rather than assume the role of victorious guarantor."
 OSE_pwi_commitments:0 "Publish the Foreign Commitments"
 OSE_pwi_commitments_desc:0 "Offer one-to-one reconstruction accords. Recognition and aid require a genuine response."
 OSE_pwi_dialogue:0 "Keep the Settlement Open to Dialogue"
 OSE_pwi_dialogue_desc:0 "Use conditional cooperation and public scrutiny instead of military pressure."
 OSE_pwi_containment:0 "Prepare a Containment Policy"
 OSE_pwi_containment_desc:0 "Retain military capacity and challenge hostile preparations. Tension rises; no new war is scripted."
 UST_pwi_brief:0 "An Ustian Postwar Administration"
 UST_pwi_brief_desc:0 "Rebuild through the government and Ratio branch that survived. This does not change the country's sovereignty or focus tree."
 UST_pwi_personnel:0 "Bring the Personnel Home"
 UST_pwi_personnel_desc:0 "Integrate returning soldiers and contracted specialists into accountable institutions."
 UST_pwi_institutions:0 "Rebuild the Civil Administration"
 UST_pwi_institutions_desc:0 "Make recovery visible beyond the armed forces."
 UST_pwi_sovereignty:0 "Negotiate as an Independent Republic"
 UST_pwi_sovereignty_desc:0 "Independent Ustio can accept assistance while retaining discretion over its security arrangements."
 UST_pwi_subject:0 "Work Within the Surviving Administration"
 UST_pwi_subject_desc:0 "A subject Ustio can rebuild domestic institutions without pretending it has independent treaty powers."
 UST_pwi_expertise:0 "Define the Role of Contracted Expertise"
 UST_pwi_expertise_desc:0 "Use military expertise for training, with civilian contracts and a clear command structure."
 UST_pwi_security:0 "Review the Security Relationships"
 UST_pwi_security_desc:0 "Seek an assistance accord only when sovereignty, peace and a willing partner permit it."
 UST_pwi_legacy:0 "A State Able to Endure"
 UST_pwi_legacy_desc:0 "Publish a durable reconstruction and security program without erasing the surviving Ratio outcome."
 SAP_pwi_brief:0 "The Government's Peace Dividend"
 SAP_pwi_brief_desc:0 "Put war costs before the institutions already governing Sapin. Preserve the existing balance of power and regency arrangements."
 SAP_pwi_costs:0 "Account for the War Costs"
 SAP_pwi_costs_desc:0 "Choose a transparent recovery program instead of concealing commitments."
 SAP_pwi_demobilize:0 "Negotiate Demobilization"
 SAP_pwi_demobilize_desc:0 "Manage returning soldiers without making military loyalty a substitute for political consent."
 SAP_pwi_loyalty:0 "Affirm the Military Chain of Command"
 SAP_pwi_loyalty_desc:0 "Clarify the armed forces' mandate under the government actually in office."
 SAP_pwi_commitments:0 "Review Foreign Commitments"
 SAP_pwi_commitments_desc:0 "Offer reconstruction diplomacy where independence and peace permit it; acknowledge constraints where they do not."
 SAP_pwi_legacy:0 "A Peace the Government Can Defend"
 SAP_pwi_legacy_desc:0 "Carry a coherent domestic settlement into the approaching international crisis."
 GEB_pwi_brief:0 "Recovery on Our Own Terms"
 GEB_pwi_brief_desc:0 "Inventory the government, sovereignty and industrial capacity that Gebet actually retains."
 GEB_pwi_industry:0 "Restore Industrial Coordination"
 GEB_pwi_industry_desc:0 "Prioritize repairs and allocation rather than receiving another free factory."
 GEB_pwi_resources:0 "Secure the Recovery Supply Chain"
 GEB_pwi_resources_desc:0 "Connect resource planning with civilian needs. This creates no new deposits or borders."
 GEB_pwi_security:0 "Review the Security Establishment"
 GEB_pwi_security_desc:0 "Define what can be sustained after demobilization."
 GEB_pwi_neighbors:0 "Negotiate with the Neighbors"
 GEB_pwi_neighbors_desc:0 "Independent Gebet can consider reciprocal accords. A subject administration must work within its actual authority."
 GEB_pwi_legacy:0 "An Enduring Peace Dividend"
 GEB_pwi_legacy_desc:0 "Make recovery and restrained security policy the basis of the next period."
 ac_pwi_blk_ose_offer:0 "Offer a reconstruction accord to Osea"
 ac_pwi_blk_ose_offer_desc:0 "Authorize a reciprocal reconstruction and relief accord. The other government may accept or refuse. The offer lapses after 60 days, or if either party ceases to be independent and at peace. Acceptance improves recovery, confidence and relations for both parties. One negotiation per pair; no rewards are paid merely for sending."
 ac_pwi_blk_ose_withdraw:0 "Withdraw the reconstruction offer to Osea"
 ac_pwi_blk_ose_withdraw_desc:0 "Withdraw the outstanding offer. A delayed reply cannot reactivate it or award cooperation benefits."
 ac_pwi.100.t:0 "A reconstruction offer from Belka"
 ac_pwi.100.d:0 "The government of Belka proposes reciprocal reconstruction and emergency-relief coordination. Both governments must remain independent and at peace. Acceptance supports reconstruction and improves relations; refusal leaves the domestic program intact. No territory or sovereignty is transferred."
 ac_pwi.100.a:0 "Accept the accord and its administrative commitments."
 ac_pwi.100.b:0 "Decline, or acknowledge that the offer is no longer valid."
 ac_pwi.101.t:0 "The reconstruction accord is accepted"
 ac_pwi.101.d:0 "The other government has agreed to reciprocal coordination. The accord supports recovery and supplies a potential relief partner during the approaching crisis. Cooperation remains conditional on both countries retaining the ability to participate."
 ac_pwi.101.a:0 "Record the agreement."
 ac_pwi.102.t:0 "A reconstruction negotiation closes"
 ac_pwi.102.d:0 "The negotiation has ended without an accord: it was declined, withdrawn, expired, or invalidated by changed circumstances. No assistance was booked and no recovery reward was paid. The cabinet may pursue its domestic recovery program."
 ac_pwi.102.a:0 "Close the diplomatic file."
 ac_pwi.103.t:0 "A relief partner can no longer participate"
 ac_pwi.103.d:0 "War, capitulation, annexation or a change in sovereignty has made the accord inoperative. Earlier reconstruction work is not erased, but the government can no longer count this partner toward future relief capacity."
 ac_pwi.103.a:0 "Update the emergency plans."
