 YUK_snc_field_answers_protocol_effect_tt:0 "Open a fresh review request. Complete the corresponding selected-lane SNP service after this request; existing payments and national reservations remain owned by that service."
 YUK_snc_field_answers_review:0 "Return to the First Question"
 YUK_snc_field_answers_review_desc:0 "The completed period ends with the first question still attached to its answer. A reviewing officer says the pair makes the instruction seem less decisive. The receiving secretary says it makes the responsibility easier to find. Review the actual training work and the burden accepted by its selected lane. A cancelled period cannot be counted merely because the old completion stamp remains in the archive. The useful finding is whether an officer could ask for clarification without disappearing from the account, and whether the person who answered could explain the authority used to do so."
 YUK_snc_field_answers_review_requirements_tt:0 "From 2006.1.1, an active national administration and the required earlier work are available. A corresponding selected-lane funded service must have genuinely completed after this branch requested its review."
 YUK_snc_field_answers_review_effect_tt:0 "Record the corresponding genuinely completed funded period after this branch requested it."
