 ac_camp.104.t:0 "The country under the seal"
 ac_camp.104.desc:0 "The settlement files contain the country that actually emerged from the earlier war. A conventional defeat, a narrow peace and an alternate victory cannot all produce the same veterans' meeting. The clerk lays out the surviving orders and waits while the visitors decide which parts they would prefer not to remember. Opening the archive commits the government to hearing a record that can contradict its most useful story. Closing it leaves that story available to people whose authority depends on nobody asking what the documents say."
 ac_camp.104.a:0 "Circulate a public receiving account."
 ac_camp.104.b:0 "Keep a signed professional return."
