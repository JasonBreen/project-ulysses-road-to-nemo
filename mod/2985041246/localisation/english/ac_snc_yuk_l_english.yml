 ac_snc_yuk_message_1.t:0 "The Names beneath the Totals"
 ac_snc_yuk_message_1.d:0 "The allocation return balances before anyone enters the room. A receiving secretary has nevertheless left a column unfinished. Beside the totals she wants the names of the offices expected to answer for them. The command liaison calls this unnecessary detail until a workshop representative asks him who can amend a reservation when its original recipient is no longer available. He cannot find the answer in the balanced columns. The hearing begins there. It will retain the government's inherited intervention and command choices, but ask a more immediate question: who is allowed to say that the work requested on paper has not reached the people expected to receive it?"
 ac_snc_yuk_message_1_public_spirit:0 "Place the account before the public."
 ac_snc_yuk_message_1_public_spirit_desc:0 "The received account changes how the office answers for this work over the next ninety days. The selected benefit carries the continuing cost shown here."
 ac_snc_yuk_message_1_reply_0:0 "Place the account before the public."
 ac_snc_yuk_message_1_reply_0_tt:0 "Retain the public account as a persistent choice. For ninety days, apply the shown benefit and its distinct continuing cost."
 ac_snc_yuk_message_1_staff_spirit:0 "Keep a signed professional account."
 ac_snc_yuk_message_1_staff_spirit_desc:0 "The received account changes how the office answers for this work over the next ninety days. The selected benefit carries the continuing cost shown here."
 ac_snc_yuk_message_1_reply_1:0 "Keep a signed professional account."
 ac_snc_yuk_message_1_reply_1_tt:0 "Retain the staff account as a persistent choice. For ninety days, apply the shown benefit and its distinct continuing cost."
 ac_snc_yuk_message_1_expired:0 "Keep the unanswered account in the file."
 YUK_snc_field_answers_civil_spirit:0 "Civil hearing for field questions"
 YUK_snc_field_answers_civil_spirit_desc:0 "The civil receiving representative asks that a question from the field be heard before it is classified as a failure to obey. The command liaison agrees that an honest uncertainty can improve an instruction, but warns that answering it will take political attention and trained staff. Accept that burden. The resulting procedure supports professional cohesion through an account that people can challenge. It does not rewrite the government's inherited command reform or its earlier intervention decision. It gives the existing structure a clearer way to distinguish an officer asking for missing information from an officer refusing a responsibility already understood."
 YUK_snc_field_answers_civil_spirit_settled:0 "Civil hearing for field questions: Standing Review"
 YUK_snc_field_answers_civil_spirit_settled_desc:0 "The standing receiving procedure can now identify the officer allowed to answer a question and the account in which that answer will remain. Retain the chosen civil or protected policy, improving its practice through the completed review without removing its cost. The inherited intervention and command records remain their own responsibilities. A later diplomatic effort may read this earned verification account, but the procedure is useful even when no foreign partner accepts an exchange. Its immediate achievement is that the person expected to act can find the limit of the instruction and somebody responsible for explaining it."
 YUK_snc_field_answers_protected_spirit:0 "Protected staff countercheck"
 YUK_snc_field_answers_protected_spirit_desc:0 "The staff propose keeping a protected countercheck within the professional chain. A question would reach a named officer who must either answer it or sign the reason it remains unanswered. Civil services will bear the opportunity cost of the protected schedule. An expeditionary command can adopt that responsibility without pretending to have selected delegated field reform. Its credibility depends on preserving the objection beside the final instruction, including when a more convenient account would describe the matter as settled. A protected answer must still be an answer somebody is prepared to receive and defend."
 YUK_snc_field_answers_protected_spirit_settled:0 "Protected staff countercheck: Standing Review"
 YUK_snc_field_answers_protected_spirit_settled_desc:0 "The standing receiving procedure can now identify the officer allowed to answer a question and the account in which that answer will remain. Retain the chosen civil or protected policy, improving its practice through the completed review without removing its cost. The inherited intervention and command records remain their own responsibilities. A later diplomatic effort may read this earned verification account, but the procedure is useful even when no foreign partner accepts an exchange. Its immediate achievement is that the person expected to act can find the limit of the instruction and somebody responsible for explaining it."
 YUK_snc_field_answers_public_return_spirit:0 "Open receiving record"
 YUK_snc_field_answers_public_return_spirit_desc:0 "Retain the objection in an open receiving account. A public reader will not see every protected operational detail, but can recognize which question changed the government's explanation and which one did not. Maintaining that distinction costs political effort. It can also strengthen confidence in a command that is willing to distinguish scrutiny from disloyalty. The choice does not erase the earlier staff structure or promise that another government will respond in kind. It leaves a usable record for the next person who discovers that an instruction has travelled farther than the explanation accompanying it."
 YUK_snc_field_answers_staff_return_spirit:0 "Protected professional return"
 YUK_snc_field_answers_staff_return_spirit_desc:0 "The professional return keeps the correction beside the original instruction, signed by the staff officer responsible for receiving both. Its defenders accept that restricted circulation creates a continuing duty to preserve the disagreement, rather than a convenient reason to forget it. Adopt the protected record with its civilian burden. An expeditionary command can earn this countercheck through real work and a later assessment, while retaining the civil receiving margin that other obligations still require. It is a distinct route from delegated reform, not a different title pasted over the same assumed decision."
 YUK_snc_field_answers_brief:0 "Ask Where the Order Arrived"
 YUK_snc_field_answers_brief_desc:0 "An instruction has reached the field with every required signature and none of the explanation its receiving officer needs. The staff secretary can trace its approval without finding anybody authorized to answer the resulting question. Begin from the command structure the government actually retained. A delegated service and an expeditionary staff will not give the same answer, and this review will not pretend they have chosen the same history. Both must identify who receives an objection, who may clarify an instruction, and which uncertainty the next officer is expected to carry rather than quietly remove."
 YUK_snc_field_answers_brief_requirements_tt:0 "From 2006.1.1, an active national administration and the required earlier work are available. The selected policy remains exclusive; conclusions remain available when their real prerequisites finish after the expected calendar."
 YUK_snc_field_answers_brief_effect_tt:0 "Open the named national continuation from its earned prior settlement."
