 ac_snc_ose_message_30.t:0 "What the Next Shift Receives"
 ac_snc_ose_message_30.d:0 "The final folder is thinner than the committee expected. Its clerks have removed duplicate instructions, unsigned assurances and reports that described intended work as work delivered. The disagreements remain. A public representative still objects to a protected schedule; the receiving officer still believes the objection understates the risk of delay. Both have signed beside the decision they actually made. There is room at the back for the next shift's correction. Whether the wider world has accepted a dialogue, refused it or become more dangerous, the government can leave this account to its successors without requiring them to pretend every promise was fulfilled."
