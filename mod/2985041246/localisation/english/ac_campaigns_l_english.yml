 ac_camp.80.t:0 "The country inside the file"
 ac_camp.80.desc:0 "The archivist had arranged the settlement records by the authority that issued them. The visiting officer asked whether they could be rearranged by consequence. The archivist considered that for a moment and said it would require a much larger table.\n\nBelka's earlier war had left a particular country behind. The records retained its actual victory, narrow peace or defeat rather than replacing it with the outcome most convenient to the current argument. The veterans waiting outside the room did not all remember the same event as the beginning of what had followed.\n\nThe officer opened a folder of receiving orders. A signature appeared several times in offices that no longer existed under the same names. He asked who had inherited the responsibilities. The archivist answered with a list of institutions, then with a list of people, and finally with the admission that the two lists no longer matched.\n\nThere were patriotic explanations for the gaps. There were also men whose influence depended on keeping the explanations simple. A government could listen to its veterans without granting every person speaking for them a right to conduct policy in secret.\n\nThe officer requested another copy of the distribution trail. Outside, someone laughed at a remark he could not hear. For an instant the sound made the waiting room seem ordinary.\n\nThe archivist brought the larger table before he brought the next folder. He had decided to take the question about consequences seriously, even though it would make the work less convenient for everyone who had expected to finish before lunch."
 ac_camp.80.a:0 "Keep this account."
 ac_camp.80.z:0 "Close this old message."
