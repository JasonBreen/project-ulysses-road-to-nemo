l_english:
 LUR_wd_vote_split:0 "Two Points Between the Camps"
 LUR_wd_vote_split_desc:0 "Luremia opens 1991 under a National Administration that carries a democratic name while the ballot stays suspended, and the country is almost evenly divided: half back the democratic parties and nearly as many back the non-party administrators. Putting the government itself on the cabinet agenda costs the Administration its quiet months, but it lets every camp be heard before anyone decides."
 LUR_wd_vote_terms:0 "Publish the Terms of Office"
 LUR_wd_vote_terms_desc:0 "The Administration prints the legal basis on which it governs: the emergency powers it uses, the statute that still prescribes a vote every four years, and the clause under which that vote was set aside. Publishing it hands the opposition a text to argue over. It also makes plain that some choice about the ballot can no longer be put off."
 LUR_wd_vote_terms_tt_1:0 "Opens three answers to the suspended ballot; only one can be taken."
 LUR_wd_vote_chamber_path:0 "The Chamber Must Sit Again"
 LUR_wd_vote_chamber_path_desc:0 "The democratic camp asks for the plain thing: restore polling day, seat the chamber and make ministers answer to it. Its strength lies in the hill towns and the Knadorf offices. The cost is a government that must bargain for every budget in a country split almost down the middle, and that could lose the first vote it calls."
 LUR_wd_vote_admin_path:0 "Administrators Without Parties"
 LUR_wd_vote_admin_path_desc:0 "The neutral camp argues that a country of two provinces and eight plants needs competent management more than campaigns, and that the Administration should become a permanent non-party government with a published programme. Decisions would come faster and quarrel less. Half the country would be told, politely, that its preferred parties are not needed."
 LUR_wd_vote_shelter_path:0 "Readiness Ahead of the Ballot"
 LUR_wd_vote_shelter_path_desc:0 "Officers of the civil defence staff argue that the army exists to protect towns from disaster, and that the vote should wait until shelters, depots and trains are ready for the worst. Their argument carries weight in a country built for civil defence. It carries much less with families who notice that readiness never seems to arrive."
 LUR_wd_vote_chamber_seat:0 "Seat the Republic Chamber"
 LUR_wd_vote_chamber_seat_desc:0 "Polling day is held, the chamber sits, and a cabinet drawn from its majority takes the seals of government. The change runs through the office, not a person: the cabinet governs collectively and answers to deputies. The Administration's officials stay in post and learn to brief ministers who can be voted out."
 LUR_wd_vote_admin_seat:0 "Make the Administration Permanent"
 LUR_wd_vote_admin_seat_desc:0 "The National Administration is reconstituted as a standing non-party government of career officials. Elections remain suspended, and the programme the government publishes each year takes the place of a manifesto. Ministries gain continuity and lose the excuse of an election. Every failure now belongs to the officials who run them."
 LUR_wd_vote_shelter_seat:0 "Install the Civil Defence Directorate"
 LUR_wd_vote_shelter_seat_desc:0 "A directorate of civil defence officers, army staff and shelter administrators takes executive power and governs by order. It promises to hand power back once it judges the country ready. It brings real competence in emergencies, and a habit of treating every public question as one, which wears on the country faster than any storm."
 LUR_wd_vote_calendar:0 "A Ballot Every Four Years"
 LUR_wd_vote_calendar_desc:0 "With the chamber seated, deputies write standing orders that fix polling day on the four-year cycle the old statute always required, set a deadline for each budget and give the opposition a weekly hour to question ministers. Governing becomes slower and more public. Both provinces can now see who promised what."
 LUR_wd_vote_timetable:0 "Government Run to a Timetable"
 LUR_wd_vote_timetable_desc:0 "The standing Administration borrows the habits of the railway: every ministry publishes a timetable of the decisions it will take and the dates it will take them by, and late decisions are listed in the newspapers. Officials hate the lists. Citizens who cannot vote at least get a schedule they can hold the government to."
 LUR_wd_vote_wardens:0 "A Warden on Every Street"
 LUR_wd_vote_wardens_desc:0 "The directorate appoints a shelter warden for every street in Knadorf and every village in the hills and the desert. Wardens count supplies, inspect roofs and cellars and report on the mood of their neighbours. Preparation improves quickly. So does the directorate's knowledge of who complains, which is exactly what its critics feared."
 LUR_wd_vote_settlement:0 "One Settlement for Two Provinces"
 LUR_wd_vote_settlement_desc:0 "Whatever government holds the seals, Olastetten and Qesi still argue about revenue, posts in the ministries and who pays for the railway between them. A written settlement fixes the shares for a decade. It costs both provinces a few cherished grievances and ends an argument that has outlasted every government before it."
 LUR_wd_hill_roll:0 "Walk the Five Highland Provinces"
 LUR_wd_hill_roll_desc:0 "Olastetten is the capital state: Knadorf and two other hill provinces, plus two mountain provinces, one carrying the railway to its depot. Nobody in the capital holds a reliable register of its roads, springs or schools. Survey teams on foot spend a rainy season walking every valley, and the ministries pay for their boots and their patience."
 LUR_wd_hill_terraces:0 "Terraces Against the Rain"
 LUR_wd_hill_terraces_desc:0 "Heavy rain falls on nearly half the days of the year, and the old terraces on the Olastetten hillsides are slipping. Paid crews rebuild the stone walls and the drains between them before each wet spell. It is slow, manual work that produces nothing new, only keeps the fields from sliding into the valleys."
 LUR_wd_hill_drains:0 "Storm Drains Under Knadorf"
 LUR_wd_hill_drains_desc:0 "The channels under the capital were dug for a much smaller town, and every heavy storm sends water down the main streets and into the plant basements. Engineers propose wider culverts and a relief channel to the valley floor. Streets will be dug up for two seasons, and shopkeepers will complain about every week of it."
 LUR_wd_hill_clinic:0 "A Clinic at the Mountain Depot"
 LUR_wd_hill_clinic_desc:0 "The mountain province where the railway climbs to its supply depot has workers, soldiers and families, and no clinic within half a day by road. A small clinic beside the depot, staffed in rotation from Knadorf, serves all of them. Doctors dislike the posting. The depot crews notice that somebody finally thought of them."
 LUR_wd_hill_upward:0 "Knadorf Builds Upward"
 LUR_wd_hill_upward_desc:0 "One school of planners wants the capital to grow upward: taller blocks on the old plots, so that new housing does not take the terraced fields around the town. It keeps the farms and the short walk to work. It also means crowded streets, higher rents and drains that have to carry even more water."
 LUR_wd_hill_ribbon:0 "Towns Strung Along the Railway"
 LUR_wd_hill_ribbon_desc:0 "The other school wants new housing strung along both railway lines out of Knadorf, with halts every few kilometres and roads graded between them. Families get gardens and cheaper rents; the railway gets passengers. The terraced fields beside the line are lost, and every commuter now depends on a timetable."
 LUR_wd_hill_rope_teams:0 "Rope Teams for the Mountains"
 LUR_wd_hill_rope_teams_desc:0 "The new clinic at the depot handles the injured once they arrive; the problem is getting them there. Volunteers from the mountain villages form rope teams for rescue on the passes and the slopes above the line, trained by the army's mountain companies. They work for little and are known by name in every village."
 LUR_wd_hill_markets:0 "Market Days at Knadorf Station"
 LUR_wd_hill_markets_desc:0 "However the capital grows, its farmers and traders need a place to sell. The railway opens the platforms at Knadorf twice a week for market stalls, with produce arriving on the morning trains from both lines. Ticket inspectors find the arrangement chaotic. Families find the bread cheaper and the gossip better."
 LUR_wd_qesi_count:0 "Four Plants on Desert Ground"
 LUR_wd_qesi_count_desc:0 "Qesi, two desert provinces at the far end of the line from Knadorf, holds three civilian plants and one arms works, half the country's industry. Nobody in the capital knows how much of each shift is lost to heat, floods and missing parts. A ledger team spends a month on the shop floors and counts it, to the managers' discomfort."
 LUR_wd_qesi_channels:0 "Flood Channels Through the Sand"
 LUR_wd_qesi_channels_desc:0 "Desert ground cannot drink the heavy rain, so every storm turns the access roads into rivers within the hour. Engineers cut lined channels and raised causeways across the worst stretches between the plants and the railhead. The work is costly in a province with little else to spend on, and it ends the flooded afternoons."
 LUR_wd_qesi_shifts:0 "Dawn and Dusk Shifts"
 LUR_wd_qesi_shifts_desc:0 "Shop floors in Qesi reach temperatures at which machines and workers both fail. The plants move to early and late shifts and stand idle in the worst of the afternoon. Output per hour rises and families adjust their days around the new hours. The managers lose the long single shift they were used to supervising."
 LUR_wd_qesi_crude:0 "Meter the Desert Crude"
 LUR_wd_qesi_crude_desc:0 "The oil under Qesi has been pumped for years without anyone measuring what comes out or what is wasted. Metering every wellhead and piping the crude straight to the plants beside it costs money the province would rather spend on water. It also tells the treasury, for the first time, what the desert actually produces."
 LUR_wd_qesi_rails:0 "Roll Rails in Qesi"
 LUR_wd_qesi_rails_desc:0 "One proposal sends Qesi steel to the railway: rails, sleeper plates and bridge girders for both lines out of Knadorf. Every washout repaired with home-rolled rail is a washout repaired without waiting for a foreign delivery. The arms works lose their first claim on the steel, and their managers say so loudly."
 LUR_wd_qesi_plate:0 "Armour Plate from Qesi Steel"
 LUR_wd_qesi_plate_desc:0 "The other proposal reserves Qesi steel for the arms plants in both provinces, so that the replacement orders for the battalions never wait on imported plate. The arms lines run steadily and the army trusts its supply. The railway goes on buying foreign rail, and every washout takes as long to repair as it always did."
 LUR_wd_qesi_junction:0 "The Junction Yard at Qesi"
 LUR_wd_qesi_junction_desc:0 "The line from Knadorf ends at a desert junction close to both the Glaceland and the Sfaenland frontiers. Its yard is a single siding and a water tower. Extra sidings, a turning loop and a graded road to the plants let trains unload in hours instead of days, and make the junction worth stopping at."
 LUR_wd_qesi_water:0 "Cisterns for the Desert Towns"
 LUR_wd_qesi_water_desc:0 "The towns around the Qesi plants either flood or thirst, depending on the week. Covered cisterns filled in the rains and drawn down in the dry spells give them water all year. The cisterns are expensive to line and seal. They are also the first project in years that the desert towns asked for themselves."
 LUR_wd_works_full:0 "Every Plot Already Built On"
 LUR_wd_works_full_desc:0 "Olastetten holds two civilian plants and two arms works, Qesi three civilian plants and one arms works, and there is no free industrial ground in either province. Luremia cannot grow by adding halls. A planning office maps every plot and every machine, so that whatever comes next makes the existing eight plants work harder."
 LUR_wd_works_calendar:0 "A Maintenance Calendar for Eight Plants"
 LUR_wd_works_calendar_desc:0 "Breakdowns in Luremian plants are fixed when they happen, which in the rainy weeks means constantly. A shared maintenance calendar stops each line on a planned day, replaces worn parts before they fail and records what broke. Output falls on the planned days. It falls less on all the others."
 LUR_wd_works_replacement:0 "Lines for Replacement Kit"
 LUR_wd_works_replacement_desc:0 "The first school wants the arms works to concentrate on what the four battalions actually wear out: rifles, boots, motor parts and radios. New equipment can wait; replacements cannot. The army gets a supply it can rely on, and the plants give up any hope of selling something new to anyone else."
 LUR_wd_works_machinery:0 "Machine Tools Before Munitions"
 LUR_wd_works_machinery_desc:0 "The second school wants the plants to build presses, lathes and pumps for one another, so that the eight plants stop importing the machines they run on. It is patient, technical work that pays off slowly. The army notices that its replacement orders now queue behind a lathe for the plant next door."
 LUR_wd_works_rolling:0 "Wagons and Engines at Home"
 LUR_wd_works_rolling_desc:0 "The third school points at the twenty-four trains the country owns and every wagon it rents abroad, and asks why the repair shops do not grow into builders. A country with two railway lines and no coast lives by rolling stock. The shops will need years to make their first engine, and the arms lines shrink to make room."
 LUR_wd_works_depot_spares:0 "Spare Parts in Every Depot"
 LUR_wd_works_depot_spares_desc:0 "With the arms works making replacements, the army stocks each supply depot with the parts for the equipment it serves, from rifle springs to truck axles. The stores cost money to fill and space to keep dry. A broken vehicle in the hills is now a morning's repair rather than a month's wait."
 LUR_wd_works_toolroom:0 "A National Toolroom"
 LUR_wd_works_toolroom_desc:0 "The machine-tool school opens a shared toolroom in Knadorf where precision gauges, dies and fixtures are made for every plant in both provinces. Engineers who used to wait for foreign deliveries now walk down the street. The toolroom swallows the best machinists in the country, and the plants that lose them grumble."
 LUR_wd_works_first_engine:0 "The First Luremian Locomotive"
 LUR_wd_works_first_engine_desc:0 "After years of rebuilding other people's engines, the rolling-stock shops finish a locomotive of their own, assembled at Knadorf from home-made parts and imported components. It is heavy, slow and very reliable on the mountain grade. The crowd at its first run is larger than any political rally of the decade."
 LUR_wd_works_apprentices:0 "Apprentices on the Night Shift"
 LUR_wd_works_apprentices_desc:0 "Whatever the plants now make, they need skilled hands, and the young leave for neighbouring countries to find training. Every plant takes apprentices on its night shift, paired with a senior worker and paid a modest wage. Night output dips while they learn. Five years later the plants are training their own foremen."
 LUR_wd_rail_timetable:0 "One Timetable for Both Lines"
 LUR_wd_rail_timetable_desc:0 "Luremia has two railway lines out of Knadorf, one up to the mountain depot and one through the hills to the desert junction at Qesi, and they keep separate timetables written by separate offices. A single national timetable, published and kept, is the cheapest improvement the country can make. It costs the two offices their independence."
 LUR_wd_rail_grade:0 "Regrade the Mountain Line"
 LUR_wd_rail_grade_desc:0 "The line to the mountain depot climbs a grade so steep that trains split in two to make it, and every heavy rain washes ballast off the curves. Engineers ease the worst curves, add drainage under the track and rebuild two embankments. The line closes for a summer, and the depot is supplied by mule while it is shut."
 LUR_wd_rail_trains:0 "Twenty-Four Trains to Keep Running"
 LUR_wd_rail_trains_desc:0 "The country owns twenty-four trains, and any one of them out of service is a measurable share of national capacity. A census of engines and wagons records age, condition and the spares each needs. The census shows how many trains run on borrowed time, which the railway knew and the treasury did not."
 LUR_wd_rail_charters:0 "Sixty Convoys Without a Coast"
 LUR_wd_rail_charters_desc:0 "Luremia's national register lists sixty convoys of chartered cargo space, every one loading in a foreign harbour. The contracts were signed by different ministries on different terms. A single charter register in Knadorf renegotiates them together, insures them together and knows where every cargo is. Shipping agents lose some comfortable margins."
 LUR_wd_rail_through:0 "Our Wagons into Foreign Yards"
 LUR_wd_rail_through_desc:0 "One freight policy sends Luremian wagons loaded across the frontier and brings them back loaded, so that cargo never changes trains. Where foreign railways accept them, goods move faster and cheaper. The wagons then spend weeks in yards beyond any Luremian control, and the railway must trust other countries' shunters with its scarce stock."
 LUR_wd_rail_transship:0 "Change Trains at the Frontier"
 LUR_wd_rail_transship_desc:0 "The other policy builds transshipment yards just inside each frontier, where foreign cargo moves onto Luremian wagons and the reverse. Every crossing costs a day of handling. The yards employ hundreds, the country's wagons never leave home, and customs officers inspect everything that crosses in a place they control."
 LUR_wd_rail_sheds:0 "Engine Sheds at Knadorf"
 LUR_wd_rail_sheds_desc:0 "Locomotives in Luremia are repaired in the open, in the rain, wherever they happen to break down. Covered engine sheds at Knadorf with pits, cranes and a stores room let every engine be stripped and overhauled on a fixed cycle. The sheds are expensive, and they double the working life of each engine."
 LUR_wd_rail_engines_abroad:0 "Engines Built at Home, Run Abroad"
 LUR_wd_rail_engines_abroad_desc:0 "With a Luremian locomotive proven on the mountain grade and Luremian wagons already running into foreign yards, the railway puts its engines up for sale to foreign lines. Any buyer will take years to persuade, and each contract that does arrive keeps the rolling-stock shops working through the lean years."
 LUR_wd_rail_yard_towns:0 "The Frontier Yards Hire Locally"
 LUR_wd_rail_yard_towns_desc:0 "The transshipment yards hire their crews from the villages around each crossing, and housing, shops and schools follow the wages. Within a few years each yard is the centre of a small town. The towns depend entirely on freight, and every slow month at the frontier is felt at once in their shops."
 LUR_wd_guard_muster:0 "Call the Roll of Four Battalions"
 LUR_wd_guard_muster_desc:0 "The Luremian army is four infantry battalions in three formations, trained for territorial defence, with no aircraft and no engineers. Before choosing what it should become, the staff calls a full muster in both provinces and counts men, rifles, vehicles and boots. The count is short, honest and a little embarrassing."
 LUR_wd_guard_climbers:0 "Mountain Companies from the Hills"
 LUR_wd_guard_climbers_desc:0 "The army already teaches mountain warfare, and the volunteer rope teams on the passes now give it recruits who know the slopes. Each battalion forms a mountain company drawn from the hill villages, trained on the routes the rope teams use. The companies are small and proud, and they cannot be moved quickly to the desert."
 LUR_wd_guard_passes:0 "Hold the Highland Passes"
 LUR_wd_guard_passes_desc:0 "The first doctrine digs the army into the mountain passes of Olastetten, where a single company can hold a valley against far larger numbers. The battalions stay in fixed posts with stored ammunition. Qesi, flat and far from the passes, is left to its police and its plant guards, and its deputies notice."
 LUR_wd_guard_rail_reserve:0 "A Reserve That Rides the Trains"
 LUR_wd_guard_rail_reserve_desc:0 "The second doctrine keeps the battalions on their trains, with motor vehicles loaded on flat wagons, able to reach either end of either line in a day. It uses the country's one real advantage, its railway. It also means the army is only as good as the timetable, and a washout can strand it."
 LUR_wd_guard_shelter_companies:0 "A Shelter Company in Every Town"
 LUR_wd_guard_shelter_companies_desc:0 "The third doctrine turns the army toward what it was always meant for: every town gets a trained company for rescue, shelter duty and local defence, with reservists drawn from the town itself. The country is better protected against disaster than against any army. Training never stops, and neither does the paperwork."
 LUR_wd_guard_mud:0 "Drill for the Mud Months"
 LUR_wd_guard_mud_desc:0 "Rain falls on nearly half the days of the year and the roads are rarely dry, yet the army still trains as though they were. Exercises move into the wet weeks: marches in mud, supply runs on flooded tracks and digging in waterlogged ground. Soldiers hate it. Vehicles break, and the staff learns which ones."
 LUR_wd_guard_guns:0 "Guns for a Small Army"
 LUR_wd_guard_guns_desc:0 "Army doctrine favours firepower over numbers, because Luremia will never have the numbers. A few batteries trained to fire from the hills, with observers on the ridgelines, multiply what four battalions can hold. The guns come from abroad and are dear, and the crews take two years to train properly."
 LUR_wd_guard_line_depots:0 "Replacement Depots on the Line"
 LUR_wd_guard_line_depots_desc:0 "Whichever doctrine the staff chose, the battalions need replacements close at hand. Depots at the stations of both railway lines hold equipment, rations and fuel for a month of operations. Stations get busier and harder to guard. The army gets a supply chain that runs on the one network the country actually controls."
 LUR_wd_sky_weather:0 "A Weather Office at the Airfield"
 LUR_wd_sky_weather_desc:0 "The only air base in Luremia, at Knadorf, has no combat aircraft and a tower full of instruments that farmers rely on for rain forecasts. Turning the tower into a proper weather office, with trained forecasters and a radio bulletin, serves the farms, the railway and any future pilot at once. It postpones the harder question."
 LUR_wd_sky_runway:0 "Drain the Knadorf Runway"
 LUR_wd_sky_runway_desc:0 "The runway at Knadorf floods in heavy rain and closes for days at a time. Engineers lay drainage beneath it, lengthen it and pave a second apron for transport aircraft. The work takes a dry season that the farmers would rather have used for harvest traffic. The field becomes usable all year."
 LUR_wd_sky_trainers:0 "Lease Trainers for a Flying School"
 LUR_wd_sky_trainers_desc:0 "One faction wants a flying school: leased trainer aircraft, contract instructors and a first class of Luremian pilots. It would give the country people who can fly, even without aircraft to fight with. The leases are expensive, the instructors foreign, and the first graduates have nothing to fly when they finish."
 LUR_wd_sky_observers:0 "Observers on Every Ridge"
 LUR_wd_sky_observers_desc:0 "The other faction would rather see than fly. Volunteer observer posts on the high ground, linked by telephone to a radar set at Knadorf, would report every aircraft over Luremian hills. It is cheap, practical and uses the terrain. It gives the country nothing to send up if it ever sees something it dislikes."
 LUR_wd_sky_dry_days:0 "Flying Days in the Dry Weeks"
 LUR_wd_sky_dry_days_desc:0 "The flying school schedules its training into the drier weeks of the year and builds a second hangar row and fuel store so that every clear day is used. Instructors fly long hours and students solo sooner. When the rain returns, the classroom takes over, and the hangars hold aircraft nobody owns."
 LUR_wd_sky_mast:0 "Radar Above the Mountain Depot"
 LUR_wd_sky_mast_desc:0 "A radar set on the mountain above the railway depot can see across the frontiers in a way nothing at Knadorf can. The mast needs a road, a power line and a crew who will live on a mountain. Neighbours are told in advance what it is for, and the weather office claims a share of its data."
 LUR_wd_sky_qesi_strip:0 "An Emergency Strip at Qesi"
 LUR_wd_sky_qesi_strip_desc:0 "Qesi has no airfield at all, and when the line from Knadorf washes out the desert province is cut off. A graded emergency strip near the plants, with a fuel store and a windsock, lets transport aircraft land medicine and spares in a crisis. Most weeks nothing lands there except dust."
 LUR_wd_four_offices:0 "Liaison Offices on Four Frontiers"
 LUR_wd_four_offices_desc:0 "Luremia touches Kaluga, Glaceland, Sfaenland and Silvonia and no sea at all, and its relations with each have been handled by whichever ministry had a problem that week. A liaison office at the main crossing toward each neighbour, with its own staff and files, gives every frontier a known door. The offices cost little and promise less."
 LUR_wd_four_kaluga:0 "Forest Wardens on the Kaluga Line"
 LUR_wd_four_kaluga_desc:0 "The frontier with Kaluga runs through the forest beyond Knadorf and the two mountain provinces, and fires, poachers and lost walkers cross it without asking. Luremian forest wardens patrol their own side and keep a telephone number for their counterparts. No claim or line changes. Incidents get a phone call instead of a protest note."
 LUR_wd_four_kaluga_tt_1:0 "No border or claim changes; the wardens patrol the Luremian side only."
 LUR_wd_four_valleys:0 "Our Side of the Valley Paths"
 LUR_wd_four_valleys_desc:0 "Herders and foresters from the Glacelandic frontier districts have crossed into the Olastetten hills along the valley paths for generations. Luremian village councils start a register of who comes, when and with how many animals, and offer a named contact for disputes. The register is Luremian paperwork only; it moves no line on any map."
 LUR_wd_four_valleys_tt_2:0 "No border or claim changes; the register covers grazing and timber on the Luremian side."
 LUR_wd_four_desert_road:0 "Customs on the Desert Road"
 LUR_wd_four_desert_road_desc:0 "Desert traders have taken the road from Qesi toward Sfaenland for years with little paperwork. Customs posts at the crossings now collect duty and count the traffic. Revenue rises and the plants learn what actually comes in. Traders lose a day at the post, and some of them find other roads."
 LUR_wd_four_silvonia:0 "The Silvonia Corner"
 LUR_wd_four_silvonia_desc:0 "Silvonia meets Luremia in the far corner of the country, along one mountain province and one desert province that the capital rarely visits. A radar post and a small army camp near the desert crossing put the corner on the map of the ministries. Soldiers posted there count the days to their next leave by train."
 LUR_wd_four_neutral:0 "Neutrality in the Statute Book"
 LUR_wd_four_neutral_desc:0 "One answer to four neighbours is to write permanent neutrality into law: no alliance, no foreign bases and an army sized to defend the country and nothing more. It reassures every neighbour equally and binds every future government. It also closes options that a small country might one day badly want."
 LUR_wd_four_unwritten:0 "Promise Nothing in Writing"
 LUR_wd_four_unwritten_desc:0 "The other answer is to stay friendly with all four neighbours while signing nothing that limits Luremia's freedom. Diplomats say warm words in every capital and initial no texts. The country keeps every option open. Its neighbours keep guessing, and some of them find guessing tiresome."
 LUR_wd_four_monitors:0 "When the Neighbours Do Not Vote"
 LUR_wd_four_monitors_desc:0 "None of Luremia's four neighbours is holding elections, and in three of them nationalist movements hold half the voters. Any turn in their politics could reach the frontier quickly. A small office in Knadorf reads their press and listens to their radio every day. The wardens on the Kaluga line already know the habit."
 LUR_wd_four_grazing:0 "Seasonal Grazing Fees"
 LUR_wd_four_grazing_desc:0 "With the herders registered, the village councils charge a small fee for each season on Luremian pastures and spend it on wells and path repairs. Herders grumble and pay, because the paths are better. The fees are Luremian rules on Luremian land and change nothing about who may cross."
 LUR_wd_rock_bulletin:0 "The Sky Bulletin from Knadorf"
 LUR_wd_rock_bulletin_desc:0 "In December 1994 astronomers announce that the asteroid Ulysses may strike the Earth. Luremia can do nothing about the asteroid and a great deal about rumour. The Knadorf radio starts a weekly bulletin saying plainly what is known and what is not. The bulletin costs airtime and political nerve."
 LUR_wd_rock_impact:0 "When the Impact Is Announced"
 LUR_wd_rock_impact_desc:0 "In April 1996 the FCU announces that Ulysses will strike the Earth. Where the fragments will fall is not known and may not be known until late. A country whose army exists for civil defence now has to decide what civil defence means against a falling sky. The cabinet sits through the night."
 LUR_wd_rock_galleries_path:0 "Cut Galleries into the Hills"
 LUR_wd_rock_galleries_path_desc:0 "The engineers propose shelter in the rock: galleries cut into the hills and mountains of Olastetten, close to the towns, ventilated and stocked. The rock is solid and the work is hard. Qesi, flat and far away, would have to send its people up the line to reach them."
 LUR_wd_rock_rail_path:0 "Disperse by Rail Between Provinces"
 LUR_wd_rock_rail_path_desc:0 "The railway officers propose movement instead of concrete: a plan to carry whole towns by train from one province to the other, toward whichever looks safer when the warnings come. It uses the two lines the country already has. It depends on warnings arriving in time and on the lines surviving the rain."
 LUR_wd_rock_deep:0 "The Deep Galleries Under Knadorf"
 LUR_wd_rock_deep_desc:0 "The largest galleries are driven beneath the capital itself, with ventilation shafts, water tanks and room for most of Knadorf's families. Tunnelling crews work in shifts for three years. The spoil goes into the railway embankments. When finished, the galleries are the largest public work the country has ever paid for."
 LUR_wd_rock_leaving:0 "Timetables for Leaving"
 LUR_wd_rock_leaving_desc:0 "Every town gets an evacuation timetable: which train, which platform, which hour, and which families. The timetables are posted in schools and rehearsed twice a year, in daylight and in the dark. Rehearsals disrupt the freight schedule and annoy the plant managers, who lose a shift each time. On the third rehearsal every train leaves on time, and the towns stop treating the exercise as a holiday."
 LUR_wd_rock_stores:0 "Ninety Days of Stores"
 LUR_wd_rock_stores_desc:0 "Whatever the plan, people will need food, water and medicine if the worst happens. Every district lays in grain, water and medical supplies for three months, rotated each year. The stores are expensive to fill and dull to guard. They are also the only part of the plan that every faction supports."
 LUR_wd_rock_clinics:0 "Mountain Clinics Join the Plan"
 LUR_wd_rock_clinics_desc:0 "The clinic at the mountain depot becomes the model for the emergency plan: small medical posts at every station and shelter, stocked and staffed in rotation from Knadorf. Doctors are scarce and the rotations are long, and the capital hospital loses staff for weeks at a time. Every town now knows where to take its injured."
 LUR_wd_rock_rehearsal:0 "The Battalions Rehearse the Night"
 LUR_wd_rock_rehearsal_desc:0 "The battalions, whatever doctrine they now follow, rehearse their part in the emergency plan: guarding stores, directing crowds and keeping roads and platforms clear in the dark. The rehearsals run at night, in the rain, with towns watching. Officers learn that civilians follow calm orders and ignore shouted ones."
 LUR_wd_rock_roche:0 "Waiting Out the Roche Night"
 LUR_wd_rock_roche_desc:0 "On 8 July 1999 Ulysses passes through the Roche limit. Luremia spends the night as it planned to: in galleries, on trains or in cellars, with wardens on the streets and the radio on the air. What falls, and where, is not known in advance. By morning the cabinet must decide how long to wait."
 LUR_wd_rock_daylight:0 "Open the Galleries to Daylight"
 LUR_wd_rock_daylight_desc:0 "Once the fragment showers have ended, the country counts what its preparations cost and what they achieved. Stores are released to the shops, the trains go back to freight and the weekly bulletin closes. Some officials want the emergency apparatus kept forever. Most families just want to sleep upstairs again."
 LUR_wd_far_belka:0 "Prices from the Belkan War"
 LUR_wd_far_belka_desc:0 "In March 1995 war breaks out around Belka. No Luremian frontier touches it, but fuel, machinery and freight insurance all cost more within weeks, and the arms works receive letters from unfamiliar buyers. The cabinet studies what the war will cost a small country that only wants to buy and sell in peace."
 LUR_wd_far_rations:0 "Ration Cards for Fuel"
 LUR_wd_far_rations_desc:0 "With fuel prices climbing, the ministry issues ration cards for private motoring so that the plants, the railway and the army keep their supply. Queues form at every filling station. The cards are unpopular, fair and temporary, and the ministry promises they will go the day prices fall."
 LUR_wd_far_spares:0 "Spares for Buyers Far from War"
 LUR_wd_far_spares_desc:0 "The arms works want to answer the new letters by selling spare parts and replacement kit to buyers far from any war zone, under licence and with end-user checks. Orders would fill the night shifts. Every licence is a judgement call, and a mistaken one could follow Luremia for decades."
 LUR_wd_far_rifles:0 "Every Rifle Stays at Home"
 LUR_wd_far_rifles_desc:0 "The opposite answer forbids every military export while wars are being fought anywhere. The arms works keep their output for the four battalions and their reserves. Night shifts are cut, and managers complain about lost orders. Nobody abroad has any reason to think of Luremia as a supplier."
 LUR_wd_far_lumen:0 "The Lumen Treaty Read Aloud"
 LUR_wd_far_lumen_desc:0 "When word comes that the Belkan War is over and a treaty has been signed in Lumen, the Knadorf radio reads the news at noon and the ministry withdraws the fuel ration cards within the month, as it promised. Prices fall slowly. The cabinet keeps its study of what the war cost, because the next distant war will cost the same."
 LUR_wd_far_clause_desk:0 "A Desk for War Clauses"
 LUR_wd_far_clause_desk_desc:0 "The Belkan War taught the freight office that insurers write war clauses faster than ministries can read them. A permanent desk in Knadorf negotiates those clauses for every Luremian charter, tracks premiums and finds alternative routes. It is a small office with an unglamorous job and a long memory."
 LUR_wd_far_isaf:0 "Freight Rates and the ISAF"
 LUR_wd_far_isaf_desc:0 "When the ISAF is formed to oppose Erusea, the war in Usea becomes a freight problem for every country with cargo on the oceans. Luremia has no frontier in Usea and takes no side, but its charters face new clauses within a week. The war-clause desk is ready for exactly this."
 LUR_wd_far_rates_fall:0 "Charter Rates Come Down"
 LUR_wd_far_rates_fall_desc:0 "Once the fighting in Usea is over, however it has ended, insurers withdraw their war clauses one contract at a time and charter rates drift back toward their old levels. The desk in Knadorf stays open, renamed and smaller, because Luremia has learned that distant wars always find their way back to its shelves."
 ac_wd_lur_tree:0 "Luremia: National Programme"
 ac_wd_lur_tree_desc:0 "The national focus programme of Luremia, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 LUR_wd_held_ballot:0 "The Withheld Ballot"
 LUR_wd_held_ballot_desc:0 "The National Administration governs under a democratic name while the vote stays suspended and the country stays split."
 LUR_wd_ballot_date:0 "A Date for the Ballot"
 LUR_wd_ballot_date_desc:0 "The Administration has promised the chamber a polling day and is held to it."
 LUR_wd_standing_admin:0 "Administrators, Not Parties"
 LUR_wd_standing_admin_desc:0 "Ministries run by career officials who answer to a published programme."
 LUR_wd_readiness_first:0 "Readiness Ahead of the Ballot"
 LUR_wd_readiness_first_desc:0 "The civil defence staff argues that the vote can wait until the shelters are ready."
 LUR_wd_chamber_rules:0 "Standing Orders of the Chamber"
 LUR_wd_chamber_rules_desc:0 "Fixed polling days, a written order of business and a budget the deputies must pass."
 LUR_wd_timetable_government:0 "Government to a Timetable"
 LUR_wd_timetable_government_desc:0 "Every ministry publishes the dates by which its decisions will be taken."
 LUR_wd_warden_network:0 "Wardens in Every Street"
 LUR_wd_warden_network_desc:0 "Shelter wardens report on supplies, roofs and rumours to the directorate."
 LUR_wd_two_province_settlement:0 "The Two-Province Settlement"
 LUR_wd_two_province_settlement_desc:0 "A written division of revenue and offices between Olastetten and Qesi."
 LUR_wd_highland_roll:0 "The Highland Roll"
 LUR_wd_highland_roll_desc:0 "Every road, spring, terrace and school in the five Olastetten provinces, on one register."
 LUR_wd_terrace_crews:0 "Terrace Crews"
 LUR_wd_terrace_crews_desc:0 "Paid crews rebuild hill terraces and stone drains before the heavy rains return."
 LUR_wd_knadorf_drains:0 "Storm Drains of Knadorf"
 LUR_wd_knadorf_drains_desc:0 "Culverts and channels carry the rain off the capital streets instead of through them."
 LUR_wd_upward_city:0 "Knadorf Builds Upward"
 LUR_wd_upward_city_desc:0 "Taller blocks on the old plots, so the capital grows without taking the terraces."
 LUR_wd_ribbon_towns:0 "Towns Along the Line"
 LUR_wd_ribbon_towns_desc:0 "New housing strung along both railway lines out of Knadorf."
 LUR_wd_station_markets:0 "Station Market Days"
 LUR_wd_station_markets_desc:0 "Farmers and traders sell from the platforms at Knadorf twice a week."
 LUR_wd_qesi_ledger:0 "The Qesi Ledger"
 LUR_wd_qesi_ledger_desc:0 "Output, breakdowns and lost shifts in the four desert plants, counted honestly."
 LUR_wd_cool_shifts:0 "Dawn and Dusk Shifts"
 LUR_wd_cool_shifts_desc:0 "The Qesi plants work early and late and stand idle in the worst heat of the day."
 LUR_wd_desert_crude:0 "Crude Under the Desert"
 LUR_wd_desert_crude_desc:0 "A mapped and metered oil field feeding the plants beside it."
 LUR_wd_rail_steel:0 "Qesi Rail Steel"
 LUR_wd_rail_steel_desc:0 "Qesi steel rolled into rail, sleeper plates and bridge girders."
 LUR_wd_plate_steel:0 "Plate for the Arms Line"
 LUR_wd_plate_steel_desc:0 "Qesi steel reserved for the arms plants and their replacement orders."
 LUR_wd_qesi_cisterns:0 "The Qesi Cisterns"
 LUR_wd_qesi_cisterns_desc:0 "Covered cisterns fill in the rains and serve the desert towns through the dry weeks."
 LUR_wd_full_ground:0 "Every Slot Taken"
 LUR_wd_full_ground_desc:0 "Every slot of usable industrial ground in both provinces is already built on."
 LUR_wd_replacement_lines:0 "Lines for Replacement Kit"
 LUR_wd_replacement_lines_desc:0 "The arms plants make spares and replacement equipment before anything new."
 LUR_wd_machine_shops:0 "Machine Tools Before Munitions"
 LUR_wd_machine_shops_desc:0 "Workshops build presses, lathes and pumps for every other plant."
 LUR_wd_rolling_stock_works:0 "Rolling Stock Works"
 LUR_wd_rolling_stock_works_desc:0 "Wagon and locomotive repair grows into wagon and locomotive building."
 LUR_wd_depot_spares:0 "Spares in Every Depot"
 LUR_wd_depot_spares_desc:0 "Each supply depot holds a stock of parts for the equipment it serves."
 LUR_wd_night_apprentices:0 "Night-Shift Apprentices"
 LUR_wd_night_apprentices_desc:0 "Young workers learn the trades on the night shifts of all eight plants."
 LUR_wd_national_timetable:0 "One National Timetable"
 LUR_wd_national_timetable_desc:0 "Both lines out of Knadorf run to one published timetable."
 LUR_wd_charter_register:0 "The Charter Register"
 LUR_wd_charter_register_desc:0 "Luremian cargo contracts in foreign harbours, recorded and insured from Knadorf."
 LUR_wd_through_running:0 "Through-Running Wagons"
 LUR_wd_through_running_desc:0 "Luremian wagons travel loaded into foreign yards and come back loaded."
 LUR_wd_transshipment_yards:0 "Frontier Transshipment"
 LUR_wd_transshipment_yards_desc:0 "Cargo changes trains in Luremian yards just inside every frontier."
 LUR_wd_engine_sheds:0 "The Knadorf Engine Sheds"
 LUR_wd_engine_sheds_desc:0 "Covered sheds where every locomotive is stripped and overhauled on a cycle."
 LUR_wd_export_engines:0 "Engines for Export"
 LUR_wd_export_engines_desc:0 "Locomotives built at home are sold to the railways that already carry Luremian wagons."
 LUR_wd_yard_towns:0 "The Yard Towns"
 LUR_wd_yard_towns_desc:0 "The frontier transshipment yards have grown into small towns with steady work."
 LUR_wd_thin_battalions:0 "Four Battalions, Two Provinces"
 LUR_wd_thin_battalions_desc:0 "A very small army spread across hills, mountains and desert."
 LUR_wd_pass_garrisons:0 "Garrisons in the Passes"
 LUR_wd_pass_garrisons_desc:0 "Companies dug into the mountain passes of Olastetten."
 LUR_wd_rail_reserve:0 "Battalions Kept on the Trains"
 LUR_wd_rail_reserve_desc:0 "A reserve kept on its trains, able to reach either province in a day."
 LUR_wd_shelter_companies:0 "Shelter Companies"
 LUR_wd_shelter_companies_desc:0 "Every town keeps a trained company for rescue, shelter duty and local defence."
 LUR_wd_mud_drill:0 "Drilled for the Mud"
 LUR_wd_mud_drill_desc:0 "Marches, supply runs and digging practised in rain and mud."
 LUR_wd_line_depots:0 "Depots on the Line"
 LUR_wd_line_depots_desc:0 "Replacement depots sited at the stations of both railway lines."
 LUR_wd_weather_office:0 "The Airfield Weather Office"
 LUR_wd_weather_office_desc:0 "Forecasts of rain and cloud from the Knadorf field, for farms, railways and pilots."
 LUR_wd_flying_school:0 "A Leased Flying School"
 LUR_wd_flying_school_desc:0 "Leased trainers and contract instructors teach the first Luremian pilots."
 LUR_wd_ridge_observers:0 "Observers on the Ridges"
 LUR_wd_ridge_observers_desc:0 "Volunteer posts on the high ground report every aircraft by telephone."
 LUR_wd_frontier_liaison:0 "Frontier Liaison Offices"
 LUR_wd_frontier_liaison_desc:0 "One office for each of the four neighbours, at the main crossing."
 LUR_wd_desert_customs:0 "Customs on the Desert Road"
 LUR_wd_desert_customs_desc:0 "Posts on the Qesi crossings collect duties and count the traffic."
 LUR_wd_declared_neutrality:0 "Neutral in the Statute Book"
 LUR_wd_declared_neutrality_desc:0 "Permanent neutrality written into law, with an army sized to defend it."
 LUR_wd_unwritten_options:0 "Nothing Promised in Writing"
 LUR_wd_unwritten_options_desc:0 "Friendly words to every neighbour and a signature for none."
 LUR_wd_frontier_monitors:0 "Frontier Monitors"
 LUR_wd_frontier_monitors_desc:0 "Analysts in Knadorf read the press and radio of all four neighbours every day."
 LUR_wd_grazing_fees:0 "Seasonal Grazing Fees"
 LUR_wd_grazing_fees_desc:0 "Registered herders pay a small fee for each season on the valley pastures."
 LUR_wd_sky_bulletin:0 "The Sky Bulletin"
 LUR_wd_sky_bulletin_desc:0 "A weekly broadcast of what is known, and not known, about the asteroid."
 LUR_wd_rock_galleries:0 "Galleries in the Rock"
 LUR_wd_rock_galleries_desc:0 "Shelters cut into the hills and mountains of Olastetten."
 LUR_wd_deep_galleries:0 "The Deep Galleries"
 LUR_wd_deep_galleries_desc:0 "Ventilated, stocked galleries under Knadorf with room for most of the capital."
 LUR_wd_evacuation_trains:0 "Evacuation by Rail"
 LUR_wd_evacuation_trains_desc:0 "A plan to move whole towns by train between the two provinces."
 LUR_wd_evacuation_drilled:0 "Timetables for Leaving"
 LUR_wd_evacuation_drilled_desc:0 "Every town knows its train, its platform and its hour."
 LUR_wd_shelter_stores:0 "Ninety Days of Stores"
 LUR_wd_shelter_stores_desc:0 "Grain, water and medicine kept for three months in every district."
 LUR_wd_fuel_cards:0 "Fuel Ration Cards"
 LUR_wd_fuel_cards_desc:0 "Fuel sold by card while wartime prices stay high."
 LUR_wd_spares_licence:0 "Spares for Distant Buyers"
 LUR_wd_spares_licence_desc:0 "Licensed sales of spare parts to buyers far from any war zone."
 LUR_wd_rifles_home:0 "Every Rifle Stays Home"
 LUR_wd_rifles_home_desc:0 "No military exports of any kind while wars are being fought."
 LUR_wd_war_clause_desk:0 "The War-Clause Desk"
 LUR_wd_war_clause_desk_desc:0 "A ministry desk that negotiates insurance war clauses for Luremian cargo."
 LUR_wd_peace_rates:0 "Peacetime Freight Rates"
 LUR_wd_peace_rates_desc:0 "Insurance and charter rates fall back as the Usean war ends."
 LUR_wd_drain_crews:0 "Drain Crews Out"
 LUR_wd_drain_crews_desc:0 "Crews clear every culvert and gutter ahead of the next heavy rain."
 LUR_wd_gallery_week:0 "Gallery Week"
 LUR_wd_gallery_week_desc:0 "Families spend a week learning their way around the shelters."
 LUR_wd_reserve_train_run:0 "The Reserve Train Is Out"
 LUR_wd_reserve_train_run_desc:0 "A reserve company rides the lines on an exercise timetable."
 ac_wd_lur.1.t:0 "Two Points Apart"
 ac_wd_lur.1.d:0 "The cabinet secretary reads the agenda aloud in the old council room at Knadorf, and the first item is the cabinet itself. The National Administration has governed under a democratic banner with the ballot suspended, and the most recent polling puts the democratic parties at one half of the country and the non-party administrators only two points behind. Neither camp can claim the country. Both can claim to be its larger part on a good day.\n\nThe democrats want the polling day restored and the chamber sitting again before the year is out. The administrators answer that a country of two provinces, eight plants and four battalions needs steady management more than it needs campaigns. A smaller group from the civil defence staff says nothing in the meeting and a great deal in the corridors: that the vote matters less than the readiness of the shelters, the depots and the trains.\n\nToday the cabinet decides only how the argument will be heard. A public hearing in the council room would be broadcast and quoted for months. Written submissions would be quieter, slower and easier to steer. The provincial delegations from Olastetten and Qesi have already booked rooms in the capital for the week.\n\nProvisional gameplay."
 ac_wd_lur.1.a:0 "Hold the hearing in public."
 ac_wd_lur.1.b:0 "Ask for written submissions."
 ac_wd_lur.2.t:0 "Signatures on the Station Wall"
 ac_wd_lur.2.d:0 "Three weeks after the public hearing, volunteers set up folding tables on the platforms at Knadorf and at the Qesi junction and begin collecting signatures for a polling day. The lists are pinned to boards along the station walls so that anyone waiting for a train can read the names. By the end of the first week the boards run the length of both platforms, and the railway asks politely where it is supposed to put its timetables.\n\nAdministration officials point out that a petition is not a vote and that the same people may have signed twice. The petition organisers reply that they would be happy to have the matter settled by a vote. Newspapers in both provinces print daily totals. In the hill towns the lists fill with families who have never signed anything; in the desert plants the shift committees sign as blocks.\n\nThe cabinet must now decide what to do with the boards. Accepting the petition formally would oblige the Administration to answer it in writing within the month. Thanking the organisers and moving the tables off railway property would be lawful and would look, to half the country, like exactly what it is.\n\nProvisional gameplay."
 ac_wd_lur.2.a:0 "Accept the petition and answer in writing."
 ac_wd_lur.2.b:0 "Move the tables off railway property."
 ac_wd_lur.3.t:0 "Notebooks from the Hills"
 ac_wd_lur.3.d:0 "The survey teams come down from the Olastetten hills with wet notebooks and very muddy boots. They have walked all five provinces of the capital state: the hills around Knadorf, the hill province on the line to Qesi, the hill country along the Glacelandic and Kalugan frontiers, and the two mountain provinces where the railway climbs to its depot and the passes run toward Silvonia.\n\nTheir findings are more about water than about anything else. The rain here is heavy on close to half the days of the year and the ground is never really dry. Terraces built by earlier generations are slipping, village roads turn to mud by noon, and the storm channels under Knadorf were sized for a much smaller town. The mountain depot has a railway, a supply store and no clinic within half a day by road.\n\nThe surveyors offer no single plan. They price terraces, drains, clinics and housing separately and leave the choice to the cabinet. The hill towns want the money spent where they live; the capital wants its own streets fixed first. The notebooks are already being quoted in both arguments.\n\nProvisional gameplay."
 ac_wd_lur.3.a:0 "Fix the hill villages first."
 ac_wd_lur.3.b:0 "Fix the capital first."
 ac_wd_lur_3_b:0 "Fix the capital first."
 ac_wd_lur.4.t:0 "Four Plants on the Sand"
 ac_wd_lur.4.d:0 "Qesi is the smaller of the two provinces and holds half the country's industry: three civilian plants and one arms works on desert ground at the far end of the railway from Knadorf. The ledger team sent from the capital spends a month on the shop floors and comes back with figures that nobody in the ministry disputes and nobody likes.\n\nThe heat is the first problem. Shop floors reach temperatures at which machines and people both fail, and the plants lose most of every afternoon. The rain is the second: when it comes, it falls hard on ground that cannot absorb it, and the access roads flood within the hour. The third is distance. Every spare part, every engineer and every payroll comes down a single line through the hills, and a washout anywhere on it stops all four plants.\n\nThe plant managers want the ledger kept inside the ministry until they have had a chance to answer it. The shift committees want it read aloud in the canteens, because they have been saying the same things for years. The cabinet has to choose who reads it first.\n\nProvisional gameplay."
 ac_wd_lur.4.a:0 "Read it in the canteens."
 ac_wd_lur.4.b:0 "Give the managers a month to answer."
 ac_wd_lur_4_b:0 "Give the managers a month to answer."
 ac_wd_lur.5.t:0 "Not One Free Plot"
 ac_wd_lur.5.d:0 "The planning office in Knadorf finishes its map of industrial land and pins it to the wall of the cabinet room. Every usable plot in both provinces is coloured in. Olastetten holds two civilian plants and two arms works; Qesi holds three civilian plants and one arms works. There is no ground left in either province on which a new plant could be built without first pulling an old one down.\n\nThe consequence is simple and unwelcome. Luremia cannot grow its industry by adding halls, as larger countries do. It can only make the halls it has work better: more output per shift, fewer breakdowns, better tools and a clearer idea of what each plant is for. The ministers who hoped to open a new works before the next budget fold their speeches away.\n\nThree schools of thought are already forming. One wants the arms works kept busy making replacement equipment for the battalions. One wants the plants to build machine tools for each other. A third points at the twenty-four trains the country owns and asks why it does not build its own wagons and engines. First the cabinet must decide whether to publish the map.\n\nProvisional gameplay."
 ac_wd_lur.5.a:0 "Publish the map with the budget."
 ac_wd_lur_5_a:0 "Publish the map with the budget."
 ac_wd_lur.5.b:0 "Keep it for the planning office."
 ac_wd_lur.6.t:0 "Freight Without a Harbour"
 ac_wd_lur.6.d:0 "Luremia has no coast. Everything it buys from beyond its four neighbours arrives in a foreign harbour, is loaded onto a foreign train or truck and crosses a frontier before it reaches a Luremian railway. The national register nevertheless lists sixty convoys of chartered cargo space, all of it loading and unloading in other countries' ports, and the ministry pays for all of it.\n\nThe freight office lays out what this costs. Every delay at a foreign quay, every strike at a foreign yard and every change in a neighbour's customs rules lands on Luremian shelves within a fortnight. The country owns twenty-four trains and two lines out of Knadorf, one climbing to the mountain depot and one running through the hills to the desert junction at Qesi. Both lines were laid for a smaller economy.\n\nRailway officers want a single national timetable before anything else, so that at least the trains under Luremian control run when they say they will. The freight office wants to start with the foreign contracts, where the money is lost. The cabinet decides where the first year of effort goes, and which office explains the choice to the plants.\n\nProvisional gameplay."
 ac_wd_lur.6.a:0 "Start with our own timetable."
 ac_wd_lur_6_a:0 "Start with our own timetable."
 ac_wd_lur.6.b:0 "Start with the foreign contracts."
 ac_wd_lur.7.t:0 "Roll Call for a Small Army"
 ac_wd_lur.7.d:0 "The general staff calls the roll of the Luremian army and the answer fits on a single sheet of paper: four infantry battalions in three formations, trained for territorial defence, with no aircraft, no warships and no engineers. The depots hold eight hundred sets of infantry equipment, six hundred and forty motor vehicles and the twenty-four trains the army shares with the railway.\n\nThe officers present the roll without apology. The army was never meant to fight a neighbour alone; it was meant to hold ground, guard the depots and help the towns when the rain or anything else brings disaster. In mud that never dries and heat that never breaks, even that modest task is hard. Half the vehicles spend the rainy weeks parked, and the mountain companies rely on mules and boots.\n\nThe staff asks the cabinet for a doctrine. It can hold the mountain passes, keep a reserve on the trains, or turn every town into a trained shelter company. Before any choice, the staff wants to know whether the roll will be read out in the chamber or kept on file.\n\nProvisional gameplay."
 ac_wd_lur.7.a:0 "Read the roll in public."
 ac_wd_lur.7.b:0 "Keep it on file."
 ac_wd_lur.8.t:0 "What the Airfield Is For"
 ac_wd_lur.8.d:0 "Luremia has one air base, at Knadorf, and no combat aircraft at all. The runway is used by a handful of transport and mail flights, a crop sprayer and the occasional foreign charter. The control tower doubles as the only place in the country with instruments good enough to forecast rain, and farmers phone it every morning to ask whether to cut hay.\n\nA study from the transport ministry asks what the field should become. Some officers want a flying school, with leased trainers and foreign instructors, so that the country at least has pilots if it ever needs them. Others want money spent on observers and radar instead, so that Luremia can see any aircraft over its hills even if it cannot meet them. The weather service wants to be left alone.\n\nNobody proposes buying fighters; the budget would not survive it and nobody can say what they would be for. The question for the cabinet is narrower: whether to treat the airfield as a military asset or a civil one while the argument goes on. The answer decides which ministry pays for the runway drains, and which one gets to say no the next time a foreign charter asks to land in a storm.\n\nProvisional gameplay."
 ac_wd_lur.8.a:0 "Treat it as a military asset."
 ac_wd_lur.8.b:0 "Keep it civil for now."
 ac_wd_lur_8_b:0 "Keep it civil for now."
 ac_wd_lur.9.t:0 "Four Neighbours Around a Small Country"
 ac_wd_lur.9.d:0 "The new liaison officers present their first joint report. Luremia touches four countries and no sea. Kaluga lies beyond the forests that close in on Knadorf and the two mountain provinces. Glaceland meets both provinces, its frontier districts reaching the hill country of Olastetten and the desert junction at Qesi. Sfaenland faces the two desert provinces. Silvonia meets one mountain province and one desert province, in the far corner of the country.\n\nThe officers stress how much of this frontier is managed by habit. Herders and foresters cross the valley paths in season, desert traders take the road toward Sfaenland without much paperwork, and the posts in the Silvonia corner are rarely visited by anyone from the capital. None of the four neighbours is holding elections at present. In three of them nationalist movements command half the voters; in Kaluga the democratic parties hold a clear majority.\n\nThe cabinet is asked to agree a tone for all four relationships before it settles any one of them. It can introduce the liaison offices through a published statement, or through quiet letters to each capital. Either way, the offices open their doors next month.\n\nProvisional gameplay."
 ac_wd_lur.9.a:0 "Publish a statement."
 ac_wd_lur.9.b:0 "Send quiet letters."
 ac_wd_lur.10.t:0 "Fragments Will Fall Somewhere"
 ac_wd_lur.10.d:0 "The FCU announcement of April 1996 leaves no room for hope that Ulysses will miss. The astronomers' warning of December 1994 hardens into a certainty, and the only remaining question, where the fragments will fall, is the one nobody can answer. The Knadorf radio repeats the announcement every hour, then stops repeating it and starts taking calls instead.\n\nLuremia is a country whose small army was built for civil defence and whose capital sits among hills and mountains of solid rock. The engineers say the obvious thing: cut galleries into the hills and stock them. The railway officers say the other obvious thing: a country with two provinces and two lines can move whole towns by train, toward whichever province looks safer when the time comes. Each group thinks the other's plan is a fantasy.\n\nThe public is ahead of the planners. Hardware shops in Knadorf run out of lamps and water drums, and families in the hill towns begin clearing their cellars without being told to. The cabinet must decide what it says first: the danger, or the plan it does not yet have.\n\nProvisional gameplay: date anchors only, Official Chronicle rows 1994 / 12.10 and 1996 / 04.20 in tools/lore/chronicle.json; where fragments fall is not claimed and the Luremian response is gameplay."
 ac_wd_lur.10.a:0 "Speak first about the plan."
 ac_wd_lur.10.b:0 "Speak first about the danger."
 ac_wd_lur_10_b:0 "Speak first about the danger."
 ac_wd_lur.11.t:0 "A Night Underground"
 ac_wd_lur.11.d:0 "Ulysses crosses the Roche limit on 8 July 1999, and Luremia spends the night ready to move. Trains wait at every platform with crews aboard and engines warm, the shelter wardens walk their streets with lists, and the radio at Knadorf stays on the air all night reading the same short bulletin every quarter hour. Nobody knows what the night will bring to these hills, and nobody pretends to.\n\nFamilies who prepared go where they planned to go: into the galleries, onto the evacuation trains, or down into their own cellars with water and a radio. Families who did not prepare stand in the street and watch the sky. At the Qesi plants the night shift keeps working because the managers cannot think what else to tell it. The battalions wait at their depots for orders that may never come.\n\nBy dawn the cabinet must decide how long to keep the country in this state. Standing down too early risks being wrong in front of everyone. Staying mobilised for weeks costs wages, harvests and patience. The wardens want an answer they can give the people on their lists by breakfast.\n\nProvisional gameplay: date anchor only, Official Chronicle row 1999 / 07.08 in tools/lore/chronicle.json; no damage in Luremia is claimed and the response is gameplay."
 ac_wd_lur.11.a:0 "Keep the shelters open for a week."
 ac_wd_lur.11.b:0 "Stand down as the reports allow."
 ac_wd_lur.12.t:0 "The Belkan War Reaches the Shops"
 ac_wd_lur.12.d:0 "In March 1995 war breaks out around Belka. No Luremian frontier touches it and no Luremian has any part in it, yet within a fortnight its effects are on the shelves in Knadorf. Fuel costs more, imported machinery costs more, and the charter contracts in foreign harbours arrive with new war clauses that the freight office has to read twice to understand.\n\nThe arms works receive letters from buyers they have never heard of, asking about spare parts and replacement kit. Some ministers see orders that would keep the night shifts busy. Others see a small country making enemies it can never afford, and remind the cabinet that every rifle sold abroad is a rifle the four battalions do not have.\n\nThe cabinet meets twice in one week. It must decide whether to calm prices first or settle the question of exports first, knowing that it cannot do both at once and that the newspapers will report whichever it chooses as the government's real priority. In Qesi the shift committees have already asked whether the night shifts will be kept, and in the hill towns the bakers have raised the price of bread by a tenth to cover the cost of fuel for their ovens.\n\nProvisional gameplay: date anchor only, Official Chronicle row 1995 / 03.25 in tools/lore/chronicle.json; the Luremian response is gameplay."
 ac_wd_lur.12.a:0 "Calm the prices first."
 ac_wd_lur.12.b:0 "Settle the export question first."
 ac_wd_lur.13.t:0 "War Clauses Again"
 ac_wd_lur.13.d:0 "In August 2003 the ISAF is formed to oppose Erusea, and the war in Usea becomes the business of every freight office in the world. Luremia has no frontier in Usea and takes no side, but its charter cargoes cross the same oceans as everyone else's. Within a week the insurers send new war clauses and new rates, and two charter owners ask to be released from their contracts.\n\nThe war-clause desk in Knadorf has seen this before, during the Belkan War, and its officials know the order in which things go wrong: premiums first, then delays, then empty shelves. They propose to reroute what can be rerouted, stock what can be stocked and accept that some prices will rise. The plant managers want guaranteed deliveries of spares. The shops want guaranteed deliveries of everything.\n\nThe cabinet must decide how much of the extra cost to carry itself. Subsidising the new premiums would keep prices steady and drain the treasury. Passing them on would be honest, quick and unpopular in both provinces. The desk warns that the war could last for years, and that a subsidy begun now will be very hard to withdraw before it ends.\n\nProvisional gameplay: date anchor only, Official Chronicle row 2003 / 08.22 in tools/lore/chronicle.json, with the mod flag ac_ucw_isaf_formed; no Luremian part in the war is claimed."
 ac_wd_lur.13.a:0 "Carry the premiums for a year."
 ac_wd_lur.13.b:0 "Pass the costs on."
 LUR_wd_republic_chamber_office:0 "Cabinet of the Republic Chamber"
 LUR_wd_republic_chamber_office_desc:0 "A cabinet formed from the majority of an elected chamber, governing collectively and answering to deputies on a fixed polling calendar. Provisional gameplay office with no named holder."
 LUR_wd_standing_administration_office:0 "The Standing National Administration"
 LUR_wd_standing_administration_office_desc:0 "The National Administration made permanent as a non-party government of career officials working to a published programme, with the ballot left suspended. Provisional gameplay office with no named holder."
 LUR_wd_defence_directorate_office:0 "Directorate of Civil Defence"
 LUR_wd_defence_directorate_office_desc:0 "A directorate of civil defence officers, army staff and shelter administrators that governs by order until it declares the country ready. Provisional gameplay office with no named holder."
 ac_wd_lur_decisions:0 "Luremia: National Measures"
 ac_wd_lur_decisions_desc:0 "Measures from the national programme of Luremia. Provisional gameplay unless a source ledger row says otherwise."
 LUR_wd_drain_crews_decision:0 "Clear the Drains Before the Rains"
 LUR_wd_drain_crews_decision_desc:0 "Sends paid crews to clear every culvert and gutter in Knadorf ahead of the next heavy rain. Repeatable once a year."
 LUR_wd_gallery_week_decision:0 "Open the Galleries for a Week"
 LUR_wd_gallery_week_decision_desc:0 "Invites families into the rock shelters for a week of drills and familiarisation. Repeatable once a year; the plants lose some shifts."
 LUR_wd_hardstands_decision:0 "Lay Hardstands at Knadorf Field"
 LUR_wd_hardstands_decision_desc:0 "Concrete parking pads and a taxiway beside the drained Knadorf runway, so that aircraft are not left standing in mud through the rains. Done once; the crews then return to the roads."
 LUR_wd_qesi_mast_decision:0 "Raise a Radar Mast over Qesi"
 LUR_wd_qesi_mast_decision_desc:0 "Raises a radar mast beside the Qesi emergency strip so the desert approaches are watched as well as the hills. Paid for once out of the airfield money."
 LUR_wd_reserve_train_decision:0 "Run the Reserve Train"
 LUR_wd_reserve_train_decision_desc:0 "Sends one reserve company along both lines on an exercise timetable for three months. Repeatable once a year; freight runs late while it does."
 LUR_wd_market_week_decision:0 "A Frontier Market Week"
 LUR_wd_market_week_decision_desc:0 "Opens the liaison offices to traders from all four neighbours for a market week. Repeatable once a year."
