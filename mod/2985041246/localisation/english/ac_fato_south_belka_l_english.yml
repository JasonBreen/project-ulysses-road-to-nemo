 ac_fsb_sbk_relief_review:0 "An Appeal beside Reconstruction"
 ac_fsb_sbk_relief_review_desc:0 "The existing reconstruction response remains in its owning ledger. Use its recorded local choice as evidence for a civil appeal, or proceed on a peaceful domestic basis if no such contract exists. Do not pay the original relief award again."
 SBK_fsb_relief_review:0 "An Appeal beside Reconstruction"
 SBK_fsb_relief_review_desc:0 "Unlock a local relief review contingent on the owning response or a peaceful substitute.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 120 days. New authorisations have a 180-day cooldown. "
 SBK_fsb_relief_review_tt:0 "Unlock a local relief review contingent on the owning response or a peaceful substitute.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 120 days. New authorisations have a 180-day cooldown. "
 ac_fsb_sbk_security_remit:0 "A Narrow Security Remit"
 ac_fsb_sbk_security_remit_desc:0 "Limit the local security service to the procedure actually authorised. Inspection may improve organisation, while a narrower remit protects public confidence. Neither outcome creates forces or changes an external military guarantee."
 SBK_fsb_security_remit:0 "A Narrow Security Remit"
 SBK_fsb_security_remit_desc:0 "Unlock a narrowly bounded oversight policy independent of foreign adviser consent.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Standing full-mode annual commitment: nominal GDP / 2000, recorded exactly when the standing account is reconciled. Remove it through the campaign review. Legacy and disabled modes retain the political/physical burden without a new cash commitment."
