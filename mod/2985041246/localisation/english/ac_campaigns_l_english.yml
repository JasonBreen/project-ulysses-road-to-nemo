 ac_camp.32.t:0 "A sky that must be used"
 ac_camp.32.desc:0 "The controller repeated the completion message because he did not trust himself to have heard it correctly. Around him, the operations room continued its work for several seconds before the silence began to spread from desk to desk.\n\nThe battery strike had returned a verified result. The crews had carried the engineers' information into the sky and brought back an answer the operations room could use. That did not bring back the aircraft already lost beneath Stonehenge's reach, and it did not arrange the next offensive. It changed what the next crews could be asked to attempt.\n\nThe targeting officer took the engineering diagram down from the briefing board. Beneath it was an older chart, still marked with the limits that had governed so many plans. He left that one where it was until the next shift arrived. They would need to understand why the new orders were different.\n\nAn allied representative telephoned to ask about receiving arrangements for the counteroffensive. A maintenance officer asked whether the temporary dispersal sites were still required. A local authority wanted to know whether the air warning schedule could be relaxed. The victory entered ordinary life as a collection of questions, each requiring an answer from someone who could be held to it.\n\nAt the far end of the room, a clerk began copying the names of the crews committed to the strike. The controller watched him and thought of all the times the room had celebrated a plan before the aircraft returned.\n\nThis time there was a result to record. The work waiting beyond it had already begun to ring on the telephone."
 ac_camp.32.a:0 "Keep this account."
 ac_camp.32.z:0 "Close this old message."
