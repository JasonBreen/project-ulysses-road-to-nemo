 YUK_snc_civil_receiving_renew:0 "Renew: The Request behind the Priority"
 YUK_snc_civil_receiving_renew_desc:0 "Reopen this interrupted review at the present date for ten political power and two institutional-capacity points. It requires a new corresponding funded period; no old work is retroactively credited and the service pays its own usual costs."
