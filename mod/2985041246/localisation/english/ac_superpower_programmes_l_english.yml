 OSE_snp_appropriations_protocol:0 "Name the Receiving Authority"
 OSE_snp_appropriations_protocol_desc:0 "The first federal return contains three promises against the same staff rota. The public-service officer asks which promise should be withdrawn; the defence representative asks why an untested estimate has already become a public commitment. Neither can answer without the receiving offices. A useful appropriation must identify what can actually be sustained, who may change it and which service bears the delay. The federal register will preserve that disagreement instead of resolving it with another uncosted declaration.\n\nA reservation is useful only when somebody can release it. Give each operational scope an accountable office and a bounded period rather than permanent exceptional access."
