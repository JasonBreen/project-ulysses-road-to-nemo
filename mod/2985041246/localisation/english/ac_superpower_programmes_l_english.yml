 YUK_snp_allocation_civil_policy_spirit_settled_desc:0 "The allocation docket has no empty columns, yet two districts report that nobody has authority to release the staff assigned to them. A command representative wants a single protected chain of responsibility. A civilian administrator asks who will receive a complaint when that chain chooses another priority. Both describe genuine shortages. The new docket must show who controls each reservation and what the alternative route gives up; renaming scarcity as discipline will not make the missing hours appear.\n\nRetain the selected balance in an ordinary national docket. The final settlement improves the benefit without erasing the burden on competing offices. The chosen continuing cost remains."
