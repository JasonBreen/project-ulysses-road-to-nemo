 NPT_rc_mandate_civil_policy_spirit:0 "Guarded access charter"
 NPT_rc_mandate_civil_policy_spirit_desc:0 "Future access requests require inspection, warning and a national right of refusal. The charter protects those powers without revoking existing defence undertakings, while accepting the continuing cost of an independent watch."
 NPT_rc_mandate_civil_policy_spirit_settled:0 "Guarded access charter: Standing Settlement"
 NPT_rc_mandate_civil_policy_spirit_settled_desc:0 "The mandate now includes a renewal process rather than an assumption of permanent consent. Neutral and cooperative governments retain their different obligations and a useful national conclusion. The continuing opportunity cost remains."
 NPT_rc_mandate_defence_policy_spirit:0 "Reviewed cooperation mandate"
 NPT_rc_mandate_defence_policy_spirit_desc:0 "Cooperation can be authorized without giving a foreign headquarters permanent discretion over local services. The legislature will publish the limits and accept the political burden of reviewing them."
 NPT_rc_mandate_defence_policy_spirit_settled:0 "Reviewed cooperation mandate: Standing Settlement"
 NPT_rc_mandate_defence_policy_spirit_settled_desc:0 "The mandate now includes a renewal process rather than an assumption of permanent consent. Neutral and cooperative governments retain their different obligations and a useful national conclusion. The continuing opportunity cost remains."
 NPT_rc_mandate_register:0 "Reopen the Island Mandate"
 NPT_rc_mandate_register_desc:0 "Years of emergency planning have not settled who may promise the islands' facilities to another government. An inventory of actual obligations gives the legislature a basis for renewing or limiting that authority."
 NPT_rc_mandate_civil_policy:0 "A Guarded Access Charter"
 NPT_rc_mandate_civil_policy_desc:0 "Future access requests require inspection, warning and a national right of refusal. The charter protects those powers without revoking existing defence undertakings, while accepting the continuing cost of an independent watch."
 NPT_rc_mandate_defence_policy:0 "A Parliamentary Cooperation Mandate"
 NPT_rc_mandate_defence_policy_desc:0 "Cooperation can be authorized without giving a foreign headquarters permanent discretion over local services. The legislature will publish the limits and accept the political burden of reviewing them."
 NPT_rc_mandate_operations:0 "Standing Instructions for Foreign Requests"
 NPT_rc_mandate_operations_desc:0 "Each request will identify the facilities, receiving office and withdrawal condition involved. Those instructions remain useful when a partner refuses the terms or no longer qualifies for assistance."
 NPT_rc_mandate_review:0 "Publish the Mandate Review"
 NPT_rc_mandate_review_desc:0 "An actual service period must be examined before its procedures become permanent. The review compares promises with the work completed; it does not turn a paper alliance into a delivered service."
 NPT_rc_mandate_settlement:0 "The Right to Decide Again"
 NPT_rc_mandate_settlement_desc:0 "The mandate now includes a renewal process rather than an assumption of permanent consent. Neutral and cooperative governments retain their different obligations and a useful national conclusion."
 NPT_rc_harbours_civil_policy_spirit:0 "Protected civilian berthing"
 NPT_rc_harbours_civil_policy_spirit_desc:0 "Civilian schedules will receive a protected receiving window. Commercial services gain predictability, while the defence establishment accepts longer notice for exceptional movements."
 NPT_rc_harbours_civil_policy_spirit_settled:0 "Protected civilian berthing: Standing Settlement"
 NPT_rc_harbours_civil_policy_spirit_settled_desc:0 "The final harbour compact preserves the chosen allocation and a tested release procedure. Existing ports, convoys, fuel and repair capacity still determine what can physically move. The continuing opportunity cost remains."
 NPT_rc_harbours_defence_policy_spirit:0 "Reserved defence receiving"
 NPT_rc_harbours_defence_policy_spirit_desc:0 "A limited military receiving window keeps emergency movements credible. Maintaining that reservation imposes a cost on ordinary traffic and does not create additional dockyards."
 NPT_rc_harbours_defence_policy_spirit_settled:0 "Reserved defence receiving: Standing Settlement"
 NPT_rc_harbours_defence_policy_spirit_settled_desc:0 "The final harbour compact preserves the chosen allocation and a tested release procedure. Existing ports, convoys, fuel and repair capacity still determine what can physically move. The continuing opportunity cost remains."
 NPT_rc_harbours_register:0 "A Working Harbour Register"
 NPT_rc_harbours_register_desc:0 "Harbour officers will distinguish usable berths, repair work and unfulfilled reservations. An island economy cannot count a quay as available to every ministry at once."
 NPT_rc_harbours_civil_policy:0 "Protect Civilian Berthing"
 NPT_rc_harbours_civil_policy_desc:0 "Civilian schedules will receive a protected receiving window. Commercial services gain predictability, while the defence establishment accepts longer notice for exceptional movements."
 NPT_rc_harbours_defence_policy:0 "Reserve a Defence Receiving Window"
 NPT_rc_harbours_defence_policy_desc:0 "A limited military receiving window keeps emergency movements credible. Maintaining that reservation imposes a cost on ordinary traffic and does not create additional dockyards."
 NPT_rc_harbours_operations:0 "Separate the Maintenance Queues"
 NPT_rc_harbours_operations_desc:0 "Commercial repairs and defence support require different returns but draw on some of the same skilled crews. Separate queues will show the capacity withheld from each service."
 NPT_rc_harbours_review:0 "Reconcile the Harbour Accounts"
 NPT_rc_harbours_review_desc:0 "A funded receiving or maintenance period will supply the evidence for review. Unpaid plans and interrupted services cannot qualify as completed work."
 NPT_rc_harbours_settlement:0 "Harbours That Can Keep Their Promises"
 NPT_rc_harbours_settlement_desc:0 "The final harbour compact preserves the chosen allocation and a tested release procedure. Existing ports, convoys, fuel and repair capacity still determine what can physically move."
 NPT_rc_airspace_civil_policy_spirit:0 "Civil warning priority"
 NPT_rc_airspace_civil_policy_spirit_desc:0 "The network will put public warning and protected local communications first. Air operations retain useful reporting, but cannot appropriate every civil channel without review."
 NPT_rc_airspace_civil_policy_spirit_settled:0 "Civil warning priority: Standing Settlement"
 NPT_rc_airspace_civil_policy_spirit_settled_desc:0 "The settlement retains the chosen warning or cooperation policy and a tested national receiving service. It neither forces alignment nor grants aircraft that were never manufactured. The continuing opportunity cost remains."
 NPT_rc_airspace_defence_policy_spirit:0 "Reviewed joint air service"
 NPT_rc_airspace_defence_policy_spirit_desc:0 "Compatible reporting procedures can support coalition aircraft while preserving national control. Maintaining a joint protocol costs staff capacity even when a foreign service makes no request."
 NPT_rc_airspace_defence_policy_spirit_settled:0 "Reviewed joint air service: Standing Settlement"
 NPT_rc_airspace_defence_policy_spirit_settled_desc:0 "The settlement retains the chosen warning or cooperation policy and a tested national receiving service. It neither forces alignment nor grants aircraft that were never manufactured. The continuing opportunity cost remains."
 NPT_rc_airspace_register:0 "Bring the Watch Stations Together"
 NPT_rc_airspace_register_desc:0 "Watch stations, airfield services and civil authorities possess different parts of the same report. A common duty book will make responsibility clear without asking a station to guarantee what it cannot observe."
 NPT_rc_airspace_civil_policy:0 "A Civil Warning Network"
 NPT_rc_airspace_civil_policy_desc:0 "The network will put public warning and protected local communications first. Air operations retain useful reporting, but cannot appropriate every civil channel without review."
 NPT_rc_airspace_defence_policy:0 "A Joint Air-Service Protocol"
 NPT_rc_airspace_defence_policy_desc:0 "Compatible reporting procedures can support coalition aircraft while preserving national control. Maintaining a joint protocol costs staff capacity even when a foreign service makes no request."
 NPT_rc_airspace_operations:0 "Keep the Receiving Airfields Accountable"
 NPT_rc_airspace_operations_desc:0 "Receiving an aircraft requires trained ground staff and a usable runway, not a diplomatic signature alone. The service will keep local capacity separate from external requests."
 NPT_rc_airspace_review:0 "Review an Actual Watch Period"
 NPT_rc_airspace_review_desc:0 "The government will examine a completed, funded watch or receiving period. An absent partner does not strand this domestic review."
 NPT_rc_airspace_settlement:0 "An Island Air-Service Settlement"
 NPT_rc_airspace_settlement_desc:0 "The settlement retains the chosen warning or cooperation policy and a tested national receiving service. It neither forces alignment nor grants aircraft that were never manufactured."
 REC_rc_records_civil_policy_spirit:0 "Public district register"
 REC_rc_records_civil_policy_spirit_desc:0 "District councils will publish allocations and hear challenges in public. The process strengthens confidence while consuming staff time that a central order could otherwise redirect."
 REC_rc_records_civil_policy_spirit_settled:0 "Public district register: Standing Settlement"
 REC_rc_records_civil_policy_spirit_settled_desc:0 "The resulting record preserves either public review or accountable central control. The existing hardline and reform branches retain their identities; no new government or border is imposed. The continuing opportunity cost remains."
 REC_rc_records_defence_policy_spirit:0 "Accountable central requisitions"
 REC_rc_records_defence_policy_spirit_desc:0 "The administration will retain direct control of requisitions, but require written receipts and a named official. Control becomes more dependable at a continuing political cost."
 REC_rc_records_defence_policy_spirit_settled:0 "Accountable central requisitions: Standing Settlement"
 REC_rc_records_defence_policy_spirit_settled_desc:0 "The resulting record preserves either public review or accountable central control. The existing hardline and reform branches retain their identities; no new government or border is imposed. The continuing opportunity cost remains."
 REC_rc_records_register:0 "Preserve the District Record"
 REC_rc_records_register_desc:0 "Reconstruction has left overlapping claims to housing, workshops and public stores. The republic needs to preserve the record before another administrative reorganization disperses it."
 REC_rc_records_civil_policy:0 "A Public Council Register"
 REC_rc_records_civil_policy_desc:0 "District councils will publish allocations and hear challenges in public. The process strengthens confidence while consuming staff time that a central order could otherwise redirect."
 REC_rc_records_defence_policy:0 "A Controlled Requisition Register"
 REC_rc_records_defence_policy_desc:0 "The administration will retain direct control of requisitions, but require written receipts and a named official. Control becomes more dependable at a continuing political cost."
 REC_rc_records_operations:0 "Hear the Outstanding Claims"
 REC_rc_records_operations_desc:0 "A claims service gives residents a route to correct the register. Its work stays within the inherited settlement and makes no new territorial demand."
 REC_rc_records_review:0 "Audit a Completed Claims Period"
 REC_rc_records_review_desc:0 "The review requires completed casework rather than the announcement of a new office. Interrupted or unpaid periods leave the outstanding claims visible."
 REC_rc_records_settlement:0 "A Durable Administrative Record"
 REC_rc_records_settlement_desc:0 "The resulting record preserves either public review or accountable central control. The existing hardline and reform branches retain their identities; no new government or border is imposed."
 REC_rc_works_civil_policy_spirit:0 "Municipal repair compacts"
 REC_rc_works_civil_policy_spirit_desc:0 "Municipalities will retain a protected repair allocation and publish their own priorities. Local knowledge improves service at the price of a slower national redirection process."
 REC_rc_works_civil_policy_spirit_settled:0 "Municipal repair compacts: Standing Settlement"
 REC_rc_works_civil_policy_spirit_settled_desc:0 "The chosen works policy becomes a normal service obligation instead of a succession of emergency promises. Later recovery remains useful without revising the established territorial settlement. The continuing opportunity cost remains."
 REC_rc_works_defence_policy_spirit:0 "Central works schedule"
 REC_rc_works_defence_policy_spirit_desc:0 "A central schedule will move technical crews between districts according to reported urgency. The administration accepts the political burden of explaining why a district must wait."
 REC_rc_works_defence_policy_spirit_settled:0 "Central works schedule: Standing Settlement"
 REC_rc_works_defence_policy_spirit_settled_desc:0 "The chosen works policy becomes a normal service obligation instead of a succession of emergency promises. Later recovery remains useful without revising the established territorial settlement. The continuing opportunity cost remains."
 REC_rc_works_register:0 "Map the Remaining Service Gaps"
 REC_rc_works_register_desc:0 "A completed reconstruction programme can leave ordinary services uneven. Municipal returns will identify the maintenance work still required inside Recta's existing states."
 REC_rc_works_civil_policy:0 "Municipal Repair Compacts"
 REC_rc_works_civil_policy_desc:0 "Municipalities will retain a protected repair allocation and publish their own priorities. Local knowledge improves service at the price of a slower national redirection process."
 REC_rc_works_defence_policy:0 "A Central Works Schedule"
 REC_rc_works_defence_policy_desc:0 "A central schedule will move technical crews between districts according to reported urgency. The administration accepts the political burden of explaining why a district must wait."
 REC_rc_works_operations:0 "Keep Repair Crews in Service"
 REC_rc_works_operations_desc:0 "Repair crews need recurring inspection, training and a receiving office after the opening contract ends. A standing rota supports native construction and repair without creating buildings by decree."
 REC_rc_works_review:0 "Review the Works Actually Delivered"
 REC_rc_works_review_desc:0 "The government must review a service period that was actually funded and completed. Later work will be judged by what residents receive, rather than the promises made during the emergency."
 REC_rc_works_settlement:0 "Reconstruction beyond the Emergency"
 REC_rc_works_settlement_desc:0 "The chosen works policy becomes a normal service obligation instead of a succession of emergency promises. Later recovery remains useful without revising the established territorial settlement."
 REC_rc_neighbours_civil_policy_spirit:0 "Compatible civil standards"
 REC_rc_neighbours_civil_policy_spirit_desc:0 "Compatible inspection and receiving standards make trade and assistance easier. They do not compel a partner to accept an offer or alter either country's diplomatic status."
 REC_rc_neighbours_civil_policy_spirit_settled:0 "Compatible civil standards: Standing Settlement"
 REC_rc_neighbours_civil_policy_spirit_settled_desc:0 "The resulting policy keeps useful relations with eligible neighbours and a viable national alternative. Existing faction consent and postwar settlement owners remain authoritative. The continuing opportunity cost remains."
 REC_rc_neighbours_defence_policy_spirit:0 "Protected national procedures"
 REC_rc_neighbours_defence_policy_spirit_desc:0 "National control will take priority over routine external access. Domestic technical services remain useful, while the government accepts the extra burden of maintaining its own procedures."
 REC_rc_neighbours_defence_policy_spirit_settled:0 "Protected national procedures: Standing Settlement"
 REC_rc_neighbours_defence_policy_spirit_settled_desc:0 "The resulting policy keeps useful relations with eligible neighbours and a viable national alternative. Existing faction consent and postwar settlement owners remain authoritative. The continuing opportunity cost remains."
 REC_rc_neighbours_register:0 "A Ledger of External Obligations"
 REC_rc_neighbours_register_desc:0 "Contacts with Gebet and FATO have produced obligations that survive a single meeting. The republic will record which services it can provide and which require a separate national authorization."
 REC_rc_neighbours_civil_policy:0 "Compatible Civil Standards"
 REC_rc_neighbours_civil_policy_desc:0 "Compatible inspection and receiving standards make trade and assistance easier. They do not compel a partner to accept an offer or alter either country's diplomatic status."
 REC_rc_neighbours_defence_policy:0 "Protected National Control"
 REC_rc_neighbours_defence_policy_desc:0 "National control will take priority over routine external access. Domestic technical services remain useful, while the government accepts the extra burden of maintaining its own procedures."
 REC_rc_neighbours_operations:0 "Prepare a Useful Refusal"
 REC_rc_neighbours_operations_desc:0 "An external request may be declined because a partner is absent, at war, a subject or unwilling to cooperate. A domestic fallback will preserve the service without fabricating a bilateral agreement."
 REC_rc_neighbours_review:0 "Review the Liaison Service"
 REC_rc_neighbours_review_desc:0 "A funded liaison or standards period gives the government evidence of what can be sustained. The review does not require a foreign government to accept a treaty."
 REC_rc_neighbours_settlement:0 "Cooperation within the Settlement"
 REC_rc_neighbours_settlement_desc:0 "The resulting policy keeps useful relations with eligible neighbours and a viable national alternative. Existing faction consent and postwar settlement owners remain authoritative."
 SAP_rc_mandate_civil_policy_spirit:0 "Parliamentary service mandate"
 SAP_rc_mandate_civil_policy_spirit_desc:0 "The chamber will review external obligations against ordinary public services. Civil consent becomes more dependable while ministers accept a slower process for emergency reallocations."
 SAP_rc_mandate_civil_policy_spirit_settled:0 "Parliamentary service mandate: Standing Settlement"
 SAP_rc_mandate_civil_policy_spirit_settled_desc:0 "The final mandate gives the existing institutions a repeatable authorization process. It preserves the chosen civilian or defence priority without replacing the monarch, cabinet or chamber. The continuing opportunity cost remains."
 SAP_rc_mandate_defence_policy_spirit:0 "Protected defence appropriation"
 SAP_rc_mandate_defence_policy_spirit_desc:0 "A protected defence appropriation preserves training and readiness against other claims. Its continuing civilian opportunity cost must appear in the national accounts."
 SAP_rc_mandate_defence_policy_spirit_settled:0 "Protected defence appropriation: Standing Settlement"
 SAP_rc_mandate_defence_policy_spirit_settled_desc:0 "The final mandate gives the existing institutions a repeatable authorization process. It preserves the chosen civilian or defence priority without replacing the monarch, cabinet or chamber. The continuing opportunity cost remains."
 SAP_rc_mandate_register:0 "Return Commitments to the Chamber"
 SAP_rc_mandate_register_desc:0 "External guarantees have become continuing work for the government. The chamber will distinguish a political promise from the staff, transport and readiness needed to sustain it."
 SAP_rc_mandate_civil_policy:0 "A Parliamentary Service Mandate"
 SAP_rc_mandate_civil_policy_desc:0 "The chamber will review external obligations against ordinary public services. Civil consent becomes more dependable while ministers accept a slower process for emergency reallocations."
 SAP_rc_mandate_defence_policy:0 "A Protected Defence Appropriation"
 SAP_rc_mandate_defence_policy_desc:0 "A protected defence appropriation preserves training and readiness against other claims. Its continuing civilian opportunity cost must appear in the national accounts."
 SAP_rc_mandate_operations:0 "Publish the Burden of External Service"
 SAP_rc_mandate_operations_desc:0 "Publishing the burden allows an agreement to be limited, renewed or refused without pretending that consent creates additional physical capacity."
 SAP_rc_mandate_review:0 "Review a Funded Mandate"
 SAP_rc_mandate_review_desc:0 "A completed service period will test the chosen mandate. The review remains useful after a neighbour refuses cooperation or the wider diplomatic settlement changes."
 SAP_rc_mandate_settlement:0 "An Accountable National Commitment"
 SAP_rc_mandate_settlement_desc:0 "The final mandate gives the existing institutions a repeatable authorization process. It preserves the chosen civilian or defence priority without replacing the monarch, cabinet or chamber."
 SAP_rc_air_service_civil_policy_spirit:0 "Open professional review"
 SAP_rc_air_service_civil_policy_spirit_desc:0 "A professional review will permit civilian questions about service conduct and training. Openness improves confidence while taking instructors away from immediate operational work."
 SAP_rc_air_service_civil_policy_spirit_settled:0 "Open professional review: Standing Settlement"
 SAP_rc_air_service_civil_policy_spirit_settled_desc:0 "The air service retains its chosen review culture and a tested route from instruction to maintenance. The next administration will inherit a usable record rather than a claim that professional judgment has become infallible. The continuing opportunity cost remains."
 SAP_rc_air_service_defence_policy_spirit:0 "Restricted service debrief"
 SAP_rc_air_service_defence_policy_spirit_desc:0 "A restricted debrief preserves operational discretion and gives command a common account. The service accepts a continuing political cost for limiting access."
 SAP_rc_air_service_defence_policy_spirit_settled:0 "Restricted service debrief: Standing Settlement"
 SAP_rc_air_service_defence_policy_spirit_settled_desc:0 "The air service retains its chosen review culture and a tested route from instruction to maintenance. The next administration will inherit a usable record rather than a claim that professional judgment has become infallible. The continuing opportunity cost remains."
 SAP_rc_air_service_register:0 "Keep the Air-Service Record"
 SAP_rc_air_service_register_desc:0 "The service has training records, unanswered questions and commitments that outlast a public ceremony. Preserving those records is a professional obligation rather than a claim about a named squadron."
 SAP_rc_air_service_civil_policy:0 "Open Professional Review"
 SAP_rc_air_service_civil_policy_desc:0 "A professional review will permit civilian questions about service conduct and training. Openness improves confidence while taking instructors away from immediate operational work."
 SAP_rc_air_service_defence_policy:0 "A Restricted Service Debrief"
 SAP_rc_air_service_defence_policy_desc:0 "A restricted debrief preserves operational discretion and gives command a common account. The service accepts a continuing political cost for limiting access."
 SAP_rc_air_service_operations:0 "Put Maintenance Lessons into Practice"
 SAP_rc_air_service_operations_desc:0 "Training lessons require ground crews, inspection intervals and a receiving unit. The programme improves existing capability rather than awarding an aircraft that was not produced."
 SAP_rc_air_service_review:0 "Review the Training Actually Delivered"
 SAP_rc_air_service_review_desc:0 "The review needs a completed, funded training or maintenance period. An interrupted exercise cannot be counted as delivered instruction."
 SAP_rc_air_service_settlement:0 "A Professional Air Service"
 SAP_rc_air_service_settlement_desc:0 "The air service retains its chosen review culture and a tested route from instruction to maintenance. The next administration will inherit a usable record rather than a claim that professional judgment has become infallible."
 GEB_rc_sovereignty_civil_policy_spirit:0 "Civil frontier control"
 GEB_rc_sovereignty_civil_policy_spirit_desc:0 "Civilian authorities will retain control over ordinary frontier services. Their predictable procedures improve confidence while limiting rapid military reassignment."
 GEB_rc_sovereignty_civil_policy_spirit_settled:0 "Civil frontier control: Standing Settlement"
 GEB_rc_sovereignty_civil_policy_spirit_settled_desc:0 "The final charter puts independent authority into a repeatable service rather than a permanent emergency. It does not redraw a frontier or reopen a settled territorial claim. The continuing opportunity cost remains."
 GEB_rc_sovereignty_defence_policy_spirit:0 "Protected defence transit"
 GEB_rc_sovereignty_defence_policy_spirit_desc:0 "A protected defence transit rota keeps contingency movement credible. Reserving that capacity imposes a visible cost on other services and grants no automatic access through a neighbour."
 GEB_rc_sovereignty_defence_policy_spirit_settled:0 "Protected defence transit: Standing Settlement"
 GEB_rc_sovereignty_defence_policy_spirit_settled_desc:0 "The final charter puts independent authority into a repeatable service rather than a permanent emergency. It does not redraw a frontier or reopen a settled territorial claim. The continuing opportunity cost remains."
 GEB_rc_sovereignty_register:0 "An Independent Receiving Authority"
 GEB_rc_sovereignty_register_desc:0 "Independence depends on ordinary officials being able to accept, inspect or refuse a request. A receiving authority will identify the national responsibility behind those decisions."
 GEB_rc_sovereignty_civil_policy:0 "Civil Control at the Frontier"
 GEB_rc_sovereignty_civil_policy_desc:0 "Civilian authorities will retain control over ordinary frontier services. Their predictable procedures improve confidence while limiting rapid military reassignment."
 GEB_rc_sovereignty_defence_policy:0 "A Protected Defence Transit Rota"
 GEB_rc_sovereignty_defence_policy_desc:0 "A protected defence transit rota keeps contingency movement credible. Reserving that capacity imposes a visible cost on other services and grants no automatic access through a neighbour."
 GEB_rc_sovereignty_operations:0 "Write the National Refusal Procedure"
 GEB_rc_sovereignty_operations_desc:0 "A request from an ineligible or unwilling partner must leave a useful national alternative. Written refusal and appeal procedures protect sovereignty without manufacturing a diplomatic incident."
 GEB_rc_sovereignty_review:0 "Review the Frontier Service"
 GEB_rc_sovereignty_review_desc:0 "A completed inspection or transit-support period provides evidence for the review. Military access and consent from allied governments remain separate requirements."
 GEB_rc_sovereignty_settlement:0 "Sovereignty in Ordinary Administration"
 GEB_rc_sovereignty_settlement_desc:0 "The final charter puts independent authority into a repeatable service rather than a permanent emergency. It does not redraw a frontier or reopen a settled territorial claim."
 GEB_rc_recovery_civil_policy_spirit:0 "District service boards"
 GEB_rc_recovery_civil_policy_spirit_desc:0 "District boards will protect ordinary services and publish their maintenance priorities. Local control improves continuity while accepting a continuing administrative burden."
 GEB_rc_recovery_civil_policy_spirit_settled:0 "District service boards: Standing Settlement"
 GEB_rc_recovery_civil_policy_spirit_settled_desc:0 "The final recovery policy preserves the chosen local or central priorities and an ordinary maintenance institution. Prosperity remains dependent on productive capacity and a sustainable budget. The continuing opportunity cost remains."
 GEB_rc_recovery_defence_policy_spirit:0 "Central recovery dispatch"
 GEB_rc_recovery_defence_policy_spirit_desc:0 "A central dispatch will concentrate skilled crews where disruptions are greatest. The cabinet accepts the political cost of deciding which district waits."
 GEB_rc_recovery_defence_policy_spirit_settled:0 "Central recovery dispatch: Standing Settlement"
 GEB_rc_recovery_defence_policy_spirit_settled_desc:0 "The final recovery policy preserves the chosen local or central priorities and an ordinary maintenance institution. Prosperity remains dependent on productive capacity and a sustainable budget. The continuing opportunity cost remains."
 GEB_rc_recovery_register:0 "A Register of Remaining Repair Work"
 GEB_rc_recovery_register_desc:0 "Reconstruction returns will distinguish completed work from projects still waiting for crews. An honest register prevents the same capacity appearing in several ministries' plans."
 GEB_rc_recovery_civil_policy:0 "District Civil-Service Boards"
 GEB_rc_recovery_civil_policy_desc:0 "District boards will protect ordinary services and publish their maintenance priorities. Local control improves continuity while accepting a continuing administrative burden."
 GEB_rc_recovery_defence_policy:0 "A Central Recovery Dispatch"
 GEB_rc_recovery_defence_policy_desc:0 "A central dispatch will concentrate skilled crews where disruptions are greatest. The cabinet accepts the political cost of deciding which district waits."
 GEB_rc_recovery_operations:0 "Reserve Skilled Maintenance Crews"
 GEB_rc_recovery_operations_desc:0 "Keeping skilled crews available supports existing workshops, railways and public services. Their rota remains limited by actual workshop, transport, equipment and fuel capacity."
 GEB_rc_recovery_review:0 "Publish the Delivered Recovery Record"
 GEB_rc_recovery_review_desc:0 "The record must describe a funded period that actually finished. Later administrative improvement cannot become a retroactive wartime preparation reward."
 GEB_rc_recovery_settlement:0 "An Economy beyond Mobilization"
 GEB_rc_recovery_settlement_desc:0 "The final recovery policy preserves the chosen local or central priorities and an ordinary maintenance institution. Prosperity remains dependent on productive capacity and a sustainable budget."
