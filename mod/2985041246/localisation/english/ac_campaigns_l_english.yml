 ac_camp.96.t:0 "The watch beneath the weather"
 ac_camp.96.desc:0 "The weather reached the compartment as a change in the way loose objects behaved. A cup moved against the edge of its retaining bracket. Somewhere beyond the bulkhead, a man swore at a tool he had not secured properly.\n\nThe watch officer read the latest instruction beneath a light that made everyone look more tired than they admitted. The maritime denial effort was still active. The second carrier had neither been lost nor recalled, and the crew remained inside the interval between an order from above and whatever the next report from the sea would require.\n\nOne of the younger men asked how long they would remain on the current assignment. The officer gave him the confirmed part of the answer. He had learned to recognize the relief that followed a confident estimate and the resentment that followed its quiet replacement.\n\nAt the end of the compartment, a crewman was smoothing a letter against his knee. He had read it often enough that the folds were beginning to separate. When the officer looked over, the man put it away without being asked.\n\nThere were aircraft to maintain in a space that made every additional task involve someone else's passage through the same doorway. The watch continued through the weather, marked by ordinary requests and the small courtesies that kept them from becoming arguments.\n\nThe officer returned to the instruction. He would confirm what could be confirmed, preserve the limits, and give the next watch an account that would remain useful after the tone in which it was spoken had been forgotten."
 ac_camp.96.a:0 "Keep this account."
 ac_camp.96.z:0 "Close this old message."
