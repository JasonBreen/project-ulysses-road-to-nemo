 ac_camp.105.t:0 "Open at the usual time"
 ac_camp.105.desc:0 "The clinic keeps its old opening hours because changing them would make the war feel permanent. That is what the nurse says, and the porter lets her say it. They both know that most mornings begin with a different list of things they no longer have. Continuity means finding a practical arrangement with powers that can close the road. Protected local administration means deciding which compromises can be recorded without endangering the people who made them. The branch turns that choice into a receiving operation whose outcome returns in the occupation story and, if the city is liberated, in the work of rebuilding."
 ac_camp.105.a:0 "Circulate a public receiving account."
 ac_camp.105.b:0 "Keep a signed professional return."
