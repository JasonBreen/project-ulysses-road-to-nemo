 ac_ud_up.1.t:0 "The Question of the Administration"
 ac_ud_up.1.d:0 "The question was not asked in a speech. It was asked in a memorandum, circulated among the permanent secretaries of San Salvacion's ministries on a winter morning in 1991, and it ran to a single line: on what authority does this administration govern? The national administration had kept the republic neutral through the long quarrels of its neighbours, balanced its budget in most years and opened more schools than it closed. It had never held an election, and nobody inside it could remember the last time anyone had asked it to.\n\nThe answers came back within a week, and they did not agree. The ministry of justice returned a draft charter written by its own junior lawyers, who had been meeting in the evenings with schoolteachers and district clerks. The civil protection service, the one national body every district already obeyed, returned a proposal that read like an inspection manual: a Directorate, a rota, and powers defined by the emergencies they were meant to meet. From the dry interior came a letter signed by the chairs of a dozen water councils, asking why a capital that could not fill a cistern should decide anything else at all.\n\nThe administration's own answer was the shortest. It works, the memorandum's author wrote in the margin of the last reply. The continent is rearming, the economy is fragile, and neutrality is a habit that a single bad year can break. Continuity is also a choice, and from now on it will have to be defended as one.\n\nNone of these answers is a government yet. Each is a movement, a draft, a committee and a set of grievances. Which of them San Salvacion follows will decide who holds the seals when the hard years come.\n\nProvisional gameplay: no official source describes San Salvacion's internal politics or policies; this is an authored alternative."
 ac_ud_up.1.a:0 "Let the question be argued in public."
 ac_ud_up.1.b:0 "The administration will answer it in its own time."
 ac_ud_up.2.t:0 "The Charter Assembly Convenes"
 ac_ud_up.2.d:0 "The Charter Assembly met in the old customs hall because no other public building in the capital had enough chairs. Delegates came from every district with their credentials pinned to their coats and the draft charter folded in their pockets, many of them reading its first article for the hundredth time. San Salvacion is a neutral republic. It takes no side in the quarrels of other nations and lends its territory to no army. The second article was shorter and more dangerous: the republic is governed by an assembly elected by its citizens.\n\nThe national administration handed over the seals on the first afternoon. There was no ceremony, only a permanent secretary placing a wooden box on the presidium's table and asking for a receipt. Most of the administration's officials stayed at their desks. They had run the country for a generation, and the assembly needed someone who knew where the files were. Some of them believed in the charter. Others believed it would fail within a year and intended to be in the room when it did.\n\nThe presidium's first decisions were modest. It confirmed the budget, renewed the neutrality law and appointed a commission to draw the electoral districts. The commission's maps would take months, and every district wanted its own boundaries drawn by its own people. The assembly also had to decide what to do with the civil protection service and the water councils, whose movements had lost the argument but not their followers.\n\nOutside the customs hall, the capital watched with the wary patience of a city that had seen many promises. A charter is a paper. Whether it becomes a constitution depends on what the assembly does when the paper is tested, and the years ahead will test it.\n\nProvisional gameplay: no official source describes San Salvacion's internal politics or policies; this is an authored alternative."
 ac_ud_up.2.a:0 "Call the first general election within the year."
 ac_ud_up.2.b:0 "Govern under the charter until the districts are drawn."
 ac_ud_up.3.t:0 "The Directorate Takes the Keys"
 ac_ud_up.3.d:0 "The civil protection Directorate did not seize power. It inspected it. On the morning of the transfer, officers in grey service jackets visited every ministry with a clipboard, counted the keys, checked the fire exits and asked each permanent secretary to name a deputy who could act in their absence. By noon the national administration had been replaced by a rota, and the rota had been posted on the door of every public building in the capital.\n\nThe Directorate's proclamation was brief and carefully worded. It assumed the functions of government for the duration of the national emergency. It did not say what the emergency was, when it had begun or when it would end. Asked by a foreign correspondent, a Directorate spokesman explained that a small country surrounded by rearming neighbours was always in an emergency, and that the only question was whether it prepared for one.\n\nThe districts accepted the change faster than the capital did. The civil protection service had been the only national body that came when called: it had dug out villages after floods, run water convoys in dry summers and kept the shelters in repair. The Charter Movement's lawyers and the water councils protested, wrote letters and were invited to join advisory committees, which met regularly and decided nothing.\n\nGovernment by checklist has its virtues. It is predictable, it does not panic and it keeps records. Whether it can govern a republic rather than an emergency is a question the Directorate has chosen not to ask.\n\nProvisional gameplay: no official source describes San Salvacion's internal politics or policies; this is an authored alternative."
 ac_ud_up.3.a:0 "Publish the rota and every name on it."
 ac_ud_up.3.b:0 "Keep the Directorate's membership confidential."
 ac_ud_up.4.t:0 "A Government of the Councils"
 ac_ud_up.4.d:0 "The standing committee of the district councils arrived in the capital by bus, with a crate of water tallies, a list of unrepaired roads and no intention of staying longer than necessary. The national administration had agreed to hand over the ministries after the congress of councils made clear that the districts would otherwise stop paying for them. The committee took the keys, held its first meeting in the ministry of public works and voted to move half the ministry back to the interior.\n\nGovernment by council is government by argument. Every district sends a delegate, every delegate has a mandate, and every mandate is about water. The dry districts want cisterns, the river districts want flood works and the capital wants to be remembered at all. The committee decides by majority, publishes its votes and reverses itself when the councils instruct it to, which happens often enough that ministry officials now keep two drafts of every order.\n\nThe capital is unhappy, and its newspapers say so daily. The Charter Movement calls the councils a federation of complaints; the civil protection service quietly continues its rotas under a committee it does not respect. Foreign embassies ask which office they should telephone and are given several numbers. Yet the wells are being dug, the roads repaired in the order the councils chose, and for the first time the interior can point to a government that answers when it calls.\n\nWhether a republic can be governed from its districts depends on whether the districts can agree on anything except their grievances. The committee intends to find out.\n\nProvisional gameplay: no official source describes San Salvacion's internal politics or policies; this is an authored alternative."
 ac_ud_up.4.a:0 "Move the ministries to the districts."
 ac_ud_up.4.b:0 "Keep the ministries in the capital, under council audit."
 ac_ud_up.5.t:0 "A Mandate without a Ballot"
 ac_ud_up.5.d:0 "The national administration published its mandate on a Monday, in every newspaper and on the door of every district office. It was four pages long. It said what the administration governed, which was everything it had always governed; for how long, which was until the republic decided otherwise by lawful means; and on whose behalf, which was the citizens of San Salvacion, whose consent it did not claim but whose trust it intended to earn.\n\nThe mandate's critics noticed what it did not say. It did not say how the republic might decide otherwise, or what lawful means would be recognised, or who would recognise them. The Charter Movement called it a lease without a landlord. The water councils called it a promise from the people who had broken most of the others. The civil protection service, which had expected to be asked to govern, said nothing at all and renewed its rotas.\n\nInside the administration, the mandate was received as a reform. Permanent secretaries now had to publish their procedures, answer written questions from district offices and appear before an inspector they could not dismiss. Some resigned. Most adapted, as they had always adapted, and found that a published procedure was easier to defend than an unwritten one.\n\nA mandate without a ballot is still a promise, and promises can be counted. The administration has given the republic something to count. If it keeps the count honest, continuity may yet become consent.\n\nProvisional gameplay: no official source describes San Salvacion's internal politics or policies; this is an authored alternative."
 ac_ud_up.5.a:0 "Answer every written question in public."
 ac_ud_up.5.b:0 "Answer through the district offices, quietly."
 ac_ud_up.6.t:0 "What the Desert Needs First"
 ac_ud_up.6.d:0 "The civil survey of the desert district took a year and three vehicles, two of which did not come back under their own power. Its report ran to nine volumes. The first eight counted things: wells, cisterns, schools, clinics, roads, families and the distances between them. The ninth volume was a single chapter, and it asked the only question the government had to answer: what does the desert need first?\n\nThe water engineers answered at once. A district without water loses its people, and no road will bring them back. Wells, cisterns and pumping stations should come first, maintained by the people who use them and paid for by tariffs they set themselves. The cost would be high and the benefits local, but a district that could drink could stay.\n\nThe transport officials answered differently. A district without roads cannot sell what it produces, cannot reach a hospital and cannot be reached when something goes wrong. Roads would bring tankers, doctors and buyers. Water could follow the roads; roads could not follow the water. The cost would be high and the benefits national, and the haulage firms were already offering to carry public freight in return for concessions.\n\nThe survey's authors refused to choose. They wrote that both answers were right and that the republic could not afford both at once. The desert district has waited a long time for the capital to notice it. It will notice which answer the capital chooses.\n\nProvisional gameplay: no official source describes San Salvacion's internal politics or policies; this is an authored alternative."
 ac_ud_up.6.a:0 "Publish the full survey, all nine volumes."
 ac_ud_up.6.b:0 "Send the survey teams back to finish the count."
 ac_ud_up.7.t:0 "News from the Skully Islands"
 ac_ud_up.7.d:0 "The news reached San Salvacion's capital on the last day of 1995, by way of a radio bulletin and a telephone call from the border posts. Robert Tyler of Central Usea's Army Southern District had eliminated a rebel base in the Skully Islands, and Unified Command had defeated the rebels with Scarface Squadron. The bulletin was brief, the telephone call was not. The border officers wanted to know whether anyone fleeing the islands was likely to come their way, and what they were supposed to do if someone did.\n\nNobody in the capital knew. San Salvacion had no part in the action and wanted none. The government's first instinct was the one it always had: issue a statement of neutrality, recognise the authorities that existed and take no side. The statement was drafted within the hour. The harder question was what neutrality meant at a border post in the interior, at night, when a truck without papers stopped at the barrier.\n\nThe border posts asked for rules. Who may cross? Who must be detained? Who may be returned, and to whom? The interior ministry produced a draft that answered the first question, avoided the second and referred the third to a committee. The civil protection service offered to staff the posts with its own rota. The water councils pointed out that the posts were in their districts, and that nobody had asked them.\n\nA rebellion on islands far away has turned into a question at San Salvacion's own gate. The answer the government gives tonight will become the rule for the years ahead.\n\nOfficial: ACES Chronicle, 1995 / 12.31; San Salvacion's response is provisional gameplay."
 ac_ud_up.7.a:0 "Detain no one without a charge; return no one without a hearing."
 ac_ud_up.7.b:0 "Close the border posts to anyone without papers."
 ac_ud_up.8.t:0 "The Warning"
 ac_ud_up.8.d:0 "Central Usea announced it on the twentieth of April 1996: the asteroid Ulysses would strike the Earth. The announcement was read on every radio station in San Salvacion within the hour, and in the afternoon the telephones at the national observatory rang without stopping. The observatory had two astronomers and one telescope that could see anything useful. They spent the evening explaining to ministers, journalists and frightened callers what an orbit was and why nobody in San Salvacion could change one.\n\nThe government's first task was to decide what to tell the country. Some ministers wanted to say very little until the international estimates were firmer. Others argued that silence would be filled by rumour, and that rumour would be worse than any estimate. The civil protection service wanted to publish shelter instructions at once. The finance ministry wanted to know what the instructions would cost before anyone promised them.\n\nThe second task was to decide what to ask of the neighbours. San Salvacion was small and neutral and had always relied on being left alone. Ulysses would not leave anyone alone. Central Usea was speaking of an international response, and an international response would need land, roads, water and the consent of whoever owned them.\n\nBy midnight the cabinet had agreed only that it would meet again in the morning. The observatory's lights were still on. Above the capital, the sky looked exactly as it always had, which was the hardest thing of all to explain.\n\nOfficial: ACES Chronicle, 1996 / 04.20; San Salvacion's preparations are provisional gameplay."
 ac_ud_up.8.a:0 "Tell the country everything we know, and what we do not."
 ac_ud_up.8.b:0 "Wait for the international estimates before speaking."
 ac_ud_up.9.t:0 "The Coup across Usea"
 ac_ud_up.9.d:0 "On the thirtieth of May 1997 a coup broke out across Usea. The radio carried fragments of it all night: barracks seized in one country, a broadcasting station in another, an airfield that changed hands twice before dawn. Unified Command would defeat it, with Scarface 1 among the pilots sent against the rebels, but on that night nobody in San Salvacion's capital knew how it would end, and several officers had stopped answering their telephones.\n\nThe government met in the basement of the interior ministry because the basement had a generator. Ministers arrived one at a time, each with a different rumour. The garrison of the capital was loyal; the garrison of the capital was wavering; a battalion in the interior had declared for no one in particular and was waiting to see who won. The civil protection service had already put its own rota on the doors of every ministry and was asking for authority to keep it there.\n\nBy morning the worst rumours had proved false. A handful of officers had joined the coup, a few dozen soldiers had followed them and most had gone home when they realised nobody else was coming. The capital had not fallen. The republic had not been tested so much as frightened, and the question now was what to do with the frightened men who had briefly thought otherwise.\n\nEvery government in Usea is asking the same question this week. San Salvacion's answer will say what kind of republic it means to be.\n\nOfficial: ACES Chronicle, 1997 / 05.30; events inside San Salvacion are provisional gameplay."
 ac_ud_up.9.a:0 "Arrest the conspirators and try them under ordinary law."
 ac_ud_up.9.b:0 "Hold them under emergency powers until the continent is calm."
 ac_ud_up.10.t:0 "The Host Terms"
 ac_ud_up.10.d:0 "Central Usea's proposal arrived in a folder thicker than most of the ministry's budgets. An international project, led by Central Usea, would place a battery of railguns in a desert region of San Salvacion to destroy the fragments of Ulysses before they reached the ground. The folder contained maps, engineering summaries, security annexes and a short letter asking for the host government's consent.\n\nConsent was the only thing San Salvacion had to give, and the cabinet discovered that it was worth more than anyone had expected. The project needed land, which the republic owned. It needed roads, water and power, which the host district had in short supply. It needed airspace, customs exemptions, security arrangements and the promise that the host would neither obstruct the work nor claim what it produced. In return it offered protection from the sky, which was not something San Salvacion could refuse.\n\nThe cabinet divided along familiar lines. One faction wanted a sovereign lease: the site leased, not ceded, with national law, national customs and national inspectors at the gate. Another wanted joint custody: a share of the site's security and a voice inside the perimeter, at the cost of standing visibly beside the guns. A third wanted to know what would happen to the battery when the fragments had fallen, and found that nobody in the folder had answered.\n\nWhatever the engineers' timetable, the host must decide what it is lending. Neutrality has never been tested by a guest this large.\n\nOfficial: ACES Chronicle, 1998 / 06.19, and Super Weapons, Stonehenge (an FCU-led international project in neutral San Salvacion's desert); the host terms are provisional gameplay."
 ac_ud_up.10.a:0 "Negotiate every annex, line by line."
 ac_ud_up.10.b:0 "Consent quickly and negotiate the details afterwards."
 ac_ud_up.11.t:0 "Eight Guns in the Desert"
 ac_ud_up.11.d:0 "On the nineteenth of June 1998 Stonehenge was completed. Eight railguns stood in San Salvacion's desert, their barrels pointed at an empty sky that would, in a little over a year, be full of falling stone. Central Usea's engineers held a short ceremony. San Salvacion's delegation stood at the back, in borrowed hard hats, and was thanked in the third paragraph of the speech.\n\nThe host district had lived beside the project for long enough to know what it meant. Convoys on roads built for farm carts. Floodlights that turned the night white. A perimeter that kept moving outward, swallowing grazing land and a road the villages had used for generations. The district had also seen clinics, wages and paved streets it had asked the capital for in vain. Its people did not know whether they were protected or occupied, and most suspected they were both.\n\nIn the capital, the completion raised a question the host terms had not answered. The battery was built to defend the world from Ulysses. It stood on neutral soil, operated by foreign crews, with power enough to bring down anything that flew. San Salvacion had agreed to host it. It had not agreed to become the most strategically important desert on the continent, and it had no say over what the guns would be used for once the sky was clear.\n\nTonight the host district is quiet, and the guns are silent. San Salvacion must decide how to live beside them.\n\nOfficial: ACES Chronicle, 1998 / 06.19, and Super Weapons, Stonehenge (eight railguns); the host's response is provisional gameplay."
 ac_ud_up.11.a:0 "Thank the engineers and claim nothing."
 ac_ud_up.11.b:0 "Remind the members, in writing, whose desert this is."
 ac_ud_up.12.t:0 "The Night of the Fragments"
 ac_ud_up.12.d:0 "On the eighth of July 1999 Ulysses passed the Roche limit and broke apart. In San Salvacion the night began with a light brighter than the moon and ended with a sound nobody who heard it would forget. Stonehenge fired into a sky full of falling stone, again and again, and the villages of the host district counted the shots until they lost count.\n\nBy morning the reports were confused and contradictory. Radio links to the interior failed for hours, the telephone exchanges jammed and rumours travelled faster than any official word. The government could confirm only what its own wardens and drivers had seen: a sky that had been on fire, a battery that had fired until its crews were exhausted, and roads filling with people from across the region who had not waited for instructions before leaving home.\n\nThe plans met the night they were written for. Some worked; wardens knew their streets, trains ran to their timetables and the field hospitals opened before the first ambulances arrived. Some did not; keys were held by the wrong office, convoys waited for orders that never came and a shelter built for a hundred people was found to hold three hundred. The preparation record closed at midnight. Everything done afterwards would be relief.\n\nThe morning brings its own questions. What was lost, what can be saved and what must be rebuilt are questions for the coming months. Tonight there is only the work.\n\nOfficial: ACES Chronicle, 1999 / 07.08; San Salvacion's relief is provisional gameplay."
 ac_ud_up.12.a:0 "Send the field hospitals where the damage is worst."
 ac_ud_up.12.b:0 "Restore water and roads before anything else."
 ac_ud_up.13.t:0 "The Border That Closed"
 ac_ud_up.13.d:0 "On the twenty-first of April 2000 Erusea stopped taking in refugees. The displaced of the fragment year, who had walked toward Erusea's cities, found the border closed and turned back. Many of them turned toward San Salvacion. Within a week the border posts in the interior reported columns on the roads: families with handcarts, lorries piled with furniture, children carrying younger children.\n\nThe government had planned for the fragments. It had not planned for this. The reception centres opened in the fragment year were still full. The water convoys were already stretched. The districts that would receive the newcomers were the same districts that had been stretched to breaking a year before, and their councils wanted to know who would pay.\n\nThe cabinet considered two answers. San Salvacion could be a refuge: open reception centres, register the newcomers, give them the right to work and accept that the country would change. Or it could be a corridor: feed them, treat them, give them a ticket and send them onward to whoever would take them. The first would cost money and comfort; the second would cost something harder to measure.\n\nErusea's decision was made in Erusea. San Salvacion's decision will be made here, and the people on the roads are waiting for it.\n\nOfficial: ACES Chronicle, 2000 / 04.21; San Salvacion's refugee policy is provisional gameplay."
 ac_ud_up.13.a:0 "Open the border posts tonight and decide the policy tomorrow."
 ac_ud_up.13.b:0 "Hold the columns at the posts until the policy is decided."
 ac_ud_up.14.t:0 "The Summer of the Invasion"
 ac_ud_up.14.d:0 "In the summer of 2003 Erusea invaded San Salvacion and seized Stonehenge. The first reports came from the host district: columns on the roads, aircraft over the perimeter, the project's crews disarmed or fled. Within days the railguns that had been built to shoot down falling stone were turned against aircraft, and the sky over the desert, which had been the safest in Usea, became the most dangerous.\n\nSan Salvacion's neutrality ended without the country choosing to end it. Its letters to every capital, its sovereign lease or its joint custody, its ledger of everything given and refused: none of it stopped a single armoured column. The border posts in the interior fought for an afternoon and were overrun. The government, meeting in the same basement it had used on the night of the coup, found itself governing a country that was being cut in pieces around it.\n\nCentral Usea and its partners are already at war with Erusea, and the coalition's help will come slowly if it comes at all. The government now has to decide how it will govern what it still holds, and how it will protect the people, the records and the institutions it no longer controls. Some ministers want to hold the free districts at any cost. Others want to prepare the ministries for occupation: to keep working quietly, keep records and wait.\n\nThe war has come to the desert because of the guns in it. Whatever San Salvacion does next, it will do as a country at war.\n\nOfficial: ACES Chronicle, 2003 / SUMMER; the exact day and San Salvacion's response are provisional gameplay."
 ac_ud_up.14.a:0 "Every ministry stays at its post."
 ac_ud_up.14.b:0 "Move the ministries' records out of the capital tonight."
 ac_ud_up.15.t:0 "Liberation"
 ac_ud_up.15.d:0 "San Salvacion was liberated in the summer of 2005. The occupier's columns withdrew from the towns they had held for two years, the guns in the desert were silent, and the government returned to a capital that had learned to manage without it. People came out into the streets, not to cheer, at first, but to look: at each other, at the damage, at the soldiers of the coalition who had come so far to reach them.\n\nLiberation has its own disorder. Officials who stayed under occupation and kept the quiet ministries running meet officials who governed the free districts and officials who fled abroad. Each has a record, and each record says something different about the others. Collaborators, real and alleged, are denounced in the squares. Families look for relatives who were displaced by the fighting, and the count of the displaced is longer than anyone wanted to believe.\n\nThe government's first act is to read the ledgers. The ledger of the occupation lists requisitions, arrests and debts. The host's ledger lists everything San Salvacion gave the battery and everything it was promised in return. The national budget, published every year under the administration or the assembly or the councils, has not been published for two. Somebody has to decide what the republic owes, and to whom.\n\nThe country that comes out of the war is not the country that went into it. It has governed itself in pieces. It must now decide how to govern itself whole.\n\nOfficial: ACES Chronicle, 2005 / 07.10 (San Salvacion liberated); the reconstruction of government is provisional gameplay."
 ac_ud_up.15.a:0 "Try collaborators in ordinary courts, with ordinary evidence."
 ac_ud_up.15.b:0 "Purge the ministries before they reopen."
 ac_ud_up.16.t:0 "The Desert after the Guns"
 ac_ud_up.16.d:0 "The battery in the desert was built for one crisis and fought over in another. Where the war followed its historical course, ISAF destroyed it in April 2005, and seven of its eight great batteries lie broken in the sand. Where the war took another course, or never came, the guns still stand, silent, their foreign crews gone or going. Either way, the site belongs to San Salvacion again, and San Salvacion must decide what it is.\n\nThe host district has opinions. Some of its people want the site fenced and closed for ever: a grave for those who died there and a warning to anyone who might want to build something like it again. Others point to the roads, the power lines and the water works that the battery left behind, and ask why a district that went without them for a century should leave them to rust in the name of remembrance.\n\nThe survey teams have opinions too. The site is dangerous: unexploded munitions, damaged power systems, ground nobody wants to test. Whatever the government decides, the first years will be spent making the desert safe, and the decision will shape where the surveyors start.\n\nAbove the desert, the sky is empty again. The country that hosted the guns has to decide how to live without them.\n\nOfficial: ACES Chronicle, 2005 / 04.02, and Super Weapons, Stonehenge (seven of eight batteries destroyed, where the war follows that course); the site's future is provisional gameplay."
 ac_ud_up.16.a:0 "Ask the host district to decide first."
 ac_ud_up.16.b:0 "Make the decision in the capital and explain it in the district."
 ac_ud_up.17.t:0 "Who Signs for Amber?"
 ac_ud_up.17.d:0 "In Amber the government is a signature. For as long as anyone can remember, the cabinet has governed by contract: it signs for roads, for rolling stock, for grain, for the maintenance of yards it does not own, and it answers for those signatures to nobody but itself. The arrangement has made Amber rich by the standards of its neighbours and has never once asked its citizens what they thought of it.\n\nIn the first weeks of 1991 three groups asked anyway. The largest contract holders, whose firms built most of what the cabinet signed for, proposed a Chartered Development Board: a government of the people who actually build things, answerable to the contracts they sign. The freight unions, whose members moved everything the contractors built, proposed a compact: they would keep Amber moving if the state guaranteed their wages, their safety and a vote. And a league of nationalists, noisy and growing, said that Amber had sold itself one contract at a time to foreign capitals and demanded that every foreign clause be struck out.\n\nThe cabinet's answer was to keep signing. It had delivered growth without elections and without a scandal anyone could prove. It saw no reason to hand the pen to people who would use it to sign for themselves. Yet its ministers noticed that the three movements were drawing crowds, and that the crowds were not all asking for the same thing.\n\nSomeone will hold the pen when the crisis years come. Amber must decide whose hand it trusts.\n\nProvisional gameplay: no official source covers Amber; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.17.a:0 "Invite the movements to submit written proposals."
 ac_ud_up.17.b:0 "The cabinet will sign as it always has."
 ac_ud_up.18.t:0 "The Board Publishes Its Schedule"
 ac_ud_up.18.d:0 "The Chartered Development Board took office in a hired conference hall, because its members agreed that the old cabinet rooms were too small for a government that intended to build things. Twenty-one seats were filled: fourteen by the largest contract holders in proportion to the value of their public work, five by regional delegates and two by the freight unions, who did not come. The chair of the Board was elected on the first ballot by the contractors, and the regional delegates abstained.\n\nThe Board's first act was to publish a schedule. It ran to five years and four hundred pages, and it allocated every yard, road and depot in Amber to a programme of work. Nothing outside the schedule would be built, and nothing inside it would be delayed. It was, the Board explained, a manifesto that could be audited: a promise written in tonnes, kilometres and completion dates rather than slogans.\n\nAmber's citizens found that they had a government that knew exactly what it wanted to do, and that they had very little say in it. The schedule was efficient and largely sensible. It favoured the regions where the contractors already worked and the projects they already knew how to deliver. The freight unions called it a timetable for profit. The Sovereign Contracts League called it the old cabinet in new clothes, with the foreign clauses still inside.\n\nThe Board does not mind criticism, so long as the schedule is met. It intends to be judged on its deliveries, and its first deliveries are due within the year.\n\nProvisional gameplay: no official source covers Amber; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.18.a:0 "Meet every deadline, whatever it costs."
 ac_ud_up.18.b:0 "Revise the schedule each year in public."
 ac_ud_up.19.t:0 "The Compact Takes the Cabinet"
 ac_ud_up.19.d:0 "The Labour Compact Cabinet was sworn in at the central freight yard, on a platform built from railway sleepers, in front of several thousand rail crews, dockers and warehouse staff who had stopped work for the afternoon and would make it up on Sunday. The compact's terms were read aloud before the oath: a wage floor, a national safety code, an elected chamber, and a freight workers' veto over any law that would break a strike.\n\nThe cabinet's ministers were union officials, transport engineers and two former contract managers who had changed sides. They had never governed anything larger than a pension fund. They knew, however, exactly how Amber moved, because they had moved it, and their first decisions were about the yards: rest periods, inspections and the right to stop work that would kill someone.\n\nThe contractors were alarmed and said so. A safety code would slow the freight; a wage floor would raise the price of every contract; an elected chamber would be full of people who had never signed anything. Several firms threatened to move their work abroad. The cabinet replied that the yards, the rails and the people who worked them would stay in Amber, and that the firms were welcome to take their offices wherever they liked.\n\nFreight moves more slowly now, and fewer people die moving it. Whether Amber can afford that trade will be decided by the first election.\n\nProvisional gameplay: no official source covers Amber; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.19.a:0 "Hold the first election as soon as the code is in force."
 ac_ud_up.19.b:0 "Make the code permanent before facing the voters."
 ac_ud_up.20.t:0 "The League in the Ministries"
 ac_ud_up.20.d:0 "The Sovereign Contracts League did not win an election, because there was none. It won the streets, then the newspapers, then the loyalty of enough officials that the old cabinet found its orders unanswered. When the cabinet resigned, the League's directorate moved into the ministries the same evening and hung its banners from the windows: long lists of every foreign clause in Amber's public contracts, each one marked for renegotiation.\n\nThe lists were accurate. Amber had signed contracts that gave foreign firms first claim on its freight in an emergency, that priced its grain in foreign currency and that allowed foreign inspectors into its yards. The League's conclusions were another matter. It promised that every foreign clause would be struck out and every bargain rewritten on Amber's terms, and it promised that the rewriting would cost nothing, because foreigners needed Amber more than Amber needed them.\n\nThe directorate's first letters went out within a week. Foreign partners were invited to sign new terms; partners who refused were sued, delayed or expelled. The contractors who had built Amber's prosperity were given deadlines and told that their loyalty would be remembered. The press was given instructions, and the newspapers that had made the League's name were the first to receive them.\n\nAmber is now governed by people who believe it has been cheated, and they are partly right. Whether they can renegotiate the world without breaking the country remains to be seen.\n\nProvisional gameplay: no official source covers Amber; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.20.a:0 "Renegotiate every contract at once."
 ac_ud_up.20.b:0 "Begin with the contracts that bind Amber's freight in an emergency."
 ac_ud_up.21.t:0 "The Cabinet's Promise"
 ac_ud_up.21.d:0 "The contracting cabinet renewed its own mandate with a promise rather than a vote. Every public contract would be published, the cabinet announced: large or small, foreign or domestic, completed or in dispute. Every bargain would be explained in plain language, with its cost, its beneficiary and the minister who signed it. The cabinet asked for nothing in return except time.\n\nPublication proved harder than promising. The ministries held contracts in filing cabinets, in safes, in the private papers of retired officials and in the memories of clerks who had died. Some contracts had been signed twice, by different ministers, for the same work. Some had never been signed at all and had been honoured anyway, on the strength of a handshake and a dinner. The cabinet's audit office began to count them and discovered that nobody knew how many there were.\n\nThe movements that had wanted to replace the cabinet watched the audit closely. The Chartered Board movement found its own members' contracts on the list and argued for discretion. The freight unions found clauses that allowed contractors to cut safety inspections in a hurry and demanded that they be printed first. The League read every foreign clause aloud at its rallies, and the crowds grew.\n\nThe cabinet has made a promise it cannot quickly keep. If it keeps it slowly and honestly, Amber may come to trust a government it never chose.\n\nProvisional gameplay: no official source covers Amber; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.21.a:0 "Publish the foreign clauses first."
 ac_ud_up.21.b:0 "Publish in order of value, largest contracts first."
 ac_ud_up.22.t:0 "A Register of Usean Contracts"
 ac_ud_up.22.d:0 "Amber's firms hold contracts in half the capitals of Usea. They build roads in one country, run freight in another and maintain rolling stock for a third. Until 1991 nobody in Amber's government had tried to list them all. The register, when the trade ministry began compiling it, turned out to be the most important document the country had ever produced, because it showed what Amber had promised abroad and therefore what it could still promise at home.\n\nThe first draft listed three hundred contracts. The second draft, after the ministry asked the firms directly, listed eleven hundred. Many committed Amber's freight capacity to foreign clients for years ahead. Some committed it in an emergency, on terms that nobody in the cabinet had read. A few committed the same wagons to different clients on the same dates, and the firms involved explained that the clients would never all need them at once.\n\nThe register raised two questions. The first was practical: how much freight could Amber move for itself, once its foreign obligations were met? The second was political: who had authorised these obligations, and on whose behalf? The freight yards survey would answer the first. The treaty office would begin to answer the second, by reading every treaty Amber had signed and marking every clause that put its trains at someone else's disposal.\n\nA country that sells its capacity must know how much it has sold. Amber is about to find out.\n\nProvisional gameplay: no official source covers Amber; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.22.a:0 "Require every firm to register its foreign contracts."
 ac_ud_up.22.b:0 "Ask the firms to register voluntarily."
 ac_ud_up.23.t:0 "Contracts after the Warning"
 ac_ud_up.23.d:0 "When Central Usea announced on the twentieth of April 1996 that the asteroid Ulysses would strike the Earth, Amber's freight offices received their first telephone calls before the cabinet had met. Foreign clients wanted guarantees. If the fragments came, would their contracted wagons still run? Would Amber honour its emergency clauses, or would it keep its trains at home? The clerks who answered the telephones did not know, and said so.\n\nThe yards at home asked the opposite question. If Amber's trains were needed for relief, whose relief would come first: the foreign clients who had paid in advance, or the Amber districts that had paid nothing but would need the trains most? The register of Usean contracts suddenly mattered more than any document in the country, because it showed exactly how much of Amber's freight had already been promised to someone else's emergency.\n\nInternational relief was being discussed in every capital. A consortium was forming to coordinate the response, and Amber was invited to join as its freight and contracting house. Membership would give Amber a voice in where relief went. It would also bind Amber's trains to the consortium's priorities, which might not be Amber's own. The alternative was to remain an independent contractor, selling freight to whoever needed it on Amber's terms.\n\nThe asteroid has turned every freight contract into an emergency contract. Amber must decide whose emergency it will serve first.\n\nOfficial: ACES Chronicle, 1996 / 04.20; Amber's response is provisional gameplay."
 ac_ud_up.23.a:0 "Honour every foreign emergency clause as written."
 ac_ud_up.23.b:0 "Suspend foreign emergency clauses pending review."
 ac_ud_up.24.t:0 "Contracts in the Coup Summer"
 ac_ud_up.24.d:0 "On the thirtieth of May 1997 a coup broke out across Usea, and by the next morning Amber's lawyers were working through the night. Contracts signed with governments that had been overthrown overnight were suddenly contracts with nobody. Payments due from ministries that no longer existed were suddenly debts without a debtor. One freight consignment was halfway across a border when the government at its destination changed twice.\n\nUnified Command defeated the coup, and within weeks most of the governments that had fallen were restored. The contracts were not so easily restored. Some coup governments had signed new orders in their few days of power, and the restored governments refused to honour them. Some of Amber's firms had accepted payment from the coup governments and now faced claims from their successors. The register of Usean contracts, so carefully compiled, had developed a new column: valid, disputed, void.\n\nThrough it all the trains kept running. Amber's freight crews had learned long ago that a train in motion is easier to protect than a train in a siding, and they kept moving consignments whose destinations were uncertain until someone told them otherwise. Nobody did, and most of the consignments arrived. The crews were thanked in the cabinet's statement, in the last paragraph.\n\nThe coup has taught Amber that a contract is only as stable as the government that signed it. The question is what Amber does with the lesson.\n\nOfficial: ACES Chronicle, 1997 / 05.30; Amber's contracts are provisional gameplay."
 ac_ud_up.24.a:0 "Honour only contracts signed by governments now in power."
 ac_ud_up.24.b:0 "Honour every contract the crews delivered, and settle the claims later."
 ac_ud_up.25.t:0 "Every Government Wants the Same Trains"
 ac_ud_up.25.d:0 "On the eighth of July 1999 Ulysses broke apart over the Earth, and the fragments fell across Usea. Amber's yards worked through the night under orders written years before. The relief rail plan had named the trains that would run, and most of them ran, crewed by people who had rehearsed the timetable for three years and hoped never to use it.\n\nBy noon the telephones were ringing in every freight office. The consortium wanted trains wherever its relief plans pointed. Foreign clients wanted their contracted wagons. Amber's own districts, crowded with people who had fled from elsewhere, wanted everything. The relief plan had assumed that Amber would decide how its capacity was used. Within hours it was clear that every government in Usea was asking for the same trains at the same time, and that Amber had fewer trains than it had promised.\n\nThe capacity board met in the basement of the transport ministry. It could open the yards to everyone, moving relief in the order requests arrived and accepting that Amber's own districts would wait their turn. Or it could ration capacity by a published formula: domestic need first, contracts second, appeals third. The first would make Amber the hero of the relief effort; the second would make it the protector of its own people.\n\nThe trains are waiting at the yards. Whichever answer the board gives, some of the people asking will be refused.\n\nOfficial: ACES Chronicle, 1999 / 07.08; Amber's relief is provisional gameplay."
 ac_ud_up.25.a:0 "Run the relief plan exactly as written."
 ac_ud_up.25.b:0 "Send the medical freight first, wherever it is needed."
 ac_ud_up.26.t:0 "Refugees on the Freight Lines"
 ac_ud_up.26.d:0 "On the twenty-first of April 2000 Erusea closed its border to refugees, and many of the displaced of the fragment year turned toward Amber instead. They rode Amber's freight trains: on wagon roofs, in empty boxcars, on the couplings between cars. The freight crews did not stop them. Many of the crews had carried refugees before, unofficially, on the relief trains of the fragment year.\n\nThe yards became the first place the refugees stopped. Families camped in sidings, in warehouses and in the shelters built for the impact. They washed at the yard taps, cooked on the yard braziers and asked the yard foremen for work. Some of the foremen hired them, because the yards were short of labour after the fragments, and the refugees worked hard for very little.\n\nThe unions objected. A refugee who worked for half wages undercut every member of the compact or the old agreements, and the freight workers had fought too long for their wages to watch them fall. The contractors welcomed the labour and asked the government to regularise it. The League, where it had influence, demanded that the refugees be sent onward in sealed trains, fed, treated and gone.\n\nThe government must decide whether the refugees on the freight lines are workers, guests or passengers. The yards cannot hold them for long without an answer.\n\nOfficial: ACES Chronicle, 2000 / 04.21; Amber's refugee policy is provisional gameplay."
 ac_ud_up.26.a:0 "Let the yards hire refugees at the agreed wage."
 ac_ud_up.26.b:0 "Keep the refugees out of the yards until a policy is set."
 ac_ud_up.27.t:0 "War Comes to the Yards"
 ac_ud_up.27.d:0 "In the summer of 2003 Erusea invaded San Salvacion and seized Stonehenge, and the war reached every partner of Central Usea. In Amber it arrived as a telephone call from the transport ministry to every yard foreman in the country: dim the lights, hood the signals, prepare the shelters. The yards that had moved relief for four years were now targets, because the coalition would need them to move everything else.\n\nThe first raids came within weeks. They were small and inaccurate, and they taught Amber what the next raids would be like. A junction burned for two days. A train of empty wagons was destroyed in a siding. The crews learned to shunt in the dark, to repair track by night and to sleep in the shelters at the junctions. Accidents rose for a month and then fell, as people learned how to work in a war.\n\nThe cabinet had to decide what Amber's freight was for. The coalition wanted trains; Amber's towns wanted food. The development programme could be converted to war production under contract, with profits capped and deliveries guaranteed. Or a protected share of freight and industry could be kept for civilian life, giving the coalition less and keeping Amber's towns fed and calm.\n\nThe war has come to the yards. Amber's crews have kept the trains running through the fragments, and they intend to keep them running through this.\n\nOfficial: ACES Chronicle, 2003 / SUMMER (Erusea invades San Salvacion); Amber's wartime exposure is provisional gameplay."
 ac_ud_up.27.a:0 "Put the yards on a war footing tonight."
 ac_ud_up.27.b:0 "Keep the civilian timetable running as long as possible."
 ac_ud_up.28.t:0 "The Yards after the War"
 ac_ud_up.28.d:0 "The crisis years are over. The warning, the fragments, the refugees and, for most of Usea, the war: Amber has carried all of them on its freight lines, and its yards show it. Some are patched, some are improvised and a few are ruins, and all of them are working. Crews who learned to repair track by night now repair it by day, and the shelters at the junctions are being turned into storerooms.\n\nThe question now is what to rebuild. The old yards could be rebuilt to the old plans by the old firms, quickly and familiarly, leaving every old bottleneck where it was. Or the yards could be rebuilt as a hub for the continent's reconstruction: larger, more open and designed to carry the freight that would rebuild Usea's cities. The first would serve Amber. The second would serve everyone, and would make Amber indispensable, which is not the same thing as loved.\n\nThe contractors, the freight unions and whatever remains of the League each have their own answer. The contractors want the work, and the larger the better. The unions want the jobs, and the safety code that protects them. The League's survivors want to know who will own the new yards and whose clauses will govern them.\n\nAmber has always been a country of bargains. The bargain it strikes now will shape its next generation.\n\nProvisional gameplay: no official source covers Amber; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.28.a:0 "Ask the regions what they need rebuilt first."
 ac_ud_up.28.b:0 "Ask the contractors what they can build fastest."
 ac_ud_up.29.t:0 "The Reserve Question"
 ac_ud_up.29.d:0 "Ugellas does not keep its reserve in one place. It keeps it everywhere: in depots behind town halls, in tunnels under farms, in warehouses whose custodians are schoolteachers and grocers and retired sergeants. The habit is older than anyone can explain. It has made the country hard to surprise and impossible to summarise, and it has given the reserve officers who manage the depots a knowledge of the republic that no ministry can match.\n\nIn 1991 the reserve officers began to ask questions about the government. A circle of them, meeting in the evenings in a depot office, argued that a dispersed country needed a government that thought like a dispersed army: decentralised, disciplined, always ready to move, with every office holding a deputy somewhere else. They wrote their argument down and circulated it, and it was read in more depots than the government had expected.\n\nThe towns that hosted the depots had questions of their own. They had housed the reserve for decades, at a fee nobody had revised, and they wanted the reserve's money spent locally and its officers answerable locally. They formed a league, and the league asked for a federal parliament in which every town would have a seat and the capital would coordinate rather than command.\n\nThe national administration had kept the depots stocked and the borders quiet. It intended to continue, and it asked the reserve officers and the towns to be patient. Patience, in Ugellas, has always been a reserve too.\n\nProvisional gameplay: no official source covers Ugellas; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.29.a:0 "Invite the circle and the league to a public inquiry."
 ac_ud_up.29.b:0 "Remind the reserve officers whom they serve."
 ac_ud_up.30.t:0 "The Council Disperses the State"
 ac_ud_up.30.d:0 "The Reserve Council took office without a parade. Its members arrived at the old ministries in plain cars, signed the transfer documents and left the same afternoon, each to a different town. By the end of the week the Council's first order was in force: every ministry would be dispersed, every office would hold a deputy somewhere else, and every decision would be taken where it would be carried out.\n\nGovernment in Ugellas became something that happened everywhere at once. The ministry of finance moved into a depot on a hillside, the ministry of health into a school, the ministry of the interior into three separate town halls that took turns being its headquarters. Officials commuted between offices that were deliberately far apart. Letters took longer to arrive, decisions took longer to coordinate, and yet the country found itself governed by people who could see what they were governing.\n\nThe towns were divided. Some welcomed the ministries and the salaries that came with them. Others resented officials who arrived with requisition orders and left with the town's best building. The municipal league, which had wanted a federal parliament, found itself governed by a council it had not elected and could not petition, because the Council had no single address.\n\nThe Council does not believe in capitals. It believes that a country that cannot be decapitated cannot be conquered. Whether it can be governed that way is the experiment.\n\nProvisional gameplay: no official source covers Ugellas; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.30.a:0 "Publish the address of every dispersed office."
 ac_ud_up.30.b:0 "Keep the dispersed offices unlisted for security."
 ac_ud_up.31.t:0 "The Towns Hold the Purse"
 ac_ud_up.31.d:0 "The first federal parliament of Ugellas met in the largest depot in the country, because no other building had room for a delegate from every town. They sat on folding chairs between stacked crates of tinned food and blankets, and the chamber's acoustics were terrible. The parliament elected a federal cabinet on the second day and gave it a single instruction: coordinate, do not command.\n\nThe federal charter gave each town a seat, each region a budget and the capital a telephone. The cabinet discovered that the telephone was the most important instrument of government it had. It spent its days calling towns: asking, persuading, reminding, apologising. Decisions that the old administration had taken in an afternoon now took a month, because every town had to agree or at least be seen to have been consulted.\n\nThe reserve officers were not pleased. The depots were now governed by the towns that hosted them, and some towns had ideas about what a depot should hold that did not match the reserve's lists. The circle of reserve officers, which had argued for a Reserve Council, now argued for discipline, and its members found that discipline was hard to impose on a parliament of grocers and schoolteachers.\n\nUgellas has a government that answers to its towns. The towns are learning that answering is not the same as agreeing.\n\nProvisional gameplay: no official source covers Ugellas; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.31.a:0 "Give every town a share of the reserve budget."
 ac_ud_up.31.b:0 "Keep the reserve budget national, under parliamentary audit."
 ac_ud_up.32.t:0 "The Administration Renews Its Lease"
 ac_ud_up.32.d:0 "The national administration of Ugellas renewed its mandate the way it renewed a depot lease. It conducted an inventory, held a review and signed a document. The inventory counted everything the administration governed: depots, roads, towns, people and the custodians who held the keys. The review found that the administration had governed adequately, which was what it had always found. The document was signed by the senior officials of every ministry and published without comment.\n\nNobody voted, and nobody was surprised. The reserve officers who had argued for a Reserve Council read the inventory and found their own depots listed accurately, which was a kind of compliment. The towns that had formed a municipal league read the review and noted that it said nothing about the fees they were paid to host the depots. Their delegates wrote to the administration, and the administration replied that the fees would be reviewed in due course.\n\nThe administration's strength is that it knows its country. Its weakness is that it knows it as an inventory: a list of things to be counted and kept, rather than a set of people with opinions. It has kept Ugellas stocked, quiet and ready for decades. It has never had to persuade anyone of anything.\n\nThe lease has been renewed. Whether the tenants accept it will depend on what the administration does with the next inventory.\n\nProvisional gameplay: no official source covers Ugellas; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.32.a:0 "Publish the depot leases and their fees."
 ac_ud_up.32.b:0 "Review the fees quietly, town by town."
 ac_ud_up.33.t:0 "Depots No Map Shows"
 ac_ud_up.33.d:0 "The census of the depots began with the official list, which named four hundred sites. It ended eighteen months later with a list of eleven hundred. The census teams found depots in barns, in churches, in a disused railway tunnel and in the cellar of a hotel whose owner had been paid a storage fee for thirty years without ever being told what was in it. Most of the depots held something useful. Some held things nobody could identify.\n\nEvery depot was assigned a custodian and a deputy who lived somewhere else. A depot without a custodian, the census report concluded, was a rumour, not a reserve. Custodians were schoolteachers, farmers, shopkeepers and retired soldiers; they were paid a modest fee, given a key and a list, and told to check the list against the contents twice a year. Many of them had been doing this informally for decades and were pleased to be asked officially.\n\nThe census also raised a question about neighbours. Several neighbouring governments had heard about Ugellas's depots and asked whether they could store their own emergency stocks in them. Storage was cheap to offer and expensive to honour: a depot holding a neighbour's grain could not hold Ugellas's own, and a custodian holding a neighbour's key might one day have to choose whom to open the door for.\n\nUgellas now knows what it has. It must decide whom it will share it with.\n\nProvisional gameplay: no official source covers Ugellas; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.33.a:0 "Offer neighbours storage on published terms."
 ac_ud_up.33.b:0 "Keep the census confidential."
 ac_ud_up.34.t:0 "Can We Store People?"
 ac_ud_up.34.d:0 "When Central Usea announced on the twentieth of April 1996 that the asteroid Ulysses would strike the Earth, Ugellas's custodians received a circular from the national reserve office. It asked them to inventory their depots again, this time with a new column: could the depot hold people? A cellar that stored grain might shelter a family. A tunnel that stored fuel might shelter a village, if the fuel were moved somewhere else.\n\nThe neighbours who stored grain in Ugellas's depots telephoned the same week. Their governments had read the same announcement and done the same arithmetic. If the fragments came, where would their people shelter? Ugellas had more underground space than most countries its size, and its neighbours wanted to know whether a storage agreement for grain could become a storage agreement for people. Nobody had ever drafted such an agreement, and the lawyers were not sure it was possible.\n\nThe government faced a choice it had avoided for years. It could sign a Usean reserve pact, sharing its depots, its inventories and its obligation to open them with its neighbours. Its reserve would become a regional reserve, and its custodians might one day open the door to people who were not Ugellan. Or it could keep a national reserve only, selling neighbours what they needed but pledging the depots to nobody else's emergency.\n\nThe asteroid will not fall on borders. Ugellas must decide whether its depots will.\n\nOfficial: ACES Chronicle, 1996 / 04.20; Ugellas's preparations are provisional gameplay."
 ac_ud_up.34.a:0 "Inventory every depot for shelter space."
 ac_ud_up.34.b:0 "Inventory only the depots near the towns."
 ac_ud_up.35.t:0 "Who Holds the Keys?"
 ac_ud_up.35.d:0 "On the thirtieth of May 1997 a coup broke out across Usea. In Ugellas it arrived as a question at the gate of a depot. Shortly after midnight a lorry pulled up outside a depot in the interior, and an officer with a rifle and an order the custodian did not recognise demanded the keys. The custodian, a retired schoolteacher, telephoned the deputy, who telephoned the reserve office, which telephoned the ministry, which did not answer.\n\nThe custodian refused. The custodian told the officer that the depot would open for the person named on the list and for nobody else, and that the officer was welcome to wait until morning, when the reserve office could confirm the order. The officer waited. By morning the coup in Ugellas had collapsed, the officer had been recalled, and the custodian had become the most famous schoolteacher in the country.\n\nUnified Command defeated the coup across Usea within days. In Ugellas the coup had never really begun, because nobody could find the keys. Officers who had joined it discovered that the depots they meant to seize were held by thousands of custodians who answered to lists rather than orders, and that a dispersed reserve could not be taken by a single telephone call.\n\nThe coup has shown Ugellas what its depots are worth. It has also shown that the keys are held by civilians, and the government must decide whether that is a weakness or a strength.\n\nOfficial: ACES Chronicle, 1997 / 05.30; events in Ugellas are provisional gameplay."
 ac_ud_up.35.a:0 "Honour the custodians and keep the keys with them."
 ac_ud_up.35.b:0 "Put every depot under a reserve officer's seal."
 ac_ud_up.36.t:0 "A Battery in Someone Else's Desert"
 ac_ud_up.36.d:0 "On the nineteenth of June 1998 Stonehenge was completed in San Salvacion's desert. Eight railguns now stood ready to destroy the fragments of Ulysses before they reached the ground, and in Ugellas's cabinet room a minister asked the question several colleagues had been thinking. If the battery could stop the fragments, why was Ugellas spending so much on depots, shelters and custodians?\n\nThe custodians answered before the cabinet did. Their association published a letter in every newspaper, signed by more than a thousand of them. A battery, they wrote, could shoot at a fragment; it could not promise to hit every one. A battery in someone else's desert would protect someone else's country first. And a battery could not feed a family whose water works had been destroyed, house a village whose roofs had fallen in, or carry the injured to a hospital. The depots could.\n\nThe reserve office added its own arithmetic. The battery would reduce the risk; it would not remove it. The depots cost a fraction of what a single railgun had cost, and they would be needed after the fragments fell whatever the battery achieved. Cutting them now would save money for a year and leave Ugellas exposed for a generation.\n\nThe battery in the desert has changed the calculation. Ugellas must decide whether it has changed the answer.\n\nOfficial: ACES Chronicle, 1998 / 06.19 (Stonehenge completed); Ugellas's reserve policy is provisional gameplay."
 ac_ud_up.36.a:0 "Keep every depot and every custodian."
 ac_ud_up.36.b:0 "Close the smallest depots and fund the rest better."
 ac_ud_up.37.t:0 "The Dispersal Night"
 ac_ud_up.37.d:0 "On the eighth of July 1999 Ulysses broke apart over the Earth. In Ugellas the sirens sounded an hour before the first fragments were visible, and families across the country walked to their assigned depots by torchlight. Each family had a card naming its depot; each depot had a list naming its families. The custodians stood at the gates with their lists and their torches and checked names as people came in.\n\nMost of the lists were true. Families arrived at depots that had room for them, with blankets and water and a custodian who knew where everything was. Some lists were not: a depot built for forty held ninety, a tunnel listed as dry had flooded in the spring, a custodian had died and the deputy had moved away. The mobility columns spent the night carrying families from depots that were too full to depots that were not.\n\nBy morning the custodians knew what their own gates had seen and little else; the radio carried reports from across Usea, few of them confirmed. In the morning the custodians opened the depots and began to distribute what was in them. The question of how much to distribute was not on any list. The reserve was large, but it was not endless, and nobody knew whether this was the only crisis or the first.\n\nThe night is over. The depots are open. Ugellas must decide how much of its reserve to spend now, and how much to keep.\n\nOfficial: ACES Chronicle, 1999 / 07.08; Ugellas's relief is provisional gameplay."
 ac_ud_up.37.a:0 "Move families from the full depots first."
 ac_ud_up.37.b:0 "Keep every family where its card says."
 ac_ud_up.38.t:0 "Refugees at the Depots"
 ac_ud_up.38.d:0 "On the twenty-first of April 2000 Erusea closed its border to refugees, and some of those turned back found their way to Ugellas. They came to the depots, because the depots were where the food was and because the stories of the dispersal night had travelled. Custodians found families camped outside their gates, asking for bread, blankets and a place to sleep.\n\nThe custodians had lists, and the refugees were not on them. Some custodians opened the gates anyway, because the depots held food and the families outside were hungry. Others telephoned the reserve office and asked what to do, and the reserve office telephoned the ministry, which convened a committee. By the time the committee met, several depots had become camps, and several camps were becoming villages.\n\nThe government considered two answers. It could let the refugees settle around the depots, building villages where there had been only warehouses, and accept that Ugellas would grow by the size of a town. Or it could feed and treat the refugees and carry them onward in the mobility columns to wherever they were expected, keeping Ugellas a road rather than a destination.\n\nThe custodians are waiting for instructions. In the meantime they are doing what custodians always do: counting, feeding and keeping the gates.\n\nOfficial: ACES Chronicle, 2000 / 04.21; Ugellas's refugee policy is provisional gameplay."
 ac_ud_up.38.a:0 "Let the custodians decide at their own gates."
 ac_ud_up.38.b:0 "Send the reserve office to every depot with refugees."
 ac_ud_up.39.t:0 "The Reserves Are Called"
 ac_ud_up.39.d:0 "In the summer of 2003 Erusea invaded San Salvacion and seized Stonehenge, and Central Usea's partners found themselves at war. In Ugellas the mobilisation notices went out by post and by radio. Reservists were to report to their depots, the same depots they had guarded, stocked and inventoried for a decade. Many of them reported within the day, still wearing the clothes they had been working in.\n\nThe depots that had held grain and blankets for the fragment years now held shells and fuel for the war. Coalition forces moving to the front asked to use them, and the custodians who had stored relief for their neighbours now stored munitions for the coalition. The command posts were dispersed across the country, so that no single raid could silence them. Orders arrived late, but they arrived.\n\nUgellas had prepared for a crisis, not for a war, and the difference was painful. The depots were scattered and small; the army needed large, concentrated stocks close to the front. The mobility columns knew the roads; they did not know how to move under air attack. The government had to decide whether to defend the depots where they stood, keeping the reserve at home, or to empty them forward to the coalition's front.\n\nThe reserve has been called. Ugellas must decide where its reserve will fight.\n\nOfficial: ACES Chronicle, 2003 / SUMMER (Erusea invades San Salvacion); Ugellas's wartime exposure is provisional gameplay."
 ac_ud_up.39.a:0 "Call every reservist at once."
 ac_ud_up.39.b:0 "Call the reservists by depot, in order."
 ac_ud_up.40.t:0 "The Depots after the War"
 ac_ud_up.40.d:0 "The crisis years are over. The warning, the fragments, the refugees and, for most of Usea, the war: Ugellas has met each of them from its depots, and its depots show the cost. Some are empty, their stocks spent on the dispersal night or sent forward to the coalition. Some are damaged, their tunnels cracked and their roofs fallen. Some are full of things nobody needs any more: munitions for a war that has ended, blankets for refugees who have gone home.\n\nThe country must now decide what a reserve is for in peacetime. The reserve officers want the depots restocked for the next war or the next crisis, and they point out that every crisis Ugellas has faced arrived without notice. The towns want the depots handed over for schools, clinics and workshops, and they point out that the depots were paid for by their taxes and housed in their buildings for decades.\n\nThe custodians, as always, want to know what will be on their lists. Many of them have held their keys for twenty years. They have opened their gates for families, refugees and soldiers, and they have closed them against officers with rifles. They would like to know whether they are still needed.\n\nUgellas survived the crisis years by being everywhere at once. It must now decide whether to stay that way.\n\nProvisional gameplay: no official source covers Ugellas; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.40.a:0 "Ask the custodians what their depots should become."
 ac_ud_up.40.b:0 "Ask the reserve office what the next crisis will need."
 ac_ud_up.41.t:0 "Who Inspects the Government?"
 ac_ud_up.41.d:0 "Delarus is a country of inspectors. It inspects its accounts, its requisitions, its contracts and its promises; it inspects its shelters, its stores and its roads; it keeps dockets on everything the state has undertaken and closes them only when the work is done. Its inspectors are proud, poorly paid and very hard to bribe. In 1991 a group of them asked a question that had never been asked in public: who inspects the government itself?\n\nThe senior inspectors had an answer ready. The government should be answerable to the same rules it enforced: published accounts, an independent audit office and an elected chamber to read the audits. They wrote an Inspectors' Charter and read it aloud at their own congress, to applause that surprised even them. The charter was not radical by the standards of other countries. In Delarus, where the government had always inspected others and never been inspected, it was a revolution on paper.\n\nThe senior commanders had a different answer. Inspection, they argued, had become obstruction. Every requisition was delayed by a docket, every order by an audit, every plan by an inquiry. A small country surrounded by larger ones could not afford to govern by committee. They proposed a Command Council that would govern by order and inspect afterwards, if at all.\n\nThe present government had balanced the inspectors against the commanders for years, and it intended to go on doing so. Both sides were now asking it to stop balancing and choose.\n\nProvisional gameplay: no official source covers Delarus; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.41.a:0 "Let the inspectors and commanders debate in public."
 ac_ud_up.41.b:0 "Settle the question inside the government."
 ac_ud_up.42.t:0 "The Audit Office Audits Its Makers"
 ac_ud_up.42.d:0 "The Inspectorate Cabinet took office under the Inspectors' Charter and called elections for a chamber within six months. Its first act was to make the audit office independent: the office's director could no longer be dismissed by any minister, its budget was fixed by law, and its reports would be published in full. Its second act was to ask the audit office to audit the cabinet.\n\nThe audit was published a year later, and it was thorough. It found that the old government had kept accounts nobody could reconcile, that the commanders had signed requisitions nobody had approved, and that the Inspectorate's own movement had accepted donations it had not declared. Three ministers resigned within the week. One of them had been a senior inspector and a signatory of the charter.\n\nDelarus discovered that it had a government that could be embarrassed, and that liked it. The newspapers printed the audits in full, and people read them on the trams. The commanders complained that every plan now took a year to approve, and they were partly right: planning was slower, and the army's officers spent more time with auditors than with their units. Yet the requisitions that were approved were delivered, and nobody profited from them without being caught.\n\nThe audit office now audits the cabinet that created it. The question is whether the habit will survive the first crisis that demands speed instead of accounts.\n\nProvisional gameplay: no official source covers Delarus; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.42.a:0 "Publish every audit, including the embarrassing ones."
 ac_ud_up.42.b:0 "Give the commanders a faster audit for urgent requisitions."
 ac_ud_up.43.t:0 "Orders without Appeal"
 ac_ud_up.43.d:0 "The Command Council took office on a weekday morning and suspended the old inspection regime by noon. Audit offices were placed under the Council's directorates. Dockets were closed, whether the work they recorded was finished or not. Inspectors were reassigned to the directorates as clerks, and many of them resigned rather than serve. The Council published its standing orders the next day: numbered, clear and binding, with no procedure for appeal.\n\nOrders were faster now. A requisition that had taken a month to approve took an afternoon. A road that had waited three years for an inquiry was begun within a week. The army's officers, freed from the auditors, spent their time with their units, and the army improved. The Council's supporters pointed to all of this and asked whether the old inspections had ever achieved as much.\n\nThe Council's critics pointed to what could no longer be seen. Nobody outside the Council read its orders before they were carried out, and nobody inside it was required to explain them afterwards. The directorates spent money without publishing accounts. Contracts went to firms whose owners had served under the Council's members. The newspapers that reported this were warned, then closed.\n\nDelarus has a government that can act quickly. It no longer has a government that can be inspected, and the inspectors, many of them now unemployed, are keeping their own dockets.\n\nProvisional gameplay: no official source covers Delarus; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.43.a:0 "Allow the old inspectors to keep their own dockets."
 ac_ud_up.43.b:0 "Requisition the inspectors' private records."
 ac_ud_up.44.t:0 "Inspected and Commanding"
 ac_ud_up.44.d:0 "The present government renewed its mandate without new powers and without renouncing any. It promised to be inspected and to command, and to say in each case which it was doing. The promise was written into a short statement and read in the chamber of the old council of state, which had no legislative power but a good public gallery. The gallery was full of inspectors and commanders, and both groups listened for the clause that favoured them.\n\nThere was no such clause. The government's statement divided its business into two columns. Matters of command, including defence, emergency requisitions and the army's internal organisation, would be decided by order and reviewed afterwards. Matters of inspection, including public accounts, contracts and relief, would be decided only after audit. Every new matter would be assigned to a column by the cabinet, and the assignment would be published.\n\nBoth sides found reasons to object. The inspectors noted that the cabinet decided which column a matter belonged to, and that it could move anything it liked into the column of command. The commanders noted that relief had been placed among the matters of inspection, and that the next crisis would be a relief crisis. Neither side, however, could claim to have lost, and that was the government's intention.\n\nDelarus is governed by a balance. A balance is only as stable as the hand that holds it, and the hand belongs to the present government.\n\nProvisional gameplay: no official source covers Delarus; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.44.a:0 "Open the government's dockets to the public after a year."
 ac_ud_up.44.b:0 "Keep the dockets closed and publish summaries."
 ac_ud_up.45.t:0 "A Register of Foreign Obligations"
 ac_ud_up.45.d:0 "Delarus had signed more treaties, guarantees and relief pledges than anyone in its foreign ministry could list from memory. Some had been signed by governments that no longer existed; some promised things Delarus no longer had; a few contradicted each other. In 1991 the foreign ministry asked its docket clerks to compile a register of every obligation Delarus had undertaken abroad and of the official who was answerable for each.\n\nThe docket clerks were trained to read treaties the way inspectors read accounts: slowly, precisely and with a strong suspicion that something was missing. They found obligations in treaties, in exchanges of letters, in the minutes of conferences and in the private correspondence of former ministers. They found a guarantee to a neighbour that nobody had remembered for twenty years and a relief pledge that had been honoured twice by different ministries.\n\nThe register gave Delarus an idea. If its clerks could read treaties so carefully, perhaps they could read other countries' treaties too. A small country could make itself indispensable by verifying the obligations of larger ones: checking that pledges were kept, that relief reached the people it was meant for, that guarantees were honoured. It would make Delarus useful to everyone, and suspected by some.\n\nDelarus now knows what it has promised. It must decide whether to offer its inspectors to the rest of Usea.\n\nProvisional gameplay: no official source covers Delarus; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.45.a:0 "Offer Delarus's inspectors to verify other countries' treaties."
 ac_ud_up.45.b:0 "Keep the inspectors at home and finish the register first."
 ac_ud_up.46.t:0 "A Docket for Every Pledge"
 ac_ud_up.46.d:0 "When Central Usea announced on the twentieth of April 1996 that the asteroid Ulysses would strike the Earth, the pledges began within days. Governments pledged money, shelters, trains and grain; firms pledged equipment; international bodies pledged coordination. Delarus opened a docket for every pledge it heard of, recording who had promised what, to whom and by when, and then waited to see which pledges would be kept.\n\nThe docket clerks worked through the spring and summer. By autumn the dockets filled a room. Some pledges were already being honoured: shelters were being built, grain was being stored, trains were being reserved. Some had been quietly withdrawn. Many had simply never been mentioned again, and nobody had been asked to account for them. The clerks marked these with a single word: pending.\n\nThe dockets raised a question Delarus could not answer alone. The relief accounts of the Usean governments would be the largest sums of money spent on any single purpose in the continent's history. If nobody inspected them, some of the money would vanish. Delarus could offer to audit them, sending its inspectors to follow the money and say where it went. Or it could inspect only its own relief and leave foreign accounts to foreign governments.\n\nEvery pledge now has a docket. Somebody must decide who reads them.\n\nOfficial: ACES Chronicle, 1996 / 04.20; Delarus's dockets are provisional gameplay."
 ac_ud_up.46.a:0 "Publish the docket of pledges, kept and pending."
 ac_ud_up.46.b:0 "Send the pledges' dockets privately to each government."
 ac_ud_up.47.t:0 "Orders Signed the Night Before"
 ac_ud_up.47.d:0 "On the thirtieth of May 1997 a coup broke out across Usea. In Delarus it lasted less than a day. A group of officers seized a barracks and a broadcasting station, issued a proclamation and a series of orders, and were arrested the next morning when their own units declined to follow them. Unified Command defeated the coup across the continent within days. In Delarus the coup was over before most people had heard of it.\n\nIt left dockets everywhere. The officers had signed orders during their few hours of power: requisitions, transfers, appointments and one order dissolving the audit office. Some of the orders had been carried out before anyone realised who had signed them. Lorries had been requisitioned, officials had been transferred, money had been moved. The coup was over; its paperwork was not.\n\nThe government had to decide which of the coup's orders still stood. Some of them were harmless, and reversing them would cost more than leaving them in place. Some were clearly illegal. Some fell in between: a requisition that had delivered supplies to a town that needed them, an appointment of an official who had turned out to be competent. The inspectors wanted every order reviewed; the commanders wanted the matter closed.\n\nDelarus has always believed that a signature creates an obligation. It must now decide what a signature means when the signer had no right to sign.\n\nOfficial: ACES Chronicle, 1997 / 05.30; events in Delarus are provisional gameplay."
 ac_ud_up.47.a:0 "Void every order signed during the coup."
 ac_ud_up.47.b:0 "Review each order and keep those that served the public."
 ac_ud_up.48.t:0 "The Battery's Civilian Accounts"
 ac_ud_up.48.d:0 "On the nineteenth of June 1998 Stonehenge was completed in San Salvacion's desert. The battery was an international project led by Central Usea, and its member governments had paid for it. Within a month several of them asked Delarus whether its inspectors could read the project's civilian accounts: the roads, the water, the housing and the services provided to the host district. The military accounts would remain secret. The civilian accounts, the members argued, should be verified by someone who had not written them.\n\nDelarus's inspectors were flattered and cautious. A battery in someone else's desert, operated by someone else's crews, was not a matter for Delarus. The civilian accounts, however, were exactly the kind of thing Delarus was good at: roads that had been paid for and not built, water works that had been built and not paid for, housing allocated to people who did not exist. The inspectors suspected that all three would be found.\n\nThe commanders in Delarus's own government had a different worry. If Delarus's inspectors read the battery's accounts, Delarus would be seen as part of the project. If the project became a target, so might its inspectors. Neutrality was not Delarus's tradition, but caution was.\n\nThe members are waiting for an answer. Delarus must decide whether its inspectors will travel to the desert.\n\nOfficial: ACES Chronicle, 1998 / 06.19, and Super Weapons, Stonehenge (an FCU-led international project); Delarus's verification role is provisional gameplay."
 ac_ud_up.48.a:0 "Send the inspectors to read the civilian accounts."
 ac_ud_up.48.b:0 "Read the accounts in Delarus, from copies."
 ac_ud_up.49.t:0 "The Checklists Meet the Night"
 ac_ud_up.49.d:0 "On the eighth of July 1999 Ulysses broke apart over the Earth. In Delarus every relief docket was opened at once. Shelters that had been inspected with a tape measure and a torch filled with families; stores that had been counted against their dockets were opened and issued; relief convoys that had been listed for inspection left their depots and took to the roads.\n\nThe inspectors discovered which of their checklists were real. Most were. The shelters held, the stores were full and the convoys knew their routes. Some were not. A shelter that had passed inspection had been repaired with the wrong materials; a store that matched its docket had been filled with the wrong supplies; a convoy listed as ready had no fuel. The gap between the docket and the reality, which the inspectors had published every year, was suddenly a matter of life and death.\n\nThe government had to decide how relief would be run in the weeks ahead. Relief officers could be given emergency warrants to requisition what they needed and account for it later, making relief faster and accounts slower. Or every relief issue could be docketed and inspected even now, making relief slower and every sack traceable. The inspectors argued that a crisis was exactly when theft was easiest. The relief officers argued that a crisis was exactly when speed mattered most.\n\nThe fragments have fallen. Delarus must decide whether to trust its checklists or its officers.\n\nOfficial: ACES Chronicle, 1999 / 07.08; Delarus's relief is provisional gameplay."
 ac_ud_up.49.a:0 "Send the inspectors with the convoys."
 ac_ud_up.49.b:0 "Send the convoys first, and the inspectors after."
 ac_ud_up.50.t:0 "Stay or Move On?"
 ac_ud_up.50.d:0 "On the twenty-first of April 2000 Erusea closed its border to refugees, and some of those turned back reached Delarus. They were docketed at the border, as everyone in Delarus was docketed: name, origin, family, health, skills and destination. The dockets were thorough, and they all ended with the same blank line. Under the heading destination, the clerks wrote nothing, because nobody had told them what to write.\n\nThe docket clerks pressed the question. A docket with a blank line could not be closed, and Delarus did not leave dockets open. Was the refugee to stay or to move on? If to stay, where, and doing what? If to move on, to where, and who would receive them? The interior ministry referred the question to the cabinet, and the cabinet referred it to a committee, and the dockets piled up in the border offices.\n\nTwo answers were proposed. Refugees could be allowed to settle in Delarus once they were registered, housed and assigned work, creating the most complete refugee register in Usea and a population that would change the country. Or they could cross Delarus under inspection, with food and care, but not stay, their dockets travelling with them to whatever country would take them.\n\nThe clerks are waiting to fill in the blank line. So are the people the dockets describe.\n\nOfficial: ACES Chronicle, 2000 / 04.21; Delarus's refugee policy is provisional gameplay."
 ac_ud_up.50.a:0 "Fill in the line case by case, as the dockets require."
 ac_ud_up.50.b:0 "Write a single destination for everyone until the policy is set."
 ac_ud_up.51.t:0 "The Page Marked War"
 ac_ud_up.51.d:0 "In the summer of 2003 Erusea invaded San Salvacion and seized Stonehenge, and Central Usea's partners found themselves at war. In Delarus the foreign ministry opened its obligations ledger at the page marked war and found it longer than expected. Over the years Delarus had promised the coalition supplies, transit, liaison officers and inspectors, in treaties, letters and conference minutes. Some of the promises had been made by governments that no longer existed, but they were still in the ledger.\n\nThe government had to decide which promises it would keep. The commanders wanted all of them honoured at once, by order. The inspectors wanted each one reviewed, docketed and delivered on schedule. The coalition wanted everything immediately and was not interested in the difference. Requisitions began within the week, and so did the disputes: lorries taken from farmers who needed them for the harvest, warehouses taken from firms that had been storing relief.\n\nRequisition tribunals were set up to hear the disputes. They worked quickly, and they gave every owner a receipt that a court would honour. The commanders called them a delay; the inspectors called them the only reason the requisitions were still lawful. Delarus's shelters, inspected for the fragments, were inspected again for the raids, and fewer of them passed.\n\nThe war has its own dockets now. Delarus must decide whether to run its war effort by order or by inspection.\n\nOfficial: ACES Chronicle, 2003 / SUMMER (Erusea invades San Salvacion); Delarus's wartime exposure is provisional gameplay."
 ac_ud_up.51.a:0 "Honour every listed obligation on schedule."
 ac_ud_up.51.b:0 "Review each obligation before delivering it."
 ac_ud_up.52.t:0 "Open or Sealed"
 ac_ud_up.52.d:0 "The crisis years are over. Delarus holds the most complete records of the war in Usea: requisitions, orders, losses, obligations and the dockets of every refugee who crossed its borders. Its inspectors kept them through the fragments, the refugees and the war, copying everything and storing the copies somewhere else. Now the government must decide what to do with them.\n\nSome want the records opened. A commission could hear anyone who claimed to have been wronged: farmers whose lorries were requisitioned, families who lost relatives, refugees whose dockets were closed without their consent. It would take years and make enemies, but it would leave Delarus with an honest account of what it did. The inspectors who kept the records, many of whom worked through the war at great personal risk, want them read.\n\nOthers want the records sealed. The country has been through enough. Opening the records would reopen every quarrel, every grievance and every suspicion, and would set neighbours against each other for a generation. Sealing them for a fixed period would let the country move on, and the records would still be there when the people they describe were no longer alive to be hurt by them.\n\nDelarus has always believed in records. It must now decide whether it believes in reading them.\n\nProvisional gameplay: no official source covers Delarus; its politics, treaty role and policies are authored for this mod."
 ac_ud_up.52.a:0 "Ask the inspectors who kept the records."
 ac_ud_up.52.b:0 "Ask the families the records describe."
