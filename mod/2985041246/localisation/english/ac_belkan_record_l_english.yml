l_english:
 ac_bwr.1.t:0 "Osea Orders the Kestrel"
 ac_bwr.1.d:0 "The Osean Maritime Defense Force has ordered the Kestrel, the seventh Hubert-class aircraft carrier (ACES Chronicle, 1991 / 07.29).\n\nThe record gives the order and the class; this campaign builds no ship from it."
 ac_bwr.1.a:0 "Note the order."
 ac_bwr_kestrel_ordered:0 "Belkan War record: Osea Orders the Kestrel"
 ac_bwr_kestrel_ordered_skipped:0 "Belkan War record: Osea Orders the Kestrel (window passed; not reported)"
 ac_bwr.2.t:0 "Submarines Announced at Cinigrad"
 ac_bwr.2.d:0 "Scinfaxi-class submarines have been announced at a political convention in Cinigrad, Yuktobania, and Osean Foreign Minister Howards has belittled them (ACES Chronicle, 1991 / 09.02).\n\nCinigrad is not on this map, and the class enters this campaign only in 2010."
 ac_bwr.2.a:0 "Note the announcement."
 ac_bwr_cinigrad:0 "Belkan War record: Submarines Announced at Cinigrad"
 ac_bwr_cinigrad_skipped:0 "Belkan War record: Submarines Announced at Cinigrad (window passed; not reported)"
 ac_bwr.3.t:0 "Belkan Borders Redrawn"
 ac_bwr.3.d:0 "The ACES Chronicle records that Belkan borders were redrawn on 16 December 1991 (1991 / 12.16), after Belka sold land to its neighbours.\n\nIn this campaign the land sales themselves moved the states when Belka made them. This brief records the official date and changes no border."
 ac_bwr.3.a:0 "Note the new map."
 ac_bwr_borders_redrawn:0 "Belkan War record: Belkan Borders Redrawn"
 ac_bwr_borders_redrawn_skipped:0 "Belkan War record: Belkan Borders Redrawn (window passed; not reported)"
 ac_bwr.4.t:0 "Assault on Model"
 ac_bwr.4.d:0 "The ACES Chronicle records an assault on Model, a Gebetian border city, on Belka's eastern front (1995 / 03.27).\n\nModel is not on this map. This brief reports the record because Belka and Gebet are actually at war; the archive's own raids are separate events."
 ac_bwr.4.a:0 "Note the eastern front."
 ac_bwr_model:0 "Belkan War record: Assault on Model"
 ac_bwr_model_skipped:0 "Belkan War record: Assault on Model (window passed; not reported)"
 ac_bwr.5.t:0 "Ustio Under Belkan Control"
 ac_bwr.5.d:0 "Nearly all of Ustio has fallen under Belkan control, and Belkan and Ustian air forces have clashed over Monte Rosa (ACES Chronicle, 1995 / 03.30).\n\nMonte Rosa is not on this map. This brief reports the record because Belkan forces actually hold Directus, or Ustio has actually capitulated; no state was moved by script."
 ac_bwr.5.a:0 "Note the occupation."
 ac_bwr_monte_rosa:0 "Belkan War record: Ustio Under Belkan Control"
 ac_bwr_monte_rosa_skipped:0 "Belkan War record: Ustio Under Belkan Control (window passed; not reported)"
 ac_bwr.6.t:0 "Ustio Allies with Osea"
 ac_bwr.6.d:0 "Ustio has allied with Osea and begun its resistance (ACES Chronicle, 1995 / 04.01).\n\nThis brief reports the record because Ustio is actually in a faction with Osea. The record names only Ustio and Osea; the archive's own alliance events stay their owners."
 ac_bwr.6.a:0 "The resistance begins."
 ac_bwr_ustio_allies:0 "Belkan War record: Ustio Allies with Osea"
 ac_bwr_ustio_allies_skipped:0 "Belkan War record: Ustio Allies with Osea (window passed; not reported)"
 ac_bwr.7.t:0 "The Osean Army Resists"
 ac_bwr.7.d:0 "The Osean Army has begun its resistance (ACES Chronicle, 1995 / 04.03).\n\nThis brief reports the record because Osea is actually at war with Belka; how the war reached Osea is the archive's own course."
 ac_bwr.7.a:0 "Note the front."
 ac_bwr_osean_army:0 "Belkan War record: The Osean Army Resists"
 ac_bwr_osean_army_skipped:0 "Belkan War record: The Osean Army Resists (window passed; not reported)"
 ac_bwr.8.t:0 "Offensive Campaign No. 4101"
 ac_bwr.8.d:0 "The Allied Forces have begun Offensive Campaign No. 4101 to drive Belka from Futuro Canal and secure a sea supply line, and the Osean carrier Kestrel has made its test voyage (ACES Chronicle, 1995 / 04.24).\n\nFuturo Canal is map geography here; no operation is scripted."
 ac_bwr.8.a:0 "Note the campaign."
 ac_bwr_futuro_canal:0 "Belkan War record: Offensive Campaign No. 4101"
 ac_bwr_futuro_canal_skipped:0 "Belkan War record: Offensive Campaign No. 4101 (window passed; not reported)"
 ac_bwr.9.t:0 "Directus Liberated"
 ac_bwr.9.d:0 "The Allied Forces have liberated Ustio's capital, Directus (ACES Chronicle, 1995 / 05.13). The Chronicle records that the independent country was restored to its prewar state the next day (1995 / 05.14).\n\nThis brief reports the record because Ustio actually controls Directus again after Belkan occupation. It observes Directus only; no state was moved by script."
 ac_bwr.9.a:0 "Directus is free."
 ac_bwr_directus:0 "Belkan War record: Directus Liberated"
 ac_bwr_directus_skipped:0 "Belkan War record: Directus Liberated (window passed; not reported)"
 ac_bwr.10.t:0 "The Battle of Waldreich"
 ac_bwr.10.d:0 "The ACES Chronicle records the Battle of Waldreich (1995 / 06.05). The Osean Wizard and Sorcerer squadrons left the front, and contact with them was lost.\n\nThe archive's Wacht am Waldreich branch is a different, Belkan mechanic; this brief adds nothing to it."
 ac_bwr.10.a:0 "Note the record."
 ac_bwr_waldreich:0 "Belkan War record: The Battle of Waldreich"
 ac_bwr_waldreich_skipped:0 "Belkan War record: The Battle of Waldreich (window passed; not reported)"
 ac_bwr.11.t:0 "Espada Team Missing"
 ac_bwr.11.d:0 "Espada Team has disappeared from a base of the Kingdom of Sapin (ACES Chronicle, 1995 / 10.18).\n\nThe record gives the disappearance only, and this campaign adds nothing to it."
 ac_bwr.11.a:0 "Note the record."
 ac_bwr_espada:0 "Belkan War record: Espada Team Missing"
 ac_bwr_espada_skipped:0 "Belkan War record: Espada Team Missing (window passed; not reported)"
 ac_bwr.12.t:0 "A New Chief of Staff"
 ac_bwr.12.d:0 "The FCU Army has announced that Commander Robert Tyler, 54, will replace the Riass Armed Forces Chief of Staff, who died on 20 March (ACES Chronicle, 1996 / 04.18).\n\nThe Chronicle's wording is kept as written. No officeholder changes in this campaign."
 ac_bwr.12.a:0 "Note the appointment."
 ac_bwr_tyler:0 "Belkan War record: A New Chief of Staff"
 ac_bwr_tyler_skipped:0 "Belkan War record: A New Chief of Staff (window passed; not reported)"
 ac_bwr.13.t:0 "The Kestrel Commissioned"
 ac_bwr.13.d:0 "The Osean carrier Kestrel has been commissioned (ACES Chronicle, 1999 / 09.16).\n\nThe record gives the commissioning; this campaign builds no ship from it."
 ac_bwr.13.a:0 "Note the commissioning."
 ac_bwr_kestrel_commissioned:0 "Belkan War record: The Kestrel Commissioned"
 ac_bwr_kestrel_commissioned_skipped:0 "Belkan War record: The Kestrel Commissioned (window passed; not reported)"
 ac_bwr_directus_occupied:0 "Belkan War record: Directus was under Belkan control"
