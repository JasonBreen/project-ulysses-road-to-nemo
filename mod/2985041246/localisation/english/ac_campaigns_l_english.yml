 ac_camp.64.t:0 "The chair nobody moved"
 ac_camp.64.desc:0 "The crew room did not look altered enough. A cup remained where it had been put down. Someone had left a note about the next duty change, and the person reading it folded the paper instead of correcting the name.\n\nChopper had not returned from the ceremony attack. The controller had asked for the receiving account to be checked, then asked again because he could not make himself accept that a second answer would resemble the first. Somewhere on another desk was the earlier allocation request. Nobody in the room needed it brought out to explain what the chair meant.\n\nThe squadron's next briefing arrived before anyone had decided what to do with the chair. That was the detail the duty officer would remember: the ordinary schedule continuing to supply its own answers. There were aircraft to inspect, people to receive, and questions that could be postponed only by giving them to somebody else.\n\nA mechanic came in to ask for a signature. He stopped when he saw the room and began to leave. One of the pilots took the paper from him. Neither man looked at the place where the cup stood.\n\nThe loss would remain in the later story. It would change who spoke, what a promise of protection sounded like, and how easily another request for trust could be made. It would not appear as a penalty that disappeared with a timed national spirit.\n\nThe duty officer left the chair where it was for the rest of the evening. Moving it could wait until someone had a reason better than making the room look prepared for the next briefing."
 ac_camp.64.a:0 "Keep this account."
 ac_camp.64.z:0 "Close this old message."
