 ac_camp.42.t:0 "An order to come back"
 ac_camp.42.desc:0 "The withdrawal order reached the unit while its officers were discussing how long the remaining fuel would last. Nobody believed the first reading. A second operator checked the authentication, then handed it back without looking at the others.\n\nThe withdrawal was authorized, supplied and authenticated. Yellow Thirteen would face the country's settlement alive. The order offered no answer to what had already happened to the squadron, and it did not restore the authority the unit had once enjoyed. It provided a route out of the last demand being made on it, a route somebody had spent time arranging while the command could still insist there was no reason to prepare one.\n\nThe officer preparing the return asked which equipment should receive priority. Someone answered too quickly. Someone else mentioned people who were still waiting outside the military receiving point. A withdrawal could be described as an orderly movement on paper while its practical limits were being argued over one vehicle at a time.\n\nThe pilot listened and then asked for the civilian receiving instructions. His presence had become another obligation for the people arranging the movement. Surviving a last stand was not the same as being excused from explaining why there had nearly been one.\n\nAt headquarters, the completed withdrawal was entered beside reports of formations that had not received the same opportunity. It would follow the command into victory, armistice or defeat.\n\nThe next chapter would have fewer opportunities for the language of legend. It would require an ordinary answer from a person who had been allowed to return."
 ac_camp.42.a:0 "Keep this account."
 ac_camp.42.z:0 "Close this old message."
