l_english:
 EMM_ew_evacuation_service_1_spirit:0 "Exercise a District Evacuation"
 EMM_ew_evacuation_service_1_spirit_desc:0 "The interior ministry maintains this funded service for ninety days. Move one district's registered population along its named route and back. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 EMM_ew_evacuation_service_1:0 "Exercise a District Evacuation"
 EMM_ew_evacuation_service_1_desc:0 "Move one district's registered population along its named route and back.\n\nThe interior ministry must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 EMM_ew_evacuation_service_2_spirit:0 "Hold the Rolling Stock Ready"
 EMM_ew_evacuation_service_2_spirit_desc:0 "The national railway maintains this funded service for ninety days. Keep the western corridor's reserve trains crewed and timetabled. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 EMM_ew_evacuation_service_2:0 "Hold the Rolling Stock Ready"
