l_english:
 AZB_wd_pol_frozen_calendar:0 "The Frozen Election Calendar"
 AZB_wd_pol_frozen_calendar_desc:0 "The Republic of Azbekerania keeps a general ballot every forty-eight months in its statutes, and the calendar is suspended. A National Administration governs under the democratic banner with almost no democrats behind it, while the reservists' leagues and the non-party civil establishment each claim about half the public. Reopening the calendar exposes the Administration to both camps, and nothing else in the republic moves until it is answered."
 AZB_wd_pol_office_inventory:0 "An Inventory of the Offices"
 AZB_wd_pol_office_inventory_desc:0 "Before anyone argues over who should govern, the Administration needs to know what it governs with. Inspectors list every ministry, district office and city bureau, and find a civil service stretched thin across ten districts, strong in the capital and nearly absent in the towns. The inventory embarrasses departments that exist mainly as letterheads, and it hands every faction the same figures to fight over."
 AZB_wd_pol_office_inventory_tt_1:0 "Opens three answers to the calendar question; only one can be taken."
 AZB_wd_pol_gazette:0 "Print Every Decree"
 AZB_wd_pol_gazette_desc:0 "The Administration has governed by decrees that were read aloud in the capital and seldom printed in the towns. A single official gazette, posted in every district office within a week of signature, makes the rules knowable to anyone who can read. It costs paper, a printing works and a staff of proof-readers. It also lets the leagues' lawyers find every contradiction between one decree and the next."
 AZB_wd_pol_convention_path:0 "Delegates from Ten Districts"
 AZB_wd_pol_convention_path_desc:0 "The reform wing proposes that each of the ten districts elect delegates to a convention with one task: write an electoral law the republic will actually use. The democratic camp is nearly empty, so the delegates will come from the leagues and the civil establishment. The Administration accepts the gamble, because a law drafted by elected delegates cannot be waved away as one more decree."
 AZB_wd_pol_directorate_path:0 "The Civil Service Keeps the Seals"
 AZB_wd_pol_directorate_path_desc:0 "Senior officials argue that the civil service is the only institution both camps still obey, and that it should govern openly instead of sheltering behind an empty party label. Ministries would answer to a directorate of permanent secretaries, judged on results rather than votes. The establishment is reassured. The leagues call it government by filing cabinet and promise to empty the cabinets."
 AZB_wd_pol_league_path:0 "The Reserve Leagues Demand a Say"
 AZB_wd_pol_league_path_desc:0 "Half the public belongs to or votes with the reservists' leagues, associations of men who served in the formations and believe the republic should be run with the discipline of a mobilisation table. Their leaders propose a national front that would merge the leagues with the state. Their parades are orderly and huge, and they already march in step with the army."
 AZB_wd_pol_convention_cabinet:0 "Seat the Convention Cabinet"
 AZB_wd_pol_convention_cabinet_desc:0 "The convention adopts its electoral law and chooses a cabinet answerable to the delegates until the first general ballot. Government passes from a single office to a body that can be removed. League delegates hold a large bloc and use it to delay budgets, while the civil establishment sulks in the ministries. Still, the cabinet holds a mandate the National Administration never had."
 AZB_wd_pol_directorate_seat:0 "Install the Civil Directorate"
 AZB_wd_pol_directorate_seat_desc:0 "A directorate of permanent secretaries takes the government seals, with ministerial posts left vacant and their duties given to career officials. Elections stay suspended on the grounds that the calendar is under review, which it will be for years. Contracts are signed on time and budgets close on schedule. Nobody in the directorate has ever had to make a speech, and it shows."
 AZB_wd_pol_front_seat:0 "Proclaim the Reserve Front"
 AZB_wd_pol_front_seat_desc:0 "The leagues merge into a single reserve front that takes executive power by decree, led by a council of senior reserve officers. Parties are absorbed into the front or closed. Recruiting offices fill within a week and street crime falls. District notables and city chambers grow careful and quiet, because a government built on mobilisation tables will always need a reason to mobilise."
 AZB_wd_pol_first_ballot:0 "The First General Ballot"
 AZB_wd_pol_first_ballot_desc:0 "With the law in force, the convention cabinet calls a general ballot in all ten districts. Polling stations in the seven towns need trucks, clerks and sealed boxes that the Administration never bought. The leagues win many seats, the civil establishment wins more, and the democrats gain a foothold. The result settles little about policy and a great deal about how policy is now made."
 AZB_wd_pol_results_tables:0 "Results Tables for Every Ministry"
 AZB_wd_pol_results_tables_desc:0 "The directorate publishes a results table for each ministry every quarter: roads graded, plants commissioned, rifles delivered, complaints answered. Ministries that miss their figures lose budget to those that meet them. Officials learn to game the tables at once, and the directorate learns to change the tables faster. The public finally sees what its government does, if not why."
 AZB_wd_pol_muster_rolls:0 "Every Citizen on a Muster Roll"
 AZB_wd_pol_muster_rolls_desc:0 "The front extends the reserve muster roll from former soldiers to every adult, with a block warden in each street to keep it current. Mobilisation becomes a civic ritual and an instrument of surveillance in one stroke. Volunteers for road gangs and depot guards appear in numbers the Administration never managed. People missing from the roll discover that their absence has been noticed."
 AZB_wd_pol_settled:0 "The Calendar Question Closed"
 AZB_wd_pol_settled_desc:0 "Whichever answer prevailed, Azbekerania stops arguing about who governs and starts arguing about what to govern for. Ministries know their masters, the districts know where to send petitions and foreign consulates know whom to call. An answer that half the country dislikes is still an answer, and it costs far less to live with than a calendar nobody is permitted to use."
 AZB_wd_dist_seven_towns:0 "The Seven Towns Without Roads"
 AZB_wd_dist_seven_towns_desc:0 "Every civilian plant, arms plant, air base and paved road in Azbekerania sits in three districts: the Capital District, District A and District C. The other seven, B, D, E, F, H, I and J, hold most of the land and many of the people, but no plant, no surveyed resource and no paved road. Surveying them properly is the first step toward a country that is more than three cities."
 AZB_wd_dist_line_halts:0 "Halts on the Capital Line"
 AZB_wd_dist_line_halts_desc:0 "The republic's only railway runs from the Capital District across District D to District C and on to District A, carrying ore and fuel between the cities without stopping in between. Halts, sidings and a goods yard in District D let the line serve the country it crosses. The freight timetable slows for a season, and the city plants complain about every late wagon."
 AZB_wd_dist_f_crossroads:0 "District F, the Inland Crossroads"
 AZB_wd_dist_f_crossroads_desc:0 "District F is small, three provinces of plain and hill, and it is the only district that touches neither a foreign frontier nor the sea. Roads from the capital and from Districts D, E, H and I could all meet there. Grading them into one crossroads makes District F the natural home for depots, workshops and anything the republic would rather keep away from its borders."
 AZB_wd_dist_i_coast_road:0 "A Road the Length of District I"
 AZB_wd_dist_i_coast_road_desc:0 "District I is the largest district on the map, eleven provinces of plain with a stretch of the southern coast at one end and the Yuktobanian frontier at the other, and it has no paved road at all. A single graded road along its length links coast, frontier and crossroads. It is a long and dull project that ties up the road crews for two full seasons."
 AZB_wd_dist_e_switchbacks:0 "Switchbacks into District E"
 AZB_wd_dist_e_switchbacks_desc:0 "District E is the hill and mountain country along a long stretch of the Yuktobanian frontier, and the steepest ground in Azbekerania, where every road must climb. Switchback roads and stone bridges open its valleys to trucks for the first time. The engineers need explosives and patience, the treasury needs patience too, and the frontier garrisons gain a way to reach their own posts."
 AZB_wd_dist_b_shore:0 "The District B Shore Road"
 AZB_wd_dist_b_shore_desc:0 "District B lies on the coast beside District C, with plains that run to the Seterano frontier and no road better than a farm track. A shore road linking it to District C ends the district's isolation and gives the Seterano crossings a route to the rest of the country. It costs little and changes much, which is probably why it waited so long."
 AZB_wd_dist_southern_tracks:0 "Tracks Across the Southern Desert"
 AZB_wd_dist_southern_tracks_desc:0 "Districts H and J are hill and desert country along the frontier with Aemurraq, and District J is desert all the way down to its coast. Graded tracks link both to the Capital District for the first time. Sand fills them within a season unless crews keep clearing them, so the road ministry acquires a permanent budget line it will never be able to cut."
 AZB_wd_dist_town_charters:0 "Charters for the Seven Towns"
 AZB_wd_dist_town_charters_desc:0 "One answer to the imbalance gives each of the seven towns a charter: an elected council, its own works office and a fixed share of the revenue the three cities earn. The towns gain a voice and a budget line. The cities lose the freedom to spend their own revenue where they choose, and their chambers warn that charters have never built a single plant."
 AZB_wd_dist_city_wardens:0 "Each City Wards Its Towns"
 AZB_wd_dist_city_wardens_desc:0 "The other answer divides the seven towns among the three industrial cities, whose offices then run the towns' roads, schools and clinics as their own. It is efficient and quick, because the cities already have engineers and money. It also turns seven towns into dependencies of three cities they never chose, and the town notables will remember who took their offices."
 AZB_wd_dist_town_budgets:0 "Town Budgets Voted Locally"
 AZB_wd_dist_town_budgets_desc:0 "The chartered towns vote their first budgets, and most spend the money on the same three things: a clinic, a school and a water tower. None of it raises output. All of it keeps people in the towns rather than drifting to the three cities. The finance ministry grumbles about duplicated works, and the councils learn how far their revenue share really stretches."
 AZB_wd_dist_engineer_circuit:0 "City Engineers Ride the Circuit"
 AZB_wd_dist_engineer_circuit_desc:0 "Engineers from the three cities ride a monthly circuit through the towns in their wardship, inspecting roads, wells and pumps and ordering repairs on the spot. Work is done quickly and to city standards. The towns are grateful and resentful in roughly equal measure, since every repair arrives with a city official who expects to be thanked for it."
 AZB_wd_dist_crossroads_plant:0 "A Plant at the Crossroads"
 AZB_wd_dist_crossroads_plant_desc:0 "With roads meeting in District F, the ministry places the first plant ever built outside the three cities at the crossroads: a works for repairing and machining trucks, pumps and rail wagons. Skilled workers must be coaxed away from the cities, and their housing costs more than the lathes. If it works, the towns stop being a place industry merely drives through."
 AZB_wd_dist_revenue_formula:0 "Revenue Shares for Ten Districts"
 AZB_wd_dist_revenue_formula_desc:0 "Whichever arrangement governs the towns, the ten districts sign a fixed formula for sharing revenue, road money and emergency stores for the rest of the decade. It is a table of percentages that nobody loves. It also ends the yearly quarrel over whether three cities subsidise seven towns or exploit them, so later governments can plan without reopening it."
 AZB_wd_ind_city_ledger:0 "What the Three Cities Make"
 AZB_wd_ind_city_ledger_desc:0 "Azbekerania's economy is three industrial districts, each with four civilian plants, two arms plants and its own oil, steel, aluminium and rubber. Nobody has ever added their figures together. One output ledger shows how much of each city's production leaves the country under the export law, how much stays at home and how much vanishes between plant gate and customs shed."
 AZB_wd_ind_rubber_study:0 "The Rubber Question"
 AZB_wd_ind_rubber_study_desc:0 "Rubber is the scarcest line in all three city ledgers: enough for tyres, hoses and seals if it stays at home, a minor export if it does not. Chemists and plant managers study how far synthetic blends can stretch it. The study takes a year of the best engineers' time, and it decides what the motor plants and the air arm can promise for the decade."
 AZB_wd_ind_export_law:0 "Hold to the Export Law"
 AZB_wd_ind_export_law_desc:0 "The trade ministry argues that the export law serves the republic well: oil, steel and aluminium sold abroad at world prices for hard currency that buys what the plants cannot make. Keeping it means investing in the capital's wharves and in freight, not in new domestic industry. Critics answer that the seven towns will still be waiting for a factory when the oil runs out."
 AZB_wd_ind_motor_path:0 "A National Motor Works"
 AZB_wd_ind_motor_path_desc:0 "Plant managers in the three cities propose to turn their steel, aluminium and rubber into trucks, tyres and spare parts at home. The army wants transport before anything else, and the towns need trucks for the new roads. Protected prices would keep imported vehicles out for a decade. Exports fall in the meantime, and the trade ministry counts every cargo it loses."
 AZB_wd_ind_dispersal_path:0 "Move the Plants Away from the Line"
 AZB_wd_ind_dispersal_path_desc:0 "Two of the three industrial cities, District A and District C, sit on the Yuktobanian frontier. The general staff proposes to build every new plant inland, in District F, District H and the other towns, so that one bad night on the frontier cannot halve the republic's output. It is the most expensive way to grow and the safest, and the city chambers hate it."
 AZB_wd_ind_capital_wharf:0 "Bulk Wharves at the Capital Centre"
 AZB_wd_ind_capital_wharf_desc:0 "Exports leave through the capital's naval harbour, where warships and ore carriers queue for the same berths. A bulk wharf with ore sheds, fuel tanks and its own works yard separates trade from the navy and doubles loading capacity. It takes the last free industrial ground in the Capital District, so nothing else will be built there for a long time."
 AZB_wd_ind_through_rates:0 "Through Rates to the Wharf"
 AZB_wd_ind_through_rates_desc:0 "With the wharf open, the railway offers through rates from the plants of District A and District C straight to the capital's berths, with one bill of lading and no handling in between. Ore and metal reach the ships within a day. The towns along the line watch the trains pass faster than ever and stop no more often than they did before."
 AZB_wd_ind_truck_line:0 "Truck Assembly on the Line"
 AZB_wd_ind_truck_line_desc:0 "The motor works places its first truck assembly hall in District D, beside the railway between the capital and District C, where steel and rubber arrive by rail and finished trucks leave by road. The first models copy foreign designs on local tyres. They are heavy, simple and repairable with hand tools, which is exactly what the reserve formations asked for."
 AZB_wd_ind_tyre_plant:0 "A Tyre and Hose Plant"
 AZB_wd_ind_tyre_plant_desc:0 "Tyres wear out faster than any other part of a truck, and every imported tyre costs hard currency. A tyre and hose plant in District B, close to the new shore road, turns city rubber and imported blends into tyres for the motor works and the army. The district gains its first factory jobs, and the small rubber export ends for good."
 AZB_wd_ind_district_h_works:0 "Workshops in District H"
 AZB_wd_ind_district_h_works_desc:0 "The dispersal programme's first site is District H, hill and desert country on the Aemurraq frontier and far from the Yuktobanian line. A machine shop and a small arms works rise beside the new desert tracks. Water must be trucked in and the workforce housed from nothing. The general staff calls the cost insurance; the city chambers call it exile."
 AZB_wd_ind_district_f_works:0 "Fabrication at the Crossroads"
 AZB_wd_ind_district_f_works_desc:0 "A second dispersal site follows in District F, where a fabrication plant takes orders that would otherwise go to the frontier cities. The plant is small and its unit costs are high. In return, the republic now has industry in a district that no foreign army could reach without first crossing another district, and the staff sleeps a little better."
 AZB_wd_ind_rolled_sheet:0 "Aluminium Rolled at Home"
 AZB_wd_ind_rolled_sheet_desc:0 "Aluminium is the third metal in every city ledger, and most of it leaves as ingots. A rolling line inside the capital's existing plants turns ingot into sheet for truck bodies, aircraft panels and roofing. It needs no new plant, only new machines and steadier electricity, and it gives the air arm spares that do not wait on import licences."
 AZB_wd_ind_output_census:0 "An Output Census Each Quarter"
 AZB_wd_ind_output_census_desc:0 "By the middle of the decade the three cities and the new sites file a common census of output, stocks and orders every quarter. Planners can finally see a shortage coming instead of reading about it in the newspapers. Plant managers resent the paperwork and fill it in anyway, because the census now decides who gets steel when there is not enough to go round."
 AZB_wd_res_eight_formations:0 "Muster the Eight Formations"
 AZB_wd_res_eight_formations_desc:0 "The army is eight infantry formations, each of six battalions with an engineer company, quartered at the Capital Centre and the two logistics centres in District A and District C. It is called a continental reserve, yet nobody has moved more than one formation at a time. A full muster tests the trucks, the rail timetable and the officers in one uncomfortable week."
 AZB_wd_res_firepower:0 "Firepower Before Numbers"
 AZB_wd_res_firepower_desc:0 "The army's doctrine already prizes superior firepower over mass, which suits a volunteer force that cannot grow quickly. The staff writes that preference into training: more mortars and field guns per battalion, and gun crews drilled until they can fire without officers. Guns cost far more than riflemen and the procurement budget is small, so the formations will stay few, and heavy."
 AZB_wd_res_engineers:0 "Engineers Who Build Roads"
 AZB_wd_res_engineers_desc:0 "Every formation carries an engineer company, and the seven towns need roads more than anything. Lending the engineers to the district road programme in peacetime keeps them practised and gives the towns skilled crews for nothing. Training for bridging under fire suffers. The army earns a reputation in the towns it never had, and the road ministry gains workers it does not pay."
 AZB_wd_res_screen:0 "Screen the Long Frontier"
 AZB_wd_res_screen_desc:0 "One school wants the formations forward, a screen of battalions along the Yuktobanian frontier in Districts A, C, D, E and I, with the cities behind them. Any incursion meets soldiers within hours. The screen is thin everywhere and strong nowhere, and it puts most of the army within sight of a far larger neighbour, which that neighbour is bound to notice."
 AZB_wd_res_depth:0 "Keep the Reserve in Depth"
 AZB_wd_res_depth_desc:0 "The other school keeps the formations together at the inland crossroads and the capital, with only observation posts on the frontier. Nothing on the line is held for long, but the whole army can arrive anywhere within days by road and rail. The doctrine depends on roads still being built and on frontier districts accepting that they will be defended late."
 AZB_wd_res_hill_battalions:0 "Hill Battalions for District E"
 AZB_wd_res_hill_battalions_desc:0 "The army already trains a few mountaineers, and District E is where they matter most: hills climbing to the republic's only mountain country, right on the frontier. Converting two battalions into hill troops, with mules, light guns and their own winter kit, gives the reserve a force for the only ground where trucks fail. The specialists cost more and are useful almost nowhere else."
 AZB_wd_res_rail_tables:0 "Mobilisation Tables for the Line"
 AZB_wd_res_rail_tables_desc:0 "The railway from the capital to District A is the fastest way to move a formation, and nobody has written down how. Staff officers draw up tables for every formation, train and siding, and rehearse them at night so the freight timetable suffers least. The tables are dull, secret and essential. Once written, they also show how few wagons the republic owns."
 AZB_wd_res_frontier_barracks:0 "Barracks Behind the Ridges"
 AZB_wd_res_frontier_barracks_desc:0 "Under the screen doctrine, battalions posted to District E need somewhere to live that is not a tent. Barracks in the valleys behind the ridges, with a road to each post, keep the screen in place through winter. Soldiers complain about the isolation and the cold. The frontier districts like having the army as neighbours, and the local shops like it even more."
 AZB_wd_res_crossroads_depot:0 "The Crossroads Depot"
 AZB_wd_res_crossroads_depot_desc:0 "Under the depth doctrine, the reserve needs a single place to draw ammunition, spares and fuel on its way to wherever it is sent. A depot and repair works at the District F crossroads holds them, with sidings for the trucks and a small ammunition line. It concentrates the republic's stores in one place, which the staff accepts as the price of speed."
 AZB_wd_res_paid_reserve:0 "Paid Reservists, Called Each Year"
 AZB_wd_res_paid_reserve_desc:0 "Former soldiers sign on as paid reservists who drill two weeks a year and answer a call-up within days. The reserve grows without touching the volunteer principle, and the formations could double within a month. The payroll is permanent and rises every year. Employers in the three cities complain each summer when their best workers vanish to the drill grounds."
 AZB_wd_res_town_companies:0 "Town Companies for Local Defence"
 AZB_wd_res_town_companies_desc:0 "Each of the seven towns raises a company of part-time volunteers to guard its own roads, bridges and depots, trained by the army's engineers. It costs little and brings the army into districts that have rarely seen it. The companies will defend their own towns stubbornly and decline to go anywhere else, which the general staff notes and the towns applaud."
 AZB_wd_res_staff_course:0 "A Staff for Moving Armies"
 AZB_wd_res_staff_course_desc:0 "A continental reserve is only as good as the staff that moves it. A small staff course in the capital trains officers in march tables, road control, supply and orders for whole formations rather than battalions. The first classes come from the logistics centres, where moving things is already a trade. The army gains planners who think in days and distances."
 AZB_wd_res_home_trucks:0 "Trucks of the Army's Own Pattern"
 AZB_wd_res_home_trucks_desc:0 "With the motor works producing, the formations trade their imported trucks for domestic ones built to the army's own pattern. Every formation gains vehicles it can repair from its own stores. The first deliveries have weak axles and the drivers say so, loudly, until the second batch arrives. The reserve can now move by road without waiting for an import licence."
 AZB_wd_fr_three_frontiers:0 "Mapping Three Frontiers"
 AZB_wd_fr_three_frontiers_desc:0 "Azbekerania's land frontiers run with three neighbours. Yuktobania, far larger than the republic, touches five districts, two of them home to industrial cities. Seterano borders District A and District B. Aemurraq meets the Capital District, District H and District J. The foreign ministry has never set one policy for all three, and the frontier districts have been left to improvise."
 AZB_wd_fr_trade_path:0 "Freight Across the Long Frontier"
 AZB_wd_fr_trade_path_desc:0 "One policy treats the long frontier as a market. Azbekerania sells steel, rubber and aluminium to buyers on the Yuktobanian side and buys machinery and fuel in return, through customs houses at the main crossings. Commerce makes incidents costly for both sides. It also ties the republic's plants to a single large customer whose decisions it cannot influence at all."
 AZB_wd_fr_armed_path:0 "Armed and Beholden to Nobody"
 AZB_wd_fr_armed_path_desc:0 "Another policy declares armed neutrality: no alliance, no special trade, and a reserve visibly ready to make any incursion costly. It costs nothing in foreign favours and a great deal in budget. Every neighbour knows exactly where the republic stands. Some of them will read readiness as hostility, however carefully the foreign ministry words its notes."
 AZB_wd_fr_consult_path:0 "Consult Seterano and Aemurraq"
 AZB_wd_fr_consult_path_desc:0 "A third policy looks first to the two neighbours other than Yuktobania. The foreign ministry offers Seterano and Aemurraq regular consultations on frontier incidents, smuggling and freight, with no treaty and no common army. Consultations commit nobody to anything and cost little. Whether the neighbours send anyone is their own decision; the republic can only keep the chairs out."
 AZB_wd_fr_customs_houses:0 "Customs Houses on the Frontier"
 AZB_wd_fr_customs_houses_desc:0 "The trade policy needs crossings that clear freight in hours rather than days. Customs houses with weighbridges, sidings and warehouses go up at the main Yuktobanian crossings in District C. Clerks learn foreign forms and foreign languages. Smugglers lose their best years, and honest traders begin to treat the frontier as a place to do business rather than to wait."
 AZB_wd_fr_listening_posts:0 "Listening Posts in the Hills"
 AZB_wd_fr_listening_posts_desc:0 "Armed neutrality needs eyes. Radar and radio listening posts on the hills of District E watch the frontier airspace and the roads beyond the line, reporting to the capital day and night. The equipment is imported and the crews take a year to train. Nothing they hear will be shared with anyone, which is the point of the policy and its main weakness."
 AZB_wd_fr_liaison_desk:0 "A Liaison Desk for Incidents"
 AZB_wd_fr_liaison_desk_desc:0 "The consultations produce one practical result: a liaison desk in the capital, staffed at every hour, with a telephone number for each neighbour's frontier authorities in case they choose to call. Stray herds, lost patrols and smugglers' quarrels can be settled by telephone before they become diplomatic notes. The desk has no power of its own. It only makes misunderstanding slower."
 AZB_wd_fr_attaches:0 "Attaches in Three Capitals"
 AZB_wd_fr_attaches_desc:0 "The republic has rarely posted soldiers to its embassies. Military attaches in the three neighbouring capitals give the general staff trained observers who can tell an exercise from a mobilisation and a rumour from a report. It costs three good officers the formations can ill spare. It also invites the neighbours to send attaches in return and to watch just as closely."
 AZB_wd_fr_district_d_shots:0 "Shots Near a District D Crossing"
 AZB_wd_fr_district_d_shots_desc:0 "On a frontier this long, something eventually happens. A night patrol in District D exchanges shots with armed men who may be smugglers, deserters or something else, and nobody can say which side of the line the first shot came from. How the republic handles its first serious incident will define its frontier policy more than any declaration the ministry could print."
 AZB_wd_fr_standing_orders:0 "Frontier Rules in Writing"
 AZB_wd_fr_standing_orders_desc:0 "After the first incident the government writes its frontier rules down: who may fire, who must be told, who may cross to talk and who signs what afterwards. The rules bind only Azbekeranian soldiers and officials, but they make the republic predictable to anyone watching. Officers on the line gain clarity and lose discretion, which some of them had enjoyed."
 AZB_wd_air_two_wings:0 "Seventy-Two Fighters on Two Fields"
 AZB_wd_air_two_wings_desc:0 "The air arm flies seventy-two service fighters and twelve support aircraft, split evenly between the capital's air base and the field in District A. Each half has its own mechanics, spares and habits, and the two have never flown a joint exercise. Putting them under one command with one maintenance plan is cheap, overdue and resisted by both base commanders."
 AZB_wd_air_field_c:0 "An Air Base for District C"
 AZB_wd_air_field_c_desc:0 "District C holds a third of the republic's industry and a logistics centre on the Yuktobanian frontier, but no airfield. A new base on its plains gives the fighters a third field and puts the frontier city under its own air cover. It also parks combat aircraft within easy view of the frontier, which the foreign ministry asks to be described as purely defensive."
 AZB_wd_air_field_a:0 "Shelters at the District A Field"
 AZB_wd_air_field_a_desc:0 "The District A field lies in forest and hill country close to two frontiers, with its aircraft parked in the open. Earth-covered shelters, a longer runway and a fuel line from the logistics centre let its half of the wing survive a surprise and fly again within hours. The forest hides the shelters well, and the runway extension takes a great deal of the forest."
 AZB_wd_air_radar_plot:0 "One Radar Plot for Both Wings"
 AZB_wd_air_radar_plot_desc:0 "The two wings have never shared a picture of the sky. Two radar sets, one beside the capital air base and one at the District A field, feed a single plotting room in the Capital Centre. Pilots scramble toward a contact instead of toward a hope. The plot covers the cities well and the towns poorly, and the staff keeps a list of every gap."
 AZB_wd_air_one_field:0 "Gather the Wing at the Crossroads"
 AZB_wd_air_one_field_desc:0 "One school wants both halves of the wing moved to a single new base at the District F crossroads, out of sight of every frontier and within reach of all of them. Concentration simplifies maintenance and training and makes the wing harder to surprise. It also leaves the cities with fighters an hour away instead of overhead, and the city chambers protest."
 AZB_wd_air_town_strips:0 "Fighter Strips in the Towns"
 AZB_wd_air_town_strips_desc:0 "The other school scatters the fighters across rough strips in the towns, a pair here and four there, so that no single blow can ground the arm. Pilots learn to fly from grass and dirt, and mechanics learn to work from trucks. Readiness falls and spares go missing between strips. Whatever survives a first night, though, will still fly the next morning."
 AZB_wd_air_support_flights:0 "Support Aircraft for the Formations"
 AZB_wd_air_support_flights_desc:0 "The twelve support aircraft have always flown as an afterthought to the fighters. Assigning them to the reserve formations, with radio teams on the ground and joint exercises each season, gives the army its only air support and the support pilots a purpose. The fighter commanders lose aircraft they had been quietly using as trainers, and they notice."
 AZB_wd_air_tyres_seals:0 "Tyres and Seals for the Wings"
 AZB_wd_air_tyres_seals_desc:0 "Aircraft are grounded more often by worn tyres and leaking hydraulic seals than by anything an enemy does. The rubber study gives the air arm's workshops recipes for both, from the republic's own rubber and imported blends. Home-made seals need replacing sooner than foreign ones, but they arrive in days instead of months, and readiness climbs with every delivery."
 AZB_wd_air_night_pairs:0 "Night Alert Pairs"
 AZB_wd_air_night_pairs_desc:0 "The fighters have only ever flown in daylight from either field. Training pairs of pilots to stand alert at night, take off on radar warning and land on lit runways turns the arm into a round-the-clock service. Night flying costs aircraft in its first year, as it does everywhere. The capital's sky stops being empty between dusk and dawn."
 AZB_wd_sea_two_escorts:0 "Two Escorts and Sixty Convoys"
 AZB_wd_sea_two_escorts_desc:0 "The maritime service is two coastal escorts at the capital's naval harbour and sixty merchant hulls that carry the republic's exports. Its coast comes in two pieces: one shared by the Capital District, District C and District B, the other along District I and District J. The service has never patrolled the second. Counting what it owns comes before deciding what it is for."
 AZB_wd_sea_southern_yard:0 "A Yard on the Southern Coast"
 AZB_wd_sea_southern_yard_desc:0 "All repair work happens at the capital, so any ship on the southern coast must sail round to reach it. A small yard on the District I shore, with one slip and a repair basin, gives the southern coast its own service base and the merchant fleet a second place to haul out. Shipwrights must be recruited from the capital, and few volunteer."
 AZB_wd_sea_j_landing:0 "A Landing for District J"
 AZB_wd_sea_j_landing_desc:0 "District J's desert coast has no harbour worth the name, only open beaches. A concrete landing with a road to the desert tracks lets coastal ships unload supplies for the southern towns without the long haul from the capital. It is a modest work, mostly concrete and sand. It also gives the maritime service a refuelling point on the southern coast."
 AZB_wd_sea_convoy_escort:0 "Escorts with the Ore Convoys"
 AZB_wd_sea_convoy_escort_desc:0 "One doctrine keeps the two escorts with the merchant convoys on their outward legs, so the export trade is never unguarded where it is most exposed. The convoys sail on time and their insurers notice. The coasts themselves are watched by nobody while the escorts are away, and the escort crews spend more nights at sea than any other sailors in the republic."
 AZB_wd_sea_coast_watch:0 "Watch the Coasts from Ashore"
 AZB_wd_sea_coast_watch_desc:0 "The other doctrine keeps the escorts at home and watches both coasts from land: coastwatchers on the headlands, radio huts on the beaches, a radar set on the District I shore and a plotting table at the naval harbour. Merchant convoys sail alone beyond the horizon. Both coasts, however, are watched every hour of the year."
 AZB_wd_sea_escort_design:0 "An Escort of Our Own Design"
 AZB_wd_sea_escort_design_desc:0 "The capital's two dockyards have built merchant hulls and repaired the escorts, but never designed a warship. A simple coastal escort to the service's own specification, slow but seaworthy and cheap to crew, teaches the yard and the naval staff more than any purchase could. The first hull takes twice as long as planned; the second, only half again as long."
 AZB_wd_sea_lifeboats:0 "Lifeboat Stations on Both Coasts"
 AZB_wd_sea_lifeboats_desc:0 "Nobody in Azbekerania is responsible for a ship in trouble off its own coast; the escorts are too few and usually elsewhere. Lifeboat stations at the capital, in District C and on the southern coast, crewed by volunteers and paid for by a levy on cargo, give both coasts a rescue service. Masters pay a small fee per voyage and stop complaining after the first winter."
 AZB_wd_bw_dispatches:0 "Dispatches from the Belkan War"
 AZB_wd_bw_dispatches_desc:0 "In March 1995 war breaks out around Belka. Azbekerania is far from the fighting and party to none of it, but the general staff reads every dispatch as if it were addressed to the republic. A small country with larger neighbours is watching how a war among bigger powers treats the states caught between them. The newspapers ask whether the reserve is ready; so does the cabinet."
 AZB_wd_bw_ustio_week:0 "The Week That Took Ustio"
 AZB_wd_bw_ustio_week_desc:0 "By 30 March 1995 nearly all of the Republic of Ustio has fallen under Belkan control, within days of the war beginning. For the Azbekeranian staff the lesson is uncomfortable and precise: a small republic can lose almost all of its ground in less than a week. Every plan the reserve owns is reopened, and the planners stop sleeping at home."
 AZB_wd_bw_hold_cities:0 "Hold the Frontier Cities at Any Cost"
 AZB_wd_bw_hold_cities_desc:0 "The first answer says the republic cannot lose District A or District C even for a week, because together they hold two thirds of its industry. Every formation would be committed to their defence from the first hour, with fieldworks around both cities and stores for a siege. The plan protects the plants and leaves the seven towns to fend for themselves."
 AZB_wd_bw_trade_ground:0 "Trade Ground for Time"
 AZB_wd_bw_trade_ground_desc:0 "The second answer accepts that frontier districts may be lost for a while and plans to keep the army whole rather than spend it at the line. Formations would fall back on the crossroads and the capital, dropping bridges behind them, and strike when the attacker is stretched. It is cold arithmetic, and the frontier districts are not expected to like it."
 AZB_wd_bw_worth_helping:0 "Become Worth Helping"
 AZB_wd_bw_worth_helping_desc:0 "The third answer notes that Ustio did not resist alone: within days it entered an alliance with Osea. Azbekerania has no alliance and this focus creates none. It invests instead in being easy to help: foreign officers invited to exercises, airfields built to common standards and staff officers who speak the languages of possible friends."
 AZB_wd_bw_directus:0 "The Liberation of Directus"
 AZB_wd_bw_directus_desc:0 "In May 1995 the Allied Forces liberate Ustio's capital, and the staff revises its notes again. Ground lost in days was regained in weeks, but by allied forces rather than by Ustio alone. Planners in the Capital Centre draw the conclusion for a republic of eight formations: any plan must hold long enough for the world to decide whether it cares."
 AZB_wd_bw_waldreich:0 "Seven Flashes in the Waldreich"
 AZB_wd_bw_waldreich_desc:0 "In this campaign the war has turned nuclear: the Belkan Army has used seven nuclear devices in the Waldreich Mountains. Whether anything carried on the wind as far as Azbekerania is a question only instruments can answer, and the republic owns almost none. It buys radiation counters for every district office and trains the engineer companies to read them, at a price nobody argues about."
 AZB_wd_bw_lumen_treaty:0 "The Staff War Room Closes"
 AZB_wd_bw_lumen_treaty_desc:0 "A treaty signed in Lumen on 20 June 1995 ends the Belkan War. The staff closes its war room, the newspapers move on and the cabinet asks whether the emergency spending can stop. The staff replies that the war ended but its lesson did not, and asks to keep its revised plans funded. The cabinet splits the difference, as cabinets generally do."
 AZB_wd_bw_thick_screen:0 "The Screen Thickened"
 AZB_wd_bw_thick_screen_desc:0 "The Belkan War convinced the frontier school that a screen too thin to hold is only a tripwire. The staff thickens it where it matters most: more battalions around District A and District C, fewer elsewhere, and reserve stocks moved closer to the line. The screen grows strong where the plants are and frankly symbolic where the towns are."
 AZB_wd_bw_marked_bridges:0 "Bridges Marked for Demolition"
 AZB_wd_bw_marked_bridges_desc:0 "The depth school takes from the Belkan War the conviction that an attacker must be slowed before the reserve strikes. Engineers survey every bridge and culvert between the frontier and the crossroads, mark each for demolition and store the charges nearby under guard. It is grim, cheap work, and the frontier districts learn which bridges their own army means to blow."
 AZB_wd_bw_belkan_victory:0 "Reading a Belkan Victory"
 AZB_wd_bw_belkan_victory_desc:0 "Where the war has ended with Belka victorious, the staff takes the gloomiest reading available: the republic should count on nobody's rescue but its own. The cabinet agrees to hold the reserve at higher readiness for a year. Neighbours notice the extra drills and the night convoys, and their attaches ask polite questions that the ministry answers politely."
 AZB_wd_bw_belkan_defeat:0 "Reading a Belkan Defeat"
 AZB_wd_bw_belkan_defeat_desc:0 "Where the war has ended in Belkan defeat, the staff concludes that outside help can matter if a defender holds long enough to receive it. Plans keep their hope of rescue, and the cabinet trims the emergency budget. Cautious officers write dissenting memoranda about the risks of relying on others, which are filed with great care and read by almost nobody."
 AZB_wd_uly_no_miss:0 "The Asteroid Will Not Miss"
 AZB_wd_uly_no_miss_desc:0 "The warning of December 1994 became a certainty in April 1996, when the impact of Ulysses was announced to the world. Where fragments will fall is unknown. Azbekerania has a capital on the sea, a coastal city on the frontier, seven towns with few roads and a reserve trained only for war. Every district office telephones the capital to ask what it should do."
 AZB_wd_uly_galleries:0 "Galleries in the District E Hills"
 AZB_wd_uly_galleries_desc:0 "Engineers propose galleries cut into the hills of District E, which rise to the republic's only mountain country, deep enough to shelter people from the capital and the cities for weeks. The galleries would protect everyone who reached them and nobody who did not. The work is slow, the hills sit on the frontier and the road there is barely finished."
 AZB_wd_uly_thin_coast:0 "Thin Out the Coastal Cities"
 AZB_wd_uly_thin_coast_desc:0 "Planners propose moving families, records and spare machinery from the coast at the capital and District C to the inland towns before the impact, so that anything striking the coast finds fewer people in its path. It is cheap in concrete and expensive in politics. The towns must house strangers, and the cities must send their own families away."
 AZB_wd_uly_rescue_corps:0 "The Reserve Becomes a Rescue Corps"
 AZB_wd_uly_rescue_corps_desc:0 "The general staff offers the formations themselves: eight formations of soldiers with trucks, engineers and radios, retrained to dig, clear, carry and feed rather than to fight. The army becomes a rescue corps for as long as the danger lasts. Its readiness for war falls measurably, and the frontier school records its objection in writing."
 AZB_wd_uly_fill_silo:0 "Fill the Capital Fuel Silo"
 AZB_wd_uly_fill_silo_desc:0 "The capital's fuel silo is the republic's only strategic store of fuel, and under the civilian economy it is rarely full. Filling it before the impact means buying abroad at high prices or holding back exports when they would earn most. The trade ministry objects to both. Every plan for the night itself, however, assumes trucks and generators that will need fuel."
 AZB_wd_uly_evacuation_trains:0 "Evacuation Trains on the Only Line"
 AZB_wd_uly_evacuation_trains_desc:0 "The reserve's mobilisation tables already say how to move eight formations by rail. Rewritten for families instead of battalions, they become evacuation timetables for the only line, from the capital through District D to District C and District A. The halts in District D become reception points. The tables are rehearsed once by night and mostly work."
 AZB_wd_uly_convention_debate:0 "The Convention Debates the Sky"
 AZB_wd_uly_convention_debate_desc:0 "The convention cabinet takes the impact to the delegates, who spend a week arguing over which districts get shelters first. The debate is slow, bitter and broadcast in full. It ends in a published plan that every district has voted for and none fully likes. People who heard the argument trust the plan more than a decree could ever have made them."
 AZB_wd_uly_ration_cards:0 "Ration Cards Printed in Advance"
 AZB_wd_uly_ration_cards_desc:0 "The directorate treats the impact as an administrative problem and solves it administratively: ration cards for every household, printed and filed in each district office, ready to issue the moment supplies fail. Nobody will queue for them in a panic, because they already exist. The cards also record every household's members and address, which some households find more alarming than the asteroid."
 AZB_wd_uly_block_wardens:0 "Block Wardens for the Shelters"
 AZB_wd_uly_block_wardens_desc:0 "The reserve front assigns its block wardens to the shelters: each warden knows who lives in each street, which shelter they go to and in what order. The drills are punctual and complete. Families whose loyalty the front doubts find their places at the back of the list, and they learn not to complain where a warden might hear them."
 AZB_wd_uly_town_radios:0 "A Radio in Every Town Office"
 AZB_wd_uly_town_radios_desc:0 "The seven towns hear national news days late, by newspaper or rumour. Under the revenue formula, every town office receives a radio set, a generator and an operator trained to relay bulletins and report damage. The sets cost little; the operators cost more. Whatever happens on the night, the capital will at least hear about it from the towns themselves."
 AZB_wd_uly_july_night:0 "The Eighth of July, 1999"
 AZB_wd_uly_july_night_desc:0 "On 8 July 1999 Ulysses passes through the Roche limit of the Earth. In Azbekerania the formations wait beside their trucks in the capital and the cities, the evacuation trains stand in the District D sidings and every district office keeps a radio operator awake. Nobody knows yet where anything will fall. Everyone knows these nights will be remembered."
 AZB_wd_uly_sky_bill:0 "What the Sky Cost at Home"
 AZB_wd_uly_sky_bill_desc:0 "When the sky clears, the government counts what the impact years cost at home: money spent on shelters and stores, plants idled for drills, exports held back and formations kept from training. Whatever fell elsewhere, the domestic bill is real and must be paid. The ministries draw up one account, and the cabinet decides which emergency measures to keep."
 AZB_wd_cen_census:0 "The Census of the Year 2000"
 AZB_wd_cen_census_desc:0 "The turn of the century gives the government a reason to count everything again: people, plants, roads, trucks, rifles and debts in all ten districts. The surveys of the early nineties found three cities and seven empty towns. The new count will show whether a decade of roads, plants and arguments has changed that, and every faction is already rehearsing its explanation."
 AZB_wd_cen_cleared_orbit:0 "Satellites Over a Cleared Orbit"
 AZB_wd_cen_cleared_orbit_desc:0 "In October 1999 Osea and Yuktobania began converting the Arkbird into a platform for clearing debris from satellite orbits, and in this campaign the conversion is finished. With the orbits swept, the republic's broadcasting and telephone engineers can rent satellite capacity with some confidence. Azbekerania contributed nothing to the work and benefits anyway, as small states often do."
 AZB_wd_cen_railgun_study:0 "Railguns Over a Distant Desert"
 AZB_wd_cen_railgun_study_desc:0 "In the summer of 2003 war comes to Usea: Erusea seizes Stonehenge in San Salvacion and turns its railguns on the sky. Usea is far from the ten districts, but the air staff studies the war closely, because it asks whether a small air force can be denied the sky by guns on the ground. The cabinet wonders how long two small wings would last."
 AZB_wd_cen_city_batteries:0 "Guns and Radar Before Fighters"
 AZB_wd_cen_city_batteries_desc:0 "One lesson is that air defence from the ground is cheaper than fighters and harder to destroy. The republic buys anti-aircraft guns and fire-control radar for the three cities and puts the next fighter purchase on hold. The cities sleep better under their batteries. The pilots, told to wait another decade for new aircraft, sleep rather worse."
 AZB_wd_cen_wing_renewal:0 "Renew Both Fighter Wings"
 AZB_wd_cen_wing_renewal_desc:0 "The other lesson is that guns deny only the sky above themselves, and that fighters remain the one weapon that can go where the danger is. The cabinet funds a renewal of both wings, with new airframes over five years and pilots trained to fight in defended airspace. It is the costliest decision of the decade, and every year of it will be argued."
 AZB_wd_cen_truck_exports:0 "Wartime Orders for Our Trucks"
 AZB_wd_cen_truck_exports_desc:0 "Armies at war use up trucks and tyres faster than any peacetime market, and buyers far from Usea start placing orders wherever they find capacity. The motor works can sell abroad for the first time, at prices that repay its protected decade. The reserve formations, promised the next batch, watch the trucks leave by sea and write to the cabinet."
 AZB_wd_cen_metal_prices:0 "Ore Cargoes at Wartime Prices"
 AZB_wd_cen_metal_prices_desc:0 "War raises the price of every metal, and the export path left the republic ready to sell into that market. Ore and aluminium leave the capital's wharves at prices nobody had seen in years. The trade ministry reports record receipts. The towns ask why record receipts never seem to reach them, and the leagues' newspapers print the question weekly."
 AZB_wd_cen_inland_overflow:0 "Inland Plants Take the Overflow"
 AZB_wd_cen_inland_overflow_desc:0 "Foreign demand swells while the war lasts, and the city plants cannot fill every order. The dispersed works in District H and District F take the overflow, running second shifts for the first time. Their unit costs fall as volume rises. For once the dispersal programme looks less like insurance and more like a sound investment."
 AZB_wd_cen_accord_dividend:0 "The War That Never Came"
 AZB_wd_cen_accord_dividend_desc:0 "In this campaign the war in Usea never began: the quarrel over refugees and the railgun battery ended in a continental accord. Insurers relax, metal prices sag and the air staff's study of ground defences loses its urgency. The cabinet spends the savings on roads in District B, a district that never had a lobby as effective as a distant war."
 AZB_wd_cen_stonehenge_broken:0 "The Batteries at Stonehenge Broken"
 AZB_wd_cen_stonehenge_broken_desc:0 "In this campaign Stonehenge has been destroyed, and with it the strongest argument that guns on the ground can own the sky. The air staff revises its study: ground defences can be broken by an air force willing to pay for it. Both schools in the cabinet claim the result proves them right, which keeps the budget quarrel alive for another year."
 AZB_wd_cen_reserve_handover:0 "The Reserve Changes Generations"
 AZB_wd_cen_reserve_handover_desc:0 "By 2005 the officers who mustered the eight formations in the early nineties are retiring, and the reserve passes to men who learned their trade in its newer tables, depots and roads. The handover is marked by a parade in the Capital Centre and a quieter review of what the republic still lacks. Whoever governs next inherits an army that knows its own country."
 AZB_wd_cen_reserve_handover_tt_2:0 "Ends the 1991 to 2005 programme; later decades are not yet written."
 ac_wd_azb_tree:0 "Azbekerania: National Programme"
 ac_wd_azb_tree_desc:0 "The national focus programme of Azbekerania, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 AZB_wd_suspended_calendar:0 "The Suspended Calendar"
 AZB_wd_suspended_calendar_desc:0 "An election calendar on the statute book that nobody is allowed to use."
 AZB_wd_official_gazette:0 "The Official Gazette"
 AZB_wd_official_gazette_desc:0 "Every decree printed and posted in all ten districts within a week."
 AZB_wd_convention_call:0 "A Convention Called"
 AZB_wd_convention_call_desc:0 "Delegates from ten districts are writing the electoral law."
 AZB_wd_clerks_rule:0 "Rule by the Permanent Secretaries"
 AZB_wd_clerks_rule_desc:0 "The civil service governs openly in its own name."
 AZB_wd_league_pressure:0 "The Leagues on the March"
 AZB_wd_league_pressure_desc:0 "Reservists' leagues parade weekly and demand a national front."
 AZB_wd_ballot_republic:0 "A Republic That Votes"
 AZB_wd_ballot_republic_desc:0 "General ballots across all ten districts on a fixed calendar."
 AZB_wd_results_tables:0 "Quarterly Results Tables"
 AZB_wd_results_tables_desc:0 "Every ministry judged each quarter on published figures."
 AZB_wd_muster_state:0 "The Muster Roll State"
 AZB_wd_muster_state_desc:0 "Every adult on a reserve roll kept by a block warden."
 AZB_wd_three_city_state:0 "A Country of Three Cities"
 AZB_wd_three_city_state_desc:0 "All industry and every paved road sit in three of ten districts."
 AZB_wd_town_charters:0 "Chartered Towns"
 AZB_wd_town_charters_desc:0 "Seven elected town councils with a fixed share of city revenue."
 AZB_wd_city_wardens:0 "City Wardenships"
 AZB_wd_city_wardens_desc:0 "The three cities administer the seven towns as their own."
 AZB_wd_town_clinics:0 "Clinics, Schools and Water Towers"
 AZB_wd_town_clinics_desc:0 "Town budgets spent on the services that keep people at home."
 AZB_wd_engineer_circuits:0 "The Engineers' Circuit"
 AZB_wd_engineer_circuits_desc:0 "City engineers inspect and repair the towns every month."
 AZB_wd_city_output_ledger:0 "The Three-City Ledger"
 AZB_wd_city_output_ledger_desc:0 "One account of what the three industrial districts produce and ship."
 AZB_wd_hard_currency_exports:0 "Hard-Currency Exports"
 AZB_wd_hard_currency_exports_desc:0 "Oil, steel and aluminium sold abroad under the export law."
 AZB_wd_through_rates:0 "Through Rates to the Wharf"
 AZB_wd_through_rates_desc:0 "One bill of lading from plant gate to ship's hold."
 AZB_wd_motor_programme:0 "The Motor Programme"
 AZB_wd_motor_programme_desc:0 "Trucks, tyres and spares made at home behind protected prices."
 AZB_wd_dispersal_plan:0 "The Dispersal Plan"
 AZB_wd_dispersal_plan_desc:0 "New plants go inland, away from the Yuktobanian frontier."
 AZB_wd_rolled_sheet:0 "Sheet Rolled at Home"
 AZB_wd_rolled_sheet_desc:0 "Aluminium leaves the mills as sheet rather than ingot."
 AZB_wd_quarterly_census:0 "The Quarterly Output Census"
 AZB_wd_quarterly_census_desc:0 "Output, stocks and orders filed by every plant each quarter."
 AZB_wd_reserve_cadre:0 "The Reserve Cadre"
 AZB_wd_reserve_cadre_desc:0 "Eight formations that have never moved together."
 AZB_wd_frontier_screen:0 "The Frontier Screen"
 AZB_wd_frontier_screen_desc:0 "Battalions posted forward along the Yuktobanian frontier."
 AZB_wd_depth_reserve:0 "The Reserve in Depth"
 AZB_wd_depth_reserve_desc:0 "The army held together inland, ready to move by road and rail."
 AZB_wd_hill_battalions:0 "The Hill Battalions"
 AZB_wd_hill_battalions_desc:0 "Two battalions with mules, light guns and winter kit for District E."
 AZB_wd_paid_reserve:0 "Paid Reservists"
 AZB_wd_paid_reserve_desc:0 "Former soldiers drill two weeks a year and answer a call-up within days."
 AZB_wd_town_companies:0 "Town Companies"
 AZB_wd_town_companies_desc:0 "Part-time volunteers guarding the roads and depots of their own town."
 AZB_wd_home_built_trucks:0 "Trucks of Our Own Pattern"
 AZB_wd_home_built_trucks_desc:0 "Formations equipped with domestic trucks they can repair themselves."
 AZB_wd_frontier_unease:0 "Three Frontiers, No Policy"
 AZB_wd_frontier_unease_desc:0 "Each frontier district improvises its own relations with the far side."
 AZB_wd_frontier_commerce:0 "Commerce Across the Frontier"
 AZB_wd_frontier_commerce_desc:0 "Freight and customs houses make every incident expensive."
 AZB_wd_armed_neutrality:0 "Armed Neutrality"
 AZB_wd_armed_neutrality_desc:0 "No alliance, no favours and a reserve visibly ready."
 AZB_wd_neighbour_consultations:0 "Standing Consultations"
 AZB_wd_neighbour_consultations_desc:0 "Regular offers of talks on incidents, smuggling and freight."
 AZB_wd_liaison_desk:0 "The Incident Liaison Desk"
 AZB_wd_liaison_desk_desc:0 "A telephone that answers at any hour when something happens on the line."
 AZB_wd_attache_reports:0 "Attache Reports"
 AZB_wd_attache_reports_desc:0 "Trained observers in three neighbouring capitals."
 AZB_wd_frontier_standing_orders:0 "Frontier Standing Orders"
 AZB_wd_frontier_standing_orders_desc:0 "Written rules for who may fire, cross and sign on the frontier."
 AZB_wd_split_wings:0 "Two Wings Under One Command"
 AZB_wd_split_wings_desc:0 "Seventy-two fighters on two fields with one maintenance plan."
 AZB_wd_single_wing:0 "One Wing at the Crossroads"
 AZB_wd_single_wing_desc:0 "The whole fighter force on one inland base."
 AZB_wd_scattered_strips:0 "Scattered Strips"
 AZB_wd_scattered_strips_desc:0 "Pairs and fours of fighters spread across rough town strips."
 AZB_wd_support_flights:0 "Support Flights for the Formations"
 AZB_wd_support_flights_desc:0 "Twelve support aircraft working with the reserve on the ground."
 AZB_wd_night_alert:0 "Night Alert Pairs"
 AZB_wd_night_alert_desc:0 "Fighters on radar warning from dusk until dawn."
 AZB_wd_two_escort_service:0 "A Service of Two Escorts"
 AZB_wd_two_escort_service_desc:0 "Two coastal escorts and sixty merchant hulls on two coasts."
 AZB_wd_ore_convoy_escorts:0 "Escorted Ore Convoys"
 AZB_wd_ore_convoy_escorts_desc:0 "The escorts sail with the export convoys on their outward legs."
 AZB_wd_coast_watchers:0 "Coastwatchers Ashore"
 AZB_wd_coast_watchers_desc:0 "Headland watchers and radio huts on both coasts."
 AZB_wd_lifeboat_stations:0 "Lifeboat Stations"
 AZB_wd_lifeboat_stations_desc:0 "Volunteer rescue crews paid by a levy on cargo."
 AZB_wd_war_nerves:0 "War Nerves"
 AZB_wd_war_nerves_desc:0 "A distant war fills the newspapers and the staff war room."
 AZB_wd_city_bastions:0 "The City Bastions"
 AZB_wd_city_bastions_desc:0 "Every formation committed to the frontier cities from the first hour."
 AZB_wd_elastic_plan:0 "Ground for Time"
 AZB_wd_elastic_plan_desc:0 "Fall back, keep the army whole, strike when the attacker is stretched."
 AZB_wd_worth_helping:0 "Worth Helping"
 AZB_wd_worth_helping_desc:0 "Exercises, airfields and officers ready to work with foreign friends."
 AZB_wd_ustio_notes:0 "The Ustio Notes"
 AZB_wd_ustio_notes_desc:0 "Staff studies of a small republic overrun and recovered."
 AZB_wd_fallout_counters:0 "Radiation Counters"
 AZB_wd_fallout_counters_desc:0 "Counters in every district office and engineers trained to read them."
 AZB_wd_demolition_plans:0 "Bridges Marked for Demolition"
 AZB_wd_demolition_plans_desc:0 "Charges stored near every bridge between frontier and crossroads."
 AZB_wd_raised_readiness:0 "Raised Readiness"
 AZB_wd_raised_readiness_desc:0 "The reserve held at higher readiness for a year."
 AZB_wd_impact_committee:0 "The Impact Committee"
 AZB_wd_impact_committee_desc:0 "Ten districts asking the capital what to do."
 AZB_wd_hill_galleries:0 "Galleries in the Hills"
 AZB_wd_hill_galleries_desc:0 "Shelters cut into the high ground of District E."
 AZB_wd_coastal_thinning:0 "The Coast Thinned Out"
 AZB_wd_coastal_thinning_desc:0 "Families, records and spare machinery moved inland."
 AZB_wd_rescue_corps:0 "The Rescue Corps"
 AZB_wd_rescue_corps_desc:0 "Eight formations trained to dig, clear, carry and feed."
 AZB_wd_full_silo:0 "A Full Silo"
 AZB_wd_full_silo_desc:0 "The capital fuel silo kept full against the impact years."
 AZB_wd_voted_shelter_plan:0 "A Shelter Plan Voted by All"
 AZB_wd_voted_shelter_plan_desc:0 "An evacuation plan every district voted for."
 AZB_wd_printed_rations:0 "Ration Cards on File"
 AZB_wd_printed_rations_desc:0 "Cards for every household, printed before they are needed."
 AZB_wd_warden_shelters:0 "Wardens at the Shelters"
 AZB_wd_warden_shelters_desc:0 "Block wardens keep the shelter lists, street by street."
 AZB_wd_town_radios:0 "Radios in the Town Offices"
 AZB_wd_town_radios_desc:0 "A set, a generator and an operator in every town."
 AZB_wd_millennium_census:0 "The Census of 2000"
 AZB_wd_millennium_census_desc:0 "The second full count of people, plants and roads."
 AZB_wd_satellite_rentals:0 "Rented Satellite Links"
