l_english:
 ECH_wd_ballot_orders:0 "Read the Emergency Orders Aloud"
 ECH_wd_ballot_orders_desc:0 "Echinata is governed by a National Administration that sits under a democratic banner while elections stay suspended under emergency orders nobody outside the ministries has read in full. Reading those orders aloud in the capital centre costs the Administration its comfortable silence, yet it is the only way to ask, in public, who should govern next."
 ECH_wd_ballot_hearings:0 "Hearings in the Capital Centre"
 ECH_wd_ballot_hearings_desc:0 "Public hearings let every camp state its case before a panel of senior judges and career officials. The establishment of the services, the national movement that claims half the country and the tiny democratic club all receive equal time. The hearings are slow and expensive, and they make it impossible to postpone a decision any longer."
 ECH_wd_ballot_hearings_tt_1:0 "Opens the three answers to the suspended ballot; only one can be taken."
 ECH_wd_ballot_date:0 "Name a Date for the Ballot"
 ECH_wd_ballot_date_desc:0 "The smallest camp makes the boldest offer: fix an election date, restore the party lists and let the voters decide what the Administration could not. The democratic club has almost no members, but many officials privately prefer a lawful vote to a crowd. Setting the date weakens the ministries at once and hands the movement a campaign it may well win."
 ECH_wd_ballot_services:0 "Let the Services Govern"
 ECH_wd_ballot_services_desc:0 "The non-aligned establishment runs the ports, the depots, the plants and the frontier posts, and it proposes to govern openly instead of through a borrowed party label. A board of senior service chiefs would hold the executive and publish its accounts while elections stay suspended. It is competent and colourless, and it asks the country to trust administrators rather than voters."
 ECH_wd_ballot_square:0 "Answer the Crowds in the Square"
 ECH_wd_ballot_square_desc:0 "Half the country now follows a national movement that fills the squares and promises discipline, pride and an end to government by clerks. Its leaders demand the executive for themselves, without the election they might win anyway. Handing them the initiative calms the streets quickly, but every official, judge and editor who opposed them will be counted."
 ECH_wd_ballot_council:0 "Seat an Elected Council"
 ECH_wd_ballot_council_desc:0 "Elections are held on the promised date and the winning lists form a council of ministers answerable to an elected chamber. The change runs through the office rather than any person: the council governs collectively and can be voted out. The movement takes many seats and contests every bill, so the council governs by coalition from its first day."
 ECH_wd_ballot_board:0 "Charter the Services Board"
 ECH_wd_ballot_board_desc:0 "A written charter places the executive in a board of service chiefs drawn from the ports, depots, plants and frontier commands. The board governs collectively, publishes quarterly accounts and keeps elections suspended until a review it schedules itself. Nobody voted for it, which the movement repeats daily, so the board must earn its tenure through delivery alone."
 ECH_wd_ballot_executive:0 "Proclaim the People's State"
 ECH_wd_ballot_executive_desc:0 "The movement's executive committee takes power and proclaims the Echinatan People's State. Parties outside the movement are suspended, the services answer to political commissioners and the press reports to a bureau. The streets go quiet and the plants meet their quotas, while trading partners abroad watch the new government very carefully and price the risk into every contract."
 ECH_wd_ballot_boat_polls:0 "Polling Stations Afloat"
 ECH_wd_ballot_boat_polls_desc:0 "District D and District G have almost no roads, so their voters have never reached a polling station without a day on foot. The electoral office charters coasters as floating polling stations that call at every harbour and landing. Turnout on the coast doubles, the council gains a legitimacy the capital alone could not give it, and the bill falls on the transport budget."
 ECH_wd_ballot_grades:0 "Graded Examinations for Officials"
 ECH_wd_ballot_grades_desc:0 "The board replaces patronage with graded examinations for every post from harbour clerk to deputy minister. Promotions follow scores and service records, published district by district. Old networks lose their hold on the depots, and capable officials from the coastal districts finally rise. The examinations are slow to organise, and the people they displace do not forgive easily."
 ECH_wd_ballot_wardens:0 "Block Wardens of the Movement"
 ECH_wd_ballot_wardens_desc:0 "The executive appoints a warden for every block of flats and every village, responsible for ration cards, siren drills and reports on dissent. The wardens make the state visible in places the old Administration never reached. They also make neighbours wary of each other, and a country that informs on itself soon stops telling its rulers anything uncomfortable."
 ECH_wd_ballot_orders_lapse:0 "The Emergency Orders Lapse"
 ECH_wd_ballot_orders_lapse_desc:0 "By the millennium the emergency orders of 1991 have outlived their purpose under every kind of government. Letting them lapse formally, and replacing them with an ordinary statute on public emergencies, ends a decade of improvisation. Whoever governs loses a convenient tool, but courts, investors and district officials finally know which rules will still apply next year."
 ECH_wd_roads_survey:0 "Survey the Seven Districts"
 ECH_wd_roads_survey_desc:0 "Echinata has seven districts and only three of them have anything like a road network. District D, District F and District G appear on the map as blank interiors crossed by tracks. A survey of every route, ford and harbour costs a season of work by engineers the army would rather keep, but no road can be built without it."
 ECH_wd_roads_f_crossroads:0 "Grade the District F Crossroads"
 ECH_wd_roads_f_crossroads_desc:0 "District F is landlocked, part plain and part hill, and touches five of the other districts, so nearly every overland journey across the country passes through it on dirt. Grading its central crossroads and gravelling the approaches is cheap engineering with an outsized effect. The district also borders Central Sotoa, and its customs huts have never had a paved approach."
 ECH_wd_roads_d_causeway:0 "Causeways Across the D Marshes"
 ECH_wd_roads_d_causeway_desc:0 "District D is half marsh and half plain, and its coastal villages travel by boat because carts sink. Raised causeways between the harbour and the plain villages turn a three-day trip into an afternoon. Causeways cost a great deal per kilometre and flood in the worst seasons, but they are the first road the district has ever had."
 ECH_wd_roads_g_plains:0 "A Plains Road Through District G"
 ECH_wd_roads_g_plains_desc:0 "District G is open plain and low hills along the coast, facing Sotoa across a frontier of fields. Its farms sell to whichever buyer can reach them, which is usually a foreign one. A graded plains road from its coast to the capital district brings its produce into the national market and gives the government a reason to be seen there."
 ECH_wd_roads_coast_highway:0 "One Highway Along the Coast"
 ECH_wd_roads_coast_highway_desc:0 "The first answer to the road budget is a coastal highway linking the port districts in one chain, from the jungle coast of District A to the plains of District G. It serves the harbours, the fishing towns and the coaster trade. It also leaves the interior on dirt tracks for another decade, and the capital district complains loudly."
 ECH_wd_roads_interior_rail:0 "Rails Through the Interior"
 ECH_wd_roads_interior_rail_desc:0 "The second answer runs a railway from the main port in District E through the District F crossroads to the desert capital, carrying fuel, ore and equipment overland. Rail suits the sustainment mission and the rolling stock the army already holds. It costs more than any road, it serves fewer towns, and the coastal districts see none of it."
 ECH_wd_roads_highway_bridges:0 "Bridges for the Coast Highway"
 ECH_wd_roads_highway_bridges_desc:0 "The coast highway crosses every creek and estuary between the port districts, and ferries still carry trucks over the widest of them. Replacing the ferries with low bridges in District D and District G closes the last gaps. Engineers warn that storm surges will test every span, so the bridge office spends on deep foundations rather than length."
 ECH_wd_roads_rail_spur:0 "A Spur to the Capital Silo"
 ECH_wd_roads_rail_spur_desc:0 "The interior line ends in the capital district, where the national fuel silo and the only air base stand. A short spur straight into the silo yard lets tank wagons unload without trucks. The railway also opens a locomotive workshop that trains the first generation of national rail mechanics. The spur costs little; the workshop costs a great deal."
 ECH_wd_roads_logistics_link:0 "Link the Two Logistics Centres"
 ECH_wd_roads_logistics_link_desc:0 "The logistics centres in District A and District B were built to supply garrisons, not each other, and freight between them still goes by sea. Paving the roads that lead out of both, whatever shape the main network takes, joins the two oldest industrial districts by land. It is mostly gravel and culverts, and it ends a quiet rivalry between their depot chiefs."
 ECH_wd_roads_works_councils:0 "Works Councils in Every District"
 ECH_wd_roads_works_councils_desc:0 "With a skeleton network finally in place, each district receives a standing works council with its own road budget and a duty to maintain what was built. Maintenance is the dull half of every road programme and the half most governments forget. The councils argue with the capital over money every year, but potholes now have an owner."
 ECH_wd_roads_votes:0 "Road Votes in the Districts"
 ECH_wd_roads_votes_desc:0 "Under the elected council, each district votes on its next road project from a list the engineers have costed. Turnout is low and the campaigns are fierce, especially in District F, where every village wants the next junction. The votes slow the programme for a season and leave every finished road with a constituency that defends its upkeep."
 ECH_wd_roads_tenders:0 "Road Contracts by Open Tender"
 ECH_wd_roads_tenders_desc:0 "The services board puts every road contract out to public tender, with the price, the winner and the engineer's inspection report printed in the official gazette. Contractors with friends in the old ministries lose work to cheaper firms from the coastal districts. Roads get built faster and slightly worse, and the board publishes that too."
 ECH_wd_roads_brigades:0 "Movement Labour Brigades"
 ECH_wd_roads_brigades_desc:0 "The People's State raises labour brigades of young movement members to grade roads on fixed quotas, housed in camps along the routes. The brigades are fast, cheap and loud with slogans. Their roads are rougher than an engineer would accept, and farmers whose fields are crossed without compensation remember who sent the brigades."
 ECH_wd_coast_cargoes:0 "Count the Coaster Cargoes"
 ECH_wd_coast_cargoes_desc:0 "Echinata moves more of its freight by sea than by land, on a fleet of coasters, lighters and small tankers that call at every district harbour. Nobody has counted what they carry, who owns them or how old they are. A full count costs the harbour offices a year of paperwork and tells the government whether its coastal service is a fleet or a museum."
 ECH_wd_coast_e_yards:0 "Overhaul the District E Yards"
 ECH_wd_coast_e_yards_desc:0 "The main naval base in District E holds the country's only shipyards: two slipways working at half pace with machine tools older than their crews. Overhauling them and adding a third slip lets the yards keep the coaster fleet and the escorts working at once. The money comes out of the plant budget, and the inland districts notice."
 ECH_wd_coast_pilots:0 "Pilots for the Marsh Harbour"
 ECH_wd_coast_pilots_desc:0 "The District D harbour sits behind shifting mudbanks that only local pilots know, and half of them are close to retirement. A pilot service with apprentices, charts and paid stations keeps the marsh coast open to the coasters and to the navy's escorts. It is a small investment in people rather than steel, and it pays only if the harbour stays busy."
 ECH_wd_coast_state_line:0 "A State Coastal Line"
 ECH_wd_coast_state_line_desc:0 "The government buys out the ageing private coasters and runs them as one state line on fixed timetables between every district harbour. Freight costs become predictable, the yards gain steady orders and the navy can requisition hulls in a crisis. The line will lose money in its first years, and owners who sold to it will lobby against it for decades."
 ECH_wd_coast_licensed:0 "License the Private Coasters"
 ECH_wd_coast_licensed_desc:0 "The alternative keeps the coasters private but licenses them, setting safety rules, insurance minimums and a duty to carry state freight at agreed rates. Owners keep their profits and their freedom to trade abroad, and the treasury pays nothing up front. The coast stays served by whoever finds it profitable, which leaves the poorest harbours waiting longest."
 ECH_wd_coast_escorts:0 "Three Escorts, One Coastline"
 ECH_wd_coast_escorts_desc:0 "The navy has three escorts to guard a coastline that runs past five districts, and its doctrine already assumes it will never meet a battle fleet. Concentrating the escorts on convoy duty, with fixed patrol boxes off the main harbours, turns the fleet's weakness into a routine. The admirals lose their dream of cruisers, and the coasters gain a predictable guard."
 ECH_wd_coast_d_slipway:0 "A Slipway in District D"
 ECH_wd_coast_d_slipway_desc:0 "The state line needs a second repair yard closer to the marsh harbour, so that its coasters stop sailing to District E for every refit. A slipway and workshop beside the District D naval base costs the line a year of profits. It also brings the first industrial wages the district has ever seen, which the line advertises heavily."
 ECH_wd_coast_g_slips:0 "Private Slips on the G Coast"
 ECH_wd_coast_g_slips_desc:0 "Licensed owners pool their money for a repair yard on the District G coast, near the farms that fill their holds. The government offers the land and a tax holiday in exchange for a duty to repair the escorts at cost. The yard is small and privately run, and it gives the plains coast its first industrial anchor."
 ECH_wd_coast_convoy_code:0 "A Code for Coastal Convoys"
 ECH_wd_coast_convoy_code_desc:0 "Every coaster master, state or private, receives the same signal book, the same convoy rules and the same radio frequencies as the escorts. Night drills off the main port teach merchant crews to keep station without lights. It costs little but time, and in any future crisis the navy and the merchant fleet will already speak one language."
 ECH_wd_coast_anchorage_radar:0 "Radar Over the Main Anchorage"
 ECH_wd_coast_anchorage_radar_desc:0 "The anchorage at the District E base has no radar beyond what the escorts carry, so ships approaching at night are seen only when they are close. A shore radar on the headland gives the harbour command hours of warning and a picture of coastal traffic. It is the first permanent sensor on the coast, and the air staff wants its feed too."
 ECH_wd_plants_full:0 "No Free Floor in the Plant Districts"
 ECH_wd_plants_full_desc:0 "Every plant Echinata owns stands in the capital district, District A or District B, and each of those districts has filled its industrial land. New machinery can only replace old machinery there, and the other four districts have no plants at all. Admitting that growth must happen elsewhere is the first step, and the established plant towns hate hearing it."
 ECH_wd_plants_grants:0 "Grants to Build Beyond the Three"
 ECH_wd_plants_grants_desc:0 "A dispersal fund offers cheap credit and free land to any firm that builds outside the three plant districts. Managers grumble about moving away from the old logistics centres, and the fund draws money from the established towns. In exchange the country gains new industrial towns, which are also harder to stop with a single strike or disaster."
 ECH_wd_plants_f_works:0 "A Works Town at the Crossroads"
 ECH_wd_plants_f_works_desc:0 "District F sits at the junction of every overland route, which makes it the natural home of the first new works town. Its land is cheap, its hills give shelter and its people need wages. The first plant there makes pumps, pipes and truck parts for the rest of the country, though everything it needs still arrives over unfinished roads."
 ECH_wd_plants_e_shops:0 "Machine Shops Beside the E Yards"
 ECH_wd_plants_e_shops_desc:0 "The main port district has shipyards but no machine shops, so every part the yards need is ordered from the capital and shipped back down the coast. A machine shop beside the yards cuts that journey to the length of a street. It takes the last free industrial land at the port, which the harbour masters had hoped to keep for warehouses."
 ECH_wd_plants_d_works:0 "Workshops for the Marsh Coast"
 ECH_wd_plants_d_works_desc:0 "District D has a naval base, a harbour and almost nothing else. A cluster of workshops making nets, small engines and boat fittings for the coasters gives the marsh villages wages that do not depend on the season. The workshops are modest and slow to pay back, but they are the first step towards District D sharing in the national economy."
 ECH_wd_plants_refining:0 "Refinery Towns"
 ECH_wd_plants_refining_desc:0 "Oil comes out of the ground in all three plant districts and leaves the country mostly as crude. The refining model builds small refineries near the wells and in the new works towns, so that Echinata exports fuel rather than crude and keeps the margin. Refineries are dirty, slow to build and exposed to price swings, and they make the country a fuel seller."
 ECH_wd_plants_metals:0 "Light Metals from Local Ore"
 ECH_wd_plants_metals_desc:0 "Aluminium ore and steel are mined beside the oil, and both leave the country unworked. The light-metals model puts the credit into smelting and rolling, feeding the yards, the truck lines and eventually aircraft repair. Smelters swallow electricity and skilled workers, and the payoff takes most of a decade, but the metal stays at home."
 ECH_wd_plants_highway_plant:0 "Plants Along the New Highway"
 ECH_wd_plants_highway_plant_desc:0 "With the coast highway open, firms can build along it and ship by road or by sea. The dispersal fund pays for a plant on the District G coast where the highway meets the farmland. It is cheaper than building inland because materials arrive by coaster, and it ties a frontier district to the national economy."
 ECH_wd_plants_railhead:0 "A Plant at the Railhead"
 ECH_wd_plants_railhead_desc:0 "The interior line brings fuel, ore and machines to the District F crossroads by the trainload. A second plant beside the railhead uses that advantage to assemble trucks and rolling stock for the line itself. Railway towns grow fast and loud, and this one will need housing, schools and a police post the district never budgeted for."
 ECH_wd_plants_exports:0 "Finished Goods for Export"
 ECH_wd_plants_exports_desc:0 "The trade law already favours exports, but the country exports crude and ore. Contracts for finished goods, refined fuel or rolled metal depending on the model chosen, earn foreign currency at better margins. Buyers demand quality checks the plants have never had to pass, so the first contracts arrive with inspectors and penalty clauses."
 ECH_wd_sus_count:0 "Count Every Spare Part"
 ECH_wd_sus_count_desc:0 "The army, the navy and the air wing all report shortages of parts that turn out to be sitting in another service's depot. A national registry of every spare part, engine and tyre held anywhere in the country costs months of inventory work. It reveals what the services really own and makes the case for sustainment as one national programme rather than three quarrels."
 ECH_wd_sus_depots:0 "Depot Workshops in Each District"
 ECH_wd_sus_depots_desc:0 "Equipment that breaks in District G is hauled to the capital for repair, because no other district has a workshop able to do the job. A depot workshop in each district, staffed by technicians from the services, keeps trucks, boats and radios working where they are. It adds a payroll the treasury did not plan for and saves many long journeys."
 ECH_wd_sus_one_pattern:0 "One Pattern for Every Part"
 ECH_wd_sus_one_pattern_desc:0 "The standardising school wants one approved pattern for every common part: one truck, one radio and one engine family across the services. Home plants could then make the parts in long runs, and mechanics would learn a single system. Standardisation costs years of procurement discipline and offends every service that likes its own equipment."
 ECH_wd_sus_any_maker:0 "Buy From Any Maker"
 ECH_wd_sus_any_maker_desc:0 "The pragmatic school argues that a small country cannot dictate patterns to the world's manufacturers. It would buy whatever is cheapest and available, and keep a catalogue of interchangeable parts from many makers. The services get equipment faster and cheaper, at the price of mechanics who must know a dozen systems."
 ECH_wd_sus_college:0 "A College for Service Engineers"
 ECH_wd_sus_college_desc:0 "Echinata has mechanics but few engineers who can redesign a part, test a substitute or certify a repair. A service engineering college attached to the capital's plants trains them for all three services and the civil depots. It takes a decade to repay its cost, and its first graduates are quickly hired away by exporters."
 ECH_wd_sus_truck_parks:0 "Rebuild the Truck Parks"
 ECH_wd_sus_truck_parks_desc:0 "The army keeps its trucks in open parks where half of them wait for parts and the rest wait for drivers. Rebuilding the parks with covered sheds, fuel points and a dedicated repair line returns most of the fleet to service. Drivers and mechanics are scarce in a volunteer army, so the parks also become the army's first trade school."
 ECH_wd_sus_silo:0 "Keep the Capital Silo Full"
 ECH_wd_sus_silo_desc:0 "The single fuel silo in the capital district is the reserve for the trucks, the aircraft and the escorts, and it is rarely more than half full. A standing rule obliges the state oil buyers to refill it before any export cargo is loaded. Exporters lose some sales in tight months, while the services finally gain the fuel to train and move."
 ECH_wd_sus_home_lines:0 "Home Lines for Standard Parts"
 ECH_wd_sus_home_lines_desc:0 "With the patterns fixed, the plants in the three industrial districts retool lines to make spares in long runs instead of single batches. Domestic supply replaces many imports, and lead times fall from months to weeks. The retooling interrupts normal production for a season and binds the services to the chosen patterns for years."
 ECH_wd_sus_equivalents:0 "A Catalogue of Equivalents"
 ECH_wd_sus_equivalents_desc:0 "Buying from many makers only works if mechanics know which foreign part fits which machine. A central catalogue of tested equivalents, updated every quarter and copied to every depot, turns a jumble of suppliers into a usable market. Testing costs money and the occasional ruined engine, but it ends a great deal of guesswork."
 ECH_wd_army_returns:0 "The Battalion Returns"
 ECH_wd_army_returns_desc:0 "The army is six volunteer battalions spread across three land frontiers and five coastal districts, and its returns are years out of date. A full return of soldiers, weapons, trucks and training records shows what the battalions can really do. The answer is unflattering, but it ends the habit of planning with units that exist only on paper."
 ECH_wd_army_frontiers:0 "Three Frontiers, Six Battalions"
 ECH_wd_army_frontiers_desc:0 "Echinata borders Central Sotoa, Echea and Sotoa, and its frontiers cross desert, hills and plain where customs huts are the only sign of the state. Assigning each battalion a frontier sector, with a passable road to its post, gives the army a map of its duties. It changes no claim on either side, and it leaves the coast almost unguarded."
 ECH_wd_army_rifles:0 "Frontier Rifle Companies"
 ECH_wd_army_rifles_desc:0 "The first school would split the battalions into rifle companies living at the frontier posts, knowing every ford and hill. They would hold ground and watch the crossings without needing trucks or fuel. Companies tied to one post are hard to move in a crisis elsewhere, and soldiers posted for years in the desert tend to leave the army."
 ECH_wd_army_motor:0 "A Motor Reserve at the Capital"
 ECH_wd_army_motor_desc:0 "The second school keeps most of the army in a motorised reserve in the capital district, using the trucks already in stock, with only observation posts at the frontiers. The reserve can reach any district within days if the roads hold. It burns fuel the country could export, and it leaves the frontiers watched rather than held."
 ECH_wd_army_guns:0 "More Guns per Battalion"
 ECH_wd_army_guns_desc:0 "The army's doctrine already favours firepower over manpower, which suits a country with few soldiers. Turning that preference into practice means more guns per battalion, live-fire training and an artillery school. Shells are expensive, so every exercise becomes a budget argument, but a small army that hits hard is taken seriously."
 ECH_wd_army_hills:0 "Mountain Drill in District B"
 ECH_wd_army_hills_desc:0 "District B and District F hold the only mountains and hills in the country, and the army keeps mountaineering instructors on its books with little use for them. A season of mountain drill in District B each year teaches rope work, hill gunnery and night marches. The drill is cheap and popular with recruits, and hard on the old trucks."
 ECH_wd_army_sotoa_posts:0 "Posts on the Sotoa Frontier"
 ECH_wd_army_sotoa_posts_desc:0 "The rifle companies on the District G frontier with Sotoa live in tents and rented farmhouses. Permanent posts with barracks, wells and a road to the coast make the posting bearable. The posts claim nothing beyond the line and coordinate openly with the customs service, but they make the frontier a place where the state actually lives."
 ECH_wd_army_motor_depot:0 "A Motor Depot for the Reserve"
 ECH_wd_army_motor_depot_desc:0 "A reserve that moves by truck needs its own workshops, fuel and spares close at hand. A motor depot with a small assembly line at the District F crossroads, a day's drive from every district, refurbishes trucks and makes spare parts for the reserve. It takes industrial land the works town wanted, and the reserve's fuel bill rises again."
 ECH_wd_army_reserve_law:0 "A Volunteer Reserve Law"
 ECH_wd_army_reserve_law_desc:0 "Every soldier who leaves the battalions is lost to the army the day the kit is handed in. A reserve law keeps former volunteers on a register with a yearly fortnight of training and a modest retainer. The reserve costs a steady sum each year and gives a small army a second line it could not otherwise afford."
 ECH_wd_air_runway:0 "One Runway for Seven Districts"
 ECH_wd_air_runway_desc:0 "The air wing flies its fighters and support aircraft from a single base in the desert capital district, far from the coast it is meant to protect. Every patrol over District D or District G spends most of its fuel getting there. Reviewing the wing's basing costs nothing but pride, and it opens a long argument about where aircraft belong."
 ECH_wd_air_port_field:0 "A Field Beside the Main Port"
 ECH_wd_air_port_field_desc:0 "A second air base beside the District E naval base puts aircraft within minutes of the main anchorage and the busiest coastal lanes. Land is found on the plain behind the port, and the runway is laid in a season. The capital loses its monopoly on the air wing, and the navy gains neighbours it must learn to share fuel with."
 ECH_wd_air_patrol:0 "Coast Patrol Squadrons"
 ECH_wd_air_patrol_desc:0 "One answer reshapes the air wing around the sea: support aircraft and fighters trained to find ships, escort convoys and cover the coasters. Patrol work is long, dull and hard on airframes, and it suits a navy built to stay in being rather than to fight. The capital's skies would be guarded by radar and little else."
 ECH_wd_air_intercept:0 "Interceptors for the Capital"
 ECH_wd_air_intercept_desc:0 "The other answer keeps the fighters at home, quick to climb and close to the capital, the silo and the plant districts they protect. Interception needs radar, fast alerts and well-trained pilots rather than long-range endurance. The coast would see the wing's aircraft only when an emergency justified the fuel."
 ECH_wd_air_frontier_radar:0 "Radar on the District B Hills"
 ECH_wd_air_frontier_radar_desc:0 "The hills of District B look over the frontiers with Central Sotoa and Echea, and a radar there sees further than any post in the desert. The station gives the air wing early warning on the land approaches and some coverage of the coast. Its technicians complain that the hills have no road worth the name."
 ECH_wd_air_engine_pool:0 "One Engine Pool for the Wing"
 ECH_wd_air_engine_pool_desc:0 "With standard patterns adopted across the services, the air wing pools its engines in one rotation, overhauled in one shop. Aircraft spend fewer days grounded waiting for parts, and mechanics specialise. The pool is efficient and fragile, because one bad batch of engines can ground the whole wing at once."
 ECH_wd_air_two_shops:0 "Two Shops for Two Engines"
 ECH_wd_air_two_shops_desc:0 "Buying from many makers left the wing with two engine families and no shared tooling. Rather than force one out, the wing adds a second maintenance shop and hardstands at the capital base, each shop keeping one family. Duplication costs money, but it means no single fault can ground every aircraft at the same time."
 ECH_wd_air_aggressors:0 "Contract Aggressor Instructors"
 ECH_wd_air_aggressors_desc:0 "Former top pilots of the Belkan Air Force now work for various countries as aggressor squadrons, and the air staff asks whether Echinata should hire such instructors. A contract would bring hard training against experienced adversaries. The price is high and the instructors bring their own loyalties, so any contract is short and closely supervised."
 ECH_wd_sky_notice:0 "Read the Astronomers' Notice"
 ECH_wd_sky_notice_desc:0 "The International Astronomical Union warns that the asteroid Ulysses will pass close to the Earth with a chance of impact. Echinata has no observatory of its own and learns everything from foreign bulletins. A small bureau to translate, check and publish those bulletins costs little, and it gives the public one source instead of a hundred rumours."
 ECH_wd_sky_stores:0 "Grain and Fuel in Every District"
 ECH_wd_sky_stores_desc:0 "If the worst forecasts come true, roads may close and harbours may silt, and every district will need to feed itself for weeks. A stockpile of grain, medicine and fuel in each district costs a great deal to fill and keep. It is also the most visible thing the government can do, and visibility is what frightened people ask for."
 ECH_wd_sky_scatter:0 "Scatter the Stores to the Towns"
 ECH_wd_sky_scatter_desc:0 "One school would scatter the reserves into every town hall and harbour shed, so that nothing depends on a single depot. Dispersal means more theft, more spoilage and more clerks to count it all. It also means that a town cut off from the capital can still feed itself, which matters most in the roadless districts."
 ECH_wd_sky_vault:0 "One Deep Vault in the Desert"
 ECH_wd_sky_vault_desc:0 "The other school would dig one deep, guarded vault in the desert of the capital district, holding the national reserve under a single command. One vault is cheaper, easier to guard and harder to steal from. Its contents reach the coast only if the roads and the coasters still work when they are needed."
 ECH_wd_sky_shelters:0 "Shelters Beneath the Capital Centre"
 ECH_wd_sky_shelters_desc:0 "Once the FCU announces that Ulysses will strike the Earth, the capital centre begins digging public shelters beneath its squares and government buildings. Engineers reinforce cellars, stock them and mark the routes. The work disrupts the city for years and costs a fortune, and nobody can say how much of it will be needed."
 ECH_wd_sky_wardens:0 "Wardens for the Coastal Towns"
 ECH_wd_sky_wardens_desc:0 "The coastal towns are the hardest to warn: scattered, roadless and linked mostly by radio. A corps of volunteer wardens with radios, sirens and evacuation plans gives each town a person responsible for acting when the warning comes. Wardens are unpaid and keen at first, and tired after a few years of drills."
 ECH_wd_sky_tracking:0 "Tracking Posts in the District F Hills"
 ECH_wd_sky_tracking_desc:0 "The hills of District F give a clear horizon far from coastal haze, and the bureau sets up tracking posts there with telescopes, radar and radio links to the capital. The posts confirm foreign bulletins and watch the night sky for fragments. They also give the air wing a radar picture over the interior."
 ECH_wd_sky_close_pass:0 "The Night of the Close Pass"
 ECH_wd_sky_close_pass_desc:0 "Ulysses passes through the Roche limit of the Earth, and every warning the bureau has issued since the first notice meets the night it was written for. The government must keep the districts calm, the stores open and the radio on, whatever the sky does. Every plan made in five years is tested at once."
 ECH_wd_sky_archive:0 "An Archive of the Asteroid Years"
 ECH_wd_sky_archive_desc:0 "After the pass, the bureau gathers every warning, drill record and stockpile ledger into one archive, with a frank report on what worked and what failed. The archive becomes the basis of a standing emergency service that outlives the asteroid. It costs a few clerks and the embarrassment of an honest report."
 ECH_wd_bw_rates:0 "Freight Rates in a Belkan Spring"
 ECH_wd_bw_rates_desc:0 "The Belkan War breaks out abroad, and its first effect in Echinata is on freight. Insurers raise their rates, foreign charterers bid for any hull that floats and fuel prices jump. The coaster owners sense profit, the import merchants sense ruin, and the government must decide how its shipping behaves while other nations fight."
 ECH_wd_bw_neutral:0 "Neutral Hulls Only"
 ECH_wd_bw_neutral_desc:0 "One answer forbids Echinatan hulls from carrying cargo for any belligerent and enforces the rule through the harbour offices. Neutral shipping keeps the country out of every blockade argument and clear of the war's insurers. Owners lose the most lucrative charters of the decade, and they say so loudly in the capital."
 ECH_wd_bw_charters:0 "Hulls for Hire in Wartime"
 ECH_wd_bw_charters_desc:0 "The other answer lets owners charter their ships to any buyer, belligerent or not, provided the voyage avoids declared war zones. Charter money floods into the port districts and the yards fill with refits. The country earns foreign currency, along with the lasting suspicion of whichever side loses."
 ECH_wd_bw_state_colours:0 "State Hulls Under Neutral Colours"
 ECH_wd_bw_state_colours_desc:0 "The state coastal line can serve neutral relief and trade routes under the national flag, carrying grain and medicine rather than munitions. Its masters receive strict cargo rules and a naval liaison officer on every voyage. The voyages earn little, but they establish the line abroad as an honest carrier."
 ECH_wd_bw_insurance:0 "An Insurance Pool for the Coasters"
 ECH_wd_bw_insurance_desc:0 "Private owners cannot afford the war-risk premiums foreign insurers now charge. A national insurance pool, backed by the treasury and funded by owner contributions, keeps the licensed coasters sailing. The treasury takes on a risk it cannot measure, and the owners accept rules about where they may sail."
 ECH_wd_bw_lumen:0 "After the Lumen Signing"
 ECH_wd_bw_lumen_desc:0 "A treaty is signed in Lumen and the Belkan War ends. Freight rates fall back, charters dry up and the war-risk clauses lapse. The government reviews what its shipping policy cost and earned, and decides which wartime rules should become permanent. The review, rather than the war, is what Echinata will remember."
 ECH_wd_bw_belka_won:0 "Selling to a Victorious Belka"
 ECH_wd_bw_belka_won_desc:0 "If the war ends with Belka holding its gains, the Belkan economy becomes a market that many traders are reluctant to serve. Echinatan firms can sell fuel and metal there with little competition, at the price of being remembered by the other side. The government lets the trade proceed but keeps it strictly commercial."
 ECH_wd_bw_belka_lost:0 "Contracts for the Rebuilding"
 ECH_wd_bw_belka_lost_desc:0 "If Belka loses the war, the countries recovering from it need fuel, ships and engineers for years of rebuilding. Echinatan firms bid for small contracts in fuel supply, coastal shipping and machine repair. The contracts are modest but steady, and they introduce the country's firms to buyers they had never reached."
 ECH_wd_uc_stonehenge:0 "Stonehenge in Erusean Hands"
 ECH_wd_uc_stonehenge_desc:0 "Erusea invades the neutral country of San Salvacion and seizes Stonehenge, turning its railguns into anti-air batteries. The news reaches Echinata through foreign wires and the price of fuel. A war in Usea will reshape trade routes, insurance and arms markets everywhere, and the government needs a posture before its traders choose one for it."
 ECH_wd_uc_relief:0 "Relief Voyages to Usea"
 ECH_wd_uc_relief_desc:0 "The neutral record from the Belkan years lets Echinatan hulls carry relief cargo to Usean ports under international supervision. The voyages are small, risky and widely reported. They earn the country goodwill at little cost, though the crews sail into waters where nobody fully controls the sky."
 ECH_wd_uc_charter_boom:0 "The Charter Boom Returns"
 ECH_wd_uc_charter_boom_desc:0 "Owners who chartered hulls during the Belkan War know the trade and its buyers, and the Usean war revives demand for any ship available. The government applies the old charter rules and taxes the profits for the yards. Money flows into the port districts again, along with questions about which side each cargo serves."
 ECH_wd_uc_fuel:0 "Fuel for a Wartime Market"
 ECH_wd_uc_fuel_desc:0 "The refinery towns now earn their keep. Wartime demand pushes fuel prices up, and Echinatan refined fuel finds buyers at a premium. Contracts bar sales to belligerent armed forces, a clause some buyers find ways around. The refineries run three shifts and the export ledger records the best year in its short history."
 ECH_wd_uc_metal:0 "Rolled Metal for Distant Yards"
 ECH_wd_uc_metal_desc:0 "The light-metals plants find buyers among shipbuilders and aircraft repairers in neutral countries trading with the war's participants. Rolled aluminium and steel sell at prices the smelter founders never imagined. The plants expand within their existing sites, hire every metallurgist they can find and argue about how long it will last."
 ECH_wd_uc_plains_radar:0 "An Air Watch on the Plains Coast"
 ECH_wd_uc_plains_radar_desc:0 "The war has shown how much a single air-defence complex can change a conflict, and the air staff asks where Echinata is blind. The answer is the District G coast and the Sotoa frontier. A radar station on the plains coast closes that gap, at the cost of technicians the other stations can barely spare."
 ECH_wd_uc_isaf_victory:0 "Trade After Farbanti"
 ECH_wd_uc_isaf_victory_desc:0 "If the war ends with the Erusean surrender, the Usean continent faces years of rebuilding and its shipping lanes reopen. Echinatan firms bid for coastal shipping and fuel supply contracts in the rebuilding ports. Buyers favour countries that stayed neutral or carried relief, which is where earlier choices start to pay."
 ECH_wd_uc_erusean_victory:0 "Terms with a Victorious Erusea"
 ECH_wd_uc_erusean_victory_desc:0 "If the war ends with Erusea prevailing, every Echinatan cargo bound for Usea must deal with a government that won its war and keeps what it seized. Echinata negotiates commercial terms that keep its ships trading without endorsing the conquest. It is uncomfortable diplomacy, and every camp at home will say the government conceded too much, whatever the terms actually say about tariffs, ports and fuel."
 ECH_wd_uc_review:0 "The Programme Reviewed at 2005"
 ECH_wd_uc_review_desc:0 "As the Usean war ends or settles, the government reviews the programme begun in 1991: the ballot, the roads, the coast, the plants and the sustainment service. The review costs a season of hearings and frank reports from every district. What it records will shape the decisions of the next fifteen years."
 ECH_wd_uc_review_tt_1:0 "Closes the 1991 to 2005 programme; later eras are not yet written."
 ac_wd_ech_tree:0 "Echinata: National Programme"
 ac_wd_ech_tree_desc:0 "The national focus programme of Echinata, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 ECH_wd_orders_review:0 "Orders Under Review"
 ECH_wd_orders_review_desc:0 "The emergency orders that suspend elections are being read and argued in public for the first time."
 ECH_wd_ballot_calendar:0 "A Date on the Calendar"
 ECH_wd_ballot_calendar_desc:0 "An election date is fixed and the party lists are open again."
 ECH_wd_service_mandate:0 "The Services Mandate"
 ECH_wd_service_mandate_desc:0 "The service chiefs govern openly and publish their accounts."
 ECH_wd_square_pledge:0 "Pledge of the Square"
 ECH_wd_square_pledge_desc:0 "The national movement holds the initiative in the streets and the ministries."
 ECH_wd_open_chamber:0 "The Open Chamber"
 ECH_wd_open_chamber_desc:0 "An elected chamber the coastal districts helped to choose, sitting in public."
 ECH_wd_graded_service:0 "Graded Public Service"
 ECH_wd_graded_service_desc:0 "Every post is filled by examination and a published service record."
 ECH_wd_state_discipline:0 "Discipline of the People's State"
 ECH_wd_state_discipline_desc:0 "Wardens on every block and quotas in every plant."
 ECH_wd_settled_administration:0 "The Ordinary Statute"
 ECH_wd_settled_administration_desc:0 "An ordinary law on public emergencies replaces the 1991 orders."
 ECH_wd_survey_crews:0 "Survey Crews in the Field"
 ECH_wd_survey_crews_desc:0 "Engineers map every route, ford and harbour in the seven districts."
 ECH_wd_coast_road_board:0 "The Coast Road Board"
 ECH_wd_coast_road_board_desc:0 "One board builds and keeps the highway that joins the port districts."
 ECH_wd_interior_rail_office:0 "The Interior Rail Office"
 ECH_wd_interior_rail_office_desc:0 "A rail office runs the line from the main port to the desert capital."
 ECH_wd_works_councils:0 "District Works Councils"
 ECH_wd_works_councils_desc:0 "Each district owns the upkeep of the roads it was given."
 ECH_wd_road_votes:0 "Road Votes"
 ECH_wd_road_votes_desc:0 "District voters choose the next road project from a published list."
 ECH_wd_open_tenders:0 "Open Road Tenders"
 ECH_wd_open_tenders_desc:0 "Every road contract is tendered in public and awarded on price and record."
 ECH_wd_labour_brigades:0 "Labour Brigades"
 ECH_wd_labour_brigades_desc:0 "Movement brigades grade roads on fixed quotas."
 ECH_wd_coaster_lines:0 "The Coaster Lines"
 ECH_wd_coaster_lines_desc:0 "Old coasters, lighters and small tankers carry most freight between the districts."
 ECH_wd_state_line:0 "The State Coastal Line"
 ECH_wd_state_line_desc:0 "One state line runs every district harbour on a fixed timetable."
 ECH_wd_licensed_carriers:0 "Licensed Coastal Carriers"
 ECH_wd_licensed_carriers_desc:0 "Private coasters trade under licence and carry state freight at set rates."
 ECH_wd_harbour_pilots:0 "The Pilot Service"
 ECH_wd_harbour_pilots_desc:0 "Paid pilots and apprentices keep the marsh harbour open."
 ECH_wd_escort_screen:0 "The Convoy Escort Screen"
 ECH_wd_escort_screen_desc:0 "Three escorts kept on convoy duty in fixed patrol boxes."
 ECH_wd_convoy_code:0 "The Coastal Convoy Code"
 ECH_wd_convoy_code_desc:0 "Merchant masters and escorts share one signal book and one set of rules."
 ECH_wd_winter_convoy:0 "Winter Convoy at Sea"
 ECH_wd_winter_convoy_desc:0 "The escorts shepherd the coasters through the stormy months."
 ECH_wd_full_floors:0 "Full Plant Floors"
 ECH_wd_full_floors_desc:0 "The three plant districts have no industrial land left to build on."
 ECH_wd_dispersal_grants:0 "Dispersal Grants"
 ECH_wd_dispersal_grants_desc:0 "Cheap credit and free land for plants built outside the old plant districts."
 ECH_wd_refinery_towns:0 "Refinery Towns"
 ECH_wd_refinery_towns_desc:0 "Small refineries near the wells turn crude into exported fuel."
 ECH_wd_light_metals:0 "Home Light Metals"
 ECH_wd_light_metals_desc:0 "Local aluminium and steel are smelted and rolled at home."
 ECH_wd_export_ledger:0 "The Export Ledger"
 ECH_wd_export_ledger_desc:0 "Finished goods sold abroad under inspected contracts."
 ECH_wd_parts_registry:0 "The Parts Registry"
 ECH_wd_parts_registry_desc:0 "One register of every spare part held by any service."
 ECH_wd_depot_workshops:0 "District Depot Workshops"
 ECH_wd_depot_workshops_desc:0 "A repair workshop in every district, staffed from the services."
 ECH_wd_standard_patterns:0 "Standard Patterns"
 ECH_wd_standard_patterns_desc:0 "One approved pattern for every common part across the services."
 ECH_wd_open_suppliers:0 "Open Suppliers"
 ECH_wd_open_suppliers_desc:0 "Equipment bought from whichever maker is cheapest and quickest."
 ECH_wd_service_college:0 "The Service Engineering College"
 ECH_wd_service_college_desc:0 "Engineers trained to redesign, test and certify parts."
 ECH_wd_truck_parks:0 "Rebuilt Truck Parks"
 ECH_wd_truck_parks_desc:0 "Covered parks, fuel points and a repair line for the army trucks."
 ECH_wd_silo_reserve:0 "The Silo Reserve Rule"
 ECH_wd_silo_reserve_desc:0 "The capital silo is refilled before any export cargo is loaded."
 ECH_wd_long_runs:0 "Long Production Runs"
 ECH_wd_long_runs_desc:0 "Home lines make standard spares in long runs."
 ECH_wd_parts_catalogue:0 "Catalogue of Equivalents"
 ECH_wd_parts_catalogue_desc:0 "A tested list of which foreign part fits which machine."
 ECH_wd_parts_amnesty:0 "Parts Amnesty"
 ECH_wd_parts_amnesty_desc:0 "Hoarded spares may be returned to the depots without penalty."
 ECH_wd_battalion_rolls:0 "The Battalion Rolls"
 ECH_wd_battalion_rolls_desc:0 "An honest return of six volunteer battalions."
 ECH_wd_frontier_rifles:0 "Rifles at the Posts"
 ECH_wd_frontier_rifles_desc:0 "Rifle companies live at the frontier posts and know every ford."
 ECH_wd_truck_reserve:0 "The Motor Reserve"
 ECH_wd_truck_reserve_desc:0 "Most of the army waits in the capital district, ready to drive."
 ECH_wd_gun_doctrine:0 "The Gunnery Creed"
 ECH_wd_gun_doctrine_desc:0 "More guns per battalion and live fire in every exercise."
 ECH_wd_hill_drill:0 "Mountain Drill Season"
 ECH_wd_hill_drill_desc:0 "A season of rope work and hill gunnery in District B."
 ECH_wd_reserve_law:0 "The Volunteer Reserve"
 ECH_wd_reserve_law_desc:0 "Former volunteers kept on a register with a yearly fortnight of training."
 ECH_wd_desert_wing:0 "The Desert Wing"
 ECH_wd_desert_wing_desc:0 "Every aircraft flies from one base in the capital district."
 ECH_wd_coast_patrol:0 "Coast Patrol Wing"
 ECH_wd_coast_patrol_desc:0 "Aircraft trained to find ships and cover the coasters."
 ECH_wd_interceptor_screen:0 "Capital Interceptor Screen"
 ECH_wd_interceptor_screen_desc:0 "Fighters kept close to the capital, the silo and the plants."
 ECH_wd_engine_pool:0 "The Engine Pool"
 ECH_wd_engine_pool_desc:0 "One rotation of standard engines overhauled in one shop."
 ECH_wd_aggressor_lessons:0 "Aggressor Lessons"
 ECH_wd_aggressor_lessons_desc:0 "Contract instructors fly as adversaries against the wing."
 ECH_wd_skywatch_bureau:0 "The Skywatch Bureau"
 ECH_wd_skywatch_bureau_desc:0 "One office translates, checks and publishes foreign asteroid bulletins."
 ECH_wd_district_stores:0 "District Stores"
 ECH_wd_district_stores_desc:0 "Grain, medicine and fuel held in every district."
 ECH_wd_scattered_stores:0 "Stores in Every Town"
 ECH_wd_scattered_stores_desc:0 "Reserves kept in town halls and harbour sheds across the country."
 ECH_wd_capital_vault:0 "The Desert Vault"
 ECH_wd_capital_vault_desc:0 "One deep, guarded vault holds the national reserve."
 ECH_wd_capital_shelters:0 "Capital Shelters"
 ECH_wd_capital_shelters_desc:0 "Public shelters beneath the squares of the capital centre."
 ECH_wd_district_wardens:0 "Coastal Wardens"
 ECH_wd_district_wardens_desc:0 "Volunteer wardens with radios and sirens in every coastal town."
 ECH_wd_emergency_service:0 "The Emergency Service"
 ECH_wd_emergency_service_desc:0 "A standing emergency service built on the asteroid archive."
 ECH_wd_drill_readiness:0 "Siren Drill Readiness"
 ECH_wd_drill_readiness_desc:0 "Every district has just rehearsed its sirens and shelters."
 ECH_wd_war_rates:0 "War-Risk Freight"
 ECH_wd_war_rates_desc:0 "Foreign charterers bid high for any hull while insurers add war clauses."
 ECH_wd_neutral_hulls:0 "Neutral Hulls"
 ECH_wd_neutral_hulls_desc:0 "No Echinatan hull carries cargo for a belligerent."
 ECH_wd_wartime_charters:0 "Wartime Charters"
 ECH_wd_wartime_charters_desc:0 "Owners charter hulls to any buyer outside declared war zones."
 ECH_wd_neutral_voyages:0 "Voyages Under Neutral Colours"
 ECH_wd_neutral_voyages_desc:0 "State hulls carry grain and medicine on neutral routes."
 ECH_wd_insurance_pool:0 "The Coaster Insurance Pool"
 ECH_wd_insurance_pool_desc:0 "A treasury-backed pool insures private coasters against war risk."
 ECH_wd_belkan_market:0 "A Belkan Market"
 ECH_wd_belkan_market_desc:0 "Commercial sales of fuel and metal to postwar Belka."
 ECH_wd_rebuild_contracts:0 "Rebuilding Contracts"
 ECH_wd_rebuild_contracts_desc:0 "Small, steady contracts for fuel, shipping and repair after the war."
 ECH_wd_usean_watch:0 "Watching the Usean War"
 ECH_wd_usean_watch_desc:0 "Analysts follow the war for its effect on trade, fuel and the air."
 ECH_wd_relief_record:0 "A Record of Relief Voyages"
 ECH_wd_relief_record_desc:0 "Relief cargoes carried under supervision earn goodwill abroad."
 ECH_wd_charter_boom:0 "The Second Charter Boom"
 ECH_wd_charter_boom_desc:0 "Wartime charter money returns to the port districts."
 ECH_wd_fuel_windfall:0 "Wartime Fuel Premium"
 ECH_wd_fuel_windfall_desc:0 "Refined fuel sells abroad at a premium."
 ECH_wd_metal_orders:0 "Distant Metal Orders"
 ECH_wd_metal_orders_desc:0 "Rolled aluminium and steel sell to neutral yards and repair shops."
 ECH_wd_usean_rebuilding:0 "Usean Rebuilding Trade"
 ECH_wd_usean_rebuilding_desc:0 "Shipping and fuel contracts in the rebuilding Usean ports."
 ECH_wd_erusean_terms:0 "Commercial Terms with Erusea"
 ECH_wd_erusean_terms_desc:0 "Trade kept open without endorsing the conquest."
 ac_wd_ech.1.t:0 "Orders Nobody Has Read"
 ac_wd_ech.1.d:0 "The National Administration convenes in the capital centre to hear its own emergency orders read into the record. The orders were drafted in haste to suspend elections for what was meant to be a short season, and they have been renewed quietly ever since. Few ministers have read them in full. The clerk takes most of the morning, and the public gallery fills as word spreads through the city.\n\nOutside the hall the country is split almost evenly. The national movement holds the squares and claims half of every opinion count; the non-aligned establishment of service chiefs, depot managers and harbour boards claims most of the rest. The democratic club that lent the Administration its label could fit its members in the gallery. Each camp hears in the orders what it wants to hear: a lawful pause, a stolen vote or an opportunity.\n\nThe Administration cannot settle the country's future in one sitting, but it can decide what happens to the record of this one. Printing the full text will invite every camp to argue it in public. Filing it with the ministries keeps the argument quiet a while longer. Sending copies to the service chiefs and the movement's leaders at once would at least prove that nobody is being kept in the dark.\n\nProvisional gameplay."
 ac_wd_ech.1.a:0 "Print the orders in full."
 ac_wd_ech.1.b:0 "File them with the ministries."
 ac_wd_ech.1.c:0 "Send copies to every camp."
 ac_wd_ech.2.t:0 "Crowds in the Public Gallery"
 ac_wd_ech.2.d:0 "Ten days after the orders were printed, the public gallery of the capital centre is full every morning before the doors officially open. Students, dockworkers from District E and delegations from the movement's district branches queue in the heat to watch officials explain clauses they had forgotten writing. Newspapers print the orders beside cartoons, and radio stations on the coast read them aloud for listeners without a newspaper.\n\nThe crowds are mostly orderly, but the gallery has become a stage. Movement speakers time their applause, members of the democratic club heckle, and the service chiefs send junior officers to take notes. A scuffle on the third day ends with two arrests and a long argument about whether the gallery should be closed. The ministries report that their own staff are leaving work early to join the queue.\n\nThe presiding officer must set rules for the gallery before the hearings begin in earnest. Open seating keeps faith with the decision to publish and turns every hearing into theatre. Tickets drawn by lot in every district would cool the room and make the capital share its seats with the coast. Closing the gallery and broadcasting the sessions would end the crowds and the scuffles, along with the sense of being present.\n\nProvisional gameplay."
 ac_wd_ech.2.a:0 "Keep the gallery open to all."
 ac_wd_ech.2.b:0 "Draw tickets by lot in every district."
 ac_wd_ech.2.c:0 "Close the gallery and broadcast."
 ac_wd_ech.3.t:0 "Seven District Returns"
 ac_wd_ech.3.d:0 "The survey teams return to the capital with notebooks, photographs and sunburn. Three districts, the capital district, District A and District B, have graded roads, plants and logistics centres, even if the roads are older than the trucks that use them. The other four might belong to another country. District D is marsh and plain reached mostly by boat; District F is a landlocked crossroads of dirt tracks; District G has open plain and a frontier with Sotoa but no paved road.\n\nDistrict E is the exception among the four. It holds the main naval base and the only shipyards and has roads of a sort, but they serve the port rather than the country. The survey map shows a coastal state whose interior is held together mainly by habit. Freight between the two logistics centres travels by sea, and a truck from the capital to the District G coast needs most of a week in the wet season.\n\nThe engineers' report ends with two options and a warning. A coastal highway would serve the ports and the coasters; a rail line through the interior would serve the capital and the fuel silo. The country cannot afford both in this decade. The warning is that roads without maintenance last only a few seasons, and every district will ask who pays for the repairs.\n\nProvisional gameplay."
 ac_wd_ech.3.a:0 "Publish the map in every district."
 ac_wd_ech.3.b:0 "Give the report to the engineers alone."
 ac_wd_ech_3_b:0 "Give the report to the engineers alone."
 ac_wd_ech.4.t:0 "What the Coasters Carry"
 ac_wd_ech.4.d:0 "The harbour offices finish counting the coasters, lighters and small tankers that work the Echinatan coast, and the totals surprise everyone. The country has more convoy hulls than its size suggests, most of them old, privately owned and registered under a tangle of local licences. Many are older than their masters. Together they carry the bulk of the freight that moves between the seven districts.\n\nThe manifests show what the roads cannot. Fuel from the capital's wells travels by truck to the coast and then by sea to the plant districts; grain from District G sails to District A because no road goes there; machine parts leave District E for every other harbour. If the coasters stopped for a month, so would most of the economy. The navy's three escorts are all the protection they have.\n\nOwners want tax relief to replace their hulls. The navy wants the right to requisition them in a crisis. The treasury wants to know why a country with a fuel surplus pays so much to keep its shipping afloat. The ministers must decide how to present the findings: as a national asset the state must protect, or as a private trade it has neglected and must now help.\n\nProvisional gameplay."
 ac_wd_ech.4.a:0 "Call the coasters a national asset."
 ac_wd_ech.4.b:0 "Offer the owners tax relief."
 ac_wd_ech.5.t:0 "No Room on the Plant Floors"
 ac_wd_ech.5.d:0 "The industry ministry's inspectors report that every plant in the capital district, District A and District B stands on land with no room left to grow. New machinery can replace old, but no new hall can rise without demolishing a neighbourhood. The three districts hold all of the country's factories and all of its mined oil, aluminium and steel. The other four districts hold none of either.\n\nPlant managers propose to keep investing where the workforce, the logistics centres and the sidings already are, squeezing more out of each hall. Officials from the coastal districts answer that the country has concentrated its whole industry in three places, and that any shock, from a strike to a falling sky, would stop it at once. Both sides produce charts, and both sets of charts are convincing.\n\nThe cabinet has to decide which argument to back before the dispersal fund is drafted. Backing the managers means efficiency and speed now. Backing the districts means new towns, new roads and a decade of growing pains. Whatever it chooses, the export trade will keep shipping crude and ore abroad until somebody builds the plants to work them at home.\n\nProvisional gameplay."
 ac_wd_ech.5.a:0 "Back the plant managers."
 ac_wd_ech_5_a:0 "Back the plant managers."
 ac_wd_ech.5.b:0 "Back the coastal districts."
 ac_wd_ech.6.t:0 "The Inventory Comes In"
 ac_wd_ech.6.d:0 "The registry teams finish the first national inventory of spare parts, and the result is both reassuring and absurd. The country owns most of the parts its services have been begging for; they are simply in the wrong place, labelled with another service's codes. An army depot in District A holds engine parts the air wing has been importing. The naval stores in District E hold truck tyres the army has been rationing.\n\nThe inventory also shows how much equipment is waiting for repair rather than broken beyond it. Trucks, radios and boat engines sit in sheds for want of a single part or a mechanic trained to fit it. The government's research priority is physical sustainment, meaning transport that runs, worn equipment replaced and service the country can afford. On paper it already has the means. In practice it has three services that do not share.\n\nThe ministers can order the parts redistributed at once, which will anger every service that loses stock, or create a joint office to manage them, which will take a year to build. Either way the inventory has made it impossible to pretend that the shortages were caused by a lack of money alone.\n\nProvisional gameplay."
 ac_wd_ech.6.a:0 "Redistribute the parts at once."
 ac_wd_ech.6.b:0 "Build a joint parts office first."
 ac_wd_ech_6_b:0 "Build a joint parts office first."
 ac_wd_ech.7.t:0 "Six Battalions on the Roll"
 ac_wd_ech.7.d:0 "The army's first complete return in years arrives on the defence ministry's desk. Six volunteer battalions, grouped in five formations, hold three land frontiers and a long coast. Their rifles and trucks are adequate and well stored. Their soldiers are fewer than the establishment tables claim, and the shortfall is worst in the companies posted farthest from the capital district.\n\nThe returns also record what the army does well. Its firepower doctrine is taken seriously, its gunners train hard, and it holds a respectable stock of motor vehicles for a small force. Its weaknesses are distance and fuel: the frontiers with Central Sotoa, Echea and Sotoa are days apart by road, and the roads are poor. A battalion sent to the wrong frontier would arrive too late to matter.\n\nThe general staff asks the government how the army should be shaped for the decade ahead. One school wants companies living on the frontiers; another wants a mobile reserve in the capital district. First the ministers must decide whether the returns are published, so that recruits know what they are joining, or kept inside the ministry so that no neighbour gains an accurate count.\n\nProvisional gameplay."
 ac_wd_ech.7.a:0 "Publish the returns."
 ac_wd_ech.7.b:0 "Keep them inside the ministry."
 ac_wd_ech.8.t:0 "One Runway in the Desert"
 ac_wd_ech.8.d:0 "The air wing's commanders bring their basing review to the defence ministry. Every fighter and support aircraft in the country flies from one base in the capital district, in the desert interior. The base is well defended and close to the fuel silo. It is also a long flight from District D, District E and District G, the coastal districts that see most of the country's shipping.\n\nThe review records that most patrols over the coast spend more time in transit than on station, and that a fighter launched to meet an intruder over the main anchorage would arrive after the intruder had gone home. Pilots fly fewer hours than they should because fuel is dear and distances are long. The maintenance crews are excellent and few, and they all work in one place.\n\nThe commanders propose a second field near the main naval base, and they disagree about what the wing should do once it has one. The navy wants patrol aircraft; the capital wants interceptors. The ministers must decide how much the wing may spend on runways before it has settled its own doctrine, and how long they are prepared to argue with the admirals.\n\nProvisional gameplay."
 ac_wd_ech.8.a:0 "Fund the second field first."
 ac_wd_ech.8.b:0 "Settle the doctrine first."
 ac_wd_ech_8_b:0 "Settle the doctrine first."
 ac_wd_ech.9.t:0 "The Astronomers' Bulletin"
 ac_wd_ech.9.d:0 "On 10 December 1994 the International Astronomical Union announces that the asteroid Ulysses will pass close to the Earth, with a chance of impact. The news reaches Echinata as wire copy and short-wave bulletins. The country has no observatory and no space agency, and the first anxious questions arrive at the ministries before anyone there has read the bulletin in full.\n\nBy the next morning the rumours have outrun the facts. Coastal towns hear that the sea will rise; the capital hears that the desert will burn. Grain and fuel prices jump in the district markets, and the movement's newspapers ask why the government has said nothing. The harbour masters of District E report families asking about passage abroad without knowing where they intend to go.\n\nThe government decides to set up a small bureau to translate, check and publish the foreign bulletins, so that the country has one source of information. The ministers must decide how the bureau speaks: plainly and often, at the risk of feeding fear, or sparingly and only with confirmed facts, at the risk of leaving the rumours unanswered for days at a time.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1994 / 12.10 in tools/lore/chronicle.json; the Echinatan response is gameplay."
 ac_wd_ech.9.a:0 "Publish every bulletin plainly."
 ac_wd_ech.9.b:0 "Speak only on confirmed facts."
 ac_wd_ech.10.t:0 "The Night of the Pass"
 ac_wd_ech.10.d:0 "On 8 July 1999 Ulysses passes through the Roche limit of the Earth. In Echinata the government keeps every radio station on the air through the night, the wardens walk their streets and the shelters beneath the capital centre open their doors. Few people sleep. The tracking posts in the District F hills report what they can see, which is less than everyone hoped.\n\nNothing in the bureau's bulletins says where fragments will fall, and the government does not pretend to know. What it can do is keep the stores open, the coasters in harbour and the trucks fuelled. By dawn the main concern is no longer the sky but the markets, where traders want to know whether the emergency rules on prices will stay in force.\n\nThe ministers meet at first light. Keeping the emergency measures for another season would steady prices and reassure the districts, at a cost the treasury can barely carry. Lifting them at once would restore normal trade and tell the country that the government believes the worst has passed, which it cannot yet know for certain.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1999 / 07.08 in tools/lore/chronicle.json; no Echinatan damage is claimed."
 ac_wd_ech.10.a:0 "Keep the emergency measures."
 ac_wd_ech.10.b:0 "Lift them at once."
 ac_wd_ech.11.t:0 "Freight Quotes from a Distant War"
 ac_wd_ech.11.d:0 "On 25 March 1995 the Belkan War breaks out. In Echinata the first sign of it is a telex from a foreign shipbroker offering triple rates for any coaster able to cross open water. By the end of the week insurers have added war-risk clauses to every policy, fuel prices have jumped, and the harbour offices in District E are full of owners asking what the law allows them to carry.\n\nEchinata has no part in the war and no wish to acquire one. It does have a coaster fleet larger than its size suggests, a fuel surplus and a trade law that encourages selling abroad. Every one of those becomes a question overnight: who may charter Echinatan hulls, who may buy Echinatan fuel, and who will protect either if something goes wrong at sea.\n\nThe government must set a shipping policy before the owners set one for it. It can forbid service to belligerents and accept the lost income, or allow charters outside declared war zones and accept the risk to its reputation. In the meantime it can at least decide whether the harbour offices publish interim rules immediately or wait for the cabinet to agree.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25 in tools/lore/chronicle.json; the Echinatan response is gameplay."
 ac_wd_ech.11.a:0 "Publish interim rules at once."
 ac_wd_ech.11.b:0 "Wait for the cabinet."
 ac_wd_ech.12.t:0 "War News from Usea"
 ac_wd_ech.12.d:0 "In the summer of 2003 Erusea invades the neutral country of San Salvacion and seizes Stonehenge, turning its railguns into anti-air batteries. The news reaches Echinata in fragments through the wire services, and then through the markets: fuel prices rise, shipping insurers rewrite their clauses and foreign buyers begin asking about Echinatan hulls and metals.\n\nThe government has no reason to take a side and every reason to understand what the war will do to trade. The lanes that carry Echinatan exports will shift, and the countries that buy its fuel and metal will change their orders. Officials who remember the Belkan War know which questions come first: who may charter, who may buy, and who pays when a cargo is lost.\n\nThe ministers must decide how loudly to speak. A public declaration of strict neutrality would reassure traders, insurers and the coaster crews. Silence would keep every option open while the course of the war is unknown. Either way, the export ledger and the coaster owners will push the government towards the money, and the harbour offices need written rules before the first charter request reaches them.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2003 / SUMMER in tools/lore/chronicle.json; the Echinatan response is gameplay."
 ac_wd_ech.12.a:0 "Declare strict neutrality."
 ac_wd_ech.12.b:0 "Say nothing for now."
 ECH_wd_elected_council_office:0 "Elected Council of Ministers"
 ECH_wd_elected_council_office_desc:0 "A council of ministers drawn from the lists that win the restored ballot, governing collectively and answerable to an elected chamber. Provisional gameplay office with no named holder."
 ECH_wd_services_board_office:0 "Board of the National Services"
 ECH_wd_services_board_office_desc:0 "A board of senior chiefs from the ports, depots, plants and frontier commands, governing collectively under a written charter while elections stay suspended. Provisional gameplay office with no named holder."
 ECH_wd_state_executive_office:0 "Executive of the People's State"
 ECH_wd_state_executive_office_desc:0 "The executive committee of the national movement, governing collectively by decree with other parties suspended. Provisional gameplay office with no named holder."
 ac_wd_ech_decisions:0 "Echinata: National Measures"
 ac_wd_ech_decisions_desc:0 "Measures from the national programme of Echinata. Provisional gameplay unless a source ledger row says otherwise."
 ECH_wd_coaster_convoy_decision:0 "Sail the Winter Coaster Convoy"
 ECH_wd_coaster_convoy_decision_desc:0 "The escorts shepherd the coasters through the stormy months on a fixed timetable. Repeatable once a year; it costs fuel and crew rest."
 ECH_wd_causeway_works_decision:0 "Raise a Second Marsh Causeway"
 ECH_wd_causeway_works_decision_desc:0 "Engineers raise a second causeway across the District D marshes. A one-time works programme."
 ECH_wd_crossroads_plant_decision:0 "Fund a Second Crossroads Plant"
 ECH_wd_crossroads_plant_decision_desc:0 "The dispersal fund pays for another plant in the District F works town. A one-time charge on the fund."
 ECH_wd_parts_amnesty_decision:0 "Declare a Parts Amnesty"
 ECH_wd_parts_amnesty_decision_desc:0 "Units may return hoarded spares to the district depots without penalty for ninety days. Repeatable every six months; commanders resent the audits that follow."
 ECH_wd_siren_drill_decision:0 "Sound the District Sirens"
 ECH_wd_siren_drill_decision_desc:0 "Every district runs a full siren and shelter drill on the same morning. Repeatable once a year; it costs a working day."
 ECH_wd_liaison_officers_decision:0 "Exchange Frontier Liaison Officers"
 ECH_wd_liaison_officers_decision_desc:0 "The army offers liaison officers to the neighbouring frontier commands so that incidents are settled by telephone. Once only; it changes no claim."
