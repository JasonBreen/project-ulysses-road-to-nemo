l_english:
 ERU_ud_crown_and_court:0 "The Crown and the Court"
 ERU_ud_crown_and_court_desc:0 "The opening reviews closed on a question nobody in Farbanti wanted to answer aloud: who actually governs Erusea between royal audiences? The palace offices, the cabinet secretaries and the general staff each keep their own registers. Begin with an honest map of the court."
 ERU_ud_palace_chancery:0 "The Palace Chancery"
 ERU_ud_palace_chancery_desc:0 "Seven royal secretariats answer letters, sign warrants and lose each other's files. Fold them into one chancery with one register of decrees, so a signature in the palace means the same thing in every ministry."
 ERU_ud_privy_council_minutes:0 "Privy Council Minutes"
 ERU_ud_privy_council_minutes_desc:0 "The Privy Council has met for a century without a written record of what it decided or why. From this session onward a clerk sits at the end of the table, and the minutes are kept in the palace archive."
 ERU_ud_civil_list_audit:0 "Audit the Civil List"
 ERU_ud_civil_list_audit_desc:0 "The Crown's household is paid from a civil list that nobody outside the palace has read since the last succession. An audit by the treasury will not be popular at court, but it removes the cheapest argument the reformers have."
 ERU_ud_royal_progress:0 "A Royal Progress"
 ERU_ud_royal_progress_desc:0 "For the first time in a generation the monarch leaves the capital for a month, by rail and by road, to be seen in the district towns. The court calls it a progress. The provinces will call it what they see."
 ERU_ud_succession_statute:0 "The Succession Statute"
 ERU_ud_succession_statute_desc:0 "The rules of succession live in precedent, in letters patent and in the memories of three elderly courtiers. Codify them in a single statute, so that no faction can ever claim the throne is in doubt."
 ERU_ud_crown_estates_lease:0 "Lease the Crown Estates"
 ERU_ud_crown_estates_lease_desc:0 "The Crown owns farmland, forest and harbour frontage that earn almost nothing. Long leases to district cooperatives and shipping firms would fund public works without a new tax, and tie the estates' tenants to the palace's fortunes."
 ERU_ud_court_of_petitions:0 "The Court of Petitions"
 ERU_ud_court_of_petitions_desc:0 "Once a month the palace gates open to anyone with a written grievance. Clerks sort the petitions; the monarch hears a few in person. It costs an afternoon and earns a reputation for listening."
 ERU_ud_palace_archive:0 "Open the Palace Archive"
 ERU_ud_palace_archive_desc:0 "Historians and engineers have petitioned for decades to read the palace's survey records, harbour charts and old treaty files. Opening the reading room flatters the universities and costs the court nothing it still needs to hide."
 ERU_ud_crowns_question:0 "The Crown's Question"
 ERU_ud_crowns_question_desc:0 "Every review in the court ledger ends at the same place. Erusea is governed by a monarchy whose ministers answer to the palace, an officer corps that answers to itself, and a public that answers to nobody. Somebody will settle the question. Better that the Crown asks it first."
 ERU_ud_path_prerogative:0 "Rule by Prerogative"
 ERU_ud_path_prerogative_desc:0 "The Crown answers its own question: Erusea will be governed as it always has been, by royal prerogative, through ministers who serve at the palace's pleasure. The court will be modernized, not shared."
 ERU_ud_path_constitution:0 "Toward a Constitution"
 ERU_ud_path_constitution_desc:0 "The Crown answers by giving part of the answer away. A written constitution, an elected assembly and a cabinet responsible to it, with the monarchy kept above politics. Provisional gameplay: no official source describes Erusean reform before 2005."
 ERU_ud_path_regency:0 "The General Staff Steps In"
 ERU_ud_path_regency_desc:0 "The general staff answers for the Crown. Its memorandum proposes a regency council of serving officers to run the ministries as a command administration until the country is 'secure'. Provisional gameplay: an alternate-history path with no official source."
 ERU_ud_cabinet_of_secretaries:0 "A Cabinet of Secretaries"
 ERU_ud_cabinet_of_secretaries_desc:0 "Ministers become royal secretaries, appointed and dismissed by the palace and answerable to no assembly. The cabinet meets in the chancery rooms. Policy will be faster, and so will its mistakes."
 ERU_ud_decree_register:0 "The Decree Register"
 ERU_ud_decree_register_desc:0 "Every royal decree is printed in one register, numbered and dated, and posted in every district office. Rule by prerogative does not have to mean rule by rumour."
 ERU_ud_provincial_intendants:0 "Provincial Intendants"
 ERU_ud_provincial_intendants_desc:0 "Royal intendants take charge of the districts, with authority over the prefects, the police and the public works budget. The palace finally has eyes outside the capital."
 ERU_ud_court_gazette:0 "The Court Gazette"
 ERU_ud_court_gazette_desc:0 "A daily gazette, printed by the chancery, carries the decrees, the honours and the palace's view of events. The independent papers are not closed; they simply stop receiving invitations."
 ERU_ud_officers_oath:0 "The Officers' Oath"
 ERU_ud_officers_oath_desc:0 "Every officer swears a personal oath to the Crown, not to the constitution the country does not have and not to the general staff. The ceremony is old. The intent behind reviving it is not."
 ERU_ud_old_houses:0 "Patronage of the Old Houses"
 ERU_ud_old_houses_desc:0 "Govern through the old landed families, who have served the Crown in the districts for centuries and expect to be asked. They bring stability and they bring their cousins."
 ERU_ud_crown_technocrats:0 "Crown Technocrats"
 ERU_ud_crown_technocrats_desc:0 "Govern through the engineers, economists and scientists of the royal academies, appointed on merit and answerable only to the palace. The old families will be offended. The ministries will work."
 ERU_ud_palace_guard_reform:0 "Reform the Palace Guard"
 ERU_ud_palace_guard_reform_desc:0 "The palace guard is a ceremonial regiment with a modern rifle and an antique chain of command. Put it under one officer, train it for real duty and keep it outside the general staff's reach."
 ERU_ud_honours_of_the_realm:0 "Honours of the Realm"
 ERU_ud_honours_of_the_realm_desc:0 "A new order of merit for engineers, teachers, pilots and district officials. The Crown cannot pay everyone what they are worth. It can make sure they are seen."
 ERU_ud_royal_ulysses_commission:0 "The Royal Ulysses Commission"
 ERU_ud_royal_ulysses_commission_desc:0 "Central Usea has told the world that Ulysses will strike. The Crown appoints a royal commission with power to requisition, build and plan, answerable to the palace alone."
 ERU_ud_shelter_decree:0 "The Shelter Decree"
 ERU_ud_shelter_decree_desc:0 "By royal decree every district builds public shelters to a single standard, paid for by the Crown estates and the district levy. The palace will be blamed if they are not ready. It intends to be thanked."
 ERU_ud_palace_granaries:0 "The Palace Granaries"
 ERU_ud_palace_granaries_desc:0 "Buy grain in the good years, store it in royal granaries and release it when the sky falls. The palace takes custody of the national reserve, and with it the gratitude or the blame."
 ERU_ud_royal_observatory_grants:0 "Royal Observatory Grants"
 ERU_ud_royal_observatory_grants_desc:0 "Erusea cannot shoot at an asteroid, but it can watch one. Royal grants fund the observatories that will track the fragments, and give the commission its own numbers instead of borrowed ones."
 ERU_ud_loyal_regiments:0 "The Loyal Regiments"
 ERU_ud_loyal_regiments_desc:0 "A coup has broken out across Usea. Before deciding who to punish, the Crown decides who to trust: a list of regiments whose officers held to their oath, to be garrisoned near the capital."
 ERU_ud_emergency_prerogative:0 "Emergency Prerogative"
 ERU_ud_emergency_prerogative_desc:0 "For one year the Crown may legislate by decree without the formality of the Privy Council. The court calls it a precaution. The universities call it a precedent."
 ERU_ud_crown_tribunals:0 "Tribunals of the Crown"
 ERU_ud_crown_tribunals_desc:0 "Those who plotted against their oath are tried by royal tribunals sitting in closed session. Justice will be swift. Whether it will be seen as justice is another question."
 ERU_ud_royal_clemency:0 "Royal Clemency"
 ERU_ud_royal_clemency_desc:0 "The Crown pardons officers who surrender their commissions and confess, and keeps the trials for the ringleaders. Mercy from strength is still strength."
 ERU_ud_crowns_protest:0 "The Crown's Protest"
 ERU_ud_crowns_protest_desc:0 "Stonehenge is complete, eight railguns built under Central Usea's leadership on neutral soil. The palace protests that the continent's defence was decided without Erusea. Provisional gameplay: no official source records an Erusean protest."
 ERU_ud_crowns_acceptance:0 "The Crown's Acceptance"
 ERU_ud_crowns_acceptance_desc:0 "The palace welcomes Stonehenge as the continent's shield and asks only to be kept informed. It is the prudent answer, and the general staff will say the weak one. Provisional gameplay."
 ERU_ud_royal_engineering_corps:0 "The Royal Engineering Corps"
 ERU_ud_royal_engineering_corps_desc:0 "Engineers from the army, the railways and the public works ministry are gathered into one royal corps, ready to dig, shore and rebuild wherever the fragments fall."
 ERU_ud_envoys_to_the_treaty_capitals:0 "Envoys to the Treaty Capitals"
 ERU_ud_envoys_to_the_treaty_capitals_desc:0 "Royal envoys tour the capitals that built Stonehenge with one message: Erusea expects a seat when the continent's shield is discussed. They come home with polite letters."
 ERU_ud_open_the_granaries:0 "Open the Palace Granaries"
 ERU_ud_open_the_granaries_desc:0 "Ulysses has broken apart. The royal granaries open to the districts, and the palace's name is printed on every sack. Requires the reserve to have been bought in time."
 ERU_ud_crown_among_the_displaced:0 "The Crown Among the Displaced"
 ERU_ud_crown_among_the_displaced_desc:0 "The monarch visits the camps where displaced families from across the continent are arriving, and the court learns that a photograph can be worth a regiment."
 ERU_ud_royal_relief_fund:0 "The Royal Relief Fund"
 ERU_ud_royal_relief_fund_desc:0 "The Crown estates' leases, the palace's own accounts and a public subscription fill one fund for the displaced, administered by the intendants."
 ERU_ud_palace_hospital_wards:0 "The Palace Hospital Wards"
 ERU_ud_palace_hospital_wards_desc:0 "Two palace wings are turned over to the army medical service. The court complains about the noise. The wounded and the sick do not."
 ERU_ud_unbroken_crown:0 "The Unbroken Crown"
 ERU_ud_unbroken_crown_desc:0 "The decade that began with a question ends with an answer. The Crown governs, the regiments are loyal and the granaries were full when the sky fell. Whatever comes next, Erusea will face it as a kingdom."
 ERU_ud_drafting_commission:0 "Convene a Drafting Commission"
 ERU_ud_drafting_commission_desc:0 "Jurists, district notables and two palace secretaries meet to draft a constitution. Nobody agrees on anything except that the first draft must be finished before the court changes its mind."
 ERU_ud_publish_the_minutes:0 "Publish the Council Minutes"
 ERU_ud_publish_the_minutes_desc:0 "The Privy Council's new minutes are published in full. The country reads, for the first time, how it is governed, and discovers that the answer is often 'by accident'."
 ERU_ud_legalize_the_parties:0 "Legalize the Parties"
 ERU_ud_legalize_the_parties_desc:0 "The liberal clubs, the labour societies and even the monarchist leagues may organize openly, register members and stand candidates. Erusea discovers it has more opinions than it had newspapers."
 ERU_ud_free_press_law:0 "A Free Press Law"
 ERU_ud_free_press_law_desc:0 "No licence to print, no prior censorship, and a court rather than a ministry to judge libel. The court gazette loses its subsidy and gains competitors."
 ERU_ud_charter_granted:0 "A Charter Granted by the Crown"
 ERU_ud_charter_granted_desc:0 "The constitution is granted by the monarch, who keeps reserve powers over war, peace and the dissolution of the assembly. Continuity reassures the court and disappoints the clubs."
 ERU_ud_charter_written:0 "A Charter Written by Delegates"
 ERU_ud_charter_written_desc:0 "The constitution is written and ratified by elected delegates, and the monarchy accepts it. The Crown becomes a guardian of the charter rather than its author."
 ERU_ud_first_assembly_elections:0 "The First Assembly Elections"
 ERU_ud_first_assembly_elections_desc:0 "Erusea votes. Whatever the result, a cabinet responsible to the assembly takes office, and the palace becomes a constitutional monarchy. Provisional gameplay: this government change is an alternate path with no official source, and the cabinet is represented by an unnamed office."
 ERU_ud_budget_before_the_assembly:0 "The Budget Before the Assembly"
 ERU_ud_budget_before_the_assembly_desc:0 "For the first time the national budget is debated line by line in public. The army's estimates shrink; the schools' grow; everyone discovers what a district road actually costs."
 ERU_ud_civilian_defence_minister:0 "A Civilian Defence Minister"
 ERU_ud_civilian_defence_minister_desc:0 "The defence ministry is given to a civilian who answers to the assembly. The general staff keeps its maps. It loses its veto."
 ERU_ud_assembly_ulysses_committee:0 "The Assembly's Ulysses Committee"
 ERU_ud_assembly_ulysses_committee_desc:0 "Central Usea has announced that Ulysses will strike. The assembly forms a standing committee with members from every party to plan for the fragments, in public, with published numbers."
 ERU_ud_public_shelter_bill:0 "The Public Shelter Bill"
 ERU_ud_public_shelter_bill_desc:0 "A shelter in every district, built to a public standard, paid for by a levy the assembly voted for. Nobody likes the levy. Everybody wants the shelter near their own street."
 ERU_ud_invite_the_observatories:0 "Invite the Observatories"
 ERU_ud_invite_the_observatories_desc:0 "The committee invites astronomers from the neighbouring republics to share tracking data with Erusean observatories. Science, for once, is the easiest diplomacy available."
 ERU_ud_provincial_relief_boards:0 "Provincial Relief Boards"
 ERU_ud_provincial_relief_boards_desc:0 "Elected boards in every province plan evacuation routes, grain stores and field hospitals, and answer to their own voters if the plans fail."
 ERU_ud_defend_the_assembly:0 "Defend the Assembly"
 ERU_ud_defend_the_assembly_desc:0 "A coup has broken out across Usea, and some Erusean officers have read the news with interest. The assembly calls the loyal garrisons, the police and the public into the streets around the chamber."
 ERU_ud_garrison_oversight_act:0 "The Garrison Oversight Act"
 ERU_ud_garrison_oversight_act_desc:0 "An assembly committee may inspect any garrison, read any order and question any officer. The general staff calls it an insult. The act passes anyway."
 ERU_ud_purge_the_conspirators:0 "Purge the Conspirators"
 ERU_ud_purge_the_conspirators_desc:0 "Officers who corresponded with the plotters across Usea are dismissed, tried in open court and barred from public office. The army is smaller and quieter."
 ERU_ud_pardon_and_reconcile:0 "Pardon and Reconcile"
 ERU_ud_pardon_and_reconcile_desc:0 "The assembly pardons every officer who swears to the charter, and asks only for the names of the ringleaders. Some deputies call it weakness. The army calls it a debt."
 ERU_ud_stonehenge_debate:0 "The Stonehenge Debate"
 ERU_ud_stonehenge_debate_desc:0 "Stonehenge is complete. The assembly debates for three days whether Erusea should welcome the battery, protest it or ask to join its oversight, and votes to welcome it with conditions. Provisional gameplay."
 ERU_ud_seat_at_the_continental_table:0 "A Seat at the Continental Table"
 ERU_ud_seat_at_the_continental_table_desc:0 "Erusean delegates ask to join the continental committees that coordinate the fragment response. Being in the room costs pride. Being outside it costs more."
 ERU_ud_courts_stand_apart:0 "The Courts Stand Apart"
 ERU_ud_courts_stand_apart_desc:0 "Judges are appointed for life by an independent council and cannot be moved by ministers or the palace. The charter acquires teeth."
 ERU_ud_district_ombudsman:0 "An Ombudsman for the Districts"
 ERU_ud_district_ombudsman_desc:0 "Any citizen may complain to an independent ombudsman about any office. The first year brings eleven thousand letters, most of them about roads."
 ERU_ud_relief_act:0 "The Relief Act"
 ERU_ud_relief_act_desc:0 "Ulysses has broken apart. The Relief Act funds housing, food and medical care for the displaced, through the provincial boards the assembly built three years ago."
 ERU_ud_open_the_reception_camps:0 "Open the Reception Camps"
 ERU_ud_open_the_reception_camps_desc:0 "Refugees from across the continent are reaching the border. The assembly votes to receive them in registered camps, with work permits after a year. Provisional gameplay: the official chronology records that Erusea stopped taking in refugees on 21 April 2000."
 ERU_ud_budget_for_the_displaced:0 "A Budget for the Displaced"
 ERU_ud_budget_for_the_displaced_desc:0 "The supplementary budget for the camps passes by four votes after an all-night session. The treasury warns that the next one will not."
 ERU_ud_citizens_relief_committees:0 "Citizens' Relief Committees"
 ERU_ud_citizens_relief_committees_desc:0 "Parish halls, unions and veterans' leagues organize their own relief committees, registered with the provincial boards. The state cannot do everything. It can make sure nobody does it twice."
 ERU_ud_constitutional_settlement:0 "The Constitutional Settlement"
 ERU_ud_constitutional_settlement_desc:0 "The decade ends with a charter, an assembly, an independent bench and a monarchy above the fray. It is untested by war. It has already been tested by the sky."
 ERU_ud_staff_memorandum:0 "The Staff Memorandum"
 ERU_ud_staff_memorandum_desc:0 "The general staff circulates its memorandum to every garrison: the ministries are failing, the Crown is badly advised, and only a command administration can carry Erusea through what is coming."
 ERU_ud_secure_the_ministries:0 "Secure the Ministries"
 ERU_ud_secure_the_ministries_desc:0 "Staff officers take up 'liaison posts' in every ministry, with copies of every file and keys to every room. No shots are fired. None are needed."
 ERU_ud_regency_ordinance:0 "The Regency Ordinance"
 ERU_ud_regency_ordinance_desc:0 "The monarch signs the ordinance. A regency council of serving officers governs in the Crown's name, with the ministries reorganized as a command administration. Provisional gameplay: an alternate-history government change, represented by an unnamed office."
 ERU_ud_command_administration:0 "Command Administration"
 ERU_ud_command_administration_desc:0 "Ministries become directorates, ministers become directors and every file acquires a classification stamp. Decisions are fast and orders are clear. Nobody is allowed to ask why."
 ERU_ud_military_governors:0 "Military Governors"
 ERU_ud_military_governors_desc:0 "Each district is placed under a colonel with civil authority and a garrison. The prefects stay on as their deputies, and most of them are relieved to."
 ERU_ud_mobilization_economy:0 "A Mobilization Economy"
 ERU_ud_mobilization_economy_desc:0 "The directorates run industry on a mobilization schedule: arms first, rail second, households last. The factories hum. The shops thin out."
 ERU_ud_garrison_austerity:0 "Garrison Austerity"
 ERU_ud_garrison_austerity_desc:0 "The regency cuts its own coat: smaller garrisons, fewer parades, savings returned to the districts. An army government that does not spend like one confuses everybody."
 ERU_ud_requisition_boards:0 "Requisition Boards"
 ERU_ud_requisition_boards_desc:0 "Boards of officers may requisition trucks, warehouses and fuel for national purposes, with receipts that are redeemable 'after the emergency'. Everybody keeps their receipts."
 ERU_ud_staff_college_ministries:0 "Staff College Ministries"
 ERU_ud_staff_college_ministries_desc:0 "The staff college trains its graduates to run ministries as they would run a corps: plans, reports, inspections. The civil service is invited to attend."
 ERU_ud_civil_defence_command:0 "Civil Defence Command"
 ERU_ud_civil_defence_command_desc:0 "Central Usea has announced that Ulysses will strike. The regency answers the way it knows how: a single Civil Defence Command, with a general at its head and the districts under its orders."
 ERU_ud_evacuation_drills:0 "Evacuation Drills"
 ERU_ud_evacuation_drills_desc:0 "Every town practises its evacuation twice a year, by siren and by timetable, with soldiers at the crossroads. The drills are resented. They are also fast."
 ERU_ud_army_shelter_engineers:0 "Army Shelter Engineers"
 ERU_ud_army_shelter_engineers_desc:0 "Engineer battalions dig and pour public shelters on a military schedule. The concrete is thick, the ventilation is poor and the deadlines are met."
 ERU_ud_broadcast_censorship:0 "Censor the Broadcasts"
 ERU_ud_broadcast_censorship_desc:0 "Every broadcast about Ulysses is read by a staff officer first, to prevent panic. It prevents a great deal else as well."
 ERU_ud_martial_law_ordinances:0 "Martial Law Ordinances"
 ERU_ud_martial_law_ordinances_desc:0 "A coup has broken out across Usea, and the regency is the one government on the continent that cannot be overthrown by its own army. It does not intend to be overthrown by anyone else's."
 ERU_ud_root_out_the_conspiracies:0 "Root Out the Conspiracies"
 ERU_ud_root_out_the_conspiracies_desc:0 "Military intelligence turns on the officers' clubs. Anyone who corresponded with plotters abroad is transferred, retired or arrested."
 ERU_ud_regency_without_end:0 "A Regency Without End"
 ERU_ud_regency_without_end_desc:0 "The council announces that the emergency will last as long as the emergency does. The Crown is not consulted."
 ERU_ud_promise_of_restoration:0 "The Promise of Restoration"
 ERU_ud_promise_of_restoration_desc:0 "The council publishes a date: once the fragments have fallen and the camps are emptied, the seals of office will return to the Crown. Some officers believe it."
 ERU_ud_railgun_assessment:0 "Assess the Railgun Battery"
 ERU_ud_railgun_assessment_desc:0 "Stonehenge is complete. The general staff studies what the published specifications say about eight railguns on neutral soil, and what they do not. Provisional gameplay: an internal staff study, not a record of Erusean planning."
 ERU_ud_air_defence_review:0 "The Air Defence Review"
 ERU_ud_air_defence_review_desc:0 "If fragments can be shot down, so can aircraft. The regency reviews every radar and gun site in Erusea and finds most of them wanting."
 ERU_ud_continental_contingency_studies:0 "Continental Contingency Studies"
 ERU_ud_continental_contingency_studies_desc:0 "The staff war-games every continental emergency it can imagine: fragments, famine, refugees and the collapse of a neighbour. The studies are filed. The habit of filing them is not."
 ERU_ud_observatory_liaison:0 "Staff Liaison to the Observatories"
 ERU_ud_observatory_liaison_desc:0 "A staff officer sits in every observatory with a direct line to Civil Defence Command. The astronomers learn to report in grid squares."
 ERU_ud_army_relief_columns:0 "Army Relief Columns"
 ERU_ud_army_relief_columns_desc:0 "Ulysses has broken apart. Columns of army trucks carry food, water and tents to the displaced, under officers who have been planning this for three years."
 ERU_ud_requisitioned_trains:0 "Requisitioned Trains"
 ERU_ud_requisitioned_trains_desc:0 "Every passenger train in Erusea is requisitioned for a month to move relief and the displaced. Commuters walk, and are told why."
 ERU_ud_command_relief_directorate:0 "The Relief Directorate"
 ERU_ud_command_relief_directorate_desc:0 "Relief becomes a directorate with a general, a staff and a war diary. It is efficient, it is unloved and it works."
 ERU_ud_field_kitchens_order:0 "The Field Kitchens Order"
 ERU_ud_field_kitchens_order_desc:0 "Every garrison kitchen feeds the district around it, twice a day, without asking who is a citizen. It is the regency's most popular order."
 ERU_ud_regencys_mandate:0 "The Regency's Mandate"
 ERU_ud_regencys_mandate_desc:0 "The council declares that it has earned its mandate by carrying Erusea through the decade. It will carry the country into the next one too."
 ERU_ud_return_the_seals:0 "Return the Seals"
 ERU_ud_return_the_seals_desc:0 "The council keeps its promise. The seals of office return to the Crown, which governs through a restored Crown Council with the officers back in their barracks. Provisional gameplay: an alternate-history government change, represented by an unnamed office."
 ERU_ud_rail_ministry_ledger:0 "The Rail Ministry Ledger"
 ERU_ud_rail_ministry_ledger_desc:0 "The freight reserves are counted and the industrial standards are printed. Now the rail ministry opens its ledger: every line, every bridge, every locomotive and what it would cost to make the network carry a modern economy. The answer will decide who owns the railways."
 ERU_ud_state_railways_trust:0 "The State Railways Trust"
 ERU_ud_state_railways_trust_desc:0 "One public trust owns every line, sets every tariff and answers to the government. It will be slow to modernize and impossible to bankrupt, and the army will always have a timetable."
 ERU_ud_concession_railways:0 "Concession Railways"
 ERU_ud_concession_railways_desc:0 "Lease the main lines to private operators for thirty years, with investment written into the concessions. The trains will be newer and the fares higher, and the state will have to negotiate for its own timetable."
 ERU_ud_electrify_trunk_lines:0 "Electrify the Trunk Lines"
 ERU_ud_electrify_trunk_lines_desc:0 "The trust strings catenary along the busiest trunk lines, starting with the capital's approaches. Diesel stays on the branch lines; the coal yards close."
 ERU_ud_rolling_stock_licences:0 "Rolling-Stock Licences"
 ERU_ud_rolling_stock_licences_desc:0 "The concessionaires license foreign locomotive and wagon designs and build them in Erusean shops. The designs are not ours, but the jobs are."
 ERU_ud_military_rail_timetables:0 "Military Rail Timetables"
 ERU_ud_military_rail_timetables_desc:0 "Every line has a secret second timetable, for mobilization. The trust prints it, the general staff keeps it and the commuters never see it."
 ERU_ud_private_freight_terminals:0 "Private Freight Terminals"
 ERU_ud_private_freight_terminals_desc:0 "Shipping firms and manufacturers build their own freight terminals beside the concession lines. Factories follow the terminals, and towns follow the factories."
 ERU_ud_machine_tool_bureau:0 "The Machine-Tool Bureau"
 ERU_ud_machine_tool_bureau_desc:0 "Erusea's factories run on imported machine tools and spare parts that arrive late. A bureau with a budget and an engineering school sets out to change that, one lathe at a time."
 ERU_ud_steel_quota:0 "The Steel Quota"
 ERU_ud_steel_quota_desc:0 "Heavy industry first: a national steel quota, guaranteed prices for the mills and priority for coal and power. Shoes and radios can wait."
 ERU_ud_light_industry_first:0 "Light Industry First"
 ERU_ud_light_industry_first_desc:0 "Households first: credit for the textile mills, the furniture shops and the radio assemblers that employ half the towns. The mills can wait for demand."
 ERU_ud_armour_plate_mills:0 "Armour-Plate Mills"
 ERU_ud_armour_plate_mills_desc:0 "Two mills are converted to roll armour plate to the army's specifications. The order book is small. The capability is not."
 ERU_ud_consumer_electronics_plants:0 "Consumer Electronics Plants"
 ERU_ud_consumer_electronics_plants_desc:0 "Radios, televisions and telephone exchanges assembled in Erusea, for Erusea. The same lines can make military radios if anyone asks."
 ERU_ud_aero_engine_works:0 "Aero-Engine Works"
 ERU_ud_aero_engine_works_desc:0 "A state engine works builds jet engines under licence and learns, slowly, how to design its own. The air arm will not have to beg for spares."
 ERU_ud_export_credit_board:0 "The Export Credit Board"
 ERU_ud_export_credit_board_desc:0 "Erusean manufacturers sell abroad on government-guaranteed credit, and the board keeps a ledger of every buyer. It learns, faster than the foreign ministry, which neighbours pay their bills and which ones expect Erusea to forget."
 ERU_ud_shipyard_modernization:0 "Modernize the Shipyards"
 ERU_ud_shipyard_modernization_desc:0 "New cranes, covered slipways and welding halls for the national yards. Whatever fleet Erusea decides to build, it will be built here."
 ERU_ud_strategic_fuel_reserves:0 "Strategic Fuel Reserves"
 ERU_ud_strategic_fuel_reserves_desc:0 "Tank farms at the refineries and the main depots hold a season's fuel for the army, the air arm and the fleet. The treasury hates paying for oil that sits still."
 ERU_ud_power_grid_interconnect:0 "Interconnect the Power Grid"
 ERU_ud_power_grid_interconnect_desc:0 "The district power companies are linked into one national grid, so a failure in one valley no longer stops the factories in the next."
 ERU_ud_shelter_steel_programme:0 "The Shelter Steel Programme"
 ERU_ud_shelter_steel_programme_desc:0 "Central Usea has announced that Ulysses will strike. The mills set aside steel for shelter doors, blast shutters and reinforcing bar, at a fixed price."
 ERU_ud_hardened_rail_junctions:0 "Hardened Rail Junctions"
 ERU_ud_hardened_rail_junctions_desc:0 "The great junctions get duplicate tracks, buried signal cables and spare bridges stored nearby. If one fragment can cut the network, the network was not ready."
 ERU_ud_emergency_production_plan:0 "The Emergency Production Plan"
 ERU_ud_emergency_production_plan_desc:0 "Every large plant files a plan for working through the fragment years: what it makes, what it needs and what it can stop making."
 ERU_ud_construction_steel_stockpile:0 "Stockpile Construction Steel"
 ERU_ud_construction_steel_stockpile_desc:0 "Girders, sheet and rebar are stockpiled at the depots for rebuilding whatever the sky breaks. The stockpile is guarded more carefully than the gold reserve."
 ERU_ud_guard_the_rail_yards:0 "Guard the Rail Yards"
 ERU_ud_guard_the_rail_yards_desc:0 "A coup has broken out across Usea. Railway police and army pickets guard the yards and the junctions: whoever holds the trains holds the country."
 ERU_ud_strike_arbitration_boards:0 "Strike Arbitration Boards"
 ERU_ud_strike_arbitration_boards_desc:0 "In a year of plots, the unions are offered binding arbitration instead of strikes, with wages indexed to bread. The yards stay open by consent."
 ERU_ud_plant_security_councils:0 "Plant Security Councils"
 ERU_ud_plant_security_councils_desc:0 "Managers, foremen and police meet weekly in every large plant to review who comes and goes. Sabotage falls. So does trust."
 ERU_ud_restart_the_lines:0 "Restart the Lines"
 ERU_ud_restart_the_lines_desc:0 "The plants that stood idle during the coup scare are restarted on double shifts to recover the lost months."
 ERU_ud_hardened_factory_roofs:0 "Hardened Factory Roofs"
 ERU_ud_hardened_factory_roofs_desc:0 "Stonehenge is complete, and the engineers' question is the same as before: what if a fragment gets through? Harden the roofs, bury the transformers and stay where the workers live."
 ERU_ud_dispersal_of_industry:0 "Disperse the Industry"
 ERU_ud_dispersal_of_industry_desc:0 "Move a third of the key plants out of the river valleys into smaller towns, so that no single strike can stop a whole industry. It is expensive and slow."
 ERU_ud_spare_machine_tools:0 "Spare Machine-Tool Depots"
 ERU_ud_spare_machine_tools_desc:0 "A second set of critical machine tools, crated and stored far from the plants that use them, ready to restart a ruined line within weeks."
 ERU_ud_precision_optics_works:0 "Precision Optics Works"
 ERU_ud_precision_optics_works_desc:0 "The observatories need lenses, the air arm needs gunsights and the survey office needs theodolites. One optics works can serve all three."
 ERU_ud_relief_trains:0 "Relief Trains"
 ERU_ud_relief_trains_desc:0 "Ulysses has broken apart. The railways run relief trains on the military timetable, carrying food and tents out and the injured back."
 ERU_ud_rebuild_the_supply_lines:0 "Rebuild the Supply Lines"
 ERU_ud_rebuild_the_supply_lines_desc:0 "Bridges, sidings and pipelines damaged in the fragment months are repaired first, before anything else is rebuilt."
 ERU_ud_emergency_housing_works:0 "Emergency Housing Works"
 ERU_ud_emergency_housing_works_desc:0 "Factories that made shelter doors now make prefabricated housing for the displaced, from the stockpiled steel."
 ERU_ud_prefabricated_shelters:0 "Prefabricated Shelters"
 ERU_ud_prefabricated_shelters_desc:0 "Tens of thousands of steel huts roll off the lines and onto flat wagons, bound for the camps."
 ERU_ud_industrial_census:0 "The Industrial Census"
 ERU_ud_industrial_census_desc:0 "At the end of the decade the statistics office counts every plant, worker and machine in Erusea. The census will be the starting point for whatever the next decade demands."
 ERU_ud_defence_review:0 "The Defence Review"
 ERU_ud_defence_review_desc:0 "The reserve exercises are over and the general staff has written its report. The army, the air arm and the navy each want everything. The review decides who gets what, in what order and on whose authority."
 ERU_ud_army_board:0 "The Army Board"
 ERU_ud_army_board_desc:0 "A board of senior officers and treasury officials sets the army's shape for the decade: how many divisions, how many reservists and how much of either Erusea can afford."
 ERU_ud_mass_reserve_army:0 "A Mass Reserve Army"
 ERU_ud_mass_reserve_army_desc:0 "A small regular army and a very large trained reserve, called up by district. Cheap in peacetime and enormous in war."
 ERU_ud_professional_mobile_corps:0 "A Professional Mobile Corps"
 ERU_ud_professional_mobile_corps_desc:0 "Fewer soldiers, longer service, more vehicles. A corps that can move across the continent faster than its neighbours can mobilize."
 ERU_ud_reserve_depots:0 "District Reserve Depots"
 ERU_ud_reserve_depots_desc:0 "Every district keeps its reservists' rifles, uniforms and trucks in a local depot, ready to issue within forty-eight hours."
 ERU_ud_mobile_brigades:0 "Mobile Brigades"
 ERU_ud_mobile_brigades_desc:0 "The first mechanized brigades are formed from the best regular battalions, with their own transport, artillery and engineers."
 ERU_ud_artillery_parks:0 "Artillery Parks"
 ERU_ud_artillery_parks_desc:0 "The army's guns are concentrated in regional parks with trained crews, instead of scattered among garrisons that cannot fire them."
 ERU_ud_coastal_regiments:0 "Coastal Regiments"
 ERU_ud_coastal_regiments_desc:0 "Erusea has a long coast and a short memory of defending it. Regiments are raised for the beaches and harbours, trained with the navy."
 ERU_ud_armour_school:0 "The Armour School"
 ERU_ud_armour_school_desc:0 "A school for tank crews, commanders and mechanics, with its own ranges and workshops. The army's first real armoured doctrine will be written there."
 ERU_ud_coastal_batteries:0 "Coastal Artillery Batteries"
 ERU_ud_coastal_batteries_desc:0 "Old coastal guns are replaced with mobile missile and artillery batteries that can be moved before an enemy finds them."
 ERU_ud_combined_arms_exercises:0 "Combined-Arms Exercises"
 ERU_ud_combined_arms_exercises_desc:0 "Infantry, armour, artillery and the air arm exercise together for the first time in a decade. Most of the lessons are about radios."
 ERU_ud_army_doctrine_manual:0 "The Army's Doctrine Manual"
 ERU_ud_army_doctrine_manual_desc:0 "The board's conclusions are printed as a manual and issued to every officer. Whatever the army becomes, it will at least agree on what it is trying to be."
 ERU_ud_army_civil_defence_corps:0 "The Army Civil Defence Corps"
 ERU_ud_army_civil_defence_corps_desc:0 "Central Usea has announced that Ulysses will strike. Reservists are given a second duty: digging out, shoring up and keeping order when fragments fall."
 ERU_ud_reserve_call_up_rehearsal:0 "Rehearse the Call-Up"
 ERU_ud_reserve_call_up_rehearsal_desc:0 "The whole reserve is called up for one weekend, district by district, to prove the depots and the trains work. They mostly do."
 ERU_ud_fragment_watch_posts:0 "Fragment Watch Posts"
 ERU_ud_fragment_watch_posts_desc:0 "Army observers in the hills report anything that falls from the sky, with a telephone line to the nearest engineer battalion."
 ERU_ud_garrison_loyalty_review:0 "The Garrison Loyalty Review"
 ERU_ud_garrison_loyalty_review_desc:0 "A coup has broken out across Usea. Every garrison commander is interviewed, every officers' club is watched and every transfer is approved by the board."
 ERU_ud_officers_assurance:0 "The Officers' Assurance"
 ERU_ud_officers_assurance_desc:0 "The board publicly assures the officer corps that it is trusted, and asks only that rumours be reported. Morale holds. So, perhaps, do the rumours."
 ERU_ud_rotate_the_garrisons:0 "Rotate the Garrisons"
 ERU_ud_rotate_the_garrisons_desc:0 "No regiment stays in the same town for more than two years. Officers cannot build local followings, and the army learns the whole country."
 ERU_ud_frontier_survey:0 "The Frontier Survey"
 ERU_ud_frontier_survey_desc:0 "Stonehenge is complete and the continent's map has changed without a border moving. Army surveyors redraw the frontier defence plans with the battery's range in mind. Provisional gameplay."
 ERU_ud_air_defence_artillery:0 "Air-Defence Artillery Regiments"
 ERU_ud_air_defence_artillery_desc:0 "Fragments are not the only things that fall from the sky. The army raises its first modern air-defence regiments."
 ERU_ud_engineers_for_the_camps:0 "Engineers for the Camps"
 ERU_ud_engineers_for_the_camps_desc:0 "Ulysses has broken apart. Engineer battalions lay out camps for the displaced: water, drains, roads and tents in straight lines."
 ERU_ud_army_water_columns:0 "Army Water Columns"
 ERU_ud_army_water_columns_desc:0 "Water purification trucks and tanker columns supply the districts where pipes and wells were damaged in the fragment months."
 ERU_ud_readiness_review:0 "The Army Readiness Review"
 ERU_ud_readiness_review_desc:0 "At the end of the decade the army counts what it has: divisions, reservists, depots and lessons. The review is honest, which is more than most armies manage."
 ERU_ud_air_arm_charter:0 "The Air Arm Charter"
 ERU_ud_air_arm_charter_desc:0 "The air arm receives a charter of its own, separate from the army, with its own staff, budget and schools. Its officers have been asking for twenty years."
 ERU_ud_pilot_academy:0 "The Pilot Academy"
 ERU_ud_pilot_academy_desc:0 "One academy for every pilot Erusea trains, with modern simulators and instructors rotated in from the operational squadrons."
 ERU_ud_licensed_airframes:0 "Licensed Airframes"
 ERU_ud_licensed_airframes_desc:0 "The air arm buys foreign fighter designs with the right to build them in Erusea. The aero-engine works will matter."
 ERU_ud_interceptor_doctrine:0 "Interceptor Doctrine"
 ERU_ud_interceptor_doctrine_desc:0 "The air arm's purpose is to own Erusean skies: fast interceptors, ground radar and pilots trained to fight outnumbered."
 ERU_ud_strike_doctrine:0 "Strike Doctrine"
 ERU_ud_strike_doctrine_desc:0 "The air arm's purpose is to support the army: strike aircraft, forward air controllers and runways close to the front."
 ERU_ud_radar_belt:0 "The Radar Belt"
 ERU_ud_radar_belt_desc:0 "A chain of radar stations along the coast and the borders, linked to the interceptor bases by buried cable."
 ERU_ud_strike_wings:0 "Strike Wings"
 ERU_ud_strike_wings_desc:0 "The strike squadrons are grouped into wings with their own maintenance and munitions, ready to deploy as a unit."
 ERU_ud_reserve_squadrons:0 "Reserve Squadrons"
 ERU_ud_reserve_squadrons_desc:0 "Pilots who leave the air arm keep flying on weekends with reserve squadrons, so that a war would not start with empty cockpits."
 ERU_ud_dispersal_airstrips:0 "Dispersal Airstrips"
 ERU_ud_dispersal_airstrips_desc:0 "Stretches of highway and farm strips are surveyed and prepared so that squadrons can scatter if their bases are hit."
 ERU_ud_night_flying_course:0 "The Night Flying Course"
 ERU_ud_night_flying_course_desc:0 "Every operational pilot completes a night and bad-weather course. The accident rate rises before it falls."
 ERU_ud_air_staff_college:0 "The Air Staff College"
 ERU_ud_air_staff_college_desc:0 "The air arm opens its own staff college, so that its commanders learn to plan campaigns and not only to fly them."
 ERU_ud_fragment_tracking_radar:0 "Fragment-Tracking Radar"
 ERU_ud_fragment_tracking_radar_desc:0 "Central Usea has announced that Ulysses will strike. The radar belt's operators retrain to track objects falling from orbit, not only aircraft crossing the border."
 ERU_ud_high_altitude_reconnaissance:0 "High-Altitude Reconnaissance"
 ERU_ud_high_altitude_reconnaissance_desc:0 "Reconnaissance aircraft are refitted with long-focus cameras to photograph debris fields and damaged districts from high altitude. The same photographs will tell the relief planners where the roads still run."
 ERU_ud_air_rescue_squadrons:0 "Air Rescue Squadrons"
 ERU_ud_air_rescue_squadrons_desc:0 "Helicopter squadrons train for rescue in collapsed towns, flooded valleys and burning forests. Their crews learn to land where there is no landing ground, and to choose who goes first."
 ERU_ud_airfield_security:0 "Airfield Security Regiments"
 ERU_ud_airfield_security_desc:0 "A coup has broken out across Usea, and in several countries it began at an airfield. Every Erusean base gets its own security regiment."
 ERU_ud_airspace_near_the_battery:0 "Airspace Near the Battery"
 ERU_ud_airspace_near_the_battery_desc:0 "Stonehenge is complete. The air arm rewrites its flight rules for the airspace near the battery and studies what eight railguns mean for anything that flies. Provisional gameplay."
 ERU_ud_coastal_interceptor_patrols:0 "Coastal Interceptor Patrols"
 ERU_ud_coastal_interceptor_patrols_desc:0 "Standing interceptor patrols along the coast, ready for whatever comes in from the sea or falls from the sky."
 ERU_ud_relief_air_bridge:0 "The Relief Air Bridge"
 ERU_ud_relief_air_bridge_desc:0 "Ulysses has broken apart. Transport squadrons fly food and medicine into districts the roads cannot reach."
 ERU_ud_medical_evacuation_flights:0 "Medical Evacuation Flights"
 ERU_ud_medical_evacuation_flights_desc:0 "The injured are flown out of the damaged districts to hospitals that still have power, beds and surgeons. The flights run until the last patient on every list is moved."
 ERU_ud_air_arm_at_decades_end:0 "The Air Arm at Decade's End"
 ERU_ud_air_arm_at_decades_end_desc:0 "The air arm ends the decade with its own charter, academy and staff college, and pilots who have flown through the worst sky in history."
 ERU_ud_aegir_fleet_plan:0 "The Aegir Fleet Plan"
 ERU_ud_aegir_fleet_plan_desc:0 "The navy's plan for a modern fleet, to be known as the Aegir fleet, built over the decade in Erusean yards. Provisional gameplay: the official chronology names the Aegir fleet only at its loss in November 2004; its 1990s build-up and timing here are a gameplay abstraction."
 ERU_ud_fleet_officers_school:0 "The Fleet Officers' School"
 ERU_ud_fleet_officers_school_desc:0 "A fleet needs officers before it needs hulls. The naval school doubles its intake and adds a staff course for squadron commanders."
 ERU_ud_dockyard_slipways:0 "Dockyard Slipways"
 ERU_ud_dockyard_slipways_desc:0 "New covered slipways at the national yards, sized for the largest hulls the plan calls for."
 ERU_ud_battle_line_doctrine:0 "The Battle Line"
 ERU_ud_battle_line_doctrine_desc:0 "The Aegir fleet will be built around a battle line of large surface combatants, able to fight any squadron in Usean waters."
 ERU_ud_escort_screen_doctrine:0 "Escort and Submarine Screen"
 ERU_ud_escort_screen_doctrine_desc:0 "The Aegir fleet will be built around escorts and submarines that protect the coast and the convoys, not around a battle line."
 ERU_ud_capital_ship_crews:0 "Capital-Ship Crews"
 ERU_ud_capital_ship_crews_desc:0 "Large ships need large, trained crews. The fleet's first big hulls are manned by sailors drafted from the whole navy."
 ERU_ud_submarine_pickets:0 "Submarine Pickets"
 ERU_ud_submarine_pickets_desc:0 "A flotilla of submarines patrols the approaches to the Erusean coast, trained to report before they fight."
 ERU_ud_home_anchorage_defences:0 "Home Anchorage Defences"
 ERU_ud_home_anchorage_defences_desc:0 "Nets, mines, guns and radar around the fleet's home anchorage. A fleet in harbour should be the safest fleet in the world."
 ERU_ud_fleet_dispersal_plan:0 "The Fleet Dispersal Plan"
 ERU_ud_fleet_dispersal_plan_desc:0 "Central Usea has announced that Ulysses will strike. A fleet crowded into one harbour is one target, so the navy plans to scatter it along the coast when the fragments come."
 ERU_ud_coastal_interdiction_patrols:0 "Coastal Interdiction Patrols"
 ERU_ud_coastal_interdiction_patrols_desc:0 "A coup has broken out across Usea. Patrol boats watch the coast for arms, plotters and anyone trying to leave in a hurry."
 ERU_ud_aegir_keels:0 "The Aegir Keels"
 ERU_ud_aegir_keels_desc:0 "The first large hulls of the Aegir fleet are laid down in the new slipways. Provisional gameplay: no official source dates the fleet's construction."
 ERU_ud_fleet_trials:0 "Fleet Trials"
 ERU_ud_fleet_trials_desc:0 "The new escorts run their sea trials along the coast, with Stonehenge's construction news on every wardroom radio."
 ERU_ud_fleet_relief_convoys:0 "Fleet Relief Convoys"
 ERU_ud_fleet_relief_convoys_desc:0 "Ulysses has broken apart. The fleet's transports and escorts carry relief to the coastal towns and bring the displaced to safer harbours."
 ERU_ud_continental_desk_expands:0 "The Continental Desk Expands"
 ERU_ud_continental_desk_expands_desc:0 "The foreign ministry's continental desk has done its work. Now it becomes a directorate, with an ambassador's office for every Usean capital and a mandate to decide what Erusea wants from its neighbours."
 ERU_ud_embassies_in_every_capital:0 "Embassies in Every Capital"
 ERU_ud_embassies_in_every_capital_desc:0 "Erusea has consulates in the trading towns and embassies in only a few capitals. It opens the rest, from the largest republic to the smallest principality."
 ERU_ud_usean_trade_missions:0 "Usean Trade Missions"
 ERU_ud_usean_trade_missions_desc:0 "Trade missions carry Erusean manufacturers to the continent's fairs, with export credit and catalogues in every language."
 ERU_ud_central_usean_confidence:0 "Seek Central Usea's Confidence"
 ERU_ud_central_usean_confidence_desc:0 "The Federation of Central Usea is the continent's largest power. Erusea seeks its confidence: regular consultations, shared statistics and no surprises."
 ERU_ud_independent_course:0 "An Independent Course"
 ERU_ud_independent_course_desc:0 "Erusea keeps its own counsel. It trades with everyone, consults when it must and signs nothing that binds its hands."
 ERU_ud_joint_border_commission:0 "A Joint Border Commission"
 ERU_ud_joint_border_commission_desc:0 "Erusean and neighbouring officials meet every month at a customs house on the frontier to settle border incidents before they become headlines. Most of the incidents are about cattle."
 ERU_ud_military_attaches:0 "Exchange Military Attaches"
 ERU_ud_military_attaches_desc:0 "Erusean officers serve as attaches in the neighbouring capitals, and theirs serve in Farbanti. Each side learns what the other is buying."
 ERU_ud_neutral_ports_policy:0 "The Neutral Ports Policy"
 ERU_ud_neutral_ports_policy_desc:0 "Erusean ports are open to every flag on equal terms, and closed to every warship except in distress."
 ERU_ud_non_aligned_credits:0 "Non-Aligned Credits"
 ERU_ud_non_aligned_credits_desc:0 "Erusea lends to the smaller Usean states on its own terms, without asking which side they are on."
 ERU_ud_usean_summit_circuit:0 "The Usean Summit Circuit"
 ERU_ud_usean_summit_circuit_desc:0 "Erusea's ministers attend every continental summit, sit on every working group and speak at every dinner. They are remembered at most of them, and quoted at a few."
 ERU_ud_join_the_ulysses_talks:0 "Join the Ulysses Talks"
 ERU_ud_join_the_ulysses_talks_desc:0 "Central Usea has announced that Ulysses will strike, and the continent's governments are talking about a common response. Erusea joins the talks and shares its observatory data. Provisional gameplay."
 ERU_ud_prepare_alone:0 "Erusea Prepares Alone"
 ERU_ud_prepare_alone_desc:0 "Erusea will plan for Ulysses with its own engineers, its own grain and its own shelters, and owe nobody for them. Provisional gameplay."
 ERU_ud_coup_intelligence_exchange:0 "Coup Intelligence Exchange"
 ERU_ud_coup_intelligence_exchange_desc:0 "A coup has broken out across Usea. Erusea offers its neighbours what its intelligence service knows about the plotters, and asks for the same in return."
 ERU_ud_condemn_the_coup:0 "Condemn the Coup"
 ERU_ud_condemn_the_coup_desc:0 "Erusea condemns the coup in every continental forum. It costs nothing, and it reminds the officer corps at home which side the government is on."
 ERU_ud_the_stonehenge_question:0 "The Stonehenge Question"
 ERU_ud_the_stonehenge_question_desc:0 "Stonehenge is complete, built under Central Usea's leadership in neutral San Salvacion. Erusea must decide what it says about the most powerful battery on the continent. Provisional gameplay: the official chronology records no Erusean position before 2003."
 ERU_ud_appeals_for_relief:0 "Appeals for Relief"
 ERU_ud_appeals_for_relief_desc:0 "Ulysses has broken apart. Erusea appeals for relief and receives some, from neighbours who have their own dead to count."
 ERU_ud_border_aid_corridors:0 "Border Aid Corridors"
 ERU_ud_border_aid_corridors_desc:0 "Relief convoys cross the borders in both directions under joint escort, carrying food one way and the displaced the other."
 ERU_ud_continental_ledger:0 "The Continental Ledger"
 ERU_ud_continental_ledger_desc:0 "At the end of the decade the foreign ministry writes down what Erusea is owed, what it owes and who helped when the sky fell. The ledger will be read again."
 ERU_ud_crown_new_decade:0 "The Crown's New Decade"
 ERU_ud_crown_new_decade_desc:0 "The palace enters the new decade with its prerogative intact and its granaries empty. The camps on the border, the craters in the neighbours' fields and the bill for the fragment years all arrive on the same desk."
 ERU_ud_crown_speaks_for_the_grievance:0 "The Crown Speaks for the Grievance"
 ERU_ud_crown_speaks_for_the_grievance_desc:0 "The monarch tells the nation, in a broadcast from the palace, that Erusea's suffering was ignored by the continent that built the battery. The grievance now has a royal voice."
 ERU_ud_palace_reconstruction_fund:0 "The Palace Reconstruction Fund"
 ERU_ud_palace_reconstruction_fund_desc:0 "The Crown estates' revenues are pledged to rebuild the districts damaged in the fragment years. Every rebuilt school and bridge carries a plaque with the royal arms, and nobody pretends that is an accident."
 ERU_ud_household_guard_expanded:0 "The Household Guard Expands"
 ERU_ud_household_guard_expanded_desc:0 "The palace guard grows into a brigade, with its own vehicles and its own officers' school. The general staff notices."
 ERU_ud_royal_mobilization_decrees:0 "Royal Mobilization Decrees"
 ERU_ud_royal_mobilization_decrees_desc:0 "The mobilization laws are reissued as royal decrees, so that the Crown, not a ministry, will call the reserves when the time comes."
 ERU_ud_crown_envoys_to_the_neutrals:0 "Crown Envoys to the Neutrals"
 ERU_ud_crown_envoys_to_the_neutrals_desc:0 "Royal envoys visit the capitals that are not yet anyone's allies, with gifts, invitations and questions. They come home with fewer promises than gifts, and with a list of who refused to receive them."
 ERU_ud_crown_at_war:0 "The Crown at War"
 ERU_ud_crown_at_war_desc:0 "Erusea is at war, and the Crown leads it. Every decree now carries the weight of a casualty list."
 ERU_ud_royal_visits_to_the_front:0 "Royal Visits to the Front"
 ERU_ud_royal_visits_to_the_front_desc:0 "The monarch visits the forward airfields and the field hospitals, shakes hands with pilots and sits with the wounded. The newsreels do the rest, and the recruiting offices notice the difference."
 ERU_ud_wartime_privy_council:0 "The Wartime Privy Council"
 ERU_ud_wartime_privy_council_desc:0 "The Privy Council sits every day, with the chiefs of staff at the table. The minutes, for once, are secret."
 ERU_ud_the_crowns_burden:0 "The Crown's Burden"
 ERU_ud_the_crowns_burden_desc:0 "The enemy has landed on the continent. Whatever happens now, the Crown will be held to account for the war it led."
 ERU_ud_assembly_new_decade:0 "The Assembly's New Decade"
 ERU_ud_assembly_new_decade_desc:0 "The assembly opens the new decade with a full gallery, a camp crisis on the border and a cabinet that promised the voters it would never close the door. The chronology says the door will close."
 ERU_ud_refugee_hearings:0 "The Refugee Hearings"
 ERU_ud_refugee_hearings_desc:0 "Public hearings on the camps, with testimony from the displaced, the guards and the district mayors. The country hears what it is doing and argues about whether to stop."
 ERU_ud_reconstruction_committee:0 "The Reconstruction Committee"
 ERU_ud_reconstruction_committee_desc:0 "A standing committee of the assembly oversees every reconstruction contract over a set value and publishes the bids. Contractors complain about the paperwork. Fewer of them get rich on a ruined district."
 ERU_ud_peace_caucus:0 "The Peace Caucus"
 ERU_ud_peace_caucus_desc:0 "Deputies from every party form a caucus pledged to settle Erusea's grievances by negotiation. They are outnumbered, and loud."
 ERU_ud_war_powers_debate:0 "The War Powers Debate"
 ERU_ud_war_powers_debate_desc:0 "The assembly writes into law that no Erusean soldier crosses a border without its vote. The general staff calls it a gift to the enemy; the peace caucus calls it the least the charter owes the dead."
 ERU_ud_emergency_powers_act:0 "The Emergency Powers Act"
 ERU_ud_emergency_powers_act_desc:0 "The cabinet receives emergency powers for the duration of any war, renewable every six months by vote."
 ERU_ud_assembly_at_war:0 "The Assembly at War"
 ERU_ud_assembly_at_war_desc:0 "Erusea is at war, and its assembly voted for it or failed to stop it. Every sitting is now a war council."
 ERU_ud_casualty_inquiry:0 "The Casualty Inquiry"
 ERU_ud_casualty_inquiry_desc:0 "A committee of inquiry examines every major loss in public, with the generals as witnesses and the families in the gallery. The army hates the hearings and learns from them anyway."
 ERU_ud_wartime_coalition:0 "The Wartime Coalition"
 ERU_ud_wartime_coalition_desc:0 "Every party but the peace caucus joins a coalition cabinet for the duration. Old enemies share ministries, briefings and blame, and the opposition benches are suddenly very quiet."
 ERU_ud_armistice_motion:0 "The Armistice Motion"
 ERU_ud_armistice_motion_desc:0 "After Los Canas the peace caucus tables a motion asking the cabinet to seek an armistice. It fails by a handful of votes and changes the debate anyway."
 ERU_ud_regency_new_decade:0 "The Regency's New Decade"
 ERU_ud_regency_new_decade_desc:0 "The regency council enters the new decade claiming credit for the decade just ended. The camps on the border are run by the army, and so is everything else."
 ERU_ud_command_reconstruction:0 "Command Reconstruction"
 ERU_ud_command_reconstruction_desc:0 "Engineer brigades rebuild the damaged districts on a military schedule, with daily progress reports and no public tenders. Bridges go up fast; questions about who was paid go unanswered."
 ERU_ud_border_command:0 "The Border Command"
 ERU_ud_border_command_desc:0 "The frontier is placed under a single command with authority over the camps, the crossings and the roads behind them."
 ERU_ud_total_mobilization_order:0 "The Total Mobilization Order"
 ERU_ud_total_mobilization_order_desc:0 "The regency orders the nation's industry, transport and labour placed on a mobilization footing, in peacetime."
 ERU_ud_staff_war_plan_review:0 "The Staff's Plan Review"
 ERU_ud_staff_war_plan_review_desc:0 "The general staff reviews every contingency plan it filed in the 1990s, and updates the ones it intends to use."
 ERU_ud_regency_propaganda_office:0 "The Regency Propaganda Office"
 ERU_ud_regency_propaganda_office_desc:0 "One office writes every broadcast, poster and newsreel. Its message is simple: the army saved Erusea once and will again."
 ERU_ud_regency_at_war:0 "The Regency at War"
 ERU_ud_regency_at_war_desc:0 "Erusea is at war, and it is governed by the men who planned it. There is nobody else to blame."
 ERU_ud_command_of_the_home_front:0 "Command of the Home Front"
 ERU_ud_command_of_the_home_front_desc:0 "The home front is a theatre of operations, with a general in charge of rations, factories and morale."
 ERU_ud_staff_rotation:0 "Rotate the Staff"
 ERU_ud_staff_rotation_desc:0 "Staff officers rotate between the ministries and the front every six months, so that the planners know what their plans cost."
 ERU_ud_regency_answers:0 "The Regency Answers"
 ERU_ud_regency_answers_desc:0 "The enemy has landed on the continent, and the council must answer for a war it promised to win."
 ERU_ud_camps_along_the_border:0 "The Camps Along the Border"
 ERU_ud_camps_along_the_border_desc:0 "The displaced of a continent are at Erusea's border and in its camps. Whatever the government decides about the frontier, the camps already exist and someone must run them."
 ERU_ud_register_the_displaced:0 "Register the Displaced"
 ERU_ud_register_the_displaced_desc:0 "Every person in the camps is registered: name, origin, trade and family. The register will decide who works, who moves and who waits."
 ERU_ud_border_medical_stations:0 "Border Medical Stations"
 ERU_ud_border_medical_stations_desc:0 "Army doctors and volunteer nurses staff medical stations at every crossing and camp, vaccinating, dressing wounds and counting the sick. Their reports are the first honest numbers the cabinet receives."
 ERU_ud_holding_camps:0 "Holding Camps"
 ERU_ud_holding_camps_desc:0 "The displaced stay in guarded camps until they can be returned. It is cheap, it is orderly and it makes the border towns angrier by the month."
 ERU_ud_integration_programme:0 "The Integration Programme"
 ERU_ud_integration_programme_desc:0 "Registered refugees may work, rent and study after six months. The camps empty slowly; the factories fill. Provisional gameplay."
 ERU_ud_disease_control_teams:0 "Disease Control Teams"
 ERU_ud_disease_control_teams_desc:0 "Mobile teams vaccinate, test the water and isolate outbreaks before they reach the towns. A single epidemic in the camps would cost more lives than the fragments did in some districts."
 ERU_ud_charity_under_licence:0 "Charity Under Licence"
 ERU_ud_charity_under_licence_desc:0 "Churches, unions and foreign charities may work in the camps under a government licence that tells them where and how."
 ERU_ud_labour_exchanges:0 "Labour Exchanges"
 ERU_ud_labour_exchanges_desc:0 "Exchanges match the registered displaced with farms and factories that need hands. Wages are low and the work is real."
 ERU_ud_public_health_ordinance:0 "The Public Health Ordinance"
 ERU_ud_public_health_ordinance_desc:0 "A national ordinance sets standards for water, food and sanitation in every camp and every barracks."
 ERU_ud_home_front_council:0 "The Home Front Council"
 ERU_ud_home_front_council_desc:0 "Ministries, districts, unions and employers sit on one council for the camps, the rations and the factories. Whatever comes next, Erusea will not improvise it."
 ERU_ud_rationing_boards:0 "Rationing Boards"
 ERU_ud_rationing_boards_desc:0 "Erusea is at war. Rationing boards in every district issue cards for fuel, meat and sugar."
 ERU_ud_war_bonds:0 "War Bonds"
 ERU_ud_war_bonds_desc:0 "The treasury sells war bonds in every post office. The first issue is oversubscribed; the third is not."
 ERU_ud_air_raid_precautions:0 "Air-Raid Precautions"
 ERU_ud_air_raid_precautions_desc:0 "The shelters built for the fragments are reopened for the bombers. Wardens, sirens and sandbags return to the towns."
 ERU_ud_blackout_ordinance:0 "The Blackout Ordinance"
 ERU_ud_blackout_ordinance_desc:0 "Every town goes dark at night, from the capital's boulevards to the smallest farm. Traffic accidents rise, so does the sale of torches, and the night sky is visible over Erusea for the first time in a century."
 ERU_ud_censored_news:0 "Censor the War News"
 ERU_ud_censored_news_desc:0 "Every report from the front is read by a censor first. The papers print the communiques and the weather."
 ERU_ud_open_reporting:0 "Open Reporting"
 ERU_ud_open_reporting_desc:0 "Correspondents may go to the front and report what they see, subject only to operational security. The country learns what the war costs, every morning."
 ERU_ud_factory_shifts:0 "Three Factory Shifts"
 ERU_ud_factory_shifts_desc:0 "The arms plants run three shifts, seven days a week. The fourth shift is made of the displaced."
 ERU_ud_casualty_lists:0 "The Casualty Lists"
 ERU_ud_casualty_lists_desc:0 "The lists are posted every Friday at every town hall. Families read them before they read anything else."
 ERU_ud_labour_service:0 "The Labour Service"
 ERU_ud_labour_service_desc:0 "Everyone not in uniform may be directed to essential work for the duration: farms, mines, rail yards and hospitals. The law is resented, obeyed and, in the border districts, enforced by the army."
 ERU_ud_home_front_holds:0 "The Home Front Holds"
 ERU_ud_home_front_holds_desc:0 "The rations are short, the lists are long and the factories have not stopped. Whatever happens at the front, the home front has held."
 ERU_ud_aegir_fleet_command:0 "Aegir Fleet Command"
 ERU_ud_aegir_fleet_command_desc:0 "The Aegir fleet has a commander, a staff and a home anchorage. It does not yet have a doctrine for a war against a coalition that controls the sea lanes."
 ERU_ud_fleet_in_being:0 "A Fleet in Being"
 ERU_ud_fleet_in_being_desc:0 "The fleet's purpose is to exist: to stay in harbour under strong defences and force the enemy to guard against it."
 ERU_ud_decisive_battle_doctrine:0 "Decisive Battle Doctrine"
 ERU_ud_decisive_battle_doctrine_desc:0 "The fleet's purpose is to find the enemy's main force and destroy it in one battle."
 ERU_ud_harbour_air_defence:0 "Harbour Air Defence"
 ERU_ud_harbour_air_defence_desc:0 "Guns, missiles and interceptors ring the anchorage. A fleet in harbour is a target unless the sky above it is closed."
 ERU_ud_fleet_oilers:0 "Fleet Oilers"
 ERU_ud_fleet_oilers_desc:0 "Tankers and supply ships are converted to keep the fleet at sea for weeks rather than days."
 ERU_ud_battle_squadron_drills:0 "Battle Squadron Drills"
 ERU_ud_battle_squadron_drills_desc:0 "The capital ships exercise as one squadron, night and day, in every sea state, until manoeuvres that took an hour take minutes. The fuel bill is enormous. So is the squadron's confidence."
 ERU_ud_convoy_escorts:0 "Convoy Escorts"
 ERU_ud_convoy_escorts_desc:0 "Escorts are assigned to the coastal convoys that carry fuel and food to the southern ports."
 ERU_ud_submarine_war_patrols:0 "Submarine War Patrols"
 ERU_ud_submarine_war_patrols_desc:0 "Erusea is at war. The submarines sail on war patrols into the sea lanes the coalition depends on."
 ERU_ud_hold_the_home_waters:0 "Hold the Home Waters"
 ERU_ud_hold_the_home_waters_desc:0 "The fleet's first duty is to keep enemy ships away from the Erusean coast. Everything else comes second."
 ERU_ud_after_comberth:0 "After Comberth Harbor"
 ERU_ud_after_comberth_desc:0 "The official chronology records that ISAF sank the Aegir fleet at Comberth Harbor on 23 November 2004. What survives must be gathered, counted and given a purpose. Losses are not scripted by this focus."
 ERU_ud_air_doctrine_board:0 "The Air Doctrine Board"
 ERU_ud_air_doctrine_board_desc:0 "The air arm's commanders meet to decide how Erusea will fight for its skies against a coalition with more aircraft and more money."
 ERU_ud_air_superiority_doctrine:0 "Air Superiority Doctrine"
 ERU_ud_air_superiority_doctrine_desc:0 "Win the sky with pilots and aircraft: the best squadrons concentrated where they can fight on their own terms."
 ERU_ud_battery_umbrella_doctrine:0 "The Battery Umbrella"
 ERU_ud_battery_umbrella_doctrine_desc:0 "If Erusea holds Stonehenge, its railguns can close the sky to enemy aircraft. Fight under the battery's umbrella. The official chronology records that Erusea used the railguns against aircraft; this doctrine is provisional gameplay."
 ERU_ud_elite_squadrons:0 "Elite Squadrons"
 ERU_ud_elite_squadrons_desc:0 "The best pilots are gathered into a few elite squadrons and sent where the fighting is hardest."
 ERU_ud_pilot_rotation:0 "Pilot Rotation"
 ERU_ud_pilot_rotation_desc:0 "Pilots rotate between the front, the training squadrons and rest, so that experience is passed on rather than lost."
 ERU_ud_battery_coordination_cell:0 "Battery Coordination Cell"
 ERU_ud_battery_coordination_cell_desc:0 "A cell of air arm officers sits with the battery's fire controllers, so that interceptors and railguns do not fight each other."
 ERU_ud_wartime_dispersal_fields:0 "Wartime Dispersal Fields"
 ERU_ud_wartime_dispersal_fields_desc:0 "Squadrons scatter to the dispersal strips surveyed in the 1990s, so that no single raid can catch them on the ground."
 ERU_ud_aces_in_the_newsreels:0 "Aces in the Newsreels"
 ERU_ud_aces_in_the_newsreels_desc:0 "Erusea is at war. The air arm lets the newsreels film its pilots, without names, as the face of the war."
 ERU_ud_fire_control_links:0 "Fire-Control Links"
 ERU_ud_fire_control_links_desc:0 "Radar plots from the air arm's stations feed the battery's fire control directly, so that the railguns know where every aircraft is before it is in range. Provisional gameplay."
 ERU_ud_air_defence_of_the_capital:0 "Air Defence of the Capital"
 ERU_ud_air_defence_of_the_capital_desc:0 "Whatever else is lost, the sky over the capital will be defended to the last squadron."
 ERU_ud_megalith_directorate:0 "The Megalith Directorate"
 ERU_ud_megalith_directorate_desc:0 "Megalith is an Erusean fortress built to bring down orbiting Ulysses fragments, according to the official record. A directorate now answers for its engineers, its budget and its secrets. No construction date is given or implied."
 ERU_ud_fragment_interception_studies:0 "Fragment Interception Studies"
 ERU_ud_fragment_interception_studies_desc:0 "The directorate's scientists study the orbiting fragments that Megalith was built to bring down: their orbits, their decay and their danger."
 ERU_ud_engineers_quarters:0 "The Engineers' Quarters"
 ERU_ud_engineers_quarters_desc:0 "The engineers and their families live in closed quarters near the site, with good pay and no visitors."
 ERU_ud_megalith_security_perimeter:0 "The Security Perimeter"
 ERU_ud_megalith_security_perimeter_desc:0 "A security perimeter with its own garrison, checkpoints and counter-intelligence officers surrounds the site. Nobody enters without a pass signed in the capital, and nobody leaves with a notebook."
 ERU_ud_shield_against_the_sky:0 "A Shield Against the Sky"
 ERU_ud_shield_against_the_sky_desc:0 "The directorate insists that Megalith remains what it was built to be: a defence against the sky, not a weapon in the war."
 ERU_ud_under_military_seal:0 "Under Military Seal"
 ERU_ud_under_military_seal_desc:0 "The general staff places Megalith under military seal. What it is for becomes a question only the staff may ask. Provisional gameplay."
 ERU_ud_watch_the_young_officers:0 "Watch the Young Officers"
 ERU_ud_watch_the_young_officers_desc:0 "Some of the young officers at Megalith talk about what they would do if the war were lost. The counter-intelligence officers write it down. The official chronology records that young officers seized Megalith after the surrender."
 ERU_ud_megaliths_ledger:0 "Megalith's Ledger"
 ERU_ud_megaliths_ledger_desc:0 "The directorate keeps a complete ledger of the site's people, budget and work, so that whatever happens, someone will be able to account for it."
 ERU_ud_after_the_megalith:0 "After the Megalith"
 ERU_ud_after_the_megalith_desc:0 "The official chronology records that ISAF destroyed Megalith after young officers seized it, and that Erusea formed a provisional autonomous government under ISAF oversight. The directorate's ledger is handed to the provisional authorities."
 ERU_ud_occupation_authority:0 "The Occupation Authority"
 ERU_ud_occupation_authority_desc:0 "Erusean forces hold Stonehenge and the territory around it. An occupation authority is created to govern what the army holds, under the laws of war and without annexing anything."
 ERU_ud_military_administration:0 "Military Administration"
 ERU_ud_military_administration_desc:0 "Occupied districts are governed by army officers under martial law, with orders posted in two languages on every town hall door. It is fast, firm and widely hated."
 ERU_ud_civil_commissioners:0 "Civil Commissioners"
 ERU_ud_civil_commissioners_desc:0 "Occupied districts are governed by civilian commissioners from the interior ministry, with the army in support rather than in charge. It is slower, more correct and slightly less hated."
 ERU_ud_curfew_ordinances:0 "Curfew Ordinances"
 ERU_ud_curfew_ordinances_desc:0 "A curfew from dusk to dawn in every occupied town, enforced by patrols with lists of the few who may be out at night: doctors, midwives and the patrols themselves."
 ERU_ud_requisition_rules:0 "Requisition Rules"
 ERU_ud_requisition_rules_desc:0 "The army may requisition food and fuel only with written receipts and fixed prices, payable by the occupation authority. The rules are not always kept, but they are written down."
 ERU_ud_local_councils:0 "Local Councils"
 ERU_ud_local_councils_desc:0 "Existing town councils keep working under the commissioners' supervision, collecting rubbish, running schools and quietly deciding which Erusean orders to obey first."
 ERU_ud_food_distribution:0 "Food Distribution"
 ERU_ud_food_distribution_desc:0 "The occupation authority distributes food in the towns it governs, under the eyes of the neutral relief agencies."
 ERU_ud_camp_inspectors:0 "Inspectors for the Camps"
 ERU_ud_camp_inspectors_desc:0 "Independent inspectors visit every detention and displaced persons' camp in occupied territory and report to the occupation authority."
 ERU_ud_occupation_courts:0 "Occupation Courts"
 ERU_ud_occupation_courts_desc:0 "Courts with Erusean judges and local assessors hear cases under the occupation's published code. The verdicts are recorded, and the records will be read by whoever governs next."
 ERU_ud_occupation_review:0 "The Occupation Review"
 ERU_ud_occupation_review_desc:0 "A year into the occupation, the authority reviews what it governs and what it costs: garrisons, food, courts and resentment. The review is circulated to the cabinet and to nobody else."
 ERU_ud_withdrawal_plans:0 "Withdrawal Plans"
 ERU_ud_withdrawal_plans_desc:0 "The enemy has landed on the continent. The authority prepares to hand back what it governs in good order, if it must."
 ERU_ud_under_oversight:0 "Under Oversight"
 ERU_ud_under_oversight_desc:0 "Erusea has surrendered. The official chronology records that it formed a provisional autonomous government under ISAF oversight. The government is not replaced by this focus; it learns to work under supervision."
 ERU_ud_disarmament_registry:0 "The Disarmament Registry"
 ERU_ud_disarmament_registry_desc:0 "Every weapon, unit and depot is registered with the oversight commission, down to the last rifle in the last district armoury. The registry is checked, and then checked again."
 ERU_ud_return_of_the_prisoners:0 "Return of the Prisoners"
 ERU_ud_return_of_the_prisoners_desc:0 "Prisoners of war come home by train, carriage after carriage, and the stations are full of families holding photographs. Some of the photographs are of men who are not on any train."
 ERU_ud_cooperate_with_the_commission:0 "Cooperate with the Commission"
 ERU_ud_cooperate_with_the_commission_desc:0 "The provisional government cooperates fully with the oversight commission, opens its files and asks to be judged by its record. It is humbling. It is also the fastest way out from under supervision."
 ERU_ud_quiet_non_cooperation:0 "Quiet Non-Cooperation"
 ERU_ud_quiet_non_cooperation_desc:0 "The government complies with every order of the commission slowly, and with none of them completely. Files go missing, inspections are delayed and the commission's patience wears thin."
 ERU_ud_demobilization_boards:0 "Demobilization Boards"
 ERU_ud_demobilization_boards_desc:0 "Boards in every district discharge the conscripts, return their papers and find them work on farms, in factories and on the reconstruction sites. A discharged soldier with a job is not a recruit for anyone."
 ERU_ud_veterans_pensions:0 "Veterans' Pensions"
 ERU_ud_veterans_pensions_desc:0 "Pensions for the wounded and the families of the dead are paid from the first postwar budget. They are smaller than the veterans' leagues demanded and larger than the treasury wanted."
 ERU_ud_the_unreconciled:0 "The Unreconciled"
 ERU_ud_the_unreconciled_desc:0 "Some officers will not accept the surrender. The government knows their names, their meeting places and their grievances, and decides for now to watch rather than act."
 ERU_ud_watch_the_veterans_leagues:0 "Watch the Veterans' Leagues"
 ERU_ud_watch_the_veterans_leagues_desc:0 "Veterans' leagues are meeting in back rooms. Some want pensions; some want another war. The government watches both, and reads the reports on any armed insurrection carefully."
 ERU_ud_a_provisional_order:0 "A Provisional Order"
 ERU_ud_a_provisional_order_desc:0 "The provisional government has a registry, a budget and a working relationship with its supervisors. It is not sovereign in the old sense. It is functioning."
 ERU_ud_victors_peace:0 "The Victor's Peace"
 ERU_ud_victors_peace_desc:0 "Erusea has won the war in this alternate history. It now governs a continent it does not own, in a peace it has to keep. Provisional gameplay: in the official chronology Erusea surrendered in 2005."
 ERU_ud_occupation_without_annexation:0 "Occupation Without Annexation"
 ERU_ud_occupation_without_annexation_desc:0 "Erusea annexes nothing. Its garrisons stay in the defeated countries as guarantors of the peace, under published terms with a published end date that nobody quite believes."
 ERU_ud_victory_parade_question:0 "The Victory Parade Question"
 ERU_ud_victory_parade_question_desc:0 "The general staff wants a parade through Farbanti. The treasury wants to know who pays for it."
 ERU_ud_magnanimous_peace:0 "A Magnanimous Peace"
 ERU_ud_magnanimous_peace_desc:0 "Erusea offers its defeated neighbours generous terms: no reparations, early withdrawal and help with reconstruction. The general staff calls it throwing away the victory. The neutral capitals call it wisdom."
 ERU_ud_hard_peace:0 "A Hard Peace"
 ERU_ud_hard_peace_desc:0 "Erusea demands guarantees, garrisons and payment for the decade it suffered. The terms are signed under protest, and the protest is remembered longer than the signatures."
 ERU_ud_reconstruction_credits:0 "Reconstruction Credits"
 ERU_ud_reconstruction_credits_desc:0 "Erusean banks lend to the rebuilding of the neighbours' cities on easy terms, guaranteed by the treasury. The loans buy goodwill, contracts for Erusean firms and a great deal of influence."
 ERU_ud_prisoner_releases:0 "Prisoner Releases"
 ERU_ud_prisoner_releases_desc:0 "All prisoners of war are released within the year, without exchange and without conditions. Their governments receive them with relief, and Erusea receives a rare word of thanks."
 ERU_ud_reparations_demands:0 "Reparations Demands"
 ERU_ud_reparations_demands_desc:0 "The defeated pay reparations in kind: grain, steel and fuel, delivered by rail to Erusean depots. The deliveries are on time, resented and carefully counted by both sides."
 ERU_ud_garrison_rotation_abroad:0 "Garrisons Abroad"
 ERU_ud_garrison_rotation_abroad_desc:0 "Regiments rotate through the foreign garrisons every year. Morale is poor, discipline is worse and the soldiers write home about streets where nobody speaks to them."
 ERU_ud_demobilize_the_reserves:0 "Demobilize the Reserves"
 ERU_ud_demobilize_the_reserves_desc:0 "The reservists go home. The ones who stay are the ones who have nowhere else to go."
 ERU_ud_the_continental_order:0 "The Continental Order"
 ERU_ud_the_continental_order_desc:0 "Erusea's peace has a shape: garrisons, treaties and debts. Whether it is an order or an occupation depends on who is asked."
 ERU_ud_the_line_holds:0 "The Line Holds"
 ERU_ud_the_line_holds_desc:0 "The war ended without a decision, or never began. Erusea and its neighbours face each other across a line that nobody has agreed to call a border. Provisional gameplay."
 ERU_ud_demarcation_patrols:0 "Demarcation Patrols"
 ERU_ud_demarcation_patrols_desc:0 "Joint patrols walk the line every week, so that an incident does not become a war."
 ERU_ud_prisoner_lists:0 "Prisoner Lists"
 ERU_ud_prisoner_lists_desc:0 "Both sides exchange lists of the prisoners they hold and the missing they are looking for."
 ERU_ud_keep_the_line_manned:0 "Keep the Line Manned"
 ERU_ud_keep_the_line_manned_desc:0 "The army stays on the armistice line at full strength until a treaty is signed. It is expensive, it is safe and it keeps a great many reservists away from the farms that need them."
 ERU_ud_thin_the_line:0 "Thin the Line"
 ERU_ud_thin_the_line_desc:0 "The army leaves a screen of regulars on the line and sends the reservists home to rebuild. It is a bet that the other side wants peace as much as Erusea does."
 ERU_ud_fortify_the_line:0 "Fortify the Line"
 ERU_ud_fortify_the_line_desc:0 "Bunkers, minefields and observation posts are built along the whole armistice line, so that a smaller garrison can hold it. The concrete makes the line look permanent, which it may become."
 ERU_ud_reservist_rotation:0 "Reservist Rotation"
 ERU_ud_reservist_rotation_desc:0 "Reservists serve three months on the line every two years, so that the burden is shared and every district knows what the line looks like at night."
 ERU_ud_return_of_the_reservists:0 "Return of the Reservists"
 ERU_ud_return_of_the_reservists_desc:0 "The reservists come home to farms and factories that have waited for them, and to towns that held their jobs open. The harvest that year is the best since the fragments."
 ERU_ud_armistice_commission:0 "The Armistice Commission"
 ERU_ud_armistice_commission_desc:0 "A standing commission of officers from both sides meets monthly to settle incidents along the line. Its meetings are dull, which is exactly what they are for."
 ERU_ud_the_long_armistice:0 "The Long Armistice"
 ERU_ud_the_long_armistice_desc:0 "The line holds for another year, and then another. An armistice that lasts long enough starts to look like a peace."
 ERU_ud_recovery_before_revenge:0 "Recovery Before Revenge"
 ERU_ud_recovery_before_revenge_desc:0 "The government tells the country that the next decade belongs to rebuilding, not to settling scores."
 ERU_ud_court_ledger:0 "The Court Ledger"
 ERU_ud_court_ledger_desc:0 "The court has been mapped. It has not yet been tamed."
 ERU_ud_court_chancery:0 "The Palace Chancery"
 ERU_ud_court_chancery_desc:0 "One chancery, one register of decrees and one signature that means the same thing everywhere."
 ERU_ud_crown_estates:0 "Crown Estates Leases"
 ERU_ud_crown_estates_desc:0 "Leases on the Crown's farms, forests and harbours fund public works without a new tax."
 ERU_ud_prerogative_rule:0 "Rule by Prerogative"
 ERU_ud_prerogative_rule_desc:0 "Ministers serve at the palace's pleasure, and the palace intends to be pleased."
 ERU_ud_royal_secretariat:0 "The Royal Secretariat"
 ERU_ud_royal_secretariat_desc:0 "A cabinet of secretaries, appointed and dismissed by the Crown."
 ERU_ud_intendants:0 "Provincial Intendants"
 ERU_ud_intendants_desc:0 "Royal intendants govern the districts with authority over prefects, police and public works."
 ERU_ud_officers_oath_idea:0 "The Officers' Oath"
 ERU_ud_officers_oath_idea_desc:0 "Every officer has sworn personally to the Crown."
 ERU_ud_old_houses_idea:0 "Patronage of the Old Houses"
 ERU_ud_old_houses_idea_desc:0 "The landed families govern the districts for the Crown, and expect to be thanked."
 ERU_ud_crown_technocrats_idea:0 "Crown Technocrats"
 ERU_ud_crown_technocrats_idea_desc:0 "Engineers and economists of the royal academies run the ministries on merit."
 ERU_ud_royal_commission:0 "The Royal Ulysses Commission"
 ERU_ud_royal_commission_desc:0 "A royal commission with power to requisition, build and plan for the fragments."
 ERU_ud_loyal_regiments_idea:0 "The Loyal Regiments"
 ERU_ud_loyal_regiments_idea_desc:0 "Regiments that held to their oath during the coup year garrison the capital."
 ERU_ud_emergency_prerogative_idea:0 "Emergency Prerogative"
 ERU_ud_emergency_prerogative_idea_desc:0 "For one year the Crown legislates by decree alone."
 ERU_ud_crown_tribunals_idea:0 "Tribunals of the Crown"
 ERU_ud_crown_tribunals_idea_desc:0 "Royal tribunals try those who broke their oath, in closed session."
 ERU_ud_unbroken_crown_idea:0 "The Unbroken Crown"
 ERU_ud_unbroken_crown_idea_desc:0 "The Crown governed Erusea through the fragment years, and intends to govern it through the next decade."
 ERU_ud_drafting_commission_idea:0 "The Drafting Commission"
