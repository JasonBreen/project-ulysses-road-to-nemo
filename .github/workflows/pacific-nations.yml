name: Pacific national continuation contracts

on:
  push:
  pull_request:

jobs:
  national-continuations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned original-art dependency
        run: python -m pip install Pillow==11.3.0
      - name: Execute national choices with actual fiscal, political and SNP owners
        run: python -B tools/pacific_nations/test_runtime.py
      - name: Check national budgets, preserved imports, English and original presentation
        run: python -B tools/pacific_nations/test_source.py
