 ac_camp.75.t:0 "The sea on the windscreen"
 ac_camp.75.desc:0 "Grimm kept describing the sea. Every time he reached the part he meant to explain, he began with a different detail, as though the right description of the water would make the rest of the sortie easier to understand.\n\nNagase let him finish. The first carrier-hunt operation had returned a usable result, and the debrief required a clear account of what the crews had actually observed. It did not require a younger pilot to discover the right words before somebody would give him a chair.\n\nChopper sat backward on one of the spare chairs and listened more closely than his posture suggested. When Grimm stopped, he asked a practical question about the receiving call. Grimm answered it at once. The relief on his face was so visible that Chopper looked away before offering the next question.\n\nOutside, a mechanic was washing salt from a surface that had acquired a different significance to every person entering the hangar. To him it was a corrosion problem. To the crew it was something they had seen very close while trying to do their work above an ocean that offered no useful place to put a damaged aircraft.\n\nThe debriefing officer took the completed return and left the room. For a little while nobody followed him.\n\nGrimm asked whether he had spoken too much. Chopper said that would be an impressive achievement in the present company. Nagase smiled and reached for the untouched water beside the younger pilot. He took it, and the conversation finally moved on to a part of the flight he could explain without beginning again at the sea."
