 ac_sq.217.d_base:0 "An exhausted driver waited outside the station because the instruction had told him to hand over to the flight. The flight had expected a vehicle. Mara found the difference when she asked him when he had last slept. Irena could locate the office responsible for the journey; Niko could make a place for the driver to rest. Elias wanted to do both immediately, then discovered that both would consume people already assigned elsewhere. The driver's apology made the room uncomfortable. He had followed the route correctly. They were deciding whether to solve the immediate need with another private favor or force the plan to recognize the person whose arrival it had failed to describe."
 ac_sq.217.a:0 "Make the handover include the driver."
 ac_sq.217.a.reply:0 "Irena names the rest period and the next receiver, turning a kind improvisation into an obligation the plan can see."
 ac_sq.217.b:0 "Give him rest before making it a report."
 ac_sq.217.b.reply:0 "Niko clears a quiet room and Elias takes the first interrupted duty, leaving the driver free of another explanation."
 ac_sq.218.t:0 "A Journey Without a Uniform"
 ac_sq.218.d_base_callback:0 "Elias took a week away and returned with photographs in which nobody stood beside an aircraft. He showed them reluctantly, as though enjoying the trip might be mistaken for having needed the flight less. Niko studied a picture of an ordinary station platform and asked whether the train had been on time. Irena asked whether Elias had been. Mara could celebrate the absence as something the squadron had made possible or praise him for returning ready to be useful again. The difference was small enough to sound unimportant until she saw which answer he was listening for. A person could come back willingly without proving that leaving had been a mistake.\n\nThe proper leave entry has protected the week from becoming another favor to repay. Mara does not let the welcome take that protection away."
 ac_sq.218.d_base:0 "Elias took a week away and returned with photographs in which nobody stood beside an aircraft. He showed them reluctantly, as though enjoying the trip might be mistaken for having needed the flight less. Niko studied a picture of an ordinary station platform and asked whether the train had been on time. Irena asked whether Elias had been. Mara could celebrate the absence as something the squadron had made possible or praise him for returning ready to be useful again. The difference was small enough to sound unimportant until she saw which answer he was listening for. A person could come back willingly without proving that leaving had been a mistake."
 ac_sq.218.a:0 "Let the journey belong to him."
 ac_sq.218.a.reply:0 "Elias puts the photographs on the table without explaining what each day will contribute to his next watch."
 ac_sq.218.b:0 "Welcome the rested wingman back to work."
 ac_sq.218.b.reply:0 "He begins describing how much better he feels, grateful that usefulness remains an easy language for belonging."
 ac_sq.219.t:0 "The Unfamiliar Handwriting"
 ac_sq.219.d_base_callback:0 "The new controller had added a route Irena had never considered. Her first response was to find its weaknesses, and she found two. The newcomer pointed out a third and asked for help. Mara watched Irena decide whether that invitation meant the plan was unready or that its author was ready to learn. Niko recognized the moment and left them the larger table. Elias brought the old chart but did not unfold it. They could improve the proposal until it resembled the familiar method or let a different method remain different after its actual problems were solved. The flight had spent years wanting a second way home. Now it had to recognize one that did not look like its own.\n\nIrena remembers how much work it took not to finish the relief controller's first sentence. She waits for the new explanation to reach its end."
 ac_sq.219.d_base:0 "The new controller had added a route Irena had never considered. Her first response was to find its weaknesses, and she found two. The newcomer pointed out a third and asked for help. Mara watched Irena decide whether that invitation meant the plan was unready or that its author was ready to learn. Niko recognized the moment and left them the larger table. Elias brought the old chart but did not unfold it. They could improve the proposal until it resembled the familiar method or let a different method remain different after its actual problems were solved. The flight had spent years wanting a second way home. Now it had to recognize one that did not look like its own."
 ac_sq.219.a:0 "Help the new method stand on its own."
 ac_sq.219.a.reply:0 "Irena writes her corrections in the margin without redrawing the route, and the new controller signs the finished plan."
 ac_sq.219.b:0 "Bring it into the flight's proven method."
 ac_sq.219.b.reply:0 "The plan becomes easier for the experienced watch to trust, and Elias knows which familiar chart to carry."
 ac_sq.220.t:0 "The Road Left Open"
 ac_sq.220.d_base_callback:0 "Mara's mother no longer wrote the address twice. She enclosed a new card anyway, with a note asking who should receive the old photographs when the drawer became too full. The flight had people now who did not remember the first jacket, the borrowed keys or the bus whose empty seat had required a new plan. Elias could tell the stories well. Irena could explain which lessons still worked. Niko could show the repairs that remained temporary and name the ones they had finally learned to stop praising. Mara could offer the newcomers a story about people who had always found a way. She could also give them the more useful inheritance: permission to ask whether the way was still open.\n\nThe broken pencil is still there. The useless key is gone, replaced by a label that admits nobody ever found its lock."
 ac_sq.220.d_base:0 "Mara's mother no longer wrote the address twice. She enclosed a new card anyway, with a note asking who should receive the old photographs when the drawer became too full. The flight had people now who did not remember the first jacket, the borrowed keys or the bus whose empty seat had required a new plan. Elias could tell the stories well. Irena could explain which lessons still worked. Niko could show the repairs that remained temporary and name the ones they had finally learned to stop praising. Mara could offer the newcomers a story about people who had always found a way. She could also give them the more useful inheritance: permission to ask whether the way was still open."
 ac_sq.220.a:0 "Give them the questions as well as the stories."
 ac_sq.220.a.reply:0 "The newcomer writes a current receiving name beside an old route, and Mara leaves room for the next correction."
 ac_sq.220.b:0 "Give them confidence in the people before them."
 ac_sq.220.b.reply:0 "Elias tells the first story beside the drawer, and the newcomers understand why the flight still feels like somewhere to return."
 ac_sq.250.t:0 "Mara Dalen | Fighter and close-support pilot"
 ac_sq.250.d:0 "Mara joined a small service because it could still feel like a promise made to people she knew. She wants to defend more than the airfield fence, but is learning that every additional promise needs fuel, time and somebody willing to wait for her return."
 ac_sq.251.t:0 "Elias Vey | Wingman"
 ac_sq.251.d:0 "Elias has trained carefully for emergencies that arrive in an orderly sequence. His first squadron gives him friends who will not let him hide that uncertainty. He is quick to volunteer and slow to admit when a volunteer has become the person everybody expects to go."
 ac_sq.252.t:0 "Niko Arven | Maintenance lead"
 ac_sq.252.d:0 "Niko regards ingenuity as a tool, not a supply policy. He can keep an old machine useful and will argue fiercely about the point at which useful becomes unsafe. He remembers who helped when the stores were empty, including people the squadron would rather forget owing."
 ac_sq.253.t:0 "Irena Sorel | Operations and rescue controller"
 ac_sq.253.d:0 "Irena keeps several versions of every route: the fast one, the safe one and the one that still works when somebody fails to arrive. She is protective of civilians whose names never reach a squadron roster. A map, to her, is a list of people who will ask why they were not on it."
 ac_sq.290.t:0 "Someone at the Other End"
 ac_sq.290.d:0 "The route chart still has folds, although none belongs to a single person's memory now. Mara can go home without leaving a private arrangement behind her. Elias has learned to volunteer after asking what the promise will require. Niko's serviceability board records absences as honestly as successes. Irena can hear an unfamiliar explanation without treating its unfamiliarity as a fault. Their work has not made every road safe or every national argument simple. It has made a reliable handover something people can expect rather than a favor they must know whom to request. The photographs leave the drawer in a plain envelope with one current address. A younger crew will decide where to keep them. Mara is content to let the destination change, provided someone at the other end knows they are coming. That is a smaller promise than doing everything and a much harder one to keep well."
 ac_sq.291.t:0 "The People Who Will Answer"
 ac_sq.291.d:0 "There is still a number somebody in the flight will answer. Mara is proud of that, and tired of how often it has become the last step in somebody else's incomplete plan. Elias knows which favors remain outstanding. Niko can keep the machine useful, though the explanation sometimes travels less reliably than the repair. Irena's old chart is easier to find than its newest copy. None of these things makes their generosity false. They have helped people who needed an answer before a better arrangement could be made. The question is whether the next crew will inherit the help or the expectation that it must be improvised forever. Mara writes down the private contacts before leaving for home. She leaves blank spaces beside the names that should not remain indispensable. The flight has kept its promise to be there; it has not yet finished teaching the institution how to be there without spending the same people again."
 ac_sq.292.t:0 "Different Roads Home"
 ac_sq.292.d:0 "Mara recognizes the handwriting on the old chart before she recognizes the room where it has been stored. The flight's people have not all taken the same road afterward. Some needed a different watch, some needed a quieter duty, and some finally went home without leaving a promise to return at short notice. Niko still answers questions about the machine. Irena still wants a receiving name before she closes a route. Elias has learned that being needed and being able are different things, although he wishes the lesson had arrived more gently. Their closeness could not carry every demand placed upon it. Mara refuses to describe that failure as proof that none of the help mattered. She puts the current addresses beside the photographs. Another crew may read them as a warning or a source of courage. Either would be kinder than requiring the people in the pictures to remain forever available at the end of the old number."
