l_english:
 belka_dlp_lost.1.t:0 "The Defeat of Belka"
 belka_dlp_lost.1.d:0 "The Belkan War has ended in defeat. Belka must now face the consequences."
 belka_dlp_lost.1.a:0 "Continue"
 belka_dlp_lost.2.t:0 "A Shattered Army"
 belka_dlp_lost.2.d:0 "The defeat has shattered Belka's army."
 belka_dlp_lost.2.a:0 "Continue"
 belka_dlp_lost.3.t:0 "A Shattered Industry"
 belka_dlp_lost.3.d:0 "The defeat has left Belka's industry in ruins."
 belka_dlp_lost.3.a:0 "Continue"
 belka_dlp_lost.4.t:0 "A Shattered Pride"
 belka_dlp_lost.4.d:0 "The defeat has damaged Belka's national pride."
 belka_dlp_lost.4.a:0 "Continue"
 belka_dlp_lost.5.t:0 "The End of the DLP"
 belka_dlp_lost.5.d:0 "The defeat has brought the DLP's rule to an end."
 belka_dlp_lost.5.a:0 "The party is finished."
 belka_dlp_lost.6.t:0 "New Elections"
 belka_dlp_lost.6.d:0 "Belka must hold new elections after the defeat."
 belka_dlp_lost.6.a:0 "Hold the elections."
 belka_dlp_lost.7.t:0 "The Return of the King"
 belka_dlp_lost.7.d:0 "The king returns to power."
 belka_dlp_lost.7.a:0 "Restore the monarchy."

 ac_continuation.1.t:0 "After the Belkan War"
 ac_continuation.1.d:0 "The war has ended, but its political and material consequences remain. This continuation layer is a provisional gameplay branch built from the existing Belkan outcome flags; it does not assert an official chronology beyond the preserved archive."
 ac_continuation.1.a:0 "Set the terms of victory."
 ac_continuation.1.b:0 "Hold together the narrow peace."
 ac_continuation.1.c:0 "Rebuild under the settlement."
 ac_continuation.1.d:0 "Begin an unclassified continuation."
 ac_continuation.2.t:0 "The First Reconstruction Report"
 ac_continuation.2.d:0 "The first reconstruction program has produced a measurable result. The next decisions will determine whether the postwar state remains constrained by emergency measures or turns toward a durable recovery."
 ac_continuation.2.a:0 "Record the gains and continue."
 ac_continuation.10.t:0 "The Settlement Reaches Home"
 ac_continuation.10.d:0 "The Belkan settlement has reached our administration. This is an authored gameplay consequence of the selected branch, not a claim about an official border settlement."
 ac_continuation.10.a:0 "Manage the consequences locally."
 ac_continuation.11.t:0 "A Guarantor's Burden"
 ac_continuation.11.d:0 "With Belka defeated, the Osean government faces the political cost of enforcing a fragile peace. This continuation hook is provisional and branch-dependent."
 ac_continuation.11.a:0 "Accept the responsibility."
 ac_postwar_reconstruction_program:0 "National Reconstruction Program"
 ac_postwar_reconstruction_program_desc:0 "A timed reconstruction program converts postwar strain into a concrete industrial recovery. The outcome is a gameplay abstraction, not a canon economic history."
 ac_postwar_demobilization:0 "Demobilize the War Establishment"
 ac_postwar_demobilization_desc:0 "Wind down the emergency establishment after reconstruction has begun, trading war support for political and social stability."
 ac_postwar_political_settlement:0 "Ratify the Political Settlement"
 ac_postwar_political_settlement_desc:0 "Consolidate a post-defeat political order before unresolved grievances become a new crisis."
 ac_postwar_local_recovery:0 "Administer the Local Settlement"
 ac_postwar_local_recovery_desc:0 "Fund local administration and recovery after the Belkan settlement."
 ac_postwar_victory_settlement:0 "Victory Settlement"
 ac_postwar_wacht_settlement:0 "Narrow Peace Settlement"
 ac_postwar_defeat_settlement:0 "Defeat Settlement"
 ac_postwar_reconstruction:0 "Reconstruction Program"
 ac_postwar_occupation_burden:0 "Occupation Administration Burden"
 ac_postwar_guarantor:0 "Peace Guarantor's Burden"
