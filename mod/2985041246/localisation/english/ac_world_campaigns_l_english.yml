 ac_wc_soa.20.d:0 "The secure network works while the visiting specialist remains beside it. Vey wants local maintainers. Halvek wants protected command links. Sellen asks how civilian traffic will be restored during an emergency.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
