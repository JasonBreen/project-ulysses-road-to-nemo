 DAK_wd_decree_terms:0 "Decrees with Expiry Dates"
 DAK_wd_decree_terms_desc:0 "Every decree lapses unless the advisory chamber reviews it."
 DAK_wd_mill_councils:0 "Councils in the Mills"
 DAK_wd_mill_councils_desc:0 "Every large workplace elects a council with a say over shifts and safety."
 DAK_wd_republic_constitution:0 "Constitution of the Republic"
 DAK_wd_republic_constitution_desc:0 "One written constitution; no ballot can be suspended by decree."
 DAK_wd_council_statute:0 "Statute of the Council of State"
 DAK_wd_council_statute_desc:0 "The presidency governs by written statute rather than habit."
 DAK_wd_council_federation:0 "Charter of the Councils"
 DAK_wd_council_federation_desc:0 "Council practice is written into a federal charter."
 DAK_wd_marshals_code:0 "The Public Order Code"
