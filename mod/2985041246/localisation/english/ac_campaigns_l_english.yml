 ac_camp.41.t:0 "The space beside the name"
 ac_camp.41.desc:0 "The clerk drew a line through the next duty assignment before anyone told him which form to use. He had been keeping the squadron board long enough to recognize the kind of silence that entered the room ahead of an official return.\n\nYellow Four's name remained on the maintenance return. The aircraft had been required, the fault had been recorded, and the people who had argued about the difference would now remember the argument in different ways. The clerk could correct a number on the board. He could not think of a correction that would make the empty space beneath it bearable.\n\nThe maintenance chief came in to collect the original fault returns. A staff officer asked whether the review could wait until the current emergency had passed. She looked at him for a moment and asked which emergency he meant. There had been a current emergency every day the aircraft was required.\n\nYellow Thirteen stood beside the door while the clerk finished the entry. Nobody in the room could offer a phrase that would make it adequate. The squadron still had orders, and the command would require a serviceable force for the next operation. Those facts continued to exist with an offensive indifference to the empty place among them.\n\nThe chief took the papers back to the hangar. They would be needed by whoever inherited the work and by whoever was eventually asked to explain it. A record could preserve the sequence of decisions without pretending that the people making them had understood the sequence in advance.\n\nThe clerk left room beneath the name for the final return. He had become very careful about leaving room."
 ac_camp.41.a:0 "Keep this account."
 ac_camp.41.z:0 "Close this old message."
