 YUK_snp_industrial_orders_civil_policy_spirit:0 "Civil workshop continuity"
 YUK_snp_industrial_orders_civil_policy_spirit_desc:0 "The factory manager can fill an order by postponing a repair that does not yet appear urgent. The public-services representative brings the maintenance return that explains why the repair matters. The commission cannot make both schedules disappear into an aggregate output figure. It must choose who can reserve skilled labour and how a missed civilian obligation is recorded. Better administration should help the physical factories work; it must not become a substitute factory ledger.\n\nProtect civil maintenance continuity. Factory learning benefits from regular work while the military accepts less freedom to reserve the same staff."
