 ac_wc_contact_opinion:0 "Reciprocal technical contact"
 ac_wc_cso.1.d:0 "Nadia Verrin brings a local petition to an administration accustomed to receiving instructions. Salim Arden asks for a durable technical service. Rafiq Sen wants a reserve that the government can actually maintain.\n\nNadia Verrin, district mediator / Salim Arden, technical instructor / Rafiq Sen, reserve coordinator. This is an original campaign discussion, not an official historical event."
 ac_wc_cso.1.defer:0 "Return the proposal to the staff"
 ac_wc_cso.1.p0:0 "District Consultation"
 ac_wc_cso.1.p1:0 "A Technical Administration"
 ac_wc_cso.1.p2:0 "A Guarded Local Mandate"
 ac_wc_cso.1.t:0 "The District Has a Voice"
 ac_wc_cso.2.d:0 "Arden can keep the machinery running while he remains in the workshop. He cannot be every replacement technician. The administration must choose how to turn individual experience into a dependable service.\n\nNadia Verrin, district mediator / Salim Arden, technical instructor / Rafiq Sen, reserve coordinator. This is an original campaign discussion, not an official historical event."
 ac_wc_cso.2.defer:0 "Return the proposal to the staff"
 ac_wc_cso.2.p0:0 "A Public Workshop School"
 ac_wc_cso.2.p1:0 "A Specialist Training Cell"
 ac_wc_cso.2.p2:0 "Reserve Technical Instruction"
 ac_wc_cso.2.t:0 "A Workshop Without a Successor"
 ac_wc_cso.3.d:0 "A small consignment is enough to delay several essential jobs. Verrin wants predictable civilian deliveries; Arden wants fewer incompatible parts. Sen asks for an emergency reserve without taking every spare from the workshops.\n\nNadia Verrin, district mediator / Salim Arden, technical instructor / Rafiq Sen, reserve coordinator. This is an original campaign discussion, not an official historical event."
 ac_wc_cso.3.defer:0 "Return the proposal to the staff"
 ac_wc_cso.3.p0:0 "Essential Civil Deliveries"
 ac_wc_cso.3.p1:0 "A Common Parts Store"
 ac_wc_cso.3.p2:0 "An Emergency Delivery Roster"
 ac_wc_cso.3.t:0 "The Delayed Delivery"
 ac_wc_cso.4.d:0 "Sen can add names to a roster faster than the administration can equip or train them. Verrin asks what duties those people will perform. Arden asks who will repair their equipment.\n\nNadia Verrin, district mediator / Salim Arden, technical instructor / Rafiq Sen, reserve coordinator. This is an original campaign discussion, not an official historical event."
 ac_wc_cso.4.defer:0 "Return the proposal to the staff"
 ac_wc_cso.4.p0:0 "A Civil Protection Service"
 ac_wc_cso.4.p1:0 "A Small Professional Cadre"
 ac_wc_cso.4.p2:0 "A Limited Reserve Guard"
 ac_wc_cso.4.t:0 "A Guard We Can Maintain"
 ac_wc_cso.5.d:0 "The inherited air service has to choose which tasks it can perform reliably. Arden asks for a repairable fleet, Sen for trained crews, and Verrin for a civil emergency role that does not disappear from the schedule.\n\nNadia Verrin, district mediator / Salim Arden, technical instructor / Rafiq Sen, reserve coordinator. This is an original campaign discussion, not an official historical event."
 ac_wc_cso.5.defer:0 "Return the proposal to the staff"
 ac_wc_cso.5.p0:0 "Civil Emergency Flying"
 ac_wc_cso.5.p1:0 "A Serviceable Air Detachment"
 ac_wc_cso.5.p2:0 "A Local Air Defense Cadre"
 ac_wc_cso.5.t:0 "One Air Service, Many Tasks"
 ac_wc_cso.6.d:0 "An outside offer promises support but leaves the receiving obligations unclear. Verrin wants the terms written down. Arden wants knowledge transferred. Sen wants the government to retain control over its own personnel.\n\nNadia Verrin, district mediator / Salim Arden, technical instructor / Rafiq Sen, reserve coordinator. This is an original campaign discussion, not an official historical event."
 ac_wc_cso.6.defer:0 "Return the proposal to the staff"
 ac_wc_cso.6.p0:0 "Public Terms for Assistance"
 ac_wc_cso.6.p1:0 "Skills Transfer First"
 ac_wc_cso.6.p2:0 "National Control of Personnel"
 ac_wc_cso.6.t:0 "An Offer With Conditions"
 ac_wc_cso.7.d:0 "The administration can send material away or use it to train a more capable workforce. Arden rejects the idea that either choice automatically creates new factories. Verrin asks whose service improves first.\n\nNadia Verrin, district mediator / Salim Arden, technical instructor / Rafiq Sen, reserve coordinator. This is an original campaign discussion, not an official historical event."
 ac_wc_cso.7.defer:0 "Return the proposal to the staff"
