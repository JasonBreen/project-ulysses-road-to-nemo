 ac_wc_soa.24.d:0 "A relief proposal would use crews and vehicles already assigned at home. Sellen wants a useful commitment; Vey wants a cost that can be paid. Halvek asks how the mission returns if the situation deteriorates.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
