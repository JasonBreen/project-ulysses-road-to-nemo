 ERU_camp_2_register:0 "The continental position"
 ERU_camp_2_register_desc:0 "The continental position. Open the campaign lane and its preparation record.\n\nA retreat can preserve an army, a reputation, or a population, and it seldom preserves all three. The roads on the staff map narrow when they reach the fuel returns. Local officials have their own lists of people who cannot leave. The command can authorize a withdrawal with its surviving cadre or demand another defense from the same tired formations. The choice is made while the front still exists. A later surrender cannot manufacture the arrangements that were refused here."
