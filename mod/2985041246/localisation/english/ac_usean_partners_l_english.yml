 SNS_up_review_burden:0 "Review the Civil Protection Burden"
 SNS_up_review_burden_desc:0 "Fund an accountable review of local protection work. An intact Stonehenge complex adds a project liaison task; after its loss the same staff review domestic continuity. This never changes the project's ownership or operational state."
 AMB_up_reassign_slot:0 "Reassign a Spare Slot to Domestic Work"
 AMB_up_reassign_slot_desc:0 "Spend one funded spare slot on a domestic receiving task instead of a coalition offer. The ordinary programme costs still apply. This is a useful fallback when cooperation is refused or unavailable."
 DEL_up_resolve_docket:0 "Resolve a Verified Command Docket"
 DEL_up_resolve_docket_desc:0 "Use a verified inspection case to resolve one outstanding command obligation. The review pays its normal programme cost, then restores one point of institutional capacity through the owning framework. It does not create a new command mandate."
 UGE_up_release_dispersal:0 "Release: Lease Dispersed Service Capacity"
 UGE_up_release_dispersal_desc:0 "Release this service commitment to free its occupied slot. Its political, administrative and fiscal costs are not refunded, and no completion credit is awarded. Another lease still requires a new funded allocation."
 UGE_up_release_mobility:0 "Release: Lease an Emergency Mobility Slot"
 UGE_up_release_mobility_desc:0 "Release this service commitment to free its occupied slot. Its political, administrative and fiscal costs are not refunded, and no completion credit is awarded. Another lease still requires a new funded allocation."
 UGE_up_release_receiving:0 "Release: Lease a Receiving Service Slot"
