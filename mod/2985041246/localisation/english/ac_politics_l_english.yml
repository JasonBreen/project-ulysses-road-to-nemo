 ac_pol_institutions:0 "National Institutions"
 ac_pol_institutions_desc:0 "[GetPoliticalInstitution]\nActive mandate: [GetPoliticalMandate]\n[GetPoliticalFiscalStatus]\n\nInstitutional capacity: [?ac_pol_capacity|0]/100. Civic and district mandates cost 1 capacity per week; a protected delivery mandate costs 2. All reserve political attention. At zero capacity the mandate suspends; recovery is a separate, paid choice. Institutional capacity is a provisional national gameplay measure."
