l_english:
 awwnb.2.a:0 "Acknowledge the deployment orders."
 belka_dlp_war.4.a:0 "Review the operational situation."
 belka_dlp_war.5.t:0 "Excalibur Opens Fire"
 belka_dlp_war.5.d:0 "Excalibur's crews report that firing orders have been carried out. Command is incorporating the weapon into its wartime operations, and opposing forces are being notified by events at the front. Its use changes the pressures facing both sides; it does not relieve our own forces of their continuing duties."
 belka_dlp_war.5.a:0 "Maintain the firing programme."
 belka_dlp_war.6.t:0 "Under Excalibur's Fire"
 belka_dlp_war.6.d:0 "Reports from the front confirm that Belka has brought Excalibur into action. Commanders must adapt their operations while the government deals with the alarm caused by the weapon's use. The immediate strain reaches beyond the front line, affecting confidence in the course of the war."
 belka_dlp_war.6.a:0 "We must adapt our operations."
 belka_dlp_war.105.t:0 "The Burden of Emergency Mobilisation"
 belka_dlp_war.105.d:0 "The exceptional arrangements sustaining the war are giving way to a harsher accounting of their costs. Military and economic departments must work under the revised emergency measures, while our neighbours receive their own assessments of the situation. Mobilisation cannot make those pressures disappear."
 belka_dlp_war.105.a:0 "Prepare the revised measures."
 belka_dlp_war.106.t:0 "A Revised Wartime Posture"
 belka_dlp_war.106.d:0 "Command has revised the extraordinary measures supporting the war effort. The new posture replaces the previous emergency arrangement. Departments must now plan around its altered demands while continuing to support the forces already in the field."
 belka_dlp_war.106.a:0 "Implement the revised posture."
 belka_l_monarchy.1.t:0 "A Programme of Retrenchment"
 belka_l_monarchy.1.d:0 "A sweeping reduction in industrial capacity and the armed forces has been ordered. Civilian works, military production and naval construction all face cuts, while the army is to be reduced under the existing programme. Carrying out those orders will reshape the capacity available to the government."
 belka_wacht_am_wal.3.a:0 "Record the standing orders."
 south_belka.4.t:0 "A Separate South Belkan Government"
 south_belka.4.d:0 "The separation now takes practical form. A government must assume responsibility for the transferred districts, maintain services and establish a viable chain of command. Osean backing offers outside support, but cannot remove the burden of organising a country during the crisis."
 south_belka.4.a:0 "Establish the administration."
 south_belka.5.t:0 "Reintegration with Belka"
 south_belka.5.d:0 "The separate administration is being wound down. Responsibility for South Belka's territory and armed forces passes to the Belkan government under the existing reintegration process. The remaining offices must arrange the transfer of their responsibilities."
 south_belka.5.a:0 "Acknowledge the transfer."
