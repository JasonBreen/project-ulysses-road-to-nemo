 DAK_wd_claim_in_law:0 "A Claim in Statute"
 DAK_wd_claim_in_law_desc:0 "The claims on North Dakrain and the Terentio Desert are written into law."
 DAK_wd_quiet_claim:0 "A Quiet Claim"
 DAK_wd_quiet_claim_desc:0 "The claims stay on record and off the agenda."
 DAK_wd_frontier_guard:0 "The Desert Line Guard"
