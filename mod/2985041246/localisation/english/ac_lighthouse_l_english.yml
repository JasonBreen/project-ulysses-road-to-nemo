 ERU_lw_opening_public_spirit:0 "Erusea: An Open Hearing"
 ERU_lw_opening_public_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ERU_lw_opening_ministerial_spirit:0 "Erusea: A Ministerial Docket"
 ERU_lw_opening_ministerial_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ac_lhw.50.t:0 "The Files of the Second Decade"
 ac_lhw.50.d:0 "The cabinet meets with the files the years since the Continental War have left behind: the oversight instruments, the insurrection's records, the registers of the displaced and the agreements that put a joint international project within reach of the republic's coast.\n\n[ERU_lw_route_context]\n\nThe question before the cabinet is what kind of republic Erusea means to be in the decade the official record fills with a war, and how much of that argument to have in public."
 ac_lhw.50.a:0 "Open the files to public questions."
 ac_lhw.50.b:0 "Begin with a protected cabinet docket."
 FCU_lw_opening_public_spirit:0 "Central Usea: An Open Hearing"
 FCU_lw_opening_public_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 FCU_lw_opening_ministerial_spirit:0 "Central Usea: A Ministerial Docket"
 FCU_lw_opening_ministerial_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ac_lhw.51.t:0 "Between Two Powers"
 ac_lhw.51.d:0 "The treaty secretariat has collected every undertaking the federation has given since the Continental War: to its partners, to Erusea's provisional government and to its own citizens. The continent's two largest powers are now arguing over the projects around the elevator, and the federation lies between them.\n\n[FCU_lw_route_context]\n\nThe federal cabinet must decide what the federation will do if that argument becomes a war, and how much of that decision to make where its neighbours can see it."
 ac_lhw.51.a:0 "Open the undertakings to public questions."
 ac_lhw.51.b:0 "Begin with a protected cabinet docket."
 ERU_sovereignty_ac_lhw_policy_callback_0:0 "The standing policy is treaty obligations kept. Its continuing cost remains part of the allocation."
 ERU_sovereignty_ac_lhw_policy_callback_1:0 "The standing policy is a republic rearmed. Its continuing cost remains part of the allocation."
 ERU_lw_sovereignty_reply_public_spirit:0 "Close the Oversight File: Public Return"
 ERU_lw_sovereignty_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Compile and publish the republic's compliance with its 2005 undertakings for the year. Public attention or reserved staff time remains committed to that work."
 ERU_lw_sovereignty_reply_protected_spirit:0 "Close the Oversight File: Protected Working Return"
 ERU_lw_sovereignty_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Train the officials who take over the last countersigned duties. Public attention or reserved staff time remains committed to that work."
 ac_lhw.60.t:0 "The Clause Nobody Has Read Since 2005"
 ac_lhw.60.d:0 "The compliance office has found a clause in the 2005 instruments that requires Erusea to notify its partners before any joint international project changes hands. Nobody has invoked it in fifteen years. Now a ministry wants to know whether a change in the management of a shared project would trigger it, and the lawyers disagree.\n\nThe treaty office wants to publish its reading of the clause and invite the partners to answer, so that the republic cannot be accused later of acting in the dark. The defence ministry would rather keep the question inside the cabinet: a public reading commits the republic to an interpretation it may regret.\n\n[ERU_sovereignty_ac_lhw_policy_callback]"
 ac_lhw.60.a:0 "Publish the reading and invite the partners' answer."
 ac_lhw.60.b:0 "Keep the question inside the cabinet."
 ERU_sovereignty_ac_lhw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_sovereignty_ac_lhw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_sovereignty_ac_lhw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lhw.90.t:0 "Accounts Rendered"
 ac_lhw.90.d:0 "The final review lists every 2005 undertaking with its current status: kept, returned, renegotiated or lapsed with the partners' knowledge. The forces rebuilt are listed in the same table as the obligations they test.\n\nThe clause about shared projects is in the appendix, with the reading the cabinet adopted and the date the partners were told. Whatever the republic decides next, it will not be able to say it did not know what it had promised.\n\n[ERU_sovereignty_ac_lhw_report_callback]\n\n[ERU_sovereignty_ac_lhw_policy_callback]"
 ac_lhw.90.a:0 "File the completed service record."
 ERU_standing_ac_lhw_policy_callback_0:0 "The standing policy is settled border policy. Its continuing cost remains part of the allocation."
 ERU_standing_ac_lhw_policy_callback_1:0 "The standing policy is watchful border policy. Its continuing cost remains part of the allocation."
 ERU_lw_standing_reply_public_spirit:0 "Take Stock of the Decade: Public Return"
 ERU_lw_standing_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep liaison officers meeting each neighbour's counterparts on a fixed schedule. Public attention or reserved staff time remains committed to that work."
 ERU_lw_standing_reply_protected_spirit:0 "Take Stock of the Decade: Protected Working Return"
 ERU_lw_standing_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Review every outstanding claim and concession with the office responsible for it. Public attention or reserved staff time remains committed to that work."
 ac_lhw.61.t:0 "A Map Marked in Two Colours"
 ac_lhw.61.d:0 "The legal office has produced a map of the republic's borders marked in two colours: the lines every neighbour accepts and the lines Erusea alone calls settled. The second colour covers more ground than the ministers expected.\n\nThe foreign ministry proposes publishing the map, so that the republic's position is the one its neighbours read rather than the one they guess at. The general staff asks that it stay inside the cabinet: a published map is a list of what Erusea will not fight for.\n\n[ERU_standing_ac_lhw_policy_callback]"
 ac_lhw.61.a:0 "Publish the two-colour map."
 ac_lhw.61.b:0 "Keep the map inside the cabinet."
 ERU_standing_ac_lhw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_standing_ac_lhw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_standing_ac_lhw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lhw.91.t:0 "The Position the Republic Holds"
 ac_lhw.91.d:0 "The final review is a single statement of position, neighbour by neighbour, with the date each was told. Some answered. Some did not. The incidents of the year are listed beside the answers.\n\nThe two-colour map is in the file. Fewer lines are marked in the second colour than when it was drawn.\n\n[ERU_standing_ac_lhw_report_callback]\n\n[ERU_standing_ac_lhw_policy_callback]"
 ac_lhw.91.a:0 "File the completed service record."
 ERU_elevator_ac_lhw_policy_callback_0:0 "The standing policy is shared-project partnership. Its continuing cost remains part of the allocation."
 ERU_elevator_ac_lhw_policy_callback_1:0 "The standing policy is sovereign project posture. Its continuing cost remains part of the allocation."
 ERU_lw_elevator_reply_public_spirit:0 "Survey the Space Elevator's Shadow: Public Return"
 ERU_lw_elevator_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Place Erusean engineers with the elevator's joint projects for a defined period. Public attention or reserved staff time remains committed to that work."
 ERU_lw_elevator_reply_protected_spirit:0 "Survey the Space Elevator's Shadow: Protected Working Return"
 ERU_lw_elevator_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Survey the traffic, rules and obligations in the elevator's shadow and report to the cabinet. Public attention or reserved staff time remains committed to that work."
 ac_lhw.62.t:0 "A Line Item Nobody Explains"
 ac_lhw.62.d:0 "The audit team has found a line in the joint accounts that the partners describe as 'defence of the elevator' and will not itemise. It is not small. Erusean officials have asked three times what it pays for and received three polite answers that do not say.\n\nThe survey office wants to publish the question, so that the republic's partners answer it in public or admit they will not. The foreign ministry prefers a private note: a public question about defence spending reads as an accusation, and the official record of 2019 shows where accusations led.\n\n[ERU_elevator_ac_lhw_policy_callback]"
 ac_lhw.62.a:0 "Publish the question about the line item."
 ac_lhw.62.b:0 "Send a private note and wait for the answer."
 ERU_elevator_ac_lhw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_elevator_ac_lhw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_elevator_ac_lhw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lhw.92.t:0 "The Elevator Policy on Record"
 ac_lhw.92.d:0 "The final review records the republic's elevator policy as a list of projects: the ones Erusea takes part in, the ones it audits, the ones it watches. The unexplained line item is still unexplained. The review says so, and names the office that will keep asking.\n\nNothing in the record decides what the republic will do if the questions stop being answered.\n\n[ERU_elevator_ac_lhw_report_callback]\n\n[ERU_elevator_ac_lhw_policy_callback]"
 ac_lhw.92.a:0 "File the completed service record."
 ERU_alicorn_ac_lhw_policy_callback_0:0 "The standing policy is royal navy programme. Its continuing cost remains part of the allocation."
 ERU_alicorn_ac_lhw_policy_callback_1:0 "The standing policy is civil shipyard programme. Its continuing cost remains part of the allocation."
 ERU_lw_alicorn_reply_public_spirit:0 "Authorise the Submarine Cruiser: Public Return"
 ERU_lw_alicorn_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Review the cruiser's design against the custody rules before construction proceeds. Public attention or reserved staff time remains committed to that work."
 ERU_lw_alicorn_reply_protected_spirit:0 "Authorise the Submarine Cruiser: Protected Working Return"
 ERU_lw_alicorn_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Prepare the yard, the crews and the accounts for a hull of this size. Public attention or reserved staff time remains committed to that work."
 ac_lhw.63.t:0 "A Captain Chosen Before the Boat"
 ac_lhw.63.d:0 "The navy has named the officer it wants to command the cruiser, years before it will float. He is a Continental War veteran with a loyal following and a reputation that fills the file. The cabinet did not ask for a name; the navy sent one anyway.\n\nThe design bureau wants the custody rules published now, with the command appointment made subject to them in public. The navy prefers a private understanding: a public rule reads as distrust of an officer who has given the republic nothing but service.\n\n[ERU_alicorn_ac_lhw_policy_callback]"
 ac_lhw.63.a:0 "Publish the custody rules with the appointment."
 ac_lhw.63.b:0 "Settle the rules privately with the fleet."
 ERU_alicorn_ac_lhw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_alicorn_ac_lhw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_alicorn_ac_lhw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lhw.93.t:0 "Rules Written While It Was Still on Paper"
 ac_lhw.93.d:0 "The final review records the custody rules as adopted: who orders the cruiser to sea, who orders it to fire, what record each order leaves and who reads it. The programme's accounts are attached, whichever yard kept them.\n\nThe officer's name is in the file. The rules apply to him as they apply to anyone.\n\n[ERU_alicorn_ac_lhw_report_callback]\n\n[ERU_alicorn_ac_lhw_policy_callback]"
 ac_lhw.93.a:0 "File the completed service record."
 ERU_drones_ac_lhw_policy_callback_0:0 "The standing policy is unmanned strike doctrine. Its continuing cost remains part of the allocation."
 ERU_drones_ac_lhw_policy_callback_1:0 "The standing policy is manned-primary doctrine. Its continuing cost remains part of the allocation."
 ERU_lw_drones_reply_public_spirit:0 "Charter an Unmanned Aviation Programme: Public Return"
 ERU_lw_drones_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Fly the programme's trials under the draft rules of engagement and record every decision. Public attention or reserved staff time remains committed to that work."
 ERU_lw_drones_reply_protected_spirit:0 "Charter an Unmanned Aviation Programme: Protected Working Return"
 ERU_lw_drones_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Review the rules of engagement with the legal office and the aircrews who will apply them. Public attention or reserved staff time remains committed to that work."
 ac_lhw.64.t:0 "A Target the Machine Chose"
 ac_lhw.64.d:0 "During trials an unmanned aircraft selected a target its operators had not marked. It did not fire; the rules did not allow it to. The test wing's report describes the selection in detail and asks whether the rules should be loosened, since the target was, in fact, legitimate.\n\nThe legal office wants the report published, so that the republic's 'clean war' claim, if it is ever made, rests on a record anyone can read. The air staff prefers to keep it inside the programme: a public account of what the machine nearly did is an invitation to every critic of the programme.\n\n[ERU_drones_ac_lhw_policy_callback]"
 ac_lhw.64.a:0 "Publish the trials report."
 ac_lhw.64.b:0 "Keep the report inside the programme."
 ERU_drones_ac_lhw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_drones_ac_lhw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_drones_ac_lhw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lhw.94.t:0 "The Doctrine on Record"
 ac_lhw.94.d:0 "The final review records the doctrine and its rules as adopted, with the trials that tested them. The incident of the unmarked target is in the file with the decision the cabinet took about it.\n\nThe programme fielded no strike in the review period. The record says what it would be allowed to do.\n\n[ERU_drones_ac_lhw_report_callback]\n\n[ERU_drones_ac_lhw_policy_callback]"
 ac_lhw.94.a:0 "File the completed service record."
 ERU_lighthouse_ac_lhw_policy_callback_0:0 "The standing policy is a fortress elevator. Its continuing cost remains part of the allocation."
 ERU_lighthouse_ac_lhw_policy_callback_1:0 "The standing policy is an elevator kept running. Its continuing cost remains part of the allocation."
 ERU_lw_lighthouse_reply_public_spirit:0 "Garrison the Captured Elevator: Public Return"
 ERU_lw_lighthouse_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Rotate the garrison and its supply through the elevator's approaches under the chosen posture. Public attention or reserved staff time remains committed to that work."
 ERU_lw_lighthouse_reply_protected_spirit:0 "Garrison the Captured Elevator: Protected Working Return"
 ERU_lw_lighthouse_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep the facility's civil staff paid, protected and working under Erusean guard. Public attention or reserved staff time remains committed to that work."
 ac_lhw.65.t:0 "The Engineer Who Would Not Leave"
 ac_lhw.65.d:0 "A senior engineer of the elevator's civil staff has refused evacuation. The facility, she says, needs its operators more than its guards, and she will not hand it to people who do not know how it works. The garrison commander wants her removed; the civil office wants her name in the official account.\n\nThe civil office proposes publishing the staff who stayed, as evidence that the elevator is kept working rather than seized. The garrison command wants the list protected: every name on it is a name the other side can use.\n\n[ERU_lighthouse_ac_lhw_policy_callback]"
 ac_lhw.65.a:0 "Publish the staff who stayed."
 ac_lhw.65.b:0 "Protect the staff list."
 ERU_lighthouse_ac_lhw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_lighthouse_ac_lhw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_lighthouse_ac_lhw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lhw.95.t:0 "What the Garrison Held"
 ac_lhw.95.d:0 "The final review records what the garrison held and what it kept moving: the traffic, the staff, the incidents and the cost. It decides the elevator's future after the fighting without deciding who will hold it then.\n\nThe engineer's name is in the file. She is still at work.\n\n[ERU_lighthouse_ac_lhw_report_callback]\n\n[ERU_lighthouse_ac_lhw_policy_callback]"
 ac_lhw.95.a:0 "File the completed service record."
 ERU_capital_ac_lhw_policy_callback_0:0 "The standing policy is a capital under arms. Its continuing cost remains part of the allocation."
 ERU_capital_ac_lhw_policy_callback_1:0 "The standing policy is a capital kept open. Its continuing cost remains part of the allocation."
 ERU_lw_capital_reply_public_spirit:0 "Prepare the Capital's Defence: Public Return"
 ERU_lw_capital_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Build and staff ground relays so the ministries keep working when the satellite networks fail. Public attention or reserved staff time remains committed to that work."
 ERU_lw_capital_reply_protected_spirit:0 "Prepare the Capital's Defence: Protected Working Return"
 ERU_lw_capital_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep the ministries' records, staff and decisions working through the attack on the capital. Public attention or reserved staff time remains committed to that work."
 ac_lhw.66.t:0 "The Day the Screens Went Dark"
 ac_lhw.66.d:0 "On the morning the networks failed, the finance ministry's payroll ran anyway, from paper ledgers a clerk had kept against instructions. The relay network the communications ministry built reached the districts it was meant to reach and no further. The cabinet now has two reports: one about the ledgers and one about the relays, and they disagree about what saved the day.\n\nThe continuity office wants both published, so that the capital's residents know what worked. The communications ministry asks that the relay report stay protected: its gaps are a map of where the capital cannot hear.\n\n[ERU_capital_ac_lhw_policy_callback]"
 ac_lhw.66.a:0 "Publish both reports."
 ac_lhw.66.b:0 "Protect the relay report."
 ERU_capital_ac_lhw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_capital_ac_lhw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_capital_ac_lhw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lhw.96.t:0 "A Capital That Kept Working"
 ac_lhw.96.d:0 "The final review lists what the capital kept doing while the attack the Chronicle records for 19 September 2019 went on: payroll, courts, water, the relays that worked and the ones that did not. It does not say who held the city; the war says that.\n\nThe clerk's ledgers are in the appendix. They are now the ministry's instructions.\n\n[ERU_capital_ac_lhw_report_callback]\n\n[ERU_capital_ac_lhw_policy_callback]"
 ac_lhw.96.a:0 "File the completed service record."
 ERU_ceasefire_ac_lhw_policy_callback_0:0 "The standing policy is a public accounting. Its continuing cost remains part of the allocation."
 ERU_ceasefire_ac_lhw_policy_callback_1:0 "The standing policy is a protected accounting. Its continuing cost remains part of the allocation."
 ERU_lw_ceasefire_reply_public_spirit:0 "The War's Account: Public Return"
 ERU_lw_ceasefire_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Compile the account of the war from the orders, strikes and decisions on file. Public attention or reserved staff time remains committed to that work."
 ERU_lw_ceasefire_reply_protected_spirit:0 "The War's Account: Protected Working Return"
 ERU_lw_ceasefire_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Answer each partner's written questions from the compiled account. Public attention or reserved staff time remains committed to that work."
 ac_lhw.67.t:0 "The Order Without a Signature"
 ac_lhw.67.d:0 "The commission has found an order from the war's last weeks that nobody signed. It was carried out. The officers who carried it out say it came through the chain of command; the chain of command says it did not. The official abstract records that a traditionalist sect of the Erusean Army joined a voluntary coalition of Osean forces at the end; the commission does not know whether this order belongs to that story.\n\nThe commission wants the unsigned order published as found. The defence ministry asks for a protected finding first: a public order without a signature is an invitation to name one.\n\n[ERU_ceasefire_ac_lhw_policy_callback]"
 ac_lhw.67.a:0 "Publish the unsigned order as found."
 ac_lhw.67.b:0 "Protect the finding until the signature is traced."
 ERU_ceasefire_ac_lhw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_ceasefire_ac_lhw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_ceasefire_ac_lhw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lhw.97.t:0 "A Republic After the Lighthouse War"
 ac_lhw.97.d:0 "The final review is the republic's account of the war as it was actually fought and ended, with the partners' questions and the answers given. The unsigned order is in it, with what the commission could and could not establish.\n\nThe republic signed what it signed and no more. The account says so.\n\n[ERU_ceasefire_ac_lhw_report_callback]\n\n[ERU_ceasefire_ac_lhw_policy_callback]"
 ac_lhw.97.a:0 "File the completed service record."
 ERU_secession_ac_lhw_policy_callback_0:0 "The standing policy is negotiated autonomy. Its continuing cost remains part of the allocation."
 ERU_secession_ac_lhw_policy_callback_1:0 "The standing policy is restored authority. Its continuing cost remains part of the allocation."
 ERU_lw_secession_reply_public_spirit:0 "Answer the Declarations of Independence: Public Return"
 ERU_lw_secession_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep negotiators, interpreters and a protected meeting place available to the small nations. Public attention or reserved staff time remains committed to that work."
 ERU_lw_secession_reply_protected_spirit:0 "Answer the Declarations of Independence: Protected Working Return"
 ERU_lw_secession_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Restore the republic's administration in the districts that declared independence, under recorded rules. Public attention or reserved staff time remains committed to that work."
 ac_lhw.68.t:0 "A Delegation at the Door"
 ac_lhw.68.d:0 "A delegation from one of the small nations has arrived in the capital with a declaration in one hand and a list of grievances in the other. The grievances are specific: taxes collected and not returned, offices closed, a language not taught. The declaration is general. The cabinet can answer either.\n\nThe negotiation office wants the grievances published with the republic's answers, so that the declaration is argued in public. The interior ministry prefers a protected answer: a published list of grievances is a published list of the republic's failures.\n\n[ERU_secession_ac_lhw_policy_callback]"
 ac_lhw.68.a:0 "Publish the grievances with the republic's answers."
 ac_lhw.68.b:0 "Answer the delegation in private."
 ERU_secession_ac_lhw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 ERU_secession_ac_lhw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 ERU_secession_ac_lhw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lhw.98.t:0 "The Terms on Record"
 ac_lhw.98.d:0 "The final review records the terms reached with each small nation, negotiated or restored, with the incidents of the period and the cost. It draws no border. Where a nation exists as a country in this campaign, the record says so and changes nothing about it.\n\nThe delegation's list of grievances is in the file, with the answers given.\n\n[ERU_secession_ac_lhw_report_callback]\n\n[ERU_secession_ac_lhw_policy_callback]"
 ac_lhw.98.a:0 "File the completed service record."
 FCU_airspace_ac_lhw_policy_callback_0:0 "The standing policy is closed airspace. Its continuing cost remains part of the allocation."
 FCU_airspace_ac_lhw_policy_callback_1:0 "The standing policy is a declared transit corridor. Its continuing cost remains part of the allocation."
 FCU_lw_airspace_reply_public_spirit:0 "Rule on the Continental Airspace: Public Return"
 FCU_lw_airspace_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep the radar and reporting stations that record every flight through federal airspace staffed. Public attention or reserved staff time remains committed to that work."
 FCU_lw_airspace_reply_protected_spirit:0 "Rule on the Continental Airspace: Protected Working Return"
 FCU_lw_airspace_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Answer every recorded violation in writing through the published procedure. Public attention or reserved staff time remains committed to that work."
 ac_lhw.69.t:0 "A Flight That Filed No Plan"
 ac_lhw.69.d:0 "A military aircraft crossed federal airspace at night without a flight plan and left the way it came. The radar record is clear; the nationality is not. The violations desk has drafted a note to two governments, since it cannot tell which one to send it to.\n\nThe air traffic authority wants the radar track published with the note, so that whoever flew it knows the federation saw it. The foreign ministry prefers to send the note privately to both: a published track is an accusation against one of them.\n\n[FCU_airspace_ac_lhw_policy_callback]"
 ac_lhw.69.a:0 "Publish the track with the note."
 ac_lhw.69.b:0 "Send the note privately to both governments."
 FCU_airspace_ac_lhw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 FCU_airspace_ac_lhw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 FCU_airspace_ac_lhw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lhw.99.t:0 "An Airspace Policy on Record"
 ac_lhw.99.d:0 "The final review records the flights, the violations and the answers of the period, with the policy as adopted. It grants nothing to anyone. The night flight is in the record, still without a nationality, with the notes that were sent.\n\n[FCU_airspace_ac_lhw_report_callback]\n\n[FCU_airspace_ac_lhw_policy_callback]"
 ac_lhw.99.a:0 "File the completed service record."
 FCU_corridor_ac_lhw_policy_callback_0:0 "The standing policy is a corridor under federal escort. Its continuing cost remains part of the allocation."
 FCU_corridor_ac_lhw_policy_callback_1:0 "The standing policy is a corridor under neutral flags. Its continuing cost remains part of the allocation."
 FCU_lw_corridor_reply_public_spirit:0 "Open a Humanitarian Corridor: Public Return"
 FCU_lw_corridor_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Move a scheduled series of registered convoys through the corridor under the chosen protection. Public attention or reserved staff time remains committed to that work."
 FCU_lw_corridor_reply_protected_spirit:0 "Open a Humanitarian Corridor: Protected Working Return"
 FCU_lw_corridor_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Register every convoy's cargo, route and clearance and answer the belligerents' queries. Public attention or reserved staff time remains committed to that work."
 ac_lhw.70.t:0 "A Convoy Stopped at a Checkpoint"
 ac_lhw.70.d:0 "A registered convoy was stopped at a belligerent checkpoint and held for a day while its cargo was searched. The cargo was what the registry said. The convoy commander's report asks whether the federation will protest, and the registry's report asks whether the search was within the rules the belligerents agreed.\n\nThe logistics office wants the stop published, so that the next checkpoint knows the federation records them. The foreign ministry prefers a private protest: a published stop reads as a charge against one side.\n\n[FCU_corridor_ac_lhw_policy_callback]"
 ac_lhw.70.a:0 "Publish the stop and the registry entry."
 ac_lhw.70.b:0 "Protest privately and keep the convoy moving."
 FCU_corridor_ac_lhw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 FCU_corridor_ac_lhw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 FCU_corridor_ac_lhw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lhw.100.t:0 "A Corridor That Reached Its End"
 ac_lhw.100.d:0 "The final review counts the convoys, the cargo, the stops and the answers. It takes no side and changes no line. The stopped convoy is in the record, with the search that found what the registry said it would.\n\n[FCU_corridor_ac_lhw_report_callback]\n\n[FCU_corridor_ac_lhw_policy_callback]"
 ac_lhw.100.a:0 "File the completed service record."
 FCU_blackout_ac_lhw_policy_callback_0:0 "The standing policy is ground relays first. Its continuing cost remains part of the allocation."
 FCU_blackout_ac_lhw_policy_callback_1:0 "The standing policy is a replacement satellite programme. Its continuing cost remains part of the allocation."
 FCU_lw_blackout_reply_public_spirit:0 "Answer the Continental Blackout: Public Return"
 FCU_lw_blackout_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Build and staff the ground relays that restore federal communications district by district. Public attention or reserved staff time remains committed to that work."
 FCU_lw_blackout_reply_protected_spirit:0 "Answer the Continental Blackout: Protected Working Return"
 FCU_lw_blackout_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Design the replacement satellites and secure the launch capacity to orbit them. Public attention or reserved staff time remains committed to that work."
 ac_lhw.71.t:0 "The District Nobody Could Reach"
 ac_lhw.71.d:0 "For eleven days after the blackout, one district received no instruction from the federal government and gave none. Its council ran the district on its own authority and kept a record. The record is good. The council now asks whether it did the right thing, and whether it will be reached next time.\n\nThe communications authority wants the district's record published as a model, so that every council knows what to do when the networks fail. The interior ministry prefers a protected review: a published model of self-government is an invitation to use it.\n\n[FCU_blackout_ac_lhw_policy_callback]"
 ac_lhw.71.a:0 "Publish the district's record as a model."
 ac_lhw.71.b:0 "Review the record privately."
 FCU_blackout_ac_lhw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 FCU_blackout_ac_lhw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 FCU_blackout_ac_lhw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lhw.101.t:0 "Communications the Federation Controls"
 ac_lhw.101.d:0 "The final review lists what the federation can now reach on its own, what it reaches through partners and what it cannot reach at all. The district that governed itself for eleven days is in the record, with the instruction it now has for the next time.\n\n[FCU_blackout_ac_lhw_report_callback]\n\n[FCU_blackout_ac_lhw_policy_callback]"
 ac_lhw.101.a:0 "File the completed service record."
 FCU_settlement_ac_lhw_policy_callback_0:0 "The standing policy is a guarantor of the settlement. Its continuing cost remains part of the allocation."
 FCU_settlement_ac_lhw_policy_callback_1:0 "The standing policy is a convenor of the conference. Its continuing cost remains part of the allocation."
 FCU_lw_settlement_reply_public_spirit:0 "Convene the Postwar Settlement: Public Return"
 FCU_lw_settlement_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep the secretariat, interpreters and the record of the postwar conference running. Public attention or reserved staff time remains committed to that work."
 FCU_lw_settlement_reply_protected_spirit:0 "Convene the Postwar Settlement: Protected Working Return"
 FCU_lw_settlement_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Review each obligation the federation accepted or declined under the settlement. Public attention or reserved staff time remains committed to that work."
 ac_lhw.72.t:0 "The Chair at the End of the Table"
 ac_lhw.72.d:0 "The parties have asked the federation to take the chair at the end of the table: not a seat among them, but the seat that calls the session to order and signs the record. Taking it costs nothing today. Refusing it is a statement; accepting it is a precedent.\n\nThe secretariat wants the invitation and the federation's answer published, so that the federation's role is the one it chose in public. The cabinet office prefers to answer privately first: a published acceptance is an acceptance the federation cannot revise.\n\n[FCU_settlement_ac_lhw_policy_callback]"
 ac_lhw.72.a:0 "Publish the invitation and the answer."
 ac_lhw.72.b:0 "Answer privately first."
 FCU_settlement_ac_lhw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 FCU_settlement_ac_lhw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 FCU_settlement_ac_lhw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lhw.102.t:0 "A Federation That Hosted the Peace"
 ac_lhw.102.d:0 "The final review records what the federation accepted, declined and hosted, with the obligations each choice left. It names no treaty the parties did not sign.\n\nThe chair at the end of the table is in the record, with who sat in it.\n\n[FCU_settlement_ac_lhw_report_callback]\n\n[FCU_settlement_ac_lhw_policy_callback]"
 ac_lhw.102.a:0 "File the completed service record."
 ERU_lw_final_public_spirit:0 "Erusea: Public Maintenance Assessment"
 ERU_lw_final_public_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 ERU_lw_final_readiness_spirit:0 "Erusea: Reserved Readiness Return"
 ERU_lw_final_readiness_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 ERU_lw_opening_callback_public:0 "The opening hearing invited public questions. Its final account returns to that promise without pretending that every disagreement has been resolved."
 ERU_lw_opening_callback_ministerial:0 "The opening review began with a protected ministerial docket. Its final account identifies what that process delivered and who must answer for the work still waiting."
 ERU_lw_opening_callback_unanswered:0 "The opening invitation was never ratified. This assessment records that absence and proceeds from the services actually completed."
 ac_lhw.120.t:0 "The Republic That Remains"
 ac_lhw.120.d:0 "The cabinet's last review of the period lists what the republic now does on its own authority, what it does under obligations it chose to keep and what the war, if there was one, decided for it. It names the offices responsible for each.\n\nErusea after the Lighthouse War is not the country its ministers would have designed. It is one whose government can be held to account for what it did, by its own people as well as by its neighbours.\n\n[ERU_lw_opening_callback]"
 ac_lhw.120.a:0 "Support a public maintenance review."
 ac_lhw.120.b:0 "Reserve staff for a focused readiness return."
 FCU_lw_final_public_spirit:0 "Central Usea: Public Maintenance Assessment"
 FCU_lw_final_public_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 FCU_lw_final_readiness_spirit:0 "Central Usea: Reserved Readiness Return"
 FCU_lw_final_readiness_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 FCU_lw_opening_callback_public:0 "The opening hearing invited public questions. Its final account returns to that promise without pretending that every disagreement has been resolved."
 FCU_lw_opening_callback_ministerial:0 "The opening review began with a protected ministerial docket. Its final account identifies what that process delivered and who must answer for the work still waiting."
 FCU_lw_opening_callback_unanswered:0 "The opening invitation was never ratified. This assessment records that absence and proceeds from the services actually completed."
 ac_lhw.121.t:0 "A Federation That Chose Its Part"
 ac_lhw.121.d:0 "The final account of the period is a list of the parts the federation chose: in the air, on the roads, in the dark and at the table. Some it played in full. Some it declined, with the reason recorded.\n\nThe federation has not become a different kind of power. It has become one whose neighbours can read, in one place, what it said it would do and what it did.\n\n[FCU_lw_opening_callback]"
 ac_lhw.121.a:0 "Support a public maintenance review."
 ac_lhw.121.b:0 "Reserve staff for a focused readiness return."
