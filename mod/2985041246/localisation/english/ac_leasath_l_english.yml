 LEA_le_labour_service_1_desc:0 "Staff and supply the mining towns' clinics for one period.\n\nThe health ministry must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 LEA_le_labour_service_2_spirit:0 "Inspect the Mines"
 LEA_le_labour_service_2_spirit_desc:0 "The labour inspectorate maintains this funded service for ninety days. Inspect wages, hours and safety at the mines for one period. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 LEA_le_labour_service_2:0 "Inspect the Mines"
 LEA_le_labour_service_2_desc:0 "Inspect wages, hours and safety at the mines for one period.\n\nThe labour inspectorate must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 LEA_le_government_service_1_spirit:0 "Pay the Contested Provinces"
 LEA_le_government_service_1_spirit_desc:0 "The treasury maintains this funded service for ninety days. Pay civil servants in contested provinces for one period. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 LEA_le_government_service_1:0 "Pay the Contested Provinces"
 LEA_le_government_service_1_desc:0 "Pay civil servants in contested provinces for one period.\n\nThe treasury must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 LEA_le_government_service_2_spirit:0 "Run the Emergency Cabinet"
 LEA_le_government_service_2_spirit_desc:0 "The cabinet office maintains this funded service for ninety days. Staff and fund the wartime cabinet office for one period. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 LEA_le_government_service_2:0 "Run the Emergency Cabinet"
 LEA_le_government_service_2_desc:0 "Staff and fund the wartime cabinet office for one period.\n\nThe cabinet office must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 LEA_le_front_service_1_spirit:0 "Escort the Convoys"
 LEA_le_front_service_1_spirit_desc:0 "The army's transport command maintains this funded service for ninety days. Escort the convoys on the main roads for one period. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 LEA_le_front_service_1:0 "Escort the Convoys"
 LEA_le_front_service_1_desc:0 "Escort the convoys on the main roads for one period.\n\nThe army's transport command must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 LEA_le_front_service_2_spirit:0 "Fortify a City"
 LEA_le_front_service_2_spirit_desc:0 "The general staff maintains this funded service for ninety days. Fortify one city's approaches and supply stores. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 LEA_le_front_service_2:0 "Fortify a City"
 LEA_le_front_service_2_desc:0 "Fortify one city's approaches and supply stores.\n\nThe general staff must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 LEA_le_settlement_service_1_spirit:0 "Hold a Round of Talks"
 LEA_le_settlement_service_1_spirit_desc:0 "The foreign ministry maintains this funded service for ninety days. Hold one round of talks with the factions' negotiators. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 LEA_le_settlement_service_1:0 "Hold a Round of Talks"
 LEA_le_settlement_service_1_desc:0 "Hold one round of talks with the factions' negotiators.\n\nThe foreign ministry must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 LEA_le_settlement_service_2_spirit:0 "Draft the Amnesty Rolls"
 LEA_le_settlement_service_2_spirit_desc:0 "The ministry of justice maintains this funded service for ninety days. Compile the rolls of fighters eligible for the amnesty. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 LEA_le_settlement_service_2:0 "Draft the Amnesty Rolls"
 LEA_le_settlement_service_2_desc:0 "Compile the rolls of fighters eligible for the amnesty.\n\nThe ministry of justice must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 LEA_le_mines_policy_a_spirit:0 "Renegotiated concessions"
 LEA_le_mines_policy_a_spirit_desc:0 "The concessions will be renegotiated one by one, with royalties raised and local hiring written into each. Renegotiation keeps the firms and their investment; it takes years, and the firms will remember who pressed them."
 LEA_le_mines_policy_a_spirit_settled:0 "Renegotiated concessions: Standing Settlement"
 LEA_le_mines_policy_a_spirit_settled_desc:0 "The settlement fixes the terms on which Leasath's minerals are worked. It does not decide whether anyone exploited anyone. It leaves a country that can read its own accounts. The continuing opportunity cost remains."
 LEA_le_mines_policy_b_spirit:0 "Mines in state hands"
 LEA_le_mines_policy_b_spirit_desc:0 "The largest mines will be taken into state hands, with compensation paid over a decade. The state keeps the revenue and the jobs; the firms and their governments call it confiscation."
 LEA_le_mines_policy_b_spirit_settled:0 "Mines in state hands: Standing Settlement"
 LEA_le_mines_policy_b_spirit_settled_desc:0 "The settlement fixes the terms on which Leasath's minerals are worked. It does not decide whether anyone exploited anyone. It leaves a country that can read its own accounts. The continuing opportunity cost remains."
 LEA_le_mines_register:0 "Review the Mining Concessions"
 LEA_le_mines_register_desc:0 "Leasath's wealth is in the ground, and much of it is worked under concessions signed with foreign firms on terms few Leasathians have read. The ministry of mines will list every concession, who holds it and what it pays the country."
 LEA_le_mines_policy_a:0 "Renegotiate the Concessions"
 LEA_le_mines_policy_a_desc:0 "The concessions will be renegotiated one by one, with royalties raised and local hiring written into each. Renegotiation keeps the firms and their investment; it takes years, and the firms will remember who pressed them."
 LEA_le_mines_policy_b:0 "Take the Mines Into State Hands"
 LEA_le_mines_policy_b_desc:0 "The largest mines will be taken into state hands, with compensation paid over a decade. The state keeps the revenue and the jobs; the firms and their governments call it confiscation."
 LEA_le_mines_operations:0 "Publish the Royalty Accounts"
 LEA_le_mines_operations_desc:0 "The royalty accounts will be published every year: what each mine produced, what it paid and where the money went. Publication answers the question every Leasathian asks about the mines, and it shows how little some of them paid."
 LEA_le_mines_review:0 "Review a Concession Service Period"
 LEA_le_mines_review_desc:0 "A completed, funded service period under the chosen policy must be reviewed before the concessions become settled law. The review compares royalties collected with the figures published."
 LEA_le_mines_settlement:0 "Mines on the Record"
 LEA_le_mines_settlement_desc:0 "The settlement fixes the terms on which Leasath's minerals are worked. It does not decide whether anyone exploited anyone. It leaves a country that can read its own accounts."
 LEA_le_provinces_policy_a_spirit:0 "Federal settlement"
 LEA_le_provinces_policy_a_spirit_desc:0 "The provinces will keep their councils and their budgets under a federal settlement, with the capital responsible for defence and foreign affairs. Federalism gives every region a stake; it gives every regional leader a platform."
 LEA_le_provinces_policy_a_spirit_settled:0 "Federal settlement: Standing Settlement"
 LEA_le_provinces_policy_a_spirit_settled_desc:0 "The settlement records how Leasath shares power among its provinces. It does not predict which of them will one day take up arms. It leaves a map of who decides what. The continuing opportunity cost remains."
 LEA_le_provinces_policy_b_spirit:0 "Strong centre"
 LEA_le_provinces_policy_b_spirit_desc:0 "The capital will appoint the provincial governors and set their budgets. A strong centre acts quickly and speaks with one voice; the regions it overrides learn to look for another."
 LEA_le_provinces_policy_b_spirit_settled:0 "Strong centre: Standing Settlement"
 LEA_le_provinces_policy_b_spirit_settled_desc:0 "The settlement records how Leasath shares power among its provinces. It does not predict which of them will one day take up arms. It leaves a map of who decides what. The continuing opportunity cost remains."
 LEA_le_provinces_register:0 "Map the Provinces' Authority"
 LEA_le_provinces_register_desc:0 "Leasath's provinces were drawn by treaties and governors, not by the people who live in them. The interior ministry will record what each province decides for itself, what the capital decides for it and where nobody decides at all."
 LEA_le_provinces_policy_a:0 "A Federal Settlement"
 LEA_le_provinces_policy_a_desc:0 "The provinces will keep their councils and their budgets under a federal settlement, with the capital responsible for defence and foreign affairs. Federalism gives every region a stake; it gives every regional leader a platform."
 LEA_le_provinces_policy_b:0 "A Strong Centre"
 LEA_le_provinces_policy_b_desc:0 "The capital will appoint the provincial governors and set their budgets. A strong centre acts quickly and speaks with one voice; the regions it overrides learn to look for another."
 LEA_le_provinces_operations:0 "Fund the Provincial Councils"
 LEA_le_provinces_operations_desc:0 "Provincial councils will be funded to deliver schools, roads and clinics, with their accounts reported to the capital. Councils that deliver earn trust; councils that cannot become grievances."
 LEA_le_provinces_review:0 "Review a Provincial Service Period"
 LEA_le_provinces_review_desc:0 "A completed, funded service period under the chosen settlement must be reviewed before it becomes the country's constitution. The review asks which provinces delivered and which complained."
 LEA_le_provinces_settlement:0 "A Country of Provinces"
 LEA_le_provinces_settlement_desc:0 "The settlement records how Leasath shares power among its provinces. It does not predict which of them will one day take up arms. It leaves a map of who decides what."
 LEA_le_army_policy_a_spirit:0 "Army under the assembly"
 LEA_le_army_policy_a_spirit_desc:0 "The army will answer to the assembly, with its budget voted each year and its commanders confirmed in public. Civilian control is slow and political; it makes a coup harder to justify."
 LEA_le_army_policy_a_spirit_settled:0 "Army under the assembly: Standing Settlement"
 LEA_le_army_policy_a_spirit_settled_desc:0 "The settlement records the army's place in the state. It names no commander. The official record says a commander later led Leasath into war; this record asks who he would answer to. The continuing opportunity cost remains."
 LEA_le_army_policy_b_spirit:0 "Army above the factions"
 LEA_le_army_policy_b_spirit_desc:0 "The army will stand above the factions as the guardian of the state, answering to its own command. A guardian army is united and confident; it decides for itself what the state needs guarding from."
 LEA_le_army_policy_b_spirit_settled:0 "Army above the factions: Standing Settlement"
 LEA_le_army_policy_b_spirit_settled_desc:0 "The settlement records the army's place in the state. It names no commander. The official record says a commander later led Leasath into war; this record asks who he would answer to. The continuing opportunity cost remains."
 LEA_le_army_register:0 "Define the Army's Place"
 LEA_le_army_register_desc:0 "Leasath's army has guarded mines, borders and governments in turn. The defence ministry will decide what the army is for, and to whom it answers when the government and the assembly disagree."
 LEA_le_army_policy_a:0 "An Army Under the Assembly"
 LEA_le_army_policy_a_desc:0 "The army will answer to the assembly, with its budget voted each year and its commanders confirmed in public. Civilian control is slow and political; it makes a coup harder to justify."
 LEA_le_army_policy_b:0 "An Army Above the Factions"
 LEA_le_army_policy_b_desc:0 "The army will stand above the factions as the guardian of the state, answering to its own command. A guardian army is united and confident; it decides for itself what the state needs guarding from."
 LEA_le_army_operations:0 "Train an Officer Corps"
 LEA_le_army_operations_desc:0 "Officers will be trained at a national academy, with promotion by examination rather than patronage. A professional corps fights better; it also knows its own strength."
 LEA_le_army_review:0 "Review an Army Service Period"
 LEA_le_army_review_desc:0 "A completed, funded service period under the chosen arrangement must be reviewed before it becomes doctrine. The review asks whom the army obeyed when it mattered."
 LEA_le_army_settlement:0 "An Army That Answers"
 LEA_le_army_settlement_desc:0 "The settlement records the army's place in the state. It names no commander. The official record says a commander later led Leasath into war; this record asks who he would answer to."
 LEA_le_labour_policy_a_spirit:0 "Labour charter"
 LEA_le_labour_policy_a_spirit_desc:0 "A labour charter will set wages, hours and safety in every mine, enforced by inspectors and courts. The charter costs the mines money and the state effort; it gives the workers a law to appeal to instead of a picket line."
 LEA_le_labour_policy_a_spirit_settled:0 "Labour charter: Standing Settlement"
 LEA_le_labour_policy_a_spirit_settled_desc:0 "The settlement records what the state guarantees the people who work its mines. It does not end the grievance. It writes down what was promised. The continuing opportunity cost remains."
 LEA_le_labour_policy_b_spirit:0 "Order in the mines"
 LEA_le_labour_policy_b_spirit_desc:0 "Order will be kept in the mines by the police and, if necessary, the army, with strikes banned in essential sites. Order keeps the minerals moving; it makes the grievances quieter and deeper."
 LEA_le_labour_policy_b_spirit_settled:0 "Order in the mines: Standing Settlement"
 LEA_le_labour_policy_b_spirit_settled_desc:0 "The settlement records what the state guarantees the people who work its mines. It does not end the grievance. It writes down what was promised. The continuing opportunity cost remains."
 LEA_le_labour_register:0 "Hear the Mine Workers"
 LEA_le_labour_register_desc:0 "Strikes in the mines have grown longer and angrier since the asteroid years. The labour ministry will hear the workers' grievances and decide what the state will guarantee them."
 LEA_le_labour_policy_a:0 "A Labour Charter"
 LEA_le_labour_policy_a_desc:0 "A labour charter will set wages, hours and safety in every mine, enforced by inspectors and courts. The charter costs the mines money and the state effort; it gives the workers a law to appeal to instead of a picket line."
 LEA_le_labour_policy_b:0 "Order in the Mines"
 LEA_le_labour_policy_b_desc:0 "Order will be kept in the mines by the police and, if necessary, the army, with strikes banned in essential sites. Order keeps the minerals moving; it makes the grievances quieter and deeper."
 LEA_le_labour_operations:0 "Fund the Workers' Clinics"
 LEA_le_labour_operations_desc:0 "Clinics will be opened in the mining towns, funded by the royalties. A clinic is the first thing the state can show a mining town that it gets back from its mines."
 LEA_le_labour_review:0 "Review a Labour Service Period"
 LEA_le_labour_review_desc:0 "A completed, funded service period under the chosen policy must be reviewed before it becomes settled law. The review counts strikes, injuries and clinic visits."
 LEA_le_labour_settlement:0 "A Charter on the Record"
 LEA_le_labour_settlement_desc:0 "The settlement records what the state guarantees the people who work its mines. It does not end the grievance. It writes down what was promised."
 LEA_le_government_policy_a_spirit:0 "Government of national unity"
 LEA_le_government_policy_a_spirit_desc:0 "The government will invite every faction that will stop fighting into a national unity cabinet. Unity brings in the moderates; it leaves the government arguing with itself."
 LEA_le_government_policy_a_spirit_settled:0 "Government of national unity: Standing Settlement"
 LEA_le_government_policy_a_spirit_settled_desc:0 "The settlement records the government that carried Leasath through its civil war. It names no victor; the record names none. It leaves a state that still paid its clerks. The continuing opportunity cost remains."
 LEA_le_government_policy_b_spirit:0 "Emergency rule"
 LEA_le_government_policy_b_spirit_desc:0 "The government will rule by emergency decree until the fighting stops, with the assembly suspended. Emergency rule acts quickly; every faction it excludes calls it a dictatorship."
 LEA_le_government_policy_b_spirit_settled:0 "Emergency rule: Standing Settlement"
 LEA_le_government_policy_b_spirit_settled_desc:0 "The settlement records the government that carried Leasath through its civil war. It names no victor; the record names none. It leaves a state that still paid its clerks. The continuing opportunity cost remains."
 LEA_le_government_register:0 "Keep the State Running"
 LEA_le_government_register_desc:0 "Leasath is at war with itself. The ACES Chronicle records only that the civil war ended in 2019 after ten years of fighting; who fought it, and why, is this campaign's own provisional account. The government must decide how to keep the state running while its provinces fight."
 LEA_le_government_policy_a:0 "A Government of National Unity"
 LEA_le_government_policy_a_desc:0 "The government will invite every faction that will stop fighting into a national unity cabinet. Unity brings in the moderates; it leaves the government arguing with itself."
 LEA_le_government_policy_b:0 "Emergency Rule"
 LEA_le_government_policy_b_desc:0 "The government will rule by emergency decree until the fighting stops, with the assembly suspended. Emergency rule acts quickly; every faction it excludes calls it a dictatorship."
 LEA_le_government_operations:0 "Pay the Civil Service"
 LEA_le_government_operations_desc:0 "Teachers, nurses and clerks will be paid wherever the government can reach them, including in contested provinces. A salary paid is the state's claim to exist."
 LEA_le_government_review:0 "Review a Wartime Government Period"
 LEA_le_government_review_desc:0 "A completed, funded service period under the chosen government must be reviewed before it becomes the country's wartime constitution. The review asks how far the state's authority reached."
 LEA_le_government_settlement:0 "A State That Survived"
 LEA_le_government_settlement_desc:0 "The settlement records the government that carried Leasath through its civil war. It names no victor; the record names none. It leaves a state that still paid its clerks."
 LEA_le_front_policy_a_spirit:0 "Hold the cities"
 LEA_le_front_policy_a_spirit_desc:0 "The army will hold the cities, where most people live and the state's offices stand. Holding the cities keeps the government visible; it leaves the mines to whoever takes them."
 LEA_le_front_policy_a_spirit_settled:0 "Hold the cities: Standing Settlement"
 LEA_le_front_policy_a_spirit_settled_desc:0 "The settlement records what the government's forces held and why. It does not decide the war. It leaves an account of what each choice cost. The continuing opportunity cost remains."
 LEA_le_front_policy_b_spirit:0 "Take the mines"
 LEA_le_front_policy_b_spirit_desc:0 "The army will take the mines, which pay for every side's war. Holding the mines funds the government; it leaves the cities to fend for themselves."
 LEA_le_front_policy_b_spirit_settled:0 "Take the mines: Standing Settlement"
 LEA_le_front_policy_b_spirit_settled_desc:0 "The settlement records what the government's forces held and why. It does not decide the war. It leaves an account of what each choice cost. The continuing opportunity cost remains."
 LEA_le_front_register:0 "Hold the Front"
 LEA_le_front_register_desc:0 "The civil war is fought over cities, mines and the roads between them. The general staff will decide what the government's forces defend first."
 LEA_le_front_policy_a:0 "Hold the Cities"
 LEA_le_front_policy_a_desc:0 "The army will hold the cities, where most people live and the state's offices stand. Holding the cities keeps the government visible; it leaves the mines to whoever takes them."
 LEA_le_front_policy_b:0 "Take the Mines"
 LEA_le_front_policy_b_desc:0 "The army will take the mines, which pay for every side's war. Holding the mines funds the government; it leaves the cities to fend for themselves."
 LEA_le_front_operations:0 "Protect the Roads"
 LEA_le_front_operations_desc:0 "Convoys and roads will be protected so that food and fuel reach the cities and the front. A road kept open feeds a city; a road lost starves it."
 LEA_le_front_review:0 "Review a Front Service Period"
 LEA_le_front_review_desc:0 "A completed, funded service period under the chosen strategy must be reviewed before it becomes doctrine. The review counts what was held, what was lost and what got through."
 LEA_le_front_settlement:0 "The Front Held"
 LEA_le_front_settlement_desc:0 "The settlement records what the government's forces held and why. It does not decide the war. It leaves an account of what each choice cost."
 LEA_le_settlement_policy_a_spirit:0 "Talks across the lines"
 LEA_le_settlement_policy_a_spirit_desc:0 "The government will open talks with every faction that names a negotiator, with ceasefires local first and national later. Talks may end the war sooner; they also give every faction a seat it did not win."
 LEA_le_settlement_policy_a_spirit_settled:0 "Talks across the lines: Standing Settlement"
 LEA_le_settlement_policy_a_spirit_settled_desc:0 "The settlement records how Leasath's civil war was meant to end. The official record says only that it ended in 2019. This record says how the government tried. The continuing opportunity cost remains."
 LEA_le_settlement_policy_b_spirit:0 "Victory first"
 LEA_le_settlement_policy_b_spirit_desc:0 "The government will fight until the factions surrender, with talks only on the terms of surrender. Victory settles the question of who governs; it takes as long as the factions can fight."
 LEA_le_settlement_policy_b_spirit_settled:0 "Victory first: Standing Settlement"
 LEA_le_settlement_policy_b_spirit_settled_desc:0 "The settlement records how Leasath's civil war was meant to end. The official record says only that it ended in 2019. This record says how the government tried. The continuing opportunity cost remains."
 LEA_le_settlement_register:0 "Seek an End to the War"
 LEA_le_settlement_register_desc:0 "Ten years is a long time for a country to fight itself. The government must decide whether it will talk to the factions or fight until they stop."
 LEA_le_settlement_policy_a:0 "Talks Across the Lines"
 LEA_le_settlement_policy_a_desc:0 "The government will open talks with every faction that names a negotiator, with ceasefires local first and national later. Talks may end the war sooner; they also give every faction a seat it did not win."
 LEA_le_settlement_policy_b:0 "Victory First"
 LEA_le_settlement_policy_b_desc:0 "The government will fight until the factions surrender, with talks only on the terms of surrender. Victory settles the question of who governs; it takes as long as the factions can fight."
 LEA_le_settlement_operations:0 "Prepare the Amnesty"
 LEA_le_settlement_operations_desc:0 "An amnesty will be drafted for fighters who lay down their arms, with exceptions for crimes the courts must hear. An amnesty is the bridge a war crosses to become a peace."
 LEA_le_settlement_review:0 "Review a Settlement Period"
 LEA_le_settlement_review_desc:0 "A completed, funded service period under the chosen approach must be reviewed before it becomes the country's settlement. The review asks who came to the table, and who stayed away."
 LEA_le_settlement_settlement:0 "A War That Ended"
 LEA_le_settlement_settlement_desc:0 "The settlement records how Leasath's civil war was meant to end. The official record says only that it ended in 2019. This record says how the government tried."
 ac_lcw_funded_cost:0 "£pol_power 35 / 4 cap"
 ac_lcw_funded_cost_tooltip:0 "Authorization commits 35 political power and four institutional-capacity points, plus the programme fee shown in the category. Spent resources are not refunded when a period is interrupted."
 ac_lcw_funded_cost_blocked:0 "£pol_power §R35§! / §R4§! cap"
 ac_lcw_fee_macro:0 "Programme fee: 0.002 billion abstract fiscal units."
 ac_lcw_fee_legacy:0 "Programme fee: 2 provisional fiscal units."
 ac_lcw_fee_none:0 "No fiscal fee currently applies. Political and institutional costs remain."
 ac_lcw_lea_services:0 "Leasath: Leasath's Foundation and Civil War"
 ac_lcw_lea_services_desc:0 "[ac_lcw_status_text]\n\n[ac_lcw_current_service_text]\n[ac_lcw_cooldown_text]\nService [?ac_lcw_elapsed|0]/90 days, [?ac_lcw_completed_services|0] completed, last period [?ac_lcw_last_delivered_days|0] days.\n\n[LEA_mines_ac_lcw_policy_line][LEA_provinces_ac_lcw_policy_line][LEA_army_ac_lcw_policy_line][LEA_labour_ac_lcw_policy_line][LEA_government_ac_lcw_policy_line][LEA_front_ac_lcw_policy_line][LEA_settlement_ac_lcw_policy_line][ac_lcw_fee_text]"
 LEA_le_cancel_service:0 "End the Current Service Period"
 LEA_le_cancel_service_desc:0 "Release the current rota immediately. Funding and institutional effort already spent are not refunded. Delivered time is retained in the record, but the interrupted period cannot unlock a completed-service review."
 LEA_le_opening_public_spirit:0 "Leasath: An Open Hearing"
 LEA_le_opening_public_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 LEA_le_opening_ministerial_spirit:0 "Leasath: A Ministerial Docket"
 LEA_le_opening_ministerial_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ac_lcw.50.t:0 "A Country Rich Underground"
 ac_lcw.50.d:0 "The cabinet meets with the country's oldest arguments in front of it: the mines and who works them, the provinces and who governs them, the army and whom it serves.\n\n[LEA_le_route_context]\n\nThe question before the cabinet is which of these arguments to settle first, and how much of the settling to do in public."
 ac_lcw.50.a:0 "Open the arguments to public questions."
 ac_lcw.50.b:0 "Begin with a protected cabinet docket."
 LEA_mines_ac_lcw_policy_callback_0:0 "The standing policy is renegotiated concessions. Its continuing cost remains part of the allocation."
 LEA_mines_ac_lcw_policy_callback_1:0 "The standing policy is mines in state hands. Its continuing cost remains part of the allocation."
 LEA_le_mines_reply_public_spirit:0 "Review the Mining Concessions: Public Return"
 LEA_le_mines_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Audit one year's royalties against the mines' production. Public attention or reserved staff time remains committed to that work."
 LEA_le_mines_reply_protected_spirit:0 "Review the Mining Concessions: Protected Working Return"
 LEA_le_mines_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Train inspectors to check safety and output at the concessions. Public attention or reserved staff time remains committed to that work."
 ac_lcw.60.t:0 "A Contract Signed Abroad"
 ac_lcw.60.d:0 "The audit has found a concession signed in a foreign capital, in a foreign language, by an official who no longer works for the ministry. The firm says the contract is valid; the ministry's lawyers are not sure it was ever ratified.\n\nThe ministry can publish the contract and the doubt about it, or negotiate quietly with the firm and keep the question out of the newspapers.\n\n[LEA_mines_ac_lcw_policy_callback]"
 ac_lcw.60.a:0 "Publish the contract and the doubt."
 ac_lcw.60.b:0 "Negotiate quietly with the firm."
 LEA_mines_ac_lcw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 LEA_mines_ac_lcw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 LEA_mines_ac_lcw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lcw.90.t:0 "Mines on the Record"
 ac_lcw.90.d:0 "The final review lists every concession with its terms, royalties and inspection results. The contract signed abroad is there, with what became of it.\n\nThe accounts do not settle the argument about the mines. They give both sides the same numbers.\n\n[LEA_mines_ac_lcw_report_callback]\n\n[LEA_mines_ac_lcw_policy_callback]"
 ac_lcw.90.a:0 "File the completed service record."
 LEA_provinces_ac_lcw_policy_callback_0:0 "The standing policy is federal settlement. Its continuing cost remains part of the allocation."
 LEA_provinces_ac_lcw_policy_callback_1:0 "The standing policy is strong centre. Its continuing cost remains part of the allocation."
 LEA_le_provinces_reply_public_spirit:0 "Map the Provinces' Authority: Public Return"
 LEA_le_provinces_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Fund the provincial councils' services for one period. Public attention or reserved staff time remains committed to that work."
 LEA_le_provinces_reply_protected_spirit:0 "Map the Provinces' Authority: Protected Working Return"
 LEA_le_provinces_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Convene the provincial governors on the period's disputes. Public attention or reserved staff time remains committed to that work."
 ac_lcw.61.t:0 "A Province That Will Not Pay"
 ac_lcw.61.d:0 "The southern mining province has refused to pass its royalty share to the capital until the capital funds its roads. The governor says the province has paid for decades and received nothing back.\n\nThe cabinet can publish the province's accounts and the capital's spending side by side, or negotiate privately with the governor.\n\n[LEA_provinces_ac_lcw_policy_callback]"
 ac_lcw.61.a:0 "Publish both accounts."
 ac_lcw.61.b:0 "Negotiate privately."
 LEA_provinces_ac_lcw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 LEA_provinces_ac_lcw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 LEA_provinces_ac_lcw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lcw.91.t:0 "A Country of Provinces"
 ac_lcw.91.d:0 "The final review lists the provinces with their councils, budgets and disputes. The southern province's refusal is there, with the settlement it reached.\n\nThe map has not changed. Who decides on it has.\n\n[LEA_provinces_ac_lcw_report_callback]\n\n[LEA_provinces_ac_lcw_policy_callback]"
 ac_lcw.91.a:0 "File the completed service record."
 LEA_army_ac_lcw_policy_callback_0:0 "The standing policy is army under the assembly. Its continuing cost remains part of the allocation."
 LEA_army_ac_lcw_policy_callback_1:0 "The standing policy is army above the factions. Its continuing cost remains part of the allocation."
 LEA_le_army_reply_public_spirit:0 "Define the Army's Place: Public Return"
 LEA_le_army_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Train one class of officers at the national academy. Public attention or reserved staff time remains committed to that work."
 LEA_le_army_reply_protected_spirit:0 "Define the Army's Place: Protected Working Return"
 LEA_le_army_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Hold the assembly's annual hearing on the army's budget. Public attention or reserved staff time remains committed to that work."
 ac_lcw.62.t:0 "A Colonel's Speech"
 ac_lcw.62.d:0 "A colonel has told graduating cadets that the army owes loyalty to the nation, not to whoever happens to govern it. The speech was cheered. The assembly wants him disciplined.\n\nThe ministry can publish the speech with its own answer, or transfer the colonel quietly to a remote post.\n\n[LEA_army_ac_lcw_policy_callback]"
 ac_lcw.62.a:0 "Publish the speech and an answer."
 ac_lcw.62.b:0 "Transfer him quietly."
 LEA_army_ac_lcw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 LEA_army_ac_lcw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 LEA_army_ac_lcw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lcw.92.t:0 "An Army That Answers"
 ac_lcw.92.d:0 "The final review records the army's chain of command and the hearings it attended. The colonel's speech is in the file, with the ministry's answer.\n\nWhether the army will answer in a crisis is a question no review can settle. This one records who asked.\n\n[LEA_army_ac_lcw_report_callback]\n\n[LEA_army_ac_lcw_policy_callback]"
 ac_lcw.92.a:0 "File the completed service record."
 LEA_labour_ac_lcw_policy_callback_0:0 "The standing policy is labour charter. Its continuing cost remains part of the allocation."
 LEA_labour_ac_lcw_policy_callback_1:0 "The standing policy is order in the mines. Its continuing cost remains part of the allocation."
 LEA_le_labour_reply_public_spirit:0 "Hear the Mine Workers: Public Return"
 LEA_le_labour_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Staff and supply the mining towns' clinics for one period. Public attention or reserved staff time remains committed to that work."
 LEA_le_labour_reply_protected_spirit:0 "Hear the Mine Workers: Protected Working Return"
 LEA_le_labour_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Inspect wages, hours and safety at the mines for one period. Public attention or reserved staff time remains committed to that work."
 ac_lcw.63.t:0 "A Strike at the Largest Mine"
 ac_lcw.63.d:0 "The largest mine's workers have struck over a collapsed tunnel that killed six men. The company says the tunnel was inspected; the union says the inspector never went underground.\n\nThe ministry can publish the inspection report and open an inquiry, or end the strike first and examine the report afterwards.\n\n[LEA_labour_ac_lcw_policy_callback]"
 ac_lcw.63.a:0 "Publish the report and open an inquiry."
 ac_lcw.63.b:0 "End the strike first."
 LEA_labour_ac_lcw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 LEA_labour_ac_lcw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 LEA_labour_ac_lcw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lcw.93.t:0 "A Charter on the Record"
 ac_lcw.93.d:0 "The final review lists the mines with their wages, injuries and strikes, and the clinics with their patients. The collapsed tunnel is there, with the inquiry's finding.\n\nThe miners have a record of what they were promised. So does the state.\n\n[LEA_labour_ac_lcw_report_callback]\n\n[LEA_labour_ac_lcw_policy_callback]"
 ac_lcw.93.a:0 "File the completed service record."
 LEA_government_ac_lcw_policy_callback_0:0 "The standing policy is government of national unity. Its continuing cost remains part of the allocation."
 LEA_government_ac_lcw_policy_callback_1:0 "The standing policy is emergency rule. Its continuing cost remains part of the allocation."
 LEA_le_government_reply_public_spirit:0 "Keep the State Running: Public Return"
 LEA_le_government_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Pay civil servants in contested provinces for one period. Public attention or reserved staff time remains committed to that work."
 LEA_le_government_reply_protected_spirit:0 "Keep the State Running: Protected Working Return"
 LEA_le_government_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Staff and fund the wartime cabinet office for one period. Public attention or reserved staff time remains committed to that work."
 ac_lcw.64.t:0 "A Faction Asks for a Ministry"
 ac_lcw.64.d:0 "A faction that has fought the government for three years offers to stop if its leader is made minister of mines. Half the cabinet says this rewards rebellion; the other half says it ends a front.\n\nThe government can announce the offer and put it to the assembly, or negotiate in secret and present the result.\n\n[LEA_government_ac_lcw_policy_callback]"
 ac_lcw.64.a:0 "Put the offer to the assembly."
 ac_lcw.64.b:0 "Negotiate in secret."
 LEA_government_ac_lcw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 LEA_government_ac_lcw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 LEA_government_ac_lcw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lcw.94.t:0 "A State That Survived"
 ac_lcw.94.d:0 "The final review lists the provinces where the state paid its servants, year by year, through the war. The map shrinks and grows again.\n\nThe faction that asked for a ministry is in the record, with the answer it received.\n\n[LEA_government_ac_lcw_report_callback]\n\n[LEA_government_ac_lcw_policy_callback]"
 ac_lcw.94.a:0 "File the completed service record."
 LEA_front_ac_lcw_policy_callback_0:0 "The standing policy is hold the cities. Its continuing cost remains part of the allocation."
 LEA_front_ac_lcw_policy_callback_1:0 "The standing policy is take the mines. Its continuing cost remains part of the allocation."
 LEA_le_front_reply_public_spirit:0 "Hold the Front: Public Return"
 LEA_le_front_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Escort the convoys on the main roads for one period. Public attention or reserved staff time remains committed to that work."
 LEA_le_front_reply_protected_spirit:0 "Hold the Front: Protected Working Return"
 LEA_le_front_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Fortify one city's approaches and supply stores. Public attention or reserved staff time remains committed to that work."
 ac_lcw.65.t:0 "A Mine Town Asks for Soldiers"
 ac_lcw.65.d:0 "A mining town besieged by a faction asks for a battalion. The general staff can send one only by taking it from a city's garrison.\n\nThe government can publish the choice and its reasons, or let the general staff decide without an announcement.\n\n[LEA_front_ac_lcw_policy_callback]"
 ac_lcw.65.a:0 "Publish the choice."
 ac_lcw.65.b:0 "Let the staff decide."
 LEA_front_ac_lcw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 LEA_front_ac_lcw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 LEA_front_ac_lcw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lcw.95.t:0 "The Front Held"
 ac_lcw.95.d:0 "The final review lists the cities, mines and roads the government's forces held, year by year. The besieged mining town is there, with what happened to it.\n\nThe front moved. The review records where.\n\n[LEA_front_ac_lcw_report_callback]\n\n[LEA_front_ac_lcw_policy_callback]"
 ac_lcw.95.a:0 "File the completed service record."
 LEA_settlement_ac_lcw_policy_callback_0:0 "The standing policy is talks across the lines. Its continuing cost remains part of the allocation."
 LEA_settlement_ac_lcw_policy_callback_1:0 "The standing policy is victory first. Its continuing cost remains part of the allocation."
 LEA_le_settlement_reply_public_spirit:0 "Seek an End to the War: Public Return"
 LEA_le_settlement_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Hold one round of talks with the factions' negotiators. Public attention or reserved staff time remains committed to that work."
 LEA_le_settlement_reply_protected_spirit:0 "Seek an End to the War: Protected Working Return"
 LEA_le_settlement_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Compile the rolls of fighters eligible for the amnesty. Public attention or reserved staff time remains committed to that work."
 ac_lcw.66.t:0 "A Negotiator Who Was a Commander"
 ac_lcw.66.d:0 "The largest faction has named as its negotiator a commander accused of shelling a market. The government's own negotiators refuse to sit with him.\n\nThe government can accept him and publish the accusation alongside the talks, or refuse him and ask the faction for someone else.\n\n[LEA_settlement_ac_lcw_policy_callback]"
 ac_lcw.66.a:0 "Accept him and publish the accusation."
 ac_lcw.66.b:0 "Ask for someone else."
 LEA_settlement_ac_lcw_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 LEA_settlement_ac_lcw_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 LEA_settlement_ac_lcw_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_lcw.96.t:0 "A War That Ended"
 ac_lcw.96.d:0 "The final review lists the talks held, the ceasefires agreed and broken, and the amnesty's rolls. The commander-negotiator is there, with what the courts later decided.\n\nThe war ended. The review records how much of the ending the government chose.\n\n[LEA_settlement_ac_lcw_report_callback]\n\n[LEA_settlement_ac_lcw_policy_callback]"
 ac_lcw.96.a:0 "File the completed service record."
 LEA_le_final_public_spirit:0 "Leasath: Public Maintenance Assessment"
 LEA_le_final_public_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 LEA_le_final_readiness_spirit:0 "Leasath: Reserved Readiness Return"
 LEA_le_final_readiness_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 LEA_le_opening_callback_public:0 "The opening hearing invited public questions. Its final account returns to that promise without pretending that every disagreement has been resolved."
 LEA_le_opening_callback_ministerial:0 "The opening review began with a protected ministerial docket. Its final account identifies what that process delivered and who must answer for the work still waiting."
 LEA_le_opening_callback_unanswered:0 "The opening invitation was never ratified. This assessment records that absence and proceeds from the services actually completed."
 ac_lcw.120.t:0 "A Country That Knows Its Grievances"
 ac_lcw.120.d:0 "The last review of the period sets Leasath's records side by side: the mines, the provinces, the army, the workers and the civil war. Each has a cost and a record of what it delivered.\n\nThe arguments are not settled. They are written down, which is the first thing a country needs before it can settle them without fighting.\n\n[LEA_le_opening_callback]"
 ac_lcw.120.a:0 "Support a public maintenance review."
 ac_lcw.120.b:0 "Reserve staff for a focused readiness return."
