 SNS_up_operational_record:0 "Keep an Operational Record"
 SNS_up_operational_record_desc:0 "A narrower operational record gives service managers room to move quickly. Its continuing administrative burden is the price of keeping that discretion accountable."
 SNS_up_operational_record_done:0 "Keep an Operational Record completed"
 SNS_up_operational_record_tt:0 "Civil protection: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Adopt the enduring policy shown below, including its continuing cost."
