 ERU_fe_oversight_service_1_spirit:0 "Staff the Receiving Desks"
 ERU_fe_oversight_service_1_spirit_desc:0 "The provisional cabinet office maintains this funded service for ninety days. Train Erusean officials to take over routine approvals without a supervisor's countersignature. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 ERU_fe_oversight_service_1:0 "Staff the Receiving Desks"
 ERU_fe_oversight_service_1_desc:0 "Train Erusean officials to take over routine approvals without a supervisor's countersignature.\n\nThe provisional cabinet office must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 ERU_fe_oversight_service_2_spirit:0 "Audit the Remaining Instruments"
 ERU_fe_oversight_service_2_spirit_desc:0 "The provisional audit commission maintains this funded service for ninety days. Compare each surviving oversight duty with the office that now performs it. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
