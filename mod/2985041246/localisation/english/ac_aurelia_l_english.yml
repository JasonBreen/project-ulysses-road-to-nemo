 AUR_au_account_service_1_spirit:0 "Fund an Independent Audit"
 AUR_au_account_service_1_spirit_desc:0 "The federal audit office maintains this funded service for ninety days. Commission auditors to examine the federation's accounts and agreements. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 AUR_au_account_service_1:0 "Fund an Independent Audit"
 AUR_au_account_service_1_desc:0 "Commission auditors to examine the federation's accounts and agreements.\n\nThe federal audit office must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 AUR_au_account_service_2_spirit:0 "Count the Obligations"
 AUR_au_account_service_2_spirit_desc:0 "The federal treasury maintains this funded service for ninety days. Compile every guarantee, contract and promise into one account. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 AUR_au_account_service_2:0 "Count the Obligations"
 AUR_au_account_service_2_desc:0 "Compile every guarantee, contract and promise into one account.\n\nThe federal treasury must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 AUR_au_services_policy_a_spirit:0 "Civilian service review"
 AUR_au_services_policy_a_spirit_desc:0 "Services will be reviewed by civilian panels that publish what each office delivers and what it costs. Civilian review improves trust and exposes waste, and it slows any reallocation that the panels have not examined."
 AUR_au_services_policy_a_spirit_settled:0 "Civilian service review: Standing Settlement"
 AUR_au_services_policy_a_spirit_settled_desc:0 "The settlement keeps the chosen balance between civilian review and preparedness. It gives the federation a register of its own capacity, which every later government will need. The continuing opportunity cost remains."
 AUR_au_services_policy_b_spirit:0 "Preparedness staff first"
 AUR_au_services_policy_b_spirit_desc:0 "Preparedness staff will have first claim on engineers, communications specialists and logistics officers. Readiness for emergencies improves, and ordinary services wait longer for the specialists they share."
 AUR_au_services_policy_b_spirit_settled:0 "Preparedness staff first: Standing Settlement"
 AUR_au_services_policy_b_spirit_settled_desc:0 "The settlement keeps the chosen balance between civilian review and preparedness. It gives the federation a register of its own capacity, which every later government will need. The continuing opportunity cost remains."
 AUR_au_services_register:0 "A Register of Public Services"
 AUR_au_services_register_desc:0 "Aurelia's federal and provincial services have grown without a common record of what each office does or how many people it needs. The cabinet will register every service, its staff and its technical capacity before deciding where the next budget goes."
 AUR_au_services_policy_a:0 "Civilian Service Review"
 AUR_au_services_policy_a_desc:0 "Services will be reviewed by civilian panels that publish what each office delivers and what it costs. Civilian review improves trust and exposes waste, and it slows any reallocation that the panels have not examined."
 AUR_au_services_policy_b:0 "Preparedness Staff First"
 AUR_au_services_policy_b_desc:0 "Preparedness staff will have first claim on engineers, communications specialists and logistics officers. Readiness for emergencies improves, and ordinary services wait longer for the specialists they share."
 AUR_au_services_operations:0 "Technical Capacity Where It Is Needed"
 AUR_au_services_operations_desc:0 "Technical staff are scarce in the provinces and concentrated around the capital. The register will show where engineers and specialists are actually needed, and the ministries will move posts to match."
 AUR_au_services_review:0 "Review a Service Year"
 AUR_au_services_review_desc:0 "The review examines one funded service year: what each office delivered, what it cost and where specialists were missing. Promised reforms do not count until they appear in the year's record."
 AUR_au_services_settlement:0 "Services the Federation Can Sustain"
 AUR_au_services_settlement_desc:0 "The settlement keeps the chosen balance between civilian review and preparedness. It gives the federation a register of its own capacity, which every later government will need."
 AUR_au_trade_policy_a_spirit:0 "Fair-terms trade review"
 AUR_au_trade_policy_a_spirit_desc:0 "A joint review will examine contract terms with Leasathian representatives and publish its findings, including any terms it finds unfair. Fairness reviews build goodwill and may cost Aurelian firms income they have come to rely on."
 AUR_au_trade_policy_a_spirit_settled:0 "Fair-terms trade review: Standing Settlement"
 AUR_au_trade_policy_a_spirit_settled_desc:0 "The settlement keeps the chosen approach to the southern trade and a written record of every dispute. It does not decide whether Leasath's complaints are just. It decides how Aurelia will answer them. The continuing opportunity cost remains."
 AUR_au_trade_policy_b_spirit:0 "Protected Aurelian contracts"
 AUR_au_trade_policy_b_spirit_desc:0 "Existing contracts will be defended as signed, with Aurelian courts as the forum for disputes. Protection keeps revenue and investor confidence, and it leaves the complaints unanswered, to be remembered by the people who made them."
 AUR_au_trade_policy_b_spirit_settled:0 "Protected Aurelian contracts: Standing Settlement"
 AUR_au_trade_policy_b_spirit_settled_desc:0 "The settlement keeps the chosen approach to the southern trade and a written record of every dispute. It does not decide whether Leasath's complaints are just. It decides how Aurelia will answer them. The continuing opportunity cost remains."
 AUR_au_trade_register:0 "The Southern Trade Relationship"
 AUR_au_trade_register_desc:0 "Aurelian firms hold contracts across the southern trade with Leasath: mines, ports, plantations and loans. Leasathian partners complain that the terms favour Aurelia. The cabinet will record every major contract, its terms and its revenue before deciding whether the complaints deserve an answer."
 AUR_au_trade_policy_a:0 "Review the Terms Fairly"
 AUR_au_trade_policy_a_desc:0 "A joint review will examine contract terms with Leasathian representatives and publish its findings, including any terms it finds unfair. Fairness reviews build goodwill and may cost Aurelian firms income they have come to rely on."
 AUR_au_trade_policy_b:0 "Protect Aurelian Contracts"
 AUR_au_trade_policy_b_desc:0 "Existing contracts will be defended as signed, with Aurelian courts as the forum for disputes. Protection keeps revenue and investor confidence, and it leaves the complaints unanswered, to be remembered by the people who made them."
 AUR_au_trade_operations:0 "Answer Complaints in Writing"
 AUR_au_trade_operations_desc:0 "Every complaint from a Leasathian partner will receive a written answer that states the contract, the term in dispute and the government's position. Written answers will not settle every dispute, but they put a record where there was only resentment."
 AUR_au_trade_review:0 "Review a Trading Year"
 AUR_au_trade_review_desc:0 "The review examines one funded trading year: revenue, disputes raised and disputes resolved. It counts what changed in the contracts, not statements of good intentions."
 AUR_au_trade_settlement:0 "Trade on Terms Both Sides Can Read"
 AUR_au_trade_settlement_desc:0 "The settlement keeps the chosen approach to the southern trade and a written record of every dispute. It does not decide whether Leasath's complaints are just. It decides how Aurelia will answer them."
 AUR_au_airspace_policy_a_spirit:0 "Civil weather service"
 AUR_au_airspace_policy_a_spirit_desc:0 "The radar network will serve the civil weather service first, with storm warnings, aviation forecasts and agricultural data published to the public. A civil network is popular and useful every day, and it gives the air force second claim on the sites."
 AUR_au_airspace_policy_a_spirit_settled:0 "Civil weather service: Standing Settlement"
 AUR_au_airspace_policy_a_spirit_settled_desc:0 "The settlement keeps the chosen purpose for the network and a rota that keeps it staffed. It makes no claim beyond Aurelia's own airspace. The continuing opportunity cost remains."
 AUR_au_airspace_policy_b_spirit:0 "Joint air warning network"
 AUR_au_airspace_policy_b_spirit_desc:0 "Weather and air warning sites will be joined into one network under a joint command, with civil forecasts as a secondary output. A joint network gives earlier warning of aircraft, and it makes every weather station a military installation in the eyes of its neighbours."
 AUR_au_airspace_policy_b_spirit_settled:0 "Joint air warning network: Standing Settlement"
 AUR_au_airspace_policy_b_spirit_settled_desc:0 "The settlement keeps the chosen purpose for the network and a rota that keeps it staffed. It makes no claim beyond Aurelia's own airspace. The continuing opportunity cost remains."
 AUR_au_airspace_register:0 "Weather and Air Warning"
 AUR_au_airspace_register_desc:0 "Aurelia's weather observation radars and air warning stations were built by different ministries for different purposes. The cabinet will record every site, what it watches and who staffs it, before deciding what the network is for."
 AUR_au_airspace_policy_a:0 "A Civil Weather Service"
 AUR_au_airspace_policy_a_desc:0 "The radar network will serve the civil weather service first, with storm warnings, aviation forecasts and agricultural data published to the public. A civil network is popular and useful every day, and it gives the air force second claim on the sites."
 AUR_au_airspace_policy_b:0 "A Joint Air Warning Network"
 AUR_au_airspace_policy_b_desc:0 "Weather and air warning sites will be joined into one network under a joint command, with civil forecasts as a secondary output. A joint network gives earlier warning of aircraft, and it makes every weather station a military installation in the eyes of its neighbours."
 AUR_au_airspace_operations:0 "Keep the Radar Sites Staffed"
 AUR_au_airspace_operations_desc:0 "Remote radar sites need technicians, power and supplies through the worst weather of the year. The service will keep a staffing rota and a supply plan for every site, so that no station goes dark because its relief failed to arrive."
 AUR_au_airspace_review:0 "Review a Season of Watch"
 AUR_au_airspace_review_desc:0 "The review examines one funded season of watch: storms forecast, aircraft tracked and sites kept running. A site that went dark counts against the season, whatever the reason."
 AUR_au_airspace_settlement:0 "Eyes on the Sky in Every Season"
 AUR_au_airspace_settlement_desc:0 "The settlement keeps the chosen purpose for the network and a rota that keeps it staffed. It makes no claim beyond Aurelia's own airspace."
 AUR_au_leasath_war_policy_a_spirit:0 "Humanitarian access first"
 AUR_au_leasath_war_policy_a_spirit_desc:0 "Aurelia will press every Leasathian faction for humanitarian access, fund relief through neutral agencies and accept refugees at its southern ports. Access saves lives and builds goodwill in Leasath, and it costs money while Aurelian firms watch their contracts suffer."
 AUR_au_leasath_war_policy_a_spirit_settled:0 "Humanitarian access first: Standing Settlement"
 AUR_au_leasath_war_policy_a_spirit_settled_desc:0 "The settlement keeps the chosen response and the neutrality law. Aurelia takes no side in Leasath's war. What Leasathians remember about Aurelia's choices will outlast the fighting. The continuing opportunity cost remains."
 AUR_au_leasath_war_policy_b_spirit:0 "Protected commercial exposure"
 AUR_au_leasath_war_policy_b_spirit_desc:0 "Aurelian firms and their staff in Leasath will be protected through evacuation plans, insurance guarantees and negotiations with whichever faction controls each site. Protection limits losses, and it can look to Leasathians like Aurelia caring more for its contracts than for their war."
 AUR_au_leasath_war_policy_b_spirit_settled:0 "Protected commercial exposure: Standing Settlement"
 AUR_au_leasath_war_policy_b_spirit_settled_desc:0 "The settlement keeps the chosen response and the neutrality law. Aurelia takes no side in Leasath's war. What Leasathians remember about Aurelia's choices will outlast the fighting. The continuing opportunity cost remains."
 AUR_au_leasath_war_register:0 "The War in Leasath"
 AUR_au_leasath_war_register_desc:0 "Leasath is at war with itself, and the fighting reaches Aurelian contracts, ports and citizens across the south. The cabinet will record who is affected, which assets are exposed and what Aurelia can do without taking a side."
 AUR_au_leasath_war_policy_a:0 "Humanitarian Access First"
 AUR_au_leasath_war_policy_a_desc:0 "Aurelia will press every Leasathian faction for humanitarian access, fund relief through neutral agencies and accept refugees at its southern ports. Access saves lives and builds goodwill in Leasath, and it costs money while Aurelian firms watch their contracts suffer."
 AUR_au_leasath_war_policy_b:0 "Protect Commercial Exposure"
 AUR_au_leasath_war_policy_b_desc:0 "Aurelian firms and their staff in Leasath will be protected through evacuation plans, insurance guarantees and negotiations with whichever faction controls each site. Protection limits losses, and it can look to Leasathians like Aurelia caring more for its contracts than for their war."
 AUR_au_leasath_war_operations:0 "Keep Aurelians Out of the Fighting"
 AUR_au_leasath_war_operations_desc:0 "Aurelian citizens, contractors and security firms will be kept out of the fighting by law, with penalties for anyone who sells their services to a faction. Neutrality protects Aurelia from being drawn in, and it is hard to enforce on people who are already there."
 AUR_au_leasath_war_review:0 "Review a Year of the War"
 AUR_au_leasath_war_review_desc:0 "The review examines one funded year of the war's effect on Aurelia: relief delivered, citizens evacuated and contracts lost or kept. It does not judge the war; it judges Aurelia's response to it."
 AUR_au_leasath_war_settlement:0 "A Neighbour's War, Answered"
 AUR_au_leasath_war_settlement_desc:0 "The settlement keeps the chosen response and the neutrality law. Aurelia takes no side in Leasath's war. What Leasathians remember about Aurelia's choices will outlast the fighting."
 AUR_au_finance_policy_a_spirit:0 "Public investment bank"
 AUR_au_finance_policy_a_spirit_desc:0 "A public investment bank will lend for infrastructure and industry on published terms, with the federation carrying the risk. Public lending builds where private capital will not, and it ties up federal credit for years."
 AUR_au_finance_policy_a_spirit_settled:0 "Public investment bank: Standing Settlement"
 AUR_au_finance_policy_a_spirit_settled_desc:0 "The settlement keeps the chosen instrument and the ranking that guides it. It gives the federation a way to invest that does not depend on a single year's budget. The continuing opportunity cost remains."
 AUR_au_finance_policy_b_spirit:0 "Private capital guarantees"
 AUR_au_finance_policy_b_spirit_desc:0 "The federation will guarantee private loans for approved projects instead of lending itself. Guarantees draw in private money at low cost to the budget, and they leave the federation responsible for projects it does not control."
 AUR_au_finance_policy_b_spirit_settled:0 "Private capital guarantees: Standing Settlement"
 AUR_au_finance_policy_b_spirit_settled_desc:0 "The settlement keeps the chosen instrument and the ranking that guides it. It gives the federation a way to invest that does not depend on a single year's budget. The continuing opportunity cost remains."
 AUR_au_finance_register:0 "Development Finance"
 AUR_au_finance_register_desc:0 "Provinces, ports and industries all want investment, and the federal budget cannot pay for all of it. The treasury will record what is needed, what is already funded and what private capital would finance if the risks were shared."
 AUR_au_finance_policy_a:0 "A Public Investment Bank"
 AUR_au_finance_policy_a_desc:0 "A public investment bank will lend for infrastructure and industry on published terms, with the federation carrying the risk. Public lending builds where private capital will not, and it ties up federal credit for years."
 AUR_au_finance_policy_b:0 "Private Capital Guarantees"
 AUR_au_finance_policy_b_desc:0 "The federation will guarantee private loans for approved projects instead of lending itself. Guarantees draw in private money at low cost to the budget, and they leave the federation responsible for projects it does not control."
 AUR_au_finance_operations:0 "Finance Where the Register Shows Need"
 AUR_au_finance_operations_desc:0 "Lending will follow the services register and the provinces' own lists, not the loudest lobby. Projects will be ranked by need and published with the ranking."
 AUR_au_finance_review:0 "Review the Lending Year"
 AUR_au_finance_review_desc:0 "The review examines one funded lending year: projects financed, projects completed and loans in trouble. Announcements do not count until the work is done."
 AUR_au_finance_settlement:0 "Investment That Outlasts a Budget"
 AUR_au_finance_settlement_desc:0 "The settlement keeps the chosen instrument and the ranking that guides it. It gives the federation a way to invest that does not depend on a single year's budget."
 AUR_au_exports_policy_a_spirit:0 "Restrictive export licensing"
 AUR_au_exports_policy_a_spirit_desc:0 "Export licences will be refused for buyers at war or likely to use equipment against civilians, with every decision published. Restrictive rules keep Aurelian equipment out of other countries' wars, and they cost manufacturers sales."
 AUR_au_exports_policy_a_spirit_settled:0 "Restrictive export licensing: Standing Settlement"
 AUR_au_exports_policy_a_spirit_settled_desc:0 "The settlement fixes the export rules and the procurement standard. It does not decide who Aurelia's friends are. It decides what Aurelia will sell, to whom, and what its own forces will buy. The continuing opportunity cost remains."
 AUR_au_exports_policy_b_spirit:0 "Open export licensing"
 AUR_au_exports_policy_b_spirit_desc:0 "Export licences will be granted to any buyer not under international sanctions, with decisions kept confidential. Open licensing supports industry and jobs, and it accepts that Aurelian equipment may appear in wars Aurelia wanted no part in."
 AUR_au_exports_policy_b_spirit_settled:0 "Open export licensing: Standing Settlement"
 AUR_au_exports_policy_b_spirit_settled_desc:0 "The settlement fixes the export rules and the procurement standard. It does not decide who Aurelia's friends are. It decides what Aurelia will sell, to whom, and what its own forces will buy. The continuing opportunity cost remains."
 AUR_au_exports_register:0 "Arms Export and Procurement Rules"
 AUR_au_exports_register_desc:0 "Aurelian manufacturers sell equipment abroad and the armed forces buy at home, under rules written piecemeal over decades. The cabinet will record every licence, every buyer and every procurement contract before writing one set of rules."
 AUR_au_exports_policy_a:0 "Restrictive Export Licensing"
 AUR_au_exports_policy_a_desc:0 "Export licences will be refused for buyers at war or likely to use equipment against civilians, with every decision published. Restrictive rules keep Aurelian equipment out of other countries' wars, and they cost manufacturers sales."
 AUR_au_exports_policy_b:0 "Open Export Licensing"
 AUR_au_exports_policy_b_desc:0 "Export licences will be granted to any buyer not under international sanctions, with decisions kept confidential. Open licensing supports industry and jobs, and it accepts that Aurelian equipment may appear in wars Aurelia wanted no part in."
 AUR_au_exports_operations:0 "Buy What the Forces Can Maintain"
 AUR_au_exports_operations_desc:0 "The forces will buy only equipment they can maintain with their own crews and supplies, even when more impressive systems are offered. Maintainable procurement is less glamorous, and it is the equipment that will still work in a crisis."
 AUR_au_exports_review:0 "Review the Licensing Year"
 AUR_au_exports_review_desc:0 "The review examines one funded licensing and procurement year: licences granted and refused, equipment delivered and equipment that worked. It records the refusals as carefully as the sales."
 AUR_au_exports_settlement:0 "Rules That Survive a Crisis"
 AUR_au_exports_settlement_desc:0 "The settlement fixes the export rules and the procurement standard. It does not decide who Aurelia's friends are. It decides what Aurelia will sell, to whom, and what its own forces will buy."
 AUR_au_relations_policy_a_spirit:0 "Renegotiated southern terms"
 AUR_au_relations_policy_a_spirit_desc:0 "Aurelia will offer to renegotiate the southern agreements, including the terms Leasathians have complained about for years. Renegotiation could lower tensions with a neighbour emerging from war, and it costs Aurelian firms and asks the federation to admit old terms were unequal."
 AUR_au_relations_policy_a_spirit_settled:0 "Renegotiated southern terms: Standing Settlement"
 AUR_au_relations_policy_a_spirit_settled_desc:0 "The settlement keeps the chosen course and the record of every contact. Whether it is enough to keep the peace with Leasath is not something the federation alone can decide. The continuing opportunity cost remains."
 AUR_au_relations_policy_b_spirit:0 "Existing agreements held"
 AUR_au_relations_policy_b_spirit_desc:0 "Aurelia will hold to the agreements as signed and insist that any successor government honour them. Holding firm protects contracts and the principle that treaties bind, and it hands Leasathian nationalists a grievance they can use."
 AUR_au_relations_policy_b_spirit_settled:0 "Existing agreements held: Standing Settlement"
 AUR_au_relations_policy_b_spirit_settled_desc:0 "The settlement keeps the chosen course and the record of every contact. Whether it is enough to keep the peace with Leasath is not something the federation alone can decide. The continuing opportunity cost remains."
 AUR_au_relations_register:0 "Review Relations with Leasath"
 AUR_au_relations_register_desc:0 "Aurelia's agreements with Leasath were signed with governments and factions that may no longer speak for the country. The cabinet will record every treaty, contract and channel still in force, and who on the Leasathian side still answers."
 AUR_au_relations_policy_a:0 "Renegotiate the Terms"
 AUR_au_relations_policy_a_desc:0 "Aurelia will offer to renegotiate the southern agreements, including the terms Leasathians have complained about for years. Renegotiation could lower tensions with a neighbour emerging from war, and it costs Aurelian firms and asks the federation to admit old terms were unequal."
 AUR_au_relations_policy_b:0 "Hold the Existing Agreements"
 AUR_au_relations_policy_b_desc:0 "Aurelia will hold to the agreements as signed and insist that any successor government honour them. Holding firm protects contracts and the principle that treaties bind, and it hands Leasathian nationalists a grievance they can use."
 AUR_au_relations_operations:0 "Talk to Every Faction That Answers"
 AUR_au_relations_operations_desc:0 "Contacts will be kept with every Leasathian faction willing to talk, through consular offices, trade missions and church networks. Wide contacts give early warning of trouble, and each one can be read in Leasath as Aurelia picking a side."
 AUR_au_relations_review:0 "Review a Year of Contacts"
 AUR_au_relations_review_desc:0 "The review examines one funded year of contacts: who answered, what was agreed and which warnings proved accurate. It does not count meetings that produced nothing."
 AUR_au_relations_settlement:0 "Relations on the Record"
 AUR_au_relations_settlement_desc:0 "The settlement keeps the chosen course and the record of every contact. Whether it is enough to keep the peace with Leasath is not something the federation alone can decide."
 AUR_au_readiness_policy_a_spirit:0 "Dispersed readiness"
 AUR_au_readiness_policy_a_spirit_desc:0 "Forces and supplies will be spread across bases throughout the country, including remote ones, so that no single loss leaves Aurelia defenceless. Dispersal is expensive and hard to command, and it keeps the federation able to fight from anywhere."
 AUR_au_readiness_policy_a_spirit_settled:0 "Dispersed readiness: Standing Settlement"
 AUR_au_readiness_policy_a_spirit_settled_desc:0 "The settlement fixes the federation's readiness posture and the plans that support it. It names no enemy. It decides how quickly Aurelia can answer if one appears. The continuing opportunity cost remains."
 AUR_au_readiness_policy_b_spirit:0 "Concentrated capital defence"
 AUR_au_readiness_policy_b_spirit_desc:0 "Forces will be concentrated around the capital and the main industrial areas, where most people and infrastructure are. Concentration is efficient and easy to command, and it puts much of the federation's strength in one place."
 AUR_au_readiness_policy_b_spirit_settled:0 "Concentrated capital defence: Standing Settlement"
 AUR_au_readiness_policy_b_spirit_settled_desc:0 "The settlement fixes the federation's readiness posture and the plans that support it. It names no enemy. It decides how quickly Aurelia can answer if one appears. The continuing opportunity cost remains."
 AUR_au_readiness_register:0 "A Readiness Review"
 AUR_au_readiness_register_desc:0 "Aurelia's forces have been organised for a peace that has lasted a long time. The defence ministry will record where units, aircraft and supplies are based, and how long each would take to answer an emergency anywhere in the country."
 AUR_au_readiness_policy_a:0 "Dispersed Readiness"
 AUR_au_readiness_policy_a_desc:0 "Forces and supplies will be spread across bases throughout the country, including remote ones, so that no single loss leaves Aurelia defenceless. Dispersal is expensive and hard to command, and it keeps the federation able to fight from anywhere."
 AUR_au_readiness_policy_b:0 "Concentrated Capital Defence"
 AUR_au_readiness_policy_b_desc:0 "Forces will be concentrated around the capital and the main industrial areas, where most people and infrastructure are. Concentration is efficient and easy to command, and it puts much of the federation's strength in one place."
 AUR_au_readiness_operations:0 "Keep Reserves Where They Can Move"
 AUR_au_readiness_operations_desc:0 "Reserves need transport, fuel and orders that work when communications fail. The ministry will plan movement for every reserve unit and test it, rather than assume roads, railways and radios will be available."
 AUR_au_readiness_review:0 "Review an Exercise Year"
 AUR_au_readiness_review_desc:0 "The review examines one funded exercise year: units moved, bases reached and plans that failed. It records failures plainly, because an exercise that cannot fail teaches nothing."
 AUR_au_readiness_settlement:0 "Forces That Can Answer an Emergency"
 AUR_au_readiness_settlement_desc:0 "The settlement fixes the federation's readiness posture and the plans that support it. It names no enemy. It decides how quickly Aurelia can answer if one appears."
 AUR_au_account_policy_a_spirit:0 "Open federal audit"
 AUR_au_account_policy_a_spirit_desc:0 "Independent auditors will examine the federation's accounts and agreements, and their reports will be published in full. An open audit builds confidence at home and abroad, and it exposes every awkward contract to public argument."
 AUR_au_account_policy_a_spirit_settled:0 "Open federal audit: Standing Settlement"
 AUR_au_account_policy_a_spirit_settled_desc:0 "The settlement fixes how Aurelia accounts for its obligations and who may read the account. It keeps the chosen balance between openness and protection, and the duty to explain both to the people who pay. The continuing opportunity cost remains."
 AUR_au_account_policy_b_spirit:0 "Protected federal ledger"
 AUR_au_account_policy_b_spirit_desc:0 "Sensitive accounts, from defence procurement to foreign agreements, will be kept in a protected ledger available to parliamentary committees only. Protection keeps negotiations and security matters private, at the price of public suspicion about what is being kept back."
 AUR_au_account_policy_b_spirit_settled:0 "Protected federal ledger: Standing Settlement"
 AUR_au_account_policy_b_spirit_settled_desc:0 "The settlement fixes how Aurelia accounts for its obligations and who may read the account. It keeps the chosen balance between openness and protection, and the duty to explain both to the people who pay. The continuing opportunity cost remains."
 AUR_au_account_register:0 "The Public Account"
 AUR_au_account_register_desc:0 "Decades of contracts, loans, licences and services have left the federation with obligations scattered across ministries. The cabinet will publish what Aurelia owes, what it is owed and what its choices have cost, before the next parliament has to decide what to keep."
 AUR_au_account_policy_a:0 "An Open Audit"
 AUR_au_account_policy_a_desc:0 "Independent auditors will examine the federation's accounts and agreements, and their reports will be published in full. An open audit builds confidence at home and abroad, and it exposes every awkward contract to public argument."
 AUR_au_account_policy_b:0 "A Protected Ledger"
 AUR_au_account_policy_b_desc:0 "Sensitive accounts, from defence procurement to foreign agreements, will be kept in a protected ledger available to parliamentary committees only. Protection keeps negotiations and security matters private, at the price of public suspicion about what is being kept back."
 AUR_au_account_operations:0 "Count What the Federation Owes"
 AUR_au_account_operations_desc:0 "Every obligation will be counted, including guarantees, contracts in dispute and promises made to other governments. An obligation that is not counted is still owed."
 AUR_au_account_review:0 "Review the Long Record"
 AUR_au_account_review_desc:0 "The review examines one funded audit period before the account becomes the standard for future budgets."
 AUR_au_account_settlement:0 "An Account the Public Can Read"
 AUR_au_account_settlement_desc:0 "The settlement fixes how Aurelia accounts for its obligations and who may read the account. It keeps the chosen balance between openness and protection, and the duty to explain both to the people who pay."
 ac_aur_funded_cost:0 "£pol_power 35 / 4 cap"
 ac_aur_funded_cost_tooltip:0 "Authorization commits 35 political power and four institutional-capacity points, plus the programme fee shown in the category. Spent resources are not refunded when a period is interrupted."
 ac_aur_funded_cost_blocked:0 "£pol_power §R35§! / §R4§! cap"
 ac_aur_fee_macro:0 "Programme fee: 0.002 billion abstract fiscal units."
 ac_aur_fee_legacy:0 "Programme fee: 2 provisional fiscal units."
 ac_aur_fee_none:0 "No fiscal fee currently applies. Political and institutional costs remain."
 ac_aur_aur_services:0 "Aurelia: The Federal Foundations"
 ac_aur_aur_services_desc:0 "[ac_aur_current_service_text]\n[ac_aur_cooldown_text]\nService [?ac_aur_elapsed|0]/90 days, [?ac_aur_completed_services|0] completed, last period [?ac_aur_last_delivered_days|0] days.\n\n[AUR_services_ac_aur_policy_line][AUR_trade_ac_aur_policy_line][AUR_airspace_ac_aur_policy_line][AUR_leasath_war_ac_aur_policy_line][AUR_finance_ac_aur_policy_line][AUR_exports_ac_aur_policy_line][AUR_relations_ac_aur_policy_line][AUR_readiness_ac_aur_policy_line][AUR_account_ac_aur_policy_line][ac_aur_fee_text]"
 AUR_au_cancel_service:0 "End the Current Service Period"
 AUR_au_cancel_service_desc:0 "Release the current rota immediately. Funding and institutional effort already spent are not refunded. Delivered time is retained in the record, but the interrupted period cannot unlock a completed-service review."
 AUR_au_opening_public_spirit:0 "Aurelia: An Open Hearing"
 AUR_au_opening_public_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 AUR_au_opening_ministerial_spirit:0 "Aurelia: A Ministerial Docket"
 AUR_au_opening_ministerial_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ac_aur.10.t:0 "A Federation Without a Register"
 ac_aur.10.d:0 "The cabinet's first meeting on the state of the federation begins with a request nobody can fulfil: a list of what Aurelia's services do, who staffs them and what they cost. Each ministry has its own figures. None agree.\n\nThe ministers must decide how to build a common record, and how much of the disagreement between their ministries to show in public."
 ac_aur.10.a:0 "Open the register to public questions."
 ac_aur.10.b:0 "Begin with a protected cabinet docket."
 AUR_services_ac_aur_policy_callback_0:0 "The standing policy is civilian service review. Its continuing cost remains part of the allocation."
 AUR_services_ac_aur_policy_callback_1:0 "The standing policy is preparedness staff first. Its continuing cost remains part of the allocation."
 AUR_au_services_reply_public_spirit:0 "A Register of Public Services: Public Return"
 AUR_au_services_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Audit federal and provincial services against the register. Public attention or reserved staff time remains committed to that work."
 AUR_au_services_reply_protected_spirit:0 "A Register of Public Services: Protected Working Return"
 AUR_au_services_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Move engineering and communications posts to where the register shows need. Public attention or reserved staff time remains committed to that work."
 ac_aur.20.t:0 "Two Offices, One Engineer"
 ac_aur.20.d:0 "The register shows the same water engineer assigned to two provincial offices, three hundred kilometres apart. Both offices list her as their only qualified inspector. She has been driving between them every week for two years and has filed a complaint that nobody answered.\n\nThe audit office wants her case published as an example of what the register is for. The civil service commission would rather fix it quietly and move on, before every province starts counting the specialists it does not have.\n\n[AUR_services_ac_aur_policy_callback]"
 ac_aur.20.a:0 "Publish the engineer's case."
 ac_aur.20.b:0 "Fix it quietly through the commission."
 AUR_services_ac_aur_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 AUR_services_ac_aur_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 AUR_services_ac_aur_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_aur.50.t:0 "A Federation That Knows Its Staff"
 ac_aur.50.d:0 "The final review is the register itself, now complete. Each service lists its staff, its specialists and the posts it cannot fill. The water engineer appears once, in one province, with a deputy in the other.\n\nThe register does not make Aurelia richer. It tells the federation where its people are, which is the first thing any emergency will ask.\n\n[AUR_services_ac_aur_report_callback]\n\n[AUR_services_ac_aur_policy_callback]"
 ac_aur.50.a:0 "File the completed service record."
 AUR_trade_ac_aur_policy_callback_0:0 "The standing policy is fair-terms trade review. Its continuing cost remains part of the allocation."
 AUR_trade_ac_aur_policy_callback_1:0 "The standing policy is protected aurelian contracts. Its continuing cost remains part of the allocation."
 AUR_au_trade_reply_public_spirit:0 "The Southern Trade Relationship: Public Return"
 AUR_au_trade_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Pay for a joint panel to examine disputed contract terms. Public attention or reserved staff time remains committed to that work."
 AUR_au_trade_reply_protected_spirit:0 "The Southern Trade Relationship: Protected Working Return"
 AUR_au_trade_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Record every complaint and the written answer it received. Public attention or reserved staff time remains committed to that work."
 ac_aur.21.t:0 "A Port Fee Nobody Explained"
 ac_aur.21.d:0 "A Leasathian trade delegation brings a single document to its meeting with the ministry: an invoice for port fees charged to its exporters, under a contract signed decades ago. The fees have risen every year. Nobody at the ministry can say what they pay for.\n\nThe ministry can publish the fee schedule and the contract, admitting it cannot justify parts of it. Or it can promise the delegation a confidential review, protecting the firms involved until the ministry knows what it is defending.\n\n[AUR_trade_ac_aur_policy_callback]"
 ac_aur.21.a:0 "Publish the fee schedule and the contract."
 ac_aur.21.b:0 "Offer a confidential review."
 AUR_trade_ac_aur_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 AUR_trade_ac_aur_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 AUR_trade_ac_aur_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_aur.51.t:0 "A Register of Disputes"
 ac_aur.51.d:0 "The final review is a register of disputes: each contract, each complaint, each written answer and what became of it. Some terms were changed. Some were defended, and the review says why. The port fee is in the register, with a schedule that now explains what each charge pays for.\n\nThe register does not end the argument about the southern trade. It makes sure the argument is about facts both sides can read.\n\n[AUR_trade_ac_aur_report_callback]\n\n[AUR_trade_ac_aur_policy_callback]"
 ac_aur.51.a:0 "File the completed service record."
 AUR_airspace_ac_aur_policy_callback_0:0 "The standing policy is civil weather service. Its continuing cost remains part of the allocation."
 AUR_airspace_ac_aur_policy_callback_1:0 "The standing policy is joint air warning network. Its continuing cost remains part of the allocation."
 AUR_au_airspace_reply_public_spirit:0 "Weather and Air Warning: Public Return"
 AUR_au_airspace_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Fund technicians, power and supplies for remote radar sites through the year. Public attention or reserved staff time remains committed to that work."
 AUR_au_airspace_reply_protected_spirit:0 "Weather and Air Warning: Protected Working Return"
 AUR_au_airspace_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Exercise storm and aircraft warnings across the network. Public attention or reserved staff time remains committed to that work."
 ac_aur.22.t:0 "A Storm Warning and a Radar Track"
 ac_aur.22.d:0 "On the same night, a mountain radar site records a storm front moving toward the coast and an unidentified aircraft crossing the southern border. The duty technician has one telephone line and two people who need to be called first. She calls the weather service, then the air force, and files a report about the order.\n\nThe weather service wants the report published to show that civil warnings come first. The air directorate wants it kept internal, since a public account tells anyone watching how slowly an aircraft report travels.\n\n[AUR_airspace_ac_aur_policy_callback]"
 ac_aur.22.a:0 "Publish the night's report."
 ac_aur.22.b:0 "Keep the report internal."
 AUR_airspace_ac_aur_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 AUR_airspace_ac_aur_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 AUR_airspace_ac_aur_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_aur.52.t:0 "A Network That Did Not Go Dark"
 ac_aur.52.d:0 "The final review lists every site, every season and every night a site went dark. There are fewer of those than there were. The mountain station has a second telephone line now, and the duty book says which call comes first.\n\nThe network watches the weather and the sky. It promises nothing about what either will bring.\n\n[AUR_airspace_ac_aur_report_callback]\n\n[AUR_airspace_ac_aur_policy_callback]"
 ac_aur.52.a:0 "File the completed service record."
 AUR_leasath_war_ac_aur_policy_callback_0:0 "The standing policy is humanitarian access first. Its continuing cost remains part of the allocation."
 AUR_leasath_war_ac_aur_policy_callback_1:0 "The standing policy is protected commercial exposure. Its continuing cost remains part of the allocation."
 AUR_au_leasath_war_reply_public_spirit:0 "The War in Leasath: Public Return"
 AUR_au_leasath_war_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Fund neutral agencies delivering relief inside Leasath. Public attention or reserved staff time remains committed to that work."
 AUR_au_leasath_war_reply_protected_spirit:0 "The War in Leasath: Protected Working Return"
 AUR_au_leasath_war_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep evacuation plans and transport ready for Aurelians in Leasath. Public attention or reserved staff time remains committed to that work."
 ac_aur.23.t:0 "A Contractor's Offer"
 ac_aur.23.d:0 "An Aurelian security contractor has been offered a lucrative contract to guard a mine for one of Leasath's factions. The firm asks the ministry whether this breaks the neutrality rules; its lawyers think it does not, because the mine is Aurelian-owned. The faction has made clear what the guards would be expected to do if anyone approached the mine.\n\nThe ministry can publish its ruling, warning every firm in Leasath where the line is. Or it can answer privately, avoiding a public argument with an influential firm while it decides what the law should say.\n\n[AUR_leasath_war_ac_aur_policy_callback]"
 ac_aur.23.a:0 "Publish the ruling."
 ac_aur.23.b:0 "Answer the firm privately."
 AUR_leasath_war_ac_aur_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 AUR_leasath_war_ac_aur_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 AUR_leasath_war_ac_aur_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_aur.53.t:0 "Neutral, and on the Record"
 ac_aur.53.d:0 "The final review lists relief delivered, citizens evacuated and contracts lost. It also lists every neutrality ruling and every firm that tested it. The security contractor is there, with the ruling and what the firm did next.\n\nAurelia did not end Leasath's war and did not take a side in it. The record shows what it did instead.\n\n[AUR_leasath_war_ac_aur_report_callback]\n\n[AUR_leasath_war_ac_aur_policy_callback]"
 ac_aur.53.a:0 "File the completed service record."
 AUR_finance_ac_aur_policy_callback_0:0 "The standing policy is public investment bank. Its continuing cost remains part of the allocation."
 AUR_finance_ac_aur_policy_callback_1:0 "The standing policy is private capital guarantees. Its continuing cost remains part of the allocation."
 AUR_au_finance_reply_public_spirit:0 "Development Finance: Public Return"
 AUR_au_finance_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Finance a ranked round of infrastructure and industry projects. Public attention or reserved staff time remains committed to that work."
 AUR_au_finance_reply_protected_spirit:0 "Development Finance: Protected Working Return"
 AUR_au_finance_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Review every loan and guarantee against the projects they paid for. Public attention or reserved staff time remains committed to that work."
 ac_aur.24.t:0 "A Bridge on the Ranking"
 ac_aur.24.d:0 "The ranking places a provincial bridge above a new terminal at the capital's airport. The airport's backers have more votes in the federal assembly and a minister who has already announced the terminal. The bridge's backers have a ranking that says the bridge carries more freight.\n\nThe treasury can publish the ranking and fund the bridge first, provoking a fight in the assembly. Or it can fund both by stretching the budget quietly, keeping the peace and weakening the ranking that was meant to settle exactly this kind of argument.\n\n[AUR_finance_ac_aur_policy_callback]"
 ac_aur.24.a:0 "Publish the ranking and fund the bridge first."
 ac_aur.24.b:0 "Fund both quietly."
 AUR_finance_ac_aur_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 AUR_finance_ac_aur_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 AUR_finance_ac_aur_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_aur.54.t:0 "A Loan Book in Daylight"
 ac_aur.54.d:0 "The final review publishes the loan book: every project, its ranking, its cost and whether it was finished. The bridge is there, carrying freight. So is the terminal, funded a year later than its backers wanted.\n\nThe settlement does not end arguments about where Aurelia should invest. It makes sure they start from the same list.\n\n[AUR_finance_ac_aur_report_callback]\n\n[AUR_finance_ac_aur_policy_callback]"
 ac_aur.54.a:0 "File the completed service record."
 AUR_exports_ac_aur_policy_callback_0:0 "The standing policy is restrictive export licensing. Its continuing cost remains part of the allocation."
 AUR_exports_ac_aur_policy_callback_1:0 "The standing policy is open export licensing. Its continuing cost remains part of the allocation."
 AUR_au_exports_reply_public_spirit:0 "Arms Export and Procurement Rules: Public Return"
 AUR_au_exports_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Fund a board that reviews every export licence under the rules. Public attention or reserved staff time remains committed to that work."
 AUR_au_exports_reply_protected_spirit:0 "Arms Export and Procurement Rules: Protected Working Return"
 AUR_au_exports_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Check that purchased equipment can be maintained by the forces' own crews. Public attention or reserved staff time remains committed to that work."
 ac_aur.25.t:0 "A Licence Request From the South"
 ac_aur.25.d:0 "A manufacturer asks for a licence to sell armoured vehicles to a buyer in the south whose paperwork is in order. The intelligence service attaches a note: the buyer is a front for one side in a neighbour's civil war. The manufacturer says it cannot be expected to read intelligence notes it never sees.\n\nThe licensing board can refuse the licence and publish its reasons, accepting a public quarrel with the manufacturer. Or it can refuse privately, protecting the intelligence service's source and the manufacturer's reputation.\n\n[AUR_exports_ac_aur_policy_callback]"
 ac_aur.25.a:0 "Refuse publicly, with reasons."
 ac_aur.25.b:0 "Refuse privately."
 AUR_exports_ac_aur_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 AUR_exports_ac_aur_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 AUR_exports_ac_aur_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_aur.55.t:0 "A Ledger of Licences"
 ac_aur.55.d:0 "The final review lists every licence granted and refused, with the reasons. The armoured vehicles were never shipped. The procurement section lists equipment the forces bought and could maintain, and the more impressive systems they declined.\n\nThe rules will be tested by the next crisis. They were written so that the test would not have to be improvised.\n\n[AUR_exports_ac_aur_report_callback]\n\n[AUR_exports_ac_aur_policy_callback]"
 ac_aur.55.a:0 "File the completed service record."
 AUR_relations_ac_aur_policy_callback_0:0 "The standing policy is renegotiated southern terms. Its continuing cost remains part of the allocation."
 AUR_relations_ac_aur_policy_callback_1:0 "The standing policy is existing agreements held. Its continuing cost remains part of the allocation."
 AUR_au_relations_reply_public_spirit:0 "Review Relations with Leasath: Public Return"
 AUR_au_relations_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep consular and trade missions open to every faction that answers. Public attention or reserved staff time remains committed to that work."
 AUR_au_relations_reply_protected_spirit:0 "Review Relations with Leasath: Protected Working Return"
 AUR_au_relations_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Pay for negotiating teams, legal review and compensation studies. Public attention or reserved staff time remains committed to that work."
 ac_aur.26.t:0 "A Letter That Names the Old Terms"
 ac_aur.26.d:0 "A letter arrives from a Leasathian minister. It is polite and specific: it lists the port fees, mining royalties and loan terms that Leasathians have complained about for years, and asks whether Aurelia is prepared to discuss them before 'other voices' in Leasath decide the matter for everyone.\n\nThe ministry can publish the letter and a reply that commits to talks, putting the issue before the Aurelian public. Or it can reply confidentially, keeping options open while it decides what Aurelia is willing to give.\n\n[AUR_relations_ac_aur_policy_callback]"
 ac_aur.26.a:0 "Publish the letter and commit to talks."
 ac_aur.26.b:0 "Reply confidentially."
 AUR_relations_ac_aur_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 AUR_relations_ac_aur_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 AUR_relations_ac_aur_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_aur.56.t:0 "The Contacts File"
 ac_aur.56.d:0 "The final review is the contacts file: every Leasathian office, faction and individual who answered Aurelia's calls, and what each said. The minister's letter is in it, with Aurelia's reply and the meetings that followed.\n\nThe file cannot say what Leasath will do next. It records what Aurelia offered and what it refused, which is what Leasathians will judge.\n\n[AUR_relations_ac_aur_report_callback]\n\n[AUR_relations_ac_aur_policy_callback]"
 ac_aur.56.a:0 "File the completed service record."
 AUR_readiness_ac_aur_policy_callback_0:0 "The standing policy is dispersed readiness. Its continuing cost remains part of the allocation."
 AUR_readiness_ac_aur_policy_callback_1:0 "The standing policy is concentrated capital defence. Its continuing cost remains part of the allocation."
 AUR_au_readiness_reply_public_spirit:0 "A Readiness Review: Public Return"
 AUR_au_readiness_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Exercise reserve movement to bases across the country. Public attention or reserved staff time remains committed to that work."
 AUR_au_readiness_reply_protected_spirit:0 "A Readiness Review: Protected Working Return"
 AUR_au_readiness_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Fund fuel and supply depots at bases outside the capital. Public attention or reserved staff time remains committed to that work."
 ac_aur.27.t:0 "A Base at the Edge of the Map"
 ac_aur.27.d:0 "The exercise report singles out one remote base. Its runway is in good order and its crews are trained, but the fuel convoy took four days to arrive and the radio link failed twice. The base commander's note ends with a question: if the capital went silent, what would the base be expected to do?\n\nThe defence ministry can publish the report, including the commander's question, and invite a public debate on readiness. Or it can circulate it to commanders only, fixing the convoy and radio without telling the public how thin the margins are.\n\n[AUR_readiness_ac_aur_policy_callback]"
 ac_aur.27.a:0 "Publish the report and the question."
 ac_aur.27.b:0 "Circulate it to commanders only."
 AUR_readiness_ac_aur_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 AUR_readiness_ac_aur_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 AUR_readiness_ac_aur_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_aur.57.t:0 "Orders That Work Without the Capital"
 ac_aur.57.d:0 "The final review lists every base, its supplies and the time it takes to answer. The remote base is there, with a fuel depot of its own and written orders for the case its commander asked about.\n\nAurelia's forces are no larger than before. They are better placed to answer an emergency the federation hopes will never come.\n\n[AUR_readiness_ac_aur_report_callback]\n\n[AUR_readiness_ac_aur_policy_callback]"
 ac_aur.57.a:0 "File the completed service record."
 AUR_account_ac_aur_policy_callback_0:0 "The standing policy is open federal audit. Its continuing cost remains part of the allocation."
 AUR_account_ac_aur_policy_callback_1:0 "The standing policy is protected federal ledger. Its continuing cost remains part of the allocation."
 AUR_au_account_reply_public_spirit:0 "The Public Account: Public Return"
 AUR_au_account_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Commission auditors to examine the federation's accounts and agreements. Public attention or reserved staff time remains committed to that work."
 AUR_au_account_reply_protected_spirit:0 "The Public Account: Protected Working Return"
 AUR_au_account_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Compile every guarantee, contract and promise into one account. Public attention or reserved staff time remains committed to that work."
 ac_aur.28.t:0 "The Guarantee in the Footnote"
 ac_aur.28.d:0 "The auditors find a guarantee in a footnote: the federation is liable for a large loan taken by a firm operating in Leasath, signed by a minister long since retired. Nobody in the treasury knew it existed. If the firm defaults, Aurelia pays.\n\nThe audit office wants the guarantee published with everything else. The treasury would rather keep it in the protected ledger until it knows whether the firm will default, so as not to start the default by announcing the risk.\n\n[AUR_account_ac_aur_policy_callback]"
 ac_aur.28.a:0 "Publish the guarantee."
 ac_aur.28.b:0 "Keep it in the protected ledger for now."
 AUR_account_ac_aur_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 AUR_account_ac_aur_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 AUR_account_ac_aur_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_aur.58.t:0 "Everything the Federation Owes"
 ac_aur.58.d:0 "The final account lists every obligation: loans, guarantees, contracts in dispute and promises to other governments. The footnoted guarantee is there, on the first page of its section.\n\nParliament can now argue about what Aurelia owes with the same numbers in front of every member. That is what the account was for.\n\n[AUR_account_ac_aur_report_callback]\n\n[AUR_account_ac_aur_policy_callback]"
 ac_aur.58.a:0 "File the completed service record."
 AUR_au_final_public_spirit:0 "Aurelia: Public Maintenance Assessment"
 AUR_au_final_public_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 AUR_au_final_readiness_spirit:0 "Aurelia: Reserved Readiness Return"
 AUR_au_final_readiness_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 AUR_au_opening_callback_public:0 "The opening hearing invited public questions. Its final account returns to that promise without pretending that every disagreement has been resolved."
 AUR_au_opening_callback_ministerial:0 "The opening review began with a protected ministerial docket. Its final account identifies what that process delivered and who must answer for the work still waiting."
 AUR_au_opening_callback_unanswered:0 "The opening invitation was never ratified. This assessment records that absence and proceeds from the services actually completed."
 ac_aur.80.t:0 "A Federation That Knows Itself"
 ac_aur.80.d:0 "The last review of the period sets the federation's records side by side: services, trade disputes, radar sites, loans, licences, contacts with Leasath, readiness and the public account. Each has a cost and a record of what it delivered.\n\nAurelia is not safer because it keeps records. It is better placed to know what it can do when it is tested.\n\n[AUR_au_opening_callback]"
 ac_aur.80.a:0 "Support a public maintenance review."
 ac_aur.80.b:0 "Reserve staff for a focused readiness return."
