 OSE_snc_emergency_review_brief:0 "The Authority after Midnight"
 OSE_snc_emergency_review_brief_desc:0 "An emergency instruction is copied into the next day's ordinary schedule because nobody has written down who may end it. The duty officer says the risk has not disappeared. The civil clerk says that was not the question. Review the authority that survives after an urgent decision, building on the government's existing crisis settlement. The work is useful during peace, external danger or a prolonged conflict. It concerns which offices may renew an exception, what evidence they need, and how a receiving service learns that a temporary priority has begun consuming a permanent part of its timetable."
 OSE_snc_emergency_review_brief_requirements_tt:0 "From 2010.1.1, an active national administration and the required earlier work are available. The selected policy remains exclusive; conclusions remain available when their real prerequisites finish after the expected calendar."
