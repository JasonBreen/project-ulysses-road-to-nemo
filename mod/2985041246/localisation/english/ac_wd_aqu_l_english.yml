l_english:
 AQU_wd_cr_locked_chamber:0 "A Chamber Shut Since 1987"
 AQU_wd_cr_locked_chamber_desc:0 "Aquitoria last elected a chamber in November 1987, and the Office of the Crown has governed alone since the elections were suspended. Half the kingdom still answers to the crown, while democrats and communists each claim about a fifth. Admitting that the arrangement is temporary costs the palace its comfortable silence, but no reform can begin until someone says it aloud."
 AQU_wd_cr_gate_petitions:0 "Petitions at the Palace Gate"
 AQU_wd_cr_gate_petitions_desc:0 "Clerks of the crown office open the sacks of petitions that have piled up at the palace gate since the chamber closed: dock pay, rents on the northern plain, grazing rights in the eastern hills. Reading and answering them takes a season of staff time. The replies tell every camp what the crown already knows about its grievances, and what it intends to ignore."
 AQU_wd_cr_three_camps:0 "Rolls of the Three Camps"
 AQU_wd_cr_three_camps_desc:0 "Crown loyalists, democrats and communists have kept informal membership rolls since 1987, the way banned clubs always do. Letting each camp register openly, with offices and newspapers, shows the palace how strong its rivals really are. The registers end the polite fiction that only the crown has followers, and they hand the police a list nobody fully trusts."
 AQU_wd_cr_path_compact:0 "A Compact of Crown and Chamber"
 AQU_wd_cr_path_compact_desc:0 "Moderate courtiers propose a written compact: the crown keeps its title, its seals and its veto over war, while a reopened chamber chooses the ministers who run the budget. Loyalists accept it as the price of quiet. Democrats call it half a reform and communists call it a costume change, yet the compact asks no camp to give up everything at once."
 AQU_wd_cr_path_republic:0 "The Republican Petition"
 AQU_wd_cr_path_republic_desc:0 "Democratic clubs from the capital port and the northern plain collect signatures for a republic: an elected head of state, a written constitution and a crown retired to private life. The petition grows fastest among clerks, teachers and shipping agents. Loyalists treat it as treason in a polite hand, and the palace guard begins counting the signatures with obvious unease."
 AQU_wd_cr_path_commune:0 "Councils on the Docks"
 AQU_wd_cr_path_commune_desc:0 "Communist organisers argue that the port, the arms halls and the logistics centre already run on the labour of a few thousand workers who are never consulted. They propose councils on every dock and shop floor that would elect a common executive. The idea spreads through the night shifts, and owners on the quay start hiring private watchmen for their sheds."
 AQU_wd_cr_path_privy:0 "The Crown Keeps the Seals"
 AQU_wd_cr_path_privy_desc:0 "Hardline courtiers want no chamber at all. They propose that a privy council appointed by the crown hold every seal of government, issue decrees and settle the question of 1987 by declaring it closed. Loyalists in the hill province applaud. The democrats and communists, who together match the loyalists in number, are told that patience is now a civic duty."
 AQU_wd_cr_compact_ministry:0 "Seat the Compact Ministry"
 AQU_wd_cr_compact_ministry_desc:0 "The chamber reopens under the compact and elects a ministry answerable to it, with elections returning on a fixed calendar. The crown now signs the budget it once wrote. Loyalist deputies hold the largest bloc, but they must bargain with democrats and communists over every line, and ministers can fall on a single lost vote in a crowded hall."
 AQU_wd_cr_republic_council:0 "Proclaim the Aquitorian Republic"
 AQU_wd_cr_republic_council_desc:0 "The crown withdraws from government, and a provisional council governs while the first presidential and chamber elections are prepared. The flag stays, the seals are recut and the palace becomes a public building. Loyalists, still half of the country, form the largest opposition any new republic could face, and they intend to win the very first ballot."
 AQU_wd_cr_commune_executive:0 "Elect the Council Executive"
 AQU_wd_cr_commune_executive_desc:0 "Dock, shop and depot councils send delegates to a common executive that takes the government seals, and the kingdom becomes the Aquitorian Commune. Wages and shift rotas are now political questions settled in open meetings. Shipowners and loyalist landholders in the hills refuse to recognise the executive, and the new government has little patience for their refusal."
 AQU_wd_cr_privy_council:0 "The Privy Council Takes the Seals"
 AQU_wd_cr_privy_council_desc:0 "A council appointed by the crown takes every seal and rules by decree, with the chamber dissolved for good and the 1987 rolls burned in the palace yard. Decisions arrive quickly and without debate. Order in the streets improves within months, while democrats and communists move their meetings into kitchens and back rooms where the police must work harder to follow them."
 AQU_wd_cr_compact_budget:0 "The First Voted Budget"
 AQU_wd_cr_compact_budget_desc:0 "For the first time since 1987 a budget passes the chamber after a public debate, with amendments from every bloc and a crown signature at the end. It is late, crowded with compromises and smaller than the treasury wanted. It is also the first budget any Aquitorian taxpayer can trace to a vote, which makes collecting it noticeably easier."
 AQU_wd_cr_republic_charter:0 "Write the Republican Charter"
 AQU_wd_cr_republic_charter_desc:0 "The provisional council drafts a charter fixing the presidency, a single chamber, an independent court and the rights of the press. Loyalist deputies force a clause protecting crown property and pensions. Ratification by public vote passes with a margin narrow enough to worry everyone. The republic now rests on a text rather than on the mood of a crowd."
 AQU_wd_cr_commune_books:0 "Councils Read the Company Books"
 AQU_wd_cr_commune_books_desc:0 "The executive orders every firm on the quay and in the arms halls to open its accounts to the workers councils. Managers who stay keep their posts but lose their secrets. Several shipowners reflag their vessels abroad overnight. The councils discover that the kingdom's firms were neither as poor nor as rich as either side had always claimed."
 AQU_wd_cr_privy_decrees:0 "Decrees Under the Privy Seal"
 AQU_wd_cr_privy_decrees_desc:0 "The privy council replaces emergency orders with a permanent code of decrees covering the press, assembly, wages and the frontier. Officials finally know what the law is, because the council wrote all of it. Foreign buyers welcome the predictability. Aquitorians who disagree learn that the code has an answer for them too, and that it is rarely gentle."
 AQU_wd_cr_question_closed:0 "The 1987 Question Is Closed"
 AQU_wd_cr_question_closed_desc:0 "Whatever answer the kingdom chose, the argument that began when the chamber was shut gives way to ordinary government. Ministries know whom they serve and petitioners know where to go. The losing camps have not vanished, and some will spend the next decade organising. For the first time since 1987, though, outsiders can predict who will sign tomorrow's orders."
 AQU_wd_city_four_provinces:0 "Survey the Four Provinces"
 AQU_wd_city_four_provinces_desc:0 "Aquitoria is a single crowded state of four provinces: the capital port on the western coast, a coastal plain running north toward Valka, the eastern hills where both frontiers meet and the southern plain around the logistics centre. Surveyors count houses, wells and tax rolls in each. Every province will learn exactly what the others receive, and few will like it."
 AQU_wd_city_port_water:0 "New Water Mains for the Port"
 AQU_wd_city_port_water_desc:0 "The capital port grew faster than its pipes, and the older wards still share standpipes that run dry each summer. Laying new mains under the existing roads keeps the streets open while the works go on underground. It is unglamorous and costly. Fewer summers of queues at the standpipes will win the government more loyalty than any parade on the quay."
 AQU_wd_city_rent_board:0 "Rents on the Northern Plain"
 AQU_wd_city_rent_board_desc:0 "Tenant farmers on the coastal plain north of the capital pay rents fixed before anyone now living was born, to landholders who mostly live in the port. A rent board with powers to cap and review leases eases the worst cases. Landholders call it confiscation by arithmetic, and several of them sit uncomfortably close to the crown office."
 AQU_wd_city_hill_schools:0 "Schools for the Eastern Hills"
 AQU_wd_city_hill_schools_desc:0 "Villages in the eastern hills send their children down to the plain for secondary school, and most of them never return. Building schools in the hill province keeps families together and gives the frontier a population that stays. Teachers must be paid a hardship allowance to go, and the allowance comes out of the port's own budget."
 AQU_wd_city_councils:0 "Elected Councils for Each Province"
 AQU_wd_city_councils_desc:0 "Each of the four provinces receives an elected council with its own budget line and a say over local works. The southern plain and the eastern hills finally gain voices the port must hear. The capital loses the ability to move money freely between provinces, and every budget becomes a negotiation among four councils with long memories."
 AQU_wd_city_commissioner:0 "A Commissioner for the Whole City"
 AQU_wd_city_commissioner_desc:0 "The alternative places all four provinces under one commissioner appointed from the capital, with a single works office and a single rulebook. Decisions get faster and money moves to wherever the commissioner judges the need is greatest. Notables in the hills and on the plain lose influence they have held for generations, and they will not forget who took it."
 AQU_wd_city_council_budgets:0 "Province Budgets in Public"
 AQU_wd_city_council_budgets_desc:0 "The provincial councils post their budgets on the doors of their halls and debate them in open session. The hill province wins a clinic, the southern plain a market hall, the northern plain a drainage scheme. Spending slows while every line is argued, but residents can see where their taxes went, and the arguments move off the streets."
 AQU_wd_city_commission_plan:0 "The Commissioner Ranks the Works"
 AQU_wd_city_commission_plan_desc:0 "The commissioner publishes a single works plan for the whole kingdom, ranking projects by traffic, population and cost rather than by which notable shouts loudest. Housing for dock workers rises first, then the drainage of the northern plain. It is efficient and it is resented. Nobody in the provinces was asked to approve the priorities they now live with."
 AQU_wd_city_charter:0 "A Charter for Four Provinces"
 AQU_wd_city_charter_desc:0 "Whichever arrangement the kingdom chose, the four provinces sign a short charter fixing revenue shares, the order of public works and the right to appeal to a common court. The document is dry, and it ends a decade of petitions. Future governments can plan the state without first reopening the question of who pays for whom."
 AQU_wd_wk_full_slots:0 "Six Plants and No Spare Ground"
 AQU_wd_wk_full_slots_desc:0 "Aquitoria's three civilian plants and three arms halls fill every industrial site the crowded state can offer, and the roads around them are already as good as engineers can make them. Growth cannot come from new ground. A census of every plant, shift and machine shows where the existing works lose time, power and steel."
 AQU_wd_wk_ore_assay:0 "Assay the Steel and Oil Seams"
 AQU_wd_wk_ore_assay_desc:0 "The state mines steel ore, pumps a modest amount of oil and gathers a little rubber, yet nobody has surveyed the seams since the plants were built. Geologists map the deposits, the water tables and the haul routes. Their findings settle which pits deserve investment and which should quietly close before they swallow any more of the works budget."
 AQU_wd_wk_refinery:0 "Run the Refinery at Full Draw"
 AQU_wd_wk_refinery_desc:0 "The kingdom already knows how to refine fuel, yet its small refinery runs below capacity because crude leaves by tanker before anyone bids for it at home. Holding back enough oil to run the refinery at full draw keeps the truck pool and the trains moving on domestic fuel. Export earnings fall, and the tanker brokers complain at length."
 AQU_wd_wk_crown_firms:0 "Chartered Crown Firms"
 AQU_wd_wk_crown_firms_desc:0 "One school wants each plant chartered as a crown firm: privately managed, protected from foreign competition and guaranteed the state's arms and steel orders in return for obeying the palace on prices. Managers like the certainty. Critics answer that a firm with a guaranteed buyer has no reason to improve, and the crown becomes its own captive customer."
 AQU_wd_wk_coops:0 "Cooperatives on the Shop Floor"
 AQU_wd_wk_coops_desc:0 "Union leaders propose turning each plant into a cooperative owned by its workforce, with elected managers and profits shared by shift. Output may suffer while workers learn to run the books. Absenteeism and strikes, the plagues of the arms halls since the chamber closed, would become the cooperatives' own problem rather than the crown's."
 AQU_wd_wk_tender:0 "Open the Works to Tender"
 AQU_wd_wk_tender_desc:0 "A third view invites foreign firms to bid for management contracts in the existing plants, bringing machine lines, methods and credit they cannot bring in new buildings. The works modernise fastest this way. Profits leave the kingdom with the managers, and every patriotic newspaper in the port prints the names of the foreign directors."
 AQU_wd_wk_charter_orders:0 "Ten-Year Orders for the Firms"
 AQU_wd_wk_charter_orders_desc:0 "With the firms chartered, the crown signs ten-year orders for rifles, trucks and steel plate at fixed prices. The arms halls run steady shifts for the first time in years. Fixed prices look generous when steel is cheap and ruinous when it is dear, and every later government inherits the contracts along with their clauses."
 AQU_wd_wk_shift_councils:0 "Shift Councils Set the Rotas"
 AQU_wd_wk_shift_councils_desc:0 "Each cooperative elects shift councils that set rotas, training and maintenance schedules. Workers who once hid broken machines now report them, because the repair bill is shared. Meetings eat into production hours and some councils vote themselves holidays the plants cannot afford. Within two years the cooperative halls run cleaner lines than they did under owners."
 AQU_wd_wk_foreign_lines:0 "Foreign Lines in Old Halls"
 AQU_wd_wk_foreign_lines_desc:0 "The foreign managers rip out the oldest presses and install modern lines in the same halls, working through nights and holidays to finish. Output per worker rises sharply. Half the old hands are retrained and the rest retire early on settlements the treasury pays. The halls look nothing like they did, and neither do the wage packets."
 AQU_wd_wk_retool:0 "Retool Instead of Rebuild"
 AQU_wd_wk_retool_desc:0 "Whatever the ownership, the lesson of the decade is the same: a kingdom with no spare ground grows by retooling the plants it has. Engineers draw up a rolling programme that refits one hall each year without halting the others. It costs steady money and patience, and it keeps every slot in the state producing more than it did."
 AQU_wd_port_convoy_register:0 "Register the Sixty Convoys"
 AQU_wd_port_convoy_register_desc:0 "Sixty merchant convoys sail from the capital port under the Aquitorian flag, yet the kingdom owns no warships and keeps no record of where most of its merchant hulls are at any moment. A register of owners, cargoes and routes, reported by radio each day, gives the port office its first real picture of the trade that pays the kingdom's bills."
 AQU_wd_port_pilots:0 "The Harbour Pilots Guild"
 AQU_wd_port_pilots_desc:0 "Every large ship entering the capital port takes on a local pilot, and the pilots have worked for decades as a loose fraternity with their own customs and fees. Chartering them as a guild with formal training, a published tariff and a duty roster makes the harbour safer at night. It also gives the guild leverage it will certainly use."
 AQU_wd_port_customs:0 "One Customs House on the Quay"
 AQU_wd_port_customs_desc:0 "Customs, harbour dues and the port police answer to three different ministries, and shipmasters pay small bribes to all three. Merging them into one customs house on the quay, with posted tariffs and printed receipts, ends most of the bribery and some of the revenue that quietly depended on it. Merchants notice the difference within a season."
 AQU_wd_port_shore_radar:0 "Radar Above the Northern Shore"
 AQU_wd_port_shore_radar_desc:0 "Merchant masters report unlit vessels loitering off the northern coastal plain at night, and the port office has no way to see them. A radar post above the shore covers the approaches to the capital and the plain. The equipment is imported and the crews take a year to train, but the coast is no longer watched only by fishermen."
 AQU_wd_port_tugs:0 "Tugs and a Salvage Crew"
 AQU_wd_port_tugs_desc:0 "When a freighter grounds at the harbour mouth the port must borrow tugs from abroad and wait days for them. A small salvage service with its own tugs, divers and pumps clears the channel within hours. The boats are second-hand and the divers are trained by the pilots guild, which is pleased to be needed and says so at every meeting."
 AQU_wd_port_declare_free:0 "Declare a Free Port"
 AQU_wd_port_declare_free_desc:0 "One camp wants the capital port declared free: no duties on goods landed for transit, sheds open to any trader and the quay run for volume rather than revenue. Shipping agents from both neighbours would route cargo through Aquitoria. The treasury loses its tariff income and must hope that wharf fees and wages make up the difference."
 AQU_wd_port_bonded_sheds:0 "Bonded Crown Warehouses"
 AQU_wd_port_bonded_sheds_desc:0 "The other camp prefers bonded warehouses owned by the crown, where imported fuel, grain and steel are stored and released by licence. The state earns storage fees and keeps a reserve within reach of the palace. Traders complain about the paperwork and the queues. The reserve, however, means the kingdom never again runs dry because one tanker was late."
 AQU_wd_port_pays_its_way:0 "A Port That Pays Its Way"
 AQU_wd_port_pays_its_way_desc:0 "Whether free or bonded, the capital port now publishes its accounts each year: tonnage landed, fees collected, ships lost and delays logged. The figures show the port covering its own upkeep for the first time in memory. They also show how much of the kingdom's food and fuel arrives by sea, a fact that worries the army more than the merchants."
 AQU_wd_army_muster:0 "Two Formations at Muster"
 AQU_wd_army_muster_desc:0 "Aquitoria's army is a territorial service of two infantry formations, four battalions in all, armed from stores of eight hundred sets of infantry kit and several hundred trucks. It has no artillery, no engineers and no aircraft. Calling every soldier to muster on one day shows the general staff what the kingdom can actually field."
 AQU_wd_army_hill_drill:0 "Mountain Drill in the Eastern Hills"
 AQU_wd_army_hill_drill_desc:0 "The eastern hill province touches both Monstrua and Valka, and it is the only high ground in the kingdom. The army already keeps mountain instructors on its books. Rotating every battalion through a season of hill drill teaches soldiers the ground they would actually defend. The cost is time away from the port garrisons and the city."
 AQU_wd_army_trucks:0 "Keep the Trucks Running"
 AQU_wd_army_trucks_desc:0 "Five hundred and sixty trucks are the army's real strength, carrying both formations and their supplies across a state small enough to cross in a morning. Half of them sit in workshops waiting for parts. A maintenance programme with a parts depot at the logistics centre puts most of them back on the road, which matters more than any new weapon."
 AQU_wd_army_hill_line:0 "Hold the Hill Line"
 AQU_wd_army_hill_line_desc:0 "One doctrine digs the army into the eastern hills where the two frontiers meet, with prepared positions, stocked bunkers and battalions assigned to their own ridges. It turns a small force into a hard obstacle. It also leaves the capital port and the southern plain guarded by whatever the hills can spare, which in a crisis is very little."
 AQU_wd_army_wheeled_reserve:0 "A Reserve on Wheels"
 AQU_wd_army_wheeled_reserve_desc:0 "The other doctrine keeps the battalions together near the logistics centre and moves them by truck and train to wherever trouble appears. Distances inside the kingdom are short enough that a motorised reserve can reach any frontier crossing in hours. It demands constant drill and fuel, and it trusts that warning will come in time."
 AQU_wd_army_bunkers:0 "Magazines Cut into the Slopes"
 AQU_wd_army_bunkers_desc:0 "The hill line needs stores that survive the first week of any crisis, so work crews borrowed from the plants cut magazines and water tanks into the slopes behind each battalion position. The digging takes two summers. Afterward a battalion cut off in the hills can hold out for a month without a single truck reaching it."
 AQU_wd_army_troop_trains:0 "Troop Trains to the Coast"
 AQU_wd_army_troop_trains_desc:0 "The reserve doctrine depends on the twenty-four trains the army keeps and the short railway between the logistics centre and the capital port. Timetables, loading ramps and a military platform at each end let a full battalion entrain in under an hour. Civilian freight waits whenever the army drills, and the railway office counts every delay."
 AQU_wd_army_staff_course:0 "A Staff Course for Captains"
 AQU_wd_army_staff_course_desc:0 "Captains of the territorial service learned staff work abroad or not at all, and orders from different battalions read like letters from different armies. A short staff course at the capital teaches one method for planning, supply and signals. The classes are small and the instructors are borrowed from the port office, but the orders begin to match."
 AQU_wd_nb_two_frontiers:0 "Two Frontiers Meet in the Hills"
 AQU_wd_nb_two_frontiers_desc:0 "Aquitoria borders Monstrua to the south and Valka to the north and east, and the two frontiers meet in its eastern hill province. Monstrua is governed by a nationalist movement with almost no rivals; Valka by a government whose own public is split down the middle. The kingdom must decide how it means to live between them."
 AQU_wd_nb_valka_freight:0 "Through Freight from Valka"
 AQU_wd_nb_valka_freight_desc:0 "Valkan trucks cross the northern coastal plain to reach the capital port, but every load is unpacked twice, once at each customs post. A single manifest and a shared inspection shed halve the delay. Valkan traders gain an easy road to the sea, and Monstruan newspapers notice which way the freight now runs and say so in print."
 AQU_wd_nb_monstrua_road:0 "The Market Road South"
 AQU_wd_nb_monstrua_road_desc:0 "Hill farmers from the Monstruan side bring produce to markets on the southern plain, whatever their governments say. Paving the market road and opening a customs post turns a smuggling trail into lawful trade. Monstruan officials welcome the revenue, and they station more uniformed men at their end of the post than trade alone would explain."
 AQU_wd_nb_lean_valka:0 "Lean Toward Valka"
 AQU_wd_nb_lean_valka_desc:0 "Valka is the neighbour whose freight already crosses the northern plain and whose government keeps a democratic banner. Closer ties mean shared customs, student places and a standing channel between the two cabinets. Monstrua will read every handshake as a choice against it. No alliance is signed and no faction joined; the lean is in trade and tone alone."
 AQU_wd_nb_terms_monstrua:0 "Terms with Monstrua"
 AQU_wd_nb_terms_monstrua_desc:0 "Monstrua's movement governs without rivals and values respect above trade. Terms with Monstrua mean prompt answers to its complaints about exiles, closed doors for its opposition and quiet frontier talks. The southern hills calm down. Aquitorian democrats and communists, who have their own reasons to fear such a neighbour, protest loudly in the port."
 AQU_wd_nb_equal_distance:0 "Equal Distance from Both"
 AQU_wd_nb_equal_distance_desc:0 "The third answer treats both neighbours exactly alike: the same tariffs, the same visits, the same refusals. Aquitoria becomes the place where Valkan and Monstruan officials can meet on neutral ground. Equal distance wins no friends, and each neighbour suspects the kingdom of favouring the other, yet it never forces the crown to choose."
 AQU_wd_nb_valka_colleges:0 "Places in Valkan Colleges"
 AQU_wd_nb_valka_colleges_desc:0 "Closer ties with Valka open places in its colleges to Aquitorian students of engineering, medicine and law, paid for jointly by both treasuries. A generation of young professionals will return with Valkan habits and Valkan friends. Loyalists worry about the ideas they will bring home; Monstruan diplomats simply note the numbers and file them."
 AQU_wd_nb_quiet_south:0 "A Quiet Southern Frontier"
 AQU_wd_nb_quiet_south_desc:0 "Under the terms with Monstrua, patrols on both sides of the southern hills keep to agreed schedules and frontier incidents stop appearing in the newspapers. Trade through the logistics centre grows. The price is paid by Monstruan exiles in Aquitoria, who find themselves watched, and by Aquitorian opposition papers, which find themselves warned."
 AQU_wd_nb_neutral_ground:0 "Talks on Neutral Ground"
 AQU_wd_nb_neutral_ground_desc:0 "Equal distance makes Aquitoria the obvious venue when Valkan and Monstruan officials need to talk without being seen to visit each other. Delegations meet in a hall at the capital port, with Aquitorian clerks taking the minutes. The kingdom earns nothing directly. It gains a habit of being useful to both, which may matter in a harder decade."
 AQU_wd_nb_joint_commission:0 "A Frontier Commission of Three"
 AQU_wd_nb_joint_commission_desc:0 "Whatever the lean, the frontier itself needs tending: markers fall, streams shift and herders wander. A standing commission with members from all three governments walks the line each spring and settles small disputes before they reach a ministry. It claims nothing beyond the existing frontier and moves no marker, and its very dullness is its value."
 AQU_wd_air_no_airfield:0 "A Kingdom Without an Airfield"
 AQU_wd_air_no_airfield_desc:0 "Aquitoria has no air base, no combat aircraft and only a few pilots, all of them trained abroad. Its research staff studied early fighter designs years ago and never bought one. Founding an air office that drafts a plan, a budget and a training scheme is the first step. Whether the kingdom should fly at all is still being argued."
 AQU_wd_air_first_field:0 "Lay Down the First Runway"
 AQU_wd_air_first_field_desc:0 "The air office chooses farmland at the edge of the capital port for the kingdom's first runway, with hangars, a fuel store and a short taxiway. The tenants who worked that land are compensated, though not generously. Once the runway opens, the kingdom can receive transport flights and train pilots at home instead of sending them away."
 AQU_wd_air_tower_radar:0 "Tower and Radar at the Field"
 AQU_wd_air_tower_radar_desc:0 "A runway without a tower and a radar set is only a strip of concrete. Air traffic control and a search radar beside the field let the kingdom track flights crossing its small airspace and guide its own aircraft home in bad weather. The radar crew must be trained abroad, and the set itself costs more than the hangars did."
 AQU_wd_air_fighter_flight:0 "A Fighter Flight for the Capital"
 AQU_wd_air_fighter_flight_desc:0 "One school wants a small flight of fighters on alert over the capital port and the arms halls, flown by the best pilots the kingdom can train. A dozen aircraft cannot win a war, but they can make an intruder think twice. The flight will eat most of the air budget, leaving nothing for transport or liaison work."
 AQU_wd_air_liaison_flight:0 "Transport and Liaison Flight"
 AQU_wd_air_liaison_flight_desc:0 "The other school wants transports and light liaison aircraft that carry officers, medicine and spare parts between the port, the logistics centre and the eastern hills. It fits the army's priority of sustainment better than fighters. The sky stays undefended, and the air office must explain to every minister why it bought aircraft that cannot shoot."
 AQU_wd_air_aggressors:0 "Hire Aggressor Instructors"
 AQU_wd_air_aggressors_desc:0 "Former top pilots of the Belkan Air Force are now hired by various countries to fly as aggressor squadrons. The kingdom's handful of pilots could learn more in a month against such instructors than in years of solo practice. The fees are high, and nobody in the air office asks too closely about the instructors' politics or their pasts."
 AQU_wd_air_dispersal:0 "Dispersal Aprons and a Longer Strip"
 AQU_wd_air_dispersal_desc:0 "A single runway can be closed by one burst tyre or one well-placed bomb. Lengthening it and adding dispersal aprons on the far side of the field lets heavier transports land and spreads the aircraft apart. The extension swallows another strip of farmland, and the tenants association files its second protest in five years."
 AQU_wd_bw_outbreak:0 "Freight Rates Jump Overnight"
 AQU_wd_bw_outbreak_desc:0 "When war breaks out around Belka in March 1995, the first news reaches the capital port through the freight market rather than the radio: charter rates double, insurers add war clauses and buyers nobody has met ask for fuel and rifles. Aquitoria is nowhere near the fighting, yet its ledgers feel the war at once."
 AQU_wd_bw_cash_buyers:0 "Cash Buyers at the Arms Halls"
 AQU_wd_bw_cash_buyers_desc:0 "The arms halls could sell every rifle and round they make to buyers who pay in cash and ask nothing about end use. Taking the orders fills three shifts and the treasury together. Every buyer's enemy will remember the markings on the crates, and some of those enemies may still be powerful when this war is long over."
 AQU_wd_bw_closed_halls:0 "No Rifles for Any Belligerent"
 AQU_wd_bw_closed_halls_desc:0 "The opposite course embargoes arms to every party in the war while fuel and food continue to sail. The arms halls lose their busiest year in a decade, and their workers lose overtime they had already spent. Aquitorian ships, in exchange, are less likely to be stopped and searched by navies that remember who stayed out."
 AQU_wd_bw_fallout_watch:0 "Radiation Meters on the Quay"
 AQU_wd_bw_fallout_watch_desc:0 "In this outcome nuclear devices have been used in the Belkan War, and every cargo from the war zone arrives under suspicion. The port office installs radiation meters at the quay, trains inspectors and publishes daily readings. Nothing alarming may ever be found. The readings calm the dock wards, and the meters stay in place long after the war."
 AQU_wd_bw_lumen:0 "Peace News from Lumen"
 AQU_wd_bw_lumen_desc:0 "A treaty signed in Lumen on 20 June 1995 ends the Belkan War. Freight rates sink back toward their old levels and insurers drop most war clauses. The arms halls must decide what to do with orders that will never be paid, and the port office must explain to shipowners why the boom ended faster than it began."
 AQU_wd_bw_answer_crates:0 "Answer for the Wartime Crates"
 AQU_wd_bw_answer_crates_desc:0 "After the war, foreign ministries ask who supplied the weapons found on battlefields around Belka, and some crates carry Aquitorian markings. Licensing every future arms export, with buyer and end use published, turns an embarrassment into a rule. The halls keep their honest customers. The discreet ones, who paid best, take their business somewhere else."
 AQU_wd_bw_credit_staying_out:0 "Credit for Staying Out"
 AQU_wd_bw_credit_staying_out_desc:0 "The embargo held for the whole war, and the shipping registries noticed. Aquitorian ships face fewer inspections, the port wins charters from owners who want a flag with no enemies and the crown gains a reputation it could not have bought. The arms halls are still short of work, but the quay is busier than ever."
 AQU_wd_bw_belkan_agents:0 "Purchasing Agents from Belka"
 AQU_wd_bw_belkan_agents_desc:0 "In this outcome Belka has won its war, and Belkan purchasing agents arrive at the capital port with lists of fuel, steel and trucks for rebuilding. They pay promptly. Accepting the orders fills the plants, and it also marks the kingdom as Belka's supplier just as Belka's beaten neighbours decide whose ships to welcome."
 AQU_wd_bw_surplus_tools:0 "Surplus Machine Tools at Auction"
 AQU_wd_bw_surplus_tools_desc:0 "In this outcome Belka has lost its war, and surplus machine tools from Belkan plants that will never reopen come up for auction. Aquitoria's crowded halls cannot hold new plants, but they can hold better machines. Buying at auction refreshes the lines cheaply. Engineers must learn unfamiliar equipment from manuals in a language few of them read."
 AQU_wd_uly_announced:0 "Ulysses Will Strike"
 AQU_wd_uly_announced_desc:0 "The warning of December 1994 becomes an announcement in April 1996: the asteroid Ulysses will strike the Earth, and nobody can yet say where its fragments will fall. Aquitoria is one crowded state with a port, two plains and a range of hills. Every ministry produces a plan at once, and every plan needs money the treasury does not have."
 AQU_wd_uly_port_shelters:0 "Shelters Beneath the Capital Port"
 AQU_wd_uly_port_shelters_desc:0 "Engineers propose cutting shelters beneath the capital port and the arms halls, with sealed water tanks and stores for a fortnight. The port is where most Aquitorians live and work, so most of them could reach a shelter in minutes. The plan is slow, expensive and useless to anyone caught on the open plain when fragments fall."
 AQU_wd_uly_hill_routes:0 "Evacuation Routes to the Hills"
 AQU_wd_uly_hill_routes_desc:0 "Planners propose instead that the coast be emptied on warning: marked routes, trucks and trains to carry the population into the eastern hills, where camps and stores would wait. Evacuation is cheaper than concrete and protects people from the sea as well as the sky. It depends on warning arriving in time and on people obeying."
 AQU_wd_uly_centre_stores:0 "Stores at the Logistics Centre"
 AQU_wd_uly_centre_stores_desc:0 "Grain, medicine, fuel and water containers are gathered into depots at the logistics centre, the one place in the kingdom with good roads in every direction. Filling the depots drives up prices in the port markets just as people are already frightened. Emptying them, if the day comes, will be the hardest supply task the army ever faces."
 AQU_wd_uly_chamber_drills:0 "Drills Voted by the Chamber"
 AQU_wd_uly_chamber_drills_desc:0 "The compact ministry puts every preparation to the chamber, publishes the plans and rehearses evacuations with deputies from all three camps taking part. The first drills are clumsy and the press mocks them. By the third, each ward knows its route and shelter, and the opposition finds it hard to attack plans it voted for."
 AQU_wd_uly_republic_wardens:0 "Volunteer Wardens of the Republic"
 AQU_wd_uly_republic_wardens_desc:0 "The republic asks citizens to prepare themselves: volunteer wardens in every street, first-aid courses in the schools and shelters dug by neighbourhood associations. Enthusiasm runs high in the port and lower in the loyalist hills. The result is uneven, energetic and cheap, and it gives the young republic something to do besides argue about its own origins."
 AQU_wd_uly_commune_rations:0 "Council Rations for Every Household"
 AQU_wd_uly_commune_rations_desc:0 "The commune hands preparation to the councils, which ration grain, fuel and water containers by household and post the lists on every door. Hoarding becomes almost impossible and queues disappear. So does choice. Families who preferred their own arrangements discover that the councils count everything, including how often a neighbour complains."
 AQU_wd_uly_privy_curfew:0 "A Curfew Under the Privy Seal"
 AQU_wd_uly_privy_curfew_desc:0 "The privy council treats the asteroid as a question of order. A night curfew, licensed movement between provinces and soldiers posted at every depot keep the streets calm and the stores intact. Drills run punctually because attendance is compulsory. Aquitorians learn how quickly an emergency becomes a habit when the council finds it convenient."
 AQU_wd_uly_province_depots:0 "A Depot in Every Province"
 AQU_wd_uly_province_depots_desc:0 "The charter of four provinces fixes revenue shares, so the reserve can finally be spread fairly: a depot in each province, sized by population. The hill province receives a depot it never expected and the northern plain its first cold store. The logistics centre loses its monopoly on emergency supplies, which is what the other provinces wanted."
 AQU_wd_uly_roche_night:0 "Awake Through the Roche Night"
 AQU_wd_uly_roche_night_desc:0 "On 8 July 1999 the asteroid Ulysses passes through the Roche limit of the Earth. Aquitorians spend the night beside radios, in shelters or on the evacuation roads, depending on what their government prepared. The port office logs every report from ships at sea. Whatever falls and wherever it falls, the kingdom will feel it for years."
 AQU_wd_uly_refugee_berths:0 "Berths for Refugee Ships"
 AQU_wd_uly_refugee_berths_desc:0 "Erusea closes its doors to refugees on 21 April 2000, and the port office expects the consequences to arrive by sea. Crowded vessels may soon appear off the capital asking for berths, water and a place ashore. Accepting them fills the dock wards and draws on the emergency depots. Refusing them is cheap, and every shipmaster on the quay will remember it."
 AQU_wd_uw_railguns:0 "Railguns Seized in San Salvacion"
 AQU_wd_uw_railguns_desc:0 "Erusea's invasion of neutral San Salvacion in the summer of 2003 puts the railguns of Stonehenge in Erusean hands, and they are soon firing at aircraft. Usea lies far from Aquitoria, yet freight rates, insurance and fuel prices follow the war to the capital port within weeks. Shipowners refuse Usean charters until the government states its position."
 AQU_wd_uw_isaf_cargo:0 "Cargo for the ISAF Depots"
 AQU_wd_uw_isaf_cargo_desc:0 "The FCU establishes the ISAF in August 2003, and its quartermasters need fuel, trucks and steel plate delivered to distant depots. Contracts with the ISAF fill the arms halls and the convoys without committing a single Aquitorian soldier. Erusea will treat every such cargo as hostile, and ships bound for the ISAF sail knowing it."
 AQU_wd_uw_closed_to_war:0 "No War Cargo Leaves the Quay"
 AQU_wd_uw_closed_to_war_desc:0 "The cautious answer closes the capital port to any cargo bound for either army, with inspectors on the quay to check manifests and seals. Shipowners lose the richest charters of the decade. The flag, however, stays clean in Usean waters, and crews sail without wondering which navy will decide they are a target."
 AQU_wd_uw_paying_freight:0 "Freight for Any Paying Port"
 AQU_wd_uw_paying_freight_desc:0 "A third answer sells to civilian buyers in any port that pays in advance and asks nothing about where the cargo goes after that. The arms halls and the convoys stay busy and the treasury fills. Both sides suspect the kingdom of feeding the other, and insurers charge for that suspicion on every single voyage."
 AQU_wd_uw_crown_firm_orders:0 "Crown Firms Take Wartime Orders"
 AQU_wd_uw_crown_firm_orders_desc:0 "The chartered crown firms, guaranteed their home orders, now bid for wartime contracts abroad as well. The arms halls add a third shift and recruit on the northern plain. Profits climb and so does the palace's share. When the war ends, the firms will expect the crown to find them buyers, as it always has."
 AQU_wd_uw_coop_vote:0 "Cooperatives Vote on War Work"
 AQU_wd_uw_coop_vote_desc:0 "Each cooperative hall must decide by vote whether to take wartime orders. Most accept, some refuse and two split into rival councils for a month. The halls that accept work longer hours for higher shares; the halls that refuse retool for civilian goods. The arguments are loud, public and settled without a single strike."
 AQU_wd_uw_tender_bids:0 "Foreign Managers Chase Contracts"
 AQU_wd_uw_tender_bids_desc:0 "The foreign managers running the tendered halls see the war as a market and bid for every contract their head offices can find. Output rises quickly on the modern lines. Decisions about whom to supply are now taken partly in foreign boardrooms, and Aquitorian ministers learn about some of the contracts from the newspapers."
 AQU_wd_uw_transit_sheds:0 "Transit Sheds Overflow"
 AQU_wd_uw_transit_sheds_desc:0 "The free port fills with cargo routed around the war: goods that cannot travel by the old Usean lanes are landed, stored and reshipped through the capital. Wharf fees and wages soar and the sheds overflow onto the streets. Customs officers, with nothing to tax, simply count the ships and wonder how long it will last."
 AQU_wd_uw_bonded_prices:0 "The Bonded Reserve Holds Prices"
 AQU_wd_uw_bonded_prices_desc:0 "With freight and fuel prices climbing everywhere, the crown's bonded warehouses release stored fuel and grain at steady prices. Bread and bus fares in the capital barely move while prices elsewhere double. Traders who hoped to profit from the shortage are disappointed. The reserve empties faster than planned, and refilling it at wartime prices will hurt."
 AQU_wd_uw_stonehenge_quiet:0 "Stonehenge Goes Quiet"
 AQU_wd_uw_stonehenge_quiet_desc:0 "In this outcome the railgun complex has been destroyed, and the Usean sky is no longer closed to aircraft. Insurers trim their war clauses on the nearest routes and shipowners begin accepting Usean charters again. The kingdom drops its wartime surcharge, which pleases the merchants and removes a convenient source of revenue."
 AQU_wd_uw_usean_rebuilding:0 "Steel for Usean Rebuilding"
 AQU_wd_uw_usean_rebuilding_desc:0 "In this outcome the ISAF has won, and rebuilding begins across Usea. Ports, bridges and power lines need steel plate, trucks and fuel. Aquitorian firms bid beside much larger exporters and win a modest share. Payment stretches over years, and the governments placing the orders have little money of their own to spend."
 AQU_wd_uw_erusean_licence:0 "Shipping Under Erusean Licence"
 AQU_wd_uw_erusean_licence_desc:0 "In this outcome Erusea has won, and Erusean harbour masters now decide which foreign ships may unload in Usea. Their trade offices offer Aquitorian shippers a licence in exchange for inspections and favourable prices. Accepting keeps the convoys sailing to Usean ports. Customers elsewhere, who remember the railguns, may wonder whose side the kingdom is on."
 AQU_wd_uw_kingdom_ledger:0 "A Ledger for 1991 to 2005"
 AQU_wd_uw_kingdom_ledger_desc:0 "With the Usean war winding down, the government's statisticians assemble a single printed ledger covering fifteen years: the constitution as it now stands, output from the six plants, earnings of the port, and the price of the asteroid years and two faraway wars. It makes no promises about what comes next, only about what has been."
 AQU_wd_uw_kingdom_ledger_tt_2:0 "Closes the 1991 to 2005 programme; later eras are not yet written."
 ac_wd_aqu_tree:0 "Aquitoria: National Programme"
 ac_wd_aqu_tree_desc:0 "The national focus programme of Aquitoria, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 AQU_wd_crown_office_rule:0 "Orders of the Crown Office"
 AQU_wd_crown_office_rule_desc:0 "The crown governs alone on orders renewed each year since the chamber closed in 1987."
 AQU_wd_petition_office:0 "The Petition Office"
 AQU_wd_petition_office_desc:0 "Clerks at the palace gate read and answer every petition."
 AQU_wd_open_registers:0 "Open Party Registers"
 AQU_wd_open_registers_desc:0 "Loyalists, democrats and communists may register members and print newspapers."
 AQU_wd_compact_promise:0 "Promise of a Compact"
 AQU_wd_compact_promise_desc:0 "The crown has promised to share government with a reopened chamber."
 AQU_wd_republican_clubs:0 "The Republican Clubs"
 AQU_wd_republican_clubs_desc:0 "Democratic clubs gather signatures for a republic in every ward."
 AQU_wd_dock_councils:0 "Councils on the Docks"
 AQU_wd_dock_councils_desc:0 "Workers on the quay and in the halls elect councils that claim a voice in government."
 AQU_wd_privy_seals:0 "The Seals Stay with the Crown"
 AQU_wd_privy_seals_desc:0 "Hardline courtiers hold that the crown alone may govern."
 AQU_wd_responsible_ministry:0 "A Ministry Answerable to the Chamber"
 AQU_wd_responsible_ministry_desc:0 "Ministers chosen by the chamber govern; the crown signs on their advice."
 AQU_wd_republican_charter:0 "The Republican Charter"
 AQU_wd_republican_charter_desc:0 "A written charter: an elected president, one chamber, a court and a free press."
 AQU_wd_council_economy:0 "The Council Economy"
 AQU_wd_council_economy_desc:0 "Workers councils read the books and set the shifts of every firm."
 AQU_wd_privy_decrees:0 "Code of Privy Decrees"
 AQU_wd_privy_decrees_desc:0 "A permanent code of decrees issued by the privy council."
 AQU_wd_ward_survey:0 "The Province Survey"
 AQU_wd_ward_survey_desc:0 "Houses, wells and tax rolls of the four provinces have been counted."
 AQU_wd_port_water:0 "Mains for the Port Wards"
 AQU_wd_port_water_desc:0 "The older wards of the capital port have water through the summer."
 AQU_wd_rent_board:0 "The Rent Board"
 AQU_wd_rent_board_desc:0 "A board caps and reviews leases on the northern coastal plain."
 AQU_wd_hill_schools:0 "Schools in the Hills"
 AQU_wd_hill_schools_desc:0 "Secondary schools keep hill families in the eastern province."
 AQU_wd_elected_wards:0 "Elected Province Councils"
 AQU_wd_elected_wards_desc:0 "Each province has an elected council and a budget line of its own."
 AQU_wd_crown_commissioner:0 "The City Commissioner"
 AQU_wd_crown_commissioner_desc:0 "One appointed commissioner runs the works of all four provinces."
 AQU_wd_open_budgets:0 "Budgets on the Hall Doors"
 AQU_wd_open_budgets_desc:0 "Province budgets are published and debated in open session."
 AQU_wd_works_plan:0 "The Commissioner Works Plan"
 AQU_wd_works_plan_desc:0 "One ranked plan for housing and drainage across the kingdom."
 AQU_wd_crowded_works:0 "No Spare Ground"
 AQU_wd_crowded_works_desc:0 "Every industrial site in the state is taken; growth must come from the halls already built."
 AQU_wd_home_fuel:0 "Fuel Refined at Home"
 AQU_wd_home_fuel_desc:0 "Enough crude is held back to run the refinery at full draw."
 AQU_wd_crown_firms:0 "Chartered Crown Firms"
 AQU_wd_crown_firms_desc:0 "Private managers hold crown charters and guaranteed state orders."
 AQU_wd_shop_coops:0 "Shop-Floor Cooperatives"
 AQU_wd_shop_coops_desc:0 "Each plant is owned by its workforce and run by elected managers."
 AQU_wd_open_tender:0 "Management by Tender"
 AQU_wd_open_tender_desc:0 "Foreign firms manage the halls under contract."
 AQU_wd_charter_orders:0 "Ten-Year Crown Orders"
 AQU_wd_charter_orders_desc:0 "Fixed-price state orders for rifles, trucks and steel plate."
 AQU_wd_shift_councils:0 "Shift Councils"
 AQU_wd_shift_councils_desc:0 "Elected councils set rotas, training and maintenance in every hall."
 AQU_wd_foreign_lines:0 "Foreign Machine Lines"
 AQU_wd_foreign_lines_desc:0 "Modern presses and lines installed in the old halls."
 AQU_wd_retooled_halls:0 "A Hall Refitted Each Year"
 AQU_wd_retooled_halls_desc:0 "A rolling refit programme keeps every slot producing more."
 AQU_wd_convoy_register:0 "The Convoy Register"
 AQU_wd_convoy_register_desc:0 "Owners, cargoes and routes of the sixty convoys reported by radio each day."
 AQU_wd_pilots_guild:0 "The Harbour Pilots Guild"
 AQU_wd_pilots_guild_desc:0 "Chartered pilots with training, fees and a duty roster."
 AQU_wd_posted_tariffs:0 "Posted Tariffs on the Quay"
 AQU_wd_posted_tariffs_desc:0 "One customs house with printed tariffs and receipts."
 AQU_wd_free_port:0 "The Free Port"
 AQU_wd_free_port_desc:0 "No duty on transit goods; the quay runs for volume."
 AQU_wd_bonded_stores:0 "Bonded Crown Warehouses"
 AQU_wd_bonded_stores_desc:0 "Imported fuel, grain and steel held under licence in crown sheds."
 AQU_wd_port_accounts:0 "Published Port Accounts"
 AQU_wd_port_accounts_desc:0 "Tonnage, fees, losses and delays printed every year."
 AQU_wd_territorial_service:0 "The Territorial Service"
 AQU_wd_territorial_service_desc:0 "Two infantry formations, four battalions, counted on one muster day."
 AQU_wd_hill_drill:0 "Hill Drill"
 AQU_wd_hill_drill_desc:0 "Every battalion trains a season on the eastern ridges."
 AQU_wd_hill_line:0 "The Hill Line"
 AQU_wd_hill_line_desc:0 "Battalions assigned to prepared positions where the two frontiers meet."
 AQU_wd_wheeled_reserve:0 "A Reserve on Wheels"
 AQU_wd_wheeled_reserve_desc:0 "The battalions held together near the logistics centre, moved by truck."
 AQU_wd_stocked_hills:0 "Magazines in the Slopes"
 AQU_wd_stocked_hills_desc:0 "Stores and water cut into the hills behind each position."
 AQU_wd_rail_reserve:0 "Reserve by Rail"
 AQU_wd_rail_reserve_desc:0 "Troop trains and ramps let a battalion entrain within the hour."
 AQU_wd_frontier_customs:0 "Two Customs Frontiers"
 AQU_wd_frontier_customs_desc:0 "Customs posts face Monstrua and Valka across the eastern hills."
 AQU_wd_valka_freight:0 "Valkan Freight by Road"
 AQU_wd_valka_freight_desc:0 "Valkan trucks cross the northern plain to the capital port on one manifest."
 AQU_wd_southern_market:0 "The Southern Market Post"
 AQU_wd_southern_market_desc:0 "Lawful trade with the Monstruan hills through one customs post."
 AQU_wd_valka_ties:0 "Close Ties with Valka"
 AQU_wd_valka_ties_desc:0 "Shared customs and a standing channel between the two cabinets."
 AQU_wd_monstrua_terms:0 "Terms with Monstrua"
 AQU_wd_monstrua_terms_desc:0 "Quiet frontier talks and closed doors for Monstruan exiles."
 AQU_wd_equal_distance:0 "Equal Distance"
 AQU_wd_equal_distance_desc:0 "The same tariffs, visits and refusals for both neighbours."
 AQU_wd_valka_students:0 "Places in Valkan Colleges"
 AQU_wd_valka_students_desc:0 "Aquitorian students of engineering, medicine and law study in Valka."
 AQU_wd_quiet_south:0 "A Quiet Southern Frontier"
 AQU_wd_quiet_south_desc:0 "Patrols on agreed schedules; no incidents in the newspapers."
 AQU_wd_neutral_venue:0 "Neutral Ground at the Port"
 AQU_wd_neutral_venue_desc:0 "Valkan and Monstruan officials meet in Aquitorian halls."
 AQU_wd_frontier_commission:0 "Frontier Commission of Three"
 AQU_wd_frontier_commission_desc:0 "A joint commission walks the line each spring."
 AQU_wd_air_office:0 "The Air Office"
 AQU_wd_air_office_desc:0 "A small office drafting the plan, budget and training of a future air arm."
 AQU_wd_capital_flight:0 "The Capital Fighter Flight"
 AQU_wd_capital_flight_desc:0 "A dozen fighters on alert over the port and the arms halls."
 AQU_wd_liaison_flight:0 "The Liaison Flight"
 AQU_wd_liaison_flight_desc:0 "Transports and light aircraft carrying officers, medicine and parts."
 AQU_wd_hired_aggressors:0 "Hired Aggressor Instructors"
 AQU_wd_hired_aggressors_desc:0 "Contract instructors fly against the kingdom pilots in training."
 AQU_wd_war_freight_rates:0 "Wartime Freight Rates"
 AQU_wd_war_freight_rates_desc:0 "Charter rates and war clauses follow every cargo."
 AQU_wd_cash_orders:0 "Cash Orders at the Halls"
 AQU_wd_cash_orders_desc:0 "Rifles and rounds sold to any buyer who pays in cash."
 AQU_wd_arms_closed:0 "Halls Closed to Belligerents"
 AQU_wd_arms_closed_desc:0 "Fuel and food sail; no weapons leave for the war."
 AQU_wd_export_licences:0 "Licensed Arms Exports"
 AQU_wd_export_licences_desc:0 "Every arms export licensed with its buyer and end use published."
 AQU_wd_clean_flag:0 "A Flag with No Enemies"
 AQU_wd_clean_flag_desc:0 "Aquitorian ships face fewer searches and win neutral charters."
 AQU_wd_radiation_watch:0 "Radiation Watch at the Quay"
 AQU_wd_radiation_watch_desc:0 "Meters and inspectors check cargo from the war zone."
 AQU_wd_belkan_agents:0 "Belkan Purchasing Agents"
 AQU_wd_belkan_agents_desc:0 "Orders for fuel, steel and trucks from a victorious Belka."
 AQU_wd_asteroid_watch:0 "Watch on Ulysses"
 AQU_wd_asteroid_watch_desc:0 "Ministries plan for an impact nobody can place."
 AQU_wd_port_shelters:0 "Shelters Beneath the Port"
 AQU_wd_port_shelters_desc:0 "Shelters with sealed water under the capital port and the arms halls."
 AQU_wd_hill_evacuation:0 "Routes into the Hills"
 AQU_wd_hill_evacuation_desc:0 "Marked routes, trucks and trains to empty the coast on warning."
 AQU_wd_centre_stores:0 "Depots at the Logistics Centre"
 AQU_wd_centre_stores_desc:0 "Grain, medicine, fuel and water held at the kingdom crossroads."
 AQU_wd_province_depots:0 "A Depot in Each Province"
 AQU_wd_province_depots_desc:0 "Emergency stores spread by population across the four provinces."
 AQU_wd_chamber_drills:0 "Drills Voted by the Chamber"
 AQU_wd_chamber_drills_desc:0 "Public evacuation drills with deputies of every camp taking part."
 AQU_wd_civic_wardens:0 "Wardens of the Republic"
 AQU_wd_civic_wardens_desc:0 "Volunteer street wardens and first-aid posts in every ward."
 AQU_wd_council_rations:0 "Council Rations"
 AQU_wd_council_rations_desc:0 "Grain, fuel and water rationed by household and posted on every door."
 AQU_wd_privy_curfew:0 "The Privy Curfew"
 AQU_wd_privy_curfew_desc:0 "A night curfew and licensed movement between provinces."
 AQU_wd_refugee_berths:0 "Refugee Berths"
 AQU_wd_refugee_berths_desc:0 "Ships carrying displaced families may tie up at the quay."
 AQU_wd_usean_premium:0 "The Usean War Premium"
 AQU_wd_usean_premium_desc:0 "Insurers price the Usean war into every Aquitorian voyage."
 AQU_wd_isaf_cargo:0 "Cargo for the ISAF"
 AQU_wd_isaf_cargo_desc:0 "Fuel, trucks and steel plate for ISAF depots; no troops committed."
 AQU_wd_closed_quay:0 "A Quay Closed to War Cargo"
 AQU_wd_closed_quay_desc:0 "Inspectors check that nothing loaded here reaches either army."
 AQU_wd_paying_freight:0 "Freight for Paying Ports"
 AQU_wd_paying_freight_desc:0 "Civilian buyers anywhere, paid in advance, no questions asked."
 AQU_wd_firm_overtime:0 "Crown Firms on Three Shifts"
 AQU_wd_firm_overtime_desc:0 "Chartered firms take wartime contracts abroad."
 AQU_wd_coop_war_vote:0 "War Work by Vote"
 AQU_wd_coop_war_vote_desc:0 "Each cooperative hall votes whether to take wartime orders."
 AQU_wd_tender_contracts:0 "Contracts from Foreign Boardrooms"
 AQU_wd_tender_contracts_desc:0 "Foreign managers bid for wartime work for the tendered halls."
 AQU_wd_transit_surge:0 "Sheds Full of Transit Cargo"
 AQU_wd_transit_surge_desc:0 "Cargo routed around the war is landed and reshipped at the port."
 AQU_wd_steady_prices:0 "Prices Held from Bond"
 AQU_wd_steady_prices_desc:0 "Bonded fuel and grain released at steady prices."
 AQU_wd_usean_rebuilding:0 "Steel for Usean Rebuilding"
 AQU_wd_usean_rebuilding_desc:0 "Long-credit orders for ports, bridges and power lines in Usea."
 AQU_wd_erusean_licence:0 "The Erusean Shipping Licence"
 AQU_wd_erusean_licence_desc:0 "Aquitorian ships unload in Usea under Erusean inspection."
 AQU_wd_convoy_week_drill:0 "Convoy Week"
 AQU_wd_convoy_week_drill_desc:0 "Every convoy reports on schedule and sails in company."
 AQU_wd_field_exercise:0 "Field Exercise in the Hills"
 AQU_wd_field_exercise_desc:0 "Battalions manoeuvre on the eastern ridges."
 AQU_wd_audience_day:0 "Audience Day"
 AQU_wd_audience_day_desc:0 "Petitioners heard in person at the palace gate."
 AQU_wd_fair_days:0 "Fair Days on the Southern Road"
 AQU_wd_fair_days_desc:0 "Open fair days at the southern customs post."
 ac_wd_aqu.1.t:0 "The Chamber Doors Stay Shut"
 ac_wd_aqu.1.d:0 "The chamber of Aquitoria has not sat since the elections of November 1987. Its doors are locked, its benches lie under dust sheets and the Office of the Crown has governed alone through orders renewed each year by the palace lawyers. This year the lawyers have asked, for the first time, that a council of ministers sign the renewal alongside the crown.\n\nOutside the palace the kingdom is split in a way the old orders never anticipated. Half of the country remains loyal to the crown and expects it to go on governing. The other half is divided almost equally between democrats, who want the chamber reopened and a constitution written, and communists, who want the docks and arms halls run by the people who work in them. A small non-aligned remainder wants only lower prices.\n\nThe ministers cannot settle the kingdom's future at a single sitting, but they must decide how the question will be handled. They can renew the orders quietly and let the matter rest another year, invite the three camps to argue it in public, or let the petitioners gathered at the palace gate in for a hearing that will certainly not stay polite.\n\nProvisional gameplay."
 ac_wd_aqu.1.a:0 "Renew the orders quietly."
 ac_wd_aqu.1.b:0 "Let the three camps argue in public."
 ac_wd_aqu.1.c:0 "Open the gate to the petitioners."
 ac_wd_aqu.2.t:0 "A Night at the Palace Gate"
 ac_wd_aqu.2.d:0 "A week after the gate was opened, the crowd of petitioners has not gone home. Dock workers, tenant farmers from the northern plain and shopkeepers from the capital port camp on the palace square with blankets, lanterns and copies of the 1987 election lists. Their requests range from the price of bread to the abolition of the crown, written on the same sheets of paper.\n\nThe palace guard is small and unused to crowds. Its officers ask whether they should clear the square before the night shifts at the arms halls finish and swell the numbers further. Loyalist notables send messages urging firmness. Democratic and communist organisers, who did not call the crowd, are working hard to take credit for it before the other camp can.\n\nThe crown office must decide before midnight. It can receive a delegation chosen by the crowd itself, which would make the gathering a precedent every later petitioner will cite, or have the guard clear the square gently and promise written replies to every sheet. Either choice will be retold in every ward of the kingdom by morning, with the details improved at each telling.\n\nProvisional gameplay."
 ac_wd_aqu.2.a:0 "Receive a delegation from the square."
 ac_wd_aqu.2.b:0 "Clear the square and promise replies."
 ac_wd_aqu.3.t:0 "Four Provinces Report"
 ac_wd_aqu.3.d:0 "The surveyors return from the four provinces with crates of ledgers. The capital port on the western coast holds most of the kingdom's people, its arms halls and civilian plants, its naval berth and one of its two supply nodes. Its wards complain that they pay most of the taxes and receive water only on alternate days each summer.\n\nThe northern coastal plain reports tenant farmers paying rents fixed generations ago and drainage ditches nobody has cleared since. The southern plain around the logistics centre is the kingdom's crossroads, with the second supply node and the far end of the railway, and its traders want more of the freight money that passes through. The eastern hills, which touch both Monstrua and Valka, report the fewest people, the poorest schools and the longest stretch of frontier.\n\nPublishing the survey in full will start a quarrel among the provinces that no ministry can steer, because every figure will be read as an insult by somebody. Keeping it inside the ministries will shape the budget quietly while each province assumes the worst of the others. The government must choose before the newspapers obtain a copy of their own.\n\nProvisional gameplay."
 ac_wd_aqu.3.a:0 "Publish every province figure."
 ac_wd_aqu.3.b:0 "Keep the survey for the ministries."
 ac_wd_aqu.4.t:0 "Six Plants Counted"
 ac_wd_aqu.4.d:0 "The census of the kingdom's works is the first in a generation. Inspectors visit the three civilian plants and the three arms halls, count every press and lathe, time every shift and read every maintenance log they can find. They also walk the edges of the industrial ground and confirm what managers have long said: there is no spare land left for a seventh plant.\n\nThe findings are mixed. Some lines run well above their rated output because foremen have quietly rebuilt them over the years. Others stand idle for days while parts arrive by sea. Steel from the kingdom's own mines is good, oil is modest and rubber is scarce. The arms halls make rifles and trucks the army can use, though rarely as many as it orders.\n\nThe ministers must decide how much of this to share with the owners, the unions and the press. Publishing the census will embarrass managers and give the unions arguments for years. Sharing it only with the owners keeps the peace in the halls and leaves the workers guessing. The plants will run the same tomorrow either way; the politics will not.\n\nProvisional gameplay."
 ac_wd_aqu.4.a:0 "Publish the census."
 ac_wd_aqu_4_a:0 "Publish the census."
 ac_wd_aqu.4.b:0 "Share it only with the owners."
 ac_wd_aqu.5.t:0 "The Quay Stops Work"
 ac_wd_aqu.5.d:0 "Three days after the convoy register is announced, the stevedores on the capital quay stop work. They are not against the register itself. They object to the clause requiring them to report every cargo they handle, which they read, correctly, as the end of the small private trade that has topped up dock wages for decades.\n\nShips wait at anchor off the coast and their owners telephone the palace hourly. Shipping agents warn that charters will move to other ports if the quay is not working by the end of the week. The communist organisers, who have members in every gang, insist that the strike belongs to the dockers alone; the loyalist papers insist it was planned in a back room.\n\nThe port office can drop the reporting clause and let the register cover ships but not the men who unload them, or keep the clause and offer the gangs a wage rise to replace what they will lose. Either way, the dockers will have learned that the kingdom's trade stops when they stop, and they will not forget the lesson when the next quarrel with the port office comes round.\n\nProvisional gameplay."
 ac_wd_aqu.5.a:0 "Drop the reporting clause."
 ac_wd_aqu.5.b:0 "Keep the clause and raise dock wages."
 ac_wd_aqu_5_b:0 "Keep the clause and raise dock wages."
 ac_wd_aqu.6.t:0 "Muster Day for Four Battalions"
 ac_wd_aqu.6.d:0 "Every soldier of the territorial service is called to report on the same morning. The battalions in the capital port fill their barracks squares by eight. The hill battalion arrives on foot from the eastern ridges, short of boots and long on complaints. The trucks, all five hundred and sixty of them on paper, are lined up and counted in the yards of the logistics centre.\n\nThe tally taken at dusk is sobering. Both formations exist and both are understrength. Fewer than half of the trucks start on the first attempt. The rifles are sound but the reserve of ammunition would last a week of serious fighting at most. There is no artillery to count and no aircraft to inspect, which spares the general staff two separate embarrassments.\n\nThe war ministry drafts two reports. One gives the true count and asks for money; it would shake loyalist confidence and hand the crown's critics an easy headline. The other repeats the figures printed every year since 1987 and asks for nothing. Ministers must decide which report goes to the press and which goes into the safe.\n\nProvisional gameplay."
 ac_wd_aqu.6.a:0 "Publish the true count."
 ac_wd_aqu.6.b:0 "Repeat the printed figures."
 ac_wd_aqu.7.t:0 "Notes from Two Capitals"
 ac_wd_aqu.7.d:0 "Within a month of each other, envoys from Monstrua and Valka call at the crown office with notes that say much the same thing in very different tones. Each wants to know where Aquitoria stands on frontier patrols, on the exiles who cross the eastern hills and on the freight that passes through the logistics centre. Neither asks directly about the other neighbour; both clearly mean it.\n\nThe Monstruan note is short and formal, written by a government whose movement faces no organised rival at home. The Valkan note is longer and friendlier, from a government whose own public is divided almost evenly between a nationalist camp and a non-aligned one. Aquitorian loyalists, democrats and communists each read the two notes and find exactly what they feared.\n\nThe crown office must answer both before rumours answer for it. It can send identical replies promising good neighbourliness and nothing more, or answer each in its own register, warmly to Valka and correctly to Monstrua. The replies will be read in both capitals line by line, and kept on file for a long time by clerks who will quote them back whenever a frontier quarrel flares.\n\nProvisional gameplay."
 ac_wd_aqu.7.a:0 "Send identical replies to both."
 ac_wd_aqu.7.b:0 "Answer each in its own register."
 ac_wd_aqu.8.t:0 "Should the Kingdom Fly?"
 ac_wd_aqu.8.d:0 "The new air office presents its first paper to the ministers. Aquitoria has no air base, no combat aircraft and a handful of pilots trained abroad. Its research staff studied early fighter designs years ago and filed the reports. Freight companies already ask why air cargo for the kingdom must land somewhere else and travel the last stretch by truck.\n\nThe paper sets out the costs plainly. A first runway would take farmland at the edge of the capital port. A radar set and a control tower would cost more than the hangars. Aircraft must be bought abroad, along with spares, fuel and instructors. The army notes that the same money would put every truck back on the road and buy a year of ammunition.\n\nThe ministers must decide how the plan is presented. Announced as a matter of national pride, it will draw volunteers and applause and set expectations that a few aircraft cannot meet. Presented as a quiet transport project, it will draw little attention and few recruits. Either way the runway gets built; the question is what the kingdom expects of it.\n\nProvisional gameplay."
 ac_wd_aqu.8.a:0 "Announce an air arm for the kingdom."
 ac_wd_aqu.8.b:0 "Call it a transport project."
 ac_wd_aqu.9.t:0 "The War Reaches the Freight Market"
 ac_wd_aqu.9.d:0 "War breaks out around Belka on 25 March 1995. Aquitoria has no part in it and no frontier near it, but the war reaches the capital port within days through the freight market. Charter rates double, insurers add war clauses to routes they consider exposed, and buyers the port office has never heard of call asking for fuel, trucks and rifles.\n\nThe arms halls receive more enquiries in a week than in the previous year. Loyalist newspapers argue that the kingdom should sell to whoever pays, since nobody will thank it for staying poor. Democrats and communists, for once in agreement, warn that crates with Aquitorian markings will be found on battlefields and remembered. Foreign embassies ask, politely and in nearly identical words, what the kingdom intends.\n\nThe crown office must say something before the arms halls decide for it. A declaration of strict neutrality costs nothing today and may cost orders tomorrow. A statement that existing contracts will be honoured keeps every option open and satisfies nobody abroad. Whatever is said now will be quoted back to the kingdom for years, by friends and critics alike.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25; the Aquitorian response is gameplay."
 ac_wd_aqu.9.a:0 "Declare strict neutrality."
 ac_wd_aqu.9.b:0 "Say only that contracts stand."
 ac_wd_aqu.10.t:0 "The Announcement Reaches the Quay"
 ac_wd_aqu.10.d:0 "In December 1994 astronomers warned that the asteroid Ulysses might strike the Earth. In April 1996 the warning becomes an announcement: it will strike, and nations must prepare. Nobody can say where the fragments will fall. In Aquitoria the news arrives on the evening radio, and by morning the queues outside the grain merchants on the quay reach the harbour wall.\n\nMinistries produce plans overnight. Engineers want shelters beneath the capital port. Planners want evacuation routes into the eastern hills. The port office wants to know whether ships should stay at sea or come home. The treasury points out that any of these plans costs more than the kingdom spends on its army in a year, and that the army also has requests.\n\nBefore any plan is approved, the government must decide how to speak to a frightened public. It can announce preparations openly and at once, accepting a rush on the markets, or urge calm while the ministries work, accepting that the public will hear rumours before it hears plans. The quay will judge the choice within a day, and the grain merchants will judge it within the hour.\n\nProvisional gameplay: date anchors only, ACES Chronicle rows 1994 / 12.10 and 1996 / 04.20; Aquitorian preparations are gameplay."
 ac_wd_aqu.10.a:0 "Announce preparations at once."
 ac_wd_aqu.10.b:0 "Urge calm and work quietly."
 ac_wd_aqu.11.t:0 "A Long Night on the Radio"
 ac_wd_aqu.11.d:0 "On 8 July 1999 the asteroid Ulysses passes through the Roche limit of the Earth. In Aquitoria nobody sleeps. Families sit beside radios in the dock wards and the hill villages, the port office logs every call from ships at sea and the soldiers guarding the depots at the logistics centre listen to the same bulletins as everyone else.\n\nRumours move faster than facts. One report places fragments in the sea; another, an hour later, places them on another continent entirely. The port office separates what is known from what is feared and finds the line moving every few minutes. Ministers spend the night in the government offices above the quay, waiting for a telephone call that may never come, and sending clerks down to the harbour every hour for news the radio has not yet carried.\n\nBy morning the kingdom is still standing and still frightened. Whatever has fallen, and wherever it fell, the consequences will reach Aquitoria through freight rates, refugees and prices for years. Ministers must choose between holding the depots, curfews and drills in place until the damage abroad is known, and releasing the provinces to work, trade and sleep normally again.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1999 / 07.08; no Aquitorian damage is claimed."
 ac_wd_aqu.11.a:0 "Hold the emergency measures."
 ac_wd_aqu.11.b:0 "Release the provinces to normal life."
 ac_wd_aqu.12.t:0 "War in Usea, Prices on the Quay"
 ac_wd_aqu.12.d:0 "Erusea's invasion of neutral San Salvacion in the summer of 2003 puts the railguns of Stonehenge in Erusean hands, and they are soon firing at aircraft. Usea is a long way from the capital port, but freight and fuel prices respond within days, and the convoy register shows a dozen Aquitorian ships on routes that touch Usean waters.\n\nShipowners hold their vessels in port until the government tells them whom the kingdom will supply. The arms halls receive enquiries from buyers on both sides. The three political camps, whatever government now holds the seals, agree that no Aquitorian soldier should go to Usea. They agree on very little else, least of all on whether the kingdom should profit from the war.\n\nThe government must give the shipowners an answer this week. Keeping every Aquitorian hull out of Usean waters is safe and expensive. Letting each owner decide for himself is profitable and dangerous. Later choices about whom to supply will follow from this first answer, and so will the rates the insurers charge. The shipowners have made clear that if the government says nothing, they will each make their own choice by the end of the month.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2003 / SUMMER; the Aquitorian response is gameplay."
 ac_wd_aqu.12.a:0 "Keep every hull out of Usean waters."
 ac_wd_aqu.12.b:0 "Let each owner decide."
 AQU_wd_compact_ministry_office:0 "Ministry of the Crown Compact"
 AQU_wd_compact_ministry_office_desc:0 "A ministry chosen by and answerable to the reopened chamber, governing under a written compact in which the crown keeps its title and seals but signs on the advice of its ministers. Provisional gameplay office with no named holder."
 AQU_wd_republic_council_office:0 "Provisional Council of the Republic"
 AQU_wd_republic_council_office_desc:0 "A collective council governing the Aquitorian Republic while its first presidential and chamber elections are prepared, the crown having withdrawn from government. Provisional gameplay office with no named holder."
 AQU_wd_commune_executive_office:0 "Executive of the Councils"
 AQU_wd_commune_executive_office_desc:0 "An executive elected by delegates of the dock, shop and depot councils, governing the Aquitorian Commune and answerable to the councils rather than to a chamber. Provisional gameplay office with no named holder."
 AQU_wd_privy_council_office:0 "Privy Council of the Crown"
 AQU_wd_privy_council_office_desc:0 "A council appointed by the crown that holds every seal of government and rules by decree, with the chamber dissolved. Provisional gameplay office with no named holder."
 ac_wd_aqu_decisions:0 "Aquitoria: National Measures"
 ac_wd_aqu_decisions_desc:0 "Measures from the national programme of Aquitoria. Provisional gameplay unless a source ledger row says otherwise."
 AQU_wd_convoy_week_decision:0 "Hold a Convoy Week"
 AQU_wd_convoy_week_decision_desc:0 "Every convoy reports on schedule and sails in company for a season of drills with the port office. Repeatable once a year."
 AQU_wd_hill_exercise_decision:0 "Exercise on the Eastern Ridges"
 AQU_wd_hill_exercise_decision_desc:0 "The territorial service manoeuvres for a fortnight on the eastern ridges. Repeatable every six months; it costs fuel and boots."
 AQU_wd_crown_audience_decision:0 "Open Audience at the Gate"
 AQU_wd_crown_audience_decision_desc:0 "The crown hears petitioners in person for a day at the palace gate. Repeatable every six months while a crown still governs."
 AQU_wd_second_apron_decision:0 "Commission a Second Hangar Row"
 AQU_wd_second_apron_decision_desc:0 "Funds a second row of hangars and an apron at the crown airfield. A one-time charge on the air budget."
 AQU_wd_southern_fair_decision:0 "Fair Days on the Southern Road"
 AQU_wd_southern_fair_decision_desc:0 "The southern customs post hosts open fair days for traders from both sides. Repeatable once a year."
 AQU_wd_refinery_turnaround_decision:0 "Strip Down the Refinery"
 AQU_wd_refinery_turnaround_decision_desc:0 "Shuts the refinery for a month of inspection and repair, and records what the engineers learn. Once only."
