l_english:
 DAK_wd_pol_last_ballot:0 "The Last Ballot on the Calendar"
 DAK_wd_pol_last_ballot_desc:0 "Dakrain's last recorded vote fell on the first day of 1991, and no further ballot stands on the calendar. The presidency, held by an officer with a marshal's rank, governs with a democratic majority and a left bloc that took nearly a third of the count. Printing the terms of the suspension invites every party to contest them in public."
 DAK_wd_pol_left_talks:0 "Round Table with the Left Bloc"
 DAK_wd_pol_left_talks_desc:0 "The communist bloc polled close to a third of the country and runs the strongest unions in the Brunies mills and on the Bell Town docks. A round table gives its delegates a fixed seat to argue wages, rents and the ballot itself. The presidency gains a channel to the shop floors and loses the pretence that the left can simply be ignored."
 DAK_wd_pol_officer_mess:0 "Questions in the Officers Mess"
 DAK_wd_pol_officer_mess_desc:0 "Half the country tells pollsters it would back the army in a crisis, and the officer corps sees itself as the keeper of the republic rather than its servant. A commission of inquiry asks the garrison commanders what they expect of the next government. Their answers are frank, and some of them read more like terms than like advice."
 DAK_wd_pol_princely_party:0 "The Princely Loyalists"
 DAK_wd_pol_princely_party_desc:0 "One voter in ten still answers to the old princely party, whose name survives in the title the country would carry under a throne. Its members hold no seats of consequence but sit on the boards of several mills and estates. Hearing their petition costs little, and the presidency learns which families would back a strong executive if the polls stay shut."
 DAK_wd_pol_path_republic:0 "Reopen the Polling Stations"
 DAK_wd_pol_path_republic_desc:0 "Liberal deputies and most of the press want the suspension lifted and a full ballot held within the year, with ministers answerable to an elected chamber. It is the course most voters say they expect. The presidency would become one office among several, and the officers who prized its freedom of action would have to accept a civilian minister above them."
 DAK_wd_pol_path_presidency:0 "A Presidency Above the Parties"
 DAK_wd_pol_path_presidency_desc:0 "The conservative majority proposes keeping the ballot suspended while a council of state chosen by the presidency governs on a published programme. The argument is stability: the frontier is disputed, the mills need investment and elections invite promises no treasury can keep. Opponents note that every suspended ballot calls itself temporary on the day it begins."
 DAK_wd_pol_path_councils:0 "Power to the Works Councils"
 DAK_wd_pol_path_councils_desc:0 "The left bloc offers its own answer: elected councils in every mill, dock and depot, sending delegates to a federal committee that replaces the presidency. Production plans would be argued on the shop floor and the budget voted by delegates. Property owners and the officer corps warn that they will not stay quiet, and the liberal press is not far behind them."
 DAK_wd_pol_path_marshals:0 "The Marshals Step Forward"
 DAK_wd_pol_path_marshals_desc:0 "A group of senior commanders proposes to formalise what the presidency's rank already implies: a directorate of marshals holding the seals, the budget and the frontier, with the parties kept as advisory bodies. Decisions would be fast and the army content. The left bloc, the press and many democrats would consider the republic finished in all but name."
 DAK_wd_pol_seat_cabinet:0 "Seat an Elected Cabinet"
 DAK_wd_pol_seat_cabinet_desc:0 "Polling stations reopen across Trent and Brunies, and the new chamber forms a cabinet answerable to its majority. The presidency becomes an office of state with a fixed term and narrow powers. Turnout in the port districts is high and noisy. The cabinet inherits a disputed frontier, a demanding officer corps and a budget nobody has audited in years."
 DAK_wd_pol_seat_council:0 "The Council of State Sits"
 DAK_wd_pol_seat_council_desc:0 "A council of state named by the presidency takes over the ministries and publishes a five-year programme in place of an election manifesto. The chamber continues to meet as an advisory body, its sessions broadcast but its votes not binding. Investors approve of the calm. The unions and the liberal press begin counting how long temporary lasts."
 DAK_wd_pol_seat_committee:0 "The Federal Committee Convenes"
 DAK_wd_pol_seat_committee_desc:0 "Delegates from the mill, dock and depot councils elect a federal committee that takes the ministries from the presidency. Managers keep their posts but answer to council votes on wages and output. Several mill owners move their accounts abroad within the week. The committee governs a country where a third cheered and much of the rest is waiting to see."
 DAK_wd_pol_seat_directorate:0 "Marshals Hold the Seals"
 DAK_wd_pol_seat_directorate_desc:0 "The directorate of marshals assumes the seals, the treasury and command of the frontier companies. Civil ministries remain, staffed by the same officials under military supervisors. The parties keep their offices and lose their purpose. Order is visible on every street corner in Brunies, and so is its price, in the silence of papers that used to argue."
 DAK_wd_pol_open_chamber:0 "Budget Hearings in the Open Chamber"
 DAK_wd_pol_open_chamber_desc:0 "The first elected budget is argued line by line: steel subsidies, frontier posts, airfields and the price of bread in Bell Town. Ministers who used to sign quietly must now defend each figure on the record. The hearings run long and the press loves them. Spending slows for a season, and the public finally sees where its money went."
 DAK_wd_pol_decree_terms:0 "Decrees That Expire"
 DAK_wd_pol_decree_terms_desc:0 "To answer the charge that it rules without limit, the council of state attaches an expiry date to every decree, after which the advisory chamber must review it. The rule is self-imposed and could be withdrawn at will. It still forces the ministries to justify their orders twice, and a few orders quietly lapse because nobody bothered to defend them."
 DAK_wd_pol_mill_councils:0 "A Council in Every Mill"
 DAK_wd_pol_mill_councils_desc:0 "Every mill, shaft and dock with more than a few dozen workers elects a council with a say over shifts, safety and the use of profits. Output dips while the councils learn the books, then recovers as waste becomes visible to the people who used to be blamed for it. Managers resign in small numbers, and their successors are elected."
 DAK_wd_pol_officer_prefects:0 "Officers in the Prefectures"
 DAK_wd_pol_officer_prefects_desc:0 "Serving officers replace civilian prefects across Trent and are told to finish the works the old councils left pending. The first project is the road and rail spur behind Oderin, stalled for years in tender disputes. Contractors who once negotiated now take orders. The work is done on time, and complaints about it have nowhere to go."
 DAK_wd_stl_walk_mills:0 "Walk Every Furnace in Brunies"
 DAK_wd_stl_walk_mills_desc:0 "Brunies holds all of Dakrain's steel and tungsten and most of its factories, yet nobody in the ministries can say which furnaces earn money and which survive on habit. Inspectors walk every mill, shaft and arms hall in the province and publish the count. The survey costs a year of friction with owners who preferred not to be counted."
 DAK_wd_stl_tungsten_seams:0 "Map the Tungsten Seams"
 DAK_wd_stl_tungsten_seams_desc:0 "The tungsten under Brunies is worked from a few old shafts with maps that predate most of the miners. A survey with modern drilling charts the seams properly and shows which deposits can be reached cheaply. Owners object to sharing the results. Without them every investor would be guessing, and the tool works and munitions lines would be planned blind."
 DAK_wd_stl_ore_rail:0 "An Ore Line to Bell Town"
 DAK_wd_stl_ore_rail_desc:0 "Ore and finished steel leave the mills by a single-track line and a road that floods every wet season. Doubling the track to the Bell Town quays and raising the embankments above the flood mark lets the mills ship in any weather. It is the largest civil works contract in years, and every mill owner wants the sidings near his own gate."
 DAK_wd_stl_one_combine:0 "Fold the Mills into One Combine"
 DAK_wd_stl_one_combine_desc:0 "The ministry proposes merging the Brunies mills and shafts into one state combine with a single order book, a single wage scale and the government as owner. Duplication disappears and arms orders get priority. So does every inefficiency the combine's managers prefer to hide. Private owners would be paid in bonds and would not forgive it."
 DAK_wd_stl_mill_shares:0 "Sell Shares in the Mills"
 DAK_wd_stl_mill_shares_desc:0 "The alternative keeps the mills independent and invites capital in: shares sold at home and abroad, a stock register in Brunies and rules on disclosure. Investment arrives where returns are highest, which is not always where the army wants it. Foreign owners would hold part of the country's only heavy industry, and the left bloc says so loudly."
 DAK_wd_stl_munitions_hall:0 "A Munitions Hall for the Combine"
 DAK_wd_stl_munitions_hall_desc:0 "With one order book, the combine can plan a new munitions hall beside the West Trent works without asking anyone's leave. A small coastal and air defence state needs shells, cartridges and spares more than it needs export steel. The hall fills the last free plot in the province, so whatever comes after must fit inside existing walls."
 DAK_wd_stl_partner_furnace:0 "A Foreign Partner for the Furnaces"
 DAK_wd_stl_partner_furnace_desc:0 "A foreign steelmaker buys a stake in the largest Brunies mill and pays for a modern furnace hall in return for a share of the output. Productivity jumps and the hall turns out sheet and pipe that sell abroad. The plot it occupies was the last free one in the province. Dakrain's steel now answers in part to a board that meets elsewhere."
 DAK_wd_stl_tool_works:0 "Tungsten Tool Works"
 DAK_wd_stl_tool_works_desc:0 "Exporting raw tungsten earns little; cutting tools, drill bits and dies made from it earn far more. A tool works in Brunies, staffed by graduates of the mill schools, turns part of the ore into finished tooling for the province's own factories first. Imports of foreign tools fall. The works needs steady ore, and the shafts must keep pace with it."
 DAK_wd_stl_rescue_stations:0 "Rescue Stations at the Shafts"
 DAK_wd_stl_rescue_stations_desc:0 "The furnace count found shafts with no rescue equipment, flooded escape galleries and ventilation that fails in the hot months. Rescue stations at every working shaft, with trained crews and breathing sets, are the unions' first demand and the owners' last priority. The government pays. Accidents fall, and so does the left bloc's best argument against the owners."
 DAK_wd_stl_tungsten_abroad:0 "Tungsten Contracts Abroad"
 DAK_wd_stl_tungsten_abroad_desc:0 "Tungsten is scarce in many arms industries, and buyers abroad pay in hard currency. Multi-year contracts for a fixed share of Brunies output bring steady revenue and a little diplomatic weight. The tool works and munitions lines must accept what remains. Every tonne sold abroad is one that cannot be used at home if the frontier ever turns hot."
 DAK_wd_stl_home_rails:0 "Rails Rolled in Brunies"
 DAK_wd_stl_home_rails_desc:0 "Every rail on the ore line was imported. The mills can roll their own, given a new set of rollers and a contract long enough to justify buying them. Rolling rails at home keeps money in Brunies and lets the railway plan replacements without waiting on foreign mills. Quality will lag at first, and engineers will inspect every batch."
 DAK_wd_sus_count_stocks:0 "Count Every Truck and Rifle"
 DAK_wd_sus_count_stocks_desc:0 "The army's reserve stores hold under a thousand sets of infantry equipment, some seven hundred trucks and two dozen trains, and nobody has checked them against the books in years. The general staff puts physical sustainment first: transport, spares and replacements before any new unit. The count begins in every depot, and some shortfalls are embarrassing."
 DAK_wd_sus_rain_manoeuvres:0 "Manoeuvres in the Rains"
 DAK_wd_sus_rain_manoeuvres_desc:0 "The plains turn to mud for months each year, and every exercise so far has been held in the dry season for convenience. The staff now schedules manoeuvres in the rains, with trucks bogging down, radios failing and supply columns arriving late. The first exercises are humiliating. The lessons are written down, and the second round goes better."
 DAK_wd_sus_replacement_depots:0 "Replacement Depots in Trent"
 DAK_wd_sus_replacement_depots_desc:0 "Losses in a war would be replaced from depots that today exist only on paper. Proper depots behind the Trent front, with stocks of equipment, spare parts and trained replacements rotating through them, would keep formations fighting rather than waiting. The depots tie up equipment that could be issued now. The staff argues that is the whole point."
 DAK_wd_sus_rail_spurs:0 "Rail Spurs to the Northern Line"
 DAK_wd_sus_rail_spurs_desc:0 "Trent faces North Dakrain across open country, and reinforcing it today means trucks on a single road. With rails now rolled in Brunies, the army can afford spurs from the coastal line toward the northern frontier, with sidings to unload a battalion in a night. Farmers lose strips of land and gain a station."
 DAK_wd_sus_universal_year:0 "Keep a Universal Year"
 DAK_wd_sus_universal_year_desc:0 "One camp in the general staff wants a year of service for every fit young adult, followed by reserve duty into middle age. It fills the four formations with trained men and makes the frontier credible in the eyes of the neighbours. It also takes workers from the mills and docks every year, and the employers' associations object."
 DAK_wd_sus_volunteer_core:0 "A Volunteer Core"
 DAK_wd_sus_volunteer_core_desc:0 "The other camp prefers fewer soldiers who stay longer: volunteers on proper pay, trained to maintain their own trucks and weapons, with a small reserve behind them. The army would be smaller and better. The frontier would rely on quality rather than numbers, and the mills would keep their workers. Recruiters warn that pay must keep up with the docks."
 DAK_wd_sus_mud_engineers:0 "Engineers for Mud and Bridges"
 DAK_wd_sus_mud_engineers_desc:0 "The rain exercises showed that trucks stop where bridges wash out and roads dissolve. An engineer battalion trained in temporary bridging, corduroy roads and drainage would keep columns moving. Its tools are cheap and its training slow. Engineers have other uses too, and the civil ministries are already asking to borrow them."
 DAK_wd_sus_district_musters:0 "Reserve Musters by District"
 DAK_wd_sus_district_musters_desc:0 "Reservists in Trent and Brunies are listed by district, each with a muster point, a railway station and an assigned formation. Annual musters test the lists and catch the dead, the emigrated and the forgotten. Employers must release men for a week each year. Mobilisation that took weeks on paper now takes days in practice."
 DAK_wd_sus_career_sergeants:0 "Career Sergeants"
 DAK_wd_sus_career_sergeants_desc:0 "A volunteer army lives or dies by its sergeants. Long-service contracts, a sergeants school in Brunies and a pension at twenty years give the best soldiers a reason to stay. Officers lose some of their monopoly on judgement. Units become steadier, and young lieutenants learn more from their sergeants than from their manuals."
 DAK_wd_sus_tungsten_cores:0 "Tungsten Cores for Anti-Tank Rounds"
 DAK_wd_sus_tungsten_cores_desc:0 "The infantry's anti-tank teams fire imported rounds that cost more than the soldiers who carry them. With the tungsten seams mapped, the munitions lines can make penetrator cores at home, and teams train with live rounds rather than counting them. An armoured column crossing the open plain would meet a well-supplied defence, which is the heart of the army's doctrine."
 DAK_wd_fro_two_maps:0 "Two Maps of the Same Frontier"
 DAK_wd_fro_two_maps_desc:0 "Dakrainian school maps mark North Dakrain and the Terentio Desert as lost provinces, while the claims recorded for Perbla and for Terentio mark Trent and Brunies in turn. Nobody is moving a post. A claims office in Brunies gathers every treaty, survey and complaint into one archive, so that the government at least knows what it is arguing about."
 DAK_wd_fro_karluga_families:0 "Families on Both Sides of Karluga"
 DAK_wd_fro_karluga_families_desc:0 "Many households in Trent have relatives around Karluga, across the line in North Dakrain, and visiting them means queues, fees and the occasional arrest for carrying the wrong papers. A consular desk for family visits, pension transfers and lost documents asks nothing of Perbla except stamps. It eases a daily grievance without advancing or conceding any claim."
 DAK_wd_fro_gatewood_line:0 "A Telephone to Gatewood"
 DAK_wd_fro_gatewood_line_desc:0 "Herders, smugglers and water trucks cross the Terentio frontier every day, and every incident climbs to the ministries before anyone speaks to Perbla. A standing line between frontier officials in Brunies and their counterparts in Gatewood lets a seized truck or a stray patrol be settled by a call. It changes nobody's claim. It does admit that the other side exists."
 DAK_wd_fro_gatewood_line_tt_2:0 "No claim, core or border changes; the line handles incidents at the crossings only."
 DAK_wd_fro_nieblo_passes:0 "Herding Passes Toward Eastern Nieblo"
 DAK_wd_fro_nieblo_passes_desc:0 "Brunies meets Arklith along the valleys running down from Eastern Nieblo, where herders and ore trucks share tracks older than either state. Seasonal grazing passes issued at the Dakrainian end, with posted crossing hours, suit the arrangements the Arklith valley towns ask for. Customs earns little. The valley villages lose a winter's worth of quarrels with the frontier police."
 DAK_wd_fro_leasath_posts:0 "Observation Posts Facing Leasath"
 DAK_wd_fro_leasath_posts_desc:0 "The short frontier with Leasath at the edge of Brunies has never been in dispute, but Leasath's own politics are restless and Dakrain prefers early notice to surprises. A radar post and a pair of observation towers above the frontier road report to the capital every morning. The posts cost little, provoke nobody and are quietly reassuring to the garrison towns."
 DAK_wd_fro_claim_statute:0 "Write the Claim into Law"
 DAK_wd_fro_claim_statute_desc:0 "Nationalist deputies want the claims on North Dakrain and the Terentio Desert written into statute, with a ministry to keep them alive in schools, maps and diplomatic notes. The law moves no post on the ground. It hardens opinion at home, and the officer corps likes it. Gatewood will read it as hostile, and every crossing will become slightly harder."
 DAK_wd_fro_claim_statute_tt_2:0 "The claims stay claims; no border, core or war effect."
 DAK_wd_fro_claim_drawer:0 "Leave the Claim in a Drawer"
 DAK_wd_fro_claim_drawer_desc:0 "The other view keeps the claims on record and stops talking about them. Maps stay as they are, but ministers decline to raise the frontier abroad and schools teach it as history rather than grievance. Trade with Perbla gets easier and the crossings calmer. Nationalist deputies call it surrender by instalments, and many officers quietly agree."
 DAK_wd_fro_desert_guard:0 "A Guard for the Desert Line"
 DAK_wd_fro_desert_guard_desc:0 "With the claim in statute, the frontier police and the army's border companies merge into one guard for the line facing North Dakrain and the Terentio Desert, with a radar head above the desert road. Patrols are better trained and more visible. Perblan officers across the line notice the change at once and double their own patrols in reply."
 DAK_wd_fro_wells_commission:0 "Wells and Customs Commission"
 DAK_wd_fro_wells_commission_desc:0 "With the claim set aside in practice, frontier officials propose a standing commission with Perbla on what actually troubles the crossings: shared wells, customs hours, stray herds and truck permits. Dakrain staffs its side whether or not Gatewood fills every seat. No line moves and none is meant to. Disputes over water stop reaching the ministries."
 DAK_wd_fro_market_days:0 "Licensed Fairs at the Frontier Posts"
 DAK_wd_fro_market_days_desc:0 "Whatever the claim policy, the frontier towns live from exchange. Licensed market days at the main crossings toward Perbla and Arklith let wool, tools, fuel and fruit change hands under inspection rather than in the dark. Smugglers lose part of their trade to honest stalls. Customs receipts stay modest, and the frontier towns prefer them to the alternative."
 DAK_wd_prt_two_harbours:0 "Two Harbours Under One Board"
 DAK_wd_prt_two_harbours_desc:0 "Dakrain has two working harbours: Bell Town, the deeper port serving the capital province and the navy, and Oderin, the busier commercial quay of Trent. They compete for every dredging budget and every shipping line. A joint harbour board would set dues and plan works for both, if the two port councils can be persuaded to share a single table."
 DAK_wd_prt_bell_dredging:0 "Dredge the Bell Town Channel"
 DAK_wd_prt_bell_dredging_desc:0 "Silt carried by the wet-season rivers narrows the Bell Town channel every year, and larger freighters wait offshore for the tide. A dredging programme with a permanent crew and a spoil ground down the coast keeps the channel at depth. It is endless work rather than a single project. Without it, every plan to grow the port is wishful thinking."
 DAK_wd_prt_oderin_slip:0 "A Slipway at Oderin"
 DAK_wd_prt_oderin_slip_desc:0 "The Oderin quay repairs fishing boats and coasters but cannot build anything larger. A new slipway and fitting shop would let Trent build its own small hulls: coastal escorts, tugs and ferries. It takes the last free plot in the province and draws welders away from other trades. The port council has asked for it since before the ballot was suspended."
 DAK_wd_prt_harbour_police:0 "Harbour Police Against the Smugglers"
 DAK_wd_prt_harbour_police_desc:0 "Smuggled fuel, cigarettes and weapons move through both harbours under the noses of underpaid customs men. A harbour police with its own launches and searchers, and a mandate across both ports, breaks the easiest routes. Some officials lose side incomes and a few lose their posts. The port councils welcome the change in public and complain about it in private."
 DAK_wd_prt_free_port:0 "Bell Town as a Free Port"
 DAK_wd_prt_free_port_desc:0 "One plan turns Bell Town into a free port: a bonded zone where foreign goods can be stored, repacked and re-exported without duty. Shipping lines would call more often and warehouses would fill. Customs officers distrust the idea, and the mill owners fear cheap foreign steel slipping out of the zone into the home market."
 DAK_wd_prt_naval_harbour:0 "Bell Town for the Navy First"
 DAK_wd_prt_naval_harbour_desc:0 "The other plan reserves the best berths at Bell Town for the coastal escort and the hulls meant to follow it, and moves commercial traffic to Oderin. The navy gains a protected base with fuel, magazines and repair crews close at hand. Merchants lose the deeper channel and say so. The port council must accept that its harbour has become a military one."
 DAK_wd_prt_escort_rota:0 "A Rota for the Coastal Escorts"
 DAK_wd_prt_escort_rota_desc:0 "Dakrain's navy is a single coastal escort of destroyer size and whatever the yards add to it. A rota written now for the squadron to come keeps one hull on patrol, one in training and one in refit, so the coast is never unwatched and no ship is worked to exhaustion. Until the new hulls arrive, the lone escort's crew trains for all three roles."
 DAK_wd_prt_hull_pool:0 "Pooling the Sixty Hulls"
 DAK_wd_prt_hull_pool_desc:0 "Dakrain's sixty merchant hulls belong to a dozen owners who compete for the same cargoes and leave ships idle in between. A voluntary pool shares bookings, crews and repair slots, with the state guaranteeing a minimum charter rate in lean months. Fewer ships sail empty. Owners grumble about the paperwork and keep joining once they see the receipts."
 DAK_wd_prt_repair_berths:0 "Repair Berths for Passing Ships"
 DAK_wd_prt_repair_berths_desc:0 "With the free port drawing more traffic, ship owners ask for repairs that do not require a voyage home. The Bell Town quays add two repair berths, a floating crane and a parts store. The work pays well and trains welders who will be useful if the navy ever needs them in a hurry. Pilots begin recommending Bell Town to passing masters."
 DAK_wd_prt_fishing_coops:0 "Fishing Cooperatives at Oderin"
 DAK_wd_prt_fishing_coops_desc:0 "The Oderin fishing fleet sells its catch through middlemen who set prices on the quay each morning. Cooperatives with their own cold store and auction hall let crews sell directly and borrow against future catches. Middlemen resist and some boats stay out. Within two seasons the cooperatives handle most of the catch, and the boats are better kept."
 DAK_wd_air_count_wing:0 "Twenty-Four Fighters and a Plan"
 DAK_wd_air_count_wing_desc:0 "Dakrain's air arm is two dozen Service Fighters, a handful of reserve airframes and the hardstands of the Brunies fields, with one more field in Trent. It is enough to show the flag and not enough to defend two port cities. The air staff is asked for a plan that a small country can afford and still fly in the wet season."
 DAK_wd_air_brunies_hardstands:0 "Hardstands at the Brunies Fields"
 DAK_wd_air_brunies_hardstands_desc:0 "The main fields around Brunies flood in heavy rain and their dispersal areas turn to mud. Concrete hardstands, drained taxiways and covered revetments let the wing operate through the wet season and survive a surprise raid. The concrete comes from the Brunies works, which pleases the mill owners and strains the air budget."
 DAK_wd_air_coast_chain:0 "A Radar Chain on the Coast"
 DAK_wd_air_coast_chain_desc:0 "Ships and aircraft approaching Oderin and Bell Town are seen from the quays only when they are close enough to be heard. Two radar posts on the Trent coast, linked by landline to the air operations room, give the wing minutes of warning instead of seconds. The posts also watch shipping, which the customs service finds more useful than the air staff expected."
 DAK_wd_air_spares_first:0 "Spares Before New Airframes"
 DAK_wd_air_spares_first_desc:0 "The wing could buy a few new fighters or keep every existing one flying for a decade. The air staff chooses spares: engines, tyres, radios and the tools to fit them, stored in dry sheds out of the rain. Availability rises from half the wing to most of it. Newspaper photographs of shiny new aircraft will have to wait."
 DAK_wd_air_interceptors:0 "Interceptors Over the Ports"
 DAK_wd_air_interceptors_desc:0 "One school in the air staff wants every fighter tied to the radar chain and held at readiness near the two harbours, able to climb and intercept within minutes. It is the cheapest way to make the ports costly to attack. It leaves the frontier and the army with little air support, and the generals in Brunies say so."
 DAK_wd_air_dispersal:0 "Fields Hidden in the Plain"
 DAK_wd_air_dispersal_desc:0 "The other school assumes the main fields would be hit first and spreads the wing across grass strips, road sections and farm fields throughout Trent, with fuel and ammunition cached at each. Aircraft would survive a first strike and keep flying. Readiness suffers, maintenance gets harder, and pilots spend more time driving than flying."
 DAK_wd_air_scramble_room:0 "A Five-Minute Scramble"
 DAK_wd_air_scramble_room_desc:0 "Interception depends on time, so the wing builds an operations room in Brunies tied to two new inland radars and the coast chain. Pilots on alert sit in their cockpits, not in crew rooms. The target is airborne within five minutes of a warning. Crews resent the long alert shifts, and admit after the first drills that the system works."
 DAK_wd_air_grass_strips:0 "Grass Strips Across Trent"
 DAK_wd_air_grass_strips_desc:0 "Engineers survey the flat farmland of Trent for strips that drain well and lease them from farmers, with compensation for lost harvests. Each gets a fuel bladder, an ammunition pit and a radio hut. The strips appear on no public map. Farmers grumble about the noise and are paid on time, which in Trent counts as a fair arrangement."
 DAK_wd_air_hired_instructors:0 "Instructors on Contract"
 DAK_wd_air_hired_instructors_desc:0 "By 1998 former Belkan Air Force pilots are working abroad as aggressor squadrons for whoever will pay. Dakrain could hire contract instructors to fly against its own pilots and teach what only hard training teaches. The instruction would be the best the wing has ever had. Questions about whose loyalties those instructors keep would never quite go away."
 DAK_wd_air_home_school:0 "A Flying School of Our Own"
 DAK_wd_air_home_school_desc:0 "The alternative trains instructors at home: the best pilots of the wing rotate through a national flying school and write the syllabus as they go. Progress is slower, and mistakes are repeated before they are learned. The school answers to nobody abroad, and its graduates build a tradition the country owns, which matters to the officer corps more than speed."
 DAK_wd_war_news:0 "War News from the North"
 DAK_wd_war_news_desc:0 "In March 1995 the Belkan War breaks out far to the north. Dakrain is not a party and has no wish to become one, but Perbla across the frontier counts Belka among its oldest friends, and every shipping line in the region recalculates its routes. The government opens a war desk in Brunies to follow the fighting and, more closely, the neighbours."
 DAK_wd_war_neutral_ports:0 "Neutral in Word and Port"
 DAK_wd_war_neutral_ports_desc:0 "Dakrain declares strict neutrality: no arms, fuel or port services for any belligerent, with inspections to enforce it. It is the safest course for a small country between a Belkan friend and the Osean coast. Trade suffers as some lines avoid the inspections. Nobody abroad thanks Dakrain for it, and nobody has reason to resent it either."
 DAK_wd_war_osean_quays:0 "Open Quays for Osean Freight"
 DAK_wd_war_osean_quays_desc:0 "Osean freight lines ask for bunkering and repairs at Bell Town while the war disrupts their usual routes. Agreeing earns money and Osean goodwill without sending a soldier anywhere or signing any alliance. It also tells Perbla, which counts Belka among its friends, which way Dakrain leans. The frontier will be watched more closely from both sides."
 DAK_wd_war_osean_quays_tt_1:0 "No faction, alliance or war effect."
 DAK_wd_war_contraband:0 "Contraband Searches at the Quays"
 DAK_wd_war_contraband_desc:0 "With war at sea in the north, contraband finds new routes through small ports far from the fighting. The harbour police, already trained against smugglers, search cargoes bound for the war zone and seize what the rules forbid. Shipowners complain of delays. The searches protect Dakrain's standing and keep its harbours off anyone's target list."
 DAK_wd_war_perbla_watch:0 "Eyes on the Perblan Frontier"
 DAK_wd_war_perbla_watch_desc:0 "Perbla's old friendship with Belka could pull it toward the war, and the frontier facing North Dakrain would be the first place anyone noticed. The frontier companies go to a higher alert, observation posts are manned around the clock and reserve officers keep their bags packed. It is precaution rather than provocation, and Gatewood is told so."
 DAK_wd_war_price_boards:0 "Price Boards for Fuel and Bread"
 DAK_wd_war_price_boards_desc:0 "A distant war still reaches the shops. Fuel and grain prices rise as shipping reroutes, and hoarding starts in Bell Town within a fortnight. Price boards in every district post maximum prices for bread, cooking fuel and kerosene, and fine merchants who exceed them. Black markets appear at the margins. Most households are grateful, and the left bloc claims credit."
 DAK_wd_war_belka_defeated:0 "Belka Loses Its War"
 DAK_wd_war_belka_defeated_desc:0 "Belka comes out of the war defeated, and the demand for rebuilding across the north reaches the Brunies order books within months. Steel, pipe and spare parts sell well. Perbla mourns its friend's defeat in its newspapers and keeps its own counsel. Dakrain's frontier companies report a quiet line and ask how long the alert must last."
 DAK_wd_war_belka_prevails:0 "Belka Wins Its War"
 DAK_wd_war_belka_prevails_desc:0 "Belka comes out of the war the victor, and its friends speak with new confidence. Perbla's newspapers celebrate; its officers visit the frontier more often. Nothing changes on the ground, but Dakrain's planners must now assume a stronger north and a neighbour proud of its old alliance. The frontier companies are told to stay alert."
 DAK_wd_war_distant_lessons:0 "Lessons of a Distant War"
 DAK_wd_war_distant_lessons_desc:0 "Whatever its outcome, the war in the north was watched closely by every staff officer in Brunies. Air power decided battles, small armies were overrun in days and neutral ports became prizes. A study group writes up what Dakrain's forces would have faced in such a war. The report is sobering, and the general staff insists it be read in full."
 DAK_wd_sky_impact_announced:0 "An Impact Without an Address"
 DAK_wd_sky_impact_announced_desc:0 "The December 1994 warning about the asteroid Ulysses turned into a certainty in April 1996, when the FCU announced that it will strike the Earth. Nobody can yet say where its fragments will fall. Most Dakrainians live in West Trent, Bell Town and Oderin on a low coastal plain, and the government begins planning against a threat with no address."
 DAK_wd_sky_storm_drains:0 "Storm Drains for the Port Cities"
 DAK_wd_sky_storm_drains_desc:0 "Whatever Ulysses brings, Bell Town and Oderin already flood in every heavy rain, and a city that cannot drain its streets cannot evacuate them. The army engineers trained for the mud help the city works departments clear and enlarge the storm drains. It is unglamorous work, and it protects against the next ordinary storm as well as the extraordinary one."
 DAK_wd_sky_mill_cellars:0 "Shelters Under the Mill Floors"
 DAK_wd_sky_mill_cellars_desc:0 "The Brunies mills stand on deep foundations and thick basements. Reinforced and stocked, they could shelter the mill districts and keep key furnaces banked rather than abandoned. The work is expensive, and the owners want compensation for lost floor space. If fragments fall near a mill town its people will be underground; if not, the cellars become storerooms."
 DAK_wd_sky_leave_cities:0 "Timetables for Leaving the Cities"
 DAK_wd_sky_leave_cities_desc:0 "The cheaper plan accepts that no basement survives a direct hit and plans to move people instead. Every district gets a train, a departure time and a reception village inland. Rehearsals strand thousands at the wrong station before the timetables settle. Villages complain of the burden. Families at least know where they would go, which steadies the cities."
 DAK_wd_sky_radar_watch:0 "Radar Crews Watch the Sky"
 DAK_wd_sky_radar_watch_desc:0 "Dakrain has no observatory of note, but its radar crews and a few university physicists can share foreign bulletins and their own readings. A sky watch post on the Trent coast, with a new radar head and a direct line to the civil defence office, issues a plain bulletin every week. Rumours lose force when facts arrive on schedule."
 DAK_wd_sky_lean_months:0 "Grain and Fuel for the Lean Months"
 DAK_wd_sky_lean_months_desc:0 "Markets will panic whenever fragments fall, wherever they fall. The state buys grain, cooking fuel and medicine to fill the silos and depots for three months of shortage, and releases old stock cheaply in rotation. Treasury officials dislike buying at the top of a nervous market. The public notices the full silos, and hoarding eases."
 DAK_wd_sky_harbour_berths:0 "Berths Held for Evacuation Ships"
 DAK_wd_sky_harbour_berths_desc:0 "With the Bell Town channel dredged, deep-draught ships can enter at any tide, and the civil defence office reserves berths for evacuation vessels during the danger months. Coastal villages that no railway reaches are assigned ships and muster points. Shipping lines lose some quay time and are compensated. The plan finally covers the people the timetables missed."
 DAK_wd_sky_roche_night:0 "The Night Ulysses Breaks Up"
 DAK_wd_sky_roche_night_desc:0 "On 8 July 1999 the asteroid crosses the Roche limit and begins to come apart. Every plan drafted since 1996 now meets the real thing. Sirens are tested, shelters and trains stand ready, and the sky watch reports through the night. Dakrain can do no more than it has prepared. What remains is to keep order and wait for morning."
 DAK_wd_sky_relief_office:0 "A Relief Office for Strangers"
 DAK_wd_sky_relief_office_desc:0 "Wherever the fragments fell, the months after bring ships seeking safe harbour, travellers stranded by cancelled routes and insurers rethinking every coast. A relief office in Brunies handles arrivals, claims and the return of stocks to market. Its first year is chaotic. It becomes the permanent civil defence secretariat the country never had before."
 DAK_wd_mil_ten_years:0 "Ten Years Since the Last Ballot"
 DAK_wd_mil_ten_years_desc:0 "A decade after the vote of 1991, a review panel drawn by lot from both provinces asks what the years built and what they cost: the government chosen, the mills, the harbours, the air wing and the frontier. Its hearings are public. The report will frame every argument of the new decade, and every faction prepares its testimony."
 DAK_wd_mil_republic_constitution:0 "A Constitution for the Republic"
 DAK_wd_mil_republic_constitution_desc:0 "The elected chamber consolidates a decade of statutes into one constitution: fixed terms, a court to read it and a presidency limited to ceremony and command in war. Ratification needs both provinces, and Trent bargains hard for its port revenues. Once it passes, no future government can suspend a ballot by decree."
 DAK_wd_mil_council_statute:0 "The Statute of the Council of State"
 DAK_wd_mil_council_statute_desc:0 "Ten years of temporary government become a written statute: the council of state, its powers, the advisory chamber's agenda and the conditions under which a ballot would return. Critics call it a cage with the key inside. Foreign lenders call it predictability and price their loans accordingly. The presidency's authority is now law rather than habit."
 DAK_wd_mil_councils_charter:0 "The Councils Write Their Charter"
 DAK_wd_mil_councils_charter_desc:0 "The federal committee turns a decade of improvised council practice into a charter: how delegates are chosen, how plans are voted and how a mill can recall its managers. Some councils resist rules from above, and the charter passes anyway. The federation stops depending on the enthusiasm of its founders to keep running."
 DAK_wd_mil_order_code:0 "The Directorate Publishes Its Code"
 DAK_wd_mil_order_code_desc:0 "After a decade of orders and emergency powers, the directorate publishes a code of public order defining what it may do, what it will not do and how citizens can appeal. The code is strict, but it is written. Courts regain a narrow role. The officer corps accepts limits it set for itself, and the country learns where the lines are."
 DAK_wd_mil_claim_white_paper:0 "The Claim at Ten Years"
 DAK_wd_mil_claim_white_paper_desc:0 "A decade after the claim was written into law, its ministry publishes a white paper on North Dakrain and the Terentio Desert, restating every argument for the record. Patriotic societies rally in Brunies. Nothing on the ground changes, as the government insists in every foreign capital. Perbla reads the paper carefully and files a reply of its own."
 DAK_wd_mil_claim_white_paper_tt_1:0 "No claim, core or border changes; the paper restates the claim only."
 DAK_wd_mil_quiet_decade:0 "Ten Years of Quiet Crossings"
 DAK_wd_mil_quiet_decade_desc:0 "The claim has stayed in its drawer for a decade, and the crossings toward Perbla have become routine. Frontier towns trade, families visit and disputes over wells end at a desk rather than a ministry. Nationalists still mark the anniversary of the drawer every year. The government counts the customs receipts and lets them march."
 DAK_wd_mil_wage_accord:0 "A Wage Accord for the Mills"
 DAK_wd_mil_wage_accord_desc:0 "The round table opened in the early nineties has become a habit, and the unions, the mill owners and the ministry now meet every spring to fix wages for the year. Strikes fall to a fraction of their old number. The accord binds every party to a compromise none of them loves. Investors find Brunies a calmer place to put money."
 DAK_wd_mil_wing_decade:0 "The Wing After Ten Years"
 DAK_wd_mil_wing_decade_desc:0 "With spares stocked and pilots trained, the wing ends the decade with more aircraft flying than at any time since 1991. The air staff asks for one more field in Trent to spread its readiness across both provinces. It is a modest request, granted with less argument than usual because the wing kept its earlier promises."
 DAK_wd_mil_defence_review:0 "A Defence Review for the Century"
 DAK_wd_mil_defence_review_desc:0 "The study of the northern war and a decade of rain manoeuvres feed a full defence review. Its authors rewrite the army's plans for a short, hard defence of the plain: fewer promises, more depots, closer work with the air wing and faster decisions at the top. Some senior officers lose favourite projects. Most of the staff welcome the clarity."
 DAK_wd_mil_usean_freight:0 "The Usean War and the Freight Rates"
 DAK_wd_mil_usean_freight_desc:0 "In 2003 war returns to Usea, and the FCU founds the ISAF to fight it. Dakrain has no part in it and wants none. Its shipping lines feel the war at once in freight rates, insurance and charter offers for routes near the fighting. The government must decide what Dakrainian-flagged hulls may carry, and where."
 DAK_wd_mil_peaceful_cargo:0 "Charters for Grain and Machinery"
 DAK_wd_mil_peaceful_cargo_desc:0 "Lines may carry grain, medicine and machinery to economies disrupted by the war, under strict manifest rules and with no military cargo at all. The pooled fleet earns well, and the repair berths fill with ships on longer routes. Crews face real risk near contested waters, and the government asks for volunteers rather than ordering anyone to sail."
 DAK_wd_mil_home_routes:0 "Keep the Hulls Close to Home"
 DAK_wd_mil_home_routes_desc:0 "The government asks every Dakrainian-flagged ship to keep to routes far from the fighting, with harbour dues waived in compensation. Some owners comply and some reflag elsewhere. The fleet earns less and loses nobody. Crews spend more time at home, and the port towns say publicly that this is the price they would choose to pay."
 ac_wd_dak_tree:0 "Dakrain: National Programme"
 ac_wd_dak_tree_desc:0 "The national focus programme of Dakrain, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 DAK_wd_ballot_suspended:0 "The Suspended Ballot"
 DAK_wd_ballot_suspended_desc:0 "No ballot stands on the calendar; the terms of the suspension are published and contested."
 DAK_wd_round_table:0 "The Round Table"
 DAK_wd_round_table_desc:0 "The left bloc holds a fixed seat to argue wages, rents and the ballot."
 DAK_wd_princely_patrons:0 "Princely Patrons"
 DAK_wd_princely_patrons_desc:0 "Mill and estate families of the princely party back the presidency."
 DAK_wd_garrison_inquiry:0 "The Garrison Inquiry"
 DAK_wd_garrison_inquiry_desc:0 "Garrison commanders have told an inquiry what they expect of government."
 DAK_wd_republic_mandate:0 "The Reopened Polls"
 DAK_wd_republic_mandate_desc:0 "Ministers answer to an elected chamber and the presidency is one office among several."
 DAK_wd_guardianship:0 "Presidential Guardianship"
 DAK_wd_guardianship_desc:0 "A council of state governs on a published programme while the ballot stays suspended."
 DAK_wd_councils_mandate:0 "The Councils Mandate"
 DAK_wd_councils_mandate_desc:0 "Elected works councils send delegates to a federal committee."
 DAK_wd_marshals_order:0 "Order of the Marshals"
 DAK_wd_marshals_order_desc:0 "Senior commanders hold the seals, the treasury and the frontier."
 DAK_wd_chamber_hearings:0 "Budget Hearings"
