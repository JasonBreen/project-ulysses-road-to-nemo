l_english:
 SFA_wd_pol_notice:0 "The Postponement Notice"
 SFA_wd_pol_notice_desc:0 "Every four years the election calendar of Sfaenland falls due, and every four years the National Administration posts the same notice in each district hall: the vote waits while the country stays on its readiness footing. The new notice is typeset and ready. Before it is signed, the Administration asks its own lawyers what the readiness order really requires, a question nobody has put in writing for years."
 SFA_wd_pol_camps:0 "Who Stands Behind the Fifty"
 SFA_wd_pol_camps_desc:0 "Half the country tells pollsters it backs the national movement, and nearly as many want no party in power and put their faith in the prefects who run the districts. Teams from the capital university spend a season in garrison towns, plant streets and empty districts asking why. The study costs the Administration a quiet year, and its findings will please no camp entirely."
 SFA_wd_pol_rolls:0 "Rolls of Residents in Eight Districts"
 SFA_wd_pol_rolls_desc:0 "Nobody knows exactly who would be entitled to vote, because the residents' rolls were last checked when the open districts held even fewer people than they do now. Clerks visit every town and farm with ledgers. The rolls serve tax offices, school planners and ration clerks as well as any future ballot, which is the argument that finally wins them a budget line."
 SFA_wd_pol_path_charter:0 "Draft a Charter in the Districts"
 SFA_wd_pol_path_charter_desc:0 "The democratic camp is tiny but has a plan: a drafting room in each of the eight districts, sending clauses to a national committee, so that the charter belongs to the districts before the capital signs it. The movement calls it a scheme for clerks. It is slow, and it invites every local quarrel into the text, which its authors insist is the whole point."
 SFA_wd_pol_path_prefects:0 "Leave the Districts to the Prefects"
 SFA_wd_pol_path_prefects_desc:0 "The non-party camp wants no constitutional adventure. It would confirm the district prefects, the officials who already run water, schools and roads, as the government in their own right, answerable to a council of their peers rather than to voters or to a movement. It is the least disruptive answer and the least inspiring, and it leaves half the country outside the door."
 SFA_wd_pol_path_movement:0 "The Movement Asks for the Seals"
 SFA_wd_pol_path_movement_desc:0 "The national movement is strongest in the garrison towns beside the two logistics centres and in the plant streets of the capital. Its organisers promise discipline, full readiness and an end to government by postponement notice. Opening a path to power for it wins half the country at a stroke. The other half fears that a movement given the seals will never hand them back."
 SFA_wd_pol_regime_chamber:0 "Convene the Chamber of Eight Districts"
 SFA_wd_pol_regime_chamber_desc:0 "The finished charter goes before an assembly chosen from the fresh rolls, with one list for each district and a national list above them, and the Administration hands the seals to a cabinet the chamber chooses. Democrats begin with almost no supporters of their own. The first sessions are fragile, and every faction outside the hall waits to see whether the arrangement survives its first budget."
 SFA_wd_pol_regime_prefects:0 "Seat the Council of Prefects"
 SFA_wd_pol_regime_prefects_desc:0 "The eight district prefects and the heads of the main ministries sit as a standing council that governs collectively and publishes its minutes every week. The council promises competent government and an election at some future date it declines to name. Plant managers and officials are relieved. The movement calls the council the postponement notice with a permanent address."
 SFA_wd_pol_regime_movement:0 "The Garrison Directorate Takes Office"
 SFA_wd_pol_regime_movement_desc:0 "A directorate drawn from the movement and from officers of the three garrisons replaces the Administration and governs by decree under the very readiness order the movement once mocked. Readiness becomes the purpose of the state instead of its excuse. The garrison towns celebrate. Officials of the old Administration are asked to sign declarations of loyalty, and some of the most capable resign."
 SFA_wd_pol_chamber_questions:0 "Question Time Every Week"
 SFA_wd_pol_chamber_questions_desc:0 "Ministers answer questions in the chamber every week, and the district papers print the answers the next morning. It is tiresome for ministers and very popular in the open districts, whose deputies finally have a place to ask about roads and clinics. Government moves a little more slowly, and it can no longer hide its mistakes behind the readiness order."
 SFA_wd_pol_prefects_terms:0 "Prefects Serve Three-Year Terms"
 SFA_wd_pol_prefects_terms_desc:0 "Prefects now rotate between districts every three years, so that no official settles into a district as its owner and every district gets fresh eyes on its accounts. Rotation breaks local networks, the corrupt ones and the useful ones alike. The council accepts the loss, because the alternative is eight small fiefdoms that obey the capital only on paper."
 SFA_wd_pol_directorate_brigades:0 "Readiness Brigades in Every District"
 SFA_wd_pol_directorate_brigades_desc:0 "The directorate raises readiness brigades of young volunteers in every district: drill at weekends, road work during the week and a uniform that opens doors to jobs. The brigades bring labour to the empty districts and parades to the capital. They also put a disciplined body outside the army's chain of command, which the garrison officers notice and do not forget."
 SFA_wd_pol_press:0 "Licences for District Newspapers"
 SFA_wd_pol_press_desc:0 "Most newspapers are printed in the capital and live on Administration notices. Licences for new district papers, with a small subsidy for newsprint and presses, give the districts a voice whoever governs in the capital. Some of the papers will be scurrilous and a few will be bought outright. The Administration accepts both risks in order to hear what the districts actually say."
 SFA_wd_pol_pay:0 "Pay Scales Published for Officials"
 SFA_wd_pol_pay_desc:0 "The Administration's officials are paid on scales that nobody outside the payroll office has seen. Publishing them district by district reveals prefects who earn more than ministers and clerks who earn less than teachers. The figures embarrass the Administration and anger officials whose allowances are exposed. They also make loyalty harder to buy with quiet raises, whoever governs next."
 SFA_wd_pol_withdrawn:0 "The Notice Is Withdrawn"
 SFA_wd_pol_withdrawn_desc:0 "Whichever government now holds the seals, the postponement notice is no longer printed. A chamber, a council or a directorate governs in its own name and must justify itself on its own terms. The clerks who typeset the notice every four years find other work. The country loses a familiar excuse and gains a government that has to answer for what it does."
 SFA_wd_line_census:0 "Count the Wagons on the Main Line"
 SFA_wd_line_census_desc:0 "One main line carries almost everything Sfaenland moves: from the Capital Centre to the junction in District E, on through District C to the logistics centre in District B, with branches to District A and to the naval base in District G. Nobody has counted the wagons in years. A census of rolling stock, crews and traffic must come before any railway policy."
 SFA_wd_line_sidings:0 "Sidings at the Junction"
 SFA_wd_line_sidings_desc:0 "The junction in District E is a set of points on a rainless plain, with a signal box, a water tower and no town. Freight for three branches waits on the running line because no siding can hold a full train. Sidings, a passing loop and a road out to the nearest villages cost little money and a great deal of engineers' time."
 SFA_wd_line_halts:0 "Halts Across District C"
 SFA_wd_line_halts_desc:0 "Trains run straight through the dry forested hills of District C; there is not one platform between the junction and the southern coast. Fourteen provinces lie beside the track with no road worth the name. A string of halts with loading platforms and graded approach roads lets villages put timber and livestock on the train. Each halt also needs a stationmaster willing to live beside it."
 SFA_wd_line_treasury:0 "The Treasury Runs the Railway"
 SFA_wd_line_treasury_desc:0 "One school wants the railway kept as a single public undertaking, its fares set by the treasury and its surplus spent on track. Planning is simple and every district gets a service whether it pays or not. The railway stays slow to change and loses money on the quiet branches. The army approves, because it knows exactly whom to call in a crisis."
 SFA_wd_line_lease:0 "Lease the Branches to Freight Houses"
 SFA_wd_line_lease_desc:0 "With the traffic figures published, private freight houses can bid for the branches. The track stays public, but each branch is leased to an operator that sets its own timetable and charges what the cargo will bear. Service improves quickly where oil and steel pay and withers where they do not. The leases bring revenue now and arguments about the quiet branches later."
 SFA_wd_line_wagon_shops:0 "Wagon Shops at the Junction"
 SFA_wd_line_wagon_shops_desc:0 "The public railway builds its own wagon and repair shops beside the new sidings in District E, so that rolling stock no longer travels to the capital for every overhaul. The shops are the first plant of any kind in the district. Fitters must be persuaded to move to a dry plain with no town, and housing them costs as much as the sheds themselves."
 SFA_wd_line_bonded:0 "Bonded Depots on the Southern Line"
 SFA_wd_line_bonded_desc:0 "The freight houses want warehouses where cargo can wait, duty unpaid, until it is sold or shipped. Bonded depots go up beside the District C halts, close enough to the coast to serve exporters. They create jobs in a district that has none. Customs officers point out, correctly, that bonded warehouses are also where smuggling most likes to hide."
 SFA_wd_line_culverts:0 "Culverts for the Capital Plain"
 SFA_wd_line_culverts_desc:0 "The Capital District lies in country where heavy rain falls on many days for much of the year, while the junction district beyond it sees no rain at all. Washouts on the capital approaches close the line each wet season. New culverts, raised embankments and drainage ditches keep trains moving when the plain floods, at the price of a season of single-track working."
 SFA_wd_line_naval_spur:0 "Rebuild the Naval Spur"
 SFA_wd_line_naval_spur_desc:0 "The branch that leaves the junction in District E and crosses District C to the naval base in District G carries fuel, shells and spare parts for the Maritime Service. Its bridges were built for lighter trains. Rebuilding them and relaying the track lets the yards take steel plate by rail instead of by coastal barge, and gives the service a supply line it can rely on."
 SFA_wd_line_a_branch:0 "Heavier Rail for the District A Branch"
 SFA_wd_line_a_branch_desc:0 "The branch from the junction to the logistics centre in District A climbs into forest and hills where the oil, steel and aluminium of the west are worked. Ore and fuel trains run half loaded because the old rails cannot carry more weight. Heavier rail and new ballast let full trains reach the plants. The work closes the branch for a season, and District A's managers complain throughout."
 SFA_wd_line_through:0 "Through Trains to the Southern Coast"
 SFA_wd_line_through_desc:0 "Whoever runs the railway, the aim is the same: a train loaded at the Capital Centre reaching the logistics centre in District B without waiting for a free track. Signals, loops and one timetable for the whole network make it possible. The first through train is a modest event. The second, arriving on schedule, is the real achievement, and the army takes careful note of it."
 SFA_wd_plant_inventory:0 "Every Plot in the Plant Districts"
 SFA_wd_plant_inventory_desc:0 "Every one of the eight civilian plants and six arms works in the country stands in the Capital District or in Districts A and B, and the land zoned for industry there has no empty plot left. New capacity must go elsewhere or come from working the existing plants harder. An inventory of machines, shifts and stocks in those three districts tells ministers which course costs less."
 SFA_wd_plant_second_shift:0 "A Second Shift at the Capital Plants"
 SFA_wd_plant_second_shift_desc:0 "The capital's plants run one shift and stand idle for the rest of the day. A second shift doubles the hours their machines work without a single new plot. It needs workers the capital lacks, housing they cannot find and overtime the plants can barely pay. For two years output rises, and so do the noise and the rents in the plant streets."
 SFA_wd_plant_wage_boards:0 "Wage Boards for the Plant Streets"
 SFA_wd_plant_wage_boards_desc:0 "Wages are set plant by plant, and the gaps between neighbours on the same street cause stoppages every year. District wage boards, with managers, workers and an official in the chair, set common rates for common jobs. Managers lose bargaining power and the boards raise the wage bill. Stoppages become rarer and shorter, which the second shift badly needs."
 SFA_wd_plant_alloy:0 "Aluminium Before Everything"
 SFA_wd_plant_alloy_desc:0 "All three plant districts produce aluminium, and the alloy school wants that metal to lead the economy: rolled sheet, extrusions and castings for aircraft, vehicles and export. Aluminium needs cheap power and skilled hands, and it pays well when it sells. It also ties the country's fortunes to world metal prices that nobody in Sfaenland can influence."
 SFA_wd_plant_crude:0 "Let the Crude Pay First"
 SFA_wd_plant_crude_desc:0 "The fuel school notes that the oil of the three plant districts, with the silo at the capital, already keeps the trains and the army moving. It would refine more, store more and sell the surplus abroad, and use the revenue to pay for everything else. Oil earns quickly and simply. Plants that do not touch oil must wait their turn for investment."
 SFA_wd_plant_girders:0 "Steel for Girders and Rails"
 SFA_wd_plant_girders_desc:0 "The steel school wants the country's steel kept at home and turned into girders, rails and bridge spans for the empty districts. Building at home creates work in every district and makes later growth cheaper. Steel sold abroad would earn more today. The school answers that a country with half its districts unbuilt should build before it sells."
 SFA_wd_plant_cable_works:0 "Alloy Cable for the Power Lines"
 SFA_wd_plant_cable_works_desc:0 "The empty districts need power lines before they can host plants, and aluminium is the metal those lines are strung with. A wire and cable works beside the junction in District E draws domestic alloy into conductor for every new line the government plans. The works needs skilled hands from the capital, housing on a plain with no town, and contracts that only the state can sign."
 SFA_wd_plant_refinery:0 "A Refinery Beside the Southern Line"
 SFA_wd_plant_refinery_desc:0 "Crude from the plant districts goes to a new refinery in District C, beside the main line and near the coast where tankers could one day load. The site is dry and empty, which suits a plant nobody wants near their homes. The refinery widens the country's fuel margin and draws a pipeline route that the defence staff immediately asks to guard."
 SFA_wd_plant_bridge_yard:0 "Girder Yards on the District D Plain"
 SFA_wd_plant_bridge_yard_desc:0 "A fabrication yard on the District D plain cuts and rivets the girders for the bridges and sheds the empty districts need, close to where they will stand. Steel arrives by truck from the nearest railhead until the plain has a line of its own. The yard becomes the largest employer the district has known, and its first order is for its own access road."
 SFA_wd_plant_proof:0 "A Proof House for the Arms Works"
 SFA_wd_plant_proof_desc:0 "Rifles, mortar bombs and shells leave the six arms works with nothing but their makers' word that they work. A proof house on the capital plain test-fires a sample from every batch and publishes the rejection rate of each works. Managers hate the league table. The formations stop receiving crates in which one round in fifty misfires, and the Physical Sustainment priority finally has a measure."
 SFA_wd_plant_export:0 "Export Desks for Metal and Fuel"
 SFA_wd_plant_export_desc:0 "Whatever the plant districts make first, someone must sell what the country does not use. An export office with desks for metal, fuel and machinery finds buyers, arranges credit and checks that ships and payments arrive. It costs salaries and patience. It also gives the country its first commercial agents abroad, which the foreign ministry would have preferred to control itself."
 SFA_wd_open_survey:0 "Survey the Districts Off the Line"
 SFA_wd_open_survey_desc:0 "Two districts lie beyond the railway altogether. District D is nineteen provinces of coastal plain with one town and no road network, and District F is four provinces of hills and desert where three frontiers meet. Survey teams with trucks and pack animals map tracks, wells and villages. Their reports decide where the first public money goes."
 SFA_wd_open_d_road:0 "An All-Weather Road Across District D"
 SFA_wd_open_d_road_desc:0 "The District D plain lies in a belt of heavy seasonal rain, and its earth tracks turn to mud for months at a time. A raised, gravelled road from the plain town toward the Capital District, with bridges over the worst streams, keeps the district reachable in every season. The road is long, flat and dull, and it costs more than any other public work of the decade."
 SFA_wd_open_f_track:0 "A Road Up to the Desert Corner"
 SFA_wd_open_f_track_desc:0 "The only way into District F from the capital is a dirt track that climbs into the hills and fades in the desert. Grading it into a proper road, with water points a day's drive apart, opens the district to trucks and officials. It also makes the three-frontier corner far easier to reach from every direction, a point the garrison officers have written into their own estimates."
 SFA_wd_open_town_power:0 "Power and Water for the Plain Town"
 SFA_wd_open_town_power_desc:0 "The one town on the District D plain draws water from wells and power from a diesel set that fails in the wet season. A small power station, a water main and a pumping house make it a place where a clinic, a school and a workshop can open. Everything else planned for the plain depends on this unglamorous and expensive first step."
 SFA_wd_open_farms:0 "Grain Leases on the Plain"
 SFA_wd_open_farms_desc:0 "The farming school would lease the District D plain in large blocks to grain growers, with credit for tractors and storage, and let the district feed the capital. Leases settle people on the land and need no factories. They also concentrate the plain in a few hands, and the grain still travels by road until a railway reaches the district."
 SFA_wd_open_works:0 "Plant Towns on the Plain"
 SFA_wd_open_works_desc:0 "The industrial school wants the plain town turned into a plant town, with housing estates, a power grid and new works, so that District D stops exporting its young people to the capital. It costs far more than farm leases and takes longer to repay. If it works, the country gains a fourth plant district with room still to spare."
 SFA_wd_open_slip:0 "A Slipway on the District D Coast"
 SFA_wd_open_slip_desc:0 "District D has a long coast and not one yard. A small slipway at the shore nearest the town can build and repair fishing boats, harbour craft and launches for the Maritime Service. It trains shipwrights outside District G for the first time. It is small and exposed to the weather, and close enough to the Silvonian frontier that the navy wants a say in its design."
 SFA_wd_open_f_market:0 "The Market at the Desert Crossing"
 SFA_wd_open_f_market_desc:0 "Traders coming up the desert road from Luremia have long stopped at a market in District F that no ministry ever licensed. With the crossing ledger in hand, the government recognises the market: a weighbridge, a customs clerk, a well and a shaded yard. Trade comes into the open and the district earns a little revenue. Some traders find the new forms reason enough to stay away."
 SFA_wd_open_f_posts:0 "Watch Posts at the Three-Frontier Corner"
 SFA_wd_open_f_posts_desc:0 "District F is the only place where Sfaenland meets Glaceland, Silvonia and Luremia at once, and nothing watches it except a few herders. A radar post on the highest hill and a small barracks near the crossing put the corner under observation. Neighbours will see the mast. The defence staff argues that an unwatched corner invites misunderstanding far more than a visible one."
 SFA_wd_open_schools:0 "Boarding Schools for the Off-Line Districts"
 SFA_wd_open_schools_desc:0 "Children in the villages of District D and the hills of District F walk half a day to a school, or do not go at all. Boarding schools in the plain town and at the desert crossing, with buses where the new roads allow, bring them in for the term. Parents lose labour on the farms. A generation gains the reading and arithmetic that the plant districts will want to hire."
 SFA_wd_open_joined:0 "Two Districts on the Timetable"
 SFA_wd_open_joined_desc:0 "When the plain road and the desert track both carry regular buses, mail vans and trucks, Districts D and F stop being blank spaces on the ministry maps. Officials can reach them within a day, and their people can reach the capital. The government marks the moment with a national timetable that, for once, includes every district in the country."
 SFA_wd_sea_muster:0 "Count the Hulls at District G"
 SFA_wd_sea_muster_desc:0 "Two coastal escorts and a single coastal submarine make up the entire Maritime Service, berthed at the naval base in District G beside the three dockyards of the country. It guards a coast that runs along five of the eight districts. A full muster of crews, stores and hulls shows what the service can actually do in a week, and how little it could do in a war."
 SFA_wd_sea_slip:0 "A Fourth Slip at District G"
 SFA_wd_sea_slip_desc:0 "The three yards at District G can build an escort or a submarine at a time, but not both, and repairs queue behind new work. A fourth slip on the last free ground beside the naval base lets the yards repair and build at once. Once it is laid there is no room left in District G for any further yard, and the next one must go elsewhere."
 SFA_wd_sea_cinigrad:0 "The Cinigrad Submarine Announcement"
 SFA_wd_sea_cinigrad_desc:0 "In September 1991 a new class of very large submarines is unveiled at a political convention in Cinigrad, Yuktobania, and an Osean minister mocks the announcement in public. Officers at District G read every report. A service of three hulls cannot match such ships. It can decide what kind of small navy is useful in a world where great powers build submarines like these."
 SFA_wd_sea_subs:0 "Submarines Hold the Approaches"
 SFA_wd_sea_subs_desc:0 "The submarine case is that Sfaenland will never command the sea but can make its own approaches costly to use. A flotilla of coastal submarines, quiet and cheap to crew, would watch the harbour mouths of Districts B, C and G. Submarines do little in peacetime that anyone can see. The merchant captains who wanted escorts get none of them."
 SFA_wd_sea_escorts:0 "Escorts for the Coastal Convoys"
 SFA_wd_sea_escorts_desc:0 "The escort school answers that the country's sixty convoy hulls carry oil, steel and grain along the coast every week, and that protecting them matters more than threatening anyone. More escorts, better sonar and a convoy plan keep trade moving in a crisis. Escorts are visible, useful and expensive, and they leave the harbour mouths to mines and patrol craft."
 SFA_wd_sea_sub_school:0 "A Submarine School at the Naval Base"
 SFA_wd_sea_sub_school_desc:0 "Submarine crews cannot be trained aboard an escort. A school with a training boat, a diving tank and an attack trainer turns volunteers into crews within a year. It is expensive for so few graduates, and its instructors are the service's best officers taken off the boats. Without it, every new submarine would wait at the quay for a crew that does not exist."
 SFA_wd_sea_convoy_plan:0 "A Convoy Plan for Sixty Hulls"
 SFA_wd_sea_convoy_plan_desc:0 "Every coastal freighter is assigned to a convoy group, a route and a harbour of refuge, and its master is trained in signals. The plan lives in a binder at the naval base and on a wall chart in each port. Shipowners grumble about paperwork and drills. In a crisis, sixty hulls will move as one fleet under escort rather than as sixty separate gambles."
 SFA_wd_sea_bunkers:0 "Fuel Bunkers at the Naval Base"
 SFA_wd_sea_bunkers_desc:0 "With crude paying first, the naval base can store fuel for months of patrols rather than weeks. Buried tanks, a pump house and a pipe from the railhead keep the Maritime Service at sea when the trains stop. The tanks are an obvious target and need guarding. Escorts and submarines alike can now plan their patrols by the season instead of by the delivery."
 SFA_wd_sea_coast_watch:0 "Coast Watchers Along Five Districts"
 SFA_wd_sea_coast_watch_desc:0 "Lookouts in lighthouses, fishing villages and hilltops along the coasts of Districts A, B, C, D and G report every ship they see to the naval base by telephone. A radar set on the District C coast covers the busiest stretch. The watch costs little and relies on volunteers, and it gives the Maritime Service eyes far beyond its three hulls."
 SFA_wd_sea_design_office:0 "An Escort Designed at Home"
 SFA_wd_sea_design_office_desc:0 "The yards at District G have only ever built foreign designs under licence. A small design office, staffed with naval architects from the capital university, attempts the first escort drawn at home: modest, robust and suited to the short seas off the coast. The first design will be heavier and slower than hoped. The second will be better, and the office will still exist to draw it."
 SFA_wd_army_roll:0 "Roll Call at the Three Garrisons"
 SFA_wd_army_roll_desc:0 "The whole army is six infantry formations. Each has six battalions and an engineer company, and they are stationed two by two: at the Capital Centre, at the logistics centre of District A and at that of District B. Five districts have no garrison at all. A roll call of men, rifles, trucks and spares gives the general staff its first honest picture of the force."
 SFA_wd_army_trucks:0 "A Motor Pool for Eight Hundred Trucks"
 SFA_wd_army_trucks_desc:0 "The depots hold some eight hundred motor vehicles, scattered among the garrisons and maintained by whoever happens to be nearby. One motor pool with workshops, mechanics and a fuel allocation keeps them running and lets the staff move a formation by road in days rather than weeks. Garrison commanders lose trucks they had come to treat as their own."
 SFA_wd_army_home:0 "Home Companies for the Empty Districts"
 SFA_wd_army_home_desc:0 "One school wants a company of local reservists in every district without a garrison, trained at weekends and armed from a district armoury. Home companies put soldiers in Districts C to G at little cost and bind those districts to the army. They are lightly equipped and slow to mobilise, and they could delay a determined attack but never stop one."
 SFA_wd_army_rail:0 "A Reserve That Rides the Main Line"
 SFA_wd_army_rail_desc:0 "Another school would keep the six formations concentrated and move them by train to wherever they are needed, with loading ramps at every halt and rolling stock held ready. The plan rests on the through trains the railway now runs. It leaves Districts D and F, which no line reaches, covered only by the days it takes to march there."
 SFA_wd_army_hills:0 "Hill Battalions for District A"
 SFA_wd_army_hills_desc:0 "A third school points out that the army already trains mountain troops and that the forest, hills and mountain of District A are the roughest ground on any frontier. It would convert two formations into hill battalions with pack transport, radios and their own engineers. Garrisons elsewhere would thin out. The western hills would get the best soldiers the army has, and the plains would have to trust the railway."
 SFA_wd_army_engineers:0 "Engineer Companies on Road Duty"
 SFA_wd_army_engineers_desc:0 "Each formation's engineer company spends half the year building roads and bridges in districts that lack them, starting around the junction in District E. Soldiers learn their trade on real work, and villages get roads at the price of rations. Field training suffers a little. For many villagers the army becomes the only part of the state they ever meet."
 SFA_wd_army_ranges:0 "Live-Fire Ranges in District E"
 SFA_wd_army_ranges_desc:0 "The plains and hills of District E see no rain in any month, which makes them the one place in the country where formations can train year-round without mud. Ranges, a tented camp and a water pipeline turn empty land into a training area. Herders lose grazing. Formations gain a place to fire live rounds and practise movement at full scale."
 SFA_wd_army_staff:0 "A Staff College at the Capital Centre"
 SFA_wd_army_staff_desc:0 "Officers learn staff work on the job, which means the three garrisons plan in three different ways. A staff college at the Capital Centre teaches one method of orders, supply and movement to every captain who hopes to command. Each course takes good officers away from their units. Plans written afterwards can be read by anyone in the army."
 SFA_wd_army_arms_works:0 "An Arms Works at the Junction"
 SFA_wd_army_arms_works_desc:0 "Every arms works stands in the three plant districts, two of those districts on the coast and one on a frontier. A new works beside the junction in District E, inland and on the railway, builds rifles and mortars where no landing could quickly reach it. The site has no town and few workers. The general staff considers that a fair price for depth."
 SFA_wd_army_exercise:0 "The First Three-Garrison Exercise"
 SFA_wd_army_exercise_desc:0 "For the first time all six formations take the field together, moving from their garrisons to an exercise area under one headquarters. The exercise tests the motor pool, the staff college graduates and whichever doctrine the army chose. Much goes wrong, as it should. Umpires write a frank report, and the general staff decides to publish most of it."
 SFA_wd_air_apron:0 "Every Aircraft on One Apron"
 SFA_wd_air_apron_desc:0 "Thirty-six fighters and twelve ground-attack aircraft share a single air base beside the capital, with thirteen more airframes in storage. One airfield means one fuel store, one control tower and one target. Before anything else, the air staff counts what can fly today, what waits for parts and what would still be flying if that one field were shut for a week."
 SFA_wd_air_runway:0 "A Longer Runway at the Capital Field"
 SFA_wd_air_runway_desc:0 "The capital field has one runway, short for loaded aircraft in the heavy rain of the wet months. Lengthening it, adding a parallel taxiway and laying hardstands lets the wing launch in pairs and recover in bad weather. The works close the field for a season and push the wing onto grass strips that pilots and ground crews alike detest."
 SFA_wd_air_dispersal:0 "A Dispersal Field in District E"
 SFA_wd_air_dispersal_desc:0 "The dry, flat country of District E suits a second airfield: no rain in any month and room for a long runway near the junction. A dispersal field there lets the wing split in a crisis and gives pilots a training field with dependable weather. It needs fuel by rail and quarters for ground crews in a district that has no town."
 SFA_wd_air_interceptors:0 "Fighters Held Over the Capital"
 SFA_wd_air_interceptors_desc:0 "The interceptor school would give every fighter one job, the defence of the capital and the plant districts, with fast climbers, ground controllers and pilots drilled for nothing else. The garrisons would get little help from the air. In return, any aircraft approaching the industrial heart of the country would meet fighters within minutes of crossing the coast."
 SFA_wd_air_support:0 "Wings for the Garrisons"
 SFA_wd_air_support_desc:0 "The support school wants the air arm to fight beside the army: ground-attack training for fighter pilots, liaison officers at each garrison and joint drills with the formations in District E. The air arm would be most useful in the war the army expects. It would be weaker in the war over the capital that the interceptor school fears."
 SFA_wd_air_radar:0 "Radar on the Capital Plain"
 SFA_wd_air_radar_desc:0 "A radar station on the capital plain sees aircraft long before they see the capital, and gives the fighters time to climb. The set is imported and its first operators are trained abroad. Once installed it also guides airliners, which pleases the transport ministry, and records every flight across the plain, which pleases the air staff even more."
 SFA_wd_air_alloy_shops:0 "Airframe Shops for the Alloy Economy"
 SFA_wd_air_alloy_shops_desc:0 "With aluminium leading the economy, the plant districts can repair airframes from their own sheet and extrusions instead of waiting for foreign parts. A repair shop beside the capital field returns grounded aircraft to the flight line in weeks. One day it might build simple aircraft of its own. For now, the count of airworthy fighters simply rises."
 SFA_wd_air_aggressors:0 "Hire Former Belkan Aggressor Pilots"
 SFA_wd_air_aggressors_desc:0 "Since mid-1998 pilots who once flew at the top of the Belkan Air Force have been selling their skills to various governments as hired aggressor squadrons. Contracting a small team to fly against the pilots of Sfaenland would teach in months what home instruction takes years to learn. The fees are high, the instructors' loyalties are their own business, and the movement objects loudly to foreigners in the cockpit."
 SFA_wd_air_home_school:0 "An Instructor School of Our Own"
 SFA_wd_air_home_school_desc:0 "The alternative is slower and cheaper: send the best pilots abroad for instructor courses and build a school at home around them. Every lesson stays in the country and every instructor answers to the air staff. The first classes will be no better than their teachers. The school will still be teaching long after hired instructors would have gone home."
 SFA_wd_air_reserve:0 "The Thirteen Stored Airframes"
 SFA_wd_air_reserve_desc:0 "Nine fighters and four support aircraft sit in storage as a reserve that has not flown in years. Overhauling them, or stripping some to keep the rest airworthy, adds either a squadron of aircraft or a year of spares. The engineers favour cannibalising. The air staff wants every airframe it can count, and the argument occupies a whole winter."
 SFA_wd_front_gazetteer:0 "A Gazetteer of Every Crossing"
 SFA_wd_front_gazetteer_desc:0 "Sfaenland meets Glaceland along Districts A, E and F, Silvonia along Districts D and F, and Luremia only in the desert of District F. Nobody in the capital can say how many tracks, ferries and footpaths cross those lines. Customs officers, surveyors and herders' guides walk the frontiers and list every crossing, its traffic and the nearest post, so that policy can start from a map instead of rumour."
 SFA_wd_front_glaceland:0 "Customs Sheds on the Glaceland Road"
 SFA_wd_front_glaceland_desc:0 "The logistics centre in District A stands directly on the Glaceland frontier, and most trade between the two countries crosses there. Proper customs sheds, a weighbridge and a paved approach road speed the trucks and let the treasury count what crosses. Smugglers move to the forest tracks, which the customs service then has to learn as well as they do."
 SFA_wd_front_silvonia:0 "Fishing Rules for the District D Coast"
 SFA_wd_front_silvonia_desc:0 "The coast of District D runs up to Silvonia, and boats from both sides work the same fishing grounds with no agreed rules. The Maritime Service publishes the rules for Sfaenland boats: where they may fish, what lights they show and which channel they call on. Nothing is asked of Silvonia. Fewer incidents start when at least one side knows its own rules."
 SFA_wd_front_luremia:0 "A Ledger for the Desert Road"
 SFA_wd_front_luremia_desc:0 "Luremia meets Sfaenland only in the desert of District F, where a road from the Luremian side brings traders, livestock and the occasional stolen truck. A ledger at the crossing, recording every vehicle and cargo, tells the government for the first time what this trade is worth. The traders dislike being counted. The figures will show whether the crossing deserves a market or only a fence."
 SFA_wd_front_belkan:0 "War Bulletins from Belka"
 SFA_wd_front_belkan_desc:0 "Belka goes to war at the end of March 1995, and no frontier of Sfaenland is anywhere near the fighting. No Belkan soldier will appear at the junction. What does appear, within a fortnight, is a letter from every shipping insurer, a jump in the price of fuel and a queue of foreign buyers asking about steel and aluminium. The movement calls rallies. A small, distant country must decide how it behaves in another country's war."
 SFA_wd_front_open:0 "Neutral Transit for Every Cargo"
 SFA_wd_front_open_desc:0 "One answer is commerce: the railway, the ports and the frontier roads stay open to any cargo, for any buyer, under the ordinary customs rules. Trade and fees rise with every month of fighting. The country profits from a conflict it takes no part in, and its name appears on shipping papers that someone, someday, will read aloud in public."
 SFA_wd_front_closed:0 "No War Cargo Through Sfaenland"
 SFA_wd_front_closed_desc:0 "The other answer is restraint: no arms, ammunition or military fuel for any warring party crosses the territory of Sfaenland or uses its ports. Customs officers check every manifest and the Maritime Service inspects suspicious ships. Revenue falls and some traders take their business elsewhere. The country keeps its hands visibly clean, which matters to the movement and to the prefects alike."
 SFA_wd_front_treaty:0 "When the Belkan Fighting Stops"
 SFA_wd_front_treaty_desc:0 "Peace returns to Belka, and the case for wartime rules in Sfaenland weakens by the week. Underwriters drop their war clauses, freight settles and the extra customs officers can go home or stay on for the next emergency. Ministers ask for an honest tally of what the war years cost, what they brought in and what the crossing service learned about working under pressure."
 SFA_wd_front_engineers:0 "Belkan Engineers Seeking Work"
 SFA_wd_front_engineers_desc:0 "The Belkan defeat leaves its arms and aircraft industries shedding staff, and some of those people answer advertisements placed by the capital's plants and the university. A few dozen sign contracts, bringing skills Sfaenland could not teach in a decade. Each also brings a past nobody here can check, so the security service is asked to look into them quietly and fast."
 SFA_wd_front_buyers:0 "Belkan Buyers for Alloy and Steel"
 SFA_wd_front_buyers_desc:0 "With Belka victorious, its industries need metal faster than its own mines can supply it. Buyers arrive in the capital offering long contracts for aluminium and steel at good prices. The orders fill the order books of the plant districts for two years. They also tie the prosperity of Sfaenland to a power whose war unsettled half the world, and the prefects say so openly."
 SFA_wd_front_rules:0 "Rules Posted at Every Crossing"
 SFA_wd_front_rules_desc:0 "Every crossing post on the three frontiers receives the same printed rules: opening hours, duties, papers required and the office that hears complaints. Officers can no longer invent fees, and travellers can no longer plead ignorance. The rules are dull and they work. Neighbouring officials who receive copies are free to answer with rules of their own."
 SFA_wd_sky_bulletin:0 "A Table for the Asteroid"
 SFA_wd_sky_bulletin_desc:0 "When the astronomers' union warns in December 1994 that Ulysses might hit the Earth, nobody in the government of Sfaenland has ever had reason to think about asteroids, and the country owns no observatory worth the name. Ministers set up a small table instead: two scientists, a railway engineer and the eight district prefects, meeting weekly in the capital to read whatever the world publishes."
 SFA_wd_sky_observers:0 "Observers Under the Dry Skies"
 SFA_wd_sky_observers_desc:0 "The skies over Districts C and E are clear in every month, which makes them the best place in the country to watch the heavens. Amateur astronomers, teachers and a university group set up telescopes on the dry hills and learn to follow the published tracking data. They cannot see more than the great observatories. They can explain it plainly to their neighbours."
 SFA_wd_sky_announced:0 "The April Announcement"
 SFA_wd_sky_announced_desc:0 "The statement by the FCU president in April 1996 removes all doubt: Ulysses will hit the Earth, and a plan to fight it is being prepared. The asteroid table turns from a reading circle into a national programme within a week. Nobody can tell ministers where pieces may land, so Sfaenland must prepare for a danger it cannot measure, with money already promised to rails and roads."
 SFA_wd_sky_shelters:0 "Shelters Under the Plant Districts"
 SFA_wd_sky_shelters_desc:0 "The shelter school would dig beneath the capital and the plant districts, where most people and every plant stand: concrete shelters under schools and plant yards, stocked for weeks. Shelters protect what matters most to the economy. They leave the open districts with nothing but advice, and the wet ground of the capital plain floods the deepest excavations."
 SFA_wd_sky_disperse:0 "Disperse into the Open Districts"
 SFA_wd_sky_disperse_desc:0 "The dispersal school would move people out of the crowded plant districts into the open country of Districts C, D, E and F if a fall were predicted, using the surveys, tracks and halts already in hand. Dispersal costs less than concrete. It works only with warning, roads and water, and the open districts must take in guests by the hundred thousand."
 SFA_wd_sky_silo:0 "Fill and Seal the Capital Silo"
 SFA_wd_sky_silo_desc:0 "The fuel silo at the capital is the country's only strategic store, and it is rarely full. Filling it, sealing it against dust and fire, and stocking a ring of drums at each garrison keeps vehicles moving if supply is ever cut. The fuel ties up money that could have bought rails. It also makes every later emergency less frightening."
 SFA_wd_sky_pumps:0 "Pumps for the Flooded Shelters"
 SFA_wd_sky_pumps_desc:0 "The first shelters under the capital flood in the wet season, as the engineers predicted and the planners chose to ignore. Pumps, drainage galleries and raised entrances keep them dry. The repair costs nearly as much as the digging did. When it is finished, the capital has shelters that work in every month, which is the only kind worth having."
 SFA_wd_sky_camps:0 "Camp Sites with Wells in District E"
 SFA_wd_sky_camps_desc:0 "Dispersal needs somewhere to go. Camp sites with wells, latrines and supply dumps are laid out in the dry country of District E, near the junction where trains can bring people and stores. They stand empty for years and the herders water their flocks at the wells. If the warning comes, each plant district knows exactly which train goes where."
 SFA_wd_sky_roche:0 "Watching the Roche Passage"
 SFA_wd_sky_roche_desc:0 "Ulysses reaches the Roche limit in July 1999 and starts to shatter. Every shelter, camp and fuel drum laid down since 1996 now meets the one test that counts. Prefects keep their district halls open until dawn, railwaymen hold trains at the junction, and on the dry hills the amateur observers record what they see for a country that has, for one night, stopped working to look up."
 SFA_wd_sky_stand_down:0 "Standing Down the Asteroid Table"
 SFA_wd_sky_stand_down_desc:0 "When the showers have passed, the table reports what its preparations achieved and what they cost. Stored food is sold through the shops, shelters become storerooms, and the camp wells go back to the herders for good. A few ministers would keep the whole emergency machinery standing for the next crisis. The treasury wants its money back for the roads it postponed."
 SFA_wd_cent_accounts:0 "Ten Years of National Accounts"
 SFA_wd_cent_accounts_desc:0 "The treasury publishes, for the first time, a decade of national accounts: output, debt at around three tenths of it, tax collected and tax missed, district by district. The figures show where the 1990s went right and where money simply vanished. Every faction finds ammunition in them. The country gains what honest argument needs most, one shared set of numbers."
 SFA_wd_cent_tax_offices:0 "Tax Offices in the Open Districts"
 SFA_wd_cent_tax_offices_desc:0 "Taxes are assessed and collected almost entirely in the three plant districts, because that is where the offices are. As the open districts grow, their trade and wages go largely untaxed. Opening a tax office in each brings in revenue and teaches new businesses to keep books. It also reminds the open districts that development comes with a bill."
 SFA_wd_cent_c_works:0 "A Machine Works in District C"
 SFA_wd_cent_c_works_desc:0 "By the turn of the century the main line through District C carries more than passing trains, and some of its villagers have learned industrial trades. A machine works building pumps, valves and rail parts uses that workforce and that line. It is the first plant in the district not tied to a single raw material, which is what economists mean when they speak of a real local economy."
 SFA_wd_cent_f_works:0 "Workshops at the Desert Crossing"
 SFA_wd_cent_f_works_desc:0 "The crossing in District F, now joined to the national timetable, needs mechanics for trucks, smiths for tools and a cold store for meat. A workshop estate beside the crossing gives the district its first plant and its traders a reason to stay overnight. The estate sits a few hours from three frontiers. Investors ask about security before they ask about rents."
 SFA_wd_cent_report:0 "The Government Reports to the Districts"
 SFA_wd_cent_report_desc:0 "Whatever government withdrew the postponement notice now reports, in a single printed volume, what it did with its years in office: the roads, plants, garrisons and accounts. Copies go to every district hall. Critics read it for omissions and find several. The report becomes the baseline against which the next government, however it is chosen, will be judged."
 SFA_wd_cent_isaf:0 "News of the ISAF"
 SFA_wd_cent_isaf_desc:0 "The ISAF is founded in August 2003, after the FCU calls on Erusea to leave San Salvacion, and war spreads across the Usean continent. Sfaenland is nowhere near the fighting. Even so, fuel and freight prices climb again, insurers rewrite their clauses, and the government digs out its 1995 files to see what it learned about being a small country beside a large war."
 SFA_wd_cent_cargo_cover:0 "War-Risk Cover for Coastal Freight"
 SFA_wd_cent_cargo_cover_desc:0 "Having kept transit open in the Belkan War, the ports of Sfaenland again see cargo bound for distant buyers. A state war-risk pool covers coastal freighters whose private insurance has been cancelled. The pool keeps sixty hulls working. If any is lost, the treasury pays, and the neutrality of the country will be judged by what those hulls were carrying."
 SFA_wd_cent_cargo_checks:0 "Manifests Checked Twice"
 SFA_wd_cent_cargo_checks_desc:0 "Having refused war cargo in 1995, Sfaenland applies the same rule to the Usean war. Customs officers check manifests at the ports and on the frontier, and doubtful cargoes are held until their owners prove where they are going. Shipping slows and owners complain to ministers. Nobody will be able to say that the national railway carried the war."
 SFA_wd_cent_lessons:0 "Lessons Read from Usea"
 SFA_wd_cent_lessons_desc:0 "Reports from the Usean war describe railguns used against aircraft, harbours attacked from the air and a long struggle for control of the sky. Having run its own three-garrison exercise, the general staff knows what to look for in those accounts. The lessons point to radar, dispersal and air defence, all of which cost money that had been promised to the roads."
 SFA_wd_cent_lanes_open:0 "Shipping Lanes Reopen to Usea"
 SFA_wd_cent_lanes_open_desc:0 "With the Erusean capital fallen and its surrender accepted, the Usean war ends and the shipping lanes reopen. Insurers restore peacetime terms, freight rates fall and buyers on the Usean continent want metal and fuel for rebuilding. The freighters and plants of Sfaenland can compete for that trade. The prefects warn that rebuilding booms end as quickly as they begin."
 SFA_wd_cent_erusean_ports:0 "Trade on Erusean Terms"
 SFA_wd_cent_erusean_ports_desc:0 "With Erusea victorious, the ports and markets of the Usean continent answer to Erusean rules. Traders from Sfaenland must register with Erusean offices, pay Erusean duties and accept Erusean inspections to sell anything there. The trade is still worth having. Ministers must decide how much deference it is worth, and the movement asks pointedly whether readiness means anything at all."
 ac_wd_sfa_tree:0 "Sfaenland: National Programme"
 ac_wd_sfa_tree_desc:0 "The national focus programme of Sfaenland, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 SFA_wd_readiness_order:0 "The Standing Readiness Order"
 SFA_wd_readiness_order_desc:0 "Garrisons, fuel and railway under one emergency authority, with the vote postponed beside them."
 SFA_wd_camps_study:0 "A Season of Questions"
 SFA_wd_camps_study_desc:0 "University teams ask garrison towns and plant streets what they want from government."
 SFA_wd_charter_rooms:0 "Eight Drafting Rooms"
 SFA_wd_charter_rooms_desc:0 "Each district drafts clauses for a charter the capital has promised to sign."
 SFA_wd_prefect_rule:0 "The Prefects Confirmed"
 SFA_wd_prefect_rule_desc:0 "District prefects govern as before, now in their own name and answerable to their peers."
 SFA_wd_movement_pressure:0 "The Movement in the Antechamber"
 SFA_wd_movement_pressure_desc:0 "The national movement has been promised a path to the seals and expects it soon."
 SFA_wd_question_time:0 "Weekly Questions to Ministers"
 SFA_wd_question_time_desc:0 "Every minister answers the chamber each week, and the answers are printed the next morning."
 SFA_wd_prefect_terms:0 "Prefects on Rotation"
 SFA_wd_prefect_terms_desc:0 "No prefect serves more than three years in any one district."
 SFA_wd_readiness_brigades:0 "The Readiness Brigades"
 SFA_wd_readiness_brigades_desc:0 "Volunteer brigades drill at weekends and build roads on weekdays in every district."
 SFA_wd_district_papers:0 "Papers in Every District"
 SFA_wd_district_papers_desc:0 "Licensed district newspapers report what the capital would rather not hear."
 SFA_wd_open_pay_scales:0 "Pay Scales on the Wall"
 SFA_wd_open_pay_scales_desc:0 "Every official pay scale is published, district by district."
 SFA_wd_freight_ledger:0 "The Wagon Ledger"
 SFA_wd_freight_ledger_desc:0 "Every wagon on the main line is counted and its last journey recorded."
 SFA_wd_treasury_railway:0 "A Treasury Railway"
 SFA_wd_treasury_railway_desc:0 "One public undertaking sets every fare and spends its surplus on track."
 SFA_wd_leased_branches:0 "Leased Branch Lines"
 SFA_wd_leased_branches_desc:0 "Freight houses run the branches on public track and set their own timetables."
 SFA_wd_night_freight:0 "Night Trains at the Junction"
 SFA_wd_night_freight_desc:0 "The junction signal box is staffed all night and freight runs after dark."
 SFA_wd_plant_census_file:0 "The Plant District Inventory"
 SFA_wd_plant_census_file_desc:0 "Every machine, shift and stock in the three plant districts is on file."
 SFA_wd_second_shift:0 "The Second Shift"
 SFA_wd_second_shift_desc:0 "Capital plants run two shifts, and the plant streets never quite sleep."
 SFA_wd_alloy_priority:0 "Alloy Priority"
 SFA_wd_alloy_priority_desc:0 "Aluminium sheet, extrusion and casting lead the economy."
 SFA_wd_crude_first:0 "Crude Pays First"
 SFA_wd_crude_first_desc:0 "Refined fuel and crude sales fund the rest of the budget."
 SFA_wd_girders_first:0 "Girders Before Exports"
 SFA_wd_girders_first_desc:0 "Domestic steel goes into rails, bridges and sheds before any of it is sold abroad."
 SFA_wd_wage_boards:0 "District Wage Boards"
 SFA_wd_wage_boards_desc:0 "Common rates for common jobs in every plant street."
 SFA_wd_proof_house:0 "Proof-Fired Batches"
 SFA_wd_proof_house_desc:0 "A sample from every batch of rifles and shells is fired before delivery."
 SFA_wd_export_desks:0 "The Export Desks"
 SFA_wd_export_desks_desc:0 "Commercial desks for metal, fuel and machinery look for buyers abroad."
 SFA_wd_grain_leases:0 "Leases on the Coastal Plain"
 SFA_wd_grain_leases_desc:0 "Large grain leases with credit for tractors and storage on the District D plain."
 SFA_wd_plain_works:0 "A Fourth Plant District"
 SFA_wd_plain_works_desc:0 "Housing, power and works are turning the plain town into an industrial centre."
 SFA_wd_desert_market:0 "The Licensed Desert Market"
 SFA_wd_desert_market_desc:0 "A weighbridge, a clerk and a well at the District F crossing."
 SFA_wd_boarding_schools:0 "Term-Time Boarding"
 SFA_wd_boarding_schools_desc:0 "Children of the plain and the desert corner board at district schools during term."
 SFA_wd_maritime_roll:0 "Maritime Service Roll"
 SFA_wd_maritime_roll_desc:0 "Two escorts, one submarine and three yards, mustered and counted."
 SFA_wd_submarine_flotilla:0 "Flotilla of the Harbour Mouths"
 SFA_wd_submarine_flotilla_desc:0 "Coastal submarines watch the harbour mouths."
 SFA_wd_coastal_escorts:0 "Escorts for the Coast Lanes"
 SFA_wd_coastal_escorts_desc:0 "Escort groups shepherd the coastal freighters."
 SFA_wd_convoy_groups:0 "Convoy Groups"
 SFA_wd_convoy_groups_desc:0 "Every coastal freighter has a group, a route and a harbour of refuge."
 SFA_wd_naval_bunkers:0 "Bunkers at the Naval Base"
 SFA_wd_naval_bunkers_desc:0 "Buried tanks hold months of patrol fuel at District G."
 SFA_wd_coast_watchers:0 "The Coast Watch"
 SFA_wd_coast_watchers_desc:0 "Volunteer lookouts report every ship along five coastal districts."
 SFA_wd_design_office:0 "The Naval Design Office"
 SFA_wd_design_office_desc:0 "Naval architects draw escorts at home for the District G yards."
 SFA_wd_three_garrisons:0 "The Garrison Pairs"
 SFA_wd_three_garrisons_desc:0 "The army sits in pairs of formations at three posts and nowhere else."
 SFA_wd_motor_pool:0 "The Central Motor Pool"
 SFA_wd_motor_pool_desc:0 "One pool, one set of workshops and one fuel allocation for every army truck."
 SFA_wd_home_companies:0 "District Home Companies"
 SFA_wd_home_companies_desc:0 "A reserve company in every district without a garrison."
 SFA_wd_line_reserve:0 "The Main Line Reserve"
 SFA_wd_line_reserve_desc:0 "Formations held together and moved by train, with ramps at every halt."
 SFA_wd_hill_battalions:0 "Western Hill Battalions"
 SFA_wd_hill_battalions_desc:0 "Two formations trained and equipped for the forest and hills of District A."
 SFA_wd_range_season:0 "A Year on the Ranges"
 SFA_wd_range_season_desc:0 "Formations rotate through the live-fire ranges in District E."
 SFA_wd_staff_college:0 "The Capital Staff College"
 SFA_wd_staff_college_desc:0 "One method of orders and movement taught to every future commander."
 SFA_wd_single_apron:0 "The Single Apron"
 SFA_wd_single_apron_desc:0 "Forty-eight aircraft, one runway and one fuel store."
 SFA_wd_capital_interceptors:0 "Interceptors for the Plant Districts"
 SFA_wd_capital_interceptors_desc:0 "The whole fighter force is trained and based to defend the plant districts from the air."
 SFA_wd_garrison_wings:0 "Wings with the Garrisons"
 SFA_wd_garrison_wings_desc:0 "Air liaison officers at every garrison and pilots trained in ground attack."
 SFA_wd_airframe_shops:0 "Alloy Airframe Shops"
 SFA_wd_airframe_shops_desc:0 "Grounded aircraft are repaired from domestic aluminium sheet."
 SFA_wd_aggressor_syllabus:0 "The Hired Aggressor Syllabus"
 SFA_wd_aggressor_syllabus_desc:0 "Contract instructors fly against Sfaenland pilots in mock combat."
 SFA_wd_home_instructors:0 "Home-Trained Instructors"
 SFA_wd_home_instructors_desc:0 "An instructor school built around pilots trained abroad."
 SFA_wd_crossing_gazetteer:0 "The Crossing Gazetteer"
 SFA_wd_crossing_gazetteer_desc:0 "Every road, track and ferry across the three frontiers is listed and mapped."
 SFA_wd_fishing_rules:0 "Rules for the Shared Banks"
 SFA_wd_fishing_rules_desc:0 "Sfaenland boats off District D follow published fishing and lighting rules."
 SFA_wd_open_transit:0 "Transit for Any Cargo"
 SFA_wd_open_transit_desc:0 "Railway, ports and frontier roads open to every cargo under the ordinary customs rules."
 SFA_wd_war_cargo_ban:0 "The War Cargo Ban"
 SFA_wd_war_cargo_ban_desc:0 "No arms, ammunition or military fuel for any warring party crosses the country."
 SFA_wd_belkan_orders:0 "Orders from Belkan Buyers"
 SFA_wd_belkan_orders_desc:0 "Belkan firms buy aluminium and steel on long contracts."
 SFA_wd_posted_rules:0 "Posted Crossing Rules"
 SFA_wd_posted_rules_desc:0 "Hours, duties and papers printed at every crossing post."
 SFA_wd_ulysses_table:0 "The Asteroid Table"
 SFA_wd_ulysses_table_desc:0 "Scientists, engineers and district officials meet weekly in the capital to read the Ulysses reports."
 SFA_wd_sky_classes:0 "Night Classes in Astronomy"
 SFA_wd_sky_classes_desc:0 "Observers on the dry hills explain the tracking data to their neighbours."
 SFA_wd_plain_shelters:0 "Shelters Beneath the Plant Districts"
 SFA_wd_plain_shelters_desc:0 "Concrete shelters under schools and plant yards, stocked for weeks."
 SFA_wd_dispersal_plan:0 "The Dispersal Timetable"
 SFA_wd_dispersal_plan_desc:0 "Trains, trucks and camp sites assigned for every plant district."
 SFA_wd_sealed_silo:0 "A Full and Sealed Silo"
 SFA_wd_sealed_silo_desc:0 "The capital fuel silo is kept full and guarded against dust and fire."
 SFA_wd_silo_drawdown:0 "Fuel Released from the Silo"
 SFA_wd_silo_drawdown_desc:0 "Garrisons and patrol boats burn silo fuel on a season of manoeuvres."
 SFA_wd_decade_accounts:0 "Ten Years in Tables"
 SFA_wd_decade_accounts_desc:0 "A decade of national accounts, district by district, published in one volume."
 SFA_wd_district_tax_offices:0 "District Tax Offices"
 SFA_wd_district_tax_offices_desc:0 "Tax is assessed and collected in every district, not only in the plant districts."
 SFA_wd_district_report:0 "The Report to the Districts"
 SFA_wd_district_report_desc:0 "The government answers for its years in office in a volume sent to every district hall."
 SFA_wd_war_risk_pool:0 "State Cover for War Risks"
 SFA_wd_war_risk_pool_desc:0 "A state insurance pool covers coastal freighters whose private cover was cancelled."
 SFA_wd_manifest_checks:0 "Double Manifest Checks"
 SFA_wd_manifest_checks_desc:0 "Doubtful cargoes are held until their owners prove where they are going."
 SFA_wd_reopened_lanes:0 "Lanes Reopened to Usea"
 SFA_wd_reopened_lanes_desc:0 "Freight and insurance on Usean routes return to peacetime terms."
 SFA_wd_erusean_terms:0 "Trading on Erusean Terms"
 SFA_wd_erusean_terms_desc:0 "Cargo for Usea passes through ports and rules set by Erusea."
 ac_wd_sfa.1.t:0 "A Notice Due Again"
 ac_wd_sfa.1.d:0 "Every four years the election calendar of Sfaenland comes due, and every four years the National Administration prints the same notice for the district halls: the vote is postponed while the country remains on its readiness footing. The clerks have the new notice typeset and waiting. What has changed is that people now ask, loudly and in public, who decided that readiness and elections cannot live side by side.\n\nThe awkward part is arithmetic. The party whose name is printed on the government letterhead could fill one seat in every hundred. The national movement, which wants the readiness order kept and given to true believers, draws about as much support as everyone else combined. Nearly all the remainder would rather be governed by the officials and prefects they already know, without a campaign poster in sight. The Administration rules both camps and speaks for neither.\n\nThe Administration's lawyers have been asked what the readiness order really requires, and they want time to answer properly. Signing the notice now keeps everything as it was for four more years and spares the cabinet a hard argument. Holding it back until the opinion is ready signals that the question is open, and once a question is open in Sfaenland it rarely closes quietly.\n\nMod provenance: history/countries/SFA - Sfaenland.txt set_politics and set_popularities; the readiness order, the notice and every response are provisional gameplay."
 ac_wd_sfa.1.a:0 "Sign the notice as before."
 ac_wd_sfa.1.b:0 "Hold it until the lawyers report."
 ac_wd_sfa.2.t:0 "The Opinion on the Readiness Order"
 ac_wd_sfa.2.d:0 "The opinion arrives as forty typed pages and a two-page summary that every minister reads first. The readiness order, the lawyers find, was written to keep the garrisons, the fuel silo and the railway under one emergency authority. Nothing in its text mentions elections. The postponement came from a later instruction that cited the order without being part of it, and nobody since has asked whether that instruction still applies.\n\nIn legal terms the finding is modest. In political terms it is explosive. It means a vote could be held without touching readiness at all, which delights the small democratic camp and alarms almost everyone else. The movement reads it as proof that the Administration has been hiding behind paperwork. The prefects read it as a warning that their quiet arrangement is about to become a public quarrel.\n\nThe cabinet can let the opinion speak for itself in every district hall, with the full text pinned beside the old notices, or circulate it among the ministries while it decides what to do. Publication will make the next four years louder and more honest. Keeping it inside the ministries buys time, though secrets about the readiness order have a habit of reaching the garrison towns anyway.\n\nProvisional gameplay."
 ac_wd_sfa.2.a:0 "Pin the full text in every district hall."
 ac_wd_sfa.2.b:0 "Circulate it among the ministries only."
 ac_wd_sfa.3.t:0 "A Junction With No Town"
 ac_wd_sfa.3.d:0 "The wagon census comes back from the main line with a map that the transport ministry pins to its wall. Almost everything Sfaenland moves travels one route: from the Capital Centre out to the junction in District E, on through the dry hills of District C and down to the logistics centre in District B, with branches to the plants of District A and to the naval base in District G. If the junction closes, the country stops.\n\nThe junction itself surprises ministers who have never seen it. It is a set of points on a rainless plain, with a signal box, a water tower and no town of any kind. District E has no road network worth the name, and neither does District C, though the main line crosses both. Trains wait on the running line because no siding is long enough to hold them, and crews sleep in their cabs.\n\nThe census also shows that freight rates bear no relation to costs. Oil and steel trains subsidise empty passenger runs, and some wagons have not moved in a year. The figures would be gold to anyone who wanted to bid for the branches, and an embarrassment to the railway's managers. The ministry must decide whether to publish them or keep them for its own planning.\n\nProvisional gameplay."
 ac_wd_sfa.3.a:0 "Publish the traffic figures."
 ac_wd_sfa.3.b:0 "Keep them inside the ministry."
 ac_wd_sfa.4.t:0 "Fourteen Plants, Three Districts"
 ac_wd_sfa.4.d:0 "The inventory teams finish their tour of the Capital District and Districts A and B, where every civilian plant and every arms works in the country stands, together with every barrel of oil, ingot of aluminium and tonne of steel the country produces. Those three districts also hold every plot zoned for industry, and the teams did not find a single one of those plots standing empty.\n\nThe teams' report is blunt. Machines in the capital stand idle half the day for want of a second shift. District A, whose logistics centre stands on the Glaceland frontier, makes spare parts that District B needs and ships them the long way round by rail. None of this is a crisis. But there is no room to grow where the industry is, and the five districts with room have no industry at all.\n\nMinisters hear two answers in the same meeting. The plant managers want to squeeze more from what already stands: longer shifts, better tooling, fewer idle hours. The planners want to start building where the land is empty, beginning with the junction and the plain. Both answers cost money, and the treasury asks which one it is being asked to fund first.\n\nProvisional gameplay."
 ac_wd_sfa.4.a:0 "Squeeze the plants we have."
 ac_wd_sfa_4_a:0 "Squeeze the plants we have."
 ac_wd_sfa.4.b:0 "Look beyond the plant districts."
 ac_wd_sfa_4_b:0 "Look beyond the plant districts."
 ac_wd_sfa.5.t:0 "Beyond the Railhead"
 ac_wd_sfa.5.d:0 "The survey teams come back sunburnt and caked in mud. District D is nineteen provinces of open coastal plain with one real town, scattered farms and earth tracks that vanish for months in the wet season. Its coast runs up to Silvonia, and its people trade more with fishing boats than with the capital. Not one kilometre of railway reaches it, and the nearest station is a day away by truck in good weather.\n\nDistrict F is smaller and stranger. Four provinces of hills and desert lie at the point where Glaceland, Silvonia and Luremia all meet Sfaenland, and a road from the Luremian side brings traders and livestock to a market that nobody in the capital ever licensed. Herders cross the frontiers with the seasons. The district has no post office, no clinic and no garrison, and the surveyors were the first officials many villagers had met.\n\nBoth reports end with costed lists of roads, wells, classrooms and generators and no recommendation at all; the teams say the order of work is for ministers to settle. The plain has more people and more land. The desert corner has three frontiers and a trade nobody counts. Ministers are warned that whichever district waits will notice, and that the movement is already telling both of them that the capital has forgotten they exist.\n\nProvisional gameplay."
 ac_wd_sfa.5.a:0 "Start with the plain."
 ac_wd_sfa.5.b:0 "Start with the desert corner."
 ac_wd_sfa.6.t:0 "Three Hulls at the Quay"
 ac_wd_sfa.6.d:0 "The muster at the naval base in District G is finished in a single morning, because there is not much to muster. Two coastal escorts and one coastal submarine lie alongside the quay with their crews, a store of shells and torpedoes, and the three dockyards that built or repair them. This is the whole of the Maritime Service, and it answers for a coast that runs along five of the country's eight districts.\n\nThe inspectors write down what the hulls cannot do. The escorts can guard a coastal convoy or hunt a submarine, but not both on the same day. The submarine can watch one harbour mouth at a time. Sixty convoy hulls carry the country's oil, steel and grain along the coast every week, and none of their masters has been told what to do if a war began tomorrow. The yards can build one new hull at a time.\n\nOfficers at the base divide, as small navies always do, between those who would defend the trade and those who would make the coast dangerous to approach. Both camps agree that the service needs more than three hulls. Ministers ask the plainer question first: whether a country of this size should spend scarce money at sea at all.\n\nProvisional gameplay."
 ac_wd_sfa.6.a:0 "Keep the service and give it a plan."
 ac_wd_sfa.6.b:0 "Spend on the land first."
 ac_wd_sfa.7.t:0 "Six Formations Answer"
 ac_wd_sfa.7.d:0 "The roll call takes a week. In each of the three garrisons, at the Capital Centre and at the logistics centres of Districts A and B, two infantry formations parade with their six battalions and their engineer company, and inspectors count rifles, trucks, radios and spare boots. On paper the army is small but complete. On the parade ground it is smaller, because men on leave, men on courses and men who never reported all appear as gaps.\n\nThe map tells a different story from the parade ground. All six formations sit in three places, and two of those places stand on a frontier or a coast. Five of the eight districts have no garrison at all, including District F, where three frontiers meet, and District D, the largest district in the country. Reaching either in a hurry would take trucks the army can barely keep running and roads that do not exist.\n\nThe general staff sees three ways forward and argues over all of them: spread soldiers thinly into every district, keep them together and move them by rail, or make the most of the rough ground in the west. Each answer has its champions in the officer corps, and each has champions in the movement, which watches the army more closely than any other institution in the country.\n\nProvisional gameplay."
 ac_wd_sfa.7.a:0 "Publish the roll in full."
 ac_wd_sfa.7.b:0 "Keep the gaps between us."
 ac_wd_sfa.8.t:0 "One Field, One Target"
 ac_wd_sfa.8.d:0 "The air staff presents its count to the cabinet on a single sheet. Thirty-six fighters and twelve ground-attack aircraft fly from one air base beside the capital, with nine more fighters and four support aircraft in storage. There is one fuel store, one control tower, one runway and one repair hangar. In the wet months heavy rain closes the field for hours at a time, and on those days the whole air arm of Sfaenland sits on the ground.\n\nThe pilots are keen and the aircraft serviceable, but the staff's real worry is concentration. An air arm on one field can be shut down by weather, a fire in the fuel store or a single attack. The other seven districts have no runway of any kind. District E, beyond the junction, is dry and flat in every month of the year, and the air staff has already pencilled a site there on its maps.\n\nThen there is the question of purpose. One school would keep every fighter for the defence of the capital and the plant districts against anything that flies. Another would train the air arm with the army so that it fights alongside the garrisons. The budget cannot buy both, and ministers who know little about aircraft are being asked to choose between them.\n\nProvisional gameplay."
 ac_wd_sfa.8.a:0 "Survey the dispersal site now."
 ac_wd_sfa.8.b:0 "Make the one field work first."
 ac_wd_sfa.9.t:0 "Three Neighbours on the Map Table"
 ac_wd_sfa.9.d:0 "The crossing survey is finished, and its maps cover the cabinet table. Glaceland borders three districts, A, E and F, and the logistics centre in District A sits right on that line, with the Glacelandic yards just across it. Silvonia faces the coastal plain of District D and the hills of District F. Luremia touches only District F, where a desert road comes in from the Luremian side and herders follow it with the seasons.\n\nThe briefing is less concerned with old quarrels than with everyday traffic. Herders cross District F with the seasons, fishing boats from both sides share the waters off District D, and trucks queue for hours at the District A crossing because nobody has fixed when the posts open. Every incident so far has been settled by whichever officials happened to be on duty that day, with whatever paper they had to hand.\n\nNeighbours have their own governments and their own worries, and Sfaenland can only order its own side of each line. The survey team proposes to start there: posted rules, staffed crossings and published duties. The movement complains that this is weakness dressed up as procedure. The prefects reply that a frontier where everyone knows the rules is the cheapest garrison there is.\n\nProvisional gameplay."
 ac_wd_sfa.9.a:0 "Begin with the busiest crossing."
 ac_wd_sfa.9.b:0 "Begin with the three-frontier corner."
 ac_wd_sfa.10.t:0 "A War Read in Freight Rates"
 ac_wd_sfa.10.d:0 "At the end of March 1995 Belka is at war. Sfaenland lies a long way from that war and has no stake in it, and for a few days the news stays on the foreign pages. Then the costs arrive. Every shipping insurer sends a war-risk letter, fuel at the pumps goes up within the week, and buyers abroad who never answered Sfaenland's letters begin asking what its steel and aluminium would cost by the shipload.\n\nThe movement fills the capital's halls with rallies about readiness, warning that a world at war has no place for unready countries. The prefects worry more about the railway, which suddenly has more requests for oil and metal trains than it can run. Merchant captains ask the Maritime Service whether they should sail at all. Officials who expected a quiet decade find the whole economy reacting to a war nobody here chose.\n\nThe government has to decide what kind of neutral it will be. It can keep the railway, the ports and the frontier roads open to any cargo under the ordinary rules and take the fees, or it can refuse war cargo for every side and accept the cost. Either way the decision will be written into shipping papers that others will read, now and long after the war ends.\n\nProvisional gameplay: date anchor only, Official Chronicle row 1995 / 03.25 in tools/lore/chronicle.json; the Sfaenland response is gameplay."
 ac_wd_sfa.10.a:0 "Let the traders decide for now."
 ac_wd_sfa.10.b:0 "Prepare the customs service for checks."
 ac_wd_sfa.11.t:0 "A Fall Without a Place"
 ac_wd_sfa.11.d:0 "In the spring of 1996 the FCU president declares that the asteroid will strike the planet and that the federation is getting ready to fight it. With that statement the asteroid table in the capital of Sfaenland stops being a curiosity. Since the warning of December 1994 it has mostly read foreign bulletins aloud. Overnight every ministry wants a seat at it. Its members say at once that nobody can tell them where fragments will come down, or whether any will come near the country.\n\nWhat they can say is where the country is exposed. Almost every plant, every barrel of stored fuel and most of the population sit in three districts and along one railway. The single fuel silo is at the capital, the single air base beside it, and the junction that links everything lies on an open plain. The empty districts have room to spare but no roads, water or shelter for people who might need to go there.\n\nTwo plans reach the cabinet within a month. One would dig shelters beneath the capital and the plant districts and stock them for weeks. The other would plan to move people out into the open districts if a fall were predicted, using the surveys and the railway. The cabinet is told plainly that the country can afford one of these well, or both of them badly.\n\nProvisional gameplay: date anchors only, Official Chronicle rows 1994 / 12.10 and 1996 / 04.20 in tools/lore/chronicle.json; where fragments fall is not claimed and the Sfaenland response is gameplay."
 ac_wd_sfa.11.a:0 "Brief the districts in full."
 ac_wd_sfa.11.b:0 "Prepare quietly before speaking."
 ac_wd_sfa.12.t:0 "A Sky Everyone Watched"
 ac_wd_sfa.12.d:0 "The night of 8 July 1999 is the one Sfaenland has prepared for since the April announcement: Ulysses crosses the Roche limit and starts to fragment. The asteroid table keeps an open line to all eight district halls and to the observers on the cloudless hills of Districts C and E. Families listen to the radio bulletins, and in some streets they listen from the doorways of the new shelters, unsure whether to go in.\n\nThe preparations of three years are now judged by results rather than by plans. Shelters that flooded in the wet season, camp wells that herders had borrowed and fuel drums that went missing from the garrisons all appear in the reports by morning. So do the officials who stayed at their posts, the railwaymen who kept the junction open and the volunteers who went from door to door.\n\nBy dawn the table has to choose what the country will hear. A frank account of what worked and what failed will cost some reputations and improve the next emergency plan. A reassuring summary will calm the districts and leave the failures for the auditors to find later. The ministers who sat up all night are tired, and tired ministers lean toward reassurance.\n\nProvisional gameplay: date anchor only, Official Chronicle row 1999 / 07.08 in tools/lore/chronicle.json; no damage in Sfaenland is claimed and the response is gameplay."
 ac_wd_sfa.12.a:0 "Publish the frank account."
 ac_wd_sfa.12.b:0 "Issue a reassuring summary."
 ac_wd_sfa.13.t:0 "Numbers Everyone Can Read"
 ac_wd_sfa.13.d:0 "The first ten years of national accounts arrive as a thick volume with a thin summary. Output has grown modestly, public debt sits at around three tenths of it, and something like fifteen percent of assessed tax was never collected. The averages hide the districts. The three plant districts pay nearly all the tax and receive most of the spending, while the rest of the country appears in the tables mainly as columns of small numbers.\n\nThe volume is honest about the decade's choices. It shows what the railway cost and earned, what the plant districts gained or lost from the policies of the 1990s, and how much the Ulysses preparations consumed. It also shows money that cannot be traced: payments for works never built and allowances paid to officials who were not at their posts. Those pages are short, and everyone in the capital reads them first.\n\nThe government must now decide what the accounts are for. It can make them the basis of every budget, published each year with the same tables, so that future arguments start from shared numbers. Or it can treat them as a one-off report and return to old habits. The districts that appear only as small numbers are watching which choice is made.\n\nProvisional gameplay."
 ac_wd_sfa.13.a:0 "Publish the tables every year."
 ac_wd_sfa.13.b:0 "Treat it as a single report."
 ac_wd_sfa.14.t:0 "War Over Another Continent"
 ac_wd_sfa.14.d:0 "The founding of the ISAF in August 2003, after the FCU calls on Erusea to quit San Salvacion, turns a crisis over a seized country and its railguns into a coalition war across the Usean continent and its seas. Sfaenland stands outside it and expects to stay there. Its ministers have lived through something like this before; they send for the 1995 files and find the questions much the same, only larger.\n\nFreight insurers cancel policies on Usean routes and rewrite the rest. Fuel prices rise, and buyers once again ask about Sfaenland's steel, aluminium and oil. Reports of railguns turned against aircraft unsettle the air staff, whose fields suddenly seem very few. The movement holds rallies about readiness, and the frontier offices ask whether the cargo rules written in 1995 still apply to a war on another continent.\n\nThe government can apply its old answer, whatever it was, and let the Usean war run past the country. Or it can use the war to reopen questions it has avoided: how many aircraft, how many escorts, how much fuel in the silo. Ministers know that each of those questions has a price, and that the war gives them a reason to ask but not the money to answer.\n\nProvisional gameplay: date anchors only, Official Chronicle rows 2003 / SUMMER and 2003 / 08.22 in tools/lore/chronicle.json; fired only after the mod sets ac_ucw_isaf_formed; no Sfaenland part in the war is claimed."
 ac_wd_sfa.14.a:0 "Apply the 1995 rules again."
 ac_wd_sfa.14.b:0 "Reopen the defence questions."
 SFA_wd_district_chamber_office:0 "Cabinet of the Eight-District Chamber"
 SFA_wd_district_chamber_office_desc:0 "A cabinet chosen by a chamber elected from district lists under the drafted charter, governing collectively and answering to the chamber every week. Provisional gameplay office with no named holder."
 SFA_wd_prefect_council_office:0 "Standing Council of District Prefects"
 SFA_wd_prefect_council_office_desc:0 "The eight district prefects and the heads of the main ministries, sitting as a collective council that governs without parties and publishes its minutes. Provisional gameplay office with no named holder."
 SFA_wd_garrison_directorate_office:0 "Directorate of the Three Garrisons"
 SFA_wd_garrison_directorate_office_desc:0 "A directorate of national movement organisers and garrison officers that governs by decree under the readiness order. Provisional gameplay office with no named holder."
 ac_wd_sfa_decisions:0 "Sfaenland: National Measures"
 ac_wd_sfa_decisions_desc:0 "Measures from the national programme of Sfaenland. Provisional gameplay unless a source ledger row says otherwise."
 SFA_wd_track_gang_decision:0 "A Dry-Month Track Gang for District F"
 SFA_wd_track_gang_decision_desc:0 "Pay a gang of labourers to grade and gravel the District F track in the drier months, once the off-line survey exists; a single season of work."
 SFA_wd_night_freight_decision:0 "Run Night Freight Through the Junction"
 SFA_wd_night_freight_decision_desc:0 "Keep a signalman on duty at the junction every night for six months so oil and metal trains can move after dark. Renewable once a year."
 SFA_wd_silo_draw_decision:0 "Draw Fuel from the Capital Silo"
 SFA_wd_silo_draw_decision_desc:0 "Open the sealed silo to garrisons and patrol boats for one season of manoeuvres; refilling it takes most of a year."
 SFA_wd_coast_weekend_decision:0 "A Coast-Watch Weekend"
 SFA_wd_coast_weekend_decision_desc:0 "Turn out the coast watchers and the Maritime Service for two days of sighting and reporting drills. Possible once a year."
 SFA_wd_petition_days_decision:0 "Petition Days at the District Halls"
 SFA_wd_petition_days_decision_desc:0 "Open every district hall for a week of petitions heard by senior officials, once the residents rolls exist; a single gesture."
 SFA_wd_march_to_plain_decision:0 "March a Formation Across District D"
 SFA_wd_march_to_plain_decision_desc:0 "Send one formation marching across the District D plain to show itself and to test the motor pool. Possible once a year."
