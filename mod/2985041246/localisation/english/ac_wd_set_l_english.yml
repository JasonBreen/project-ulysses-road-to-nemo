l_english:
 SET_wd_fed_open_files:0 "Open the Administration Files"
 SET_wd_fed_open_files_desc:0 "The National Administration governs all five districts from one office in the capital, under a democratic label that roughly one voter in a hundred supports. Opening its files on budgets, appointments and district spending is the cheapest way to start an honest argument about who should govern, and the surest way to end a quiet life for the officials who keep them."
 SET_wd_fed_district_roll:0 "A Roll of the Five Districts"
 SET_wd_fed_district_roll_desc:0 "Clerks list what each district pays in taxes and receives in roads, schools and wages: the crowded Capital District, the mountains of District B, the port in District A, the coast of District D and the empty hills of District E. The roll embarrasses the capital and arms every district notable with figures. No settlement of the federation can be written without it."
 SET_wd_fed_hearings:0 "Hearings in Every District Hall"
 SET_wd_fed_hearings_desc:0 "Before deciding anything, the Administration sends a panel of officials to hear petitions in each district. The movement fills the halls of District B and the capital plants, merchants and administrators dominate the port, and District E sends herders who have never met a minister. The hearings cost months and patience, and they show the government a country it has not been listening to."
 SET_wd_fed_question:0 "What the Federation Means"
 SET_wd_fed_question_desc:0 "The country calls itself a federation, yet nothing in the way it is governed gives the districts a voice of their own. The Administration must now decide how that word will be filled: by restoring a ballot district by district, by appointing professional prefects to run them, or by bringing the movement that polls half the country into government on agreed terms."
 SET_wd_fed_question_tt_1:0 "Opens three political paths; only one can be taken."
 SET_wd_fed_path_ballot:0 "Return the Ballot to the Districts"
 SET_wd_fed_path_ballot_desc:0 "The democratic answer restores the vote, district by district, with a federal council elected on district lists. It honours the name printed on every passport. It also hands an election to a party that one voter in a hundred supports, facing a movement that half the country follows. The Administration accepts in advance that it may lose what it has run for years."
 SET_wd_fed_path_prefects:0 "Prefects Instead of Parties"
 SET_wd_fed_path_prefects_desc:0 "The administrators' answer keeps the ballot suspended and gives each district a career prefect who answers to a board in the capital. Budgets are published, appointments are made by examination and parties have no seats. It suits the forty-eight in a hundred who already trust the Administration, and it gives the other half of the country nothing to vote for and an obvious target."
 SET_wd_fed_path_movement:0 "Terms for the Majority Movement"
 SET_wd_fed_path_movement_desc:0 "The third answer invites the movement that polls half the country to name a government on written terms: no change to any frontier, a defensive service and district courts left alone. Its organisers promise discipline and an end to rule by file. The Administration would be handing power to a movement whose programme fits on a poster, and trusting a sheet of paper to hold it."
 SET_wd_fed_seat_council:0 "Seat the Federal Council"
 SET_wd_fed_seat_council_desc:0 "District lists go to the polls, and the council they elect takes the seals of government from the National Administration. It governs collectively, publishes its budget a season before voting it and must face the voters again on a fixed calendar. The change runs through the office, not a person, and the council inherits a country in which its own supporters are few."
 SET_wd_fed_seat_prefects:0 "Install the Board of Prefects"
 SET_wd_fed_seat_prefects_desc:0 "Five prefects, one for each district, take their posts by examination, and a board in the capital chaired by a senior administrator holds the seals. The ballot stays suspended. Orders are numbered, dated and printed in every district hall. The board is competent, slow to anger and slow to change, and its legitimacy rests entirely on keeping everything working."
 SET_wd_fed_seat_movement:0 "Seals for the Movement Committee"
 SET_wd_fed_seat_movement_desc:0 "The movement names an executive committee and takes the seals of government under its written terms. Other parties are suspended, the press works under licence and the country is governed by numbered decree. The committee promises calm in the districts and a stronger service at home. The terms are all that stands between those promises and whatever the committee decides to do next."
 SET_wd_fed_district_budgets:0 "Budgets for District Councils"
 SET_wd_fed_district_budgets_desc:0 "The federal council gives each district an elected council and a budget line of its own for roads, schools and clinics, drawn from the figures on the district roll. The capital keeps the service, the railway, foreign affairs and the currency. District E receives more than it pays and the capital pays more than it receives, which the capital's voters notice at once."
 SET_wd_fed_prefect_circuit:0 "The Prefects Inspect in Spring"
 SET_wd_fed_prefect_circuit_desc:0 "Each spring the five prefects travel their districts on a fixed route, inspecting tax offices, road works and schools and printing what they find. The circuit ends the old habit of sending only good news to the capital. It costs salaries, train time and goodwill among local notables, who dislike being inspected by officials they never chose."
 SET_wd_fed_movement_marches:0 "Marches by Licence Only"
 SET_wd_fed_movement_marches_desc:0 "The committee licenses every public meeting and march, its own included, and posts stewards around the Capital Centre on market days. The streets go quiet and the movement's rallies get the best squares. Opponents meet in back rooms and kitchens. The calm is real and measurable, and it has been bought by telling half the country to stay at home."
 SET_wd_fed_settlement:0 "A Settlement Written Down"
 SET_wd_fed_settlement_desc:0 "Whichever order now governs, its arrangements are gathered into one printed settlement: who appoints whom, what each district controls, how the budget passes and how the order itself may be changed. Writing it down costs every faction some ambiguity it liked. It also lets later governments argue about the wording instead of the foundations."
 SET_wd_spine_walk:0 "Walk the Spine from Pass to Port"
 SET_wd_spine_walk_desc:0 "Railway engineers walk every metre of the national line: north from the Capital Centre across the plain and up the mountain grade to the Logistics Centre, south to the naval base in District A, and along the coast into District D. Their notebooks will decide where the next decade's money goes. The walk takes a season and cancels two freight trains a week while it lasts."
 SET_wd_spine_junction:0 "Junction Yards at the Capital Centre"
 SET_wd_spine_junction_desc:0 "Nearly every train in the country passes through the Capital Centre, and its yard was laid out for a timetable that no longer exists. New sidings, a turntable and a second platform let northbound and southbound traffic pass without waiting. The work closes the yard at weekends through a summer of mud and heat, and the plants lose deliveries while it lasts."
 SET_wd_spine_snow_sheds:0 "Snow Sheds on the Northern Grade"
 SET_wd_spine_snow_sheds_desc:0 "Where the line climbs into the mountains of District B, drifts close the cuttings in a single night and blizzards halt the trains for days. Timber and concrete sheds over the worst cuttings keep the track open through the winter. They are costly, ugly and need repairs every spring, and they decide whether the Logistics Centre can be supplied in January."
 SET_wd_spine_embankments:0 "Raise the Plain Embankments"
 SET_wd_spine_embankments_desc:0 "On the capital plain the rain falls for half the year and the embankments soften under loaded wagons. Raising and draining them is plain earthwork, done with shovels and borrowed army lorries. It is the least glamorous project the railway office has ever proposed, and the one most likely to keep the spine running through a long wet season."
 SET_wd_spine_coast_ballast:0 "Ballast for the Coast Line"
 SET_wd_spine_coast_ballast_desc:0 "The limb from the southern port into District D runs along the forest coast, close enough to the sea that storms wash out its ballast. New stone, culverts and a sea wall at the worst bends keep freight moving between the port and the plants of District D. The quarries are inland, so the stone must travel by the line it is meant to protect."
 SET_wd_spine_public_line:0 "Keep the Line in Public Hands"
 SET_wd_spine_public_line_desc:0 "The railway office proposes that the state own the track, the trains and the timetable together, paying for repairs from the national budget. Every district would pay the same fares and the service would get the trains it needs at a day's notice. The budget carries the losses, and the railway office becomes the largest employer in the country."
 SET_wd_spine_lease_trains:0 "Lease the Trains, Keep the Track"
 SET_wd_spine_lease_trains_desc:0 "The alternative keeps the track public and leases the trains to operators, who pay a fee for each path they run. The fees go straight into repairs, and the operators chase freight the state never bothered with. Fares rise on quiet lines, and the service must bargain for its trains like any other customer when it needs them."
 SET_wd_spine_wagon_works:0 "Wagon Orders for the Capital Shops"
 SET_wd_spine_wagon_works_desc:0 "With the whole railway in public hands, the capital's plants receive a standing order for wagons, brake gear and spare wheels. The order keeps two shops busy for years and trains a generation of fitters. It also ties the plants to a single customer who pays slowly, and the treasury warns that the order will be the first thing cut in a bad year."
 SET_wd_spine_track_fund:0 "A Track Fund from the Fees"
 SET_wd_spine_track_fund_desc:0 "Operators' fees go into a separate track fund that the railway office may spend on nothing else. The first years pay for new sleepers and signals at the capital end of the line. The fund is small and closely guarded, and it makes the leased railway popular with engineers and unpopular with ministers who would like to borrow from it."
 SET_wd_spine_crisis_timetable:0 "Mobilisation by the Timetable"
 SET_wd_spine_crisis_timetable_desc:0 "The railway office and the general staff write one timetable for a crisis: which trains move which formation, from which yard, in how many hours. Every station master holds a sealed copy. Exercises run twice a year and delay freight each time. The spine becomes the country's real defence plan, because it is the only way to move three formations quickly."
 SET_wd_east_survey:0 "Send Surveyors into District E"
 SET_wd_east_survey_desc:0 "District E is the largest stretch of open ground in Seterano and the least known: three hill provinces along the eastern frontier and a dry inland province where the wells are far apart. It has no road, no railway and no factory. A survey party with lorries, maps and a radio is the first step, and the first lorry to come back late is the first price."
 SET_wd_east_graded_track:0 "A Graded Track from the Capital"
 SET_wd_east_graded_track_desc:0 "A graded and ditched track from the capital plain across the dry ground to the eastern hills gives District E its first route a lorry can use in most months. It is gravel, not asphalt, and snow still closes it in deep winter. It brings doctors, teachers and buyers within a day of the capital for the first time in anyone's memory."
 SET_wd_east_markets:0 "Stalls and Scales for the Hill Markets"
 SET_wd_east_markets_desc:0 "On the hill market days, Seteranoan herders and visitors from over the eastern frontier already trade wool, grain and tools with little paperwork. The district hires market wardens, buys honest scales and seats a customs clerk at a table rather than behind a barrier. Trade rises and stays visible. Some regulars, used to no paperwork at all, take their business somewhere quieter."
 SET_wd_east_wells:0 "Wells on the Dry Ground"
 SET_wd_east_wells_desc:0 "The inland province of District E is dry ground where grass gives out by midsummer and herders walk for days between water. Drilling crews from the capital sink deep wells along the new track and cap them against the winter frost. The wells cost more than they earn, and they decide whether anyone can live beside the track rather than merely travel along it."
 SET_wd_east_factory_district:0 "Plants for the Eastern Hills"
 SET_wd_east_factory_district_desc:0 "The planners propose that District E take the plants the crowded capital cannot hold: two civilian works beside the new track, with housing for their crews. The district would change faster than any other in the country. Herders would lose pasture, the track would need upgrading at once and the hill markets would become a factory town's shops."
 SET_wd_east_market_district:0 "Keep the East for Fairs and Herds"
 SET_wd_east_market_district_desc:0 "The opposite plan keeps District E a district of pasture and markets, spending on roads, wells and fairs instead of plants. Change comes slowly and the district stays poorer than the others for longer. Its people keep their land, the frontier trade grows in the open, and the capital's industrial planners must look for ground somewhere else."
 SET_wd_east_arms_hall:0 "An Arms Hall Behind the Hills"
 SET_wd_east_arms_hall_desc:0 "With civilian works already standing in District E, the planners add one arms hall behind the hills, away from every coast and close to no city. It gives the service a plant outside the capital and spreads the country's few arms lines across more ground. The district gains wages and loses the last of its quiet to the night shift."
 SET_wd_east_landing:0 "A Landing on the Eastern Shore"
 SET_wd_east_landing_desc:0 "District E reaches the sea beside the frontier, where a beach and a few boats serve the coast villages. A small yard and a stone landing let fishing boats and coasters work through the season and give the fairs a sea route to the southern port. It is a modest yard that will never build a warship, and the port firms resent it all the same."
 SET_wd_east_shore_road:0 "A Road Down to the Eastern Shore"
 SET_wd_east_shore_road_desc:0 "The last piece of the plan is a road from the graded track down through the hills to the shore beside the frontier, with bridges over the spring torrents. It joins the coast villages to the rest of the country and gives the eastern frontier a route that does not depend on the snow. District E finally appears on the national road map as an unbroken line."
 SET_wd_works_count:0 "Count Every Furnace and Lathe"
 SET_wd_works_count_desc:0 "Seterano has ten plants: two civilian and two arms works crowding the Capital District, two civilian works and one arms works in the mountains of District B, and one civilian and two arms works on the coast of District D. Inspectors count every furnace, lathe and idle shift. The count annoys managers and costs a season, and it is the only honest place to start."
 SET_wd_works_double_shifts:0 "Two Shifts on the Full Ground"
 SET_wd_works_double_shifts_desc:0 "The capital's plants stand on every metre of usable ground the district has, so the only way to make more there is to work longer. A second shift on the main lines, with a night bus and a canteen, raises output without a single new wall. Workers earn more and sleep less, and the plain's hot summers make the night shift the popular one."
 SET_wd_works_light_metal:0 "Light Metal from Three Districts"
 SET_wd_works_light_metal_desc:0 "The country digs more light metal ore than its own plants can use, from the capital plain, the mountains and the coast of District D, and most of it leaves raw. A geological office maps the deposits properly and tests what could be smelted at home if power and furnaces allowed. The survey is cheap; acting on it will not be."
 SET_wd_works_service_lines:0 "The Service Comes First"
 SET_wd_works_service_lines_desc:0 "The first model puts the ten plants behind the service: rifles, lorries, support kit and spares for the twelve fighters before anything for the shops. It matches the budget the country already keeps and the six frontiers it has to watch. Shops stay thin, and the plants depend on one customer whose orders follow the political weather."
 SET_wd_works_metal_exports:0 "Plate and Ore for Buyers Abroad"
 SET_wd_works_metal_exports_desc:0 "The second model sells what the ground gives: steel plate and light metal ore to foreign buyers, with the earnings spent on machine tools. It suits a country with more ore than furnaces. It also ties the plants to world prices that a war on the far side of the oceans can double or halve in a month, and the service waits behind every export order."
 SET_wd_works_district_goods:0 "Goods for the Five Districts"
 SET_wd_works_district_goods_desc:0 "The third model turns the civilian works toward stoves, pumps, bicycles and radios for the districts, with excise relief for the first years. Shops fill in District E and the mountain towns for the first time. The service gets less and later, the treasury loses revenue, and the plant managers must learn to sell rather than simply deliver."
 SET_wd_works_mountain_arsenal:0 "An Arms Hall at the Mountain Works"
 SET_wd_works_mountain_arsenal_desc:0 "District B has one free plot left beside its mountain works, close to the end of the railway and the Logistics Centre. An arms hall there puts production near the formation that would need it first. Winters will cost shifts and every ton of steel must climb the northern grade, but the service gains a second arms centre outside the capital."
 SET_wd_works_rolling_mill:0 "A Rolling Mill in District D"
 SET_wd_works_rolling_mill_desc:0 "District D's last free plot goes to a rolling mill that turns raw steel into finished plate and section before it leaves by sea. The country sells more value and less ore, and the coast limb of the railway gets steady freight. The mill needs more power than the coast can spare, and it will run short shifts until a new line is strung."
 SET_wd_works_goods_hall:0 "A Goods Hall in the Mountain Towns"
 SET_wd_works_goods_hall_desc:0 "The mountain towns of District B have the country's coldest winters and its emptiest shops. A goods hall on the last free plot beside the mountain works makes stoves, boots and radios where they are needed most, without hauling them up the northern grade. It is a modest plant, popular in the towns and doubted by planners who wanted that plot for arms."
 SET_wd_works_spares:0 "Spares Before New Equipment"
 SET_wd_works_spares_desc:0 "Whatever the plants now make first, the research office sets one rule above it: spares, replacement parts and repair kits come before new designs. It fits a small service that must keep old equipment working for years. Engineers grumble about drawings that never leave the office, while lorries, rifles and the twelve fighters stay in service longer."
 SET_wd_port_muster:0 "The Whole Navy on the Quay"
 SET_wd_port_muster_desc:0 "The Maritime Service is one coastal escort, its crew and the naval base in District A, with two slipways beside it that build convoy hulls when steel allows. Mustering it in public, with families on the quay, tells the port that the country remembers it has a coast. It also shows every visitor exactly how small the navy is."
 SET_wd_port_charts:0 "Charts of the Forest Coast"
 SET_wd_port_charts_desc:0 "The southern coast is forest down to the waterline, with shoals that the old charts place in the wrong spots. A survey launch and two seasons of soundings produce charts the merchant masters can trust. The work is slow and the launch is the escort's only companion at sea. The new charts are sold cheaply to every hull that asks, foreign ones included."
 SET_wd_port_coast_radar:0 "A Radar Mast over the Port"
 SET_wd_port_coast_radar_desc:0 "A radar mast on the hills above the naval base watches the approaches to the port and the forest coast on either side. It is the only electronic eye the Maritime Service owns. Its crew sleep in a hut at the top of the hill, and the first winter proves that the mud road up to it needs as much care as the set itself."
 SET_wd_port_listening:0 "Hydrophones After the Cinigrad Notice"
 SET_wd_port_listening_desc:0 "In September 1991 Yuktobania announces a new class of submarine at a political convention in Cinigrad. Seterano has no quarrel with anyone at sea, and its one escort could not hunt a submarine if it found one. The service still asks for hydrophones laid along the newly charted shoals, so that it at least knows what passes. The request is cheap, quiet and a little embarrassing."
 SET_wd_port_second_escort:0 "A Second Escort from the Slipways"
 SET_wd_port_second_escort_desc:0 "The service's officers get their way: the slipways in District A are lengthened, a building hall rises beside them and a second escort is laid down. The navy doubles in size on paper. The steel comes from plants that would otherwise make lorries, and the port firms lose the slipway time they had counted on for coasters."
 SET_wd_port_coasters:0 "Coasters Before Warships"
 SET_wd_port_coasters_desc:0 "The port firms get their way instead: the slipways build small coasters to carry steel, timber and grain between the southern port, District D and foreign harbours, and a goods shed and repair works rise beside the yard. The escort sails alone for years more. The country gains trade, and the officers gain a grievance they will repeat at every budget."
 SET_wd_port_hull_register:0 "A Register of Sixty Hulls"
 SET_wd_port_hull_register_desc:0 "Sixty merchant hulls fly the national flag, most of them small and owned by firms in the port. A register in the harbour office records each one's master, route, cargo and radio, and sends out warnings of storms and trouble. Owners complain about paperwork. When the sea lanes turn dangerous, the register will be the only way to know where every crew is."
 SET_wd_port_cranes:0 "New Cranes for the Southern Yard"
 SET_wd_port_cranes_desc:0 "Whichever hulls the yard builds, its cranes are older than its foremen. Two modern travelling cranes and a covered fitting-out berth let the yard work through the rainy season and handle larger sections. The cranes come from abroad and are paid for over ten years. The yard becomes a place where hulls are built, not merely assembled."
 SET_wd_port_seamanship:0 "A Seamanship School at the Base"
 SET_wd_port_seamanship_desc:0 "The base opens a seamanship school for escort crews, merchant officers and harbour pilots, taught by the service's few senior sailors. Merchant cadets pay fees and escort crews do not. The school spreads the navy's habits into the merchant fleet and gives the service a way to find recruits beyond the port's own families."
 SET_wd_guard_inspection:0 "Inspect the Three Formations"
 SET_wd_guard_inspection_desc:0 "The army is three infantry formations, every one built from six battalions and a company of engineers, with two based at the Capital Centre and one at the Logistics Centre in the mountains. An autumn inspection measures their kit, their training and their lorries against six land frontiers and two climates. The answers will be uncomfortable, and the general staff asks for them anyway."
 SET_wd_guard_lorry_pool:0 "A Common Pool for the Lorries"
 SET_wd_guard_lorry_pool_desc:0 "The formations hold several hundred lorries between them, each battalion keeping its own in its own way and repairing them when someone has time. A common pool at each Centre, with fitters, a parts store and a duty roster, keeps more of them running. Battalion commanders lose control of their own transport and complain loudly until the day they need it."
 SET_wd_guard_engineers_lent:0 "Engineers on the Eastern Track"
 SET_wd_guard_engineers_lent_desc:0 "Each formation has an engineer company that spends most of its time waiting for a war. Lending the companies to District E for a summer, building culverts and bridges on the new track, trains them on real ground and saves the road budget. The formations go without their engineers for months, and commanders worry about what happens if they are needed elsewhere."
 SET_wd_guard_mountain_weight:0 "Weight on the Mountain Frontier"
 SET_wd_guard_mountain_weight_desc:0 "The first doctrine puts the army's weight in District B, where all six frontiers run and a few trained companies can hold a pass. A second formation moves up the northern grade to winter quarters at the Logistics Centre. The capital keeps one formation and the railway, and the mountain towns gain soldiers, noise and custom."
 SET_wd_guard_plain_weight:0 "Hold the Centre on the Plain"
 SET_wd_guard_plain_weight_desc:0 "The second doctrine keeps two formations on the capital plain near the junction yards and trusts the railway to carry them north, south or east in hours. The mountains keep one formation, and the passes are watched rather than held. It is cheaper and faster on paper, and it depends entirely on trains running through the snow."
 SET_wd_guard_ski_companies:0 "Ski Companies for the Blizzard Months"
 SET_wd_guard_ski_companies_desc:0 "Seteranoan soldiers already learn mountain craft, but few can move on skis in a blizzard. Each battalion in the mountains trains one company to ski, live in snow shelters and carry its own supplies for a week. Injuries in training are frequent and reported in every paper. The companies become the army's pride and its most expensive soldiers per head."
 SET_wd_guard_trains_in_steam:0 "Two Trains Kept in Steam"
 SET_wd_guard_trains_in_steam_desc:0 "Two complete trains, with flat wagons for lorries and coaches for a battalion, stand ready at the capital yard with their crews on call. Freight loses the stock and the railway loses revenue. In exchange a battalion can be on the northern grade or at the southern port within hours of an order, whatever the weather is doing on the plain."
 SET_wd_guard_district_rolls:0 "District Rolls of Former Soldiers"
 SET_wd_guard_district_rolls_desc:0 "Everyone who has served is entered on a reserve roll in their own district, with an address, a trade and a depot to report to. The rolls let three formations become six in a crisis, at least on paper. Keeping them current costs clerks and postage every year, and employers dislike losing workers to the annual muster."
 SET_wd_guard_two_climates:0 "An Exercise in Two Climates"
 SET_wd_guard_two_climates_desc:0 "For one week in winter and one in the wet season, all three formations move to their crisis positions by the timetable, through snow in the mountains and mud on the plain. Umpires mark every delay. The exercises cost fuel, freight and two weeks of plant shifts, and they show what the doctrine chosen years earlier actually delivers."
 SET_wd_sky_runway:0 "A Longer Runway on the Plain"
 SET_wd_sky_runway_desc:0 "The country's twelve fighters fly from a single field at the capital, with a runway laid for older aircraft and drains that fail every wet season. Lengthening and draining it, and adding dispersal pads, lets the squadron fly in most weather and receive larger aircraft. Contractors must work around the squadron's own flying, which slows everything down."
 SET_wd_sky_forecasters:0 "Forecasters at the Capital Field"
 SET_wd_sky_forecasters_desc:0 "Pilots at the capital fly between two climates: blizzards over the northern mountains and eastern hills, heavy rain and heat over the plain and the coast. A forecasting room at the field, with observers telephoning from the Logistics Centre and the port, gives the squadron a forecast it can plan on. Farmers and the railway use the forecasts too."
 SET_wd_sky_north_radar:0 "Radar Above the Northern Passes"
 SET_wd_sky_north_radar_desc:0 "A radar on the high ground of District B looks out over most of the six frontiers at once. It is the most useful single piece of equipment the air arm could buy and the hardest to keep running: the road to it closes in winter and its crew must be supplied by sledge. Neighbours will notice it, and the foreign office prepares an explanation."
 SET_wd_sky_alert_flight:0 "A Flight on Standing Alert"
 SET_wd_sky_alert_flight_desc:0 "The first plan keeps four of the twelve fighters armed and crewed on the capital field day and night, ready to meet anything that crosses a frontier without permission. Pilots train for interception and little else. The alert burns fuel, airframe hours and sleep, and it makes the air arm a small but believable guard over a small country."
 SET_wd_sky_liaison:0 "Liaison Flights over the Districts"
 SET_wd_sky_liaison_desc:0 "The second plan makes the squadron the government's fastest messenger: carrying officials, doctors and mail to District E and the mountain towns, flying weather and frontier reconnaissance and training pilots to land on rough strips. Interception skills fade. The air arm becomes useful every week instead of ready for one bad day."
 SET_wd_sky_mountain_strip:0 "A Winter Strip at the Logistics Centre"
 SET_wd_sky_mountain_strip_desc:0 "With the army's weight now in the mountains, the air arm lays a short strip beside the Logistics Centre, with a heated hangar for two aircraft and a snow plough of its own. It is the first airfield outside the capital. Pilots dread its crosswinds, and the formation at the Centre finally has aircraft within reach in winter."
 SET_wd_sky_plain_fields:0 "Dispersal Fields on the Capital Plain"
 SET_wd_sky_plain_fields_desc:0 "With the army holding the plain, the air arm spreads its aircraft across grass fields beside the railway near the capital, each with fuel, a radio and a guard. A single strike could no longer catch the whole squadron on one runway. The fields flood in the wet season and need drains, and the farmers who own them want rent."
 SET_wd_sky_instructors:0 "Instructors from the Squadron"
 SET_wd_sky_instructors_desc:0 "The squadron's senior pilots become instructors for a flying course that takes cadets from the capital's schools. Two trainers are bought abroad and the course runs through the dry months. Front-line flying drops while the instructors teach. In five years the air arm will have pilots it trained itself, and a reason to ask for more than twelve aircraft."
 SET_wd_six_map:0 "Map the Six Frontiers"
 SET_wd_six_map_desc:0 "Seterano has six land neighbours, and every one of their frontiers runs through the mountains of District B: Slavia, Valka and Malynea meet near the Logistics Centre in the west, Baltica and Yuktobania touch the north-east, and Azbekerania runs down the eastern side to the coast of District E. The foreign office maps every crossing, path and post on its own side. No line moves."
 SET_wd_six_huts:0 "Rescue Huts on the High Passes"
 SET_wd_six_huts_desc:0 "The passes of District B close for much of the winter, and travellers caught by blizzards depend on whoever reaches them first. Rescue huts with stoves, blankets and a radio on each Seteranoan approach, and a volunteer team at the Logistics Centre, answer calls from either side of the line. The huts cost little and must be restocked by mule every autumn."
 SET_wd_six_yuk_corner:0 "The Province Facing Yuktobania"
 SET_wd_six_yuk_corner_desc:0 "In the far north-east of District B a single mountain province touches Yuktobania, a country many times Seterano's size, as well as Baltica and Azbekerania. An observation post there, staffed in shifts from the Logistics Centre, reports weather, aircraft and traffic and says nothing to anyone across the line. The post is lonely, and nobody volunteers twice."
 SET_wd_six_fair_passes:0 "Fair Passes for Eastern Traders"
 SET_wd_six_fair_passes_desc:0 "Since District E chose fairs over factories, traders from across the eastern frontier come in larger numbers. A seasonal pass, issued at the fair grounds for a small fee and valid only on fair days, replaces the old habit of no paperwork with a little. Regulars grumble, then buy one. The customs office finally learns how much trade crosses the hills."
 SET_wd_six_neutral_ground:0 "Neutral Ground in the Mountains"
 SET_wd_six_neutral_ground_desc:0 "The first posture declares that Seterano will join no bloc, host no foreign troops and offer its mountains as neutral ground for talks between any neighbours who want them. A guesthouse at the Logistics Centre is set aside for the purpose. Nobody may ever use it. The declaration costs nothing but freedom of action, and that is the point of it."
 SET_wd_six_small_neighbours:0 "Practical Talks Across the Passes"
 SET_wd_six_small_neighbours_desc:0 "The second posture offers every neighbour except Yuktobania regular practical talks on crossings, weather, avalanches and freight, with no treaty and no common army. Whether anyone comes is their decision. Seterano keeps a chair at the table and a clerk to take notes, and assumes the largest neighbour will read the minutes."
 SET_wd_six_counted_crossings:0 "Count Every Crossing"
 SET_wd_six_counted_crossings_desc:0 "The third posture closes every unofficial path and funnels all traffic through staffed crossings that record each traveller and each load. Smuggling falls, and so does the frontier trade of the mountain and hill towns. The army takes over the posts in winter. The country knows exactly who enters, and its neighbours learn that Seterano is watching its doors."
 SET_wd_six_western_road:0 "The Road West Across the Plain"
 SET_wd_six_western_road_desc:0 "The capital district's plain runs west to the Slavian frontier, where the old road narrows to a cart track at the last village. Rebuilding it as a proper highway with a staffed crossing opens the plain's markets to the west. It suits an open posture and costs a summer of roadworks in the heat. What happens on the far side is for Slavia to decide."
 SET_wd_six_winter_posts:0 "Winter Posts on Every Path"
 SET_wd_six_winter_posts_desc:0 "Counting crossings means staffing them in January, when the paths of District B lie under snow and the posts are cut off for days. Heated posts with radios, stores and a road kept open to each one turn a summer policy into a year-round one. The army supplies the men and the railway office the snow ploughs, and both send the bill to the foreign office."
 SET_wd_uly_notice:0 "The Astronomers Notice on the Radio"
 SET_wd_uly_notice_desc:0 "In December 1994 astronomers warn the world that the asteroid called Ulysses is on a course near the Earth and could collide with it. The notice reaches Seterano as a paragraph on the evening radio. Within a week every district is writing to the capital to ask what the government means to do. A plain answer costs little now, and silence will cost more later."
 SET_wd_uly_cellars:0 "Count the Cellars of the Capital Plain"
 SET_wd_uly_cellars_desc:0 "The capital plain has soft ground and no rock to tunnel, so its shelters would be its cellars. Wardens walk every street of the Capital Centre and the plant districts, recording each cellar's size, depth and door. Owners resent the visits, and the count shows that half the city has nowhere safe to go. That figure must be known before anything is built."
 SET_wd_uly_rock_bores:0 "Test Bores in the Northern Rock"
 SET_wd_uly_rock_bores_desc:0 "The mountains of District B are solid rock, and the railway's tunnel gangs already know how to cut it. Test bores near the Logistics Centre and the mountain towns show where galleries could be driven quickly and kept dry. The bores cost little and frighten some villagers, who assume the government knows something it is not telling them."
 SET_wd_uly_impact_declared:0 "When the Impact Is Declared"
 SET_wd_uly_impact_declared_desc:0 "In April 1996 the Federation of Central Usea announces to the world that Ulysses will strike the Earth and sets out its plans to counter it. Nobody can say where the fragments will fall. In Seterano the question stops being whether to prepare and becomes how, and with what, and the two climates and two kinds of ground still point to different answers."
 SET_wd_uly_galleries:0 "Galleries Under the Northern Rock"
 SET_wd_uly_galleries_desc:0 "The first plan drives shelter galleries into the rock of District B and moves the country's reserves of grain, fuel and records into them, with trains ready to carry families north from the plain. The mountains become the country's refuge. It is the stronger shelter and the longer journey, and families on the plain wonder whether the trains would really come."
 SET_wd_uly_plain_cellars:0 "Strengthened Cellars Across the Plain"
 SET_wd_uly_plain_cellars_desc:0 "The second plan shelters people where they live: cellars across the Capital District, District A and District D are deepened, propped and stocked, with public shelters dug where the count found none. Nobody has to travel. The shelters are weaker than rock and the soft ground floods in the wet season, so pumps and drains are written into every contract."
 SET_wd_uly_stores:0 "Stores for a Hungry Year"
 SET_wd_uly_stores_desc:0 "Whatever shelters the country chooses, it needs food, fuel and medicine for a year in which harvests and imports might fail. Warehouses at both Centres and at the southern port are filled slowly from the market to avoid raising prices. The stocks tie up money and spoil if forgotten, and they are the difference between a hard year and a famine."
 SET_wd_uly_roche:0 "A Night Inside the Roche Limit"
 SET_wd_uly_roche_desc:0 "In July 1999 Ulysses passes within the distance at which the Earth's pull breaks it apart. Seterano holds its trains, opens its shelters and keeps its wardens on the streets through a long summer night. Nobody knows where the fragments will come down. Five years of preparation are tested by a single night of waiting by the radio."
 SET_wd_fuel_news:0 "War in Belka, Prices at Home"
 SET_wd_fuel_news_desc:0 "In March 1995 war breaks out around Belka, far from Seterano and with no Seteranoan part in it. The war arrives anyway through the price of crude and the insurance on every merchant hull. The fuel office reports what the single silo at the capital holds. The cabinet must decide what to tell the country before the prices tell it first."
 SET_wd_fuel_gauge:0 "Gauge the Silo and the Wells"
 SET_wd_fuel_gauge_desc:0 "The country pumps a little crude in three districts and stores refined fuel in one silo at the capital. Inspectors measure what each field gives, how much of it can be refined at home and what the plants, trains, lorries and twelve fighters actually burn. The figures fall short of comfortable. They are also the first honest fuel accounts the country has kept."
 SET_wd_fuel_hulls_insured:0 "Insurance for the Merchant Hulls"
 SET_wd_fuel_hulls_insured_desc:0 "Foreign insurers raise premiums on every hull near the open sea lanes, and some small owners at the southern port cannot pay. A state insurance pool, funded by a small levy on each voyage, covers the masters who would otherwise lie idle. The levy annoys the large firms. The small ones keep sailing, and the port keeps its crews."
 SET_wd_fuel_full_silo:0 "Keep the Silo Full"
 SET_wd_fuel_full_silo_desc:0 "The first answer buys crude whenever the price allows and never lets the capital silo fall below a set mark, whatever the plants and trains want. Rationing starts early and lasts longer than the war. The service can always fly and move. The plants lose shifts to fuel limits, and businesses blame the government for every empty pump."
 SET_wd_fuel_sell_crude:0 "Sell the Home Crude Abroad"
 SET_wd_fuel_sell_crude_desc:0 "The second answer sells the country's own crude abroad while prices are high and buys back refined fuel later. The treasury earns money it badly needs. The silo runs closer to empty than the general staff likes, and if prices stay high the country will be buying back at a loss what it sold at a profit."
 SET_wd_fuel_lumen_treaty:0 "When the Treaty Is Signed in Lumen"
 SET_wd_fuel_lumen_treaty_desc:0 "In June 1995 a treaty signed in Lumen ends the Belkan War. Crude prices begin to fall and insurers relax their rates on the merchant lanes. The fuel office recommends keeping the new rules for a year in case the peace does not hold, while the plants and the port want them gone by autumn. The cabinet picks a date between the two."
 SET_wd_cent_account:0 "A Plain Account of Ten Years"
 SET_wd_cent_account_desc:0 "The statistics office prepares a plain account of the country since 1991: the five districts, the ten plants and any new ones, the spine, the airfield, the port and the three formations, with what each change cost. It carries no foreword from the government. Every faction will find something to quote, and the government will have to answer."
 SET_wd_cent_council_term:0 "The Council Faces the Voters Again"
 SET_wd_cent_council_term_desc:0 "The federal council goes back to the voters, and this time the district lists are longer and the campaigns louder. A council that survives a second election is no longer an experiment. The movement fields candidates everywhere, and the council must choose whether to campaign on its record in District E or on the calm of the frontiers."
 SET_wd_cent_prefect_audit:0 "The Prefects Invite an Audit"
 SET_wd_cent_prefect_audit_desc:0 "After a decade of numbered orders, the board of prefects invites outside auditors into every district office. The auditors find careful books, slow decisions and a growing number of citizens who ask why they still cannot vote. The board prints the findings in full, because publishing is the only legitimacy it has ever claimed."
 SET_wd_cent_terms_read:0 "The Terms Read Aloud Again"
 SET_wd_cent_terms_read_desc:0 "The written terms on which the movement took power are read aloud before the districts again, clause by clause. The committee claims to have kept every one; its critics quietly list the exceptions. Reaffirming the terms costs the committee freedom it would like to have and buys it more years of grudging consent from the half of the country that never joined."
 SET_wd_cent_second_works:0 "A Second Works in District E"
 SET_wd_cent_second_works_desc:0 "The plants beside the eastern track have filled their crews and their order books. A second civilian works on the remaining free ground gives District E a real industrial town, with housing, a school and a bus to the capital. Herders who still use the hills watch the town spread toward their pastures and ask the district for limits."
 SET_wd_cent_fair_town:0 "The Fair Ground Becomes a Town"
 SET_wd_cent_fair_town_desc:0 "A decade of fairs has turned the market ground on the eastern hills into a town in all but name, with a clinic, a school and a bank branch. Paving its streets and the lanes to the shore finishes what the fairs began. The district remains poorer than the capital, but it is no longer the forgotten corner of the country."
 SET_wd_cent_signals:0 "Electric Signals for the Spine"
 SET_wd_cent_signals_desc:0 "The spine still runs on signals set by hand from lever frames, and every winter some signalman on the northern grade is cut off by snow. Electric signalling worked from the Capital Centre lets fewer staff run more trains in all weather. It is a slow and expensive conversion, done section by section, starting where the snow is worst."
 SET_wd_cent_isaf_freight:0 "Freight Rates in the Usean War"
 SET_wd_cent_isaf_freight_desc:0 "In August 2003 the ISAF is established against Erusea, and war returns to the world's sea lanes far from Seterano. Freight and insurance rates climb again. The port firms remember 1995 and reroute and insure their hulls within weeks this time. The country takes no part in the war and still pays for it at every quay."
 SET_wd_cent_close_programme:0 "The Programme Closed in 2005"
 SET_wd_cent_close_programme_desc:0 "In September 2005 the Erusean capital falls and the Continental War ends. Shipping lanes calm, freight rates ease and the port sails on peacetime terms again. The government uses the moment to close the national programme it began in 1991 and publish what remains undone, district by district. The list is long, and shorter than it was."
 SET_wd_cent_close_programme_tt_1:0 "Closes the 1991 to 2005 programme; later eras are not yet written."
 ac_wd_set_tree:0 "Seterano: National Programme"
 ac_wd_set_tree_desc:0 "The national focus programme of Seterano, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 SET_wd_one_desk:0 "Administration from a Single Desk"
 SET_wd_one_desk_desc:0 "The National Administration governs all five districts from one office under a label almost nobody votes for."
 SET_wd_hearing_season:0 "A Season of District Hearings"
 SET_wd_hearing_season_desc:0 "Officials hear petitions in every district hall before anything is decided."
 SET_wd_ballot_pledge:0 "A Pledge of District Ballots"
 SET_wd_ballot_pledge_desc:0 "The government has promised each district a polling day and a council."
 SET_wd_prefect_rule:0 "Prefects Before Parties"
 SET_wd_prefect_rule_desc:0 "Career prefects chosen by examination run the districts; parties have no seats."
 SET_wd_movement_terms:0 "Terms Agreed with the Movement"
 SET_wd_movement_terms_desc:0 "Written terms under which the majority movement may form a government."
 SET_wd_federal_compact:0 "The Five-District Compact"
 SET_wd_federal_compact_desc:0 "Each district has an elected council and a budget line of its own."
 SET_wd_prefect_code:0 "The Code of the Prefects"
 SET_wd_prefect_code_desc:0 "Numbered orders, a spring inspection and printed findings in every district."
 SET_wd_movement_order:0 "Order Under Licence"
 SET_wd_movement_order_desc:0 "Every march and meeting licensed by the committee; quiet streets and quiet opponents."
 SET_wd_written_settlement:0 "The Printed Settlement"
 SET_wd_written_settlement_desc:0 "Who appoints whom, what each district controls and how the order may be changed."
 SET_wd_spine_ledger:0 "The Spine Ledger"
 SET_wd_spine_ledger_desc:0 "Every metre of the national line measured, priced and listed for repair."
 SET_wd_dry_embankments:0 "Drained Embankments on the Plain"
 SET_wd_dry_embankments_desc:0 "Raised and drained banks keep the line firm through the wet season."
 SET_wd_public_railway:0 "The Railway in Public Hands"
 SET_wd_public_railway_desc:0 "Track, trains and timetable owned together by the state."
 SET_wd_leased_trains:0 "Leased Trains on Public Track"
 SET_wd_leased_trains_desc:0 "Operators run the trains and pay fees for every path on the public track."
 SET_wd_crisis_timetable:0 "The Sealed Crisis Timetable"
 SET_wd_crisis_timetable_desc:0 "One timetable says which train moves which formation in a crisis."
 SET_wd_hill_markets:0 "Stalls and Scales in the East"
 SET_wd_hill_markets_desc:0 "Wardens, honest scales and a customs table on the eastern hill market days."
 SET_wd_frontier_fairs:0 "Fairs of the Eastern Frontier"
 SET_wd_frontier_fairs_desc:0 "District E kept for pasture and trade, with its fairs grown into a season."
 SET_wd_dry_wells:0 "Deep Wells on the Dry Ground"
 SET_wd_dry_wells_desc:0 "Capped wells along the eastern track let people live beside it."
 SET_wd_eastern_charter:0 "District E on the Road Map"
 SET_wd_eastern_charter_desc:0 "An unbroken road from the capital to the eastern shore."
 SET_wd_plant_count:0 "Ten Plants Counted"
 SET_wd_plant_count_desc:0 "Every furnace, lathe and lost shift of the ten plants on one honest list."
 SET_wd_two_shifts:0 "Night Shifts on the Full Ground"
 SET_wd_two_shifts_desc:0 "A second shift on the capital lines, with a night bus and a canteen."
 SET_wd_service_lines:0 "Lines Kept for the Service"
 SET_wd_service_lines_desc:0 "Rifles, lorries, support kit and spares come before anything for the shops."
 SET_wd_metal_sales:0 "Plate and Ore on Foreign Markets"
 SET_wd_metal_sales_desc:0 "Steel plate and light metal ore sold abroad to pay for machine tools."
 SET_wd_district_goods:0 "Stoves and Radios for the Districts"
 SET_wd_district_goods_desc:0 "Civilian works turned toward household goods, with excise relief."
 SET_wd_spares_rule:0 "Spares Before Novelty"
 SET_wd_spares_rule_desc:0 "Replacement parts and repair kits come before every new design."
 SET_wd_one_hull:0 "A Maritime Service of One Hull"
 SET_wd_one_hull_desc:0 "One coastal escort, its crew and a base with two slipways."
 SET_wd_two_hulls:0 "Two Escorts on Three Coasts"
 SET_wd_two_hulls_desc:0 "A second escort from the lengthened slipways of the southern yard."
 SET_wd_coaster_lanes:0 "Coasters on the Home Lanes"
 SET_wd_coaster_lanes_desc:0 "Small coasters carry steel, timber and grain between the port and foreign harbours."
 SET_wd_hull_register:0 "The Harbour Register of Hulls"
 SET_wd_hull_register_desc:0 "Master, route, cargo and radio of every hull under the national flag."
 SET_wd_shoal_hydrophones:0 "Hydrophones on the Charted Shoals"
 SET_wd_shoal_hydrophones_desc:0 "Listening sets laid off the forest coast record what passes."
 SET_wd_sea_school:0 "The Seamanship School at the Base"
 SET_wd_sea_school_desc:0 "Escort crews, merchant cadets and harbour pilots taught side by side."
 SET_wd_thin_line:0 "Three Formations on Six Frontiers"
 SET_wd_thin_line_desc:0 "Eighteen battalions and three engineer companies for two climates."
 SET_wd_lorry_pool:0 "A Common Lorry Pool"
 SET_wd_lorry_pool_desc:0 "Fitters, a parts store and a duty roster for the formations lorries at each Centre."
 SET_wd_mountain_weight:0 "Two Formations in the Mountains"
 SET_wd_mountain_weight_desc:0 "Two formations wintering in District B, where all six frontiers run."
 SET_wd_plain_weight:0 "Two Formations on the Plain"
 SET_wd_plain_weight_desc:0 "Two formations held near the junction yards, carried by rail where needed."
 SET_wd_ski_companies:0 "Companies on Skis"
 SET_wd_ski_companies_desc:0 "One company in every mountain battalion trained to move and live in blizzards."
 SET_wd_steam_ready:0 "Two Trains in Steam"
 SET_wd_steam_ready_desc:0 "Two complete troop trains and their crews on call at the capital yard."
 SET_wd_district_rolls:0 "Reserve Rolls by District"
 SET_wd_district_rolls_desc:0 "Every former soldier listed with a trade, an address and a depot."
 SET_wd_two_climate_forecast:0 "Forecasts for Two Climates"
 SET_wd_two_climate_forecast_desc:0 "Observers telephone the capital field from the Logistics Centre and the port."
 SET_wd_standing_alert:0 "Four Fighters on Alert"
 SET_wd_standing_alert_desc:0 "Four of the twelve fighters armed and crewed on the capital field day and night."
 SET_wd_liaison_wings:0 "The Government Messenger Flight"
 SET_wd_liaison_wings_desc:0 "The squadron carries officials, doctors and mail to the far districts."
 SET_wd_cadet_course:0 "A Flying Course for Cadets"
 SET_wd_cadet_course_desc:0 "Senior pilots teach cadets from the capital schools through the dry months."
 SET_wd_frontier_ledger:0 "A Ledger of Six Frontiers"
 SET_wd_frontier_ledger_desc:0 "Every crossing, path and post on the Seteranoan side of six frontiers."
 SET_wd_pass_huts:0 "Huts on the High Passes"
 SET_wd_pass_huts_desc:0 "Stoves, blankets and radios on each Seteranoan approach to the passes."
 SET_wd_corner_post:0 "The North-East Observation Post"
 SET_wd_corner_post_desc:0 "Shifts from the Logistics Centre watch the province that faces Yuktobania."
 SET_wd_neutral_mountains:0 "Mountains as Neutral Ground"
 SET_wd_neutral_mountains_desc:0 "No bloc, no foreign troops and a guesthouse for anyone who wants to talk."
 SET_wd_neighbour_talks:0 "Practical Talks Next Door"
 SET_wd_neighbour_talks_desc:0 "Standing offers of talks on crossings, weather, avalanches and freight."
 SET_wd_counted_crossings:0 "Every Crossing Recorded"
 SET_wd_counted_crossings_desc:0 "All traffic funnelled through staffed crossings that record each load."
 SET_wd_fair_passes:0 "Seasonal Fair Passes"
 SET_wd_fair_passes_desc:0 "A cheap pass valid only on fair days for traders from across the eastern frontier."
 SET_wd_sky_notice:0 "The Weekly Asteroid Notice"
 SET_wd_sky_notice_desc:0 "What is known and not known about Ulysses, read on the radio every week."
 SET_wd_impact_alarm:0 "The Impact Declared"
 SET_wd_impact_alarm_desc:0 "Preparation instead of debate since the impact was announced to the world."
 SET_wd_rock_refuge:0 "Refuge in the Northern Rock"
 SET_wd_rock_refuge_desc:0 "Shelter galleries and national reserves inside the rock of District B."
 SET_wd_cellar_shelters:0 "Propped Cellars on the Plain"
 SET_wd_cellar_shelters_desc:0 "Deepened, pumped and stocked cellars where people already live."
 SET_wd_dark_year_stores:0 "Stores Against a Lost Harvest"
 SET_wd_dark_year_stores_desc:0 "Food, fuel and medicine for a year in which harvests and imports fail."
 SET_wd_dear_crude:0 "Crude at War Prices"
 SET_wd_dear_crude_desc:0 "A distant war has raised the price of every barrel the country buys."
 SET_wd_fuel_rules:0 "Fuel Accounts Kept Honestly"
 SET_wd_fuel_rules_desc:0 "What each field gives and what every user burns, measured monthly."
 SET_wd_full_silo:0 "The Silo Never Below the Mark"
 SET_wd_full_silo_desc:0 "Crude bought when prices allow and the capital silo kept above a set level."
 SET_wd_crude_sold:0 "Home Crude Sold High"
 SET_wd_crude_sold_desc:0 "Domestic crude sold abroad while prices last, refined fuel bought back later."
 SET_wd_steady_fuel:0 "Peacetime Fuel Rules"
 SET_wd_steady_fuel_desc:0 "Fuel rules eased on a fixed date after the treaty."
 SET_wd_insurance_pool:0 "The Voyage Levy Pool"
 SET_wd_insurance_pool_desc:0 "A small levy on each voyage insures the hulls foreign insurers price out."
 SET_wd_second_mandate:0 "A Second Federal Mandate"
 SET_wd_second_mandate_desc:0 "The federal council has survived its second election."
 SET_wd_audited_prefects:0 "Prefects Under Audit"
 SET_wd_audited_prefects_desc:0 "Outside auditors read every district office and the findings are printed."
 SET_wd_terms_reaffirmed:0 "The Terms Reaffirmed"
 SET_wd_terms_reaffirmed_desc:0 "The movement committee has read its terms aloud again, clause by clause."
 SET_wd_war_freight:0 "Freight at War Rates"
 SET_wd_war_freight_desc:0 "Rerouted hulls and dearer insurance while war returns to the sea lanes."
 SET_wd_electric_signals:0 "Electric Signals on the Spine"
 SET_wd_electric_signals_desc:0 "Signals worked from the Capital Centre instead of lever frames in the snow."
 SET_wd_grade_open:0 "The Northern Grade Ploughed"
 SET_wd_grade_open_desc:0 "Plough trains and shovel gangs have cleared the mountain line after a blizzard."
 SET_wd_escort_rounds:0 "The Escort on Its Rounds"
 SET_wd_escort_rounds_desc:0 "The coastal escort is calling at every harbour on the three coasts."
 SET_wd_drill_week:0 "Shelter Drill Week"
 SET_wd_drill_week_desc:0 "Families have spent a week learning their way to the shelters."
 ac_wd_set.1.t:0 "One Voter in a Hundred"
 ac_wd_set.1.d:0 "The pollsters' sealed figures reach the National Administration on a wet morning at the Capital Centre, and they confirm what every district already suspects. The democratic party that lends the government its name holds the loyalty of about one voter in a hundred. Half the country leans toward the movement that promises discipline and a stronger service. Nearly all the rest would keep the administrators who run the five districts without a ballot.\n\nThe Administration has never claimed to be popular, only competent. Its offices keep the trains on the spine moving, pay the three formations and settle the accounts of ten plants. Yet the country still calls itself a federation, and the districts ask what that word means when every decision is signed at one desk in the capital. District E has no road, District B has six frontiers and the southern port has one escort.\n\nNobody expects the figures to stay sealed for long. The movement's organisers have their own counts, and the district notables will hear by the weekend. The Administration can publish the polling and start an argument it cannot steer, or hold the figures back and let rumour do the work. Either way the question of who governs Seterano is open now, and it will not close quietly.\n\nProvisional gameplay."
 ac_wd_set.1.a:0 "Publish the figures in every district."
 ac_wd_set.1.b:0 "Keep the figures inside the Administration."
 ac_wd_set.2.t:0 "Crates of Signatures on the Steps"
 ac_wd_set.2.d:0 "A column of buses reaches the Capital Centre before dawn, and by noon the square outside the Administration's offices is full. The movement has gathered signatures in all five districts on one demand: that the government stop ruling by file and give the country either a vote or a programme it can read. The organisers carry the petition in wooden crates and stack them on the steps where the photographers can reach them.\n\nThe crowd is orderly and loud. Many have come down from District B, where the mountain towns feel the frontiers closest and the winters hardest, and many from the capital's own plants, where shifts have been short since spring. Speakers promise discipline, a service able to watch six frontiers and an end to an administration that answers to nobody. The police report no damage and a great deal of noise.\n\nThe Administration must receive the crates in some form before the buses leave. Accepting them in person concedes that the movement speaks for half the country. Sending a clerk to sign for them insults the crowd and invites a second march. Ministers know that whatever is said on the steps today will be repeated in every district as the government's first answer to the question of who governs.\n\nProvisional gameplay."
 ac_wd_set.2.a:0 "Receive the petition in person."
 ac_wd_set.2.b:0 "Send a clerk to sign for the crates."
 ac_wd_set.3.t:0 "Notebooks from the Line"
 ac_wd_set.3.d:0 "The railway engineers return from their walk with notebooks full of measurements and a short summary on the first page. Seterano has one spine and two short limbs. The main line climbs north from the Capital Centre across the plain and into the mountains of District B, ending at the Logistics Centre where three foreign frontiers meet. A second line runs south to the naval base in District A, and a third follows the coast from there into District D.\n\nMost of the track is sound, the summary says, and very little of it is ready for hard use. The northern grade loses days to snow every winter and its cuttings fill with drifts overnight. On the plain the embankments soften through the long wet season. The stations have sidings for a peacetime timetable and nothing more. District E, on the eastern hills, has no railway at all and no road a lorry driver would trust.\n\nThe engineers attach two price lists. One keeps the whole railway in public hands and pays for repairs from the national budget. The other leases the trains to operators and spends their fees on track. Before either is chosen, the Administration must decide how widely to share the notebooks, knowing that every district will turn first to the page about its own station.\n\nProvisional gameplay."
 ac_wd_set.3.a:0 "Print the summary for every station."
 ac_wd_set.3.b:0 "Keep it for the railway office."
 ac_wd_set_3_b:0 "Keep it for the railway office."
 ac_wd_set.4.t:0 "Four Provinces and No Paved Road"
 ac_wd_set.4.d:0 "The survey party that went into District E in the spring comes back in the autumn, a month late and two lorries short. The district is the largest stretch of open ground in the country and the least known. Three of its four provinces are hills running up to the frontier with Azbekerania. The fourth, inland, is dry ground where the grass gives out by midsummer and the wells are days apart. There is no factory, no railway and no paved road.\n\nPeople live there all the same. Herders move between the hills and the dry ground with the seasons, and the hill market days bring in buyers and sellers from across the frontier as well as from home, most of them carrying no papers. In winter snow closes the tracks for weeks; in summer rain turns them to mud. The district reaches the sea beside the frontier, where there is a beach and a few boats but nothing a harbour master would call a landing.\n\nThe survey finds room for four new plants and every road the country could afford. It does not say what the district should become. A factory district would need power, housing and a line from the capital. A market district would need roads, wells and patience. First the Administration must decide whether the survey belongs to the ministries or to the people it describes.\n\nProvisional gameplay."
 ac_wd_set.4.a:0 "Publish the survey in the district."
 ac_wd_set.4.b:0 "Send it to the planning office."
 ac_wd_set.5.t:0 "Ten Plants and Their Furnaces"
 ac_wd_set.5.d:0 "The industrial inspectors have visited every plant in Seterano, and there are only ten of them. Five make civilian goods and five make arms, spread between the Capital District, the mountains of District B and the coast of District D. The capital's plants stand on every metre of usable ground the district has, so nothing new can rise there without something old coming down. District B and District D each have a single plot left.\n\nThe inspectors also count the ore. The country digs steel in all three industrial districts and more light metal than its own plants can use, with a little oil and rubber besides. Much of the steel leaves as plate and billet and much of the light metal as raw ore, because nobody at home has the furnaces to finish it. What stays makes rifles, lorries, a few wagons and spares for the only fighters the country owns.\n\nThe report ends with a question instead of a recommendation. Seterano can put its ten plants and two free plots behind the service, behind sales abroad or behind the shops of five districts, and it cannot do all three well. Before that choice, the Administration must decide whether the plant managers see the figures before the ministers do, or only afterwards.\n\nProvisional gameplay."
 ac_wd_set.5.a:0 "Show the managers first."
 ac_wd_set_5_a:0 "Show the managers first."
 ac_wd_set.5.b:0 "Ministers first, managers later."
 ac_wd_set.6.t:0 "A Navy of One Hull"
 ac_wd_set.6.d:0 "The Maritime Service parades its entire strength at the naval base in District A, and its entire strength is one coastal escort. The crew is proud, the paint is fresh and the guns are older than most of the sailors. Behind the escort the two slipways of the southern yard stand half idle, building convoy hulls when there is steel and repairing fishing boats when there is not.\n\nSeterano has three stretches of coast and no fleet to speak of. The forest shore of District A runs out from the base, the Capital District has a short shore on the western sea, and District D and District E face the east. Sixty merchant hulls fly the national flag, most of them small and most owned by firms in the port. Their masters ask the government for charts and warnings, not for warships.\n\nThe service's senior officers want a second escort and then a third. The port firms want the slipways to build coasters they can sell or sail themselves. The treasury asks why a country with six land frontiers needs a navy at all. The Administration must answer the officers first, because they have asked in public and the whole port is watching to see who is listened to.\n\nProvisional gameplay."
 ac_wd_set.6.a:0 "Promise the service a second hull."
 ac_wd_set.6.b:0 "Promise the port its coasters first."
 ac_wd_set.7.t:0 "Eighteen Battalions and Six Frontiers"
 ac_wd_set.7.d:0 "The autumn inspection finds the army exactly where the budget left it. Seterano keeps three infantry formations. Each has six infantry battalions and its own company of engineers, and two of them live in barracks at the Capital Centre. The third sits at the Logistics Centre in the mountains of District B, at the end of the railway and within a day's march of three foreign frontiers. There are lorries for most of them, trains for some and spare rifles in the depots.\n\nThe inspectors are not unkind. The troops are fit and the engineers are good at their trade. The arithmetic is plain all the same: six land frontiers, two climates and three formations. The mountain formation spends its winters digging out its own barracks; the capital formations spend their summers in the mud of the plain. Nobody has planned for trouble arriving from two directions at once.\n\nThe general staff offers two answers. One puts the army's weight in the mountains, where the frontiers run and a few trained companies can hold a pass. The other keeps it on the plain around the capital and trusts the railway to carry it wherever it is needed. Before choosing, the Administration must decide how much of the inspection report the soldiers themselves will hear.\n\nProvisional gameplay."
 ac_wd_set.7.a:0 "Read the findings to every battalion."
 ac_wd_set.7.b:0 "Brief the officers only."
 ac_wd_set.8.t:0 "Six Neighbours on One Wall"
 ac_wd_set.8.d:0 "The foreign office pins its new frontier map to the cabinet room wall, and the ministers count six coloured lines. Slavia lies to the west, beyond the capital plain and the western mountains. Valka meets the western end of District B. Malynea lies across the northern mountains and Baltica beyond the north-eastern passes. Yuktobania, many times Seterano's size, touches a single mountain province in the far north-east. Azbekerania runs down the whole eastern side to the coast of District E.\n\nEvery one of those lines passes through District B. Three of them meet around the Logistics Centre in the west of the district, and three more meet at that one province in the north-east. Herders, smugglers, skiers and lorry drivers cross them every week, mostly on paths no customs officer has walked. Some neighbours keep posts and patrols on their own side of the passes; Seterano has kept fewer on its side. None of the frontiers is disputed in any file the ministry holds, and few are well understood.\n\nThe map changes nothing on the ground. It does show the ministers how small the country is and how many doors it has. They can treat the mountains as neutral ground, look to the neighbours for practical talks or count and control every crossing. First they must decide whether the map stays in the cabinet room or goes out to the districts that live along its lines.\n\nProvisional gameplay."
 ac_wd_set.8.a:0 "Send the map to the frontier districts."
 ac_wd_set.8.b:0 "Keep the map in the cabinet room."
 ac_wd_set.9.t:0 "A Paragraph Between the Weather and the Trains"
 ac_wd_set.9.d:0 "In December 1994 the astronomers' international union warns that Ulysses, an asteroid on a near course, could hit the Earth. In Seterano the notice arrives as a short paragraph on the evening radio, read between the weather forecast and the railway timetable, and for a day it is treated as a curiosity. By the end of the week the ministries are opening letters from every district asking what the government intends to do.\n\nThe two climates breed two kinds of fear. In the northern mountains and on the eastern hills people ask about rock falls, avalanches and roads cut off for a whole winter. In the capital and along the southern coast they ask about fire, flood and the sea. The engineers note that the mountains are solid rock that could be tunnelled, while the plain offers only cellars dug into soft and often waterlogged ground.\n\nNobody can yet say whether the asteroid will strike, still less where. The Administration has to decide how to talk about a danger it cannot measure. A plain weekly notice would treat the public as adults and invite new questions every week. A quiet planning office would avoid alarm and leave the rumours to grow on their own. The letters keep arriving either way, and the postmen have started to carry them in sacks.\n\nProvisional gameplay: date anchor only, Official Chronicle row 1994 / 12.10 in tools/lore/chronicle.json; the Seteranoan response is gameplay."
 ac_wd_set.9.a:0 "Broadcast a weekly notice."
 ac_wd_set.9.b:0 "Plan quietly first."
 ac_wd_set.10.t:0 "A Summer Night of Waiting"
 ac_wd_set.10.d:0 "In July 1999 the asteroid passes inside the distance at which the Earth's pull tears it apart. Across Seterano families sit up through a warm night on the plain and a cool one in the mountains, radios on, while the shelter wardens walk their streets. The trains on the spine are held in their stations and the Logistics Centre keeps its lorries fuelled and its doors open to anyone who comes.\n\nThe night brings fear and very little news. The radio repeats what the astronomers have already said and adds nothing about where the fragments will come down. Wardens report crowded cellars in the capital and empty ones in the villages, where people prefer to watch the sky from their doorsteps. In District B the mountain galleries fill early. By morning the wardens have little to report beyond sleepless streets and long queues for bread.\n\nThe Administration must decide how to close the alert. Ending it at once would have the plants and the trains working by noon and would tell the country that the danger is past, which nobody can yet promise. Holding it a few days longer would cost shifts and patience and look like caution. The neighbours are making the same choice, and none of them knows any more than Seterano does.\n\nProvisional gameplay: date anchor only, Official Chronicle row 1999 / 07.08 in tools/lore/chronicle.json; no damage in Seterano is claimed or denied."
 ac_wd_set.10.a:0 "End the alert at once."
 ac_wd_set.10.b:0 "Hold the alert a few days more."
 ac_wd_set.11.t:0 "Crude Prices and a Distant War"
 ac_wd_set.11.d:0 "In late March 1995 the long quarrel around Belka becomes a war, and the news reaches Seterano the way it reaches most small countries: secondhand, late and alarming. The war is far away and Seterano has no part in it. Within a fortnight it still finds its way into the country, through the price of crude on the world market and the premiums insurers now charge on every merchant hull at sea.\n\nThe fuel office reports that the single silo at the capital holds enough for the service's normal year and not a great deal more. The country pumps a little crude of its own in three districts, too little to cover the plants, the trains and the lorries together. The port firms say the masters of the sixty merchant hulls are asking whether to sail at all, and plant managers ask whether arms orders will rise or fall.\n\nThe Administration cannot change the war and it cannot change the market. It can decide what the country is told and how it spends the crude it has. Rationing early would be prudent and unpopular. Waiting would be popular until the day the silo runs low. The ministers argue through the night and agree only that the first statement must be made before the weekend markets open.\n\nProvisional gameplay: date anchor only, Official Chronicle row 1995 / 03.25 in tools/lore/chronicle.json; the Seteranoan response is gameplay."
 ac_wd_set.11.a:0 "Announce fuel rules now."
 ac_wd_set.11.b:0 "Reassure first and ration if needed."
 ac_wd_set.12.t:0 "The Account Without a Foreword"
 ac_wd_set.12.d:0 "Early in the new century the statistics office publishes a plain account of the country since 1991. It lists the five districts, the plants old and new, the spine and its two limbs, the capital field, the escort at the southern port and the three formations. Beside each it prints what changed and what the change cost. The report carries no foreword from the government and no photographs, and it sells out in a week.\n\nThe account flatters nobody. District E has changed the most and still trails the other four. The capital has grown upward because it could not grow outward. The six frontiers are calm, but the crossings are busier than the posts that watch them. The answer the country gave to the question of who governs has held so far, and the account records, district by district, how many people never accepted it.\n\nThe government must decide how to respond. It can let the account stand without comment, which some will read as confidence and others as indifference. Or it can publish a reply setting out what the next years will bring, which will be quoted back at every minister who misses a date. The districts are reading in either case, and the movement and the administrators have both marked their copies.\n\nProvisional gameplay."
 ac_wd_set.12.a:0 "Let the account stand alone."
 ac_wd_set.12.b:0 "Publish a reply with dates."
 SET_wd_federal_council_office:0 "Federal Council of the Five Districts"
 SET_wd_federal_council_office_desc:0 "A council elected on district lists that governs collectively, publishes its budget a season before voting it and returns to the voters on a fixed calendar. Provisional gameplay office with no named holder."
 SET_wd_prefect_board_office:0 "Board of District Prefects"
 SET_wd_prefect_board_office_desc:0 "Five career prefects chosen by examination, one for each district, and a chair from the capital, governing by numbered and published order with the ballot suspended and no party seats. Provisional gameplay office with no named holder."
 SET_wd_movement_committee_office:0 "Executive of the Majority Movement"
 SET_wd_movement_committee_office_desc:0 "A committee named by the movement that polls half the country, governing by numbered decree under written terms that forbid any change of frontier, with other parties suspended and the press licensed. Provisional gameplay office with no named holder."
 ac_wd_set_decisions:0 "Seterano: National Measures"
 ac_wd_set_decisions_desc:0 "Measures from the national programme of Seterano. Provisional gameplay unless a source ledger row says otherwise."
 SET_wd_clear_grade_decision:0 "Plough Out the Northern Grade"
 SET_wd_clear_grade_decision_desc:0 "Sends plough trains and shovel gangs up the mountain line after a blizzard so the Logistics Centre is supplied. Repeatable twice a year; freight elsewhere waits while they work."
 SET_wd_autumn_fair_decision:0 "Proclaim an Autumn Fair in the East"
 SET_wd_autumn_fair_decision_desc:0 "Declares a week of fairs on the eastern hills with free stalls and a band from the capital. Repeatable once a year."
 SET_wd_coast_round_decision:0 "Send the Escort on Its Rounds"
 SET_wd_coast_round_decision_desc:0 "Sends the coastal escort to call at every harbour on the three coasts for a season. Repeatable once a year; the fuel bill is the service budget."
 SET_wd_shelter_week_decision:0 "Open the Shelters for a Drill Week"
 SET_wd_shelter_week_decision_desc:0 "Invites every family to walk to its assigned shelter and spend a night there. Repeatable once a year; the plants lose shifts."
 SET_wd_east_strip_decision:0 "Mark a Grass Strip in District E"
 SET_wd_east_strip_decision_desc:0 "Rolls and marks a grass landing strip beside the graded track for liaison aircraft and medical flights. Done once; the crews then return to the road."
 SET_wd_corner_mast_decision:0 "Raise a Mast at the North-East Post"
 SET_wd_corner_mast_decision_desc:0 "Adds a radar mast to the observation post in the province facing Yuktobania. Paid for once from the frontier budget; its crew rotates with the post."
