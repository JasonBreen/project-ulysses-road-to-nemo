 ac_camp.108.t:0 "The second roof"
 ac_camp.108.desc:0 "The second receiving site is a collection of roofs, a water connection and a promise that the district engineer considers optimistic. Dispersing capacity offers room to survive the loss of one site. Concentrating it makes the current service easier to operate and the next disruption harder to absorb. There is no arrangement that creates staff from the lines on a map. The branch funds a specific receiving commitment and records whether the coalition actually accepts it. Its domestic opportunity cost remains attached to the government that authorized the work."
 ac_camp.108.a:0 "Circulate a public receiving account."
 ac_camp.108.b:0 "Keep a signed professional return."
