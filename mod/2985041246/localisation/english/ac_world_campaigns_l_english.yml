 ac_wc_soa.12.t:0 "A Flightline Without Shelter"
 ac_wc_soa.13.d:0 "A call-up notice interrupts a civilian wage. Sellen wants employers to share the burden; Vey needs scarce specialists left at work. Halvek needs to know which names will actually arrive.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
