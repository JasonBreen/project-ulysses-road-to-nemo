 ac_alc.120.t:0 "A Federation Tested"
 ac_alc.120.d:0 "The last review of the period lists what the federation did when it was tested: where it governed from, what its people resisted, what it rebuilt and what it paid.\n\nAurelia is not the country it was before October. It knows what it can do.\n\n[AUR_sw_opening_callback]"
 ac_alc.120.a:0 "Support a public maintenance review."
 ac_alc.120.b:0 "Reserve staff for a focused readiness return."
