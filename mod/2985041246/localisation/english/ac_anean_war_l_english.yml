 EVA_ew_republic_service_2_spirit:0 "Convene the Provincial Council"
 EVA_ew_republic_service_2_spirit_desc:0 "The federal chancellery maintains this funded service for ninety days. Convene the council of provinces on the period's disputes. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 EVA_ew_republic_service_2:0 "Convene the Provincial Council"
