l_english:
 ac_exp_eru_opening:0 "Erusea: the Opening Decade"
 ac_exp_eru_opening_desc:0 "Administration, preparedness and continental relations, 1991–1999."
 ERU_exp_opening:0 "The Farbanti Cabinet"
 ERU_exp_opening_desc:0 "The new decade opens with ministries competing over the same railway wagons, tax receipts and trained personnel. A cabinet inventory will show which promises Erusea can actually keep. Its conclusions will guide the coming years without committing the country to a continental war."
 ERU_exp_registry:0 "A Common Civil Register"
 ERU_exp_registry_desc:0 "District offices will reconcile household and land records. Reliable records make compensation possible when families move, although the survey requires staff who could otherwise process current business."
 ERU_exp_district_accounts:0 "Audit the District Accounts"
 ERU_exp_district_accounts_desc:0 "Inspectors will follow appropriations from the treasury to local suppliers. Publishing the discrepancies forces the cabinet to choose between protecting administrative discretion and opening decisions to review."
 ERU_exp_municipal_services:0 "Municipal Service Boards"
 ERU_exp_municipal_services_desc:0 "Water, sanitation and housing offices need a common emergency rota. Service boards will keep a list of qualified crews instead of assuming that another ministry will provide them."
 ERU_exp_civil_compact:0 "The Administrative Compact"
 ERU_exp_civil_compact_desc:0 "The ministry and the districts must agree on who can requisition transport and who hears an appeal. A standing compact makes the chosen administrative policy durable, at the cost of a larger permanent payroll."
 ERU_exp_rail_survey:0 "Survey the Freight Railways"
 ERU_exp_rail_survey_desc:0 "A freight survey will identify junctions whose failure could isolate the industrial interior. Workshops will plan substitute routes before expansion contracts consume the available rolling stock."
 ERU_exp_machine_tools:0 "Machine-Tool Contracts"
 ERU_exp_machine_tools_desc:0 "Domestic firms need predictable orders to replace worn machine tools. Competitive contracts improve production knowledge without promising factories that the treasury cannot yet support."
 ERU_exp_freight_reserves:0 "A Freight Reserve"
 ERU_exp_freight_reserves_desc:0 "Keep a reserve of serviceable locomotives and repair parts. Commercial operators will dislike idle equipment, but the reserve will make later relief and reconstruction less dependent on military transport."
 ERU_exp_industrial_standards:0 "Common Workshop Standards"
 ERU_exp_industrial_standards_desc:0 "Interchangeable fittings and common inspection sheets sound unambitious beside a new industrial complex. They keep existing machinery running and give smaller firms a route into government contracts."
 ERU_exp_defence_inventory:0 "Inventory the Defence Establishment"
 ERU_exp_defence_inventory_desc:0 "The services will report equipment availability rather than paper strength. Repair queues and shortages of instructors will decide the first round of allocations."
 ERU_exp_air_maintenance:0 "Airfield Maintenance Teams"
 ERU_exp_air_maintenance_desc:0 "Runway crews and dispersed spares are less visible than a new squadron. Training them now keeps the air arm useful when a damaged main base cannot service every aircraft."
 ERU_exp_coastal_watch:0 "A Coastal Watch Network"
 ERU_exp_coastal_watch_desc:0 "Civil harbour offices and naval stations will exchange shipping reports. A shared reporting schedule improves warning without treating every foreign merchant as a hostile contact."
 ERU_exp_reserve_exercises:0 "Exercise the Reserve System"
 ERU_exp_reserve_exercises_desc:0 "A limited mobilisation exercise will test rail timetables, medical screening and equipment issue. The government will retain its results for a future crisis instead of keeping the reservists under arms."
 ERU_exp_consular_contacts:0 "Reopen Continental Contacts"
 ERU_exp_consular_contacts_desc:0 "Consular officials can discuss lost cargoes, missing documents and cross-border travel even when the cabinets disagree. Such routine contacts keep a channel open for harder negotiations."
 ERU_exp_customs_review:0 "Review Customs Practice"
 ERU_exp_customs_review_desc:0 "Clear rules at the frontier reduce arbitrary delays. The cabinet must decide whether the border administration should prioritise predictable civilian access or the discretion of security officers."
 ERU_exp_emergency_protocols:0 "Civil Emergency Protocols"
 ERU_exp_emergency_protocols_desc:0 "Districts will rehearse evacuation and temporary shelter for ordinary industrial accidents and severe weather. This is preparedness for known civil hazards, not foreknowledge of Ulysses."
 ERU_exp_continental_desk:0 "A Permanent Continental Desk"
 ERU_exp_continental_desk_desc:0 "A permanent desk will keep the records from customs, consular and relief offices together. In a later crisis the cabinet will inherit an institution rather than a pile of unconnected memoranda."
 ERU_exp_opening_assessment:0 "Assess the Opening Programme"
 ERU_exp_opening_assessment_desc:0 "The cabinet will review the programme that has actually been completed. Further work can continue, but the government must now decide whether to preserve administrative capacity or spend its political reserve on an immediate improvement."
 ac_exp_fcu_opening:0 "Central Usea: the Opening Decade"
 ac_exp_fcu_opening_desc:0 "Administration, preparedness and continental relations, 1991–1999."
 FCU_exp_opening:0 "The Treaty Secretariat"
 FCU_exp_opening_desc:0 "Central Usea enters 1991 with agreements that are easier to sign than to administer. The secretariat needs an account of each member's transport capacity, civil services and military commitments before another emergency tests the treaty."
 FCU_exp_treaty_register:0 "Register the Treaty Commitments"
 FCU_exp_treaty_register_desc:0 "Every partner has signed commitments expressed in different units and deadlines. A common register will reveal where several promises depend on the same limited transport or staff."
 FCU_exp_burden_formula:0 "A Formula for Shared Burdens"
 FCU_exp_burden_formula_desc:0 "A flat contribution protects equal voting rights, while a common fund can direct more resources to districts with greater need. The council must choose a lasting fiscal bargain. Public certification improves stability at a political cost; pooled contributions accelerate construction but consume civilian capacity and provoke disputes."
 FCU_exp_liaison_offices:0 "Guarantee the Equal-Member Compact"
 FCU_exp_liaison_offices_desc:0 "Permanent liaison offices will enforce published contributions and hear member appeals. This implements the equal-member settlement. The common-fund alternative is closed for this opening programme."
 FCU_exp_treaty_audit:0 "Empower the Common Fund"
 FCU_exp_treaty_audit_desc:0 "The secretariat will certify deliveries and direct common contributions to the most exposed districts. This implements the needs-based settlement. The equal-member alternative is closed for this opening programme."
 FCU_exp_transport_map:0 "Map the Continental Corridors"
 FCU_exp_transport_map_desc:0 "Survey roads, railheads and harbours as a connected transport system. The resulting priorities will serve commercial trade as well as emergency mobilisation."
 FCU_exp_port_schedules:0 "Coordinate Harbour Schedules"
 FCU_exp_port_schedules_desc:0 "Harbours must agree on cargo documents and berth allocation. Shared schedules reduce delays without giving the secretariat ownership of national ports."
 FCU_exp_relief_stockpiles:0 "Regional Relief Stores"
 FCU_exp_relief_stockpiles_desc:0 "Rotate food, medical supplies and engineering spares through regional stores. Maintaining the reserve costs political capital today and reduces disruption when ordinary procurement fails."
 FCU_exp_interoperable_workshops:0 "Interoperable Workshops"
 FCU_exp_interoperable_workshops_desc:0 "Compatible gauges, components and repair records will let one district service another district's vehicles. Standardisation is a continuing negotiation with suppliers, not a free expansion of industry."
 FCU_exp_civil_protection:0 "A Civil Protection Office"
 FCU_exp_civil_protection_desc:0 "Create a small coordinating office for floods, fires and industrial accidents. Its first task is to identify who can open shelters and restore essential services."
 FCU_exp_medical_register:0 "Register Medical Capacity"
 FCU_exp_medical_register_desc:0 "A common medical register reveals the vehicles and trained crews available for one reserve. The council will decide whether to protect civilian convoys or contract a dual-use reserve. That choice has a continuing cost and determines the next focus in this branch."
 FCU_exp_shelter_exercises:0 "Ring-Fence the Civil Convoys"
 FCU_exp_shelter_exercises_desc:0 "Exercise hospital transfers and shelter deliveries using protected civilian transport. Military headquarters must plan around that commitment. The reserve will reduce refugee pressure when the Usean emergency begins."
 FCU_exp_public_information:0 "Train the Dual-Use Reserve"
 FCU_exp_public_information_desc:0 "Civilian operators will rehearse mobilisation, emergency routing and the return to commercial service. Their readiness is useful in peace as well as war, but the protected-convoy alternative is closed for this opening programme."
 FCU_exp_joint_inventory:0 "Inventory Collective Readiness"
 FCU_exp_joint_inventory_desc:0 "List trained units, available aircraft and escort vessels separately from promised reinforcements. A common inventory gives commanders a realistic starting point."
 FCU_exp_staff_exchanges:0 "Exchange Staff Officers"
 FCU_exp_staff_exchanges_desc:0 "Small staff exchanges will practise liaison and translation of orders. No new faction is created; participating officers remain under their national commands."
 FCU_exp_warning_drills:0 "Air-Warning Drills"
 FCU_exp_warning_drills_desc:0 "Radar crews will rehearse the handover of tracks and identification reports. A disciplined reporting chain is more valuable than an impressive but uncoordinated collection of stations."
 FCU_exp_readiness_commitment:0 "A Readiness Commitment"
 FCU_exp_readiness_commitment_desc:0 "Set aside time for recurring joint exercises and verify transport arrangements. The commitment preserves the lessons of the opening programme for the later Usean emergency."
 FCU_exp_opening_assessment:0 "Assess the Opening Programme"
 FCU_exp_opening_assessment_desc:0 "The cabinet will review the programme that has actually been completed. Further work can continue, but the government must now decide whether to preserve administrative capacity or spend its political reserve on an immediate improvement."
 NPT_exp_island_accounts:0 "The Island Accounts"
 NPT_exp_island_accounts_desc:0 "North Point's ministries must reconcile the cost of imported fuel, coastal transport and defence. An honest account will give the elected government a practical starting point."
 NPT_exp_mandate_review:0 "Translate the Mandate into Policy"
 NPT_exp_mandate_review_desc:0 "The election determined who governs; it did not settle every allocation. The cabinet will choose how closely public scrutiny should follow emergency administration."
 NPT_exp_harbour_repairs:0 "Repair the Coastal Harbours"
 NPT_exp_harbour_repairs_desc:0 "Small harbour repairs keep food and fuel moving when the main terminal is congested. The programme favours reliable access over a prestige expansion."
 NPT_exp_fishing_cooperatives:0 "The Fishing Cooperatives"
 NPT_exp_fishing_cooperatives_desc:0 "Cooperatives will pool cold storage and repair capacity. Their contracts give coastal communities a stake in maintaining services during a wider emergency."
 NPT_exp_island_workshops:0 "Island Repair Workshops"
 NPT_exp_island_workshops_desc:0 "Domestic workshops can replace imported fittings and repair ground equipment. Supporting those skills reduces disruption without making the island economically self-sufficient."
 NPT_exp_runway_teams:0 "Dispersed Runway Teams"
 NPT_exp_runway_teams_desc:0 "Train mobile teams to repair damaged runways and move essential equipment between airfields. The same crews can restore civilian access after severe weather."
 NPT_exp_civil_warning:0 "Civil Air-Warning Procedures"
 NPT_exp_civil_warning_desc:0 "Radar reports must reach local authorities in time to matter. A tested warning procedure reduces confusion without placing all civilian administration under military command."
 NPT_exp_humanitarian_stores:0 "Humanitarian Stores"
 NPT_exp_humanitarian_stores_desc:0 "Rotate relief supplies through island warehouses and rehearse their distribution. The stores serve civilian emergencies regardless of the eventual alignment decision."
 NPT_exp_medical_shuttle:0 "An Island Medical Shuttle"
 NPT_exp_medical_shuttle_desc:0 "Harbour and airfield officers will coordinate patient transport. Keeping one allocation for civilians prevents military traffic from consuming the entire island network."
 NPT_exp_neutral_inspections:0 "Neutral Harbour Inspections"
 NPT_exp_neutral_inspections_desc:0 "Guarded neutrality requires consistent port inspections. Clear procedures reduce the chance that a local dispute will make the government's declared policy meaningless."
 NPT_exp_neutral_relief:0 "Relief under Neutral Colours"
 NPT_exp_neutral_relief_desc:0 "North Point can maintain civilian relief capability without accepting an allied headquarters. The government will keep humanitarian allocations separate from its military commitments."
 NPT_exp_airfield_services:0 "Services for Visiting Aircrews"
 NPT_exp_airfield_services_desc:0 "Opening the airfields creates work for medical teams, mechanics and civil authorities. Establish clear responsibilities before temporary deployments become a permanent burden."
 NPT_exp_allied_transport:0 "An Allied Transport Desk"
 NPT_exp_allied_transport_desc:0 "Coordinate visiting transport with the island's own supply needs. The desk supports the existing hosting agreement and claims no authority to create or lead a faction."
 NPT_exp_hosting_accounts:0 "Account for the Hosting Burden"
 NPT_exp_hosting_accounts_desc:0 "An allied rear base must remain a functioning island economy. Review the costs borne by communities around the airfields and preserve compensation records."
 NPT_exp_civil_resilience:0 "An Island that Can Endure"
 NPT_exp_civil_resilience_desc:0 "The civilian network remains useful even when diplomatic partners are unavailable. Consolidate the medical and repair services so the island has a viable conclusion to its domestic programme."
 REC_exp_district_inventory:0 "Inventory the District Offices"
 REC_exp_district_inventory_desc:0 "Recta needs to know which offices are functioning and which records survived. The inventory concerns the territory already administered by the republic and makes no new territorial claim."
 REC_exp_reconstruction_register:0 "The Reconstruction Register"
 REC_exp_reconstruction_register_desc:0 "After the existing settlement has been accepted, local offices can register damaged housing and public works. A public register makes competing claims visible before funds are assigned."
 REC_exp_rail_workshops:0 "Reopen the Rail Workshops"
 REC_exp_rail_workshops_desc:0 "Repair crews will restore locomotives and freight wagons before planning a larger network. Skilled workers and usable parts are the immediate limits on reconstruction."
 REC_exp_municipal_accounts:0 "Publish Municipal Accounts"
 REC_exp_municipal_accounts_desc:0 "Standard accounts let the administration compare district needs. Publishing them consumes political authority but limits the cost of rebuilding the same service twice."
 REC_exp_security_review:0 "Review the Security Apparatus"
 REC_exp_security_review_desc:0 "The hardline programme needs a review of who can issue orders and who can investigate abuses. Its political purpose is preserved, but indiscriminate requisitioning must stop disrupting recovery."
 REC_exp_council_audit:0 "Audit the Economic Councils"
 REC_exp_council_audit_desc:0 "Reform has transferred decisions to councils with uneven experience. A common audit procedure will identify shortages without reversing the political choice that created the councils."
 REC_exp_gebet_standards:0 "Technical Standards with Gebet"
 REC_exp_gebet_standards_desc:0 "Prepare compatible inspection and repair procedures for trade with Gebet. Domestic workshops keep the technical lessons even if diplomatic cooperation later becomes impossible."
 REC_exp_border_services:0 "Civil Services at the Frontier"
 REC_exp_border_services_desc:0 "A border guard needs customs clerks, interpreters and medical support. Improving those services reduces friction without redrawing the frontier."
 REC_exp_fato_liaison:0 "A FATO Liaison Office"
 REC_exp_fato_liaison_desc:0 "The partnership requires a reliable channel for ordinary administrative work. The office will prepare requests and maintain domestic records without changing faction ownership."
 REC_exp_independent_recovery:0 "Recovery on Rectan Terms"
 REC_exp_independent_recovery_desc:0 "Distance from FATO leaves more responsibility with domestic institutions. Preserve the workshop and municipal networks needed to sustain that choice."
 REC_exp_recovery_assessment:0 "Assess the Rectan Recovery"
 REC_exp_recovery_assessment_desc:0 "The republic will assess the recovery achieved within its existing settlement. The cabinet can preserve a standing service or use the accumulated capacity for a final immediate improvement."
 YUK_exp_industrial_inventory:0 "Inventory the Industrial Ministries"
 YUK_exp_industrial_inventory_desc:0 "Yuktobania's industrial ministries must distinguish planned capacity from machines and crews ready for use. A common inventory gives the civilian and military programmes a realistic foundation."
 YUK_exp_rail_dispatch:0 "Modernise Rail Dispatch"
 YUK_exp_rail_dispatch_desc:0 "Dispatch offices will share maintenance closures and freight priorities. Better information improves the existing network before the government commits to expensive expansion."
 YUK_exp_machine_contracts:0 "Civil Machine-Tool Contracts"
 YUK_exp_machine_contracts_desc:0 "Predictable civilian orders can sustain workshops between military contracts. The cabinet must decide how much discretion to leave with ministries and how much scrutiny to permit."
 YUK_exp_regional_depots:0 "Regional Supply Depots"
 YUK_exp_regional_depots_desc:0 "Distribute essential spares across regional depots. The programme requires more inspection work, but reduces reliance on a single large storage and dispatch centre."
 YUK_exp_production_audit:0 "An Audit of Production Claims"
 YUK_exp_production_audit_desc:0 "Compare deliveries with the ministries' production claims. Reward reliable suppliers and expose bottlenecks before another emergency encourages optimistic reporting."
 YUK_exp_veteran_services:0 "Services for Intervention Veterans"
 YUK_exp_veteran_services_desc:0 "The intervention has left medical and administrative obligations. Veteran services will preserve experience while reducing the cost of unresolved claims on the command system."
 YUK_exp_expedition_logistics:0 "Study Expeditionary Logistics"
 YUK_exp_expedition_logistics_desc:0 "Staff officers will examine the transport and maintenance costs of intervention. The lessons improve planning without committing Yuktobania to another foreign deployment."
 YUK_exp_delegated_inspection:0 "Inspect Delegated Commands"
 YUK_exp_delegated_inspection_desc:0 "Command reform needs a way to evaluate initiative without recreating central micromanagement. Inspection teams will compare readiness and maintenance outcomes rather than the volume of reports."
 YUK_exp_reform_logistics:0 "Logistics for the Reformed Army"
 YUK_exp_reform_logistics_desc:0 "Regional commanders need reliable supply authority if delegated initiative is to mean anything. Codify procurement limits and the support available from the central ministries."
 YUK_exp_command_assessment:0 "Assess Command Responsibility"
 YUK_exp_command_assessment_desc:0 "The army will review the consequences of its chosen command path. Both intervention experience and institutional reform can inform the assessment, but neither erases the other's political cost."
 YUK_exp_civil_observatories:0 "Fund Civil Observatories"
 YUK_exp_civil_observatories_desc:0 "Civilian observatories will improve tracking and train technicians. The work provides a domestic scientific foundation independently of any later Arkbird partnership."
 YUK_exp_tracking_archives:0 "Preserve the Tracking Archives"
 YUK_exp_tracking_archives_desc:0 "Observations need consistent timestamps and accessible records. A civilian archive allows later scientists to test earlier conclusions instead of relying on institutional memory."
 YUK_exp_arkbird_science:0 "Civil Science from Arkbird"
 YUK_exp_arkbird_science_desc:0 "The established cooperation programme has produced expertise as well as debris observations. Civil laboratories will study that knowledge within the existing partnership, without claiming control of the project itself."
 YUK_exp_data_protocols:0 "Prepare Scientific Data Protocols"
 YUK_exp_data_protocols_desc:0 "Prepare a domestic standard for publishing orbital observations. Bilateral publication proceeds only while Osea and Yuktobania remain independent, at peace with each other and able to cooperate. A failed partnership leaves the domestic archive useful."
 YUK_exp_civil_science_assessment:0 "Assess Civilian Space Cooperation"
 YUK_exp_civil_science_assessment_desc:0 "The civilian programme will assess the scientific value of the partnership and the cost of maintaining its institutions. The assessment does not grant project completion or transfer control of Arkbird."
 YUK_exp_domestic_science:0 "A Domestic Scientific Service"
 YUK_exp_domestic_science_desc:0 "Even if cooperation abroad is interrupted, the observatories can support weather, navigation and technical education. Preserve that civilian service as a useful conclusion to the domestic programme."
 ac_expansion.1.t:0 "The Papers from Farbanti"
 ac_expansion.1.d:0 "The ministries have delivered their inventories to Farbanti. Some describe a capable state; others describe the same people and equipment promised to several departments at once. The cabinet can spend political authority on making the accounts honest, or leave more room for the services to resolve shortages internally. Neither choice predicts the disaster to come, but both will shape how the state responds to it.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.1.a:0 "Publish the account and accept the political cost."
 ac_expansion.1.b:0 "Strengthen the coordinating staff."
 ac_expansion.2.t:0 "The Ministry and the Districts"
 ac_expansion.2.d:0 "The district accounts have forced Farbanti to confront conflicting claims on its transport and housing budgets. Municipal officers want published allocations and a civilian appeal process. The defence establishment wants requisition orders to pass through a single directive chain. The arrangement chosen here will govern the institutions developed by this programme, including those that survive into the later emergency.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.2.a:0 "Adopt public review."
 ac_expansion.2.b:0 "Retain directive authority."
 ac_expansion.3.t:0 "A Reserve for the Frontier"
 ac_expansion.3.d:0 "Customs officials and relief administrators have identified a reserve of vehicles, interpreters and medical staff. They can protect civilian capacity for displaced families, or leave the trained cadres available to the services. The frontier policy already chosen remains in force: this decision determines how its consequences are administered. A protected relief allocation can ease an existing Usean crisis; preparation made before the calendar opens is carried forward once.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.3.a:0 "Protect the civilian relief allocation."
 ac_expansion.3.b:0 "Retain trained readiness cadres."
 ac_expansion.4.t:0 "What Farbanti Can Sustain"
 ac_expansion.4.d:0 "The settlement has left Erusea with obligations that a victory speech or a peace agreement cannot discharge. Displaced households still need documents, damaged districts need repair crews, and the treasury needs reliable accounts. The administration must decide whether to retain the programme as a permanent recovery service or use its reserve for immediate civilian recovery. Neither choice revises the territorial or diplomatic settlement already reached.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.4.a:0 "Keep a standing recovery service."
 ac_expansion.4.b:0 "Use the reserve for immediate recovery."
 ac_expansion.11.t:0 "Promises around the Council Table"
 ac_expansion.11.d:0 "The treaty secretariat has collected enough figures to see where the promises overlap. The same transport capacity appears in several emergency plans, while some districts have promised assistance without naming who would deliver it. The council must choose whether to confront these discrepancies publicly or ask the services to settle them through a smaller coordinating staff.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.11.a:0 "Publish the shortfalls and request a public mandate."
 ac_expansion.11.b:0 "Authorize a temporary coordination staff."
 ac_expansion.12.t:0 "What Does an Equal Contribution Mean?"
 ac_expansion.12.d:0 "Smaller members want published commitments, equal representation and a right to challenge requisitions. Districts facing larger reconstruction needs want a pooled fund directed by the secretariat. An equal-member compact strengthens confidence but consumes political attention; a needs-based fund speeds construction while tying up civilian resources and provoking disputes with net contributors. The chosen bargain opens its own concluding focus and carries into the later coalition-burden review.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.12.a:0 "Guarantee equal members and published contributions."
 ac_expansion.12.b:0 "Pool contributions and allocate them by need."
 ac_expansion.13.t:0 "The Last Unallocated Convoy"
 ac_expansion.13.d:0 "The medical register has identified enough vehicles and trained crews for one reserve. Protected civilian convoys will improve supply planning and ease pressure on shelters, while limiting mobilisation rhetoric. A dual-use reserve will speed military planning but tie up commercial capacity. Each policy opens a different training focus and changes the later relief transport board and escort schedules. The council cannot promise the same convoy twice.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.13.a:0 "Protect the civilian convoy allocation."
 ac_expansion.13.b:0 "Contract a reserve for civil and military use."
 ac_expansion.14.t:0 "The Obligations after the Settlement"
 ac_expansion.14.d:0 "The treaty offices now have delivery records, repair procedures and staff who have worked across ministerial boundaries. They also have unpaid claims and partners expecting emergency contributions to end. The council can retain a standing recovery service with a continuing civilian cost, or release the reserve to the immediate recovery effort. This assessment applies to the peace or war settlement actually reached and creates no new faction or external authority.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.14.a:0 "Retain the treaty recovery secretariat."
 ac_expansion.14.b:0 "Return the emergency reserve to the districts."
 ac_expansion.21.t:0 "The Cost of an Island Mandate"
 ac_expansion.21.d:0 "The cabinet has inherited a mandate and a narrow margin for error. Imported fuel, harbour repairs and airfield maintenance compete with the services that island communities expect every day. The accounts now show what can be sustained. Ministers must decide whether to spend their authority on a public reckoning or strengthen the staff that will manage an emergency.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.21.a:0 "Publish the account and accept the political cost."
 ac_expansion.21.b:0 "Strengthen the coordinating staff."
 ac_expansion.22.t:0 "The Harbour Board and the Cabinet"
 ac_expansion.22.d:0 "North Point's harbour survey has made the island's bottlenecks visible. Municipal representatives want berth allocations, fuel reserves and requisition accounts open to review. The security staff wants a single authority able to clear a harbour or disperse supplies at short notice. This choice governs the island administration regardless of whether the government later maintains guarded neutrality or supports ISAF.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.22.a:0 "Adopt public review."
 ac_expansion.22.b:0 "Retain directive authority."
 ac_expansion.23.t:0 "Shelter Stores or Readiness Crews"
 ac_expansion.23.d:0 "The island preparations have reached the point where trained crews can be held in reserve. Civil authorities want protected capacity for receiving evacuees, repairing utilities and distributing supplies. Air and coastal defence officers want the personnel retained for exercises and maintenance. Both requests serve the island; only one can have first claim on the reserve. The alignment decision remains with the established neutrality and participation branches.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.23.a:0 "Protect the civilian relief allocation."
 ac_expansion.23.b:0 "Retain trained readiness cadres."
 ac_expansion.24.t:0 "The Island after the Emergency"
 ac_expansion.24.d:0 "North Point's concluding programme has left working procedures for the path it chose. A neutral island must still maintain warning stations and civil shelters; an island supporting ISAF must also account for the burden of hosting and transport. The cabinet can preserve the experienced repair and relief staff as a standing service or spend the remaining reserve on immediate recovery. Neither option changes the island's existing alignment.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.24.a:0 "Keep a standing recovery service."
 ac_expansion.24.b:0 "Use the reserve for immediate recovery."
 ac_expansion.31.t:0 "The District Ledgers"
 ac_expansion.31.d:0 "The first district ledgers have arrived at the republican offices. Some are complete; others contain lists of missing records and buildings whose purpose has changed repeatedly. Before reconstruction can become more than a promise, the administration needs a defensible account of what it governs. The existing territorial settlement remains the limit of this programme.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.31.a:0 "Publish the account and accept the political cost."
 ac_expansion.31.b:0 "Strengthen the coordinating staff."
 ac_expansion.32.t:0 "Who Answers for a District Order?"
 ac_expansion.32.d:0 "Rectan district offices have begun to function again, but an order to requisition a vehicle can still pass through several competing authorities. Reform officials propose public allocations and an appeal procedure. Hardline administrators argue that the security chain must be able to act before a dispute reaches a council. The choice establishes the administrative method used by reconstruction within the existing territorial settlement.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.32.a:0 "Adopt public review."
 ac_expansion.32.b:0 "Retain directive authority."
 ac_expansion.33.t:0 "The Reconstruction Reserve"
 ac_expansion.33.d:0 "Workshop foremen and district officials have assembled a small reserve of serviceable equipment and trained personnel. Civil planners want it protected for utility repairs and relief work; security officers want the cadres retained for readiness and domestic security. Cooperation with Gebet or FATO does not remove this domestic decision. Recta must first decide what capacity it can reliably provide from its own institutions.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.33.a:0 "Protect the civilian relief allocation."
 ac_expansion.33.b:0 "Retain trained readiness cadres."
 ac_expansion.34.t:0 "A Republic with Working Institutions"
 ac_expansion.34.d:0 "The reconstruction programme can now be judged by repaired services and functioning offices. Its future depends on whether experienced staff remain together after the immediate work ends. A standing service offers cheaper logistical support at a continuing civilian cost. Releasing the reserve gives immediate recovery and confidence a boost, but leaves later repairs to ordinary departments. The settlement and the postwar entry conditions remain unchanged.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.34.a:0 "Keep a standing recovery service."
 ac_expansion.34.b:0 "Use the reserve for immediate recovery."
 ac_expansion.41.t:0 "Capacity behind the Production Figures"
 ac_expansion.41.d:0 "The industrial inventory distinguishes what the ministries have planned from what their workshops can actually deliver. Rail dispatchers describe shortages that production reports barely mention. Civil administrators and the command staff agree that something must change, but disagree over who should have the authority to demand it.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.41.a:0 "Publish the account and accept the political cost."
 ac_expansion.41.b:0 "Strengthen the coordinating staff."
 ac_expansion.42.t:0 "The Ministries and the Command Staff"
 ac_expansion.42.d:0 "The industrial and logistics review has exposed the gap between a production target and a train that can actually deliver it. Civil ministries want published allocations and a review process that workshop managers can use. The command staff wants authority to redirect capacity as an operational requirement changes. The resulting administrative policy complements the existing command-reform choices; it does not replace them.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.42.a:0 "Adopt public review."
 ac_expansion.42.b:0 "Retain directive authority."
 ac_expansion.43.t:0 "Protecting Civilian Capacity"
 ac_expansion.43.d:0 "The completed programme has created a reserve of trained technicians, transport crews and serviceable equipment. Civil administrators want that capacity protected for relief and scientific support. Intervention planners want the cadres retained for readiness. Arkbird cooperation remains subject to the existing partnership and project rules: this allocation concerns Yuktobania's domestic capacity and cannot promise access to another country's facilities or data.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.43.a:0 "Protect the civilian relief allocation."
 ac_expansion.43.b:0 "Retain trained readiness cadres."
 ac_expansion.44.t:0 "What Cooperation Leaves Behind"
 ac_expansion.44.d:0 "The programme has produced procedures and trained staff that can outlast a particular command arrangement or diplomatic initiative. The government must decide whether to maintain them as a permanent recovery service or release the reserve for immediate civilian recovery. Civilian science can benefit from reliable transport and maintenance without becoming a new weapons programme. No assumption is made that an interrupted Arkbird partnership remains active.\n\nThese choices are authored alternatives within the campaign."
 ac_expansion.44.a:0 "Keep a standing recovery service."
 ac_expansion.44.b:0 "Use the reserve for immediate recovery."
 ERU_exp_civil:0 "Erusea: Public Administrative Review"
 ERU_exp_civil_desc:0 "Published allocations and appeals improve public confidence. Maintaining the review process consumes political attention."
 ERU_exp_directive:0 "Erusea: Directive Administration"
 ERU_exp_directive_desc:0 "A concentrated administrative chain supports military readiness while weakening confidence in civilian oversight."
 ERU_exp_service:0 "Erusea: Standing Recovery Service"
 ERU_exp_service_desc:0 "Experienced repair and relief staff reduce disruption. Maintaining the permanent service ties up civilian resources."
 ERU_exp_programmes:0 "Erusea: Public Programmes"
 ERU_exp_programmes_desc:0 "Review the continuing cost of the completed national programmes."
 ERU_exp_maintain_services:0 "Rehearse the Recovery Services"
 ERU_exp_maintain_services_desc:0 "Spend political authority on a recurring exercise of repair and relief procedures. The exercise improves the current recovery effort, but can only be repeated after six months. It requires a completed programme and an active recovery system."
 FCU_exp_civil:0 "Central Usea: Equal-Member Compact"
 FCU_exp_civil_desc:0 "Contributions are certified publicly and each member retains a voice. The appeals process sustains confidence but consumes political attention."
 FCU_exp_directive:0 "Central Usea: Needs-Based Common Fund"
 FCU_exp_directive_desc:0 "The secretariat directs reconstruction toward the greatest need. A permanent common contribution and disputes with net contributors are the price of faster construction."
 FCU_exp_service:0 "Central Usea: Treaty Recovery Secretariat"
 FCU_exp_service_desc:0 "A permanent civilian staff maintains repair contracts and relief routes after the settlement. Its payroll continues after emergency mobilisation ends."
 FCU_exp_relief_priority:0 "Central Usea: Protected Civil Convoys"
 FCU_exp_relief_priority_desc:0 "Medical and shelter transport is ring-fenced from military requisition. Supply planning improves while the government limits its mobilisation rhetoric."
 FCU_exp_dual_use:0 "Central Usea: Dual-Use Transport Reserve"
 FCU_exp_dual_use_desc:0 "Civilian carriers train with the services and remain available for mobilisation. Joint planning improves, but keeping the reserve ready ties up commercial capacity."
 FCU_exp_joint_staff:0 "Central Usea: Coalition Liaison Rotation"
 FCU_exp_joint_staff_desc:0 "For one year, liaison teams train headquarters together. Frequent exercises accelerate planning and consume additional supplies."
 FCU_exp_air_picture:0 "Central Usea: Coordinated Air Reporting"
 FCU_exp_air_picture_desc:0 "For one year, shared identification and reporting procedures improve air missions. Maintaining the liaison network consumes political attention."
