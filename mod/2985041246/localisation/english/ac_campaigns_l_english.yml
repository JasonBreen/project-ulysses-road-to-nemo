 ac_camp.2004.t:0 "A bounded offer from Amber"
 ac_camp.2004.desc:0 "The transport offer arrives with a limit written into its first paragraph. Amber has already paid for preparation. The coalition must now decide whether it can use the defined commitment on those terms. A staff officer suggests asking for a larger allocation. The liaison points out that such an answer would still be a refusal of the offer presently on the table. Behind the papers are drivers and depot staff whose time cannot be multiplied by improving the wording of a reply. Acceptance records a current receiving permission. It does not provide a second payment or a free stockpile."
