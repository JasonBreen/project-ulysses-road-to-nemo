 ERU_camp_1_register:0 "Service before legend"
 ERU_camp_1_register_desc:0 "Service before legend. Open the campaign lane and its preparation record.\n\nThe maintenance chief knows precisely how many sorties the briefing requires. She also knows which aircraft has returned twice with the same fault. An argument about a spare part becomes an argument about loyalty as soon as a superior enters the hangar. Preserving the reserve means disappointing the operations room while there is still time to do so. Immediate readiness carries a different cost, which cannot be paid by the man who merely writes the number on a board. On the next shift, another mechanic will read the release entry and decide whether the signature beneath it can still be trusted."
