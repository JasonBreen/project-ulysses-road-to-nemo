 ac_camp.90.t:0 "The person who could answer back"
 ac_camp.90.desc:0 "The receiving list had acquired a column for changed duties. The clerk stopped at Chopper's name long enough for the man behind him to ask whether there was a problem. There was not. That was the point, although the clerk could not explain why the ordinary answer had caught in his throat.\n\nThe war had ended, and Chopper was alive to disagree with the arrangements being made around him. The rescue had become a sentence in the final account. Its longer version remained in the recovery file, beside the reserve allocation and the names of the people who had been kept available before anyone knew they would be needed.\n\nAn officer asked whether the squadron could receive visitors. The answer depended on several people whose work the visitors would not notice unless it was absent: the receiving clerk, the mechanic, the person arranging a quiet place for a crew that had spent too much time being watched.\n\nOutside, a conversation became laughter and then an argument about something small. The officer looked toward the door. He had become accustomed to interpreting every sudden sound as information about the military situation. Learning to hear an ordinary dispute would take longer than the announcement of peace.\n\nThe clerk finished the new duty entry. Keeping a person alive had not preserved the life he would have led before the war. It had preserved his part in deciding what would happen next. That was a less complete victory than the paperwork suggested and a much larger one than an empty space on the old list could have supplied."
