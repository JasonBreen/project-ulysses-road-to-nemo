 ac_wd_nrl.1.t:0 "Who Holds the Seals"
 ac_wd_nrl.1.d:0 "The year opens quietly in Aspneset. An Office of the Crown holds the seals of the principality, the diet returned at New Year has been given no date to sit, and elections are suspended until the palace decides otherwise. Nordlands is calm, comfortable and far from any battlefield, and most citizens see no reason to change an arrangement that has kept it so. More than half of them vote for the crown's friends whenever they are allowed to vote.\n\nCalm is not the same thing as consent. Liberal deputies, backed by roughly a quarter of the electorate, want a cabinet that answers to the diet. The shipping, yard and oil houses of the coast pay most of the country's taxes and would prefer to govern through councils of their own. A circle of palace officials believes the Office should simply be confirmed as the government and stop apologising for its existence.\n\nThe secretaries of the Office have drafted a stocktaking of who decides what in the principality. Before it begins, they want a ruling on how it will be conducted. In public, it will be slow, noisy and a platform for every faction. Inside the palace, it will be quick, tidy and distrusted from the first day.\n\nProvisional gameplay."
 ac_wd_nrl.1.a:0 "Conduct it in public."
 ac_wd_nrl.1.b:0 "Keep it inside the palace."
 ac_wd_nrl.2.t:0 "Half the Slipways Idle"
 ac_wd_nrl.2.d:0 "The slipway census lands on the minister's desk with a blunt summary: the Nordlandic coast has more yard capacity than it has orders. Eleven dockyards share the work between Norden Forest, the twin harbours of Djurseryd and Havnaraas, Nyboholm in Tenese and a small yard on the Hait Mountain coast. On an ordinary day a good part of that capacity is idle, and the census counts cranes that have not lifted anything in months.\n\nThe yard owners blame cheap foreign competition and ask for subsidies. The admiralty notes that the fleet's escorts and submarines are ageing and could keep several yards busy for a decade, if the treasury paid. The unions want any plan that keeps their members employed and distrust every plan that mentions efficiency. Fitters at the older yards add that repair work, which pays well and needs fewer slipways, has been neglected for years.\n\nThe government has not chosen a model for the yards, and it does not need to choose one today. It does need to decide what the census means in public. Published in full, it will start a fierce argument about which yards have a future. Shared only with the owners and the admiralty, it will guide policy quietly while every harbour town assumes the worst.\n\nProvisional gameplay."
 ac_wd_nrl.2.a:0 "Publish the census in full."
 ac_wd_nrl_2_a:0 "Publish the census in full."
 ac_wd_nrl.2.b:0 "Brief the owners and the admiralty."
 ac_wd_nrl.3.t:0 "Oil Beneath the Peninsula"
 ac_wd_nrl.3.d:0 "The survey teams come back from the Nord Peninsula with maps that change the national budget. The fields under the peninsula hold more oil than every other Nordlandic field combined, and the smaller fields of East Granley, Haugaland and the capital district are richer than the old estimates claimed. For a country that has lived from its yards and its merchant fleet, oil offers a second income that needs no foreign shipowner to stay afloat.\n\nThe peninsula itself is thinly settled. It has a single road, an airfield, three arms plants and small towns that are used to being forgotten. Their councils ask what share of the wealth will stay where it is pumped. The oil houses on the coast want leases quickly and say the state is too slow to drill. The treasury wants the revenue but fears an economy that rises and falls with the price of a single product.\n\nMinisters have not chosen how the fields will be owned. They must first decide whether to slow the rush or welcome it. Whatever they say this month will be read as a signal by every bidder, and speculators are already buying land near the old wells in the hope of selling it back to whoever drills.\n\nProvisional gameplay."
 ac_wd_nrl.3.a:0 "Slow the rush until the law is written."
 ac_wd_nrl.3.b:0 "Open the peninsula to bidders now."
 ac_wd_nrl_3_b:0 "Open the peninsula to bidders now."
 ac_wd_nrl.4.t:0 "A Country Without Conscripts"
 ac_wd_nrl.4.d:0 "Nordlands raises almost no conscripts. Its manpower law is the lightest any state keeps, and support for war, measured in any way the ministries care to try, is close to nothing. Yet its depots hold three hundred tanks, thousands of trucks, artillery for several divisions and equipment for far more soldiers than it employs. The country is disarmed in its habits and armed in its warehouses.\n\nNobody planned this. The equipment was bought in years when governments worried more, and the conscripts were released in years when they worried less. Pacifist deputies want the stores sold or scrapped. The general staff wants a reserve system that can use them. Harbour towns, which feel exposed, want someone guarding the oil jetties and the naval harbour, and they do not much mind who.\n\nThe defence review must decide what the stores are for before deciding anything else. How it is run will colour the answer: a review led by officers will be trusted by the army and resented by the diet, while a review open to the public will produce a broad consensus and very little equipment policy.\n\nProvisional gameplay."
 ac_wd_nrl.4.a:0 "Let the general staff lead."
 ac_wd_nrl.4.b:0 "Open the review to the public."
 ac_wd_nrl.5.t:0 "The Fleet That Stays in Harbour"
 ac_wd_nrl.5.d:0 "The admiralty's new doctrine is printed, and the newspapers have already given it a nickname: the fleet that stays in harbour. The doctrine says that a small navy deters best by surviving, keeping its escorts and coastal submarines close to defended bases and sailing only when the odds are good. It is a sensible policy for a country with a long coast, a large merchant fleet and no wish to fight anyone.\n\nIt is also an easy policy to mock. Merchant captains ask who will protect them at sea if the warships stay home. Junior officers complain that a navy which never sails never learns. The yards point out that a fleet in being still needs modern hulls, and the treasury points out that modern hulls cost money it would rather not spend on ships designed to wait.\n\nThe admirals must now explain the doctrine to the country and to the diet. They can argue it as a deterrent, which will please the general staff and frighten no one abroad, or as a shield for trade, which will please the shipowners and commit the fleet to protecting them whenever they ask.\n\nProvisional gameplay."
 ac_wd_nrl.5.a:0 "Present it as a deterrent."
 ac_wd_nrl.5.b:0 "Present it as a shield for trade."
 ac_wd_nrl.6.t:0 "A Capital on the Frontier"
 ac_wd_nrl.6.d:0 "Few capitals sit as close to their neighbours as Aspneset. The West Norden district touches FATO at the crossings into Granley Tips and Gangl, and Wielvakia at Farnlands and Vakia. Trains, trucks and day workers cross every morning. Until now, each crossing has been run by whichever officials happened to be posted there, using forms nobody has revised in decades.\n\nNeither neighbour has given Nordlands cause for alarm in years, which is exactly why the frontier has been neglected. Smuggling is modest, delays are long and disputes go to ministries that answer letters slowly. Merchants on all three sides have learned to pay their way through, and the customs service has learned to let them. East Granley, Hait Mountain and Oregonen have their own crossings and their own habits.\n\nThe government proposes shared customs desks with both neighbours as a first step. Before the desks open, it must decide how to describe them. Presented as a convenience for traders, they will be welcomed by merchants and ignored by everyone else. Presented as a security measure, they will reassure the cautious and make both neighbours wonder what Nordlands has heard.\n\nProvisional gameplay."
 ac_wd_nrl.6.a:0 "Call it a convenience for trade."
 ac_wd_nrl.6.b:0 "Call it a matter of security."
 ac_wd_nrl.7.t:0 "War Beyond FATO"
 ac_wd_nrl.7.d:0 "In late March 1995 the Belkan War breaks out. Nordlands has no border with Belka, but FATO does, and FATO shares a long frontier with West Norden and East Granley. Within hours the watch room in Aspneset is taking calls from frontier posts, harbour masters and shipping offices that all want to know the same thing: how close will this come?\n\nThe first days bring rumours faster than facts. Radio bulletins contradict one another, insurers raise their rates on every lane near the fighting, and the oil houses ask whether tankers bound for ports near the war should keep sailing. The frontier commands report heavy traffic on the FATO side of the line, though nobody can say whether it is refugees, merchants or soldiers.\n\nThe government has said nothing yet beyond confirming that Nordlands is not a party to the war. Every faction wants a statement: the houses want reassurance, the pacifists want a declaration, and the admiralty wants authority to watch the harbour approaches more closely. The first decision is narrower and harder: how much of the government's own uncertainty to share with the public.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25 in tools/lore/chronicle.json; the Nordlandic response is gameplay."
 ac_wd_nrl.7.a:0 "Tell the public everything we know."
 ac_wd_nrl.7.b:0 "Reassure first, explain later."
 ac_wd_nrl.8.t:0 "Warships at the Harbour Mouth"
 ac_wd_nrl.8.d:0 "A warship of one of the belligerents appears off the Norden Forest coast and signals a request to enter harbour for fuel and repairs. Its captain reports minor damage and a sick crew member. The ship is armed, its flag is unmistakable, and its arrival has been noticed by every fishing boat and newspaper on that stretch of coast before the admiralty has finished reading the signal.\n\nCustom allows a neutral port to admit a belligerent warship in distress for a short time and for limited repairs. It does not oblige the port to do so, and every hour the ship spends alongside will be read by the other side as a favour. The harbour master wants instructions. The shipowners want the ship gone before insurers notice. The doctors want the sick sailor ashore.\n\nWhatever the principality decides will become precedent. Other warships, from either side, will ask for the same treatment and point to this one when they do. The admiralty has drafted three replies, and the government has a few hours before the captain stops waiting for an answer and decides the matter alone.\n\nProvisional gameplay."
 ac_wd_nrl.8.a:0 "Admit it for repairs, under strict limits."
 ac_wd_nrl.8.b:0 "Land the sailor, refuse the ship."
 ac_wd_nrl.8.c:0 "Refuse entry outright."
 ac_wd_nrl.9.t:0 "Officers Who Serve No Country"
 ac_wd_nrl.9.d:0 "On Christmas Day 1995 a group calling itself A World With No Boundaries launches a coup. Its name is its programme: a movement that rejects the borders of every state. The Allied Forces answer it, and on the last day of the year they attack its V2 facilities at Avalon Dam and defeat the rebellion. The news reaches Aspneset in fragments, and none of the fragments is reassuring.\n\nNordlands has few officers and fewer secrets, but the coup raises an uncomfortable question. A small, comfortable officer corps that has never fought might be exactly the kind of body in which such ideas could take root quietly. The general staff insists that its officers are loyal. The diet's liberals want an inquiry. The palace wants the matter handled without accusing anyone in particular.\n\nThe government can order a quiet review of the officer corps, conducted by the general staff itself, or an open inquiry by a committee of the diet with powers to question anyone. A quiet review protects reputations and may miss everything. An open inquiry will find whatever there is to find, and it will humiliate many officers who have done nothing wrong.\n\nProvisional gameplay: date anchors only, ACES Chronicle rows 1995 / 12.25 and 1995 / 12.31 in tools/lore/chronicle.json; the Nordlandic response is gameplay."
 ac_wd_nrl.9.a:0 "Order a quiet review by the staff."
 ac_wd_nrl.9.b:0 "Open an inquiry by the diet."
 ac_wd_nrl.10.t:0 "Pilots Without an Air Force"
 ac_wd_nrl.10.d:0 "By the summer of 1998 former top pilots of the Belkan Air Force have found new employers. Various countries hire them to fly as aggressor squadrons, playing the enemy in training so that their own crews learn what a skilled opponent feels like. Agents for some of these pilots are now in Aspneset, offering a contract the Nordlandic air arm never imagined being offered.\n\nThe air arm's commanders are enthusiastic. Their pilots have never flown against anyone better than each other, and a few months against veterans would teach them more than years of exercises. The diet is divided. Some deputies object to paying veterans of a war that frightened the whole region, and others note that the pilots are selling their skill, not their politics.\n\nThe palace wants a decision before the agents take their offer elsewhere. Whatever the government chooses, the air arm will remember it. A contract buys skill quickly and invites a public argument about whose veterans should teach Nordlandic pilots. A refusal keeps the argument out of the papers and asks the air arm to build its own teachers, slowly.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1998 / 06.19 in tools/lore/chronicle.json; any Nordlandic contract is gameplay."
 ac_wd_nrl.10.a:0 "Open talks with the agents."
 ac_wd_nrl.10.b:0 "Thank them and decline for now."
 ac_wd_nrl.11.t:0 "Ulysses Will Strike"
 ac_wd_nrl.11.d:0 "In April 1996 the President of the FCU tells the world that the asteroid Ulysses will strike the Earth and announces plans to counter it. Nobody can yet say where its fragments will fall. Nordlands has eight coastal districts, one inland capital and a coastline no wall could protect, and the country wakes to the news that its future depends on the arithmetic of orbits.\n\nThe advisers divide along familiar lines. Engineers propose shelters dug under the larger cities and stocked for weeks. Planners propose evacuation timetables and early warning, arguing that a few hours of notice, well used, are worth more than tunnels. The treasury observes that either plan costs as much as a decade of fleet construction, and the yards observe that their own orders would be the first delayed.\n\nThe public mood swings between panic and denial. Places of worship are crowded, shops sell out of tinned food, and some coastal families talk of moving inland. Before choosing a plan, the government must decide how to speak about a danger it cannot control: openly and immediately, or calmly and only once its plans are ready.\n\nProvisional gameplay: date anchors only, ACES Chronicle rows 1994 / 12.10 and 1996 / 04.20 in tools/lore/chronicle.json; Nordlandic preparations are gameplay."
 ac_wd_nrl.11.a:0 "Speak openly and prepare at once."
 ac_wd_nrl_11_a:0 "Speak openly and prepare at once."
 ac_wd_nrl.11.b:0 "Keep calm until the plan is ready."
 ac_wd_nrl.12.t:0 "Nine Districts, One Treasury"
 ac_wd_nrl.12.d:0 "The district ledger is finished, and it confirms what everyone outside the capital suspected. West Norden and Norden Forest hold most of the population and most of the public spending. The Nord Peninsula, which holds most of the oil, has the fewest schools and the worst roads. Tenese, Oregonen and the twin harbours of Djurseryd and Havnaraas earn much of the shipping income and complain that it is spent elsewhere.\n\nEvery district can read the ledger as a grievance. East Granley and Hait Mountain sit on the frontier and feel watched rather than served. Haugaland's villages share their roads with oil trucks and arms convoys. The capital district pays the most tax and is blamed for the most decisions, which its residents consider doubly unfair.\n\nThe ministers must decide how the ledger will be used. They could publish it district by district and invite every council to argue its case in public, or keep it inside the ministries and use it to steer spending quietly. The first starts a long argument the capital cannot control; the second leaves every district suspecting that it is being cheated by the others.\n\nProvisional gameplay."
 ac_wd_nrl.12.a:0 "Publish it district by district."
 ac_wd_nrl.12.b:0 "Keep it for the ministries."
 ac_wd_nrl.13.t:0 "The Principality at Ten Years"
 ac_wd_nrl.13.d:0 "Ten years after the crown first took stock of its own powers, an independent commission publishes its review of how Nordlands governs itself. Its members, drawn by lot from judges, harbour officials and district deputies, were given access to every ministry. Their report runs to several volumes, and the summary alone is longer than most newspapers are willing to print.\n\nThe findings please nobody completely. The principality is richer, its frontier is quiet and its fleet still exists, which is all the fleet ever promised. But the commission finds too much power in too few offices, too much revenue in a handful of houses and districts, and a younger generation that takes the calm for granted. It warns that the arrangements of the nineties were built for a quiet decade, and the region has not been quiet.\n\nThe government must decide how to receive the report. It can publish every volume unedited and accept a season of hostile commentary, or release an approved summary and let the rest gather dust in the archive. Either way the review will frame political argument for years, and the factions have already chosen their favourite paragraphs.\n\nProvisional gameplay."
 ac_wd_nrl.13.a:0 "Publish every volume."
 ac_wd_nrl.13.b:0 "Release an approved summary."
 ac_wd_nrl.14.t:0 "A War on Another Continent"
 ac_wd_nrl.14.d:0 "Erusea's invasion of the neutral country of San Salvacion starts a war on the Usean continent, an ocean away from Nordlands. Within weeks the war arrives in Nordlandic harbours in its own way. Freight rates rise, insurers redraw their maps, and buyers from every neutral country want fuel delivered sooner than the tanker fleet can manage.\n\nNordlandic shipowners see the best market in a generation. The admiralty sees a merchant fleet about to scatter across dangerous oceans with no navy able to follow it. The oil houses want to sell as much as the peninsula can pump, and the treasury wants to know how much of the windfall it may tax before the owners register their ships under other flags.\n\nThe government will soon have to set a tanker policy. For now, it must decide how to describe its position before newspapers abroad describe it for Nordlands. A firm restatement of neutrality will calm the region and limit the owners' options. A careful silence will keep every option open and invite every belligerent to wonder. Either way, the harbour masters want to know by Monday which flags they may refuel and which they must turn away.\n\nProvisional gameplay: context only, ACES Chronicle row 2003 / SUMMER in tools/lore/chronicle.json; fired by the mod flag ac_ucw_war_started; the Nordlandic response is gameplay."
 ac_wd_nrl.14.a:0 "Restate our neutrality publicly."
 ac_wd_nrl.14.b:0 "Say nothing until the policy is set."
 ac_wd_nrl.15.t:0 "Contraband on the Frontier Roads"
 ac_wd_nrl.15.d:0 "The frontier police, given a week and every spare officer, sweep the back roads between the guarded crossings. They find what everyone expected and a little more: trucks of untaxed fuel heading out, cigarettes and electronics coming in, and a warehouse near the Wielvakian frontier stacked with goods whose papers were signed by officials who should have known better.\n\nThe sweep is a success by any measure the police care about. It is also an embarrassment. Several signatures belong to customs officers who have served for decades, and one belongs to a district official with friends in the capital. Merchants on both sides of the frontier are angry that honest trade was held up for a week, and the neighbours' customs services want to know why they were not told in advance.\n\nThe government can prosecute everyone the sweep uncovered, publicly and at once, and accept the political damage. Or it can settle quietly, dismissing the officials and recovering the taxes without trials. The first shows that the guarded frontier means what it says. The second keeps the peace with the districts and with both neighbours.\n\nProvisional gameplay."
 ac_wd_nrl.15.a:0 "Prosecute in public."
 ac_wd_nrl.15.b:0 "Settle it quietly."
 NRL_wd_crown_cabinet_office:0 "Crown Cabinet of the Diet"
 NRL_wd_crown_cabinet_office_desc:0 "A cabinet drawn from the majority of the elected diet, governing collectively in the name of the crown and bound to resign when it loses the confidence of the diet. Provisional gameplay office with no named holder."
 NRL_wd_privy_office_office:0 "Privy Office of the Crown"
 NRL_wd_privy_office_office_desc:0 "The palace secretariat that held the seals in 1991, confirmed as the government: a small council of crown officers ruling by order, with the diet kept as a consultative body. Provisional gameplay office with no named holder."
 NRL_wd_diet_government_office:0 "Diet Government of the Principality"
 NRL_wd_diet_government_office_desc:0 "An executive elected by and answerable to the diet, with the crown confined to ceremony, honours and the oath of office. Provisional gameplay office with no named holder."
 NRL_wd_harbour_council_office:0 "Council of Harbours and Wells"
 NRL_wd_harbour_council_office_desc:0 "A council of chartered shipping, yard and oil houses holding the seals under crown patronage and governing through commissions; elections stay suspended. Provisional gameplay office with no named holder."
 ac_wd_nrl_decisions:0 "Nordlands: National Measures"
 ac_wd_nrl_decisions_desc:0 "Measures from the national programme of Nordlands. Provisional gameplay unless a source ledger row says otherwise."
 NRL_wd_crown_audience_decision:0 "A Crown Audience at Aspneset"
 NRL_wd_crown_audience_decision_desc:0 "Open the palace for a day of petitions from every district. Costs political power; improves stability a little, once a year."
 NRL_wd_fleet_sortie_decision:0 "Sortie the Fleet in Being"
 NRL_wd_fleet_sortie_decision_desc:0 "Send the fleet to sea for a week of drills. Costs political power and fuel; grants naval experience every half year."
 NRL_wd_harbour_dues_decision:0 "Waive Harbour Dues for a Season"
 NRL_wd_harbour_dues_decision_desc:0 "Waive dues for merchant hulls to win foreign orders. Costs political power; repeatable once a year."
 NRL_wd_shelter_drill_decision:0 "A National Shelter Drill"
 NRL_wd_shelter_drill_decision_desc:0 "Rehearse the Ulysses plans in every district. Costs political power and a little calm; raises readiness yearly."
 NRL_wd_peninsula_strip_decision:0 "A Dispersal Strip on the Peninsula"
 NRL_wd_peninsula_strip_decision_desc:0 "Build a dispersal airstrip near the peninsula oil fields. Costs political power; once only."
 NRL_wd_tariff_sweep_decision:0 "Sweep the Smuggling Roads"
 NRL_wd_tariff_sweep_decision_desc:0 "Send the frontier police along the back roads between the guarded crossings for a week. Costs political power; once only."
 NRL_wd_fuel_release_decision:0 "Release Reserve Fuel to Industry"
 NRL_wd_fuel_release_decision_desc:0 "Sell part of the strategic fuel reserve to factories for a season. Costs political power; repeatable once a year."
