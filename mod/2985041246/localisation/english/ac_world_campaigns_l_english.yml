 ac_wc_soa.21.d:0 "A contractor can diagnose a military system but can also disable its support. Sellen asks for inspection rights. Vey wants source documentation. Halvek proposes a service acceptance team independent of the seller.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
