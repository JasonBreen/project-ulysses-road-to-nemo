 YUK_snc_national_return_civil_spirit:0 "Open national receiving account"
 YUK_snc_national_return_civil_spirit_desc:0 "Keep the concluding receiving account open to civil challenge. The selected practice improves ordinary repair continuity while requiring continued political attention to defend the priorities it preserves. The government does not have to describe every claimant as satisfied. It has to retain enough of the actual decisions that a successor can understand why a request was postponed and who remained responsible for answering it. Earlier reviews provide the earned work behind this conclusion. There is no reason to invent another period merely to make the final return look newer than the obligations it is intended to carry forward."
 YUK_snc_national_return_civil_spirit_settled:0 "Open national receiving account: Standing Review"
 YUK_snc_national_return_civil_spirit_settled_desc:0 "Keep the chosen civil or protected national account as a standing practice, improved through the reviews that genuinely earned it. The continuing cost remains. The receiving secretary leaves room for a successor's correction, the command liaison keeps the unanswered field question attached, and the workshop retains the explanation of its actual margin. The account can be completed when its real obligations have been answered, even if the expected timetable has long passed. It makes no claim that a conflict ended or a foreign exchange succeeded. It gives the next receiving office something more dependable than a balanced total: the responsibilities the government accepted, the work it completed and the limits it was willing to preserve."
 YUK_snc_national_return_protected_spirit:0 "Signed national professional account"
 YUK_snc_national_return_protected_spirit_desc:0 "Retain a signed professional account with the authority and technical responsibility needed to repeat its receiving method. The protected practice improves command continuity while keeping the civilian cost of its reserved attention. It must preserve the field questions and the workshop margin that earlier reviews uncovered, rather than reduce them to a favourable total. The government is not choosing its inherited command structure again or promising another country's cooperation. It is choosing the account a successor will receive when the people who remember the original disagreement are no longer sitting beside every desk that depends on its answer."
 YUK_snc_national_return_protected_spirit_settled:0 "Signed national professional account: Standing Review"
 YUK_snc_national_return_protected_spirit_settled_desc:0 "Keep the chosen civil or protected national account as a standing practice, improved through the reviews that genuinely earned it. The continuing cost remains. The receiving secretary leaves room for a successor's correction, the command liaison keeps the unanswered field question attached, and the workshop retains the explanation of its actual margin. The account can be completed when its real obligations have been answered, even if the expected timetable has long passed. It makes no claim that a conflict ended or a foreign exchange succeeded. It gives the next receiving office something more dependable than a balanced total: the responsibilities the government accepted, the work it completed and the limits it was willing to preserve."
 YUK_snc_national_return_brief:0 "Place the Returns Together"
 YUK_snc_national_return_brief_desc:0 "Bring the field-answer and readiness reviews together only after both have actual completed returns. The receiving secretary does not ask their officers to agree about every national priority. She asks them to identify where an instruction, a qualified person and an accountable recipient finally met. The earlier command and intervention records remain attached. A concluding account must be useful if a partner refused, disappeared or became ineligible, and if the surrounding conflict has not ended. It concerns what the government can hand to a successor without disguising an unanswered request as work that somebody else must already have received."
 YUK_snc_national_return_brief_requirements_tt:0 "From 2011.1.1, an active national administration and the required earlier work are available. The selected policy remains exclusive; conclusions remain available when their real prerequisites finish after the expected calendar."
