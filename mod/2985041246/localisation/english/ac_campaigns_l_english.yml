 ac_camp.67.t:0 "The right to answer"
 ac_camp.67.desc:0 "The first question put to the returning authority was about a broadcast. It should have been about his condition, and the man asking knew that before the words were out. There were units waiting for an order they could recognize and people already deciding what would count as proof that it had come freely.\n\nThe operation had restored Nikanor's political voice to the crisis. It had not made the military's earlier decisions cease to exist. The receiving staff began assembling an account of who had been instructed to do what, and which instructions had passed through offices that now preferred not to answer the telephone.\n\nAn officer asked whether Osea would reciprocate. Nobody in the room was entitled to say that it would. The reply would have to come from a present authority on the other side, through a channel whose record could be kept by both governments.\n\nThe rescued man listened while the conditions were explained. The people doing the explaining had spent much of the war discovering how a condition could be removed from a message without altering its appearance. This time they wanted the limits spoken clearly enough to survive the room.\n\nOutside, the queue at the receiving table had grown again. News of a possible end could make ordinary waiting harder, because it asked people to imagine the journey home before anyone had opened the road.\n\nThe officer preparing the next transmission left space for an actual answer. He would enter refusal, acceptance or silence when one of them occurred. A political restoration deserved at least that much honesty from the paperwork following it."
