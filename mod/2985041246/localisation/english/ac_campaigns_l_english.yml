 ac_camp.14.t:0 "An arrangement with a locked door"
 ac_camp.14.desc:0 "The notice was written in the familiar municipal typeface. That made the additional restriction look like something the town had decided for itself. The administrator read it aloud to the pharmacist and stopped before the final line. It required a receiving signature from an office whose staff had been sent home.\n\nThe route had not become wholly impossible. It had become possible on terms that prevented the clinic from using it when it was most needed. A vehicle could leave on the approved day if the driver was available, the papers were renewed, and the people authorized to confirm them had not been assigned elsewhere. Each condition belonged to a different desk. No single person had refused the whole request.\n\nThe pharmacist folded the notice into the stockbook. She had begun writing smaller to make the remaining space last. Outside, the baker was arguing with a supplier about the meaning of next week. His voice rose, then fell when he remembered how far it could carry along the street.\n\nThe nurse asked whether the arrangement should still be called open. The administrator looked at the signature line. There was an answer that would satisfy the next report and another answer that would help the patients decide what to bring with them.\n\n\"Tell them to bring what they have,\" he said.\n\nThe porter checked the door before leaving. He did not take the opening hours down. They had become a statement about the people inside rather than about the reliability of the road."
 ac_camp.14.a:0 "Keep this account."
 ac_camp.14.z:0 "Close this old message."
