 OSE_snc_pacific_channel_renew_desc:0 "Reopen this interrupted review at the present date for ten political power and two institutional-capacity points. It requires a new corresponding funded period; no old work is retroactively credited and the service pays its own usual costs."
 OSE_snc_pacific_channel_renew_effect_tt:0 "Commit ten political power and two institutional-capacity points to reopen this interrupted review at the present date. A new corresponding funded service must still complete its usual paid work after this request."
 OSE_snc_pacific_channel_renew_requirements_tt:0 "This national review was interrupted before completion. Its protocol is complete, no replacement request is open, and ten political power plus two institutional-capacity points are available."
 OSE_snc_emergency_review_civil_spirit:0 "Civil renewal of exceptions"
 OSE_snc_emergency_review_civil_spirit_desc:0 "The civil renewal procedure gives an exception a return date and a receiving office able to challenge its continuation. Its officials must explain a refusal without implying that the original emergency was imaginary. That is demanding political work, and it can reduce the military margin available for an immediate response. Accept the burden in exchange for a more dependable civil account. A renewal hearing does not decide every operational question. It decides whether the government can still identify the authority it is using, the purpose it serves, and the work it continues to postpone."
 OSE_snc_emergency_review_civil_spirit_settled:0 "Civil renewal of exceptions: Standing Review"
 OSE_snc_emergency_review_civil_spirit_settled_desc:0 "The standing procedure names an ending authority as clearly as an issuing authority. Officials can retain the chosen civil or protected mandate, improve its practice through the completed review, and continue paying the burden that sustains it. They can also explain why a particular exception no longer applies. The settlement does not require a foreign acceptance, a war outcome or a historical deadline to be useful. It leaves the next duty officer a narrower instruction and the receiving services a way to ask whether the government still intends to use it tomorrow."
 OSE_snc_emergency_review_protected_spirit:0 "Limited emergency mandate"
 OSE_snc_emergency_review_protected_spirit_desc:0 "Protect a limited emergency mandate with a named professional authority and a signed account of its continuing use. The duty staff gain a dependable chain for urgent work, while the government accepts the political cost of defending that priority. The mandate cannot expand merely because another office finds it convenient. It must be reviewed against current conditions, including a return to peace or the failure of a foreign dialogue. Retaining the instruction is a choice that somebody must renew, rather than a conclusion silently produced by leaving yesterday's exceptional order inside today's ordinary schedule."
 OSE_snc_emergency_review_protected_spirit_settled:0 "Limited emergency mandate: Standing Review"
