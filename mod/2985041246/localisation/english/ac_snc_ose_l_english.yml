 OSE_snc_federal_account_review:0 "Leave the Unfinished Page"
 OSE_snc_federal_account_review_desc:0 "The successor period has produced a completed return and an unfinished page listing obligations outside its scope. A secretary offers to place the page in another file. The chair asks that it remain attached. Review the funded work without claiming it answered every national question. The account can recognize useful civil continuity or protected readiness while preserving the burden that its chosen priority imposed. This is a conclusion about the government's method of keeping promises, not a declaration that the surrounding world has accepted them. Its unfinished page is part of the explanation a successor deserves to receive."
