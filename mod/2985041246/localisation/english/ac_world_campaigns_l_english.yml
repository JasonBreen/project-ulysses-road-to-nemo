 ac_wc_soa.15.d:0 "Two headquarters have issued different instructions to the same detachment. The staff can clarify civilian authority, standardize communications, or decentralize tactical decisions while retaining accountability.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
