 ac_fsb_fat_commitment_review:0 "A Public Commitment Limit"
 ac_fsb_fat_commitment_review_desc:0 "The final limit is not a fourth signature. It is a rule that the existing three must fit both the treasury and the staffing ledger. Fund a stricter review if the government wants its remaining external permissions to stay credible."
 FAT_fsb_commitment_review:0 "A Public Commitment Limit"
 FAT_fsb_commitment_review_desc:0 "Unlock a funded compliance interval that improves capacity while limiting current output.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Benefit lasts 180 days. New authorisations have a 240-day cooldown. "
