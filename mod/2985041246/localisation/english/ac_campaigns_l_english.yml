 ac_camp.68.t:0 "The platform they had shared"
 ac_camp.68.desc:0 "An older technical folder was brought into the operations room to answer a current targeting question. Its cover belonged to the period when the Arkbird had represented cooperation over the debris left above the world. The officer opening it paused at the names on the distribution list.\n\nThe platform had been committed to the war and then taken into hands its original partners could no longer trust. The interception crews had been asked to stop it. Now the technical staff were working through the return, checking what had been destroyed and which facilities below would still expect instructions from a machine that could no longer send them.\n\nThe technical officer explained the limits of the current information. Someone asked whether the old cooperative record helped. It did, in ways that made several people around the table uncomfortable. Knowledge once shared to keep a platform working could also help determine how to stop it.\n\nNo one tried to solve that discomfort with a speech. The crew needed a briefing it could use. The investigators needed to preserve the trail of control. The government would eventually need to explain how an object that had carried one kind of promise had acquired another kind of mission.\n\nAfter the report, the older folder remained on the table beside the current return. A clerk asked where it should be filed. The technical officer told him to keep the two together. The transition between them was part of the result, and would be the easiest part for a later summary to lose."
