l_english:
 SER_wd_gov_diet_sits:0 "The Serenavian Diet Sits"
 SER_wd_gov_diet_sits_desc:0 "Serenava governs itself through the Office of the Crown and a diet whose deputies come from the garrison towns, the harbour wards of Serdonia and Karnaca and the forest districts between them. The monarchist camp holds a large majority, yet nobody has written down what the diet may decide. Convening it now costs the crown office its quiet."
 SER_wd_gov_deputy_roll:0 "A Roll of Seats by District"
 SER_wd_gov_deputy_roll_desc:0 "Before the diet can argue about power it must agree on who sits in it. Clerks draw up a roll of seats by district, weighing the populous harbour wards against the garrison towns and the thinly settled forests. Every allocation offends somebody. The finished roll exposes three rival answers to the question of who should govern Serenava."
 SER_wd_gov_deputy_roll_tt_1:0 "Three paths follow; choosing one closes the other two."
 SER_wd_gov_princely_path:0 "The Crown Office Signs on Advice"
 SER_wd_gov_princely_path_desc:0 "The monarchist majority wants to keep the Principality and bind it to the diet: ministers chosen from the benches, budgets voted by deputies and the Office of the Crown signing what its cabinet advises. Most deputies already expect this answer. It also ends the crown office's habit of settling frontier questions by letter without consulting anyone."
 SER_wd_gov_garrison_path:0 "Commandants Ask for the Seals"
 SER_wd_gov_garrison_path_desc:0 "The commandants of the garrison towns argue that a frontier state with a casemate belt and airfields of this size cannot wait on deputies when a crisis comes. Their proposal hands the state seal, the treasury and the frontier posts to a council of senior officers. Decisions would come quickly, and the diet would shrink into a place for petitions."
 SER_wd_gov_township_path:0 "Townships Without a Prince"
 SER_wd_gov_township_path_desc:0 "A smaller camp in the harbour wards and the forest districts proposes a Republic of Serenava governed by an executive elected from the diet, with the princely office retired. Its supporters say a state of townships needs no crown. The garrison towns distrust the idea, and the monarchist majority will not soon forgive the deputies who carry it."
 SER_wd_gov_princely_cabinet:0 "Seat the Princely Cabinet"
 SER_wd_gov_princely_cabinet_desc:0 "The majority benches form a princely cabinet that holds the seals as a body and answers to the diet for each of them. No single minister can act without colleagues, and a lost vote of confidence brings the whole cabinet down. Elections return to the calendar. The commandants lose the private line to the crown office they have used for years."
 SER_wd_gov_garrison_council:0 "The Commandants Take the Seals"
 SER_wd_gov_garrison_council_desc:0 "Senior frontier commandants form a council that keeps the state seal, the treasury and the frontier posts and rules by ordinance, suspending elections for as long as it sits. The diet survives as a body the council consults when it chooses. Orders move fast along a chain of command, and from now on every failure of the state will wear a uniform."
 SER_wd_gov_township_executive:0 "Elect the Township Executive"
 SER_wd_gov_township_executive_desc:0 "By a narrow vote the diet adopts a founding text for a republic and names an executive from among its members, sending the princely office to ceremony and the archives. The Republic of Serenava holds elections at set intervals. The harbour wards celebrate. The garrison towns watch warily, and the executive must persuade the officer corps that a republic can hold a frontier."
 SER_wd_gov_district_audiences:0 "Ministers on the District Circuit"
 SER_wd_gov_district_audiences_desc:0 "The princely cabinet sends its ministers on a circuit of every district in turn, holding open audiences in drill halls, fish markets and forest schools. Complaints are written down and answered within a season. The circuit eats ministerial time and fills the papers with petty grievances, but it convinces outlying districts that the Principality hears them too."
 SER_wd_gov_commandant_prefects:0 "Commandants as District Prefects"
 SER_wd_gov_commandant_prefects_desc:0 "The council appoints serving commandants as prefects of the districts around their garrisons, joining civil and military authority under a single signature. Roads, schools and police answer to officers who already know the ground. Administration turns brisk and uniform, while mayors and teachers resent taking orders from people trained to command regiments rather than towns."
 SER_wd_gov_township_budgets:0 "Township Budgets on Public Boards"
 SER_wd_gov_township_budgets_desc:0 "Every township in the Republic posts its budget on a public board and in the local paper, line by line, before the executive may release its share of state funds. Small frauds grow harder and quarrels grow louder. Councils spend weeks defending the price of a culvert, yet citizens begin to trust that tax money arrives where it was promised."
 SER_wd_gov_clerk_exams:0 "Examinations for Frontier Clerks"
 SER_wd_gov_clerk_exams_desc:0 "Whatever form of government Serenava chose, it still needs clerks who can run customs posts, payrolls and land registers. Open examinations replace letters of recommendation for every junior post, and successful candidates are sent where they are needed rather than where they were born. The commandants dislike civilian testing, but the service begins to staff itself."
 SER_wd_fields_count:0 "Count the Hangars and Fuel Farms"
 SER_wd_fields_count_desc:0 "Serenava holds the giant airfields that older governments built facing Osea, with runways, hardened shelters and fuel farms sized for a far larger air arm, yet its own inventory lists armour, rockets and marines and no combat aircraft at all. Counting what the fields hold, and what they cost each month, is the first honest step."
 SER_wd_fields_fuel_farms:0 "Earth Banks Around the Fuel Farms"
 SER_wd_fields_fuel_farms_desc:0 "The fuel farms beside the forest field are the largest stores of aviation spirit for many miles, and they sit behind thin fences. Engineers raise earth banks around the tanks, reline the pipes to the dispersal stands and fit new valves. The work buys nothing visible this year. It turns a standing liability into a reserve the state can draw on in a crisis."
 SER_wd_fields_tower:0 "A Civil Tower for the Forest Field"
 SER_wd_fields_tower_desc:0 "The forest field has military approach radar but no civil control tower, so private and freight flights must ask the duty officer for leave to land. A proper tower with its own radar and radio watch makes the field usable by civil operators. It also gives the air staff a second pair of eyes over the forest districts and the frontier beyond them."
 SER_wd_fields_cargo:0 "Freight Wings for the Forest Field"
 SER_wd_fields_cargo_desc:0 "One school says the fields should earn their keep as a civil hub: freight airlines leasing hangars, overnight parcel flights and an overhaul trade for foreign operators. Revenue would replace maintenance bills. Serenava would remain without fighters of its own, and its airspace would rest on the goodwill of neighbours and on treaties nobody has yet written."
 SER_wd_fields_guard:0 "Raise a Serenavian Air Guard"
 SER_wd_fields_guard_desc:0 "The other school says that a frontier state with this much runway must have an air arm of its own, however small: a few squadrons of interceptors, trained controllers and pilots drawn from the regiments. Buying and training them will consume years of budget. In return Serenava could watch and defend its own sky instead of hoping nobody tests it."
 SER_wd_fields_concourse:0 "A Freight Concourse Under the Pines"
 SER_wd_fields_concourse_desc:0 "Freight operators want a concourse where cargo moves straight from aircraft to trucks and trains without crossing the military aprons. A long shed beside the forest field, linked to the junction by a rail spur, does exactly that. It is costly and slow to build. Once open, it draws parcel and spare-part traffic that never touches the casemate roads."
 SER_wd_fields_alert_pairs:0 "Alert Pairs at Dawn"
 SER_wd_fields_alert_pairs_desc:0 "The air guard keeps a pair of armed interceptors ready on the forest field at every dawn, with crews sleeping beside their aircraft and controllers at the scopes. Readiness of this kind wears out airframes and patience alike. It also means that any intruder over Serenava will be met within minutes by aircraft carrying a Serenavian roundel."
 SER_wd_fields_control_room:0 "One Control Room for Every Field"
 SER_wd_fields_control_room_desc:0 "Civil and military traffic over the fields has been handled from separate huts with separate telephones. A single control room, fed by new radar sets on the forest edge, puts freight flights, training sorties and intruders on one display. The two staffs must learn to share a room and a rulebook, and the sky above Serenava holds fewer surprises."
 SER_wd_fields_aggressors:0 "Aggressor Instructors for Hire"
 SER_wd_fields_aggressors_desc:0 "From the summer of 1998, air arms abroad are hiring former Belkan Air Force pilots as aggressor instructors. The new control room gives Serenava a training airspace where such people could work. Whether to hire them is a hard question for a neutral state on the Osean frontier, and the air staff wants an answer before the offers go elsewhere."
 SER_wd_belt_walk:0 "Walk the Casemate Line"
 SER_wd_belt_walk_desc:0 "Serenava inherits a casemate belt out of all proportion to its army: one heavy group on the plains where the rail line runs toward Osea, and two more on the coastal plain. Survey teams walk every gallery, test every door and count every gun port. The survey itself is cheap; deciding what to do with so much concrete is not."
 SER_wd_belt_volunteers:0 "Volunteer Regiments for the Frontier"
 SER_wd_belt_volunteers_desc:0 "Serenava raises its army by volunteering, not conscription, and the garrison towns supply most recruits. Regular pay, housing for families and a guaranteed civil job after twelve years make enlistment attractive. The regiments stay small but professional. The price is a payroll that grows every year and a recruiting map that barely touches the harbour wards."
 SER_wd_belt_tank_school:0 "A Tank School on the Open Plains"
 SER_wd_belt_tank_school_desc:0 "The regiments own modern battle tanks, infantry fighting vehicles and rocket batteries, but crews learn their trade in whatever field a farmer will lend. A permanent school on the plains behind the casemates gives them ranges, repair pits and a doctrine written for the ground they would defend. The farmers want compensation and get it."
 SER_wd_belt_hold:0 "Garrison the Casemates in Depth"
 SER_wd_belt_hold_desc:0 "The static school says the belt is Serenava's greatest military asset and should be crewed in depth: gun crews in every casemate, infantry in the trenches behind them and the tanks held close for counterattacks. Any attacker would pay heavily for each kilometre. The regiments would be tied to the concrete and of little use anywhere else."
 SER_wd_belt_mobile:0 "Tanks Behind the Concrete"
 SER_wd_belt_mobile_desc:0 "The mobile school says the casemates should only delay an attacker, held by small crews, while the real defence is an armoured reserve behind them that strikes wherever a breach opens. It suits the regiments' tanks and rocket batteries far better. It needs fuel, spare parts and trained commanders, and it leaves the shore casemates thinly manned."
 SER_wd_belt_casemate_radar:0 "Radar Above the Inland Casemates"
 SER_wd_belt_casemate_radar_desc:0 "Crewed casemates are blind beyond their gun ports. A radar mast raised on a rise behind the inland group gives the crews early warning of anything moving on the plains or low in the sky, and wires them to the forest field's controllers. Osea will notice the new mast. The commandants count that as a benefit rather than a cost."
 SER_wd_belt_track_depots:0 "Track Depots Behind the Belt"
 SER_wd_belt_track_depots_desc:0 "A mobile reserve stands or falls on its spares. Drawing on the pool the workshops now keep, the army builds track and engine depots in the forest behind the belt, each stocked for a week of fighting and hidden under the trees. Depots tie up money in idle stock. They also keep the tanks moving when a road is cut."
 SER_wd_belt_shore_marines:0 "Marines for the Shore Casemates"
 SER_wd_belt_shore_marines_desc:0 "The shore casemates face the sea, and the army has always treated them as an afterthought. Marine companies trained for coastal fighting take them over, rehearsing landings and counter-landings on the beaches nearby. The marines draw recruits from the tank regiments and quarrel with the harbour masters about closed beaches, but the coast finally has its own defenders."
 SER_wd_belt_garrison_reserve:0 "A Reserve from the Garrison Towns"
 SER_wd_belt_garrison_reserve_desc:0 "Veterans who leave the volunteer regiments go onto a reserve roll in their home garrison towns and report for two weeks of training each year. In a crisis the regiments could double within a fortnight. Employers lose workers every summer and grumble about it. The reserve costs little in peacetime and changes every sum an attacker would do."
 SER_wd_belt_plains_manoeuvre:0 "The Plains Manoeuvre"
 SER_wd_belt_plains_manoeuvre_desc:0 "Once a year the whole army takes the field on the plains behind the casemates, testing whichever defence the staff has chosen against an imagined attack across the frontier. Osean observers are invited, so nobody mistakes the exercise for anything else. The manoeuvre burns fuel and spoils a season of crops, and it shows the staff where its plans fail."
 SER_wd_works_count:0 "Count the Garrison Workshops"
 SER_wd_works_count_desc:0 "The garrison towns host three civilian works and two arms halls, built to repair, supply and feed the regiments. They employ most of the skilled hands inland and live almost entirely on army orders. Before any plan is drawn, clerks count machines, payrolls and contracts. The count annoys managers who prefer vague numbers, and it settles nothing yet."
 SER_wd_works_power:0 "Power Lines to the Workshop District"
 SER_wd_works_power_desc:0 "The garrison towns have long asked for a workshop district of their own, and some of its ground is already cleared. Finishing the substations and power lines lets a new civilian works open there. The money goes to contractors the diet does not entirely trust. The jobs go to towns that have waited a long time for something other than barracks."
 SER_wd_works_apprentices:0 "Apprentice Benches in Every Hall"
 SER_wd_works_apprentices_desc:0 "Skilled fitters in the workshops are ageing, and their trade has always passed from hand to hand without schools or papers. A state apprenticeship puts trainee benches in every hall, pays a small wage and certifies the results. Output dips while masters teach instead of working. In time the halls will have enough trained hands to try new lines."
 SER_wd_works_civil:0 "Town Goods Instead of Track Links"
 SER_wd_works_civil_desc:0 "Converters among the managers and the diet would have the workshops make goods that families and farms buy: pumps, cable, tools, tinned food and bicycle frames, sold in the harbour towns and through the junction. Orders would come from many customers rather than one. Workers would need retraining, the regiments would lose some repair capacity, and the arms hall managers would fight it."
 SER_wd_works_armour:0 "Keep the Turret Shops Turning"
 SER_wd_works_armour_desc:0 "The arsenal camp says the workshops already do one thing well, which is keeping armoured vehicles running, and should sell that skill abroad. Foreign armies would send engines and running gear for overhaul at Serenavian rates. The halls keep their skills and the regiments keep their repairs. The state becomes a contractor to other armies, with all that implies."
 SER_wd_works_civil_hall:0 "A New Hall for Household Goods"
 SER_wd_works_civil_hall_desc:0 "The first converted orders sell well enough to justify a new hall. Built beside the junction so that goods load straight onto wagons, it makes stoves, pumps and wire for the harbour towns and beyond. The hall needs credit that the treasury must guarantee. Its opening is the first ceremony in the garrison towns without a military band."
 SER_wd_works_armour_hall:0 "A Refit Hall for Foreign Armour"
 SER_wd_works_armour_hall_desc:0 "Overhaul contracts from abroad outgrow the old arms halls, so the state builds a refit hall with heavy cranes, an engine test bed and a siding long enough for tank transporters. Foreign inspectors will walk its floors, and some buyers will be governments the diet would rather not name. The hall pays wages no civilian works can match."
 SER_wd_works_spares:0 "A Common Pool of Spare Parts"
 SER_wd_works_spares_desc:0 "Each workshop has kept its own spares, hoarded against the next army order, so a missing bearing in one town can idle a line while three sit unused in the next. A common pool with one catalogue and one depot ends the hoarding. Managers lose a private cushion. The regiments and the halls gain a supply that answers within a day."
 SER_wd_works_export_house:0 "An Export House at Serdonia"
 SER_wd_works_export_house_desc:0 "Serenava trades under an export-led policy, yet its workshops have nobody abroad to sell for them. An export house at Serdonia, run jointly by the state and the workshop owners, takes samples to foreign fairs, handles letters of credit and quotes prices in foreign currency. It costs a year of salaries before the first contract arrives."
 SER_wd_gate_tally:0 "Tally the Junction Freight"
 SER_wd_gate_tally_desc:0 "Serenava sits where the rail lines from Gatewood, Old Perbla, the Relentian towns of Driscol and Fraeport and the Osean frontier all meet, in the region the maps call the South Osean Gate. Nobody knows how much freight crosses it or what it pays. Clerks at every yard log each wagon for a month and add up the result."
 SER_wd_gate_mud_roads:0 "Gravel for the Rainy Season"
 SER_wd_gate_mud_roads_desc:0 "Warm rains turn the plains roads to mud for months each year, and the villages beside the rail lines are cut off whenever the trains are full. Gravelled roads from the junction to the forest districts let trucks move in every season. The work is unglamorous and expensive, and it is the first thing most rural voters will notice."
 SER_wd_gate_karnaca_sidings:0 "New Sidings at the Karnaca Yards"
 SER_wd_gate_karnaca_sidings_desc:0 "Karnaca's yards serve the naval berths, the line toward Driscol and Fraeport and the inland junction, and they jam whenever two of those trains arrive at once. New sidings and a second loading road let freight wait without blocking the main line. The harbour gains land it badly needs for warehouses, and the rail crews gain a few hours of sleep."
 SER_wd_gate_open:0 "An Open Tariff at the Frontier"
 SER_wd_gate_open_desc:0 "One answer makes the junction the cheapest and quickest way through the region: a single published transit tariff, customs clearance on the moving train and no searches without cause. Traffic and fees would rise together. The commandants warn that an open gate on the Osean frontier is also open to smugglers and to anyone who wants to watch."
 SER_wd_gate_guarded:0 "Inspection Sheds at Every Crossing"
 SER_wd_gate_guarded_desc:0 "The other answer treats every wagon that crosses the frontier as a security question: inspection sheds at the crossings, sealed wagons and customs officers trained by the army. Shippers would pay in time rather than fees, and some traffic would go around Serenava altogether. What remained would be traffic the state knows about, cargo by cargo."
 SER_wd_gate_bonded_wagons:0 "Bonded Wagons Through Serenava"
 SER_wd_gate_bonded_wagons_desc:0 "Now that the neighbours accept a common customs seal, bonded wagons can cross Serenava from one frontier to another without being opened, provided their seals arrive intact. Inspectors check paperwork instead of cargo and the trains barely stop. Transit revenue rises quickly. So does the temptation for any official to overlook a broken seal."
 SER_wd_gate_customs_brigades:0 "Customs Brigades on the Plains"
 SER_wd_gate_customs_brigades_desc:0 "Inspection sheds need staff who can search a wagon properly and chase a smuggler across open fields. Customs brigades recruited from former soldiers, with trucks, dogs and radios, patrol the plains between the crossings. They cost more than clerks and behave less politely. Smuggling falls sharply, and the brigades become the face of the state there."
 SER_wd_gate_junction_board:0 "One Board for Four Lines"
 SER_wd_gate_junction_board_desc:0 "The rail lines that meet in Serenava were run by separate offices that rarely spoke to each other. A junction board with one timetable, one dispatch room and one budget takes them all over. Railway managers lose their small kingdoms. The trains run closer to time, and the state finally knows what each line costs and what it earns."
 SER_wd_harb_compare:0 "Serdonia and Karnaca Open Their Books"
 SER_wd_harb_compare_desc:0 "Serenava's coast has two harbours that have never cooperated. Serdonia is the larger town, with the busier market and older quays; Karnaca has the deeper naval berths and the rail line toward Driscol and Fraeport. Bringing their accounts to one table shows how much both lose by competing for the same small trade. Neither harbour master enjoys it."
 SER_wd_harb_fishing:0 "Cooperatives for the Fishing Fleets"
 SER_wd_harb_fishing_desc:0 "The fishing boats of both harbours sell to a handful of dealers who set the price every morning. State credit for fishing cooperatives, with their own ice plants, auction halls and diesel stores, lets crews sell together. Dealers lose their grip and complain to every deputy they know. The fleets gain steadier incomes and a reason to modernise."
 SER_wd_harb_slipway:0 "A Repair Slipway at Karnaca"
 SER_wd_harb_slipway_desc:0 "Karnaca has naval berths but nowhere to haul out a hull, so every serious repair goes abroad, and the money with it. A slipway with a winch house, workshops and a small crane lets the harbour repair patrol craft, trawlers and coasters at home. It needs shipwrights the town does not yet have; the inland workshops will supply the first of them."
 SER_wd_harb_one_board:0 "A Single Board for Both Harbours"
 SER_wd_harb_one_board_desc:0 "One plan joins Serdonia and Karnaca under a single harbour board with common dues, one investment budget and one set of pilots. Ships would choose the berth that suits them and pay the same either way. Each town fears it will be the one that loses traffic. The board would finally let Serenava plan its coast as a whole."
 SER_wd_harb_rival_dues:0 "Let the Harbours Compete on Dues"
 SER_wd_harb_rival_dues_desc:0 "The rival plan lets each harbour set its own dues and keep its own revenue, competing openly for every fishing boat and coaster. Competition would push fees down and service up. It would also duplicate investment, start a price war between neighbouring towns and leave the state with two half-built harbours instead of one finished coast."
 SER_wd_harb_patrol:0 "A Patrol Flotilla at Karnaca"
 SER_wd_harb_patrol_desc:0 "With a slipway to keep them running, Karnaca can base a small flotilla of patrol craft to watch the fishing grounds, escort the coasters and support the shore casemates. The boats are modest, and their crews come from the marines and the fishing fleets. The flotilla is far too small to fight a navy, and large enough to make the coast a Serenavian one."
 SER_wd_harb_coast_radar:0 "A Radar Mast Above Serdonia"
 SER_wd_harb_coast_radar_desc:0 "Serdonia's approaches have no radar of their own, and ships are tracked by binoculars and radio calls. A radar mast on the hill behind the town sweeps the approaches, the fishing grounds and the beaches near the shore casemates. Residents who preferred the view object. The coast gains a picture of every ship that comes near."
 SER_wd_harb_sweepers:0 "Sweepers for the Coastal Approaches"
 SER_wd_harb_sweepers_desc:0 "Any war in the region could leave mines in the coastal lanes, and Serenava has no means of clearing them. Two of the patrol craft are fitted with sweeping gear and their crews trained to use it, with regular practice off both harbours. It is dull, dangerous work. It means the harbours can reopen quickly after a crisis without waiting for foreign help."
 SER_wd_nb_envoys:0 "Envoys on the Morning Trains"
 SER_wd_nb_envoys_desc:0 "Serenava's first envoys travel by rail, because the rail links the state to every neighbour. In a single week they call at Gatewood, at the offices that run the Relentian ports and the Terentio towns, and at the Osean frontier administration. They carry practical questions rather than grand proposals. The trip costs little, and what they hear will shape the whole foreign policy."
 SER_wd_nb_through_seals:0 "One Customs Seal for Through-Trains"
 SER_wd_nb_through_seals_desc:0 "Through-trains are stopped and searched at every frontier along the junction lines, sometimes three times in one journey. Serenava proposes a common customs seal that every neighbour would honour, with joint inspection of any wagon whose seal is broken. Negotiating it takes months of patient meetings. Once signed, it makes Serenava the easiest crossing in the region for honest freight."
 SER_wd_nb_through_seals_tt_1:0 "No claim, core or border changes; the seal covers customs procedure only."
 SER_wd_nb_karnaca_line:0 "Keep the Karnaca Line Running"
 SER_wd_nb_karnaca_line_desc:0 "The rail line from Karnaca toward Driscol and Fraeport carries fish, workshop goods and commuters every day. Serenava offers to share the cost of its track, signals and crossing staff with whichever government holds the far end. The agreement changes no frontier and claims nothing. It keeps two stretches of the same coast in daily touch."
 SER_wd_nb_karnaca_line_tt_1:0 "No claim, core or border changes; the agreement covers track, signals and staff only."
 SER_wd_nb_gatewood:0 "Gauge and Standards with Gatewood"
 SER_wd_nb_gatewood_desc:0 "One camp wants Serenava to keep the closest possible ties with Perbla: shared rail gauge, shared technical standards, matching customs rates and ministers who meet their Perblan counterparts every quarter in Gatewood. Old supply chains keep working and spare parts keep fitting. Critics in the harbour wards answer that a state which copies every Perblan rule has only changed the name on its stamps."
 SER_wd_nb_osea:0 "Osean Buyers Welcome"
 SER_wd_nb_osea_desc:0 "Another camp looks across the plains. Osea is the largest market within reach, and its buyers already ask for Serenavian timber, fish and overhaul work. Opening the frontier offices to Osean trade missions and accepting Osean technical standards would bring orders quickly. In the garrison towns, many will ask why the casemates still face the customers."
 SER_wd_nb_even:0 "Equal Distance from Every Capital"
 SER_wd_nb_even_desc:0 "The third camp wants Serenava to belong to nobody: one tariff for all, no preferred standards and envoys of equal rank in every neighbouring capital. It makes the state predictable and hard to pressure. It also wins no special friend, and every neighbour will suspect that the others are quietly getting a better deal."
 SER_wd_nb_consulates:0 "Consulates in Serdonia"
 SER_wd_nb_consulates_desc:0 "Whichever course the government chose, neighbours need somewhere in Serenava to issue visas, register freight agents and help their citizens in trouble. The state offers buildings in Serdonia to any neighbour willing to open a consulate, on equal terms. The consulates bring visitors, rents and a steady flow of information in both directions, some of it unwelcome."
 SER_wd_nb_consulates_tt_1:0 "Consulates register visitors and freight agents; no treaty, faction or border change."
 SER_wd_nb_terentio_freight:0 "Freight Rates with Terentio"
 SER_wd_nb_terentio_freight_desc:0 "Terentio's towns buy timber and workshop goods from Serenava and send little back, so wagons return empty over a long route. A standing rate agreement fills the return wagons with whatever Terentio can send, at a discount the railway absorbs. The junction clerks grumble about the loss. The trade, small as it is, keeps a distant neighbour friendly."
 SER_wd_war_news:0 "News Reaches the Inland Crossing"
 SER_wd_war_news_desc:0 "The Belkan War that breaks out in March 1995 does not involve Serenava, but Osea, directly across the plains, is fighting it. Frontier posts report military convoys beyond the barrier, and the garrison towns hear the news before Serdonia does. The government puts the frontier on alert, which costs fuel, overtime and a great deal of nervous energy."
 SER_wd_war_transit_closed:0 "No Belligerent Trains Through the Gate"
 SER_wd_war_transit_closed_desc:0 "The strict reading of neutrality closes the junction to every train carrying soldiers, weapons or military stores for any party to the war, inspected at the crossings and turned back if in doubt. No side can accuse Serenava of helping its enemy. Freight income falls, neighbours protest, and the customs posts become the busiest offices in the state."
 SER_wd_war_relief_trains:0 "Relief Trains Only, Marked and Searched"
 SER_wd_war_relief_trains_desc:0 "The looser reading keeps the junction open to trains carrying food, medicine and civilian goods for anyone, clearly marked and searched at the crossing, while still refusing military cargo. Trade survives and the junction keeps its name for reliability. Every belligerent will suspect the searches are lax for its enemies, and every mistake will be reported abroad."
 SER_wd_war_stand_to:0 "The Regiments Stand To"
 SER_wd_war_stand_to_desc:0 "Having tested its plans on the plains, the army now puts them into force: crews in the casemates or tanks in their hides, reserves called for a short spell and patrols along every kilometre of the frontier. Standing to costs wages and harvests. It also tells every commander across the line that Serenava has a plan and the means to carry it out."
 SER_wd_war_fuel_ration:0 "Draw on the Banked Fuel"
 SER_wd_war_fuel_ration_desc:0 "War abroad drives up fuel prices at home, and shippers begin to hoard. The earth-banked farms beside the forest field hold enough to steady the market for months. Releasing fuel under ration cards keeps trucks, tractors and fishing boats moving at a fair price. Every litre sold now is a litre the air staff will not have later."
 SER_wd_war_air_patrols:0 "Patrols Along the Frontier Sky"
 SER_wd_war_air_patrols_desc:0 "With fighting so close, the air guard flies standing patrols along the frontier, keeping well inside Serenavian airspace and reporting every foreign aircraft that comes near. Pilots gain more real flying in a month than in a year of training. Each sortie eats fuel and engine life, and one navigation error could turn careful neutrality into an incident."
 SER_wd_war_neutral_freight:0 "Freight Flights Under Neutral Colours"
 SER_wd_war_neutral_freight_desc:0 "Freight operators at the forest field find wartime demand for civilian air cargo, and the state allows it under strict rules: large neutral markings, filed routes that avoid every war zone and inspection of every load. Revenue rises sharply. A single aircraft caught with military cargo would cost the field its licence and the state its credibility."
 SER_wd_war_hangar_reception:0 "Reception Halls in the Hangars"
 SER_wd_war_hangar_reception_desc:0 "People fleeing the war may reach Serenava by road, rail or sea, and the state has no reception centres. Empty hangars among the outer shelters are cleaned, heated and fitted with beds, kitchens and clinics. They are far from comfortable, but they are dry and secure. Their cost, and their guests, become a fierce subject in the diet."
 SER_wd_war_osean_drawdown:0 "Osean Columns Go Home"
 SER_wd_war_osean_drawdown_desc:0 "With Belka defeated, the military traffic on the Osean side of the frontier thins and the reservists across the plains go home. Serenava can relax its alert and return the crossings to their normal routines. Trade with Osea resumes on better terms than before. The commandants warn that a victorious Osea will feel less need to court small neighbours."
 SER_wd_war_osean_buildup:0 "Osea Digs In Across the Plains"
 SER_wd_war_osean_buildup_desc:0 "With Belka victorious, Osea does not stand down. Fresh fortifications appear across the plains, Osean reconnaissance flights skirt the frontier and the frontier offices turn cold and formal. Serenava must keep its own alert in force for years, with all the cost that entails. The garrison towns gain work and the harbour wards lose good customers."
 SER_wd_sky_announcement:0 "The Impact Warning Reaches Serdonia"
 SER_wd_sky_announcement_desc:0 "In April 1996 the world learns that Ulysses will hit, and the news reaches Serenava like everywhere else, with no hint of which regions the fragments will strike. A small state has no means of its own to watch the sky. It does have a casemate belt and hardened hangars, and frightened families are already asking who will be let inside."
 SER_wd_sky_public_casemates:0 "Open the Casemates to Families"
 SER_wd_sky_public_casemates_desc:0 "The civil answer opens the casemates to the public: every family in the harbour towns and on the plains is assigned a gallery, a shelter warden and a route to reach it. The regiments lose their fighting positions for as long as the danger lasts. The public gains the strongest shelter in the region, and the army gains unwanted housekeeping."
 SER_wd_sky_forest_trenches:0 "Shelter Trenches in the Forests"
 SER_wd_sky_forest_trenches_desc:0 "The military answer keeps the casemates for the regiments and digs covered shelter trenches in the forests near every town, roofed with timber and earth. They are cheaper, closer to home and far weaker than concrete. Families complain that the soldiers have kept the safe places for themselves, while the army keeps its defences ready for what follows."
 SER_wd_sky_hangar_stores:0 "Stock the Empty Hangars"
 SER_wd_sky_hangar_stores_desc:0 "The hangars already fitted to receive war refugees become relief stores for the impact: grain, tinned food, blankets, generators and medicine for weeks, kept dry under the concrete and close to the rail spur. Stocking them ties up money and invites theft. When the roads close, Serenava will have supplies in the one place built to survive attack."
 SER_wd_sky_radars_up:0 "Turn the Field Radars Skyward"
 SER_wd_sky_radars_up_desc:0 "The radar sets on the airfields were built to find aircraft, not falling rock, but engineers can tilt and retune a few of them to watch the upper sky. The results are crude and full of false returns. They are also Serenava's own, and they give the warning network a few minutes of notice that no foreign bulletin could provide."
 SER_wd_sky_evac_trains:0 "Timetables for a Night of Departures"
 SER_wd_sky_evac_trains_desc:0 "If a fragment threatens the harbour towns, people must leave quickly, and the junction is the fastest way out. The railway clerks write evacuation timetables for every station, keep empty trains parked on sidings overnight and rehearse the routes with volunteers. Freight suffers during rehearsals. The timetables mean a crowd can become a column in hours."
 SER_wd_sky_warden_rota:0 "A Warden for Every Gallery"
 SER_wd_sky_warden_rota_desc:0 "Shared casemates need rules: who sleeps where, how water is rationed, who settles quarrels and who checks the air filters. A warden is appointed for every gallery, trained by the army and paid by the township. Wardens become small authorities with lists and keys. When the night comes, the galleries will be crowded but not lawless."
 SER_wd_sky_trench_drills:0 "Drills in the Forest Trenches"
 SER_wd_sky_trench_drills_desc:0 "Shelter trenches only work if families know where theirs is and can reach it in the dark. Army engineers run night drills in every forest district, timing each street and fixing the worst routes. Farmers lose sleep and tempers. The drills also teach the engineers lessons about earthworks that the regiments will use long after the asteroid passes."
 SER_wd_sky_roche_night:0 "Watch Night over the Forest Field"
 SER_wd_sky_roche_night_desc:0 "In July 1999 the asteroid passes Earth's Roche limit, and every plan Serenava has made is tested at once. Wardens open the shelters, trains wait on the sidings and the field radars sweep the sky all night. Nobody knows what the next hours will bring, and the government must keep a frightened state calm until dawn."
 SER_wd_sky_lessons:0 "What the Long Watch Taught"
 SER_wd_sky_lessons_desc:0 "Once the worst nights have passed, a committee of wardens, rail crews and radar operators writes down what worked and what did not: which shelters leaked, which trains ran late and which rumours did the most harm. The report is unflattering, and acting on it costs another season of repairs. Serenava ends the decade knowing how its people behave under threat."
 SER_wd_cent_stock:0 "Serenava Takes Its Own Measure"
 SER_wd_cent_stock_desc:0 "At the turn of the century a mixed panel of deputies, commandants, harbour masters and railway clerks is asked to measure what Serenava has built since it began governing itself, and what it has left undone. The report will set the agenda for the next decade, so every faction lobbies the panel. Commissioning it costs little except nerves."
 SER_wd_cent_princely_statute:0 "Write the Princely Statute"
 SER_wd_cent_princely_statute_desc:0 "Years of princely cabinets have produced a pile of conventions, precedents and letters but no single text. The cabinet and the diet now write a statute setting out what the Office of the Crown may sign alone, what needs the cabinet and what needs the deputies. Drafting it reopens old fights. Once printed, it settles them for a generation."
 SER_wd_cent_garrison_ordinance:0 "Publish the Garrison Ordinance"
 SER_wd_cent_garrison_ordinance_desc:0 "The council of commandants has governed by single orders, each issued as a problem arose. Its staff now gathers them into one published ordinance that every district can read: what the council decides, what the prefects decide and how a citizen may appeal. Publishing it limits the council's freedom and makes its rule predictable, which most citizens prefer."
 SER_wd_cent_township_charter:0 "Ratify the Township Charter"
 SER_wd_cent_township_charter_desc:0 "The Republic's founding charter was written in a hurry and amended by the executive whenever it proved inconvenient. A convention of every township rewrites it with a court to interpret it, a fixed share of revenue for each township and strict rules for amendment. The convention takes a year and embarrasses several ministers. The result is short enough to teach in schools."
 SER_wd_cent_clerk_posts:0 "Examined Clerks Take Senior Posts"
 SER_wd_cent_clerk_posts_desc:0 "The first clerks recruited by open examination have now served long enough for senior posts. Promoting them by merit rather than patronage reshapes every ministry. Older officials who rose by favour resent the change, and a few resign loudly. The service that emerges is younger, more competent and much harder for any faction to capture."
 SER_wd_cent_town_goods:0 "Town Goods Find Foreign Buyers"
 SER_wd_cent_town_goods_desc:0 "Years of converted production have given the garrison-town workshops a range of tools, pumps and household goods that sell beyond Serenava. The state now backs them with export credit and stands at foreign fairs. Competition from larger countries is fierce and margins are thin. Success would free the workshops from the army for the first time."
 SER_wd_cent_refit_abroad:0 "Long Refit Contracts Abroad"
 SER_wd_cent_refit_abroad_desc:0 "The refit trade has made Serenava a known name among armies that run older armour and cannot afford new vehicles. The state now signs long overhaul contracts with several of them, guaranteeing work for years. Some contracts are with governments the diet prefers not to discuss in public. The halls are full, and the garrison towns grow rich on other people's wars."
 SER_wd_cent_usean_fuel:0 "Fuel Prices and the Usean War"
 SER_wd_cent_usean_fuel_desc:0 "War breaks out on the continent of Usea in the summer of 2003, far from Serenava, but fuel and freight markets feel it at once. The forest field, the fishing fleets and the junction all depend on imported fuel. The government studies how far prices may climb and what the stored reserves can do. Serenava has no part in the war, and wants none."
 SER_wd_cent_rates_ease:0 "Prices Ease After Farbanti"
 SER_wd_cent_rates_ease_desc:0 "With Farbanti fallen, Erusea's surrender accepted and the war in Usea over, fuel markets calm and shipping settles. Serenava lifts its emergency fuel measures and lets prices find their level. Workshops and freight operators recover their margins. Officials who wanted the reserves released early claim vindication; those who held them note that the next war may last longer."
 SER_wd_cent_rates_stay:0 "Prices Stay High Without a Peace"
 SER_wd_cent_rates_stay_desc:0 "With Erusea victorious in Usea, the markets do not calm. Shipping lanes stay uncertain, fuel stays dear and some suppliers never return. Serenava turns its emergency measures into a standing fuel reserve policy, buying when prices dip and selling when they spike. The policy costs storage and capital, and it shields the state from the next shock."
 ac_wd_ser_tree:0 "Serenava: National Programme"
 ac_wd_ser_tree_desc:0 "The national focus programme of Serenava, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 SER_wd_diet_unsettled:0 "A Diet Without Standing Orders"
 SER_wd_diet_unsettled_desc:0 "The diet sits and the crown office keeps the seals, but nobody has agreed what the deputies may decide."
 SER_wd_princely_course:0 "The Princely Course"
 SER_wd_princely_course_desc:0 "Ministers come from the diet benches and the Office of the Crown signs on their advice."
 SER_wd_garrison_course:0 "Garrison Primacy"
 SER_wd_garrison_course_desc:0 "The commandants of the garrison towns press to hold the seals of a frontier state."
 SER_wd_township_course:0 "The Township Movement"
 SER_wd_township_course_desc:0 "Harbour wards and forest districts campaign for a republic of townships without a crown."
 SER_wd_district_audiences:0 "Open Audiences in the Districts"
 SER_wd_district_audiences_desc:0 "Princely ministers hear complaints in drill halls, fish markets and forest schools."
 SER_wd_prefect_commandants:0 "Garrison Prefects"
 SER_wd_prefect_commandants_desc:0 "Serving commandants run the districts around their garrisons under one signature."
 SER_wd_open_budgets:0 "Budgets on the Notice Board"
 SER_wd_open_budgets_desc:0 "Every township posts its budget line by line before it receives state funds."
 SER_wd_princely_constitution:0 "The Princely Statute in Force"
 SER_wd_princely_constitution_desc:0 "One printed text says what the crown office signs alone and what needs the diet."
 SER_wd_garrison_code:0 "The Garrison Ordinance in Force"
 SER_wd_garrison_code_desc:0 "The council rules by a published ordinance that any citizen may read and appeal against."
 SER_wd_republic_charter:0 "The Ratified Township Charter"
 SER_wd_republic_charter_desc:0 "A short charter fixes the court, the township shares of revenue and the rules for amendment."
 SER_wd_examined_service:0 "A Service by Examination"
 SER_wd_examined_service_desc:0 "Clerks recruited by open examination now hold the senior posts of every ministry."
 SER_wd_idle_hangars:0 "Hangars Without Squadrons"
 SER_wd_idle_hangars_desc:0 "Runways and shelters sized for a large air arm, maintained every month for a state with no aircraft."
 SER_wd_cargo_fields:0 "Freight on the Forest Field"
 SER_wd_cargo_fields_desc:0 "Freight airlines lease hangars and an overhaul trade grows on the military aprons."
 SER_wd_air_guard:0 "The Serenavian Air Guard"
 SER_wd_air_guard_desc:0 "A few interceptor squadrons and trained controllers to watch a frontier sky."
 SER_wd_cargo_concourse:0 "The Pine Concourse"
 SER_wd_cargo_concourse_desc:0 "Cargo moves from aircraft to wagons in a long shed beside the forest field."
 SER_wd_guard_wing:0 "Dawn Alert Wing"
 SER_wd_guard_wing_desc:0 "Armed interceptor pairs wait at every dawn with crews asleep beside them."
 SER_wd_aggressor_school:0 "The Aggressor Syllabus"
 SER_wd_aggressor_school_desc:0 "Hired instructors teach Serenavian crews to fight an opponent who knows how to win."
 SER_wd_hangar_rent:0 "Hangar Rents for a Season"
 SER_wd_hangar_rent_desc:0 "A row of outer hangars rented to private operators for one season."
 SER_wd_belt_survey:0 "The Casemate Survey"
 SER_wd_belt_survey_desc:0 "Every gallery, door and gun port of the belt counted and graded."
 SER_wd_belt_static:0 "Concrete in Depth"
 SER_wd_belt_static_desc:0 "Gun crews in every casemate, infantry behind them and tanks held close."
 SER_wd_armour_reserve:0 "Armour Behind the Belt"
 SER_wd_armour_reserve_desc:0 "Small casemate crews delay; an armoured reserve strikes where the line breaks."
 SER_wd_volunteer_regiments:0 "Volunteer Frontier Regiments"
 SER_wd_volunteer_regiments_desc:0 "Long-service volunteers from the garrison towns on family housing and civil job guarantees."
 SER_wd_frontier_reserve:0 "The Garrison Town Reserve"
 SER_wd_frontier_reserve_desc:0 "Former volunteers on reserve rolls, training two weeks each summer."
 SER_wd_casemate_marines:0 "Shore Casemate Marines"
 SER_wd_casemate_marines_desc:0 "Marine companies hold the shore casemates and rehearse counter-landings on the beaches."
 SER_wd_track_depots:0 "Forest Track Depots"
 SER_wd_track_depots_desc:0 "Engine and track spares hidden under the trees behind the belt."
 SER_wd_workshop_ledger:0 "Workshops on One Sheet"
 SER_wd_workshop_ledger_desc:0 "Three civilian works and two arms halls, counted, and almost all of them living on army orders."
 SER_wd_apprentices:0 "Apprentices at the Bench"
 SER_wd_apprentices_desc:0 "Paid trainee benches in every hall, certified by the state."
 SER_wd_civil_workshops:0 "Workshops for Town Goods"
 SER_wd_civil_workshops_desc:0 "The halls make pumps, cable, tools and tinned food for many buyers."
 SER_wd_armour_arsenal:0 "The Overhaul Trade"
 SER_wd_armour_arsenal_desc:0 "Foreign armies send engines and running gear to Serenavian halls for overhaul."
 SER_wd_civil_upgrade:0 "Workshop Goods Abroad"
 SER_wd_civil_upgrade_desc:0 "Garrison-town tools and household goods sold with export credit at foreign fairs."
 SER_wd_arsenal_upgrade:0 "Long Overhaul Contracts"
 SER_wd_arsenal_upgrade_desc:0 "Multi-year refit contracts with armies that run older armour."
 SER_wd_export_house:0 "The Serdonia Export House"
 SER_wd_export_house_desc:0 "A joint sales office that takes Serenavian samples to foreign buyers."
 SER_wd_freight_count:0 "The Junction Tally"
 SER_wd_freight_count_desc:0 "A month of wagons counted at every yard where the lines meet."
 SER_wd_open_gate:0 "The Open Gate Tariff"
 SER_wd_open_gate_desc:0 "One published transit tariff, clearance on the train and no searches without cause."
 SER_wd_guarded_gate:0 "The Guarded Gate"
 SER_wd_guarded_gate_desc:0 "Every wagon crossing the frontier is sealed, logged and inspected."
 SER_wd_bonded_wagons:0 "Sealed Wagons in Transit"
 SER_wd_bonded_wagons_desc:0 "Bonded freight crosses Serenava unopened when its seals arrive intact."
 SER_wd_customs_brigade:0 "Brigades of the Frontier Customs"
 SER_wd_customs_brigade_desc:0 "Former soldiers with trucks, dogs and radios patrol between the crossings."
 SER_wd_junction_board:0 "One Timetable for Four Lines"
 SER_wd_junction_board_desc:0 "A single board runs the timetable, the dispatch room and the budget of every line."
 SER_wd_gravel_gangs:0 "Gravel Gangs on the Plains"
 SER_wd_gravel_gangs_desc:0 "Paid gangs regravel the village roads before the rains."
 SER_wd_twin_harbours:0 "Two Harbours, Two Ledgers"
 SER_wd_twin_harbours_desc:0 "Serdonia and Karnaca keep separate books and chase the same small trade."
 SER_wd_fishing_cooperatives:0 "Crews Who Sell Together"
 SER_wd_fishing_cooperatives_desc:0 "Crews sell together through their own ice plants and auction halls."
 SER_wd_harbour_board:0 "One Board for the Coast"
 SER_wd_harbour_board_desc:0 "Common dues, one investment budget and one set of pilots for both harbours."
 SER_wd_rival_dues:0 "Rival Harbour Dues"
 SER_wd_rival_dues_desc:0 "Each harbour sets its own fees and competes for every coaster."
 SER_wd_harbour_patrol:0 "The Karnaca Flotilla"
 SER_wd_harbour_patrol_desc:0 "Patrol craft from Karnaca watch the fishing grounds and the shore casemates."
 SER_wd_minesweepers:0 "Coastal Sweeping Crews"
 SER_wd_minesweepers_desc:0 "Two patrol craft fitted and drilled to clear the coastal lanes."
 SER_wd_gatewood_standards:0 "Perblan Gauge and Standards"
 SER_wd_gatewood_standards_desc:0 "One rail gauge, Perblan technical norms and matched customs rates."
 SER_wd_osean_traders:0 "Osean Trade Missions"
 SER_wd_osean_traders_desc:0 "Osean buyers and technical standards welcomed at the frontier offices."
 SER_wd_even_frontier:0 "Equal Distance from All"
 SER_wd_even_frontier_desc:0 "One tariff for every neighbour and envoys of equal rank in every capital."
 SER_wd_frontier_alert:0 "The Frontier on Alert"
 SER_wd_frontier_alert_desc:0 "Posts doubled, patrols lengthened and leave cancelled while war burns beyond Osea."
 SER_wd_transit_closed:0 "Closed to Belligerent Trains"
 SER_wd_transit_closed_desc:0 "No soldier, weapon or military store for any party crosses the junction."
 SER_wd_relief_trains:0 "Marked Relief Trains"
 SER_wd_relief_trains_desc:0 "Food, medicine and civilian goods for anyone, marked and searched at the crossing."
 SER_wd_stand_to:0 "Regiments Standing To"
 SER_wd_stand_to_desc:0 "Crews at their posts and reserves called while the war lasts."
 SER_wd_fuel_ration:0 "Fuel on Ration Cards"
 SER_wd_fuel_ration_desc:0 "Stored aviation spirit and diesel released at a controlled price."
 SER_wd_neutral_freight:0 "Neutral Air Freight"
 SER_wd_neutral_freight_desc:0 "Civil cargo flights under large neutral markings on filed routes."
 SER_wd_osean_drawdown:0 "A Quieter Plain"
 SER_wd_osean_drawdown_desc:0 "Osean columns gone home and the crossings back to their old routines."
 SER_wd_osean_buildup:0 "A Hardened Plain"
 SER_wd_osean_buildup_desc:0 "New fortifications and cold offices on the far side of the frontier."
 SER_wd_sky_dread:0 "The Asteroid Over Serdonia"
 SER_wd_sky_dread_desc:0 "Every district plans for fragments that may fall anywhere."
 SER_wd_public_casemates:0 "Families in the Casemates"
 SER_wd_public_casemates_desc:0 "Every household has a gallery, a warden and a route to the concrete."
 SER_wd_forest_shelters:0 "Forest Shelter Trenches"
 SER_wd_forest_shelters_desc:0 "Timber-roofed trenches near every town, with the casemates kept for the regiments."
 SER_wd_hangar_depots:0 "Relief Stores in the Hangars"
 SER_wd_hangar_depots_desc:0 "Grain, blankets, generators and medicine kept dry under hangar concrete."
 SER_wd_skyward_radar:0 "Radars Turned Skyward"
 SER_wd_skyward_radar_desc:0 "Field radar sets retuned to watch the upper sky for falling rock."
 SER_wd_warden_rota:0 "The Warden Rota"
 SER_wd_warden_rota_desc:0 "A trained warden for every gallery, with lists, keys and rules."
 SER_wd_wartime_fuel:0 "Fuel at Wartime Prices"
 SER_wd_wartime_fuel_desc:0 "A distant war has made every litre dearer at the field, the harbours and the junction."
 SER_wd_fuel_hedge:0 "The Fuel Reserve Policy"
 SER_wd_fuel_hedge_desc:0 "The state buys fuel when prices dip and sells when they spike."
 ac_wd_ser.1.t:0 "The Diet in a Drill Hall"
 ac_wd_ser.1.d:0 "The first full sitting of the Serenavian diet takes place in a drill hall at Serdonia, because the only rooms large enough for every deputy were built for soldiers. Rifle racks have been carried out and benches carried in, and the painted lines for parade still show beneath the borrowed carpets. The Office of the Crown sends a written greeting and a short list of what it already handles: the seals, the garrison payroll and the frontier posts.\n\nThe deputies arrive with very different instructions. Members from the garrison towns want the commandants heard on every budget, since the regiments employ half the inland districts. The harbour wards of Serdonia and Karnaca want customs and fishing rules settled before anything else. The forest districts want roads, schools and a voice that is not drowned out by uniforms or ships. Most deputies sit with the monarchist majority, and even they disagree about how much the crown office should do on its own.\n\nBefore any law can pass, the diet has to agree how it will work at all. One proposal borrows a complete set of standing orders from an older chamber and adopts it in a single day, giving the clerks a rulebook they already know. The other asks the deputies to write their own, slowly and clause by clause, so that every district can see its interests in the procedure itself.\n\nProvisional gameplay."
 ac_wd_ser.1.a:0 "Adopt the borrowed standing orders."
 ac_wd_ser.1.b:0 "Write our own rules, clause by clause."
 ac_wd_ser.2.t:0 "Hangars Built for Someone Else"
 ac_wd_ser.2.d:0 "The inspectors who walk the forest airfield need three full days to finish. Runways long enough for heavy transports cut through the pines, taxiways branch off to hardened shelters, and the fuel farms could keep a large air arm flying for weeks. The lights work and the doors open. Almost nothing parked inside belongs to Serenava, whose inventory lists tanks, rocket batteries and marines but not one combat aircraft of its own.\n\nThe fields were laid out by older governments for a much larger air arm, and their scale reflects that purpose rather than any budget Serenava can now carry. Keeping the concrete patched, the drains clear and the radar sets warm costs money every month, whether or not anything takes off. Local contractors have lived on that maintenance for years, and their foremen have already asked the diet to keep the work coming.\n\nThe inspectors hand the ministry a blunt first choice. Most of the outer shelters could be mothballed at once, cutting the monthly bill and accepting that reopening them later will be slow and costly. Or the whole complex could be kept in working order while the state decides what its fields are for, paying for a readiness it cannot yet use.\n\nProvisional gameplay."
 ac_wd_ser.2.a:0 "Mothball the outer shelters."
 ac_wd_ser.2.b:0 "Keep every runway open."
 ac_wd_ser.3.t:0 "Concrete Along the Line"
 ac_wd_ser.3.d:0 "The survey teams start at the inland casemates, where the rail line leaves the plains for Osea, and finish at the two groups of shore casemates on the coastal plain. The concrete is thick and mostly sound. The wiring is not, several periscopes have fogged beyond use, and a number of ammunition rooms turn out to be full of ploughs and seed sacks left by farmers who have treated the bunkers as barns for years.\n\nWhoever poured the belt expected an Osean army on the plains one day, and its size dwarfs anything Serenava's volunteer regiments could ever man. Commandants say that empty casemates invite trouble and that a frontier state must look ready even when it is not. Treasury officials answer that every manned casemate is a salary, a ration and a fuel bill. The farmers simply want their barns back before the rains.\n\nThe survey closes on a question the army cannot settle by itself. The belt can be treated as a living defence line, with crews, drills and repairs that never stop. Or it can be held as a reserve of concrete, sealed and checked twice a year, until the government knows what the frontier will actually demand of it.\n\nProvisional gameplay."
 ac_wd_ser.3.a:0 "Crew the casemates."
 ac_wd_ser.3.b:0 "Seal them and check twice a year."
 ac_wd_ser.4.t:0 "The Workshop Floor Count"
 ac_wd_ser.4.d:0 "The industry clerks finish their count of the garrison-town workshops on a wet afternoon, and the result fits on one sheet of paper. Three civilian works make tools, cable, tinned goods and spare parts. Two arms halls overhaul tank engines, rebuild running gear and fill shells for the regiments. Between them they employ most of the skilled hands inland, and almost every order in their books carries an army stamp.\n\nThat dependence is the whole difficulty. A regiment that stops buying can empty a street of shops within a season. The halls are well equipped for repairing heavy vehicles and poorly equipped for anything a family would buy. Foremen say their workers could learn new lines within a year; bankers say nobody will lend a coin for conversion until the state says plainly what it wants the workshops to become.\n\nThe clerks offer two ways to release their sheet. It can be published with the payroll figures and the army share of the orders, starting a public argument that will run until the choice is made. Or it can go to the ministries alone, so officials settle the matter among themselves while rumours spread through every garrison town.\n\nProvisional gameplay."
 ac_wd_ser.4.a:0 "Publish the payroll and the order book."
 ac_wd_ser_4_a:0 "Publish the payroll and the order book."
 ac_wd_ser.4.b:0 "Send the count to the ministries only."
 ac_wd_ser.5.t:0 "Freight at the Junction"
 ac_wd_ser.5.d:0 "For a month the railway clerks at every Serenavian yard write down each wagon that passes. Trains run toward Gatewood by way of Baleton, into Old Perbla past the forest field, through Karnaca to Driscol and Fraeport, and across the plains to the Osean frontier. Serenava sits where all of those lines cross, and the tally shows how much of the traffic is merely passing through on its way somewhere else.\n\nThrough-freight pays Serenava little under the old rates. It wears out the track, blocks the level crossings in the garrison towns and fills the yards every night. Yet shippers on every side rely on the junction, and a small state that makes itself useful to its neighbours enjoys a kind of security that no casemate can provide. In the rainy months the roads beside the lines turn to mud, and the railway becomes the only dependable way to move anything.\n\nThe clerks want to know what their tally is for. Used as the basis for a new transit tariff, it would raise revenue and irritate every neighbour at once. Used only to plan repairs and sidings, it would keep goodwill on all sides and leave the junction paying for its own wear.\n\nProvisional gameplay."
 ac_wd_ser.5.a:0 "Draft a transit tariff from the tally."
 ac_wd_ser.5.b:0 "Use it to plan repairs only."
 ac_wd_ser.6.t:0 "Serdonia and Karnaca Compare Books"
 ac_wd_ser.6.d:0 "The harbour masters of Serdonia and Karnaca are summoned to bring their accounts to the same table for the first time anyone can remember. Serdonia is the larger town, with the busier markets and the older quays. Karnaca has the deeper naval berths and the railway toward Driscol and Fraeport. Each town has always believed the other was favoured, and the books, laid side by side, give both of them some evidence.\n\nBoth harbours handle fish, coastal freight and the stores for the shore casemates. Neither has the dredgers, tugs or haul-out to service a real ship, so serious repairs go abroad and the money goes with them. The naval berths stand half empty because Serenava owns few vessels to fill them. Above all, the fishing crews complain that they are charged landing fees twice, once at each harbour, whenever weather forces them to switch ports.\n\nThe cooperatives of both towns now demand that the double fees end and that past payments be returned. Refunding everything would win the fleets over and drain the harbour accounts for a year. Abolishing the fees from next season only would cost far less and leave a grievance that every fishing family can recite.\n\nProvisional gameplay."
 ac_wd_ser.6.a:0 "Refund the double fees."
 ac_wd_ser.6.b:0 "Abolish them from next season."
 ac_wd_ser.7.t:0 "Four Calls in One Week"
 ac_wd_ser.7.d:0 "Serenava's first envoys travel by rail, since the rail is what ties the state to everyone around it. In a single week they call at Gatewood, at the offices that govern the Relentian ports and the Terentio towns, whoever those offices now answer to, and at the Osean frontier administration across the plains. Each call opens with the same dull and necessary questions: customs seals on through-trains, radio frequencies for the field towers and fishing limits off Karnaca.\n\nGatewood receives the envoys correctly and asks about the airfields and the casemates before anything else. The officials from the Relentian ports want the Karnaca line kept running at any price. Terentio's people ask mostly about freight rates and empty return wagons. The Osean officials are courteous, curious and careful, and they ask nothing at all about the past, which the envoys find more unsettling than any complaint.\n\nOn their return the envoys report that every neighbour wants something from Serenava and that no two want the same thing. Ministers can answer with one published line of policy for all of them, or deal with each neighbour separately and quietly, accepting that four private answers may not match when they are compared.\n\nProvisional gameplay."
 ac_wd_ser.7.a:0 "Publish one policy for every neighbour."
 ac_wd_ser.7.b:0 "Handle each neighbour separately."
 ac_wd_ser.8.t:0 "The War Beyond the Line"
 ac_wd_ser.8.d:0 "When the Belkan War breaks out in March 1995, Serenava has no stake in the fighting, but Osea does, and Osea lies directly across the plains from the inland casemates. Within days the frontier posts report heavier traffic on the Osean side: fuel trucks, ambulances and trains running at night with their windows blacked out. Radio sets in the garrison towns pick up military chatter that nobody in Serenava was ever meant to hear.\n\nSerenava's own position is uncomfortable. The giant airfields and the casemate belt were built facing Osea, and Osean officers know every one of them by heart. A neutral state with that much concrete pointed at a belligerent has to prove that it means no harm, while a frontier state with so small an army must also prove that it cannot be pushed around. The monarchist benches call for calm; the garrison towns call for every regiment to stand to.\n\nOn the fourth day an Osean liaison officer arrives at the inland crossing with a polite letter. Osea asks to place observers at the frontier posts for the duration of the war, to reassure its commanders that nothing will move against them from Serenavian soil. Accepting would calm the line and look like a favour to one side. Refusing would keep Serenava visibly its own master and leave the Osean commanders guessing.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25 in tools/lore/chronicle.json; every Serenavian and Osean action described is gameplay."
 ac_wd_ser.8.a:0 "Accept the observers at the posts."
 ac_wd_ser.8.b:0 "Refuse, and invite them to watch from their side."
 ac_wd_ser.9.t:0 "Observers at the Inland Post"
 ac_wd_ser.9.d:0 "Twenty days after the letter, four Osean officers and a radio operator share a hut with Serenavian customs staff at the inland crossing. They eat in the post canteen, sign the visitors book every morning and file reports that nobody in Serenava is allowed to read. The arrangement is awkward, and both sides go to some lengths to keep it polite.\n\nIn the garrison towns the observers become a favourite topic of argument. Some residents are relieved: as long as the Oseans can see for themselves, nobody across the plains will mistake a Serenavian exercise for an attack. Others resent foreign uniforms on their soil while a war burns beyond Osea, and the commandants complain that the observers count every truck, every gun and every soldier who goes on leave.\n\nThe Osean liaison now proposes a second step: a direct telephone line from the inland post to the nearest Osean frontier headquarters, manned at both ends day and night. Such a line would let a misunderstanding be settled in minutes. It would also tie the daily routine of Serenava's frontier to an Osean switchboard for as long as the line exists.\n\nProvisional gameplay."
 ac_wd_ser.9.a:0 "Install the direct line."
 ac_wd_ser.9.b:0 "Keep contact through the observers only."
 ac_wd_ser.10.t:0 "The Asteroid and the Casemates"
 ac_wd_ser.10.d:0 "Since December 1994 astronomers had spoken of a close pass. In April 1996 the talk ends: Ulysses is coming, it will hit, and the impact zones are a matter of guesswork for months to come. Serenava owns no observatory worth the name and no rocket, satellite or telescope with which to follow the danger. What it owns instead is rare among small states, a belt of reinforced casemates and a forest airfield full of hardened shelters.\n\nWithin a week, families from Serdonia and Karnaca are seen walking out to the shore casemates with blankets and tinned food to test the doors. Commandants want the bunkers kept for the regiments; mayors want them opened to children and the elderly. The airfield contractors offer to fit out the hangars as relief stores, at a price. In the harbour towns candles, batteries and bottled water double in cost before the month is out.\n\nBefore choosing how to use the concrete, ministers have to tell a frightened public something. A full statement of what is known and unknown would include the uncomfortable fact that the casemates cannot shelter everyone. A short announcement that planning is under way would buy calm, at the risk of being accused later of hiding the arithmetic.\n\nProvisional gameplay: date anchors only, ACES Chronicle rows 1994 / 12.10 and 1996 / 04.20 in tools/lore/chronicle.json; the Serenavian reaction is gameplay."
 ac_wd_ser.10.a:0 "Publish the arithmetic."
 ac_wd_ser_10_a:0 "Publish the arithmetic."
 ac_wd_ser.10.b:0 "Ask for patience while plans are drawn."
 ac_wd_ser.11.t:0 "Radar Watch on the Roche Night"
 ac_wd_ser.11.d:0 "On the night Ulysses passes the Roche limit in July 1999, the radar sets on the Serenavian fields are pointed upward for the first time in their working lives. Operators trained to track low-flying aircraft now report streaks, flashes and phantom returns, very few of which mean anything. Each report travels by telephone to a control room where tired officials must decide whether to wake the districts.\n\nIn the shelters, families listen to the radio and wait. Some sleep; many cannot. Rail crews keep the evacuation trains warm at the junction, and the forest districts hold their fire wardens on duty in case burning debris lands among the pines. Rumour runs faster than any report: a fire at sea, a radio station gone silent, a train missing somewhere between Karnaca and the forest field.\n\nBy dawn the control room has logged dozens of alarms and confirmed very few of them, and the observatories abroad cannot yet say when the danger will end. Ministers can keep the full alert in force until foreign agencies declare the sky clear, or release most of the shelters and keep only the radar crews and the fire wardens on watch.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1999 / 07.08 in tools/lore/chronicle.json; the Serenavian watch is gameplay."
 ac_wd_ser.11.a:0 "Hold the full alert."
 ac_wd_ser.11.b:0 "Release the shelters and keep the watch."
 ac_wd_ser.12.t:0 "Instructors Who Once Flew for Belka"
 ac_wd_ser.12.d:0 "In the summer of 1998 a small agency writes to the Serenavian air staff offering instructors for hire. Its pilots are former Belkan Air Force aviators, some of the most capable the war produced, now selling their experience to any air arm that will pay. Air arms across the world are already hiring such pilots to fly as aggressors against their own crews. The letter is short, professional and accompanied by a price list.\n\nThe offer is tempting. Serenava's fields have more runway than pilots, and its training staff has never flown against an opponent who knows how to win. The instructors would bring their own methods, fly against Serenavian crews over the forest field and leave behind a syllabus that would take a decade to build at home. Their fee is high, and they want it in foreign currency.\n\nThe price is more than money. Hiring former Belkan aviators will be noticed in Osea, just across the plains, and the harbour deputies worry about what Osean buyers will think. The air staff argues that a neutral state may hire whomever it pleases. The foreign office replies that neutrality is judged by neighbours rather than by lawyers.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1998 / 06.19 in tools/lore/chronicle.json; any Serenavian hiring is gameplay."
 ac_wd_ser.12.a:0 "Sign the instructors for two seasons."
 ac_wd_ser.12.b:0 "Decline with thanks."
 ac_wd_ser.13.t:0 "The First Aggressor Report"
 ac_wd_ser.13.d:0 "After six weeks of mock combat over the forest field, the hired instructors hand in their first written assessment. It is not kind. Serenavian crews fly carefully and shoot late; they trust the ground controllers too much and their own eyes too little. Several sorties ended with every trainee shot down before the instructors had burned half their fuel.\n\nIn its own way the report is also generous. The instructors praise the ground crews, the fuel discipline and the radar controllers, and they write that the crews who survived the first weeks are learning faster than any group they have trained elsewhere. They ask for more flying hours, more targets and permission to train over the sea off Karnaca, where the coastal radar can follow every engagement.\n\nThe air staff must now choose whether to keep the programme narrow, confined to the forest field and the hours already agreed, or widen it as the instructors ask. A wider programme would cost more fuel, wear out more airframes and draw more attention from neighbours who already watch every flight Serenava makes. A narrow programme would finish on time and leave the crews only half taught.\n\nProvisional gameplay."
 ac_wd_ser.13.a:0 "Widen the programme."
 ac_wd_ser.13.b:0 "Keep it within the agreed hours."
 ac_wd_ser.14.t:0 "The Frontier Takes Stock"
 ac_wd_ser.14.d:0 "A panel of deputies, commandants, harbour masters and railway clerks is asked to describe what Serenava has become since it began governing itself. Their report is plain. The diet sits under rules it wrote or borrowed, the junction carries more freight than before, and the workshops sell to more buyers than the army alone. The casemate belt still stands, crewed or sealed, and the great airfields still dwarf everything else on the map.\n\nThe panel is just as plain about failures. The forest districts still feel that decisions are taken in Serdonia and paid for by them. Young engineers leave for jobs in larger countries and seldom return. Too much of the economy depends on traffic through the junction and on contracts tied to the airfields, and either could vanish with a decision taken in some other capital.\n\nMinisters now have to receive the report somehow. Every finding could go to the diet for debate, with a written reply to each, inviting a hard year of criticism. Or the recommendations that suit the government could be adopted at once and the rest filed away, keeping the political year quiet and leaving the hardest problems for whoever governs next.\n\nProvisional gameplay."
 ac_wd_ser.14.a:0 "Debate every finding in the diet."
 ac_wd_ser.14.b:0 "Adopt what suits us and file the rest."
 ac_wd_ser.15.t:0 "Fuel Bills from a Distant War"
 ac_wd_ser.15.d:0 "War returns to the news in August 2003, this time on the far continent of Usea, where the FCU demands that Erusea withdraw and founds the ISAF. Serenava has no part in that quarrel and no forces anywhere near it. Its fuel merchants, however, read the shipping news before anything else, and by the end of the week the price of aviation spirit at the forest field has jumped sharply.\n\nThe airfields feel it first, as freight operators and training staff alike ask the treasury for fuel credit. The harbour towns feel it next, when the fishing crews find their diesel dearer every time they fill up. In the garrison towns the workshops discover that spare parts ordered from abroad now arrive late and cost more, because every supplier is busy with orders from larger buyers.\n\nThe ministry can draw down the fuel farms built for a far larger air arm, selling stored fuel to local users at a controlled price until the market settles. Or it can leave the stocks untouched, as a reserve against a worse crisis closer to home, and let prices do their unpleasant work. The fuel farm managers say they can deliver either way within a week.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2003 / 08.22 in tools/lore/chronicle.json; the Serenavian fuel response is gameplay."
 ac_wd_ser.15.a:0 "Release fuel from the farms."
 ac_wd_ser.15.b:0 "Hold the stocks untouched."
 ac_wd_ser.16.t:0 "Market Day at the Crossing"
 ac_wd_ser.16.d:0 "Once a season the inland crossing closes to freight for a day and opens to traders. Farmers from the plains bring fruit and timber, workshop cooperatives bring tools and cable, and buyers arrive from the Osean side and from the old crown lands with cash and order books. Customs staff set up trestle tables across the road, and the casemates above the crossing look down on what is, for one day, a fairground.\n\nThe markets are popular and untidy. Smugglers use the crowds, prices are argued over in several accents, and the commandants dislike open gates on the most sensitive stretch of the frontier. Yet the trade is real, the stalls sell out by evening, and for a day the garrison towns see foreign customers rather than foreign uniforms on the far side of the barrier.\n\nThis season the traders ask for a second day and a covered hall, so that rain no longer spoils the stalls. The customs office can grant both and collect a modest fee for the hall, or keep the market to a single day and keep the frontier routine as undisturbed as possible. The commandant at the crossing has already made a preference known.\n\nProvisional gameplay."
 ac_wd_ser.16.a:0 "Grant the second day and the hall."
 ac_wd_ser.16.b:0 "Keep it to a single day."
 SER_wd_princely_cabinet_office:0 "Cabinet of the Principality"
 SER_wd_princely_cabinet_office_desc:0 "A cabinet chosen from the majority of the Serenavian diet that governs collectively in the name of the Principality and resigns when the deputies withdraw their confidence. Provisional gameplay office with no named holder."
 SER_wd_garrison_council_office:0 "Council of Frontier Commandants"
 SER_wd_garrison_council_office_desc:0 "A council of serving commandants from the garrison towns that keeps the state seal, the treasury and the frontier posts, ruling by ordinance and calling the diet only when it wishes. Provisional gameplay office with no named holder."
 SER_wd_township_executive_office:0 "Executive of the Serenavian Townships"
 SER_wd_township_executive_office_desc:0 "An executive chosen by the diet of the Republic of Serenava at set intervals, with the princely office retired and the township councils keeping their own budgets. Provisional gameplay office with no named holder."
 ac_wd_ser_decisions:0 "Serenava: National Measures"
 ac_wd_ser_decisions_desc:0 "Measures from the national programme of Serenava. Provisional gameplay unless a source ledger row says otherwise."
 SER_wd_hangar_rent_decision:0 "Rent Out a Row of Hangars"
 SER_wd_hangar_rent_decision_desc:0 "Lease a row of outer hangars to private operators for half a year, trading readiness for rent."
 SER_wd_casemate_drill_decision:0 "A Night Drill in the Casemates"
 SER_wd_casemate_drill_decision_desc:0 "Call the casemate crews out for a night of alarms, gun drills and gas-door checks along the whole belt."
 SER_wd_gravel_gangs_decision:0 "Send Gravel Gangs Before the Rains"
 SER_wd_gravel_gangs_decision_desc:0 "Pay village gangs to regravel the plains roads for four months before the wet season closes them."
 SER_wd_crossing_market_decision:0 "A Market Day at the Inland Crossing"
 SER_wd_crossing_market_decision_desc:0 "Close the inland crossing to freight for a day and open it to traders from both sides of the frontier."
 SER_wd_shore_radar_decision:0 "A Radar Set for the Shore Casemates"
 SER_wd_shore_radar_decision_desc:0 "Buy one radar set for the shore casemates, once, and wire it to the Serdonia mast."
 SER_wd_landing_drill_decision:0 "Landing Drills off Karnaca"
 SER_wd_landing_drill_decision_desc:0 "Put the patrol flotilla and the casemate marines through a week of landings and counter-landings."
