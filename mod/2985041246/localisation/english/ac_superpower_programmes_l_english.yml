 OSE_snp_guarantor_review_civil_policy_spirit_settled_desc:0 "The review begins with undertakings that still have signatures but no recent receiving return. Some refer to a settlement; others describe ordinary bilateral promises. The committee refuses to pretend that all settlements produced the same obligations. A guarantor earns credibility by explaining what it can continue, what it must renegotiate and who bears the domestic cost. Refusal can be responsible when it arrives before another country has scheduled its services around an empty promise.\n\nKeep an accountable renewal procedure rather than a permanent exceptional promise. The chosen national mandate and its opportunity cost remain visible. The chosen continuing cost remains."
