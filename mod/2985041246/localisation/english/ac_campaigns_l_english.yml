 ac_camp.66.t:0 "An authenticated voice"
 ac_camp.66.desc:0 "The operator asked the question twice because an ordinary mistake would have been easier to understand than a convincing answer. The reply matched the verification record. He looked at the officer beside him and repeated the result without adding anything that might become a rumor on its way across the room.\n\nThe rescue had succeeded. Harling's voice supplied an authority the compromised channels had tried to remove, but it did not make every listener ready to trust the next message. The operator kept the verification record beside the original, aware that relief could make people careless with the very procedures that had allowed them to recognize the voice in the first place.\n\nThe investigators began checking the circulation before the celebratory calls had ended. A government could be present and still have its instructions diverted. A squadron could be vindicated and still have lost people who would not hear the vindication.\n\nSomeone asked whether the crew should be brought into the room. The receiving officer said they should first be allowed to finish the work that had brought them back. The answer disappointed a man who had already begun arranging the photograph.\n\nOutside, the military schedule continued to run. Across the ocean, another government had its own missing authority and its own reasons to doubt that Osea could offer a reliable agreement. Restoring one voice opened the possibility of an answer. It did not supply the answer itself.\n\nThe operator made a copy of the verified transmission and marked the original. This time, if somebody changed the distribution, there would be a record from which the change could be read."
