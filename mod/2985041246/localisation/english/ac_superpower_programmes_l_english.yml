 YUK_snp_maritime_support_policy_context_2:0 "The standing policy is fleet maintenance priority. Its continuing opportunity cost remains in the national schedule."
 ac_snp.23.t:0 "The Shore Office’s Old Maintenance Book"
 ac_snp.23.d:0 "A former watch officer brings an old maintenance book to the shore commission. Several entries refer to reservations whose present receiving authority is unclear. The harbour representative asks that ordinary civil services receive a protected window before another exceptional support promise is made. The naval liaison asks for a bounded fleet-maintenance share with one shore office answerable for the resulting delays. Neither asks the book to prove that a hull is currently serviceable, or even that an old entry still describes an active vessel. The commission must decide how present support work will be received, and how the dockside record will explain the civilian work reserved or displaced by that choice.\n\n[YUK_snp_maritime_support_policy_context]"
 ac_snp.23.a:0 "Protect civil port windows and let the shore office challenge exceptions."
 ac_snp.23.a_effect_tt:0 "Move up to five existing allocation points toward civil receiving offices, protecting active reservations. The two shares still total one hundred."
 ac_snp.23.b:0 "Reserve bounded fleet maintenance and identify its dockside responsibility."
 ac_snp.23.b_effect_tt:0 "Move up to five existing allocation points toward command support, protecting active reservations. The two shares still total one hundred."
