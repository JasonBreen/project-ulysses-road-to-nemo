 SNS_up_district_return_rota_tt:0 "Continuity networks: +4 (maximum 100). The national programme's standing benefit and civilian allocation update together. Earn the named capability required for 'Staff the Permanent Recovery Record'. Its other listed capabilities and a paid national allocation remain necessary; this is not an interchangeable index requirement."
 SNS_up_protection_training:0 "Train the Next Protection Rota"
