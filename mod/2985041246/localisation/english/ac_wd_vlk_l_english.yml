l_english:
 VLK_wd_pol_tally:0 "Counting the Two Camps"
 VLK_wd_pol_tally_desc:0 "The Administration orders a plain count of party sympathy in all five districts, and the totals give it no comfort. The nationalist camp holds fifty voters in a hundred, the non-aligned camp forty-eight, and the democratic label under which the government itself sits holds one. Ordering the count costs the comfortable fiction that the Union is undecided; it is decided twice over, in opposite directions."
 VLK_wd_pol_nonaligned_rooms:0 "Hear the Non-Aligned Camp"
 VLK_wd_pol_nonaligned_rooms_desc:0 "The non-aligned camp is less a party than a habit: district directors, cooperative boards, works managers and town clerks who want the Union run competently and otherwise left alone. Officials spend a season in their offices asking what they would accept. The answer is continuity and budgets on time. Listening costs attention, and tells the nationalists exactly whom the government consults first."
 VLK_wd_pol_nationalist_rooms:0 "Hear the Nationalist Camp"
 VLK_wd_pol_nationalist_rooms_desc:0 "Half the country leans toward the nationalist camp, whose organisers meet in rented halls, sports clubs and the back rooms of the capital works. The Administration sends officials to listen rather than to argue. The camp wants a ballot it expects to win, a firmer service and fewer foreign goods in the shops. Hearing it openly lends the camp a standing it has never been granted."
 VLK_wd_pol_two_points:0 "Two Points Decide It"
 VLK_wd_pol_two_points_desc:0 "Every option the ministers can draft turns on the same two points of the tally. A ballot held tomorrow would very probably give the government to the nationalist list. Keeping the ballot suspended leaves the Union governed against the wishes of half its voters by a label almost nobody supports. The cabinet must choose which of those two risks it is prepared to live with."
 VLK_wd_pol_two_points_tt_1:0 "Opens the ballot path and the suspension path; only one can be taken."
 VLK_wd_pol_call_ballot:0 "Call the National Ballot"
 VLK_wd_pol_call_ballot_desc:0 "The first answer honours the election calendar the Union keeps on paper. Rolls are printed, polling halls opened and every list allowed to stand. The Administration accepts that it is probably organising its own replacement, and that the count may hand the seals to the nationalist camp. What it gains is a government nobody can call illegitimate, whatever that government then chooses to do."
 VLK_wd_pol_keep_drawer:0 "Keep the Ballot in the Drawer"
 VLK_wd_pol_keep_drawer_desc:0 "The second answer leaves the vote suspended. The non-aligned camp, which trusts administrators more than candidates, prefers it, and the government can keep the works and the trunk line running without a campaign season. The price is plain to everyone: half the country is told its majority will not be counted, and its organisers will repeat that sentence at every meeting."
 VLK_wd_pol_list_cabinet:0 "The Winning List Takes Office"
 VLK_wd_pol_list_cabinet_desc:0 "The nationalist list wins the ballot narrowly and names a cabinet that takes the seals from the National Administration. It governs as an elected government, bound to the calendar that brought it in and answerable to a chamber where the non-aligned camp holds nearly half the seats. The change runs through the office, not a person. Almost half the country watches its new government with dread."
 VLK_wd_pol_two_thirds:0 "A Cabinet Needs Two Thirds"
 VLK_wd_pol_two_thirds_desc:0 "Before the polls open, the Administration and the smaller lists push through one rule: no cabinet takes office without two thirds of the chamber behind it. Neither camp can reach that alone, so the government that emerges is a coalition across the split with a chair from the centre. It is slow and quarrelsome by design. The nationalist camp calls the rule a theft of its narrow majority."
 VLK_wd_pol_directors:0 "The District Directors Govern"
 VLK_wd_pol_directors_desc:0 "With the ballot kept in the drawer, the non-aligned camp's own figures step forward: directors of the five district offices, the works, the cooperatives and the banks. They form a council that governs by published resolution, with no party seats and no election. It is competent and unelected, and it rests on forty-eight voters in a hundred while the other fifty are told to wait."
 VLK_wd_pol_caretaker:0 "The Administration Holds On"
 VLK_wd_pol_caretaker_desc:0 "The quietest answer changes nobody. The National Administration keeps the seals under its democratic label, the ballot stays suspended and no council is formed. Ministers promise competence instead of politics and publish their accounts every quarter to prove it. Both camps are left waiting, which the Administration counts as an achievement and both camps count as an insult."
 VLK_wd_pol_list_pledge:0 "A Pledge Read in Every Hall"
 VLK_wd_pol_list_pledge_desc:0 "The nationalist cabinet knows that nearly half the country fears it. To answer that fear it reads a short pledge in every district hall: the frontiers stay where they are, the service stays defensive, the next ballot keeps its date and the courts keep their judges. The pledge disappoints some of its own supporters, who wanted more. It buys a measure of calm from everyone else."
 VLK_wd_pol_cross_cabinet:0 "Ministers from Both Camps"
 VLK_wd_pol_cross_cabinet_desc:0 "The two-thirds rule produces what it was meant to: a cabinet in which ministers from the nationalist list and the non-aligned camp sit at one table, with a chair from the centre to break ties. Every budget is a negotiation and every appointment a trade. Decisions come slowly. When they do come, hardly anybody in the Union can claim to have been left out of them."
 VLK_wd_pol_weekly_resolutions:0 "Resolutions Posted Weekly"
 VLK_wd_pol_weekly_resolutions_desc:0 "The directors' council posts its resolutions every week on the door of each district office, with the reasons and the vote beside them. Nobody elected the council, so it tries to earn trust through visible reasoning instead. The notices are dull and widely read. Nationalist organisers copy them too, and circle every line that seems to favour the works over the towns."
 VLK_wd_pol_ballot_date:0 "A Date for the Next Ballot"
 VLK_wd_pol_ballot_date_desc:0 "Holding on cannot last forever, and the Administration knows it. It prints the date of the next national ballot four years ahead, with rolls, rules and counting procedures attached, and promises to keep it. Both camps begin organising at once. The government gains a clear term in which to work and loses any chance of postponing again without breaking its printed word."
 VLK_wd_pol_lot_clerks:0 "Count Clerks Drawn by Lot"
 VLK_wd_pol_lot_clerks_desc:0 "Whatever order now governs, every future count of votes, petitions or referendums will be run by clerks drawn by lot from both camps and paid by the courts rather than the government. Each camp grumbles that the other will cheat; neither can say the count itself is rigged. The office costs salaries and training, and its value lies in the next close tally, whenever that comes."
 VLK_wd_line_walk:0 "Walk the Trunk to District E"
 VLK_wd_line_walk_desc:0 "One trunk line carries almost everything that moves in the Union: east from the Capital Centre through the forests and hills of District C, south across the hills of District D and on to the coast of District E, with a single spur north to the naval base in District A. Engineers walk every section and price its repair. Freight waits on the sidings while they do."
 VLK_wd_line_spur_roads:0 "Roads Beside the Northern Spur"
 VLK_wd_line_spur_roads_desc:0 "District A has a railway spur and a naval base but not a single graded road; its forest villages reach the line on foot, or by sledge in winter. Grading roads from the spur into the forest gives the district a way to move goods that does not depend on one train a day. Crews can work only between the snows, and the budget outlasts every season."
 VLK_wd_line_district_d_roads:0 "Roads Off the Line in District D"
 VLK_wd_line_district_d_roads_desc:0 "The trunk crosses District D on a single hill province and leaves the rest of the district without a graded road, including the mountain and the southern shore. Four of the Union's five land frontiers touch this district. Grading roads from the line toward the coast and the mountain is slow work in mud that never fully dries, and the graders sink as often as they move."
 VLK_wd_line_ploughs:0 "Plough Wagons for the North"
 VLK_wd_line_ploughs_desc:0 "North of the capital the winter is long: snow and blizzards from November to February and frost well into spring, burying the spur and the first section of the trunk for days at a time. Plough wagons, snow fences and a standing crew at the Capital Centre keep the line open through the worst weeks. They stand idle for eight months a year, which the treasury notices."
 VLK_wd_line_drains:0 "Drains Under the Southern Ballast"
 VLK_wd_line_drains_desc:0 "South of District C the climate turns: heavy rain from January to May, baked summers and mud in every month. Water pools under the ballast and the track sinks out of true. Culverts, ditches and crushed stone along the southern section keep trains running at speed. The work is filthy and never finished, because the mud returns with every spring."
 VLK_wd_line_capital_yard:0 "A Second Track at the Capital Yard"
 VLK_wd_line_capital_yard_desc:0 "Both lines start at the Capital Centre, so every delay anywhere in the Union ends up in one crowded yard. A second through track, longer sidings and a proper goods shed let trains pass instead of queueing. The works take land from the yard's edge and close two streets for a year. The supply office calls the yard the narrowest point in the country, and it is right."
 VLK_wd_line_district_c_sidings:0 "Sidings at the District C Works"
 VLK_wd_line_district_c_sidings_desc:0 "District C holds a works and an arms hall on the trunk, yet all its loading happens at a single siding shared with passenger trains. Separate sidings and a loading ramp let the works ship plate and lorries without blocking the line. The district gains faster freight, and the arms hall gains a place to load its output away from the passenger platform and its onlookers."
 VLK_wd_line_end_e:0 "Where the Line Ends in District E"
 VLK_wd_line_end_e_desc:0 "The trunk ends in the hills of District E, the only district with no land frontier at all. Its works and arms hall, its forests and its southern coast all depend on the last stretch of line. Extending sidings and graded roads from the railhead to the shore turns a terminus into a working district. Without them, District E stays the place where the Union simply stops."
 VLK_wd_line_steel_timetable:0 "A Timetable Built for Steel"
 VLK_wd_line_steel_timetable_desc:0 "With the track repaired, the Union must decide what its timetable is for. The first answer gives freight the night paths: steel from three districts runs to the northern quay and toward the frontier on fixed slots, and the works plan around the trains. Passengers and the service take whatever paths are left, and in a crisis the service would have to wait its turn."
 VLK_wd_line_service_timetable:0 "A Timetable Kept for the Service"
 VLK_wd_line_service_timetable_desc:0 "The second answer reserves standing paths for the two formations: a sealed timetable that can move both from the Capital Centre to any district within a day. Freight runs around those paths, and the works lose a few slots every week to reserved trains that often run empty. A country with no air arm and few roads would gain a way to put its whole army wherever the rails go."
 VLK_wd_line_telephones:0 "Telephones in Every Signal Box"
 VLK_wd_line_telephones_desc:0 "The trunk still runs on timetable and written orders, so a fallen tree in District C can stop trains in District E for hours before anyone knows why. A telephone wire beside the track, with a set in every signal box and halt, lets controllers at the Capital Centre follow the whole line at once. Copper thieves will test it, and controllers will finally know where their trains are."
 VLK_wd_steel_count:0 "Ore, Wells and What Is Missing"
 VLK_wd_steel_count_desc:0 "The ministry of works lists what the Union digs and pumps. Iron ore for steel lies in the Capital District, District C and District E, with modest oil and rubber in the same three. Of aluminium, chromium and tungsten there is none at all. The list is short and honest, and it tells the works that every hard alloy and light metal must be bought abroad or done without."
 VLK_wd_steel_capital_wells:0 "Pumps for the Capital Oil Wells"
 VLK_wd_steel_capital_wells_desc:0 "The Capital District holds the largest of the Union's small oil deposits, worked by old pumps that lose almost as much as they lift. New pumps, a gathering line to the yard and a storage tank add little volume but make it steady. The two formations, the trains and the works all burn the same fuel, and every barrel not imported is a barrel the treasury keeps."
 VLK_wd_steel_arms_halls:0 "The Three Arms Halls"
 VLK_wd_steel_arms_halls_desc:0 "The Union has three arms halls, one each in the Capital District, District C and District E, building rifles, lorries and rolling stock for a service of eight battalions. They run below capacity and compete for the same tool steel. Giving each hall one product line and a shared tool store ends the competition. The halls lose some independence and gain longer, cheaper runs."
 VLK_wd_steel_household:0 "Household Steel for Five Districts"
 VLK_wd_steel_household_desc:0 "Most Valkan homes still cook, heat and pump water with whatever the local smith can make. A works at the capital turning surplus plate into stoves, pipe, water tanks and roofing for every district sells cheaply and quickly. The arms halls lose some steel to it. Families in the frozen north and the wet south notice the difference long before any minister mentions it."
 VLK_wd_steel_plate_exports:0 "Plate for Foreign Yards"
 VLK_wd_steel_plate_exports_desc:0 "The export school argues that Valkan steel is worth most as plate and bar sold abroad, through the northern quay and across the coastal plain, for hard currency to buy the alloys the Union lacks. Prices are set by strangers and fall in bad years. The works would grow around the port, and the inland districts would supply ore and little else."
 VLK_wd_steel_home_finishing:0 "Finish Every Bar at Home"
 VLK_wd_steel_home_finishing_desc:0 "The second school wants every bar of Valkan steel finished inside the Union: pipe, rails, roofing, tools and lorry frames for the districts' own needs. New works would go to District D, which has none, close to the southern frontiers and their markets. Output stays at home and prices stay steady. Without imported alloys, the tools will be softer and wear out sooner."
 VLK_wd_steel_alloy_barter:0 "Ore for Alloys by Barter"
 VLK_wd_steel_alloy_barter_desc:0 "A third school proposes trading ore and pig iron directly for chromium, tungsten and light metals under long barter contracts, with no cash changing hands. It promises the alloys that would let the works make better tools and engines. Barter partners know exactly how badly the Union needs them, however, and contracts written from weakness are rarely generous."
 VLK_wd_steel_north_mill:0 "A Rolling Mill at the Naval Base"
 VLK_wd_steel_north_mill_desc:0 "Export plate needs a rolling mill close to the ships. District A, with the naval base and the spur, has room for one on cleared forest ground beside the quay. The mill brings wages to a district that has never had a works. It also ties the northern economy to foreign buyers, whose orders arrive by telegram and can vanish the same way."
 VLK_wd_steel_district_d_works:0 "Machine Works for District D"
 VLK_wd_steel_district_d_works_desc:0 "District D has four frontiers, one mountain and no industry. Two finishing works beside the trunk, making rails, pipe and tools for the districts, give it wages and a reason for every train to stop there. Building in permanent mud is expensive, and the works will need roads and drains before they need orders. Once running, they serve the north and south alike."
 VLK_wd_steel_alloy_school:0 "A Metallurgy School at the Capital"
 VLK_wd_steel_alloy_school_desc:0 "Bartered alloys are wasted if nobody knows how to use them. A metallurgy school beside the capital works trains furnace crews and engineers in alloy steels, heat treatment and testing, with a laboratory that assays every barter shipment. It costs salaries for scarce teachers. It also catches the first short-weighted cargo before the works pays for it."
 VLK_wd_steel_district_e_hall:0 "A Second Hall in District E"
 VLK_wd_steel_district_e_hall_desc:0 "District E sits at the end of the trunk with one works, one arms hall and the shortest route to the southern sea. A second arms hall beside the first, sharing its tool store and siding, raises output of rifles and lorries without building in a new district. It also concentrates production at the far end of the only line, where one washed-out culvert can cut it off."
 VLK_wd_steel_ingot_reserve:0 "An Ingot Reserve at the Yard"
 VLK_wd_steel_ingot_reserve_desc:0 "Whichever school prevailed, the works keep a reserve of finished ingots and bar in a fenced yard at the Capital Centre, enough to keep the arms halls working for a season if ore or alloys stop. The stock earns nothing while it sits. The service likes it, the treasury dislikes it, and the works managers quietly borrow from it whenever the trains run late."
 VLK_wd_guard_muster:0 "Both Formations at the Capital Centre"
 VLK_wd_guard_muster_desc:0 "The Union's whole army is two infantry formations of four battalions each, quartered at the Capital Centre, with no engineers, no guns and no support companies. It was shaped for civil defence: floods, fires, snow and public order. A full inspection tells the Administration what it actually has, and the answer will disappoint anyone who imagined a frontier force."
 VLK_wd_guard_flood_companies:0 "Flood Companies for the South"
 VLK_wd_guard_flood_companies_desc:0 "From January to May the southern districts take heavy rain, and the mud that follows never quite dries. Training two companies in each formation for flood work, with boats, pumps and sandbag stores at the District D and District E halts, puts the service where the danger comes every year. Soldiers learn the ground. The capital loses a few companies every spring."
 VLK_wd_guard_blizzard_drill:0 "Blizzard Drills in the North"
 VLK_wd_guard_blizzard_drill_desc:0 "Winter in the north brings blizzards from November to February, and a battalion caught on the spur road in a storm becomes a rescue job for somebody else. Drills in deep snow, tents rated for the cold and skis issued to each company teach the service to move and survive in it. The kit costs money and the drills cost frostbite. Both formations come back hardened."
 VLK_wd_guard_district_companies:0 "Companies Quartered by District"
 VLK_wd_guard_district_companies_desc:0 "The first doctrine spreads the battalions across the country, with a company quartered near each district office and each southern frontier. Help reaches a flood or a fire in hours rather than a day, and every district sees its own soldiers. The formations lose their cohesion as fighting units, and no commander could gather all eight battalions quickly for anything larger."
 VLK_wd_guard_rail_reserve:0 "A Reserve That Rides the Trunk"
 VLK_wd_guard_rail_reserve_desc:0 "The second doctrine keeps both formations together at the Capital Centre and trusts the trunk line to carry them wherever they are needed. They train as complete formations and keep their officers in one mess. Every district now depends on the trains running, and the furthest district of all, at the end of the line, waits longest for help."
 VLK_wd_guard_mountain_course:0 "Climbing Courses on the Mountain"
 VLK_wd_guard_mountain_course_desc:0 "The service has long taught a few soldiers to climb, and the Union has exactly one mountain, in District D, above four frontiers. A climbing course there, with instructors, a hut and a summer camp, gives each battalion a handful of soldiers who can work on rock and in snow. They are useful in rescues and on the high frontier. The course runs only in the dry months."
 VLK_wd_guard_pioneers:0 "Engineers Trained from Nothing"
 VLK_wd_guard_pioneers_desc:0 "Not one battalion has an engineer company, yet every flood, landslide and fallen bridge the service meets is engineering work. A school at the Capital Centre trains a pioneer platoon for each battalion in bridging, demolition and pumping, using whatever the works can supply. Skilled sappers take years. Until they exist, the service fights floods with shovels and goodwill."
 VLK_wd_guard_volunteer_lists:0 "Volunteer Lists by District"
 VLK_wd_guard_volunteer_lists_desc:0 "The service takes volunteers only, and in a real crisis it would need far more than eight battalions. Lists of former soldiers and willing civilians, kept by each district office with an address and a trade, would let it double its strength in weeks instead of months. Clerks must renew them every year. Nationalists call the lists too timid, and the non-aligned camp calls them quite enough."
 VLK_wd_guard_lorries:0 "A Lorry Company per Formation"
 VLK_wd_guard_lorries_desc:0 "The arms halls have built more lorries than the service can crew. Assigning a lorry company to each formation, with fitters and a fuel allowance, lets battalions reach beyond the railheads on roads the trains never touch. Fuel is scarce and partly imported, and every kilometre driven on exercise is paid for by the treasury, which counts each one."
 VLK_wd_guard_rescue_flight:0 "A Rescue Flight Before Fighters"
 VLK_wd_guard_rescue_flight_desc:0 "The Union has no airfield and no aircraft, although its engineers studied early fighter designs years ago. The first answer builds a small field at the capital for a rescue and liaison flight: light aircraft carrying doctors, mail and spotters to floods, fires and blizzards. It is a modest beginning. It defends nothing, and it will be busy in every month of the year."
 VLK_wd_guard_fighter_flight:0 "A Flight of Early Fighters"
 VLK_wd_guard_fighter_flight_desc:0 "The second answer builds a proper field at the capital and a pilot school for a small flight of early fighters, on designs the engineers already understand. It gives the Union a way to challenge an intruder over its own sky. The cost is high for so small a country, and the aircraft will mostly sit on the ground waiting for a threat that may never arrive."
 VLK_wd_guard_tented_hospitals:0 "Tented Hospitals for Emergencies"
 VLK_wd_guard_tented_hospitals_desc:0 "Floods, fires and blizzards injure civilians far more often than war has ever injured Valkan soldiers. Two tented field hospitals, stored at the capital with surgeons and nurses on a call list, can be on a train within hours and open in any district a day later. They cost money every year to stock and staff. The first time they are used, nobody will ask why."
 VLK_wd_coast_sixty:0 "Sixty Freighters Under One Flag"
 VLK_wd_coast_sixty_desc:0 "The Union has three shores and a single naval base, at the forest port of District A in the north. It has no warships at all, but sixty convoys of freighters sail under its flag, carrying ore, steel and timber out and fuel and machinery home. A register of their masters, cargoes and routes is the first step toward any maritime policy, and shipowners resent the questions."
 VLK_wd_coast_quay:0 "A Longer Quay in District A"
 VLK_wd_coast_quay_desc:0 "The naval base in District A is a single quay in a forest inlet, and the spur line ends a few hundred metres short of it. Lengthening the quay and laying rails to its edge lets steel trains unload straight into ships. Forest is cleared for the yard. Winter storms still close the inlet for days, and the harbour master asks for a tug before any more berths are promised."
 VLK_wd_coast_capital_lighters:0 "Lighters Along the Capital Shore"
 VLK_wd_coast_capital_lighters_desc:0 "The Capital District faces the western sea along a forested shore but has no harbour of its own, so ships calling there anchor offshore and unload into small boats. Most of the capital's freight goes north by the spur or by road across the frontier toward an Aquitorian port. A fleet of lighters and a landing stage make the shortest route cheaper."
 VLK_wd_coast_south_landings:0 "Landing Stages on the Southern Bay"
 VLK_wd_coast_south_landings_desc:0 "The southern coasts of District D and District E open onto the bay that Valka shares with Monstrua and Aquitoria, and onto the sea further east. Fishing boats work from beaches there, hauled up by hand. Concrete landing stages, an ice house and a road to the nearest halt give the southern villages a steady trade. The bay is also where any foreign patrol would be seen first."
 VLK_wd_coast_cutters:0 "Cutters for a Coast Watch"
 VLK_wd_coast_cutters_desc:0 "The first answer gives the Union a small coast watch: armed cutters crewed by volunteers from the service, patrolling the three shores for smugglers, wrecks and poachers. It is the nearest thing to a navy the country can afford. Cutters cost fuel, crews and a repair shop. They would not stop a warship, and nobody pretends they are meant to."
 VLK_wd_coast_freighters:0 "Freighters Before Cutters"
 VLK_wd_coast_freighters_desc:0 "The second answer spends the maritime budget on the merchant fleet instead: credit for new freighters and training for merchant officers. Ore and steel reach buyers faster and fuel comes home cheaper. The three shores remain watched only by fishermen and lighthouse keepers, which the service considers a risk and the shipowners consider a saving."
 VLK_wd_coast_slipway:0 "A Slipway Beside the Quay"
 VLK_wd_coast_slipway_desc:0 "Every Valkan hull is repaired abroad, because the Union has no dockyard anywhere. A slipway beside the District A quay, with a crane and a plate shop fed by the spur, can repair freighters and build small craft. Skilled shipwrights must be hired from foreign yards at first. The slipway gives the northern port a second trade besides loading steel."
 VLK_wd_coast_storm_radio:0 "Storm Warnings by Radio"
 VLK_wd_coast_storm_radio_desc:0 "Three shores face three different seas, and the weather that wrecks a fishing fleet in the south rarely matches what is falling on the north. A coastal radio station at the capital, broadcasting storm warnings twice a day from observers at every landing, gives masters time to run for shelter. The observers must be paid all year. The fishing villages are listening within a week."
 VLK_wd_coast_headlands:0 "Lights on the Southern Headlands"
 VLK_wd_coast_headlands_desc:0 "The southern coast of District E is hills and forest falling straight into the sea, and its headlands are unlit. Wrecks there are a seasonal certainty. Three lights with resident keepers, supplied by the new landing roads, make the coast navigable at night and give fishermen a fixed mark. Keepers are hard to find for such lonely posts; the lights burn regardless."
 VLK_wd_hinge_map:0 "Five Neighbours, One Survey"
 VLK_wd_hinge_map_desc:0 "The frontier office maps every land frontier the Union has: Malynea along the northern forest, Seterano across the eastern mountain, Slavia over the eastern hills, and Monstrua and Aquitoria to the south-west across plain and hill. Four of the five touch District D. Only District E has no frontier at all. The survey records crossings on the Valkan side and claims nothing beyond it."
 VLK_wd_hinge_plains_post:0 "Our Post at the Plains Crossing"
 VLK_wd_hinge_plains_post_desc:0 "The frontier with Monstrua touches District D at one coastal hill province, facing a crossing onto the plain beyond. Carts and small lorries use it daily. A staffed customs post, a weighbridge and a graded road from the post to the trunk make that trade lawful and visible on the Valkan side. Whatever stands at the far end of the crossing is Monstrua's own business."
 VLK_wd_hinge_lorry_park:0 "Lorry Parks at the Aquitorian Line"
 VLK_wd_hinge_lorry_park_desc:0 "Valkan lorries already cross the coastal plain into Aquitoria to reach a port there, and they queue at the Valkan post for hours. A lorry park, a single inspection shed and longer opening hours on the Valkan side halve the wait. Ministers cannot know what Aquitoria will do at its own post, and do not ask; the Valkan half of the queue is theirs to fix."
 VLK_wd_hinge_hill_wardens:0 "Shepherds on the Eastern Hills"
 VLK_wd_hinge_hill_wardens_desc:0 "The hills between District D and Slavia are crossed by shepherds, labourers and the occasional smuggler on tracks no map shows. Rather than close them, the Union posts two wardens who walk the tracks, count flocks and help anyone caught out in the winter rain. The wardens come to know the ground better than any patrol could. The Slavian side of the hills is Slavia's affair."
 VLK_wd_hinge_firebreaks:0 "Firebreaks Along the Malynean Forest"
 VLK_wd_hinge_firebreaks_desc:0 "The northern forest of District A and District C continues across the frontier into Malynea without a break, and in a dry spell a fire on either side threatens both. Firebreaks cut on the Valkan side, with water tanks and a watch roster for the risky weeks, give fire crews a line to hold. Cutting them costs timber the works would have sold, and the gain is invisible when it works."
 VLK_wd_hinge_transit_toll:0 "A Toll on Foreign Freight"
 VLK_wd_hinge_transit_toll_desc:0 "The first posture treats the Union's position between five neighbours as an asset. Foreign freight crossing Valka by road or on the trunk pays a transit toll at the frontier posts, collected in hard currency. The treasury gains a steady income. Each neighbour gains a reason to route around the Union where it can, and traders on every side learn to resent the toll booth."
 VLK_wd_hinge_transit_cost:0 "Transit at Cost for Every Neighbour"
 VLK_wd_hinge_transit_cost_desc:0 "The second posture charges foreign freight only what its handling costs, at every post and on every train, and publishes the same tariff for all five neighbours. The treasury gains little directly. Traders route through the Union because it is cheap and predictable, and the frontier districts fill with depots, inns and repair shops. A neighbour may object to the goods its rival moves."
 VLK_wd_hinge_trunk_reserved:0 "The Trunk for Valkan Freight Only"
 VLK_wd_hinge_trunk_reserved_desc:0 "The third posture keeps the trunk and the frontier roads for Valkan goods and travellers, with foreign freight allowed only by permit. It protects the line's capacity for the service and the works, and keeps the Union clear of other countries' quarrels over what moves where. Frontier districts lose trade they had. Neighbours conclude that the Union prefers its doors narrow."
 VLK_wd_hinge_toll_receipts:0 "Toll Receipts for the Frontier Districts"
 VLK_wd_hinge_toll_receipts_desc:0 "Tolls collected at the posts in District D and the Capital District flow to the treasury in the capital, and the frontier districts complain that they bear the queues while others spend the money. Paying half of every toll back to the district where it was collected answers them. The treasury loses half its new income and gains two districts that defend the toll."
 VLK_wd_hinge_depot_towns:0 "Depot Towns at the Crossings"
 VLK_wd_hinge_depot_towns_desc:0 "Cheap transit draws freight, and freight needs warehouses, fuel, inns and fitters. The Union grades land beside the busiest posts in District D for depots and leases it on easy terms. Small towns grow where there were only customs huts. They bring wages to the hills, and also the smuggling, quarrels and late nights that come with every road junction."
 VLK_wd_hinge_permit_office:0 "A Permit Office at the Capital"
 VLK_wd_hinge_permit_office_desc:0 "Permits for foreign freight need one office that issues them, records every load and checks it at the frontier on the way out. The office sits beside the capital yard and answers to the service as well as the treasury. Traders wait days for a stamp. The Union knows exactly what crosses it, which is the point and also the complaint."
 VLK_wd_hinge_mountain_watch:0 "A Watch Post on the Mountain"
 VLK_wd_hinge_mountain_watch_desc:0 "The single mountain in District D overlooks four frontiers at once. A small watch post on its shoulder, with a telescope, a radio and a hut for two observers, sees weather coming over the hills and traffic on every approach. It costs little but a lonely rota. The post changes nothing on any frontier; it simply means the Union learns things a day earlier."
 VLK_wd_hinge_letter_desk:0 "A Desk That Answers Neighbours"
 VLK_wd_hinge_letter_desk_desc:0 "Neighbouring governments write now and then about floods, fires, stray herds or a lorry held at a post, and their letters sit for weeks in the wrong ministry. One desk at the capital, with a clerk assigned to each neighbour and a promise to answer within ten days, ends that. The Union offers nothing new by it. It simply stops being the neighbour that never replies."
 VLK_wd_sky_notice:0 "The December Warning"
 VLK_wd_sky_notice_desc:0 "The astronomers' warning of December 1994 says that the asteroid Ulysses will come close to the planet and might hit it, and says nothing about where. Within the week the Administration forms an impact office of engineers, doctors and officers of the service and gives it one question to answer: where in the Union could people survive a strike nearby."
 VLK_wd_sky_ground_survey:0 "Which Ground Will Hold"
 VLK_wd_sky_ground_survey_desc:0 "Engineers test the ground in every district for shelter digging. The north is frozen for months and its forest soil lies thin over rock. The south is wet, with mud in every month and water close beneath. The mountain in District D is solid stone with a road only to its foot. Each answer carries a different bill, and every district argues for its own."
 VLK_wd_sky_galleries:0 "Galleries in the District D Rock"
 VLK_wd_sky_galleries_desc:0 "The first plan drives shelter galleries into the mountain of District D, where solid rock would stand above any blast. Each gallery would hold thousands with stores for weeks. They lie far from the capital and the north, so the plan depends on trains reaching them in time. Building in the mountain takes years and every rail wagon the works can spare."
 VLK_wd_sky_hall_cellars:0 "Strong Cellars Under Public Halls"
 VLK_wd_sky_hall_cellars_desc:0 "The second plan deepens and props the cellars of schools, district offices and works canteens in every town, so people shelter close to home. It is cheaper per head and needs no warning by train. In the north the digging stops when the ground freezes; in the south the pumps never stop. The cellars would not survive a direct strike, and nobody pretends otherwise."
 VLK_wd_sky_evacuation:0 "Evacuation Trains on the Trunk"
 VLK_wd_sky_evacuation_desc:0 "The third plan relies on warning and distance: sealed timetables that empty any threatened district by rail toward the others, using every carriage and goods wagon in the Union. It costs the least in concrete and the most in organisation. It also assumes somebody will know where fragments are falling in time to choose a direction. The railwaymen ask who will warn them."
 VLK_wd_sky_impact_declared:0 "Priority for the Shelter Works"
 VLK_wd_sky_impact_declared_desc:0 "The FCU's statement of April 1996 removes any doubt that Ulysses will hit the planet, though not where. For the impact office, drawing gives way to digging. The works take priority orders for steel props and pumps, every district office posts its shelter list and the trains carry cement before coal. Tinned food and lamp oil double in price within a week, and the shops ration both."
 VLK_wd_sky_depots:0 "A Dark Year in the Depots"
 VLK_wd_sky_depots_desc:0 "If dust from the impact dims the sky for a season, harvests could fail far from any crater. Each district depot stores seed, fuel and medicine for a year, rotated so that nothing spoils. The stores cost warehouse space and constant accounting. Families resent seeing grain locked away while prices rise, and every depot needs guards around the clock."
 VLK_wd_sky_sirens:0 "Sirens on Every District Office"
 VLK_wd_sky_sirens_desc:0 "Warning is worth nothing if it cannot reach people. Sirens on every district office and works roof, wired to the capital and tested on the first Sunday of each month, give the Union a single alarm. The tests annoy everybody. The service, the railway and the shelters all need the same few minutes of notice, and the sirens are how they will get it."
 VLK_wd_sky_roche_night:0 "Shelters Open on the Roche Night"
 VLK_wd_sky_roche_night_desc:0 "When Ulysses crosses the Roche limit in July 1999 and starts to come apart, the Union is as ready as years of digging allowed. The shelters open, the trains stand on their sealed timetables and the service waits at the capital with the field hospitals packed. What the night brings to Valkan ground is not known to anyone who plans for it, and the plan must hold either way."
 VLK_wd_sky_relief_trains:0 "Relief Trains for Wherever It Fell"
 VLK_wd_sky_relief_trains_desc:0 "Whatever fell, somebody nearby will need help, whether in a Valkan district or across a frontier. The impact office keeps two relief trains made up at the capital, with tents, medicine, pumps and engineers, ready to run to the end of any line. Offering them abroad is a separate decision for a later day. At home, they mean no district waits for a committee."
 VLK_wd_wars_premiums:0 "Insurance in a Distant War"
 VLK_wd_wars_premiums_desc:0 "In March 1995 war breaks out around Belka, far from Valkan waters, and insurers raise premiums on every hull at sea. Valkan freighters carry ore and steel on lanes that touch no front and pay the higher rates all the same. The steel price abroad will now move for reasons nobody in the Union controls, and the government must decide who carries the cost."
 VLK_wd_wars_hull_pool:0 "A State Pool for Hull Insurance"
 VLK_wd_wars_hull_pool_desc:0 "The first answer creates a state pool that carries part of the war risk on Valkan freighters at a fixed premium, backed by the treasury. Owners keep sailing and buyers keep their delivery dates. The pool will pay out if a Valkan hull is lost anywhere near the fighting. Ministers are betting that none will be, and the opposition camp says so in print."
 VLK_wd_wars_owners_risk:0 "Owners Carry Their Own Risk"
 VLK_wd_wars_owners_risk_desc:0 "The second answer leaves the war risk where the insurers put it. Shipowners raise their freight rates, foreign buyers pay more for Valkan plate and some cargoes simply wait in port. The treasury keeps its money for the line and the shelters. Owners in District A call the decision a betrayal and quietly reflag two freighters elsewhere."
 VLK_wd_wars_peace_buyers:0 "Steel Only for Buyers at Peace"
 VLK_wd_wars_peace_buyers_desc:0 "Foreign buyers ask whether the Union will sell plate and bar to parties at war. The first answer is no: Valkan steel goes only to buyers at peace, checked by the export office before every contract. Orders fall, and the works notice. The Union keeps a reputation that both of its political camps can defend, for once, in the same words."
 VLK_wd_wars_any_buyer:0 "Orders from Any Buyer Who Pays"
 VLK_wd_wars_any_buyer_desc:0 "The second answer fills any order that is paid for in advance, whoever places it, and leaves the use of the steel to the buyer. The works run full shifts and the treasury collects export duty. The Union becomes a supplier to other countries' wars at one remove, and some of its own citizens will find that harder to live with than the money."
 VLK_wd_wars_treaty:0 "After the Treaty in Lumen"
 VLK_wd_wars_treaty_desc:0 "The Belkan War ends with the treaty at Lumen in June 1995. Premiums come down slowly, over a year rather than a week, and buyers who held back return with their orders. The ministry uses the lull to renegotiate long contracts for fuel and alloys while sellers are eager. Nobody in the Union expects the peace to make every price fall at once."
 VLK_wd_wars_fuel_tanks:0 "Fuel Tanks Full by November"
 VLK_wd_wars_fuel_tanks_desc:0 "The war taught the ministry that fuel prices can double in a week. Tanks at the capital yard and the northern quay, filled in the cheap months and kept full before the northern winter, give the trunk line, the works and the service a reserve. The tanks tie up money and need guards. They also mean a distant war no longer stops a Valkan train."
 VLK_wd_wars_usean_rates:0 "Surcharges from the Usean War"
 VLK_wd_wars_usean_rates_desc:0 "In August 2003 the FCU establishes the ISAF and war spreads across Usea, on another continent entirely. Shipping is rerouted, insurers raise their rates again and some buyers of Valkan plate ask for faster delivery at higher prices. The Union has been here before. Its tanks are full and its export rules are written, and the works can plan around the disruption."
 VLK_wd_wars_rebuilding:0 "Rails for the Rebuilding"
 VLK_wd_wars_rebuilding_desc:0 "With the Continental War over and the ISAF's victory recorded, reconstruction on Usea will need steel, rails and pipe in quantity. The ministry offers Valkan products through ordinary tenders, at ordinary prices, and sends its catalogue to every buyer that asks. Orders arrive slowly. The works welcome steady customers who are building rather than fighting."
 VLK_wd_cent_audit:0 "An Audit of the Decade"
 VLK_wd_cent_audit_desc:0 "At the turn of the century the government commissions an audit of what ten years have built: the line, the works, the shelters, the frontier posts and the northern quay. Auditors drawn from both camps, with a judge in the chair, read every ledger. Their report will be quoted for years. Paying for that honesty costs a season of political quiet."
 VLK_wd_cent_list_term:0 "The List Goes Back to the Voters"
 VLK_wd_cent_list_term_desc:0 "The national list promised that the next ballot would keep its date, and the date has arrived. The cabinet campaigns on its record and the non-aligned camp on its fears. Whatever the count, the list has shown that it will face the voters it once said it could trust. Its own hardliners think the risk was unnecessary."
 VLK_wd_cent_rule_renewed:0 "Renew the Two-Thirds Rule"
 VLK_wd_cent_rule_renewed_desc:0 "The two-thirds rule was written for one chamber, and the next chamber must decide whether to keep it. Both camps have learned to work inside it, and both have reasons to want it gone. The chamber votes to renew it for another decade by a margin that itself crosses the split. The vote is slow to arrange and widely trusted."
 VLK_wd_cent_director_terms:0 "Five-Year Terms for Directors"
 VLK_wd_cent_director_terms_desc:0 "The directors' council has governed for years without an election, and some of its members have never left it. A rule limiting each director to five years on the council brings in younger managers from the works and the districts. Experience walks out with the old members. The council gains a way to change without a ballot."
 VLK_wd_cent_date_kept:0 "The Printed Date Arrives"
 VLK_wd_cent_date_kept_desc:0 "The National Administration printed a ballot date years ago and both camps have spent the interval organising. The date comes, the halls open and the clerks count. Whoever wins, the Administration has kept its word, which is more than either camp expected. Several of its own ministers are relieved to hand the problem on at last."
 VLK_wd_cent_passing_loops:0 "Passing Loops on the Trunk"
 VLK_wd_cent_passing_loops_desc:0 "Ten years of repairs have made the trunk reliable, and reliability has filled it. Trains now wait at District C for others to clear the single track ahead. Passing loops at the works sidings and the hill halts let two trains meet without stopping. The loops are cheap next to doubling the line, and they buy another decade before anyone has to think about that."
 VLK_wd_cent_colleges:0 "Engineering Places at the Colleges"
 VLK_wd_cent_colleges_desc:0 "The capital colleges train doctors, lawyers and engineers, and the works complain there are never enough of the last. More engineering places, with bursaries for students from every district, would supply the line, the works and the service at once. The colleges need laboratories and teachers. The first graduates take five years to arrive."
 VLK_wd_cent_second_tally:0 "The Tally Taken Again"
 VLK_wd_cent_second_tally_desc:0 "A decade after the first count, the clerks drawn by lot take a second national tally of party sympathy, district by district, and publish it the same day. Nobody can call it the government's number. The result tells the Union whether ten years have healed the split, deepened it or merely moved it. All three camps prepare their statements in advance."
 ac_wd_vlk_tree:0 "Valka: National Programme"
 ac_wd_vlk_tree_desc:0 "The national focus programme of Valka, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 VLK_wd_split_country:0 "The Country at Two Points"
 VLK_wd_split_country_desc:0 "Fifty for the nationalist camp, forty-eight for the non-aligned camp and one for the label the government sits under."
 VLK_wd_nonaligned_hearing:0 "Offices Open to the Directors"
 VLK_wd_nonaligned_hearing_desc:0 "Ministry officials sit in the offices of district directors and works boards, taking notes."
 VLK_wd_nationalist_hearing:0 "Halls Open to the Organisers"
 VLK_wd_nationalist_hearing_desc:0 "Ministry officials attend nationalist meetings in rented halls and answer questions from the floor."
 VLK_wd_ballot_called:0 "Rolls Printed, Halls Open"
 VLK_wd_ballot_called_desc:0 "A national ballot has been called; every list may stand and every district counts its own votes."
 VLK_wd_ballot_drawer:0 "The Ballot Left in the Drawer"
 VLK_wd_ballot_drawer_desc:0 "The vote stays suspended and the government governs against the wishes of the larger half."
 VLK_wd_caretaker_accounts:0 "Competence Instead of Campaigns"
 VLK_wd_caretaker_accounts_desc:0 "The National Administration publishes its accounts every quarter in place of a mandate."
 VLK_wd_list_pledge:0 "The Pledge of the National List"
 VLK_wd_list_pledge_desc:0 "Frontiers where they are, a defensive service, judges left alone and the next ballot on its date."
 VLK_wd_both_camps_cabinet:0 "Ministers of Both Halves"
 VLK_wd_both_camps_cabinet_desc:0 "A cabinet that needs two thirds of the chamber, so it is built across the split."
 VLK_wd_posted_resolutions:0 "Resolutions on Every Office Door"
 VLK_wd_posted_resolutions_desc:0 "The directors post each week what they decided, how they voted and why."
 VLK_wd_ballot_date_set:0 "A Ballot Date in Print"
 VLK_wd_ballot_date_set_desc:0 "The National Administration has printed the day of the next national ballot and means to keep it."
 VLK_wd_lot_clerks:0 "Clerks Chosen by Lot"
 VLK_wd_lot_clerks_desc:0 "Every count is run by clerks drawn by lot from both camps and paid by the courts."
 VLK_wd_track_book:0 "The Book of the Trunk Line"
 VLK_wd_track_book_desc:0 "Every section of the trunk and the spur measured, priced and listed for repair."
 VLK_wd_plough_wagons:0 "Plough Wagons at the Yard"
 VLK_wd_plough_wagons_desc:0 "Snow fences, plough wagons and a standing crew keep the northern line open through the blizzards."
 VLK_wd_dry_ballast:0 "Stone and Ditches Under the Track"
 VLK_wd_dry_ballast_desc:0 "Culverts and crushed stone keep the southern track firm through the wet months."
 VLK_wd_steel_paths:0 "Night Paths for Steel"
 VLK_wd_steel_paths_desc:0 "The best paths on the timetable belong to steel trains bound for the quay and the frontier."
 VLK_wd_service_paths:0 "Paths Held for the Service"
 VLK_wd_service_paths_desc:0 "A sealed timetable can carry both formations to any district within a day."
 VLK_wd_signal_wires:0 "Wire Along the Whole Trunk"
 VLK_wd_signal_wires_desc:0 "Every signal box and halt is on one telephone line to the controllers at the capital."
 VLK_wd_ore_ledger:0 "Three Empty Columns"
 VLK_wd_ore_ledger_desc:0 "Ore, oil and rubber are listed; aluminium, chromium and tungsten are not, because there are none."
 VLK_wd_steady_wells:0 "Steadier Capital Wells"
 VLK_wd_steady_wells_desc:0 "New pumps and a gathering line steady the small output of the capital oil field."
 VLK_wd_one_line_per_hall:0 "One Line for Each Hall"
 VLK_wd_one_line_per_hall_desc:0 "Each of the three arms halls builds one product on long runs from a shared tool store."
 VLK_wd_plate_exports:0 "Valkan Plate Abroad"
 VLK_wd_plate_exports_desc:0 "Steel plate and bar sold to foreign yards for the currency that buys alloys."
 VLK_wd_home_finishing:0 "Finished in the Union"
 VLK_wd_home_finishing_desc:0 "Every bar finished at home into rails, pipe and tools, with softer edges for want of alloys."
 VLK_wd_alloy_barter:0 "Ore Traded for Alloys"
 VLK_wd_alloy_barter_desc:0 "Long barter contracts swap ore and pig iron for the hard metals the works lack."
 VLK_wd_alloy_testing:0 "Every Cargo Tested"
 VLK_wd_alloy_testing_desc:0 "A laboratory at the capital assays every barter shipment before the works pays for it."
 VLK_wd_ingot_reserve:0 "A Season of Ingots in Stock"
 VLK_wd_ingot_reserve_desc:0 "Finished ingots and bar enough to keep the arms halls working for a season."
 VLK_wd_eight_battalions:0 "A Service of Eight Battalions"
 VLK_wd_eight_battalions_desc:0 "Two infantry formations at the Capital Centre, drilled for floods, snow, fire and order."
 VLK_wd_flood_companies:0 "Companies for the Floods"
 VLK_wd_flood_companies_desc:0 "Boats, pumps and sandbag stores at the southern halts, with companies trained to use them."
 VLK_wd_cold_drilled:0 "Drilled for the Cold"
 VLK_wd_cold_drilled_desc:0 "Both formations have wintered on the northern roads and come back able to live in a blizzard."
 VLK_wd_district_companies:0 "Soldiers in Every District"
 VLK_wd_district_companies_desc:0 "A company quartered near each district office and each southern frontier."
 VLK_wd_rail_reserve:0 "The Reserve on Rails"
 VLK_wd_rail_reserve_desc:0 "Both formations kept together at the capital and moved by the trunk line wherever they are needed."
 VLK_wd_climbing_course:0 "The Mountain Course"
 VLK_wd_climbing_course_desc:0 "A summer course on the District D mountain gives every battalion a few soldiers who can climb."
 VLK_wd_pioneer_platoons:0 "Pioneer Platoons"
 VLK_wd_pioneer_platoons_desc:0 "A platoon in each battalion trained in bridging, demolition and pumping."
 VLK_wd_district_volunteer_lists:0 "Lists Kept by District Offices"
 VLK_wd_district_volunteer_lists_desc:0 "Former soldiers and willing civilians listed by trade and address in every district."
 VLK_wd_lorry_companies:0 "A Lorry Company for Each Formation"
 VLK_wd_lorry_companies_desc:0 "Crewed lorries, fitters and a fuel allowance take the battalions beyond the railheads."
 VLK_wd_rescue_flight:0 "The Rescue and Liaison Flight"
 VLK_wd_rescue_flight_desc:0 "Light aircraft at the capital field carry doctors, mail and spotters to every district."
 VLK_wd_fighter_flight:0 "The Early Fighter Flight"
 VLK_wd_fighter_flight_desc:0 "A capital field and a pilot school for a small flight of early fighters."
 VLK_wd_tented_hospitals:0 "Hospitals in Canvas"
 VLK_wd_tented_hospitals_desc:0 "Two tented field hospitals packed at the capital with surgeons on a call list."
 VLK_wd_sixty_convoys:0 "Sixty Convoys and No Warship"
 VLK_wd_sixty_convoys_desc:0 "Every Valkan freighter registered by master, cargo and route; none of them armed."
 VLK_wd_capital_lighters:0 "Lighters on the Capital Shore"
 VLK_wd_capital_lighters_desc:0 "Small lighters and a landing stage unload ships anchored off the harbourless capital coast."
 VLK_wd_south_landings:0 "Landings on the Southern Bay"
 VLK_wd_south_landings_desc:0 "Concrete landing stages, an ice house and a road to the halt for the southern fishing villages."
 VLK_wd_coast_watch:0 "Cutters of the Coast Watch"
 VLK_wd_coast_watch_desc:0 "Armed cutters crewed by volunteers patrol three shores for smugglers, wrecks and poachers."
 VLK_wd_freighter_credit:0 "Credit for Valkan Freighters"
 VLK_wd_freighter_credit_desc:0 "State credit for new hulls and training for merchant officers."
 VLK_wd_storm_warnings:0 "Storm Warnings Twice a Day"
 VLK_wd_storm_warnings_desc:0 "A coastal radio station reads weather from observers on all three shores."
 VLK_wd_headland_lights:0 "Keepers on the Southern Headlands"
 VLK_wd_headland_lights_desc:0 "Three lit headlands on the District E coast, each with a resident keeper."
 VLK_wd_five_frontiers_desk:0 "An Office for Five Frontiers"
 VLK_wd_five_frontiers_desk_desc:0 "One frontier office keeps every crossing, post and track on the Valkan side of five lines."
 VLK_wd_southern_post:0 "The Southern Plain Post"
 VLK_wd_southern_post_desc:0 "A staffed post and weighbridge where carts and lorries cross toward Monstrua."
 VLK_wd_frontier_lorry_park:0 "The Frontier Lorry Park"
 VLK_wd_frontier_lorry_park_desc:0 "A lorry park and one inspection shed at the Valkan end of the coastal plain road."
 VLK_wd_hill_wardens:0 "Wardens on the Eastern Hills"
 VLK_wd_hill_wardens_desc:0 "Two wardens walk the shepherds tracks toward Slavia, counting flocks and finding the lost."
 VLK_wd_northern_firebreaks:0 "Firebreaks in the Northern Forest"
 VLK_wd_northern_firebreaks_desc:0 "Cut breaks, water tanks and a watch roster along the forest frontier with Malynea."
 VLK_wd_transit_toll:0 "A Toll on Through Freight"
 VLK_wd_transit_toll_desc:0 "Foreign freight crossing the Union pays a transit toll in hard currency."
 VLK_wd_transit_at_cost:0 "Transit at Published Cost"
 VLK_wd_transit_at_cost_desc:0 "One tariff for all five neighbours, set at what the handling costs."
 VLK_wd_trunk_reserved:0 "The Trunk Kept for the Union"
 VLK_wd_trunk_reserved_desc:0 "Foreign freight moves on the trunk and the frontier roads only by permit."
 VLK_wd_toll_receipts:0 "Toll Money for the Frontier Districts"
 VLK_wd_toll_receipts_desc:0 "Half of every toll goes back to the districts where the posts stand."
 VLK_wd_depot_towns:0 "Depots at the Crossings"
 VLK_wd_depot_towns_desc:0 "Warehouses, inns and repair shops grow up beside the busiest frontier posts."
 VLK_wd_permit_office:0 "The Freight Permit Office"
 VLK_wd_permit_office_desc:0 "One office at the capital issues every permit for foreign freight and checks it on arrival."
 VLK_wd_mountain_watch:0 "Observers on the Mountain"
 VLK_wd_mountain_watch_desc:0 "Two observers and a radio on the shoulder of the District D mountain."
 VLK_wd_neighbour_desk:0 "Replies Within Ten Days"
 VLK_wd_neighbour_desk_desc:0 "Every letter from a neighbouring government is answered by one desk inside ten days."
 VLK_wd_impact_office:0 "The Impact Office"
 VLK_wd_impact_office_desc:0 "Engineers, doctors, railwaymen and officers planning for a strike nobody can yet place."
 VLK_wd_rock_galleries:0 "Galleries in the Mountain"
 VLK_wd_rock_galleries_desc:0 "Shelter galleries driven into the solid rock of the District D mountain."
 VLK_wd_hall_cellars:0 "Cellars Under the Public Halls"
 VLK_wd_hall_cellars_desc:0 "Propped and pumped cellars beneath schools, offices and canteens in every town."
 VLK_wd_evacuation_timetable:0 "The Sealed Evacuation Timetable"
 VLK_wd_evacuation_timetable_desc:0 "A timetable that empties any threatened district by rail toward the others."
 VLK_wd_shelter_priority:0 "Shelter Work Before All Else"
 VLK_wd_shelter_priority_desc:0 "Steel props, pumps and cement go to the impact office first."
 VLK_wd_dark_year_depots:0 "A Year in the District Depots"
 VLK_wd_dark_year_depots_desc:0 "Seed, fuel and medicine for a year in every district depot, rotated so nothing spoils."
 VLK_wd_sunday_sirens:0 "Sirens Tested on Sundays"
 VLK_wd_sunday_sirens_desc:0 "One national alarm, wired from the capital to every district office and works roof."
 VLK_wd_roche_watch:0 "The Watch After the Roche Night"
 VLK_wd_roche_watch_desc:0 "Shelters manned and trains held ready while the fragments of Ulysses come down."
 VLK_wd_relief_trains:0 "Two Relief Trains Made Up"
 VLK_wd_relief_trains_desc:0 "Tents, medicine, pumps and engineers on two trains kept ready at the capital."
 VLK_wd_war_premiums:0 "Premiums for a Distant War"
 VLK_wd_war_premiums_desc:0 "Insurers charge war rates on every Valkan hull, whatever its route."
 VLK_wd_hull_pool:0 "The State Hull Pool"
 VLK_wd_hull_pool_desc:0 "A state pool carries part of the war risk on Valkan freighters."
 VLK_wd_owners_risk:0 "Owners Carry the Risk"
 VLK_wd_owners_risk_desc:0 "Shipowners price the war risk themselves and pass it on to every cargo."
 VLK_wd_peace_buyers:0 "Steel for Buyers at Peace"
 VLK_wd_peace_buyers_desc:0 "No Valkan plate or bar is sold to any party at war."
 VLK_wd_any_buyer:0 "Orders from Every Buyer"
 VLK_wd_any_buyer_desc:0 "Valkan works fill any order that is paid for, whoever places it."
 VLK_wd_treaty_trade:0 "Trade After the Treaty"
 VLK_wd_treaty_trade_desc:0 "Premiums ease and foreign buyers return once the Belkan War is over."
 VLK_wd_winter_fuel_stock:0 "Winter Fuel in the Tanks"
 VLK_wd_winter_fuel_stock_desc:0 "Fuel bought in the cheap months and stored before the northern winter closes in."
 VLK_wd_usean_rates:0 "Freight at Usean War Rates"
 VLK_wd_usean_rates_desc:0 "Rerouted shipping and dearer insurance while war is fought on another continent."
 VLK_wd_rebuilding_orders:0 "Rails Sold for Reconstruction"
 VLK_wd_rebuilding_orders_desc:0 "Steel and rails ordered for reconstruction after the Continental War."
 VLK_wd_decade_audit:0 "The Decade Audit"
 VLK_wd_decade_audit_desc:0 "A panel from both camps has counted what ten years built against what was promised."
 VLK_wd_list_second_term:0 "The List Seeks a Second Term"
 VLK_wd_list_second_term_desc:0 "The national list has gone back to the voters on the date it promised."
 VLK_wd_rule_renewed:0 "The Two-Thirds Rule Renewed"
 VLK_wd_rule_renewed_desc:0 "The chamber has voted to keep the rule that forces cabinets across the split."
 VLK_wd_director_rotation:0 "Directors Serve Five Years"
 VLK_wd_director_rotation_desc:0 "No director sits on the council for more than five years at a time."
 VLK_wd_date_kept:0 "The Promised Ballot Held"
 VLK_wd_date_kept_desc:0 "The National Administration held the ballot on the day it printed."
 VLK_wd_college_places:0 "Engineers from the Capital Colleges"
 VLK_wd_college_places_desc:0 "More engineering places at the capital colleges, with bursaries for every district."
 VLK_wd_second_tally:0 "A Second Count Published"
 VLK_wd_second_tally_desc:0 "A second national count of party sympathy, run by the clerks of both camps."
 VLK_wd_spur_cleared:0 "The Spur Ploughed Clear"
 VLK_wd_spur_cleared_desc:0 "Plough wagons have cleared the northern spur and the first section of the trunk after a blizzard."
 VLK_wd_track_drained:0 "Southern Track Drained"
 VLK_wd_track_drained_desc:0 "Drain gangs have cleared the culverts under the southern section."
 VLK_wd_fire_roster:0 "The Firebreak Roster Manned"
 VLK_wd_fire_roster_desc:0 "Crews and water tanks stand at the northern firebreaks through a dry spell."
 VLK_wd_plate_season:0 "A Season of Plate Sold"
 VLK_wd_plate_season_desc:0 "A season of plate auctioned abroad keeps the works busy and the treasury paid."
 ac_wd_vlk.1.t:0 "The Tally in a Sealed Envelope"
 ac_wd_vlk.1.d:0 "The tally reaches the Administration in a sealed envelope from the statistics office at the Capital Centre, and the ministers read it twice to be sure. Out of every hundred Valkans asked, fifty lean toward the nationalist camp and forty-eight toward the non-aligned camp, which wants no party at all in charge. One supports the democratic label under which the government sits, and one the communists.\n\nThe figures surprise nobody who has attended a public meeting in the last year, but seeing them printed changes their weight. The nationalists can now say that they are the larger half. The non-aligned camp can reply that the larger half is larger by two points and no more. The Administration can say nothing about its own support that would not sound like a joke at its own expense.\n\nWhat the ministers decide this morning is not who will govern, but who will know the numbers first. Released to the newspapers, the tally will start an argument across all five districts that the government cannot steer. Kept inside the building, it will leak within the month, and the government will then have to explain why it hid what everyone had already guessed.\n\nProvisional gameplay."
 ac_wd_vlk.1.a:0 "Release the tally to every newspaper."
 ac_wd_vlk.1.b:0 "Keep it inside the Administration."
 ac_wd_vlk.2.t:0 "Two Delegations on One Staircase"
 ac_wd_vlk.2.d:0 "Within weeks of the tally both camps send delegations to the Administration, and by an accident of scheduling they arrive on the same morning. The nationalist delegation brings district organisers, a petition thick with signatures and a demand for a ballot within the year. The non-aligned delegation brings works directors, cooperative chairs and a typed request that nothing be decided in haste.\n\nThe two groups wait on the same staircase outside the cabinet room for most of an hour. Nobody shouts. Several of them know each other from the same towns, the same works and in a few cases the same families. A press photographer catches them standing two steps apart, and by evening the picture is on the front page of every paper in the Union.\n\nMinisters must decide how to receive them. Seeing both together would tell the country that the government stands between the camps rather than with either. Seeing them separately would let each speak freely, and invite each to suspect what was said to the other. Whatever the cabinet chooses, both delegations will describe the meeting to their own supporters before the cabinet secretary has typed the minutes.\n\nProvisional gameplay."
 ac_wd_vlk.2.a:0 "Receive both delegations together."
 ac_wd_vlk.2.b:0 "Hear each delegation alone."
 ac_wd_vlk.3.t:0 "The Engineers Come Back from the Line"
 ac_wd_vlk.3.d:0 "The railway engineers return from the trunk line with notebooks full of measurements and a summary that fits on one page. The northern section, from the Capital Centre through District C, is sound but loses whole days each winter to snow. The southern section, through the hills of District D to the railhead in District E, is sinking in places where water stands under the ballast for most of the year.\n\nThe spur to District A is the worst of all. It was laid quickly through forest, it has no graded road beside it, and its last stretch stops short of the quay, so every load is carried the final distance by hand cart. The engineers also note what everyone at the yard already knows: both lines begin at the same crowded junction at the Capital Centre, and every fault anywhere in the Union ends up there.\n\nThe report prices each repair and leaves the order of work to the ministers. Spending first in the north keeps the capital and the port moving through the winter. Spending first in the south saves the line where it is failing fastest. Either way, the engineers warn, the Union has one railway, and any year spent repairing one end is a year the other end waits.\n\nProvisional gameplay."
 ac_wd_vlk.3.a:0 "Begin with the northern winter."
 ac_wd_vlk_3_a:0 "Begin with the northern winter."
 ac_wd_vlk.3.b:0 "Begin with the southern mud."
 ac_wd_vlk_3_b:0 "Begin with the southern mud."
 ac_wd_vlk.4.t:0 "The Missing Columns"
 ac_wd_vlk.4.d:0 "The ministry of works prints its resource list with a column for each metal and fuel the works use, and three of those columns are empty from top to bottom. The Union has iron ore in three districts, a little oil and rubber in the same three, and no aluminium, chromium or tungsten anywhere. Every hard tool edge, light engine part and alloy spring in the country has come from abroad.\n\nWorks managers have lived with this for years by buying small lots when prices allow and making do when they do not. The arms halls use softer steel than they would like and replace their cutting tools twice as often as foreign plants. The export traders point out that Valkan ore and plate sell well, and that the money could buy alloys if anybody planned for it instead of hoping.\n\nThree answers circulate before the list has even been distributed: sell the steel abroad for currency, finish all of it at home and accept softer tools, or trade ore directly for alloys under barter. Each has advocates in the ministry and in both political camps. First, the ministers must decide whether the works managers see the list now, or only once a policy has been chosen for them.\n\nProvisional gameplay."
 ac_wd_vlk.4.a:0 "Send the list to every works manager."
 ac_wd_vlk_4_a:0 "Send the list to every works manager."
 ac_wd_vlk.4.b:0 "Hold it until a policy is ready."
 ac_wd_vlk.5.t:0 "Eight Battalions on the Square"
 ac_wd_vlk.5.d:0 "The inspection of the service ends with a parade on the square at the Capital Centre, and the parade is short. Two formations of four infantry battalions each march past the reviewing stand with rifles, lorries and field kitchens, and nothing else. There are no guns, no engineers and no aircraft overhead, because the Union owns none of those things and never has.\n\nThe inspectors' report is kinder than the parade suggests. The battalions are well drilled for the work they actually do: filling sandbags in the southern spring, digging out snowbound trains in the northern winter, searching forests for lost walkers and keeping order at the occasional riot. The soldiers are volunteers, most of them from the districts they serve, and their morale is good.\n\nThe difficulty is that the report has two kinds of reader. The nationalist camp reads it as proof that the Union cannot defend itself and asks for a larger service. The non-aligned camp reads it as proof that the service is exactly the right size for a country that intends no wars. The Administration must decide which of those readings it will repeat in public.\n\nProvisional gameplay."
 ac_wd_vlk.5.a:0 "Praise the service for what it does."
 ac_wd_vlk.5.b:0 "Admit what it cannot do."
 ac_wd_vlk.6.t:0 "Freight Without a Fleet"
 ac_wd_vlk.6.d:0 "The new register of hulls is the first complete list the Union has ever kept of the ships that sail under its flag. Sixty convoys of freighters carry ore, plate and timber out and fuel and machine tools home. Not one of them is armed, and the Union owns no warship of any kind. Its single naval base is a quay in a forest inlet in District A, at the end of the northern spur.\n\nThe register shows how the shipping actually moves. Steel from the capital goes north by rail to the quay. Much of the road freight from the Capital District crosses the frontier toward an Aquitorian port, because the capital's own shore has no harbour, only an anchorage and a beach where small boats land. The southern coasts of District D and District E have fishing beaches and nothing that can berth a freighter.\n\nShipowners dislike having their routes and cargoes written down, and some suspect a new tax. The harbour master in District A wants the list made public so that foreign buyers know Valkan ships exist. The ministers must decide whether the register is a commercial notice or an internal file, knowing that foreign insurers will ask to see it whichever they choose.\n\nProvisional gameplay."
 ac_wd_vlk.6.a:0 "Publish the register as a notice to buyers."
 ac_wd_vlk_6_a:0 "Publish the register as a notice to buyers."
 ac_wd_vlk.6.b:0 "Keep it as an internal file."
 ac_wd_vlk.7.t:0 "Four Neighbours Around One District"
 ac_wd_vlk.7.d:0 "The frontier office lays its survey on the cabinet table as a single sheet with five coloured lines. Malynea runs along the northern forest. Seterano meets the Union across the eastern mountain, and Slavia across the hills beside it. Monstrua and Aquitoria lie to the south-west, one beyond a plains crossing and the other beyond a coastal plain and a line of hills. Four of the five lines touch District D.\n\nThe office has added a column the ministers did not ask for: how each neighbour is governed. Monstrua is run by a movement that polls nine voters in ten. Aquitoria is a crown government whose chamber has not been elected since 1987, and Slavia an administration whose ballot has been suspended since the same year. Malynea and Seterano show the same near-even split between nationalist and non-aligned voters as the Union itself.\n\nNo file records a quarrel over any of these lines, and nothing on the sheet is disputed. What the survey does show is that every current in Valkan politics has a neighbour that looks like it, and that each camp will want frontier policy to lean toward its own likeness. The ministers must decide whether to say that aloud or let the camps work it out for themselves.\n\nProvisional gameplay."
 ac_wd_vlk.7.a:0 "Say plainly that policy will not follow party."
 ac_wd_vlk.7.b:0 "Let each camp draw its own lessons."
 ac_wd_vlk.8.t:0 "The Impact Office Meets"
 ac_wd_vlk.8.d:0 "The bulletin arrives on the late radio of 10 December 1994. The International Astronomical Union has calculated that Ulysses, a body few people in the Union had heard of a month before, will come close to the planet, and it will not rule out a hit. Before dawn the Administration has an impact office working from two borrowed rooms at the Capital Centre: engineers, doctors, railwaymen and two officers lent by the service.\n\nThe first meeting establishes how little the office knows. Nobody can say where fragments might fall, when, or how many. The Union's two climates complicate every plan: the north is frozen for months and the south is wet underfoot all year. Its one mountain is solid rock in District D. Its one railway would have to carry everything and everyone, and it already struggles in snow and in mud.\n\nBefore any plan is drafted, the office must decide what to tell the public. Sharing every uncertainty would be honest, and would frighten many people who can do nothing with the knowledge. Saying little until there is a plan would keep the districts calm and risk the impression that the government is hiding something. The radio stations are already asking for a statement.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1994 / 12.10 in tools/lore/chronicle.json; the Valkan response is gameplay."
 ac_wd_vlk.8.a:0 "Share everything the office knows."
 ac_wd_vlk_8_a:0 "Share everything the office knows."
 ac_wd_vlk.8.b:0 "Speak once there is a plan."
 ac_wd_vlk.9.t:0 "Premiums on a Peaceful Lane"
 ac_wd_vlk.9.d:0 "In late March 1995 war breaks out around Belka, a long way from any Valkan shore. Within days the marine insurers who cover Valkan freighters raise their premiums on every voyage, whether or not the route passes near the fighting. Shipowners in District A forward the new rates to the ministry with a short note asking what the government means to do about them.\n\nThe effects spread quickly. Foreign buyers of Valkan plate ask for longer delivery times. Imported fuel costs more to land, which the trunk line, the works and the two formations all feel within the month. Some buyers abroad ask quietly whether the Union would sell steel to parties at war, and at what price. Newspapers in both camps argue about whether a small country can stay out of a war's economy as easily as its battles.\n\nThe government has no say over the war and little over the insurers. What it can decide is whether the state carries part of the new risk, and what kind of customer the Union will sell to while the fighting lasts. Before either, ministers must settle how to speak about a war that has nothing to do with Valka and is already in every price.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25 in tools/lore/chronicle.json; the Valkan response is gameplay."
 ac_wd_vlk.9.a:0 "Promise help with the premiums."
 ac_wd_vlk.9.b:0 "Tell owners to price the risk themselves."
 ac_wd_vlk.10.t:0 "What Ten Years Built"
 ac_wd_vlk.10.d:0 "The audit panel, drawn equally from both camps with a judge in the chair, publishes its findings on the state of the Union after a decade. Its members walked the trunk line, the works, the shelters, the frontier posts and the northern quay, and counted what was built against what was promised. They disagree about almost everything except the arithmetic, which they sign together.\n\nThe findings please nobody completely. The line runs better than it did, but District E still waits longest for every train. The works make more, still without alloys of their own. The service is better trained and still very small. The political order, whichever it is, has lasted, yet the split between the camps is almost as even as it was on the morning the first tally was printed.\n\nThe government has two ways to respond. Adopting the findings whole means announcing a programme for the next ten years and being judged against every line of it. Thanking the panel and passing its recommendations to a standing committee is quieter, and the committee rooms of the Union are already full of such recommendations. The panel members have let it be known that they will talk to the newspapers whichever course is chosen.\n\nProvisional gameplay."
 ac_wd_vlk.10.a:0 "Accept the findings in full."
 ac_wd_vlk.10.b:0 "Send them to committee."
 VLK_wd_national_list_office:0 "Cabinet of the National List"
 VLK_wd_national_list_office_desc:0 "A cabinet named by the nationalist list after it wins a national ballot, governing as an elected government bound to the election calendar and to a chamber in which the non-aligned camp holds nearly half the seats. Provisional gameplay office with no named holder."
 VLK_wd_union_assembly_office:0 "Cross-Camp Cabinet of the Union Assembly"
 VLK_wd_union_assembly_office_desc:0 "A cabinet that takes office only with two thirds of the elected chamber behind it, so its ministers come from both camps and its chair from the centre. Provisional gameplay office with no named holder."
 VLK_wd_directors_council_office:0 "Council of the Union Directors"
 VLK_wd_directors_council_office_desc:0 "A council of district, works, cooperative and bank directors governing by published weekly resolution with the ballot suspended and no party seats. Provisional gameplay office with no named holder."
 ac_wd_vlk_decisions:0 "Valka: National Measures"
 ac_wd_vlk_decisions_desc:0 "Measures from the national programme of Valka. Provisional gameplay unless a source ledger row says otherwise."
 VLK_wd_plough_run_decision:0 "Send the Plough Wagons Up the Spur"
 VLK_wd_plough_run_decision_desc:0 "Put the plough wagons and a shovel crew on the northern spur after a blizzard. Costs political power; repeatable each winter."
 VLK_wd_drain_gangs_decision:0 "Put Drain Gangs on the Southern Track"
 VLK_wd_drain_gangs_decision_desc:0 "Clear the culverts under the southern section before the rains. Costs political power; repeatable twice a year."
 VLK_wd_fire_roster_decision:0 "Man the Firebreaks Through a Dry Spell"
 VLK_wd_fire_roster_decision_desc:0 "Station crews and water tanks at the northern firebreaks for a season. Costs political power; repeatable yearly."
 VLK_wd_flood_callout_decision:0 "Call the Flood Companies Out"
 VLK_wd_flood_callout_decision_desc:0 "Send the flood companies to the southern halts ahead of the rains. Costs political power; repeatable twice a year."
 VLK_wd_plate_auction_decision:0 "Auction a Season of Plate Abroad"
 VLK_wd_plate_auction_decision_desc:0 "Sell a season of surplus plate to foreign yards by auction. Costs political power; repeatable once a year."
 VLK_wd_dredge_inlet_decision:0 "Dredge the Northern Inlet"
 VLK_wd_dredge_inlet_decision_desc:0 "Dredge the forest inlet in District A so that larger freighters can reach the quay. Costs political power; once only."
