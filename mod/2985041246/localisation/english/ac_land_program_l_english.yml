l_english:
 ac_land_folder:0 "Land Systems"
 ac_land_folder_desc:0 "Conventional land capability, 2006–2020. New designs require research, production and delivery."
 ac_land_tab_short:0 "LAND"
 ac_land_page_heading:0 "LAND SYSTEMS / CAPABILITY PROGRAMME"
 ac_land_page_scope:0 "2006–2020 planning. Research unlocks designs; manufacturing, crews and delivery provide the capability."
 ac_land_research_name:0 "Land Systems: Sustainment and Modernization"
 ac_land_research_desc:0 "Research affordable replacement equipment and supplied specialist support after 2005. Production and existing national allocations remain physical limits."
