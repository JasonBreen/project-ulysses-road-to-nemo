 ac_wd_dak.1.t:0 "The Ballot in the Drawer"
 ac_wd_dak.1.d:0 "The decree is short and the reaction is long. Dakrain voted on the first day of 1991, the democratic parties took nearly half the count and the left bloc close to a third, and no further ballot now stands on the calendar. The presidency, held by an officer with a marshal's rank, governs a stable country with a conservative cabinet, and it has published the terms on which the suspension rests.\n\nPublishing them has brought every camp into the open. Liberal deputies and the port newspapers want the polling stations reopened within the year. The conservative majority prefers a council of state with a programme and no campaign. The left bloc, strong in the Brunies mills and on the Bell Town docks, speaks of councils instead of ministries. A circle of senior commanders says little in public and a great deal in the officers' mess.\n\nNothing is settled today. What the presidency decides now is how the argument will be held: in the chamber and the press, where every faction can be heard and every promise is recorded, or inside the ministries and barracks of Brunies, where decisions come faster and grudges last longer. Whichever way it goes, the camp left outside will remember who closed the door.\n\nProvisional gameplay: history/countries/DAK - Dakrain.txt set_politics and set_popularities; every response is gameplay."
 ac_wd_dak.1.a:0 "Publish the hearings in full."
 ac_wd_dak.1.b:0 "Keep the hearings behind closed doors."
 ac_wd_dak.1.c:0 "Ask the garrisons for their view first."
 ac_wd_dak.2.t:0 "Lines Drawn by Others"
 ac_wd_dak.2.d:0 "The claims office opens in Brunies with three filing cabinets and a problem of definitions. Dakrainian schoolbooks show North Dakrain, the province around Karluga, and the Terentio Desert as Dakrainian land held by Perbla. The claims recorded for Perbla mark Trent and Brunies as Perblan, and the claims recorded for Terentio mark them too. Every party has paperwork. Nobody is moving any posts.\n\nThe frontier itself is less grand than the maps. Herders cross with their flocks, water trucks run between wells that ignore the line, and smugglers carry fuel and cigarettes in both directions. Families in Trent have cousins in Karluga. The frontier police arrest some travellers and wave through others, depending on the day, the officer and the size of the gift.\n\nBefore any policy is written, the office must decide what it is for. It can serve as an archive and a diplomatic desk, keeping the claim alive on paper and the crossings calm. Or it can become the voice of the claim, with maps for every classroom and statements for every anniversary. The first course reassures Gatewood. The second reassures the officers in Brunies.\n\nProvisional gameplay: state histories 114, 234, 209 and 571 (add_claim_by); no border, core or war effect."
 ac_wd_dak.2.a:0 "Make it an archive and a desk."
 ac_wd_dak.2.b:0 "Make it the voice of the claim."
 ac_wd_dak.3.t:0 "The Furnace Count"
 ac_wd_dak.3.d:0 "The inspectors come back from Brunies with a report thicker than any budget. The province holds all of Dakrain's steel and tungsten, two civilian works, three arms halls and the mills that feed them. Some furnaces run around the clock on modern controls. Others are older than the men who tend them and survive because nobody has dared to close them.\n\nThe tungsten shafts are worse. Their maps are old, their ventilation fails in the hot months and their escape galleries flood after heavy rain. Wages are decent by Dakrainian standards and the unions are strong, which is why the shafts still work at all. The owners say any improvement must be paid by the state. The unions answer that the state has been saying the same thing for years.\n\nThe report offers two broad directions: fold the mills into a single state combine with one order book, or open them to investors and let capital find the best furnaces. Before either can be argued, the ministry must decide who reads the report first: the owners, who will dispute every figure, or the unions, who will quote every figure back at them.\n\nProvisional gameplay."
 ac_wd_dak.3.a:0 "Give it to the owners first."
 ac_wd_dak_3_a:0 "Give it to the owners first."
 ac_wd_dak.3.b:0 "Give it to the unions first."
 ac_wd_dak.4.t:0 "Two Harbour Councils"
 ac_wd_dak.4.d:0 "Bell Town and Oderin have been rivals for longer than either has had a proper breakwater. Bell Town is the deeper port, close to the capital province, its quays shared by freighters and the navy's lone escort. Oderin, on the Trent coast, is busier and shallower, crowded with coasters, fishing boats and the small repair yards that serve them.\n\nEach port council has a plan, and each plan requires the other port to wait. Bell Town wants its channel dredged and its quays lengthened for larger ships. Oderin wants a slipway and a cold store. Both want the shipping lines and both accuse the other of stealing them with lower dues. The ministry has funded a little of everything, and neither port is satisfied.\n\nA joint harbour board would set dues and plan works for both, but only if both councils accept equal seats and a chair named in Brunies. The ministry must decide how to bring them to the table: with money for each port's first project, or with a deadline after which the board is formed whether the councils like it or not.\n\nProvisional gameplay."
 ac_wd_dak.4.a:0 "Bring them in with money."
 ac_wd_dak.4.b:0 "Set a deadline."
 ac_wd_dak.5.t:0 "The Wing on Parade"
 ac_wd_dak.5.d:0 "The air staff's review begins with a parade and ends with a list. Twenty-four Service Fighters fly past the Brunies fields in good order, a credit to their crews. Behind the hangars the list tells the rest: engines past their overhaul dates, radios cannibalised to keep others working, and a dozen pilots who have not flown a night sortie in a year.\n\nThe wing is all the air defence Dakrain has. Two port cities, an inland capital province and a frontier facing a larger neighbour depend on it, and the army asks for support the wing cannot give. The navy asks for patrols over the coast. The frontier companies want reconnaissance. Every request is reasonable. Granted together, they would ground the wing within a season.\n\nThe staff offers two broad doctrines for the coming years: concentrate on interception over the ports, tied to radar, or disperse the wing across the plain so that it survives a first blow. Before choosing, the government must decide whether to publish the review, inviting public pressure for funds, or to keep it within the staff and the ministry.\n\nProvisional gameplay."
 ac_wd_dak.5.a:0 "Publish the review."
 ac_wd_dak.5.b:0 "Keep it within the staff."
 ac_wd_dak.6.t:0 "Columns in the Mud"
 ac_wd_dak.6.d:0 "The general staff's count of trucks, rifles and trains is barely finished when the first exercise of the year sends two infantry formations across the plain behind Trent in the wet season. The plan expects them at the frontier road in two days. They arrive in five, after leaving a trail of bogged trucks, flooded field kitchens and radios drowned in their crates.\n\nThe umpires' report is blunt. The army was organised for dry ground and fine weather, and its supply columns depend on two roads that turn to rivers in heavy rain. The reserve stocks counted in the depots are real, but nobody can move them quickly. Replacement crews for broken trucks exist only on paper. The officers who planned the exercise expect to be blamed.\n\nThe staff can treat the result as a scandal, removing the planners and promising reform, or as a lesson, keeping the officers and sending them back into the mud with orders to try again. A scandal would satisfy the press and the chamber. A lesson would keep experienced men in post who now know exactly what failed and why.\n\nProvisional gameplay."
 ac_wd_dak.6.a:0 "Treat it as a scandal."
 ac_wd_dak.6.b:0 "Treat it as a lesson."
 ac_wd_dak.7.t:0 "War Beyond the Northern Horizon"
 ac_wd_dak.7.d:0 "Word of war reaches Brunies by radio before dawn. Belka has gone to war far to the north, and by midday the shipping agents at Bell Town are quoting new insurance rates. Dakrain has no part in the quarrel and no treaty that would draw it in. Its concern is closer to home: Perbla, across the frontier, counts Belka among its oldest friends.\n\nThe war desk assembles what it can. Northern routes will be dangerous for months; fuel and grain prices will rise; some lines will look for neutral harbours to bunker and repair. The frontier companies facing North Dakrain report no change across the line, so far. Perbla's government has said nothing in public. Its newspapers have said a great deal.\n\nThe presidency must decide how Dakrain speaks in the first days. A firm statement of neutrality, repeated in every capital, would reassure Gatewood and the shipping lines. A quieter course, saying little and watching closely, keeps every option open but leaves the neighbours to guess. Either way, the frontier companies will be told to keep their eyes open and their reports short.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25 in tools/lore/chronicle.json; the Dakrainian response is gameplay."
 ac_wd_dak.7.a:0 "Declare neutrality in every capital."
 ac_wd_dak.7.b:0 "Say little and watch."
 ac_wd_dak.8.t:0 "Gatewood Answers"
 ac_wd_dak.8.d:0 "Some weeks into the war, the frontier desk receives a note from Perbla, handed over by a junior official at a crossing near the Terentio Desert as if it were a customs form. It commits to nothing. It speaks of friendship with Belka, of respect for neighbours and of Perbla's own frontiers, and it says nothing at all about what Perbla will do.\n\nIn Brunies the note is read three ways. The officers read a warning and ask for the frontier companies to stay on alert until the war ends. The traders read reassurance and ask for the crossings to stay open. The claims office reads an opening to remind Gatewood that Dakrain has a long memory too, and is told firmly that this is not the season.\n\nThe government must choose how to answer. A courteous reply, confirming Dakrain's neutrality and proposing that frontier officials keep talking, would calm the crossings. A cooler reply, acknowledging the note and nothing more, would signal that Dakrain will watch its frontier however friendly the words. Both answers will be read closely in Gatewood, and both will be remembered.\n\nProvisional gameplay: mod/2985041246/common/on_actions/ac_on_actions.txt (PBL historical_friends with BLK); no Perblan decision is asserted."
 ac_wd_dak.8.a:0 "Reply with courtesy."
 ac_wd_dak.8.b:0 "Reply coolly and keep watching."
 ac_wd_dak.9.t:0 "A Date for the Asteroid"
 ac_wd_dak.9.d:0 "The December 1994 warning was a matter for astronomers and newspaper columnists. The April 1996 announcement is a matter for every government. The asteroid called Ulysses will strike the Earth, and nobody can say where its fragments will fall. In Brunies the civil defence office, until now a single floor of clerks and fire inspectors, is told to plan for it.\n\nIts planners face a threat with no address. Most Dakrainians live in West Trent, Bell Town and Oderin, on a low plain with no hills to hide behind and rivers that flood in the wet season. The mills have deep basements, the railways reach every district and the ports have ships. None of these was built with a falling sky in mind, and none of them is cheap to adapt.\n\nTwo schools form quickly. One wants shelters, dug into the mill basements and city cellars and stocked for weeks. The other wants timetables, trains and reception villages to empty the cities when a warning comes. Before choosing, the government must decide how to speak to the public: frankly, with the full uncertainty, or reassuringly, with plans before details.\n\nProvisional gameplay: date anchors only, ACES Chronicle rows 1994 / 12.10 and 1996 / 04.20 in tools/lore/chronicle.json; the Dakrainian response is gameplay."
 ac_wd_dak.9.a:0 "Speak frankly."
 ac_wd_dak.9.b:0 "Reassure first."
 ac_wd_dak.10.t:0 "The Night of the Fragments"
 ac_wd_dak.10.d:0 "On the night the asteroid crosses the Roche limit, every siren in Dakrain is tested at dusk and then falls silent. The shelters and stations are staffed, the sky watch reports every hour, and the radio carries nothing but bulletins. In the port cities people stand on rooftops to watch the sky. In the mill districts many go below without being told.\n\nThe bulletins carry news from abroad rather than from home: reports of fragments and fires in distant places, each one checked against the next before it is read aloud. The civil defence office keeps its own counsel and its own lists. Whatever falls on Dakrain, if anything does, the plans written since 1996 will meet it with what they have.\n\nBy morning the government must decide what comes next. It can keep the country on alert for weeks, shelters manned and trains ready, until the danger is certainly past, at a cost to work and patience. Or it can stand down the larger measures and keep only the sky watch and the relief stocks, trusting that the worst night is over.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1999 / 07.08 in tools/lore/chronicle.json; no fragment fall in Dakrain is claimed."
 ac_wd_dak.10.a:0 "Stay on alert for weeks."
 ac_wd_dak.10.b:0 "Stand down the larger measures."
 ac_wd_dak.11.t:0 "The Panel Drawn by Lot"
 ac_wd_dak.11.d:0 "The review panel meets in a converted mill hall in Brunies: fifteen citizens drawn by lot from both provinces, a staff of clerks and a mandate to ask anything. For three months it hears ministers, mill owners, union delegates, harbour councils, officers and frontier families. Its sessions are broadcast in full, and the audiences surprise the broadcasters.\n\nThe testimony is uneven. The mills claim credit for a decade of growth and the unions for a decade of safer shafts. The air staff points to a wing that can fly in the rain, the harbours to their order books and the claims office to a frontier that stayed quiet. Every witness has a version, and every version leaves something out.\n\nThe panel's report will shape the politics of the new decade. The government can adopt it in full, accepting its criticism along with its praise, or receive it with thanks and adopt what suits. Full adoption binds the government to reforms it did not write. Selective adoption keeps its freedom and invites the charge that the panel was theatre from the start.\n\nProvisional gameplay."
 ac_wd_dak.11.a:0 "Adopt it in full."
 ac_wd_dak.11.b:0 "Adopt what suits."
 ac_wd_dak.12.t:0 "Rates for a Distant War"
 ac_wd_dak.12.d:0 "The shipping agents at Bell Town hear of war in Usea from the wire services before the ministries hear of it from their embassies. Insurance rates for routes near the Usean coast double within a week. Charter offers arrive for grain, machinery and medical stores, some at rates no Dakrainian owner has seen in a decade.\n\nDakrain has no part in the war, and its government means to keep it that way. Its merchant fleet is small, pooled and modestly insured. A single ship lost near the fighting would be a national story; a season of high charter rates would pay off the pool's debts. The owners want permission, the crews want a choice and their families want them home.\n\nThe ministry must decide how to answer the owners. It can allow charters under strict rules on cargo and routes, and let crews volunteer, or it can ask every Dakrainian-flagged hull to stay well clear of Usean waters until the war ends. The first earns money and accepts risk. The second costs money and keeps everyone home, which in a small port country is its own kind of argument.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2003 / 08.22 in tools/lore/chronicle.json; fired only after the mod flag ac_ucw_war_started; the Dakrainian response is gameplay."
 ac_wd_dak.12.a:0 "Allow strict charters."
 ac_wd_dak.12.b:0 "Keep the hulls clear."
 DAK_wd_republic_cabinet_office:0 "Cabinet of the Restored Republic"
 DAK_wd_republic_cabinet_office_desc:0 "A cabinet formed by the majority of a freely elected chamber, governing collectively, with the presidency reduced to a fixed-term office of state. Provisional gameplay office with no named holder."
 DAK_wd_presidential_council_office:0 "Council of State of the Presidency"
 DAK_wd_presidential_council_office_desc:0 "A council of state named by the presidency, governing on a published programme while the ballot stays suspended and the chamber sits as an advisory body. Provisional gameplay office with no named holder."
 DAK_wd_workers_federation_office:0 "Federal Committee of the Works Councils"
 DAK_wd_workers_federation_office_desc:0 "A committee elected by delegates of the mill, dock and depot councils, holding the ministries in place of the presidency. Provisional gameplay office with no named holder."
 DAK_wd_marshals_directorate_office:0 "Directorate of Marshals"
 DAK_wd_marshals_directorate_office_desc:0 "A directorate of senior commanders holding the seals, the treasury and the frontier, with the parties kept as advisory bodies. Provisional gameplay office with no named holder."
 ac_wd_dak_decisions:0 "Dakrain: National Measures"
 ac_wd_dak_decisions_desc:0 "Measures from the national programme of Dakrain. Provisional gameplay unless a source ledger row says otherwise."
 DAK_wd_tungsten_lot_decision:0 "Auction a Tungsten Lot"
 DAK_wd_tungsten_lot_decision_desc:0 "A lot of Brunies tungsten goes to foreign buyers at auction. Earns political capital for half a year at the cost of ore the tool works wanted."
 DAK_wd_desert_patrol_decision:0 "Patrol the Desert Line"
 DAK_wd_desert_patrol_decision_desc:0 "Frontier companies walk the line facing North Dakrain and the Terentio Desert for a week. Gains army experience; no claim, core or border changes."
 DAK_wd_brunies_runways_decision:0 "Lengthen the Brunies Runways"
 DAK_wd_brunies_runways_decision_desc:0 "The main Brunies fields gain longer runways and more hardstands. A one-time investment for the air wing."
 DAK_wd_siren_drill_decision:0 "Sirens and Shelter Drill"
 DAK_wd_siren_drill_decision_desc:0 "Every district rehearses its warning, its shelters and its trains for one day. Calms the public at the cost of a day of work."
 DAK_wd_escort_exercise_decision:0 "Escort Exercise off Bell Town"
 DAK_wd_escort_exercise_decision_desc:0 "The escort crews and harbour pilots rehearse closing the approaches to Bell Town and Oderin. Gains naval experience at the cost of a day of port traffic."
 DAK_wd_crossing_fair_decision:0 "License a Crossing Fair"
 DAK_wd_crossing_fair_decision_desc:0 "Frontier officials license a season-long fair at a crossing toward Perbla. Costs political power to organise and eases trade for a year."
