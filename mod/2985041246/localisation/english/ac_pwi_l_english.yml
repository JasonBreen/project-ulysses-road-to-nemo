 ac_pwi.122.t:0 "A reconstruction negotiation closes"
 ac_pwi.122.d:0 "The negotiation has ended without an accord: it was declined, withdrawn, expired, or invalidated by changed circumstances. No assistance was booked and no recovery reward was paid. The cabinet may pursue its domestic recovery program."
 ac_pwi.122.a:0 "Close the diplomatic file."
 ac_pwi.123.t:0 "A relief partner can no longer participate"
 ac_pwi.123.d:0 "War, capitulation, annexation or a change in sovereignty has made the accord inoperative. Earlier reconstruction work is not erased, but the government can no longer count this partner toward future relief capacity."
 ac_pwi.123.a:0 "Update the emergency plans."
 ac_pwi_reconstruction_accord:0 "Reconstruction and relief accord"
 ac_pwi_civil_defense:0 "Coordinate Civil Defense"
 ac_pwi_civil_defense_desc:0 "Prepare emergency supplies and continuity plans: preparedness +25. Commits civilian capacity for 180 days."
 ac_pwi_logistics:0 "Exercise Emergency Logistics"
 ac_pwi_logistics_desc:0 "Practice emergency distribution: preparedness +20. Commits civilian capacity for 180 days."
 ac_pwi_cooperate:0 "Coordinate with the Relief Partner"
 ac_pwi_cooperate_desc:0 "Requires a live, accepted reconstruction accord: preparedness +25. Commits civilian capacity for 180 days; a partner lost before the crisis cannot provide the later cooperation bonus."
 ac_pwi_readiness:0 "Retain Emergency Military Readiness"
 ac_pwi_readiness_desc:0 "Retain transport and command capacity: preparedness +10, army experience +10. Commits industrial capacity for 180 days. Competes with the civil-defense commitment through a shared 180-day capacity lock."
 ac_pwi.70.t:0 "Ulysses: a warning for every cabinet"
 ac_pwi.70.d:0 "The FCU has publicly announced that Ulysses will strike Earth. The announcement of 20 April 1996 is the historical reference point. Governments must now allocate capacity between civil defense, relief cooperation and military readiness. Our choices here are authored national responses, not a prediction of an impact site in our territory."
 ac_pwi.70.a:0 "Open the preparedness brief."
 ac_pwi.71.t:0 "Ulysses: the relief assessment"
 ac_pwi.71.d:0 "Ulysses passed Earth's Roche limit on 8 July 1999. This assessment concerns emergency capacity and humanitarian commitments, not invented physical damage to our provinces. Relief capacity is [?ac_pwi_relief_capacity|.0]: preparedness, effective recovery, and a partner still able to help all contribute. A capacity of 60 or more supports a resilient response; otherwise the relief effort is strained."
 ac_pwi.71.a:0 "Record the demands on the emergency services."
 ac_pwi.72.t:0 "The settlement at the end of 1999"
 ac_pwi.72.d:0 "The year closes with recovery at [?ac_pwi_recovery|.0], political confidence at [?ac_pwi_confidence|.0], and settlement tension at [?ac_pwi_tension|.0]. Preparedness reached [?ac_pwi_preparedness|.0]; assessed relief capacity was [?ac_pwi_relief_capacity|.0]. The national policy, military-readiness commitments, live accords and relief outcome remain recorded for the next period. A country still awaiting its settlement has no completed postwar program to report. The campaign continues."
 ac_pwi.72.a:0 "Carry the record forward."
 ac_pwi.73.t:0 "The Belkan Air Force after defeat"
 ac_pwi.73.d:0 "The official chronology records Waldemarr Rald's overthrow and Lieutenant General Blauvelt's air-force reformation on 17 January 1996. This briefing uses that historical reference to frame a reform debate after defeat. It does not assert that Rald still governs this campaign, appoint Blauvelt to an unsupported office, or undo the monarchy or government already established. [Root.GetLeader]'s cabinet must decide the present mandate."
 ac_pwi.73.a:0 "Fund accountable training institutions."
 ac_pwi.73.b:0 "Keep the existing command arrangements."
 ac_pwi.74.t:0 "A World With No Boundaries: the inherited crisis"
 ac_pwi.74.d:0 "The inherited campaign has produced A World With No Boundaries or its associated military disruption. Its historical rebellion belongs to December 1995; this campaign's existing uprising retains its own participants and consequences. The aftermath administration must account for interrupted recovery and military loyalty. This briefing does not create another rebellion or move the country to a different side."
 ac_pwi.74.a:0 "Publish a civilian review once peace permits."
 ac_pwi.74.b:0 "Preserve the records for the postwar review."
 ac_pwi.75.t:0 "Experienced pilots beyond Belka"
 ac_pwi.75.d:0 "The official chronology records former Belkan top pilots serving abroad as aggressor instructors in 1998. The cabinet can make training and professional reintegration part of its program or keep its experienced personnel concentrated at home. These options are authored policy consequences; no named pilot is moved or given an invented biography."
 ac_pwi.75.a:0 "Support professional training and reintegration."
 ac_pwi.75.b:0 "Keep the training cadre at home."
 ac_pwi.76.t:0 "A local administration after the settlement"
 ac_pwi.76.d:0 "The inherited settlement determines the territory, government and sovereignty administered here. Our immediate choices concern recovery within that authority. An independent government may pursue its own diplomacy; a subject administration cannot promise independent guarantees. Neither option changes borders or grants sovereignty."
 ac_pwi.76.a:0 "Prioritize local recovery."
 ac_pwi.76.b:0 "Retain more administrative security capacity."
 ac_pwi_accommodation:0 "A Government of Recovery"
 ac_pwi_accommodation_desc:0 "Civilian recovery and accommodation slow the pace of military expansion. Provisional gameplay policy."
 ac_pwi_central_authority:0 "A Government of Order"
 ac_pwi_central_authority_desc:0 "Central authority coordinates administration and military industry, at the cost of openness and greater suspicion. Provisional gameplay policy."
 ac_pwi_armed_revision:0 "A Government of Armed Revision"
 ac_pwi_armed_revision_desc:0 "Military readiness competes with civilian recovery and foreign cooperation. This policy grants no war goal. Provisional gameplay policy."
 ac_pwi_civil_preparation:0 "Civil Capacity Committed"
 ac_pwi_civil_preparation_desc:0 "Civil-defense and relief preparations temporarily divert construction capacity. Provisional gameplay cost."
 ac_pwi_military_preparation:0 "Military Capacity Committed"
 ac_pwi_military_preparation_desc:0 "Retained emergency transport and command capacity has an industrial opportunity cost. Provisional gameplay cost."
 ac_pwi_relief_resilience:0 "A Resilient Relief Response"
 ac_pwi_relief_resilience_desc:0 "Preparation and functioning cooperation support emergency coordination. This is humanitarian capacity, not an invented physical impact zone."
 ac_pwi_relief_strain:0 "Emergency Services Under Strain"
 ac_pwi_relief_strain_desc:0 "Insufficient preparation strains civilian coordination. The penalty expires; the campaign remains playable."
