 ac_camp.2044.t:0 "A bounded offer from Ustio"
 ac_camp.2044.desc:0 "Ustio's offer is accompanied by a right to withdraw. The officer reviewing it pauses at that clause. To planners trying to produce a reliable return, a condition can look like a defect in the resource being offered. To the government making the commitment, it is the reason the offer can be made at all. Accepting it records permission for a defined, funded mission and preserves its stated limits. It does not create a guarantee or borrow an earlier settlement to justify a new obligation. The receiving clerk keeps space for an answer, including an answer the sender would rather not receive."
 ac_camp.2044.a:0 "Accept this defined commitment."
 ac_camp.2044.b:0 "Decline the offer."
