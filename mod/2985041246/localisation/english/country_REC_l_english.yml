l_english:
 recta.1.t:0 "The Question of Recta"
 recta.1.d:0 "Rectan regional leaders have pressed their long-standing case for independence once more. With the Belkan forces withdrawing from the land, the government has agreed to let Recta declare its own state, while both sides promise to keep the close ties that have always bound Gebet and Recta together."
 recta.1.a:0 "Let Recta go its own way."

 ### FOCUSES, IDEAS AND TOOLTIPS (Continental War round) ###
 rec_postwar_consolidation_focus:0 "Rectan Consolidation"
 rec_postwar_consolidation_focus_desc:0 "Recta's postwar consolidation inside the states it already holds."
 REC_consolidate_the_republic:0 "Consolidate the Republic"
 REC_consolidate_the_republic_desc:0 "The flag over the old provincial offices is new, and so are the rubber stamps. Everything else, from the filing cabinets to the clerks, is inherited from the days when Recta was governed from somewhere else.\n\nThe first cabinet meets in a room still heated by a coal stove. Its ministers agree on one principle before anything else: the republic will make its institutions work inside the borders it already holds before it looks beyond them.\n\n§gMod provenance and provisional gameplay.§!"
 REC_local_recovery_programme:0 "Local Recovery Programme"
 REC_local_recovery_programme_desc:0 "The war left its marks on Recta in shuttered workshops, broken bridges and families still waiting for news. Once the local settlement is resolved, the recovery ministry can finally move from emergency relief to reconstruction.\n\nEngineers reopen a shuttered works and hire back the men and women who left it. The ministry's planners build on the choice made in the first postwar administration briefing, whether that was to put local recovery first or to keep more capacity for security.\n\n§gProvisional gameplay.§!"
 REC_state_administration:0 "State Administration"
 REC_state_administration_desc:0 "A state that was a province until recently has no ministries of its own. Recta's administrators borrow buildings, retrain provincial clerks and print new forms on presses that last printed ration cards.\n\nRoad crews resurface the main routes into the capital so that the post, the police and the tax collectors can reach every district. Slowly, the republic begins to feel like a state instead of an announcement.\n\n§gProvisional gameplay.§!"
 REC_close_ties_with_gebet:0 "Close Ties with Gebet"
 REC_close_ties_with_gebet_desc:0 "When Recta declared its own state, both governments promised to keep the ties that have always bound them. The foreign minister intends to keep that promise in practice as well as in speeches.\n\nBorder posts open longer hours. Delegations exchange visits, schoolteachers share curricula, and the radio stations on both sides carry each other's evening news. To most Rectans, Gebet is not a foreign country so much as a neighbour across the yard.\n\n§gProvisional gameplay.§!"
 REC_independent_course:0 "An Independent Course"
 REC_independent_course_desc:0 "Friendship is not dependence. The younger members of the cabinet argue that a republic which takes every cue from Gebet has only exchanged one master for another.\n\nThe government opens its own trade missions, drafts its own foreign policy and makes a point of announcing decisions before consulting its neighbour. The press calls it confidence. The diplomats call it a learning curve.\n\n§gProvisional gameplay.§!"
 REC_hardline_communism:0 "Hardline Communism"
 REC_hardline_communism_desc:0 "The party leadership meets late into the night and emerges with a resolution: the young republic will be held together by discipline. Factional debate is closed; the central committee will speak with one voice.\n\nParty secretaries are posted to every district office. Loudspeakers on the factory floors read the leadership's statements at the start of each shift. Order is restored quickly. Whether it is loved is another question.\n\n§gProvisional gameplay.§!"
 REC_reform_communism:0 "Reform Communism"
 REC_reform_communism_desc:0 "A faction of the party argues that the republic will only last if its people choose it. Councils elected in factories and districts are given a voice, and small traders are permitted to sell outside the state shops.\n\nThe markets fill on the first weekend. The hardliners warn of disorder; the reformers point to queues that are finally getting shorter. For now, the experiment continues.\n\n§gProvisional gameplay.§!"
 REC_gebet_economic_compact:0 "Gebet Economic Compact"
 REC_gebet_economic_compact_desc:0 "Reconstruction is too expensive for either country alone. Recta and Gebet sign a relief and reconstruction compact that pools scarce cement, steel and rolling stock across the border.\n\nFreight trains run in both directions under joint schedules. Joint committees meet monthly in a border town to argue over quotas, and somehow the bridges keep getting rebuilt.\n\n§gProvisional gameplay.§!"
 REC_rectan_border_guard:0 "Rectan Border Guard"
 REC_rectan_border_guard_desc:0 "The first recruits of the Rectan Border Guard parade in borrowed uniforms with new shoulder patches sewn on by hand. Their officers are veterans of the war; their equipment is whatever the republic can spare.\n\nTheir job is modest: patrol the roads, staff the crossings and show that Recta can guard its own territory. Every checkpoint they take over from a foreign garrison is a small act of sovereignty.\n\n§gProvisional gameplay.§!"
 REC_party_security_organs:0 "Party Security Organs"
 REC_party_security_organs_desc:0 "The security organs of the old provincial party are rebuilt as an arm of the republic. Their offices are on the top floors of the ministry buildings, and their files grow quickly.\n\nInformants are recruited in the factories and the universities. Dissenting voices fall quiet, and the leadership reports that the republic has never been more stable. In private, some ministers wonder what the cost will be.\n\n§gProvisional gameplay.§!"
 REC_economic_councils:0 "Economic Councils"
 REC_economic_councils_desc:0 "The reform faction gives the factory and district councils real authority over local production. Managers must now present their plans to elected delegates instead of distant ministries.\n\nThe meetings are long and the arguments loud, but a shuttered works reopens under council management within the year, and its first shipment leaves the yard to applause.\n\n§gProvisional gameplay.§!"
 REC_fato_partnership:0 "Partnership with FATO"
 REC_fato_partnership_desc:0 "Recta and FATO both lived through the war on the same frontier. Their governments now discover how much else they share: worn railways, displaced families and a wariness of larger neighbours.\n\nA partnership charter commits both to regular consultations and mutual assistance in disasters. It is not an alliance, but it is a promise not to face the next crisis alone.\n\n§gProvisional gameplay.§!"
 REC_fato_distance:0 "Keep FATO at Arm's Length"
 REC_fato_distance_desc:0 "The cabinet weighs a closer partnership with FATO and decides against it. Cordial relations, yes; commitments, no.\n\nThe foreign ministry sends polite letters and a trade delegation, and keeps its options open. Recta's leaders have learned that every promise made abroad becomes an obligation at home.\n\n§gProvisional gameplay.§!"
 REC_party_discipline_idea:0 "Party Discipline"
 REC_party_discipline_idea_desc:0 "The party enforces strict discipline across the young republic. Debate is closed, factions are silenced and the central committee speaks with one voice.\n\n§gProvisional gameplay.§!"
 REC_council_reform_idea:0 "Council Reforms"
 REC_council_reform_idea_desc:0 "Elected factory and district councils share power with the party and local managers. The meetings are loud, the markets are busier, and the hardliners are watching.\n\n§gProvisional gameplay.§!"
 REC_local_settlement_resolved_tt:0 "Any pending local settlement decision has been completed"
 REC_postwar_handoff_tt:0 "The postwar settlement after the Belkan War has begun"
 REC_local_briefing_answered_tt:0 "We have answered the local administration briefing after the settlement"
