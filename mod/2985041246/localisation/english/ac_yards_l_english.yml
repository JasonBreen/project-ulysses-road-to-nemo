l_english:
 ac_yards_cat:0 "Hull Programs"
 ac_yards_cat_desc:0 "Osea orders the carrier Kestrel on 29 July 1991 and commissions her on 16 September 1999. Yuktobania announces the Scinfaxi class at Cinigrad on 2 September 1991. Funding a berth or drafting the class before those days is provisional gameplay."
 ac_yards_fund_berth:0 "Fund the Kestrel's Berth"
 ac_yards_fund_berth_desc:0 "The Osean Maritime Defense Force orders the Kestrel, seventh of the Hubert class, on 29 July 1991 (ACES Chronicle, 1991 / 07.29). Paying for the berth before that day gives the yards a short head start. The order itself is not optional."
 ac_yards_sea_trial:0 "Run Kestrel Sea Trials"
 ac_yards_sea_trial_desc:0 "Take the hull out for twenty-one days. About seven trials in ten come back clean. The rest cost a point of stability and do not count. Three clean trials by 16 September 1999 pay off when she commissions. The odds and the cost are provisional gameplay."
 ac_yards_draft_class:0 "Draft the Scinfaxi Class"
 ac_yards_draft_class_desc:0 "On 2 September 1991 a political convention in Cinigrad announces the Scinfaxi class (ACES Chronicle, 1991 / 09.02). A draft finished before that day gives the yards a short head start. The announcement itself is not optional. No submarine is launched here."
 ac_yards_kestrel_fitting:0 "Kestrel on the Ways"
 ac_yards_kestrel_fitting_desc:0 "The berth was funded before the 29 July 1991 order. Dockyard output is a little higher for 180 days. §YProvisional gameplay.§!"
 ac_yards_kestrel_worked_up:0 "Kestrel Worked Up"
 ac_yards_kestrel_worked_up_desc:0 "Three clean sea trials were on the books when the Kestrel commissioned on 16 September 1999. The dockyard and coordination bonuses last 180 days. §YProvisional gameplay.§!"
 ac_yards_scinfaxi_draft:0 "Scinfaxi Draft on the Table"
 ac_yards_scinfaxi_draft_desc:0 "The class was drafted before the 2 September 1991 announcement at Cinigrad. Dockyard output is a little higher for 180 days. No hull is launched. §YProvisional gameplay.§!"
 ac_yards.1.t:0 "The Kestrel Is Ordered"
 ac_yards.1.d_funded:0 "On 29 July 1991 the Osean Maritime Defense Force orders construction of the Kestrel, the seventh Hubert-class aircraft carrier.\n\nThe berth was already funded. The yards take a short head start. She is not in service. Commission is 16 September 1999."
 ac_yards.1.d_plain:0 "On 29 July 1991 the Osean Maritime Defense Force orders construction of the Kestrel, the seventh Hubert-class aircraft carrier.\n\nThe berth was not funded early. The order still stands. Commission is 16 September 1999."
 ac_yards.1.a:0 "Lay the keel."
 ac_yards.2.t:0 "The Kestrel Commissions"
 ac_yards.2.d_worked:0 "On 16 September 1999 the Osean Maritime Defense Force commissions the Kestrel. She was ordered on 29 July 1991.\n\nThe trials log shows [?ac_yards_trials|.0] clean runs. The crew that logged at least three takes a worked-up spirit for half a year. The bonuses are provisional gameplay."
 ac_yards.2.d_plain:0 "On 16 September 1999 the Osean Maritime Defense Force commissions the Kestrel. She was ordered on 29 July 1991.\n\nThe trials log shows [?ac_yards_trials|.0] clean runs, short of three. She enters service without the worked-up spirit."
 ac_yards.2.a:0 "She is in commission."
 ac_yards.3.t:0 "Cinigrad Announces the Scinfaxi Class"
 ac_yards.3.d_drafted:0 "On 2 September 1991 a political convention in Cinigrad announces the Scinfaxi-class submarines.\n\nThe draft was already on the table, so the yards take a short head start. No submarine is launched, and none of the later wartime boats are created here."
 ac_yards.3.d_plain:0 "On 2 September 1991 a political convention in Cinigrad announces the Scinfaxi-class submarines.\n\nThe class was not drafted early. The announcement still stands. No submarine is launched."
 ac_yards.3.a:0 "Let them hear the name."
 ac_yards.4.t:0 "Minister Howards Answers Cinigrad"
 ac_yards.4.d:0 "Minister of Foreign Affairs Howards of the Osean Federation belittles Yuktobania's announcement of the Scinfaxi class. The ACES Chronicle records that answer with the 2 September 1991 convention. This note is the public statement. It changes no treaty and launches no ship."
 ac_yards.4.a:0 "A loud answer, and nothing more."
 ac_yards.10.t:0 "The Trial Comes Back Clean"
 ac_yards.10.d:0 "The Kestrel's latest trial is logged as clean. The board now shows [?ac_yards_trials|.0] clean runs. Three are enough for a worked-up spirit when she commissions on 16 September 1999."
 ac_yards.10.a:0 "Log it."
 ac_yards.11.t:0 "The Trial Comes Back Early"
 ac_yards.11.d:0 "The trial is cut short. It does not count. Stability slips by one point. The clean-run board still shows [?ac_yards_trials|.0]."
 ac_yards.11.a:0 "Bring her in."
