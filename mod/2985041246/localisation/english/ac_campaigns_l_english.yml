 YUK_camp_0_register:0 "Orders that can be questioned"
 YUK_camp_0_register_desc:0 "Orders that can be questioned. Open the campaign lane and its preparation record.\n\nThe officer asks for confirmation a second time. Across the desk, his superior closes the folder without answering. There are procedures for a damaged message, procedures for a delayed message, and considerably fewer procedures for the possibility that an intact message should not have been sent. Civilian scrutiny makes the dispute visible. Professional safeguards entrust a smaller circle with keeping an independent copy. Either course costs influence that might otherwise have purchased another convenient assurance from command."
