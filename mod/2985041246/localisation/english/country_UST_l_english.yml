 UST_one_last_time_into_the_breach: "One Last Time Into The Breach"
 UST_one_last_time_into_the_breach_desc: "It is thanks to them that we have our freedom now. It is thanks to them we were able to march again. Sadly, now they have become the last obstacle, the last storm we need to cross to never again look into the future uncertain. Osean Federation once stood with us - and that's why we will face them with pride and honor in this last war for Ustian supremacy."
