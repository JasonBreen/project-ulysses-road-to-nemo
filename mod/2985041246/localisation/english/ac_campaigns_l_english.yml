 ac_camp.34.t:0 "The last flight in the file"
 ac_camp.34.desc:0 "The operations clerk had kept the earlier engineering folder because nobody had given him a receiving address for it. Now the final assault return lay beside it, making the delay look like foresight.\n\nMegalith had been stopped. The completed operation had given the command an answer to a threat that had survived the military surrender. Mobius 1's callsign appeared among the records being assembled for the final account, beside the names of crews and staff whose work had been less easy to turn into a symbol.\n\nThe clerk began with the people who still required a receiving instruction. Some were going back to units that had changed their designation. Some would wait for a movement that the demobilization plan had not yet supplied. The announcement of victory had made all of them more impatient with a delay they would have accepted the day before.\n\nA liaison from San Salvacion came to collect a copy of the settlement papers. He recognized the clinic reference in another folder and asked whether it could go with him. The clerk checked the distribution, made a receipt and watched the file acquire a journey beyond the operations room.\n\nThere were completed tasks on the desk and unfinished lives behind almost every one of them. Keeping the distinction clear had become the command's next obligation.\n\nBefore leaving, the clerk cleaned the old board. He copied the surviving receiving requirements onto a fresh sheet first. The callsigns could come down when the watch ended. The responsibilities attached to them would need somewhere else to go."
 ac_camp.34.a:0 "Keep this account."
 ac_camp.34.z:0 "Close this old message."
