 ac_camp_sns:0 "San Salvacion — campaign operations"
 ac_camp_sns_desc:0 "Commit resources to preparation, conduct operations, and read the delivered scenes. Historical dates open opportunities; results depend on present conditions. All alternate routes and dialogue are authored gameplay."
 SNS_camp_0_register:0 "A city that must continue"
 SNS_camp_0_register_desc:0 "A city that must continue. Open the campaign lane and its preparation record.\n\nThe clinic keeps its old opening hours because changing them would make the war feel permanent. That is what the nurse says, and the porter lets her say it. They both know that most mornings begin with a different list of things they no longer have. Continuity means finding a practical arrangement with powers that can close the road. Protected local administration means deciding which compromises can be recorded without endangering the people who made them. The branch turns that choice into a receiving operation whose outcome returns in the occupation story and, if the city is liberated, in the work of rebuilding."
