 ac_camp.10.t:0 "What the children heard"
 ac_camp.10.desc:0 "The school reopened in two rooms because the other rooms had broken windows. The teacher divided the children by the number of chairs rather than by age. On the first morning, she asked them to write down what they had done the previous day. Half of them wrote about standing in a queue. One described a truck with a cracked mirror. Another left the page empty and drew a careful border around it.\n\nAt midday the nurse came to collect a child whose mother was waiting at the clinic. The teacher followed her into the corridor and asked whether there had been an accident. The nurse said no. Then she explained that no was sometimes the only answer she could give without making the waiting harder.\n\nThey stood beside the door that had once led to the music room. Someone had moved the piano against the wall to protect it from the weather. A patrol went past outside. The children fell quiet without being told to do so, and the teacher waited until the footsteps had faded before opening the classroom again.\n\nThe nurse had brought a small box of dressings from the clinic, or what remained of one. She left it on the teacher's desk with a list of instructions for conserving them. The list was written on the back of an outdated municipal notice.\n\nAfter she left, the teacher turned the notice over. The old side announced an ordinary repair to the water supply. She read it twice before putting the instructions face up again."
 ac_camp.10.desc.v0:0 "The school reopened in two rooms because the other rooms had broken windows. The teacher divided the children by the number of chairs rather than by age. On the first morning, she asked them to write down what they had done the previous day. Half of them wrote about standing in a queue. One described a truck with a cracked mirror. Another left the page empty and drew a careful border around it.\n\nAt midday the nurse came to collect a child whose mother was waiting at the clinic. The teacher followed her into the corridor and asked whether there had been an accident. The nurse said no. Then she explained that no was sometimes the only answer she could give without making the waiting harder.\n\nThey stood beside the door that had once led to the music room. Someone had moved the piano against the wall to protect it from the weather. A patrol went past outside. The children fell quiet without being told to do so, and the teacher waited until the footsteps had faded before opening the classroom again.\n\nThe nurse had brought a small box of dressings from the clinic, or what remained of one. She left it on the teacher's desk with a list of instructions for conserving them. The list was written on the back of an outdated municipal notice.\n\nAfter she left, the teacher turned the notice over. The old side announced an ordinary repair to the water supply. She read it twice before putting the instructions face up again.\n\nThe inquiry had stayed outside the official channel. The porter brought back a recollection from a neighbor and the address of somebody who might know more. None of it bore a receiving stamp. The administrator wrote the uncertain parts separately, unwilling to turn a private kindness into a fact that another family might begin arranging its life around."
