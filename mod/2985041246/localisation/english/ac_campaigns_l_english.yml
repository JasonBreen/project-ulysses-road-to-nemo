 ac_camp.94.t:0 "The last place on the board"
 ac_camp.94.desc:0 "The receiving clerk could find no withdrawal order for the cadre. He checked the file again because the officer asking had phrased the request as though the order ought to be there.\n\nThe country had reached defeat without completing the arrangements that would have taken Yellow Thirteen away from the final defense. His loss would remain in this account. An authorization written after the settlement could help the people still waiting for transport, but it could not provide a route to someone whose last flight had already ended.\n\nThe maintenance chief came to collect the squadron's remaining papers. She placed the fault returns and the duty board copies in separate envelopes, then changed her mind and put them together. The people receiving the record would need to see what had been asked of the aircraft beside what had been asked of the crews.\n\nOutside, a group of civilians was waiting to enter an office that had been military the previous week. The clerk could hear their questions through the open window. The building's responsibilities were changing more quickly than its staff could learn the new forms.\n\nThe officer thanked him for looking and remained beside the desk for another moment. There was nothing further the clerk could supply. He had become accustomed to recognizing that moment in a conversation and was still unsure how to end it kindly.\n\nWhen the officer left, the clerk entered the receiving address on the combined envelope. The squadron's story would travel onward with its absences intact, among people who would have to decide what the country owed to the living."
 ac_camp.94.a:0 "Keep this account."
 ac_camp.94.z:0 "Close this old message."
