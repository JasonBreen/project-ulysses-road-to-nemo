 ERU_camp_3_register:0 "Orders after defeat"
 ERU_camp_3_register_desc:0 "Orders after defeat. Open the campaign lane and its preparation record.\n\nThe first petition after the settlement bears an occupation stamp beside the new authority's seal. Nobody knows which of the two will trouble the receiving clerk more. Victory, defeat and an armistice leave different powers in different hands, but they all leave someone holding an order that once seemed sufficient. The account hears the cases produced by the actual campaign. It preserves the distinction between a negotiated access order and an unqualified promise of protection. Rebuilding begins when the administration can admit what it can presently do, and what it failed to do when the people asking were still inside the cordon."
