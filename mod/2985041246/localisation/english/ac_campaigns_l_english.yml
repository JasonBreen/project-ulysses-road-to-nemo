 YUK_camp_1_register:0 "A sea denied"
 YUK_camp_1_register_desc:0 "A sea denied. Open the campaign lane and its preparation record.\n\nA submerged carrier leaves little room for the language of public ceremonies. The crew knows the distance to its next receiving point and the work required to keep an aircraft ready inside a vessel that the sea is trying to close. Maritime denial can impose a terrible cost on an enemy while consuming the crews ordered to maintain it. A recall preserves a strategic asset and relinquishes its immediate threat. Neither outcome happens because the calendar has reached the date printed in a history book."
