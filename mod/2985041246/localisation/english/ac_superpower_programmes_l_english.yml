 OSE_snp_crisis_authority_policy_context_2:0 "The standing policy is bounded emergency mandate. Its continuing opportunity cost remains in the national schedule."
 ac_snp.17.t:0 "The Instruction during the Rehearsal"
 ac_snp.17.d:0 "The emergency-authority exercise stops when the receiving clerk asks for an approval that the instruction cites but does not contain. The officer conducting the drill says the delay would matter during a real crisis. The clerk agrees and leaves the line open. A civil representative proposes a verification return that every affected office can read. The command liaison proposes a narrower delegated mandate with an explicit expiry and a protected channel for the missing answer. Neither wants obedience to depend on an unanswered telephone. The committee must choose which route will receive exceptional instructions, and who will be responsible when the promised confirmation does not come.\n\n[OSE_snp_crisis_authority_policy_context]"
 ac_snp.17.a:0 "Require a civil verification return before exceptional authority expands."
 ac_snp.17.a_effect_tt:0 "Civil support +4, readiness support -2. Both observations remain within zero to one hundred."
 ac_snp.17.b:0 "Use a limited delegated mandate with a protected confirmation channel."
 ac_snp.17.b_effect_tt:0 "Readiness support +4, civil support -2. Both observations remain within zero to one hundred."
