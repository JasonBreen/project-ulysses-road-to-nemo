 GEB_fsb_reply_geb_infantry_accept:0 "Accept: Infantry replacements from FATO"
 GEB_fsb_reply_geb_infantry_accept_desc:0 "Spend 10 political power and 1 institutional capacity to authorise this specific consignment. FATO must still deliver actual stock before the original deadline. Acceptance gives no equipment, alignment or reward by itself. The receiving authority may revoke before dispatch."
