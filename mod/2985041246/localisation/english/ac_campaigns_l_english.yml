 ac_camp.110.t:0 "A familiar surname"
 ac_camp.110.desc:0 "The residents have learned that a familiar surname can turn a routine question into an interview. A civil file records conduct, dates and witnesses. A rumor can dispense with all three. Protecting civil procedures takes authority away from people who promise quick certainty. A security review keeps more discretion inside the administration while making the integrity of the individual investigator harder to replace. The campaign preserves specific evidence and commitments without making the surrounding population responsible for the existence of a covert network."
 ac_camp.110.a:0 "Circulate a public receiving account."
 ac_camp.110.b:0 "Keep a signed professional return."
