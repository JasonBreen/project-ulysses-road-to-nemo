 ustio_grzegorz.1.t: "Grzegorz's Victory...?"
 ustio_grzegorz.1.d: "A tired, yet thrilled man walked right into his office. A refined chair awaited him. \n\nIn all honesty, he did somewhat expect this outcome, and he wouldn"t have minded the opposite. His largest work, the birth of the republic, had been complete. Now all that remained was the security of the state, and a strong future for the people. \n\nYesterday, he"d spent hours upon hours daydreaming the future, wondering just how he"d ensure he"d succeed. It's not like spacing out was particularly hard anyways, especially for a dreamer like the man himself. But to the sound of praises from the television screen as news reporters announce his victory, he simply sat and pondered the future."
 ustio_grzegorz.1.a: "Back again... What now?"
 
 ustio_grzegorz.2.t: "Back Again... What now?"
 ustio_grzegorz.2.d: "The father of the nation slouched back in his refined chair. To the outside public, he could only ever be seen with a straight back, a stern yet strong and warm smile, as well an aura of complete trust and motivation. \n\nClocks keep ticking in the corner of his room. How long had it been since his greatest work? Felt like a second and an eternity at the same time. And how long would he remain in this chair? One term? Two? Several? Would he even die in it? \n\nAll that there is to focus on anyways, is the now. Whilst he does stay, he will ensure that every man woman and child that he can ensure the welfare of, will remain smiling for the future, unlike the times long gone. But... \n\nGod was it so tiring."
 ustio_grzegorz.2.a: "No rest for the weary."
 
 ustio_grzegorz.3.t: "What is Freedom?"
 ustio_grzegorz.3.d: ""Freedom is not just a word." \n\nThe father of the nation steadied himself. A quickly composed guideline for a speech had been hasitly redrafted several times over the past week as an address to the nation. He wished he could make it longer, he wished he could talk for years about his plans for a central efficient state, a land of no neglect, and a thwart against whatever outer powers may try to once more have their way with the mountain nation. But there was no way he"d fit every single one of his plans onto a piece of paper, and no way he"d manage to disclose all he wanted. No matter how many times he tried. \n\n This was his 67th redraft. \n\n "Freedom is the right of a man to live detached of dread. Freedom is NOT the ability for a man to do all he wills." \n\nFreedom. That was the gist of his plans. \n\nHe"d decided to take a more metaphoric approach to his address. He wouldn"t facilitate people to do as they pleased whilst he was up at the top, but he"d make sure that people were free from the woes of society. \n\n"The times ahead are laced and peppered with all that is required for a future filled with freedom. Freedom from poverty. Freedom from slavery. Freedom from the overarching fear of the death of humanity within a person. That is what is to-" \n\nWell, he never intended on keeping it short..."
 ustio_grzegorz.3.a: "But eternal cheering forced him to."
 
 ustio_grzegorz.4.t:"Security?"
 ustio_grzegorz.4.d: ""With co-operation we can remain independent. With independence, we can retain rights. With rights, we can achieve happiness." The father once again was mapping out his general thoughts. \n\nThe republic had just been born a few years earlier. Not that the nation had no history, but a lot of that history involves remaining under the occupation of a large foreign northern power, the Belkan Federation. \n\n"...Never again." \n\nThe vow that every man in the nation took, to never again let the Belkans crush the free spirit of the mountains. The peaks were sacred, and they had been desecrated by Dinsmark. That could just as easily happen again. \n\n"There's no other option. We need co-operation." \n\nGrzegorz never was one to shove responsibility on others, away from himself. Truthfully, he somewhat mistrusted the world after his early years, and couldn"t imagine a future for the country where he wasn"t there. But he couldn"t protect the country alone. Without help, Ustio could only rely on god to defend the nation. The Belkan army was still a formidable force, and Ustio's own was quite motivated, but reports from Dolas show an extreme lack of readiness for war. So, just in case... \n\n"Osean Federation. Please...""
 ustio_grzegorz.4.a: ""Please Save Us.""
 
 ustio_grzegorz.5.t: "A Good Deed?"
 ustio_grzegorz.5.d: ""I don"t think you quite understand." \n\nThe father of the nation buried his heads into his hands. Across his desk, was his best friend, and effective head of the armed forces, Franke Dolas, who spoke again. \n\n"You"re beloved by the whole nation. Your people are living a better life than they could ever have dreamt of. Your opposition can"t even lift a finger to criticise you. This is quite funnily, the most democratic step forwards."" \n\nGrzegorz looked down at the proposition that he had written up. He"d made thousands of bills and every single one had passed with a very firm strong majority. There was no doubt in his mind that this would follow the same path. Effectively, he was the legislative and the executive. The only question of passing legislature was if he wanted to pass it. \n\n"These powers are... Practically dictatorial." He stammered. "Franke, you know I actually just want to resign and retire to an estate outside of Directus or whatever." \n\n"They are, but they"d only last your term. When you"re done, you can just as simply go and vanish afterwards... Though I doubt you"ll live a peaceful life whatever you do." \n\nDolas was right. All hopes of a peaceful life were gone the moment he gathered a following many years ago. But that wasn"t the point. \n\n"Do I have the right...?" \n\n"That's not a question for me, but for yourself." \n\nHe knew that. He knew that whatever he did, it would be accepted. He knew it all, so why didn"t he know his answer...? \n\nThe clocks kept ticking. He spoke up."
 ustio_grzegorz.5.a: ""I"ll propose it tommorow.""
 ustio_grzegorz.5.b: ""I"ll have to... Think it over later..."
 
 ustio_grzegorz.6.t: "Back in time?"
 ustio_grzegorz.6.d: ""I"m done." \n\nA large tall figure brandishing glasses and a physicians badge placed his coffee cup on his desk. Softly, he spoke again. \n\n"There's no use in arguing, everything that he does for us is the right chioce. We have had no culture, no voice, no national spirit, for centuries. It's important to reintroduce these to our youth, and he's correct. But from my end... I cannot continue to live the life I wanted in this industry if I cannot keep time with the students." \n\nAcross from him, was his teaching assistant, who simply stood there, absorbing everything she heard, shocked. This teacher had taught the brightest youth of Ustio, bringing up entire generations of physicians. Years ago he vowed to teach until he would die. \n\n"I think with this, it's time for me to go back into the industry, rather than into teaching. Less time with the youth means I can"t teach as effectively. We can"t go into as heavy courses as we could under the hyper-STEM focused Belkans. I guess what I"m trying to say is..." \n\n"You"re a specialised heavy teacher, not a general teacher?" \n\nThe TA hit the nail on the head with that one. "With this reform, whole national ciriculums will change. And that's okay. I just won"t be able to keep with it. Perhaps one of the final things that remained from Belkan occupation was the heavy scientific school system. If we really want to be free...""
 ustio_grzegorz.6.a: ""It's time to look back.""
 
 ustio_morka.1.t: "Against all odds..."
 ustio_morka.1.d: "Kuba Morkawiecki couldn"t believe it, as he sat upright in his refurbished presidential chair, taking in the sights around him. Against all odds, he had triumphed in the election against the father of the nation. Truthfully, he"d already resigned himself to a loss internally. But the business connections and promises of freedom to act and liberty of will seemed to capture the hearts and minds of the Ustian population after years of restriction. \n\nPerhaps this was better. Of course his opponent was a good man, and Kuba recognised this, but there was one major difference between the two. The father wanted every man to be free from agony, oppression, bondage and the like, whereas Kuba wanted every man to be free to act, produce, and live. \n\nRather than a regulated shelter, the time has come for Ustio to be a shining beacon of liberty amongst the mountians. And would all all start in this chair."
 ustio_morka.1.a: "Freedom eternal?"
 
 ustio_morka.2.t: "Mental Fortress"
 ustio_morka.2.d: "This was not at all according to the plan... \n\nIt was meant to go like this: \nThe population of Ustio votes Morkawiecki in, he gives them the deregulation they want, fufills his promises, earns the trust of the people, and everyone lives free and happily ever after. \n\nHe did not realise just how extensively popular the social safety nets the father had set up really were. God, even proposing to get rid of one in government was a hassle to convince his own party, let alone the opposition. But he would do it. \n\nSo he rose before he spoke and cleared his throat. A carefully prepared speech thought out, addressing the state of the republic and the path forwards. A statement endorsing liberty, capital, freedom. A statement endorsing the right of a free man to persue the happiness he wishes without being held back by any form of tyranny, malicious or benevolent. It was a clear jab at the ideals of the previous administration, and a complete gamble. But to mark a new administration and to create the Ustio that Kuba has conceptualised, especially after everyone has burnt hearts into the father, a drastic shake-up is required. \n\nHe opens his mouth,"
 ustio_morka.2.a: ""Good men don"t always do good things.""
 
 ustio_morka.3.t: "The Visible Brick Wall of the Free Market"
 ustio_morka.3.d: "Kuba's head was buried into his hands. He was practically bawling like a baby at this point. God, socio-economic reform after drastic changes were already made have proven so much more the challenge than expected. Even presidents have their limits. \n\nIt's not like Kuba thought it would be easy, but with every single person in the entire nation, hell, the whole of Strangereal doubting your abilities or your plans, you can"t help but feel a bit demoralised. \n\nA couple more tears fell onto the desk. It"d taken whole entire days without sleep, packed with stress and paperwork, meetings, speeches, persuasion, coercion, every trick in the book to even put forwards the slightest bit of liberal economic reform. God, why did they even elect him? \n\nWell, he made a promise, and even if no one really wants him to follow through on that promise, he would follow through on it himself. No matter the cost."
 ustio_morka.3.a: "Ustio will be free."
 
 ustio_morka.4.t: "An Argument Against Tyranny"
 ustio_morka.4.d: ""Not all presidents in future will be benevolent." Kuba recites yet another speech for yet another governing session for yet another round of lobbying, convincing, persuading, and praying, that representitives will listen to his calls to abolish tyranny. \n\nNot that Ustio was by any means a dictatorship, but in Kuba's eyes, there was far to much power in a central government, that could easily funnel funds straight to Directus and siphon everything else, through clever maneouvring. Such a future had to be stopped, and so here was the president, making another speech about devolution. \n\n"No one can be certain that another Naruszewicz will arise. He is a good man, and I have zero doubt that he has a bad bone within his body. However, his mistake as not preparing Ustio for a future where he is not steering the wheel. \n\nWhat happens then, when a malicious tyrant takes such a powerful office as the one I"m in, and promises greatness for Directus whilst neglecting the nation? I"m certain that many of you would be inclined to follow through with them, leaving the gaps within the nation wide. \n\nI do not want freedom to exploit. My proposal is that no one is left neglected.""
 ustio_morka.4.a: "New plans?"
 
 ustio_morka.5.t: "Forwards in time?"
 ustio_morka.5.d: ""I"m done." \n\nA large tall figure brandishing classes and a physicians badge placed his coffee cup on his desk. He grinned and spoke again. \n\n"I"ve done it. I"ve finally done it." \n\nHardly containing his excitement, he clenched his hands into fists of joy and success. Happy as a little kid, giddy as a drunken man, he breathed in and out to control and steady himself. \n\n"I can now die peacefully. I"ve done it! I"ve brought up my golden generation of scientists, of doctors and professors, to take my stead and move forwards, to bring Ustio into a new technological golden age. No longer do I need to abide by some strict set of rules and regulations, I can transfer everything I know to the future! I"ve done it!" \n\nHis teaching assistant stood in front of him, visibly relieved. The teacher himself raised his chalk to the board behind him and began to scribble a set of characters. The pure happiness expressed by the man could be felt just by looking at the words. \n\n"And here are the grades achieved from this cohort, and the predicted from the next... It's all up for our country from here. We will never again be siphoned from intellect, we will forever be enlightened!""
 ustio_morka.5.a: "Onwards, to inevitable progress!"
 
 ustio_morka.6.t: "A March of Support?"
 ustio_morka.6.d: "Kuba stared into the television screen. This was... Unexpected. Never before had so many people at once come out to express their support for Kuba's reforms. \n\nWas the man dreaming? Had the day finally come, where he wouldn"t have to be the only one fighting for liberty? Shocking. \n\n"Morka's free-rule push is essential if we can even begin to consider ourselves a free country!" One of the marchers spoke, for once in support of the president. "To restrict a man goes against the very concept of liberty, of freedom!" \n\nWell yeah that was one thing, but the other was that illegal goods are just a pain in the back to regulate... But the spirit is right. \n\nLooks like finally, the spirit of freedom and common sense had been knocked into the people of Ustio. A future autocracy could be avoided. The republic would be a free state, for free men, living free lives."
 ustio_morka.6.a: "For Liberty."
 
