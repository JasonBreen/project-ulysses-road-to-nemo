 ac_camp.43.t:0 "The same window"
 ac_camp.43.desc:0 "The first thing the porter noticed was that people had begun speaking at their ordinary volume. He stood on the clinic steps and listened to two neighbors disagree about where a vehicle should be parked. Neither lowered his voice when armed men passed at the end of the street.\n\nThe city was under San Salvacion's control again. The new patrol had a local authority to answer to, and the administrator could ask for its instructions without first explaining his own right to remain in the building. He brought the occupation file out of its box and placed it beside the new receiving instructions. There were permissions to compare, questions to pursue, and people whose absence had survived every change of authority.\n\nThe woman who had asked about her brother came after midday. The pharmacist recognized a folded copy of the letter in her hand. The new office might be able to ask different questions. It would still have to begin with what was known, and it would have to tell her when there was no answer.\n\nThe baker arrived carrying a repaired chair. He said he wanted his stool back now that the room could afford to be properly furnished. The nurse laughed, and then stopped because she had not expected to hear herself do it.\n\nOutside, somebody was taking the old notices down. The porter asked them to leave the opening hours. The paper was worn and the ink had faded, but there had been mornings when keeping it on the door was the only promise the people inside could still make."
 ac_camp.43.a:0 "Keep this account."
 ac_camp.43.z:0 "Close this old message."
