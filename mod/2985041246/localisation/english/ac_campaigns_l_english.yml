 ac_camp.40.t:0 "The aircraft left in the hangar"
 ac_camp.40.desc:0 "The maintenance chief had expected another argument. She had kept the original fault return on the bench so that nobody could pretend the decision had been made from a single complaint. When the order finally arrived, it contained three plain words: Retain for repair.\n\nYellow Four had been furious about the decision before she knew what it would spare her. The paperwork described an aircraft withheld from a sortie, the maintenance hours required to make that decision useful, and an operational demand accepted elsewhere because somebody had agreed to disappoint the briefing room. The chief had signed the return while the argument was still about an aircraft, before it became an argument anybody wanted to have about a person.\n\nThe pilot read the return without thanking anyone immediately. Gratitude would have made the argument sound settled. There were still friends flying the missions she had not flown, and a squadron whose losses could not be moved into somebody else's column.\n\nOutside the hangar, an officer was asking which reserve aircraft could be released next. The chief pointed him toward the serviceability board. Its figures were lower than the operations staff wanted. They were also figures she could sign.\n\nThe war would continue to ask what a pilot owed the people beside her. This branch had preserved a person at the cost of a capability the command had wanted to use. It left her alive to discover what that decision would mean after the reputation of the squadron and the fate of the country ceased to move together."
 ac_camp.40.a:0 "Keep this account."
 ac_camp.40.z:0 "Close this old message."
