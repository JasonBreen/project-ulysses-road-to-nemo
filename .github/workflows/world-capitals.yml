name: World capital ownership

on:
  push:
  pull_request:

jobs:
  capitals:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 numpy==2.2.6
      - name: Verify owned capitals and reproducible geographic fallback
        run: python -B tools/Test-WorldCapitals.py
      - name: Verify registry and foundation reproducibility on this platform
        run: python -B tools/world_foundation/test_foundation.py
      - name: Verify additive active-world geometry and captured technical contracts
        run: python -B tools/world_starts/test_world_starts.py
      - name: Verify actual selected forces and personnel liability report
        run: python -B tools/world_starts/personnel.py --check
      - name: Verify inherited-force logistics and exact integrated source receipts
        run: python -B tools/world_starts/test_legacy_logistics.py --require-integrated-owner
      - name: Verify legacy force projections and generated source consistency
        run: python -B tools/world_legacy/test_legacy.py
      - name: Verify all 61 active physical owners and selected starting branches
        run: python -B tools/world_starts/coverage.py --check --require-integrated-owner
      - name: Verify dormant release contracts and explicit setup-owner gaps
        run: python -B tools/world_starts/release_inventory.py --check
