 ERU_lw_sovereignty_policy_a_spirit:0 "Treaty obligations kept"
 ERU_lw_sovereignty_policy_a_spirit_desc:0 "Erusea will keep every treaty obligation it accepted in 2005 and publish its compliance each year. The policy costs the government political room whenever a minister wants to act first and explain later, and it gives Erusea's partners a record they can hold the republic to."
 ERU_lw_sovereignty_policy_a_spirit_settled:0 "Treaty obligations kept: Standing Settlement"
 ERU_lw_sovereignty_policy_a_spirit_settled_desc:0 "The settlement records what the republic now does on its own authority and what it has undertaken to go on doing. It is a sovereignty with accounts: the chosen policy stands, and its continuing cost is written down beside it. The continuing opportunity cost remains."
 ERU_lw_sovereignty_policy_b_spirit:0 "A republic rearmed"
 ERU_lw_sovereignty_policy_b_spirit_desc:0 "Erusea will rebuild the forces the oversight years ran down, within the letter of its obligations and at the edge of their spirit. The army and navy regain organisation and confidence; the civilian budget and the republic's standing with its partners pay for it."
 ERU_lw_sovereignty_policy_b_spirit_settled:0 "A republic rearmed: Standing Settlement"
 ERU_lw_sovereignty_policy_b_spirit_settled_desc:0 "The settlement records what the republic now does on its own authority and what it has undertaken to go on doing. It is a sovereignty with accounts: the chosen policy stands, and its continuing cost is written down beside it. The continuing opportunity cost remains."
 ERU_lw_sovereignty_register:0 "Close the Oversight File"
 ERU_lw_sovereignty_register_desc:0 "Fifteen years after the surrender, the oversight instruments of 2005 are still on the books, most of them dormant. Before the republic declares itself fully sovereign again, the cabinet will list every duty that still carries a foreign countersignature and every undertaking Erusea gave in exchange for its return to self-government."
 ERU_lw_sovereignty_policy_a:0 "Treaty Obligations Kept"
 ERU_lw_sovereignty_policy_a_desc:0 "Erusea will keep every treaty obligation it accepted in 2005 and publish its compliance each year. The policy costs the government political room whenever a minister wants to act first and explain later, and it gives Erusea's partners a record they can hold the republic to."
 ERU_lw_sovereignty_policy_b:0 "A Republic Rearmed"
 ERU_lw_sovereignty_policy_b_desc:0 "Erusea will rebuild the forces the oversight years ran down, within the letter of its obligations and at the edge of their spirit. The army and navy regain organisation and confidence; the civilian budget and the republic's standing with its partners pay for it."
 ERU_lw_sovereignty_operations:0 "Return the Last Countersignatures"
 ERU_lw_sovereignty_operations_desc:0 "The last oversight countersignatures will be returned to Erusean offices on a published schedule, each with a receiving official who answers for it. The handover is administrative, not ceremonial, and it is complete only when the partners confirm it."
 ERU_lw_sovereignty_review:0 "Review a Sovereignty Service Period"
 ERU_lw_sovereignty_review_desc:0 "A completed, funded service period under the chosen policy must be examined before the republic calls its sovereignty settled. The review compares the obligations kept, the forces rebuilt and the duties returned with what the cabinet promised."
 ERU_lw_sovereignty_settlement:0 "A Sovereignty With Accounts"
 ERU_lw_sovereignty_settlement_desc:0 "The settlement records what the republic now does on its own authority and what it has undertaken to go on doing. It is a sovereignty with accounts: the chosen policy stands, and its continuing cost is written down beside it."
 ERU_lw_standing_policy_a_spirit:0 "Settled border policy"
 ERU_lw_standing_policy_a_spirit_desc:0 "Erusea will treat its postwar lines as settled and say so to every neighbour. The policy lowers the cost of the border and the temperature of the continent; it also gives up the leverage that an unsettled line provides."
 ERU_lw_standing_policy_a_spirit_settled:0 "Settled border policy: Standing Settlement"
 ERU_lw_standing_policy_a_spirit_settled_desc:0 "The settlement fixes the republic's position for the decade ahead. It does not reproduce the official record's 2019 war, which this history never reached, and it does not invent another. It leaves a government that knows what it stands for. The continuing opportunity cost remains."
 ERU_lw_standing_policy_b_spirit:0 "Watchful border policy"
 ERU_lw_standing_policy_b_spirit_desc:0 "Erusea will keep its lines under watch and its claims open, without pressing them. Commanders keep their options and the government its leverage, at a continuing cost in money and in the neighbours' trust."
 ERU_lw_standing_policy_b_spirit_settled:0 "Watchful border policy: Standing Settlement"
 ERU_lw_standing_policy_b_spirit_settled_desc:0 "The settlement fixes the republic's position for the decade ahead. It does not reproduce the official record's 2019 war, which this history never reached, and it does not invent another. It leaves a government that knows what it stands for. The continuing opportunity cost remains."
 ERU_lw_standing_register:0 "Take Stock of the Decade"
 ERU_lw_standing_register_desc:0 "The Continental War did not end with an ISAF victory in this history, and the road the official record describes for 2019 does not run through this republic. The cabinet will take stock of the decade on its own terms: what Erusea holds, what it owes and what its neighbours expect of it."
 ERU_lw_standing_policy_a:0 "A Settled Border Policy"
 ERU_lw_standing_policy_a_desc:0 "Erusea will treat its postwar lines as settled and say so to every neighbour. The policy lowers the cost of the border and the temperature of the continent; it also gives up the leverage that an unsettled line provides."
 ERU_lw_standing_policy_b:0 "A Watchful Border Policy"
 ERU_lw_standing_policy_b_desc:0 "Erusea will keep its lines under watch and its claims open, without pressing them. Commanders keep their options and the government its leverage, at a continuing cost in money and in the neighbours' trust."
 ERU_lw_standing_operations:0 "Publish the Republic's Position"
 ERU_lw_standing_operations_desc:0 "The republic will publish its position on each outstanding question with a neighbour: what it claims, what it concedes and what it will negotiate. A published position can be held to; it also removes the convenience of ambiguity."
 ERU_lw_standing_review:0 "Review a Standing Service Period"
 ERU_lw_standing_review_desc:0 "A completed, funded service period under the chosen policy must be reviewed before the position becomes doctrine. The review asks whether the neighbours answered, whether incidents fell and whether the republic's costs matched its words."
 ERU_lw_standing_settlement:0 "A Republic on Its Own Terms"
 ERU_lw_standing_settlement_desc:0 "The settlement fixes the republic's position for the decade ahead. It does not reproduce the official record's 2019 war, which this history never reached, and it does not invent another. It leaves a government that knows what it stands for."
 ERU_lw_elevator_policy_a_spirit:0 "Shared-project partnership"
 ERU_lw_elevator_policy_a_spirit_desc:0 "Erusea will take its place in the joint management of the elevator and its projects as one partner among several. The partnership brings investment and a seat at the table; it also binds the republic to decisions it does not control."
 ERU_lw_elevator_policy_a_spirit_settled:0 "Shared-project partnership: Standing Settlement"
 ERU_lw_elevator_policy_a_spirit_settled_desc:0 "The settlement puts Erusea's elevator policy on record. It names the joint projects the republic takes part in and the ones it watches, and it does not decide the war the official record places in 2019. That decision belongs to the Lighthouse War owner. The continuing opportunity cost remains."
 ERU_lw_elevator_policy_b_spirit:0 "Sovereign project posture"
 ERU_lw_elevator_policy_b_spirit_desc:0 "Erusea will treat the elevator's shadow as a matter of sovereign interest and keep its own posture around it. The posture reassures the republic's own public and its armed forces; it costs the republic goodwill in the joint management and money at home."
 ERU_lw_elevator_policy_b_spirit_settled:0 "Sovereign project posture: Standing Settlement"
 ERU_lw_elevator_policy_b_spirit_settled_desc:0 "The settlement puts Erusea's elevator policy on record. It names the joint projects the republic takes part in and the ones it watches, and it does not decide the war the official record places in 2019. That decision belongs to the Lighthouse War owner. The continuing opportunity cost remains."
 ERU_lw_elevator_register:0 "Survey the Space Elevator's Shadow"
 ERU_lw_elevator_register_desc:0 "The International Space Elevator stands within reach of Erusean territory and under a joint international management. The cabinet will record what the project means for the republic: the traffic it brings, the obligations it carries and the questions nobody has asked in public."
 ERU_lw_elevator_policy_a:0 "A Shared-Project Partnership"
 ERU_lw_elevator_policy_a_desc:0 "Erusea will take its place in the joint management of the elevator and its projects as one partner among several. The partnership brings investment and a seat at the table; it also binds the republic to decisions it does not control."
 ERU_lw_elevator_policy_b:0 "A Sovereign Project Posture"
 ERU_lw_elevator_policy_b_desc:0 "Erusea will treat the elevator's shadow as a matter of sovereign interest and keep its own posture around it. The posture reassures the republic's own public and its armed forces; it costs the republic goodwill in the joint management and money at home."
 ERU_lw_elevator_operations:0 "Audit the Joint Accounts"
 ERU_lw_elevator_operations_desc:0 "The joint accounts of the shared projects will be audited by Erusean officials with the partners' consent. An audit answers the question of who pays and who benefits; it may also produce the grievance the official record says Erusea later voiced."
 ERU_lw_elevator_review:0 "Review an Elevator Service Period"
 ERU_lw_elevator_review_desc:0 "A completed, funded service period under the chosen posture must be examined before the republic's elevator policy becomes doctrine. The review compares what the partnership delivered or what the posture cost with the figures in the audit."
 ERU_lw_elevator_settlement:0 "An Elevator Policy on Record"
 ERU_lw_elevator_settlement_desc:0 "The settlement puts Erusea's elevator policy on record. It names the joint projects the republic takes part in and the ones it watches, and it does not decide the war the official record places in 2019. That decision belongs to the Lighthouse War owner."
 ERU_lw_alicorn_policy_a_spirit:0 "Royal Navy programme"
 ERU_lw_alicorn_policy_a_spirit_desc:0 "The Royal Navy will run the programme from design to commissioning. The navy keeps its requirements intact and its secrets close; the civilian budget and the cabinet's oversight pay for a programme nobody outside the fleet can audit."
 ERU_lw_alicorn_policy_a_spirit_settled:0 "Royal Navy programme: Standing Settlement"
 ERU_lw_alicorn_policy_a_spirit_settled_desc:0 "The settlement fixes the custody rules for the Alicorn and the programme that builds it. It commissions no voyage and fires no railgun. The Super Weapons record says the boat disappeared during a sea trial; this campaign records nothing of the kind by script. The continuing opportunity cost remains."
 ERU_lw_alicorn_policy_b_spirit:0 "Civil shipyard programme"
 ERU_lw_alicorn_policy_b_spirit_desc:0 "A civil shipyard will build the hull under naval specification and civilian accounts. The programme is cheaper and better documented, and the navy will say, correctly, that a cruiser built in public is a cruiser the enemy knows."
 ERU_lw_alicorn_policy_b_spirit_settled:0 "Civil shipyard programme: Standing Settlement"
 ERU_lw_alicorn_policy_b_spirit_settled_desc:0 "The settlement fixes the custody rules for the Alicorn and the programme that builds it. It commissions no voyage and fires no railgun. The Super Weapons record says the boat disappeared during a sea trial; this campaign records nothing of the kind by script. The continuing opportunity cost remains."
 ERU_lw_alicorn_register:0 "Authorise the Submarine Cruiser"
 ERU_lw_alicorn_register_desc:0 "The Erusean Royal Navy's Rán Fleet has asked for a submarine aviation cruiser: a nuclear-powered boat that is both a carrier and a long-range railgun platform, designed to strike while submerged and beyond an enemy's reach. The Super Weapons record names it the Alicorn. Before any keel is laid, the cabinet will decide who builds it and who answers for it."
 ERU_lw_alicorn_policy_a:0 "A Royal Navy Programme"
 ERU_lw_alicorn_policy_a_desc:0 "The Royal Navy will run the programme from design to commissioning. The navy keeps its requirements intact and its secrets close; the civilian budget and the cabinet's oversight pay for a programme nobody outside the fleet can audit."
 ERU_lw_alicorn_policy_b:0 "A Civil Shipyard Programme"
 ERU_lw_alicorn_policy_b_desc:0 "A civil shipyard will build the hull under naval specification and civilian accounts. The programme is cheaper and better documented, and the navy will say, correctly, that a cruiser built in public is a cruiser the enemy knows."
 ERU_lw_alicorn_operations:0 "Set the Custody Rules"
 ERU_lw_alicorn_operations_desc:0 "Custody rules will be written before the boat exists: who may order it to sea, who may order it to fire and what record each order leaves. A weapon designed to disappear needs rules written while it is still on paper."
 ERU_lw_alicorn_review:0 "Review a Cruiser Service Period"
 ERU_lw_alicorn_review_desc:0 "A completed, funded service period under the chosen programme must be reviewed before the cabinet accepts the cruiser into service. The review asks whether the custody rules held during trials and whether the accounts match the hull."
 ERU_lw_alicorn_settlement:0 "Custody Rules for the Cruiser"
 ERU_lw_alicorn_settlement_desc:0 "The settlement fixes the custody rules for the Alicorn and the programme that builds it. It commissions no voyage and fires no railgun. The Super Weapons record says the boat disappeared during a sea trial; this campaign records nothing of the kind by script."
 ERU_lw_drones_policy_a_spirit:0 "Unmanned strike doctrine"
 ERU_lw_drones_policy_a_spirit_desc:0 "Erusea will make unmanned aircraft the core of its air power: mass, range and the willingness to lose airframes. The doctrine multiplies sorties and divides the risk to aircrew; it costs the air force its traditions and the republic the question of who is responsible when a machine chooses."
 ERU_lw_drones_policy_a_spirit_settled:0 "Unmanned strike doctrine: Standing Settlement"
 ERU_lw_drones_policy_a_spirit_settled_desc:0 "The settlement puts the doctrine on record with its rules of engagement attached. It fields no strike and attributes none; it leaves the republic an air force that knows what its machines are allowed to do. The continuing opportunity cost remains."
 ERU_lw_drones_policy_b_spirit:0 "Manned-primary doctrine"
 ERU_lw_drones_policy_b_spirit_desc:0 "Erusea will keep pilots at the centre and use unmanned aircraft as their escorts and sensors. The doctrine preserves judgment in the cockpit and the air force's identity; it forgoes the mass that an unmanned fleet provides."
 ERU_lw_drones_policy_b_spirit_settled:0 "Manned-primary doctrine: Standing Settlement"
 ERU_lw_drones_policy_b_spirit_settled_desc:0 "The settlement puts the doctrine on record with its rules of engagement attached. It fields no strike and attributes none; it leaves the republic an air force that knows what its machines are allowed to do. The continuing opportunity cost remains."
 ERU_lw_drones_register:0 "Charter an Unmanned Aviation Programme"
 ERU_lw_drones_register_desc:0 "Unmanned aircraft are cheaper than pilots and need no funerals. The Chronicle records that the Lighthouse War opened with drone strikes on four Osean naval ports; it does not say whose drones they were, and this campaign does not. Before Erusea builds a programme, the cabinet will decide what it is for."
 ERU_lw_drones_policy_a:0 "An Unmanned Strike Doctrine"
 ERU_lw_drones_policy_a_desc:0 "Erusea will make unmanned aircraft the core of its air power: mass, range and the willingness to lose airframes. The doctrine multiplies sorties and divides the risk to aircrew; it costs the air force its traditions and the republic the question of who is responsible when a machine chooses."
 ERU_lw_drones_policy_b:0 "A Manned-Primary Doctrine"
 ERU_lw_drones_policy_b_desc:0 "Erusea will keep pilots at the centre and use unmanned aircraft as their escorts and sensors. The doctrine preserves judgment in the cockpit and the air force's identity; it forgoes the mass that an unmanned fleet provides."
 ERU_lw_drones_operations:0 "Write the Rules of Engagement"
 ERU_lw_drones_operations_desc:0 "Rules of engagement for unmanned aircraft will be written before the programme fields them: what a machine may attack on its own, what needs a human order and what record the decision leaves. The official abstract records that Erusea proclaimed a 'clean war'; the rules are what such a claim would have to rest on."
 ERU_lw_drones_review:0 "Review a Drone Service Period"
 ERU_lw_drones_review_desc:0 "A completed, funded service period under the chosen doctrine must be reviewed before it becomes the air force's standing practice. The review compares the sorties flown, the rules applied and the incidents recorded."
 ERU_lw_drones_settlement:0 "A Doctrine on Record"
 ERU_lw_drones_settlement_desc:0 "The settlement puts the doctrine on record with its rules of engagement attached. It fields no strike and attributes none; it leaves the republic an air force that knows what its machines are allowed to do."
 ERU_lw_lighthouse_policy_a_spirit:0 "A fortress elevator"
 ERU_lw_lighthouse_policy_a_spirit_desc:0 "The elevator will be a fortress: its approaches fortified, its traffic stopped, its defences the republic's first line. The posture is clear and expensive, and it turns a shared civil project into the war's most obvious target."
 ERU_lw_lighthouse_policy_a_spirit_settled:0 "A fortress elevator: Standing Settlement"
 ERU_lw_lighthouse_policy_a_spirit_settled_desc:0 "The settlement decides the elevator's future after the fighting, whoever holds it then: fortress, facility or handover. The early-ceasefire record belongs to this lane. It changes nothing about who controls the elevator in the end; the war decides that. The continuing opportunity cost remains."
 ERU_lw_lighthouse_policy_b_spirit:0 "An elevator kept running"
 ERU_lw_lighthouse_policy_b_spirit_desc:0 "The elevator will be kept running under guard: civil traffic continued where it can be, the facility's staff kept at work, the defences kept out of the way. The posture preserves what the republic captured; it leaves the garrison exposed and the staff in the line of fire."
 ERU_lw_lighthouse_policy_b_spirit_settled:0 "An elevator kept running: Standing Settlement"
 ERU_lw_lighthouse_policy_b_spirit_settled_desc:0 "The settlement decides the elevator's future after the fighting, whoever holds it then: fortress, facility or handover. The early-ceasefire record belongs to this lane. It changes nothing about who controls the elevator in the end; the war decides that. The continuing opportunity cost remains."
 ERU_lw_lighthouse_register:0 "Garrison the Captured Elevator"
 ERU_lw_lighthouse_register_desc:0 "Erusean forces hold the International Space Elevator, as the Chronicle records for 15 May 2019. Holding it is not the same as running it. The cabinet will decide what the garrison is for: a fortress, or a facility kept working under Erusean guard."
 ERU_lw_lighthouse_policy_a:0 "A Fortress Elevator"
 ERU_lw_lighthouse_policy_a_desc:0 "The elevator will be a fortress: its approaches fortified, its traffic stopped, its defences the republic's first line. The posture is clear and expensive, and it turns a shared civil project into the war's most obvious target."
 ERU_lw_lighthouse_policy_b:0 "An Elevator Kept Running"
 ERU_lw_lighthouse_policy_b_desc:0 "The elevator will be kept running under guard: civil traffic continued where it can be, the facility's staff kept at work, the defences kept out of the way. The posture preserves what the republic captured; it leaves the garrison exposed and the staff in the line of fire."
 ERU_lw_lighthouse_operations:0 "Keep the Civil Traffic Moving"
 ERU_lw_lighthouse_operations_desc:0 "Civil traffic through the elevator will continue under published rules while the garrison holds it. Keeping the traffic moving is the republic's claim that it captured a facility rather than destroyed one, and every incident on the way will test that claim."
 ERU_lw_lighthouse_review:0 "Review an Elevator Garrison Period"
 ERU_lw_lighthouse_review_desc:0 "A completed, funded garrison period must be examined before the republic decides the elevator's future. The review compares the posture's cost with the traffic kept moving, the incidents recorded and the staff who stayed."
 ERU_lw_lighthouse_settlement:0 "The Elevator After the War"
 ERU_lw_lighthouse_settlement_desc:0 "The settlement decides the elevator's future after the fighting, whoever holds it then: fortress, facility or handover. The early-ceasefire record belongs to this lane. It changes nothing about who controls the elevator in the end; the war decides that."
 ERU_lw_capital_policy_a_spirit:0 "A capital under arms"
 ERU_lw_capital_policy_a_spirit_desc:0 "The capital will be put under arms: its approaches fortified, its districts organised for defence, its government ready to move. The policy gives the defenders their best chance and the city's residents the worst of both worlds."
 ERU_lw_capital_policy_a_spirit_settled:0 "A capital under arms: Standing Settlement"
 ERU_lw_capital_policy_a_spirit_settled_desc:0 "The settlement records a capital that kept working, under arms or open, through the attack the Chronicle places in September 2019. It changes no territory; it leaves a government that knows how it governed under fire. The continuing opportunity cost remains."
 ERU_lw_capital_policy_b_spirit:0 "A capital kept open"
 ERU_lw_capital_policy_b_spirit_desc:0 "The capital will be kept open: ministries working, courts sitting, markets trading, with the defence held outside the city as long as it can be. The policy keeps the republic governing; it stakes the government's survival on lines it may not hold."
 ERU_lw_capital_policy_b_spirit_settled:0 "A capital kept open: Standing Settlement"
 ERU_lw_capital_policy_b_spirit_settled_desc:0 "The settlement records a capital that kept working, under arms or open, through the attack the Chronicle places in September 2019. It changes no territory; it leaves a government that knows how it governed under fire. The continuing opportunity cost remains."
 ERU_lw_capital_register:0 "Prepare the Capital's Defence"
 ERU_lw_capital_register_desc:0 "Farbanti is the Erusean capital, and the Chronicle records an Osean offensive against it that failed in May 2019 and an attack that began in September. The cabinet will prepare the capital's defence now, before the record's dates arrive, and decide what the city is to be while the war lasts."
 ERU_lw_capital_policy_a:0 "A Capital Under Arms"
 ERU_lw_capital_policy_a_desc:0 "The capital will be put under arms: its approaches fortified, its districts organised for defence, its government ready to move. The policy gives the defenders their best chance and the city's residents the worst of both worlds."
 ERU_lw_capital_policy_b:0 "A Capital Kept Open"
 ERU_lw_capital_policy_b_desc:0 "The capital will be kept open: ministries working, courts sitting, markets trading, with the defence held outside the city as long as it can be. The policy keeps the republic governing; it stakes the government's survival on lines it may not hold."
 ERU_lw_capital_operations:0 "Keep the Ministries Working"
 ERU_lw_capital_operations_desc:0 "The ministries will keep working through the attack with the records and the staff that an evacuation would scatter. When the satellites fall and the networks go dark, as the Chronicle records for 19 September, the republic's ground relays and paper files will be what is left."
 ERU_lw_capital_review:0 "Review a Capital Service Period"
 ERU_lw_capital_review_desc:0 "A completed, funded service period under the chosen policy must be examined before the capital's wartime posture becomes permanent. The review compares the ministries that kept working with the districts that held and the cost of each."
 ERU_lw_capital_settlement:0 "A Capital That Kept Working"
 ERU_lw_capital_settlement_desc:0 "The settlement records a capital that kept working, under arms or open, through the attack the Chronicle places in September 2019. It changes no territory; it leaves a government that knows how it governed under fire."
 ERU_lw_ceasefire_policy_a_spirit:0 "A public accounting"
 ERU_lw_ceasefire_policy_a_spirit_desc:0 "The account will be public: the decisions, the orders, the strikes and the blunders, in a record the republic's own citizens and its partners can read. The policy restores standing abroad and costs the government at home, where every page is an argument."
 ERU_lw_ceasefire_policy_a_spirit_settled:0 "A public accounting: Standing Settlement"
 ERU_lw_ceasefire_policy_a_spirit_settled_desc:0 "The settlement is the republic after the Lighthouse War: its account rendered, its partners answered, its chosen degree of openness on record. It asserts no outcome the war did not reach and no treaty the republic did not sign. The continuing opportunity cost remains."
 ERU_lw_ceasefire_policy_b_spirit:0 "A protected accounting"
 ERU_lw_ceasefire_policy_b_spirit_desc:0 "The account will be protected: compiled in full, read by the cabinet and the courts, published in summary. The policy keeps the republic's secrets and its officers' names; it leaves the partners to draw their own conclusions."
 ERU_lw_ceasefire_policy_b_spirit_settled:0 "A protected accounting: Standing Settlement"
 ERU_lw_ceasefire_policy_b_spirit_settled_desc:0 "The settlement is the republic after the Lighthouse War: its account rendered, its partners answered, its chosen degree of openness on record. It asserts no outcome the war did not reach and no treaty the republic did not sign. The continuing opportunity cost remains."
 ERU_lw_ceasefire_register:0 "The War's Account"
 ERU_lw_ceasefire_register_desc:0 "The fighting is over, however it ended. The Chronicle records a ceasefire treaty signed at the Expo City Conference on 1 December 2019; this campaign records the end it actually reached. Either way, the republic owes itself an account of the war before it decides what comes after."
 ERU_lw_ceasefire_policy_a:0 "A Public Accounting"
 ERU_lw_ceasefire_policy_a_desc:0 "The account will be public: the decisions, the orders, the strikes and the blunders, in a record the republic's own citizens and its partners can read. The policy restores standing abroad and costs the government at home, where every page is an argument."
 ERU_lw_ceasefire_policy_b:0 "A Protected Accounting"
 ERU_lw_ceasefire_policy_b_desc:0 "The account will be protected: compiled in full, read by the cabinet and the courts, published in summary. The policy keeps the republic's secrets and its officers' names; it leaves the partners to draw their own conclusions."
 ERU_lw_ceasefire_operations:0 "Answer the Partners' Questions"
 ERU_lw_ceasefire_operations_desc:0 "The republic's partners will have questions, whether the war ended at Expo City or elsewhere. Each will be answered in writing by the office responsible, with the account as its basis. The answers are the republic's first postwar diplomacy."
 ERU_lw_ceasefire_review:0 "Review a Postwar Service Period"
 ERU_lw_ceasefire_review_desc:0 "A completed, funded service period of the accounting must be examined before the republic closes the war's file. The review asks whether the questions were answered, whether the account was read and what it changed."
 ERU_lw_ceasefire_settlement:0 "A Republic After the Lighthouse War"
 ERU_lw_ceasefire_settlement_desc:0 "The settlement is the republic after the Lighthouse War: its account rendered, its partners answered, its chosen degree of openness on record. It asserts no outcome the war did not reach and no treaty the republic did not sign."
 ERU_lw_secession_policy_a_spirit:0 "Negotiated autonomy"
 ERU_lw_secession_policy_a_spirit_desc:0 "Erusea will negotiate autonomy with the small nations: self-government within the republic, with the terms written down and the conflict ended by agreement. The policy costs the republic authority and some of its revenue; it ends the internal conflict without ending the republic."
 ERU_lw_secession_policy_a_spirit_settled:0 "Negotiated autonomy: Standing Settlement"
 ERU_lw_secession_policy_a_spirit_settled_desc:0 "The settlement records the republic's terms with the small nations as negotiated or restored. It releases no country, draws no border and moves no state; those remain the release contracts' business and the war's. The continuing opportunity cost remains."
 ERU_lw_secession_policy_b_spirit:0 "Restored authority"
 ERU_lw_secession_policy_b_spirit_desc:0 "Erusea will restore its authority over the small nations by administration and, where needed, by force. The policy keeps the republic whole and its army occupied; it turns the internal conflict into a standing obligation."
 ERU_lw_secession_policy_b_spirit_settled:0 "Restored authority: Standing Settlement"
 ERU_lw_secession_policy_b_spirit_settled_desc:0 "The settlement records the republic's terms with the small nations as negotiated or restored. It releases no country, draws no border and moves no state; those remain the release contracts' business and the war's. The continuing opportunity cost remains."
 ERU_lw_secession_register:0 "Answer the Declarations of Independence"
 ERU_lw_secession_register_desc:0 "The Chronicle records that the autonomous state of Shilage and other small nations annexed by the Kingdom of Erusea declared independence on 1 October 2019, that the Erusean government refused to recognise them and that internal conflict followed. This campaign changes no border on that date. The cabinet must answer the declarations with a policy."
 ERU_lw_secession_policy_a:0 "Negotiated Autonomy"
 ERU_lw_secession_policy_a_desc:0 "Erusea will negotiate autonomy with the small nations: self-government within the republic, with the terms written down and the conflict ended by agreement. The policy costs the republic authority and some of its revenue; it ends the internal conflict without ending the republic."
 ERU_lw_secession_policy_b:0 "Restored Authority"
 ERU_lw_secession_policy_b_desc:0 "Erusea will restore its authority over the small nations by administration and, where needed, by force. The policy keeps the republic whole and its army occupied; it turns the internal conflict into a standing obligation."
 ERU_lw_secession_operations:0 "Keep the Conflict Inside the Law"
 ERU_lw_secession_operations_desc:0 "The internal conflict will be fought, or settled, inside the law: arrests recorded, searches warranted, negotiations minuted. The republic's answer to secession is also the republic's answer to the question of what kind of state it is."
 ERU_lw_secession_review:0 "Review a Settlement Service Period"
 ERU_lw_secession_review_desc:0 "A completed, funded service period under the chosen policy must be examined before the republic calls the conflict settled. The review compares the terms agreed or the authority restored with the incidents recorded and the cost."
 ERU_lw_secession_settlement:0 "A Settlement With the Small Nations"
 ERU_lw_secession_settlement_desc:0 "The settlement records the republic's terms with the small nations as negotiated or restored. It releases no country, draws no border and moves no state; those remain the release contracts' business and the war's."
 FCU_lw_airspace_policy_a_spirit:0 "Closed airspace"
 FCU_lw_airspace_policy_a_spirit_desc:0 "Central Usean airspace will be closed to foreign military flight. The policy keeps the federation out of other people's wars and costs it the goodwill of partners who expected a route; it also makes every unidentified aircraft a decision."
 FCU_lw_airspace_policy_a_spirit_settled:0 "Closed airspace: Standing Settlement"
 FCU_lw_airspace_policy_a_spirit_settled_desc:0 "The settlement fixes the federation's airspace policy: closed or a corridor, with the rules and the record that go with it. It grants no membership of any force, no access to any base and no judgment about the war. The continuing opportunity cost remains."
 FCU_lw_airspace_policy_b_spirit:0 "A declared transit corridor"
 FCU_lw_airspace_policy_b_spirit_desc:0 "The federation will declare a transit corridor under published rules, open to any party that accepts them. The corridor earns the federation a role and a record; it also earns it the attention of every air force that wants the corridor's other end."
 FCU_lw_airspace_policy_b_spirit_settled:0 "A declared transit corridor: Standing Settlement"
 FCU_lw_airspace_policy_b_spirit_settled_desc:0 "The settlement fixes the federation's airspace policy: closed or a corridor, with the rules and the record that go with it. It grants no membership of any force, no access to any base and no judgment about the war. The continuing opportunity cost remains."
 FCU_lw_airspace_register:0 "Rule on the Continental Airspace"
 FCU_lw_airspace_register_desc:0 "Tensions between Osea and Erusea are rising over the elevator and the joint projects around it, and Central Usean airspace lies between them. The federation will decide, before anyone asks, what crosses its skies and on what terms."
 FCU_lw_airspace_policy_a:0 "Closed Airspace"
 FCU_lw_airspace_policy_a_desc:0 "Central Usean airspace will be closed to foreign military flight. The policy keeps the federation out of other people's wars and costs it the goodwill of partners who expected a route; it also makes every unidentified aircraft a decision."
 FCU_lw_airspace_policy_b:0 "A Declared Transit Corridor"
 FCU_lw_airspace_policy_b_desc:0 "The federation will declare a transit corridor under published rules, open to any party that accepts them. The corridor earns the federation a role and a record; it also earns it the attention of every air force that wants the corridor's other end."
 FCU_lw_airspace_operations:0 "Publish the Airspace Rules"
 FCU_lw_airspace_operations_desc:0 "The airspace rules will be published, with the office that administers them and the procedure for a violation. A published rule is the federation's protection against being accused of taking sides by silence."
 FCU_lw_airspace_review:0 "Review an Airspace Service Period"
 FCU_lw_airspace_review_desc:0 "A completed, funded service period under the chosen rules must be examined before the airspace policy becomes permanent. The review compares the flights recorded, the violations answered and the partners' complaints."
 FCU_lw_airspace_settlement:0 "An Airspace Policy on Record"
 FCU_lw_airspace_settlement_desc:0 "The settlement fixes the federation's airspace policy: closed or a corridor, with the rules and the record that go with it. It grants no membership of any force, no access to any base and no judgment about the war."
 FCU_lw_corridor_policy_a_spirit:0 "A corridor under federal escort"
 FCU_lw_corridor_policy_a_spirit_desc:0 "Federal forces will escort the corridor's convoys. The escort makes the corridor reliable and the federation a participant in everyone's eyes; a single incident will test how neutral an armed escort can be."
 FCU_lw_corridor_policy_a_spirit_settled:0 "A corridor under federal escort: Standing Settlement"
 FCU_lw_corridor_policy_a_spirit_settled_desc:0 "The settlement fixes the corridor's rules for as long as the fighting lasts and records what it carried. It changes no border and takes no side; it leaves the federation a procedure it can use the next time. The continuing opportunity cost remains."
 FCU_lw_corridor_policy_b_spirit:0 "A corridor under neutral flags"
 FCU_lw_corridor_policy_b_spirit_desc:0 "The corridor will run under neutral flags and the agreed rules of the belligerents, with federal staff unarmed. The arrangement keeps the federation out of the war and leaves the convoys to the belligerents' good faith."
 FCU_lw_corridor_policy_b_spirit_settled:0 "A corridor under neutral flags: Standing Settlement"
 FCU_lw_corridor_policy_b_spirit_settled_desc:0 "The settlement fixes the corridor's rules for as long as the fighting lasts and records what it carried. It changes no border and takes no side; it leaves the federation a procedure it can use the next time. The continuing opportunity cost remains."
 FCU_lw_corridor_register:0 "Open a Humanitarian Corridor"
 FCU_lw_corridor_register_desc:0 "The Lighthouse War has begun on the federation's doorstep. People and supplies will move whether the federation organises them or not. The cabinet will open a humanitarian corridor and decide whose flag protects it."
 FCU_lw_corridor_policy_a:0 "A Corridor Under Federal Escort"
 FCU_lw_corridor_policy_a_desc:0 "Federal forces will escort the corridor's convoys. The escort makes the corridor reliable and the federation a participant in everyone's eyes; a single incident will test how neutral an armed escort can be."
 FCU_lw_corridor_policy_b:0 "A Corridor Under Neutral Flags"
 FCU_lw_corridor_policy_b_desc:0 "The corridor will run under neutral flags and the agreed rules of the belligerents, with federal staff unarmed. The arrangement keeps the federation out of the war and leaves the convoys to the belligerents' good faith."
 FCU_lw_corridor_operations:0 "Register Every Convoy"
 FCU_lw_corridor_operations_desc:0 "Every convoy will be registered: cargo, route, escort and the office that cleared it. A corridor whose contents are recorded can answer the accusation that it carried something else."
 FCU_lw_corridor_review:0 "Review a Corridor Service Period"
 FCU_lw_corridor_review_desc:0 "A completed, funded corridor period must be examined before the federation renews it. The review counts the convoys that reached their end, the incidents recorded and the belligerents' complaints."
 FCU_lw_corridor_settlement:0 "A Corridor That Reached Its End"
 FCU_lw_corridor_settlement_desc:0 "The settlement fixes the corridor's rules for as long as the fighting lasts and records what it carried. It changes no border and takes no side; it leaves the federation a procedure it can use the next time."
 FCU_lw_blackout_policy_a_spirit:0 "Ground relays first"
 FCU_lw_blackout_policy_a_spirit_desc:0 "The federation will rebuild its communications on ground relays it owns: slower, local and beyond the reach of whoever shoots down satellites next. The policy is cheap to begin and expensive to finish, and it leaves the continent's long-range traffic to others."
 FCU_lw_blackout_policy_a_spirit_settled:0 "Ground relays first: Standing Settlement"
 FCU_lw_blackout_policy_a_spirit_settled_desc:0 "The settlement fixes the communications the federation controls after the blackout and records what it depends on others for. It assigns no blame for the satellites; the Chronicle does not say whose operation it was, and this campaign does not. The continuing opportunity cost remains."
 FCU_lw_blackout_policy_b_spirit:0 "A replacement satellite programme"
 FCU_lw_blackout_policy_b_spirit_desc:0 "The federation will fund a replacement satellite programme, alone or with partners. The programme restores the long-range traffic the blackout destroyed and depends on launch capacity the federation does not own; it also makes the federation a party to the next war's targeting."
 FCU_lw_blackout_policy_b_spirit_settled:0 "A replacement satellite programme: Standing Settlement"
 FCU_lw_blackout_policy_b_spirit_settled_desc:0 "The settlement fixes the communications the federation controls after the blackout and records what it depends on others for. It assigns no blame for the satellites; the Chronicle does not say whose operation it was, and this campaign does not. The continuing opportunity cost remains."
 FCU_lw_blackout_register:0 "Answer the Continental Blackout"
 FCU_lw_blackout_register_desc:0 "The Chronicle records that an operation to destroy military satellites cut off network communications across the entire Usean continent on 19 September 2019. The federation's networks went dark with everyone else's. The cabinet will decide how the federation gets its communications back and who will control them afterwards."
 FCU_lw_blackout_policy_a:0 "Ground Relays First"
 FCU_lw_blackout_policy_a_desc:0 "The federation will rebuild its communications on ground relays it owns: slower, local and beyond the reach of whoever shoots down satellites next. The policy is cheap to begin and expensive to finish, and it leaves the continent's long-range traffic to others."
 FCU_lw_blackout_policy_b:0 "A Replacement Satellite Programme"
 FCU_lw_blackout_policy_b_desc:0 "The federation will fund a replacement satellite programme, alone or with partners. The programme restores the long-range traffic the blackout destroyed and depends on launch capacity the federation does not own; it also makes the federation a party to the next war's targeting."
 FCU_lw_blackout_operations:0 "Keep the Federal Services Reachable"
 FCU_lw_blackout_operations_desc:0 "Federal services will be kept reachable by whatever works: relays, couriers, paper. A government that cannot be reached cannot be obeyed, and the blackout's first casualty was the assumption that the networks would always be there."
 FCU_lw_blackout_review:0 "Review a Blackout Service Period"
 FCU_lw_blackout_review_desc:0 "A completed, funded service period under the chosen policy must be examined before the federation's communications policy is fixed. The review compares the services restored with the money spent and the dependence accepted."
 FCU_lw_blackout_settlement:0 "Communications the Federation Controls"
 FCU_lw_blackout_settlement_desc:0 "The settlement fixes the communications the federation controls after the blackout and records what it depends on others for. It assigns no blame for the satellites; the Chronicle does not say whose operation it was, and this campaign does not."
 FCU_lw_settlement_policy_a_spirit:0 "A guarantor of the settlement"
 FCU_lw_settlement_policy_a_spirit_desc:0 "The federation will guarantee the settlement: a signatory with obligations, whose forces and standing back the terms. The role earns the federation a place at every later table and binds it to a peace it did not make."
 FCU_lw_settlement_policy_a_spirit_settled:0 "A guarantor of the settlement: Standing Settlement"
 FCU_lw_settlement_policy_a_spirit_settled_desc:0 "The settlement records the federation's part in the peace that followed the Lighthouse War, as guarantor or as host. It asserts no treaty the parties did not sign and no border the war did not draw. The continuing opportunity cost remains."
 FCU_lw_settlement_policy_b_spirit:0 "A convenor of the conference"
 FCU_lw_settlement_policy_b_spirit_desc:0 "The federation will convene the conference and keep its name off the terms. The role costs nothing but staff and goodwill, and it leaves the federation without a say when the terms are tested."
 FCU_lw_settlement_policy_b_spirit_settled:0 "A convenor of the conference: Standing Settlement"
 FCU_lw_settlement_policy_b_spirit_settled_desc:0 "The settlement records the federation's part in the peace that followed the Lighthouse War, as guarantor or as host. It asserts no treaty the parties did not sign and no border the war did not draw. The continuing opportunity cost remains."
 FCU_lw_settlement_register:0 "Convene the Postwar Settlement"
 FCU_lw_settlement_register_desc:0 "The fighting between Osea and Erusea has ended, at the Expo City Conference the Chronicle records for 1 December 2019 or in some other way. The federation sits between the two and will be asked what part it plays in what follows. The cabinet will decide whether to guarantee the settlement or merely to host it."
 FCU_lw_settlement_policy_a:0 "A Guarantor of the Settlement"
 FCU_lw_settlement_policy_a_desc:0 "The federation will guarantee the settlement: a signatory with obligations, whose forces and standing back the terms. The role earns the federation a place at every later table and binds it to a peace it did not make."
 FCU_lw_settlement_policy_b:0 "A Convenor of the Conference"
 FCU_lw_settlement_policy_b_desc:0 "The federation will convene the conference and keep its name off the terms. The role costs nothing but staff and goodwill, and it leaves the federation without a say when the terms are tested."
 FCU_lw_settlement_operations:0 "Keep the Federation's Name Off the Terms"
 FCU_lw_settlement_operations_desc:0 "The federation's name will stay off the terms of the settlement unless the cabinet decides otherwise. Expo City is not claimed as Central Usean by this campaign; the conference is hosted wherever the parties agree, and the federation's part in it is its own choice."
 FCU_lw_settlement_review:0 "Review a Settlement Service Period"
 FCU_lw_settlement_review_desc:0 "A completed, funded service period under the chosen role must be examined before the federation's postwar policy is fixed. The review compares the obligations accepted or declined with what the settlement delivered."
 FCU_lw_settlement_settlement:0 "A Federation That Hosted the Peace"
 FCU_lw_settlement_settlement_desc:0 "The settlement records the federation's part in the peace that followed the Lighthouse War, as guarantor or as host. It asserts no treaty the parties did not sign and no border the war did not draw."
