 ac_snc_ose_message_13.t:0 "A Channel for a Question: The Hearing"
 ac_snc_ose_message_13.d:0 "The researcher asks which part of the envelope made a question into an invitation. The diplomatic clerk looks at the covering note and admits that it was probably his summary. 'Then let us keep the question,' she says, 'and correct the invitation.' A liaison suggests a restricted receiving chain; another asks for a public account of the method and its limitations. There is no foreign representative in the room, and nobody is authorized to speak for one. Their first choice concerns how Osea will receive an answer, or record that no answer has arrived."
