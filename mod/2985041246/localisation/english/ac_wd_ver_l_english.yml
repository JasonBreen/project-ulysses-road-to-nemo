l_english:
 VER_wd_fed_orders:0 "Government by Standing Order"
 VER_wd_fed_orders_desc:0 "The National Administration governs the Verusan Federation through standing orders it renews every few months, with elections suspended and a democratic label that roughly one voter in a hundred supports. The cabinet now minutes each renewal by name, so every minister must say on paper what should replace the arrangement. The vote settles nothing yet, but it ends the habit of pretending the question is not there."
 VER_wd_fed_petitions:0 "Town Councils Ask for a Vote"
 VER_wd_fed_petitions_desc:0 "Town councils in the six districts send petitions asking for a federal assembly with seats for every district. Most signatures come from the Capital District and the two coastal plant districts, where clerks, dockers and plant engineers want a say in the budget. Receiving the petitions formally, instead of filing them, costs the Administration some authority and gives the small democratic camp a document to stand on."
 VER_wd_fed_squares:0 "The Nationalist Half of the Country"
 VER_wd_fed_squares_desc:0 "Half of Verusa answers to the nationalist movement, whose rallies fill the market squares of District C and District F, the plain districts that face Yuktobania with no plant and no garrison of their own. Its speakers want a government that treats the northern frontier as the first question of state. Letting the rallies run unhindered costs calm in the towns and shows exactly how many people the movement can bring out."
 VER_wd_fed_statute:0 "Officials Draft a Provisional Statute"
 VER_wd_fed_statute_desc:0 "The other half of the country is less a movement than a class: ministry officials, plant managers, railway engineers and harbour masters who want rules that work more than they want a creed. A drafting group from their ranks writes a statute that would let a council of officials govern for a fixed term with no assembly and no rallies. Drafting it openly earns them the distrust of both other camps."
 VER_wd_fed_assembly:0 "Reopen the Federal Assembly"
 VER_wd_fed_assembly_desc:0 "The Administration hands power to a federal assembly elected from all six districts, with a cabinet answerable to it and a fixed election calendar. The democratic camp is tiny, so the first assembly will be full of deputies who never wanted it and must now learn to bargain inside it. The cost is speed: every budget, garrison posting and road contract becomes a vote that can be lost."
 VER_wd_fed_provisional:0 "Proclaim a Provisional Government"
 VER_wd_fed_provisional_desc:0 "The officials' statute takes effect and the Administration gives way to a provisional government: a council of senior officials and managers ruling for a fixed term while the federation is rebuilt on paper. Decisions come quickly and the ministries finally get budgets they can plan around. Nobody voted for the council, and the term it sets itself will be tested the first time it runs out."
 VER_wd_fed_committee:0 "A Committee for the Frontier Districts"
 VER_wd_fed_committee_desc:0 "The nationalist movement takes the seals and sets up a committee that governs by decree in the name of the frontier districts. Its first law places a frontier warden beside every district governor and asks of every budget what it does for the northern line. The movement brings crowds and conviction into government, and leaves the officials and the democrats without a chair at all."
 VER_wd_fed_first_budget:0 "The First Budget Debated in Public"
 VER_wd_fed_first_budget_desc:0 "The new assembly reads its first budget line by line in an open chamber, and the deputies from District F point out that their district has neither a railway nor a graded road. A road grant for District F passes as the price of their votes for the coastal plant budget. Open budgets are slower and noisier than decrees, and this one starts the habit of trading districts against each other."
 VER_wd_fed_sunset:0 "A Sunset Date for the Council"
 VER_wd_fed_sunset_desc:0 "The provisional council writes its own expiry date into the statute, with a review by an elected body when the date arrives. The clause reassures the towns that the council does not mean to stay forever, and it gives ministers a deadline that concentrates their minds. Ambitious officials dislike a clock on their power, and every crisis will tempt the council to wind the clock back."
 VER_wd_fed_wardens:0 "Wardens Beside Every Governor"
 VER_wd_fed_wardens_desc:0 "Under the committee each of the six district governors works beside a frontier warden appointed from the movement. The wardens inspect garrisons, road works and grain stores and report straight to the committee. Frontier projects in District C and District F, which have waited longest, finally move. The paperwork in every district office doubles, and every governor becomes a suspect in his own building."
 VER_wd_fed_compact:0 "Signing the Six-District Compact"
 VER_wd_fed_compact_desc:0 "Whatever government holds the seals, the six districts sign a compact fixing their shares of federal revenue, the language of the district courts and the order of the federal budget. The Capital District gives up part of its lead in road money, and the coastal districts accept that their plant taxes will pay for the plain. It is mostly bookkeeping, and it stops the federation being renegotiated every year."
 VER_wd_fed_district_treasuries:0 "District Treasuries for the Empty Towns"
 VER_wd_fed_district_treasuries_desc:0 "The compact's first payment goes to the three districts with no plants at all. District F, which borders both neighbours and has neither rail nor industry, receives a federal works grant for its first plant hall. The money comes from the coastal districts, whose representatives will watch the hall's books closely. It is a small plant, and the first proof that the compact means anything."
 VER_wd_plain_exposed:0 "A Capital With No Hills Around It"
 VER_wd_plain_exposed_desc:0 "The Capital District is nine provinces of open plain, and its western edge is the Silvonian frontier. The federation keeps there its largest garrison, its only air base, its only fuel silo and the junction of every railway line. Planners have always called this convenient. A staff study now asks the question nobody wanted printed: what happens to Verusa if the capital stops working for a week."
 VER_wd_plain_ring_road:0 "Paving the Capital Ring Road"
 VER_wd_plain_ring_road_desc:0 "Traffic from all three railway lines and every district road meets in the centre of the capital, where carts, lorries and garrison convoys share the same streets. A paved ring around the centre lets freight and troops move between the lines without crossing the market quarter. The works close streets for a year and anger shopkeepers, but the capital stops choking every time a long train arrives."
 VER_wd_plain_granaries:0 "Granaries Beside the Rail Yards"
 VER_wd_plain_granaries_desc:0 "The capital eats grain from the District C plain and fish from the coast, and both arrive by rail through the same junction. Federal granaries beside the yards would hold ninety days of flour and preserved food for the city and its garrison. They need buying, storage and guards, and grain merchants complain that the state is cornering their trade. A capital that can feed itself for a season is harder to frighten."
 VER_wd_plain_second_seat:0 "A Standby Seat in District E"
 VER_wd_plain_second_seat_desc:0 "District E is a large port city behind jungle hills, as far from both frontiers as the federation reaches. Standby ministries there, with copies of the records, a radio link and a skeleton staff, would let the government keep working if the capital were cut off. The plan admits in public that the capital is exposed, and its merchants read it as a vote of no confidence in their city."
 VER_wd_plain_hold:0 "The Government Stays on the Plain"
 VER_wd_plain_hold_desc:0 "The opposite answer keeps every ministry in the capital and spends the money on making the city harder to stop: a larger garrison, radar on the city edge, wardens in every block. Officials and merchants stay where they are and the capital's pride is spared. The federation keeps every egg in one basket on an open plain, and wagers that a basket guarded well enough will do."
 VER_wd_plain_night_trains:0 "Records by Night Train"
 VER_wd_plain_night_trains_desc:0 "Copies of the land registry, tax rolls, payroll lists and federal court records travel to District E by night train under guard, a few wagons at a time. The line through the jungle hills needs new sidings and a goods yard at the port to receive them. Clerks hate the double filing. Within two years every important federal document exists in two places a day's journey apart."
 VER_wd_plain_radar:0 "Radar Masts on the City Edge"
 VER_wd_plain_radar_desc:0 "A radar station on the western edge of the capital watches the open sky over the Silvonian frontier and the approaches to the only air base. The site needs power lines, a hardened plotting room and crews trained to tell an airliner from anything else. Silvonian officials will notice the masts. The federation's answer is that the station watches sky, not ground, and claims nothing beyond the line."
 VER_wd_plain_last_plot:0 "The Last Free Plot in the Capital"
 VER_wd_plain_last_plot_desc:0 "The capital's four plant halls and two arms works leave room for exactly one more large building. The planning office decides it should be a hall for spare parts, lorries and rail equipment, the goods the garrison and the railways run short of first. The plot goes to the state rather than the highest bidder, which annoys the capital's builders and closes the last gap for good."
 VER_wd_plain_block_wardens:0 "Wardens for Every City Block"
 VER_wd_plain_block_wardens_desc:0 "Every block in the capital gets a volunteer warden with a list of residents, a key to the nearest cellar and a telephone number for the district office. In an emergency the wardens count heads, guide people to cover and report damage. They cost little beyond training evenings. Some residents welcome a neighbour who knows the plan, and others dislike a neighbour who keeps a list."
 VER_wd_plain_plan:0 "The Capital Plan Goes to Print"
 VER_wd_plain_plan_desc:0 "The federal planning office prints the capital plan in full: where the ministries go in an emergency, which roads stay open, where the grain is kept and which trains leave first. Publishing it tells every resident what to do, and tells every observer exactly the same. The office judges that a plan the public knows is worth more than a plan only the ministries understand."
 VER_wd_coast_ledger:0 "Every Coastal Plot Is Spoken For"
 VER_wd_coast_ledger_desc:0 "Districts D and E carry all of the federation's industry outside the capital: three plant halls and two arms works in each, with the only yards and the only naval base in District E. Both districts are full, and every plot with power, water and a siding already has a building on it. A plant survey counts what the coast produces and where the next hall could possibly go."
 VER_wd_coast_haul_road:0 "A Haul Road Through the District D Jungle"
 VER_wd_coast_haul_road_desc:0 "District D's oil, steel and aluminium reach the capital by one line that runs back through District C, and the jungle between the wells and the railhead floods every wet season. A gravelled haul road on a raised bank keeps lorries moving when the sidings are under water. Building it through seventeen provinces of jungle, mountain and hill is slow, and the crews lose weeks to rain and fever."
 VER_wd_coast_quays:0 "Deeper Quays at the District E Port"
 VER_wd_coast_quays_desc:0 "The naval base and the three yards of District E share one harbour with the coastal freighters, and the quays are too shallow for loaded tankers at low water. Dredging the channel and lengthening the quays lets oil and steel leave by sea instead of waiting for space on the two lines inland. The dredgers are hired from abroad, and the works disturb the yards for a season."
 VER_wd_coast_deepen:0 "Deeper Plants, Not More of Them"
 VER_wd_coast_deepen_desc:0 "One school says the coastal plants are full but far from efficient. New machine tools, steadier power and trained foremen would raise output inside the halls that already exist, with no new plots and no new towns. It is the cheapest path in land and the dearest in imported machinery. It also leaves Districts B, C and F as empty as they are now, which their governors will not forget."
 VER_wd_coast_spread:0 "Halls for the Empty Districts"
 VER_wd_coast_spread_desc:0 "A second school wants new plants in the three districts that have none: the hills of District B, the plain of District C and, in time, District F. Land there is cheap and the towns want work. Every new hall needs roads, power and a workforce that has never stood at a lathe, and the coastal managers warn that skills do not travel by train as easily as machinery does."
 VER_wd_coast_oil:0 "Oil Before Every Other Industry"
 VER_wd_coast_oil_desc:0 "A third school says Verusa's real asset is the oil spread between the capital, District D and District E, and that the federation should organise everything around it. A federal oil board would buy the crude, set the price and sell the surplus abroad. Revenue arrives quickly and gives the government money to spend. Plants that need cheap fuel at home will have to bargain with the board like anyone else."
 VER_wd_coast_machine_tools:0 "Machine Tools for the Coastal Halls"
 VER_wd_coast_machine_tools_desc:0 "The deepening programme buys machine tools for the plant halls of Districts D and E and sends foremen abroad to learn how to set them up. Output per worker rises within two years, though the first year brings breakdowns while crews learn the new machines. The import bill is heavy, and the tools tie the coast to foreign suppliers for parts and service."
 VER_wd_coast_b_works:0 "A Works Town in the District B Hills"
 VER_wd_coast_b_works_desc:0 "District B lies between the capital and the District E port, on the line that joins them, with hills, jungle and a coast but no plant at all. Two plant halls beside the line give its towns work and give the railway freight in both directions. Housing, water and schools must follow the halls, and managers sent from the coast find local hiring slower than they promised the ministry."
 VER_wd_coast_c_works:0 "Arms Shops on the District C Plain"
 VER_wd_coast_c_works_desc:0 "District C is open plain on the line between the capital and District D, and it faces the Yuktobanian frontier. An arms shop and a plant hall there would put production close to the plain the army might one day have to hold. Critics call it an odd way to protect a factory. Supporters answer that District C has waited longer than anyone for anything at all."
 VER_wd_coast_wellheads:0 "New Wellheads in Three Districts"
 VER_wd_coast_wellheads_desc:0 "The oil board pays for new wellheads and gathering lines in the Capital District, District D and District E, where the federation's crude is split almost evenly. Survey crews map the fields properly for the first time. Drilling in jungle and on open plain needs different rigs and different crews, and the board must buy both. More crude reaches the railheads, and the board's income rises with it."
 VER_wd_coast_rolling_mill:0 "A Rolling Mill for Coastal Steel"
 VER_wd_coast_rolling_mill_desc:0 "Verusa mines steel in three districts but ships much of it away as billets and buys back finished plate. A rolling mill attached to the existing coastal works would finish steel at home for rails, hulls and building frames. The mill needs more power than the coast can easily spare. Once it runs, the yards, the railways and the builders stop waiting for imported plate."
 VER_wd_coast_bad_year:0 "A Fund Against a Bad Oil Year"
 VER_wd_coast_bad_year_desc:0 "Oil revenue swings with prices set far away, and a federation that spends every good year's money will be broke in the first bad one. A reserve fund takes a share of oil and plant taxes in good years and pays out only when prices fall. Ministers will be tempted to raid it at every budget. If it survives, the next slump lands on savings rather than on wages."
 VER_wd_rail_hub:0 "Three Lines and One Junction"
 VER_wd_rail_hub_desc:0 "Verusa has three railway lines and every one of them starts in the capital: one to District C and on to District D, one straight to District E, and one through District B to District E. District F has no railway at all. A railway office survey asks what the federation would do if the capital junction stopped, and finds that the honest answer is very little."
 VER_wd_rail_f_road:0 "A Graded Road for District F"
 VER_wd_rail_f_road_desc:0 "District F borders both Silvonia and Yuktobania, and it is the only district the railway never reached. Its towns are joined to the capital by tracks that turn to mud after rain. A graded and drained road from the capital across the District F plain is the cheapest way to tie the district to the rest of the federation, and the first thing its councils ask for."
 VER_wd_rail_b_cuttings:0 "Cuttings Through the District B Hills"
 VER_wd_rail_b_cuttings_desc:0 "The line from the capital through District B to the port climbs through hills with tight curves and a gradient that halves every train's load. Blasting cuttings and easing the curves lets heavier trains run between the capital and the coast. The work closes the line for weeks at a time, and freight must go round by the direct line to District E while the crews are blasting."
 VER_wd_rail_bypass:0 "Roads That Bypass the Capital"
 VER_wd_rail_bypass_desc:0 "One answer to the single junction is a road linking the districts directly, so that District C can reach District E without passing through the capital. Engineers grade and bridge a route from the District C plain across to the District E hills. It is a road rather than a railway and carries a fraction of the freight, but it keeps the federation joined if the capital is cut."
 VER_wd_rail_coasters:0 "Coasters Between District D and District E"
 VER_wd_rail_coasters_desc:0 "The other answer uses the sea. District D and District E both lie on the coast, and a regular service of small coasters between their harbours would move oil, steel and stores without touching the capital junction. The ships are cheap to charter and slow to load. The service depends on calm water and on the Maritime Service keeping the coastal lanes safe, which it has never yet had to do."
 VER_wd_rail_wagons:0 "Wagons from the District E Shops"
 VER_wd_rail_wagons_desc:0 "The federation's twenty-eight trains run on wagons built abroad, and spare axles take months to arrive. The plant halls of District E could build simple wagons and spares if they had the drawings, the jigs and a test track. The first wagons are heavy and slow to assemble. Each one built at home is one fewer order waiting on a foreign supplier's calendar."
 VER_wd_rail_ballast:0 "Ballast Against the Wet Season"
 VER_wd_rail_ballast_desc:0 "Jungle rain washes ballast from under the sleepers on every coastal line, and the plain lines sink into mud in the same months. A standing maintenance programme with quarries, ballast trains and gangs posted along each line keeps the track firm all year. It costs wages every year with nothing new to show for them, which makes it the first item finance officials want to cut."
 VER_wd_rail_reserve_trains:0 "Trains Held Back in Reserve"
 VER_wd_rail_reserve_trains_desc:0 "The railway office proposes keeping a share of the federation's trains in reserve, serviced and fuelled but out of daily service, for emergencies and mobilisation. Freight customers lose capacity they are used to and say so loudly. In return the army can move a formation from the coast to the plain without cancelling the grain trains, and the reserve can be released in a crisis."
 VER_wd_rail_timetable:0 "A Timetable for the Day of Call-Up"
 VER_wd_rail_timetable_desc:0 "With the network mapped and a second route in place, the railway office writes a sealed timetable for the day the reserve is called up: which trains run, which stations close to civilians, which formation boards where. The army and the railway argue for a year about whose needs come first. The finished timetable sits in a safe in the capital, with a second copy at the coast."
 VER_wd_army_muster:0 "Muster of the Seven Formations"
 VER_wd_army_muster_desc:0 "Verusa's army is seven infantry formations of six battalions each, every one with an engineer company: three at the capital, two at the District D logistics centre and two at the District E logistics centre. District B, District C and District F, which between them hold most of both frontiers, have no garrison at all. A full muster shows the federation what its army is, and where it is not."
 VER_wd_army_mountain_school:0 "A School for the Coastal Mountains"
 VER_wd_army_mountain_school_desc:0 "The army already trains a few companies for mountain work, a habit learned in the hill and mountain country behind the coast. A permanent school in District D would teach climbing, rope bridges and supply by pack animal to a battalion from every formation in turn. Instructors are scarce and the courses are long. The school gives the coastal formations ground that few attackers would choose."
 VER_wd_army_lorries:0 "Counting the Army Lorries"
 VER_wd_army_lorries_desc:0 "The depots list nine hundred and sixty sets of motor equipment, and nobody is sure how many of the lorries behind those figures actually start. A count by mechanics rather than clerks finds out, repairs what can be repaired and writes off the rest. The result decides whether the federation could ever move its reserve on wheels, or must keep marching it from the trains."
 VER_wd_army_forward:0 "Hold the Plain at the Frontier"
 VER_wd_army_forward_desc:0 "The forward doctrine says the capital is the federation and must be held on the plain itself. The formations would train to defend the open ground beside both frontiers, with prepared positions, ranges and the superior firepower that the army's manuals already favour. It suits a country that cannot afford to lose its capital, and it asks infantry to stand where tanks and aircraft move most freely."
 VER_wd_army_depth:0 "Fall Back Into the Jungle Hills"
 VER_wd_army_depth_desc:0 "The depth doctrine says the plain cannot be held against a serious attack and should not be tried. The formations would delay on the plain, then fall back into the jungle hills and mountains of Districts D and E, where the plants, the port and the depots are. The doctrine is honest about the terrain and brutal about the capital, which it treats as ground to give up and retake."
 VER_wd_army_wheels:0 "Put the Reserve on Lorries"
 VER_wd_army_wheels_desc:0 "The mobile doctrine keeps most formations in the coastal depots and moves them by lorry and train to wherever the threat appears, on either frontier or on the coast. It needs working lorries, fuel and a staff that can plan movement fast. It promises one reserve able to do several jobs, and risks a reserve that arrives late, tired and short of fuel."
 VER_wd_army_ranges:0 "Firing Ranges on the Open Plain"
 VER_wd_army_ranges_desc:0 "Defending the plain needs gunners who can hit targets at long range across open ground. Ranges on the capital plain let the formations practise with artillery and machine guns at the distances they would actually fight. Farmers lose grazing to the ranges and complain about the noise. The army gains gun crews who fire more than a handful of rounds a year."
 VER_wd_army_hill_depots:0 "Depots in the District D Hills"
 VER_wd_army_hill_depots_desc:0 "The depth doctrine moves ammunition, fuel and rations out of the capital into depots dug into the hills of District D, along roads the engineers must build first. The capital's quartermasters lose their stores and their influence. The formations gain stocks that could survive the loss of the plain and keep a long defence of the coast supplied for months."
 VER_wd_army_motor_pools:0 "Motor Pools at the Logistics Centres"
 VER_wd_army_motor_pools_desc:0 "The mobile doctrine needs lorries kept running at the two coastal logistics centres, with mechanics, fuel stores and a stock of spare parts. Each formation gets a driving school and a fixed allotment of vehicles. The fuel bill climbs, and whoever sells the crude wants paying. The reserve can now move a formation from the coast to a frontier in days rather than weeks."
 VER_wd_army_roll:0 "A Roll of Former Conscripts"
 VER_wd_army_roll_desc:0 "Every Verusan who has served is listed by district, trade and last unit on a single roll kept at the district offices and copied to the capital. Mobilisation that now relies on posters and word of mouth could rely on letters and lists. The roll needs clerks and a yearly update, and many former soldiers are uneasy about a state that knows where each of them lives."
 VER_wd_army_timetable_callup:0 "Call-Up by Railway Timetable"
 VER_wd_army_timetable_callup_desc:0 "The railway office's sealed timetable and the army's roll are joined: each reservist's letter names the train, the station and the hour. Night rehearsals on one line at a time test the plan without stopping the federation, and the mistakes are found and fixed in the dark. When the timetable works, a reserve that took a month to gather can be in its depots inside a week."
 VER_wd_army_federal_staff:0 "A Staff for All Six Districts"
 VER_wd_army_federal_staff_desc:0 "Whichever doctrine the army chose, it needs a staff that plans for all six districts and not just the capital garrison. A federal staff with officers from every formation writes the plans, runs the exercises and reports to the government. Officers who have only served in the capital resent the newcomers. The army gains one set of plans in place of seven separate habits."
 VER_wd_sea_four_hulls:0 "Three Escorts and a Submarine"
 VER_wd_sea_four_hulls_desc:0 "The Maritime Service owns three coastal escorts and one coastal submarine, all based at the District E harbour, and the federation's sixty coastal freighters depend on them. The coast from District B to District D is long, and the service has never patrolled more than a fraction of it. An inspection of hulls, crews and stores tells the government what four ships can really do."
 VER_wd_sea_cinigrad:0 "Word of New Submarines from Cinigrad"
 VER_wd_sea_cinigrad_desc:0 "In September 1991 the Scinfaxi class of submarines is announced at a political convention in Cinigrad, in Yuktobania. Verusa shares a long land frontier with Yuktobania and owns one submarine and three escorts. Nobody in the Maritime Service can say what the new boats mean for a small coastal navy, so the staff asks for a proper study before the newspapers answer the question for it."
 VER_wd_sea_listening:0 "Listening Huts and Shore Radar"
 VER_wd_sea_listening_desc:0 "One answer watches the water rather than chasing it. Shore radar and listening huts along the District E coast report every contact near the harbour approaches, and the escorts sail only when there is something to find. The equipment is imported and the crews take a year to train. The coast becomes harder to approach unseen, though the service still has only three escorts to answer a report."
 VER_wd_sea_freighter_pool:0 "One Schedule for Sixty Freighters"
 VER_wd_sea_freighter_pool_desc:0 "The other answer protects trade instead of hunting anything. The sixty coastal freighters are pooled under one federal schedule and sail in groups along routes the escorts can actually cover. Owners lose the freedom to sail when it suits them and gain cover the federation underwrites. Cargoes arrive more slowly and more predictably, and the escorts finally have a job they can do."
 VER_wd_sea_b_slipway:0 "A Slipway on the District B Coast"
 VER_wd_sea_b_slipway_desc:0 "All three of the federation's yards sit in District E beside the naval base, so a single bad night could stop every repair at once. A slipway on the District B coast, on the railway to the capital, would give the service a second place to repair and build small hulls. The site needs a breakwater, and skilled hands that District B does not yet have."
 VER_wd_sea_apprentices:0 "Apprentices for the Yards"
 VER_wd_sea_apprentices_desc:0 "The District E yards hire welders and fitters trained abroad or by the old hands, and the old hands are retiring. An apprentice school shared by the District E yards and the new District B slipway trains a class every year in hull work, engines and electrics. The first classes slow the yards down. Later ones mean the service no longer waits for foreign contractors."
 VER_wd_sea_fisheries:0 "Fishery Patrols from the Naval Base"
 VER_wd_sea_fisheries_desc:0 "Fishing boats from the coastal towns work far out along the coast, where the Maritime Service is rarely seen. Regular fishery patrols by the escorts enforce the federation's own catch rules, help boats in trouble and give the crews long days at sea. Fuel and wear cost money. The coast starts to see its navy as something more than a harbour ornament."
 VER_wd_sea_reserve_crews:0 "Reserve Crews for Laid-Up Hulls"
 VER_wd_sea_reserve_crews_desc:0 "The service keeps the names of former sailors, merchant officers and yard workers who could crew requisitioned freighters or a fourth warship in an emergency. Each spends two weeks a year at sea with the escorts. The scheme costs training time and berths. In a crisis the Maritime Service would have people who know its ships instead of a list of strangers."
 VER_wd_sea_coast_charts:0 "New Charts of the Jungle Coast"
 VER_wd_sea_coast_charts_desc:0 "The coast between District B and District D is charted from surveys old enough that the sandbanks have moved since. A survey ship working with the fishery patrols re-charts the approaches, river mouths and anchorages. The work is slow and unglamorous. The freighters stop running aground, and the escorts learn every inlet they might one day need."
 VER_wd_air_one_base:0 "Seventy-Two Aircraft on One Field"
 VER_wd_air_one_base_desc:0 "Every combat aircraft Verusa owns, sixty fighters and twelve support aircraft, sits on the single air base in the Capital District, within easy reach of the Silvonian frontier. The base shares the capital's fuel silo and its railway junction. Pilots like the convenience. The air staff knows that one runway beside a frontier is one target, and asks for money to spread out."
 VER_wd_air_e_field:0 "A Field Behind the District E Hills"
 VER_wd_air_e_field_desc:0 "District E, behind jungle hills and far from both frontiers, has room for a second air base near the port. Runways, hangars and fuel tanks there would keep aircraft out of reach of a surprise blow against the capital. Building on jungle ground needs heavy drainage, and from now on the air staff must split its maintenance crews between two fields."
 VER_wd_air_d_strip:0 "A Jungle Strip in District D"
 VER_wd_air_d_strip_desc:0 "A smaller strip near the District D logistics centre covers the eastern coast and the stretch of the Yuktobanian frontier that runs into the jungle. It takes only a handful of aircraft at a time and needs constant work to keep the jungle back. The strip gives the support aircraft a field near the formations that would fight in the hills."
 VER_wd_air_capital_sky:0 "Interceptors Over the Junction"
 VER_wd_air_capital_sky_desc:0 "One policy gives the air arm a single job: keep hostile aircraft away from the capital, its junction and its plants. Pilots train for interception, and the support aircraft are kept as a small reserve. It suits a federation whose most valuable ground sits on an open plain beside a frontier, and it leaves the army to fight on the ground with little help from above."
 VER_wd_air_formation_wings:0 "Aircraft for the Seven Formations"
 VER_wd_air_formation_wings_desc:0 "The other policy ties the air arm to the army. Fighters escort the support aircraft, and both train with the formations in reconnaissance, ground attack and supply drops over the hills and the plain. Pilots spend more time with soldiers than with each other. The capital's sky would be less well guarded, and the army would never have to fight alone."
 VER_wd_air_spares:0 "Spares from Verusan Aluminium"
 VER_wd_air_spares_desc:0 "Verusa mines aluminium in the Capital District and both coastal districts, yet every airframe part comes from abroad. A small shop in the capital's plant halls making panels, brackets and simple fittings would keep more aircraft flying between deliveries. The parts are crude at first and the inspectors reject many of them. Each one accepted is a part nobody had to wait for."
 VER_wd_air_reserve_aircraft:0 "Nineteen Aircraft in Storage"
 VER_wd_air_reserve_aircraft_desc:0 "Fifteen fighters and four support aircraft wait in storage as a reserve, and some of them have not flown in years. With home-made spares to hand, the air arm overhauls the reserve and puts a rotating share of it back into service for training. The reserve stops being a line in a ledger and becomes aircraft that can fly in the week they are needed."
 VER_wd_air_radar_north:0 "Radar Over the District C Plain"
 VER_wd_air_radar_north_desc:0 "The plain of District C faces the Yuktobanian frontier and lies across the northern approach to the capital. A radar station there would give the air arm warning of aircraft crossing the plain, and give the formations an eye they have never had. The station watches Verusan sky and the air over the line, and claims nothing on the ground beyond it."
 VER_wd_air_school:0 "A Flying School Far from the Frontier"
 VER_wd_air_school_desc:0 "Training pilots on a frontier field means every student flight is an incident waiting to happen. A flying school at the new District E field moves the students to quieter sky over the coast, with instructors drawn from both fighter and support squadrons. The capital field loses some of its best pilots to teaching. The air arm gains a steady supply of pilots who learned without an audience."
 VER_wd_nb_survey:0 "Surveyors on Both Frontiers"
 VER_wd_nb_survey_desc:0 "Silvonia meets Verusa along the Capital District, District B and District F, and Yuktobania along Districts C, D and F; District F alone touches both. Neither frontier has a modern survey on the Verusan side. Teams sent along each line will report what crosses it, where the posts stand and what the frontier towns want, before the government decides which line gets its attention first."
 VER_wd_nb_west_first:0 "The Silvonian Frontier Comes First"
 VER_wd_nb_west_first_desc:0 "The western frontier with Silvonia runs beside the capital itself, and its open plain carries farm traffic, traders and smugglers every day. Putting it first means customs posts, roads and market rules on the Verusan side, so that trade with Silvonia's farming districts flows legally and visibly. The northern line waits, and the rallies in District C and District F ask why their frontier always comes second."
 VER_wd_nb_north_first:0 "The Northern Line Comes First"
 VER_wd_nb_north_first_desc:0 "The northern frontier with Yuktobania is longer, runs through three districts and faces a neighbour many times Verusa's size. Putting it first means survey markers, patrols and watch posts on the Verusan side, with the money taken from the western roads. Yuktobania is asked for nothing and nothing is claimed. The capital's traders grumble that the west, where the money is made, has been left for later."
 VER_wd_nb_customs_sheds:0 "Customs Sheds at the Capital Crossing"
 VER_wd_nb_customs_sheds_desc:0 "The busiest crossing into Silvonia leaves the capital across the western plain, where lorries, carts and herds queue at a single hut. Proper customs sheds with a weighbridge, a paved yard and a rest house clear the traffic in hours. Silvonia's own arrangements are its own affair. On the Verusan side the queue shortens, and the treasury starts collecting duties it used to lose."
 VER_wd_nb_market_days:0 "Market Days in the Frontier Towns"
 VER_wd_nb_market_days_desc:0 "Frontier towns in the Capital District and District B hold licensed market days twice a month, open to traders from either side who register at the customs sheds. Prices settle, smuggling loses its point, and the towns gain a reason to look towards the frontier rather than fear it. Officials must police the markets, and the nationalist papers complain about foreign stalls."
 VER_wd_nb_markers:0 "Marker Stones on the Northern Line"
 VER_wd_nb_markers_desc:0 "Survey teams set numbered marker stones along the Verusan side of the northern frontier, across the plains of District C and District F and into the jungle of District D. Each stone is recorded and photographed, and the register is kept in the capital. The stones claim no new ground. They let a patrol report exactly where it was, which until now was impossible."
 VER_wd_nb_plain_patrols:0 "Mounted Patrols on the Northern Plain"
 VER_wd_nb_plain_patrols_desc:0 "With the line marked, mounted and motor patrols ride the open plains of District C and District F on fixed routes between the stones. They report herds, smugglers, lost travellers and anything else that crosses. The patrols are thin on a long frontier and live hard in the dry months. The government learns for the first time what actually happens along its northern line."
 VER_wd_nb_herders:0 "Passes for the District F Herders"
 VER_wd_nb_herders_desc:0 "Herders from the District F plain have always taken their animals across the desert frontier with Silvonia as the seasons turn, as herders from the other side have done in reverse. A seasonal pass from the district office records who crosses and when, without asking anyone to stop. It costs clerks at a few remote posts, and turns a habit the law ignored into one it recognises."
 VER_wd_nb_osean_envoys:0 "Osean Envoys Call More Often"
 VER_wd_nb_osean_envoys_desc:0 "As the century draws to its close, Osean diplomats appear in the capital more often, asking about the frontiers, the oil and the neighbours; in Sapin, officials already worry aloud that Osea is turning towards Yuktobania and Verusa. The federation promises nothing and joins nothing. A federation that is visited can ask for things, though, and the foreign ministry begins to keep a list."
 VER_wd_nb_osean_envoys_tt_1:0 "No alliance, faction or treaty changes; the envoys only visit."
 VER_wd_nb_arkbird:0 "Osea and Yuktobania Share the Arkbird"
 VER_wd_nb_arkbird_desc:0 "In October 1999 Osea and Yuktobania agree to convert the Arkbird into a platform for clearing debris from satellite orbits. For a federation wedged between a giant neighbour and a distant superpower, cooperation between the two is worth noting. The foreign ministry recommends easing the watch on the northern line a little and spending the savings at home, while every post stays manned."
 VER_wd_sky_warning:0 "Ulysses Enters the Federal Budget"
 VER_wd_sky_warning_desc:0 "Late in 1994 the astronomers give the asteroid a name, Ulysses, and a warning: its path brings it near the Earth, and it might hit. Verusa owns no observatory worth the word and no civil defence service at all. The cabinet opens a small budget line for watching the sky and planning for the worst, and asks every ministry to list what it would need if the worst began to look likely."
 VER_wd_sky_peaks:0 "Observers on the Coastal Peaks"
 VER_wd_sky_peaks_desc:0 "The mountains of District D and District E have the clearest night sky in the federation. Observer posts on a few peaks, with telescopes, radios and trained volunteers, would watch for anything bright, fast or falling and report it to the capital. They will mostly report meteors, aircraft and weather. The posts also give the air arm a warning line it never had."
 VER_wd_sky_announced:0 "The Impact Is Certain"
 VER_wd_sky_announced_desc:0 "In April 1996 the President of the FCU announces that Ulysses will strike the Earth, and nobody can yet say where the fragments will fall. Verusa's capital sits on open plain with nothing to dig into, while its coast has hills, mountains and old workings. The government must decide quickly where its people will go if fragments are ever forecast for the federation."
 VER_wd_sky_dig:0 "Dig Shelters Under the Plain"
 VER_wd_sky_dig_desc:0 "One plan keeps people at home. Shelters dug under the capital and the plain towns, lined with concrete and stocked with water, would hold the population where it lives and works. The plain has no rock to cut into, so every shelter must be built from nothing. It is the dearest plan and the least disruptive, and it keeps the capital working through whatever comes."
 VER_wd_sky_hills:0 "Evacuate to the Coastal Hills"
 VER_wd_sky_hills_desc:0 "The other plan moves people. Timetables, camps and requisitioned buildings in the hills of District D and District E would take the plain towns' population by rail to ground with natural cover. It is cheaper than digging and far more disruptive, and it depends entirely on three railway lines that all begin in the capital. The coast will have to house a great many guests."
 VER_wd_sky_stocks:0 "Water and Lamp Oil in Every District"
 VER_wd_sky_stocks_desc:0 "Each district office keeps drinking water, lamp oil, medical kits and tinned food for a fortnight, sealed and checked every quarter. The stocks cost money every year and spoil if nobody rotates them. They also mean that a district cut off by fragments, flooding or panic can look after itself for two weeks before help arrives from the capital."
 VER_wd_sky_drill:0 "A Night Drill for the Whole Federation"
 VER_wd_sky_drill_desc:0 "With the capital plan in print and a shelter plan chosen, the federation holds one night drill in every district at once. Sirens sound, trains run to the emergency timetable, wardens count heads and the districts report by radio. Much goes wrong, and all of it is written down. The public learns that the plan exists outside the ministries, and some of the fear goes out of the waiting."
 VER_wd_sky_roche:0 "Every Post Awake on 8 July"
 VER_wd_sky_roche_desc:0 "On 8 July 1999 Ulysses passes through the Roche limit and begins to break apart. Every observer post, radar crew and district warden in Verusa is on duty through the night, and the radio carries reports from the peaks until dawn. What falls, and where, is the question the whole world is asking, and the federation can only watch its own sky."
 VER_wd_sky_after:0 "Accounting for the Long Night"
 VER_wd_sky_after_desc:0 "After the night of the Roche limit the district offices report everything their wardens and observers saw, and the sky watch office sorts fact from rumour. The reports show which plans worked and which existed only on paper. The office recommends keeping the observer posts and the district stocks for good, at a cost the finance ministry would rather not carry, and the cabinet agrees."
 VER_wd_far_belka:0 "War Prices Reach the Coast"
 VER_wd_far_belka_desc:0 "On 25 March 1995 war breaks out around Belka, a world away from the Verusan coast. Within weeks tanker charters climb, insurers add war clauses to every cargo, and buyers abroad ask Verusan producers for every barrel the federation can spare. A war Verusa has no part in has made its crude worth more, and the government must decide what to do about it."
 VER_wd_far_sell:0 "Sell the Crude at War Prices"
 VER_wd_far_sell_desc:0 "One course sells every barrel buyers will take while the war lasts, at prices the federation has never seen. The revenue would pay for roads, plants and the air arm's spares. Fuel at home gets dearer, and the coast's own plants complain. The federation also learns how much of its budget can come to depend on a war that ends whenever other people decide."
 VER_wd_far_hold:0 "Keep the Crude for Verusa"
 VER_wd_far_hold_desc:0 "The other course caps exports and fills the tanks at home: the capital's fuel silo, the naval base and the depots. Producers lose the windfall and say so. The federation gains a fuel reserve that would carry it through a blockade or a slump, and keeps fuel cheap for its own plants and railways while the rest of the world pays war prices."
 VER_wd_far_lumen:0 "After the Treaty of Lumen"
 VER_wd_far_lumen_desc:0 "On 20 June 1995 a treaty signed in Lumen ends the Belkan War. War clauses lapse, charters fall and the buyers drift back to their usual suppliers. The federation's windfall, or its reserve, now has to be explained to the public. The government reviews what the war taught it about a coast that sells oil into a world it cannot influence."
 VER_wd_far_buyers_stay:0 "Buyers Who Came Back"
 VER_wd_far_buyers_stay_desc:0 "Some of the buyers who found Verusan crude during the war keep buying after it, at ordinary prices but on long contracts. The coastal producers gain steady customers and the federation gains income it can plan around. The contracts bind Verusa to deliver even in years when it might rather keep the oil, and the buyers know it."
 VER_wd_far_reserve_rule:0 "A Standing Rule for the Fuel Reserve"
 VER_wd_far_reserve_rule_desc:0 "Having filled its tanks once, the federation writes a rule: a fixed share of production goes into the reserve every year and leaves it only by cabinet order. The rule costs producers part of every good year. It also means the next war abroad, or the next slump, finds the railways and garrisons fuelled for months without any new buying."
 VER_wd_far_stonehenge:0 "Railgun News from San Salvacion"
 VER_wd_far_stonehenge_desc:0 "In the summer of 2003 Erusea invades neutral San Salvacion, seizes Stonehenge and turns its railguns against aircraft. The war is in Usea, a world away, but the shipping lanes, insurers and fuel buyers that set Verusa's oil price are the same ones. The air staff reads the reports with alarm, and the oil producers read them with interest."
 VER_wd_far_home_insurance:0 "Insure Verusan Cargoes at Home"
 VER_wd_far_home_insurance_desc:0 "When the FCU establishes the ISAF and the Usean war widens, foreign insurers raise rates on cargoes in every sea lane they consider risky, and Verusa's are among them. A federal insurance pool for Verusan freighters and tankers, backed by the treasury, keeps the coastal trade moving at rates owners can pay. The treasury carries the risk and hopes the Usean war stays far away."
 VER_wd_far_slump:0 "When War Prices Fall Again"
 VER_wd_far_slump_desc:0 "Whenever the Usean war ends, the prices it pushed up will fall, and the wells and plants that hired on the strength of them will feel it first. The reserve fund set aside in good years now pays wages while prices settle. Drawing on it is exactly what it was for, and the finance ministry still hates every withdrawal. The coast gets through the fall without lay-offs."
 ac_wd_ver_tree:0 "Verusa: National Programme"
 ac_wd_ver_tree_desc:0 "The national focus programme of Verusa, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 VER_wd_standing_order_rule:0 "Rule by Standing Order"
 VER_wd_standing_order_rule_desc:0 "The National Administration governs on orders it renews itself every few months."
 VER_wd_nationalist_squares:0 "Crowds in the Market Squares"
 VER_wd_nationalist_squares_desc:0 "Nationalist rallies fill the squares of the plain districts every week."
 VER_wd_federal_assembly:0 "The Federal Assembly Sits"
 VER_wd_federal_assembly_desc:0 "An assembly elected from six districts votes every budget and every law."
 VER_wd_provisional_statute:0 "The Provisional Statute"
 VER_wd_provisional_statute_desc:0 "A council of officials governs for a fixed term under a written statute."
 VER_wd_frontier_mobilisation:0 "The Frontier Mobilisation Law"
 VER_wd_frontier_mobilisation_desc:0 "Every budget is judged by what it does for the frontier districts."
 VER_wd_sunset_clause:0 "The Sunset Clause"
 VER_wd_sunset_clause_desc:0 "The provisional council has written its own expiry date into law."
 VER_wd_frontier_wardens:0 "Wardens of the Frontier Districts"
 VER_wd_frontier_wardens_desc:0 "A warden from the movement works beside each district governor."
 VER_wd_federal_compact:0 "The Six-District Compact"
 VER_wd_federal_compact_desc:0 "Fixed shares of federal revenue, courts and budget for all six districts."
 VER_wd_exposed_capital:0 "A Capital in the Open"
 VER_wd_exposed_capital_desc:0 "Rail, fuel, aircraft and government all wait on one city on an open plain."
 VER_wd_ninety_day_stores:0 "Ninety Days of Grain"
 VER_wd_ninety_day_stores_desc:0 "Federal granaries hold a season of food for the capital and its garrison."
 VER_wd_second_seat:0 "The Standby Ministries"
 VER_wd_second_seat_desc:0 "Copies of the records and a skeleton government wait in District E."
 VER_wd_capital_holds:0 "The Capital Holds Its Ground"
 VER_wd_capital_holds_desc:0 "Every ministry stays on the plain and the city is made harder to stop."
 VER_wd_block_wardens:0 "Block Wardens"
 VER_wd_block_wardens_desc:0 "A volunteer warden with a list and a cellar key in every capital block."
 VER_wd_coastal_ledger:0 "The Coastal Plant Ledger"
 VER_wd_coastal_ledger_desc:0 "A full count of every plant, plot and well on the coast."
 VER_wd_deep_plants:0 "Deeper, Not Wider"
 VER_wd_deep_plants_desc:0 "New tools and foremen inside the coastal halls that already exist."
 VER_wd_spread_plants:0 "Plants Beyond the Coast"
 VER_wd_spread_plants_desc:0 "Federal credit for new halls in the districts that have none."
 VER_wd_oil_board:0 "The Federal Oil Board"
 VER_wd_oil_board_desc:0 "One board buys the crude, sets the price and sells the surplus."
 VER_wd_coaster_link:0 "The Coaster Link"
 VER_wd_coaster_link_desc:0 "Small ships carry oil and steel between the District D and District E harbours."
 VER_wd_ballasted_lines:0 "Ballasted Lines"
 VER_wd_ballasted_lines_desc:0 "Standing gangs keep the track firm through the wet season."
 VER_wd_train_reserve:0 "The Train Reserve"
 VER_wd_train_reserve_desc:0 "A share of the trains is kept serviced and out of daily use."
 VER_wd_mountain_school:0 "The Coastal Mountain School"
 VER_wd_mountain_school_desc:0 "A battalion from each formation learns the mountains behind the coast."
 VER_wd_plain_defence:0 "Defence on the Plain"
 VER_wd_plain_defence_desc:0 "The formations train to hold the open ground beside both frontiers."
 VER_wd_depth_defence:0 "Depth Behind the Jungle"
 VER_wd_depth_defence_desc:0 "Delay on the plain, then hold the jungle hills and mountains of the coast."
 VER_wd_wheeled_reserve:0 "A Wheeled Reserve"
 VER_wd_wheeled_reserve_desc:0 "The formations wait at the coast and move by lorry and train."
 VER_wd_reserve_roll:0 "The Roll of Former Conscripts"
 VER_wd_reserve_roll_desc:0 "Every former soldier listed by district, trade and last unit."
 VER_wd_timetabled_reserve:0 "Every Reservist Has a Train"
 VER_wd_timetabled_reserve_desc:0 "Each reservist knows his train, his station and his hour."
 VER_wd_hydrophone_watch:0 "Listening Huts on the Coast"
 VER_wd_hydrophone_watch_desc:0 "Shore radar and listening huts report every contact near the harbour."
 VER_wd_freighter_pool:0 "The Freighter Pool"
 VER_wd_freighter_pool_desc:0 "Sixty freighters sail on one federal schedule the escorts can cover."
 VER_wd_yard_apprentices:0 "The Apprentice Classes"
 VER_wd_yard_apprentices_desc:0 "A school for hull, engine and electrical work beside the yards."
 VER_wd_fishery_patrol:0 "Escorts on the Fishing Grounds"
 VER_wd_fishery_patrol_desc:0 "The escorts patrol the fishing grounds and help boats in trouble."
 VER_wd_capital_sky:0 "Fighters Over the Capital"
 VER_wd_capital_sky_desc:0 "The air arm exists first to keep hostile aircraft off the capital."
 VER_wd_formation_wings:0 "Wings for the Formations"
 VER_wd_formation_wings_desc:0 "Fighters and support aircraft train with the army on plain and hill."
 VER_wd_coastal_flying_school:0 "The Coastal Flying School"
 VER_wd_coastal_flying_school_desc:0 "Student pilots learn over the quiet coast, far from both frontiers."
 VER_wd_silvonian_road:0 "Trade on the Silvonian Road"
 VER_wd_silvonian_road_desc:0 "Customs, roads and market rules for the frontier beside the capital."
 VER_wd_northern_watch:0 "Watch on the Northern Line"
 VER_wd_northern_watch_desc:0 "Survey markers, patrols and posts along the Yuktobanian frontier."
 VER_wd_frontier_markets:0 "Licensed Markets on the Western Line"
 VER_wd_frontier_markets_desc:0 "Licensed markets twice a month in the western frontier towns."
 VER_wd_plain_patrols:0 "Patrols on the Open Plain"
 VER_wd_plain_patrols_desc:0 "Mounted and motor patrols ride fixed routes between the marker stones."
 VER_wd_herder_passes:0 "Seasonal Herder Passes"
 VER_wd_herder_passes_desc:0 "The herders of District F cross with a pass the law recognises."
 VER_wd_osean_attention:0 "Osean Visitors"
 VER_wd_osean_attention_desc:0 "Osean diplomats call on the capital more often than they used to."
 VER_wd_quiet_north:0 "A Quieter Northern Sky"
 VER_wd_quiet_north_desc:0 "Cooperation between Osea and Yuktobania eases the watch on the north."
 VER_wd_sky_watch_office:0 "A Budget Line for the Sky"
 VER_wd_sky_watch_office_desc:0 "A small federal office watches the sky and plans for the worst."
 VER_wd_permanent_watch:0 "The Permanent Sky Watch"
 VER_wd_permanent_watch_desc:0 "Observer posts and district stocks kept after the long night."
 VER_wd_peak_observers:0 "The Peak Observers"
 VER_wd_peak_observers_desc:0 "Volunteer observers with telescopes and radios on the coastal peaks."
 VER_wd_impact_nerves:0 "Nerves Before the Impact"
 VER_wd_impact_nerves_desc:0 "The public waits for fragments nobody can place."
 VER_wd_plain_shelters:0 "Shelters Under the Plain"
 VER_wd_plain_shelters_desc:0 "Concrete shelters built from nothing under the capital and plain towns."
 VER_wd_hill_evacuation:0 "The Hill Evacuation Plan"
 VER_wd_hill_evacuation_desc:0 "Trains, camps and billets to take the plain towns into the coastal hills."
 VER_wd_district_stocks:0 "Stocks in Every District"
 VER_wd_district_stocks_desc:0 "Water, lamp oil, medicine and food for a fortnight in each district office."
 VER_wd_war_premium:0 "Crude at Wartime Prices"
 VER_wd_war_premium_desc:0 "Verusan crude sells abroad at prices set by somebody else's war."
 VER_wd_crude_reserve:0 "Crude Kept at Home"
 VER_wd_crude_reserve_desc:0 "Exports are capped and the tanks at home are full."
 VER_wd_standing_buyers:0 "Buyers Who Stayed"
 VER_wd_standing_buyers_desc:0 "Wartime buyers kept on long contracts at ordinary prices."
 VER_wd_home_insurance:0 "The Home Insurance Pool"
 VER_wd_home_insurance_desc:0 "The treasury insures Verusan freighters and tankers itself."
 ac_wd_ver.1.t:0 "The Renewal Minuted by Name"
 ac_wd_ver.1.d:0 "The standing order that lets the National Administration govern without an election comes up for renewal again, as it does every few months, and this time the cabinet secretary has ruled a column beside each minister's name. The Verusan Federation has six districts, a capital on its western plain and a ruling party almost nobody votes for. Until now the renewal has passed in silence. Today every minister's answer will be written down.\n\nThe figures in the ministers' folders are blunt. Half the country answers to a nationalist movement whose rallies fill the squares of District C and District F, plain districts on the Yuktobanian frontier with no plant and no garrison. Nearly all the rest follows no movement at all: officials, plant managers, railway engineers and harbour masters who want rules that work. The democrats whose name the Administration carries would fit in one hall.\n\nThe renewal will pass; nobody doubts that. What the ministers must decide is whether the minutes leave the building. Published, they show the country a government that knows it is temporary and says so. Kept in the cabinet safe, they let the Administration choose its successor quietly, at the price of every rumour the capital can invent.\n\nProvisional gameplay."
 ac_wd_ver.1.a:0 "Publish the minutes."
 ac_wd_ver.1.b:0 "Keep the minutes in the cabinet safe."
 ac_wd_ver.2.t:0 "One Junction, One Runway, One Silo"
 ac_wd_ver.2.d:0 "The staff study arrives on the cabinet table bound in plain grey card. Its first page is a map of the Capital District: nine provinces of open plain, the Silvonian frontier along its western edge, and the junction where every Verusan railway line begins. Marked in red are the federation's only air base, its only fuel silo, its largest garrison and four of its ten plant halls.\n\nThe study accuses nobody. Silvonia is a neighbour whose farming district across the line sends traders and grain carts, and nothing in the files suggests it wishes Verusa harm. The authors simply ask what the federation would do if its capital stopped working for a week, whatever the cause: fire, flood, a strike, something from the sky. Their answer is that it would do very little, because everything waits on the capital.\n\nTwo replies circulate before the ink is dry. One says the government should prepare a second seat far from the plain, in the port of District E behind its jungle hills. The other says the capital must be made harder to stop, and that a government which plans to leave has already half left. The cabinet can begin by putting the study before the public, or by keeping it inside the staff.\n\nProvisional gameplay."
 ac_wd_ver.2.a:0 "Publish the study."
 ac_wd_ver.2.b:0 "Keep it inside the staff."
 ac_wd_ver.3.t:0 "A Waiting List for Land"
 ac_wd_ver.3.d:0 "The plant survey of Districts D and E comes back with a document nobody expected: a waiting list. Every plot near the coastal railheads with power, water and a siding already holds a plant hall, an arms works or a yard. Firms that want to expand have queued for land for years, and some have stopped asking. The coast, which carries all of the federation's industry outside the capital, has run out of room.\n\nThe survey also counts what comes out of the ground. Oil, steel and aluminium are split almost evenly between the Capital District, District D and District E, with a little rubber in each. Districts B, C and F hold none of it and no plants either. Their young workers take the train to the coast, where housing is short and the managers pick the strongest hands first.\n\nThe planning office sees three directions: make the existing halls produce more, build new halls in the empty districts, or organise everything around the oil. Each has champions in the ministries and the districts. Before choosing, the office must decide whether to publish the waiting list, which would embarrass the coastal managers and delight the governors of the empty districts.\n\nProvisional gameplay."
 ac_wd_ver.3.a:0 "Publish the waiting list."
 ac_wd_ver.3.b:0 "Pass it to the ministries only."
 ac_wd_ver.4.t:0 "Every Train Waits at the Capital"
 ac_wd_ver.4.d:0 "The railway office's survey of the network is short because the network is short. Three lines leave the capital: one across the District C plain to District D, one straight to the port of District E, and one through the hills of District B to the same port. There is no line between the two coastal districts, none into District F, and none that avoids the capital junction.\n\nOn an ordinary day the arrangement works. Grain comes in from District C, crude and steel from the coast, and troops and mail go out in every direction, all of it sorted in one yard. On a bad day, the survey warns, a single derailment in that yard would stop freight to every district at once. No such stoppage is on record, the authors admit, but no plan exists for one either.\n\nThe office asks for two things. The first is money to keep the existing lines sound through the wet season, when the hill section in District B always suffers first. The second is a decision on whether the federation needs a route that avoids the capital, by road or by sea. The cabinet can approve the first at once and argue about the second for years.\n\nProvisional gameplay."
 ac_wd_ver.4.a:0 "Send inspectors to the hill section now."
 ac_wd_ver.4.b:0 "File the survey for the next budget."
 ac_wd_ver.5.t:0 "The Hill Embankment Slips"
 ac_wd_ver.5.d:0 "The inspectors reach the District B hill section in the middle of the rains and find what they feared. A long embankment above a jungle ravine has begun to slide, with cracks across the ballast and water forcing through a culvert built for a smaller stream. Trains still cross it at walking pace. The engineers give it weeks, perhaps less, before it goes.\n\nClosing the section would send every train between the capital and the port onto the direct line to District E, which is already busy. Keeping it open while crews rebuild the culvert risks a train and its crew. The district governor wants the line kept open because the hill towns live on it. The railway office wants it shut, because a derailment would close it for far longer.\n\nThere is a third and dearer answer: bring work trains, gangs and ballast from every line in the federation, rebuild the culvert by night and run traffic by day. It would spend the railway office's maintenance money for the year and stop repairs everywhere else. The cabinet must choose before the next heavy rain chooses for it.\n\nProvisional gameplay."
 ac_wd_ver.5.a:0 "Close the section and rebuild it properly."
 ac_wd_ver_5_a:0 "Close the section and rebuild it properly."
 ac_wd_ver.5.b:0 "Rebuild by night and run by day."
 ac_wd_ver.5.c:0 "Keep the trains crawling over it."
 ac_wd_ver.6.t:0 "Three Garrisons, Three Empty Districts"
 ac_wd_ver.6.d:0 "The muster takes a month, because every formation must be counted in its own garrison and there are only three garrisons: the capital holds three formations and each coastal logistics centre holds two. Every formation has six infantry battalions and an engineer company, rifles for every man, lorries in uncertain condition and very little artillery. The counting officers sign for each rifle and note each lorry that will not start.\n\nThe muster officers also record where the army is not. Not one battalion is quartered in District B, District C or District F, the three districts that carry most of both frontiers. A unit ordered there travels by rail through the capital or, for District F, by road, because no railway reaches it. The plain districts know this, and the nationalist papers print it every week.\n\nThe general staff must now tell the government what the army is for. It could be a force that holds the capital on the plain, a force that holds the coast and gives ground, or a reserve that moves wherever it is needed. The full report will take months. Its first page, the only one most ministers will read, has to be agreed now.\n\nProvisional gameplay."
 ac_wd_ver.6.a:0 "Report the gaps honestly."
 ac_wd_ver.6.b:0 "Report readiness and fix the gaps quietly."
 ac_wd_ver.7.t:0 "Sixty Freighters, Four Warships"
 ac_wd_ver.7.d:0 "The Maritime Service presents its annual report in person this year, at the government's request. Three coastal escorts and one coastal submarine, all based at the District E harbour, guard a coast that runs from the hills of District B past the port to the jungle of District D. Sixty coastal freighters carry grain, crude, steel and passengers along it and out to markets abroad.\n\nThe commanders do not ask for a fleet. They ask for things they consider modest: a second place to repair a hull if the District E yards are ever out of action, better charts of a coast whose sandbanks have moved since the last survey, and a ruling on whether their job is to escort freighters or to watch the harbour approaches. Four ships cannot do both.\n\nThe ministers listen politely and then argue among themselves. The coastal districts want the service seen at sea, the capital wants it cheap, and nobody wants to tell the public that the federation's navy fits in one harbour. The government can at least decide whether the report is debated in the open or filed.\n\nProvisional gameplay."
 ac_wd_ver.7.a:0 "Debate the report in the open."
 ac_wd_ver.7.b:0 "File it and fund the yards quietly."
 ac_wd_ver.8.t:0 "A Field the Neighbours Can See"
 ac_wd_ver.8.d:0 "Every Verusan combat aircraft is parked on one air base in the Capital District, sixty fighters and twelve support aircraft wing to wing on the same aprons. The base shares the capital's fuel silo and its railway junction, which makes supply easy and makes the whole air arm a single target. From the end of the main runway, the air staff points out, the Silvonian frontier is a short flight away.\n\nNobody suggests that Silvonia means harm, and the air staff is careful to say so. Its argument is plainer. An air arm that one fire, one flood or one accident on a crowded apron can put out of action is not an air arm a federation should depend on. The staff wants a second field behind the hills of District E and a strip near the District D logistics centre.\n\nPilots and their families like living in the capital, and the capital's suppliers like the pilots. Splitting the air arm means new housing, new fuel tanks and maintenance crews divided between fields. The finance ministry asks what the first new field would cost. The air staff answers with a number, and the government must decide whether to start paying it.\n\nProvisional gameplay."
 ac_wd_ver.8.a:0 "Begin the dispersal at once."
 ac_wd_ver.8.b:0 "Wait for the next budget."
 ac_wd_ver.9.t:0 "Reports from Both Lines"
 ac_wd_ver.9.d:0 "The survey teams come back from the frontiers with very different notebooks. The western team, working along the Silvonian frontier beside the capital and through the hills of District B, describes farm carts, traders, a few smugglers and long queues at the crossing huts. Silvonia's farming district lies across the plain, and much of the traffic is simply people buying and selling across a line they have always crossed.\n\nThe northern team, working along the Yuktobanian frontier through the plain of District C, the open country of District F and the jungle of District D, describes long stretches where no post stands for days. Nobody has set a marker stone in living memory. The team found no trouble, but it also found that nobody on the Verusan side would have known if there had been any.\n\nDistrict F appears in both notebooks, the only district that touches both neighbours and the only one without a railway. The cabinet has money for one frontier programme at a time. Before it decides which line comes first, it can publish both reports, or keep the northern one confidential so as not to alarm the plain districts.\n\nProvisional gameplay."
 ac_wd_ver.9.a:0 "Publish both reports."
 ac_wd_ver.9.b:0 "Keep the northern report confidential."
 ac_wd_ver.10.t:0 "Where Will the Pieces Fall"
 ac_wd_ver.10.d:0 "In April 1996 the President of the FCU tells the world that Ulysses will strike the Earth and that plans to counter it are under way. No astronomer will say where the fragments will land. In Verusa the news comes over the evening radio, and by morning the capital's shops have sold out of water containers, candles and lamp oil.\n\nThe federation's position is awkward. Its capital, its largest garrison and its only air base stand on open plain with no rock to dig into and no hills to hide behind. Its coast has jungle hills, mountains and old workings that could shelter thousands, but the coast is reached by three railway lines that all start in the capital. Every plan anyone drafts begins at that junction.\n\nThe ministers must give the public something before the rumours take over. They can announce at once that shelter plans are being drawn up and ask for patience, which will reassure some families and frighten others. Or they can say only that the government is studying the matter, which buys time and leaves the field to every rumour in the capital.\n\nProvisional gameplay: date anchors only, ACES Chronicle rows 1994 / 12.10 and 1996 / 04.20; Verusan preparations are gameplay."
 ac_wd_ver.10.a:0 "Announce shelter planning at once."
 ac_wd_ver.10.b:0 "Say the matter is under study."
 ac_wd_ver.11.t:0 "The Junction on the Long Night"
 ac_wd_ver.11.d:0 "On 8 July 1999 Ulysses passes through the Roche limit and begins to break apart. Verusa spends the night awake. The district wardens keep their lists by the door, the observer posts on the coastal peaks keep their radios open, and the capital's railway junction, the hinge of every Verusan emergency plan, runs on the night timetable with every signal box manned.\n\nThe junction is where the night is decided. Families with relatives on the coast crowd the capital station hoping for seats the timetable reserved for the sick and the old, and stationmasters hold them back with lists and patience. Freight waits in the sidings so that passenger trains can move, and by morning the coastal plants are short of crude because nothing heavy has passed through the yard.\n\nWhen daylight comes nothing on Verusan soil has been confirmed as fallen, and nothing has been ruled out either. The cabinet must decide whether to keep the night timetable until every district has reported, or release the freight at once and let the coast restart its plants. Either way, the junction has shown how much depends on it.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1999 / 07.08; no damage in Verusa is claimed."
 ac_wd_ver.11.a:0 "Keep the night timetable until every district reports."
 ac_wd_ver.11.b:0 "Release the freight at once."
 ac_wd_ver.12.t:0 "Premiums on Every Barrel"
 ac_wd_ver.12.d:0 "On 25 March 1995 war breaks out around Belka, on the far side of the world from the Verusan coast. The first thing the federation feels is not fear but the telephone. Brokers who never showed interest in Verusan crude ask for prices, charter rates for tankers climb week by week, and insurers attach war clauses to cargoes that will never pass near the fighting.\n\nThe coastal producers are delighted and the coastal plants are not. Every barrel sold abroad at war prices is a barrel the plants, the railways and the Maritime Service must now buy at the same price. The capital's fuel silo, the only one in the federation, holds a modest reserve. The nationalist papers ask why Verusa should profit from somebody else's war, and the producers ask why it should not.\n\nThe government cannot set the world price, but it can decide how much crude leaves the federation. It can let the buyers take all they want, or cap exports and fill the tanks at home. Either answer sends a message to buyers who will remember it when the war is over, and to producers who will remember it at every budget.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25; Verusa takes no part in the war."
 ac_wd_ver.12.a:0 "Let the buyers have it."
 ac_wd_ver.12.b:0 "Cap exports for now."
 ac_wd_ver.13.t:0 "Stonehenge and the Freight Market"
 ac_wd_ver.13.d:0 "The news from Usea in the summer of 2003 is that Erusea has marched into San Salvacion for all its neutrality, taken Stonehenge, and put the great railguns to work against aircraft. Usea lies a long way from the Verusan coast and the federation has no part in the war. Within weeks, all the same, the brokers are calling again and the insurers are rewriting their clauses.\n\nThe insurers move first. Rates rise on cargoes anywhere near a sea lane they consider exposed, and the federation's sixty freighters, which never sail near Usea, are caught in the same clauses as everyone else. Owners on the coast threaten to lay up their ships. The oil producers, meanwhile, expect another windfall and have begun to say so in public.\n\nThe air staff adds a question of its own: what a weapon that fires on aircraft from the ground means for an air arm that is small and has few fields. The government cannot answer every question at once. It can order a staff study of the Usean war, which takes officers from their posts for a year, or leave the war to the brokers and keep its own budget as it is.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2003 / SUMMER; the Verusan response is gameplay."
 ac_wd_ver.13.a:0 "Order a staff study of the war."
 ac_wd_ver.13.b:0 "Leave it to the brokers."
 VER_wd_federal_cabinet_office:0 "Cabinet of the Federal Assembly"
 VER_wd_federal_cabinet_office_desc:0 "A cabinet chosen by and answerable to a federal assembly elected from all six districts, governing collectively on a fixed election calendar under the name of the Verusan Federation. Provisional gameplay office with no named holder."
 VER_wd_provisional_council_office:0 "Council of the Provisional Government"
 VER_wd_provisional_council_office_desc:0 "A council of senior officials, plant managers and railway engineers governing for a fixed term under a provisional statute, with no assembly sitting; the mod already names this form the Verusan Provisional Government. Provisional gameplay office with no named holder."
 VER_wd_frontier_committee_office:0 "Committee of the Frontier Districts"
 VER_wd_frontier_committee_office_desc:0 "A committee drawn from the nationalist movement of the plain districts, ruling by decree with a frontier warden beside every district governor. Provisional gameplay office with no named holder."
 ac_wd_ver_decisions:0 "Verusa: National Measures"
 ac_wd_ver_decisions_desc:0 "Measures from the national programme of Verusa. Provisional gameplay unless a source ledger row says otherwise."
 VER_wd_formation_callout_decision:0 "Call Out One Formation"
 VER_wd_formation_callout_decision_desc:0 "One formation is called out by letter from the roll and moved by rail to a frontier district for a fortnight. Repeatable once a year; the call-out costs wages and fuel."
 VER_wd_frontier_fair_decision:0 "Hold a Frontier Fair"
 VER_wd_frontier_fair_decision_desc:0 "The western frontier towns hold a fair with licensed stalls from both sides of the line. Repeatable once a year."
 VER_wd_open_granaries_decision:0 "Open the Federal Granaries"
 VER_wd_open_granaries_decision_desc:0 "The capital granaries sell their stores below market price to calm a hungry or frightened city. Once only; the stores are gone afterwards."
 VER_wd_d_strip_aprons_decision:0 "Concrete Aprons for the District D Strip"
 VER_wd_d_strip_aprons_decision_desc:0 "Concrete aprons and sealed fuel stores let the District D strip hold more aircraft through the wet season. A one-time works programme."
 VER_wd_coastal_patrol_week_decision:0 "A Week of Coastal Patrols"
 VER_wd_coastal_patrol_week_decision_desc:0 "All four hulls sail together along the coast from District B to District D. Repeatable every six months; it burns fuel the service would rather keep."
 VER_wd_relay_b_line_decision:0 "Relay the District B Hill Line"
 VER_wd_relay_b_line_decision_desc:0 "Work trains relay the hill section of the District B line with heavier rail and new drains. Once only."
