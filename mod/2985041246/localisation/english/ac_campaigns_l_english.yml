 ac_camp.62.t:0 "The copy without the correction"
 ac_camp.62.desc:0 "The investigator placed the two messages side by side and asked the clerk which one had arrived first. The clerk answered immediately, then looked at the door as though the question had acquired a meaning only after he spoke.\n\nThe discrepancy was small. One receiving time, one alteration to a distribution list. Neither page contained enough information to support the conclusions that people would eventually want from it. Together they were sufficient to show that the current account could not be accepted without further work.\n\nProtecting the evidence had cost capacity that might have been used for a simpler military task. It had also committed the command to protecting the people who could explain the difference between the papers. A successful investigation could not be measured entirely by the number of documents collected if its witnesses learned that answering a question made them easier to find.\n\nThe clerk asked whether he should prepare another corrected copy. The investigator said no. For the first time in the conversation, the answer sounded easy.\n\nAcross the room, a telephone rang until someone in another office picked it up. The investigator imagined how many conversations could fit between the request for an order and the order reaching the aircraft expected to obey it. A network did not need to control every voice. It needed a few voices to be treated as beyond question.\n\nHe wrote the clerk's receiving account on a separate sheet and explained where it would be kept. The explanation took longer than the discovery. It was the part on which the next witness would depend."
 ac_camp.62.a:0 "Protect the witness and circulate the contradiction."
 ac_camp.62.b:0 "Keep the inquiry inside a protected channel."
 ac_camp.62.z:0 "Close this old message."
