 ac_lhw_ceasefire_pending:0 "The ceasefire answer is pending"
 ac_lhw_ceasefire_window:0 "The ceasefire window is open"
 ac_lhw_ceasefire_signed:0 "The ceasefire was signed"
 ac_lhw_ceasefire_early:0 "An early ceasefire was earned and signed"
 ac_lhw_ceasefire_refused:0 "Erusea refused the ceasefire and fought on"
 ac_lhw_ceasefire_not_made:0 "The ceasefire was signed but the engine kept the war"
