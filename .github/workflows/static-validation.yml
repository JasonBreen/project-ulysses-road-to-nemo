name: Static validation

on:
  push:
  pull_request:

jobs:
  map-validation:
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up offline contract test runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install artwork validation dependency
        run: python -m pip install Pillow==11.3.0 numpy==2.2.6
      - name: Check world registry, partner starts and Erusean foundation
        run: python -B tools/world_foundation/test_foundation.py
      - name: Check full national economy and legacy continuity
        run: python -B tools/Test-EconomyV2.py
      - name: Check settled ledger, monetary carry and briefing page geometry
        run: python -B tools/Test-EconomyLedger.py
      - name: Check observed force-cost groups and overlap-safe allowances
        run: python -B tools/Test-ForceUpkeep.py
      - name: Check real economy and institution owners together
        run: python -B tools/Test-SharedSystems.py
      - name: Check national institutions and administrative programme lifecycle
        run: python -B tools/Test-Institutions.py
      - name: Check Usean partner output and Package 1 owners
        run: python -B tools/usean_partners/build.py --check --require-dependencies
      - name: Check Usean partner programmes, outcomes, saves and artwork
        run: python -B tools/usean_partners/test_content.py --require-dependencies
      - name: Check Anea country foundations and DLC rosters
        run: python -B tools/anea/test_foundation.py
      - name: Check Anea national campaigns
        run: python -B tools/Test-AneaCampaign.py
      - name: Check Anea aid and recovery lifecycle
        run: python -B tools/Test-AneaSystems.py
      - name: Check Anea original artwork and bindings
        run: python -B tools/Test-AneaArt.py
      - name: Check Anea country selection and office presentation
        run: python -B tools/Test-AneaPresentation.py
      - name: Check integrated Anea historical and alternate routes
        run: python -B tools/Test-AneaIntegration.py
      - name: Check Usean expansion
        run: python -B tools/Test-UseaExpansion.py
      - name: Check interface repairs and starting governments
        run: python -B tools/Test-InterfaceRepairs.py
      - name: Check Continental War generated output
        run: python -B tools/build_continental_war.py --check
      - name: Check every authored asset dependency
        run: python -B tools/audit_visual_dependencies.py --strict-all
      - name: Check briefing artwork and original layout
        run: python tools/frontend_briefing/validate.py
      - name: Check map font and display branding
        run: python tools/frontend_typography/validate.py
      - name: Check faction lifecycle and DLC fallback contracts
        run: python -B tools/Test-UlyssesFactions.py
      - name: Run static regression checks
        shell: pwsh
        run: .\tools\Test-UlyssesStatic.ps1 -ModRoot .\mod\2985041246
