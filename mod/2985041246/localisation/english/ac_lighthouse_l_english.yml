 ac_lhw_eru_war_footing:0 "Erusea at War"
 ac_lhw_eru_war_footing_desc:0 "The ACES Chronicle records the Kingdom of Erusea's declaration of war on the Osean Federation for 15 May 2019 (2019 / 05.15). The kingdom is on a war footing until the fighting actually ends; this campaign fixes no end date."
