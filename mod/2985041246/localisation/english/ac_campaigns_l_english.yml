 ac_camp_fcu:0 "Central Usea and ISAF — campaign operations"
 ac_camp_fcu_desc:0 "Commit resources to preparation, conduct operations, and read the delivered scenes. Historical dates open opportunities; results depend on present conditions. All alternate routes and dialogue are authored gameplay."
 FCU_camp_0_register:0 "Consent to command"
 FCU_camp_0_register_desc:0 "Consent to command. Open the campaign lane and its preparation record.\n\nThe allied table has more chairs than the room was designed to hold. Each chair represents a government that can say no, and a staff officer has already suggested removing the empty ones from the photograph. Shared authority makes command slower and the commitments more credible. Unified direction gives the operations staff clearer answers while concentrating responsibility for mistakes. The coalition needs a command it can use and an agreement its members will honor when the losses cease to be hypothetical. The first reconnaissance operation begins with those obligations rather than with a speech about unity."
