 NEC_nc_reserve_service_1_spirit:0 "Call Up a Training Period"
 NEC_nc_reserve_service_1_spirit_desc:0 "The maritime reserve staff maintains this funded service for ninety days. Call reserve crews for a scheduled period aboard inspected vessels. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
