 ac_sq_ust_cast_mara_dalen:0 "Mara Dalen"
 ac_sq_ust_cast_mara_dalen_desc:0 "Fighter and close-support pilot\n\nMara joined a small service because it could still feel like a promise made to people she knew. She wants to defend more than the airfield fence, but is learning that every additional promise needs fuel, time and somebody willing to wait for her return."
 ac_sq_ust_cast_elias_vey:0 "Elias Vey"
 ac_sq_ust_cast_elias_vey_desc:0 "Wingman\n\nElias has trained carefully for emergencies that arrive in an orderly sequence. His first squadron gives him friends who will not let him hide that uncertainty. He is quick to volunteer and slow to admit when a volunteer has become the person everybody expects to go."
 ac_sq_ust_cast_niko_arven:0 "Niko Arven"
 ac_sq_ust_cast_niko_arven_desc:0 "Maintenance lead\n\nNiko regards ingenuity as a tool, not a supply policy. He can keep an old machine useful and will argue fiercely about the point at which useful becomes unsafe. He remembers who helped when the stores were empty, including people the squadron would rather forget owing."
 ac_sq_ust_cast_irena_sorel:0 "Irena Sorel"
 ac_sq_ust_cast_irena_sorel_desc:0 "Operations and rescue controller\n\nIrena keeps several versions of every route: the fast one, the safe one and the one that still works when somebody fails to arrive. She is protective of civilians whose names never reach a squadron roster. A map, to her, is a list of people who will ask why they were not on it."
 ac_sq.201.t:0 "The Address on the Envelope"
 ac_sq.201.d_base:0 "Mara found the envelope inside the pocket of her new flight jacket. Her mother had written the return address twice, once on the front and once on a card tucked inside, as though the postal service might lose the country while finding the house. Elias thought it was funny until Irena asked him to name the person who would receive a message if his own plan failed. Niko was trying to make a locker door close and offered no answer from behind it. Mara could tell the newcomers where the station would send a missing pilot's belongings. She could also admit that the more useful question was who would notice an ordinary promise had not been kept."
 ac_sq.201.a:0 "Learn each other's return addresses."
 ac_sq.201.a.reply:0 "Irena puts a private contact card beside each roster entry, and Elias stops treating the envelope as a joke."
 ac_sq.201.b:0 "Establish the formal contact chain first."
 ac_sq.201.b.reply:0 "Elias repeats the duty number back correctly, though nobody yet asks who might answer at home."
 ac_sq.202.t:0 "The Fold in the Map"
 ac_sq.202.d_base:0 "Irena's route chart would not lie flat. One fold passed through the place she always pointed to first, and every attempt to smooth it made a new crease somewhere else. Elias offered to draw a cleaner copy. She thanked him, then showed Mara the pencil marks that would disappear with the old paper: a vehicle too wide for a turn, a gate locked after dark, a family who could hear the road before they could see it. None was a secret. All had been easy to omit from the official diagram. Mara could ask the controller to keep being the person who remembered, or make the awkward knowledge something another watch could actually use."
 ac_sq.202.a:0 "Copy the awkward details too."
 ac_sq.202.a.reply:0 "Elias spends the afternoon redrawing the turns while Irena explains the people behind each pencil mark."
 ac_sq.202.b:0 "Keep Irena's practical chart beside the clean one."
 ac_sq.202.b.reply:0 "Irena promises to check every route herself, and Elias leaves with a diagram he can read at a glance."
 ac_sq.203.t:0 "A Machine That Knows Your Name"
 ac_sq.203.d_base:0 "Niko introduced the spare aircraft by explaining which noises would frighten a new pilot unnecessarily. Elias asked which ones should frighten him, and Niko stopped smiling long enough to answer properly. Mara had learned the same machine through habit, which made her an unreliable witness to the experience of somebody who had none. They could give Elias a conservative familiarization and let confidence arrive with time. They could also make the whole flight rehearse how to describe a fault without relying on a nickname or an impression. The first approach would protect a nervous morning. The second might expose how much the experienced pilots themselves had stopped being able to explain."
 ac_sq.203.a:0 "Let Elias build confidence with a familiar crew."
 ac_sq.203.a.reply:0 "Niko stays beside the stand for the whole exercise, and Elias returns knowing a voice he can ask."
 ac_sq.203.b:0 "Make every pilot describe the warning clearly."
 ac_sq.203.b.reply:0 "Mara has to repeat her own explanation twice before Niko agrees a newcomer could use it."
 ac_sq.204.t:0 "The Seat Kept Empty"
 ac_sq.204.d_base:0 "The village exercise had allocated every seat before the bus reached its second stop. Irena climbed aboard to check the list and found a space reserved for someone no longer expected to travel. A teacher wanted to offer it to a tired parent; the driver wanted a name he could put against the change. Elias suggested taking the passenger himself on the station's next vehicle. Niko asked whether that vehicle had a driver who knew about the promise. Mara could preserve the day's comforting improvisation or make the exercise pause long enough to correct the receiving list. The empty seat was making everybody generous with somebody else's time."
 ac_sq.204.a:0 "Put a real name against the changed seat."
 ac_sq.204.a.reply:0 "The teacher helps Irena correct both ends of the route, accepting a delay she can explain to the passengers."
 ac_sq.204.b:0 "Find a station vehicle for the parent."
 ac_sq.204.b.reply:0 "Elias volunteers for the return journey, pleased that a small act can rescue an untidy exercise."
 ac_sq.205.t:0 "The First Spare Key"
 ac_sq.205.d_base:0 "Niko handed Mara the key to the stores cupboard because he was going to be away for a week. It was the first time he had done so without leaving a person to watch it. Elias immediately asked whether he could find a replacement for a worn kneeboard strap. Mara knew the answer would become an example. The cupboard held enough to solve several small problems and not enough to let everyone forget how it was restocked. She could keep Niko's informal priorities intact until he returned, or ask the crew to explain their requests to one another. Neither choice would conjure another box onto the shelf. Both would decide who felt entitled to open the door."
 ac_sq.205.a:0 "Agree the priorities together."
 ac_sq.205.a.reply:0 "Elias explains why his request matters and hears another one he had not noticed."
 ac_sq.205.b:0 "Keep Niko's dependable order until he returns."
 ac_sq.205.b.reply:0 "The familiar jobs are completed quickly, and the crew knows exactly whose promise it is relying on."
 ac_sq.206.t:0 "A Route Without an Ending"
 ac_sq.206.d_base_callback:0 "Irena had been given a route to keep available and no reliable estimate of how many people might need it. She spread the chart across two tables while Elias fetched another chair. Mara wanted to know what the flight could protect with the people and equipment it actually had. Niko wanted someone to stop calling a road available merely because a line still reached its far end. The briefing could begin with the promise that the squadron would do everything it could. It could also begin by naming the tasks it could not perform together, forcing somebody above the room to choose while there was still time to ask.\n\nThe copied turns and receiving points let a second controller question the route without needing Irena to speak for every mark."
 ac_sq.206.d_base:0 "Irena had been given a route to keep available and no reliable estimate of how many people might need it. She spread the chart across two tables while Elias fetched another chair. Mara wanted to know what the flight could protect with the people and equipment it actually had. Niko wanted someone to stop calling a road available merely because a line still reached its far end. The briefing could begin with the promise that the squadron would do everything it could. It could also begin by naming the tasks it could not perform together, forcing somebody above the room to choose while there was still time to ask."
 ac_sq.206.a:0 "Name the limits before making the promise."
 ac_sq.206.a.reply:0 "Irena leaves room beside each task for a responsible person, and the briefing becomes less reassuring but more usable."
 ac_sq.206.b:0 "Make the strongest promise the flight can sustain."
 ac_sq.206.b.reply:0 "Elias volunteers first, giving the room a confidence Mara knows she will now have to protect."
 ac_sq.207.t:0 "Two Voices in the Headset"
 ac_sq.207.d_war:0 "Irena's voice told Mara to turn back. Beneath it, almost swallowed by interference, another controller was still directing the flight toward a crossing under fire. Mara asked Elias which instruction he had heard. Only the second. She broke toward his aircraft and flashed her landing light until he looked across; together they turned away as smoke rose beyond the ridge. The return route took them low through a valley whose far end had disappeared in weather. For a moment Elias followed her by the white flicker at her wingtip rather than the ground. They reached the station with the conflicting call still running in his headset. In the hut, Irena separated the channels and let the room listen. Niko placed a chair beside the recorder rather than beside the door. They could share the failure openly, or protect Elias while rehearsing it privately. Neither version could reproduce that turn over the crossing. An honest debrief could refuse to remove it from the account."
 ac_sq.207.d_base:0 "The exercise put a simulated emergency call on the same circuit as the flight's next instruction. Elias answered the familiar controller first and missed half the other message. He was furious with himself afterward, which made Mara reluctant to turn the mistake into a lesson for everybody. Irena played the two voices separately and asked him which had sounded urgent before he knew what each wanted. Niko listened from a chair near the door. They could rehearse the conflict openly or protect Elias while correcting it inside the flight. The recording contained no convenient point at which a careful person could have known everything. That was the part Mara most wanted the others to hear."
 ac_sq.207.a:0 "Teach the conflict to the whole watch."
 ac_sq.207.a.reply:0 "Elias stays for the replay and eventually identifies the hesitation he wants the next pilot to recognize."
 ac_sq.207.b:0 "Keep his first mistake within the flight."
 ac_sq.207.b.reply:0 "Elias accepts the private practice gratefully, though Irena keeps the recording for a lesson she has not yet been invited to give."
 ac_sq.208.t:0 "A Place to Receive Them"
 ac_sq.208.d_base_callback:0 "The receiving room had chairs, a kettle and a list that ended halfway down the page. Irena had asked Mara to visit after a transport exercise because the people at the far end were still waiting for someone to explain which arrivals counted as theirs. Elias offered to stay until they had an answer. Niko reminded him that another promise would not make the list complete. Mara could press the station to acknowledge responsibility for every person it sent or use the flight's own time to bridge the gap. The room was a place people could reach. They were discovering how much more work it took to make it a place that could receive them.\n\nThe teacher from the earlier exercise knows which receiving clerk to ask for. A corrected list has become a connection that survives its authors."
 ac_sq.208.d_base:0 "The receiving room had chairs, a kettle and a list that ended halfway down the page. Irena had asked Mara to visit after a transport exercise because the people at the far end were still waiting for someone to explain which arrivals counted as theirs. Elias offered to stay until they had an answer. Niko reminded him that another promise would not make the list complete. Mara could press the station to acknowledge responsibility for every person it sent or use the flight's own time to bridge the gap. The room was a place people could reach. They were discovering how much more work it took to make it a place that could receive them."
 ac_sq.208.a:0 "Secure a named receiving watch."
 ac_sq.208.a.reply:0 "Irena waits for a responsible name before closing the route, and the list finally has an owner at both ends."
 ac_sq.208.b:0 "Stay until the last arrival is settled."
 ac_sq.208.b.reply:0 "Elias makes tea for people he had expected only to escort, accepting a long evening without calling it a sacrifice."
 ac_sq.209.t:0 "The Part Left on the Bench"
 ac_sq.209.d_capital_displaced_callback:0 "A replacement part arrived with the wrong attachment and the right paperwork. Niko set it on the bench without removing the tag. Elias thought he could make it fit; the suggestion was not foolish, which made the conversation harder. Mara had learned to admire ingenuity while other people were paying for the time it saved. This time the person being asked to accept the risk was standing in front of her. Niko wanted the decision written as a restriction, not celebrated as the latest example of how little the squadron could manage with. They could preserve an aircraft's usefulness or make its absence visible enough that another office had to respond.\n\nTheir capital district was outside the government's control. Irena revised the receiving list instead of pretending that an old address was still a destination. Elias asked whether she could leave a line blank for the people they had not located. She could, she said, provided he understood that a blank line was an obligation to enquire, not proof of a death.\n\nThe crew can see the cupboard for themselves. Nobody has to pretend Niko is withholding an easy answer."
