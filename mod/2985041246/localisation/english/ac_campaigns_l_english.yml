 ac_camp.7.t:0 "A chair by the window"
 ac_camp.7.desc:0 "The baker left his stool at the clinic. He said carrying it home and back again was becoming an inconvenience. The nurse thanked him without pointing out that he had begun bringing it only because the waiting room had lost half its chairs to a requisition.\n\nBy the window, the woman who had asked about her brother was repairing a tear in the child's sleeve. She had returned with a different question. Did the clinic know where a person should go if a letter had been taken at a checkpoint? The pharmacist said she would find out. She wrote the question in the private notebook, below the earlier question about a man who had not come home.\n\nThe stockbook still occupied the administrator's desk. Its empty columns had acquired dates. A promise was useful only until the people waiting began to organize their lives around it, and then it became a responsibility that someone had to carry even if the vehicle never arrived.\n\nThe porter checked the opening hours before he unlocked the door. Outside, a child was tracing a line through the dust with a broken piece of tile. The line crossed the clinic steps and continued toward the checkpoint. When the patrol appeared, he rubbed it away with his shoe.\n\n\"You can leave that,\" the porter said, too late for the child to believe him.\n\nHe went back inside and moved the baker's stool to the window. There would be someone waiting there tomorrow, whether the receiving route worked or not."
 ac_camp.7.desc.v0:0 "The baker left his stool at the clinic. He said carrying it home and back again was becoming an inconvenience. The nurse thanked him without pointing out that he had begun bringing it only because the waiting room had lost half its chairs to a requisition.\n\nBy the window, the woman who had asked about her brother was repairing a tear in the child's sleeve. She had returned with a different question. Did the clinic know where a person should go if a letter had been taken at a checkpoint? The pharmacist said she would find out. She wrote the question in the private notebook, below the earlier question about a man who had not come home.\n\nThe stockbook still occupied the administrator's desk. Its empty columns had acquired dates. A promise was useful only until the people waiting began to organize their lives around it, and then it became a responsibility that someone had to carry even if the vehicle never arrived.\n\nThe porter checked the opening hours before he unlocked the door. Outside, a child was tracing a line through the dust with a broken piece of tile. The line crossed the clinic steps and continued toward the checkpoint. When the patrol appeared, he rubbed it away with his shoe.\n\n\"You can leave that,\" the porter said, too late for the child to believe him.\n\nHe went back inside and moved the baker's stool to the window. There would be someone waiting there tomorrow, whether the receiving route worked or not.\n\nThe nurse had pinned the receiving request beside the stockbook. Its reference number had already been copied onto three forms, and now the next clerk would have something definite to ask for. The porter read it aloud once, testing whether an official number made the promised vehicle feel closer. She asked him to leave the paper where the patients could see it."
