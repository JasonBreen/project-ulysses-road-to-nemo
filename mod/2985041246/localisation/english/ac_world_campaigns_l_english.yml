 ac_wc_soa.1.d:0 "Mira Sellen asks whether an emergency signature can outrank the assembly. Eran Vey needs predictable orders for the workshops; Daren Halvek wants a command that can act before a crisis reaches the airfields.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
