 ac_snc_yuk_message_14.t:0 "The Request behind the Priority: The Hearing"
 ac_snc_yuk_message_14.d:0 "The waiting representative reads the third renewal aloud. The wording is almost identical to the first. The command liaison begins to explain why the conditions remain difficult, then looks at the date of the unanswered request. 'You have heard the priority,' the secretary says. 'We are asking who received the claim behind it.' A civil floor and a bounded command claim would impose different burdens, but either needs a responsible receiving office. The hearing can preserve an open account or a signed professional return. It cannot turn the claimant's continued patience into evidence that the explanation was adequate."
