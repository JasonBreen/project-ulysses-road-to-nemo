 FCU_fe_oversight_service_1_spirit:0 "Second an Advisory Team"
 FCU_fe_oversight_service_1_spirit_desc:0 "The treaty secretariat maintains this funded service for ninety days. Place advisers with Erusean ministries for a defined period with a written handover. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
