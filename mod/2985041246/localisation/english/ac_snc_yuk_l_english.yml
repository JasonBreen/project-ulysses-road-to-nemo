 YUK_snc_field_answers_protocol:0 "Follow a Fresh Instruction"
 YUK_snc_field_answers_protocol_desc:0 "Request a new funded training period to follow an instruction through the selected receiving procedure. Earlier exercises explain why the present command chain exists, but cannot certify the work it is doing now. The corresponding civil or protected lane must complete its actual period after this request. Staff will retain the first question, the authority that received it and the response that reached the next officer. If the period is interrupted, the missing return stays missing until a current request and genuine new work provide an answer that belongs to the present instruction."
