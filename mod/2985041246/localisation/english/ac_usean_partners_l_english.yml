 SNS_up_permanent_service_terms:0 "Permanent Service Terms"
 SNS_up_permanent_service_terms_desc:0 "Continuity staff will know the limits of their standing commitment. Clear terms support a lasting network and expose the opportunity cost of keeping it ready."
