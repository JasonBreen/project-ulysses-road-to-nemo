 OSE_snp_air_watch_policy_context_2:0 "The standing policy is protected interceptor training. Its continuing opportunity cost remains in the national schedule."
 ac_snp.13.t:0 "Three Seconds on a Training Tape"
 ac_snp.13.d:0 "A controller stops a recorded handover exercise at a three-second silence. No aircraft is waiting on this channel; the staff are working through a desk rehearsal. The training officer says that the silence allowed a confirmation to arrive. The civil liaison says the receiving office could not tell a deliberate pause from a broken connection. A junior controller asks whether that uncertainty belongs in the open lesson or in a protected instructor's return. Publishing it would let outside receiving offices test the procedure. Protecting the first debrief could make staff more willing to admit how uncertain they were. The tape remains stopped while the committee decides how the lesson will be received.\n\n[OSE_snp_air_watch_policy_context]"
 ac_snp.13.a:0 "Open the handover lesson to civil receiving offices."
 ac_snp.13.a_effect_tt:0 "Civil support +4, readiness support -2. Both observations remain within zero to one hundred."
 ac_snp.13.b:0 "Protect the instructor’s first debrief and require a bounded return."
 ac_snp.13.b_effect_tt:0 "Readiness support +4, civil support -2. Both observations remain within zero to one hundred."
