 ac_camp.2043.t:0 "A bounded offer from Sapin"
 ac_camp.2043.desc:0 "The access offer has a mandate attached. Sapin's government has specified which work it can presently authorize and where its responsibility ends. The receiving officer has seen access described as a preliminary to larger commitments often enough to read the restriction first. A clear acceptance would give the prepared operation a usable receiving permission. It would not create a base, an alliance or a declaration of war. The liaison asks for the original mandate to remain with the reply so that the next office cannot mistake a limited consent for an invitation to send a different request under the same reference number."
 ac_camp.2043.a:0 "Accept this defined commitment."
 ac_camp.2043.b:0 "Decline the offer."
 ac_camp.2043.z:0 "Close this old message."
