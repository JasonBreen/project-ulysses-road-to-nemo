 EVA_ecw_capital_service_1_spirit:0 "Staff the Core Services"
 EVA_ecw_capital_service_1_spirit_desc:0 "The ministry of public administration maintains this funded service for ninety days. Keep water, power and pension offices staffed and outside the conflict. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 EVA_ecw_capital_service_1:0 "Staff the Core Services"
 EVA_ecw_capital_service_1_desc:0 "Keep water, power and pension offices staffed and outside the conflict.\n\nThe ministry of public administration must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 EVA_ecw_capital_service_2_spirit:0 "Record the Instructions"
 EVA_ecw_capital_service_2_spirit_desc:0 "The cabinet secretariat maintains this funded service for ninety days. Log every order received and how each office answered it. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
