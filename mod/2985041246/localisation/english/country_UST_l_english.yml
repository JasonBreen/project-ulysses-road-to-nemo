 ### EVENTS ###
 
 ustio.1.t: "Offer from Ratio"
 ustio.1.d: "Following our recent acquisition of territory from Belka, our eastern neighbor of Ratio has approached us with a deal. The lands of Tyrann and Boikos are primarily Ratian in culture, as they were relatively recently conquered from them by Belka. Even after falling under our control in the Belkan Federal Law Review of 1988, Ratio has never renounced their claim on the lands, however they appear to be far friendlier to us than Belka. They have offered a deal to purchase the lands back from us for a generous price, far exceeding the actual value of the territories. This, combined with several clauses allowing us to move Ustian assets out of the land and into our core areas, and a parnership with our nation for future cooperations. This deal appears to be extremely beneficial for us, as in addition to the obvious monetary benefits, we have had extensive trouble dealing with partisan forces in the area, and as a relatively new nation in the world, the presence of another ally would be greatly valued. The only protest against this deal has come from Franek Dolas, who argues that we have spent extensive resources on the lands, and even if it was under Belkan leadership, many Ustians fought and died to conquer the land. As he argues, the strongest nation will be the one who succeeds, first it was Belka, and when they were proven weak, we rose to that position instead, and if Ratio thinks they should have the land they will need to prove their strength over us to obtain it. Aside from his ramblings, the advisory board is unanimous that this deal should be taken."
 ustio.1.a: "We gleefully accept!"
 ustio.1.b: "Dolas is right. The stronger nation is the one who deserves the land."
 
 ustio.2.t: "Osea Offers Western Land"
 ustio.2.d: "We received an interesting transmission from our allies in Osea today, offering us control over our former territories that were not liberated from Belka even after the 1988 Belkan Federal Law Review. It is strange to recieve this offer from a country that does not currently own these territories, however the Oseans revealed that as a part of a trade deal with Belka, the Belkans agreed to withdraw from all other occupied territories and sell the Great Lakes territories to Osea. While we would expect Osea to take these territories and sell them to us, they have not asked for a payment or even claimed the land, and are seemingly just giving it to us for free. The only request they made was to reaffirm our friendship, which we were more than happy to do, although this does make us wonder..."
 ustio.2.a: "...Just what are the Oseans planning?"
 
 ustio.3.t: "The Return of the West"
 ustio.3.d: "Following the Osean's transmission, sure enough, Belka soon retreated their armed forces from Western Ustio, allowing us to move in and take over ownership of the land. This is an unprecedented move and both widens our possibilities and responsibilities greatly. For now, however, Ustians both at home and in these new territories are rejoicing for the union with their brothers, and so soon after our own liberation to. Best of all is that not a single drop of blood was spilled for this. Perhaps when all this is over we can even maintain relations with Belka, as clearly if they are dealing with Osea, perhaps they will deal with us too."
 ustio.3.a: "Finally whole again."
 
 ustio.4.t: "A Welcome Surprise"
 ustio.4.d: ""We were from the 102nd Panzergrenadiers, sir." \n\nMen adorning Belkan uniforms and brandishing Belkan weaponary, now deep within the Ustian mountains bearing white flags, prostrated themselves before a group of extremely confused Ustian officers. Their Belkan flags were covered in strips of dirty cloth. Weapons of all kinds were pointed at them. \n\n"You mean to tell me..." \n\n"We were Belkan Armed Forces. We no longer wish to be." \n\nOne in particular spoke out, with a black and yellow beret brandishing the emblem of the Belkan Panzergrenadiers. It was clearly worn out, and painted over in red. \n\n"Are you their leader?" An Ustian officer asked. \n\n"Yes. Studied in Sudentor. Please forgive our trespasing, but we are of this countr-" \n\n"You know anything about Belkan High Command?" \n\nThe leader of the emigres stood, stiff as ever. "Yes." \n\n"We"ll get you new clothes. You won"t go unemployed.""
 ustio.4.a: "Welcome home brothers."
 
 ustio.6.t: "Ratio's Response"
 ustio.6.d: "In a great surprise to us, Ratio has pledged to provide vital assistance and help us in our war against Belka however possible, without directly getting involved. They justify their decision with sentiments of unity and cooperation that we shown during territorial issues from 1991, and how the peaceful entire land transition was.\n\nAs part of its commitment to support our defence efforts, Ratio has authorized the dispatch of volunteer forces to bolster the ranks of our military, providing additional manpower and expertise to strengthen the front lines. In addition, they also agreed to supply us with much-needed weaponry and military equipment, ensuring that we will have the necessary resources to effectively defend sovereignty and territorial integrity.\n\nFurthermore, Ratio has generously offered to allow us access to a portion of its industrial infrastructure for war production purposes, providing our army with a crucial lifeline to sustain its military efforts in the face of logistical challenges and resource constraints.\n\nWe will repay this unprecedented gesture – they have our ward."
 ustio.6.a: "But first...\n...we have a war to win."
 
 ustio.7.t: "Contact"
 ustio.7.d: ""Two KIA, Eight Wounded."\n\nColonel Marazewski poured his eyes over a set of papers on his desk. Each listed reports that had been written of a recent incident where... "Our troops fired upon Ratian troops that breeched our border." \n\nCrazy, that this was actually happening. \n\n"Not war yet, no?" The colonel shrugged. Who knew how this would develop. If it were up to him he"d stage a meeting and try to reach a peaceful settlement, with some sort of joint occupation until a referendum or whatever could be done with a final solution. \n\nBut it wasn"t up to him; He merely had to carry out his orders. A list of orders that increased exponentially, from defending fortifications to anti-partisan activities to border control. And he very recently had been told that any provocation should be retaliated against twofold, as a"Show of strength" for the young republic, hopefully detering any future aggression. It seemed as if his jurisdiction and responsibilities were expanding ever more, with a lack of promotion or rank to show for it. Was the army that overextended? \n\n"Are we going to follow up sir?""
 ustio.7.a: ""No, damnit! Issue an apology!""
 ustio.7.b: ""...Orders are orders.""
 
 ustio.8.t: "Pull back the Wool"
 ustio.8.d:  ""The Rail lines across Tyrran, sir." \n\nIn front of Colonel Marazewski this time, lay more papers, but instead of combat reports they were combat plans. Well, terrorist plans. Ratian partisans had created a plan to distrupt the rail links between Tyrran and Boikos, as well as the rest of the nation. Intricate, yet crudely composed, it consisted of the installation of Pipe Bombs during the night onto the rail networks, after the provocation of watchmen with rifle fire. \n\n"And they want to kill the guards and overrun the rail line, install the explosives, run, and set them off at peak times?" \n\n"That's what it says sir." \n\nWhat kind of dogs think of such things? \n\n"We could just heavily reinforce the various rail lines that they want to attack, but that"ll still likely get people killed... Do we know the people who are behind the operation?" \n\n"No sir. We have a long list of suspects, and lots of fingerprints as well as handwriting can be traced, however we do not know all the potential perpetrators. For all we know, it could be an entire suburb in Tyrann, sir." \n\nArresting a group would be quite belligerent, but it would ensure no one would get hurt in the long run... Reinforcement means engagement is certain, and with the skill of the partisans, Ustian blood would be spilled. But mass arrest is quite..."
 ustio.8.a: "...Reinforce the railway. No controversy."
 ustio.8.b: "...Arrest all suspects! Bloodless!"
 
 ustio.9.t: "To Find A mediator"
 ustio.9.d: "Amidst the escalating tensions and territorial disputes with Ratio, president Naruszewicz has made a strategic decision to seek the intervention of a great power to mediate the ongoing border conflict. We are recognizing the complexity and potential volatility of the situation, so we opted to appeal to the diplomatic expertise and influence of a prominent global actor in the "hopes" of facilitating a peaceful resolution to the longstanding dispute.\n\nIf everything goes okay, the appeal for mediation will be met with optimism by the international community, and will hopefully buy us more time to get ready for imminent conflict while hiding behind "proactive" efforts to de-escalate tensions and pursue a peaceful resolution to the border dispute.\n\nSadly we only have two real options for a mediator on whom Ratio will agree. And both of the are rather not great..."
 ustio.9.a: "Ugh... We will ask the Belkans."
 ustio.9.b: "Yuktobania is the only real option here."
 
 ustio.10.t: "Mundane Deaths"
 ustio.10.d: ""Two Dead, Sixteen Wounded." \n\nColonel Marazewski stared into the ceiling. His eyes were pratcially lifeless. Hearing death and agony had become a regular occurance at this point. Ratian partisan resistance had evolved from isolated terrorism to an entire secret hidden insurgence campaign. The government has done a great job concealing it, much to the detriment of the president's time and mental health, but the military were just not equipped for this kind of war. \n\n'structural integrity of the building has been compromised. We cannot repair it quickly, we will effectively have to construct a whole new centre." \n\nAnother building, this time a barracks for Ustian troops, had been attacked and destroyed. Thankfully, not many soldiers were around to be killed, due to a set of maneouvres the Colonel had put in place to ensure that soldiers are not easy targets for terrorism. However... \n\n"We need a place for those boys to sleep now."\n\nQuite frankly, the destruction and death hurt the man's heart. The runner in front of him knew this, reading it all over his relatively pale and slowly sickening complexion. The whole ordeal was not good for the Colonel's health. \n\n'sir, if you don"t mind my suggestions, I"d reccomend a call for reinforcement, sir. You"d do well with some relief, and more help could mean mroe efficient patrols, sir." \n\nThat was an option yes... But demands had already began coming in for troop withdrawal. Bringing more in would be a statement, but it was a statement that Marazewski could make..."
 ustio.10.a: ""Lets just double our hours.""
 ustio.10.b: ""Then let us call for reinforcement.""
 
 ustio.11.t: "More Mundane Deaths"
 ustio.11.d: "'seventeen Dead, Thirtyfour Wounded." \n\nWhat the fuck!? \n\n"Are they fucking SERIOUS!?!?" Marazewski slammed his entire arm on the desk. The reverberations shook the room, with a couple of items falling from the desk to the floor. Among them, a rolled up message from Ratian forces requesting investigatory powers. \n\n"Are they crazy? What kind of sick FUCKS are they?" \n\n"I don"t know sir." \n\n"To think they"d set of bombs in cars, near military installations and law enforcement, in administration sectors, I understand that kind of resistance." \n\nThe heated rage in the colonel's voice could be felt burning just from his words. You didn"t even have to reach forwards, the flames licked at your skin however far you"d be. \n\nHe settled down. \n\n"...Of all places, a toy shopping district..." \n\nThe room fell into a deathly silence. The colonel slumped down into his chair and buried his forehead into the palm of his hand, his eyes burning holes into the reports in front of them. Amongst the dead and injured, only one of them could be considered a suitable target, being the son of a police officer. The rest, were genuine civillian children, out shopping for gifts for the upcoming gift-giving season.\n\n"... Sir, I don"t know, but I think we"re fighting the right fight at this point. But... What do we do about this sort of thing...?""
 ustio.11.a: ""...There's nothing we can do.""
 ustio.11.b: ""A strict curfew. Stations everywhere. ANYTHING.""
 
 ustio.12.t: "A Firm Solution?"
 ustio.12.d: "Marazewski, was at this point, just a general in a colonel's rank. He oversaw every detail in the east of the country, and was responsible for all the decisions taken. That being said... A very pressing decision had to be made. \n\nRight now. \n\nIn his hands, partially crumpled up due to pure stress, were requests for a demilitarisation of the east. \n\nOn one hand, the man would KILL to be transferred elsewhere. He doesn"t even know why he's still here, why the country still protected this land. \n\nBut on the other hand... He has orders, and national pride. Can he REALLY justify any sort of dismissal of his own orders? As various as they are, he has a duty as a soldier of the nation. \n\nNot that he had much time to think, the offer expired quite soon. He sighed, galloped his coffee, and looked up. His trusted advisor and soldier, who was basically his second in command in all but rank at this point, stood awaiting. Ready to relay whatever the colonel wished.\n\n Truthfully, he also wanted to leave. He wanted to go home. He wanted to see his family and see peace. But wherever the colonel placed him, he would stay there with all his heart. It was his service, his duty, his response, to his country's gift of freedom. \n\nThe colonel opened his mouth."
 ustio.12.a: "Lets get the hell out of here."
 ustio.12.b: "We stay."
 
 ustio.13.t: "A Firm Response?"
 ustio.13.d: "Marazewski sighed. It was time. He had planned for this very instance, with prayers it would never come to this. But it did. \n\nThe past few months had revealed something abour Marazewski. He had discovered his hatred of death, his hatred of conflict, his hatred for war. Yet here he was, being the mastermind behind the operation to remilitarise Tyrann and Boikos, before conducting "Operation Backstep", a surprise attack into Ratio. \n\nHandpicked by Dolas too. What a big shot this guy had become. Not that anyone knew about him, or about the life of turmoil and trouble he had led so recently, stressed to his core, swamped with casualty reports. And just when he thought he got a break... \n\n'sir, the preperations are ready." \n\nHonestly, he didn"t even know if he was ready for what he was about to do. Could he stomach it? Could he really be responsible for this, bear the weight of the boulders of burdens upon his shoulders that he started this war? \n\nRegardless, there are duties to be fufilled, and Marazewski woudl fufill his."
 ustio.13.a: ""They won"t be ready.""
 
 ustio.14.t: "Yuktobanian Proposition Of Referendum"
 ustio.14.d: "The proposal, delivered through diplomatic channels to both Ustio and Ratio, outlines a comprehensive plan for conducting a referendum within the disputed regions. Under the proposed referendum, residents of the affected territories would be given the opportunity to democratically determine their own fate, choosing between remaining within their current nation or joining the neighboring state.\n\nYuktobanian officials cite the principles of self-determination and democratic governance as the driving forces behind the referendum proposal, emphasizing the importance of respecting the will of the affected populations in resolving territorial disputes. The proposal also includes provisions for international oversight to ensure the fairness and transparency of the referendum process, with neutral observers tasked with monitoring the proceedings to uphold the integrity of the vote.\n\nThe announcement of Yuktobania's referendum proposal has sparked a flurry of reactions from both Ustio and Ratio, with government officials, politicians, and citizens alike expressing a mix of cautious optimism, skepticism, and concern. While some view the proposal as a promising opportunity to peacefully resolve the border disputes and strengthen regional cooperation, others remain wary of the potential implications of diffrent outcomes of this event."
 ustio.14.a: "Probably the best option we could have hoped for - from all the bad ones."
 
 ustio.15.t: "Belka Declines To Get Involved"
 ustio.15.d: "In a decisive statement from the corridors of Belkan diplomacy, the nation has firmly declared its disinterest in intervening to mediate the border issues between Ustio and Ratio. Despite mounting international pressure and calls for regional cooperation, Belka has asserted its stance of non-interference, citing its own internal challenges as reasons for abstaining from involvement in external affairs.\n\nThe announcement, delivered by Belkan officials through diplomatic channels, underscores the nation's commitment to prioritizing its own strategic interests amidst a backdrop of economic crisis and political instability. Belkan representatives emphasize the need for the nation to focus its resources and energies on addressing pressing domestic issues, rather than becoming entangled in the complexities of external conflicts."
 ustio.15.a: "And what did we expect?"
 
 ustio.16.t: "Belka Declines To Get Involved"
 ustio.16.d: "referendum results are 50/50 - tyran wants to stay while boikos wants to leave - nobody agrees on this outcome"
 ustio.16.a: ""
 
 ustio.17.t: "Belkan Mobilization Along Entire Border"
 ustio.17.d: "Recent intelligence assessments indicate a significant escalation of military activity along the ENTIRE borders of the Belkan Federation. This development comes amidst a backdrop of heightened regional tensions and follows a substantial military buildup observed in Belka over the past two years.\n\nBelkan authorities have initiated a comprehensive mobilization campaign, deploying military forces and fortifying defensive positions along the entirety of the nation's border. Satellite imagery and reconnaissance reports confirm a significant increase in troop movements, equipment deployments, and construction activities along key strategic sectors of the border. However, analysis suggests that this mobilization is not purely defensive in nature; rather, it bears the hallmarks of an offensive posture."
 ustio.17.a: "Put border patrols on high alert and moblise everyone !!!"
 
