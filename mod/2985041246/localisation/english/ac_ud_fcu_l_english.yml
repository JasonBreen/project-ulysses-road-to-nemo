l_english:
 FCU_ud_federal_question:0 "The Federal Question"
 FCU_ud_federal_question_desc:0 "The Federation enters the decade with a presidency, an Assembly and a treaty bloc that all claim to speak for Central Usea. Before the cabinet can plan anything larger, it must decide how the Federation will be governed when the next emergency comes.\n\nProvisional gameplay."
 FCU_ud_hold_course:0 "Hold the Federal Course"
 FCU_ud_hold_course_desc:0 "Keep the government the Federation already has. The presidency governs with the Assembly as it did in 1991, and every reform passes through the ordinary calendar.\n\nProvisional gameplay."
 FCU_ud_emergency_powers:0 "Draft Emergency Powers"
 FCU_ud_emergency_powers_desc:0 "A faction of the cabinet and the staff argues that a federation this large cannot answer a continental emergency through committees. It asks for a legal framework that hands day-to-day authority to a military directorate when a crisis is declared.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_unity_talks:0 "Open All-Party Talks"
 FCU_ud_unity_talks_desc:0 "Invite every party in the Assembly into talks on a cabinet of national unity. Broad consent is slower, but a government that includes its rivals cannot easily be brought down by them.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_cabinet_continuity:0 "Cabinet Continuity"
 FCU_ud_cabinet_continuity_desc:0 "Ministers keep their portfolios and their senior officials. The cabinet trades the attention of a reshuffle for a year of uninterrupted administration.\n\nProvisional gameplay."
 FCU_ud_assembly_calendar:0 "The Assembly Calendar"
 FCU_ud_assembly_calendar_desc:0 "Publish a legislative calendar for the session so that the Assembly knows which bills the presidency will bring and when. Predictable business lowers the temperature of every debate.\n\nProvisional gameplay."
 FCU_ud_presidential_decrees:0 "Presidential Decree Programme"
 FCU_ud_presidential_decrees_desc:0 "Use the presidency's existing decree authority for administrative matters and keep the Assembly for legislation. Faster, but the opposition will call it government by signature.\n\nProvisional gameplay."
 FCU_ud_assembly_partnership:0 "Assembly Partnership"
 FCU_ud_assembly_partnership_desc:0 "Bring the Assembly's committee chairs into the drafting of every major bill. Slower, but the bills that pass are not reopened after the next quarrel.\n\nProvisional gameplay."
 FCU_ud_federal_budget_law:0 "Federal Budget Law"
 FCU_ud_federal_budget_law_desc:0 "A multi-year budget law fixes what the federal treasury owes the regions and what the regions owe in return. Most of the Federation's quarrels are about money; this one is settled in writing.\n\nProvisional gameplay."
 FCU_ud_regional_governors:0 "Regional Governors' Conference"
 FCU_ud_regional_governors_desc:0 "Gather the regional governments in a standing annual conference with the presidency. Grievances that used to reach the press first now reach a table first.\n\nProvisional gameplay."
 FCU_ud_civil_service_review:0 "Civil Service Review"
 FCU_ud_civil_service_review_desc:0 "A review of the federal civil service merges duplicated offices and publishes the posts that remain. It costs some goodwill among officials and returns a faster administration.\n\nProvisional gameplay."
 FCU_ud_ministry_of_preparedness:0 "Ministry of Preparedness"
 FCU_ud_ministry_of_preparedness_desc:0 "After the Ulysses warning, give one ministry the authority and the budget to prepare the whole Federation. One minister answers for every shelter, timetable and stockpile.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_interagency_board:0 "Interagency Emergency Board"
 FCU_ud_interagency_board_desc:0 "After the Ulysses warning, leave each ministry its own duties and coordinate them through a board that meets daily. No new ministry, and no single point of failure.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_continuity_of_government:0 "Continuity of Government"
 FCU_ud_continuity_of_government_desc:0 "Write down who governs if the capital cannot. Alternate seats, a line of succession for every ministry and copies of the federal records stored away from the coast.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_address_to_the_federation:0 "An Address to the Federation"
 FCU_ud_address_to_the_federation_desc:0 "After the coup of 30 May 1997, the presidency speaks to the whole Federation: what failed, what held, and what the government will change. The speech is short and the promises are specific.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_course_held:0 "The Course Held"
 FCU_ud_course_held_desc:0 "The Federation has met the decade's emergencies with the government it chose in 1991. The cabinet records the course it held and prepares the account it will give to the next century.\n\nProvisional gameplay."
 FCU_ud_emergency_statute:0 "The Emergency Statute"
 FCU_ud_emergency_statute_desc:0 "Draft the statute: who may declare a continental emergency, for how long, and what passes to the directorate when they do. Every article is argued over twice.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_command_liaison:0 "Unified Command Liaison"
 FCU_ud_command_liaison_desc:0 "Station cabinet liaison officers with Unified Command's staff so that a future directorate would not have to learn the ministries in the middle of a crisis.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_staff_directorate:0 "A Staff Directorate"
 FCU_ud_staff_directorate_desc:0 "Model the directorate on a military staff: a small number of officers with clear lines of command and civilian ministers who carry out their orders.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_civil_military_board:0 "A Civil-Military Board"
 FCU_ud_civil_military_board_desc:0 "Model the directorate as a board: officers and senior civilians in equal number, deciding by majority. Slower than a staff, but harder to accuse of seizing the state.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_emergency_threshold:0 "The Emergency Threshold"
 FCU_ud_emergency_threshold_desc:0 "The statute is ready, but it needs an emergency. A rebellion in the southern islands or the warning about Ulysses would meet the threshold the drafters wrote.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_proclaim_directorate:0 "Proclaim the Directorate"
 FCU_ud_proclaim_directorate_desc:0 "Declare the continental emergency and transfer executive authority to a directorate built around Unified Command. The presidency and the Assembly remain, but they no longer govern.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_martial_evacuation_law:0 "Martial Evacuation Law"
 FCU_ud_martial_evacuation_law_desc:0 "Place the evacuation programme under military law. Movement orders become binding, requisitions are immediate, and appeals wait until afterwards.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_civil_compact:0 "The Civil Compact"
 FCU_ud_civil_compact_desc:0 "Promise in writing that the directorate will not use its authority against lawful parties, newspapers or courts. The officers lose some speed and keep some trust.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_emergency_information_board:0 "Emergency Information Board"
 FCU_ud_emergency_information_board_desc:0 "One board issues every public announcement about the emergency. It ends the contradictory bulletins and also ends the newspapers' habit of asking questions first.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_district_councils:0 "District Councils"
 FCU_ud_district_councils_desc:0 "The directorate governs the regions through councils that pair a district commander with the regional administration. Orders arrive faster; local politics does not disappear.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_loyalty_reviews:0 "Loyalty Reviews"
 FCU_ud_loyalty_reviews_desc:0 "After 30 May 1997 the directorate reviews every officer who served in a command that went silent. It finds what it looks for, and the corps learns what is being looked for.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_directorate_amnesty:0 "The Directorate's Amnesty"
 FCU_ud_directorate_amnesty_desc:0 "After 30 May 1997 the directorate offers an amnesty to officers who surrender their commands and give evidence. A government built on Unified Command cannot afford to fight its own corps for long.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_directorate_review:0 "The Directorate Review"
 FCU_ud_directorate_review_desc:0 "The statute required a review once the emergency eased. With Stonehenge complete and the evacuation plans in place, the directorate must account for itself.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_return_authority:0 "Return Authority to the Assembly"
 FCU_ud_return_authority_desc:0 "End the emergency before Ulysses arrives and return executive authority to the presidency and the Assembly. The directorate's staff goes back to Unified Command.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_extend_directorate:0 "Extend the Directorate"
 FCU_ud_extend_directorate_desc:0 "Ulysses has not yet arrived and the emergency is not over. Renew the directorate's mandate until the danger has passed, whenever that is.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_cross_bench_compact:0 "The Cross-Bench Compact"
 FCU_ud_cross_bench_compact_desc:0 "A written compact between the presidency and every Assembly party: no motions of no confidence while the talks last, and no cabinet appointments without consultation.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_coalition_arithmetic:0 "Coalition Arithmetic"
 FCU_ud_coalition_arithmetic_desc:0 "Count the portfolios, count the parties and count the regions. Every cabinet seat has to satisfy at least two of the three.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_regional_ministers:0 "Regional Ministers"
 FCU_ud_regional_ministers_desc:0 "Fill the unity cabinet with ministers who answer to the regions. The Federation will be governed by people the provinces already trust.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_technocratic_ministers:0 "Technocratic Ministers"
 FCU_ud_technocratic_ministers_desc:0 "Fill the unity cabinet's key ministries with officials and specialists who belong to no party. The parties keep the vote; the experts keep the files.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_form_unity_government:0 "Form the Unity Government"
 FCU_ud_form_unity_government_desc:0 "Dissolve the cabinet and swear in a government of national unity. Its office answers to the whole Assembly; the old majority becomes one partner among several.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_unity_programme:0 "The Unity Programme"
 FCU_ud_unity_programme_desc:0 "Publish the unity government's programme: one page, five commitments, signed by every party leader in the cabinet.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_burden_sharing_act:0 "The Burden-Sharing Act"
 FCU_ud_burden_sharing_act_desc:0 "Spread the cost of preparedness across every region by a fixed formula. Richer provinces pay more and are allowed to say so.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_regional_autonomy_charter:0 "Regional Autonomy Charter"
 FCU_ud_regional_autonomy_charter_desc:0 "Hand the regions more control over their own preparedness budgets. The centre loses leverage and gains partners who own their results.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_continental_hearings:0 "Continental Hearings"
 FCU_ud_continental_hearings_desc:0 "After the Ulysses warning, the unity cabinet holds open hearings in every region on the preparedness plans. Ministers listen first and then answer.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_unity_emergency_cabinet:0 "Unity Emergency Cabinet"
 FCU_ud_unity_emergency_cabinet_desc:0 "A small emergency cabinet drawn from every party meets daily on Ulysses preparations. Rival parties sit at the same table and share the same briefing.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_defend_the_assembly:0 "Defend the Assembly"
 FCU_ud_defend_the_assembly_desc:0 "After 30 May 1997 every party in the unity cabinet signs a declaration in support of the Assembly. Officers who backed the coup find no politician willing to speak for them.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_reconciliation_committee:0 "Reconciliation Committee"
 FCU_ud_reconciliation_committee_desc:0 "After 30 May 1997 the unity cabinet forms an all-party committee to hear the officers' grievances once the rebellion is defeated. Complaints are heard; mutiny is not excused.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_unity_mandate:0 "The Unity Mandate"
 FCU_ud_unity_mandate_desc:0 "The parties renew the unity government for the years of the impact. It was formed for an emergency; the emergency is still coming.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_constitutional_settlement:0 "Constitutional Settlement"
 FCU_ud_constitutional_settlement_desc:0 "Write the unity government's practice into the constitution: a cabinet drawn from the whole Assembly whenever a continental emergency is declared.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_federal_settlement:0 "The Federal Settlement"
 FCU_ud_federal_settlement_desc:0 "Whichever government carried the Federation through the decade, its record now has to be settled: what powers remain, which emergency laws expire, and what the next century inherits.\n\nProvisional gameplay."
 FCU_ud_open_archives:0 "Open the Federal Archives"
 FCU_ud_open_archives_desc:0 "Publish the decade's cabinet papers, emergency orders included, after a short review. The Federation learns what was decided in its name.\n\nProvisional gameplay."
 FCU_ud_seal_records:0 "Seal the Emergency Records"
 FCU_ud_seal_records_desc:0 "Seal the decade's emergency papers for thirty years. Officials keep their candour, and critics keep their suspicions.\n\nProvisional gameplay."
 FCU_ud_politics_handover:0 "A Government for the New Century"
 FCU_ud_politics_handover_desc:0 "The cabinet prepares a handover brief for whoever governs in 2000: the laws in force, the emergencies still open and the promises not yet kept.\n\nProvisional gameplay."
 FCU_ud_federal_economy:0 "The Federal Economy"
 FCU_ud_federal_economy_desc:0 "Central Usea is the continent's largest economy and its largest treasury. The cabinet must decide whether to grow it through open trade or through federal industry.\n\nProvisional gameplay."
 FCU_ud_continental_trade:0 "Continental Trade Programme"
 FCU_ud_continental_trade_desc:0 "Lower the Federation's tariffs on its treaty partners and open federal contracts to their firms. Usean trade binds Usean partners.\n\nProvisional gameplay."
 FCU_ud_federal_industry:0 "Federal Industrial Policy"
 FCU_ud_federal_industry_desc:0 "Direct federal credit to the industries the Federation would need in an emergency: steel, heavy engineering, aircraft and power.\n\nProvisional gameplay."
 FCU_ud_open_the_ports:0 "Open the Ports"
 FCU_ud_open_the_ports_desc:0 "Modernise the federal ports for container traffic and simplify customs for treaty members. The harbours become the Federation's busiest workplaces.\n\nProvisional gameplay."
 FCU_ud_strategic_plants:0 "Strategic Plants"
 FCU_ud_strategic_plants_desc:0 "Fund a short list of strategic plants that can switch to emergency production. Each one keeps a reserve line idle and ready.\n\nProvisional gameplay."
 FCU_ud_currency_board:0 "Federal Currency Board"
 FCU_ud_currency_board_desc:0 "An independent board defends the federal currency. Treaty partners that price their trade in it can rely on its value.\n\nProvisional gameplay."
 FCU_ud_ulysses_bonds:0 "Ulysses Bonds"
 FCU_ud_ulysses_bonds_desc:0 "After the Ulysses warning, finance the preparations with long-dated federal bonds sold to citizens and partners. The cost is deferred to the generation that survives.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_emergency_levy:0 "The Emergency Levy"
 FCU_ud_emergency_levy_desc:0 "After the Ulysses warning, finance the preparations now with a temporary federal levy. Nobody likes it, and nobody inherits it.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_confidence_programme:0 "Confidence Programme"
 FCU_ud_confidence_programme_desc:0 "After the coup of 30 May 1997, markets want proof that the Federation still governs. Guarantee the banks, publish the accounts and keep paying salaries on time.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_impact_insurance_pool:0 "Impact Insurance Pool"
 FCU_ud_impact_insurance_pool_desc:0 "Pool federal and private insurance against the impact. Homes and firms destroyed by debris will be rebuilt by formula, not by petition.\n\nProvisional gameplay."
 FCU_ud_strategic_stockpile_law:0 "Strategic Stockpile Law"
 FCU_ud_strategic_stockpile_law_desc:0 "Require every major firm to hold six months of critical inputs in reserve. Prices rise now so that factories run after the impact.\n\nProvisional gameplay."
 FCU_ud_economy_review:0 "Economic Review of the Decade"
 FCU_ud_economy_review_desc:0 "Treasury economists publish a review of the decade: what the Federation earned, what it spent on preparedness and what it still owes.\n\nProvisional gameplay."
 FCU_ud_post_impact_markets:0 "Reopen the Markets"
 FCU_ud_post_impact_markets_desc:0 "After the impact, reopen the exchanges and the ports on a fixed schedule. A date, kept, does more for confidence than any statement.\n\nProvisional gameplay; context from Chronicle, 1999 / 07.08."
 FCU_ud_uto_chair:0 "Chair the Treaty Organization"
 FCU_ud_uto_chair_desc:0 "Central Usea holds the presidency of the Usean Treaty Organization and leads the faction its partners joined. Chairing it well means more than hosting the meetings.\n\nMod provenance: 1991 bookmark and FCU history (UTO_president_idea); the choice is provisional gameplay."
 FCU_ud_uto_secretariat:0 "A Standing Secretariat"
 FCU_ud_uto_secretariat_desc:0 "Give the treaty a permanent secretariat with its own staff and budget. Decisions stop depending on which foreign ministry happens to hold the chair.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_integrated_staff:0 "Integrated Treaty Staff"
 FCU_ud_uto_integrated_staff_desc:0 "Merge the members' planners into one treaty staff. Plans are written once, in one language, for one chain of command.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_national_contingents:0 "National Contingents"
 FCU_ud_uto_national_contingents_desc:0 "Keep each member's forces under its own command and coordinate them by agreement. Sovereignty is preserved; speed is not.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_combined_exercises:0 "Combined Treaty Exercises"
 FCU_ud_uto_combined_exercises_desc:0 "Hold the treaty's first combined exercise: staffs, signals and logistics from every member, tested together for a week.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_observer_seat:0 "Offer Erusea an Observer Seat"
 FCU_ud_uto_observer_seat_desc:0 "Invite Erusea to observe the treaty's exercises and staff talks. An observer is not a member, but a neighbour who sees the plans has less reason to fear them.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_western_watch:0 "The Western Watch"
 FCU_ud_uto_western_watch_desc:0 "Keep a standing treaty watch on the western frontier with Erusea. The 1991 standoff in western Usea is managed by vigilance rather than invitation.\n\nMod provenance: 1991 bookmark text (standoff between Erusean and UTO forces); the choice is provisional gameplay."
 FCU_ud_uto_member_review:0 "Member Review"
 FCU_ud_uto_member_review_desc:0 "Review what each member contributes and what each needs. The treaty is only as strong as the partners who carry it.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_amber_liaison:0 "Amber Liaison Office"
 FCU_ud_uto_amber_liaison_desc:0 "Open a federal liaison office with Amber's government for treaty planning. The office handles staff talks, not domestic politics.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_ugellas_liaison:0 "Ugellas Liaison Office"
 FCU_ud_uto_ugellas_liaison_desc:0 "Open a federal liaison office with Ugellas for treaty planning, focused on coastal approaches and shared harbours.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_san_salvacion_liaison:0 "San Salvacion Liaison Office"
 FCU_ud_uto_san_salvacion_liaison_desc:0 "Open a federal liaison office with San Salvacion. Its place in the treaty is mod provenance; the official chronology describes the country as neutral.\n\nMod provenance: SNS faction membership in FCU history; Chronicle, 1998 / 06.19 calls San Salvacion neutral; the choice is provisional gameplay."
 FCU_ud_uto_delarus_liaison:0 "Delarus Liaison Office"
 FCU_ud_uto_delarus_liaison_desc:0 "Open a federal liaison office with Delarus for treaty planning, focused on overland transport and reserve depots.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_burden_question:0 "The Burden Question"
 FCU_ud_uto_burden_question_desc:0 "The Federation pays most of the treaty's costs, and every member knows it. The cabinet must decide whether to keep paying or to share the bill.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_federal_subsidy:0 "The Federal Subsidy"
 FCU_ud_uto_federal_subsidy_desc:0 "Keep paying. Central Usea covers the treaty's common costs and receives the leadership that comes with them.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_shared_assessment:0 "A Shared Assessment Scale"
 FCU_ud_uto_shared_assessment_desc:0 "Assess every member by the size of its economy. The Federation still pays most of the bill, but no longer all of it.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_ulysses_mandate:0 "A Ulysses Mandate"
 FCU_ud_uto_ulysses_mandate_desc:0 "After the Ulysses warning, add preparedness to the treaty's purpose. The members agree to plan the evacuation and the relief together.\n\nMod provenance: Chronicle, 1996 / 04.20; the choice is provisional gameplay."
 FCU_ud_uto_air_defence_net:0 "Treaty Air-Defence Net"
 FCU_ud_uto_air_defence_net_desc:0 "Link the members' radars into a single treaty air picture. It watches the sky for aircraft now and for debris later.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_relief_command:0 "Treaty Relief Command"
 FCU_ud_uto_relief_command_desc:0 "Create a treaty relief command that owns the transport, field hospitals and stores every member will need after the impact.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_coup_solidarity:0 "Solidarity After the Coup"
 FCU_ud_uto_coup_solidarity_desc:0 "The coup of 30 May 1997 struck across Usea. The treaty members exchange what they know and agree not to shelter the officers who led it.\n\nMod provenance: Chronicle, 1997 / 05.30; the choice is provisional gameplay."
 FCU_ud_uto_treaty_review:0 "Treaty Review"
 FCU_ud_uto_treaty_review_desc:0 "The members review the treaty's articles against the decade they have lived through. Some clauses are retired, and one is rewritten for the impact.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_uto_decade:0 "A Decade of the Treaty"
 FCU_ud_uto_decade_desc:0 "The Treaty Organization ends the decade intact. Whatever comes after the impact, its members have already learned to plan together.\n\nMod provenance; the choice is provisional gameplay."
 FCU_ud_southern_district:0 "The Southern District"
 FCU_ud_southern_district_desc:0 "The FCU Army Southern District covers the federal south and its islands. Its staff asks for attention long before anyone in the capital asks it for results.\n\nProvisional gameplay; context from Chronicle, 1995 / 12.31 names the Southern District."
 FCU_ud_island_patrols:0 "Island Patrol Rotations"
 FCU_ud_island_patrols_desc:0 "Rotate patrol craft and garrison detachments through the southern islands on a fixed schedule. The islands see the Federation more often.\n\nProvisional gameplay."
 FCU_ud_island_development_grants:0 "Island Development Grants"
 FCU_ud_island_development_grants_desc:0 "Fund roads, clinics and harbours in the southern islands. The Federation is more welcome where it is useful.\n\nProvisional gameplay."
 FCU_ud_skully_operation:0 "The Skully Islands Operation"
 FCU_ud_skully_operation_desc:0 "On 31 December 1995 Robert Tyler of the Southern District eliminates a rebel base in the Skully Islands, and Unified Command defeats those rebels through Scarface Squadron. The cabinet records the action.\n\nOfficial: Chronicle, 1995 / 12.31. Choices and effects are provisional gameplay."
 FCU_ud_southern_tribunals:0 "Southern Tribunals"
 FCU_ud_southern_tribunals_desc:0 "Try the surviving rebels in federal courts sitting in the south. The process is public, and the sentences are meant to be remembered.\n\nProvisional gameplay."
 FCU_ud_island_amnesty:0 "Island Amnesty"
 FCU_ud_island_amnesty_desc:0 "Offer an amnesty to islanders who supported the rebels but did not fight. Keep the courts for those who did.\n\nProvisional gameplay."
 FCU_ud_permanent_southern_garrison:0 "Permanent Southern Garrison"
 FCU_ud_permanent_southern_garrison_desc:0 "Station a permanent garrison in the southern islands. The rebel base is gone; the Federation intends to stay.\n\nProvisional gameplay."
 FCU_ud_island_reconstruction:0 "Island Reconstruction"
 FCU_ud_island_reconstruction_desc:0 "Rebuild what the fighting damaged and what the islands never had. Contracts go to island firms where they can do the work.\n\nProvisional gameplay."
 FCU_ud_unified_command_citations:0 "Unified Command Citations"
 FCU_ud_unified_command_citations_desc:0 "Cite Unified Command and Scarface Squadron for the Skully Islands action. The citations name the units the Chronicle names, and no one else.\n\nOfficial: Chronicle, 1995 / 12.31. Choices and effects are provisional gameplay."
 FCU_ud_coast_guard_charter:0 "Coast Guard Charter"
 FCU_ud_coast_guard_charter_desc:0 "Give the southern waters a federal coast guard with police powers. Smugglers and rebels lose the sea lanes between the islands.\n\nProvisional gameplay."
 FCU_ud_island_councils:0 "Island Councils"
 FCU_ud_island_councils_desc:0 "Give each island group an elected council with a voice in the Southern District's planning. Grievances arrive as motions, not as rumours.\n\nProvisional gameplay."
 FCU_ud_southern_lessons:0 "Lessons of the Southern Islands"
 FCU_ud_southern_lessons_desc:0 "The Southern District writes up what the Skully Islands taught: which warnings were missed, which reports arrived late and which units answered at once.\n\nProvisional gameplay."
 FCU_ud_ulysses_warning:0 "The Ulysses Warning"
 FCU_ud_ulysses_warning_desc:0 "On 20 April 1996 Central Usea announces that the asteroid Ulysses will strike the Earth. The government that made the announcement must now prepare for it.\n\nOfficial: Chronicle, 1996 / 04.20. Choices and effects are provisional gameplay."
 FCU_ud_evacuation_census:0 "The Evacuation Census"
 FCU_ud_evacuation_census_desc:0 "Count everyone: where they live, how they would travel and who would need help to move. Every later plan starts from this register.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_dispersal_doctrine:0 "Dispersal Doctrine"
 FCU_ud_dispersal_doctrine_desc:0 "Plan to move people away from the coasts and the cities, spreading them across the interior. Fewer targets, more roads to manage.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_hardened_shelters:0 "Hardened Shelter Programme"
 FCU_ud_hardened_shelters_desc:0 "Plan to keep people near home in hardened public shelters. Fewer journeys, more concrete.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_transport_requisition:0 "Transport Requisition Orders"
 FCU_ud_transport_requisition_desc:0 "Draft the orders that would requisition buses, trains, ships and aircraft for the evacuation. Owners are told now, not on the day.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_rail_timetables:0 "Rail Evacuation Timetables"
 FCU_ud_rail_timetables_desc:0 "Write the evacuation around the railways: fixed timetables, numbered trains and stations assigned by district.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_civil_air_bridge:0 "The Civil Air Bridge"
 FCU_ud_civil_air_bridge_desc:0 "Write the evacuation around aircraft: civil airliners and military transports flying a shuttle from the coast to the interior.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_hospital_relocation:0 "Hospital Relocation Plan"
 FCU_ud_hospital_relocation_desc:0 "Move the hospitals that cannot be evacuated in a week, and plan the field hospitals that will replace them.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_coastal_evacuation_zones:0 "Coastal Evacuation Zones"
 FCU_ud_coastal_evacuation_zones_desc:0 "Draw evacuation zones along the coasts by distance and elevation. The maps are published so that families can plan before they are told.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_inland_reception_towns:0 "Inland Reception Towns"
 FCU_ud_inland_reception_towns_desc:0 "Designate inland towns to receive evacuees and fund them now: water, schools, clinics and housing before the arrivals.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_national_public_drills:0 "National Public Drills"
 FCU_ud_national_public_drills_desc:0 "Hold a national drill: sirens, timetables, reception points. Millions of people walk through the evacuation once, so they will know it the second time.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_compulsory_registration:0 "Compulsory Registration"
 FCU_ud_compulsory_registration_desc:0 "Require every household to register its evacuation plan. The register is complete, and some citizens resent being counted.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_voluntary_registers:0 "Voluntary Registers"
 FCU_ud_voluntary_registers_desc:0 "Invite households to register and reward them with priority places. The register is incomplete, but nobody is forced to sign it.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_evacuation_fuel_reserve:0 "Evacuation Fuel Reserve"
 FCU_ud_evacuation_fuel_reserve_desc:0 "Set aside fuel for the evacuation and lock it away from every other claim, including the army's.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_partner_reception:0 "Partner Reception Agreements"
 FCU_ud_partner_reception_desc:0 "Agree with the treaty partners that each will receive evacuees from the others' threatened districts. Borders open for the emergency only.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_federal_self_reliance:0 "Federal Self-Reliance"
 FCU_ud_federal_self_reliance_desc:0 "Plan to receive every federal evacuee inside the Federation. Partners keep their room for their own people.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_continuity_bunkers:0 "Continuity Bunkers"
 FCU_ud_continuity_bunkers_desc:0 "Build protected sites for the government, the records and the communications that must survive the impact.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_the_final_count:0 "The Final Count"
 FCU_ud_the_final_count_desc:0 "In the last months before the impact, recount the evacuation: seats, places, fuel, beds. What is missing now will be missing on the day.\n\nProvisional gameplay."
 FCU_ud_stay_behind_teams:0 "Stay-Behind Teams"
 FCU_ud_stay_behind_teams_desc:0 "Keep volunteers behind in every evacuated district to guard property, run utilities and report damage the moment it happens.\n\nProvisional gameplay."
 FCU_ud_total_evacuation_order:0 "Total Evacuation Order"
 FCU_ud_total_evacuation_order_desc:0 "Order everyone out of the threatened districts, with no exceptions. Nobody is left in harm's way; nobody is left to watch the empty towns.\n\nProvisional gameplay."
 FCU_ud_the_last_convoys:0 "The Last Convoys"
 FCU_ud_the_last_convoys_desc:0 "The last convoys leave the coast. Whatever has not moved by now stays where it is.\n\nProvisional gameplay."
 FCU_ud_evacuation_after_action:0 "Evacuation After-Action Report"
 FCU_ud_evacuation_after_action_desc:0 "After the impact, every district reports how its evacuation went. The report is blunt about failures, because there may be a next time.\n\nProvisional gameplay; context from Chronicle, 1999 / 07.08."
 FCU_ud_stonehenge_consortium:0 "The Stonehenge Consortium"
 FCU_ud_stonehenge_consortium_desc:0 "Central Usea leads an international project to build a battery of railguns against Ulysses' fragments. The consortium needs members, money and engineers before it needs a timetable.\n\nOfficial: Chronicle, 1998 / 06.19; Super Weapons, Stonehenge. Choices and effects are provisional gameplay."
 FCU_ud_federal_lead_share:0 "A Federal Lead Share"
 FCU_ud_federal_lead_share_desc:0 "Central Usea takes the largest share of the project's cost and the largest voice in its decisions.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_international_shares:0 "Open International Shares"
 FCU_ud_international_shares_desc:0 "Invite every interested government to buy a share of the project. More partners, more money and more voices in the room.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_host_agreement:0 "The Host Agreement"
 FCU_ud_host_agreement_desc:0 "The battery will stand in a desert region of neutral San Salvacion. The host agreement covers access, security and what happens to the site afterwards.\n\nOfficial: Chronicle, 1998 / 06.19; Super Weapons, Stonehenge. Choices and effects are provisional gameplay."
 FCU_ud_engineers_family_quarters:0 "Engineers' Family Quarters"
 FCU_ud_engineers_family_quarters_desc:0 "Build housing at the site so that the engineers can bring their families. The project keeps its experts; the experts keep their homes nearby.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_rotating_contract_crews:0 "Rotating Contract Crews"
 FCU_ud_rotating_contract_crews_desc:0 "Staff the site with contract crews on rotation. Nobody settles in the desert, and nobody stays long enough to know the battery best.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_eight_batteries:0 "Eight Batteries"
 FCU_ud_eight_batteries_desc:0 "The design calls for eight railguns. Each must be supplied with power, ammunition and fire control, and each must be able to fire alone.\n\nOfficial: Super Weapons, Stonehenge (eight railguns). Choices and effects are provisional gameplay."
 FCU_ud_fragment_tracking_network:0 "Fragment Tracking Network"
 FCU_ud_fragment_tracking_network_desc:0 "Build the tracking network that will tell the batteries where the fragments are. Without it, eight guns are eight guesses.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_battery_power_grid:0 "The Battery Power Grid"
 FCU_ud_battery_power_grid_desc:0 "Build the power plants and the grid the railguns will draw on. The desert site needs more electricity than a city.\n\nProvisional gameplay; context from Chronicle, 1996 / 04.20."
 FCU_ud_stonehenge_completed:0 "Stonehenge Completed"
 FCU_ud_stonehenge_completed_desc:0 "On 19 June 1998 Central Usea completes Stonehenge in a desert region of San Salvacion. Eight railguns now wait for Ulysses.\n\nOfficial: Chronicle, 1998 / 06.19; Super Weapons, Stonehenge. Choices and effects are provisional gameplay."
 FCU_ud_neutral_custody_protocol:0 "Neutral Custody Protocol"
 FCU_ud_neutral_custody_protocol_desc:0 "Agree that the battery serves every nation under the consortium's rules and that its host remains neutral.\n\nProvisional gameplay."
 FCU_ud_federal_battery_custody:0 "Federal Custody of the Batteries"
 FCU_ud_federal_battery_custody_desc:0 "Keep operational control of the battery with federal crews and federal officers. The consortium funds it; the Federation runs it.\n\nProvisional gameplay."
 FCU_ud_interception_drills:0 "Interception Drills"
 FCU_ud_interception_drills_desc:0 "Rehearse the interception: tracking, firing order and power load, against a sky that will soon be full of debris.\n\nProvisional gameplay."
 FCU_ud_coup_inquiry:0 "The Coup Inquiry"
 FCU_ud_coup_inquiry_desc:0 "Unified Command has defeated the coup of 30 May 1997, or is still fighting it. The cabinet opens an inquiry into how commands across Usea turned at once.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_coup_tribunals:0 "Federal Coup Tribunals"
 FCU_ud_coup_tribunals_desc:0 "Try the coup's leaders before federal tribunals. The trials are swift and public.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_coup_reconciliation:0 "Reconciliation Hearings"
 FCU_ud_coup_reconciliation_desc:0 "Hear the officers who joined the coup before deciding who stands trial. Some were leaders; many were led.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_officer_corps_review:0 "Officer Corps Review"
 FCU_ud_officer_corps_review_desc:0 "Review promotion, rotation and command assignments across the officer corps. The coup used gaps in all three.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_restore_the_districts:0 "Restore the Districts"
 FCU_ud_restore_the_districts_desc:0 "The coup has been defeated. Return the districts that went silent to their civil administrations and their regular commanders.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_pacification_campaign:0 "Pacification Campaign"
 FCU_ud_pacification_campaign_desc:0 "In this provisional branch the emergency has not ended. Plan a campaign to bring the districts that still defy the government back under federal control.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_honour_unified_command:0 "Honour Unified Command"
 FCU_ud_honour_unified_command_desc:0 "Honour Unified Command and Scarface 1 for defeating the coup. The ceremony names those the Chronicle names.\n\nOfficial: Chronicle, 1997 / 05.30. Choices and effects are provisional gameplay."
 FCU_ud_district_emergency_cells:0 "District Emergency Cells"
 FCU_ud_district_emergency_cells_desc:0 "Form emergency cells in every district still contested: a commander, an administrator and a police chief with joint authority.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_lessons_of_30_may:0 "Lessons of 30 May"
 FCU_ud_lessons_of_30_may_desc:0 "The inquiry reports. It names no wider conspiracy, because the evidence does not show one; it names the failures that let commands go silent together.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_civilian_control_act:0 "Civilian Control Act"
 FCU_ud_civilian_control_act_desc:0 "Put every deployment order through a civilian minister's signature. The army will move a little slower and answer a little more.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_command_autonomy_charter:0 "Command Autonomy Charter"
 FCU_ud_command_autonomy_charter_desc:0 "Give Unified Command authority to act without waiting for ministers in a declared emergency. The coup was defeated by speed.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_intelligence_reform:0 "Intelligence Reform"
 FCU_ud_intelligence_reform_desc:0 "Merge the overlapping intelligence offices that each saw part of the coup and none saw the whole.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_coup_warning_net:0 "Coup-Warning Net"
 FCU_ud_coup_warning_net_desc:0 "Link the treaty members' command centres so that a silent garrison anywhere in Usea is noticed everywhere within the hour.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_federal_security_service:0 "Federal Security Service"
 FCU_ud_federal_security_service_desc:0 "Create a federal security service with authority to investigate officers. It will find plots; it may also find enemies where there are only critics.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_thirty_may_memorial:0 "The 30 May Memorial"
 FCU_ud_thirty_may_memorial_desc:0 "Raise a memorial to the soldiers and civilians who died resisting the coup. It lists the dead and leaves out the names of the plotters.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_coup_settlement:0 "The Coup Settlement"
 FCU_ud_coup_settlement_desc:0 "The cabinet closes the coup file: who was tried, who was pardoned, what changed and what must never change again.\n\nProvisional gameplay; context from Chronicle, 1997 / 05.30."
 FCU_ud_relief_planning_cell:0 "Relief Planning Cell"
 FCU_ud_relief_planning_cell_desc:0 "Months before the impact, a planning cell drafts the relief effort: who goes where, with what, the day after.\n\nProvisional gameplay."
 FCU_ud_forward_relief_depots:0 "Forward Relief Depots"
 FCU_ud_forward_relief_depots_desc:0 "Stock relief depots near the threatened districts so that aid is already close when roads are cut.\n\nProvisional gameplay."
 FCU_ud_mobile_relief_columns:0 "Mobile Relief Columns"
 FCU_ud_mobile_relief_columns_desc:0 "Keep relief on wheels: columns of trucks, field kitchens and clinics that can go wherever the damage is worst.\n\nProvisional gameplay."
 FCU_ud_impact_night:0 "Impact Night"
 FCU_ud_impact_night_desc:0 "On 8 July 1999 Ulysses passes the Roche limit and breaks apart, and its fragments fall across the world. The Federation counts what it saved and starts on what it did not.\n\nOfficial: Chronicle, 1999 / 07.08. Choices and effects are provisional gameplay."
 FCU_ud_federal_relief_corps:0 "Federal Relief Corps"
 FCU_ud_federal_relief_corps_desc:0 "Put the relief effort under a federal civil corps: one command, civilian staff, federal money.\n\nProvisional gameplay; context from Chronicle, 1999 / 07.08."
 FCU_ud_treaty_relief_compact:0 "Treaty Relief Compact"
 FCU_ud_treaty_relief_compact_desc:0 "Run the relief effort with the treaty partners: shared stores, shared transport and shared responsibility for the results.\n\nProvisional gameplay; context from Chronicle, 1999 / 07.08."
 FCU_ud_military_relief_command:0 "Military Relief Command"
 FCU_ud_military_relief_command_desc:0 "Hand the relief effort to the army. It has the trucks, the engineers and the discipline; it does not have a light touch.\n\nProvisional gameplay; context from Chronicle, 1999 / 07.08."
 FCU_ud_field_kitchens:0 "Field Kitchens"
 FCU_ud_field_kitchens_desc:0 "Feed the displaced: field kitchens in every reception town, supplied daily from the depots.\n\nProvisional gameplay; context from Chronicle, 1999 / 07.08."
 FCU_ud_partner_airlift:0 "Partner Airlift"
 FCU_ud_partner_airlift_desc:0 "Treaty transports fly relief from undamaged partners to the worst-hit districts.\n\nProvisional gameplay; context from Chronicle, 1999 / 07.08."
 FCU_ud_engineer_battalions:0 "Engineer Battalions"
 FCU_ud_engineer_battalions_desc:0 "Army engineers clear roads, raise bridges and restore power where the fragments struck.\n\nProvisional gameplay; context from Chronicle, 1999 / 07.08."
 FCU_ud_rebuild_lifelines:0 "Rebuild the Lifelines"
 FCU_ud_rebuild_lifelines_desc:0 "Restore water, power and communications first. Everything else in the recovery depends on them.\n\nProvisional gameplay; context from Chronicle, 1999 / 07.08."
 FCU_ud_shared_reconstruction:0 "Shared Reconstruction"
 FCU_ud_shared_reconstruction_desc:0 "Divide the reconstruction among the treaty partners by district. Each partner takes responsibility for what it rebuilds.\n\nProvisional gameplay; context from Chronicle, 1999 / 07.08."
 FCU_ud_order_in_the_camps:0 "Order in the Camps"
 FCU_ud_order_in_the_camps_desc:0 "Bring the reception camps under military administration until the districts can take their people back.\n\nProvisional gameplay; context from Chronicle, 1999 / 07.08."
 FCU_ud_federal_forces_review:0 "Federal Forces Review"
 FCU_ud_federal_forces_review_desc:0 "Review what the Federation's forces are for in a decade without a declared enemy: treaty defence, disaster relief and the long watch in the west.\n\nProvisional gameplay."
 FCU_ud_air_arm_first:0 "The Air Arm First"
 FCU_ud_air_arm_first_desc:0 "Put the air arm first in the budget. The Federation is large; aircraft reach its edges fastest.\n\nProvisional gameplay."
 FCU_ud_balanced_forces:0 "Balanced Forces"
 FCU_ud_balanced_forces_desc:0 "Fund the army, navy and air arm in proportion. No service is starved to feed another.\n\nProvisional gameplay."
 FCU_ud_aircrew_schools:0 "Aircrew Schools"
 FCU_ud_aircrew_schools_desc:0 "Expand the federal flight schools and lengthen the course. Pilots who trained longer live longer.\n\nProvisional gameplay."
 FCU_ud_interceptor_wings:0 "Interceptor Wings"
 FCU_ud_interceptor_wings_desc:0 "Build the air arm around interceptors that defend federal airspace and the treaty partners' skies.\n\nProvisional gameplay."
 FCU_ud_strike_wings:0 "Strike Wings"
 FCU_ud_strike_wings_desc:0 "Build the air arm around strike aircraft that support the army on the ground.\n\nProvisional gameplay."
 FCU_ud_joint_air_ground_drills:0 "Joint Air-Ground Drills"
 FCU_ud_joint_air_ground_drills_desc:0 "Train the air arm and the army together until a request for support is answered in minutes, not hours.\n\nProvisional gameplay."
 FCU_ud_coastal_air_patrols:0 "Coastal Air Patrols"
 FCU_ud_coastal_air_patrols_desc:0 "Fly regular patrols along the federal coasts and over the southern islands.\n\nProvisional gameplay."
 FCU_ud_interior_garrisons:0 "Interior Garrisons"
 FCU_ud_interior_garrisons_desc:0 "Reinforce the interior garrisons that protect the rail lines and the reception towns.\n\nProvisional gameplay."
 FCU_ud_radar_belt:0 "The Radar Belt"
 FCU_ud_radar_belt_desc:0 "Close the gaps in the federal radar cover. Nothing should cross the border, or fall from the sky, unseen.\n\nProvisional gameplay."
 FCU_ud_reserve_wings:0 "Reserve Wings"
 FCU_ud_reserve_wings_desc:0 "Keep trained reserve pilots current with a few weeks of flying every year.\n\nProvisional gameplay."
 FCU_ud_rapid_reaction_brigades:0 "Rapid-Reaction Brigades"
 FCU_ud_rapid_reaction_brigades_desc:0 "Keep two brigades at short notice for any emergency in the Federation or the treaty area.\n\nProvisional gameplay."
 FCU_ud_forces_at_decades_end:0 "The Forces at Decade's End"
 FCU_ud_forces_at_decades_end_desc:0 "The forces review their decade: the southern islands, the coup and the impact. They report what they are ready for and what they are not.\n\nProvisional gameplay."
 FCU_ud_long_aftermath:0 "The Long Aftermath"
 FCU_ud_long_aftermath_desc:0 "The impact has passed and the debris has not. The Federation enters the new century with reception towns still full and a sky still crossed by falling fragments.\n\nProvisional gameplay; context from Chronicle, 1999 / 07.08."
 FCU_ud_debris_season:0 "The Debris Season"
 FCU_ud_debris_season_desc:0 "Fragments of Ulysses keep falling. Federal agencies publish a seasonal forecast of where and when the risk is highest.\n\nProvisional gameplay."
 FCU_ud_refugee_ledger:0 "The Refugee Ledger"
 FCU_ud_refugee_ledger_desc:0 "On 21 April 2000 Erusea stops taking in refugees. The Federation must decide how many of those turned away it can receive.\n\nOfficial: Chronicle, 2000 / 04.21. Choices and effects are provisional gameplay."
 FCU_ud_battery_crew_rotations:0 "Battery Crew Rotations"
 FCU_ud_battery_crew_rotations_desc:0 "Keep Stonehenge's crews rotating on a schedule that matches the debris forecast. The battery is only useful when its people are fresh.\n\nProvisional gameplay; context from Super Weapons, Stonehenge."
 FCU_ud_open_federal_camps:0 "Open the Federal Camps"
 FCU_ud_open_federal_camps_desc:0 "Open federal reception camps to refugees turned away elsewhere. The camps are crowded; the alternative is worse.\n\nProvisional gameplay."
 FCU_ud_partner_resettlement_quotas:0 "Partner Resettlement Quotas"
 FCU_ud_partner_resettlement_quotas_desc:0 "Agree quotas with the treaty partners so that every member receives its share of the refugees.\n\nProvisional gameplay."
 FCU_ud_fragment_warning_service:0 "Fragment Warning Service"
 FCU_ud_fragment_warning_service_desc:0 "Broadcast fragment warnings to every district with enough notice to take cover.\n\nProvisional gameplay."
 FCU_ud_camp_schools:0 "Camp Schools"
 FCU_ud_camp_schools_desc:0 "Open schools in the reception camps. Children who have lost their homes should not also lose their years.\n\nProvisional gameplay."
 FCU_ud_forward_deterrence:0 "Forward Deterrence"
 FCU_ud_forward_deterrence_desc:0 "Erusea has closed its border and the continent is tense. Move federal units forward and make the treaty's commitments visible.\n\nProvisional gameplay."
 FCU_ud_continental_restraint:0 "Continental Restraint"
 FCU_ud_continental_restraint_desc:0 "Keep the federal posture defensive and the units at home. Nothing the Federation does should give Erusea a reason it does not already have.\n\nProvisional gameplay."
 FCU_ud_border_air_patrols:0 "Border Air Patrols"
 FCU_ud_border_air_patrols_desc:0 "Fly patrols along the western border inside federal airspace. They watch; they do not cross.\n\nProvisional gameplay."
 FCU_ud_confidence_measures:0 "Confidence Measures"
 FCU_ud_confidence_measures_desc:0 "Publish the federal exercise calendar and invite observers. The Federation has nothing to hide from its neighbours.\n\nProvisional gameplay."
 FCU_ud_reserve_callup_plans:0 "Reserve Call-Up Plans"
 FCU_ud_reserve_callup_plans_desc:0 "Update the reserve call-up plans so that mobilisation can begin within days if the worst happens.\n\nProvisional gameplay."
 FCU_ud_relief_diplomacy:0 "Relief Diplomacy"
 FCU_ud_relief_diplomacy_desc:0 "Offer federal relief experts to any Usean government that asks, Erusea included. Help is harder to refuse than talks.\n\nProvisional gameplay."
 FCU_ud_summer_of_2003:0 "The Summer of 2003"
 FCU_ud_summer_of_2003_desc:0 "In the summer of 2003 Erusea invades neutral San Salvacion and seizes Stonehenge. The Federation's decade of preparation now meets a war.\n\nOfficial: Chronicle, 2003 / SUMMER. Choices and effects are provisional gameplay."
 FCU_ud_national_mobilisation:0 "National Mobilisation"
 FCU_ud_national_mobilisation_desc:0 "Call up every reserve and move the economy onto a war footing at once.\n\nProvisional gameplay."
 FCU_ud_measured_mobilisation:0 "Measured Mobilisation"
 FCU_ud_measured_mobilisation_desc:0 "Call up the reserves in stages and keep the civilian economy running. The war may be long.\n\nProvisional gameplay."
 FCU_ud_home_front_councils:0 "Home Front Councils"
 FCU_ud_home_front_councils_desc:0 "Form councils in every region to manage rationing, refugees and war work together.\n\nProvisional gameplay."
 FCU_ud_war_economy_board:0 "War Economy Board"
 FCU_ud_war_economy_board_desc:0 "A single board allocates steel, fuel and labour between the war and the recovery.\n\nProvisional gameplay."
 FCU_ud_war_bonds:0 "War Bonds"
 FCU_ud_war_bonds_desc:0 "Sell war bonds to citizens and partners. The war is paid for over decades.\n\nProvisional gameplay."
 FCU_ud_allied_credit:0 "Allied Credit"
 FCU_ud_allied_credit_desc:0 "Borrow from allies and partners beyond Usea. The money comes quickly and with conditions.\n\nProvisional gameplay."
 FCU_ud_home_front_endures:0 "The Home Front Endures"
 FCU_ud_home_front_endures_desc:0 "Two years of war and five years of debris have not broken the home front. The Federation keeps working.\n\nProvisional gameplay."
 FCU_ud_federal_question_returns:0 "The Federal Question Returns"
 FCU_ud_federal_question_returns_desc:0 "The government that carried the Federation through the impact must now carry it into a new century and, perhaps, a war.\n\nProvisional gameplay."
 FCU_ud_presidential_continuity:0 "Presidential Continuity"
 FCU_ud_presidential_continuity_desc:0 "The federal presidency and the Assembly govern as they have since 1991. Continuity is itself a policy.\n\nMod provenance: 1991 FCU government; Sinclair's earlier term is user-approved provisional chronology; the choice is provisional gameplay."
 FCU_ud_directorate_second_term:0 "The Directorate's Second Term"
 FCU_ud_directorate_second_term_desc:0 "The directorate enters the new century still in power. The emergency it was built for has passed; its critics say so daily.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_unity_renewal:0 "Renew the Unity Government"
 FCU_ud_unity_renewal_desc:0 "The unity cabinet asks the parties to stay in government through the recovery. Most agree; some want their independence back.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_federal_war_cabinet:0 "A Federal War Cabinet"
 FCU_ud_federal_war_cabinet_desc:0 "Form a small war cabinet inside the federal government, ready before it is needed.\n\nProvisional gameplay."
 FCU_ud_restore_before_the_charter:0 "Restore Civilian Rule"
 FCU_ud_restore_before_the_charter_desc:0 "End the directorate now, before any war or alliance tests it. Executive authority returns to the presidency and the Assembly.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_directorate_war_footing:0 "Directorate War Footing"
 FCU_ud_directorate_war_footing_desc:0 "Keep the directorate and prepare it for war. Its staff structure was built for emergencies; this is one.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_unity_war_cabinet:0 "Unity War Cabinet"
 FCU_ud_unity_war_cabinet_desc:0 "Draw a war cabinet from every party in the unity government. Each party shares the decisions and the blame.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_presidents_coalition:0 "The President's Coalition"
 FCU_ud_presidents_coalition_desc:0 "FCU President Robert Sinclair founds ISAF on 22 August 2003. The federal government turns the treaty partners into an allied force.\n\nOfficial: Chronicle, 2003 / 08.22. Choices and effects are provisional gameplay."
 FCU_ud_directorate_accounting:0 "The Directorate's Accounting"
 FCU_ud_directorate_accounting_desc:0 "Whether it ended or endured, the directorate must account to the Assembly for the years it governed.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_unity_charter_vote:0 "A Vote for the Charter"
 FCU_ud_unity_charter_vote_desc:0 "The unity cabinet puts the ISAF charter to an Assembly vote. Every party votes, and every party is bound.\n\nAlternate history; provisional gameplay. The AI never takes this path."
 FCU_ud_assembly_war_powers:0 "Assembly War Powers"
 FCU_ud_assembly_war_powers_desc:0 "The Assembly grants the presidency war powers for the duration and keeps the right to review them every six months.\n\nProvisional gameplay."
 FCU_ud_wartime_constitution:0 "The Wartime Constitution"
 FCU_ud_wartime_constitution_desc:0 "Whatever government leads the Federation, the war needs rules: who decides, who is consulted and when the emergency ends.\n\nProvisional gameplay."
 FCU_ud_postwar_elections_pledge:0 "Pledge Postwar Elections"
 FCU_ud_postwar_elections_pledge_desc:0 "Promise federal elections within a year of the war's end. The promise is meant to be kept.\n\nProvisional gameplay."
 FCU_ud_emergency_continuity:0 "Emergency Continuity"
 FCU_ud_emergency_continuity_desc:0 "Keep the emergency arrangements until the reconstruction is complete. Elections can wait for peace.\n\nProvisional gameplay."
 FCU_ud_charter_articles:0 "The Charter Articles"
 FCU_ud_charter_articles_desc:0 "On 22 August 2003 FCU President Robert Sinclair establishes ISAF after Erusea refuses to leave San Salvacion and Stonehenge. Its charter must turn partners into one force.\n\nOfficial: Chronicle, 2003 / 08.22. Choices and effects are provisional gameplay."
 FCU_ud_integrated_isaf_staff:0 "Integrated ISAF Staff"
 FCU_ud_integrated_isaf_staff_desc:0 "Merge the members' staffs into one ISAF headquarters with officers from every nation in every section.\n\nProvisional gameplay."
 FCU_ud_lead_nation_command:0 "Lead-Nation Command"
 FCU_ud_lead_nation_command_desc:0 "Central Usea leads ISAF and the partners attach liaison officers. Faster decisions, fewer voices.\n\nProvisional gameplay."
 FCU_ud_member_contributions:0 "Member Contributions"
 FCU_ud_member_contributions_desc:0 "Agree what each ISAF member contributes: units, bases, transport and money.\n\nProvisional gameplay."
 FCU_ud_san_salvacion_liaison:0 "Liaison with San Salvacion"
 FCU_ud_san_salvacion_liaison_desc:0 "Keep a liaison with San Salvacion's authorities through the occupation. ISAF fights to restore the country, not to replace its government.\n\nProvisional gameplay."
 FCU_ud_isaf_logistics_pool:0 "ISAF Logistics Pool"
 FCU_ud_isaf_logistics_pool_desc:0 "Pool fuel, ammunition and spare parts so that any member's unit can draw from any member's depot.\n\nProvisional gameplay."
 FCU_ud_isaf_signals_net:0 "ISAF Signals Net"
 FCU_ud_isaf_signals_net_desc:0 "Build a common signals net with shared codes and shared frequencies.\n\nProvisional gameplay."
 FCU_ud_los_canas_line:0 "The Los Canas Line"
 FCU_ud_los_canas_line_desc:0 "On 14 September 2003 Stonehenge pushes ISAF back to Los Canas, and its first offensive against the battery fails. Hold the line that remains.\n\nOfficial: Chronicle, 2003 / 09.14. Choices and effects are provisional gameplay."
 FCU_ud_hold_at_any_cost:0 "Hold at Any Cost"
 FCU_ud_hold_at_any_cost_desc:0 "Hold every position for as long as possible. Each day bought is a day for the reserves.\n\nProvisional gameplay."
 FCU_ud_trade_space_for_time:0 "Trade Space for Time"
 FCU_ud_trade_space_for_time_desc:0 "Fall back in good order and keep the army whole. Ground can be retaken; soldiers cannot be replaced.\n\nProvisional gameplay."
 FCU_ud_evacuate_federal_assets:0 "Evacuate Federal Assets"
 FCU_ud_evacuate_federal_assets_desc:0 "Move aircraft, ships, records and specialists out of reach of the advance.\n\nProvisional gameplay."
 FCU_ud_north_point_exile:0 "Exile at North Point"
 FCU_ud_north_point_exile_desc:0 "On 16 September 2004 ISAF establishes its headquarters in North Point. Driven from the continent, the alliance rebuilds on the islands.\n\nOfficial: Chronicle, 2004 / 09.16. Choices and effects are provisional gameplay."
 FCU_ud_concentrate_at_north_point:0 "Concentrate at North Point"
 FCU_ud_concentrate_at_north_point_desc:0 "Bring every federal unit that can reach the islands to North Point. Rebuild there, then return together.\n\nProvisional gameplay."
 FCU_ud_foothold_on_the_continent:0 "A Foothold on the Continent"
 FCU_ud_foothold_on_the_continent_desc:0 "Keep the units still fighting on the continent supplied, however thinly. A foothold now is a beachhead later.\n\nProvisional gameplay."
 FCU_ud_training_in_exile:0 "Training in Exile"
 FCU_ud_training_in_exile_desc:0 "Turn the islands into training grounds: ranges, airfields and the drills the return will need.\n\nProvisional gameplay."
 FCU_ud_saint_ark_withdrawal:0 "Cover the Saint Ark Withdrawal"
 FCU_ud_saint_ark_withdrawal_desc:0 "On 10 October 2004 the Mount Shezna radar is destroyed to cover the ISAF retreat from Saint Ark. Bring the withdrawn units home to the islands.\n\nOfficial: Chronicle, 2004 / 10.10. Choices and effects are provisional gameplay."
 FCU_ud_comberth_harbor:0 "Comberth Harbor"
 FCU_ud_comberth_harbor_desc:0 "On 23 November 2004 ISAF sinks the Aegir fleet at Comberth Harbor. The sea approaches to the continent are opening.\n\nOfficial: Chronicle, 2004 / 11.23. Choices and effects are provisional gameplay."
 FCU_ud_comona_islands:0 "Over the Comona Islands"
 FCU_ud_comona_islands_desc:0 "On 31 December 2004 a large air battle is fought over the Comona Islands. The federal wings learn what the return will cost.\n\nOfficial: Chronicle, 2004 / 12.31. Choices and effects are provisional gameplay."
 FCU_ud_plans_for_return:0 "Plans for the Return"
 FCU_ud_plans_for_return_desc:0 "Plan the return to the continent: where to land, what to bring and what to do on the first day ashore.\n\nProvisional gameplay."
 FCU_ud_landing_rehearsals:0 "Landing Rehearsals"
 FCU_ud_landing_rehearsals_desc:0 "Rehearse the landing on the islands' beaches until every unit knows its place in the order.\n\nProvisional gameplay."
 FCU_ud_deception_plan:0 "A Deception Plan"
 FCU_ud_deception_plan_desc:0 "Let the enemy prepare for the wrong landing. Dummy traffic, false orders and a feint where it is least expected.\n\nProvisional gameplay."
 FCU_ud_air_wings_review:0 "The Air Wings Review"
 FCU_ud_air_wings_review_desc:0 "The federal air arm reviews its wings for the new century: what it flies, who flies it and what the debris has taught about flying at all.\n\nProvisional gameplay."
 FCU_ud_air_superiority_doctrine:0 "Air Superiority Doctrine"
 FCU_ud_air_superiority_doctrine_desc:0 "Win the sky first. Every other mission depends on it.\n\nProvisional gameplay."
 FCU_ud_precision_strike_doctrine:0 "Precision Strike Doctrine"
 FCU_ud_precision_strike_doctrine_desc:0 "Build the wings around precise strikes on the targets that matter most.\n\nProvisional gameplay."
 FCU_ud_electronic_warfare_doctrine:0 "Electronic Warfare Doctrine"
 FCU_ud_electronic_warfare_doctrine_desc:0 "Blind the enemy's radars and let the wings fly unseen.\n\nProvisional gameplay."
 FCU_ud_interceptor_alerts:0 "Interceptor Alerts"
 FCU_ud_interceptor_alerts_desc:0 "Keep interceptors on alert at every major airfield, ready in minutes.\n\nProvisional gameplay."
 FCU_ud_strike_packages:0 "Strike Packages"
 FCU_ud_strike_packages_desc:0 "Plan strike packages of escorts, jammers and strike aircraft that train and fly together.\n\nProvisional gameplay."
 FCU_ud_jamming_pods:0 "Jamming Pods"
 FCU_ud_jamming_pods_desc:0 "Equip the wings with jamming pods and the crews to use them.\n\nProvisional gameplay."
 FCU_ud_aircrew_pipeline:0 "Aircrew Pipeline"
 FCU_ud_aircrew_pipeline_desc:0 "Train replacement aircrew faster without training them worse.\n\nProvisional gameplay."
 FCU_ud_tanker_fleet:0 "Tanker Fleet"
 FCU_ud_tanker_fleet_desc:0 "Expand the tanker fleet so that the wings can reach the whole continent.\n\nProvisional gameplay."
 FCU_ud_railgun_evasion:0 "Railgun Evasion Training"
 FCU_ud_railgun_evasion_desc:0 "Erusea now holds Stonehenge and turns its railguns on aircraft. Train every crew to fly where the battery cannot reach.\n\nOfficial: Chronicle, 2003 / SUMMER. Choices and effects are provisional gameplay."
 FCU_ud_low_level_profiles:0 "Low-Level Profiles"
 FCU_ud_low_level_profiles_desc:0 "Fly low, under the battery's reach and under the radars.\n\nProvisional gameplay."
 FCU_ud_high_altitude_profiles:0 "High-Altitude Profiles"
 FCU_ud_high_altitude_profiles_desc:0 "Fly high and fast, and stay out of the battery's arcs.\n\nProvisional gameplay."
 FCU_ud_rebuilding_the_wings:0 "Rebuilding the Wings"
 FCU_ud_rebuilding_the_wings_desc:0 "Rebuild the wings at North Point with the aircraft that escaped and the crews that survived.\n\nProvisional gameplay; context from Chronicle, 2004 / 09.16."
 FCU_ud_island_maintenance_depots:0 "Island Maintenance Depots"
 FCU_ud_island_maintenance_depots_desc:0 "Build maintenance depots on the islands so that damaged aircraft fly again within days.\n\nProvisional gameplay."
 FCU_ud_airborne_early_warning:0 "Airborne Early Warning"
 FCU_ud_airborne_early_warning_desc:0 "Keep early-warning aircraft over the front so that the wings always see first.\n\nProvisional gameplay."
 FCU_ud_combat_search_and_rescue:0 "Combat Search and Rescue"
 FCU_ud_combat_search_and_rescue_desc:0 "Bring back every downed crew that can be reached. Pilots fly better when they know someone will come.\n\nProvisional gameplay."
 FCU_ud_recognise_the_aces:0 "Recognise the Aces"
 FCU_ud_recognise_the_aces_desc:0 "Recognise the pilots whose records stand out. Their example teaches faster than any manual.\n\nProvisional gameplay."
 FCU_ud_partner_air_contingents:0 "Partner Air Contingents"
 FCU_ud_partner_air_contingents_desc:0 "Fly the partners' squadrons under ISAF command beside the federal wings.\n\nProvisional gameplay."
 FCU_ud_federal_air_command:0 "Federal Air Command"
 FCU_ud_federal_air_command_desc:0 "Keep the federal wings under federal command and assign partners their own sectors.\n\nProvisional gameplay."
 FCU_ud_air_supremacy_campaign:0 "The Air Supremacy Campaign"
 FCU_ud_air_supremacy_campaign_desc:0 "ISAF returns to the continent. Win the sky over the beachheads and keep it.\n\nProvisional gameplay; context from Chronicle, 2005 / 01.24."
 FCU_ud_wings_over_usea:0 "Wings over Usea"
 FCU_ud_wings_over_usea_desc:0 "The federal wings fly over the whole continent again.\n\nProvisional gameplay."
 FCU_ud_return_to_usea:0 "The Return to Usea"
 FCU_ud_return_to_usea_desc:0 "On 24 January 2005 ISAF lands on the Usean continent. The Federation is going home.\n\nOfficial: Chronicle, 2005 / 01.24. Choices and effects are provisional gameplay."
 FCU_ud_beachhead_logistics:0 "Beachhead Logistics"
 FCU_ud_beachhead_logistics_desc:0 "Keep the beachheads supplied: fuel, ammunition, food and the trucks to move them inland.\n\nProvisional gameplay."
 FCU_ud_liberation_principle:0 "Liberation, Not Annexation"
 FCU_ud_liberation_principle_desc:0 "Every place ISAF frees goes back to the government it belongs to. The Federation takes no territory and redraws no border.\n\nProvisional gameplay."
 FCU_ud_engineers_escape:0 "The Engineers' Escape"
 FCU_ud_engineers_escape_desc:0 "On 14 March 2005 Stonehenge's engineers and their families escape from Erusean custody. They have to be received, sheltered and heard.\n\nOfficial: Chronicle, 2005 / 03.14. Choices and effects are provisional gameplay."
 FCU_ud_civil_affairs_directorate:0 "Civil Affairs Directorate"
 FCU_ud_civil_affairs_directorate_desc:0 "A federal civil affairs directorate restores services behind the front until local authorities return.\n\nProvisional gameplay."
 FCU_ud_partner_led_administration:0 "Partner-Led Administration"
 FCU_ud_partner_led_administration_desc:0 "Each liberated area is run by its own government's returning officials, with ISAF support only when asked.\n\nProvisional gameplay."
 FCU_ud_through_the_tango_line:0 "Through the Tango Line"
 FCU_ud_through_the_tango_line_desc:0 "On 28 February 2005 ISAF takes Istas Fortress and breaches the Tango Line.\n\nOfficial: Chronicle, 2005 / 02.28. Choices and effects are provisional gameplay."
 FCU_ud_restore_the_utilities:0 "Restore the Utilities"
 FCU_ud_restore_the_utilities_desc:0 "Repair power, water and telephone lines in every liberated town.\n\nProvisional gameplay."
 FCU_ud_stonehenge_silenced:0 "Stonehenge Silenced"
 FCU_ud_stonehenge_silenced_desc:0 "On 2 April 2005 ISAF destroys Stonehenge. The battery built to defend the world from Ulysses will not fire again.\n\nOfficial: Chronicle, 2005 / 04.02; Super Weapons, Stonehenge. Choices and effects are provisional gameplay."
 FCU_ud_assisted_returns:0 "Assisted Returns"
 FCU_ud_assisted_returns_desc:0 "Help refugees go home to the liberated districts as soon as they are safe.\n\nProvisional gameplay."
 FCU_ud_hold_the_camps:0 "Hold the Camps Until Spring"
 FCU_ud_hold_the_camps_desc:0 "Keep refugees in the camps until the districts are rebuilt. Safer now, harder later.\n\nProvisional gameplay."
 FCU_ud_ice_creek_landing:0 "The Ice Creek Landing"
 FCU_ud_ice_creek_landing_desc:0 "On 18 June 2005 ISAF lands in the north at Ice Creek.\n\nOfficial: Chronicle, 2005 / 06.18. Choices and effects are provisional gameplay."
 FCU_ud_san_salvacion_liberated:0 "San Salvacion Liberated"
 FCU_ud_san_salvacion_liberated_desc:0 "On 10 July 2005 San Salvacion is liberated. The Federation's task now is to hand the country back, not to hold it.\n\nOfficial: Chronicle, 2005 / 07.10. Choices and effects are provisional gameplay."
 FCU_ud_whiskey_corridor:0 "The Whiskey Corridor"
 FCU_ud_whiskey_corridor_desc:0 "On 15 August 2005 ISAF breaches the Whiskey Corridor.\n\nOfficial: Chronicle, 2005 / 08.15. Choices and effects are provisional gameplay."
 FCU_ud_no_federal_flag:0 "No Federal Flag"
 FCU_ud_no_federal_flag_desc:0 "Leave no federal flag over liberated San Salvacion. ISAF units fly their own colours beside the host's.\n\nProvisional gameplay."
 FCU_ud_joint_site_custody:0 "Joint Custody of the Battery Site"
 FCU_ud_joint_site_custody_desc:0 "Propose joint custody of the ruined battery site with San Salvacion until the wreckage is cleared. The ground stays San Salvacion's.\n\nProvisional gameplay."
 FCU_ud_supply_the_road:0 "Supply the Road to Farbanti"
 FCU_ud_supply_the_road_desc:0 "Push supplies down the road to Farbanti fast enough to keep the advance moving.\n\nProvisional gameplay."
 FCU_ud_lenient_terms:0 "Lenient Terms"
 FCU_ud_lenient_terms_desc:0 "Prepare surrender terms that leave Erusea a government able to rebuild.\n\nProvisional gameplay."
 FCU_ud_strict_terms:0 "Strict Terms"
 FCU_ud_strict_terms_desc:0 "Prepare surrender terms with strict oversight and full accountability.\n\nProvisional gameplay."
 FCU_ud_liberation_accounting:0 "The Liberation Accounting"
 FCU_ud_liberation_accounting_desc:0 "Count what the war cost and what liberation has restored. The ledger is long on both sides.\n\nProvisional gameplay."
 FCU_ud_victory_in_usea:0 "Victory in Usea"
 FCU_ud_victory_in_usea_desc:0 "On 19 September 2005 Farbanti falls and Erusea surrenders. The Continental War is over.\n\nOfficial: Chronicle, 2005 / 09.19. Choices and effects are provisional gameplay."
 FCU_ud_oversight_council:0 "An Oversight Council"
 FCU_ud_oversight_council_desc:0 "Oversee Erusea's provisional government through a standing ISAF council that meets every week.\n\nProvisional gameplay."
 FCU_ud_light_oversight:0 "Light Oversight"
 FCU_ud_light_oversight_desc:0 "Keep oversight to the terms of surrender and let Erusea's provisional government govern.\n\nProvisional gameplay."
 FCU_ud_megalith_aftermath:0 "After Megalith"
 FCU_ud_megalith_aftermath_desc:0 "On 26 September 2005 young Erusean officers seize Megalith, ISAF destroys it, and Erusea forms a provisional autonomous government under ISAF oversight.\n\nOfficial: Chronicle, 2005 / 09.26; Super Weapons, Megalith. Choices and effects are provisional gameplay."
 FCU_ud_victors_restraint:0 "The Victor's Restraint"
 FCU_ud_victors_restraint_desc:0 "Take no territory and demand no government. The Federation's victory is that the war is over.\n\nProvisional gameplay."
 FCU_ud_federation_endures:0 "The Federation Endures"
 FCU_ud_federation_endures_desc:0 "In this provisional outcome Erusea has won the war. The Federation has lost battles, ground and allies, but it still governs.\n\nProvisional gameplay."
 FCU_ud_rebuild_the_army:0 "Rebuild the Army"
 FCU_ud_rebuild_the_army_desc:0 "Rebuild the federal army from the units that came home.\n\nProvisional gameplay."
 FCU_ud_accept_the_peace:0 "Accept the Peace"
 FCU_ud_accept_the_peace_desc:0 "Accept the peace and spend the next decade on recovery rather than revenge.\n\nProvisional gameplay."
 FCU_ud_survival_compact:0 "The Survival Compact"
 FCU_ud_survival_compact_desc:0 "Bind the remaining partners in a compact for recovery and mutual defence.\n\nProvisional gameplay."
 FCU_ud_armistice_line:0 "The Armistice Line"
 FCU_ud_armistice_line_desc:0 "In this provisional outcome the war ends in an armistice. A line on the map divides Usea, and neither side calls it peace.\n\nProvisional gameplay."
 FCU_ud_armed_vigilance:0 "Armed Vigilance"
 FCU_ud_armed_vigilance_desc:0 "Keep the army at the line and the air arm on alert.\n\nProvisional gameplay."
 FCU_ud_demilitarised_zone:0 "A Demilitarised Zone"
 FCU_ud_demilitarised_zone_desc:0 "Propose a demilitarised zone along the line, watched by neutral observers.\n\nProvisional gameplay."
 FCU_ud_cold_peace:0 "A Cold Peace"
 FCU_ud_cold_peace_desc:0 "Live with a peace nobody signed. Trade where possible, watch where necessary.\n\nProvisional gameplay."
 FCU_ud_war_that_was_not:0 "The War That Was Not"
 FCU_ud_war_that_was_not_desc:0 "In this provisional outcome the continental accord has averted the war. The Federation must build a peace that lasts.\n\nProvisional gameplay."
 FCU_ud_accord_guarantees:0 "Accord Guarantees"
 FCU_ud_accord_guarantees_desc:0 "Guarantee the accord with treaty forces kept ready but at home.\n\nProvisional gameplay."
 FCU_ud_continental_market:0 "A Continental Market"
 FCU_ud_continental_market_desc:0 "Bind the accord with trade: lower tariffs and shared reconstruction contracts across Usea.\n\nProvisional gameplay."
 FCU_ud_long_peace:0 "The Long Peace"
 FCU_ud_long_peace_desc:0 "The accord holds through 2005. The Federation turns to the recovery the impact demanded.\n\nProvisional gameplay."
 FCU_ud_the_usean_order:0 "The Usean Order"
 FCU_ud_the_usean_order_desc:0 "Whatever the outcome, Usea needs an order that holds after 2005. The Federation must decide what part it plays.\n\nProvisional gameplay."
 FCU_ud_standing_isaf:0 "A Standing ISAF"
 FCU_ud_standing_isaf_desc:0 "Keep ISAF's headquarters and staff in peacetime. The alliance has learned too much to forget it.\n\nProvisional gameplay."
 FCU_ud_return_the_staff:0 "Return the Staff to Peace"
 FCU_ud_return_the_staff_desc:0 "Send ISAF's officers home to their own services and keep only a small secretariat.\n\nProvisional gameplay."
 FCU_ud_veterans_charter:0 "The Veterans' Charter"
 FCU_ud_veterans_charter_desc:0 "Guarantee veterans their care, pensions and places in the reconstruction.\n\nProvisional gameplay."
 FCU_ud_order_of_2005:0 "The Order of 2005"
 FCU_ud_order_of_2005_desc:0 "The Federation records the settlement it helped to build. The authored chronology of this campaign ends here.\n\nProvisional gameplay."
 FCU_ud_federal_question_answered:0 "The Federal Question Answered"
 FCU_ud_federal_question_answered_desc:0 "The government that led the Federation through Ulysses and the continental crisis gives its account to the Assembly and the voters.\n\nProvisional gameplay."
 FCU_ud_federal_course_idea:0 "The Federal Course"
 FCU_ud_federal_course_idea_desc:0 "The 1991 government governs as it was elected to govern."
 FCU_ud_decree_programme_idea:0 "Decree Programme"
 FCU_ud_decree_programme_idea_desc:0 "Administrative matters move by presidential decree."
 FCU_ud_assembly_partnership_idea:0 "Assembly Partnership"
 FCU_ud_assembly_partnership_idea_desc:0 "The Assembly's committee chairs draft major bills with the cabinet."
 FCU_ud_ministry_of_preparedness_idea:0 "Ministry of Preparedness"
 FCU_ud_ministry_of_preparedness_idea_desc:0 "One minister answers for every shelter, timetable and stockpile."
 FCU_ud_interagency_board_idea:0 "Interagency Emergency Board"
 FCU_ud_interagency_board_idea_desc:0 "Each ministry keeps its duties; a board coordinates them daily."
 FCU_ud_emergency_framework_idea:0 "Emergency Framework"
 FCU_ud_emergency_framework_idea_desc:0 "A statute stands ready to hand authority to a directorate. Alternate history."
 FCU_ud_staff_directorate_idea:0 "Staff Directorate Model"
 FCU_ud_staff_directorate_idea_desc:0 "The directorate is designed as a military staff. Alternate history."
 FCU_ud_civil_military_board_idea:0 "Civil-Military Board"
 FCU_ud_civil_military_board_idea_desc:0 "The directorate is designed as a mixed board. Alternate history."
 FCU_ud_directorate_rule_idea:0 "Unified Command Directorate"
 FCU_ud_directorate_rule_idea_desc:0 "A directorate built around Unified Command governs the Federation. Alternate history; provisional gameplay."
 FCU_ud_martial_evacuation_idea:0 "Martial Evacuation Law"
 FCU_ud_martial_evacuation_idea_desc:0 "The evacuation programme is under military law. Alternate history."
 FCU_ud_loyalty_reviews_idea:0 "Loyalty Reviews"
 FCU_ud_loyalty_reviews_idea_desc:0 "Officers from commands that went silent are under review. Alternate history."
 FCU_ud_extended_directorate_idea:0 "Extended Directorate"
 FCU_ud_extended_directorate_idea_desc:0 "The directorate's mandate has been renewed until the danger passes. Alternate history."
 FCU_ud_restored_assembly_idea:0 "Restored Assembly"
 FCU_ud_restored_assembly_idea_desc:0 "Executive authority has returned to the presidency and the Assembly. Alternate history."
 FCU_ud_regional_ministers_idea:0 "Regional Ministers"
 FCU_ud_regional_ministers_idea_desc:0 "The unity cabinet's ministers answer to the regions. Alternate history."
 FCU_ud_technocratic_ministers_idea:0 "Technocratic Ministers"
 FCU_ud_technocratic_ministers_idea_desc:0 "Specialists without party hold the key ministries. Alternate history."
 FCU_ud_unity_cabinet_idea:0 "Federal Unity Cabinet"
 FCU_ud_unity_cabinet_idea_desc:0 "Every Assembly party sits in the government. Alternate history; provisional gameplay."
 FCU_ud_burden_sharing_idea:0 "Burden-Sharing Act"
 FCU_ud_burden_sharing_idea_desc:0 "Preparedness costs are spread across the regions by formula. Alternate history."
 FCU_ud_regional_autonomy_idea:0 "Regional Autonomy Charter"
 FCU_ud_regional_autonomy_idea_desc:0 "The regions control their own preparedness budgets. Alternate history."
 FCU_ud_unity_emergency_cabinet_idea:0 "Unity Emergency Cabinet"
 FCU_ud_unity_emergency_cabinet_idea_desc:0 "An all-party emergency cabinet meets daily. Alternate history."
 FCU_ud_continental_trade_idea:0 "Continental Trade Programme"
 FCU_ud_continental_trade_idea_desc:0 "Treaty partners trade with the Federation on easier terms."
 FCU_ud_federal_industry_idea:0 "Federal Industrial Policy"
 FCU_ud_federal_industry_idea_desc:0 "Federal credit flows to emergency industries."
 FCU_ud_ulysses_bonds_idea:0 "Ulysses Bonds"
 FCU_ud_ulysses_bonds_idea_desc:0 "Preparedness is paid for with long-dated bonds."
 FCU_ud_emergency_levy_idea:0 "The Emergency Levy"
 FCU_ud_emergency_levy_idea_desc:0 "A temporary levy pays for preparedness now."
 FCU_ud_impact_insurance_idea:0 "Impact Insurance Pool"
 FCU_ud_impact_insurance_idea_desc:0 "Losses from the impact will be rebuilt by formula."
 FCU_ud_strategic_stockpile_idea:0 "Strategic Stockpile Law"
 FCU_ud_strategic_stockpile_idea_desc:0 "Firms hold six months of critical inputs."
 FCU_ud_treaty_secretariat_idea:0 "Treaty Secretariat"
 FCU_ud_treaty_secretariat_idea_desc:0 "The Treaty Organization has a standing secretariat. Mod provenance UTO."
 FCU_ud_integrated_treaty_staff_idea:0 "Integrated Treaty Staff"
 FCU_ud_integrated_treaty_staff_idea_desc:0 "The members plan through one treaty staff."
 FCU_ud_national_contingents_idea:0 "National Contingents"
 FCU_ud_national_contingents_idea_desc:0 "Each member keeps its forces under its own command."
 FCU_ud_western_watch_idea:0 "The Western Watch"
 FCU_ud_western_watch_idea_desc:0 "A standing treaty watch faces the western frontier."
 FCU_ud_federal_subsidy_idea:0 "Federal Treaty Subsidy"
 FCU_ud_federal_subsidy_idea_desc:0 "The Federation pays the treaty's common costs."
 FCU_ud_shared_assessment_idea:0 "Shared Assessment Scale"
 FCU_ud_shared_assessment_idea_desc:0 "Members pay the treaty's costs by the size of their economies."
 FCU_ud_treaty_air_picture_idea:0 "Treaty Air Picture"
 FCU_ud_treaty_air_picture_idea_desc:0 "The members share one radar picture."
 FCU_ud_treaty_relief_command_idea:0 "Treaty Relief Command"
 FCU_ud_treaty_relief_command_idea_desc:0 "A treaty command owns the relief stores and transport."
 FCU_ud_southern_tribunals_idea:0 "Southern Tribunals"
 FCU_ud_southern_tribunals_idea_desc:0 "Rebels from the southern islands are tried in federal courts."
 FCU_ud_southern_garrison_idea:0 "Southern Garrison"
 FCU_ud_southern_garrison_idea_desc:0 "A permanent garrison holds the southern islands."
 FCU_ud_island_reconstruction_idea:0 "Island Reconstruction"
 FCU_ud_island_reconstruction_idea_desc:0 "The southern islands are being rebuilt by their own firms."
 FCU_ud_coast_guard_idea:0 "Southern Coast Guard"
 FCU_ud_coast_guard_idea_desc:0 "A federal coast guard polices the southern waters."
