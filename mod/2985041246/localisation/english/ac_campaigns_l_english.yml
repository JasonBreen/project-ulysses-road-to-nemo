 ac_camp.11.t:0 "The returning patrol"
 ac_camp.11.desc:0 "The patrol returned with one fewer man than it had taken out. The missing soldier was at a medical post, and the officer wrote that down before any rumor could improve on it. Around the desk, the others described the incident in the language of people who had each seen a different part of the same street.\n\nThe sergeant wanted to close the road until the report was complete. The officer asked whether closing it would make the report more accurate. Nobody answered immediately. A restriction could be justified by uncertainty and could also ensure that uncertainty lasted until the next shift found another reason to retain it.\n\nOn the edge of the desk lay the clinic authorization. It had begun as an exception. The officer had since discovered that exceptions generated more correspondence than ordinary rules because somebody had to keep choosing to honor them. The administrator's latest note contained no appeal to compassion. It gave the time of the next receiving movement and asked which instructions the checkpoint should expect.\n\nThe officer telephoned the medical post. The injured soldier was awake and complaining about the food. He asked whether his unit had been told. The officer said it had, although technically he was still doing so.\n\nWhen he hung up, the sergeant was waiting beside the district map. Beyond the window, the evening patrol was forming in the yard. The same street would receive them. The people living on it would have to discover whether the previous day's permission still meant anything."
 ac_camp.11.desc.v0:0 "The patrol returned with one fewer man than it had taken out. The missing soldier was at a medical post, and the officer wrote that down before any rumor could improve on it. Around the desk, the others described the incident in the language of people who had each seen a different part of the same street.\n\nThe sergeant wanted to close the road until the report was complete. The officer asked whether closing it would make the report more accurate. Nobody answered immediately. A restriction could be justified by uncertainty and could also ensure that uncertainty lasted until the next shift found another reason to retain it.\n\nOn the edge of the desk lay the clinic authorization. It had begun as an exception. The officer had since discovered that exceptions generated more correspondence than ordinary rules because somebody had to keep choosing to honor them. The administrator's latest note contained no appeal to compassion. It gave the time of the next receiving movement and asked which instructions the checkpoint should expect.\n\nThe officer telephoned the medical post. The injured soldier was awake and complaining about the food. He asked whether his unit had been told. The officer said it had, although technically he was still doing so.\n\nWhen he hung up, the sergeant was waiting beside the district map. Beyond the window, the evening patrol was forming in the yard. The same street would receive them. The people living on it would have to discover whether the previous day's permission still meant anything.\n\nThe correspondence had been returned under the written search limit. A soldier asked whether the exception would apply to the next patrol as well. The officer said it would and watched him put the instruction back into the book. Enforcing a boundary had required another conversation with his own men. For once, the civilian would not have to carry that conversation home."
 ac_camp.11.desc.v1:0 "The patrol returned with one fewer man than it had taken out. The missing soldier was at a medical post, and the officer wrote that down before any rumor could improve on it. Around the desk, the others described the incident in the language of people who had each seen a different part of the same street.\n\nThe sergeant wanted to close the road until the report was complete. The officer asked whether closing it would make the report more accurate. Nobody answered immediately. A restriction could be justified by uncertainty and could also ensure that uncertainty lasted until the next shift found another reason to retain it.\n\nOn the edge of the desk lay the clinic authorization. It had begun as an exception. The officer had since discovered that exceptions generated more correspondence than ordinary rules because somebody had to keep choosing to honor them. The administrator's latest note contained no appeal to compassion. It gave the time of the next receiving movement and asked which instructions the checkpoint should expect.\n\nThe officer telephoned the medical post. The injured soldier was awake and complaining about the food. He asked whether his unit had been told. The officer said it had, although technically he was still doing so.\n\nWhen he hung up, the sergeant was waiting beside the district map. Beyond the window, the evening patrol was forming in the yard. The same street would receive them. The people living on it would have to discover whether the previous day's permission still meant anything.\n\nThe retained correspondence lay in a separate bag. The examination office had acknowledged receipt without giving a return date. The officer could account for the papers more precisely than for the people waiting on their contents. He added the bag's reference to the patrol return and asked for the examination to be completed, knowing how little that request promised."
