 YUK_snc_readiness_truth_renew_requirements_tt:0 "This national review was interrupted before completion. Its protocol is complete, no replacement request is open, and ten political power plus two institutional-capacity points are available."
 YUK_snc_ports_orders_civil_spirit:0 "Civil port receiving window"
 YUK_snc_ports_orders_civil_spirit_desc:0 "Give civil receiving work a dependable port window and require protected services to name the requests they will postpone around it. This improves maintenance continuity while placing a readiness burden on the schedule. The receiving officer must explain the limit before another urgent order assumes the window has quietly become available. A civil priority is not a claim that security work is unnecessary. It is a way to retain ordinary transport and repair responsibilities when those responsibilities have repeatedly been described as flexible by offices that did not have to receive the delayed work themselves."
 YUK_snc_ports_orders_civil_spirit_settled:0 "Civil port receiving window: Standing Review"
 YUK_snc_ports_orders_civil_spirit_settled_desc:0 "The standing procedure names an actual recipient for an amended order. Retain and improve the selected civil or protected policy through its completed review, without removing the accepted cost. Domestic port and maintenance work remains useful when cooperation abroad fails, a partner becomes ineligible, or a wider conflict makes the hoped-for arrangement impossible. The office can still identify its current responsibilities and answer for the order it changed. The final return leaves the delayed request attached, so a successor will inherit both the useful schedule and the person who still has a reason to question it."
 YUK_snc_ports_orders_protected_spirit:0 "Protected naval support window"
 YUK_snc_ports_orders_protected_spirit_desc:0 "Protect a bounded naval-support window with the technical staff and receiving authority needed to use it. The policy improves the dependability of existing support while retaining the civilian capacity cost it imposes. An officer who wants to amend the order must identify the claimant displaced, rather than send the receiving office a new note saying that coordination has already occurred. The account makes no promise about an individual vessel's availability. It describes a national support responsibility that can be sustained and reviewed even when an overseas arrangement has been refused or interrupted."
 YUK_snc_ports_orders_protected_spirit_settled:0 "Protected naval support window: Standing Review"
 YUK_snc_ports_orders_protected_spirit_settled_desc:0 "The standing procedure names an actual recipient for an amended order. Retain and improve the selected civil or protected policy through its completed review, without removing the accepted cost. Domestic port and maintenance work remains useful when cooperation abroad fails, a partner becomes ineligible, or a wider conflict makes the hoped-for arrangement impossible. The office can still identify its current responsibilities and answer for the order it changed. The final return leaves the delayed request attached, so a successor will inherit both the useful schedule and the person who still has a reason to question it."
 YUK_snc_ports_orders_public_return_spirit:0 "Open receiving record"
 YUK_snc_ports_orders_public_return_spirit_desc:0 "The civil representative wants the changed timetable and the receiving explanation left in an open account. It will take political work to defend a priority to people who can identify their own delayed request in the record. Accept that burden in exchange for a schedule whose limits can be challenged before a claimant acts on the wrong assumption. Publication does not reveal protected technical procedures or promise an overseas agreement. It establishes who can answer when two approved orders arrive for one window, and prevents successful completion from quietly removing the losing claimant from the national story."
 YUK_snc_ports_orders_staff_return_spirit:0 "Protected professional return"
 YUK_snc_ports_orders_staff_return_spirit_desc:0 "Keep a signed professional timetable with both orders and the instruction that changed their receiving sequence. The protected route supports dependable staff work while preserving its civilian opportunity cost. It must retain the explanation given to the delayed claimant, including when that explanation was late or inadequate. A useful professional account should help the next officer recognize a collision before it reaches the port. It should not become a shorter version of events in which everybody appears to have agreed merely because the service that received its window completed the work it was finally allowed to perform."
 YUK_snc_ports_orders_brief:0 "Two Orders for One Window"
 YUK_snc_ports_orders_brief_desc:0 "The port receiving office has two approved orders for the same maintenance window. One concerns a civilian delivery; the other concerns protected naval support. Both arrived with a note describing the request as already coordinated. Begin from the existing maritime-support settlement and ask who can resolve the collision without hiding the losing claimant. The review concerns receiving work that can be performed under the present national allocation. It does not require a foreign port, an available overseas partner or a particular ship to remain in service for the office to explain which responsibility it is prepared to sustain."
