l_english:
 ac_camp_eru:0 "Erusea — campaign operations"
 ac_camp_eru_desc:0 "Commit resources to preparation, conduct operations, and read the delivered scenes. Historical dates open opportunities; results depend on present conditions. All alternate routes and dialogue are authored gameplay."
 ERU_camp_0_register:0 "Occupation authority"
 ERU_camp_0_register_desc:0 "Occupation authority. Open the campaign lane and its preparation record.\n\nThe officer who signs an occupation order will rarely see the kitchen in which it is read. On his map the district has a boundary and a reporting time. In the kitchen it has a mother who must cross that boundary, an injured neighbor, and a shopkeeper deciding whether tomorrow's bread is worth another argument at the checkpoint. Civil guarantees require the command to discipline its own men. Military discretion is easier to issue and harder to recall. Either decision leaves a record that survives the campaign. The preparation branch authorizes specific work; it cannot conjure the cooperation that the garrison has spent months consuming."
