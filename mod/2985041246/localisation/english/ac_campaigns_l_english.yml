 ac_camp.6.t:0 "The aircraft already promised"
 ac_camp.6.desc:0 "The liaison found the controller eating from a tin balanced on the corner of his desk. The food had gone cold before he opened it. On the wall, the serviceability board had acquired a second column headed Possible, which made the first column look less discouraging until one read what was in it.\n\nThe request was modest on paper. A receiving contact needed confirmation that the medical movement had not been folded into an offensive tasking. Someone also wanted a report on the road beyond the district. Neither request involved a strike, but both involved attention that had already been assigned elsewhere.\n\n\"You want an aircraft?\"\n\n\"I want a reliable answer.\"\n\nThe controller looked at the board. Those were often the same thing, and the difference was becoming a luxury. An additional reconnaissance commitment could help establish what was happening around the route. It would also expose the contact to the suspicion that the convoy was serving a military purpose. Keeping the arrangements separate offered less information and a clearer obligation.\n\nHe put down the tin and drew a line through one penciled suggestion. There was no shortage of ideas that used an aircraft which had not yet been repaired. What remained were choices between people who had already been told that their work mattered.\n\nThe liaison waited while he wrote the reply. It would travel back through several hands. By the time it reached the clinic, a short sentence about the limits of allied assistance would have become the only part of this argument anybody there could use."
 ac_camp.6.a:0 "Send a precise statement of the limits."
 ac_camp.6.b:0 "Reserve additional observation."
 ac_camp.6.z:0 "Close this old message."
