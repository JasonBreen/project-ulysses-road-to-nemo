name: Land systems source contracts

on:
  push:
  pull_request:

jobs:
  conventional-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible artwork dependency
        run: python -m pip install Pillow==11.3.0
      - name: Reject dirty or changing source evidence inputs
        run: python -B tools/Test-SourceSnapshot.py
      - name: Check dated land routes, actual fiscal owner and original presentation
        run: python -B tools/land_program/test_land.py
      - name: Check research font ownership and unchanged inherited controls
        run: python -B tools/research_fonts/test_fonts.py
      - name: Check reproducible research font role and rectangle evidence
        run: python -B tools/research_fonts/measure.py --check
      - name: Check effective captured land capability contract
        run: python -B tools/land_program/audit.py --check
      - name: Check composed economy generation and equipment observations
        run: |
          python -B tools/economy_v2/build.py --check
          python -B tools/Test-ForceUpkeep.py
