 ### FOCUSES ###
 UST_start: "With Freedom In Our Hearts"
 UST_start_desc: "The nation of Ustio has been under the control and occupation of Belka for over a century. However, in 1988 the Belkan Federal Law Review finally allowed our nation to be free again. With this in mind, the coming year is full of hope for us as we re-assert ourselves."
 UST_tyran_industry: "Expand Tyrann Industry "
 UST_tyran_industry_desc: "Tyrann, one of our easternmost cities, has lots of flat, undeveloped land ripe for industrialization. To help kickstart our economy, it would be wise to invest into more factories and infrastructure in the area."
 UST_connect_miedzyrzecz: "Connect Solis Ortus"
 UST_connect_miedzyrzecz_desc: "Solis Ortus, a somewhat isolated town on our southern border, is a important location in the Tyrann Mountains. Improving transportation to and from the town will help us in connecting our nation as a whole."
 UST_pay_for_museum: "Finance The Museum"
 UST_pay_for_museum_desc: "Under Belkan rule, we were forbidden and restricted from many of our traditions, as well as major parts of Ustian history were censored. To ensure our history is not forgotten, we will construct a large and impressive museum as a tribute to the enduring history and spirit of Ustio."
 UST_upgrade_schooling_system: "Upgrade Schooling System"
 UST_upgrade_schooling_system_desc: "Our school system is still heavily built on Belkan curriculum and education policies. Distancing ourselves from this will ensure the next generation will not be taught Belkan lies."
 UST_ratio_military_bases: "Eastern Military Bases"
 UST_ratio_military_bases_desc: "Belka has established a number of forts and defenses on our eastern border. While now defunct, rebuilding and retrofitting these will be far less expensive than attempting to build entirely new ones."
 UST_anti_partisant_training: "Anti-Partisan Training"
 UST_anti_partisant_training_desc: "Our eastern territories are primarily Ratian by culture, and as a result many partisans are rebelling against our government and causing attacks in the region. Until a more permanent solution can be achieved, we must work to stop the spread of violence."
 
 UST_deal: "Deal With Ratio"
 UST_deal_desc: "The lands of Tyrann and Boikos do not belong to us. Their rightful owner, Ratio, had them stolen away by Belka some time ago. However, the Ratians have proven themselves a trustworthy people and friendly to us, and it would be both and wrong and futile to lay claim to their lands. They have offered to purchase their lands from us for a number of wonderful benefits, and we happily accept."
 UST_no_step_on_our_land: "Not A Single Step On Our Land"
 UST_no_step_on_our_land_desc: "The Ratians believe they deserve some sort of right to our lands, now that the Belkans have withdrawn from them. Ustian blood was spilled for this soil, and it is us who have fought to preserve and develop it. We will prove to the Ratians that these lands are Ustian, and will always be."
 
 UST_promised_payment: "Promised Payments"
 UST_promised_payment_desc: "As a show of good faith, the Ratian government has paid us a generous sum of money in exchange for the territories sold to them. This, combined with lowered expenses from less territory, will help us greatly in developing our core land for the next year."
 UST_resetle_the_people: "Resettle The People"
 UST_resetle_the_people_desc: "A clause of the agreement with Ratio is that any Ustian citizens from the lands sold to Ratio who wish to remain in Ustio will be freely allowed to re-immigrate into our nation, with Ratio paying for most of the expenses. As the people begin to trickle in, we will do our part in resettling them quickly and efficiently back into our country."
 UST_move_part_of_industry: "Move The Industry"
 UST_move_part_of_industry_desc: "Factories, businesses, and other improvements build by Ustio have been allowed to move back into our country after Ratio purchased the land they existed on, as a clause of the agreement between us. They have all packed their things and prepared for the move, and now it is our turn to make sure they are resettled easily and can reopen as soon as possible."
 UST_mid_1992: "1992 Elections"
 UST_mid_1992_desc: "With the domestic issues at hand mostly resolved, the people's minds have turned to the upcoming election between the incumbent Grzegorz Naruszewicz and his main opposition, Kuba Morkawiecki. Currently, Naruszewicz has a large lead, but in the time between now and the election, anything could change that."
 
 UST_grzegorz_wins: "Naruszewicz Victory"
 UST_grzegorz_wins_desc: "Grzegorz Naruszewicz, the "Father of Ustio," has secured another term for his government, proving extremely popular to the nation for his unwavering commitment to the nation's future. Though he is wishing to retire, he is committed to ensuring Ustio is strong and ready to face the future before he does so."
 UST_father_continues_his_rule: "Father Continues His Rule"
 UST_father_continues_his_rule_desc: "The first leader of our nation, and a strong supporter of our independence before that, Naruszewicz is a figure respected by many, even some of his opponents. The victory of another term for him has been celebrated greatly throughout our country, and the people are more ready than ever to work alongside him for the nation's future."
 UST_another_term_await: "Another Term's Plans"
 UST_another_term_await_desc: "Naruszewicz is preparing a speech to the nation after his election victory, to address his ideas for the incoming term and plans for allowing Ustio to look intoi the future with bright hope. The nation is still young and faces many hurdless ahead but with Naruszewicz at the head we have nothing to fear."
 UST_loyalty_of_the_army: "Loyalty Of The Army"
 UST_loyalty_of_the_army_desc: "Franek Dolas, head of the Ustian army is an old friend of Naruszewicz and holds unending respect for him. A huge part of the army also has unwavering support for the President. This gives him almost total control over the Armed Forces allowing him to not only shape them into the form he desires but also as a good propaganda tool to rise national support for Ustio's militia."
 UST_allies_in_the_church: "Allies In The Church"
 UST_allies_in_the_church_desc: "Ustio has always been quite a religious nation, which for years was not only a unifying force during the Belkan occupation, but also as a tool of national propaganda. Naruszewicz has huge support among clergy who will gladly support him and preach of his good name, only increasing his almost total national support."
 UST_continue_school_reform: "Continue School Reform"
 UST_continue_school_reform_desc: "To rekindle our national spirit, President Naruszewicz has created a new mandatory Ustian Culture class for primary schools, teaching students national traditions, religious practices, and an expanded history, ensuring the next generation of Ustians continue their dedication to the nation."
 UST_centralise_power: "Centralise Power"
 UST_centralise_power_desc: "President Naruszewicz's popularity has nearly reached unanimous levels. Seeing the opportunity to make even more changes to stablize Ustio for the future, he has proposed a new act allowing him to bypass certain levels of government to enact more changes. While some are calling this a tyrannical power grab, the President's high approval makes many support this."
 UST_friends_in_osea: "Friends In Osea"
 UST_friends_in_osea_desc: "Osea has long supported Ustian resistance movements with equipment and funding prior to our independence, in addition to hosting and protecting many Ustian exiles from Belka. President Naruszewicz has reached out to Osea again to reaffirm their comittment to us, even in our now achieved independence."
 UST_nationalize_post_belkan_land: "Nationalize Post Belkan Property"
 UST_nationalize_post_belkan_land_desc: "Many old Belkan government owned factories and businesses still linger in Ustio, now having been abandoned. Rather than let these go to waste, we will nationalize and repurpose these for our own benefit."
 UST_1: "Osean Army Instructors"
 UST_1_desc: "Osea is a rather rich country, and is able to spend large amounts of money on their military. Having Osean army instructors sent over to help train our army will get them in better shape, and allow us to coordinate better with Osea in the event of Belkan attack."
 UST_I_AM_SEXO: "The Repopulation Act"
 UST_I_AM_SEXO_desc: "Throughout occupation, Belka attempted to "Belkanize" our nation through displacing people and migrating Belkans into our nation. This has caused the Ustian population to decline in favor of Belkans. We will expand support networks and funding to Ustian families and couples and encourage them to have more children."
 
 UST_kuba_wins: "Morkawiecki Victory"
 UST_kuba_wins_desc: "In a suprising twist, Kuba Morkawiecki, a prominent businessman from Directus, was able to sway enough people to his cause and secure majority in the presidential elections. With this upset, times of change will surely come to Ustio."
 UST_new_man_at_the_top: "New Man At The Top"
 UST_new_man_at_the_top_desc: "For quite a while, the people and government have believed Naruszewicz to be the only man capable of leading Ustio. Many of his friends and allies are still in government, and we will need to either bring them around or sweep them away for our planned changes."
 UST_liberal_shock: "Liberal Shock"
 UST_liberal_shock_desc: "Kuba Morkawiecki is a huge supporter of liberal policies and an overall free-market ideology of little intervention in the economy from the government. He has already started pushing acts and new laws through the government with the goal of widespread reforms to create a completely new Ustio. A new nation is his eyes should be free, self governing and self-determining."
 UST_seperate_everything: "Seperate Everything"
 UST_seperate_everything_desc: "Central government should not force itself on local administration. The government's job is to be a nation outside when the people form the nation inside. It is the people themselves who know best how to grow and expand their local surroundings. In the spirit of that idea, President Morkawiecki has decided to push a number of reforms to give local administrations more power and freedom of choice."
 UST_decentralize_army: "Decentralize Army"
 UST_decentralize_army_desc: "To this day Ustian Army has been a very highly centralized and stiff organization, with both Dolas and Naruszewicz having almost total control over its actions. With new reforms the President will lose most of the central control over it and we will instead promote independant actions from local officers. This way we will make our forces act, plan and react more quickly."
 UST_directus_university: "Directus University"
 UST_directus_university_desc: "A university is where people learn, expand their horizons, and develop their identity. Because of this importance, universities will be heavily deregulated, allowing for any idea to be tested and tried against others. This mixing of ideas will allow future generations of Ustian citizens to lead this nation into a bright future with their experience and dreams."
 UST_free_rule: "Free Rule"
 UST_free_rule_desc: "To make certain things illegal does not stop these things from happening, rather it merely maks normal people into criminals. We will limit the government's control on the personal freedom of individuals with new privacy and protection laws, which will make them free to be their true selves."
 UST_open_to_anyone: "Open To Anyone"
 UST_open_to_anyone_desc: "There is no reason why we should keep all of our nation's benefits to ourselves. Ustio will be a shining beacon of freedom for all in the world to see and visit, and if they so wish, they may join with us, further increasing our prosperity."
 UST_privatize_post_belkan_land: "Privatize Post Belkan Property"
 UST_privatize_post_belkan_land_desc: "Many of the former Belkan installations are still of good quality to be used. In the spirit of the free market, these shall be refurbished and resold to the highest bidder, a symbolic image of how liberty will always overcome authority."
 UST_sorton_act: "Sorton Act"
 UST_sorton_act_desc: ""A well regulated Militia, being necessary to the security of a free Ustio, and the right of the people to keep and bear Arms, shall not be infringed." - Text of Sorton Act, The 11th Amendment of the Republic of Ustio Constitution"
 UST_2: "Laissez-Faire"
 UST_2_desc: "A free economy is a happy and growing economy. Factory owners, small businessmen, and investors should be allowed to do as they see fit - to expand, to grow. The hand of the free market will guide us to prosperity. Transactions between private groups of people will be free from any form of economic interventionism by the law itself."
 
 UST_two_year_plan: "Two Year Plan"
 UST_two_year_plan_desc: "Due to occupation and negligence from Belkan central authorities, our economy, and especially the heavy industry sector was never fully developed in our territory. After independence, we have been mostly forced to survive on long-term loans and the industry we inherited on Ratrio's land. But now we finally were able to secure the economic basis to lift ourselves up and expand to a proper modern nation."
 UST_expand_mines: "Expand National Mines"
 UST_expand_mines_desc: "Usto lays on huge, still not fully surveyed, veins of underground minerals and resources. Excavation and export of those natural goods should be the main pushing forces to fund our expanding economy, and will give us the necessary basics to later process those goods ourselves."
 UST_expand_west_ustio: "Western Ustian Investments"
 UST_expand_west_ustio_desc: "With the recent acquisition of our old western lands from Belka, we have received another huge economic zone which we can expand. With negligence in the past, even this land requires investments, mainly in the infrastructure and railway departments. Thankfully, those projects are cheap enough to finish and will surely raise traffic and goods transportation inside our nation."
 UST_fruit_of_earth: "Fruits Of The Earth"
 UST_fruit_of_earth_desc: "A recent survey has found a previously undiscovered a vein of metals in the southern Tyrann Mountains. This revelation was immediately followed by plans of constructing new mines to start profiting from the finding as soon as possible. Our calculations are already showing that this investment will pay itself back in less than a year with the level of mining exports our nation is having right now."
 UST_to_modernise_fully: "To Modernise Fully"
 UST_to_modernise_fully_desc: "A huge portion of our factories still operate on outdated machinery and equipment. Sometimes assembly lines are forced to use 10 year old tools or send people to work in improper safety equipment. It has been decided that the government will launch huge a founding project in which we will try to acquire necessary equipment and donate them to key industrial facilities around the nation."
 UST_money_for_military_complex: "Money For The Military Complex"
 UST_money_for_military_complex_desc: "Our arms industry and the army itself still lag behind due to a lack of funding since our independence. With our economy partially modernized, it has been decided that our budget must raise spending for those two branches of our nation so we will never fall to enemy invasion again."
 UST_no_more_lagging_behind: "No More Lagging Behind"
 UST_no_more_lagging_behind_desc: "With our economy humming and our factories brought on par with the rest of the world, we can now start taking notes and learning from others to keep our factories updated and relevant in the modern world. Ustio is no longer yesterday's backwater, she will be the superpower of tomorrow."
 
 UST_establish_central_bank: "Establish Central Bank"
 UST_establish_central_bank_desc: "Rather than rely on Osean or Belkan notes for our currency, our desposits of precious minerals allow us to create our own mint, making our economy far less reliant on our neighbors and allowing us to serve our own people easier."
 UST_national_labor_board: "National Labor Board"
 UST_national_labor_board_desc: "Workers and farmers are critical pillars of society, and if they choose so, our nation can crumble in weeks. Ensuring that the blue collar workers of Ustio will have a lifeline to the government will decrease disconnect, and allow us to assist them greater than before."
 UST_valais_industry: "Valais Industry Intervention"
 UST_valais_industry_desc: "Valais is a rather underpopulated region, however it's strategic importance as a heavily defendable area makes it vital in the event of an attack. Building some industry here, while difficult to maintain and staff, will increase the value and reduce the maintenance of our base there, and will also allow us to dig in further in the event of the loss of our main territory."
 UST_social_country: "Social Country"
 UST_social_country_desc: "Let it be known throughout the world that Ustio does not leave it's people behind. Increasing social support for the impoverished, the disabled, the elderly, and all who struggle in life will show that we are a nation who cares about all its people, not just the ones who work or fight."
 UST_deregulate_banking_sector: "Deregulate Banking Sector"
 UST_deregulate_banking_sector_desc: "Ustio has not had it's own currency in a very long time, but why should it? We are in a unique position as one of the few nations who accepts both Osean and Belkan currency. Expanding our accepted currencies to as many as we can find will turn Ustio into an exchange hub, and we will be a critical lifeline in the international trade."
 UST_outlaw_trade_unions: "Outlaw Trade Unions"
 UST_outlaw_trade_unions_desc: "Trade unions are comprised of people who act like they know more than they do, and are always a thorn in the side of economic prosperity. Outlawing these will allow businesses to have more control over their expenses, and will empower workers to be particular about their job choices rather than bending laws to their advantage."
 UST_hand_of_free_market: "Hand Of The Free Market"
 UST_hand_of_free_market_desc: "Economics has shown it can regulate itself, and the government's meddling only sabatoges it. Going hands-off on banks, businesses, accounting firms, and trade businesses will help them flourish, enriching the people and the land."
 UST_privatize_healthcare: "Privatize Healthcare"
 UST_privatize_healthcare_desc: "It is the right of a business to decide how much their services are, and it would be wrong for the government to enforce a standard on them. Privatizing healthcare will diversify it, and individual citizens will be able to purchase plans at costs according to their needs, rather than forcing a one-size-fits-all scenario."
 
 UST_they_are_coming: "They Are Coming"
 UST_they_are_coming_desc: "While never outright renouncing their claims on our land, Belka has just proclaimed a renewed claim, declaring that the 1988 Federal Law Review and our state are illegitimate. This is, in all but name, a declaration of war against us, and we must surmount a defence as soon as possible."
 UST_get_people_ready: "Get People Ready"
 UST_get_people_ready_desc: "We do not have nearly the physical strength of Belka, and desperately need more troops if we are even to mount any defence. Sweeping conscription and resistance arming will be done to prepare our people as much as can be done."
 UST_make_shift_bunkers: "Makeshift Defense Line"
 UST_make_shift_bunkers_desc: "Our nation is small, and every bit of land lost will damage our ability to continue fighting greatly. The best location to stop the Belkan armies is on our mountainous western border. However, we do not have the time to set up full defences, so we will scramble as much as possible to get even the most basic defences up in preparation for Belka."
 UST_convert_production: "Convert Factories"
 UST_convert_production_desc: "Civilian factories are critical to economic growth, but that is the least of our concerns right now. Converting civilian factories and production to military will assist in the short build-up time we have left."
 UST_import_MANPATS: "Import MANPATS"
 UST_import_MANPATS_desc: "Belka posesses a large amount of armored vehicles, which we do not have to counter them. Importing infantry anti-tank weapons from Osea is the only option we have at countering their armor."
 UST_ask_ratio_for_help: "Ask Ratio For Help"
 UST_ask_ratio_for_help_desc: "In return for Tyrann Valley and Boikos, Ratio offered us a pledge of support in case we need it. While this was mostly just a kind gesture, it appears we may need it after all. Ratio is unlikely to join in a war with us, but they are nowhere near friendly with Belka, and would likely be more than willing to send us supplies and volunteers to help us defend."
 
 UST_rush_the_trenches: "Rush The Trenches"
 UST_rush_the_trenches_desc: "To hold a much bigger and heavily equipped Ratian Army we will be required to expand the line of trenches and defences on our border to not get rolled by their armored divisions. This should buy us enough time to localize and target their main attack axis and hold their entire advance. However, this project will cost us, and we must take some loans to pay for it."
 UST_the_speach: "Presidential Speech"
 UST_the_speach_desc: "President Naruszewicz has decided to personally address the entire nation in official and public appearances on TV and radio. Our nation is going down a dark path and our "Father" has decided to take the center stage in the incoming conflict to rally people to the cause and boost national morale."
 UST_to_arm_the_man: "To Arm The Men"
 UST_to_arm_the_man_desc: "Our Army is in no way armed and ready to face the enemy in the upcoming conflict. In desperation, we have launched a project to buy and acquire any weaponry we could lay our hands on. It will hit us in the pocket but without them, we will have no chance to hold Ratio's advance."
 UST_last_second_mobilization: "Last Moment Mobilization"
 UST_last_second_mobilization_desc: "To hold the enemy we need soldiers. The government has decided to push, in a record time of one day, a Mobilization Act which will attempt to double the size and reinforce our army with fresh recruits. Thankfully, support for the war is high enough that our citizens are ready and willing to die in defense of our borders."
 UST_supress_partisants: "Supress Partisans"
 UST_supress_partisants_desc: "We are still struggling with some partisan resistance on our territory and with upcoming conflicts. We cannot allow ourselves to be weakened by their actions, especially if they strike in coordination with Ratio's army. Due to this, we will enforce total martial law in our eastern provinces. Any suspicious actions or resistance during military checkups will be answered with force - no exceptions."
 UST_external_arms_market: "External Arms Production"
 UST_external_arms_market_desc: "We have been able to find a few willing nations that will, for a heavy sum of money, divert some of their production facilities for us to borrow. This way we will secure additional arms before and during the war, while at the same time, those factories and assembly lines will be outside of any strike range of Ratio's forces during the conflict itself."
 UST_band_of_brothers: "Band Of Brothers"
 UST_band_of_brothers_desc: "We are facing a huge influx of volunteers to the army from people who were not called to arms in general mobilisation. We never planned for such an influx of men so we have drafted a new plan to gather all those volunteers and form a new division with special honours called the "Band of Brothers". They will be rushed through special harsher training to bring them to levels of our main fighting force."
 UST_strike_first: "§RStrike First§!"
 UST_strike_first_desc: "Negotiations are still underway but they would never lead to any peaceful conclusion and Ratio's invasion is more than guaranteed. However, some of the more radical politicians and part of the armed forces proposed something that can be considered madness - a preemptive strike on the enemy. It's risky and if put into motion will paint us as an aggressor, but if successful we will win everything."
 
 UST_we_won: "We Won"
 UST_we_won_desc: "Our gambit has paid off, and Ratio has been chased from our soil. At the cost of many of our people, and our international reputation, Ustio has remained whole. However, after these actions, the only way left to go is further down. This will not be the last battle."
 UST_we_lost: "We Lay Defeated"
 UST_we_lost_desc: "Our attacks have failed, and the small army we mustered has been broken by the enemy. While we may go dark, history has proven to us that still, even in the darkest of nights, Ustio cannot and will never die."
 UST_wave_of_nationalism: "Wave Of Nationalism"
 UST_wave_of_nationalism_desc: "Despite the shift in policy, we still faced moderate opposition to our aggressive action. However, now seeing the results of the attack, criticism has dwindled away and a wave of nationalism has swept over our nation for our success, with many calling for more militarization."
 UST_spoils_of_war: "Spoils Of War"
 UST_spoils_of_war_desc: "Part of the peace agreement with Ratio was a huge sum of money as war reparations. Due to a lack of such funds on hand, it has been decided that the transfer would instead be conducted in the form of industrial material. This will greatly benefit us due to the ability to immediately profit from our won spoils and help put our economy back into working condition."
 UST_ustian_stubbornness: "Ustian Stubbornness"
 UST_ustian_stubbornness_desc: "We once again showed that the Ustian people will never surrender to any aggression or oppression. Like we resisted the Belkans after taking our land, now we resisted the Ratians trying to take from us what we rightfully conquered. We will never again let our territory be taken from us. From now on we will fight with even higher spirit and determination."
 UST_new_political_coalition: "New Rule To Lead The Nation"
 UST_new_political_coalition_desc: "Falangs, made out of nationalists and militarists, were always a minor party in our nation. But after Ratio's trespassing they were the ones who's actions allowed us to not only withstand but also conquer that storm. There is no denying that their actions demand acknowledgement, so it has been decided that the FEJ should join them in a new coalition and unite both parties into one political body."
 UST_army_as_part_of_state: "The Army Is A Part Of The State"
 UST_army_as_part_of_state_desc: "Rather than a simple tool or weapon wielded by the state, the state and the army should be intertwined into one, promoting militarism and ensuring the military stays among our top priorities."
 UST_ustian_youth: "Ustian Youth"
 UST_ustian_youth_desc: "Some of the most critical years of a person's life are when they are young. Opening up new programs to involve youth in the state will strengthen the next generation's loyalty to Ustio and help them develop vital skills to benefitting our nation at a young age."
 UST_mandatory_military_training: "Mandatory Military Training"
 UST_mandatory_military_training_desc: "Given our reputation, there will likely come a day when we will come under attack again by one or more of our neighbors. To prepare for this possibility, we will require all adults in our nation to at least be trained in military operations, to ensure that even if our frontline divisions will fall, the people will carry on their fight."
 UST_forced_nationalisation: "Forced Nationalisation"
 UST_forced_nationalisation_desc: "The Belkans set an example through their attempted Belkanization programs of Ustio, which saw some success. We will use what they did right and learn from what they did wrong to strengthen our grip on the former Ratian territories."
 UST_expel_the_ratio_people: "Expel The Ratian People"
 UST_expel_the_ratio_people_desc: "Despite our efforts, many Ratians are refusing assimilation and their terror groups are becoming emboldened by the day as more defect to them. To restore order, we must deport all known Ratian nationals out of Ustio and either force them to move inland, or be sent over the border into Ratio."
 UST_focus_on_the_west: "Focus On The West"
 UST_focus_on_the_west_desc: "Our former overlord, Belka, has recently begun to resurge in power and very clearly is not looking to continue the 1988 Federal Law Review agreement. War is inevitable, and we must be well prepared for it. We will begin focusing our defense efforts on the western border and developing counters for Belkan tactics."
 UST_west_wall: "West Wall"
 UST_west_wall_desc: "Our border with Belka is very mountainous, and this provides a critical tactical advantage in the event of an invasion. Adding further fortifications on the border with Belka will allow our troops to dig in further and prevent Belkan progress."
 UST_expand_back_yard: "Expand Our Backyard"
 UST_expand_back_yard_desc: "Should our frontline fall, it is imperative that we do not let Belka's invasion snowball and overwhelm us. Creating further fortifications and localized defences will allow us to fall back without disorganizing, continuing to inflict maximum casualties on the Belkans."
 UST_critical_plan_tyrann: "The Tyrann Plan"
 UST_critical_plan_tyrann_desc: "As the enemy's armies encroach upon your homeland, traditional methods of defense may prove insufficient. Now, more than ever, it's imperative to safeguard our industrial base from falling into enemy hands. The "Tyrann Plan" was prepared to relocate our industry from the west to the east, away from the front, to newly established industrial hubs, ensuring continuity of production."
 UST_ensure_the_power_of_constitution: "Ensure The Power Of The Constitution"
 UST_ensure_the_power_of_constitution_desc: "Many in Ustio who only recently supported our war efforts, or still have not yet been won over, are highly concerned about the new developments being abuses of power and that the Falangs will turn Ustio into a totalitarian state. To fight this stigma, we will reaffirm our comittment to the Ustian Constitution, ensuring that no single man can rule Ustio with an iron fist."
 UST_subsidize_the_economy: "Subsidize The Economy"
 UST_subsidize_the_economy_desc: "We cannot allow the economy to freely float around without control to stabilize it. We will take countrol of several critical points in the economic flow, ensuring we have control over how much can flow and increasing it if need be."
 UST_grand_dev_plan: "Grand Development Plan"
 UST_grand_dev_plan_desc: "Ustio was neglected heavily as a Belkan subject, and as such there is plenty of usable land for those willing to develop it. We will begin running a large-scale survey operation of our land and finding the best places to open up further development opportunities."
 UST_to_pay_back_the_loan: "Pay Back The Loans"
 UST_to_pay_back_the_loan_desc: "We have acquired quite a hefty debt from our actions before and during the war with Ratio. Now that we have momentary peace, we must work to pay these back as soon as possible so that we can stand on our own feet again."
 UST_boikos_steel_meal: "Boikos Steel Mill"
 UST_boikos_steel_meal_desc: "Boikos, some of our land defended from Ratio, rivals Directus in the amount of subterranian iron, and the land is far more flat than Directus. These in combination would make a large steel production plant a very worthwhile investment, as the close proximity to minable iron, as well as the flat lands reducing building cost would make it extremely efficient."
 UST_solis_ortus_economic_zone: "Solis Ortus Economic Zone"
 UST_solis_ortus_economic_zone_desc: "Solis Ortus, a small town nestled in the resource rich Tyrann Mountains, is one of the last bastions of civilization that far in the mountain range. With some rezoning, we will make it a core mining and excavation city, rather than it being tagged on with Directus. From here, Solis Ortus will have most goods from the east and through mining operations routed through it, and from there to Directus."
 UST_tyran_mines: "Tyrann Mines"
 UST_tyran_mines_desc: "The Tyrann Mountains are by far our most resource rich area in our nation, and are the key ingredient to our high export of minerals and materials. Extra money will be put into expanding excavation sites to dig up and uncover even more ore, as this will in turn enrich our budget further."
 UST_well_oiled_machine: "Well Oiled Machine"
 UST_well_oiled_machine_desc: "With our industry expanded and growing, our economy is steadily returning to normalcy, all under our watchful eye. With the economy stabilized, we can turn our attention to other, more pressing matters while the industry runs itself."
 UST_fix_recruitment_crisis: "Fix Recruitment Crisis"
 UST_fix_recruitment_crisis_desc: "A stable economy guaranteed and plenty of trained, loyal citizens throughout our nation will allow us to up the benefits of military service, allowing us to bolster our ranks further, ensuring we have plenty of troops ready to man the lines in the event of an invasion."
 UST_social_work_help: "Social Work Help System"
 UST_social_work_help_desc: "Our recent choices have prioritized the working and able-bodied people of Ustio, however the elderly, disabled, and families have been pushed to the wayside because of this. Opening federal social programs to assist these people will overall increase our reputation among the people, but will allow these people to also serve our nation in some capacity, where otherwise they would not be able to."
 UST_national_uni: "Ustian National University"
 UST_national_uni_desc: "To further promote education in our nation, the construction of an Ustian National University as the pinnacle of Ustian education and ensuring we have direct control over it will improve the quality of our high-profile jobs over time. We will also ensure that this university teaches Ustian values, unlike a corrupt foreign university. Ustians will use the teachings here for Ustio, not some other nation."
 UST_some_leap_forward: "Technological Leap Forward"
 UST_some_leap_forward_desc: "The funding and staffing of the Ustian National University combined with our additional income from economic developments have allowed our citizens to afford higher schooling in greater quantites, and we are seeing a rise in students pursuing careers in science, strengthening our research base for the future."

