name: Static validation

on:
  push:
  pull_request:

jobs:
  map-validation:
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up offline contract test runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install artwork validation dependency
        run: python -m pip install Pillow==11.3.0 numpy==2.2.6
      - name: Check world registry, partner starts and Erusean foundation
        run: python -B tools/world_foundation/test_foundation.py
      - name: Check additive active-world starts and sustainment contracts
        run: python -B tools/world_starts/test_world_starts.py
      - name: Check actual selected personnel and explicit inherited liabilities
        run: python -B tools/world_starts/personnel.py --check
      - name: Check inherited-force logistics and exact integrated owner receipts
        run: python -B tools/world_starts/test_legacy_logistics.py --require-integrated-owner
      - name: Check legacy force projections and generated source consistency
        run: python -B tools/world_legacy/test_legacy.py
      - name: Check all 61 active physical owners and selected starting branches
        run: python -B tools/world_starts/coverage.py --check --require-integrated-owner
      - name: Check dormant release contracts and explicit setup-owner gaps
        run: python -B tools/world_starts/release_inventory.py --check
      - name: Check scalar effects and literal release caller inventory
        run: python -B tools/world_starts/test_release_inventory.py
      - name: Check legitimate releases, current-state maintenance and account continuity
        run: python -B tools/release_foundations/run_checks.py
      - name: Check funded replacements and explicit tiny-budget rotations
        run: python -B tools/replacements/test_replacements.py
      - name: Check full national economy and legacy continuity
        run: python -B tools/Test-EconomyV2.py
      - name: Check settled ledger, monetary carry and briefing page geometry
        run: python -B tools/Test-EconomyLedger.py
      - name: Check reproducible offline economy screen review
        run: python -B tools/economy_v2/render_review.py --check
      - name: Check observed force-cost groups and overlap-safe allowances
        run: python -B tools/Test-ForceUpkeep.py
      - name: Check conventional land recipes, support costs and research consumers
        run: python -B tools/land_program/test_land.py
      - name: Check original research font ownership and strict composition
        run: python -B tools/research_fonts/test_fonts.py
      - name: Check reproducible research font metrics and alpha measurements
        run: python -B tools/research_fonts/measure.py --check
      - name: Check real economy and institution owners together
        run: python -B tools/Test-SharedSystems.py
      - name: Check national institutions and administrative programme lifecycle
        run: python -B tools/Test-Institutions.py
      - name: Check Usean partner output and Package 1 owners
        run: python -B tools/usean_partners/build.py --check --require-dependencies
      - name: Check Usean partner programmes, outcomes, saves and artwork
        run: python -B tools/usean_partners/test_content.py --require-dependencies
      - name: Check national programmes against real fiscal and capacity owners
        shell: pwsh
        run: python -B tools/usean_partners/test_integration.py
      - name: Check Anea country foundations and DLC rosters
        run: python -B tools/anea/test_foundation.py
      - name: Check Anea national campaigns
        run: python -B tools/Test-AneaCampaign.py
      - name: Check Anea aid and recovery lifecycle
        run: python -B tools/Test-AneaSystems.py
      - name: Check Anea original artwork and bindings
        run: python -B tools/Test-AneaArt.py
      - name: Check Anea country selection and office presentation
        run: python -B tools/Test-AneaPresentation.py
      - name: Check integrated Anea historical and alternate routes
        run: python -B tools/Test-AneaIntegration.py
      - name: Check Usean expansion
        run: python -B tools/Test-UseaExpansion.py
      - name: Check interface repairs and starting governments
        run: python -B tools/Test-InterfaceRepairs.py
      - name: Check retired Earth news compatibility handlers
        run: python -B tools/Test-RetiredWorldNews.py
      - name: Check overhaul roadmap
        run: python -B tools/overhaul/check_release_plan.py
      - name: Check screenshot repairs
        run: python -B tools/Test-OverhaulRepairs.py
      - name: Check reviewed regional captions and localization ownership
        run: python -B tools/regional_labels/test_labels.py
      - name: Check decision controls and dependencies
        run: python -B tools/Test-DecisionUI.py
      - name: Check explicit DLC provider and presentation-closure regressions
        shell: pwsh
        run: python -B tools/Test-EffectiveDependencies.py
      - name: Parse authored presentation sources and bound counter/audio categories
        shell: pwsh
        run: python -B tools/check_presentation_sources.py
      - name: Reject malformed authored presentation fixtures
        shell: pwsh
        run: python -B tools/Test-PresentationSources.py
      - name: Check selected startup research and variant chronology regressions
        shell: pwsh
        run: python -B tools/Test-StartupChronology.py
      - name: Validate actual selected startup equipment consumers
        shell: pwsh
        run: python -B tools/compatibility/variant_order.py
      - name: Check focus canvas and captions
        run: python -B tools/Test-FocusScreenRepairs.py
      - name: Check Continental War generated output
        run: python -B tools/build_continental_war.py --check
      - name: Check original squadron generated narratives
        shell: pwsh
        run: python -B tools/squadrons/build.py --check
      - name: Check squadron delivery, choices and archived context
        shell: pwsh
        run: python -B tools/Test-SquadronStories.py
      - name: Check reconstruction services against real fiscal and institution owners
        shell: pwsh
        run: python -B tools/Test-ReconstructionContinuations.py
      - name: Check reconstruction imports, layouts, original artwork and English
        shell: pwsh
        run: python -B tools/Test-ReconstructionAssets.py
      - name: Check superpower commitments and allocations against real P1 owners
        shell: pwsh
        run: python -B tools/Test-SuperpowerProgrammes.py
      - name: Check superpower imports, English, layout and original artwork
        shell: pwsh
        run: python -B tools/Test-SuperpowerAssets.py
      - name: Check selected startup research and design consumer regressions
        shell: pwsh
        run: python -B tools/Test-StartupChronology.py
      - name: Check original squadron artwork and reproducible packaging
        shell: pwsh
        run: python -B tools/Test-SquadronArt.py
      - name: Check every authored asset dependency
        run: python -B tools/audit_visual_dependencies.py --strict-all
      - name: Check briefing artwork and original layout
        run: python tools/frontend_briefing/validate.py
      - name: Check map font and display branding
        run: python tools/frontend_typography/validate.py
      - name: Check faction lifecycle and DLC fallback contracts
        run: python -B tools/Test-UlyssesFactions.py
      - name: Run static regression checks
        shell: pwsh
        run: .\tools\Test-UlyssesStatic.ps1 -ModRoot .\mod\2985041246
