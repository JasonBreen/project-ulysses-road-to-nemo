 OSE_snp_productive_capacity_review:0 "Inspect the Work Actually Delivered"
 OSE_snp_productive_capacity_review_desc:0 "A plant superintendent brings a list of idle shifts, followed by a shorter list of qualified people. The procurement officer has already counted both as available capacity. Across the table, a technical college asks which apprentices will be released for examinations. The discussion concerns time, trained labour and dependable orders. Whatever the board chooses will reach the workshop floor, where somebody must turn the order into goods and explain which other work had to wait.\n\nReview completed work, including the jobs deliberately delayed. A clean schedule obtained by erasing outstanding civilian demands is not a successful return."
 OSE_snp_productive_capacity_review_effect_tt:0 "Record the branch’s genuinely completed service period as the basis for a standing settlement."
 OSE_snp_productive_capacity_settlement:0 "A Productive Capacity Compact"
 OSE_snp_productive_capacity_settlement_desc:0 "A plant superintendent brings a list of idle shifts, followed by a shorter list of qualified people. The procurement officer has already counted both as available capacity. Across the table, a technical college asks which apprentices will be released for examinations. The discussion concerns time, trained labour and dependable orders. Whatever the board chooses will reach the workshop floor, where somebody must turn the order into goods and explain which other work had to wait.\n\nKeep the chosen training and order policy in ordinary practice. The final compact improves continuity while preserving the burden accepted earlier."
 OSE_snp_productive_capacity_settlement_effect_tt:0 "Improve the selected policy’s benefit by twenty percent while retaining its same continuing cost."
 OSE_snp_continental_transport_civil_policy_spirit:0 "Civil receiving windows"
 OSE_snp_continental_transport_civil_policy_spirit_desc:0 "Two departments have reserved the same loading window. One expects a routine repair shipment; the other has described its movement as urgent without naming a receiving yard. The dispatch officer declines to settle the conflict by changing the word on either requisition. Civil protection and military logistics both depend on a network that can communicate its actual limits. The transport office must choose a priority rule before another exception becomes the normal timetable.\n\nGive public receiving windows dependable protection. Civil repair work becomes easier to sustain, while military logistics accepts a measurable scheduling burden."
