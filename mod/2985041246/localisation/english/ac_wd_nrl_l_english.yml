l_english:
 NRL_wd_crown_sits:0 "The Crown Takes Stock"
 NRL_wd_crown_sits_desc:0 "Nordlands enters 1991 governed by an Office of the Crown that holds the seals at Aspneset while elections stay suspended. The arrangement is popular and unexamined. A formal stocktaking asks which powers the Office actually uses and on whose authority, and it costs the palace the comfortable silence it has enjoyed for years."
 NRL_wd_crown_civil_list:0 "Publish the Civil List"
 NRL_wd_crown_civil_list_desc:0 "Every payment the crown makes, from palace salaries to grants for harbour chapels, goes into a printed civil list that any newspaper can quote. Courtiers lose a little privacy and some lose their sinecures outright. In exchange the crown can argue about its future from a position nobody can call secretive."
 NRL_wd_crown_diet_recalled:0 "Recall the Sleeping Diet"
 NRL_wd_crown_diet_recalled_desc:0 "The diet returned at New Year has no calendar and no budget. Recalling it for a short consultative sitting gives deputies a room to speak in and a record of what they said. It drains political capital, because the Office must answer questions it would rather not hear, but it keeps the argument indoors."
 NRL_wd_crown_cabinet_path:0 "Ministers Who Face the Diet"
 NRL_wd_crown_cabinet_path_desc:0 "The constitutional camp proposes that the crown keep its throne and its oath while a cabinet drawn from the diet runs the ministries and answers for the budget. It suits a calm and prosperous country. It also ends the Office's habit of settling disputes with a quiet telephone call, which many officials will miss."
 NRL_wd_crown_privy_path:0 "Keep the Seals at Aspneset"
 NRL_wd_crown_privy_path_desc:0 "Palace officials argue that the present arrangement works and should be confirmed rather than apologised for. The Office would keep the seals, the budget and appointments, and the diet would advise when asked. Decisions stay quick. The quarter of the country that votes liberal will treat every one of them as a grievance."
 NRL_wd_crown_diet_path:0 "The Crown Reigns, the Diet Rules"
 NRL_wd_crown_diet_path_desc:0 "Liberal deputies want more than a cabinet: they want the diet to elect the government outright and the crown to step back into ceremony, honours and the oath of office. The principality would keep its name and lose its working monarchy. The palace staff, and many older voters, regard this as a quiet abdication."
 NRL_wd_crown_houses_path:0 "Let the Harbour Houses Govern"
 NRL_wd_crown_houses_path_desc:0 "The shipping, yard and oil houses of the coast pay most of the taxes and employ most of the skilled workforce. Their proposal is a council of chartered houses that governs by commission, with the crown as patron and the diet as a sounding board. Efficient, certainly. Accountable mainly to balance sheets."
 NRL_wd_crown_seat_cabinet:0 "Seat the Crown Cabinet"
 NRL_wd_crown_seat_cabinet_desc:0 "A cabinet formed from the diet majority takes the ministries, and the crown is bound to act on its advice. Elections return on a fixed calendar. The change runs through the office rather than any person. Ministers inherit the credit for a calm country and the blame for every rise in harbour dues."
 NRL_wd_crown_seat_privy:0 "Confirm the Privy Office"
 NRL_wd_crown_seat_privy_desc:0 "The Office of the Crown becomes a standing privy office with written authority over the seals, the budget and senior appointments. Elections remain suspended and the diet sits only when summoned. Government is fast and narrow. With no chamber to share decisions, every failure now lands at the palace gate."
 NRL_wd_crown_seat_diet:0 "Seat the Diet Government"
 NRL_wd_crown_seat_diet_desc:0 "The diet elects an executive that governs in its own name, and the crown withdraws to ceremony and the oath of office. Elections run on a fixed calendar. The coastal houses lose their private access to the palace, and deputies discover that running a fleet, a yard sector and an oil field is harder than criticising those who did."
 NRL_wd_crown_seat_houses:0 "Charter the Council of Houses"
 NRL_wd_crown_seat_houses_desc:0 "A council of chartered shipping, yard and oil houses takes the seals under the crown's patronage and governs through commissions staffed by its own managers. Elections stay suspended. Contracts move quickly and the treasury is well run. Wages, rents and harbour prices are now set by the same people who collect them."
 NRL_wd_crown_new_oath:0 "An Oath for the New Order"
 NRL_wd_crown_new_oath_desc:0 "Whatever form of government emerged, its officers swear a new oath written for it, read aloud in Aspneset and printed in every district newspaper. The ceremony costs little and settles a great deal: officials know whom they serve, and the losing factions know the argument is closed until the next decade."
 NRL_wd_yards_census:0 "Count the Empty Slipways"
 NRL_wd_yards_census_desc:0 "Eleven dockyards line the Nordlandic coast, spread across Norden Forest, the twin harbours of Djurseryd and Havnaraas, Nyboholm in Tenese and a small yard on the Hait Mountain shore. Not all of them have work. A census of slipways, cranes and order books tells the yards what the country can still build and what it should stop pretending to build."
 NRL_wd_yards_lundegaard:0 "Cranes for Lundegaard"
 NRL_wd_yards_lundegaard_desc:0 "Lundegaard handles the heavy lifts for the Norden Forest yards, but its quay cranes are older than most of the people who run them, and the roads behind the quay jam at every shift change. New cranes and a widened access road cost a season of disruption and let the forest yards take larger hulls."
 NRL_wd_yards_nyboholm:0 "Nyboholm Yard Roads"
 NRL_wd_yards_nyboholm_desc:0 "Nyboholm is the busiest harbour in Tenese and home to three dockyards that share a single road to the interior. Rebuilding that road and the rail spur beside it lets steel arrive without blocking the fish market. The work is unglamorous, and it takes trucks off the shipbuilders' delivery lists for most of a year."
 NRL_wd_yards_djurseryd:0 "A New Basin at Djurseryd"
 NRL_wd_yards_djurseryd_desc:0 "Djurseryd and Havnaraas share a crowded harbour district whose yards still have room for one more basin. Dredging and walling it costs money the treasury would rather keep, and it takes water from the trawler fleet. In return the coast gains a slipway long enough for modern hulls, the first new one in years."
 NRL_wd_yards_merchant:0 "Order Books from Abroad"
 NRL_wd_yards_merchant_desc:0 "The yard owners want to chase merchant orders from abroad: tankers, ferries and coasters built to price and delivered on time. Order books fill, and wages follow. The navy gets only the space that is left, and the country's best slipways end up serving whichever foreign owner pays the earliest instalment."
 NRL_wd_yards_navy:0 "Hulls for Our Own Flag"
 NRL_wd_yards_navy_desc:0 "The admiralty proposes that the yards build first for the home fleet, with steady orders for coastal escorts and submarines replacing the boom and bust of commercial contracts. Workers gain secure employment and the fleet gains modern hulls. The treasury pays for every keel, and export income shrinks accordingly."
 NRL_wd_yards_repair:0 "Refit Yards, Not Launch Yards"
 NRL_wd_yards_repair_desc:0 "A third school says the coast should specialise in repair, refit and conversion, which needs fewer slipways, less capital and more skill. Ships of every flag would call for overhauls. The yards would rarely launch anything new, and the workforce would shrink toward a smaller corps of highly paid fitters."
 NRL_wd_yards_skogaholm:0 "Tanker Orders for Skogaholm"
 NRL_wd_yards_skogaholm_desc:0 "Skogaholm in Oregonen has a working harbour and no yard of its own. The first merchant contracts justify building one there, laid out for tankers and coasters rather than warships. Oregonen gains shipbuilding wages for the first time in a generation, and the navy notes, without enthusiasm, that the new yard was designed around commercial hulls."
 NRL_wd_yards_escort_series:0 "A Series of Coastal Escorts"
 NRL_wd_yards_escort_series_desc:0 "Rather than designing each escort from scratch, the yards build a single class in a long series, with the same engines, guns and depth charges throughout. Crews train once and serve on any hull. Each ship is less refined than a bespoke design, but the fleet can count on every one of them being ready."
 NRL_wd_yards_floating_dock:0 "A Floating Dock for Oregonen"
 NRL_wd_yards_floating_dock_desc:0 "A floating dock moored off Skogaholm can lift damaged hulls without a permanent basin. It suits the repair model: cheap to place, easy to tow and able to serve any visiting ship. Oregonen's council wanted a proper yard and says so, but the dock pays its crews from the first season."
 NRL_wd_yards_apprentices:0 "Apprentices in Every Yard"
 NRL_wd_yards_apprentices_desc:0 "Every yard is required to train apprentices in welding, fitting and electrical work, with the cost shared between owners and the state. The first years are expensive and slow, since apprentices waste steel. A decade later the yards have the skilled hands that older workers had warned would vanish with their retirement."
 NRL_wd_oil_survey:0 "Survey the Peninsula Fields"
 NRL_wd_oil_survey_desc:0 "The Nord Peninsula holds more oil than the rest of Nordlands combined, under a thinly settled landscape with one airfield and three arms plants. East Granley, Haugaland and the capital district have smaller fields. A full geological survey tells the state what it owns before anyone signs a lease, and it delays every lease by a year."
 NRL_wd_oil_peninsula_road:0 "A Road Down the Peninsula"
 NRL_wd_oil_peninsula_road_desc:0 "Wells mean nothing without a way to move crews, pipe and pumps. A paved road and a rail spur along the Nord Peninsula cost more per resident than any other project in the country, because so few people live there. The oil houses offer to pay a share if they get first use of it."
 NRL_wd_oil_granley_wells:0 "Wells Along East Granley"
 NRL_wd_oil_granley_wells_desc:0 "East Granley sits on oil and the country's only aluminium ore, beside the FATO frontier. Its fields are older and smaller than the peninsula's but already close to the harbour at Eyrarbakki. Roads to the outlying wells are cheap and quick, and they keep East Granley from feeling like an afterthought to the peninsula boom."
 NRL_wd_oil_geology_school:0 "A School of Petroleum Geology"
 NRL_wd_oil_geology_school_desc:0 "The survey showed how few Nordlandic geologists exist; most of the field work was done by hired foreign crews. A school of petroleum geology in the capital trains surveyors, drillers and reservoir engineers at home. It takes years to graduate the first class, and the oil houses will poach its best students."
 NRL_wd_oil_crown_company:0 "A Crown Company for the Wells"
 NRL_wd_oil_crown_company_desc:0 "A state company holds every lease and pays the treasury directly. Revenue stays at home and drilling follows national priorities, including the fuel reserve the admiralty keeps asking for. The pace is slower than private drillers would manage, and the company's managers answer to ministers who know little about oil."
 NRL_wd_oil_licences:0 "Licences for Private Drillers"
 NRL_wd_oil_licences_desc:0 "The fields are auctioned in blocks to private drillers, domestic and foreign, who pay royalties on every barrel. Rigs arrive within a few seasons and the peninsula fills with crews. The state collects less per barrel than a crown company would, and the drillers decide which fields are worth working."
 NRL_wd_oil_slow_fund:0 "Pump Slowly, Save the Rest"
 NRL_wd_oil_slow_fund_desc:0 "A cautious school proposes modest extraction, with every royalty paid into a savings fund that may be spent only on long-term works. Little changes on the peninsula and nobody gets rich quickly. Decades from now, the fund may be the largest asset the principality owns, provided no government raids it first."
 NRL_wd_oil_refinery:0 "A Refinery on the Peninsula"
 NRL_wd_oil_refinery_desc:0 "Crude shipped away unrefined earns a fraction of its value. A refinery near the peninsula fields keeps the processing, and the jobs, at home. It takes the last free industrial plot on the peninsula, and the three arms plants nearby will have to share power and water with it."
 NRL_wd_oil_smelter:0 "Power for the Granley Smelters"
 NRL_wd_oil_smelter_desc:0 "East Granley's aluminium ore needs cheap power before it is worth anything, and its oil fields can supply it. A gas-fired plant and a smelter beside it turn two local resources into one export. The smelter takes East Granley's last industrial plot, and its fumes will not make it popular downwind."
 NRL_wd_oil_eyrarbakki:0 "Tanker Jetties at Eyrarbakki"
 NRL_wd_oil_eyrarbakki_desc:0 "Eyrarbakki's harbour was built for fishing boats and coasters. Tanker jetties and a pipeline from the Granley fields let crude and aluminium leave by sea without passing through the capital's rail yards. The harbour gets busier and dirtier, and the families who own the waterfront want compensation."
 NRL_wd_oil_fuel_reserve:0 "A Fuel Reserve for Hard Years"
 NRL_wd_oil_fuel_reserve_desc:0 "Whatever the ownership model, part of the output goes into a strategic reserve stored in tanks beside the capital's fuel depot. It ties up oil that could have been sold, and the oil houses grumble. If war closes the sea lanes or prices spike, the country will not run dry in a month."
 NRL_wd_serv_footing:0 "What Disarmament Means"
 NRL_wd_serv_footing_desc:0 "Nordlands keeps almost no conscripts and talks little about its army, yet its depots hold hundreds of tanks, thousands of trucks and enough artillery for several divisions. A disarmed footing without a defence policy is an accident, not a choice. Writing a policy down will annoy pacifists and generals alike."
 NRL_wd_serv_armour_store:0 "Three Hundred Tanks in Storage"
 NRL_wd_serv_armour_store_desc:0 "The service armour sits in sheds with too few mechanics to keep it running. A custodian corps of long-service crews rotates the vehicles, cannibalises the worst and keeps the rest ready to move. It costs fuel and wages for machines that may never fight, which is precisely the point of owning them."
 NRL_wd_serv_hait_ranges:0 "Mountain Ranges at Hait"
 NRL_wd_serv_hait_ranges_desc:0 "Hait Mountain faces Wielvakia across the Vakia frontier and offers the steepest training ground for mountain troops in the country. Access roads, a range and a winter camp let the army practise where it would actually have to fight. Hikers lose a valley, and the district gains a garrison economy."
 NRL_wd_serv_home_guard:0 "Rolls of the Home Guard"
 NRL_wd_serv_home_guard_desc:0 "Every adult who has ever served, and any volunteer who wants to, is listed in district home guard rolls with a rifle, a muster point and two weekends of training a year. It is cheap and broad. A home guard can defend a town street; it cannot fight a modern army in open country."
 NRL_wd_serv_volunteers:0 "Volunteer Coast Brigades"
 NRL_wd_serv_volunteers_desc:0 "A small professional force of volunteer brigades is raised for the coast, where the harbours and oil jetties are, and paid well enough to keep its soldiers for years. Recruits are scarce in a prosperous country and the wage bill is steep. What the brigades lack in numbers they make up in training."
 NRL_wd_serv_declared:0 "Disarmed, and Saying So"
 NRL_wd_serv_declared_desc:0 "A third camp wants Nordlands to make a virtue of its posture: a declared policy of minimal forces, published defence budgets and an open invitation to neighbours to inspect them. It wins trust abroad and goodwill at home. If a crisis ever comes, the country will be asking others to keep their promises."
 NRL_wd_serv_firepower:0 "A School of Massed Fire"
 NRL_wd_serv_firepower_desc:0 "The army's doctrine already favours firepower over manpower, which suits a country with guns in storage and few soldiers. A staff school teaches officers to plan around artillery, armour and supply rather than around numbers. Places are few, and good officers leave their units for a year to fill them."
 NRL_wd_serv_arsenal:0 "The Haugaland Arsenal"
 NRL_wd_serv_arsenal_desc:0 "Haugaland already hosts three arms plants and has its own steel. A fourth line there builds ammunition and spares for the service armour and the coastal forces, so that maintenance no longer waits on imports. It takes Haugaland's last free plot, and the pacifist press calls it a broken promise."
 NRL_wd_serv_mountain_companies:0 "Mountain Companies for Hait"
 NRL_wd_serv_mountain_companies_desc:0 "Two companies of mountain infantry form at the new Hait ranges, trained to hold passes with light weapons and to move without roads. They are the only Nordlandic troops the Wielvakian frontier posts will ever see on manoeuvre. The companies are small, and their winter allowances are the envy of every other unit."
 NRL_wd_serv_depots:0 "Reserve Depots in Oregonen"
 NRL_wd_serv_depots_desc:0 "Oregonen also faces the Wielvakian frontier but holds almost no military stores. Dispersed depots for fuel, ammunition and spares there, with roads hard enough for tank transporters, mean that whatever force the country keeps can reach either end of the border. Councils welcome the jobs and dislike the convoys."
 NRL_wd_serv_civil_defence:0 "Civil Defence Before Divisions"
 NRL_wd_serv_civil_defence_desc:0 "If the country will not field an army, it can at least protect its people. A civil defence corps trains firefighters, rescue teams and shelter wardens in every district, drawing on volunteers who would never join a military unit. It costs little, earns broad support, and leaves the generals feeling quietly sidelined."
 NRL_wd_fleet_doctrine:0 "A Fleet Kept in Being"
 NRL_wd_fleet_doctrine_desc:0 "Nordlandic naval doctrine holds that a fleet which survives deters better than a fleet which fights. Escorts and coastal submarines stay close to well-defended harbours and sail only when the odds favour them. Writing the doctrine down gives the admirals a budget argument, and gives their critics a phrase to mock."
 NRL_wd_fleet_approach_radar:0 "Radar on the Harbour Approaches"
 NRL_wd_fleet_approach_radar_desc:0 "The great naval harbour on the Norden Forest coast is the fleet's main base, and nothing modern watches its approaches. A coastal radar station near the harbour mouth tracks every hull and aircraft within range. It is the first piece of the warning net the doctrine depends on, and it is expensive to run."
 NRL_wd_fleet_merchant_register:0 "Register Every Merchant Hull"
 NRL_wd_fleet_merchant_register_desc:0 "The country runs a large merchant fleet but keeps no current list of its ships, crews or routes. A register held by the admiralty records every hull flying the Nordlandic flag. Owners resent the paperwork. If a war ever closes the sea lanes, the register will decide which ships come home first."
 NRL_wd_fleet_nyboholm:0 "Nyboholm as a Second Base"
 NRL_wd_fleet_nyboholm_desc:0 "A single main base is a single target. Nyboholm in Tenese becomes the fleet's second home, with fuel tanks, a radar station on its approaches and berths reserved for escorts. Moving ships there costs the main base some prestige and Tenese some fishing space. Dispersal is the doctrine's oldest rule."
 NRL_wd_fleet_submarines:0 "Submarines Off Every Headland"
 NRL_wd_fleet_submarines_desc:0 "The submarine school wins the argument: coastal submarines are cheap, hard to find and ideal for a fleet that intends to wait. Boats patrol the approaches to every major harbour. Their crews train for years, their mistakes are rarely survivable, and the surface officers worry about their own promotions."
 NRL_wd_fleet_escorts:0 "Escort Groups for the Sea Lanes"
 NRL_wd_fleet_escorts_desc:0 "The escort school argues that Nordlands lives by its merchant fleet and should guard it. Coastal escorts are grouped into flotillas that shepherd convoys through the approaches and out to sea. The groups need fuel, sea time and constant drill. They protect trade far better than they protect harbours."
 NRL_wd_fleet_mines:0 "Controlled Mines for the Channels"
 NRL_wd_fleet_mines_desc:0 "The cheapest navy is one that never sails. Controlled minefields, laid and switched from shore stations, can close the harbour channels in hours. They need constant maintenance and a trained shore staff. Fishing captains complain about restricted waters, and neighbours ask what exactly Nordlands expects to keep out."
 NRL_wd_fleet_boat_school:0 "The Submarine School"
 NRL_wd_fleet_boat_school_desc:0 "Submarine crews take longer to train than any other sailors, and a mistake can kill everyone aboard. A dedicated school with a training boat and a shore simulator shortens the course and lowers the accident rate. It absorbs the best volunteers in the fleet, which the surface flotillas resent loudly."
 NRL_wd_fleet_convoy_office:0 "A Convoy Office at Djurseryd"
 NRL_wd_fleet_convoy_office_desc:0 "Escort groups need someone ashore to plan routes, assemble convoys and talk to shipowners. A convoy office at Djurseryd does all three, with a direct line to the admiralty. Owners resent the delays while convoys assemble. Insurers, who have long memories, cut their rates for ships that sail in company."
 NRL_wd_fleet_shore_stations:0 "Shore Stations for the Mines"
 NRL_wd_fleet_shore_stations_desc:0 "Controlled minefields are only as good as the stations that watch and fire them. A chain of shore stations with radar and hydrophones covers the Oregonen approaches first, close to the Wielvakian coast. The stations need crews around the clock, and the treasury pays for every watch they stand."
 NRL_wd_fleet_puts_to_sea:0 "The Fleet Puts to Sea"
 NRL_wd_fleet_puts_to_sea_desc:0 "Once a year the whole fleet sails together for a week of exercises in home waters, watched by the press and the diet. It burns fuel and wears out engines, and the admirals stage it with care. A fleet in being still has to show that it exists, and that it can move when ordered."
 NRL_wd_bord_capital_frontier:0 "A Capital on Two Borders"
 NRL_wd_bord_capital_frontier_desc:0 "Aspneset, the capital, sits in West Norden within reach of two frontiers, FATO and Wielvakia. Most of the country's land trade passes through the capital district. Before choosing any frontier policy, the government sets up customs desks with both neighbours, which means admitting that it never had a frontier policy at all."
 NRL_wd_bord_fato_desk:0 "A Customs Desk with FATO"
 NRL_wd_bord_fato_desk_desc:0 "Trains and trucks from FATO enter at the crossings from Granley Tips and Gangl, where inspections still follow forms written decades ago. A joint desk with FATO customs officers shares manifests, cuts waiting times and settles disputes on the spot. It changes no claim. It does require trusting another country's paperwork."
 NRL_wd_bord_wie_desk:0 "A Customs Desk with Wielvakia"
 NRL_wd_bord_wie_desk_desc:0 "The Wielvakian frontier runs past Farnlands and Vakia, touching West Norden, Hait Mountain and Oregonen. Traffic is lighter than on the FATO side but harder to watch, through mountain roads and small harbours. A shared desk sets common hours, common forms and a telephone line both sides promise to answer."
 NRL_wd_bord_belkan_sale:0 "Belkan Land Changes Hands"
 NRL_wd_bord_belkan_sale_desc:0 "In late August 1991 Belka sells territory in its north to FATO and other lands to its eastern neighbours. A Nordlandic neighbour has just grown, and routes that once ran to Belka now cross FATO customs. Road works at the East Granley crossings prepare for traffic that nobody can yet estimate."
 NRL_wd_bord_belkan_sale_tt_1:0 "No claim, core or border change for Nordlands; the sale is a matter between Belka and its neighbours."
 NRL_wd_bord_open:0 "Open Crossings, Light Inspections"
 NRL_wd_bord_open_desc:0 "With customs desks working, the government lowers inspections to spot checks and keeps the crossings open around the clock. Trade with both neighbours grows quickly and frontier towns prosper. Smuggling grows too, and the police warn that an open border is easy to cross in both directions when times turn bad."
 NRL_wd_bord_guarded:0 "Guarded Crossings, Full Inspections"
 NRL_wd_bord_guarded_desc:0 "The cautious answer keeps every vehicle inspected and every crossing staffed by armed customs police, with hours fixed and posted. Trade grows more slowly, and frontier merchants complain about queues. The state knows what enters the country, which may matter more than the price of imports if the region turns unstable."
 NRL_wd_bord_through_trains:0 "Through Trains Across the Frontier"
 NRL_wd_bord_through_trains_desc:0 "Open crossings let passenger and freight trains run straight through without changing crews at the border. The capital's rail yards are rebuilt for through traffic, and the country's hundred locomotives are fitted with the signalling both neighbours use. Railway unions worry about foreign crews on Nordlandic track."
 NRL_wd_bord_market_days:0 "Market Days at the Crossings"
 NRL_wd_bord_market_days_desc:0 "Weekly markets at the crossings let farmers, craftsmen and traders from all three countries sell without filing export papers for small amounts. The markets become social events as much as commercial ones. Tax collectors lose a little revenue, and frontier towns gain a reason to think kindly of each other."
 NRL_wd_bord_vakia_posts:0 "Watch Posts on the Vakia Line"
 NRL_wd_bord_vakia_posts_desc:0 "Guarded crossings need eyes between them. Watch posts with radar and radio along the Hait Mountain stretch of the Wielvakian frontier cover the passes where smugglers prefer to walk. The posts are cold, lonely and expensive to supply. Wielvakian officials ask, politely, whom exactly the posts are meant to watch."
 NRL_wd_bord_tariff_courts:0 "Tariff Courts for the Frontier"
 NRL_wd_bord_tariff_courts_desc:0 "Customs disputes at guarded crossings used to wait months for a ministry ruling. Tariff courts sitting in the frontier districts decide them in days, with published judgments. Merchants learn the rules and stop bribing clerks. The courts cost judges' salaries, and the ministry loses a quiet source of influence."
 NRL_wd_bord_quiet_word:0 "A Quiet Word with Both Neighbours"
 NRL_wd_bord_quiet_word_desc:0 "Nordlands, FATO and Wielvakia issue a short joint statement: each respects the others' frontiers and will settle incidents through the customs desks before anything else. It binds nobody to anything more. In a region where borders are being sold and redrawn, a dull statement about respecting them is worth having."
 NRL_wd_bord_quiet_word_tt_2:0 "A statement of mutual respect only; it creates no faction, guarantee or alliance."
 NRL_wd_lands_ledger:0 "A Ledger of Nine Districts"
 NRL_wd_lands_ledger_desc:0 "Nordlands has nine districts of very unequal weight. West Norden and Norden Forest hold most of the people, the Nord Peninsula holds most of the oil and few residents, and the harbour towns hold most of the yards. A district ledger of roads, schools and revenue shows who pays and who benefits."
 NRL_wd_lands_forest_lines:0 "Commuter Lines for Norden Forest"
 NRL_wd_lands_forest_lines_desc:0 "Norden Forest is the most populous coastal district, and its workers travel long distances between forest towns, the yards at Lundegaard and the naval harbour. Commuter lines and a ring road cut those journeys. Construction closes roads for a year; afterward the workforce can reach any yard in under an hour."
 NRL_wd_lands_peninsula_ferries:0 "Ferries for the Peninsula Towns"
 NRL_wd_lands_peninsula_ferries_desc:0 "The small towns of the Nord Peninsula rely on a single road and an irregular boat service. Regular ferries, rebuilt piers and a coast road put schools, clinics and markets within reach. Per resident, it is the most expensive service in the country. It is also how the peninsula stops feeling like an oil camp."
 NRL_wd_lands_twin_harbours:0 "Streets for the Twin Harbours"
 NRL_wd_lands_twin_harbours_desc:0 "Djurseryd and Havnaraas grew around their harbours without much planning, and their streets choke on yard traffic and commuters alike. A joint works programme separates freight from passengers and rebuilds the harbour roads. Shopkeepers lose trade while the roads are dug up and win it back once the trucks stop parking outside."
 NRL_wd_lands_hait_works:0 "Tungsten Works Under Hait"
 NRL_wd_lands_hait_works_desc:0 "Hait Mountain holds the country's tungsten and some chromium, which until now has left as raw ore. A processing works near the mines turns it into alloys for tools, drills and armour plate. It fills Hait Mountain's last industrial plot. Mine dust and truck traffic are the price the district pays."
 NRL_wd_lands_councils:0 "Councils for Every District"
 NRL_wd_lands_councils_desc:0 "Each district receives an elected council with its own budget for roads, schools and clinics, while the capital keeps defence, foreign affairs and the currency. Local projects move quickly and local loyalties strengthen. The poorer districts find their budgets small, and the richer ones resent subsidising them."
 NRL_wd_lands_works:0 "One Ministry of Works"
 NRL_wd_lands_works_desc:0 "A single ministry of works in Aspneset plans every road, school and harbour wall in the country to one national standard. Projects are coordinated and the poorer districts get their share. Local officials lose control over local spending, and every pothole in every district becomes the capital's fault."
 NRL_wd_lands_skogaholm:0 "Workshops at Skogaholm"
 NRL_wd_lands_skogaholm_desc:0 "Oregonen's council spends its new budget on light industry: workshops at Skogaholm for marine engines, pumps and electrical gear, near the harbour and the Wielvakian frontier. It is the district's own project, planned by its own council. The capital doubts the business case and waits to see whether it holds."
 NRL_wd_lands_haugaland_roads:0 "Haugaland Mine Roads"
 NRL_wd_lands_haugaland_roads_desc:0 "The ministry of works starts with Haugaland, whose oil wells, steel ore and arms plants share narrow roads with village traffic. Graded mine roads and a heavy-load bridge open the district to modern trucks. The ministry chose the project on national grounds, and Haugaland's villages were not asked first."
 NRL_wd_lands_capital_housing:0 "Housing for Aspneset"
 NRL_wd_lands_capital_housing_desc:0 "Aspneset draws workers from every district and has never built enough homes for them. A housing programme of rental blocks and cheap loans eases the shortage over several years. Construction crews are pulled from other work, and landlords lobby hard against it. If it works, rents stop outrunning wages."
 NRL_wd_lands_accord:0 "The Districts Accord"
 NRL_wd_lands_accord_desc:0 "Whatever balance of councils and ministry the country settled on, the nine districts sign an accord fixing their shares of national revenue and the rules for resolving disputes. It is dry reading. It replaces years of annual haggling with a formula, and lets the treasury forecast district spending a decade ahead."
 NRL_wd_sus_plan:0 "The Physical Sustainment Plan"
 NRL_wd_sus_plan_desc:0 "Nordlands owns more equipment than it can afford to replace: trucks, trains, armour, escorts and aircraft bought in better-funded years. The sustainment plan sets priorities for maintenance, spares and transport so that what exists keeps working. It is an unglamorous budget, and it competes with every new purchase."
 NRL_wd_sus_polytechnic:0 "A Polytechnic at Aspneset"
 NRL_wd_sus_polytechnic_desc:0 "Engineers, technicians and mechanics are trained at a new polytechnic in the capital, with workshops funded by the yards, the oil houses and the armed services. It takes years to graduate the first class. Its graduates will maintain the country's machines and, eventually, design some of them."
 NRL_wd_sus_rolling_stock:0 "One Hundred Locomotives"
 NRL_wd_sus_rolling_stock_desc:0 "The country's hundred locomotives and their wagons are overdue for overhaul, and many lack spare parts. A rolling stock programme rebuilds engines, standardises couplings and stocks parts in district depots. Freight suffers while engines are in the shops. Afterward the railways keep schedules the country had almost forgotten."
 NRL_wd_sus_truck_pools:0 "Truck Pools in Every District"
 NRL_wd_sus_truck_pools_desc:0 "Thousands of military trucks sit in storage while districts hire private haulers for public works. Pooling the trucks in district depots, crewed by reservists, puts them to work on roads and relief while keeping them maintained. The army worries about wear, and private haulers complain about unfair competition."
 NRL_wd_sus_licences:0 "Build Under Licence"
 NRL_wd_sus_licences_desc:0 "The cheapest way to replace worn equipment is to build proven foreign designs under licence, with Nordlandic factories assembling kits and slowly making more of the parts themselves. It is quick and reliable. Royalties flow abroad, resale is restricted, and the country's engineers learn to copy well rather than to invent."
 NRL_wd_sus_design:0 "Our Own Design Offices"
 NRL_wd_sus_design_desc:0 "The polytechnic's best graduates staff national design offices for trucks, radios and small vessels. Designs take years and early versions disappoint. In time the country can build equipment suited to its own coast and frontier rather than to someone else's war, and sell it to others with the same needs."
 NRL_wd_sus_capital_works:0 "Repair Works at Aspneset"
 NRL_wd_sus_capital_works_desc:0 "A large central repair works near the capital's rail yards rebuilds engines, gearboxes and electrical systems for every service and ministry. It takes the last free industrial plot in West Norden. Centralising repair saves money and builds expertise, though distant districts wait longer for their vehicles to return."
 NRL_wd_sus_field_engineers:0 "Field Engineers from the Polytechnic"
 NRL_wd_sus_field_engineers_desc:0 "Polytechnic students spend a term with army engineers and the ministry of works, building bridges, clearing roads and repairing harbour walls. They learn practical skills, and the state gets cheap labour on real projects. Professors complain about lost teaching time, and the engineers complain about the students."
 NRL_wd_sus_instrument_labs:0 "Instrument Labs for the Fleet"
 NRL_wd_sus_instrument_labs_desc:0 "Radar sets, sonars and radios fail more often than hulls do. Instrument laboratories at the polytechnic test, repair and eventually improve the electronics the fleet and the air arm depend on. The labs need costly equipment and patient staff, and they produce the first Nordlandic electronic designs worth selling abroad."
 NRL_wd_sus_fuel_chemistry:0 "Fuel Chemistry Laboratories"
 NRL_wd_sus_fuel_chemistry_desc:0 "The oil fields produce crude that needs careful refining, and the fleet burns fuel it cannot afford to waste. Chemistry laboratories study refining, lubricants and fuel blends. Their work saves money in small amounts across thousands of engines, and keeps the refineries from leaning entirely on foreign technical advice."
 NRL_wd_sus_spares:0 "A Spares Catalogue for Everything"
 NRL_wd_sus_spares_desc:0 "Every vehicle, ship and aircraft the state owns is listed with its parts, suppliers and repair intervals in a single catalogue. Depots order spares before failures, not after them. Compiling the catalogue takes years of clerical work. Once finished, it turns the sustainment plan from a promise into a routine."
 NRL_wd_air_eighteen:0 "Eighteen Fighters, Three Strikers"
 NRL_wd_air_eighteen_desc:0 "The Nordlandic air arm owns eighteen fighters and three ground-support aircraft, flying from fields on the Nord Peninsula and outside the capital. That is enough for air policing and parades, not for war. Deciding what such a small force is for comes before any purchase, and every option leaves someone unhappy."
 NRL_wd_air_peninsula_runway:0 "Lengthen the Peninsula Runway"
 NRL_wd_air_peninsula_runway_desc:0 "The Nord Peninsula field covers the oil fields and the sea approaches but has a short runway and two hangars. Lengthening it, hardening the hangars and adding fuel storage makes it the air arm's main base. The work competes with the oil houses for the peninsula's scarce labour, and the oil houses pay better."
 NRL_wd_air_forest_field:0 "A Fighter Field in Norden Forest"
 NRL_wd_air_forest_field_desc:0 "Norden Forest holds the main naval harbour and a large share of the population, yet no airfield of its own. A new field there lets fighters cover the fleet's base without flying the length of the country. Clearing the site costs forest and farmland, and the neighbours dislike the noise."
 NRL_wd_air_interceptors:0 "Interceptors for the Home Sky"
 NRL_wd_air_interceptors_desc:0 "The air arm is reorganised around interception: fast climbers, ground radar control and pilots trained to meet intruders at the coast. It suits a disarmed country that wants only to keep its sky. It does little for the fleet or the army, and the strike crews find themselves flying training sorties."
 NRL_wd_air_sea_patrol:0 "Patrol Wings over the Sea Lanes"
 NRL_wd_air_sea_patrol_desc:0 "The air arm is reorganised around the sea: long patrols over the merchant lanes, anti-ship training and close work with the fleet. It suits a country that lives by shipping. It leaves the capital's sky to a handful of fighters, and the army wonders whether it will ever see an aircraft overhead."
 NRL_wd_air_radar_chain:0 "A Radar Chain for Aspneset"
 NRL_wd_air_radar_chain_desc:0 "Interception without radar is guesswork. A chain of stations around the capital district feeds a single control room that can scramble fighters and track them to the frontier. The stations sit close to FATO and Wielvakian airspace, so their coverage must be explained to both neighbours before it is switched on."
 NRL_wd_air_strike_drill:0 "Anti-Ship Drill for the Strikers"
 NRL_wd_air_strike_drill_desc:0 "The three ground-support aircraft and their crews train to hit ships rather than tanks, flying with the fleet in its exercises. It is a modest force, but a credible one in coastal waters. Crews spend more hours over the sea than any other Nordlandic airmen, and the attrition in training worries the ministry."
 NRL_wd_air_belkan_pilots:0 "Belkan Pilots Seek Employers"
 NRL_wd_air_belkan_pilots_desc:0 "By the summer of 1998, former top pilots of the Belkan Air Force are being hired by other countries as aggressor squadrons. Their agents reach Aspneset too. The offer is tempting for a small air arm with no combat experience. It also raises the question of whose veterans the country wants teaching its pilots."
 NRL_wd_air_hire_aggressors:0 "Hire the Aggressor Squadron"
 NRL_wd_air_hire_aggressors_desc:0 "The government signs a contract with a group of former Belkan pilots to fly as an aggressor squadron against Nordlandic crews. Training quality jumps within months. Some deputies object to paying veterans of a war that frightened the whole region, and the pilots' fees exceed a Nordlandic general's salary."
 NRL_wd_air_own_instructors:0 "Train Our Own Instructors"
 NRL_wd_air_own_instructors_desc:0 "The government declines the offer and builds an instructor school of its own, sending its best pilots abroad for courses and bringing them back to teach. Progress is slower and less dramatic. Every lesson learned stays inside the air arm, and nobody in the diet has to defend the fees of foreign veterans."
 NRL_wd_air_display:0 "The Aspneset Air Display"
 NRL_wd_air_display_desc:0 "With new bases, new training and the lessons of the Belkan War on paper, the air arm holds a public display over the capital. Recruiting offices fill for the first time in years. The display burns a season's fuel budget in an afternoon, and the pacifist papers count every litre of it."
 NRL_wd_war_news:0 "War Breaks Out Beyond FATO"
 NRL_wd_war_news_desc:0 "In March 1995 Belka goes to war. Nordlands is not a party and shares no border with Belka, but FATO does, and FATO shares one with Nordlands. The government opens a watch room at Aspneset and puts the coastal radars on full shifts. Watching costs fuel, overtime and sleep; ignoring it would cost more."
 NRL_wd_war_insurers:0 "The Insurers Raise Their Rates"
 NRL_wd_war_insurers_desc:0 "Within days of the outbreak, marine insurers raise war-risk premiums on every route that touches the fighting or the Allied supply lanes. Nordlandic shipowners pass the cost on to their customers. The government cannot change the rates, but it can publish them and stop rumour from doing more damage than the war."
 NRL_wd_war_closed:0 "Close the Roadsteads to Warships"
 NRL_wd_war_closed_desc:0 "Nordlandic harbours close to warships of every belligerent except in distress, and merchant ships carrying war cargo are refused bunkers. The policy is strict and even-handed. Shipping houses lose business to ports that ask fewer questions, and both sides of the war suspect Nordlands of favouring the other."
 NRL_wd_war_fuel:0 "Fuel for Every Flag"
 NRL_wd_war_fuel_desc:0 "Nordlandic ports sell fuel and provisions to any merchant ship that pays, whatever flag it flies and wherever it is bound, while warships are still refused. Oil revenue climbs. The houses cheer, the press asks awkward questions about cargo manifests, and insurers watch Nordlandic tankers more closely than before."
 NRL_wd_war_mercy:0 "A Mercy Corridor by Sea"
 NRL_wd_war_mercy_desc:0 "The government offers Nordlandic ships and harbours to carry the wounded, the displaced and relief supplies for any side that asks, under neutral markings and with inspections both sides can witness. It is costly and risky for the crews. It also gives the country a role in the war that nobody can call partisan."
 NRL_wd_war_hull_routing:0 "Route Every Nordlandic Hull"
 NRL_wd_war_hull_routing_desc:0 "The merchant register proves its worth: every Nordlandic ship near the war is known, warned and routed away from the fighting. A new radar and radio station at Havnaraas tracks the ships home. Owners complain about longer voyages. The aim is simple: no Nordlandic crew should become a casualty of somebody else's war."
 NRL_wd_war_air_notices:0 "Joint Notices to Airmen"
 NRL_wd_war_air_notices_desc:0 "The quiet statement with FATO and Wielvakia gets its first test. The three countries share notices to airmen about restricted zones, diverted airliners and unidentified military traffic, so that no civilian aircraft wanders toward the war by mistake. It is technical work that keeps three nervous air forces from surprising each other."
 NRL_wd_war_fallout:0 "Readings from the Waldreich"
 NRL_wd_war_fallout_desc:0 "When nuclear devices detonate in the Waldreich Mountains, Nordlands is spared the blasts but not the fear. Monitoring stations in every district measure air, rain and milk, and the results are published daily. The stations cost little and calm a country that cannot see the thing it is afraid of."
 NRL_wd_war_bunker_fuel:0 "Bunker Fuel for Stranded Hulls"
 NRL_wd_war_bunker_fuel_desc:0 "Neutral ships stranded in Nordlandic harbours by the war cannot buy fuel at any price. The strategic reserve releases bunker fuel at cost so they can sail home, whatever flag they fly. It drains a reserve built for the country's own emergencies, and it fills the harbours with grateful captains who will remember who helped."
 NRL_wd_war_lumen:0 "Peace Signed at Lumen"
 NRL_wd_war_lumen_desc:0 "When the war ends with a treaty signed at Lumen, the Allied nations begin rebuilding what was bombed, and they need steel, fuel and ships. Nordlandic yards and oil houses bid for the work. The orders are welcome, but they tie the country's next few years to other people's reconstruction budgets."
 NRL_wd_war_belkan_terms:0 "A Peace on Belkan Terms"
 NRL_wd_war_belkan_terms_desc:0 "If the war ends on Belkan terms, Nordlands must live with a stronger Belka on the far side of FATO. Trade continues, carefully. The government raises its watch on the frontier, reviews its stores and keeps its opinions out of the newspapers, waiting to learn what the new order expects of small neighbours."
 NRL_wd_war_coup:0 "Officers Who Answer to No Flag"
 NRL_wd_war_coup_desc:0 "At the end of 1995 a group calling itself A World With No Boundaries launches a coup, and the Allied Forces defeat it at Avalon Dam. A movement that rejects every border is a strange threat to a country that has never questioned its own. The government asks quietly whether any Nordlandic officer has been listening."
 NRL_wd_war_report:0 "What the Belkan War Taught"
 NRL_wd_war_report_desc:0 "Nordlandic officers study the war closely: how quickly air power decided battles, how exposed harbours and dams proved, and how a war beyond one neighbour reshaped trade for everyone. A short report recommends better radar, dispersed airfields and trained instructors. It is cheap advice, and the air arm reads every page."
 NRL_wd_sky_almanac:0 "Ulysses in the Almanac"
 NRL_wd_sky_almanac_desc:0 "Since the astronomers' warning of December 1994, the asteroid called Ulysses has appeared in every almanac and newspaper column. Nordlands has no observatory of note and no plan. A small sky watch office collects foreign reports, briefs ministers and answers the public's questions. It costs little and keeps rumour from filling the gap."
 NRL_wd_sky_announced:0 "Aspneset Hears the FCU Verdict"
 NRL_wd_sky_announced_desc:0 "The FCU President's April 1996 statement turns the asteroid from a column in the almanac into an order of business at Aspneset. Eight of the nine districts face the sea, and only the capital lies inland. Ministers convene the sky watch, the harbour masters and the civil engineers, and ask each for a costed plan within the month."
 NRL_wd_sky_hait_observatory:0 "An Observatory Above Hait"
 NRL_wd_sky_hait_observatory_desc:0 "The heights of Hait Mountain suit a telescope and a tracking radar. A small observatory there gives Nordlands its own measurements of the asteroid and, later, of its fragments. The site is hard to reach in winter and expensive to staff. It also trains engineers in tracking, a skill with many other uses."
 NRL_wd_sky_shelters:0 "Rock Shelters Under the Cities"
 NRL_wd_sky_shelters_desc:0 "Engineers propose shelters dug under Aspneset, Djurseryd, Nyboholm and the larger harbour towns, stocked for weeks. Concrete and tunnelling crews are diverted from every other project. If fragments fall near a city, the shelters save lives that no warning could. If they fall far away, the country has dug tunnels it must maintain for decades."
 NRL_wd_sky_evacuation:0 "An Evacuation Timetable"
 NRL_wd_sky_evacuation_desc:0 "Planners prefer timetables to tunnels. Every coastal district gets an evacuation plan with assigned trains, buses and ferries and marked routes inland, rehearsed twice a year. The rehearsals disrupt daily life. If the fragments come with notice the plan works, and if they come without it the timetable is waste paper."
 NRL_wd_sky_stores:0 "Grain and Fuel for a Dark Year"
 NRL_wd_sky_stores_desc:0 "Astronomers warn that a large impact anywhere could darken skies and ruin harvests far away. The state buys grain, seed and fuel for a full year and stores it in every district. Prices rise while the purchases last, and farmers grumble that the state bought abroad. Nobody wants to need the stores."
 NRL_wd_sky_radio_wardens:0 "Radio Wardens in Every District"
 NRL_wd_sky_radio_wardens_desc:0 "If the networks fail on the night of the impact, the country still needs to talk. Volunteer radio wardens in every district, with battery sets and fixed schedules, relay orders and reports to the capital. Amateur radio clubs supply most of the volunteers, and they enjoy being taken seriously for once."
 NRL_wd_sky_roche:0 "Ulysses Crosses the Limit"
 NRL_wd_sky_roche_desc:0 "On 8 July 1999 Ulysses passes through the Earth's Roche limit. Nordlanders follow the night on the radio, from shelters or along evacuation routes, depending on what their government chose. Whatever falls and wherever it falls, the country has its plans, its stores and its wardens in place."
 NRL_wd_sky_relief:0 "Relief Ships for the Stricken"
 NRL_wd_sky_relief_desc:0 "Wherever the fragments have done harm, people need food, medicine and shelter, and Nordlands has ships, fuel and stores to spare. A relief shipping office charters merchant hulls under neutral markings and loads them from the district stores. It costs the treasury, and earns goodwill that will outlast the century."
 NRL_wd_sky_debris:0 "Tracking Debris in Orbit"
 NRL_wd_sky_debris_desc:0 "After Osea and Yuktobania agree in October 1999 to convert the Arkbird into a platform for clearing debris from satellite orbits, Nordlandic tracking stations offer their measurements to the effort. It is a modest contribution. It gives the country's engineers a seat in international work and a reason to keep their equipment current."
 NRL_wd_sky_storehouses:0 "Shelters into Storehouses"
 NRL_wd_sky_storehouses_desc:0 "With the night of the Roche limit past, the rock shelters stand empty. Leasing their dry, cool tunnels as storehouses for food, medicines and archives recovers part of their cost and keeps them maintained. The civil defence services keep the right to reclaim them within hours, and rehearse doing so every spring."
 NRL_wd_sky_coast_roads:0 "Evacuation Roads Kept Open"
 NRL_wd_sky_coast_roads_desc:0 "The evacuation routes built for Ulysses are worth keeping. Oregonen gets the first permanent upgrade, turning temporary routes inland into proper roads with bridges rated for heavy trucks. It costs money the impact no longer justifies, and leaves the coastal districts better connected than they have ever been."
 NRL_wd_cent_review:0 "Ten Years in Review"
 NRL_wd_cent_review_desc:0 "A decade after the crown first took stock, an independent commission reviews how the principality governs itself and what its choices have cost. Its members include judges, harbour officials and district deputies chosen by lot. The review sets the agenda for the new century, and every faction has already drafted its response."
 NRL_wd_cent_cabinet:0 "The Cabinet Charter in Writing"
 NRL_wd_cent_cabinet_desc:0 "Ten years of cabinet government become a written constitution: the crown's duties, the cabinet's responsibility, the diet's powers and the courts' right to review laws. Drafting takes two sessions and several compromises. Once ratified, no future government can quietly reverse the arrangement without asking the diet first."
 NRL_wd_cent_privy:0 "The Privy Office Codified"
 NRL_wd_cent_privy_desc:0 "The privy office's powers, so far exercised by custom and decree, are codified in a single statute. Officials know the limits of their authority, and the diet knows what it may still question. Codification makes the office harder to challenge and easier to predict, and both qualities help investors more than ideologues."
 NRL_wd_cent_diet:0 "A Diet Elected by District"
 NRL_wd_cent_diet_desc:0 "The diet government reforms its own elections so that each of the nine districts returns members in proportion to its people, with a guaranteed minimum for the smallest. The Nord Peninsula finally has a voice to match its oil. Larger districts complain about the weighting, and the reform takes a full session to pass."
 NRL_wd_cent_houses:0 "Houses That Answer for Prices"
 NRL_wd_cent_houses_desc:0 "After a decade of rule by chartered houses, a price commission begins to publish what the houses charge for fuel, freight and harbour services, and to cap the worst abuses. The houses accept it rather than face anger in the harbour towns. Profits narrow, legitimacy improves, and both sides claim victory."
 NRL_wd_cent_oath:0 "The Oath Renewed Before the Diet"
 NRL_wd_cent_oath_desc:0 "The officers who swore the new oath a decade ago renew it before the diet whose recall began the reforms, in a ceremony broadcast to every district. It changes no law. It reminds a generation that has known only calm that its government rests on promises kept in public, and that such promises can lapse."
 NRL_wd_cent_open_accounts:0 "Ten Years of the Civil List"
 NRL_wd_cent_open_accounts_desc:0 "Publishing the civil list became a habit, and the habit now extends to every ministry: salaries, contracts and grants above a modest threshold are printed each year. Officials grumble about journalists. Contractors learn that inflated invoices will be read by their competitors, and prices quietly fall."
 NRL_wd_cent_district_budgets:0 "District Budgets Made Permanent"
 NRL_wd_cent_district_budgets_desc:0 "The district councils have proven their worth, and their budgets are made permanent with a guaranteed share of national revenue. Tenese uses its first secure allocation to rebuild the coast road beyond Nyboholm. The capital gives up some control over spending, and the districts gain the confidence to plan beyond one year."
 NRL_wd_cent_second_works:0 "A Second National Works Plan"
 NRL_wd_cent_second_works_desc:0 "The ministry of works launches a second national plan, starting with the Tenese coast road, which it plans, funds and builds from Aspneset to one national standard. The work is fast and uniform. Local complaints are logged, answered by letter and rarely acted upon, which the ministry calls efficiency."
 NRL_wd_cent_trade_zone:0 "A Frontier Trade Zone"
 NRL_wd_cent_trade_zone_desc:0 "A decade of open crossings has made the frontier districts the most commercial in the country. A trade zone with simplified duties and shared warehouses at the crossings formalises what traders already do. It changes no border. It does make Nordlandic prosperity depend on the good behaviour of two neighbours."
 NRL_wd_cent_frontier_police:0 "A Frontier Police Service"
 NRL_wd_cent_frontier_police_desc:0 "A decade of guarded crossings has produced a corps of experienced customs police. Merging them into a single frontier police service, with its own training school and career ladder, makes the arrangement permanent. It costs salaries and pensions. Smugglers find the frontier harder to cross, and honest traders find it no easier."
 NRL_wd_cent_accord_holds:0 "The Accord Holds"
 NRL_wd_cent_accord_holds_desc:0 "Years after the districts signed their accord, no district has walked out of it and no budget has been held hostage. The treasury marks the anniversary by funding a modest round of works in every district at once. It is not a dramatic occasion, and quiet occasions are exactly what the accord was meant to produce."
 NRL_wd_dist_books:0 "Order Books for a New Century"
 NRL_wd_dist_books_desc:0 "At the turn of the century the yards and the oil houses review their order books together for the first time, with the treasury and the admiralty in the room. Each industry learns what the others expect over the next five years. The exercise is overdue, and several managers discover they have been courting the same customers."
 NRL_wd_dist_merchant:0 "Tankers for a Wider Market"
 NRL_wd_dist_merchant_desc:0 "The yards that chose foreign owners a decade ago now have a reputation, and tanker orders arrive from every ocean as freight rates climb. The yards specialise in mid-sized tankers built quickly and to price. It is good business while it lasts, and every yard manager knows that booms end."
 NRL_wd_dist_navy:0 "A Second Escort Series"
 NRL_wd_dist_navy_desc:0 "The escort class the navy ordered in the nineties is ageing, and the yards that built it are ready for a second class with better sensors and longer range. Steady naval orders keep the workforce together through any shipping slump. The treasury pays, as it always has for this model."
 NRL_wd_dist_repair:0 "Refits for Foreign Fleets"
 NRL_wd_dist_repair_desc:0 "Merchant hulls worn by long voyages need refits, and the repair basins built in the nineties are among the best equipped in the region. Owners from many nations book months ahead. The yards accept only commercial hulls, which keeps the country out of anyone's war and inside everyone's order book."
 NRL_wd_dist_crown_oil:0 "Shares in the Crown Oil Company"
 NRL_wd_dist_crown_oil_desc:0 "The crown oil company sells a minority of its shares to Nordlandic savers and keeps control with the state. The sale raises capital for new wells as prices climb, and it gives thousands of families a stake in the peninsula. Shareholders now attend meetings, and they ask harder questions than ministers ever did."
 NRL_wd_dist_royalties:0 "Royalty Courts for the Peninsula"
 NRL_wd_dist_royalties_desc:0 "Licensed drillers and the state have argued for a decade over how royalties are measured. Royalty courts with technical assessors settle disputes quickly and publish their rulings. Drillers pay what they owe more promptly. The peninsula towns, which receive a share, see their revenues become predictable at last."
 NRL_wd_dist_fund:0 "The Fund Pays Its First Dividend"
 NRL_wd_dist_fund_desc:0 "The oil savings fund has grown large enough to pay a modest annual dividend into long-term works without touching its capital. The first payment rebuilds schools and harbour walls across the districts. Politicians already argue about raising the payout, and the fund's trustees already argue back."
 NRL_wd_dist_news:0 "Erusea Invades San Salvacion"
 NRL_wd_dist_news_desc:0 "When Erusea invades the neutral country of San Salvacion, a war begins on the Usean continent. It is an ocean away from Nordlands, yet tanker routes, insurance rates and fuel prices answer to it within weeks. Shipowners call the admiralty for guidance, and the oil houses call the treasury for permission."
 NRL_wd_dist_charter_abroad:0 "Charter Our Tankers Abroad"
 NRL_wd_dist_charter_abroad_desc:0 "Nordlandic tankers are chartered to carry fuel for neutral buyers far from the fighting, at freight rates the war has driven up. No cargo goes to a belligerent. Owners have their best years in memory, and the treasury taxes them accordingly. Crews sail longer routes, and the insurers watch every voyage."
 NRL_wd_dist_tankers_home:0 "Keep the Tankers in Home Waters"
 NRL_wd_dist_tankers_home_desc:0 "The government asks owners to keep the tanker fleet on home and regional routes, supplying Nordlandic harbours and neighbours at stable prices. Owners lose the war premium and complain loudly. The country keeps its fuel cheap and its ships close, and nobody abroad can say that Nordlandic oil fed the war."
 NRL_wd_dist_averted:0 "A War That Did Not Come"
 NRL_wd_dist_averted_desc:0 "Talks keep Erusea from war, and the expected surge in freight rates never arrives. Shipowners who bought tankers on credit are left with idle hulls. The treasury helps them through a lean year, and the admiralty notes with relief that its convoy plans can stay in their drawers."
 NRL_wd_dist_close_books:0 "The Balance Sheet of 2005"
 NRL_wd_dist_close_books_desc:0 "At the end of the programme's first era the treasury prints a balance sheet of the principality: its yards, wells, frontier, fleet and nine districts, and what each has cost. It is a baseline for whoever governs next. It promises nothing about the years ahead, which the region has taught everyone to respect."
 NRL_wd_dist_close_books_tt_1:0 "Closes the 1991 to 2005 programme; later eras are written separately."
 ac_wd_nrl_tree:0 "Nordlands: National Programme"
 ac_wd_nrl_tree_desc:0 "The national focus programme of Nordlands, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 NRL_wd_office_review:0 "The Crown Under Review"
 NRL_wd_office_review_desc:0 "The Office of the Crown is taking stock of its own powers, and every faction waits on the result."
 NRL_wd_cabinet_charter:0 "The Cabinet Charter"
 NRL_wd_cabinet_charter_desc:0 "A cabinet drawn from the diet runs the ministries; the crown acts on its advice."
 NRL_wd_privy_seals:0 "Seals Kept at Aspneset"
 NRL_wd_privy_seals_desc:0 "The Office of the Crown keeps the seals, the budget and senior appointments."
 NRL_wd_diet_mandate:0 "The Diet Mandate"
 NRL_wd_diet_mandate_desc:0 "The diet chooses the government; the crown keeps ceremony and the oath."
 NRL_wd_harbour_houses:0 "Rule of the Harbour Houses"
 NRL_wd_harbour_houses_desc:0 "Chartered shipping, yard and oil houses govern by commission under crown patronage."
 NRL_wd_written_constitution:0 "A Written Constitution"
 NRL_wd_written_constitution_desc:0 "Cabinet government set down in one ratified text with judicial review."
 NRL_wd_codified_office:0 "The Codified Privy Office"
 NRL_wd_codified_office_desc:0 "The privy office governs under a single statute that fixes its powers."
 NRL_wd_district_diet:0 "A Diet of Nine Districts"
 NRL_wd_district_diet_desc:0 "Every district returns members in proportion to its people, with a floor for the smallest."
 NRL_wd_chartered_houses:0 "Houses Under a Price Commission"
 NRL_wd_chartered_houses_desc:0 "The governing houses publish and cap what they charge for fuel, freight and berths."
 NRL_wd_open_accounts:0 "Open Public Accounts"
