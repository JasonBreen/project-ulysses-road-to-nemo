 OSE_snc_guarantor_limits_protocol:0 "Name Who May Amend It"
 OSE_snc_guarantor_limits_protocol_desc:0 "An amendment arrives with the original authorization number and an additional paragraph. The receiving office cannot tell whether it replaces the earlier promise or adds another one. Require a named amending authority and open a fresh review of the selected responsibility. The period already described in an old report cannot answer for this new instruction. The committee will wait for the corresponding funded work to be completed after its request, then compare the actual receiving return with the undertaking that somebody was willing to sign at the beginning."
 OSE_snc_guarantor_limits_protocol_requirements_tt:0 "From 2006.1.1, an active national administration and the required earlier work are available. The selected policy remains exclusive; conclusions remain available when their real prerequisites finish after the expected calendar."
 OSE_snc_guarantor_limits_protocol_effect_tt:0 "Open a fresh review request. Complete the corresponding selected-lane SNP service after this request; existing payments and national reservations remain owned by that service."
 OSE_snc_guarantor_limits_review:0 "Compare Promise and Return"
 OSE_snc_guarantor_limits_review_desc:0 "The receiving report includes the cancelled window that started the dispute. It also records a delivery that reached its intended office without emergency intervention. The committee declines to average the two into a statement that everything is satisfactory. Ask which part of the undertaking worked, which cost was accepted, and whether an official changed the condition while somebody else was already relying on it. Only a genuinely completed period belongs in this review. Its uncomfortable details are the reason to conduct an assessment rather than simply renew the original wording."
 OSE_snc_guarantor_limits_review_requirements_tt:0 "From 2006.1.1, an active national administration and the required earlier work are available. A corresponding selected-lane funded service must have genuinely completed after this branch requested its review."
 OSE_snc_guarantor_limits_review_effect_tt:0 "Record the corresponding genuinely completed funded period after this branch requested it."
