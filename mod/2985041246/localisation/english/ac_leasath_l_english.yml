 LEA_le_mines_service_1_spirit:0 "Audit the Royalties"
 LEA_le_mines_service_1_spirit_desc:0 "The ministry of mines maintains this funded service for ninety days. Audit one year's royalties against the mines' production. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 LEA_le_mines_service_1:0 "Audit the Royalties"
 LEA_le_mines_service_1_desc:0 "Audit one year's royalties against the mines' production.\n\nThe ministry of mines must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
 LEA_le_mines_service_2_spirit:0 "Train Mine Inspectors"
 LEA_le_mines_service_2_spirit_desc:0 "The mining inspectorate maintains this funded service for ninety days. Train inspectors to check safety and output at the concessions. Political authority, institutional capacity and the applicable programme fee were committed at authorization."
 LEA_le_mines_service_2:0 "Train Mine Inspectors"
 LEA_le_mines_service_2_desc:0 "Train inspectors to check safety and output at the concessions.\n\nThe mining inspectorate must complete ninety uninterrupted days. One service may operate nationally; completed periods begin a ninety-day cooldown. War, capitulation, annexation or early cancellation ends the period without completion credit. Spent funding is retained. The latest service return appears in the category description."
