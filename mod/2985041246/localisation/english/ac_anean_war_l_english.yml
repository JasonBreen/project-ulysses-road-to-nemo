 ac_eew_eva_services:0 "Estovakia: The Emmeria-Estovakia War"
 ac_eew_eva_services_desc:0 "[ac_eew_status_text]\n\n[ac_eew_current_service_text]\n[ac_eew_cooldown_text]\nService [?ac_eew_elapsed|0]/90 days, [?ac_eew_completed_services|0] completed, last period [?ac_eew_last_delivered_days|0] days.\n\n[EVA_government_ac_eew_policy_line][EVA_logistics_ac_eew_policy_line][EVA_chandelier_ac_eew_policy_line][EVA_occupation_ac_eew_policy_line][EVA_aftermath_ac_eew_policy_line][EVA_republic_ac_eew_policy_line][ac_eew_fee_text]"
 EVA_ew_cancel_service:0 "End the Current Service Period"
 EVA_ew_cancel_service_desc:0 "Release the current rota immediately. Funding and institutional effort already spent are not refunded. Delivered time is retained in the record, but the interrupted period cannot unlock a completed-service review."
 EMM_ew_opening_public_spirit:0 "Emmeria: An Open Hearing"
 EMM_ew_opening_public_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 EMM_ew_opening_ministerial_spirit:0 "Emmeria: A Ministerial Docket"
 EMM_ew_opening_ministerial_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ac_eew.50.t:0 "Sixteen Years After Ulysses"
 ac_eew.50.d:0 "The cabinet meets with the records the recovery years have left: the registers, the shelter refits, the aid sent across the border during Estovakia's civil war and the agreements with its neighbours.\n\n[EMM_ew_route_context]\n\nThe question before the cabinet is what the republic owes its people if the peace of the recovery years ends, and how much of that answer to give in public."
 ac_eew.50.a:0 "Open the records to public questions."
 ac_eew.50.b:0 "Begin with a protected cabinet docket."
 EVA_ew_opening_public_spirit:0 "Estovakia: An Open Hearing"
 EVA_ew_opening_public_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 EVA_ew_opening_ministerial_spirit:0 "Estovakia: A Ministerial Docket"
 EVA_ew_opening_ministerial_spirit_desc:0 "Staff support the chosen opening review for ninety days. Its continuing political attention or civilian reservation remains a real cost."
 ac_eew.51.t:0 "The Federation After the Civil War"
 ac_eew.51.d:0 "The federation's ministries meet with the records the civil war left: the factions' accounts, the damaged provinces, the aircraft industry and the unfinished projects the war kept alive.\n\n[EVA_ew_route_context]\n\nThe question before the government is what the federation will be in the years after its civil war, and how much of that decision to make where its neighbours can see it."
 ac_eew.51.a:0 "Open the records to public questions."
 ac_eew.51.b:0 "Begin with a protected cabinet docket."
 EMM_evacuation_ac_eew_policy_callback_0:0 "The standing policy is evacuation by district. Its continuing cost remains part of the allocation."
 EMM_evacuation_ac_eew_policy_callback_1:0 "The standing policy is shelter in place. Its continuing cost remains part of the allocation."
 EMM_ew_evacuation_reply_public_spirit:0 "Open the Evacuation Registers: Public Return"
 EMM_ew_evacuation_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Move one district's registered population along its named route and back. Public attention or reserved staff time remains committed to that work."
 EMM_ew_evacuation_reply_protected_spirit:0 "Open the Evacuation Registers: Protected Working Return"
 EMM_ew_evacuation_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Keep the western corridor's reserve trains crewed and timetabled. Public attention or reserved staff time remains committed to that work."
 ac_eew.60.t:0 "A Register That Is Out of Date"
 ac_eew.60.d:0 "The first exercise has found that a third of the names in one district's register belong to people who moved away years ago, and that the new tower blocks by the harbour are missing entirely.\n\nThe interior ministry wants to publish the error rates for every district and ask citizens to check their own entries. The security service would prefer to correct the registers quietly: a published list of how many people the state cannot find is a list an enemy can read too.\n\n[EMM_evacuation_ac_eew_policy_callback]"
 ac_eew.60.a:0 "Publish the error rates and ask citizens to check."
 ac_eew.60.b:0 "Correct the registers quietly."
 EMM_evacuation_ac_eew_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EMM_evacuation_ac_eew_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EMM_evacuation_ac_eew_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_eew.90.t:0 "A Population Accounted For"
 ac_eew.90.d:0 "The final review lists every district with the people it registers, the route or shelter assigned and the result of its last exercise. The harbour towers are in the register now.\n\nNobody in the review mentions a war. The plan exists so that, if one comes, nobody has to invent it.\n\n[EMM_evacuation_ac_eew_report_callback]\n\n[EMM_evacuation_ac_eew_policy_callback]"
 ac_eew.90.a:0 "File the completed service record."
 EMM_administration_ac_eew_policy_callback_0:0 "The standing policy is government in exile abroad. Its continuing cost remains part of the allocation."
 EMM_administration_ac_eew_policy_callback_1:0 "The standing policy is government in the western provinces. Its continuing cost remains part of the allocation."
 EMM_ew_administration_reply_public_spirit:0 "Govern From the West: Public Return"
 EMM_ew_administration_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Staff and fund the ministries operating from the western provinces. Public attention or reserved staff time remains committed to that work."
 EMM_ew_administration_reply_protected_spirit:0 "Govern From the West: Protected Working Return"
 EMM_ew_administration_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Pay the salaries and pensions of civil servants displaced from the capital. Public attention or reserved staff time remains committed to that work."
 ac_eew.61.t:0 "The Mayor Who Stayed"
 ac_eew.61.d:0 "A district mayor in occupied Gracemeria has kept her office open under the occupation, issuing ration cards and birth certificates on the republic's own forms. The occupation authorities tolerate her; the republic's cabinet cannot decide whether she is a patriot or a collaborator.\n\nThe interior ministry wants to recognise her work publicly as service to the republic. The security service wants nothing said: whatever the cabinet announces will reach the occupation authorities within a day.\n\n[EMM_administration_ac_eew_policy_callback]"
 ac_eew.61.a:0 "Recognise her service publicly."
 ac_eew.61.b:0 "Say nothing and keep her on the payroll."
 EMM_administration_ac_eew_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EMM_administration_ac_eew_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EMM_administration_ac_eew_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_eew.91.t:0 "The Republic Still Governs"
 ac_eew.91.d:0 "The final review is a ledger of the ministries' work in the western provinces: salaries paid, schools opened, permits issued, complaints answered. Some entries carry an occupied district's name.\n\nThe mayor who stayed is in the ledger, with the decision the cabinet took about her and the reasons it gave.\n\n[EMM_administration_ac_eew_report_callback]\n\n[EMM_administration_ac_eew_policy_callback]"
 ac_eew.91.a:0 "File the completed service record."
 EMM_reserve_ac_eew_policy_callback_0:0 "The standing policy is reserve of volunteers. Its continuing cost remains part of the allocation."
 EMM_reserve_ac_eew_policy_callback_1:0 "The standing policy is reserve by call-up. Its continuing cost remains part of the allocation."
 EMM_ew_reserve_reply_public_spirit:0 "Form the Western Reserve: Public Return"
 EMM_ew_reserve_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Train one cycle of recruits at the western bases. Public attention or reserved staff time remains committed to that work."
 EMM_ew_reserve_reply_protected_spirit:0 "Form the Western Reserve: Protected Working Return"
 EMM_ew_reserve_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Equip and supply the reserve's depots in the western provinces. Public attention or reserved staff time remains committed to that work."
 ac_eew.62.t:0 "Instructors From the Front"
 ac_eew.62.d:0 "The training command asks for fifty experienced officers to be withdrawn from the front line to teach. The front commanders answer that the line will not hold without them.\n\nThe defence minister can order the transfer and publish the reasons, or leave the decision to the commanders and accept whatever the training command receives.\n\n[EMM_reserve_ac_eew_policy_callback]"
 ac_eew.62.a:0 "Order the transfer and publish the reasons."
 ac_eew.62.b:0 "Leave it to the front commanders."
 EMM_reserve_ac_eew_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EMM_reserve_ac_eew_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EMM_reserve_ac_eew_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_eew.92.t:0 "A Reserve That Answered"
 ac_eew.92.d:0 "The final review lists the reserve's units with their training records and the date each went forward. Beside each is the number of instructors it took to train them.\n\nThe front held, in the places it held. The review does not claim the reserve was the reason, only that it was there.\n\n[EMM_reserve_ac_eew_report_callback]\n\n[EMM_reserve_ac_eew_policy_callback]"
 ac_eew.92.a:0 "File the completed service record."
 EMM_airforce_ac_eew_policy_callback_0:0 "The standing policy is fighters first. Its continuing cost remains part of the allocation."
 EMM_airforce_ac_eew_policy_callback_1:0 "The standing policy is bases first. Its continuing cost remains part of the allocation."
 EMM_ew_airforce_reply_public_spirit:0 "Reconstitute the Air Force: Public Return"
 EMM_ew_airforce_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Find, supply and reorganise one scattered squadron. Public attention or reserved staff time remains committed to that work."
 EMM_ew_airforce_reply_protected_spirit:0 "Reconstitute the Air Force: Protected Working Return"
 EMM_ew_airforce_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Repair runways, fuel stores and shelters at one western base. Public attention or reserved staff time remains committed to that work."
 ac_eew.63.t:0 "A Squadron With No Aircraft"
 ac_eew.63.d:0 "One squadron that escaped the capital has its pilots, its ground crew and its colours, but no aircraft that can fly. Another squadron has six serviceable aircraft and three pilots.\n\nThe air staff proposes merging them under the second squadron's commander and publishing the order. The first squadron's crews have asked to keep their own name and wait for new aircraft.\n\n[EMM_airforce_ac_eew_policy_callback]"
 ac_eew.63.a:0 "Merge the squadrons and publish the order."
 ac_eew.63.b:0 "Keep both names and wait for aircraft."
 EMM_airforce_ac_eew_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EMM_airforce_ac_eew_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EMM_airforce_ac_eew_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_eew.93.t:0 "An Air Force Rebuilt"
 ac_eew.93.d:0 "The final review is the new order of battle: squadrons, aircraft, bases and crews, each with the date it returned to service. The merged squadron is listed under both names.\n\nThe review records what the air force had on its last day. What it did with it is in the war's own record.\n\n[EMM_airforce_ac_eew_report_callback]\n\n[EMM_airforce_ac_eew_policy_callback]"
 ac_eew.93.a:0 "File the completed service record."
 EMM_liberation_ac_eew_policy_callback_0:0 "The standing policy is return with terms. Its continuing cost remains part of the allocation."
 EMM_liberation_ac_eew_policy_callback_1:0 "The standing policy is return without terms. Its continuing cost remains part of the allocation."
 EMM_ew_liberation_reply_public_spirit:0 "Plan the Return to Gracemeria: Public Return"
 EMM_ew_liberation_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Repair water, power and transport in the capital's occupied districts. Public attention or reserved staff time remains committed to that work."
 EMM_ew_liberation_reply_protected_spirit:0 "Plan the Return to Gracemeria: Protected Working Return"
 EMM_ew_liberation_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Restaff and resupply the capital's hospitals. Public attention or reserved staff time remains committed to that work."
 ac_eew.64.t:0 "The Occupation's Paperwork"
 ac_eew.64.d:0 "The occupation authorities left their files behind: requisitions, arrests, the names of those who worked for them and those who did not. Every family in the occupied districts wants to know what is in them.\n\nThe justice ministry wants the files opened to the people named in them. The interior ministry wants them sealed until courts can examine them, before old neighbours start settling accounts on their own.\n\n[EMM_liberation_ac_eew_policy_callback]"
 ac_eew.64.a:0 "Open the files to the people named in them."
 ac_eew.64.b:0 "Seal the files for the courts."
 EMM_liberation_ac_eew_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EMM_liberation_ac_eew_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EMM_liberation_ac_eew_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_eew.94.t:0 "A Capital Restored"
 ac_eew.94.d:0 "The final review lists the capital's districts with the date each regained water, power and a working school. The last entry is a district by the harbour that waited longest.\n\nThe occupation files are where the cabinet decided to put them. The review says where, and who decided.\n\n[EMM_liberation_ac_eew_report_callback]\n\n[EMM_liberation_ac_eew_policy_callback]"
 ac_eew.94.a:0 "File the completed service record."
 EMM_peace_ac_eew_policy_callback_0:0 "The standing policy is joint border commission. Its continuing cost remains part of the allocation."
 EMM_peace_ac_eew_policy_callback_1:0 "The standing policy is watchful border. Its continuing cost remains part of the allocation."
 EMM_ew_peace_reply_public_spirit:0 "Record the Peace That Held: Public Return"
 EMM_ew_peace_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Convene the joint commission on the quarter's border incidents. Public attention or reserved staff time remains committed to that work."
 EMM_ew_peace_reply_protected_spirit:0 "Record the Peace That Held: Protected Working Return"
 EMM_ew_peace_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Staff the reopened border crossings with customs and health officers. Public attention or reserved staff time remains committed to that work."
 ac_eew.65.t:0 "A Shot Across the River"
 ac_eew.65.d:0 "A border patrol reports that a shot was fired across the river from the Estovakian side. Nobody was hurt. The Estovakian border service says it was a hunter.\n\nThe foreign ministry wants to raise it at the next commission session and publish the answer. The defence ministry wants to double the patrols and say nothing until it knows more.\n\n[EMM_peace_ac_eew_policy_callback]"
 ac_eew.65.a:0 "Raise it at the commission and publish the answer."
 ac_eew.65.b:0 "Double the patrols and wait."
 EMM_peace_ac_eew_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EMM_peace_ac_eew_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EMM_peace_ac_eew_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_eew.95.t:0 "A Peace That Held"
 ac_eew.95.d:0 "The final review lists every incident on the border since the war did not come, with what each government said about it. The hunter's shot is there, with the commission's finding.\n\nThe list is longer than anyone wanted. None of its entries became a war.\n\n[EMM_peace_ac_eew_report_callback]\n\n[EMM_peace_ac_eew_policy_callback]"
 ac_eew.95.a:0 "File the completed service record."
 EVA_government_ac_eew_policy_callback_0:0 "The standing policy is rule by the general staff. Its continuing cost remains part of the allocation."
 EVA_government_ac_eew_policy_callback_1:0 "The standing policy is rule by the cabinet. Its continuing cost remains part of the allocation."
 EVA_ew_government_reply_public_spirit:0 "Form the War Government: Public Return"
 EVA_ew_government_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Prepare and deliver one month's report on the war to the assembly. Public attention or reserved staff time remains committed to that work."
 EVA_ew_government_reply_protected_spirit:0 "Form the War Government: Protected Working Return"
 EVA_ew_government_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Issue and record the war government's decrees for one period. Public attention or reserved staff time remains committed to that work."
 ac_eew.66.t:0 "A Report the Staff Will Not Sign"
 ac_eew.66.d:0 "The month's report to the assembly lists casualties higher than the general staff has announced. The staff refuses to sign it; the cabinet secretary refuses to send it unsigned.\n\nThe cabinet can send the report as written, with the staff's objection attached, or accept the staff's figures and send a shorter report.\n\n[EVA_government_ac_eew_policy_callback]"
 ac_eew.66.a:0 "Send the report with the objection attached."
 ac_eew.66.b:0 "Send the shorter report."
 EVA_government_ac_eew_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EVA_government_ac_eew_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EVA_government_ac_eew_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_eew.96.t:0 "Who Governed the War"
 ac_eew.96.d:0 "The final review lists the war government's decisions with the name of the body that took each one. Some decisions have two names; a few have none.\n\nThe unsigned report is in the file, with the figures that turned out to be right.\n\n[EVA_government_ac_eew_report_callback]\n\n[EVA_government_ac_eew_policy_callback]"
 ac_eew.96.a:0 "File the completed service record."
 EVA_logistics_ac_eew_policy_callback_0:0 "The standing policy is central depots. Its continuing cost remains part of the allocation."
 EVA_logistics_ac_eew_policy_callback_1:0 "The standing policy is dispersed workshops. Its continuing cost remains part of the allocation."
 EVA_ew_logistics_reply_public_spirit:0 "Rebuild the Maintenance Base: Public Return"
 EVA_ew_logistics_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Overhaul one cycle of aircraft at the depots. Public attention or reserved staff time remains committed to that work."
 EVA_ew_logistics_reply_protected_spirit:0 "Rebuild the Maintenance Base: Protected Working Return"
 EVA_ew_logistics_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Train one class of ground crews in the standard course. Public attention or reserved staff time remains committed to that work."
 ac_eew.67.t:0 "Engineers From Abroad"
 ac_eew.67.d:0 "The Super Weapons record says the Aigaion was designed on technology brought by Belkan refugees who fled to Estovakia. The maintenance command wants to hire more of them and their students; the security service wants every foreign engineer vetted first.\n\nThe ministry can publish the hiring rules and the vetting standard together, or let the security service vet each engineer in private.\n\n[EVA_logistics_ac_eew_policy_callback]"
 ac_eew.67.a:0 "Publish the hiring and vetting rules."
 ac_eew.67.b:0 "Vet each engineer in private."
 EVA_logistics_ac_eew_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EVA_logistics_ac_eew_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EVA_logistics_ac_eew_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_eew.97.t:0 "A Fleet That Can Fly"
 ac_eew.97.d:0 "The final review lists the depots, the workshops and the crews trained, with the number of aircraft each kept in the air. The foreign engineers are in the list, with their vetting results.\n\nThe review records what the federation can maintain. What it chooses to build is decided elsewhere.\n\n[EVA_logistics_ac_eew_report_callback]\n\n[EVA_logistics_ac_eew_policy_callback]"
 ac_eew.97.a:0 "File the completed service record."
 EVA_chandelier_ac_eew_policy_callback_0:0 "The standing policy is finished for its first purpose. Its continuing cost remains part of the allocation."
 EVA_chandelier_ac_eew_policy_callback_1:0 "The standing policy is finished as a weapon. Its continuing cost remains part of the allocation."
 EVA_ew_chandelier_reply_public_spirit:0 "Reopen the Chandelier Files: Public Return"
 EVA_ew_chandelier_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Fund one period of construction on the railgun's mount and power plant. Public attention or reserved staff time remains committed to that work."
 EVA_ew_chandelier_reply_protected_spirit:0 "Reopen the Chandelier Files: Protected Working Return"
 EVA_ew_chandelier_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Track orbital fragments with the railgun's sensors without firing. Public attention or reserved staff time remains committed to that work."
 ac_eew.68.t:0 "A Target List From the Staff"
 ac_eew.68.d:0 "The general staff has sent the research team a list of ground targets within the railgun's range and asked for firing tables. The team's director answers that the firing rules have not been written.\n\nThe cabinet can publish the firing rules first and send the list back, or let the staff and the director settle it between them.\n\n[EVA_chandelier_ac_eew_policy_callback]"
 ac_eew.68.a:0 "Publish the rules and send the list back."
 ac_eew.68.b:0 "Let the staff and the director settle it."
 EVA_chandelier_ac_eew_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EVA_chandelier_ac_eew_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EVA_chandelier_ac_eew_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_eew.98.t:0 "Rules Before the First Shot"
 ac_eew.98.d:0 "The final review records the Chandelier's purpose and its firing rules as adopted: who orders, what may be targeted and what record each order leaves. The general staff's list is in the appendix.\n\nThe railgun is closer to completion than it has been since the asteroid fell. The rules apply to whoever holds it.\n\n[EVA_chandelier_ac_eew_report_callback]\n\n[EVA_chandelier_ac_eew_policy_callback]"
 ac_eew.98.a:0 "File the completed service record."
 EVA_occupation_ac_eew_policy_callback_0:0 "The standing policy is humanitarian administration. Its continuing cost remains part of the allocation."
 EVA_occupation_ac_eew_policy_callback_1:0 "The standing policy is martial administration. Its continuing cost remains part of the allocation."
 EVA_ew_occupation_reply_public_spirit:0 "Administer the Occupied Districts: Public Return"
 EVA_ew_occupation_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Administer the occupied districts' food, schools and records for one period. Public attention or reserved staff time remains committed to that work."
 EVA_ew_occupation_reply_protected_spirit:0 "Administer the Occupied Districts: Protected Working Return"
 EVA_ew_occupation_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Audit one period's requisitions against their receipts. Public attention or reserved staff time remains committed to that work."
 ac_eew.69.t:0 "Receipts Nobody Will Honour"
 ac_eew.69.d:0 "The audit office has found thousands of requisition receipts issued by units that no longer exist, for goods the federation has no budget to pay for. The holders of the receipts are queuing outside the civil office.\n\nThe administration can publish the full list and a payment schedule it cannot yet fund, or pay the receipts it can and keep the rest in the file.\n\n[EVA_occupation_ac_eew_policy_callback]"
 ac_eew.69.a:0 "Publish the list and a payment schedule."
 ac_eew.69.b:0 "Pay what can be paid and keep the rest."
 EVA_occupation_ac_eew_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EVA_occupation_ac_eew_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EVA_occupation_ac_eew_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_eew.99.t:0 "An Occupation on Record"
 ac_eew.99.d:0 "The final review lists the occupied districts with the administration each had, the requisitions made and the receipts paid. The unpaid receipts are listed too.\n\nThe record will outlast the occupation. That is what it is for.\n\n[EVA_occupation_ac_eew_report_callback]\n\n[EVA_occupation_ac_eew_policy_callback]"
 ac_eew.99.a:0 "File the completed service record."
 EVA_aftermath_ac_eew_policy_callback_0:0 "The standing policy is transitional government. Its continuing cost remains part of the allocation."
 EVA_aftermath_ac_eew_policy_callback_1:0 "The standing policy is government of the officers. Its continuing cost remains part of the allocation."
 EVA_ew_aftermath_reply_public_spirit:0 "Count the Cost of the Coup: Public Return"
 EVA_ew_aftermath_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Bring one formation home and discharge its conscripts. Public attention or reserved staff time remains committed to that work."
 EVA_ew_aftermath_reply_protected_spirit:0 "Count the Cost of the Coup: Protected Working Return"
 EVA_ew_aftermath_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Hold a public hearing on the war's conduct and costs. Public attention or reserved staff time remains committed to that work."
 ac_eew.70.t:0 "The Architect's Papers"
 ac_eew.70.d:0 "Dvornik's office has been sealed since his death. His papers describe how the invasion was planned and who approved it. Several of the people named are in the new government.\n\nThe transition can publish the papers and let the assembly judge, or hand them to a closed commission that will report in a year.\n\n[EVA_aftermath_ac_eew_policy_callback]"
 ac_eew.70.a:0 "Publish the papers."
 ac_eew.70.b:0 "Hand them to a closed commission."
 EVA_aftermath_ac_eew_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EVA_aftermath_ac_eew_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EVA_aftermath_ac_eew_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_eew.100.t:0 "The Federation After the Coup"
 ac_eew.100.d:0 "The final review lists the government's decisions since the coup, the soldiers brought home and the hearings held. The architect's papers are where the government decided to put them.\n\nThe federation is not the country its last civil war promised. It is one that has started to answer for its war.\n\n[EVA_aftermath_ac_eew_report_callback]\n\n[EVA_aftermath_ac_eew_policy_callback]"
 ac_eew.100.a:0 "File the completed service record."
 EVA_republic_ac_eew_policy_callback_0:0 "The standing policy is federal reconciliation. Its continuing cost remains part of the allocation."
 EVA_republic_ac_eew_policy_callback_1:0 "The standing policy is centralised republic. Its continuing cost remains part of the allocation."
 EVA_ew_republic_reply_public_spirit:0 "Govern After the Civil War: Public Return"
 EVA_ew_republic_reply_public_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Fund one period of reconstruction in a war-damaged province. Public attention or reserved staff time remains committed to that work."
 EVA_ew_republic_reply_protected_spirit:0 "Govern After the Civil War: Protected Working Return"
 EVA_ew_republic_reply_protected_spirit_desc:0 "This ninety-day response supports the chosen reporting procedure. Convene the council of provinces on the period's disputes. Public attention or reserved staff time remains committed to that work."
 ac_eew.71.t:0 "A General Who Wants a War"
 ac_eew.71.d:0 "A general who won the civil war has told a newspaper that Emmeria's prosperity was built while Estovakia burned, and that the federation should take its share. He has a following in the army and in the eastern provinces.\n\nThe government can answer him in public and set out why the federation will not march, or retire him quietly and let the newspaper wonder why.\n\n[EVA_republic_ac_eew_policy_callback]"
 ac_eew.71.a:0 "Answer him in public."
 ac_eew.71.b:0 "Retire him quietly."
 EVA_republic_ac_eew_report_callback_public:0 "The earlier reply opened the return to public questions. The final assessment keeps the unresolved entries visible rather than removing them to produce a cleaner account."
 EVA_republic_ac_eew_report_callback_protected:0 "The earlier reply protected a working return. The final assessment preserves its uncertainties and identifies the office answerable for any later correction."
 EVA_republic_ac_eew_report_callback_unanswered:0 "No first reply was ratified. The final assessment states its reporting duty explicitly instead of inventing a choice that the government never made."
 ac_eew.101.t:0 "A Federation That Did Not March"
 ac_eew.101.d:0 "The final review lists the provinces rebuilt, the council's sessions and the disputes it settled. The general's interview is in the file, with the government's answer.\n\nThe federation that did not march is poorer than the one in the official record thought it would be. It is also at peace.\n\n[EVA_republic_ac_eew_report_callback]\n\n[EVA_republic_ac_eew_policy_callback]"
 ac_eew.101.a:0 "File the completed service record."
 EMM_ew_final_public_spirit:0 "Emmeria: Public Maintenance Assessment"
 EMM_ew_final_public_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 EMM_ew_final_readiness_spirit:0 "Emmeria: Reserved Readiness Return"
 EMM_ew_final_readiness_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 EMM_ew_opening_callback_public:0 "The opening hearing invited public questions. Its final account returns to that promise without pretending that every disagreement has been resolved."
 EMM_ew_opening_callback_ministerial:0 "The opening review began with a protected ministerial docket. Its final account identifies what that process delivered and who must answer for the work still waiting."
 EMM_ew_opening_callback_unanswered:0 "The opening invitation was never ratified. This assessment records that absence and proceeds from the services actually completed."
 ac_eew.120.t:0 "The Republic That Came Home"
 ac_eew.120.d:0 "The cabinet's last review of the period lists what the republic did in the years the official record fills with a war: who it moved, where it governed from, who it trained and what it rebuilt. It names the offices responsible.\n\nEmmeria after this period is not the country its ministers planned in the recovery years. It is one whose government can say what it did, and to whom.\n\n[EMM_ew_opening_callback]"
 ac_eew.120.a:0 "Support a public maintenance review."
 ac_eew.120.b:0 "Reserve staff for a focused readiness return."
 EVA_ew_final_public_spirit:0 "Estovakia: Public Maintenance Assessment"
 EVA_ew_final_public_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 EVA_ew_final_readiness_spirit:0 "Estovakia: Reserved Readiness Return"
 EVA_ew_final_readiness_spirit_desc:0 "The final national assessment supports the chosen return for ninety days. Its political or civilian opportunity cost remains, while the enduring policies retain their own continuing tradeoffs."
 EVA_ew_opening_callback_public:0 "The opening hearing invited public questions. Its final account returns to that promise without pretending that every disagreement has been resolved."
 EVA_ew_opening_callback_ministerial:0 "The opening review began with a protected ministerial docket. Its final account identifies what that process delivered and who must answer for the work still waiting."
 EVA_ew_opening_callback_unanswered:0 "The opening invitation was never ratified. This assessment records that absence and proceeds from the services actually completed."
 ac_eew.121.t:0 "A Federation Accounted For"
 ac_eew.121.d:0 "The government's last review of the period lists the decisions the federation took after its civil war: who governed, what it built, what it occupied and how it ended. Some entries are not to its credit; they are in the list.\n\nThe federation has not become a different country. It has become one whose record can be read in one place.\n\n[EVA_ew_opening_callback]"
 ac_eew.121.a:0 "Support a public maintenance review."
 ac_eew.121.b:0 "Reserve staff for a focused readiness return."
