l_english:
 TER_wd_gov_office_sits:0 "The Crown Office Opens at Karluga"
 TER_wd_gov_office_sits_desc:0 "Terentio governs itself from Karluga with an Office of the Crown, a council of notables and no settled answer to its oldest quarrel: the coast holds almost every voter, while the desert holds almost every barrel. Opening that question in public costs the office its quiet. Leaving it closed would let the oil revenue decide by default."
 TER_wd_gov_apportion:0 "Seats by Head or by Barrel"
 TER_wd_gov_apportion_desc:0 "Before anyone can govern, someone must say how much the desert counts. Seats by population would give the Terentio Desert a handful of deputies; seats weighted by land or revenue would hand it a veto. The clerks print both sums side by side. The figures settle nothing, but they drag three rival answers into the open at once."
 TER_wd_gov_apportion_tt_1:0 "Three answers open from here, and only one of them can be chosen."
 TER_wd_gov_coast_path:0 "Ministers Answer to the Coast Chamber"
 TER_wd_gov_coast_path_desc:0 "The constitutional camp would keep the princely crown and make ministers answer to an elected chamber apportioned by head count. Karluga and the coast plain would carry nearly every vote, and the crown would sign on advice. It is the tidiest answer on paper. The field towns call it government by the coast, paid for by the desert."
 TER_wd_gov_board_path:0 "The Lease Boards Ask for the Seals"
 TER_wd_gov_board_path_desc:0 "The notables who sit on the lease boards and run the field towns argue that a principality living on oil should be governed by people who understand oil. They want the seals held by a board of lease-holders, field managers and treasury officials, with the chamber kept for advice. Revenue would be steady. Karluga would have very few votes."
 TER_wd_gov_union_path:0 "A Union of the Coast and the Desert"
 TER_wd_gov_union_path_desc:0 "A third camp, strongest among the oil crews and the Karluga dock unions, wants a Union of Terentio: an elected council, the princely title retired, and a written formula that divides oil revenue between the two halves before any minister can touch it. The crews cheer. The lease-holders and the officer corps doubt that arithmetic can govern."
 TER_wd_gov_princely_ministry:0 "Seat a Princely Ministry"
 TER_wd_gov_princely_ministry_desc:0 "The largest bloc in the chamber forms a ministry of the Principality of Terentio, collectively responsible and removable by a vote of the deputies. The crown office signs what the ministers bring and keeps its ceremonial duties. Ministers inherit the water queues and the royalty disputes on their first morning, and from now on the press knows exactly whose problems they are."
 TER_wd_gov_fields_board:0 "The Board of Fields and Wells Takes Office"
 TER_wd_gov_fields_board_desc:0 "A board of lease-holders, field managers and senior treasury officials takes the seals, and elections are suspended while it governs by standing order. The chamber survives as an advisory body summoned when the board wishes. Decisions about pipe, pumps and royalties come quickly. Every dry tap in Karluga will now be blamed on the board and on nobody else."
 TER_wd_gov_union_council:0 "Elect the Union Council"
 TER_wd_gov_union_council_desc:0 "The chamber passes the Union law and elects a council from its own benches, with elections fixed on a calendar and the princely title laid aside with honours. The Union of Terentio governs in the name of both halves. Its council must win votes on the coast while keeping the desert crews loyal, which is harder than either camp admitted."
 TER_wd_gov_desert_benches:0 "Reserved Benches for the Desert Districts"
 TER_wd_gov_desert_benches_desc:0 "The ministry reserves a fixed block of chamber seats for the Terentio Desert, whatever its head count, and pairs every desert deputy with a coast deputy on the budget committee. Purists call it a rotten-borough rule. It gives the field towns a voice on water and royalties that cannot simply be outvoted, which was the whole point."
 TER_wd_gov_board_ledger:0 "The Board Prints Its Ledger"
 TER_wd_gov_board_ledger_desc:0 "The board answers its critics with numbers: a monthly ledger of every lease payment, pump order and water delivery, printed and posted in every district office. A ledger is not a vote, and the coast says so loudly. Still, the board can now show where the money went, and its members can no longer hide their dealings from one another."
 TER_wd_gov_union_formula:0 "The Revenue Formula Becomes Law"
 TER_wd_gov_union_formula_desc:0 "The Union council writes its revenue formula into law: fixed shares of every royalty to the desert districts, to Karluga and to the national budget, before any minister may spend a coin. Ministers lose discretion and lenders gain a number they can trust. When the price of crude falls, the formula will divide less money with the same precision."
 TER_wd_gov_gazette:0 "A Gazette Posted in Every District"
 TER_wd_gov_gazette_desc:0 "However Terentio is governed, its orders reach the field towns late or not at all, carried by truck drivers who lose half the post on the mountain road. A printed gazette of every law, lease award and regulation, posted in each district office within ten days, gives the desert the same text the coast reads. Printing is cheap; ignorance stops being an excuse."
 TER_wd_oil_lease_boxes:0 "Open the Boxes of Desert Leases"
 TER_wd_oil_lease_boxes_desc:0 "The leases for the desert fields were written over many years by many offices, and their terms survive in boxes of carbon copies: some expired, some renewed by letter, a few granted twice for the same block. Before Terentio sets any oil policy it has to read them. The reading takes a year and annoys every operator who liked the confusion."
 TER_wd_oil_register:0 "A Public Register of Desert Blocks"
 TER_wd_oil_register_desc:0 "Every block in the desert gets a number, a map, a holder and an expiry date, and the register lies open to anyone who walks into the lands office at Karluga. Operators lose the comfort of private side letters. Investors gain the first reliable picture of what lies under Terentian sand, and the treasury learns which leases have quietly lapsed."
 TER_wd_oil_meters:0 "Sealed Meters at the Wellheads"
 TER_wd_oil_meters_desc:0 "Royalties are still paid on figures the operators report themselves, months after the oil has left the desert. Sealed meters on every producing wellhead, read by inspectors who rotate between fields so that nobody grows too friendly with one operator, put the count where the oil leaves the ground. The meters are expensive, and receipts rise the first quarter they are read."
 TER_wd_oil_audited_books:0 "Audited Books from Every Operator"
 TER_wd_oil_audited_books_desc:0 "In August 1991 the Great Lakes Resource Development Company, financed jointly by Osea and Belka, is found to have been covering up that it was operating at a loss. Terentio has no stake in it, but its own fields are run by operators whose accounts no outsider has examined. Requiring audited books from every leaseholder costs goodwill and fees, and it removes one excuse for the next scandal."
 TER_wd_oil_sliding_royalty:0 "A Royalty That Climbs with the Price"
 TER_wd_oil_sliding_royalty_desc:0 "Private operators keep their blocks and pay a royalty that rises as the crude price rises and eases when it falls. The scheme is simple to collect from metered wells and keeps foreign rigs working in the desert. The principality shares the pain of bad years, and in good years it never captures the whole of the windfall."
 TER_wd_oil_crude_in_kind:0 "Take the Royalty in Barrels"
 TER_wd_oil_crude_in_kind_desc:0 "The principality takes its share as crude rather than cash, loaded into its own tank cars at the desert railhead and sold or stored as Karluga decides. It gives the state oil to bargain with in a crisis and a direct stake in every cargo. It also turns the treasury into a trading house, with every temptation that a trading house brings."
 TER_wd_oil_fee_drillers:0 "Drillers Paid by the Barrel"
 TER_wd_oil_fee_drillers_desc:0 "Ownership of every field stays with the principality, and foreign drilling firms work them for a fixed fee per barrel with no share of the oil itself. Every barrel above cost belongs to Terentio. The firms send fewer of their best crews to a contract with no upside, and the principality carries every dry hole on its own books."
 TER_wd_oil_flares:0 "Put Out the Flare Stacks"
 TER_wd_oil_flares_desc:0 "The desert wells bring up gas with the oil, and the crews burn it off in flares that can be seen from the mountain line at night. Gathering pipes and a compressor station would carry that gas to generators instead, powering the field camps and the desert halls. The compressors are dear and slow to arrive. When they run, the night sky over the fields goes dark."
 TER_wd_oil_field_camps:0 "Permanent Camps for the Field Crews"
 TER_wd_oil_field_camps_desc:0 "Field crews sleep in trailers beside the rigs and drive for hours to reach anything better. Permanent camps with cookhouses, a clinic, cold stores and graded roads to the railhead keep experienced hands from quitting after one hot season. The camps cost far more than trailers. They also turn the field districts into places where people might choose to stay."
 TER_wd_oil_bauxite:0 "A Trial Pit in the Bauxite Hills"
 TER_wd_oil_bauxite_desc:0 "The hills and the mountain province of the desert hold bauxite beds that appear on old maps and nowhere else. A trial pit, a small washing plant and a loading siding on the light railway would test whether the ore can pay its way at Terentian wages. Washing ore drinks water the towns want, and the engineers will have to answer for every tank."
 TER_wd_oil_field_school:0 "A Field School for Petroleum Hands"
 TER_wd_oil_field_school_desc:0 "Terentio has oil and few people who know how to bring it up without foreign help. A field school beside the desert camps, teaching drilling, well control and reservoir pressure to young people from Karluga, trades a few years of instructors' salaries for a generation of local engineers. Foreign operators dislike training their own replacements, and send instructors anyway."
 TER_wd_water_count_trucks:0 "Count Every Water Truck"
 TER_wd_water_count_trucks_desc:0 "Much of Terentio still drinks water that arrives by truck, sold by private haulers at prices that climb every dry month. Nobody has counted the trucks, their routes or the bores they fill from. A survey of every hauler, tank and filling point costs a season of inspectors' time and tells the government how thirsty its people really are."
 TER_wd_water_tank_price:0 "A Posted Price for a Tank of Water"
 TER_wd_water_tank_price_desc:0 "Haulers charge what the street will bear, and in the hot months the street bears a great deal. A posted maximum price per tank, painted on every truck and enforced by spot checks, protects households and enrages the large haulers, some of whom park their fleets in protest. The inspectors need the survey's figures to set a price that keeps the trucks running."
 TER_wd_water_desal:0 "Desalting Seawater at Karluga"
 TER_wd_water_desal_desc:0 "Karluga sits on the sea and drinks from trucks, which strikes every visitor as absurd. A desalting plant beside the port, fired by fuel oil from the desert fields, could fill the city's mains for a fraction of truck prices. It is the largest civil work in the budget, it takes three years to commission, and it burns some of the oil it was meant to protect."
 TER_wd_water_aquifer:0 "Sound the Deep Aquifer"
 TER_wd_water_aquifer_desc:0 "Beneath the desert lies old water, laid down long ago and barely refilled by the little rain that falls today. Test bores show how much there is and how quickly the level drops when pumped. The survey is cheap compared with any pipeline from the coast. Its results will start a fierce quarrel, because the same water cannot be spent twice."
 TER_wd_water_draw_fossil:0 "Draw Down the Fossil Water"
 TER_wd_water_draw_fossil_desc:0 "The growth camp wants the old water pumped now, while the fields expand: new wellfields for the desert towns, the camps and the halls, with the coast supplied from the sea. Towns grow and the halls run without rationing. The bore levels will fall year by year, and some later government will inherit that decline as its own crisis."
 TER_wd_water_ration_deep:0 "Licence and Ration the Deep Water"
 TER_wd_water_ration_deep_desc:0 "The cautious camp would licence every bore, cap what each may draw and price the old water as the reserve it is. Desert towns stay small, and the halls and camps must recycle what they use. Nobody grows rich on cheap water. When a drought or an emergency arrives, the reserve will still be there for the principality to call on."
 TER_wd_water_wellfields:0 "Wellfields for the Desert Towns"
 TER_wd_water_wellfields_desc:0 "With the old water open for use, engineers sink wellfields beside each desert town and lay mains to the field camps, ending the water trucks in the desert for good. Taps run in homes that never had them. The pumps need fuel and spare parts, and every new connection makes the towns more dependent on a supply that is quietly shrinking."
 TER_wd_water_bore_inspectors:0 "Bore Inspectors on the Desert Roads"
 TER_wd_water_bore_inspectors_desc:0 "Rationing only works if somebody reads the gauges. Inspectors with sealed gauges and a truck each ride a circuit of the licensed bores, checking the draw against the licence and fining the worst offenders. Field managers grumble that the inspectors cost more than the water. The levels in the test bores stop falling, which is the only argument the board needs."
 TER_wd_water_produced:0 "Treat the Water the Wells Bring Up"
 TER_wd_water_produced_desc:0 "Every barrel of desert crude comes up with several barrels of salty water that operators pump back down or leave standing in pits. Treating part of it for the halls, the ore washing and the dust roads spares cleaner water for the towns. The treatment plant is costly and smells of sulphur. It turns an oil-field nuisance into one more supply."
 TER_wd_water_one_board:0 "One Water Board for the Principality"
 TER_wd_water_one_board_desc:0 "Water policy is split among the port, the districts, the oil ministry and the haulers, and each blames the others. A single public water board takes the mains, the desalting plant, the bore licences and the truck permits under one budget and one tariff. It will be blamed for everything, but at least the blame will finally land somewhere useful."
 TER_wd_works_inventory:0 "Inventory the Desert Halls"
 TER_wd_works_inventory_desc:0 "The four arms halls in the Terentio Desert stand far from any town, ringed by earth banks and half-buried fences. They mix propellant, fill shells and pack charges, and they run on crews bussed in from the coast before dawn. An inventory of every line, magazine and contract shows what the halls are actually worth to a Terentio governing itself."
 TER_wd_works_buses:0 "Buses over the Mountain Line"
 TER_wd_works_buses_desc:0 "The desert halls depend on crews who ride buses for hours over the mountain road from the coast, and a breakdown means a lost shift. A depot at the railhead, graded roads and a timetable tied to the shift change cut both the journey and the absences. Housing the crews in the desert would be cheaper over decades, and far harder to sell to their families."
 TER_wd_works_blast_code:0 "A Code of Safe Distances"
 TER_wd_works_blast_code_desc:0 "The halls keep their magazines by habit rather than rule, and some sit closer together than any engineer would allow. A written code of safe distances, earth banks and storage limits forces expensive rebuilding at the worst sites. Output dips while magazines are moved. The first accident the code prevents will never appear in any report, which makes it hard to defend in budgets."
 TER_wd_works_one_company:0 "One Company for Four Halls"
 TER_wd_works_one_company_desc:0 "Each hall has its own managers, payroll, purchasing office and books, and the four compete for the same buses and spare parts. Merging them into one public works company cuts overheads and lets orders move between lines. Two dozen managers lose their posts. The unions gain a single table to bargain at, which they welcome and the managers resent."
 TER_wd_works_export:0 "Propellant on Export Licence"
 TER_wd_works_export_desc:0 "The halls keep their trade and sell propellant and filled rounds abroad under licences the cabinet signs one buyer at a time. Foreign customers pay well, the crews keep their wages, and the desert works stay what they were built to be. Every licence is a political act, and sooner or later one of the buyers will embarrass Karluga in public."
 TER_wd_works_chemicals:0 "Solvents and Fertiliser Instead of Shells"
 TER_wd_works_chemicals_desc:0 "The same reactors and drying sheds that make propellant can make solvents, resins and fertiliser from desert crude and gas. Conversion takes two years and catalysts bought abroad. The new products sell at home and in neighbouring markets with no licences and no headlines. The army loses a domestic propellant supply that it may one day badly miss."
 TER_wd_works_rocket:0 "Solid Fuel for Rocket Motors"
 TER_wd_works_rocket_desc:0 "Propellant chemists in the desert argue that the same skills could cast solid fuel for rocket motors, from artillery rockets to target drones. A casting shed and a test stand on the empty sand cost little. The work would make Terentio more than a shell filler, and it would make the halls far more interesting to foreign intelligence services."
 TER_wd_works_fertiliser:0 "Fertiliser for the Coast Plain"
 TER_wd_works_fertiliser_desc:0 "The converted halls sell their first fertiliser to farms on the plain behind Karluga below cost, exporting the rest. Yields rise wherever water allows, and the coast grows more of its own food. The halls run at a loss for a year to win the market, and the treasury carries the gap while farmers decide whether the new product is worth trusting."
 TER_wd_coast_tanker_queue:0 "Tankers Waiting off Karluga"
 TER_wd_coast_tanker_queue_desc:0 "Crude from the desert reaches Karluga in tank cars and leaves in tankers, and the tankers wait days at anchor for a berth built for general cargo. Every day of waiting costs charges that buyers pass back in the price. A count of berths, tank space and loading hoses shows how much the port's slowness costs the principality in a year."
 TER_wd_coast_jetty:0 "A Deep-Water Tanker Jetty"
 TER_wd_coast_jetty_desc:0 "A jetty reaching out past the shallows would let large tankers load in a day instead of a week. The engineers want a long steel trestle, pipelines from the tank farm and loading arms that can be shut in seconds. Building it costs a year of royalties and much borrowing. The general cargo quays get their only deep berth back."
 TER_wd_coast_spill:0 "Booms and Skimmers for the Anchorage"
 TER_wd_coast_spill_desc:0 "More tankers mean more spills, and the beaches and fishing grounds of Karluga lie beside the loading anchorage. A spill crew with booms, skimmers and a plan rehearsed twice a year costs little next to one filthy summer. The operators are made to pay a levy for it, which they dispute at every meeting. The fishing families do not dispute it at all."
 TER_wd_coast_tenders:0 "Patrol Tenders for the Loading Roads"
 TER_wd_coast_tenders_desc:0 "Terentio's sea service is a handful of small craft and crews trained as much for marines' work as for seamanship. Fast tenders that patrol the loading roads, escort laden ships to open water and board anything suspicious give it a clear job. It is modest work, and it is the only part of the navy that the oil revenue can plainly justify."
 TER_wd_coast_radar:0 "A Radar Mast over the Anchorage"
 TER_wd_coast_radar_desc:0 "Ships approaching Karluga at night are noticed only when they are already among the anchored tankers. A radar mast on the headland above the port, linked to the harbour office and the patrol tenders, tracks every hull from far out. The set is bought abroad and needs trained operators. Smugglers working the coast notice the difference within a week."
 TER_wd_coast_refinery:0 "A Refinery on the Last Free Plot"
 TER_wd_coast_refinery_desc:0 "Terentio exports crude and imports most of its fuel, paying twice for the same oil. A refinery hall beside the port would make diesel, fuel oil and bitumen at home. It would take the last free building plot in the Karluga province, which three ministries already want. Fuel would get cheaper, and the plot would be gone for a generation."
 TER_wd_coast_tanker_yard:0 "A Dry Dock for Tanker Repairs"
 TER_wd_coast_tanker_yard_desc:0 "Tankers loading at Karluga sail elsewhere for every repair, and the trade leaves with them. A repair yard with a dry dock would keep that work at home and train shipwrights the principality has never had. It would take the last free plot in the province. Its best customers would be the same ships that carry Terentio's crude away."
 TER_wd_coast_packing_hall:0 "A Packing Hall at the Quay"
 TER_wd_coast_packing_hall_desc:0 "The desert halls send half-finished rounds over the mountain road to be packed and shipped, and every crate makes the trip twice. A packing and filling hall on the Karluga quay would finish exports beside the ships. It takes the last free plot in the province and ties the port to the arms trade. The export office loves it; the harbour districts do not."
 TER_wd_coast_crew_school:0 "A Nautical School for Tanker Crews"
 TER_wd_coast_crew_school_desc:0 "Terentian crude sails under other flags with foreign crews. A nautical school at Karluga for deck officers, engineers and pump hands trains local sailors who can serve on foreign tankers now and perhaps on Terentian ones later. Graduates send wages home. Many will settle abroad, which the school's founders accept as the price of a skilled diaspora."
 TER_wd_nb_deeds:0 "Land Titles Held in Gatewood"
 TER_wd_nb_deeds_desc:0 "Much of Terentio's paper past sits in the Perblan archives at Gatewood: the original land titles of the desert districts, old survey sheets of the coast plain and the first lease grants. Karluga holds copies of most of it and originals of very little. Agreeing who keeps what is dull work, and every later oil contract will rest on it."
 TER_wd_nb_gatewood_cargo:0 "Gatewood Takes the First Cargo"
 TER_wd_nb_gatewood_cargo_desc:0 "One camp would make Perbla the first buyer of Terentian crude, on a long contract at a fair fixed price, shipped along the lines through Old Perbla. The fields gain a dependable customer next door who knows them well. Prices are steady and never spectacular. Critics say Terentio would trade a crown for a customer and call the change independence."
 TER_wd_nb_gatewood_cargo_tt_1:0 "A supply contract only; no faction, subject or border change."
 TER_wd_nb_open_market:0 "Every Cargo at the Posted Price"
 TER_wd_nb_open_market_desc:0 "Another camp wants every cargo sold at the posted market price to whoever pays, with no favoured buyer at all. Revenue swings with the market, rising fast in a crisis and falling just as fast after it. Oil traders in Karluga prosper. Gatewood will notice that its old crown land treats it like any other customer, and will set its rail fees accordingly."
 TER_wd_nb_brunies_fuel:0 "Fuel for the Brunies Mills"
 TER_wd_nb_brunies_fuel_desc:0 "A third camp looks across the disputed frontier. The Dakrainian steel and tungsten mills around Brunies run on imported fuel, and Terentio sits next door with crude to sell. A fuel contract settles no claim in either direction, but mill owners who burn Terentian oil are mill owners who want quiet crossings. Nationalists on both sides will call it treason."
 TER_wd_nb_brunies_fuel_tt_1:0 "Claims on both sides stay exactly as they are; no border, core or war effect."
 TER_wd_nb_basin_data:0 "Pressure Readings with Arklith"
 TER_wd_nb_basin_data_desc:0 "Arklith works its largest oil field in the Halloma Basin, across the frontier from the western desert blocks. Whether the two fields share rock is unknown, and a quarrel over drainage would cost both countries dearly. A standing exchange of pressure readings and well logs between the two inspectorates answers the question with data rather than with accusations."
 TER_wd_nb_basin_data_tt_1:0 "Technical data only; no resource, border or claim change."
 TER_wd_nb_arbitration:0 "An Arbitration Clause in Every Contract"
 TER_wd_nb_arbitration_desc:0 "Whoever buys Terentian crude, disputes will come: a short cargo, a late payment, a quarrel over quality. Writing a clause into every sale that sends disputes to a neutral tribunal abroad protects a small seller from the courts of larger buyers. Lawyers' fees rise. Buyers who planned to bully the principality now read the clause twice before signing anything."
 TER_wd_guard_muster:0 "Muster the Field Guard"
 TER_wd_guard_muster_desc:0 "Terentio's army begins with whatever units and reservists are Terentian today, trained for armour and mechanised infantry on the coast plain rather than for pipelines in the sand. A muster of the field guard shows who could patrol the desert this month. The answer is thin, and the operators already pay private watchmen to cover the gaps."
 TER_wd_guard_heat:0 "Drill Through the Hottest Months"
 TER_wd_guard_heat_desc:0 "Units trained on the coast plain wilt in the desert summer, when engines overheat and water discipline decides who finishes a march. A season of drills in the hottest months, with ration tables for water and night marches between the fields, hardens the companies that will guard them. Some soldiers fall sick in training. Fewer will fall sick on duty."
 TER_wd_guard_railhead_strip:0 "A Landing Strip at the Railhead"
 TER_wd_guard_railhead_strip_desc:0 "The desert has no airfield, and an injured driller waits hours for a truck to the coast. A graded strip beside the railhead with a fuel store and a tin hangar lets light aircraft land medics, spare parts and patrols in an afternoon. It is the first military field in the Terentio Desert, and herders complain about the noise from the first morning."
 TER_wd_guard_columns:0 "Columns That Move by Night"
 TER_wd_guard_columns_desc:0 "Light motorised columns would move between the fields at night, live off fuel caches buried along the tracks and answer trouble within hours. Fewer soldiers cover far more ground. The scheme depends on good radios, good drivers and luck with breakdowns, and a pumping station attacked on the wrong night may wait for help until dawn."
 TER_wd_guard_posts:0 "A Post at Every Pumping Station"
 TER_wd_guard_posts_desc:0 "Fixed posts at every wellhead cluster, pumping station and railway bridge, wired, lit and manned around the clock, would make every installation a small fort. Nothing happens unseen. The posts swallow soldiers, and a squad stationed for months in a hut on the sand grows bored and careless. The operators like the posts; the soldiers in them do not."
 TER_wd_guard_light_planes:0 "Light Aircraft over the Pipelines"
 TER_wd_guard_light_planes_desc:0 "Pipelines and power lines run for hours across empty sand, and a leak or a cut can go unseen for days. Light aircraft flying dawn patrols along every line, with radios to the field camps, spot trouble early and train the first Terentian pilots. The aircraft are bought second-hand. The pilots, once trained, are worth far more than the airframes."
 TER_wd_guard_karluga_field:0 "Hangars on the Karluga Plain"
 TER_wd_guard_karluga_field_desc:0 "The airfield on the plain behind Karluga has runways and too few hangars, and its aircraft stand out in the salt air. New hangars, a fuel store and an engine shop extend the field and give the patrol flights a proper home base. Fighter squadrons would need far more than this. The principality has to begin somewhere, and it begins here."
 TER_wd_guard_mountain_radar:0 "A Radar Head on the Mountain Line"
 TER_wd_guard_mountain_radar_desc:0 "Low-flying aircraft could cross the desert unseen behind the mountain province that separates the fields from the coast. A radar head on the high ground, linked by landline to the railhead and to Karluga, watches both the sky over the fields and the light railway. Its crew serves in the hardest posting in the guard and is paid accordingly."
 TER_wd_guard_crew_reserve:0 "Reservists from the Oil Crews"
 TER_wd_guard_crew_reserve_desc:0 "Oil crews know the desert tracks, wells and weather better than any conscript from the coast. Enrolling them in a reserve that trains two weeks a year gives the field guard guides, drivers and mechanics in an emergency. Operators lose staff during every drill and complain about it. The guard gains people who never get lost in the dunes."
 TER_wd_war_prices:0 "Crude Jumps with the Belkan War"
 TER_wd_war_prices_desc:0 "When the Belkan War breaks out in the spring of 1995, crude prices jump within days, and buyers who haggled for months call Karluga asking how much Terentio can load. The principality is no party to the war. Its oil is another matter, and ministers must decide what a small producer owes customers who may also be belligerents."
 TER_wd_war_hold_barrels:0 "Keep Barrels Back in the Tanks"
 TER_wd_war_hold_barrels_desc:0 "The cautious course pumps at the usual rate and stores part of the output in tanks at the railhead and the port rather than selling it into the panic. Revenue rises less than it could. The principality keeps a reserve for its own needs and for buyers it trusts, and the reservoir engineers stop warning about damage to the wells."
 TER_wd_war_full_stroke:0 "Every Pump at Full Stroke"
 TER_wd_war_full_stroke_desc:0 "The bold course runs every pump at full stroke and sells every barrel while the premium lasts. Revenue doubles for a season. Reservoir engineers warn that forcing the wells this hard draws water into the oil and shortens the life of the best fields. Ministers reply that a war price may never return, and the engineers write their objections down."
 TER_wd_war_station_guards:0 "Guards on the Pumping Stations"
 TER_wd_war_station_guards_desc:0 "At the end of 1995 news arrives that an armed movement calling itself A World With No Boundaries has launched a coup, and every oil operator in the desert reads it the same way: remote pumps and pipelines are easy targets for anyone with a grievance and a truck. Guards, floodlights and fences at the stations cost money and calm a great many nerves."
 TER_wd_war_windfall_account:0 "Bank the Wartime Premium"
 TER_wd_war_windfall_account_desc:0 "The wartime premium goes into a separate account that the treasury may draw on only by public vote, for water, the halls or a bad year. Nothing new is built with the money this year. The account grows quietly, earns little interest and invites raids from every minister with a project, which is why the rules for drawing on it are strict."
 TER_wd_war_windfall_spend:0 "Spend the Premium on Pipe and Pumps"
 TER_wd_war_windfall_spend_desc:0 "The other course spends the premium at once on things that last: pipe, pumps, rail sidings and the roads behind Karluga. Contractors are busy within a month and the coast sees progress it can touch. When the price falls, the new works will still need staff and spare parts, paid for out of a smaller income than the one that started them."
 TER_wd_war_lumen:0 "The Premium Ends at Lumen"
 TER_wd_war_lumen_desc:0 "When the treaty signed in Lumen ends the Belkan War in June 1995, the premium on crude disappears almost as quickly as it came. Buyers cancel spot cargoes and ask to renegotiate the contracts they begged for in April. The budget office redraws its figures for the year, and the field towns learn how much of their prosperity was borrowed from a war."
 TER_wd_war_sell_stored:0 "Sell the Stored Barrels Slowly"
 TER_wd_war_sell_stored_desc:0 "The barrels held back during the war still sit in the tanks, and the price has fallen. Selling them slowly to trusted buyers through the following year cushions the slump and keeps the loading berth busy. The treasury earns less than it would have at war prices. It earns more than a producer with empty tanks, and the buyers remember who supplied them."
 TER_wd_war_rest_wells:0 "Rest the Overworked Wells"
 TER_wd_war_rest_wells_desc:0 "The wells forced to full stroke during the war now produce more water and less oil, as the engineers warned. Resting the worst of them for a year, reworking their casings and injecting water to restore pressure costs output and money just as prices fall. Skipping it would cost more later. The engineers do not say they told everyone so, at least not in writing."
 TER_wd_war_bitumen:0 "Bitumen for Rebuilt Roads"
 TER_wd_war_bitumen_desc:0 "With Belka defeated, the roads, runways and bridges torn up by the war have to be rebuilt, and road builders need bitumen by the shipload. Heavy crude from the western blocks, long sold at a discount, finds buyers among refiners supplying the reconstruction contractors. The trade is small and steady, and it makes Karluga a supplier to the peace rather than to the fighting."
 TER_wd_war_belkan_contracts:0 "Belkan Buyers Want Ten-Year Contracts"
 TER_wd_war_belkan_contracts_desc:0 "With Belka victorious, its state buyers arrive in Karluga seeking ten-year crude contracts at a modest premium. The offer is generous, and the fields would be sold out for a decade. Gatewood, with old ties of its own to Belka, watches with interest. Osea and its partners will notice whose tankers fill at Karluga, and every other buyer will ask for the same terms."
 TER_wd_sky_warning:0 "Ulysses and the Oil Fields"
 TER_wd_sky_warning_desc:0 "When the world is told in April 1996 that Ulysses will strike the Earth, Terentio faces the same blank map as everyone else, because nobody can say where the fragments will fall. For a principality living on wells, tank farms and one loading berth, a single strike or a burning wellhead could do lasting damage. Planning starts with what can burn."
 TER_wd_sky_shut_in:0 "Shut-In Valves on Every Producing Well"
 TER_wd_sky_shut_in_desc:0 "Automatic valves deep in each producing well can close it in seconds if the wellhead is damaged, the pressure spikes or the ground shakes. Fitting them means pulling every well out of production for days and paying for valves bought abroad. Operators argue over who pays. Once the valves are in, a struck wellhead is a loss rather than a fire."
 TER_wd_sky_fire_crews:0 "Well-Fire Crews at the Railhead"
 TER_wd_sky_fire_crews_desc:0 "A burning well can blaze for months unless crews with pumps, foam, bulldozers and explosives reach it. A standing crew based at the railhead, trained by foreign specialists and equipped with water tankers that the desert can barely fill, is expensive insurance against an event that may never come. If it does come, nothing else will do."
 TER_wd_sky_reserve_bores:0 "Cap the Deep Bores for the Emergency"
 TER_wd_sky_reserve_bores_desc:0 "Rationing the old water has left the deep aquifer nearly full, and the water ministry proposes capping a ring of bores around the towns, sealed and guarded, to be opened only if the mains or the trucks fail. It costs little. The reserve the cautious camp argued for now becomes the first thing every emergency plan relies on."
 TER_wd_sky_tank_reserve:0 "Sealed Tanks Instead of Spare Bores"
 TER_wd_sky_tank_reserve_desc:0 "With the old water already flowing into the towns, there is no untouched aquifer left to hold in reserve. The water ministry fills sealed steel tanks at the railhead and behind Karluga instead, enough for a few weeks of bare need. Tanks are expensive, need cleaning and hold far less than the ground did. They are better than nothing at all."
 TER_wd_sky_railhead_camps:0 "Tent Towns at the Railhead"
 TER_wd_sky_railhead_camps_desc:0 "If a fragment at sea sent water into the low districts of Karluga, the only open ground inland lies past the mountain line, around the desert railhead. Planners stake out tent towns there with latrines, kitchens and space for water tankers. Nobody wants to live in the desert in summer. Everyone wants to know there is somewhere to go if the coast floods."
 TER_wd_sky_roche:0 "The Wells Close for the Roche Night"
 TER_wd_sky_roche_desc:0 "When Ulysses passes the Roche limit in July 1999, Terentio shuts in every producing well, empties the loading roads and keeps the fire crews on the railhead apron through the night. The principality loses a week of output and keeps every wellhead safe. Whatever falls elsewhere, the fields will restart under their own control and on their own timetable."
 TER_wd_sky_restart:0 "Bring the Fields Back Online"
 TER_wd_sky_restart_desc:0 "Restarting every well after the shut-in is slower than closing them. Pressures must be tested, valves checked and pipelines walked before oil flows again, and some wells never quite return to their old rates. The principality learns exactly how long its income can stop without breaking anything, a figure no treasury official had wanted to calculate."
 TER_wd_cent_account:0 "An Account of Coast and Desert"
 TER_wd_cent_account_desc:0 "At the turn of the century the government commissions an outside panel to write a plain account of the principality: what it pumps, what it is paid, what it spends on water, what the halls earn and how coast and desert now regard each other. Outsiders are chosen so that nobody can call the account a campaign leaflet. Some chapters will hurt."
 TER_wd_cent_princely_statute:0 "A Written Statute for the Principality"
 TER_wd_cent_princely_statute_desc:0 "The ministry gathers the chamber rules, the reserved desert benches and the duties of the crown office into a single written statute of the Principality of Terentio. Courts gain a text to read; future ministries gain limits they cannot quietly bend. Drafting takes a year of hearings in both halves of the country, and the desert deputies read every clause twice."
 TER_wd_cent_board_charter:0 "The Board Accepts a Charter"
 TER_wd_cent_board_charter_desc:0 "The board of fields and wells agrees to bind itself with a published charter: fixed terms for its members, rules on conflicts of interest, an auditor it cannot dismiss and an advisory chamber it must consult on water. The lease-holders accept limits in exchange for legitimacy. Karluga still has no vote, and now at least knows the rules."
 TER_wd_cent_union_constitution:0 "The Union Writes Its Constitution"
 TER_wd_cent_union_constitution_desc:0 "The Union council puts its revenue formula, its elections and the rights of the desert districts into a constitution that can be changed only by large majorities in both halves of the country. Governing becomes slower and steadier. Neither the coast nor the desert can rewrite the bargain alone, which is exactly what each half has always feared the other would do."
 TER_wd_cent_draw_account:0 "Draw on the Windfall Account"
 TER_wd_cent_draw_account_desc:0 "The account built from the 1995 premium has grown slowly while every minister eyed it. The vote to draw on it funds a second stage of mains and roads behind Karluga, chosen by an open tender rather than by whichever district shouted loudest. The account is smaller afterwards, and the rules that protected it have proved that they work."
 TER_wd_cent_maintain_works:0 "Keep the Wartime Works Running"
 TER_wd_cent_maintain_works_desc:0 "The pipe, pumps and sidings bought with the 1995 premium are showing their age, and their upkeep has been scraped from ordinary budgets ever since. A maintenance programme with its own budget line keeps them working instead of rotting. It costs money every year, which is the bill the spending camp always knew would follow the ribbon cutting."
 TER_wd_cent_propellant_contracts:0 "Long Contracts for Desert Propellant"
 TER_wd_cent_propellant_contracts_desc:0 "Export buyers who took the desert halls' propellant through the nineties now ask for long service contracts covering supply, storage and the disposal of their own old stock. The halls gain years of steady work. The principality's name appears in every buyer's arsenal, and each new licence is debated in the press for longer than the last one."
 TER_wd_cent_chemical_markets:0 "Desert Chemicals Find Foreign Buyers"
 TER_wd_cent_chemical_markets_desc:0 "The converted halls have spent years learning to make solvents, resins and fertiliser that meet foreign standards. Trade fairs and patient salesmanship now win them buyers in neighbouring countries and further afield. Margins are thin and the competition is fierce. The halls have become an ordinary chemical business, which is exactly what their converters hoped for."
 TER_wd_cent_usean_war:0 "Usean War Prices Reach Karluga"
 TER_wd_cent_usean_war_desc:0 "When the FCU demands in August 2003 that Erusea withdraw from San Salvacion, and the ISAF is founded, crude prices climb again as they did in 1995. The war is a continent away. Its premium is not, and this time the principality has the memory of the last one to consult before any new contract is signed."
 TER_wd_cent_arbitrated:0 "Contracts That Hold Through a Distant War"
 TER_wd_cent_arbitrated_desc:0 "When the Usean premium tempts buyers and sellers alike to break old contracts, the arbitration clauses Terentio wrote into every sale prove their worth. Two buyers who try to walk away find themselves before a tribunal rather than a sympathetic home court. The cases are slow and costly. Every other buyer watches and decides the clauses are real."
 TER_wd_cent_close:0 "Coast and Desert at Mid-Decade"
 TER_wd_cent_close_desc:0 "By the middle of the decade the harbour offices issue a slim summary of what Terentio has become: who signs its laws, how many barrels leave Karluga, how many households still buy water from a truck, and what the desert halls now make. Successor cabinets will measure themselves against these figures. Nobody in Karluga will predict the crude price for the years beyond it."
 TER_wd_cent_close_tt_2:0 "The 1991 to 2005 programme ends here; nothing later is yet written."
 ac_wd_ter_tree:0 "Terentio: National Programme"
 ac_wd_ter_tree_desc:0 "The national focus programme of Terentio, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 TER_wd_crown_office_interim:0 "An Office Holding the Seals"
 TER_wd_crown_office_interim_desc:0 "The crown office keeps the seals while the coast and the desert argue over who should hold them."
 TER_wd_coast_majority:0 "Seats by Head Count"
 TER_wd_coast_majority_desc:0 "Ministers answer to a chamber in which the coast holds nearly every seat."
 TER_wd_lease_boards_seals:0 "The Lease Boards Hold the Seals"
 TER_wd_lease_boards_seals_desc:0 "Lease-holders, field managers and treasury officials decide; the chamber only advises."
 TER_wd_union_compact:0 "The Coast and Desert Compact"
 TER_wd_union_compact_desc:0 "Oil crews and dock unions press for one Union bound by a revenue formula."
 TER_wd_desert_benches:0 "Reserved Desert Benches"
 TER_wd_desert_benches_desc:0 "The desert districts hold a fixed block of seats, whatever their head count."
 TER_wd_board_ledger:0 "The Monthly Board Ledger"
 TER_wd_board_ledger_desc:0 "Every lease payment, pump order and water delivery is printed each month."
 TER_wd_union_formula:0 "The Revenue Formula"
 TER_wd_union_formula_desc:0 "Fixed shares of every royalty go to the desert, the coast and the budget."
 TER_wd_printed_orders:0 "Orders in Print"
 TER_wd_printed_orders_desc:0 "Every law and lease award is posted in each district within ten days."
 TER_wd_princely_statute:0 "The Statute of the Principality"
 TER_wd_princely_statute_desc:0 "One written statute binds the crown office, the chamber and the desert benches."
 TER_wd_board_charter:0 "The Board Under Charter"
 TER_wd_board_charter_desc:0 "Fixed terms, an auditor it cannot dismiss and a chamber it must consult on water."
 TER_wd_union_constitution:0 "The Union Constitution"
 TER_wd_union_constitution_desc:0 "Neither half of the country can rewrite the bargain without the other."
 TER_wd_lease_fog:0 "Leases Nobody Has Read"
 TER_wd_lease_fog_desc:0 "Nobody can say for certain who holds which desert block, or on what terms."
 TER_wd_lease_register:0 "The Open Block Register"
 TER_wd_lease_register_desc:0 "Every desert block has a number, a holder and an expiry date on public record."
 TER_wd_metered_royalty:0 "Royalties by the Meter"
 TER_wd_metered_royalty_desc:0 "Royalties are paid on sealed wellhead meters instead of the operators own returns."
 TER_wd_audited_operators:0 "Audited Operators"
 TER_wd_audited_operators_desc:0 "Every leaseholder files accounts that an outside auditor has checked."
 TER_wd_sliding_royalty:0 "The Sliding Royalty"
 TER_wd_sliding_royalty_desc:0 "Private operators pay a royalty that climbs and falls with the crude price."
 TER_wd_crude_in_kind:0 "Royalty Crude in State Tank Cars"
 TER_wd_crude_in_kind_desc:0 "The state takes its share in barrels and sells or stores them itself."
 TER_wd_service_fees:0 "Drillers on a Barrel Fee"
 TER_wd_service_fees_desc:0 "Foreign firms drill for a fee, and every barrel above cost stays Terentian."
 TER_wd_flare_capture:0 "Gas Instead of Flares"
 TER_wd_flare_capture_desc:0 "Field gas runs the generators in the camps and halls instead of burning in the open."
 TER_wd_field_school:0 "The Desert Field School"
 TER_wd_field_school_desc:0 "Young Terentians learn drilling and well control beside the camps."
 TER_wd_truck_water:0 "Water by the Truckload"
 TER_wd_truck_water_desc:0 "Households buy drinking water from haulers at prices that rise every dry month."
 TER_wd_posted_tank_price:0 "The Posted Tank Price"
 TER_wd_posted_tank_price_desc:0 "Every water truck carries a painted maximum price, and inspectors check it."
 TER_wd_sweet_seawater:0 "Seawater Made Drinkable"
 TER_wd_sweet_seawater_desc:0 "The desalting plant beside the Karluga port fills the city mains."
 TER_wd_fossil_draw:0 "The Old Water Pumped"
 TER_wd_fossil_draw_desc:0 "Deep bores supply the desert towns, camps and halls without rationing."
 TER_wd_deep_ration:0 "The Old Water Rationed"
 TER_wd_deep_ration_desc:0 "Every deep bore is licensed and capped, and the reserve is kept."
 TER_wd_produced_water_reuse:0 "Treated Field Water"
 TER_wd_produced_water_reuse_desc:0 "Water brought up with the crude serves the halls, the ore washing and the dust roads."
 TER_wd_water_board:0 "The Principality Water Board"
 TER_wd_water_board_desc:0 "One board runs the mains, the desalting plant, the bores and the truck permits."
 TER_wd_dune_halls:0 "Four Halls, Four Ledgers"
 TER_wd_dune_halls_desc:0 "Four desert arms halls, each with its own managers, payroll and books."
 TER_wd_desert_works_company:0 "The Desert Works Company"
 TER_wd_desert_works_company_desc:0 "One public company runs the four desert halls and their buses."
 TER_wd_blast_code:0 "The Safe Distance Code"
 TER_wd_blast_code_desc:0 "Magazines, earth banks and storage limits follow a written code."
 TER_wd_propellant_export:0 "Propellant on Licence"
 TER_wd_propellant_export_desc:0 "Desert propellant and filled rounds sell abroad under signed licences."
 TER_wd_petrochem_halls:0 "The Chemical Halls"
 TER_wd_petrochem_halls_desc:0 "Former propellant lines make solvents, resins and fertiliser."
 TER_wd_cheap_fertiliser:0 "Fertiliser Below Cost"
 TER_wd_cheap_fertiliser_desc:0 "The chemical halls sell to the coast farms at a loss to win the market."
 TER_wd_tanker_queue:0 "Tankers at Anchor"
 TER_wd_tanker_queue_desc:0 "Tankers wait for days for the one berth that can take them."
 TER_wd_tanker_jetty:0 "The Deep-Water Jetty"
 TER_wd_tanker_jetty_desc:0 "Large tankers load in a single day at the jetty off Karluga."
 TER_wd_spill_crews:0 "Spill Crews on Standby"
 TER_wd_spill_crews_desc:0 "Booms, skimmers and a rehearsed plan guard the beaches and fishing grounds."
 TER_wd_jetty_watch:0 "The Jetty Patrol"
 TER_wd_jetty_watch_desc:0 "Fast tenders patrol the loading roads and escort laden tankers to open water."
 TER_wd_gatewood_buyer:0 "First Cargo to Gatewood"
 TER_wd_gatewood_buyer_desc:0 "Perbla buys Terentian crude first, on a long fixed-price contract."
 TER_wd_spot_seller:0 "Crude at the Posted Price"
 TER_wd_spot_seller_desc:0 "Every cargo goes to whoever pays the market price on the day."
 TER_wd_brunies_fuel:0 "Fuel Across the Frontier"
 TER_wd_brunies_fuel_desc:0 "Terentian crude fuels the mills around Brunies, and no claim has moved."
 TER_wd_basin_data:0 "Pressure Logs Shared with Arklith"
 TER_wd_basin_data_desc:0 "The two oil inspectorates swap well logs and pressure readings."
 TER_wd_field_guard:0 "The Field Guard"
 TER_wd_field_guard_desc:0 "A thin guard of soldiers and hired watchmen covers the desert installations."
 TER_wd_heat_drill:0 "Drilled for the Desert Summer"
 TER_wd_heat_drill_desc:0 "Water discipline and night marches are practised in the hottest months."
 TER_wd_desert_columns:0 "Night Columns"
 TER_wd_desert_columns_desc:0 "Light motorised columns move between the fields after dark."
 TER_wd_line_posts:0 "Posts on the Lines"
 TER_wd_line_posts_desc:0 "Wired and lit posts stand at every pumping station and railway bridge."
 TER_wd_pipeline_flights:0 "Dawn Pipeline Flights"
 TER_wd_pipeline_flights_desc:0 "Light aircraft fly the lines every morning and radio the field camps."
 TER_wd_crew_reserve:0 "The Oil Crew Reserve"
 TER_wd_crew_reserve_desc:0 "Field hands train two weeks a year as guides, drivers and mechanics."
 TER_wd_war_premium:0 "Crude at a War Premium"
 TER_wd_war_premium_desc:0 "Belligerents and neutrals alike bid up every Terentian cargo."
 TER_wd_barrels_held:0 "Barrels in Reserve"
 TER_wd_barrels_held_desc:0 "Part of the wartime output stays in tanks at the railhead and the port."
 TER_wd_pumps_flat_out:0 "Pumps at Full Stroke"
 TER_wd_pumps_flat_out_desc:0 "Every well is forced to its limit while the premium lasts."
 TER_wd_station_guards:0 "Guarded Pumping Stations"
 TER_wd_station_guards_desc:0 "Fences, floodlights and guards stand at every remote station."
 TER_wd_windfall_fund:0 "The Windfall Account"
 TER_wd_windfall_fund_desc:0 "The wartime premium sits in an account drawn only by public vote."
 TER_wd_price_slump:0 "After the Premium"
 TER_wd_price_slump_desc:0 "Buyers renegotiate and budgets shrink once the war price vanishes."
 TER_wd_reconstruction_bitumen:0 "Bitumen for the Rebuilding"
 TER_wd_reconstruction_bitumen_desc:0 "Heavy crude sells to refiners supplying the postwar road builders."
 TER_wd_belkan_long_contracts:0 "Ten Years Sold to Belka"
 TER_wd_belkan_long_contracts_desc:0 "Belkan state buyers hold long crude contracts at a premium."
 TER_wd_impact_dread:0 "Every Wellhead a Target"
 TER_wd_impact_dread_desc:0 "Planners list everything that would burn if a fragment fell on Terentio."
 TER_wd_valves_fitted:0 "Safety Valves Downhole"
 TER_wd_valves_fitted_desc:0 "Every producing well can close itself within seconds."
 TER_wd_well_fire_crews:0 "Well-Fire Crews"
 TER_wd_well_fire_crews_desc:0 "A standing crew can cap a burning well wherever it is."
 TER_wd_sealed_water:0 "Sealed Emergency Water"
 TER_wd_sealed_water_desc:0 "A reserve of water is held untouched for the worst week."
 TER_wd_railhead_camps:0 "Camps Staked Out Inland"
 TER_wd_railhead_camps_desc:0 "Tent towns are planned at the railhead in case the coast must be emptied."
 TER_wd_propellant_contracts:0 "Service Contracts for Propellant"
 TER_wd_propellant_contracts_desc:0 "Foreign buyers contract the halls for supply, storage and disposal."
 TER_wd_chemical_markets:0 "Desert Chemicals Abroad"
 TER_wd_chemical_markets_desc:0 "Solvents, resins and fertiliser from the halls sell in foreign markets."
 TER_wd_usean_prices:0 "Crude Priced by a Usean War"
 TER_wd_usean_prices_desc:0 "War in Usea lifts the price of every Terentian cargo once again."
 TER_wd_summer_convoys:0 "Summer Water Convoys"
 TER_wd_summer_convoys_desc:0 "Extra hired convoys carry water to the hottest districts."
 TER_wd_extra_tank_cars:0 "Leased Tank Cars"
 TER_wd_extra_tank_cars_desc:0 "Foreign tank cars clear crude from the desert railhead faster."
 ac_wd_ter.1.t:0 "One Coast, One Desert"
 ac_wd_ter.1.d:0 "The first council of state meets in the harbour offices at Karluga, the only rooms in the principality with enough chairs and a working telephone exchange. The Office of the Crown opens with a short statement: the seals are kept, the soldiers are paid and the oil revenue arrives each quarter. What the office does not say is who should decide how that revenue is spent.\n\nEveryone in the room knows the arithmetic. Nearly all of Terentio's people live on the northern coast, in Karluga and on the plain behind it. Nearly all of its money comes from the desert, where a few thousand people work the wells, the bauxite hills and four arms halls built far from any town. The coast speaks of fairness by head count. The desert speaks of fairness by contribution. Both are quoting real numbers.\n\nNo settlement is possible at the first sitting, and nobody pretends otherwise. The council can at least choose its manner. It may hold its debates in public, with the minutes printed and the desert towns reading every word a week later, or it may keep them inside the harbour offices until a proposal is ready. Whichever it chooses, the field towns will judge the coast by it.\n\nProvisional gameplay."
 ac_wd_ter.1.a:0 "Print every word of the debates."
 ac_wd_ter.1.b:0 "Keep the council behind closed doors."
 ac_wd_ter.2.t:0 "The Lease Boxes"
 ac_wd_ter.2.d:0 "The clerks of the lands office carry the lease files up from the basement in forty cardboard boxes and stack them along a corridor, because no single room will hold them. Each box holds the history of a few desert blocks: original grants, renewals typed on headed paper, maps redrawn by hand and letters that change the terms without saying so. Some blocks appear in two boxes with two different holders.\n\nThe operators are polite and worried. A few hold leases that expired years ago and were never renewed in writing; they kept pumping and paying because nobody asked. Others hold blocks they never drilled, waiting for a better price. One foreign firm produces a side letter granting it first refusal on every block in the hill country, signed by an office that no longer exists.\n\nNobody can read forty boxes in a week, but the ministry must say now how it will treat what it finds. It can honour every lease that has been paid on, however irregular, and buy calm with the operators. Or it can declare that only leases confirmed by the new register will stand, and accept a year of lawsuits and nervous investors in return for a clean slate.\n\nProvisional gameplay."
 ac_wd_ter.2.a:0 "Honour every lease that has been paid on."
 ac_wd_ter.2.b:0 "Only registered leases will stand."
 ac_wd_ter.3.t:0 "The Water Sellers"
 ac_wd_ter.3.d:0 "The water survey comes back with a map no minister had seen before. Several hundred trucks carry drinking water to the outer districts of Karluga and to every town in the desert, filling at private bores, at a few municipal taps and, in one case, at a pipe the survey team politely describes as unexplained. Prices double between the cool months and the hot ones.\n\nThe haulers are not villains. Most own one or two trucks, drive long hours and know their customers by name. A few large firms own the best bores, set the prices the small haulers follow and lend money to families who fall behind. In the hottest districts a household spends more on water than on bread, and the survey notes several schools that send pupils home early on days the truck is late.\n\nMinisters have to decide how to begin. They can call the haulers' associations to the harbour offices and bargain, trading permits and fuel discounts for steadier prices. Or they can publish the survey in full, names and prices included, and let public anger soften the large firms before the inspectors arrive. The haulers will remember either approach for a long time.\n\nProvisional gameplay."
 ac_wd_ter.3.a:0 "Bargain with the haulers."
 ac_wd_ter.3.b:0 "Publish the survey in full."
 ac_wd_ter.4.t:0 "The Halls Beyond the Dunes"
 ac_wd_ter.4.d:0 "The inventory team spends a month in the desert and returns sunburnt, carrying ledgers and photographs. Four arms halls stand on the sand, linked by graded tracks and a single water main, each ringed by earth banks and a fence the wind has half buried. They mix propellant, fill shells and pack charges, and they run on crews who arrive by bus over the mountain line before dawn.\n\nTwo halls work full shifts on export orders signed years ago. One works half time. The fourth has been kept warm for a war that never came, its machines greased and its stores full. Behind it, in old bunkers, the team found propellant older than most of the crews, stored in the heat long past the age any manual allows. The hall managers call it stable. The team's chemist is less sure.\n\nThe cabinet must decide how much of the report the public sees. A full release would explain why the halls need money and why some stock must be destroyed, and it would frighten every family whose breadwinner rides the bus each morning. A summary for the ministries would keep the crews calm and leave the old stock to a quieter decision.\n\nProvisional gameplay."
 ac_wd_ter.4.a:0 "Publish it and test the old stock."
 ac_wd_ter.4.b:0 "Keep it for the ministries."
 ac_wd_ter.5.t:0 "The Old Propellant"
 ac_wd_ter.5.d:0 "Two weeks after the report, chemists from Karluga finish testing the old stock behind the fourth hall. Most of it has aged badly. Stabiliser levels are low, some casks have sweated, and a few show warm spots that the testers mark with red paint and refuse to approach without the fire crew standing by. Nobody has been hurt. The chemists would like to keep it that way.\n\nEvery option is unpleasant. The stock could be burned in pits far out on the sand, a few casks a day for months, under guard and with smoke visible from the field camps. It could be shipped to a foreign disposal firm at great cost and some risk on the mountain road. Or the worst casks could be burned and the rest re-stabilised and sold cheaply, which the export office prefers and the chemists do not.\n\nThe crews of the fourth hall are watching closely, since the stock is the reason their hall exists. The field camps nearby want to know how much smoke they will breathe. Whatever the cabinet orders will be read as a statement about how seriously the principality takes the dangers it was left to manage.\n\nProvisional gameplay."
 ac_wd_ter.5.a:0 "Burn all of it on the sand."
 ac_wd_ter.5.b:0 "Burn the worst and sell the rest."
 ac_wd_ter.6.t:0 "Seven Tankers at Anchor"
 ac_wd_ter.6.d:0 "On the morning the harbour office counts them, seven tankers lie at anchor off Karluga, waiting for the one berth that can take them. The berth was built for general cargo and feeds crude through a hose that a single crew must couple and uncouple by hand. A ship that should load in a day takes three. The rest wait, and their owners charge for every hour.\n\nBuyers pass those charges back in the price, so every day a tanker waits comes out of the principality's royalties. The tank farm behind the port is full more often than empty, and tank cars from the desert queue on the sidings for their turn to unload. Fishing crews say the anchored ships foul their nets, and the beach districts complain about the smell of every spill, large or small.\n\nA proper tanker jetty would solve most of it, and it costs more than the principality can comfortably borrow. Before any engineer is hired, the port must decide how to manage the queue it already has. It can give oil absolute priority at the berth, clearing the tankers and annoying every other shipper, or keep the berth shared and accept the charges until a jetty exists.\n\nProvisional gameplay."
 ac_wd_ter.6.a:0 "Give the tankers priority at the berth."
 ac_wd_ter.6.b:0 "Keep the berth shared for now."
 ac_wd_ter.7.t:0 "Titles in the Gatewood Archives"
 ac_wd_ter.7.d:0 "The Terentian archivists return from Gatewood with a list rather than a cartload. The Perblan archives were courteous and thorough. They hold the original land titles of the desert districts, the old survey sheets of the coast plain and the first lease grants of the oil blocks, all catalogued and well kept. Karluga holds copies of most of them and originals of very few.\n\nNothing in the archives is disputed; the question is custody. Perblan officials point out that their staff have cared for these series for generations and that splitting a series damages it. Terentian lawyers point out that a lease case in Karluga cannot wait weeks for a certified copy from another capital. Both sides agree that the records must not be lost or carelessly duplicated, and that the matter is too dull to interest anyone but archivists and lawyers.\n\nKarluga must decide what to ask for. It can request the originals of the land and lease series, which matter most to the oil fields, and leave the rest where it is. Or it can ask only for certified copies, leave every original in Gatewood and seek a standing arrangement to consult them whenever a case demands it.\n\nProvisional gameplay."
 ac_wd_ter.7.a:0 "Ask for the land and lease originals."
 ac_wd_ter.7.b:0 "Certified copies and standing access."
 ac_wd_ter.8.t:0 "Crude at a War Price"
 ac_wd_ter.8.d:0 "In the spring of 1995 the long quarrel around Belka becomes open war, and within a week the price of crude has risen by a third. Terentio is not a party to the war and has no soldiers anywhere near it. Its telephones are another matter: buyers who haggled for months now call the oil ministry at night, asking how many cargoes Karluga can load this quarter and offering to pay in advance.\n\nSome callers represent firms in neutral ports. Others are vague about where the crude will end up, and one asks whether Terentio could deliver to a harbour that the ministry's maps place uncomfortably close to the fighting. The treasury has already worked out what a summer of war prices would mean: the deficit gone, the water works funded, the halls paid for a year. Operators in the desert ask permission to run their pumps harder than the engineers like.\n\nThe cabinet's first decision is about the money rather than the oil. It can announce that every coin of the premium will be counted in public and its use decided in the open, inviting a scramble of claims from every district. Or it can keep the figures inside the treasury until the shape of the war is clearer, and decide quietly what a windfall is for.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25 in tools/lore/chronicle.json; the Terentian response is gameplay."
 ac_wd_ter.8.a:0 "Count the premium in public."
 ac_wd_ter.8.b:0 "Keep the figures in the treasury."
 ac_wd_ter.9.t:0 "Sacks of Petitions"
 ac_wd_ter.9.d:0 "Three weeks after the premium was announced, petitions start arriving at the harbour offices by the sackful. The desert towns want a water main and paved streets. The outer districts of Karluga want the trucks replaced by pipes. The halls want their oldest machines replaced, the field guard wants vehicles that do not overheat, and the schools want roofs. Every petition quotes the published figure, usually rounded up.\n\nSome petitions are thoughtful and costed. Many are not, and a few come from people who have never paid tax on anything. The newspapers print the best and the worst side by side. The treasury warns that a premium is not an income: when the war ends, prices will fall, and any promise made now will still need paying afterwards. The petitioners reply that the treasury always says that.\n\nMinisters must decide how to answer the sacks. They can choose a few large projects and refuse everything else, disappointing nearly everyone while keeping most of the money whole. Or they can spread small grants across every district, so that each town sees something built this year, and leave little for the leaner seasons the treasury expects.\n\nProvisional gameplay."
 ac_wd_ter.9.a:0 "Fund a few large projects."
 ac_wd_ter.9.b:0 "Small grants for every district."
 ac_wd_ter.10.t:0 "What Would Burn"
 ac_wd_ter.10.d:0 "The April 1996 announcement that Ulysses will strike the Earth reaches Karluga by radio in the middle of a working day. By evening the oil ministry has a list on its wall of everything in Terentio that could burn: the producing wells, the tank farm behind the port, the tanker berth, the desert halls and their magazines. Nobody knows where fragments will fall, and the list does not depend on it.\n\nThe engineers explain what a single strike could do. A burning wellhead in the desert can blaze for months unless crews with explosives and pumps reach it. A fire at the tank farm would spread into the harbour districts. The halls are safest left alone, unless the ground shakes. Families on the coast ask whether they should move inland, and the desert towns ask where the water would come from if they did.\n\nBefore any plan is costed, the cabinet must settle its message. It can speak plainly about the wells and the tanks and ask operators and citizens to prepare for the worst, which will frighten investors and some families. Or it can speak only of general readiness, keep the engineers' list confidential and work through it quietly while the world argues about the asteroid.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1996 / 04.20 in tools/lore/chronicle.json; Terentian preparations are gameplay."
 ac_wd_ter.10.a:0 "Speak plainly about the risks."
 ac_wd_ter_10_a:0 "Speak plainly about the risks."
 ac_wd_ter.10.b:0 "Speak only of general readiness."
 ac_wd_ter.11.t:0 "Envelopes at the Lands Office"
 ac_wd_ter.11.d:0 "The bidding round closes at noon, and the lands office opens the sealed envelopes in front of the press and two notaries. Bids have come in for most of the offered blocks: some from operators already working the desert, some from foreign firms the ministry has never dealt with, and one from a consortium whose address turns out to be a law office in another country.\n\nThe best bids promise drilling within a year, local hiring and a signature payment that would close a gap in the budget. The weaker ones offer more money and fewer commitments. Two firms ask, through intermediaries, whether the terms might be adjusted after the award; the lands office records both requests in the minutes, which neither firm had expected. The field towns want to know how many of their people will be hired.\n\nMinisters must choose how to award the blocks. They can take the highest signature payments and spend them at once, rewarding the firms with the deepest pockets. Or they can weigh drilling commitments and local hiring above cash, pleasing the field towns and delaying the money. Either way, the next round will be judged by how this one is remembered.\n\nProvisional gameplay."
 ac_wd_ter.11.a:0 "Take the highest payments."
 ac_wd_ter.11.b:0 "Weigh drilling and hiring first."
 ac_wd_ter_11_b:0 "Weigh drilling and hiring first."
 ac_wd_ter.12.t:0 "A Grey Volume with a Fold-Out Map"
 ac_wd_ter.12.d:0 "The outside panel's account of the principality appears as a single grey volume with a fold-out map. It describes how much oil Terentio now pumps, what it is paid, what it spends on water and where the money for the halls comes from. It counts schools, clinics and water trucks in every district, and it records how coast and desert residents answered when asked whether the other half treats them fairly.\n\nThe answers are not flattering. Coast residents think the desert is pampered with oil money; desert residents think the coast spends it. Both are partly right. The panel praises what has been built where it exists, and warns that the principality depends on one export, one loading berth and a few hundred skilled crews who could earn more abroad. Its last chapter asks what happens when the price falls.\n\nMinisters have a week before the volume is debated. They can answer it chapter by chapter, accepting the hostile headlines that follow each admission. Or they can welcome its praise, send its warnings to committee and hope that the price of crude stays high long enough for the committee to finish its work.\n\nProvisional gameplay."
 ac_wd_ter.12.a:0 "Answer every chapter."
 ac_wd_ter.12.b:0 "Welcome the praise."
 ac_wd_ter.13.t:0 "A War Price Again"
 ac_wd_ter.13.d:0 "When the FCU demands in August 2003 that Erusea withdraw from San Salvacion and the ISAF is established, the war in Usea is a continent away from Karluga. The price of crude moves within days all the same, as it did in 1995. Insurers add war premiums to every lane that touches Usean waters, and buyers who spent years squeezing Terentian prices start returning calls.\n\nThis time the principality has experience to draw on. The treasury remembers how fast the last premium vanished. The operators remember which wells suffered from being run too hard. The halls remember export enquiries from buyers who were vague about their customers. Each memory argues for caution, and the budget office argues, as budget offices do, that caution is easy while the money is not yet in the account.\n\nThe cabinet must set the tone before the first new contracts are signed. It can treat the premium as temporary from the start, pricing every contract short and banking the surplus. Or it can lock in long contracts at today's prices, trading some of the upside for years of certainty that will outlast the war, whenever and however it ends.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 2003 / 08.22 in tools/lore/chronicle.json; the Terentian response is gameplay."
 ac_wd_ter.13.a:0 "Price short and bank the surplus."
 ac_wd_ter.13.b:0 "Lock in long contracts now."
 TER_wd_princely_ministry_office:0 "Ministry of the Principality of Terentio"
 TER_wd_princely_ministry_office_desc:0 "A ministry formed by the largest bloc in the chamber, collectively responsible and removable by a vote of the deputies, governing in the name of the crown office. Provisional gameplay office with no named holder."
 TER_wd_fields_board_office:0 "Board of the Fields and Wells"
 TER_wd_fields_board_office_desc:0 "A board of lease-holders, field managers and senior treasury officials holding the seals by standing order, with the chamber summoned only to advise. Provisional gameplay office with no named holder."
 TER_wd_union_council_office:0 "Council of the Union of Terentio"
 TER_wd_union_council_office_desc:0 "A council elected from the chamber of the Union of Terentio on a fixed calendar and bound by the revenue formula between coast and desert, with the princely title laid aside. Provisional gameplay office with no named holder."
 ac_wd_ter_decisions:0 "Terentio: National Measures"
 ac_wd_ter_decisions_desc:0 "Measures from the national programme of Terentio. Provisional gameplay unless a source ledger row says otherwise."
 TER_wd_block_round_decision:0 "Open a Round of Desert Blocks"
 TER_wd_block_round_decision_desc:0 "Offer unlicensed desert blocks to sealed bids, opened before notaries and the press."
 TER_wd_summer_convoys_decision:0 "Hire Water Convoys for the Summer"
 TER_wd_summer_convoys_decision_desc:0 "Pay haulers to run extra water convoys to the hottest districts for four months."
 TER_wd_tank_car_hire_decision:0 "Lease Extra Tank Cars for a Season"
 TER_wd_tank_car_hire_decision_desc:0 "Lease tank cars from abroad for half a year to clear crude from the desert railhead faster."
 TER_wd_heat_exercise_decision:0 "A High Summer Exercise in the Desert"
 TER_wd_heat_exercise_decision_desc:0 "March the field guard between the wells for two weeks at the height of the summer heat."
 TER_wd_strip_extension_decision:0 "Lengthen the Railhead Strip"
 TER_wd_strip_extension_decision_desc:0 "Extend and pave the railhead landing strip once, so that heavier transport aircraft can use it."
 TER_wd_shut_in_drill_decision:0 "Rehearse a Full Shut-In of the Fields"
 TER_wd_shut_in_drill_decision_desc:0 "Close every producing well for a day and restart them in order, to keep the crews and the valves ready."
