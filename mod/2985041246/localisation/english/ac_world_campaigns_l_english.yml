 ac_wc_soa.22.d:0 "Central Sotoa is a separate government in the inherited campaign. Sellen proposes a direct conversation. Vey wants practical technical exchange. Halvek wants contact procedures that do not turn a misunderstanding into mobilization.\n\nMira Sellen, civilian counsel / Eran Vey, industrial engineer / Daren Halvek, operations officer. This is an original campaign discussion, not an official historical event."
