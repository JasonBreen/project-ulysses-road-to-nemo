l_english:
 MST_wd_mv_ninety:0 "Nine Monstruans in Ten"
 MST_wd_mv_ninety_desc:0 "The movement that governs Monstrua claims the loyalty of nine citizens in ten, and no vote has been counted since November 1987. The National Administration rules by ordinance while the old election calendar gathers dust. Before deciding what the movement should become, its senior committee orders a quiet count, district by district, of what that loyalty is actually made of."
 MST_wd_mv_stairwells:0 "A Warden on Every Stairwell"
 MST_wd_mv_stairwells_desc:0 "In the apartment blocks of Bufang and the Vuelona arms belt, the movement keeps a warden on each stairwell who knows every tenant by name. Paying the wardens a stipend and a desk at the district office turns gossip into administration. Complaints reach the ministries faster, and so do denunciations, which is why many tenants now speak quietly even in their own kitchens."
 MST_wd_mv_columns:0 "Columns of the Young"
 MST_wd_mv_columns_desc:0 "The movement's youth columns march on every holiday and drill on weekends in forest camps above the Colmillo coast. Their numbers explain much of the country's warlike mood. Giving them army instructors and a written syllabus turns parades into skills that a reserve could use. Teachers complain that drill now competes with arithmetic for the same Saturday hours, and parents are divided."
 MST_wd_mv_cells_path:0 "Party Cells for the Ministries"
 MST_wd_mv_cells_path_desc:0 "The committee's hardliners argue that the movement already has the people and should now take the desks. Every ministry would receive a party cell with the right to review appointments and budgets, so that decisions follow the movement's line rather than the habits of the civil service. Senior clerks and officers who have run the state for years would answer to party secretaries half their age."
 MST_wd_mv_staff_path:0 "The Officers Put It in Writing"
 MST_wd_mv_staff_path_desc:0 "A memorandum from the general staff circulates among the ministers. It says the marches and wardens have made the country loud but not strong, and that eight formations, two airfields and twenty plants need managers rather than speeches. The officers offer to govern through military districts until the state runs on professional lines. The movement reads the memorandum as ingratitude, and some of its authors as rivals."
 MST_wd_mv_charter_path:0 "Talk of a Written Charter"
 MST_wd_mv_charter_path_desc:0 "A minority inside the committee, joined by the few democrats and neutral notables who still meet openly, proposes a written charter: elections on a fixed calendar, a chamber that can refuse a budget and courts the movement does not appoint. They argue that a movement this popular can only gain from a counted vote. Hardliners answer that a counted vote is exactly how popular movements lose."
 MST_wd_mv_directorate:0 "The Directorate Takes the Desks"
 MST_wd_mv_directorate_desc:0 "The senior committee reconstitutes itself as a directorate and takes the ministries outright. Party cells sign every appointment, the youth columns become a recognised arm of the state and the old ordinances are reissued as directorate decrees. Officers keep their commands but lose their independence. The Monstruan State now means the movement itself, and nobody is left to blame but the directorate."
 MST_wd_mv_junta:0 "The District Commanders Take the Seals"
 MST_wd_mv_junta_desc:0 "The general staff forms a council of the four military district commanders and takes the government seals, keeping the movement's committee as an advisory body that is told rather than consulted. Wardens report to garrison officers and the columns to recruiting depots. The Monstruan Junta gains a disciplined administration and loses the mass enthusiasm that was the movement's only real asset."
 MST_wd_mv_republic:0 "A Republic Under the Charter"
 MST_wd_mv_republic_desc:0 "The committee yields to the charter faction and proclaims the Monstruan Republic, with a provisional cabinet, a chamber to be elected within a year and courts named under the new text. Movement moderates reorganise as the largest party and expect to win any vote. What changes is that they now have to win it, and that losing would no longer be treason."
 MST_wd_mv_code:0 "The Directorate Code"
 MST_wd_mv_code_desc:0 "The directorate replaces a decade of scattered ordinances with one code covering the press, the unions, the youth columns and the frontier. Officials finally know which rules apply, because the directorate wrote all of them, and production planners welcome the clarity. Monstruans who disagree learn that the code has a chapter on them too, and that the wardens have read it closely."
 MST_wd_mv_districts:0 "Four Districts, Four Commanders"
 MST_wd_mv_districts_desc:0 "The junta divides the country into four military districts matching the four states, from the Colmillo coast to the Vuelona hills. Each district commander answers for roads, rations, recruiting and public order. The arrangement is tidy and fast. It also means that one poor commander can ruin a quarter of the country before the council in the capital notices anything is wrong."
 MST_wd_mv_first_ballot:0 "Ballots Counted Again"
 MST_wd_mv_first_ballot_desc:0 "The first chamber election since 1987 runs under the new charter. The movement's successors win a clear majority, as everyone expected, but not every seat, and opposition deputies from the Colana plains and the Bufang docks take their places. Debates turn noisy and budgets slow down. For the first time the government's authority rests on a count that outsiders can check for themselves."
 MST_wd_mv_settled:0 "One Answer Since 1987"
 MST_wd_mv_settled_desc:0 "Whatever form the state took, the argument opened by the loyalty count gives way to ordinary government. Ministries know whom they answer to and the frontier posts know whose orders to follow. The losing factions remain, some in exile across the northern hills and some inside the governing camp itself. Outsiders can at least predict who will sign the decrees next month."
 MST_wd_cap_quays:0 "Count the Bufang Quays"
 MST_wd_cap_quays_desc:0 "Bufang is the capital and the country's only naval base, and every merchant convoy Monstrua charters unloads at its quays. Nobody has measured how long a ship waits for a berth or how much cargo spoils in the sheds. A harbour survey answers both questions. Shipping agents cooperate eagerly; customs officers, who earn fees from the delays, cooperate rather less."
 MST_wd_cap_cranes:0 "New Cranes on the Merchant Quay"
 MST_wd_cap_cranes_desc:0 "The survey shows ships waiting days for three ageing cranes that break down every month. Buying modern cranes and laying a short rail spur along the merchant quay halves the time a ship spends in port. The cranes cost foreign currency the treasury would rather spend on aircraft, and the dock gangs fear that faster unloading means fewer shifts for them."
 MST_wd_cap_silo:0 "Fill the Colmillo Fuel Silo"
 MST_wd_cap_silo_desc:0 "The capital keeps the country's only fuel silo, and it has seldom been more than half full. Topping it up from the hill wells and holding a strategic reserve means aircraft and trucks keep moving through a blockade or a hard winter. The oil sits idle and earns nothing. Treasury officials call it the costliest tank in the country; the air staff calls it insurance."
 MST_wd_cap_rail_loop:0 "The Bufang Rail Loop"
 MST_wd_cap_rail_loop_desc:0 "The line from the quays runs along the forested coast to the junction where the trunk line leaves for the other three states, then on to the second supply depot in southern Colmillo. Doubling the track and adding sidings at the junction lets freight leave the port without blocking passenger trains. Rail crews gain overtime, and a city park is lost to the new sidings."
 MST_wd_cap_harbour_radar:0 "A Radar Mast over Bufang"
 MST_wd_cap_harbour_radar_desc:0 "Bufang's approaches have no radar, and the harbour master still counts ships through binoculars. A radar mast on the high ground above the port tracks shipping and low aircraft over the western sea. There are no warships to direct, but the air reserve gains warning time. Fishing crews grumble about the restricted zone drawn around the mast."
 MST_wd_cap_movement_hall:0 "A Movement Hall on the Quay"
 MST_wd_cap_movement_hall_desc:0 "Under the directorate, the movement builds its central hall beside the merchant quay, with offices for the youth columns, the wardens and the party press. Every arriving sailor walks past its banners. The hall becomes the real seat of government in the capital, and also the obvious target of every complaint the city has, because everyone knows where decisions are made."
 MST_wd_cap_garrison:0 "The Garrison Holds Bufang"
 MST_wd_cap_garrison_desc:0 "Under the junta, the Colmillo district command moves into the harbour offices and runs the port as a military installation. Curfews end the dockside black market almost overnight. Merchant captains find the paperwork stricter and the bribes smaller. Residents grow used to patrols at every crossing and learn which officers can be approached and which cannot."
 MST_wd_cap_city_council:0 "An Elected Council for Bufang"
 MST_wd_cap_city_council_desc:0 "Under the charter, the capital elects a city council for the first time in a generation. Its first budget repairs tram lines and the water mains of the dock wards before it touches a single monument. Movement councillors still hold the majority, but they must now explain their votes at public meetings, and petitions that once went to wardens go to elected members."
 MST_wd_cap_fair:0 "A Trade Fair at Bufang"
 MST_wd_cap_fair_desc:0 "Once the question of government is settled, the capital holds its first trade fair in years along the merchant quay. Buyers from across the sea inspect trucks, rail wagons, aluminium sheet and whatever else the plants can spare. Orders are modest. The fair matters more as a signal that Monstrua is open for business, whoever governs it, and the hotels are full for a week."
 MST_wd_hall_ledger:0 "Twenty Plants on One Ledger"
 MST_wd_hall_ledger_desc:0 "Monstrua runs ten civilian plants and ten arms halls, an even split that no planner ever chose on purpose. Vuelona holds four of the arms halls, Colmillo three, Garracia two and Colana one. A single ledger of output, machine age and missing parts gives the first honest picture of the economy, and plant directors who reported only good news must now explain themselves."
 MST_wd_hall_spares:0 "Replacement Parts Come First"
 MST_wd_hall_spares_desc:0 "Planners have long measured success in new rifles, trucks and aircraft delivered. Yet half the trucks wait for parts, and the artillery parks strip some guns to keep others firing. A spares programme gives every plant a quota of replacement parts before any new item leaves the line. Output figures look worse for a year, and the equipment the country already owns begins to work."
 MST_wd_hall_vuelona_yards:0 "The Vuelona Arms Belt"
 MST_wd_hall_vuelona_yards_desc:0 "Vuelona is the most industrial state in the country, with four arms halls and three civilian plants, and not one mine or well of its own. Every ingot and barrel arrives over the hills by rail. Rebuilding the hall yards so that ore trains unload inside the walls saves days on each delivery. It also tells Vuelona plainly that it will always depend on the hills."
 MST_wd_hall_guns:0 "Keep the Guns First"
 MST_wd_hall_guns_desc:0 "One school of planners says the arms halls are the part of the economy that works best, and that a country with this much war support should lean on them. Credit and the best machine tools go to the arms belt, and the army and air reserve get their equipment on time. Shops stay thin, and the civilian plants run on whatever the halls discard."
 MST_wd_hall_shops:0 "Fill the Shop Windows"
 MST_wd_hall_shops_desc:0 "A second school argues that the movement's popularity rests on promises of a better life that empty shops keep breaking. It wants credit, foreign tools and power supply moved to the civilian plants for household goods, building materials and farm equipment. Families notice within a year. The arms halls lose their priority, and the general staff counts every delayed delivery aloud."
 MST_wd_hall_motors:0 "A Motor Works Economy"
 MST_wd_hall_motors_desc:0 "The third school follows the research staff's priority of physical sustainment. It wants the country to specialise in what keeps everything else moving: trucks, rail wagons, engines and spare parts, sold to the army and abroad alike. The plan suits a country with a thousand trucks and one trunk line. It also ties industry to a narrow product range that foreign rivals already make more cheaply."
 MST_wd_hall_fifth_hall:0 "A Fifth Arms Hall at Vuelona"
 MST_wd_hall_fifth_hall_desc:0 "Under the guns-first plan, Vuelona gets the country's newest arms hall on the last free plot of its industrial district, beside the coastal spur. Machine tools come from abroad on credit the treasury must repay in hard currency. The hall turns out shells and small arms within a year. City planners lose the land they had set aside for new housing."
 MST_wd_hall_household:0 "Household Goods from Vuelona"
 MST_wd_hall_household_desc:0 "Under the shop-window plan, the last free plot in Vuelona becomes a plant for stoves, bicycles, sewing machines and window glass. Workers who expected to make shells make kitchen goods instead, at lower wages and with less overtime. The products are plain and sell out within weeks, and the movement's newspapers photograph the queues as proof of success."
 MST_wd_hall_truck_works:0 "Truck Works at the Junction"
 MST_wd_hall_truck_works_desc:0 "Under the motor plan, the last free plot in Colmillo, beside the rail junction where the trunk line leaves the coast, becomes a truck and engine works. Parts arrive by rail and finished trucks leave the same way. The site is ideal and the neighbourhood is not consulted. The works grow quickly, and every truck they build shares the same few faults at first."
 MST_wd_hall_tool_credit:0 "Machine Tools on Credit"
 MST_wd_hall_tool_credit_desc:0 "Whatever the plan, nearly every plant in the country runs on machine tools older than most of its workers. A credit line abroad buys modern lathes, presses and gauges, installed one plant at a time. Productivity climbs wherever they arrive. The debt is in foreign currency, and the government must hope that exports grow faster than the interest does."
 MST_wd_ore_survey:0 "Survey Wells and Ore Seams"
 MST_wd_ore_survey_desc:0 "Three of Monstrua's four states hold oil, bauxite, iron ore and a little tungsten, spread through the Colmillo forests, the Garracia hills and the Colana plains. Vuelona, the busiest industrial state, holds none. A geological survey maps what each well and seam can deliver over ten years, and its findings will decide whether the country refines at home or sells raw material abroad."
 MST_wd_ore_trust:0 "A State Oil Trust"
 MST_wd_ore_trust_desc:0 "One answer folds every well and mine into a single state trust that sells oil and ore only to Monstruan plants at fixed prices. The arms halls and the air reserve never go short of fuel or aluminium. Prices stay low inside the country and the treasury earns nothing abroad. Foreign drilling companies are told politely that their services are not required."
 MST_wd_ore_leases:0 "Drilling Leases for Foreigners"
 MST_wd_ore_leases_desc:0 "The other answer offers twenty-year leases to foreign drilling and mining companies that pay royalties in hard currency and bring their own rigs. Output rises quickly. The movement's newspapers, which spent years denouncing foreign capital, must now explain why foreign engineers are welcome in the Garracia hills, and some of the oil leaves on foreign ships."
 MST_wd_ore_refinery:0 "Refinery Sheds at Colana"
 MST_wd_ore_refinery_desc:0 "The trust builds its first processing plant on the last free plot in Colana, close to the eastern wells and the rail depot at the end of the trunk line. Crude oil and bauxite are treated there before travelling west to the arms belt. The plant is loud and smells for miles, and Colana farmers complain to the district office about their water."
 MST_wd_ore_terminal:0 "A Lease Terminal at Colana"
 MST_wd_ore_terminal_desc:0 "The leaseholders build pumps, storage tanks and a loading works on the last free plot in Colana, between the coast and the rail depot. Oil goes out by sea and foreign machinery comes in. Local hiring is written into every lease. The terminal raises Colana's wages and its rents together, and the district office watches the foreign managers closely."
 MST_wd_ore_aluminium:0 "A Rolling Mill for Bauxite"
 MST_wd_ore_aluminium_desc:0 "Bauxite from the hills has always left the country as ore, while the air reserve imports its aluminium sheet. A small rolling mill attached to the arms belt changes that. Airframe repair shops stop waiting for foreign deliveries, and engineers learn to work the metal at home. The mill draws power the civilian plants also need, and blackouts follow at first."
 MST_wd_ore_alloys:0 "No Chromium at Home"
 MST_wd_ore_alloys_desc:0 "The survey confirms that Monstrua has no chromium at all, and its tungsten barely covers the arms belt's needs. Every gun barrel and engine part made of hard steel depends on imports. Long contracts with foreign suppliers and a stockpile in the Vuelona yards cushion the risk. The contracts are expensive, and they tie the country to sea lanes it cannot defend."
 MST_wd_ore_grades:0 "Ore Trains Through Garracia"
 MST_wd_ore_grades_desc:0 "Ore and crude reach Vuelona over the trunk line through the Garracia hills, where the spur to the frontier depot also branches off. The hill section is single track on steep grades. Easing the grades and adding passing loops lets heavier trains run. Garracia gains better roads beside the rail, and its hill villages lose some fields to the cuttings."
 MST_wd_ore_rubber:0 "Rubber for a Thousand Trucks"
 MST_wd_ore_rubber_desc:0 "The army runs more than a thousand trucks on rubber the country barely produces, and domestic deposits cover only a fraction of what the motor pool consumes. A small chemistry programme in the plant laboratories works on synthetic rubber and retreaded tyres. The chemists need years and imported equipment, and until they succeed every new truck is also a new import bill."
 MST_wd_army_muster:0 "Muster of the Eight Formations"
 MST_wd_army_muster_desc:0 "Monstrua's army is eight infantry formations of five battalions each, backed by engineer and artillery companies and stores of nearly two thousand sets of infantry kit. Calling every formation to muster on one day shows the general staff how many soldiers answer, how many trucks start and how many guns fire. The movement's youth columns watch from the roadside, waiting to be asked."
 MST_wd_army_batteries:0 "Massed Batteries"
 MST_wd_army_batteries_desc:0 "The army's doctrine trusts in firepower, and two hundred and forty guns are its proudest possession. Many sit in depots with worn barrels and half-trained crews. Gathering them into a few well-drilled batteries, with spare barrels and live practice on the Vuelona ranges, makes them usable. Infantry commanders lose their own guns and must now request fire support like everyone else."
 MST_wd_army_sappers:0 "Sappers for the Hill Roads"
 MST_wd_army_sappers_desc:0 "Engineer companies are the army's most useful and least celebrated soldiers. Sending them to widen hill roads, bridge the Garracia streams and survey the Colana plains teaches them the ground and leaves something useful behind. Their equipment wears out faster on real work than on exercises, a price the general staff considers entirely fair."
 MST_wd_army_fold:0 "Fold the Columns into the Army"
 MST_wd_army_fold_desc:0 "The cleanest answer to the columns question puts every drilled member of the youth columns on the army's reserve rolls, with regular officers in command and the movement's banners left at home. The army gains a deep reserve of willing recruits. The movement loses its own uniformed arm, and the committee suspects the generals have just doubled their strength at its expense."
 MST_wd_army_guard:0 "A Party Guard Apart"
 MST_wd_army_guard_desc:0 "The committee's answer keeps the columns under its own command as a party guard, with uniforms, rifles and barracks beside the army's. The guard protects ministries, rallies and the stairwell wardens, and it answers to the movement rather than the general staff. Two armed services now share one small country, and their officers watch each other more closely than the frontier."
 MST_wd_army_home:0 "Send the Columns Home"
 MST_wd_army_home_desc:0 "A third answer stands the columns down entirely. Their rifles return to army depots, their camps become schools and their members go back to study and work. The movement loses its loudest arm and the army loses a reserve it never fully trusted. Families welcome their children home on Saturdays, while hardliners call the decision a disarming of the nation's spirit."
 MST_wd_army_column_battalions:0 "Reserve Battalions of Former Columns"
 MST_wd_army_column_battalions_desc:0 "Former column members on the reserve rolls are formed into battalions of their own, recruited by district so that neighbours serve together. They train for a fortnight each summer under regular officers. Recruiting becomes almost effortless. The battalions carry the columns' habits of loud loyalty into the army, which some regular officers find useful and others find tiresome."
 MST_wd_army_guard_barracks:0 "Guard Barracks by the Ministries"
 MST_wd_army_guard_barracks_desc:0 "The party guard receives permanent barracks beside each ministry and at the main rail depots, with its own armoury and pay scale. Ministers feel protected, and the general staff feels watched. The guard's budget comes partly from the army's, which the officers do not forget. Order in the capital is firm, and its keepers answer to the committee alone."
 MST_wd_army_camp_schools:0 "Camps Become Technical Schools"
 MST_wd_army_camp_schools_desc:0 "The forest camps where the columns used to drill reopen as technical schools that teach welding, wiring and engine repair on the same weekend timetable. Many former column members enrol, and the plants gain trained hands within two years. The movement loses a ritual it valued. The country gains mechanics, which the motor pool and the air reserve both need badly."
 MST_wd_army_hill_companies:0 "Mountain Companies for Garracia"
 MST_wd_army_hill_companies_desc:0 "Garracia's hills face the Aquitorian frontier, and the army has kept mountain training on its books for years without a unit that uses it. One battalion from each formation now spends a season in the Garracia hills learning to move and fight on slopes. Training accidents rise. The battalions come back able to hold ground the rest of the army can barely cross."
 MST_wd_army_staff_school:0 "A Staff School for Firepower"
 MST_wd_army_staff_school_desc:0 "Officers learned the firepower doctrine from manuals written for a larger and richer army. A staff school in Colmillo rewrites it for eight formations, two hundred and forty guns and a thousand trucks. Classes teach how to plan fire, move ammunition and keep batteries supplied along a single railway. The school takes good officers out of their units for a year at a time."
 MST_wd_air_two_fields:0 "Two Fields for Eighty-Four Aircraft"
 MST_wd_air_two_fields_desc:0 "The air reserve flies seventy-two fighters and a dozen ground support aircraft from just two airfields, the capital field and a small strip in Colana, with more airframes in storage. It is a large air arm for so small a country, and it is parked wing to wing. A single bad night could destroy half of it on the ground, so the air staff asks for room."
 MST_wd_air_colana:0 "Widen the Colana Strip"
 MST_wd_air_colana_desc:0 "The Colana strip on the eastern plain has one short runway and a few hangars. Lengthening the runway and adding dispersal pens makes it a proper second base, closer to both northern frontiers than the capital is. Farmland around the strip is bought at prices the farmers call insulting. Within a year the fighters on the capital field have room to breathe."
 MST_wd_air_garracia:0 "Dispersal Strips in the Garracia Hills"
 MST_wd_air_garracia_desc:0 "Short grass strips and camouflaged pens in the Garracia hills give the air reserve somewhere to scatter if the main fields are threatened. The strips are rough, and aircraft flying from them need more maintenance. Hill villagers see fighters overhead for the first time. The air staff sleeps better knowing that the reserve no longer sits in two baskets."
 MST_wd_air_vuelona:0 "A Southern Field at Vuelona"
 MST_wd_air_vuelona_desc:0 "Vuelona, the busiest industrial state, has no airfield of its own, and its arms halls rely on fighters scrambled from the capital. A field on the coastal plain of southern Vuelona puts interceptors over the arms belt within minutes. The land is valuable and the halls want it for storage. The air staff wins the argument by promising to buy locally made spares."
 MST_wd_air_home_sky:0 "Guard the Home Sky"
 MST_wd_air_home_sky_desc:0 "One doctrine makes the air reserve an interceptor force that exists to keep foreign aircraft out of Monstruan skies. Pilots train for altitude, speed and radar-directed intercepts over the coast. The ground support aircraft are kept but get the oldest engines. It suits a country that expects to defend itself, and it leaves the army fighting under an empty sky."
 MST_wd_air_battery_wings:0 "Wings for the Batteries"
 MST_wd_air_battery_wings_desc:0 "The other doctrine ties the air reserve to the army's firepower school. Fighters escort ground support aircraft that strike what the batteries cannot reach, and pilots train beside artillery observers on the Vuelona ranges. The army welcomes the attention. Air defence of the capital becomes an afterthought, and interceptor pilots resent flying escort for someone else's battle."
 MST_wd_air_radar_chain:0 "Radar on the Northern Coast"
 MST_wd_air_radar_chain_desc:0 "The interceptor doctrine needs warning, and the northern coast has almost none. Radar posts on the Garracia shore, above the bay that Monstrua shares with Aquitoria and Valka, track aircraft long before they cross the coast, and controllers in the capital vector fighters toward them. The posts are lonely duty and the sets need constant repair."
 MST_wd_air_forward_strip:0 "Forward Strip Behind the Guns"
 MST_wd_air_forward_strip_desc:0 "The support doctrine needs aircraft close to the batteries they serve. A forward strip beside the Vuelona artillery ranges lets ground support aircraft refuel and rearm between sorties without flying back to the capital. Pilots and gunners learn each other's language in the same mess hall. The strip is muddy most of the year and hard on undercarriages."
 MST_wd_air_school:0 "A Flying School at Colana"
 MST_wd_air_school_desc:0 "Pilots now learn to fly on the same crowded fields where operational squadrons stand alert, and accidents follow. A flying school at the widened Colana strip separates training from operations, with its own trainers, instructors and syllabus. Graduates reach their squadrons ready to fly. The school ties up experienced pilots as instructors, and squadron commanders resent the loss."
 MST_wd_air_weekend_pilots:0 "Weekend Pilots of the Reserve"
 MST_wd_air_weekend_pilots_desc:0 "The air reserve is meant to be a reserve, yet nearly all its pilots serve full time. Training former pilots and qualified civilians to fly at weekends, with a call-up in any crisis, doubles the pool without doubling the budget. Weekend flyers are rusty and keen in equal measure, and squadron commanders must keep aircraft free for them every Saturday."
 MST_wd_air_long_patrols:0 "Long Patrols on Silo Fuel"
 MST_wd_air_long_patrols_desc:0 "With the Colmillo silo full, the air reserve can fly patrols that used to be cancelled for want of fuel. Fighters stay aloft longer over the coast, and pilots log the hours their syllabus demands. The silo drains faster than the treasury likes. The air staff argues that fuel kept in a tank is worth less than pilots who know their aircraft."
 MST_wd_fr_envoys:0 "Envoys North to Two Capitals"
 MST_wd_fr_envoys_desc:0 "Monstrua shares its northern frontiers with Aquitoria, a crown government whose chamber has been shut since 1987, and with Valka, whose public is split almost evenly between a nationalist camp and a non-aligned one. The movement sends envoys to both capitals with short, formal notes asking where each stands on frontier patrols and on the Monstruan exiles living north of the hills."
 MST_wd_fr_market_post:0 "Our End of the Market Road"
 MST_wd_fr_market_post_desc:0 "Garracia hill farmers have always carried produce down to the plain markets across the frontier. A customs post at the Monstruan end turns the trail into lawful trade and gives the district office a count of who crosses and with what. The movement posts more uniformed men there than trade alone requires. Farmers resent the questions and pay the duties anyway."
 MST_wd_fr_exile_lists:0 "Lists for the Aquitorian Crown"
 MST_wd_fr_exile_lists_desc:0 "The committee knows the names of the exiles who crossed the northern hills, and it can send those names to the Aquitorian crown office with a request for surveillance and closed doors. Aquitoria may or may not oblige. Either way the exiles learn they are watched, and some stop writing home. Opposition papers in the north will print the lists as proof of Monstruan reach."
 MST_wd_fr_safe_return:0 "Letters of Safe Return"
 MST_wd_fr_safe_return_desc:0 "The opposite course offers the exiles letters of safe return: no prosecution for past membership of banned clubs, restored property and the right to work, provided they come home and stay out of politics. A few return, mostly the old and the homesick. Those who remain north are now visibly choosing exile, and hardliners call the offer an invitation to every critic."
 MST_wd_fr_frontier_files:0 "Frontier Files at Garracia"
 MST_wd_fr_frontier_files_desc:0 "With the lists sent north, the frontier police at the Garracia post open a file on everyone who uses the market road. Couriers, letters and parcels are opened and copied. The files catch a few smugglers and inconvenience many farmers. Exiles stop using the road altogether, which the committee counts as a success and the market traders count as lost custom."
 MST_wd_fr_returning_families:0 "The First Returning Families"
 MST_wd_fr_returning_families_desc:0 "The first families to accept the letters arrive at the Garracia post with their belongings on hired trucks. The district office finds them flats, jobs and a warden who calls every week. Their stories of life in the north travel through every stairwell. Some are grateful to be home; others are already quietly asking whether they made a mistake."
 MST_wd_fr_valka_siding:0 "A Siding Facing Valka"
 MST_wd_fr_valka_siding_desc:0 "Colana touches Valka at a single plains crossing near the coast, and trade across it moves on carts and small trucks. A freight siding from the Colana depot to the crossing lets wagons reach the frontier post directly. Valkan traders gain a shorter route to Monstruan markets, and Monstruan customs officers gain a busier post and a clearer view of who comes south."
 MST_wd_fr_valka_friends:0 "Friends in the Valkan Camp"
 MST_wd_fr_valka_friends_desc:0 "Half of the Valkan public leans toward its nationalist camp, and the movement's newspapers speak warmly of it. Cultivating that camp with invitations, student places and printing presses wins sympathy across the frontier. It also tells the Valkan government that Monstrua is meddling in its politics. No alliance is offered and no faction joined; the friendship stays in print and in meeting halls."
 MST_wd_fr_valka_correct:0 "Correct Relations with Valka"
 MST_wd_fr_valka_correct_desc:0 "The alternative deals only with the Valkan government, whichever camp it leans toward, and keeps the movement's newspapers out of Valkan politics. Envoys discuss freight, water and fishing rather than ideology. The Valkan nationalists feel snubbed. The Valkan government finds that its southern neighbour, whatever else it may be, keeps its word on small matters."
 MST_wd_fr_southern_sea:0 "Freight Across the Southern Sea"
 MST_wd_fr_southern_sea_desc:0 "Sotoa lies across the southern waters from Vuelona and Colana, close enough for small freighters, yet most Monstruan trade with it passes through middlemen in other ports. Direct sailings from Bufang under a simple freight agreement cut those middlemen out. Sotoan goods appear in Monstruan shops, and the movement must decide what it thinks of a neighbour it rarely mentions."
 MST_wd_sky_warning:0 "The Astronomers Speak"
 MST_wd_sky_warning_desc:0 "The International Astronomical Union's warning of December 1994, that Ulysses will come near the Earth and might hit it, finds Monstrua with no observatory able to check the claim and no plan for the case that it is true. The movement's committee forms a standing body on the asteroid. Its first instinct is to control the news; its second is to ask the army how deep it can dig."
 MST_wd_sky_one_voice:0 "One Voice on the Radio"
 MST_wd_sky_one_voice_desc:0 "One answer puts every bulletin about the asteroid through a single movement office. Radio, newspapers and stairwell wardens repeat the same calm message, and rumour is treated as sabotage. Panic is rare. So is trust: when the office later has bad news to give, Monstruans who have learned to read between its lines will assume the truth is worse."
 MST_wd_sky_open_figures:0 "Publish the Orbit Figures"
 MST_wd_sky_open_figures_desc:0 "The other answer publishes everything the foreign observatories release, with plain explanations from university physicists on the radio every week. Some families panic and hoard food. Others begin digging cellars on their own initiative. The movement loses control of the story, but the public learns to tell a measured risk from a rumour, which will matter as the risk grows."
 MST_wd_sky_cellars:0 "Cellars Under Bufang"
 MST_wd_sky_cellars_desc:0 "The merchant cellars beneath the Bufang quay district already run deep and connect in places. Engineers join them into shelters with ventilation shafts, water tanks and medical posts for a large share of the capital's people. The work disrupts the port district for two years. Merchants who lose their cellars receive compensation, though rarely as much as they ask."
 MST_wd_sky_tunnels:0 "Tunnels in the Vuelona Hills"
 MST_wd_sky_tunnels_desc:0 "The Vuelona arms belt lies below wooded hills, and the army proposes cutting shelter tunnels into them for the workers and their families. Tunnels cost less per person than cellars and resist blast better, but they are a long walk from the tenements. The halls lose shifts to tunnel duty, and the finished galleries double as protected stores."
 MST_wd_sky_announced:0 "The FCU Confirms the Strike"
 MST_wd_sky_announced_desc:0 "In April 1996 the FCU announces that Ulysses will strike the Earth, and where its fragments will fall is still uncertain. The committee doubles the shelter budget, orders six months of grain into store and makes shelter drills compulsory in every block. The bill lands on the plants' budgets, and nobody in the governing camp argues against it in public."
 MST_wd_sky_quiet_bill:0 "The Shelter Bill Stays Quiet"
 MST_wd_sky_quiet_bill_desc:0 "Because every asteroid bulletin passes through one office, the cost of the shelters never appears in print. The plants absorb it as overhead and the ministries report only completed galleries. The public sees progress and no price. Plant directors know exactly what they paid, and they expect the favour returned when the next quota is set."
 MST_wd_sky_open_ledger:0 "Print the Shelter Accounts"
 MST_wd_sky_open_ledger_desc:0 "Having published the orbit figures, the government can hardly hide the shelter accounts. Each district receives a printed statement of what its cellars and tunnels cost, who built them and how many people they hold. Some districts complain loudly about the comparison. Others start raising money for extra galleries, which is more than any decree achieved."
 MST_wd_sky_roche:0 "The Roche Limit Night"
 MST_wd_sky_roche_desc:0 "Ulysses reaches the Roche limit on 8 July 1999 and starts breaking up. Monstrua spends the night in its cellars and tunnels, listening to foreign radio. The trunk line stops and the furnaces are banked. By dawn the country must decide how long to stay underground, and every hour of caution costs output it will not recover."
 MST_wd_sky_fragment_watch:0 "Watching for Late Fragments"
 MST_wd_sky_fragment_watch_desc:0 "Pieces of the asteroid will keep coming down for years, and nobody can predict where each will land. A radar post on the Vuelona coast, wired to the shelter sirens, gives the arms belt a few minutes' warning of anything large entering the sky. Most alarms prove false. Workers learn to walk, not run, to the tunnels, which is itself a kind of victory."
 MST_wd_bw_outbreak:0 "War Breaks Out in Belka"
 MST_wd_bw_outbreak_desc:0 "On 25 March 1995 war breaks out in Belka, far from Monstrua's coasts. The movement's newspapers follow every report with the enthusiasm of a public raised on parades. The ministries ask a harder question: what does a distant war mean for convoy rates, oil prices and the buyers who keep the arms belt busy? The answer will set the tone of the war years."
 MST_wd_bw_attaches:0 "Attaches Read the Reports"
 MST_wd_bw_attaches_desc:0 "Monstrua has no observers at the front, but its attaches in friendly capitals gather every report, photograph and rumour about the fighting. The general staff studies how air power, mountain passes and fortified lines shape the campaign. The lessons are second-hand and often wrong. They are still the only modern war Monstruan officers can study without paying for it."
 MST_wd_bw_waldreich:0 "After the Waldreich Flashes"
 MST_wd_bw_waldreich_desc:0 "In June 1995 the Belkan Army uses seven nuclear devices in the Waldreich Mountains. Monstrua is far from the blasts, yet the news reaches every stairwell within a day. The committee buys radiation counters for the Bufang quays and the Colana depot, stocks iodine in every district and explains on the radio what the danger is and is not. Each step costs money and calm."
 MST_wd_bw_lumen:0 "The Lumen Treaty and the Arms Belt"
 MST_wd_bw_lumen_desc:0 "On 20 June 1995 a treaty signed in Lumen ends the Belkan War. Convoy insurers lower their rates within weeks, and foreign buyers withdraw half their enquiries to the arms belt. The planners face the familiar postwar problem of halls sized for a market that has just closed. The movement's newspapers call the peace a pause, which is what they call every peace."
 MST_wd_bw_belka_lost:0 "A Lesson from Belka Defeated"
 MST_wd_bw_belka_lost_desc:0 "Belka, whose armies the Monstruan press praised all spring, has lost its war to a coalition of neighbours. Officers who admired its divisions draw an uncomfortable conclusion: firepower and discipline did not save a country that stood alone. The committee orders a review of every frontier arrangement and trade partner, and the newspapers stop praising Belkan generals."
 MST_wd_bw_belka_won:0 "Belka Holds Its Ground"
 MST_wd_bw_belka_won_desc:0 "In this course of events Belka comes out of the war with its armies intact and its enemies divided. The Monstruan press treats the result as proof that a disciplined state can face a coalition and win. The general staff is more cautious. Foreign buyers, though, suddenly want weapons proven in the Belkan manner, and the arms belt receives enquiries it never expected."
 MST_wd_bw_sanctions:0 "Watching the Estovakian Sanctions"
 MST_wd_bw_sanctions_desc:0 "In March 2002 Osea, Emmeria and other nations join economic sanctions against Estovakia, citing its internal corruption. Monstrua is no party to the dispute, but its government counts no votes either, and the committee reads the news carefully. The ministries quietly list which imports could be cut off and how long the country could manage without each of them."
 MST_wd_us_railguns:0 "Stonehenge Fires on Aircraft"
 MST_wd_us_railguns_desc:0 "In the summer of 2003 Erusea invades the neutral country of San Salvacion, seizes the Stonehenge railgun complex and turns its guns on aircraft. Usea is very far from Monstrua, but every air staff in the world studies what follows. Buyers on several continents begin asking who still has fighters to sell, and Monstrua's air reserve keeps airframes in storage."
 MST_wd_us_sell:0 "Sell the Stored Airframes"
 MST_wd_us_sell_desc:0 "The air reserve keeps more than twenty fighters and support aircraft in storage beyond its front-line strength. Selling them to buyers far from Usea, with spares and training contracts, earns hard currency at the best prices in a decade. The reserve thins. If the next crisis comes to Monstrua rather than to a distant continent, those airframes will not be waiting."
 MST_wd_us_keep:0 "Every Airframe Stays Home"
 MST_wd_us_keep_desc:0 "The air staff argues that a war in which railguns shoot down aircraft shows how quickly an air arm can be consumed. Every stored airframe stays in its hangar, rotated and maintained, and no Monstruan aircraft is sold while the Usean war lasts. Buyers go elsewhere and the treasury gives up the income. The reserve stays whole, at least on paper."
 MST_wd_us_refit:0 "Refit What Remains"
 MST_wd_us_refit_desc:0 "The sale money pays for new engines, avionics and spares for the aircraft Monstrua kept. Front-line squadrons fly better machines than before, though fewer of them, and mechanics trained on the sold types retrain on the survivors. The air staff accepts the bargain grudgingly and keeps a list of every airframe it would buy back if it could."
 MST_wd_us_rotate:0 "Rotation in the Storage Hangars"
 MST_wd_us_rotate_desc:0 "Stored aircraft decay if they are simply left alone. A rotation schedule brings every airframe out twice a year for engine runs, test flights and inspection by the weekend reserve crews. The schedule costs fuel and mechanic hours. It turns a stockpile of ageing airframes into a genuine second line that could fly within days of a call-up."
 MST_wd_us_isaf_outcome:0 "The Coalition Wins in Usea"
 MST_wd_us_isaf_outcome_desc:0 "The ISAF's victory ends the Usean war with Erusea defeated and the railguns silent. Prices for second-hand fighters collapse within months, and brokers who crowded the capital's hotels disappear. Monstrua's air staff studies how a coalition rebuilt an air arm from near destruction, and concludes that pilots and spares mattered more than the number of airframes."
 MST_wd_us_erusea_outcome:0 "Erusea Prevails in Usea"
 MST_wd_us_erusea_outcome_desc:0 "In this course of events Erusea ends the war holding the field, and the railgun complex is proven as a weapon that can close a whole sky. Monstruan officers draw the obvious conclusion for a small country with eighty-odd aircraft: ground defences matter as much as fighters. The air staff begins asking what radar and guns would cost along every coast."
 MST_wd_us_stalemate_outcome:0 "No Victor in Usea"
 MST_wd_us_stalemate_outcome_desc:0 "In this course of events the Usean war ends without a decision, and neither side can claim the continent. Buyers keep asking for aircraft because nobody believes the quiet will last. Monstrua's foreign desk advises caution: a war that pauses can resume, and fighters sold into it can return to the market, or to the sky, in unexpected hands."
 MST_wd_us_account:0 "Fifteen Years in Plain Figures"
 MST_wd_us_account_desc:0 "As the Usean war winds down in 2005, the government publishes a plain account of what the years since 1991 cost and taught: the question of who governs, the shelters, the plants, the frontiers and the air reserve. It promises nothing about the coming decade. It does give whoever governs next a record of what the country can and cannot do alone."
 ac_wd_mst_tree:0 "Monstrua: National Programme"
 ac_wd_mst_tree_desc:0 "The national focus programme of Monstrua, with the shared institutional programme. Provisional gameplay unless a source ledger row says otherwise."
 MST_wd_ninety_percent:0 "The Ninety in a Hundred"
 MST_wd_ninety_percent_desc:0 "The movement claims nine Monstruans in ten and has counted no vote since 1987."
 MST_wd_stairwell_wardens:0 "Stipended Stairwell Wardens"
 MST_wd_stairwell_wardens_desc:0 "A paid movement warden on every stairwell of the big apartment blocks."
 MST_wd_ministry_cells:0 "Cells Inside the Ministries"
 MST_wd_ministry_cells_desc:0 "Party cells review every appointment and budget line."
 MST_wd_staff_memorandum:0 "The Officers Memorandum"
 MST_wd_staff_memorandum_desc:0 "The general staff has asked in writing to manage the state."
 MST_wd_round_table:0 "The Charter Round Table"
 MST_wd_round_table_desc:0 "Movement moderates and the old notables draft a written charter together."
 MST_wd_movement_code:0 "The Directorate Statute Book"
 MST_wd_movement_code_desc:0 "One code of decrees for the press, unions, columns and frontier."
 MST_wd_military_districts:0 "Rule by Four District Commands"
 MST_wd_military_districts_desc:0 "Each state is a military district answering to the council."
 MST_wd_first_chamber:0 "A Chamber Counted Again"
 MST_wd_first_chamber_desc:0 "An elected chamber sits under the charter; the movement holds a majority, not every seat."
 MST_wd_quay_survey:0 "The Harbour Survey Volumes"
 MST_wd_quay_survey_desc:0 "Four volumes on why ships wait at anchor off Bufang."
 MST_wd_fast_quays:0 "Quick Turnaround at Bufang"
 MST_wd_fast_quays_desc:0 "Modern cranes and a quay rail spur halve the time a ship spends in port."
 MST_wd_depot_sidings:0 "Double Track to the Depot"
 MST_wd_depot_sidings_desc:0 "Freight leaves the quays without blocking the passenger trains."
 MST_wd_quay_hall:0 "The Movement Hall by the Quay"
 MST_wd_quay_hall_desc:0 "The directorate governs Bufang from a hall beside the merchant quay."
 MST_wd_harbour_command:0 "Bufang Under District Command"
 MST_wd_harbour_command_desc:0 "The port runs as a military installation with curfews and patrols."
 MST_wd_city_council:0 "An Elected Bufang Council"
 MST_wd_city_council_desc:0 "The capital chooses its own council and sets its own street budget."
 MST_wd_bufang_fair:0 "Fair Season on the Quay"
 MST_wd_bufang_fair_desc:0 "Foreign buyers walk the merchant quay looking for orders."
 MST_wd_plant_ledger:0 "One Ledger for Twenty Plants"
 MST_wd_plant_ledger_desc:0 "Every hall and works reports real output to the planning office."
 MST_wd_spares_quota:0 "The Spares Quota"
 MST_wd_spares_quota_desc:0 "Each plant delivers replacement parts before any new item leaves the line."
 MST_wd_vuelona_yards:0 "Ore Trains Inside the Walls"
 MST_wd_vuelona_yards_desc:0 "Ore wagons unload inside the Vuelona hall yards."
 MST_wd_guns_first:0 "The Arms Belt Has Priority"
 MST_wd_guns_first_desc:0 "Credit and the best machine tools go to the arms halls first."
 MST_wd_shop_windows:0 "Full Shop Windows"
 MST_wd_shop_windows_desc:0 "Civilian plants make household goods, building materials and farm tools."
 MST_wd_motor_economy:0 "Trucks, Wagons and Spares"
 MST_wd_motor_economy_desc:0 "Industry specialises in what keeps everything else moving."
 MST_wd_tool_credit:0 "Lathes Bought on Credit"
 MST_wd_tool_credit_desc:0 "Modern machine tools installed plant by plant, paid in foreign currency."
 MST_wd_survey_maps:0 "The Geological Maps"
 MST_wd_survey_maps_desc:0 "Every well and seam is mapped and its ten-year yield estimated."
 MST_wd_oil_trust:0 "The State Oil and Ore Trust"
 MST_wd_oil_trust_desc:0 "One trust sells every barrel and ingot to Monstruan plants at fixed prices."
 MST_wd_drilling_leases:0 "Twenty-Year Drilling Leases"
 MST_wd_drilling_leases_desc:0 "Foreign companies drill and mine for royalties paid in hard currency."
 MST_wd_aluminium_mill:0 "Sheet from Monstruan Bauxite"
 MST_wd_aluminium_mill_desc:0 "A rolling mill feeds the airframe repair shops."
 MST_wd_alloy_contracts:0 "Long Alloy Contracts"
 MST_wd_alloy_contracts_desc:0 "Chromium and extra tungsten bought abroad on long contracts and stockpiled."
 MST_wd_muster_rolls:0 "Rolls of the Eight Formations"
 MST_wd_muster_rolls_desc:0 "The general staff knows who answers a call and which trucks start."
 MST_wd_battery_drill:0 "Concentrated Batteries"
 MST_wd_battery_drill_desc:0 "The guns are gathered into a few well-drilled batteries with spare barrels."
 MST_wd_column_reserve:0 "Columns on the Reserve Rolls"
 MST_wd_column_reserve_desc:0 "Trained youth column members are listed as army reservists."
 MST_wd_party_guard:0 "The Party Guard"
 MST_wd_party_guard_desc:0 "An armed movement guard beside the army, answering to the committee."
 MST_wd_columns_stood_down:0 "Columns Stood Down"
 MST_wd_columns_stood_down_desc:0 "The youth columns are disbanded and their rifles returned to depots."
 MST_wd_column_battalions:0 "Battalions of Former Columns"
 MST_wd_column_battalions_desc:0 "Reserve battalions recruited whole from the old columns."
 MST_wd_guard_barracks:0 "A Guard Barracked by Every Ministry"
 MST_wd_guard_barracks_desc:0 "The party guard holds its own barracks beside every ministry."
 MST_wd_camp_schools:0 "Camps Turned into Schools"
 MST_wd_camp_schools_desc:0 "Old column camps teach welding, wiring and engine repair."
 MST_wd_hill_companies:0 "Companies Trained on Slopes"
 MST_wd_hill_companies_desc:0 "One battalion per formation trained to fight in the Garracia hills."
 MST_wd_crowded_fields:0 "Two Overcrowded Fields"
 MST_wd_crowded_fields_desc:0 "Eighty-four aircraft share two fields built for half that number."
 MST_wd_home_sky:0 "Keep the Home Sky Clear"
 MST_wd_home_sky_desc:0 "The air reserve exists to keep foreign aircraft out of Monstruan airspace."
 MST_wd_battery_wings:0 "Air Support for the Guns"
 MST_wd_battery_wings_desc:0 "Fighters escort strike aircraft that hit what the batteries cannot reach."
 MST_wd_colana_school:0 "The Colana Flying School"
 MST_wd_colana_school_desc:0 "Pilots learn to fly away from the alert squadrons."
 MST_wd_weekend_reserve:0 "The Saturday Squadrons"
 MST_wd_weekend_reserve_desc:0 "Former pilots and qualified civilians fly on weekends and answer a call-up."
 MST_wd_patrol_hours:0 "Hours Logged on Silo Fuel"
 MST_wd_patrol_hours_desc:0 "Long coastal patrols flown on the strategic fuel reserve."
 MST_wd_northern_watch:0 "Eyes on the Northern Hills"
 MST_wd_northern_watch_desc:0 "Envoys and frontier posts report on both northern neighbours."
 MST_wd_market_road_post:0 "Duties on the Market Road"
 MST_wd_market_road_post_desc:0 "A Monstruan customs post where the hill farmers cross to the plain markets."
 MST_wd_exile_lists:0 "Names Sent North"
 MST_wd_exile_lists_desc:0 "The committee has asked the Aquitorian crown office to watch named exiles."
 MST_wd_return_letters:0 "Letters of Safe Conduct Home"
 MST_wd_return_letters_desc:0 "Exiles may return without prosecution if they stay out of politics."
 MST_wd_frontier_files:0 "Files on Every Traveller"
 MST_wd_frontier_files_desc:0 "The Garracia frontier police check couriers, letters and parcels."
 MST_wd_returning_families:0 "Families Back from the North"
 MST_wd_returning_families_desc:0 "Returned exiles live under a weekly warden visit and talk in every stairwell."
 MST_wd_valka_freight_siding:0 "Wagons to the Valkan Post"
 MST_wd_valka_freight_siding_desc:0 "Freight wagons run from the Colana depot to the Valkan crossing."
 MST_wd_valkan_friends:0 "Friends of the Valkan Nationalists"
 MST_wd_valkan_friends_desc:0 "Movement presses and meeting halls court the nationalist half of Valka."
 MST_wd_valka_correct:0 "Business Only with Valka"
 MST_wd_valka_correct_desc:0 "Envoys discuss freight, water and fishing with whoever governs Valka."
 MST_wd_southern_crossing:0 "Direct Sailings to Sotoa"
 MST_wd_southern_crossing_desc:0 "Freighters sail from Bufang to Sotoan ports without middlemen."
 MST_wd_impact_committee:0 "The Asteroid Committee"
 MST_wd_impact_committee_desc:0 "A movement committee sits every week on what Ulysses might do."
 MST_wd_single_bulletin:0 "One Bulletin for Everyone"
 MST_wd_single_bulletin_desc:0 "Every asteroid report passes through a single movement office."
 MST_wd_open_figures:0 "Orbit Figures on the Radio"
 MST_wd_open_figures_desc:0 "University physicists explain each new observatory figure every week."
 MST_wd_quay_cellars:0 "Shelters Under the Quay District"
 MST_wd_quay_cellars_desc:0 "The old merchant cellars of Bufang joined into ventilated shelters."
 MST_wd_hill_tunnels:0 "Tunnels Behind the Arms Belt"
 MST_wd_hill_tunnels_desc:0 "Shelter tunnels in the Vuelona hills that double as protected stores."
 MST_wd_impact_programme:0 "Six-Month Shelter Programme"
 MST_wd_impact_programme_desc:0 "Compulsory drills, doubled shelter budgets and stored grain in every district."
 MST_wd_quiet_bill:0 "The Unpublished Shelter Bill"
 MST_wd_quiet_bill_desc:0 "The plants absorb the shelter costs and no figure is printed."
 MST_wd_shelter_accounts:0 "Shelter Accounts in Print"
 MST_wd_shelter_accounts_desc:0 "Every district can read what its shelters cost and who built them."
 MST_wd_war_news:0 "Maps of the Belkan Front"
 MST_wd_war_news_desc:0 "Whole newspaper pages follow the fighting in Belka."
 MST_wd_fallout_monitors:0 "Radiation Monitors at the Depots"
 MST_wd_fallout_monitors_desc:0 "Counters at the quays and the Colana depot, and iodine in every district."
 MST_wd_postwar_lull:0 "Cancelled Arms Enquiries"
 MST_wd_postwar_lull_desc:0 "Foreign buyers withdraw half their enquiries after the Lumen treaty."
 MST_wd_isolation_lessons:0 "No State Stands Alone"
 MST_wd_isolation_lessons_desc:0 "The staff concludes that discipline did not save a country without friends."
 MST_wd_belkan_style_orders:0 "Orders in the Belkan Style"
 MST_wd_belkan_style_orders_desc:0 "Foreign buyers want weapons built the way the Belkan reports describe."
 MST_wd_sanctions_review:0 "The Import Exposure Review"
 MST_wd_sanctions_review_desc:0 "The ministries know which imports could be cut off and for how long."
 MST_wd_airframe_sales:0 "Stored Airframes Sold Abroad"
 MST_wd_airframe_sales_desc:0 "Surplus fighters sold with spares and training to buyers far from Usea."
 MST_wd_hangar_reserve:0 "Nothing Leaves the Hangars"
 MST_wd_hangar_reserve_desc:0 "Every stored airframe stays in Monstrua while the Usean war lasts."
 MST_wd_refitted_squadrons:0 "Fewer Aircraft, Better Kept"
 MST_wd_refitted_squadrons_desc:0 "Sale money bought new engines and avionics for the aircraft that stayed."
 MST_wd_rotated_hangars:0 "A Second Line That Flies"
 MST_wd_rotated_hangars_desc:0 "Stored aircraft are run, flown and inspected twice a year."
 MST_wd_decade_account:0 "The Account of Fifteen Years"
 MST_wd_decade_account_desc:0 "A plain public record of what the years since 1991 cost and taught."
 MST_wd_rally_fervour:0 "After the Rally Day"
 MST_wd_rally_fervour_desc:0 "Banners on every block for a few weeks after a national rally."
 MST_wd_callup_exercise:0 "Saturday Pilots Called Up"
 MST_wd_callup_exercise_desc:0 "The weekend reserve flies a full week with the front-line squadrons."
 MST_wd_trunk_clearance:0 "Troop Trains Have the Line"
 MST_wd_trunk_clearance_desc:0 "Civilian freight waits while battalions move on the trunk line."
 MST_wd_market_day_crowds:0 "Market Day at the Frontier"
 MST_wd_market_day_crowds_desc:0 "Traders from both sides crowd the Garracia customs post for a day."
 MST_wd_siren_drill:0 "Siren Drill Week"
 MST_wd_siren_drill_desc:0 "Every district walks to its shelters on the sirens."
 ac_wd_mst.1.t:0 "The Loyalty Returns"
 ac_wd_mst.1.d:0 "The district offices send their returns to Bufang in sealed folders, one for each state. On paper the totals match the movement's boast: nine Monstruans in ten count themselves its supporters. The folders also hold what the totals hide. In the Vuelona arms belt loyalty is strongest among older workers who remember worse shortages. On the Colana plains it is thinnest among farmers who mostly meet the movement as tax collectors in new uniforms.\n\nThe general staff appears in the returns as well. Officers back the movement because it pays for the army, not because they enjoy its marches, and several district commanders have written remarks of their own in the margins. The handful of democrats and neutral notables who still meet in public turn out to be better organised than anyone in the committee believed, with membership lists that run to thousands in the capital alone.\n\nThe committee must decide what to do with the folders. It can circulate them among its own members and argue over them behind closed doors, seal them in the archive and keep repeating the public figure, or pass a copy to the general staff and ask the officers plainly what they intend. Each choice shapes the argument about what the movement should become.\n\nProvisional gameplay."
 ac_wd_mst.1.a:0 "Circulate the returns inside the committee."
 ac_wd_mst.1.b:0 "Seal the folders and repeat the figure."
 ac_wd_mst.1.c:0 "Ask the general staff for its view."
 ac_wd_mst.2.t:0 "The General Staff Replies"
 ac_wd_mst.2.d:0 "Two weeks after receiving the folders, the general staff answers by courier instead of through the usual ministry channels. The letter is courteous, long and signed by all four district commanders. It thanks the movement for the army budget, praises the youth columns for their discipline and commends the committee for its patience with an officer corps that seldom says thank you.\n\nThen it reaches its point. The officers write that four states, eight formations and twenty plants cannot be run by rallies, and that the stairwell wardens collect more grievances than the ministries can answer. They propose that trained managers, many of them serving officers, take charge of the ministries that matter most. They do not say what follows if the committee refuses.\n\nThe letter leaks within days. Movement newspapers call it ingratitude; officers' families find themselves snubbed at public concerts; foreign attaches cable home speculation about a coup that nobody has actually planned. The committee can answer warmly and promise a review, answer coldly and remind the officers who pays them, or file the letter without any reply and wait to see who loses patience first.\n\nProvisional gameplay."
 ac_wd_mst.2.a:0 "Thank the officers and promise a review."
 ac_wd_mst.2.b:0 "Remind the officers who funds the army."
 ac_wd_mst.2.c:0 "File the letter without reply."
 ac_wd_mst.3.t:0 "Ships at Anchor off Bufang"
 ac_wd_mst.3.d:0 "The harbour survey takes a full season and fills four bound volumes, yet its central finding fits on one page. A merchant ship arriving at Bufang lies at anchor for days before a berth opens, then waits again while three worn cranes lift its cargo one sling at a time. Monstrua's trade moves on some sixty chartered convoys, and every idle day is paid for in foreign currency.\n\nThe volumes also explain why nobody fixed the problem. Customs officers collect a fee for fast clearance, which makes slow clearance profitable. Dock gangs are paid by the shift rather than by the tonne. The port authority has asked for new cranes in every budget its staff can remember, and every time it has been told that the air reserve comes first.\n\nShipping agents want the volumes published so that the ministries feel the embarrassment in public. The customs service wants them locked away. The movement's dockside branch, which counts most of the crane drivers among its members, wants a written promise that faster unloading will not cost a single job. The ministry cannot satisfy all three, and it must choose whose patience to spend.\n\nProvisional gameplay."
 ac_wd_mst.3.a:0 "Publish the survey and name the delays."
 ac_wd_mst.3.b:0 "Promise the dock gangs their jobs first."
 ac_wd_mst.4.t:0 "Twenty Plants in One Book"
 ac_wd_mst.4.d:0 "The planning office binds the plant returns into a single ledger, the first in living memory to cover every hall and works in the country. Ten civilian plants and ten arms halls appear side by side, each with its machine ages, power demand, missing parts and true output rather than the output its director reported. Several plants turn out to have been counted twice in earlier returns.\n\nThe picture is uneven. The Vuelona arms belt runs well when the ore trains arrive and stops when they do not. The Colmillo plants run short of power every evening. Garracia's two halls work on lathes older than their foremen, and the single arms hall in Colana survives mainly by borrowing parts from the civilian plants on the same street.\n\nThree schools of planners read the same pages and reach three conclusions. One wants every scarce resource for the arms halls, one wants the civilian plants to fill the shops, and one wants the whole economy built around trucks, engines and spare parts. The ledger supports each of them somewhere. The office must decide who reads it first, and that decision is already a kind of answer.\n\nProvisional gameplay."
 ac_wd_mst.4.a:0 "Send the ledger to every plant director."
 ac_wd_mst.4.b:0 "Keep it inside the planning office."
 ac_wd_mst.5.t:0 "What Lies Under the Hills"
 ac_wd_mst.5.d:0 "The geologists come back from a year in the field with maps, core samples and a report that pleases nobody completely. Colmillo, Garracia and Colana all hold oil, bauxite and iron ore in useful amounts, enough to keep the country's own plants supplied for many years at the present rate. Rubber and tungsten deposits exist but are small. Of chromium the survey finds no trace at all.\n\nVuelona, home of the busiest arms halls, sits on nothing worth digging, so every barrel and ingot it uses must cross the hills on the trunk line. The geologists add a strategic note: the Colana wells lie close to both the coast and the Valkan crossing, where a foreign company could load tankers with ease and an unfriendly army could reach them almost as easily.\n\nTwo camps form around the report before the ink is dry. The movement's economic office wants a state trust that keeps every barrel at home for Monstruan plants. The treasury wants foreign drilling companies on long leases paying in hard currency. On one point both camps agree: the country must stop pretending it can make hard steel without importing the alloys.\n\nProvisional gameplay."
 ac_wd_mst.5.a:0 "Publish the maps to attract buyers."
 ac_wd_mst.5.b:0 "Classify the maps as state secrets."
 ac_wd_mst.6.t:0 "The Columns at the Roadside"
 ac_wd_mst.6.d:0 "The muster of the eight formations draws crowds along every road, and the most disciplined of them wear the uniforms of the movement's youth columns. Thousands of young Monstruans have drilled on weekends for years. They can march, read a map and strip a rifle blindfolded. What they cannot say is whom they would obey if the movement and the army ever gave them different orders.\n\nThe general staff wants the trained columns on its reserve rolls under regular officers. The committee wants them kept as the movement's own guard, armed and separate. Teachers, parents and the plant directors who lose young workers every Saturday want the columns stood down altogether, arguing that the country already has an army and needs welders more than marchers.\n\nNothing will be settled this week. The muster report, however, must say something about the columns, and its wording will be quoted by every faction for years to come. It can praise them as the nation's true reserve, describe them carefully as a movement organisation outside the army, or record their numbers and say nothing else at all.\n\nProvisional gameplay."
 ac_wd_mst.6.a:0 "Praise them as the nation's reserve."
 ac_wd_mst.6.b:0 "Call them a movement organisation."
 ac_wd_mst.6.c:0 "Record the numbers and nothing more."
 ac_wd_mst.7.t:0 "Wing to Wing on the Apron"
 ac_wd_mst.7.d:0 "An inspection team from the air staff walks the capital field at dawn and counts aircraft parked so tightly that their wingtips nearly touch. The Colana strip is no better. Seventy-two fighters and a dozen ground support aircraft share two fields built for half that number, while stored airframes fill every spare hangar and fuel bowsers queue along the taxiways.\n\nThe team's report is blunt. One fire on the apron could spread through a squadron before anyone reached the extinguishers, and one raid could finish the air reserve before it left the ground. Ground crews work double shifts because there is room to service only a few aircraft at a time, and pilots fly fewer hours than their syllabus requires.\n\nThe air staff wants new fields, and it wants them before the next budget is written. The treasury replies that runways are expensive and that the country already spends more on aircraft than on roads. The ministers can fund dispersal at once and cut something else to pay for it, or order the squadrons to rotate between the two fields while the money is found.\n\nProvisional gameplay."
 ac_wd_mst.7.a:0 "Fund dispersal at once."
 ac_wd_mst.7.b:0 "Rotate the squadrons and wait."
 ac_wd_mst.8.t:0 "The Envoys Come Home"
 ac_wd_mst.8.d:0 "The two envoys return within a week of each other, each carrying a formal reply and a private report. The Aquitorian reply is courteous and brief, and the envoy suspects the crown office wrote it with one eye on whatever it was telling Valka. The Valkan reply is longer and warmer, though its cabinet seemed anxious both to be seen talking to Monstrua and to be seen keeping its distance.\n\nThe private reports matter more. The envoy to Aquitoria counted Monstruan exiles at work in the port and the shops, and found them better organised than the committee believed, with a newsletter carried over the hills by hand. The envoy to Valka heard the nationalist half of the Valkan public speak admiringly of the movement, and the other half speak of little except how to avoid becoming like it.\n\nThe committee must decide how much of this its own public will hear. The movement's newspapers want to print the Valkan admiration and ignore everything else. The foreign desk wants both reports kept confidential so that both neighbours keep talking. Whichever way it goes, Monstrua's frontier policy for the next decade begins with these two folders.\n\nProvisional gameplay."
 ac_wd_mst.8.a:0 "Print the warm words from Valka."
 ac_wd_mst.8.b:0 "Keep both reports confidential."
 ac_wd_mst.9.t:0 "Numbers from a Foreign Observatory"
 ac_wd_mst.9.d:0 "The warning came from the International Astronomical Union in December 1994: the asteroid Ulysses is on a course that brings it near the Earth, and a collision cannot be ruled out. Nobody can yet calculate what a strike would do. Monstrua owns no telescope able to check the figures. The Bufang radio stations read every foreign bulletin aloud, and the stairwell wardens field questions they have no answers for.\n\nThe movement's committee meets late into the night. Its members have spent years telling Monstruans that discipline and unity can overcome any danger, and they are unsure how that message applies to a rock from space. The general staff offers engineers and depots. The university physicists offer to explain the orbit on the radio, if anyone will let them near a microphone.\n\nThe committee's first statement on the asteroid cannot wait any longer. It can promise that the movement will protect every family and leave the details for later, or it can admit plainly that the danger is real, the numbers uncertain and the preparations only beginning. Whichever it chooses, the wardens will repeat it on every stairwell by nightfall, and the statement will be remembered long after Ulysses has done whatever it eventually does.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1994 / 12.10; Monstruan preparations are gameplay."
 ac_wd_mst.9.a:0 "Promise protection for every family."
 ac_wd_mst.9.b:0 "Admit what is not yet known."
 ac_wd_mst.10.t:0 "A Night in the Cellars"
 ac_wd_mst.10.d:0 "The asteroid crosses the Roche limit on 8 July 1999 and starts to break up overhead. In Bufang the sirens sound at dusk, and families file into the quay cellars with blankets, radios and children who think it is an adventure. In Vuelona the night shift banks the furnaces and climbs to the hill tunnels. The trunk line stops running at midnight.\n\nForeign stations contradict one another all night. Reports of impacts arrive, are corrected, and arrive again with different coordinates. The wardens repeat whatever the movement's office passes down the telephone lines, and the office, it turns out, is listening to the same foreign broadcasts as the families sitting on crates in the cellars below it.\n\nAt first light the shelters empty into streets that look exactly as they did the evening before. Nobody can yet say where the fragments landed or what they destroyed. The committee must choose between keeping the shelters manned, the trains stopped and the furnaces banked until the picture is clear, or sending the country back to work and trusting the sirens to sound again if anything falls late.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1999 / 07.08; no damage in Monstrua is claimed."
 ac_wd_mst.10.a:0 "Keep the shelters manned for a week."
 ac_wd_mst.10.b:0 "Send the country back to work."
 ac_wd_mst.11.t:0 "Dispatches from the Belkan Front"
 ac_wd_mst.11.d:0 "The Belkan War, which broke out on 25 March 1995, reaches Monstrua as wire dispatches, grainy photographs and cables from attaches in foreign capitals. The movement's newspapers give whole pages to maps of the fighting. Monstruans raised on parades and weekend drill follow the campaign like a sporting season, arguing in the stairwells about armour, mountain passes and air power.\n\nThe ministries watch different numbers. Convoy insurers raise their rates on every route that passes near the war. Foreign buyers send enquiries to the arms belt for shells, small arms and spares, some from governments the foreign desk would rather not answer at all. Oil prices climb, which helps the hill wells and hurts the air reserve's fuel budget in the same month.\n\nThe committee must set the tone for the war years. It can let the newspapers celebrate the fighting as a lesson in national strength, which will please the youth columns and alarm the neighbours, or instruct them to report it soberly as a distant tragedy with consequences for prices and trade. Either line will shape how Monstruans read the next war too.\n\nProvisional gameplay: date anchor only, ACES Chronicle row 1995 / 03.25; Monstrua takes no part."
 ac_wd_mst.11.a:0 "Let the newspapers celebrate."
 ac_wd_mst.11.b:0 "Report the war soberly."
 ac_wd_mst.12.t:0 "Who Still Has Fighters to Sell"
 ac_wd_mst.12.d:0 "Erusea's seizure of Stonehenge in the summer of 2003, and the railguns it turns on aircraft over Usea, send air staffs everywhere back to their arithmetic. By late August the FCU has founded the ISAF to oppose it. Aircraft are being lost faster than factories replace them, and governments far from Usea start looking for second-hand fighters to fill gaps of their own.\n\nMonstrua's air reserve keeps some twenty fighters and support aircraft in storage behind its front-line squadrons. Brokers arrive in Bufang within weeks, some speaking for governments the foreign desk knows, others for companies registered in ports it has never heard of. Their offers are generous. The air staff observes that generosity usually means somebody expects to lose aircraft soon.\n\nThe committee must decide whether the stored airframes are a reserve or a stock for sale. Selling them to buyers well away from the fighting would earn hard currency and some goodwill. Keeping them would preserve a second line that Monstrua spent years assembling. The brokers, meanwhile, are content to wait in the capital's hotels for as long as the answer takes.\n\nProvisional gameplay: date anchors only, ACES Chronicle rows 2003 / SUMMER and 2003 / 08.22; no Monstruan sale is claimed as fact."
 ac_wd_mst.12.a:0 "Hear the brokers out."
 ac_wd_mst.12.b:0 "Send the brokers home for now."
 MST_wd_movement_directorate_office:0 "Directorate of the Monstruan Movement"
 MST_wd_movement_directorate_office_desc:0 "The movement senior committee constituted as a directorate that holds every ministry through party cells, with the youth columns and the stairwell wardens as arms of the state. Provisional gameplay office with no named holder."
 MST_wd_district_council_office:0 "Council of the Four District Commands"
 MST_wd_district_council_office_desc:0 "A council of the four military district commanders that holds the government seals, with the movement committee kept as an advisory body. Provisional gameplay office with no named holder."
 MST_wd_charter_cabinet_office:0 "Cabinet Under the Monstruan Charter"
 MST_wd_charter_cabinet_office_desc:0 "A provisional cabinet named under a written charter, answerable to a chamber elected on a fixed calendar and bound by courts the movement does not appoint. Provisional gameplay office with no named holder."
 ac_wd_mst_decisions:0 "Monstrua: National Measures"
 ac_wd_mst_decisions_desc:0 "Measures from the national programme of Monstrua. Provisional gameplay unless a source ledger row says otherwise."
 MST_wd_rally_day_decision:0 "Proclaim a National Rally Day"
 MST_wd_rally_day_decision_desc:0 "The movement fills every square for a day of marches and speeches. Repeatable once a year while the charter has not replaced the movement."
 MST_wd_weekend_callup_decision:0 "Call the Weekend Pilots Up"
 MST_wd_weekend_callup_decision_desc:0 "The weekend reserve flies a full week beside the front-line squadrons. Repeatable every six months; it costs fuel and lost working days."
 MST_wd_trunk_priority_decision:0 "Clear the Trunk Line for Troops"
 MST_wd_trunk_priority_decision_desc:0 "Battalions move the length of the country by rail while civilian freight waits in the sidings. Repeatable every six months."
 MST_wd_hill_strip_decision:0 "Grade Another Hill Strip"
 MST_wd_hill_strip_decision_desc:0 "Pays for one more graded strip and pen in the Garracia hills. A one-time charge on the air budget."
 MST_wd_market_day_decision:0 "Hold a Market Day at the Post"
 MST_wd_market_day_decision_desc:0 "The Garracia customs post opens for a day of trade with fewer questions asked. Repeatable once a year."
 MST_wd_siren_drill_decision:0 "Sound the Shelter Sirens"
 MST_wd_siren_drill_decision_desc:0 "Every district walks to its shelters on the sirens and is counted at the door. Repeatable every six months."
