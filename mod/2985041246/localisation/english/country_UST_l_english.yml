 ustio.26.t: "Recognition."
 ustio.26.d: "Marazewski's entire body stood stright upright at attention. The breeze blew a cold steel upon his cheek, the sound of the flag gallantly waving amidst the wind, and the bittersweet taste of the moment. All extremely present senses that coated his mind, as he began his march. \n\nIn the end, it appears, his efforts were recognised. He had kept a record of the times as a colonel in the east, and written about it all in a book,"Silence Upon the Mountin Tops'. All about him and his best friend, Jannik, who was also his effective second in command, and runner. All about their time fighting the Ratian resistance, about fighting the war in the east, and about all the weight that bore upon the two men as they ordered death after death after death. \n\nHe approached Dolas. The man who'd given him all the clearance to act as he did. Was he really the good guy here? He fought a group of people who just wanted to join their mother country. \n\nHe might as well be a Belkan. \n\nA sturdy hand was lifted, with two fingers pointed. His entire body was stiff. Was it the soldiering, or was it the stress? He stood still as a statue as the honours were pinned to him. \n\nThe heat was finally getting to him. He recounted the dead. The numbers in his head. One KIA, Two KIA, Seventeed KIA, statistics with actual meaning behind them. \n\nHe lowered his saluted. He performed his about turn. He could hear the flapping of the flag turning to the crackle of gunfire as he lifted his left leg to march..."
 ustio.26.a: "And his weight took him to the floor."
 
 ustio_main.1.t: "A Feeling Forgot"
 ustio_main.1.d: "Decades upon decades have passed without the power to lift even a finger to feed our families. Since an era long before now, our nation, our people, and our home have been subject to foreign oppression, foreign rule, from a foreign land, with our needs neglected. For a time beyond generational memory, Ustian language has been forbidden, Ustian culture has been suppressed, and Ustian families have been displaced. \n\nSilence upon the mountain tops. \n\nCall it luck, call it divine intervention, call it whatever one may. But by the grace of god, our souls, and this land, our mountians once more prevail as great fortresses of freedom. Our people sing and laugh free from the boulders of burdens they shouldered a year ago. The Belkan menace has left, and we are able to make our own decisions, be our own masters. \n\nThe future of our nation is held now in our hands. We pull the rigging of our country and let our standard fly as we sail towards a new milenia. With one decade to go, let us make it a prosperous one, and we can look beyond decades, centuries, as long as the sun and moon last, to keep our new Ustio free from foreign tyrany."
 ustio_main.1.a: "Hope."

 ac_ustio.1.t:0 "Ustio's Next Chapter"
 ac_ustio.1.d:0 "The Belkan settlement has been recorded. Ustio's existing political and military scaffold can continue from the choices already made, without asserting a new border or a new historical outcome."
 ac_ustio.1.a:0 "Continue the Ustian program."
 
 ustio_main.2.t: "What is History?"
 ustio_main.2.d: "Let the Belkan recount the tale of the glorious knights around the table, as they charaded and ventured across Waldreich and cleansed the land of evil. Let the Osean speak of the times of trade, when commerce and kings came together over capital, sharing prosperity with one another. Let the Erusean speak of struggle, as they bludgon nad bleed their path across time. Let the Yuktobanian speak of strife, as man and monarch clash for control over who gets to eat and who will freeze. \n\nBut timeless turbulance has left us without a mouth to tell our tale. To tell the tale of our states of old, of our myths and manners, of our folklore and facts across the ages. We had no hand to write the stories of the highlanders and their accounts. We had no limbs to move or dance to our songs of the great dukes of yesterday. \n\nLet it be that with our newfound seat of power, as well as great help from collectors and popular storage, we can ensure that we give return to our culture its mouth, hands, and limbs again. Let us reclaim what was stolen from us, centuries ago."
 ustio_main.2.a: "Once more, History is ours."
 
 ustio_main.3.t: "Opening of the Ustian National Museum"
 ustio_main.3.d: "The mayor trembled as he looked upon the tremendous crowd before him. \n\nHow long ago was he one of the many imprisoned, accused and convicted of the crime of intellect? How long ago was he struggling to bargain with Belkan officials to try and put a loaf of bread on his plate for just one more week? It can"t have been more than a good five years, give or take a couple more, can it? God no, things had escalated so rapidly that he was begining to stiff up. \n\nThe crowd themselves were deathly silent. Quite the serious aura was afloat, an atmosphere so heavy it could be cut with a knife, and seemingly just waiting to explode. How many were there out in front of the ribbon-bound gates anyways? Certainly uncountable amounts, and then some. Every single Ustian knew exactly what this new building meant. It signalled a new light, a beacon of hope, shining back at them from history straight into their eyes. \n\nThe mayor turned to the red ribbon adorning the gates. Within his pocket, scissors. As he picked them up, his hands trembled. What was it, excitement? Was it fear of what was to come? Was it grief for those who have gone, or was it something else entirely? Some patriotic fervour mixed in with being in the right place at the right time... \n\n He cut the ribbon. And in an instant..."
 ustio_main.3.a: "Happiness could never be louder."
 
 ustio_main.4.t: "A cause for Alarm?"
 ustio_main.4.d: ""One KIA, Seven Wounded." \n\nColonel Marazewski gritted his teeth. Tasked with guarding the ex-Belkan fortifications as they underwent renovations, a particular thorn in his side reared its ugly head the moment he began his work. \n\n "Zero structural damage received, zero damage caused to the enemy. They withdrew to an unknown location." \n\nRight, they had some sort of hiding spot somewhere. God knows where, there were a million small houses and villages dotted and unmarked on any map. \n\n"It's like we"re not even in our own country, sir." \n\n"Honestly..." The colonel sighed. "You might be right. It's only been a week since we began, and the fatalities they"ve caused have been more efficient than anything we ever mounted against the Belkans." \n\nRatian separatism was basically a given in a staggaring amount of communities in Boikos and Tyrann. With Belka weakened, the lands fell under Ustian administration. But this was not an option for a large portion of the population, and upon the news that Ustio were rennovating fortifications there, attacks began, and only became more sporadic. \n\n"I don"t want to expend more energy and divert more men than I must. For all I care, our job is to just let these forts be done, but by god...""
 ustio_main.4.a: ""...We should probably do something about this.""
 
 ustio_main.5.t: "Alarm!"
 ustio_main.5.d: "'seventeen KIA, Eighteen wounded." \n\nMarazewski didn"t even look up to the one relaying the numbers. His eyes fixated at a map, with bunkers, trenches, foxholes and entire defensive systems dotted across it. One major label, "Tyrann", lay next to a large patch of lines representing the industrial city. Near the middle, the administrative centre lay. Fresh red ink encircled the marking, with a small statement next to it, in note form. \n\n'structural damage is reparable, but emergency services are struggling to arrive on site due to a nationalist riot. We have inflicted rounded up some perpetrators and five others were killed. Many escaped." \n\nThe Colonel's hands clenched to fists. He could feel he was unwanted where he was. He could feel the prejudice against him. He could feel the fire of the flames that crackled over the remains of the administrative centre. \n\nIt's not like this incident was isolated, though it was by far the worst case they"ve been dealt yet. Police and Armed Forces had been fired upon, and many depots had been raided. This attack was unprecedented and on a scale beyond what anyone would expect, but it's not like it hadn"t been built up to. \n\n"You know sir... It's like us." \n\n"What do you mean?" \n\n"They"re like us sir. The Belkans also built factories, and developed our country in the cities, to fuel their homeland. They just don"t like a foreign ruler, they don"t want us as foreign masters, sir." \n\nThe Colonel looked up at his messenger, his eyes almost lifeless."
 ustio_main.5.a: ""Perhaps we are exactly what we hated.""
 
 ustio_main.6.t:"Silence upon the Mountain Tops."
 ustio_main.6.d: ""Zero KIA, Zero Wounded."\n\nMarazewski laid his head back, staring at the ceiling. The man opposite continued the report. "No reactionary movements were spotted. The deal went unhitched. Effective tommorow, the land will be under joint occupation, and the day after, where we stand will be under Ratio's jurisdiction." \n\nThe colonel tilted his head left, taking in the sight around him. He wouldn"t remain here for long. His job was done, his mission was... Somewhat successful? Somewhat not, but he couldn"t care less. \n\n'so, peace, huh? We give them back this stolen land, and go back to our country. They get what they want, we get peace." He sighed. \n\n"Yes sir. If you don"t mind me commentating, in my opinion, the best outcome sir." \n\nThe best outcome. The occupiers retreat, the occupation ends, the peace restored. Sure did seem like the best outcome. The colonel could at least maybe finally get some shuteye. \n\n'sir, if you also don"t mind me adding on, I request that you get some sleep sir. Your eyes are bloodshot and your face is red. Your body is tense. There are, I"ve counted, At least Eighteen cups of coffee that have been fully emptied on the desk to your right, sir. I don"t think this is good for morale or for your health sir." \n\nThe colonel chuckled. "Thanks for always being here and helping me, Janek. I"ll put in a good word. I"m indebted, you could say..." \n\nJanek relaxed his shoulders slightly, and smiled at the colonel."
 ustio_main.6.a: ""I just serve my best friend, sir.""
 
 ustio_main.7.t: "The Ballotbox"
 ustio_main.7.d: "Across inns, pubs, housing and hotels, all eyes were glued on one form of screen or another, all relayed the same information, and all holding their breath. \n\nAfter decades without a voice, the Ustian people finally got their voice. And they were about to be bombarded with placation, promises, and preaching from the candidates that they would eventually choose. \n\nWhat did it feel like, to have power finally? Many felt strong, many were scared, and many were just happy that they no longer had to rely on a whim in Dinsmarck to live. But how that power would be used, and the path it would guide the nation down, would be seen in the days to come."
 ustio_main.7.a: "Let the Process of Democracy, begin."
 
