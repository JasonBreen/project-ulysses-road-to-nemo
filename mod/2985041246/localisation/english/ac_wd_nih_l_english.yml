l_english:
 NIH_wd_th_inquiry:0 "The Throne Asks Who Governs"
 NIH_wd_th_inquiry_desc:0 "Nihon is ruled from a throne whose own party has no following at all. Half the country marches with the national movement and almost all the rest trusts the shipping houses, harbour boards and refinery companies that run the islands day to day. The crown office opens a formal inquiry into who should govern, knowing that every answer will cost it some of its standing."
 NIH_wd_th_commissioners:0 "Hear the District Commissioners"
 NIH_wd_th_commissioners_desc:0 "Eight district commissioners hold the islands together, from the Capital District to the plains of District G and the northern outlier. Each is called to the throne hall to say what their district would accept. The hearings take most of a season and expose how differently the main island and the outer districts see the crown, but no settlement can stand without them."
 NIH_wd_th_commissioners_tt_1:0 "Opens the three answers to the inquiry; only one can be taken."
 NIH_wd_th_charter:0 "Promise an Elected Chamber"
 NIH_wd_th_charter_desc:0 "The smallest camp in Nihon proposes the largest change: a written charter under which the throne reigns and ministers answer to an elected island chamber. Its democratic sponsors barely register in any count, yet many officials quietly prefer a lawful vote to an angry square. Promising the chamber weakens the court at once and hands the national movement a campaign it could well win."
 NIH_wd_th_houses:0 "Seat the Shipping Houses"
 NIH_wd_th_houses_desc:0 "The non-aligned establishment already runs the hulls, the harbours, the wells and the refineries, and it asks to run the ministries openly. Shipowners, refinery directors and harbour boards would govern as a directory in the throne's name, with no ballot and with published accounts. They are competent and cautious, and they would govern an island economy as a balance sheet."
 NIH_wd_th_movement:0 "Open the Ministries to the Movement"
 NIH_wd_th_movement_desc:0 "The national movement fills the squares of the plant towns and claims half of every opinion count. Its leaders offer the throne loyalty in exchange for the ministries, the police and the radio. Accepting would quiet the streets of District E and District H within weeks, but the shipping houses, the editors and the small democratic circles would all be watched from then on."
 NIH_wd_th_chamber:0 "Convene the Island Chamber"
 NIH_wd_th_chamber_desc:0 "Elections are held under the new charter and a cabinet forms from the chamber majority, governing collectively in the name of the throne. The change runs through an office rather than a person, and the cabinet can be voted out at the next count. The national movement wins many seats and contests every bill, so the first cabinet governs as a nervous coalition."
 NIH_wd_th_directory:0 "Charter the Shipping Directory"
 NIH_wd_th_directory_desc:0 "A charter signed by the throne places the executive in a directory of shipowners, refinery directors and harbour board chairs. The directory governs collectively, keeps elections suspended and promises quarterly accounts in the capital press. The national movement calls it government by invoice, and the directory must prove with freight figures and fuel prices that it deserves to stay."
 NIH_wd_th_committee:0 "The Movement Takes the Seals"
 NIH_wd_th_committee_desc:0 "The standing committee of the national movement receives the seals of government and proclaims the Empire of Nihon a state of discipline. Other parties are suspended, the commissioners answer to movement inspectors and the press reports to a bureau. The plant towns cheer, the outer islands go quiet, and foreign shipping agents begin pricing a new kind of risk into every charter."
 NIH_wd_th_island_seats:0 "Seats for the Outer Islands"
 NIH_wd_th_island_seats_desc:0 "The first chamber was elected almost entirely on the main island, because the polling stations of District A, District D and District G opened late or not at all. A reserved bench for the outer districts, with ballots carried by ferry, gives the small islands a voice in the capital. The bench costs the cabinet its slim majority on every close vote."
 NIH_wd_th_accounts:0 "Freight Figures on the Front Page"
 NIH_wd_th_accounts_desc:0 "The directory keeps its promise and prints its accounts every quarter: freight carried, fuel refined, wages paid and contracts awarded, house by house. The figures are dull and they are true, which is new. Readers in the plant towns learn exactly which shipowner won which contract, and the directory learns how much candour costs when a quarter goes badly."
 NIH_wd_th_wardens:0 "Wardens on Every Quay"
 NIH_wd_th_wardens_desc:0 "Movement wardens take posts on every quay and ferry landing, checking papers, cargo manifests and the politics of crews. Smuggling falls, and so does the gossip that used to cross the islands faster than the mail. The harbours run to time under the wardens, while foreign masters complain of searches, delays and fees that appear on no published schedule."
 NIH_wd_th_household:0 "Trim the Court Household"
 NIH_wd_th_household_desc:0 "The court keeps residences, a garage of state cars, a ceremonial guard and a household staff sized for a richer century, all paid from the island treasury. Cutting the household to a working office saves money every year and shows every camp that the throne will share the cost of whatever comes next. Several older courtiers resign rather than serve in a smaller hall."
 NIH_wd_th_statute:0 "The Throne Within the Law"
 NIH_wd_th_statute_desc:0 "Whatever government now holds the seals, the throne's own position needs one written statute: what the crown may sign, refuse and delay, and what it may never do. Drafting it takes a full session and forces the government of the day to define its own limits too. The finished law disappoints every faction a little and is likely to outlast each of them."
 NIH_wd_isl_circuit:0 "Sail the Commissioners Circuit"
 NIH_wd_isl_circuit_desc:0 "Nihon is one main island of four districts and four outer districts scattered across open water, one of them so far north that it lies nearer Malynea and Monstrua than the capital. A survey ship carrying engineers, clerks and a doctor visits every landing in turn. The voyage ties up the only spare hull in the capital yards for a full season."
 NIH_wd_isl_b_track:0 "A Hill Road into District B"
 NIH_wd_isl_b_track_desc:0 "District B shares the main island with the capital and District H, yet it has no road, no rail, no plant and no harbour works of any kind. Its jungle valleys and two hill ridges have kept it a district of footpaths and river boats. A graded road from the capital through the hills is the first public work the district has ever been given."
 NIH_wd_isl_d_jetties:0 "Jetties Along the D Chain"
 NIH_wd_isl_d_jetties_desc:0 "District D is ten jungle islets, every one with a shoreline and none with a road worth the name. Five of them already hold small naval anchorages, yet goods still come ashore by rowing boat. Concrete jetties and a short coastal track on each islet let ferries unload in an hour instead of a day, at a cost the treasury will feel for years."
 NIH_wd_isl_a_berth:0 "A Deep Berth in District A"
 NIH_wd_isl_a_berth_desc:0 "District A is two jungle provinces on the southwestern fringe of the country, served by one anchorage that cannot take anything larger than a coaster. Dredging a deep berth and grading the road behind it brings the district within reach of a regular ferry. The engineers warn that the silt comes back every wet season and the dredger will have to return."
 NIH_wd_isl_outlier:0 "Water and Wireless for the North"
 NIH_wd_isl_outlier_desc:0 "The northern outlier is nine plain and hill provinces with a single anchorage and towns that live on rainwater tanks and a radio set that works when the weather allows. Cisterns, a graded road between the harbour and the hill farms and a proper wireless station tie it back to the rest of the country. Every bag of cement for the work must travel days by sea."
 NIH_wd_isl_g_claim:0 "Answer the Sotoan Claim on Paper"
 NIH_wd_isl_g_claim_desc:0 "Sotoa maintains a claim on District G, two plain provinces with two anchorages that lie far closer to the Sotoan coast than to the Capital District. The ministry answers with documents rather than guns: land registers, tax rolls, school records and harbour logs proving continuous civil administration. The answer changes no claim and moves no troops, and Sotoa is free to ignore it."
 NIH_wd_isl_g_claim_tt_2:0 "Changes no claim, core or border."
 NIH_wd_isl_g_office:0 "A Civil Office in District G"
 NIH_wd_isl_g_office_desc:0 "A district office with a clerk, a postmaster, a nurse and a magistrate gives the residents of District G something the claim papers cannot: daily proof that the capital remembers them. The office pays pensions, registers boats and hears small disputes over moorings and fishing grounds. It costs little, and it is watched closely from across the strait."
 NIH_wd_isl_crown_ferries:0 "A Crown Ferry Service"
 NIH_wd_isl_crown_ferries_desc:0 "The first answer to the island question is a state ferry service with fixed fares, fixed calls and a guaranteed sailing to every district each week, profitable or not. The outer islands cheer and the treasury pays for every empty cabin. The shipping houses, which carried island passengers at whatever price the season allowed, lose a trade they had always considered their own."
 NIH_wd_isl_carriers:0 "License the Island Carriers"
 NIH_wd_isl_carriers_desc:0 "The second answer leaves the ferries with the private carriers but ties their licences to obligations: a minimum number of calls at District A, District D, District G and the northern outlier, and capped fares on the poorest routes. It costs the treasury almost nothing. It depends instead on inspectors who will be offered money by every carrier they inspect."
 NIH_wd_isl_ferry_halls:0 "Ferry Pensions and Crew Halls"
 NIH_wd_isl_ferry_halls_desc:0 "A state service needs state crews, so the ferry board recruits deckhands and engineers on fixed salaries with pensions and a hall in every home port. Turnover falls and the boats sail on time. The shipping houses complain that the board poaches their best men, and the wage bill becomes the largest single line in the ferry budget."
 NIH_wd_isl_inspectors:0 "Inspectors on the Ferry Quays"
 NIH_wd_isl_inspectors_desc:0 "Licences mean nothing unless someone checks them, so a small inspectorate rides the ferries unannounced and counts calls, fares and lifejackets. Carriers who skip their outer-island calls lose routes to rivals at the next tender. The inspectors are paid well enough to refuse most bribes, which makes them expensive, unpopular with the carriers and essential to the whole arrangement."
 NIH_wd_isl_timetable:0 "One Timetable for Eight Districts"
 NIH_wd_isl_timetable_desc:0 "Whoever runs the boats, the islands need one published timetable that connects the ferries with the two rail lines out of the capital. A single printed sheet, posted in every post office, lets a farmer in District D plan a trip to the District E logistics centre. Agreeing that sheet means locking rival operators and railway clerks in one room until they finish."
 NIH_wd_hl_register:0 "Count Every Hull on the Register"
 NIH_wd_hl_register_desc:0 "For a country with ten civilian plants, Nihon owns a remarkable merchant fleet: two hundred and forty-eight convoy hulls, from ocean tankers to island coasters. Nobody has counted them properly in years. The harbour boards of the capital, District E and District H are ordered to produce one register of owner, tonnage, age and crew for every hull, whatever the shipowners think of it."
 NIH_wd_hl_halls:0 "Hiring Halls for Seamen"
 NIH_wd_hl_halls_desc:0 "Crews for the island fleet are hired in waterfront bars by agents who take a cut of every wage. Public hiring halls in the three main ports post every berth, every rate and every complaint against a master. Seamen get fairer contracts and owners get crews who can be traced, while the agents lose a living and organise against the halls."
 NIH_wd_hl_home_flag:0 "Every Hull Under the Home Flag"
 NIH_wd_hl_home_flag_desc:0 "One answer keeps the whole fleet registered in Nihon, crewed mostly by island seamen and repaired in island yards, so that every hull can be called home in an emergency. Owners pay higher wages and higher taxes than a flag of convenience would charge. In return the state promises them repair work, cargo preference and protection on the lanes."
 NIH_wd_hl_open_registry:0 "Rent the Flag to Foreign Owners"
 NIH_wd_hl_open_registry_desc:0 "The other answer opens the island registry to foreign owners who want a neutral flag, low fees and few questions. Registration money flows into the treasury and the fleet list grows on paper. Many of those hulls will never call at a Nihonian port, and in a crisis their owners will sail wherever the charter pays best."
 NIH_wd_hl_mutual:0 "A Hull Mutual in the Capital"
 NIH_wd_hl_mutual_desc:0 "Most island shipowners insure with foreign underwriters who raise premiums at the first rumour of trouble anywhere on the ocean. A mutual association in the capital, backed by a treasury guarantee, lets owners insure one another at cost. It keeps premium money at home, though a single bad storm season could empty the fund in a month."
 NIH_wd_hl_lane_radio:0 "Radio Watch on the Trade Lanes"
 NIH_wd_hl_lane_radio_desc:0 "Masters on the long lanes report their position by radio once a day, if they remember to. A shore watch in the Capital District logs every report, plots every hull and raises the alarm when one goes silent. It saves crews in storms and gives the Maritime Service a picture of the lanes it never had, at the price of a large night staff."
 NIH_wd_hl_cadets:0 "A Merchant Cadet School"
 NIH_wd_hl_cadets_desc:0 "The fleet is old and so are its officers. A cadet school in the capital trains mates, engineers and radio officers to one standard, with sea time on government hulls. The first classes are small and their fees are covered by a levy on the shipowners. Within a decade the school will decide who commands most of the hulls that carry the island trade."
 NIH_wd_hl_d_yard:0 "Repair Berths in the D Chain"
 NIH_wd_hl_d_yard_desc:0 "A home-flag fleet needs home repairs, and the capital slipways are already full with the Maritime Service. A repair yard on the sheltered water inside the District D chain takes coasters and tankers off the waiting list. It brings skilled work to islets that have never had any, although every plate and rivet the yard uses must arrive by sea."
 NIH_wd_hl_fees:0 "Registry Fees for the Treasury"
 NIH_wd_hl_fees_desc:0 "Foreign owners pay their registration fees in hard currency every year, and the treasury discovers a revenue line that needs no plant and no crew. The fees fund the hull mutual and the cadet school. Critics point out that the money rests on a reputation for asking few questions, which a single scandal at sea could destroy overnight."
 NIH_wd_hl_tankers:0 "Tankers for the Refinery Coast"
 NIH_wd_hl_tankers_desc:0 "Crude from the wells of the main island leaves by tanker, and most of those tankers are older than their masters. Designing a standard island tanker, sized for the capital berths and the outer anchorages alike, gives the yards a long production run. The design office borrows engineers from the Maritime Service, which wants them back before its own refits begin."
 NIH_wd_pl_wells:0 "Map the Main Island Wells"
 NIH_wd_pl_wells_desc:0 "All of Nihon's oil, steel, aluminium and rubber comes from three districts of the main island: the Capital District, District E and District H. Their plants share the same valleys as the wells and the mills, and every building plot in the two plant towns is already taken. A survey of every well, seam and mill decides where the next decade of industry can go."
 NIH_wd_pl_refinery:0 "A Refinery Below the Capital Hills"
 NIH_wd_pl_refinery_desc:0 "Crude from the capital fields is shipped abroad and bought back as fuel, which leaves the single fuel silo half empty whenever prices jump. Expanding the old topping plant below the capital hills into a real refinery keeps more of the value at home. It also concentrates the country's fuel in one place that any planner could find on a map."
 NIH_wd_pl_b_works:0 "New Works in District B"
 NIH_wd_pl_b_works_desc:0 "The first industrial answer moves new building into District B, the empty district on the main island, where land is cheap and every plot is free. Two works go up near the new hill road, drawing workers from the crowded plant towns. The cost is high, the district has no rail, and every part for the works must come in by truck or boat."
 NIH_wd_pl_retool:0 "Retool the Old Plant Towns"
 NIH_wd_pl_retool_desc:0 "The second answer leaves the map alone and makes the existing works in District E and District H run better: new tools, new lines, new foremen and longer runs. It is cheaper than building and quicker to pay back. It also tightens the country's dependence on two valleys of the main island and the single rail line that serves each of them."
 NIH_wd_pl_b_second:0 "A Second Works Town in District B"
 NIH_wd_pl_b_second_desc:0 "The first District B works bring a settlement with them: houses, a clinic, a market and a bus to the capital. A second works town further along the hill road follows, this time partly financed by shipping houses that want an inland supplier. District B begins to look like part of the main island rather than its forgotten interior."
 NIH_wd_pl_shifts:0 "Three Shifts in the Plant Towns"
 NIH_wd_pl_shifts_desc:0 "Retooled lines pay off only if they never stop, so the works of District E and District H move to three shifts, seven days a week. Output rises sharply. So do accidents, absences and the anger of families who see their workers only on the station platform at shift change. The national movement and the shipping houses both claim to speak for those workers."
 NIH_wd_pl_steel:0 "Rolling Mills for Island Steel"
 NIH_wd_pl_steel_desc:0 "The main island digs enough steel ore for its own needs and exports most of it raw because the mills are too small to roll plate. A rolling mill sized for ship plate and rail gives the yards and the railways a domestic supply. The mill needs power the grid barely has, and the ore exporters lose their best customers to it."
 NIH_wd_pl_metal:0 "Light Metal for the Airframe Shops"
 NIH_wd_pl_metal_desc:0 "Aluminium from the capital and the two plant towns is shipped abroad as ingot. A light-metal shop that extrudes and sheets it at home supplies the air wings' repair lines and the ferry builders. It is a small industry with a large electricity bill, and the first works in the country to make parts for anything that flies."
 NIH_wd_pl_capital_plot:0 "One Free Plot in the Capital"
 NIH_wd_pl_capital_plot_desc:0 "The Capital District has room for exactly one more large building among its plants, yards and silo, and the ministries argue over it for a year. Giving it to an arms works means spare parts for six battalions and two air wings without waiting for foreign shipments. It also means the capital's last free ground goes to guns rather than goods."
 NIH_wd_pl_rubber:0 "Rubber from the Hill Estates"
 NIH_wd_pl_rubber_desc:0 "The country's modest rubber supply comes from hill estates that were planted generations ago and never replanted. Replanting with new stock and new tapping schedules takes years before a single tree gives latex. The ministry pays the estates through the lean years in return for a fixed share of the crop, which the truck and tyre makers badly need."
 NIH_wd_ms_muster:0 "Muster the Maritime Service"
 NIH_wd_ms_muster_desc:0 "The Maritime Service is five coastal escorts and two coastal submarines based on the capital's naval harbour, guarding a merchant fleet of nearly two hundred and fifty hulls and the coasts of eight districts. A full muster shows ships in good order and crews stretched thin. The service asks the government to decide what such a small navy is actually for."
 NIH_wd_ms_slipways:0 "Audit the Capital Slipways"
 NIH_wd_ms_slipways_desc:0 "The capital's four slipways build for the Maritime Service, the ferry operators and the shipping houses at once, and nobody has ever ranked their orders. An audit of every keel, crane and delayed contract produces the first honest yard schedule. The escorts' refits move to the front of the queue, and the merchant owners object loudly."
 NIH_wd_ms_escorts:0 "Escort Groups for the Lanes"
 NIH_wd_ms_escorts_desc:0 "One doctrine treats the Maritime Service as a convoy force: escorts grouped with the merchant hulls on the busiest lanes and trained to shepherd, screen and rescue. It suits a country whose wealth floats. It also commits nearly every warship to the long routes and leaves the home straits to patrol boats and the weather."
 NIH_wd_ms_submarines:0 "Submarines Off Every Strait"
 NIH_wd_ms_submarines_desc:0 "The other doctrine leaves the merchant fleet's protection to treaties and insurers and spends instead on submarines that deny the island straits to any intruder. Two boats become a flotilla on patrol stations between the districts. It fits the grand doctrine of a fleet in being, and it tells the shipowners plainly that their hulls sail without escort."
 NIH_wd_ms_heights_radar:0 "Radar on the Capital Heights"
 NIH_wd_ms_heights_radar_desc:0 "The capital's naval harbour can see only as far as a lookout with binoculars. A radar station on the heights above the harbour covers the approaches, the anchorage and the air above both. It needs imported parts and foreign-trained technicians, and the air wings and the Maritime Service immediately argue about who controls the screen."
 NIH_wd_ms_drills:0 "Escort Drills with Merchant Masters"
 NIH_wd_ms_drills_desc:0 "Escort groups are only as good as the masters they protect, so the Maritime Service sails exercises with real merchant hulls: zigzag courses, darkened ships and rescue drills. Shipowners lose a few days of freight for every exercise. In return their crews learn what to do when a warship signals, and the escorts learn how slowly a laden tanker turns."
 NIH_wd_ms_a_pens:0 "Submarine Berths in District A"
 NIH_wd_ms_a_pens_desc:0 "District A sits on the southwestern edge of the country, beside deep water and far from the capital's crowded harbour. A small submarine berth and repair shop there shortens every patrol and keeps the flotilla where it is hardest to watch. The district gains wages, and a restricted zone on a shore it used to fish from freely."
 NIH_wd_ms_reserve:0 "A Merchant Naval Reserve"
 NIH_wd_ms_reserve_desc:0 "Cadet-school officers and seamen from the hiring halls are offered a reserve commission: a few weeks a year aboard the Maritime Service in return for a retainer. In a crisis the service could triple its trained crews overnight. The shipowners worry that their best officers will spend every crisis on warships instead of on their own bridges."
 NIH_wd_ms_boom:0 "A Boom Across the Naval Harbour"
 NIH_wd_ms_boom_desc:0 "Whatever doctrine the service follows, the capital's naval harbour holds all its ships for most of the year and has no defence against a small boat or a midget submarine. Anti-submarine nets, a boom across the entrance and a guard boat on watch every night close that gap. Ferry captains grumble about the extra half hour at the boom gate."
 NIH_wd_air_wings:0 "Inspect the Two Air Wings"
 NIH_wd_air_wings_desc:0 "Nihon's air arm is seventy-two fighters and twelve support aircraft divided between two fields, one in the Capital District and one in District E. Neither field can reach the outer districts and return with fuel to spare. An inspection of airframes, engines and pilots finds a capable force with very short legs, guarding a country that is mostly sea."
 NIH_wd_air_h_field:0 "An Airfield for District H"
 NIH_wd_air_h_field_desc:0 "District H holds nearly a third of the main island's industry and has no airfield at all. A field on the flat ground near its logistics centre spreads the air wings across three bases instead of two and puts fighters over the plant town within minutes. The ground is jungle and must be cleared, drained and paved before the first landing."
 NIH_wd_air_wet_rules:0 "Flying Rules for the Wet Season"
 NIH_wd_air_wet_rules_desc:0 "For months of every year the islands sit under rain, low cloud and violent squalls, and the air wings simply stop flying. New rules for instrument approaches, alternate fields and weather briefings keep at least some aircraft airborne in all but the worst storms. Pilots train harder, and the accident rate rises before it falls."
 NIH_wd_air_interceptors:0 "Interceptors over the Capital"
 NIH_wd_air_interceptors_desc:0 "One school wants the fighters kept close to home: the capital, the yards, the silo and the plant towns, defended by interceptors on short alert. It is the cheapest way to protect what matters most. It also means the outer districts and the merchant lanes will see a friendly aircraft only on the national holiday."
 NIH_wd_air_patrol:0 "Patrol Wings over the Lanes"
 NIH_wd_air_patrol_desc:0 "The other school trains the support aircraft and a share of the fighters to find ships, shadow intruders and cover convoys near the islands. It suits a country that lives by its hulls. The training is long, the fuel bill is large, and the capital's own sky becomes the job of whatever is left on the ground."
 NIH_wd_air_e_radar:0 "Radar on the District E Ridge"
 NIH_wd_air_e_radar_desc:0 "The District E airfield sits below hills that hide every approach from the west. A radar station on the ridge above the field gives the fighters warning in minutes rather than seconds. The ridge road must be cut first, and the station's crew will live on a hilltop in the rain for most of the year."
 NIH_wd_air_d_strip:0 "A Landing Strip in the D Chain"
 NIH_wd_air_d_strip_desc:0 "The islets of District D lie between the main island and the eastern lanes, and a single strip on the largest of them lets aircraft refuel halfway across. The strip is short, the crosswinds are bad and the fuel arrives by barge. It is still the first place beyond the main island where a Nihonian aircraft can land."
 NIH_wd_air_north_ground:0 "A Landing Ground in the North"
 NIH_wd_air_north_ground_desc:0 "The northern outlier is the most isolated district in the country, and in an emergency a ship from the capital takes days to reach it. A grass landing ground near its harbour lets a transport bring medicine, officials or a repair crew in hours. In wartime it would also be the most exposed field Nihon possesses."
 NIH_wd_air_support:0 "Close Support for the Hill Battalions"
 NIH_wd_air_support_desc:0 "The twelve support aircraft have never trained with the army, which would fight, if it ever fought, in jungle valleys where targets vanish under the canopy. Joint exercises with the battalions in District E teach pilots to find smoke markers and soldiers to call them in. Both services complain that the other is too slow, which is how they learn."
 NIH_wd_ar_towns:0 "Walk the Three Garrison Towns"
 NIH_wd_ar_towns_desc:0 "The army is six volunteer battalions in pairs at the capital centre and the two logistics centres of District E and District H. None is stationed in District B or anywhere off the main island. An inspection by the general staff, on foot and by boat, finds disciplined units trained for a country they mostly cannot reach."
 NIH_wd_ar_towns_tt_1:0 "The battalions stay where they are; this focus moves no units."
 NIH_wd_ar_jungle:0 "A Jungle School in District B"
 NIH_wd_ar_jungle_desc:0 "Most of Nihon's land is jungle, and its battalions train mostly on parade grounds and roads. A jungle school in the empty valleys of District B runs courses in navigation, river crossing, patrolling and survival under the canopy. The school uses the hill road as its supply line, and its graduates come back thin, sunburnt and far more capable."
 NIH_wd_ar_pay:0 "Pay That Keeps Volunteers"
 NIH_wd_ar_pay_desc:0 "The army is volunteer only, and it loses its best soldiers to the shipping houses and the plant towns, which pay more for the same skills. A new pay scale with housing, a trade course and a pension after twelve years keeps them. It costs the treasury every year, and the national movement demands to know why soldiers must be bought."
 NIH_wd_ar_companies:0 "Rifle Companies for the Districts"
 NIH_wd_ar_companies_desc:0 "One answer spreads the army thin and visible: a rifle company in every district, from District A to the northern outlier, living among the people it would defend. The outer islands feel protected for the first time. The battalions lose their cohesion, and no commander can gather more than a few companies in one place quickly."
 NIH_wd_ar_sailing:0 "A Reserve That Sails"
 NIH_wd_ar_sailing_desc:0 "The other answer keeps the battalions together on the main island and gives them the means to move: requisition rights on ferries, loading drills on every quay and a staff that plans each embarkation. The outer islands would wait days for help, yet when it came it would be a whole battalion. The plan depends on the merchant fleet being in port."
 NIH_wd_ar_lines:0 "Company Lines in District A"
 NIH_wd_ar_lines_desc:0 "Companies in the outer districts need barracks, a well, a radio hut and a road from the landing to the lines. The army engineers begin in District A, on the far southwestern fringe, and spend two seasons away from the main island. The barracks become the largest buildings on the shore and their canteen becomes the busiest shop."
 NIH_wd_ar_embark:0 "Embarkation Drill on the Quays"
 NIH_wd_ar_embark_desc:0 "Twice a year a battalion is called out at night, marched to the capital quays and loaded onto requisitioned ferries before dawn. The first drill takes eleven hours and loses a field kitchen in the harbour. By the fourth the battalion is aboard in under five, and the ferry operators have learned to keep one hull ready."
 NIH_wd_ar_depots:0 "Stock the Garrison Depots"
 NIH_wd_ar_depots_desc:0 "The country's research priority is physical sustainment: keeping trucks running, rifles replaced and service affordable. The army turns that priority into depots stocked for ninety days in each garrison town, with spares for the trucks, the trains and the radios. Stock that sits too long rots in the humidity, so every depot rotates it on a strict calendar."
 NIH_wd_ar_engineers:0 "Engineers for the Wet Season"
 NIH_wd_ar_engineers_desc:0 "Every wet season washes out bridges, buries roads and floods the garrison towns, and the army is the only body with the trucks and the discipline to clear them. An engineer company with bridging kit and earthmovers turns that habit into a duty. The battalions resent losing their best mechanics to a unit that mostly digs."
 NIH_wd_st_bulletin:0 "Translate the Asteroid Bulletin"
 NIH_wd_st_bulletin_desc:0 "Astronomers announce that the asteroid Ulysses will pass close to the Earth, with a real chance of striking it. The news reaches Nihon as foreign wire copy that few officials can judge. A small bureau in the capital translates, checks and publishes every bulletin, so that rumours in the plant towns meet facts before they turn into panic."
 NIH_wd_st_observatory:0 "An Observatory on the Capital Mountain"
 NIH_wd_st_observatory_desc:0 "The Capital District rises to a single mountain province above its hills, the highest ground in the country. A modest observatory on the summit will never find an asteroid first, but it lets island astronomers confirm foreign reports and train students of their own. The summit road is steep, and the instruments are expensive and imported."
 NIH_wd_st_tide_gauges:0 "Tide Gauges on Every Coast"
 NIH_wd_st_tide_gauges_desc:0 "If a fragment ever falls into the ocean, the danger to an island country comes as a wave, not a crater. Tide gauges in every district harbour, wired to the capital, can show a sudden rise long before it reaches the next coast. The gauges themselves are cheap. Keeping their lines working through every wet season is not."
 NIH_wd_st_impact_word:0 "Word That Ulysses Will Strike"
 NIH_wd_st_impact_word_desc:0 "Two years after the first warning, the FCU tells the world that the asteroid will hit and that it means to counter the strike. No government can yet say where the pieces will land. Nihon must now get ready for a danger that may never touch its coasts, paying for shelters and stores out of a budget already stretched by ferries and roads."
 NIH_wd_st_impact_word_tt_1:0 "Opens the two shelter plans; only one can be taken."
 NIH_wd_st_hill_shelters:0 "Shelters Under the Capital Hills"
 NIH_wd_st_hill_shelters_desc:0 "One plan digs into the hills behind the capital: deep shelters for a large share of the main island's people, with stores, water and generators for weeks. It protects the most people for each unit of money spent. It also asks the outer districts to trust that a ferry will arrive in time to bring them to shelter."
 NIH_wd_st_dispersal:0 "Stores on Every Island"
 NIH_wd_st_dispersal_desc:0 "The other plan accepts that nobody knows where fragments will fall and spreads the risk instead: grain, fuel, medicine and water stored in every district, with a small shelter in every town. No single strike could destroy the national reserve. Each district shelter is shallower and weaker, and the stores must be guarded in eight places instead of one."
 NIH_wd_st_galleries:0 "Tunnels Between the Shelter Halls"
 NIH_wd_st_galleries_desc:0 "The capital shelters were dug as separate halls, and engineers now link them with galleries so that people, water and power can move between them if one entrance collapses. The work runs through the hills for two years. It turns the shelters into a small underground town that the ministries quietly plan to use for themselves."
 NIH_wd_st_store_ships:0 "Store Ships at Anchor"
 NIH_wd_st_store_ships_desc:0 "Old merchant hulls from the register are stripped, stocked with grain and water and anchored in the sheltered bays of the outer districts. A ship can move away from a threatened coast, or toward a stricken one, faster than any warehouse. Their owners are paid a retainer for hulls that will never carry another cargo."
 NIH_wd_st_roche:0 "Watch Through the Roche Night"
 NIH_wd_st_roche_desc:0 "Ulysses passes through the Roche limit and begins to break apart. Every shelter, store ship and tide gauge in Nihon is manned through the night while radio stations relay foreign reports hour by hour. Whatever the sky brings to other countries, the island government is judged tonight by whether its people knew where to go."
 NIH_wd_st_board:0 "A Standing Emergency Board"
 NIH_wd_st_board_desc:0 "The asteroid years leave behind an organisation nobody wants to dismantle: wardens, radio nets, shelter plans and stores in every district. A standing emergency board takes them over under one statute, with a budget for storms, floods and fires as well as the sky. Its first real test will be the next wet season."
 NIH_wd_fw_belkan:0 "Word of War in Belka"
 NIH_wd_fw_belkan_desc:0 "The Belkan War breaks out on the far side of the ocean, and the first effect in Nihon is a letter from every foreign underwriter raising premiums on hulls bound anywhere near the north. No Nihonian interest is at stake in the fighting. Yet the island economy lives on freight, fuel and insurance, and all three move with the war."
 NIH_wd_fw_clean_cargo:0 "No Cargo for the Belligerents"
 NIH_wd_fw_clean_cargo_desc:0 "One posture forbids any Nihonian hull to carry cargo for an army at war, on pain of losing its registration. It costs the fleet the best-paying charters of the decade. It also earns the island flag a reputation that insurers, ports and neutral governments will remember long after this war has ended."
 NIH_wd_fw_any_buyer:0 "Charters for Any Paying Buyer"
 NIH_wd_fw_any_buyer_desc:0 "The other posture lets owners charter their hulls to whoever pays, provided the voyage avoids declared war zones, and taxes the profit. Money pours into the shipping houses and the capital yards. Every cargo that later turns out to have served a belligerent becomes an argument at home and a mark against the island flag abroad."
 NIH_wd_fw_belka_won:0 "Trading with a Victorious Belka"
 NIH_wd_fw_belka_won_desc:0 "If the war ends with Belka victorious, the northern ports answer to a government that won its war, and the island shipowners must decide whether to trade with it at all. The ministry negotiates commercial terms for ordinary cargo only, with no endorsement of the outcome. Critics at home say that any terms at all are terms with a conqueror."
 NIH_wd_fw_belka_lost:0 "The War Clause Is Struck"
 NIH_wd_fw_belka_lost_desc:0 "If the war ends with Belka defeated and a treaty signed, the underwriters strike the war clause from northern policies and premiums drift back toward normal. The hull mutual passes the saving to its members at once. Owners who chartered to belligerents find that some ports now ask awkward questions about their earlier voyages."
 NIH_wd_fw_skully:0 "Gunfire off Southern Usea"
 NIH_wd_fw_skully_desc:0 "Rebel forces hold a base in the Skully Islands of southern Usea until FCU forces and Unified Command eliminate it at the end of the year. The fighting is far from Nihon, but the lanes to the Usean coast pass through waters where armed rebels operated. The shore watch begins plotting every hull on those lanes, whatever its flag."
 NIH_wd_fw_coup:0 "Coup Season in the Usean Ports"
 NIH_wd_fw_coup_desc:0 "A coup breaks out across Usea, and rebel forces are defeated by Unified Command. For a few weeks nobody knows which Usean ports are open, which governments will honour their debts and which crews will be detained. Island hulls caught in Usean harbours wait for orders, and their families queue at the capital shipping offices for news."
 NIH_wd_fw_evacuees:0 "Berths for Usean Families"
 NIH_wd_fw_evacuees_desc:0 "The clean-cargo rule makes Nihonian hulls welcome where others are searched, and families leaving the troubled Usean ports ask them for passage. The government offers berths on scheduled sailings at cost and a reception hall on the capital quay. The numbers are small and the gratitude is large, while the movement complains about foreigners on public ships."
 NIH_wd_fw_coup_rates:0 "Charter Rates in the Coup Season"
 NIH_wd_fw_coup_rates_desc:0 "Owners who chartered freely during the Belkan years now carry anything the disrupted Usean ports will pay for, at rates that rise every week the coup season lasts. The tax on charter profits funds the capital yards for a year. The Maritime Service warns that some of these hulls are sailing into harbours where nobody knows who is in charge."
 NIH_wd_fw_railgun:0 "A Railgun Battery in San Salvacion"
 NIH_wd_fw_railgun_desc:0 "The FCU completes Stonehenge, a battery of enormous railguns in a desert region of neutral San Salvacion. Nihon's air staff studies every published figure on its range and rate of fire. A weapon that can reach the sky over a whole region is a new fact of life for any country that depends on aircraft and open lanes."
 NIH_wd_cw_crisis:0 "The San Salvacion Crisis"
 NIH_wd_cw_crisis_desc:0 "By the summer of 2003 the Usean powers are quarrelling over Stonehenge, the railgun complex in neutral San Salvacion, and the lanes to the Usean coast fill with rumours. Whether the quarrel becomes a war will be decided in Usea, not in Nihon. The island government opens a crisis desk to follow it and to settle what its fleet will do either way."
 NIH_wd_cw_war:0 "Erusea Takes the Railguns"
 NIH_wd_cw_war_desc:0 "Erusea invades San Salvacion, seizes Stonehenge and turns its railguns on the sky as anti-air batteries. The Usean war the crisis desk feared has begun. Insurers cancel Usean cover overnight, fuel prices jump and the shore watch counts how many island hulls are in Usean waters. Every shipowner in the capital wants to know what the government will allow."
 NIH_wd_cw_averted:0 "A Usean Crisis Without War"
 NIH_wd_cw_averted_desc:0 "If the Usean crisis ends without war, the crisis desk closes and the lanes reopen on ordinary terms. Insurers cut their premiums, fuel prices ease and the shipping houses resume their regular Usean calls. The government must explain why it spent money preparing for a war that never came, and whether it would do the same again."
 NIH_wd_cw_g_radar:0 "Air Watch over District G"
 NIH_wd_cw_g_radar_desc:0 "District G lies closer to the Sotoan coast than any other Nihonian district, beside the busiest lanes of the eastern sea. A radar station on its plains watches the air and the shipping alike and warns the main island of anything approaching from that side. It changes no claim, but it does tell everyone across the strait that the district is watched."
 NIH_wd_cw_neutral:0 "Neutral Lanes Around Usea"
 NIH_wd_cw_neutral_desc:0 "One course keeps every Nihonian hull out of the war: no cargo for either side, routes published in advance and lights burning at night so that every patrol can identify the island flag. It gives up the war's richest charters. It also lets island ships keep sailing where others are sunk or seized."
 NIH_wd_cw_fuel:0 "Fuel for the Allied Ports"
 NIH_wd_cw_fuel_desc:0 "The other course sells refined fuel and charters tankers to the ports supplying the forces arrayed against Erusea, under commercial contracts that commit no Nihonian forces and change no alliance. The refinery and the tanker owners have their best years since the Belkan War. Erusean patrols may treat every tanker under the island flag as a target."
 NIH_wd_cw_relief:0 "Relief Voyages Under the Island Flag"
 NIH_wd_cw_relief_desc:0 "Neutral lanes make relief possible. Island hulls carry food, medicine and water to Usean ports cut off by the fighting, under international supervision and with their manifests published. Every voyage is dangerous and is reported in every Nihonian newspaper. The sailings win the country goodwill at little cost, though the crews know how exposed a lit hull is."
 NIH_wd_cw_north_point:0 "Tankers on the North Point Run"
 NIH_wd_cw_north_point_desc:0 "With the allied headquarters established at North Point, the fuel contracts concentrate on one long run to its harbours. Island tankers sail in groups with lights out and radios silent for days. Each voyage pays like three ordinary ones, each loss is mourned in the capital, and the plant towns argue about whose sons crew the tankers."
 NIH_wd_cw_isaf_won:0 "Usean Ports Reopen"
 NIH_wd_cw_isaf_won_desc:0 "If the war ends with the Erusean surrender, the Usean ports reopen for rebuilding and need every hull, crane and tanker they can charter. Nihonian shipowners bid for coastal and fuel contracts in the damaged harbours. Buyers remember who carried relief and who carried fuel, and the earlier choice of the island government decides who is welcome first."
 NIH_wd_cw_erusea_won:0 "Terms with the Erusean Victors"
 NIH_wd_cw_erusea_won_desc:0 "If the war ends with Erusea prevailing, every island cargo bound for Usea must pass through ports governed by the victors. The ministry negotiates tariffs and berthing rights for ordinary trade without recognising what Erusea seized. It keeps the hulls moving, and every faction at home says the price was far too high."
 NIH_wd_cw_accounts:0 "Every District Writes It Down"
 NIH_wd_cw_accounts_desc:0 "Fourteen years after the programme began, every district commissioner, board and service chief sends the capital a written account of what changed on their island and what did not. The ministries bind the accounts into one volume and debate it for a session. The volume settles nothing by itself, but every camp will quote it for years to come."
 NIH_wd_cw_accounts_tt_1:0 "Closes the 1991 to 2005 programme; later eras are not yet written."
 ac_wd_nih_tree:0 "Nihon: National Programme"
