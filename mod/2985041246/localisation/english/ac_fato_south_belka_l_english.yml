 ac_fsb_sbk_maintenance_account:0 "An Account for Maintenance"
 ac_fsb_sbk_maintenance_account_desc:0 "A repair completed once still needs parts later. Reserve a small standing maintenance account, stated separately from the cost of a particular hearing. The commitment supports current service and remains removable through the public procedure."
 SBK_fsb_maintenance_account:0 "An Account for Maintenance"
 SBK_fsb_maintenance_account_desc:0 "Unlock a standing maintenance policy with a real annual fiscal commitment when enabled.\n\nCost: 20 political power, 2 institutional capacity, and the public programme fee where enabled. Standing full-mode annual commitment: nominal GDP / 2000, recorded exactly when the standing account is reconciled. Remove it through the campaign review. Legacy and disabled modes retain the political/physical burden without a new cash commitment."
