 ac_camp.92.t:0 "The favors that became a record"
 ac_camp.92.desc:0 "The handler's final account used the word preserved. He had considered several alternatives and rejected them because each implied a completeness the surviving network could not honestly claim.\n\nIts strategic access had survived the decisive investigations. The foreign governments had not obtained the corroboration that could have stopped it, and the domestic witnesses had not supplied an independent trail in time. This alternate outcome left the network with leverage and with people who now expected that leverage to be used on their behalf.\n\nAn official asked whether the result could be described publicly. The handler looked at the list of contacts. Most of them had been promised that their individual contribution was a limited favor. A public account of the combined work would reveal how many separate assurances had depended on nobody seeing the whole.\n\nThe official accepted the refusal and asked a smaller question. Which office should receive the next request? The handler gave him a name. He would have to remember that he had given it, because successful secrecy created obligations more efficiently than it created trust.\n\nOutside, the country continued its ordinary business under a government that had not declared a new conventional war. The people going home had no reason to distinguish the public authority above the office door from the private authority that had been exercised inside it.\n\nThe handler sealed the account. The network had reached an ending it could exploit. It had not reached an ending that would release it from the people whose lives it had used to get there."
 ac_camp.92.a:0 "Keep this account."
 ac_camp.92.z:0 "Close this old message."
