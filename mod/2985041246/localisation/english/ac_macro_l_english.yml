 ac_economy_full_desc:0 "Default for new campaigns. Model real output, inflation, category budgets, public debt and sustained military costs. National accounts and prices are fictional calibration. Saved legacy campaigns retain their original mode."
 ac_macro.1.a:0 "Review the accounts."
 ac_macro.1.d:0 "The monthly accounts show that not all approved obligations were funded. Departments are carrying unpaid bills. The government still has time to reprioritize the budget, improve revenue or arrange financing."
 ac_macro.1.t:0 "A shortfall in public accounts"
 ac_macro.2.a:0 "Prepare a recovery budget."
 ac_macro.2.d:0 "Two failed settlements were followed by three correction months, but a material funding gap remains. Readiness and civilian services are deteriorating. Sustainable funding and repayment of arrears can restore the accounts without imposing a government or territorial outcome."
 ac_macro.2.t:0 "The fiscal warning becomes a crisis"
 ac_macro.3.a:0 "Keep the recovery on course."
 ac_macro.3.d:0 "Three funded settlements with arrears declining or already cleared have ended the active fiscal crisis. Outstanding debt and unpaid obligations still have to be honored. Readiness and productive conditions will take time to recover."
 ac_macro.3.t:0 "Public accounts stabilize"
 ac_macro_economy_modifier:0 "Public accounts and force readiness"
 ac_macro_economy_modifier_desc:0 "Delivered public services and sustained operating funds affect the national economy and military readiness."
